name: CI

on:
  push:
    branches: [main]
  pull_request:

# Igrek sends nothing anywhere: OpenUI's install telemetry stays off (plan.md 16.2).
env:
  OPENUI_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Quality gate (plan.md 15): no dead code, no layer violations or import cycles.
      - run: bun run lint:dead
      - run: bun run lint:arch
      - run: bun run lint:db
      - run: bun run lint:quality
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # What the first screen downloads stays within its budget (plan.md 15.4).
      - run: bun run lint:bundle

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t igrek:ci .
      - name: Image size
        run: docker image inspect igrek:ci --format '{{.Size}}' | awk '{ printf "%.0f MB\n", $1/1024/1024 }'
      # The team hub, with the web member's page inside.
      - run: docker build -f docker/Dockerfile.hub -t igrek-hub:ci .
      - name: Hub image size
        run: docker image inspect igrek-hub:ci --format '{{.Size}}' | awk '{ printf "%.0f MB\n", $1/1024/1024 }'
