name: CI

on:
  push:
    branches: [main]
  pull_request:

# God Eye sends nothing anywhere: OpenUI's install telemetry stays off (plan.md 16.2).
env:
  OPENUI_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Quality gate (plan.md 15): no dead code, no layer violations or import cycles.
      - run: bun run lint:dead
      - run: bun run lint:arch
      - run: bun run lint:db
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t god-eye:ci .
      - name: Image size
        run: docker image inspect god-eye:ci --format '{{.Size}}' | awk '{ printf "%.0f MB\n", $1/1024/1024 }'
