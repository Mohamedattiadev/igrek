[package]
name = "igrek-desktop"
version = "0.1.0"
description = "Igrek in a window of its own"
license-file = "../../../LICENSE"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-updater = "=2.13.2"
serde_json = "=1.0.151"
# Checking and unpacking the server's runtime on the first start (runtime.rs); both already come
# with the updater, at these versions.
sha2 = "=0.10.9"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
# Smaller download; the app itself does little work, the server does.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
