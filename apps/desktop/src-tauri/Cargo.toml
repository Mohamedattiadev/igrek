[package]
name = "igrek-desktop"
version = "0.1.0"
description = "Igrek in a window of its own"
license-file = "../../../LICENSE"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-updater = "=2.13.2"
serde_json = "=1.0.151"

# The screen helper's picture through the desktop portal (Wayland asks the compositor, not X11).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[profile.release]
# Smaller download; the app itself does little work, the server does.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
