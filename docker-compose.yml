services:
  igrek:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # The GODEYE_* names are what .env files from before the rename to Igrek still set.
        INSTALL_CLAUDE: ${IGREK_INSTALL_CLAUDE:-${GODEYE_INSTALL_CLAUDE:-false}}
        INSTALL_CODEX: ${IGREK_INSTALL_CODEX:-${GODEYE_INSTALL_CODEX:-false}}
    image: igrek:local
    container_name: igrek
    restart: unless-stopped
    # Run as you, so files Igrek touches keep your ownership.
    user: "${IGREK_UID:-${GODEYE_UID:-1000}}:${IGREK_GID:-${GODEYE_GID:-1000}}"
    ports:
      # Only reachable from this computer, never from the network.
      - "127.0.0.1:${IGREK_PORT:-${GODEYE_PORT:-7777}}:7777"
    environment:
      HOME: ${HOME}
      IGREK_HOME: ${HOME}/.igrek
      IGREK_PUBLIC_PORT: ${IGREK_PORT:-${GODEYE_PORT:-7777}}
      # The browser talks to the published port, so accept that Host header.
      IGREK_ALLOWED_HOSTS: localhost:${IGREK_PORT:-${GODEYE_PORT:-7777}},127.0.0.1:${IGREK_PORT:-${GODEYE_PORT:-7777}}
    volumes:
      # Your Igrek data (database, settings). Coming from God Eye: see "Updating from God Eye" in the README.
      - ${HOME}/.igrek:${HOME}/.igrek
      # AI session history, read to track your work (Claude Code and Codex).
      - ${HOME}/.claude:${HOME}/.claude
      - ${HOME}/.codex:${HOME}/.codex
      # Your projects, mounted at the same path so session paths match.
      - ${IGREK_PROJECTS_DIR:-${GODEYE_PROJECTS_DIR:-${HOME}/projects}}:${IGREK_PROJECTS_DIR:-${GODEYE_PROJECTS_DIR:-${HOME}/projects}}
    mem_limit: 512m
