id: react-native
title: React Native
summary:
  en: "From a React web app to a real phone app. You build a habit tracker with Expo, run it on your phone, add screens, a local database, tests, an app icon, and learn how it reaches testers and the stores."
  tr: "React web uygulamasından gerçek bir telefon uygulamasına. Expo ile bir alışkanlık takip uygulaması yazarsın, telefonunda çalıştırırsın; ekranlar, yerel veritabanı, testler ve uygulama ikonu eklersin; uygulamanın test edenlere ve mağazalara nasıl ulaştığını öğrenirsin."
teacher: mobile
project:
  en: 'A habit tracker for your phone: add habits, tick them off each day, see your streak, keep everything in a local SQLite database, load a daily quote from a public API, store a token safely, with tests, an app icon, an installable Android build and a plan for updates and crash reports.'
  tr: 'Telefonun için bir alışkanlık takip uygulaması: alışkanlık ekleme, her gün işaretleme, seri (streak) görme, her şeyi yerel bir SQLite veritabanında tutma, herkese açık bir API''den günlük söz yükleme, bir token''ı güvenle saklama; testleri, uygulama ikonu, kurulabilir bir Android build''i ve güncelleme ile çökme raporu planı da var.'
detect:
  npm: [expo, react-native]
version: "58.0"
latest: npm:expo
checked: 2026-10
after: [react]
sheets: [javascript, typescript, react, git]
steps:
  - id: setup
    stage: setup
    title:
      en: "Get your computer, an Expo account and a phone ready"
      tr: "Bilgisayarını, bir Expo hesabını ve bir telefonu hazırlama"
    minutes: 40
    why:
      en: "React Native is React that draws real phone screens instead of web pages. Expo is the toolkit around it: it starts your app, builds it in the cloud and lets you try it on a real phone without installing Android or iOS developer tools. You need three things first: Node.js, an editor, and a phone."
      tr: "React Native, web sayfası yerine gerçek telefon ekranları çizen React'tir. Expo da onun etrafındaki araç setidir: uygulamanı başlatır, bulutta build eder ve Android ya da iOS geliştirici araçlarını kurmadan gerçek telefonda denemeni sağlar. Önce üç şey lazım: Node.js, bir editör ve bir telefon."
    learn:
      en: |
        - What React Native and Expo are, and how they relate to the React you already know
        - What Expo Go is: a ready-made app that opens your project over the network
        - Which phones can use Expo Go for free, and which cannot
      tr: |
        - React Native ve Expo'nun ne olduğu, bildiğin React ile ilişkisi
        - Expo Go'nun ne olduğu: projeni ağ üzerinden açan hazır bir uygulama
        - Hangi telefonlarda Expo Go'nun ücretsiz kullanılabildiği, hangilerinde kullanılamadığı
    do:
      en: |
        1. Install **Node.js LTS** (nodejs.org), **Visual Studio Code** (code.visualstudio.com) and **Git** (git-scm.com). If you did the React roadmap, you already have them.
        2. Create a free Expo account at expo.dev/signup. You need it later for builds and updates, and Expo Go on an iPhone needs it too.
        3. Pick how you will see your app. **Android phone:** install **Expo Go** from the Google Play Store. This is the easiest free path. **iPhone:** the current Expo docs say Expo Go on a real iPhone needs an active Apple Developer Program membership (paid, see the stores step). Without it, use an Android phone or the web preview (`w` key later), or an iOS Simulator if you have a Mac with Xcode.
        4. Connect the phone and the computer to the **same Wi-Fi network**. Expo sends the app over that network.
        5. Open a terminal and check the tools. Each command should print a version.
      tr: |
        1. **Node.js LTS** (nodejs.org), **Visual Studio Code** (code.visualstudio.com) ve **Git**'i (git-scm.com) kur. React yol haritasını yaptıysan zaten kurulu.
        2. expo.dev/signup adresinden ücretsiz bir Expo hesabı aç. Build ve güncellemeler için sonra lazım olacak; iPhone'da Expo Go için de gerekiyor.
        3. Uygulamayı nerede göreceğini seç. **Android telefon:** Google Play Store'dan **Expo Go**'yu kur. En kolay ücretsiz yol bu. **iPhone:** güncel Expo dokümanına göre gerçek bir iPhone'da Expo Go için aktif bir Apple Developer Program üyeliği (ücretli, mağazalar adımına bak) gerekiyor. Üyeliğin yoksa Android telefon, web önizlemesi (sonra `w` tuşu) ya da Xcode'lu bir Mac'in varsa iOS Simulator kullan.
        4. Telefonu ve bilgisayarı **aynı Wi-Fi ağına** bağla. Expo uygulamayı bu ağ üzerinden gönderir.
        5. Bir terminal aç ve araçları kontrol et. Her komut bir sürüm yazmalı.
    code:
      - file: terminal
        lang: sh
        text: |
          node --version
          npm --version
          git --version
    mistakes:
      - problem:
          en: "Installing Android Studio or Xcode first because a tutorial said so."
          tr: "Bir eğitim öyle dedi diye önce Android Studio ya da Xcode kurmak."
        fix:
          en: "You do not need them to start. Expo Go on a phone is enough for the first steps. You only need the full Android or iOS tools if you want an emulator or a local native build."
          tr: "Başlamak için gerekmezler. İlk adımlar için telefonda Expo Go yeter. Emülatör ya da yerel native build istersen tam Android ya da iOS araçlarına ihtiyacın olur."
      - problem:
          en: "Phone and computer are on different networks (guest Wi-Fi, mobile data, VPN)."
          tr: "Telefon ve bilgisayar farklı ağlarda (misafir Wi-Fi, mobil veri, VPN)."
        fix:
          en: "Put both on the same normal Wi-Fi and turn the VPN off. If the network blocks device-to-device traffic, `npx expo start --tunnel` works around it."
          tr: "İkisini de aynı normal Wi-Fi'a bağla ve VPN'i kapat. Ağ cihazlar arası trafiği engelliyorsa `npx expo start --tunnel` bunu aşar."
    quiz:
      - q:
          en: "What is Expo Go?"
          tr: "Expo Go nedir?"
        options:
          en: ["A cloud service that sells phones", "A ready-made app that opens your project while you develop", "The store where you publish apps"]
          tr: ["Telefon satan bir bulut servisi", "Geliştirirken projeni açan hazır bir uygulama", "Uygulama yayınladığın mağaza"]
        answer: 1
        why:
          en: "Expo Go is a playground app. It loads your JavaScript from your computer, so you see changes without building a native app."
          tr: "Expo Go bir deneme uygulamasıdır. JavaScript kodunu bilgisayarından yükler; böylece native uygulama build etmeden değişiklikleri görürsün."
    sources:
      - title: Expo, set up your environment
        url: https://docs.expo.dev/get-started/set-up-your-environment/
      - title: Expo, introduction
        url: https://docs.expo.dev/get-started/introduction/

  - id: first-app
    stage: first-code
    title:
      en: "Create your first app and open it on your phone"
      tr: "İlk uygulamanı oluşturma ve telefonunda açma"
    minutes: 35
    needs: [setup]
    why:
      en: "One command creates a working project with everything wired: TypeScript, file-based navigation and a development server. Seeing your own text on a real phone in a few minutes is what makes the rest of the roadmap feel real."
      tr: "Tek bir komut, her şeyi bağlı çalışan bir proje oluşturur: TypeScript, dosya tabanlı navigasyon ve bir geliştirme sunucusu. Kendi yazını birkaç dakika içinde gerçek bir telefonda görmek, yol haritasının geri kalanını gerçek yapar."
    learn:
      en: |
        - What `create-expo-app` makes: `app.json`, `package.json`, `src/app` and `assets`
        - How `npx expo start` serves your app and how Fast Refresh updates the phone when you save
        - Why the project uses TypeScript, and how to type check it with `npx tsc --noEmit`
      tr: |
        - `create-expo-app`'in ne ürettiği: `app.json`, `package.json`, `src/app` ve `assets`
        - `npx expo start`'ın uygulamayı nasıl sunduğu ve kaydedince Fast Refresh'in telefonu nasıl güncellediği
        - Projenin neden TypeScript kullandığı ve `npx tsc --noEmit` ile nasıl tip kontrolü yapılacağı
    do:
      en: |
        1. In the terminal, go to the folder where you keep projects and run the first command below. It creates a folder `habits` with the default template.
        2. Go into the folder. The template has demo screens. Run `npm run reset-project` and answer `n` when it asks whether to keep the old files in an example folder. This leaves a tiny empty app: `src/app/_layout.tsx` and `src/app/index.tsx`.
        3. Start the development server with `npx expo start`. A QR code appears in the terminal.
        4. On Android, open **Expo Go** and tap **Scan QR code**. (On iPhone you need the paid setup from the previous step; otherwise press `w` in the terminal to see the app in a browser.) The first load takes a little while.
        5. Open `src/app/index.tsx`, change the text to the code below and save. The phone updates by itself. This is Fast Refresh.
        6. Open `app.json` and change `"userInterfaceStyle": "automatic"` to `"light"`. We design only a light theme in this roadmap, to keep the code short. Stop the server with Ctrl+C and start it again.
        7. Save a first version with Git. If `git status` says it is not a repository, run `git init` first.
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git ve aşağıdaki ilk komutu çalıştır. Varsayılan şablonla `habits` adında bir klasör oluşturur.
        2. Klasöre gir. Şablonda demo ekranlar var. `npm run reset-project` çalıştır ve eski dosyaları bir örnek klasöründe tutup tutmayacağını sorunca `n` yaz. Geriye çok küçük, boş bir uygulama kalır: `src/app/_layout.tsx` ve `src/app/index.tsx`.
        3. Geliştirme sunucusunu `npx expo start` ile başlat. Terminalde bir QR kod çıkar.
        4. Android'de **Expo Go**'yu aç ve **Scan QR code**'a dokun. (iPhone'da önceki adımdaki ücretli kurulum gerekir; yoksa terminalde `w`'ya basıp uygulamayı tarayıcıda gör.) İlk yükleme biraz sürer.
        5. `src/app/index.tsx` dosyasını aç, yazıyı aşağıdaki kodla değiştir ve kaydet. Telefon kendiliğinden güncellenir. Buna Fast Refresh denir.
        6. `app.json` dosyasını aç ve `"userInterfaceStyle": "automatic"` değerini `"light"` yap. Kodu kısa tutmak için bu yol haritasında sadece açık tema tasarlıyoruz. Sunucuyu Ctrl+C ile durdurup yeniden başlat.
        7. İlk sürümü Git ile kaydet. `git status` bir repo olmadığını söylüyorsa önce `git init` çalıştır.
    code:
      - file: terminal
        lang: sh
        text: |
          npx create-expo-app@latest habits
          cd habits
          npm run reset-project
          npx expo start
      - file: src/app/index.tsx
        lang: tsx
        text: |
          import { StyleSheet, Text, View } from 'react-native';

          export default function HomeScreen() {
            return (
              <View style={styles.screen}>
                <Text style={styles.title}>Hello, habits</Text>
              </View>
            );
          }

          const styles = StyleSheet.create({
            screen: { flex: 1, alignItems: 'center', justifyContent: 'center' },
            title: { fontSize: 24, fontWeight: '600' },
          });
      - file: terminal
        lang: sh
        text: |
          npx tsc --noEmit
          git add .
          git commit -m "Start the habits app"
    mistakes:
      - problem:
          en: "The QR code opens, but Expo Go shows a network error or loads forever."
          tr: "QR kod açılıyor ama Expo Go ağ hatası gösteriyor ya da sonsuza kadar yüklüyor."
        fix:
          en: "Check that both devices share the same Wi-Fi, turn off VPNs, allow Node.js through the computer firewall, or restart with `npx expo start --tunnel`."
          tr: "İki cihazın aynı Wi-Fi'da olduğunu kontrol et, VPN'leri kapat, Node.js'e bilgisayarın güvenlik duvarından izin ver ya da `npx expo start --tunnel` ile yeniden başlat."
      - problem:
          en: "Writing a bare string inside a View, like <View>Hello</View>, crashes the app."
          tr: "View içine çıplak bir yazı koymak, örneğin <View>Merhaba</View>, uygulamayı çökertir."
        fix:
          en: "On a phone all text must be inside a <Text> component. Wrap it: <View><Text>Hello</Text></View>."
          tr: "Telefonda bütün yazılar bir <Text> bileşeninin içinde olmalı. Sar: <View><Text>Merhaba</Text></View>."
    quiz:
      - q:
          en: "What does Fast Refresh do?"
          tr: "Fast Refresh ne yapar?"
        options:
          en: ["Makes the phone charge faster", "Updates the running app when you save a file, without a new install", "Deletes the cache of your project"]
          tr: ["Telefonu daha hızlı şarj eder", "Bir dosyayı kaydedince çalışan uygulamayı yeniden kurmadan günceller", "Projenin önbelleğini siler"]
        answer: 1
        why:
          en: "The development server sends the changed code to the running app, so you see edits in a second or two."
          tr: "Geliştirme sunucusu değişen kodu çalışan uygulamaya gönderir; düzenlemeleri bir iki saniyede görürsün."
    sources:
      - title: Expo, create a project
        url: https://docs.expo.dev/get-started/create-a-project/
      - title: Expo, start developing
        url: https://docs.expo.dev/get-started/start-developing/

  - id: components
    stage: basics
    title:
      en: "Core components and styling"
      tr: "Temel bileşenler ve stil verme"
    minutes: 45
    needs: [first-app]
    why:
      en: "A phone app is built from a small set of ready-made pieces: View, Text, Pressable, TextInput. There is no HTML and no CSS file. If you know React and flexbox you already know most of it, but the rules are a little different, and learning them now saves many surprises."
      tr: "Bir telefon uygulaması, küçük bir hazır parça kümesinden kurulur: View, Text, Pressable, TextInput. HTML yok, CSS dosyası yok. React ve flexbox biliyorsan çoğunu zaten biliyorsun ama kurallar biraz farklı; bunları şimdi öğrenmek sonradan çok sürprizi önler."
    learn:
      en: |
        - `View` is like a `div`, `Text` is the only place text can live, `Pressable` is any tappable thing
        - Styles are JavaScript objects made with `StyleSheet.create`, with camelCase names like `backgroundColor`
        - Layout is flexbox, and `flexDirection` is `column` by default (the opposite of the web)
        - Sizes are plain numbers in density-independent units, not pixels or `rem`
        - Accessibility props: `accessibilityRole` and `accessibilityLabel`
      tr: |
        - `View` bir `div` gibidir, yazı sadece `Text` içinde durabilir, `Pressable` dokunulabilen her şeydir
        - Stiller `StyleSheet.create` ile yapılan JavaScript nesneleridir ve `backgroundColor` gibi camelCase isimler kullanır
        - Yerleşim flexbox'tır ve `flexDirection` varsayılan olarak `column`'dur (web'in tersi)
        - Boyutlar düz sayılardır, yoğunluktan bağımsız birimlerdedir; piksel ya da `rem` değil
        - Erişilebilirlik özellikleri: `accessibilityRole` ve `accessibilityLabel`
    do:
      en: |
        1. Create `src/theme.ts` with the colors below. One place for colors means one place to change them.
        2. Create `src/components/habit-row.tsx`. A row shows a habit name, its streak and a button to mark it done. It receives everything through props, like any React component. The `@/` in imports means the `src` folder; the template already configures it in `tsconfig.json`.
        3. Replace `src/app/index.tsx` with the screen below. For now the habits are a fixed list and the buttons only write to the log.
        4. Save and look at your phone. Tap a button and watch the terminal: `console.log` output from the phone shows up there.
        5. Play: change `padding`, `borderRadius` and `flexDirection` and see what moves.
      tr: |
        1. Aşağıdaki renklerle `src/theme.ts` oluştur. Renkler tek yerde olursa değiştirmek de tek yerde olur.
        2. `src/components/habit-row.tsx` oluştur. Bir satır, alışkanlık adını, serisini ve tamamlandı işaretleme düğmesini gösterir. Her şeyi, her React bileşeni gibi, props ile alır. Import'taki `@/` `src` klasörü demek; şablon bunu `tsconfig.json`'da zaten ayarlıyor.
        3. `src/app/index.tsx` dosyasını aşağıdaki ekranla değiştir. Şimdilik alışkanlıklar sabit bir liste ve düğmeler sadece log yazıyor.
        4. Kaydet ve telefonuna bak. Bir düğmeye dokun ve terminale bak: telefondaki `console.log` çıktısı orada görünür.
        5. Oyna: `padding`, `borderRadius` ve `flexDirection` değerlerini değiştir ve neyin oynadığına bak.
    code:
      - file: src/theme.ts
        lang: ts
        text: |
          export const colors = {
            background: '#f3f4f6',
            card: '#ffffff',
            border: '#e5e7eb',
            text: '#111827',
            muted: '#4b5563',
            accent: '#2563eb',
            onAccent: '#ffffff',
            done: '#15803d',
            danger: '#b91c1c',
          };
      - file: src/components/habit-row.tsx
        lang: tsx
        text: |
          import { Pressable, StyleSheet, Text, View } from 'react-native';

          import { colors } from '@/theme';

          export type HabitRowProps = {
            id: number;
            name: string;
            streak: number;
            done: boolean;
            onToggle: (id: number) => void;
            onOpen: (id: number) => void;
          };

          export function HabitRow({ id, name, streak, done, onToggle, onOpen }: HabitRowProps) {
            return (
              <View style={styles.row}>
                <Pressable
                  style={styles.texts}
                  onPress={() => onOpen(id)}
                  accessibilityRole="button"
                  accessibilityLabel={`Open ${name}`}>
                  <Text style={styles.name}>{name}</Text>
                  <Text style={styles.streak}>
                    {streak} {streak === 1 ? 'day' : 'days'} streak
                  </Text>
                </Pressable>
                <Pressable
                  style={[styles.button, done && styles.buttonDone]}
                  onPress={() => onToggle(id)}
                  accessibilityRole="button"
                  accessibilityLabel={done ? `Undo ${name}` : `Mark ${name} as done`}>
                  <Text style={[styles.buttonText, done && styles.buttonTextDone]}>
                    {done ? 'Done' : 'Mark done'}
                  </Text>
                </Pressable>
              </View>
            );
          }

          const styles = StyleSheet.create({
            row: {
              flexDirection: 'row',
              alignItems: 'center',
              backgroundColor: colors.card,
              borderColor: colors.border,
              borderWidth: 1,
              borderRadius: 12,
              padding: 16,
              marginBottom: 12,
            },
            texts: { flex: 1 },
            name: { fontSize: 18, fontWeight: '600', color: colors.text },
            streak: { marginTop: 4, color: colors.muted },
            button: {
              backgroundColor: colors.accent,
              paddingVertical: 10,
              paddingHorizontal: 14,
              borderRadius: 8,
            },
            buttonDone: { backgroundColor: colors.card, borderWidth: 1, borderColor: colors.done },
            buttonText: { color: colors.onAccent, fontWeight: '600' },
            buttonTextDone: { color: colors.done },
          });
      - file: src/app/index.tsx
        lang: tsx
        text: |
          import { StyleSheet, View } from 'react-native';

          import { HabitRow } from '@/components/habit-row';
          import { colors } from '@/theme';

          const HABITS = [
            { id: 1, name: 'Drink water', streak: 3, done: true },
            { id: 2, name: 'Read 10 pages', streak: 0, done: false },
            { id: 3, name: 'Walk 20 minutes', streak: 5, done: false },
          ];

          export default function HomeScreen() {
            return (
              <View style={styles.screen}>
                {HABITS.map((habit) => (
                  <HabitRow
                    key={habit.id}
                    {...habit}
                    onToggle={(id) => console.log('toggle', id)}
                    onOpen={(id) => console.log('open', id)}
                  />
                ))}
              </View>
            );
          }

          const styles = StyleSheet.create({
            screen: { flex: 1, backgroundColor: colors.background, padding: 16 },
          });
    mistakes:
      - problem:
          en: "Using web habits: <div>, <p>, className, or a CSS file."
          tr: "Web alışkanlıklarını kullanmak: <div>, <p>, className ya da CSS dosyası."
        fix:
          en: "Use View and Text, and style with the style prop. Browser tags do not exist on a phone."
          tr: "View ve Text kullan, stili style prop'uyla ver. Tarayıcı etiketleri telefonda yoktur."
      - problem:
          en: "Text does not inherit styles like on the web; a color set on a View does nothing for the text inside."
          tr: "Yazı, web'deki gibi stil devralmaz; View'a verilen renk içindeki yazıya geçmez."
        fix:
          en: "Style the Text component itself. Only a Text inside another Text inherits from it."
          tr: "Stili Text bileşeninin kendisine ver. Sadece başka bir Text'in içindeki Text ondan devralır."
    quiz:
      - q:
          en: "Which direction do children of a View go by default?"
          tr: "Bir View'in çocukları varsayılan olarak hangi yöne dizilir?"
        options:
          en: ["In a row (left to right)", "In a column (top to bottom)", "Stacked on top of each other"]
          tr: ["Satır halinde (soldan sağa)", "Sütun halinde (yukarıdan aşağıya)", "Üst üste biner"]
        answer: 1
        why:
          en: "React Native flexbox defaults to flexDirection column. On the web the default is row."
          tr: "React Native flexbox'ında varsayılan flexDirection column'dur. Web'de varsayılan row'dur."
    sources:
      - title: React Native, core components
        url: https://reactnative.dev/docs/intro-react-native-components
      - title: React Native, style
        url: https://reactnative.dev/docs/style
      - title: React Native, layout with flexbox
        url: https://reactnative.dev/docs/flexbox

  - id: navigation
    stage: basics
    title:
      en: "Screens and navigation with Expo Router"
      tr: "Expo Router ile ekranlar ve navigasyon"
    minutes: 40
    needs: [components]
    why:
      en: "A real app has more than one screen. Expo Router makes every file in `src/app` a screen, like routes in a web framework, and gives you the native back button, slide animations and modals for free."
      tr: "Gerçek bir uygulamada birden fazla ekran olur. Expo Router, `src/app` içindeki her dosyayı bir ekran yapar (web framework'lerindeki route'lar gibi) ve native geri düğmesini, kayma animasyonlarını ve modal'ları bedavaya getirir."
    learn:
      en: |
        - File-based routing: `index.tsx` is `/`, `new.tsx` is `/new`, `habit/[id].tsx` is `/habit/1`
        - `_layout.tsx` decides how screens are arranged; `Stack` pushes screens on top of each other
        - Moving around with `Link` and `useRouter`, and reading a route parameter with `useLocalSearchParams`
        - A screen shown as a `modal`
      tr: |
        - Dosya tabanlı routing: `index.tsx` `/`, `new.tsx` `/new`, `habit/[id].tsx` `/habit/1` olur
        - `_layout.tsx` ekranların nasıl düzenleneceğini belirler; `Stack` ekranları üst üste koyar
        - `Link` ve `useRouter` ile gezinme, `useLocalSearchParams` ile route parametresi okuma
        - `modal` olarak gösterilen bir ekran
    do:
      en: |
        1. Replace `src/app/_layout.tsx` with the code below. It declares three screens and their titles.
        2. Create `src/app/new.tsx`, a placeholder for the form we write later.
        3. Create the folder `src/app/habit` and the file `src/app/habit/[id].tsx` (the brackets are part of the name). `[id]` is a parameter: `/habit/1` and `/habit/7` use the same file.
        4. Replace `src/app/index.tsx`. Tapping a habit name now opens its screen, and the button at the bottom opens the modal.
        5. Test it on the phone: open a habit, go back with the system back gesture or button, open the modal and close it by swiping down (or with the back button on Android).
        6. Run `npx tsc --noEmit`. The first `npx expo start` also generates route types in `.expo/types`, so a wrong `href` is caught by TypeScript.
      tr: |
        1. `src/app/_layout.tsx` dosyasını aşağıdaki kodla değiştir. Üç ekranı ve başlıklarını tanımlar.
        2. `src/app/new.tsx` oluştur; sonra yazacağımız formun yer tutucusu.
        3. `src/app/habit` klasörünü ve `src/app/habit/[id].tsx` dosyasını oluştur (köşeli parantezler ismin parçası). `[id]` bir parametredir: `/habit/1` ve `/habit/7` aynı dosyayı kullanır.
        4. `src/app/index.tsx` dosyasını değiştir. Bir alışkanlığın adına dokununca ekranı açılır, alttaki düğme modal'ı açar.
        5. Telefonda dene: bir alışkanlığı aç, sistem geri hareketiyle ya da düğmesiyle geri dön, modal'ı aç ve aşağı kaydırarak (Android'de geri düğmesiyle) kapat.
        6. `npx tsc --noEmit` çalıştır. İlk `npx expo start` ayrıca `.expo/types` içinde route tipleri üretir; yanlış bir `href` TypeScript'te yakalanır.
