      - file: src/app/index.tsx
        lang: tsx
        text: |
          import { Link, useRouter } from 'expo-router';
          import { FlatList, Pressable, StyleSheet, Text, View } from 'react-native';

          import { HabitRow } from '@/components/habit-row';
          import { useHabits } from '@/habits-context';
          import { dayKey, streak } from '@/streak';
          import { colors } from '@/theme';

          export default function HomeScreen() {
            const router = useRouter();
            const { habits, toggle } = useHabits();
            const today = dayKey();

            return (
              <View style={styles.screen}>
                <FlatList
                  data={habits}
                  keyExtractor={(habit) => String(habit.id)}
                  renderItem={({ item }) => (
                    <HabitRow
                      id={item.id}
                      name={item.name}
                      streak={streak(item.doneDates, today)}
                      done={item.doneDates.includes(today)}
                      onToggle={toggle}
                      onOpen={(id) => router.push({ pathname: '/habit/[id]', params: { id: String(id) } })}
                    />
                  )}
                  ListEmptyComponent={<Text style={styles.empty}>No habits yet. Add your first one.</Text>}
                />
                <Link href="/new" asChild>
                  <Pressable style={styles.add} accessibilityRole="button">
                    <Text style={styles.addText}>New habit</Text>
                  </Pressable>
                </Link>
              </View>
            );
          }

          const styles = StyleSheet.create({
            screen: { flex: 1, backgroundColor: colors.background, padding: 16 },
            empty: { color: colors.muted, textAlign: 'center', marginTop: 32 },
            add: { alignItems: 'center', backgroundColor: colors.accent, padding: 14, borderRadius: 10 },
            addText: { color: colors.onAccent, fontWeight: '600', fontSize: 16 },
          });
    mistakes:
      - problem:
          en: "Changing state directly, like `habit.doneDates.push(day)`. The screen does not update."
          tr: "State'i doğrudan değiştirmek, örneğin `habit.doneDates.push(day)`. Ekran güncellenmez."
        fix:
          en: "Return a new array or object from the reducer (`[...old, new]`, `{ ...habit, doneDates }`). React only notices new values."
          tr: "Reducer'dan yeni bir dizi ya da nesne döndür (`[...eski, yeni]`, `{ ...habit, doneDates }`). React sadece yeni değerleri fark eder."
      - problem:
          en: "Using UTC dates (`toISOString`) as day keys. Late in the evening in some countries the habit counts for tomorrow."
          tr: "Gün anahtarı olarak UTC tarih (`toISOString`) kullanmak. Bazı ülkelerde akşam geç saatte alışkanlık yarına sayılır."
        fix:
          en: "Build the key from the local year, month and day, as `dayKey` does."
          tr: "Anahtarı `dayKey`'deki gibi yerel yıl, ay ve günden üret."
    quiz:
      - q:
          en: "Why is the streak calculation a separate plain function?"
          tr: "Seri hesabı neden ayrı, düz bir fonksiyon?"
        options:
          en: ["Screens are not allowed to calculate", "It can be reused and tested without a phone or a screen", "It runs faster in a separate file"]
          tr: ["Ekranların hesap yapması yasak", "Telefon ya da ekran olmadan tekrar kullanılabilir ve test edilebilir", "Ayrı dosyada daha hızlı çalışır"]
        answer: 1
        why:
          en: "A function that only takes values and returns a value is the easiest code to test. We do that in the testing step."
          tr: "Sadece değer alıp değer döndüren fonksiyon test etmesi en kolay koddur. Bunu test adımında yapacağız."
