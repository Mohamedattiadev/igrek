  - id: form
    stage: first-project
    title:
      en: "A form to add habits and a detail screen"
      tr: "Alışkanlık eklemek için form ve bir detay ekranı"
    minutes: 50
    needs: [state]
    why:
      en: "Now the app becomes useful. People type on a small screen with a keyboard that covers half of it, so a form must be short, say what is wrong, and close itself when done. The detail screen shows one habit and lets you delete it, after asking first."
      tr: "Şimdi uygulama işe yarar hale geliyor. İnsanlar yarısını klavyenin kapladığı küçük bir ekranda yazar; bu yüzden form kısa olmalı, neyin yanlış olduğunu söylemeli ve işi bitince kendi kapanmalı. Detay ekranı tek bir alışkanlığı gösterir ve silmeden önce sorar."
    learn:
      en: |
        - `TextInput` as a controlled input: `value` and `onChangeText`
        - Validation: trim the text, refuse an empty name, show the message next to the field
        - `returnKeyType`, `onSubmitEditing` and `maxLength` for a comfortable keyboard
        - `Alert.alert` to confirm a destructive action
      tr: |
        - Kontrollü input olarak `TextInput`: `value` ve `onChangeText`
        - Doğrulama: metni kırp, boş isme izin verme, mesajı alanın yanında göster
        - Rahat bir klavye için `returnKeyType`, `onSubmitEditing` ve `maxLength`
        - Silme gibi geri alınamaz bir işlemi onaylatmak için `Alert.alert`
    do:
      en: |
        1. Replace `src/app/new.tsx` with the real form below.
        2. Replace `src/app/habit/[id].tsx` with the detail screen. It finds the habit in the context, shows the streak and the total number of days, and has a Delete button that asks first.
        3. Add a habit on the phone. Try to save an empty name and read the message. Type a name and press the keyboard's done key: the modal closes and the habit is in the list.
        4. Open the habit, delete it and confirm. You return to the list.
        5. Run `npx tsc --noEmit` and commit.
      tr: |
        1. `src/app/new.tsx` dosyasını aşağıdaki gerçek formla değiştir.
        2. `src/app/habit/[id].tsx` dosyasını detay ekranıyla değiştir. Alışkanlığı context'te bulur, seriyi ve toplam gün sayısını gösterir, önce soran bir Delete düğmesi vardır.
        3. Telefonda bir alışkanlık ekle. Boş bir isimle kaydetmeyi dene ve mesajı oku. Bir isim yaz ve klavyenin bitti tuşuna bas: modal kapanır ve alışkanlık listede olur.
        4. Alışkanlığı aç, sil ve onayla. Listeye dönersin.
        5. `npx tsc --noEmit` çalıştır ve commit et.
    code:
