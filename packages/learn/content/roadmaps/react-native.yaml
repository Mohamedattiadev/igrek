  - id: state
    stage: basics
    title:
      en: "State: habits that change"
      tr: "State: değişen alışkanlıklar"
    minutes: 50
    needs: [navigation]
    why:
      en: "A fixed list cannot be ticked off. State is the data that changes while the app runs. Because three screens need the same habits, the state lives above the screens, in a context, and every screen reads it from there. The streak logic goes in a plain function, away from the screens, so it can be tested later."
      tr: "Sabit bir liste işaretlenemez. State, uygulama çalışırken değişen veridir. Üç ekranın da aynı alışkanlıklara ihtiyacı olduğu için state ekranların üstünde, bir context'te durur ve her ekran onu oradan okur. Seri mantığı, sonra test edilebilsin diye ekranlardan uzakta, düz bir fonksiyonda durur."
    learn:
      en: |
        - `useReducer` for state with several kinds of change: add, toggle, remove
        - React context to share state with every screen
        - A pure function (`streak`) that only takes values and returns a value
        - Why days are stored as `YYYY-MM-DD` text in the user's local time
      tr: |
        - Birkaç çeşit değişimi olan state için `useReducer`: ekle, işaretle, sil
        - State'i bütün ekranlarla paylaşmak için React context
        - Sadece değer alıp değer döndüren saf bir fonksiyon (`streak`)
        - Günlerin neden kullanıcının yerel saatinde `YYYY-MM-DD` metni olarak saklandığı
    do:
      en: |
        1. Create `src/streak.ts`. `dayKey` turns a date into text like `2026-10-18`. `streak` counts how many days in a row end today, or end yesterday (a streak is still alive until today is over).
        2. Create `src/habits-context.tsx` with the reducer, the provider and the `useHabits` hook.
        3. Wrap the `Stack` in `HabitsProvider` in `src/app/_layout.tsx`.
        4. Replace `src/app/index.tsx`. It now reads habits from `useHabits()` and shows them in a `FlatList`, the standard way to show a list of rows.
        5. Tap "Mark done" on the phone. The button changes and the streak goes to 1. Tap again to undo. The data resets when you restart the app; we fix that in the persistence step.
      tr: |
        1. `src/streak.ts` oluştur. `dayKey` bir tarihi `2026-10-18` gibi metne çevirir. `streak` bugün biten ya da dün biten kaç günlük bir zincir olduğunu sayar (seri, bugün bitene kadar hâlâ canlıdır).
        2. Reducer, provider ve `useHabits` hook'uyla `src/habits-context.tsx` oluştur.
        3. `src/app/_layout.tsx` içinde `Stack`'i `HabitsProvider` ile sar.
        4. `src/app/index.tsx` dosyasını değiştir. Artık alışkanlıkları `useHabits()`'ten okuyor ve satır listesi göstermenin standart yolu olan `FlatList` ile gösteriyor.
        5. Telefonda "Mark done"a dokun. Düğme değişir ve seri 1 olur. Geri almak için tekrar dokun. Uygulamayı yeniden başlatınca veri sıfırlanır; bunu kalıcılık adımında düzelteceğiz.
    code:
      - file: src/streak.ts
        lang: ts
        text: |
          /** A day as text in local time, for example "2026-10-18". */
          export function dayKey(date: Date = new Date()): string {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
          }

          function previousDay(key: string): string {
            const [year, month, day] = key.split('-').map(Number);
            return dayKey(new Date(year, month - 1, day - 1));
          }

          /** How many days in a row end today (or yesterday, if today is not done yet). */
          export function streak(days: string[], today: string = dayKey()): number {
            const done = new Set(days);
            let cursor = done.has(today) ? today : previousDay(today);
            let count = 0;
            while (done.has(cursor)) {
              count += 1;
              cursor = previousDay(cursor);
            }
            return count;
          }
      - file: src/habits-context.tsx
        lang: tsx
        text: |
          import { createContext, useContext, useMemo, useReducer, type ReactNode } from 'react';

          import { dayKey } from '@/streak';

          export type Habit = { id: number; name: string; doneDates: string[] };

          type Action =
            | { type: 'add'; name: string }
            | { type: 'toggle'; id: number; day: string }
            | { type: 'remove'; id: number };

          function reducer(state: Habit[], action: Action): Habit[] {
            switch (action.type) {
              case 'add': {
                const id = state.reduce((max, habit) => Math.max(max, habit.id), 0) + 1;
                return [...state, { id, name: action.name, doneDates: [] }];
              }
              case 'toggle':
                return state.map((habit) => {
                  if (habit.id !== action.id) return habit;
                  const has = habit.doneDates.includes(action.day);
                  return {
                    ...habit,
                    doneDates: has
                      ? habit.doneDates.filter((day) => day !== action.day)
                      : [...habit.doneDates, action.day],
                  };
                });
              case 'remove':
                return state.filter((habit) => habit.id !== action.id);
            }
          }

          type HabitsValue = {
            habits: Habit[];
            add: (name: string) => void;
            toggle: (id: number) => void;
            remove: (id: number) => void;
          };

          const HabitsContext = createContext<HabitsValue | null>(null);

          export function HabitsProvider({ children }: { children: ReactNode }) {
            const [habits, dispatch] = useReducer(reducer, [
              { id: 1, name: 'Drink water', doneDates: [] },
            ]);

            const value = useMemo<HabitsValue>(
              () => ({
                habits,
                add: (name) => dispatch({ type: 'add', name }),
                toggle: (id) => dispatch({ type: 'toggle', id, day: dayKey() }),
                remove: (id) => dispatch({ type: 'remove', id }),
              }),
              [habits],
            );

            return <HabitsContext.Provider value={value}>{children}</HabitsContext.Provider>;
          }

          export function useHabits(): HabitsValue {
            const value = useContext(HabitsContext);
            if (!value) throw new Error('useHabits must be used inside HabitsProvider');
            return value;
          }
