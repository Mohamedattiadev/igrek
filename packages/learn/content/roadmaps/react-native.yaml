  - id: persist
    stage: data-api
    title:
      en: "Keep the habits on the phone with SQLite"
      tr: "Alışkanlıkları SQLite ile telefonda saklama"
    minutes: 55
    needs: [form]
    why:
      en: "Right now everything disappears when the app closes. A phone app must remember. The phone has its own small database engine, SQLite, and Expo gives you `expo-sqlite` to use it. It is a good choice when you have lists of things that relate to each other, like habits and their check-ins."
      tr: "Şu an uygulama kapanınca her şey kayboluyor. Telefon uygulaması hatırlamak zorunda. Telefonun kendi küçük veritabanı motoru SQLite var ve Expo, onu kullanman için `expo-sqlite` verir. Alışkanlıklar ve işaretleri gibi birbiriyle ilişkili şeylerin listeleri varsa iyi bir seçimdir."
    learn:
      en: |
        - What SQLite is: a database in one file on the phone, no server
        - Tables, `INSERT`, `SELECT`, `DELETE`, and passing values with `?` so they cannot break the query
        - Migrations: a version number in the database (`user_version`) so later app versions can change the tables
        - Why simple key-value data fits `AsyncStorage` or `expo-sqlite/kv-store` better, and relational data fits SQLite
      tr: |
        - SQLite nedir: telefonda tek dosyalık veritabanı, sunucu yok
        - Tablolar, `INSERT`, `SELECT`, `DELETE` ve değerleri `?` ile vermek (sorguyu bozamasınlar diye)
        - Migration: veritabanında bir sürüm numarası (`user_version`) tutmak; böylece uygulamanın sonraki sürümleri tabloları değiştirebilir
        - Basit anahtar-değer verisinin neden `AsyncStorage` ya da `expo-sqlite/kv-store`'a, ilişkili verinin SQLite'a daha uygun olduğu
    do:
      en: |
        1. Install the package with Expo's installer, which picks the version that matches your SDK.
        2. Create `src/db.ts` with the `migrate` function. The first run creates the tables; the next runs see version 1 and do nothing. When you need a new column one day, you add a version 2 step here.
        3. Replace `src/habits-context.tsx`. The public side (`habits`, `add`, `toggle`, `remove`) is the same, so no screen changes. Inside, every action writes to SQLite and then reloads the list.
        4. Replace `src/app/_layout.tsx`: `SQLiteProvider` opens `habits.db` and runs `migrate`. With `useSuspense` it shows the fallback until the database is ready.
        5. Add a habit, mark it done, then close Expo Go completely (swipe it away) and open the project again. The data is still there.
      tr: |
        1. Paketi, SDK'na uygun sürümü seçen Expo yükleyicisiyle kur.
        2. `migrate` fonksiyonuyla `src/db.ts` oluştur. İlk çalıştırma tabloları oluşturur; sonrakiler sürüm 1'i görür ve bir şey yapmaz. Bir gün yeni bir kolon gerekirse buraya 2. sürüm adımını eklersin.
        3. `src/habits-context.tsx` dosyasını değiştir. Dış yüzü (`habits`, `add`, `toggle`, `remove`) aynı, bu yüzden hiçbir ekran değişmez. İçeride her işlem SQLite'a yazar, sonra listeyi yeniden yükler.
        4. `src/app/_layout.tsx` dosyasını değiştir: `SQLiteProvider` `habits.db`'yi açar ve `migrate`'i çalıştırır. `useSuspense` ile veritabanı hazır olana kadar fallback gösterir.
        5. Bir alışkanlık ekle, işaretle, sonra Expo Go'yu tamamen kapat (kaydırıp at) ve projeyi yeniden aç. Veri hâlâ orada.
    code:
      - file: terminal
        lang: sh
        text: |
          npx expo install expo-sqlite
      - file: src/db.ts
        lang: ts
        text: |
          import type { SQLiteDatabase } from 'expo-sqlite';

          const DATABASE_VERSION = 1;

          export async function migrate(db: SQLiteDatabase) {
            const row = await db.getFirstAsync<{ user_version: number }>('PRAGMA user_version');
            const current = row?.user_version ?? 0;
            if (current >= DATABASE_VERSION) return;

            if (current < 1) {
              await db.execAsync(`
                PRAGMA journal_mode = 'wal';
                CREATE TABLE habits (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  name TEXT NOT NULL
                );
                CREATE TABLE checkins (
                  habit_id INTEGER NOT NULL,
                  day TEXT NOT NULL,
                  PRIMARY KEY (habit_id, day)
                );
              `);
            }

            await db.execAsync(`PRAGMA user_version = ${DATABASE_VERSION}`);
          }
      - file: src/habits-context.tsx
        lang: tsx
        text: |
          import { useSQLiteContext } from 'expo-sqlite';
          import {
            createContext,
            useCallback,
            useContext,
            useEffect,
            useMemo,
            useState,
            type ReactNode,
          } from 'react';

          import { dayKey } from '@/streak';

          export type Habit = { id: number; name: string; doneDates: string[] };

          type HabitsValue = {
            habits: Habit[];
            add: (name: string) => void;
            toggle: (id: number) => void;
            remove: (id: number) => void;
          };

          const HabitsContext = createContext<HabitsValue | null>(null);

          export function HabitsProvider({ children }: { children: ReactNode }) {
            const db = useSQLiteContext();
            const [habits, setHabits] = useState<Habit[]>([]);

            const reload = useCallback(async () => {
              const rows = await db.getAllAsync<{ id: number; name: string }>(
                'SELECT id, name FROM habits ORDER BY id',
              );
              const checkins = await db.getAllAsync<{ habit_id: number; day: string }>(
                'SELECT habit_id, day FROM checkins',
              );
              setHabits(
                rows.map((row) => ({
                  ...row,
                  doneDates: checkins.filter((c) => c.habit_id === row.id).map((c) => c.day),
                })),
              );
            }, [db]);

            useEffect(() => {
              reload().catch(console.error);
            }, [reload]);

            const value = useMemo<HabitsValue>(
              () => ({
                habits,
                add: (name) => {
                  db.runAsync('INSERT INTO habits (name) VALUES (?)', name)
                    .then(reload)
                    .catch(console.error);
                },
                toggle: (id) => {
                  const day = dayKey();
                  (async () => {
                    // The primary key allows one check-in per habit per day.
                    const result = await db.runAsync(
                      'INSERT OR IGNORE INTO checkins (habit_id, day) VALUES (?, ?)',
                      id,
                      day,
                    );
                    if (result.changes === 0) {
                      await db.runAsync('DELETE FROM checkins WHERE habit_id = ? AND day = ?', id, day);
                    }
                    await reload();
                  })().catch(console.error);
                },
                remove: (id) => {
                  db.withExclusiveTransactionAsync(async (txn) => {
                    await txn.runAsync('DELETE FROM checkins WHERE habit_id = ?', id);
                    await txn.runAsync('DELETE FROM habits WHERE id = ?', id);
                  })
                    .then(reload)
                    .catch(console.error);
                },
              }),
              [db, habits, reload],
            );

            return <HabitsContext.Provider value={value}>{children}</HabitsContext.Provider>;
          }

          export function useHabits(): HabitsValue {
            const value = useContext(HabitsContext);
            if (!value) throw new Error('useHabits must be used inside HabitsProvider');
            return value;
          }
      - file: src/app/_layout.tsx
        lang: tsx
        text: |
          import { Stack } from 'expo-router';
          import { SQLiteProvider } from 'expo-sqlite';
          import { Suspense } from 'react';
          import { ActivityIndicator, View } from 'react-native';

          import { migrate } from '@/db';
          import { HabitsProvider } from '@/habits-context';

          function Loading() {
            return (
              <View style={{ flex: 1, alignItems: 'center', justifyContent: 'center' }}>
                <ActivityIndicator />
              </View>
            );
          }

          export default function RootLayout() {
            return (
              <Suspense fallback={<Loading />}>
                <SQLiteProvider databaseName="habits.db" onInit={migrate} useSuspense>
                  <HabitsProvider>
                    <Stack>
                      <Stack.Screen name="index" options={{ title: 'Habits' }} />
                      <Stack.Screen name="new" options={{ title: 'New habit', presentation: 'modal' }} />
                      <Stack.Screen name="habit/[id]" options={{ title: 'Habit' }} />
                    </Stack>
                  </HabitsProvider>
                </SQLiteProvider>
              </Suspense>
            );
          }
    mistakes:
      - problem:
          en: "Building SQL by gluing text together, like `'... WHERE name = ' + name`."
          tr: "SQL'i metin yapıştırarak kurmak, örneğin `'... WHERE name = ' + name`."
        fix:
          en: "Always pass values as parameters: `db.runAsync('INSERT ... VALUES (?)', name)`. Otherwise a name like `x'); DROP TABLE habits;--` is an SQL injection."
          tr: "Değerleri her zaman parametre olarak ver: `db.runAsync('INSERT ... VALUES (?)', name)`. Yoksa `x'); DROP TABLE habits;--` gibi bir isim SQL injection olur."
      - problem:
          en: "Changing the table definition in `migrate` after users already have the app. Their database stays at the old shape and the app crashes."
          tr: "Kullanıcılarda uygulama varken `migrate` içindeki tablo tanımını değiştirmek. Onların veritabanı eski şekilde kalır ve uygulama çöker."
        fix:
          en: "Never edit an old step. Add a new version step (`if (current < 2) { ALTER TABLE ... }`) and raise `DATABASE_VERSION`."
          tr: "Eski adımı asla düzenleme. Yeni bir sürüm adımı ekle (`if (current < 2) { ALTER TABLE ... }`) ve `DATABASE_VERSION`'ı artır."
    quiz:
      - q:
          en: "Why does `migrate` check `PRAGMA user_version`?"
          tr: "`migrate` neden `PRAGMA user_version`'ı kontrol ediyor?"
        options:
          en: ["To know the phone model", "To run each schema change only once, in order", "To make queries faster"]
          tr: ["Telefon modelini öğrenmek için", "Her şema değişikliğini sadece bir kez ve sırayla çalıştırmak için", "Sorguları hızlandırmak için"]
        answer: 1
        why:
          en: "The database remembers its version, so the app can apply only the missing steps, whether it is a fresh install or an old one."
          tr: "Veritabanı sürümünü hatırlar; böylece uygulama, temiz kurulum da olsa eski bir kurulum da olsa sadece eksik adımları uygular."
    sources:
      - title: Expo SDK, SQLite
        url: https://docs.expo.dev/versions/latest/sdk/sqlite/
      - title: Expo, local-first data and storage
        url: https://docs.expo.dev/guides/local-first/
      - title: SQLite, PRAGMA user_version
        url: https://www.sqlite.org/pragma.html#pragma_user_version

  - id: fetch
    stage: data-api
    title:
      en: "Load a daily quote from an API"
      tr: "Bir API'den günlük söz yükleme"
    minutes: 45
    needs: [persist]
    why:
      en: "Most apps talk to the internet. A phone makes it harder than a laptop: the connection is slow, drops in a lift, and the user leaves the screen while a request is running. So every request needs three visible states: loading, failed, and ready. We use a free quotes API that needs no key."
      tr: "Çoğu uygulama internetle konuşur. Telefon bunu dizüstüne göre zorlaştırır: bağlantı yavaştır, asansörde kopar ve istek sürerken kullanıcı ekrandan çıkar. Bu yüzden her isteğin üç görünür hali olmalı: yükleniyor, başarısız ve hazır. Anahtar gerektirmeyen ücretsiz bir söz API'si kullanıyoruz."
    learn:
      en: |
        - `fetch` works like in the browser; check `response.ok` yourself, because HTTP errors do not throw
        - A custom hook that returns one of three states and a `retry` function
        - Cancelling a request with `AbortController` when the screen goes away
        - The app must still work offline: the habits come from SQLite, only the quote needs the internet
      tr: |
        - `fetch` tarayıcıdaki gibi çalışır; HTTP hataları exception atmadığı için `response.ok`'u kendin kontrol edersin
        - Üç durumdan birini ve bir `retry` fonksiyonu döndüren özel bir hook
        - Ekran kapanınca isteği `AbortController` ile iptal etmek
        - Uygulama çevrimdışıyken de çalışmalı: alışkanlıklar SQLite'tan gelir, sadece söz için internet gerekir
    do:
      en: |
        1. Create `src/quote.ts` with `fetchQuote`. The service is `https://dummyjson.com/quotes/random` and it returns JSON like `{ "id": 1, "quote": "...", "author": "..." }`. Open that address in a browser to see it.
        2. Create the hook `src/use-quote.ts` and the component `src/components/quote-card.tsx`.
        3. Replace `src/app/index.tsx` so the card is the header of the list (`ListHeaderComponent`).
        4. Reload the app: you see "Loading" for a moment and then a quote.
        5. Turn on airplane mode, reload and see the error message. Turn it off and press "Try again".
      tr: |
        1. `fetchQuote` ile `src/quote.ts` oluştur. Servis `https://dummyjson.com/quotes/random` ve `{ "id": 1, "quote": "...", "author": "..." }` gibi bir JSON döndürür. Görmek için o adresi tarayıcıda aç.
        2. `src/use-quote.ts` hook'unu ve `src/components/quote-card.tsx` bileşenini oluştur.
        3. Kart listenin başlığı olsun diye `src/app/index.tsx` dosyasını değiştir (`ListHeaderComponent`).
        4. Uygulamayı yenile: bir an "Loading" görürsün, sonra bir söz.
        5. Uçak modunu aç, yenile ve hata mesajını gör. Kapat ve "Try again"e bas.
    code:
      - file: src/quote.ts
        lang: ts
        text: |
          export type Quote = { text: string; author: string };

          export async function fetchQuote(signal?: AbortSignal): Promise<Quote> {
            const response = await fetch('https://dummyjson.com/quotes/random', { signal });
            if (!response.ok) {
              throw new Error(`Quote request failed with status ${response.status}`);
            }
            const data: { quote: string; author: string } = await response.json();
            return { text: data.quote, author: data.author };
          }
      - file: src/use-quote.ts
        lang: ts
        text: |
          import { useCallback, useEffect, useState } from 'react';

          import { fetchQuote, type Quote } from '@/quote';

          export type QuoteState =
            | { status: 'loading' }
            | { status: 'error' }
            | { status: 'ready'; quote: Quote };

          export function useQuote() {
            const [state, setState] = useState<QuoteState>({ status: 'loading' });
            const [attempt, setAttempt] = useState(0);

            useEffect(() => {
              const controller = new AbortController();
              setState({ status: 'loading' });
              fetchQuote(controller.signal)
                .then((quote) => setState({ status: 'ready', quote }))
                .catch(() => {
                  if (!controller.signal.aborted) setState({ status: 'error' });
                });
              return () => controller.abort();
            }, [attempt]);

            const retry = useCallback(() => setAttempt((n) => n + 1), []);
            return { state, retry };
          }
      - file: src/components/quote-card.tsx
        lang: tsx
        text: |
          import { Pressable, StyleSheet, Text, View } from 'react-native';

          import { colors } from '@/theme';
          import { useQuote } from '@/use-quote';

          export function QuoteCard() {
            const { state, retry } = useQuote();

            return (
              <View style={styles.card}>
                {state.status === 'loading' && <Text style={styles.muted}>Loading</Text>}
                {state.status === 'error' && (
                  <>
                    <Text style={styles.muted}>No quote right now. You may be offline.</Text>
                    <Pressable onPress={retry} accessibilityRole="button">
                      <Text style={styles.retry}>Try again</Text>
                    </Pressable>
                  </>
                )}
                {state.status === 'ready' && (
                  <>
                    <Text style={styles.quote}>{state.quote.text}</Text>
                    <Text style={styles.author}>{state.quote.author}</Text>
                  </>
                )}
              </View>
            );
          }

          const styles = StyleSheet.create({
            card: {
              backgroundColor: colors.card,
              borderRadius: 12,
              borderWidth: 1,
              borderColor: colors.border,
              padding: 16,
              marginBottom: 16,
            },
            quote: { fontSize: 16, fontStyle: 'italic', color: colors.text },
            author: { marginTop: 8, color: colors.muted },
            muted: { color: colors.muted },
            retry: { marginTop: 8, color: colors.accent, fontWeight: '600' },
          });
      - file: src/app/index.tsx
        lang: tsx
        text: |
          import { Link, useRouter } from 'expo-router';
          import { FlatList, Pressable, StyleSheet, Text, View } from 'react-native';

          import { HabitRow } from '@/components/habit-row';
          import { QuoteCard } from '@/components/quote-card';
          import { useHabits } from '@/habits-context';
          import { dayKey, streak } from '@/streak';
          import { colors } from '@/theme';

          export default function HomeScreen() {
            const router = useRouter();
            const { habits, toggle } = useHabits();
            const today = dayKey();

            return (
              <View style={styles.screen}>
                <FlatList
                  data={habits}
                  keyExtractor={(habit) => String(habit.id)}
                  ListHeaderComponent={<QuoteCard />}
                  ListEmptyComponent={<Text style={styles.empty}>No habits yet. Add your first one.</Text>}
                  renderItem={({ item }) => (
                    <HabitRow
                      id={item.id}
                      name={item.name}
                      streak={streak(item.doneDates, today)}
                      done={item.doneDates.includes(today)}
                      onToggle={toggle}
                      onOpen={(id) => router.push({ pathname: '/habit/[id]', params: { id: String(id) } })}
                    />
                  )}
                />
                <Link href="/new" asChild>
                  <Pressable style={styles.add} accessibilityRole="button">
                    <Text style={styles.addText}>New habit</Text>
                  </Pressable>
                </Link>
              </View>
            );
          }

          const styles = StyleSheet.create({
            screen: { flex: 1, backgroundColor: colors.background, padding: 16 },
            empty: { color: colors.muted, textAlign: 'center', marginTop: 32 },
            add: { alignItems: 'center', backgroundColor: colors.accent, padding: 14, borderRadius: 10 },
            addText: { color: colors.onAccent, fontWeight: '600', fontSize: 16 },
          });
    mistakes:
      - problem:
          en: "Treating a 404 or 500 answer as success, because `fetch` only throws when the network fails."
          tr: "404 ya da 500 cevabını başarı sanmak; çünkü `fetch` sadece ağ koparsa exception atar."
        fix:
          en: "Check `response.ok` (or `response.status`) and throw your own error, like `fetchQuote` does."
          tr: "`response.ok`'u (ya da `response.status`'u) kontrol et ve `fetchQuote`'taki gibi kendi hatanı fırlat."
      - problem:
          en: "Calling the API with `http://` on a real build. Android and iOS block plain HTTP by default."
          tr: "Gerçek build'de API'yi `http://` ile çağırmak. Android ve iOS varsayılan olarak düz HTTP'yi engeller."
        fix:
          en: "Use `https://` addresses. Only use plain HTTP for a local development server and understand the extra settings it needs."
          tr: "`https://` adresleri kullan. Düz HTTP'yi sadece yerel geliştirme sunucusu için kullan ve gerektirdiği ek ayarları öğren."
    quiz:
      - q:
          en: "What does `fetch` do when the server answers 500?"
          tr: "Sunucu 500 cevabı verince `fetch` ne yapar?"
        options:
          en: ["It throws an error", "It returns a response with ok set to false", "It retries by itself"]
          tr: ["Hata fırlatır", "ok değeri false olan bir response döndürür", "Kendi kendine yeniden dener"]
        answer: 1
        why:
          en: "fetch only rejects on network failure. For HTTP errors you must check response.ok yourself."
          tr: "fetch sadece ağ hatasında reject eder. HTTP hatalarında response.ok'u kendin kontrol etmelisin."
    sources:
      - title: React Native, networking
        url: https://reactnative.dev/docs/network
      - title: MDN, Using the Fetch API
        url: https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch
      - title: MDN, AbortController
        url: https://developer.mozilla.org/en-US/docs/Web/API/AbortController

  - id: tests
    stage: testing
    title:
      en: "Test the app with Jest and Testing Library"
      tr: "Uygulamayı Jest ve Testing Library ile test etme"
    minutes: 50
    needs: [fetch]
    why:
      en: "On a phone, trying every change by hand is slow, and a store release cannot be taken back quickly. Tests run in seconds on your computer, with no phone. Jest runs the tests, `jest-expo` prepares the React Native world for it, and React Native Testing Library renders components and finds things the way a user sees them: by their text."
      tr: "Telefonda her değişikliği elle denemek yavaştır ve mağaza sürümü hızla geri alınamaz. Testler telefon olmadan, bilgisayarında saniyeler içinde çalışır. Jest testleri çalıştırır, `jest-expo` React Native dünyasını onun için hazırlar, React Native Testing Library da bileşenleri çizer ve şeyleri kullanıcının gördüğü gibi, yazılarıyla bulur."
    learn:
      en: |
        - A unit test for a pure function (`streak`), a component test (`HabitRow`) and a test with a fake `fetch`
        - `render`, `screen.getByText`, `fireEvent.press` and the `toBeOnTheScreen` matcher
        - In this version of Testing Library `render` and `fireEvent` are asynchronous: use `await`
        - What tests on your computer cannot tell you: real device behaviour, performance, native modules
      tr: |
        - Saf bir fonksiyon (`streak`) için unit test, bir bileşen testi (`HabitRow`) ve sahte `fetch` ile bir test
        - `render`, `screen.getByText`, `fireEvent.press` ve `toBeOnTheScreen` matcher'ı
        - Testing Library'nin bu sürümünde `render` ve `fireEvent` asenkrondur: `await` kullan
        - Bilgisayardaki testlerin sana söyleyemedikleri: gerçek cihaz davranışı, performans, native modüller
    do:
      en: |
        1. Install the test tools with Expo's installer (it picks versions that match your SDK).
        2. In `package.json` add `"test": "jest"` to `scripts` and a `jest` block with the `jest-expo` preset. The `moduleNameMapper` line teaches Jest what `@/` means. If you ever import a library that ships untranspiled code, add Expo's `transformIgnorePatterns` list from the docs.
        3. In `tsconfig.json` add `"types": ["jest"]` inside `compilerOptions`, so TypeScript knows `test` and `expect`.
        4. Create the three test files below in `src/__tests__`.
        5. Run `npm test`. All tests should pass. Then break something on purpose (change `streak` to count 2 days when it should be 1) and watch a test fail, and fix it back.
      tr: |
        1. Test araçlarını Expo'nun yükleyicisiyle kur (SDK'na uygun sürümleri seçer).
        2. `package.json` içinde `scripts`'e `"test": "jest"` ekle ve `jest-expo` preset'li bir `jest` bloğu ekle. `moduleNameMapper` satırı Jest'e `@/`'nin ne demek olduğunu öğretir. Bir gün çevrilmemiş kod yayınlayan bir kütüphane import edersen dokümandaki Expo `transformIgnorePatterns` listesini ekle.
        3. `tsconfig.json` içinde `compilerOptions`'a `"types": ["jest"]` ekle; TypeScript `test` ve `expect`'i bilsin.
        4. Aşağıdaki üç test dosyasını `src/__tests__` içinde oluştur.
        5. `npm test` çalıştır. Bütün testler geçmeli. Sonra bilerek bir şeyi boz (`streak`'in 1 olması gerekirken 2 gün saymasını sağla), bir testin kırıldığını gör ve geri düzelt.
    code:
      - file: terminal
        lang: sh
        text: |
          npx expo install jest-expo jest @types/jest --dev
          npx expo install @testing-library/react-native --dev
      - file: package.json
        lang: json
        text: |
          {
            "scripts": {
              "test": "jest"
            },
            "jest": {
              "preset": "jest-expo",
              "moduleNameMapper": {
                "^@/(.*)$": "<rootDir>/src/$1"
              }
            }
          }
      - file: src/__tests__/streak.test.ts
        lang: ts
        text: |
          import { dayKey, streak } from '@/streak';

          describe('dayKey', () => {
            test('uses the local year, month and day with two digits', () => {
              expect(dayKey(new Date(2026, 0, 5))).toBe('2026-01-05');
            });
          });

          describe('streak', () => {
            const today = '2026-10-18';

            test('is 0 when nothing is done', () => {
              expect(streak([], today)).toBe(0);
            });

            test('counts the days in a row ending today', () => {
              expect(streak(['2026-10-16', '2026-10-17', '2026-10-18'], today)).toBe(3);
            });

            test('keeps a streak that ended yesterday alive', () => {
              expect(streak(['2026-10-16', '2026-10-17'], today)).toBe(2);
            });

            test('is 0 when the last day was before yesterday', () => {
              expect(streak(['2026-10-15'], today)).toBe(0);
            });

            test('stops at a gap and works across a month border', () => {
              expect(streak(['2026-09-29', '2026-09-30', '2026-10-01', '2026-10-03'], '2026-10-03')).toBe(1);
              expect(streak(['2026-09-30', '2026-10-01', '2026-10-02'], '2026-10-02')).toBe(3);
            });
          });
      - file: src/__tests__/habit-row.test.tsx
        lang: tsx
        text: |
          import { fireEvent, render, screen } from '@testing-library/react-native';

          import { HabitRow } from '@/components/habit-row';

          function setup(done: boolean) {
            const onToggle = jest.fn();
            const onOpen = jest.fn();
            return {
              onToggle,
              onOpen,
              ui: (
                <HabitRow id={7} name="Drink water" streak={3} done={done} onToggle={onToggle} onOpen={onOpen} />
              ),
            };
          }

          test('shows the name and the streak', async () => {
            await render(setup(false).ui);
            expect(screen.getByText('Drink water')).toBeOnTheScreen();
            expect(screen.getByText('3 days streak')).toBeOnTheScreen();
          });

          test('pressing the button reports the habit id', async () => {
            const { ui, onToggle } = setup(false);
            await render(ui);
            await fireEvent.press(screen.getByRole('button', { name: 'Mark Drink water as done' }));
            expect(onToggle).toHaveBeenCalledWith(7);
          });

          test('a finished habit offers to undo', async () => {
            await render(setup(true).ui);
            expect(screen.getByText('Done')).toBeOnTheScreen();
            expect(screen.getByRole('button', { name: 'Undo Drink water' })).toBeOnTheScreen();
          });
      - file: src/__tests__/quote.test.ts
        lang: ts
        text: |
          import { fetchQuote } from '@/quote';

          afterEach(() => {
            jest.restoreAllMocks();
          });

          test('turns the API answer into a Quote', async () => {
            jest.spyOn(globalThis, 'fetch').mockResolvedValue({
              ok: true,
              json: async () => ({ id: 1, quote: 'Keep going.', author: 'Someone' }),
            } as Response);

            await expect(fetchQuote()).resolves.toEqual({ text: 'Keep going.', author: 'Someone' });
          });

          test('throws when the server answers with an error', async () => {
            jest.spyOn(globalThis, 'fetch').mockResolvedValue({ ok: false, status: 500 } as Response);

            await expect(fetchQuote()).rejects.toThrow('500');
          });
    mistakes:
      - problem:
          en: "\"Cannot find module '@/streak'\" when running Jest."
          tr: "Jest çalışırken \"Cannot find module '@/streak'\" hatası."
        fix:
          en: "Jest does not read the `paths` of `tsconfig.json`. Add the `moduleNameMapper` entry shown above."
          tr: "Jest `tsconfig.json`'daki `paths`'i okumaz. Yukarıdaki `moduleNameMapper` satırını ekle."
      - problem:
          en: "Forgetting `await` before `render` or `fireEvent` and getting tests that pass or fail at random."
          tr: "`render` ya da `fireEvent` öncesinde `await` unutmak ve rastgele geçen ya da kalan testler almak."
        fix:
          en: "In the current Testing Library these are async. Write `await render(...)` and `await fireEvent.press(...)`."
          tr: "Güncel Testing Library'de bunlar asenkron. `await render(...)` ve `await fireEvent.press(...)` yaz."
      - problem:
          en: "Calling the real API in a test."
          tr: "Testte gerçek API'yi çağırmak."
        fix:
          en: "A test must not depend on the internet. Replace `fetch` with a fake, as in `quote.test.ts`."
          tr: "Test internete bağlı olmamalı. `quote.test.ts`'teki gibi `fetch`'i sahtesiyle değiştir."
    quiz:
      - q:
          en: "How does Testing Library prefer to find a button?"
          tr: "Testing Library bir düğmeyi nasıl bulmayı tercih eder?"
        options:
          en: ["By its position in the component tree", "By what a user sees or hears: its text, role or label", "By a random generated id"]
          tr: ["Component ağacındaki konumuyla", "Kullanıcının gördüğü ya da duyduğu şeyle: yazısı, rolü ya da etiketi", "Rastgele üretilmiş bir id ile"]
        answer: 1
        why:
          en: "Tests that look at text, role and label survive refactors and also push you to make the app accessible."
          tr: "Yazıya, role ve etikete bakan testler yeniden düzenlemeleri atlatır ve seni uygulamayı erişilebilir yapmaya da iter."
    sources:
      - title: Expo, unit testing with Jest
        url: https://docs.expo.dev/develop/unit-testing/
      - title: React Native Testing Library, introduction
        url: https://callstack.github.io/react-native-testing-library/docs/start/intro
      - title: Jest, getting started
        url: https://jestjs.io/docs/getting-started

  - id: security
    stage: security
    title:
      en: "Keep secrets safe on the phone"
      tr: "Telefonda sırları güvende tutma"
    minutes: 40
    needs: [tests]
    why:
      en: "Anyone can unpack an app and read every file in it. Anyone who gets hold of a lost phone can look at its storage. So a secret must never be written into the code, and a login token must not sit in plain storage. The phone has a safe for this: the iOS Keychain and the Android Keystore. `expo-secure-store` is the door to both."
      tr: "Herkes bir uygulamayı açıp içindeki bütün dosyaları okuyabilir. Kaybolan bir telefonu ele geçiren herkes depolamasına bakabilir. Bu yüzden bir sır asla koda yazılmamalı, bir giriş token'ı da düz depolamada durmamalı. Telefonda bunun için bir kasa var: iOS Keychain ve Android Keystore. `expo-secure-store` ikisine de açılan kapıdır."
    learn:
      en: |
        - The difference between `expo-sqlite` or AsyncStorage (plain, not encrypted) and `expo-secure-store` (encrypted by the system)
        - Why `EXPO_PUBLIC_` environment variables are not secret: they are copied into the app
        - Keep a token only as long as needed, never print it to logs, and delete it on sign-out
        - Use HTTPS everywhere, keep packages updated, and run `npm audit`
      tr: |
        - `expo-sqlite` ya da AsyncStorage (düz, şifresiz) ile `expo-secure-store` (sistem tarafından şifrelenir) arasındaki fark
        - `EXPO_PUBLIC_` ortam değişkenlerinin neden gizli olmadığı: uygulamanın içine kopyalanırlar
        - Token'ı sadece gerektiği kadar tut, asla log'a yazma, çıkış yapınca sil
        - Her yerde HTTPS kullan, paketleri güncel tut ve `npm audit` çalıştır
    do:
      en: |
        1. Install the package: `npx expo install expo-secure-store`.
        2. Create `src/secure.ts`, a tiny wrapper with three functions. Keeping all secure storage in one file makes it easy to review.
        3. Create `src/app/settings.tsx`. Imagine an optional cloud backup service that gives you a token. The screen lets you paste a token, save it and remove it. It never shows the token back.
        4. In `src/app/_layout.tsx` register the screen and add a "Settings" link in the header of the first screen.
        5. Try it: save a token, fully close the app, open it, and see "A token is saved on this device". Remove it and check again.
        6. Run `npm audit` in the project and read the result. Fix what has a simple fix; do not blindly run `npm audit fix --force`.
      tr: |
        1. Paketi kur: `npx expo install expo-secure-store`.
        2. Üç fonksiyonlu küçük bir sarmalayıcı olan `src/secure.ts` oluştur. Tüm güvenli depolamanın tek dosyada olması incelemeyi kolaylaştırır.
        3. `src/app/settings.tsx` oluştur. Sana bir token veren isteğe bağlı bir bulut yedekleme servisi düşün. Ekran bir token yapıştırmanı, kaydetmeni ve silmeni sağlar. Token'ı asla geri göstermez.
        4. `src/app/_layout.tsx` içinde ekranı kaydet ve ilk ekranın başlığına bir "Settings" bağlantısı ekle.
        5. Dene: bir token kaydet, uygulamayı tamamen kapat, aç ve "A token is saved on this device" yazısını gör. Sil ve tekrar kontrol et.
        6. Projede `npm audit` çalıştır ve sonucu oku. Basit çözümü olanları düzelt; `npm audit fix --force`'u gözü kapalı çalıştırma.
    code:
      - file: terminal
        lang: sh
        text: |
          npx expo install expo-secure-store
          npm audit
      - file: src/secure.ts
        lang: ts
        text: |
          import * as SecureStore from 'expo-secure-store';

          const TOKEN_KEY = 'backup-token';

          export function saveToken(token: string): Promise<void> {
            return SecureStore.setItemAsync(TOKEN_KEY, token);
          }

          export function loadToken(): Promise<string | null> {
            return SecureStore.getItemAsync(TOKEN_KEY);
          }

          export function clearToken(): Promise<void> {
            return SecureStore.deleteItemAsync(TOKEN_KEY);
          }
      - file: src/app/settings.tsx
        lang: tsx
        text: |
          import { useEffect, useState } from 'react';
          import { Pressable, StyleSheet, Text, TextInput, View } from 'react-native';

          import { clearToken, loadToken, saveToken } from '@/secure';
          import { colors } from '@/theme';

          export default function SettingsScreen() {
            const [saved, setSaved] = useState(false);
            const [input, setInput] = useState('');

            useEffect(() => {
              loadToken()
                .then((token) => setSaved(token !== null))
                .catch(console.error);
            }, []);

            async function save() {
              const token = input.trim();
              if (token.length === 0) return;
              await saveToken(token);
              setInput('');
              setSaved(true);
            }

            async function remove() {
              await clearToken();
              setSaved(false);
            }

            return (
              <View style={styles.screen}>
                <Text style={styles.label}>Backup token</Text>
                <Text style={styles.muted}>
                  {saved ? 'A token is saved on this device.' : 'No token saved.'}
                </Text>
                <TextInput
                  style={styles.input}
                  value={input}
                  onChangeText={setInput}
                  placeholder="Paste a token"
                  secureTextEntry
                  autoCapitalize="none"
                  autoCorrect={false}
                  accessibilityLabel="Backup token"
                />
                <Pressable style={styles.save} onPress={save} accessibilityRole="button">
                  <Text style={styles.saveText}>Save token</Text>
                </Pressable>
                {saved && (
                  <Pressable style={styles.remove} onPress={remove} accessibilityRole="button">
                    <Text style={styles.removeText}>Remove token</Text>
                  </Pressable>
                )}
              </View>
            );
          }

          const styles = StyleSheet.create({
            screen: { flex: 1, backgroundColor: colors.background, padding: 16 },
            label: { fontSize: 16, fontWeight: '600', color: colors.text },
            muted: { color: colors.muted, marginTop: 4, marginBottom: 12 },
            input: {
              backgroundColor: colors.card,
              borderColor: colors.border,
              borderWidth: 1,
              borderRadius: 10,
              padding: 12,
              fontSize: 16,
              color: colors.text,
            },
            save: { marginTop: 12, alignItems: 'center', backgroundColor: colors.accent, padding: 14, borderRadius: 10 },
            saveText: { color: colors.onAccent, fontWeight: '600', fontSize: 16 },
            remove: { marginTop: 12, alignItems: 'center', padding: 14 },
            removeText: { color: colors.danger, fontWeight: '600', fontSize: 16 },
          });
      - file: src/app/_layout.tsx
        lang: tsx
        text: |
          import { Link, Stack } from 'expo-router';
          import { SQLiteProvider } from 'expo-sqlite';
          import { Suspense } from 'react';
          import { ActivityIndicator, View } from 'react-native';

          import { migrate } from '@/db';
          import { HabitsProvider } from '@/habits-context';

          function Loading() {
            return (
              <View style={{ flex: 1, alignItems: 'center', justifyContent: 'center' }}>
                <ActivityIndicator />
              </View>
            );
          }

          export default function RootLayout() {
            return (
              <Suspense fallback={<Loading />}>
                <SQLiteProvider databaseName="habits.db" onInit={migrate} useSuspense>
                  <HabitsProvider>
                    <Stack>
                      <Stack.Screen
                        name="index"
                        options={{
                          title: 'Habits',
                          headerRight: () => <Link href="/settings">Settings</Link>,
                        }}
                      />
                      <Stack.Screen name="new" options={{ title: 'New habit', presentation: 'modal' }} />
                      <Stack.Screen name="habit/[id]" options={{ title: 'Habit' }} />
                      <Stack.Screen name="settings" options={{ title: 'Settings' }} />
                    </Stack>
                  </HabitsProvider>
                </SQLiteProvider>
              </Suspense>
            );
          }
    mistakes:
      - problem:
          en: "Putting an API key or password in the code or in an `EXPO_PUBLIC_` variable \"because it is hidden in the app\"."
          tr: "API anahtarını ya da parolayı \"uygulamanın içinde gizli\" diye koda ya da `EXPO_PUBLIC_` değişkenine koymak."
        fix:
          en: "Nothing inside an app is hidden. Keep real secrets on a server that your app calls, and give the app only short-lived tokens, stored in SecureStore."
          tr: "Uygulamanın içinde hiçbir şey gizli değildir. Gerçek sırları uygulamanın çağırdığı bir sunucuda tut, uygulamaya sadece kısa ömürlü token'lar ver ve onları SecureStore'da sakla."
      - problem:
          en: "Storing a big blob in SecureStore."
          tr: "SecureStore'a büyük bir veri yığını koymak."
        fix:
          en: "It is meant for small secrets. The docs warn that some platforms refuse values above about 2 KB. Keep a small key or token there and the large data elsewhere."
          tr: "Küçük sırlar için tasarlanmıştır. Dokümana göre bazı platformlar yaklaşık 2 KB üstü değerleri reddedebilir. Orada küçük bir anahtar ya da token tut, büyük veriyi başka yerde."
    quiz:
      - q:
          en: "Where should a login token be stored on the phone?"
          tr: "Bir giriş token'ı telefonda nerede saklanmalı?"
        options:
          en: ["In a constant in the code", "In plain AsyncStorage or SQLite", "In expo-secure-store"]
          tr: ["Koddaki bir sabitte", "Düz AsyncStorage ya da SQLite'ta", "expo-secure-store'da"]
        answer: 2
        why:
          en: "SecureStore uses the Keychain on iOS and the Keystore on Android, so the value is encrypted by the system. Code and plain storage can be read."
          tr: "SecureStore iOS'ta Keychain, Android'de Keystore kullanır; değer sistem tarafından şifrelenir. Kod ve düz depolama okunabilir."
    sources:
      - title: Expo SDK, SecureStore
        url: https://docs.expo.dev/versions/latest/sdk/securestore/
      - title: Expo, environment variables
        url: https://docs.expo.dev/guides/environment-variables/
      - title: React Native, security
        url: https://reactnative.dev/docs/security

  - id: performance
    stage: performance
    title:
      en: "Fast lists with FlashList"
      tr: "FlashList ile hızlı listeler"
    minutes: 35
    needs: [security]
    why:
      en: "A phone has less memory and a weaker processor than your computer, and users notice every dropped frame when they scroll. The list is the screen where this matters most. `FlatList` already draws only what is visible. `FlashList` goes further and re-uses the row components that scroll out of sight instead of creating new ones."
      tr: "Telefonun bilgisayarından daha az belleği ve daha zayıf bir işlemcisi var; kullanıcı kaydırırken kaçırılan her kareyi fark eder. Liste, bunun en çok önemli olduğu ekran. `FlatList` zaten sadece görünenleri çizer. `FlashList` bir adım ileri gider ve ekrandan çıkan satır bileşenlerini yenisini yaratmak yerine yeniden kullanır."
    learn:
      en: |
        - Never render a long list with `map` inside a `ScrollView`: every row is created at once
        - `FlatList` and `FlashList` are virtualized: only visible rows exist
        - `keyExtractor` gives each row a stable key
        - Test performance in a release build, not in development mode, which is much slower on purpose
        - This template turns on the React Compiler (`experiments.reactCompiler` in `app.json`), which adds memoization for you. Without it you would wrap rows in `React.memo` and handlers in `useCallback`.
      tr: |
        - Uzun bir listeyi `ScrollView` içinde `map` ile asla çizme: bütün satırlar aynı anda yaratılır
        - `FlatList` ve `FlashList` sanallaştırılmıştır: sadece görünen satırlar vardır
        - `keyExtractor` her satıra sabit bir anahtar verir
        - Performansı geliştirme modunda değil, release build'de test et; geliştirme modu bilerek çok daha yavaştır
        - Bu şablon React Compiler'ı açar (`app.json`'da `experiments.reactCompiler`) ve memoization'ı senin yerine ekler. O olmasaydı satırları `React.memo` ile, işleyicileri `useCallback` ile sarardın.
    do:
      en: |
        1. Install the list: `npx expo install @shopify/flash-list`.
        2. Replace `src/app/index.tsx` with the version below. The only real changes are the import and the name `FlashList` instead of `FlatList`. FlashList version 2 needs no size estimate.
        3. Open the app and check that the list looks and works the same. With three habits you will not see a speed difference, and that is fine: the benefit shows with hundreds of rows.
        4. Learn the tools you will need later: shake the phone (or press `m` in the terminal) to open the developer menu, and turn on the performance monitor. Remember that development mode is slower than the build you ship.
        5. Run `npm test` and `npx tsc --noEmit`, and commit.
      tr: |
        1. Listeyi kur: `npx expo install @shopify/flash-list`.
        2. `src/app/index.tsx` dosyasını aşağıdaki sürümle değiştir. Gerçek değişiklikler sadece import ve `FlatList` yerine `FlashList` ismi. FlashList 2. sürüm boyut tahmini istemez.
        3. Uygulamayı aç ve listenin aynı görünüp aynı çalıştığını kontrol et. Üç alışkanlıkla hız farkını görmezsin, sorun yok: faydası yüzlerce satırda belli olur.
        4. Sonra lazım olacak araçları öğren: geliştirici menüsünü açmak için telefonu salla (ya da terminalde `m`'ye bas) ve performans monitörünü aç. Geliştirme modunun, yayınlayacağın build'den yavaş olduğunu unutma.
        5. `npm test` ve `npx tsc --noEmit` çalıştır ve commit et.
    code:
      - file: terminal
        lang: sh
        text: |
          npx expo install @shopify/flash-list
      - file: src/app/index.tsx
        lang: tsx
        text: |
          import { FlashList } from '@shopify/flash-list';
          import { Link, useRouter } from 'expo-router';
          import { Pressable, StyleSheet, Text, View } from 'react-native';

          import { HabitRow } from '@/components/habit-row';
          import { QuoteCard } from '@/components/quote-card';
          import { useHabits } from '@/habits-context';
          import { dayKey, streak } from '@/streak';
          import { colors } from '@/theme';

          export default function HomeScreen() {
            const router = useRouter();
            const { habits, toggle } = useHabits();
            const today = dayKey();

            return (
              <View style={styles.screen}>
                <FlashList
                  data={habits}
                  keyExtractor={(habit) => String(habit.id)}
                  ListHeaderComponent={<QuoteCard />}
                  ListEmptyComponent={<Text style={styles.empty}>No habits yet. Add your first one.</Text>}
                  renderItem={({ item }) => (
                    <HabitRow
                      id={item.id}
                      name={item.name}
                      streak={streak(item.doneDates, today)}
                      done={item.doneDates.includes(today)}
                      onToggle={toggle}
                      onOpen={(id) => router.push({ pathname: '/habit/[id]', params: { id: String(id) } })}
                    />
                  )}
                />
                <Link href="/new" asChild>
                  <Pressable style={styles.add} accessibilityRole="button">
                    <Text style={styles.addText}>New habit</Text>
                  </Pressable>
                </Link>
              </View>
            );
          }

          const styles = StyleSheet.create({
            screen: { flex: 1, backgroundColor: colors.background, padding: 16 },
            empty: { color: colors.muted, textAlign: 'center', marginTop: 32 },
            add: { alignItems: 'center', backgroundColor: colors.accent, padding: 14, borderRadius: 10 },
            addText: { color: colors.onAccent, fontWeight: '600', fontSize: 16 },
          });
    mistakes:
      - problem:
          en: "Judging speed by how the app feels in development mode, or in Expo Go, and then optimizing the wrong thing."
          tr: "Hızı geliştirme modundaki ya da Expo Go'daki hisse bakarak değerlendirmek ve yanlış şeyi optimize etmek."
        fix:
          en: "Development mode adds checks and is slower. Measure on a release build (the EAS preview build of a later step) on a modest, real phone."
          tr: "Geliştirme modu ek kontroller yapar ve yavaştır. Ölçümü mütevazı, gerçek bir telefonda release build ile yap (sonraki bir adımdaki EAS preview build'i)."
      - problem:
          en: "Rows with a changing key (for example the array index) or no key. Rows flicker or keep the wrong state."
          tr: "Anahtarı değişen (örneğin dizi indeksi) ya da anahtarsız satırlar. Satırlar titrer ya da yanlış state tutar."
        fix:
          en: "Use a stable id from your data in `keyExtractor`, like the habit id."
          tr: "`keyExtractor`'da verindeki sabit bir id'yi kullan, örneğin alışkanlık id'si."
    quiz:
      - q:
          en: "Why use FlatList or FlashList instead of map inside a ScrollView for 1000 rows?"
          tr: "1000 satır için neden ScrollView içinde map yerine FlatList ya da FlashList kullanılır?"
        options:
          en: ["They add colors", "They create only the visible rows, so memory and start-up time stay small", "They load the data from the internet"]
          tr: ["Renk eklerler", "Sadece görünen satırları yaratırlar, bu yüzden bellek ve açılış süresi küçük kalır", "Veriyi internetten yüklerler"]
        answer: 1
        why:
          en: "Virtualization keeps the number of live row components small, however long the list is."
          tr: "Sanallaştırma, liste ne kadar uzun olursa olsun canlı satır bileşeni sayısını küçük tutar."
    sources:
      - title: Expo SDK, FlashList
        url: https://docs.expo.dev/versions/latest/sdk/flash-list/
      - title: FlashList documentation
        url: https://shopify.github.io/flash-list/
      - title: React Native, performance overview
        url: https://reactnative.dev/docs/performance

  - id: icon-splash
    stage: packaging
    title:
      en: "App name, icon and splash screen"
      tr: "Uygulama adı, ikon ve açılış ekranı"
    minutes: 40
    needs: [performance]
    why:
      en: "Before a build leaves your computer it needs an identity: a name people see under the icon, an icon, a splash screen shown while the app starts, and a unique id that stores use to tell your app from every other app. These live in `app.json`. Get them right now, because the app id cannot be changed after you publish."
      tr: "Bir build bilgisayarından çıkmadan önce bir kimliğe ihtiyaç duyar: ikonun altında görünen isim, bir ikon, uygulama açılırken görünen açılış ekranı ve mağazaların uygulamanı diğerlerinden ayırmak için kullandığı benzersiz bir id. Bunlar `app.json` içinde durur. Şimdi doğru yap, çünkü yayınladıktan sonra uygulama id'si değiştirilemez."
    learn:
      en: |
        - `name` (shown under the icon), `slug` (used by Expo), `version`
        - The app id: `android.package` and `ios.bundleIdentifier`, written like `com.yourname.habits`
        - Icon rules: exactly square, 1024x1024 PNG, fills the whole square with no rounded corners
        - Android adaptive icon: a foreground layer with a transparent background, a background colour, and keep the artwork in the centre
        - The splash screen is set up with the `expo-splash-screen` plugin and shows only in a real build, not in Expo Go
      tr: |
        - `name` (ikonun altında görünür), `slug` (Expo kullanır), `version`
        - Uygulama id'si: `android.package` ve `ios.bundleIdentifier`, `com.senin-adin.habits` gibi yazılır
        - İkon kuralları: tam kare, 1024x1024 PNG, köşesiz ve yuvarlatmasız bütün kareyi doldurur
        - Android adaptive ikon: arka planı saydam bir ön katman, bir arka plan rengi; çizimi ortada tut
        - Açılış ekranı `expo-splash-screen` plugin'iyle ayarlanır ve sadece gerçek build'de görünür, Expo Go'da görünmez
    do:
      en: |
        1. Make your artwork. Any drawing tool works. You need: **icon.png** (1024x1024, solid, full square), **android-icon-foreground.png** (1024x1024, transparent background, the drawing inside the centre two thirds because Android crops the edges), **android-icon-monochrome.png** (same shape in one colour, for themed icons) and **splash-icon.png** (transparent background). Put them in `assets/images`, replacing the template files with the same names. The Expo docs link a free Figma template.
        2. Replace `app.json` with the version below. Change `com.yourname.habits` to an id of your own, with only lowercase letters, digits and dots, in the form of a reversed domain name. If you have no domain, use `com.` plus your username.
        3. The template stored the iOS icon in `assets/expo.icon`. Delete that folder (`assets/expo.icon`) in your file manager: we use the one `icon` for both systems.
        4. Check that the config is valid: `npx expo config --type public` prints it. Run `npx expo-doctor`; it should report no issues.
        5. Commit. You will see the icon and the splash screen on a real phone in the next step.
      tr: |
        1. Görselleri hazırla. Herhangi bir çizim aracı olur. Şunlar lazım: **icon.png** (1024x1024, dolu, tam kare), **android-icon-foreground.png** (1024x1024, saydam arka plan, Android kenarları kestiği için çizim ortadaki üçte ikilik alanda), **android-icon-monochrome.png** (aynı şekil tek renkte, temalı ikonlar için) ve **splash-icon.png** (saydam arka plan). Hepsini `assets/images` içine, şablondaki aynı isimli dosyaların yerine koy. Expo dokümanı ücretsiz bir Figma şablonu paylaşıyor.
        2. `app.json` dosyasını aşağıdaki sürümle değiştir. `com.yourname.habits` yerine kendi id'ni yaz; sadece küçük harf, rakam ve nokta içersin, ters yazılmış alan adı biçiminde olsun. Alan adın yoksa `com.` artı kullanıcı adını kullan.
        3. Şablon iOS ikonunu `assets/expo.icon` içinde tutuyordu. O klasörü (`assets/expo.icon`) dosya yöneticisinde sil: iki sistem için tek `icon` kullanıyoruz.
        4. Config'in geçerli olduğunu kontrol et: `npx expo config --type public` yazdırır. `npx expo-doctor` çalıştır; sorun bildirmemeli.
        5. Commit et. İkonu ve açılış ekranını bir sonraki adımda gerçek telefonda göreceksin.
    code:
      - file: app.json
        lang: json
        text: |
          {
            "expo": {
              "name": "Habits",
              "slug": "habits",
              "version": "1.0.0",
              "orientation": "portrait",
              "icon": "./assets/images/icon.png",
              "scheme": "habits",
              "userInterfaceStyle": "light",
              "ios": {
                "bundleIdentifier": "com.yourname.habits"
              },
              "android": {
                "package": "com.yourname.habits",
                "adaptiveIcon": {
                  "backgroundColor": "#2563EB",
                  "foregroundImage": "./assets/images/android-icon-foreground.png",
                  "monochromeImage": "./assets/images/android-icon-monochrome.png"
                }
              },
              "web": {
                "favicon": "./assets/images/favicon.png"
              },
              "plugins": [
                "expo-router",
                [
                  "expo-splash-screen",
                  {
                    "backgroundColor": "#2563EB",
                    "image": "./assets/images/splash-icon.png",
                    "imageWidth": 200
                  }
                ]
              ],
              "experiments": {
                "typedRoutes": true,
                "reactCompiler": true
              }
            }
          }
      - file: terminal
        lang: sh
        text: |
          npx expo config --type public
          npx expo-doctor
    mistakes:
      - problem:
          en: "An icon with a transparent background or rounded corners. The store rejects it or the phone shows black corners."
          tr: "Saydam arka planlı ya da yuvarlatılmış köşeli ikon. Mağaza reddeder ya da telefon köşeleri siyah gösterir."
        fix:
          en: "The main `icon` must be a solid, full square. The system rounds it. Only the Android foreground and the splash icon use transparency."
          tr: "Ana `icon` dolu, tam bir kare olmalı. Yuvarlatmayı sistem yapar. Sadece Android ön katmanı ve açılış ikonu saydamlık kullanır."
      - problem:
          en: "Choosing a placeholder app id like com.example.app and publishing with it."
          tr: "com.example.app gibi bir yer tutucu uygulama id'si seçip onunla yayınlamak."
        fix:
          en: "The id is the permanent identity of your app on the stores and cannot be changed later. Choose the real one now."
          tr: "Id, uygulamanın mağazalardaki kalıcı kimliğidir ve sonradan değiştirilemez. Gerçeğini şimdi seç."
    quiz:
      - q:
          en: "Where do you see the new splash screen?"
          tr: "Yeni açılış ekranını nerede görürsün?"
        options:
          en: ["In Expo Go, right away", "In a real build of your app", "Only on the store page"]
          tr: ["Hemen Expo Go'da", "Uygulamanın gerçek bir build'inde", "Sadece mağaza sayfasında"]
        answer: 1
        why:
          en: "Expo Go has its own icon and splash. Yours are part of the native app, so you see them after you build it."
          tr: "Expo Go'nun kendi ikonu ve açılış ekranı var. Seninkiler native uygulamanın parçası; bu yüzden build ettikten sonra görürsün."
    sources:
      - title: Expo, splash screen and app icon
        url: https://docs.expo.dev/develop/user-interface/splash-screen-and-app-icon/
      - title: Expo, app config reference
        url: https://docs.expo.dev/versions/latest/config/app/
      - title: Android, adaptive icon design
        url: https://developer.android.com/develop/ui/compose/system/icon_design_adaptive

  - id: eas-build
    stage: packaging
    title:
      en: "Build an installable Android app with EAS Build"
      tr: "EAS Build ile kurulabilir bir Android uygulaması build etme"
    minutes: 60
    needs: [icon-splash]
    why:
      en: "Expo Go is a playground. Your real app is a file: an APK or AAB on Android, an IPA on iOS. Building one needs the Android or iOS toolchain, which is big. EAS Build does it on Expo's servers, so you build a real Android app from a laptop without installing Android Studio. A build set to internal distribution gives you a link and a QR code that anyone can open to install it. No store and no fee are needed for that."
      tr: "Expo Go bir oyun alanı. Gerçek uygulaman bir dosyadır: Android'de APK ya da AAB, iOS'ta IPA. Birini üretmek büyük olan Android ya da iOS araç zincirini gerektirir. EAS Build bunu Expo'nun sunucularında yapar; böylece Android Studio kurmadan bir dizüstüyle gerçek bir Android uygulaması üretirsin. Internal distribution ayarlı bir build, herkesin açıp kurabileceği bir bağlantı ve QR kod verir. Bunun için mağaza da ücret de gerekmez."
    learn:
      en: |
        - What EAS Build does: uploads your project, builds it in the cloud, signs it, gives you a download link
        - Build profiles in `eas.json`: `preview` for testers, `production` for the stores
        - APK (installable file) versus AAB (the format the Play Store wants)
        - The free plan: a limited number of low-priority builds per month, see the numbers below
      tr: |
        - EAS Build'in yaptığı: projeni yükler, bulutta build eder, imzalar ve sana bir indirme bağlantısı verir
        - `eas.json` içindeki build profilleri: test edenler için `preview`, mağazalar için `production`
        - APK (kurulabilir dosya) ile AAB (Play Store'un istediği biçim) farkı
        - Ücretsiz plan: ayda sınırlı sayıda düşük öncelikli build, aşağıdaki sayılara bak
    do:
      en: |
        1. Install the EAS command line tool and sign in with your Expo account. (You can also use `npx eas-cli@latest` in place of `eas` every time.)
        2. Run `eas build:configure`. It links the project to your Expo account and creates `eas.json`. Replace the contents with the version below so that your profiles match this roadmap.
        3. Build an installable Android app: `eas build --platform android --profile preview`. The first time, let EAS generate the Android keystore (the signing key) for you. Wait: the free plan uses a low-priority queue, so it may take from minutes to much longer.
        4. When it finishes, the terminal prints a build page link and a QR code. Open the link on your Android phone, download the APK and install it. Android asks you to allow installing from this source once.
        5. Open the app. You see your icon, your splash screen, and the habits app running without Expo Go and without your computer.
        6. For iPhones the story is different: an installable iOS build needs a paid Apple Developer account, because Apple only lets signed apps run on real devices. Without the account, test iOS in the Simulator on a Mac. The Stores step explains the costs.
        7. Free plan numbers, as listed on the Expo pricing page when this was written: up to 15 Android and 15 iOS builds per month on the free plan, low-priority queue (the page warns that waits at peak times can be long), and updates for up to 1,000 monthly active users. The quota resets monthly, a free account is never charged extra, and when the builds are used up, new builds wait until the next month. Check expo.dev/pricing for the current numbers.
      tr: |
        1. EAS komut satırı aracını kur ve Expo hesabınla giriş yap. (Her seferinde `eas` yerine `npx eas-cli@latest` de kullanabilirsin.)
        2. `eas build:configure` çalıştır. Projeyi Expo hesabına bağlar ve `eas.json` oluşturur. Profillerin bu yol haritasıyla uyuşması için içeriği aşağıdaki sürümle değiştir.
        3. Kurulabilir bir Android uygulaması build et: `eas build --platform android --profile preview`. İlk seferde Android keystore'unu (imzalama anahtarı) EAS'in üretmesine izin ver. Bekle: ücretsiz plan düşük öncelikli kuyruk kullanır, dakikalardan çok daha uzuna kadar sürebilir.
        4. Bitince terminal bir build sayfası bağlantısı ve bir QR kod yazar. Bağlantıyı Android telefonunda aç, APK'yı indir ve kur. Android bir kereliğine bu kaynaktan kurulum izni ister.
        5. Uygulamayı aç. İkonunu, açılış ekranını ve alışkanlık uygulamasının Expo Go olmadan ve bilgisayarın olmadan çalıştığını görürsün.
        6. iPhone'larda durum farklı: kurulabilir bir iOS build'i ücretli bir Apple Developer hesabı ister, çünkü Apple gerçek cihazlarda sadece imzalı uygulamaların çalışmasına izin verir. Hesabın yoksa iOS'u bir Mac'te Simulator'da dene. Maliyetleri Mağazalar adımı anlatıyor.
        7. Ücretsiz plan sayıları (yazıldığı sırada Expo fiyat sayfasında listelendiği gibi): ücretsiz planda ayda 15'e kadar Android ve 15'e kadar iOS build'i, düşük öncelikli kuyruk (sayfa yoğun saatlerde beklemenin uzun olabileceği uyarısını yapıyor) ve 1.000 aylık aktif kullanıcıya kadar güncelleme. Kota aylık sıfırlanır, ücretsiz hesaptan asla ek ücret alınmaz ve build'ler bittiğinde yeni build'ler bir sonraki aya kadar bekler. Güncel sayılar için expo.dev/pricing sayfasına bak.
    code:
      - file: terminal
        lang: sh
        text: |
          npm install --global eas-cli
          eas login
          eas build:configure
          eas build --platform android --profile preview
      - file: eas.json
        lang: json
        text: |
          {
            "cli": {
              "version": ">= 25.0.0",
              "appVersionSource": "remote"
            },
            "build": {
              "preview": {
                "distribution": "internal",
                "channel": "preview"
              },
              "production": {
                "autoIncrement": true,
                "channel": "production"
              }
            },
            "submit": {
              "production": {}
            }
          }
    mistakes:
      - problem:
          en: "Building the `production` profile and trying to install the result on a phone. The file is an AAB, which cannot be installed directly."
          tr: "`production` profilini build edip sonucu telefona kurmaya çalışmak. Dosya bir AAB'dir ve doğrudan kurulamaz."
        fix:
          en: "For testers use the `preview` profile: `distribution: internal` makes EAS build an APK. Use `production` only to send to the Play Store."
          tr: "Test edenler için `preview` profilini kullan: `distribution: internal` EAS'in APK üretmesini sağlar. `production`'ı sadece Play Store'a göndermek için kullan."
      - problem:
          en: "The build fails and the log is long and confusing."
          tr: "Build başarısız oluyor ve log uzun ve karışık."
        fix:
          en: "Open the build page, find the phase that failed (Install dependencies, Run gradlew) and read the first red error, not the last. Run `npx expo-doctor` locally first, it catches many version problems."
          tr: "Build sayfasını aç, başarısız olan aşamayı (Install dependencies, Run gradlew) bul ve sonuncuyu değil, ilk kırmızı hatayı oku. Önce yerelde `npx expo-doctor` çalıştır, birçok sürüm sorununu yakalar."
    quiz:
      - q:
          en: "Why can you build for Android from a laptop that has no Android Studio?"
          tr: "Android Studio olmayan bir dizüstüyle neden Android için build edebiliyorsun?"
        options:
          en: ["The build runs on Expo's servers, which have the tools", "Expo Go is the finished app", "Android Studio is not needed for any app"]
          tr: ["Build, araçları olan Expo sunucularında çalışır", "Expo Go bitmiş uygulamanın kendisidir", "Hiçbir uygulama için Android Studio gerekmez"]
        answer: 0
        why:
          en: "EAS Build uploads your project to a cloud machine with the Android toolchain, builds and signs it, and gives you the file."
          tr: "EAS Build projeni Android araç zinciri olan bir bulut makinesine yükler, build eder, imzalar ve sana dosyayı verir."
    sources:
      - title: Expo, create your first build
        url: https://docs.expo.dev/build/setup/
      - title: Expo, internal distribution
        url: https://docs.expo.dev/build/internal-distribution/
      - title: Expo, eas.json reference
        url: https://docs.expo.dev/eas/json/
      - title: Expo, plans and pricing
        url: https://docs.expo.dev/billing/plans/

  - id: stores
    stage: deploy
    title:
      en: "Reach people: testers, Google Play and the App Store"
      tr: "İnsanlara ulaşma: test edenler, Google Play ve App Store"
    minutes: 60
    needs: [eas-build]
    why:
      en: "A built app can reach people in three ways. Some cost nothing and some cost money, and nobody tells beginners this clearly. You should know the real price before you decide, so that no step surprises you."
      tr: "Build edilmiş bir uygulama insanlara üç yolla ulaşabilir. Bazıları bedava, bazıları paralı ve bunu yeni başlayanlara kimse net söylemez. Karar vermeden önce gerçek fiyatı bilmelisin ki hiçbir adım seni şaşırtmasın."
    learn:
      en: |
        - The free path: share the APK or the EAS internal distribution link. On Android, anybody can install it. No store account is needed.
        - Google Play: a one-time registration fee of 25 USD. A new personal account must first run a closed test with at least 12 testers for 14 days before it can apply for production access.
        - Apple: the Apple Developer Program costs 99 USD per year and is needed for TestFlight, the App Store and installable iOS builds on real devices.
        - `eas submit` uploads a finished build to the store for you, after the accounts exist
      tr: |
        - Ücretsiz yol: APK'yı ya da EAS internal distribution bağlantısını paylaşmak. Android'de herkes kurabilir. Mağaza hesabı gerekmez.
        - Google Play: bir kereliğe 25 USD kayıt ücreti. Yeni bir kişisel hesap, production erişimi için başvurmadan önce en az 12 test edenle 14 gün boyunca kapalı test yapmak zorundadır.
        - Apple: Apple Developer Program yılda 99 USD'dir; TestFlight, App Store ve gerçek cihazlarda kurulabilir iOS build'leri için gereklidir.
        - Hesaplar olduktan sonra `eas submit` bitmiş bir build'i senin yerine mağazaya yükler
    do:
      en: |
        1. Decide your path. For learning, stay on the free path: send the install link from the previous step to friends with Android phones and collect their feedback. This is a real way to ship an app, and nothing more is needed for this roadmap.
        2. If you want Google Play: register at play.google.com/console and pay the one-time 25 USD fee. Create the app in Play Console, create a service account key as described in the Expo submit guide and upload it to EAS.
        3. Build an AAB with the production profile, then upload it. For the first upload, `eas submit` creates a release on the **internal testing track**, which is a small, private group of testers (up to a limited number of people you list by email). Later you can promote it to closed testing, open testing and production.
        4. Know Google's rule for new personal accounts: before production you must run a closed test with at least 12 testers opted in for 14 days in a row. Plan time for it.
        5. If you want the App Store: join the Apple Developer Program (99 USD per year). Then `eas build --platform ios` builds the app, `eas submit --platform ios` sends it to App Store Connect, where it appears in TestFlight for testers, and you submit it for App Review from there.
        6. Both stores want a store page: a short and a long description, screenshots, a privacy policy address and answers about what data the app collects (this app stores everything on the device and only contacts the quote service). Reviews take from hours to days.
        7. Free alternatives to trying iOS without the paid account: the iOS Simulator on a Mac, or running the web version in a browser.
      tr: |
        1. Yolunu seç. Öğrenmek için ücretsiz yolda kal: önceki adımdaki kurulum bağlantısını Android telefonu olan arkadaşlarına gönder ve geri bildirimlerini topla. Bu, uygulama yayınlamanın gerçek bir yolu ve bu yol haritası için başka bir şey gerekmez.
        2. Google Play istersen: play.google.com/console adresinden kayıt ol ve bir kereliğe 25 USD öde. Play Console'da uygulamayı oluştur, Expo submit rehberinde anlatıldığı gibi bir service account anahtarı oluştur ve EAS'e yükle.
        3. Production profiliyle bir AAB build et, sonra yükle. İlk yüklemede `eas submit` **internal testing track**'inde bir sürüm oluşturur; bu, e-postalarıyla eklediğin sınırlı sayıda kişiden oluşan küçük ve özel bir test grubudur. Sonra bunu kapalı teste, açık teste ve production'a yükseltebilirsin.
        4. Google'ın yeni kişisel hesaplar için kuralını bil: production'dan önce en az 12 test edenle, 14 gün üst üste açık kalan bir kapalı test yapmalısın. Buna zaman ayır.
        5. App Store istersen: Apple Developer Program'a katıl (yılda 99 USD). Sonra `eas build --platform ios` uygulamayı build eder, `eas submit --platform ios` App Store Connect'e gönderir; orada test edenler için TestFlight'ta görünür ve oradan App Review'a gönderirsin.
        6. İki mağaza da bir mağaza sayfası ister: kısa ve uzun açıklama, ekran görüntüleri, bir gizlilik politikası adresi ve uygulamanın hangi verileri topladığına dair cevaplar (bu uygulama her şeyi cihazda saklar ve sadece söz servisine bağlanır). İnceleme saatlerden günlere kadar sürer.
        7. Ücretli hesap olmadan iOS denemenin ücretsiz alternatifleri: Mac'te iOS Simulator ya da web sürümünü tarayıcıda çalıştırmak.
    code:
      - file: terminal
        lang: sh
        text: |
          eas build --platform android --profile production
          eas submit --platform android
          eas build --platform ios --profile production
          eas submit --platform ios
    mistakes:
      - problem:
          en: "Paying for developer accounts before the app is worth publishing."
          tr: "Uygulama yayınlamaya değer hale gelmeden geliştirici hesaplarına para ödemek."
        fix:
          en: "Start with free internal distribution and real testers. Pay when the app works and you have decided to publish. The Google fee is one-time; the Apple fee is yearly."
          tr: "Ücretsiz internal distribution ve gerçek test edenlerle başla. Uygulama çalışınca ve yayınlamaya karar verince öde. Google ücreti bir kerelik, Apple ücreti yıllıktır."
      - problem:
          en: "Expecting an update to appear on the stores right after `eas submit`."
          tr: "`eas submit`'ten hemen sonra güncellemenin mağazalarda görünmesini beklemek."
        fix:
          en: "Both stores process and review the build first. Allow hours to days, and for a new Google account the closed test period too."
          tr: "İki mağaza da önce build'i işler ve inceler. Saatlerden günlere kadar süre ver, yeni bir Google hesabı için kapalı test süresini de hesaba kat."
    quiz:
      - q:
          en: "Which way to get your app on other people's Android phones costs no store fee?"
          tr: "Uygulamanı başkalarının Android telefonlarına ulaştırmanın hangi yolunda mağaza ücreti yoktur?"
        options:
          en: ["Publishing on Google Play", "Sharing the APK from an internal distribution build", "Publishing on the App Store"]
          tr: ["Google Play'de yayınlamak", "Internal distribution build'inin APK'sını paylaşmak", "App Store'da yayınlamak"]
        answer: 1
        why:
          en: "An APK can be installed directly on Android, with no store. Google Play needs a 25 USD account and the App Store needs 99 USD per year."
          tr: "Bir APK Android'e mağazasız doğrudan kurulabilir. Google Play 25 USD'lik, App Store yılda 99 USD'lik hesap ister."
    sources:
      - title: Expo, submit to the Google Play Store
        url: https://docs.expo.dev/submit/android/
      - title: Expo, submit to the Apple App Store
        url: https://docs.expo.dev/submit/ios/
      - title: Google Play Console Help, app testing requirements for new personal accounts
        url: https://support.google.com/googleplay/android-developer/answer/14151465
      - title: Apple Developer Program
        url: https://developer.apple.com/programs/

  - id: updates
    stage: deploy
    title:
      en: "Ship fixes over the air with EAS Update"
      tr: "EAS Update ile düzeltmeleri havadan gönderme"
    minutes: 40
    needs: [eas-build]
    why:
      en: "A store release takes hours or days. A typo or a bug in your JavaScript should not wait that long. EAS Update sends new JavaScript and images straight to installed apps, over the air, so the next time the user opens the app it runs the fixed version. It cannot change native code, so anything that adds a native library still needs a new build."
      tr: "Mağaza sürümü saatler ya da günler alır. JavaScript'indeki bir yazım hatası ya da bug bu kadar beklememeli. EAS Update yeni JavaScript'i ve görselleri kurulu uygulamalara havadan doğrudan gönderir; kullanıcı uygulamayı bir sonraki açışında düzeltilmiş sürümü çalıştırır. Native kodu değiştiremez; yani native kütüphane ekleyen her şey için yine yeni build gerekir."
    learn:
      en: |
        - Two layers: the native build (changes rarely) and the JavaScript update on top (changes often)
        - `runtimeVersion` links an update to the builds that can run it, so an update never reaches an app whose native code it does not fit
        - Channels (`preview`, `production`) in `eas.json` decide which builds receive which updates
        - The update is downloaded in the background and starts on the next launch
      tr: |
        - İki katman: native build (nadiren değişir) ve üstündeki JavaScript güncellemesi (sık değişir)
        - `runtimeVersion` bir güncellemeyi onu çalıştırabilecek build'lere bağlar; böylece güncelleme, native koduna uymayan bir uygulamaya hiç ulaşmaz
        - `eas.json` içindeki kanallar (`preview`, `production`) hangi build'in hangi güncellemeyi alacağını belirler
        - Güncelleme arka planda indirilir ve bir sonraki açılışta başlar
    do:
      en: |
        1. Install the updates library: `npx expo install expo-updates`.
        2. Run `eas update:configure`. It adds `runtimeVersion` and the `updates.url` of your project to `app.json`, and the project id under `extra.eas`.
        3. Your `preview` and `production` profiles already have a `channel`. A build is tied to its channel when it is built, so **build again**: `eas build --platform android --profile preview`, and install the new APK.
        4. Change something visible in the JavaScript, for example the empty-list text in `src/app/index.tsx`, and commit.
        5. Publish the update to the `preview` channel: `eas update --channel preview --message "Change empty text"`.
        6. On the phone, close the app completely and open it. EAS Update downloads the new version in the background, so close and open it **a second time** to see the change.
        7. If an update is bad, publish a fixed one the same way, or run `eas update:rollback` to go back (see the EAS Update docs on rollbacks).
        8. Know the limits: free accounts get updates for up to 1,000 monthly active users. Never use updates to dodge the store rules for what your app is allowed to change.
      tr: |
        1. Güncelleme kütüphanesini kur: `npx expo install expo-updates`.
        2. `eas update:configure` çalıştır. `app.json`'a `runtimeVersion` ve projenin `updates.url` değerini, `extra.eas` altına da proje id'sini ekler.
        3. `preview` ve `production` profillerinde zaten bir `channel` var. Bir build, build edilirken kanalına bağlanır; bu yüzden **yeniden build et**: `eas build --platform android --profile preview` ve yeni APK'yı kur.
        4. JavaScript'te gözle görülür bir şeyi değiştir, örneğin `src/app/index.tsx` içindeki boş liste yazısını, ve commit et.
        5. Güncellemeyi `preview` kanalına yayınla: `eas update --channel preview --message "Change empty text"`.
        6. Telefonda uygulamayı tamamen kapat ve aç. EAS Update yeni sürümü arka planda indirir; değişikliği görmek için **ikinci kez** kapatıp aç.
        7. Bir güncelleme kötüyse düzeltilmişini aynı şekilde yayınla ya da geri dönmek için `eas update:rollback` çalıştır (EAS Update dokümanındaki rollback bölümüne bak).
        8. Sınırları bil: ücretsiz hesaplar 1.000 aylık aktif kullanıcıya kadar güncelleme alır. Güncellemeleri, uygulamanın neyi değiştirebileceğine dair mağaza kurallarını aşmak için asla kullanma.
    code:
      - file: terminal
        lang: sh
        text: |
          npx expo install expo-updates
          eas update:configure
          eas build --platform android --profile preview
          eas update --channel preview --message "Change empty text"
    mistakes:
      - problem:
          en: "Publishing an update that uses a new native library. Old builds crash or never receive it."
          tr: "Yeni bir native kütüphane kullanan bir güncelleme yayınlamak. Eski build'ler çöker ya da onu hiç almaz."
        fix:
          en: "Anything that changes native code needs a new build, and a new `runtimeVersion` so the update only goes to builds that contain it."
          tr: "Native kodu değiştiren her şey yeni bir build ve yeni bir `runtimeVersion` ister; böylece güncelleme sadece onu içeren build'lere gider."
      - problem:
          en: "The update seems not to arrive."
          tr: "Güncelleme gelmiyor gibi görünüyor."
        fix:
          en: "Check that the build and the update use the same channel and runtime version, and remember it takes two launches: the first downloads, the second runs it. Development builds and Expo Go do not behave like a release build."
          tr: "Build ve güncellemenin aynı kanalı ve runtime sürümünü kullandığını kontrol et ve iki açılış gerektiğini hatırla: ilki indirir, ikincisi çalıştırır. Development build'ler ve Expo Go, release build gibi davranmaz."
    quiz:
      - q:
          en: "Which change needs a new store build instead of an update?"
          tr: "Hangi değişiklik güncelleme yerine yeni bir mağaza build'i ister?"
        options:
          en: ["Fixing a typo in a screen text", "Adding a library that has native code", "Changing a colour"]
          tr: ["Bir ekran yazısındaki yazım hatasını düzeltmek", "Native kodu olan bir kütüphane eklemek", "Bir rengi değiştirmek"]
        answer: 1
        why:
          en: "Updates carry JavaScript and assets only. Native code is part of the installed binary."
          tr: "Güncellemeler sadece JavaScript ve asset taşır. Native kod kurulu binary'nin parçasıdır."
    sources:
      - title: Expo, EAS Update introduction
        url: https://docs.expo.dev/eas-update/introduction/
      - title: Expo, get started with EAS Update
        url: https://docs.expo.dev/eas-update/getting-started/
      - title: Expo, runtime versions
        url: https://docs.expo.dev/eas-update/runtime-versions/

  - id: crashes
    stage: monitoring
    title:
      en: "Find crashes you cannot see with Sentry"
      tr: "Göremediğin çökmeleri Sentry ile bulma"
    minutes: 45
    needs: [updates]
    why:
      en: "When your app crashes on someone else's phone you get no message, only a bad review. A crash reporter sends you the error, the screen, the device and the version, so you can fix it. Sentry is the service that Expo's docs recommend, and its free plan is enough for a small app."
      tr: "Uygulaman başkasının telefonunda çökünce sana mesaj gelmez, sadece kötü bir yorum gelir. Bir çökme raporlayıcı sana hatayı, ekranı, cihazı ve sürümü gönderir; böylece düzeltebilirsin. Sentry, Expo dokümanının önerdiği servis ve ücretsiz planı küçük bir uygulama için yeterli."
    learn:
      en: |
        - What a crash report contains: a stack trace, the device, the app version and the steps before the error
        - Why source maps matter: the shipped code is compressed, and source maps let Sentry show your real file names and lines
        - A DSN is an address for sending errors. It is not a secret, but the auth token for uploading source maps is.
        - Look at the reports, group them, and fix the ones that affect the most people first
      tr: |
        - Bir çökme raporunda ne var: stack trace, cihaz, uygulama sürümü ve hatadan önceki adımlar
        - Source map'ler neden önemli: yayınlanan kod sıkıştırılmıştır, source map'ler Sentry'nin gerçek dosya adlarını ve satırları göstermesini sağlar
        - DSN, hataları göndermek için bir adrestir. Gizli değildir ama source map yüklemek için kullanılan auth token gizlidir.
        - Raporlara bak, grupla ve en çok kişiyi etkileyenleri önce düzelt
    do:
      en: |
        1. Create a free account at sentry.io and a project of type **React Native**. The free Developer plan allows 5,000 errors per month for 1 user (sentry.io/pricing). Copy the **DSN** of the project.
        2. Install the SDK: `npx expo install @sentry/react-native`. You can also run Sentry's wizard (`npx @sentry/wizard@latest -i reactNative`), which does steps 3 to 5 for you.
        3. Create `metro.config.js` in the project root, so that Sentry's tooling gives every bundle a debug id.
        4. In `app.json` set the Sentry plugin in `plugins` (only the `plugins` part is shown), with your organization and project slugs. The install command may already have added a bare `"@sentry/react-native"` entry; remove it and keep the one below.
        5. In `src/app/_layout.tsx` start Sentry and wrap the root layout (see the code). Put the DSN in a `.env` file as `EXPO_PUBLIC_SENTRY_DSN=...`. A DSN may be public, the auth token may not.
        6. Add the token for source maps as a **secret** in your EAS project (expo.dev, project, environment variables, with the sensitive visibility) named `SENTRY_AUTH_TOKEN`, and never commit it. Add `.env` to `.gitignore` if it is not already there.
        7. Make a new preview build. Then, in a place you will remove right after, call `Sentry.captureException(new Error('Test error from Habits'))` once, for example in the Save token handler, and see the report in Sentry. Remove your test line.
        8. With updates, upload the source maps for each update too: `eas update --branch preview && npx sentry-expo-upload-sourcemaps dist` (see the Expo Sentry guide).
      tr: |
        1. sentry.io'da ücretsiz bir hesap ve **React Native** tipinde bir proje oluştur. Ücretsiz Developer plan, 1 kullanıcı için ayda 5.000 hataya izin verir (sentry.io/pricing). Projenin **DSN**'ini kopyala.
        2. SDK'yı kur: `npx expo install @sentry/react-native`. Sentry'nin wizard'ını da çalıştırabilirsin (`npx @sentry/wizard@latest -i reactNative`); 3'ten 5'e kadar olan adımları senin yerine yapar.
        3. Sentry araçları her bundle'a bir debug id versin diye proje köküne `metro.config.js` oluştur.
        4. `app.json` içinde `plugins` kısmına, organization ve project slug'larınla Sentry plugin'ini koy (sadece `plugins` kısmı gösteriliyor). Kurulum komutu `"@sentry/react-native"` diye çıplak bir satırı kendiliğinden eklemiş olabilir; onu sil, aşağıdakini tut.
        5. `src/app/_layout.tsx` içinde Sentry'yi başlat ve kök layout'u sar (koda bak). DSN'i `.env` dosyasına `EXPO_PUBLIC_SENTRY_DSN=...` olarak yaz. DSN herkese açık olabilir, auth token olamaz.
        6. Source map'ler için token'ı EAS projene **secret** olarak ekle (expo.dev, proje, environment variables, sensitive görünürlükle), adı `SENTRY_AUTH_TOKEN` olsun ve asla commit etme. `.env` yoksa `.gitignore`'a ekle.
        7. Yeni bir preview build al. Sonra hemen kaldıracağın bir yerde, örneğin Save token işleyicisinde, bir kez `Sentry.captureException(new Error('Test error from Habits'))` çağır ve raporu Sentry'de gör. Test satırını sil.
        8. Güncellemelerde her güncelleme için de source map yükle: `eas update --branch preview && npx sentry-expo-upload-sourcemaps dist` (Expo Sentry rehberine bak).
    code:
      - file: terminal
        lang: sh
        text: |
          npx expo install @sentry/react-native
      - file: metro.config.js
        lang: js
        text: |
          const { getSentryExpoConfig } = require('@sentry/react-native/metro');

          const config = getSentryExpoConfig(__dirname);

          module.exports = config;
      - file: app.json
        lang: json
        text: |
          {
            "expo": {
              "plugins": [
                "expo-router",
                [
                  "expo-splash-screen",
                  {
                    "backgroundColor": "#2563EB",
                    "image": "./assets/images/splash-icon.png",
                    "imageWidth": 200
                  }
                ],
                [
                  "@sentry/react-native/expo",
                  {
                    "url": "https://sentry.io/",
                    "project": "your-project-slug",
                    "organization": "your-organization-slug"
                  }
                ]
              ]
            }
          }
      - file: src/app/_layout.tsx
        lang: tsx
        text: |
          import * as Sentry from '@sentry/react-native';
          import { Link, Stack } from 'expo-router';
          import { SQLiteProvider } from 'expo-sqlite';
          import { Suspense } from 'react';
          import { ActivityIndicator, View } from 'react-native';

          import { migrate } from '@/db';
          import { HabitsProvider } from '@/habits-context';

          Sentry.init({
            dsn: process.env.EXPO_PUBLIC_SENTRY_DSN,
            // Only report from real builds, not while you develop.
            enabled: !__DEV__,
          });

          function Loading() {
            return (
              <View style={{ flex: 1, alignItems: 'center', justifyContent: 'center' }}>
                <ActivityIndicator />
              </View>
            );
          }

          function RootLayout() {
            return (
              <Suspense fallback={<Loading />}>
                <SQLiteProvider databaseName="habits.db" onInit={migrate} useSuspense>
                  <HabitsProvider>
                    <Stack>
                      <Stack.Screen
                        name="index"
                        options={{
                          title: 'Habits',
                          headerRight: () => <Link href="/settings">Settings</Link>,
                        }}
                      />
                      <Stack.Screen name="new" options={{ title: 'New habit', presentation: 'modal' }} />
                      <Stack.Screen name="habit/[id]" options={{ title: 'Habit' }} />
                      <Stack.Screen name="settings" options={{ title: 'Settings' }} />
                    </Stack>
                  </HabitsProvider>
                </SQLiteProvider>
              </Suspense>
            );
          }

          export default Sentry.wrap(RootLayout);
    mistakes:
      - problem:
          en: "Committing the Sentry auth token (or any `SENTRY_AUTH_TOKEN` in `.env`) to Git."
          tr: "Sentry auth token'ını (ya da `.env` içindeki `SENTRY_AUTH_TOKEN`'ı) Git'e commit etmek."
        fix:
          en: "Keep it only as an EAS secret or in an untracked `.env.local`. If it leaked, revoke it in Sentry and create a new one."
          tr: "Sadece EAS secret olarak ya da takip edilmeyen bir `.env.local` içinde tut. Sızdıysa Sentry'de iptal et ve yenisini oluştur."
      - problem:
          en: "Reports show unreadable minified code."
          tr: "Raporlar okunamayan sıkıştırılmış kodu gösteriyor."
        fix:
          en: "Source maps were not uploaded. Check the build log for the Sentry upload step and that `SENTRY_AUTH_TOKEN` is set for the build. Updates need their own upload."
          tr: "Source map'ler yüklenmemiş. Build log'unda Sentry yükleme adımına ve build için `SENTRY_AUTH_TOKEN`'ın tanımlı olduğuna bak. Güncellemelerin kendi yüklemesi gerekir."
    quiz:
      - q:
          en: "Which of these may be public, and which must stay secret?"
          tr: "Bunlardan hangisi herkese açık olabilir, hangisi gizli kalmalı?"
        options:
          en: ["Both are secret", "The DSN may be public; the auth token must be secret", "The auth token may be public; the DSN must be secret"]
          tr: ["İkisi de gizli", "DSN herkese açık olabilir; auth token gizli olmalı", "Auth token herkese açık olabilir; DSN gizli olmalı"]
        answer: 1
        why:
          en: "The DSN only lets the app send errors in. The auth token can create releases and upload files to your account."
          tr: "DSN sadece uygulamanın hata göndermesini sağlar. Auth token hesabında release oluşturabilir ve dosya yükleyebilir."
    sources:
      - title: Expo, using Sentry
        url: https://docs.expo.dev/guides/using-sentry/
      - title: Sentry for React Native, Expo setup
        url: https://docs.sentry.io/platforms/react-native/manual-setup/expo/
      - title: Expo, EAS Observe
        url: https://docs.expo.dev/eas/observe/introduction/

  - id: next
    stage: advanced
    title:
      en: "Where to go next"
      tr: "Sonra nereye gidilir"
    minutes: 30
    needs: [crashes]
    why:
      en: "You built, tested, built in the cloud and shipped a phone app. These are the next skills that real apps need. Do them one at a time, each in your own habits app, as a small experiment."
      tr: "Bir telefon uygulaması yazdın, test ettin, bulutta build ettin ve yayınladın. Bunlar gerçek uygulamaların ihtiyaç duyduğu sonraki beceriler. Teker teker, kendi alışkanlık uygulamanda küçük birer deney olarak yap."
    learn:
      en: |
        - Development builds (`expo-dev-client`): your own app with the developer tools, needed once you add libraries Expo Go does not include
        - Notifications (`expo-notifications`): a daily reminder to tick off your habits, which needs a development build to test
        - Animations with Reanimated, and gestures with Gesture Handler (both already in the template)
        - Automating builds and updates with EAS Workflows or GitHub Actions
        - Accessibility: test with the screen reader (TalkBack on Android) and large text
        - A back end for sync and login, then use SecureStore for the tokens, as you learned
      tr: |
        - Development build'ler (`expo-dev-client`): geliştirici araçlarıyla kendi uygulaman; Expo Go'nun içermediği kütüphaneler ekleyince gerekir
        - Bildirimler (`expo-notifications`): alışkanlıklarını işaretlemen için günlük hatırlatma; test için development build gerekir
        - Reanimated ile animasyonlar, Gesture Handler ile hareketler (ikisi de şablonda zaten var)
        - Build ve güncellemeleri EAS Workflows ya da GitHub Actions ile otomatikleştirmek
        - Erişilebilirlik: ekran okuyucuyla (Android'de TalkBack) ve büyük yazıyla test et
        - Senkronizasyon ve giriş için bir back end; token'lar için öğrendiğin gibi SecureStore
    do:
      en: |
        1. Pick one idea: a daily reminder, an edit-name screen, or a weekly history chart. Write down in one sentence what "done" means.
        2. Create a branch (`git switch -c reminders`), build it, and test on your phone.
        3. Add a test for the logic you wrote.
        4. Check the Expo SDK changelog twice a year. Upgrading is easier when you do it often: `npx expo install expo@latest --fix`, then `npx expo-doctor`.
        5. Read the docs of the things you used: Expo Router, Expo SQLite and EAS. Reading them end to end once teaches more than any video.
        6. Learn the web side: a Next.js back end for sync, or the Docker and cloud roadmaps for hosting it.
      tr: |
        1. Bir fikir seç: günlük hatırlatma, isim düzenleme ekranı ya da haftalık geçmiş grafiği. "Bitti"nin ne demek olduğunu tek cümleyle yaz.
        2. Bir branch aç (`git switch -c reminders`), build et ve telefonunda test et.
        3. Yazdığın mantık için bir test ekle.
        4. Expo SDK changelog'una yılda iki kez bak. Yükseltme sık yapılınca daha kolaydır: `npx expo install expo@latest --fix`, sonra `npx expo-doctor`.
        5. Kullandığın şeylerin dokümanını oku: Expo Router, Expo SQLite ve EAS. Baştan sona bir kez okumak herhangi bir videodan çok öğretir.
        6. Web tarafını öğren: senkronizasyon için bir Next.js back end'i ya da barındırmak için Docker ve cloud yol haritaları.
    code:
      - file: terminal
        lang: sh
        text: |
          git switch -c reminders
          npx expo install expo-notifications
          npx expo install expo@latest --fix
          npx expo-doctor
    mistakes:
      - problem:
          en: "Upgrading the Expo SDK by editing version numbers in package.json by hand."
          tr: "Expo SDK'yı package.json'daki sürüm numaralarını elle değiştirerek yükseltmek."
        fix:
          en: "Use `npx expo install expo@latest --fix`, which sets every Expo package to the version that matches the SDK, and read the SDK upgrade notes."
          tr: "Her Expo paketini SDK'ya uyan sürüme ayarlayan `npx expo install expo@latest --fix` kullan ve SDK yükseltme notlarını oku."
      - problem:
          en: "Adding a native library and being surprised that it does not work in Expo Go."
          tr: "Bir native kütüphane eklemek ve Expo Go'da çalışmamasına şaşırmak."
        fix:
          en: "Expo Go contains a fixed set of libraries. Make a development build with `expo-dev-client` when you need others."
          tr: "Expo Go sabit bir kütüphane kümesi içerir. Başkalarına ihtiyacın olunca `expo-dev-client` ile bir development build al."
    quiz:
      - q:
          en: "When do you need a development build instead of Expo Go?"
          tr: "Ne zaman Expo Go yerine development build gerekir?"
        options:
          en: ["When you add a native library that Expo Go does not include", "When you change a colour", "Never"]
          tr: ["Expo Go'nun içermediği bir native kütüphane eklediğinde", "Bir rengi değiştirdiğinde", "Hiçbir zaman"]
        answer: 0
        why:
          en: "Expo Go ships with a fixed set of native modules. A development build is your own app with exactly the modules you choose."
          tr: "Expo Go sabit bir native modül kümesiyle gelir. Development build, seçtiğin modüllerle kendi uygulamandır."
    sources:
      - title: Expo, development builds
        url: https://docs.expo.dev/develop/development-builds/introduction/
      - title: Expo, upgrade the SDK
        url: https://docs.expo.dev/workflow/upgrading-expo-sdk-walkthrough/
      - title: React Native, accessibility
        url: https://reactnative.dev/docs/accessibility
