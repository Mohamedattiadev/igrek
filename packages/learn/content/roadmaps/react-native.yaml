        lang: tsx
        text: |
          import { useRouter } from 'expo-router';
          import { useState } from 'react';
          import { Pressable, StyleSheet, Text, TextInput, View } from 'react-native';

          import { useHabits } from '@/habits-context';
          import { colors } from '@/theme';

          export default function NewHabitScreen() {
            const router = useRouter();
            const { add } = useHabits();
            const [name, setName] = useState('');
            const [error, setError] = useState<string | null>(null);

            function submit() {
              const clean = name.trim();
              if (clean.length === 0) {
                setError('Give your habit a name.');
                return;
              }
              add(clean);
              router.back();
            }

            return (
              <View style={styles.screen}>
                <Text style={styles.label}>What will you do every day?</Text>
                <TextInput
                  style={styles.input}
                  value={name}
                  onChangeText={(text) => {
                    setName(text);
                    setError(null);
                  }}
                  placeholder="Drink water"
                  maxLength={40}
                  autoFocus
                  returnKeyType="done"
                  onSubmitEditing={submit}
                  accessibilityLabel="Habit name"
                />
                {error ? (
                  <Text style={styles.error} accessibilityRole="alert">
                    {error}
                  </Text>
                ) : null}
                <Pressable style={styles.save} onPress={submit} accessibilityRole="button">
                  <Text style={styles.saveText}>Save habit</Text>
                </Pressable>
              </View>
            );
          }

          const styles = StyleSheet.create({
            screen: { flex: 1, backgroundColor: colors.background, padding: 16 },
            label: { fontSize: 16, fontWeight: '600', color: colors.text, marginBottom: 8 },
            input: {
              backgroundColor: colors.card,
              borderColor: colors.border,
              borderWidth: 1,
              borderRadius: 10,
              padding: 12,
              fontSize: 16,
              color: colors.text,
            },
            error: { color: colors.danger, marginTop: 8 },
            save: {
              marginTop: 16,
              alignItems: 'center',
              backgroundColor: colors.accent,
              padding: 14,
              borderRadius: 10,
            },
            saveText: { color: colors.onAccent, fontWeight: '600', fontSize: 16 },
          });
      - file: src/app/habit/[id].tsx
        lang: tsx
        text: |
          import { Stack, useLocalSearchParams, useRouter } from 'expo-router';
          import { Alert, Pressable, StyleSheet, Text, View } from 'react-native';

          import { useHabits } from '@/habits-context';
          import { streak } from '@/streak';
          import { colors } from '@/theme';

          export default function HabitScreen() {
            const { id } = useLocalSearchParams<{ id: string }>();
            const router = useRouter();
            const { habits, remove } = useHabits();
            const habit = habits.find((item) => item.id === Number(id));

            if (!habit) {
              return (
                <View style={styles.screen}>
                  <Text style={styles.muted}>This habit does not exist any more.</Text>
                </View>
              );
            }

            const confirmRemove = () => {
              Alert.alert('Delete habit?', `"${habit.name}" and its history will be removed.`, [
                { text: 'Cancel', style: 'cancel' },
                {
                  text: 'Delete',
                  style: 'destructive',
                  onPress: () => {
                    remove(habit.id);
                    router.back();
                  },
                },
              ]);
            };

            return (
              <View style={styles.screen}>
                <Stack.Screen options={{ title: habit.name }} />
                <Text style={styles.big}>{streak(habit.doneDates)}</Text>
                <Text style={styles.muted}>day streak</Text>
                <Text style={styles.total}>Done on {habit.doneDates.length} days in total</Text>
                <Pressable style={styles.delete} onPress={confirmRemove} accessibilityRole="button">
                  <Text style={styles.deleteText}>Delete habit</Text>
                </Pressable>
              </View>
            );
          }

          const styles = StyleSheet.create({
            screen: { flex: 1, backgroundColor: colors.background, padding: 16, alignItems: 'center' },
            big: { fontSize: 72, fontWeight: '700', color: colors.accent, marginTop: 32 },
            muted: { color: colors.muted, fontSize: 16 },
            total: { color: colors.text, marginTop: 24, fontSize: 16 },
            delete: { marginTop: 'auto', padding: 14 },
            deleteText: { color: colors.danger, fontWeight: '600', fontSize: 16 },
          });
    mistakes:
      - problem:
          en: "The keyboard covers the Save button on a long form."
          tr: "Uzun bir formda klavye Kaydet düğmesini kapatıyor."
        fix:
          en: "For forms taller than one screen, wrap the content in a `ScrollView` with `keyboardShouldPersistTaps=\"handled\"` or use `KeyboardAvoidingView`. This short form fits above the keyboard."
          tr: "Bir ekrandan uzun formlarda içeriği `keyboardShouldPersistTaps=\"handled\"` olan bir `ScrollView` içine al ya da `KeyboardAvoidingView` kullan. Bu kısa form klavyenin üstüne sığar."
      - problem:
          en: "Saving the name without `trim()`, so a name of only spaces passes."
          tr: "İsmi `trim()` kullanmadan kaydetmek; sadece boşluktan oluşan isim geçer."
        fix:
          en: "Trim first and validate the trimmed text, as in `submit`."
          tr: "Önce kırp ve kırpılmış metni doğrula, `submit`'teki gibi."
    quiz:
      - q:
          en: "Why ask before deleting a habit?"
          tr: "Alışkanlığı silmeden önce neden soruyoruz?"
        options:
          en: ["Deleting is slow", "A tap is easy to make by mistake and deleting cannot be undone", "Alert is required by the store"]
          tr: ["Silme yavaş", "Yanlışlıkla dokunmak kolay ve silme geri alınamaz", "Mağaza Alert'i zorunlu kılıyor"]
        answer: 1
        why:
          en: "Fingers slip. A short confirmation protects people from losing their history."
          tr: "Parmak kayar. Kısa bir onay, insanların geçmişlerini kaybetmesini önler."
