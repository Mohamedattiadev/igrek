id: linux-server
title: Linux server
summary:
  en: "From a terminal you have barely used to your own web app on your own Linux server. You practise in a free virtual machine first, then repeat it on a cheap or free VPS with a firewall, safe SSH, HTTPS, logs, backups and automatic updates."
  tr: "Pek kullanmadığın bir terminalden, kendi Linux sunucundaki kendi web uygulamana. Önce ücretsiz bir sanal makinede pratik yaparsın, sonra aynısını ucuz ya da ücretsiz bir VPS'te güvenlik duvarı, güvenli SSH, HTTPS, log, yedek ve otomatik güncellemeyle tekrarlarsın."
teacher: devops
project:
  en: "hello-server: a tiny web app (Python standard library only) that runs as a systemd service behind Nginx on Ubuntu 26.04 LTS, with a firewall, key-only SSH, fail2ban, a free HTTPS certificate, a deploy script, a disk and memory check, nightly backups and automatic security updates."
  tr: "hello-server: Ubuntu 26.04 LTS üzerinde Nginx'in arkasında systemd servisi olarak çalışan küçük bir web uygulaması (sadece Python standart kütüphanesi). Güvenlik duvarı, sadece anahtarla SSH, fail2ban, ücretsiz HTTPS sertifikası, deploy script'i, disk ve bellek kontrolü, gece yedeği ve otomatik güvenlik güncellemeleri var."
detect:
  files: [server]
version: "26.04"
latest: eol:ubuntu
checked: 2026-10
sheets: [linux, ssh, nginx, bash, cron]
steps:
  - id: vm
    stage: setup
    title:
      en: "Get a practice server: a free virtual machine"
      tr: "Bir pratik sunucu edin: ücretsiz bir sanal makine"
    minutes: 40
    why:
      en: "A server is just a computer you control from far away. Mistakes on a server can lock you out or break it, so you first practise on a virtual machine (VM), a pretend computer inside your own computer. If you ruin it, you delete it and make a new one in a minute."
      tr: "Sunucu, uzaktan yönettiğin bir bilgisayardan ibarettir. Sunucuda yapılan hatalar seni dışarıda bırakabilir ya da sunucuyu bozabilir. Bu yüzden önce sanal makinede (VM) pratik yaparsın: kendi bilgisayarının içindeki hayali bir bilgisayar. Bozarsan silip bir dakikada yenisini yaparsın."
    learn:
      en: |
        - What a Linux server, a VM and a VPS (a rented VM on the internet) are
        - Why we use Ubuntu LTS: it gets security fixes for years (26.04 is the current LTS)
        - How to make, open and delete a VM with Multipass, a free tool from Canonical
      tr: |
        - Linux sunucusunun, VM'in ve VPS'in (internette kiralanan bir VM) ne olduğu
        - Neden Ubuntu LTS kullandığımız: yıllarca güvenlik düzeltmesi alır (26.04 şu anki LTS)
        - Canonical'ın ücretsiz aracı Multipass ile VM oluşturmak, açmak ve silmek
    do:
      en: |
        1. Install **Multipass** from canonical.com/multipass/install (free; Linux, macOS and Windows). If it does not work on your computer, install VirtualBox and an Ubuntu Server 26.04 ISO from ubuntu.com/download/server instead; the rest of the roadmap is the same.
        2. Open a terminal and create the VM. Without an image name, Multipass uses the newest Ubuntu LTS.
        3. Check which Ubuntu you got, then note the VM's IPv4 address (you will need it later).
        4. Make a project folder on your own computer. All files of this roadmap live in it.
        5. Optional but good: save it with Git (`git init`).
      tr: |
        1. **Multipass**'i canonical.com/multipass/install adresinden kur (ücretsiz; Linux, macOS ve Windows). Bilgisayarında çalışmazsa onun yerine VirtualBox ve ubuntu.com/download/server adresinden Ubuntu Server 26.04 ISO'su kur; yol haritasının geri kalanı aynıdır.
        2. Bir terminal aç ve VM'i oluştur. İmaj adı vermezsen Multipass en yeni Ubuntu LTS'i kullanır.
        3. Hangi Ubuntu'yu aldığını kontrol et, sonra VM'in IPv4 adresini not al (sonra lazım olacak).
        4. Kendi bilgisayarında bir proje klasörü aç. Bu yol haritasının bütün dosyaları orada duracak.
        5. İsteğe bağlı ama iyi olur: Git ile kaydet (`git init`).
    code:
      - file: terminal
        lang: sh
        text: |
          multipass launch --name practice --cpus 1 --memory 1G --disk 10G
          multipass exec practice -- cat /etc/os-release
          multipass info practice
          mkdir hello-server
          cd hello-server
          git init
    mistakes:
      - problem:
          en: "multipass launch fails because virtualization is off."
          tr: "multipass launch, sanallaştırma kapalı olduğu için hata veriyor."
        fix:
          en: "Turn on virtualization (VT-x or AMD-V) in the BIOS/UEFI. On Windows, Multipass needs Hyper-V or VirtualBox; its install page lists the options."
          tr: "BIOS/UEFI'den sanallaştırmayı (VT-x ya da AMD-V) aç. Windows'ta Multipass, Hyper-V ya da VirtualBox ister; kurulum sayfası seçenekleri listeler."
      - problem:
          en: "Being afraid to break the VM."
          tr: "VM'i bozmaktan korkmak."
        fix:
          en: "That is what it is for. `multipass delete practice --purge` removes it, and the launch command makes a fresh one."
          tr: "VM tam da bunun için var. `multipass delete practice --purge` onu siler, launch komutu da yenisini yapar."
    quiz:
      - q:
          en: "Why practise on a VM before touching a real server?"
          tr: "Gerçek sunucuya dokunmadan önce neden VM'de pratik yapıyoruz?"
        options:
          en:
            - "A VM is faster than a real server"
            - "A mistake costs nothing: you delete the VM and start again"
            - "Real servers cannot run Ubuntu"
          tr:
            - "VM gerçek sunucudan daha hızlıdır"
            - "Hata hiçbir şeye mal olmaz: VM'i silip baştan başlarsın"
            - "Gerçek sunucular Ubuntu çalıştıramaz"
        answer: 1
        why:
          en: "A VM is disposable. On a real server a wrong firewall or SSH change can lock you out."
          tr: "VM harcanabilir. Gerçek sunucuda yanlış bir güvenlik duvarı ya da SSH ayarı seni dışarıda bırakabilir."
    sources:
      - title: Multipass, get started
        url: https://documentation.ubuntu.com/multipass/latest/tutorial/
      - title: Multipass, launch command
        url: https://documentation.ubuntu.com/multipass/latest/reference/command-line-interface/launch/
      - title: Ubuntu release cycle and LTS
        url: https://ubuntu.com/about/release-cycle

  - id: app
    stage: first-code
    title:
      en: "The terminal and files: write and run the app"
      tr: "Terminal ve dosyalar: uygulamayı yaz ve çalıştır"
    minutes: 40
    needs: [vm]
    why:
      en: "On a server there is no mouse and no windows, only the terminal. You will use ten or so commands all the time. We learn them by sending a tiny web app to the VM and running it."
      tr: "Sunucuda fare de pencere de yok, sadece terminal var. On kadar komutu sürekli kullanacaksın. Onları, VM'e küçük bir web uygulaması gönderip çalıştırarak öğreniriz."
    learn:
      en: |
        - Where you are (`pwd`), what is here (`ls -l`), moving (`cd`), reading (`cat`), making (`mkdir`), copying (`cp`), moving and renaming (`mv`), deleting (`rm`)
        - What an absolute path (`/opt/app`) and a relative path (`app.py`) are
        - What `127.0.0.1` means: a program that listens there can only be reached from the same machine
        - Ctrl+C stops a running program
      tr: |
        - Neredesin (`pwd`), burada ne var (`ls -l`), gezinme (`cd`), okuma (`cat`), oluşturma (`mkdir`), kopyalama (`cp`), taşıma ve yeniden adlandırma (`mv`), silme (`rm`)
        - Mutlak yol (`/opt/app`) ile göreli yolun (`app.py`) ne olduğu
        - `127.0.0.1`'in anlamı: orada dinleyen programa sadece aynı makineden ulaşılır
        - Ctrl+C çalışan bir programı durdurur
    do:
      en: |
        1. In your project folder, create `app.py` with the code below. It uses only what comes with Python, so there is nothing to install.
        2. Send it to the VM, then open a shell inside the VM.
        3. Look around with `pwd`, `ls -l` and `cat app.py`. Run `python3 app.py`.
        4. Leave it running. In a second terminal on your computer, ask it for the page and the health check.
        5. Go back to the first terminal and press Ctrl+C to stop it. Type `exit` to leave the VM.
      tr: |
        1. Proje klasöründe aşağıdaki kodla `app.py` oluştur. Sadece Python'la gelenleri kullanır, kurulacak bir şey yok.
        2. Dosyayı VM'e gönder, sonra VM'in içinde bir shell aç.
        3. `pwd`, `ls -l` ve `cat app.py` ile etrafa bak. `python3 app.py` çalıştır.
        4. Açık bırak. Bilgisayarındaki ikinci bir terminalde sayfayı ve sağlık kontrolünü iste.
        5. İlk terminale dön ve Ctrl+C ile durdur. VM'den çıkmak için `exit` yaz.
    code:
      - file: app.py
        lang: python
        text: |
          from http.server import BaseHTTPRequestHandler, HTTPServer

          HOST = "127.0.0.1"
          PORT = 8000


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/health":
                      body, kind = b"ok\n", "text/plain"
                  elif self.path == "/":
                      body, kind = b"<h1>Hello from my own server</h1>\n", "text/html"
                  else:
                      self.send_error(404)
                      return
                  self.send_response(200)
                  self.send_header("Content-Type", kind + "; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)


          if __name__ == "__main__":
              print(f"Listening on http://{HOST}:{PORT}", flush=True)
              HTTPServer((HOST, PORT), Handler).serve_forever()
      - file: terminal
        lang: sh
        text: |
          multipass transfer app.py practice:
          multipass shell practice
          # now inside the VM:
          pwd
          ls -l
          python3 app.py
          # second terminal on your computer:
          multipass exec practice -- curl -s http://127.0.0.1:8000/
          multipass exec practice -- curl -s http://127.0.0.1:8000/health
    mistakes:
      - problem:
          en: "\"Address already in use\" when starting the app."
          tr: "Uygulamayı başlatırken \"Address already in use\" hatası."
        fix:
          en: "Another copy still runs on port 8000. Find the terminal where it runs and press Ctrl+C."
          tr: "8000 portunda başka bir kopya hâlâ çalışıyor. Çalıştığı terminali bul ve Ctrl+C'ye bas."
      - problem:
          en: "Opening http://127.0.0.1:8000 in your computer's browser shows nothing."
          tr: "Bilgisayarının tarayıcısında http://127.0.0.1:8000 açınca hiçbir şey çıkmıyor."
        fix:
          en: "127.0.0.1 is always the machine you are on, and the app runs inside the VM. That is why we ask from inside the VM. Later Nginx makes it reachable from outside."
          tr: "127.0.0.1 her zaman o an bulunduğun makinedir, uygulama ise VM'in içinde çalışıyor. Bu yüzden VM'in içinden soruyoruz. İleride Nginx dışarıdan erişilebilir yapacak."
    quiz:
      - q:
          en: "The app listens on 127.0.0.1. Who can reach it?"
          tr: "Uygulama 127.0.0.1'de dinliyor. Ona kim ulaşabilir?"
        options:
          en:
            - "Anyone on the internet"
            - "Only programs on the same machine"
            - "Only people on the same Wi-Fi"
          tr:
            - "İnternetteki herkes"
            - "Sadece aynı makinedeki programlar"
            - "Sadece aynı Wi-Fi'daki kişiler"
        answer: 1
        why:
          en: "127.0.0.1 is the loopback address, the machine talking to itself. It is a safe place for an app that sits behind a reverse proxy."
          tr: "127.0.0.1 loopback adresidir, makinenin kendi kendine konuşması. Reverse proxy'nin arkasındaki bir uygulama için güvenli bir yerdir."
    sources:
      - title: GNU Coreutils manual
        url: https://www.gnu.org/software/coreutils/manual/coreutils.html
      - title: Python, http.server
        url: https://docs.python.org/3/library/http.server.html

  - id: users
    stage: basics
    title:
      en: "Users, sudo and updates"
      tr: "Kullanıcılar, sudo ve güncellemeler"
    minutes: 35
    needs: [app]
    why:
      en: "Root can do anything, so a mistake or a hacker with root is a disaster. Good servers use a normal user for you, a separate locked-down user for the app, and sudo only when needed. Updating first closes known holes."
      tr: "Root her şeyi yapabilir; bu yüzden root'la yapılan bir hata ya da root'u ele geçiren bir saldırgan felakettir. İyi sunucuda senin için normal bir kullanıcı, uygulama için ayrı ve kısıtlı bir kullanıcı vardır; sudo sadece gerektiğinde kullanılır. Önce güncellemek bilinen açıkları kapatır."
    learn:
      en: |
        - What root, a normal user, a group and `sudo` are
        - Why the app gets its own system user with no login (`webapp`)
        - `apt update` (refresh the list) versus `apt full-upgrade` (install the new versions)
        - File owners and permissions: who may read and write a folder
      tr: |
        - root, normal kullanıcı, grup ve `sudo`'nun ne olduğu
        - Uygulamaya neden giriş yapamayan kendi sistem kullanıcısının (`webapp`) verildiği
        - `apt update` (listeyi yenile) ile `apt full-upgrade` (yeni sürümleri kur) farkı
        - Dosya sahipleri ve izinler: bir klasörü kim okuyabilir, kim yazabilir
    do:
      en: |
        1. Open a shell in the VM: `multipass shell practice`. You are the user `ubuntu`, who can use `sudo`.
        2. Update the system. If the file `/var/run/reboot-required` exists afterwards, reboot with `sudo reboot` and open the shell again.
        3. Create the user `deploy` for yourself. It asks for a password; remember it. Put it in the `sudo` group.
        4. Create the system user `webapp`. It has no home folder and no login shell; only the app runs as it.
        5. Make the folder for the app. `deploy` owns it (so deploying needs no root), and `webapp` can only read it.
        6. Check the result with `id deploy` and `getent passwd webapp`.
      tr: |
        1. VM'de bir shell aç: `multipass shell practice`. `ubuntu` kullanıcısısın, `sudo` kullanabilir.
        2. Sistemi güncelle. Sonrasında `/var/run/reboot-required` dosyası varsa `sudo reboot` ile yeniden başlat ve shell'i tekrar aç.
        3. Kendin için `deploy` kullanıcısını oluştur. Şifre sorar; aklında tut. Onu `sudo` grubuna ekle.
        4. `webapp` sistem kullanıcısını oluştur. Ev klasörü ve giriş shell'i yok; uygulama sadece onunla çalışır.
        5. Uygulamanın klasörünü yap. Sahibi `deploy` (deploy için root gerekmesin), `webapp` ise sadece okuyabilir.
        6. Sonucu `id deploy` ve `getent passwd webapp` ile kontrol et.
    code:
      - file: terminal
        lang: sh
        text: |
          sudo apt update
          sudo apt full-upgrade -y
          ls /var/run/reboot-required
          sudo adduser deploy
          sudo usermod -aG sudo deploy
          sudo adduser --system --group --no-create-home webapp
          sudo install -d -o deploy -g deploy /opt/hello-server /opt/hello-server/current
          id deploy
          getent passwd webapp
          ls -ld /opt/hello-server/current
    mistakes:
      - problem:
          en: "Running everything as root (`sudo -i`) because it \"just works\"."
          tr: "\"Çalışıyor\" diye her şeyi root olarak (`sudo -i`) yapmak."
        fix:
          en: "Work as `deploy` and put `sudo` in front of only the commands that need it. Files you create as root are then owned by root and surprise you later."
          tr: "`deploy` olarak çalış, `sudo`'yu sadece gereken komutların önüne koy. Root olarak oluşturduğun dosyalar root'a ait olur ve sonra seni şaşırtır."
      - problem:
          en: "`usermod -G sudo deploy` without the `-a`."
          tr: "`-a` olmadan `usermod -G sudo deploy` yazmak."
        fix:
          en: "Without `-a` the user is removed from every other group. Always write `-aG`."
          tr: "`-a` olmazsa kullanıcı diğer bütün gruplardan çıkarılır. Her zaman `-aG` yaz."
    quiz:
      - q:
          en: "Why does the app run as its own user `webapp`?"
          tr: "Uygulama neden kendi kullanıcısı `webapp` ile çalışıyor?"
        options:
          en:
            - "So it can read more files"
            - "If the app is hacked, the attacker only gets a powerless user, not root"
            - "Linux does not allow apps to run as root"
          tr:
            - "Daha çok dosya okuyabilsin diye"
            - "Uygulama hacklenirse saldırgan root'u değil, güçsüz bir kullanıcıyı ele geçirir"
            - "Linux uygulamaların root olarak çalışmasına izin vermez"
        answer: 1
        why:
          en: "Least privilege: a program gets only the rights it needs, so a bug in it cannot touch the whole system."
          tr: "En az yetki ilkesi: program sadece ihtiyacı olan yetkiyi alır; içindeki bir hata bütün sisteme dokunamaz."
    sources:
      - title: Ubuntu Server, managing users
        url: https://documentation.ubuntu.com/server/how-to/security/user-management/
      - title: Ubuntu Server, package management (apt)
        url: https://documentation.ubuntu.com/server/how-to/software/package-management/
      - title: adduser (Ubuntu manpage)
        url: https://manpages.ubuntu.com/manpages/resolute/en/man8/adduser.8.html

  - id: keys
    stage: basics
    title:
      en: "SSH keys: log in without a password"
      tr: "SSH anahtarları: şifresiz giriş"
    minutes: 40
    needs: [users]
    why:
      en: "SSH is how you reach a server from your own computer. A password can be guessed by bots all day. A key pair cannot: the private key stays on your computer, the public key goes on the server, and only the owner of the private key gets in."
      tr: "SSH, kendi bilgisayarından sunucuya ulaşma yoludur. Şifreyi botlar gün boyu tahmin etmeye çalışabilir. Anahtar çiftini edemezler: özel anahtar bilgisayarında kalır, açık anahtar sunucuya konur ve sadece özel anahtarın sahibi girebilir."
    learn:
      en: |
        - A key pair: the private key is a secret you never share; the public key (`.pub`) is safe to share
        - `ssh-keygen`, `authorized_keys`, and why permissions on `~/.ssh` matter
        - The host key fingerprint question the first time you connect
        - A `Host` alias in `~/.ssh/config` so you can type `ssh practice`
      tr: |
        - Anahtar çifti: özel anahtar kimseyle paylaşmadığın bir sır; açık anahtar (`.pub`) paylaşması güvenli
        - `ssh-keygen`, `authorized_keys` ve `~/.ssh` izinlerinin neden önemli olduğu
        - İlk bağlanışta sorulan sunucu anahtarı parmak izi sorusu
        - `~/.ssh/config` içinde `Host` takma adı; böylece `ssh practice` yazabilirsin
    do:
      en: |
        1. On your computer, make a key just for this project. Choose a passphrase; it protects the key if the file is stolen.
        2. Print the public key and copy the whole line.
        3. In the VM shell (`multipass shell practice`), create deploy's `.ssh` folder, paste the line into `authorized_keys` with nano (Ctrl+O, Enter, Ctrl+X to save), and fix owner and permissions.
        4. Get the VM's address with `multipass info practice`. On your computer, add the alias below to `~/.ssh/config` (create the file if needed) with that address.
        5. Connect. The first time it asks whether to trust the host; type `yes`. You are in as `deploy`.
      tr: |
        1. Bilgisayarında sadece bu proje için bir anahtar üret. Bir parola seç; dosya çalınırsa anahtarı korur.
        2. Açık anahtarı yazdır ve satırın tamamını kopyala.
        3. VM shell'inde (`multipass shell practice`) deploy'un `.ssh` klasörünü oluştur, satırı nano ile `authorized_keys` içine yapıştır (kaydetmek için Ctrl+O, Enter, Ctrl+X) ve sahip ile izinleri düzelt.
        4. VM'in adresini `multipass info practice` ile öğren. Bilgisayarında aşağıdaki takma adı bu adresle `~/.ssh/config` dosyasına ekle (dosya yoksa oluştur).
        5. Bağlan. İlk seferde sunucuya güvenip güvenmediğini sorar; `yes` yaz. `deploy` olarak içeridesin.
    code:
      - file: terminal
        lang: sh
        text: |
          # on your computer
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519_hello -C "hello-server"
          cat ~/.ssh/id_ed25519_hello.pub

          # in the VM shell (multipass shell practice)
          sudo install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
          sudo nano /home/deploy/.ssh/authorized_keys
          sudo chown deploy:deploy /home/deploy/.ssh/authorized_keys
          sudo chmod 600 /home/deploy/.ssh/authorized_keys

          # on your computer again
          ssh practice
          whoami
      - file: ~/.ssh/config
        lang: text
        text: |
          Host practice
              HostName 192.168.64.5
              User deploy
              IdentityFile ~/.ssh/id_ed25519_hello
              IdentitiesOnly yes
    mistakes:
      - problem:
          en: "\"Permission denied (publickey)\" although the key is there."
          tr: "Anahtar yerinde olduğu halde \"Permission denied (publickey)\"."
        fix:
          en: "Usually the public key was pasted wrongly (it must be one single line) or the permissions are too open. `.ssh` must be 700 and `authorized_keys` 600, both owned by deploy. Run `ssh -v practice` to see what happens."
          tr: "Genelde açık anahtar yanlış yapıştırılmıştır (tek satır olmalı) ya da izinler fazla açıktır. `.ssh` 700, `authorized_keys` 600 olmalı ve ikisinin sahibi deploy olmalı. Ne olduğunu görmek için `ssh -v practice` çalıştır."
      - problem:
          en: "Sending or pasting the private key (the file without .pub)."
          tr: "Özel anahtarı (.pub olmayan dosya) göndermek ya da yapıştırmak."
        fix:
          en: "Only the `.pub` file ever leaves your computer. If the private key leaked, delete it, make a new pair and replace the line in `authorized_keys`."
          tr: "Bilgisayarından sadece `.pub` dosyası çıkar. Özel anahtar sızarsa sil, yeni bir çift üret ve `authorized_keys` içindeki satırı değiştir."
      - problem:
          en: "Typing `yes` to the fingerprint question without thinking, on a real server."
          tr: "Gerçek sunucuda parmak izi sorusuna düşünmeden `yes` yazmak."
        fix:
          en: "On a VPS, compare the fingerprint with the one the provider shows in its console or system log, if it shows one."
          tr: "VPS'te, sağlayıcı konsolunda ya da sistem günlüğünde bir parmak izi gösteriyorsa onunla karşılaştır."
    quiz:
      - q:
          en: "Which file goes on the server?"
          tr: "Sunucuya hangi dosya konur?"
        options:
          en:
            - "id_ed25519_hello (private key)"
            - "id_ed25519_hello.pub (public key)"
            - "Both of them"
          tr:
            - "id_ed25519_hello (özel anahtar)"
            - "id_ed25519_hello.pub (açık anahtar)"
            - "İkisi de"
        answer: 1
        why:
          en: "The server only needs the public key to check a login. The private key never leaves your computer."
          tr: "Sunucu girişi kontrol etmek için sadece açık anahtara ihtiyaç duyar. Özel anahtar bilgisayarından asla çıkmaz."
    sources:
      - title: ssh-keygen manual
        url: https://manpages.ubuntu.com/manpages/resolute/en/man1/ssh-keygen.1.html
      - title: ssh_config manual
        url: https://manpages.ubuntu.com/manpages/resolute/en/man5/ssh_config.5.html
      - title: Ubuntu Server, OpenSSH
        url: https://documentation.ubuntu.com/server/how-to/security/openssh-server/

  - id: service
    stage: first-project
    title:
      en: "Run the app as a systemd service"
      tr: "Uygulamayı systemd servisi olarak çalıştır"
    minutes: 45
    needs: [keys]
    why:
      en: "If you start the app by hand, it dies when you close the terminal or the server reboots. systemd is the program that starts everything on Ubuntu. A service file tells it to start your app at boot, as `webapp`, and to restart it if it crashes."
      tr: "Uygulamayı elle başlatırsan terminali kapatınca ya da sunucu yeniden başlayınca ölür. systemd, Ubuntu'da her şeyi başlatan programdır. Servis dosyası ona uygulamanı açılışta, `webapp` olarak başlatmasını ve çökerse yeniden başlatmasını söyler."
    learn:
      en: |
        - What a unit file is and its three parts: `[Unit]`, `[Service]`, `[Install]`
        - `systemctl`: `daemon-reload`, `enable`, `start`, `restart`, `status`
        - The difference between `start` (now) and `enable` (at every boot)
        - Why `ExecStart` needs full paths
      tr: |
        - Unit dosyasının ne olduğu ve üç bölümü: `[Unit]`, `[Service]`, `[Install]`
        - `systemctl`: `daemon-reload`, `enable`, `start`, `restart`, `status`
        - `start` (şimdi) ile `enable` (her açılışta) farkı
        - `ExecStart`'ın neden tam yol istediği
    do:
      en: |
        1. In your project folder make a folder `server` and put the unit file below in it as `server/hello-server.service`.
        2. Copy the app and the folder to the VM (this uses the alias from the last step).
        3. Log in with `ssh practice`. Install the unit file into `/etc/systemd/system` (that is where your own units go), tell systemd to re-read its files, then enable and start the service.
        4. Check `systemctl status`. It should say `active (running)`. Ask the app for `/health`.
        5. Prove it survives a reboot: `sudo reboot`, wait a minute, `ssh practice` again and ask `/health` again.
      tr: |
        1. Proje klasöründe `server` adında bir klasör aç ve aşağıdaki unit dosyasını `server/hello-server.service` olarak içine koy.
        2. Uygulamayı ve klasörü VM'e kopyala (önceki adımdaki takma adı kullanır).
        3. `ssh practice` ile gir. Unit dosyasını `/etc/systemd/system` içine kur (kendi unit'lerin oraya gider), systemd'ye dosyalarını yeniden okumasını söyle, sonra servisi enable edip başlat.
        4. `systemctl status` bak. `active (running)` yazmalı. Uygulamadan `/health` iste.
        5. Yeniden başlatmaya dayandığını kanıtla: `sudo reboot`, bir dakika bekle, tekrar `ssh practice` yap ve `/health`'i tekrar iste.
    code:
      - file: server/hello-server.service
        lang: ini
        text: |
          [Unit]
          Description=hello-server, a small web app
          After=network.target

          [Service]
          User=webapp
          Group=webapp
          WorkingDirectory=/opt/hello-server/current
          ExecStart=/usr/bin/python3 /opt/hello-server/current/app.py
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
      - file: terminal
        lang: sh
        text: |
          # on your computer
          scp app.py practice:/opt/hello-server/current/
          scp -r server practice:

          # on the server (ssh practice)
          sudo install -m 0644 ~/server/hello-server.service /etc/systemd/system/hello-server.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now hello-server
          systemctl status hello-server --no-pager
          curl -s http://127.0.0.1:8000/health
          sudo reboot
    mistakes:
      - problem:
          en: "You edited the unit file but nothing changed."
          tr: "Unit dosyasını düzenledin ama hiçbir şey değişmedi."
        fix:
          en: "Run `sudo systemctl daemon-reload` after every change to a unit file, then `sudo systemctl restart hello-server`."
          tr: "Unit dosyasında her değişiklikten sonra `sudo systemctl daemon-reload`, ardından `sudo systemctl restart hello-server` çalıştır."
      - problem:
          en: "Status shows `failed` with `status=203/EXEC` or `status=200/CHDIR`."
          tr: "Status `failed` gösteriyor ve `status=203/EXEC` ya da `status=200/CHDIR` yazıyor."
        fix:
          en: "systemd could not find the program or the folder. Check the paths in `ExecStart` and `WorkingDirectory` (`ls -l /opt/hello-server/current`) and that you copied `app.py` there."
          tr: "systemd programı ya da klasörü bulamadı. `ExecStart` ve `WorkingDirectory` içindeki yolları (`ls -l /opt/hello-server/current`) ve `app.py`'yi oraya kopyaladığını kontrol et."
      - problem:
          en: "Only running `start` and forgetting `enable`."
          tr: "Sadece `start` çalıştırıp `enable`'ı unutmak."
        fix:
          en: "`start` runs it now; `enable` makes it start at every boot. `enable --now` does both."
          tr: "`start` şimdi çalıştırır; `enable` her açılışta başlamasını sağlar. `enable --now` ikisini birden yapar."
    quiz:
      - q:
          en: "The server reboots. Which command made your app start again by itself?"
          tr: "Sunucu yeniden başlıyor. Uygulamanın kendiliğinden tekrar başlamasını hangi komut sağladı?"
        options:
          en:
            - "systemctl enable"
            - "systemctl daemon-reload"
            - "systemctl status"
          tr:
            - "systemctl enable"
            - "systemctl daemon-reload"
            - "systemctl status"
        answer: 0
        why:
          en: "`enable` links the service into the boot sequence through its `[Install]` section."
          tr: "`enable`, `[Install]` bölümü sayesinde servisi açılış sırasına bağlar."
    sources:
      - title: systemd.service
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html
      - title: systemctl
        url: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html

  - id: nginx
    stage: first-project
    title:
      en: "Put Nginx in front: a reverse proxy"
      tr: "Önüne Nginx koy: reverse proxy"
    minutes: 40
    needs: [service]
    why:
      en: "Your app speaks plain HTTP on a private port. Nginx listens on the public port 80 (and later 443 for HTTPS), takes the requests and hands them to your app. It also deals with slow visitors and, later, the certificate, so your app does not have to."
      tr: "Uygulaman özel bir portta düz HTTP konuşuyor. Nginx herkese açık 80 portunu (ve sonra HTTPS için 443'ü) dinler, istekleri alır ve uygulamana iletir. Yavaş ziyaretçilerle ve sonra sertifikayla da o ilgilenir; uygulamanın uğraşması gerekmez."
    learn:
      en: |
        - What a reverse proxy is and what `proxy_pass` does
        - Where Nginx keeps sites: `sites-available`, `sites-enabled` and the symlink between them
        - Why `nginx -t` comes before every reload
        - The headers that tell the app who the real visitor is
      tr: |
        - Reverse proxy'nin ne olduğu ve `proxy_pass`'in ne yaptığı
        - Nginx'in siteleri nerede tuttuğu: `sites-available`, `sites-enabled` ve aralarındaki symlink
        - Her reload'dan önce neden `nginx -t` çalıştırıldığı
        - Uygulamaya gerçek ziyaretçinin kim olduğunu söyleyen header'lar
    do:
      en: |
        1. Save the Nginx site below as `server/nginx-site.conf` in your project and copy the folder to the server again.
        2. On the server install Nginx. Ubuntu starts it right away.
        3. Install the site file, enable it with a symlink and remove the default welcome site.
        4. Test the config. Only if it says `successful`, reload Nginx.
        5. Ask for the page on port 80, first from the server and then from your own computer (use the VM address from `multipass info practice`).
      tr: |
        1. Aşağıdaki Nginx site dosyasını projende `server/nginx-site.conf` olarak kaydet ve klasörü sunucuya yeniden kopyala.
        2. Sunucuda Nginx'i kur. Ubuntu onu hemen başlatır.
        3. Site dosyasını kur, symlink ile etkinleştir ve varsayılan karşılama sitesini kaldır.
        4. Ayarı test et. Sadece `successful` diyorsa Nginx'i reload et.
        5. Sayfayı 80 portundan iste; önce sunucudan, sonra kendi bilgisayarından (VM adresini `multipass info practice`'ten al).
    code:
      - file: server/nginx-site.conf
        lang: nginx
        text: |
          server {
              listen 80;
              listen [::]:80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      - file: terminal
        lang: sh
        text: |
          # on your computer
          scp -r server practice:

          # on the server
          sudo apt install -y nginx
          sudo install -m 0644 ~/server/nginx-site.conf /etc/nginx/sites-available/hello-server
          sudo ln -sf /etc/nginx/sites-available/hello-server /etc/nginx/sites-enabled/hello-server
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl reload nginx
          curl -i http://127.0.0.1/

          # on your computer
          curl -i http://192.168.64.5/
    mistakes:
      - problem:
          en: "You still see the \"Welcome to nginx\" page."
          tr: "Hâlâ \"Welcome to nginx\" sayfasını görüyorsun."
        fix:
          en: "The default site is still enabled. Remove its link with `sudo rm /etc/nginx/sites-enabled/default`, run `sudo nginx -t` and reload."
          tr: "Varsayılan site hâlâ etkin. Linkini `sudo rm /etc/nginx/sites-enabled/default` ile sil, `sudo nginx -t` çalıştır ve reload et."
      - problem:
          en: "502 Bad Gateway."
          tr: "502 Bad Gateway."
        fix:
          en: "Nginx works but the app does not answer on 127.0.0.1:8000. Check `systemctl status hello-server` and `curl http://127.0.0.1:8000/health` on the server."
          tr: "Nginx çalışıyor ama uygulama 127.0.0.1:8000'de cevap vermiyor. Sunucuda `systemctl status hello-server` ve `curl http://127.0.0.1:8000/health` kontrol et."
      - problem:
          en: "Reloading Nginx without `nginx -t`."
          tr: "`nginx -t` çalıştırmadan Nginx'i reload etmek."
        fix:
          en: "A typo can stop the site from loading. `sudo nginx -t` checks the files first and names the line with the error."
          tr: "Bir yazım hatası siteyi açılmaz yapabilir. `sudo nginx -t` önce dosyaları kontrol eder ve hatalı satırı söyler."
    quiz:
      - q:
          en: "What does `proxy_pass http://127.0.0.1:8000;` do?"
          tr: "`proxy_pass http://127.0.0.1:8000;` ne yapar?"
        options:
          en:
            - "Forwards the request to the app that listens on port 8000"
            - "Opens port 8000 to the internet"
            - "Starts the app"
          tr:
            - "İsteği 8000 portunu dinleyen uygulamaya iletir"
            - "8000 portunu internete açar"
            - "Uygulamayı başlatır"
        answer: 0
        why:
          en: "Nginx is the public door. It passes the request to the app on the private address and sends the answer back."
          tr: "Nginx herkese açık kapıdır. İsteği özel adresteki uygulamaya geçirir ve cevabı geri gönderir."
    sources:
      - title: Nginx, ngx_http_proxy_module
        url: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
      - title: Nginx, beginner's guide
        url: https://nginx.org/en/docs/beginners_guide.html
      - title: Nginx, command-line parameters
        url: https://nginx.org/en/docs/switches.html

  - id: config
    stage: data-api
    title:
      en: "Settings in an environment file and a JSON status endpoint"
      tr: "Ayarlar bir environment dosyasında ve JSON durum endpoint'i"
    minutes: 35
    needs: [nginx]
    why:
      en: "Settings such as a port, a greeting or a password should live outside the code, in a file only root can read, so the same code runs on the practice VM and on the real server. A status endpoint returning JSON is also what monitoring tools and your own scripts ask."
      tr: "Port, karşılama metni ya da şifre gibi ayarlar kodun dışında, sadece root'un okuyabildiği bir dosyada durmalı; böylece aynı kod hem pratik VM'de hem gerçek sunucuda çalışır. JSON döndüren bir durum endpoint'i de izleme araçlarının ve kendi script'lerinin sorduğu şeydir."
    learn:
      en: |
        - Environment variables and `EnvironmentFile=` in a unit
        - Why the file has mode `0600` and is never committed to Git
        - What an endpoint is and what JSON looks like
      tr: |
        - Environment variable'lar ve unit içindeki `EnvironmentFile=`
        - Dosyanın neden `0600` izinli olduğu ve neden Git'e hiç eklenmediği
        - Endpoint'in ne olduğu ve JSON'un neye benzediği
    do:
      en: |
        1. Replace `app.py` with the new version below. It reads `GREETING` and `PORT` from the environment and adds `/api/status`.
        2. Create `server/hello-server.env` and replace the unit file with the new version (it adds `EnvironmentFile=`).
        3. Copy everything to the server. Install the env file with mode 0600, install the unit, reload systemd and restart the service.
        4. Ask `/api/status` through Nginx and see the JSON.
        5. Change `GREETING` in `/etc/hello-server.env` with `sudo nano`, restart the service and see the new text on `/`.
      tr: |
        1. `app.py`'yi aşağıdaki yeni sürümle değiştir. `GREETING` ve `PORT`'u environment'tan okur ve `/api/status` ekler.
        2. `server/hello-server.env` dosyasını oluştur ve unit dosyasını yeni sürümle değiştir (`EnvironmentFile=` ekler).
        3. Hepsini sunucuya kopyala. Env dosyasını 0600 izniyle kur, unit'i kur, systemd'yi reload et ve servisi yeniden başlat.
        4. `/api/status`'ü Nginx üzerinden iste ve JSON'u gör.
        5. `/etc/hello-server.env` içindeki `GREETING`'i `sudo nano` ile değiştir, servisi yeniden başlat ve `/` sayfasında yeni metni gör.
    code:
      - file: app.py
        lang: python
        text: |
          import json
          import os
          import shutil
          import socket
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          HOST = os.environ.get("HOST", "127.0.0.1")
          PORT = int(os.environ.get("PORT", "8000"))
          GREETING = os.environ.get("GREETING", "Hello from my own server")
          STARTED = time.time()


          class Handler(BaseHTTPRequestHandler):
              def send_body(self, body, kind):
                  data = body.encode()
                  self.send_response(200)
                  self.send_header("Content-Type", kind + "; charset=utf-8")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

              def do_GET(self):
                  if self.path == "/health":
                      self.send_body("ok\n", "text/plain")
                  elif self.path == "/api/status":
                      disk = shutil.disk_usage("/")
                      status = {
                          "greeting": GREETING,
                          "hostname": socket.gethostname(),
                          "uptime_seconds": int(time.time() - STARTED),
                          "disk_used_percent": round(disk.used * 100 / disk.total),
                      }
                      self.send_body(json.dumps(status) + "\n", "application/json")
                  elif self.path == "/":
                      self.send_body(f"<h1>{GREETING}</h1>\n", "text/html")
                  else:
                      self.send_error(404)


          if __name__ == "__main__":
              print(f"Listening on http://{HOST}:{PORT}", flush=True)
              ThreadingHTTPServer((HOST, PORT), Handler).serve_forever()
      - file: server/hello-server.env
        lang: text
        text: |
          GREETING=Hello from my own server
          PORT=8000
      - file: server/hello-server.service
        lang: ini
        text: |
          [Unit]
          Description=hello-server, a small web app
          After=network.target

          [Service]
          User=webapp
          Group=webapp
          WorkingDirectory=/opt/hello-server/current
          EnvironmentFile=/etc/hello-server.env
          ExecStart=/usr/bin/python3 /opt/hello-server/current/app.py
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
      - file: terminal
        lang: sh
        text: |
          # on your computer
          scp app.py practice:/opt/hello-server/current/
          scp -r server practice:

          # on the server
          sudo install -m 0600 ~/server/hello-server.env /etc/hello-server.env
          sudo install -m 0644 ~/server/hello-server.service /etc/systemd/system/hello-server.service
          sudo systemctl daemon-reload
          sudo systemctl restart hello-server
          curl -s http://127.0.0.1/api/status
    mistakes:
      - problem:
          en: "You changed the env file but the app still shows the old value."
          tr: "Env dosyasını değiştirdin ama uygulama hâlâ eski değeri gösteriyor."
        fix:
          en: "The app reads its environment once, at start. Run `sudo systemctl restart hello-server` after every change."
          tr: "Uygulama environment'ı sadece başlarken bir kez okur. Her değişiklikten sonra `sudo systemctl restart hello-server` çalıştır."
      - problem:
          en: "Committing the env file with real passwords to Git."
          tr: "Gerçek şifreler içeren env dosyasını Git'e eklemek."
        fix:
          en: "This one holds no secrets, but a real one would. Add the file to `.gitignore` and keep only a `.example` copy in Git."
          tr: "Bu dosyada sır yok ama gerçeğinde olur. Dosyayı `.gitignore`'a ekle, Git'te sadece `.example` kopyasını tut."
    quiz:
      - q:
          en: "Why is the env file installed with mode 0600?"
          tr: "Env dosyası neden 0600 izniyle kuruluyor?"
        options:
          en:
            - "So only root can read it, because it may hold secrets"
            - "So the app cannot read it"
            - "Because systemd needs exactly 0600"
          tr:
            - "Sır içerebileceği için sadece root okuyabilsin diye"
            - "Uygulama okuyamasın diye"
            - "systemd tam olarak 0600 istediği için"
        answer: 0
        why:
          en: "systemd reads the file as root and gives the values to the app, so other users on the machine never need to see them."
          tr: "systemd dosyayı root olarak okur ve değerleri uygulamaya verir; makinedeki diğer kullanıcıların onları görmesine gerek kalmaz."
    sources:
      - title: systemd.exec, EnvironmentFile
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#EnvironmentFile=
      - title: Python, json module
        url: https://docs.python.org/3/library/json.html

  - id: smoke
    stage: testing
    title:
      en: "Check before you trust it: a smoke test and config checks"
      tr: "Güvenmeden önce kontrol et: smoke test ve ayar kontrolleri"
    minutes: 30
    needs: [config]
    why:
      en: "On a server, a typo in a config file can take everything down or lock you out. Linux tools can check files before you apply them, and a tiny script can check the whole site in one second after every change."
      tr: "Sunucuda bir ayar dosyasındaki yazım hatası her şeyi çökertebilir ya da seni dışarıda bırakabilir. Linux araçları dosyaları uygulamadan önce kontrol edebilir; küçük bir script de her değişiklikten sonra bütün siteyi bir saniyede kontrol edebilir."
    learn:
      en: |
        - `nginx -t`, `systemd-analyze verify` and `sshd -t`: three checks that change nothing
        - What a smoke test is: a few quick questions that must all be answered "ok"
        - Exit codes: 0 means success, anything else means failure, and `set -e` stops a script at the first failure
      tr: |
        - `nginx -t`, `systemd-analyze verify` ve `sshd -t`: hiçbir şeyi değiştirmeyen üç kontrol
        - Smoke test nedir: hepsine "tamam" cevabı gelmesi gereken birkaç hızlı soru
        - Çıkış kodları: 0 başarı, diğerleri hata demek; `set -e` script'i ilk hatada durdurur
    do:
      en: |
        1. Create `smoke.sh` in your project with the code below and make it executable.
        2. Run it from your computer against the VM address. It needs `bash` and `curl` (on Windows use WSL).
        3. On the server, run the three config checks.
        4. Break something on purpose: stop the app with `sudo systemctl stop hello-server`, run the smoke test and see it fail, then start the app again.
      tr: |
        1. Projende aşağıdaki kodla `smoke.sh` oluştur ve çalıştırılabilir yap.
        2. Bilgisayarından VM adresine karşı çalıştır. `bash` ve `curl` gerekir (Windows'ta WSL kullan).
        3. Sunucuda üç ayar kontrolünü çalıştır.
        4. Bilerek bir şeyi boz: uygulamayı `sudo systemctl stop hello-server` ile durdur, smoke test'i çalıştırıp başarısız olduğunu gör, sonra uygulamayı tekrar başlat.
    code:
      - file: smoke.sh
        lang: bash
        text: |
          #!/usr/bin/env bash
          # Usage: ./smoke.sh [base-url]   (default: http://127.0.0.1)
          set -euo pipefail
          URL="${1:-http://127.0.0.1}"

          health=$(curl -fsS --max-time 5 "$URL/health")
          [ "$health" = "ok" ] || { echo "FAIL /health returned: $health"; exit 1; }

          curl -fsS --max-time 5 "$URL/api/status" | grep -q '"hostname"' \
            || { echo "FAIL /api/status has no hostname"; exit 1; }

          echo "OK $URL"
      - file: terminal
        lang: sh
        text: |
          chmod +x smoke.sh
          ./smoke.sh http://192.168.64.5

          # on the server
          sudo nginx -t
          systemd-analyze verify /etc/systemd/system/hello-server.service
          sudo sshd -t
          echo $?
    mistakes:
      - problem:
          en: "The smoke test passes even though the site is broken."
          tr: "Site bozuk olduğu halde smoke test geçiyor."
        fix:
          en: "Use `curl -f` so an HTTP error (like 502) makes curl fail, and keep `set -e`. Without them an error page still counts as an answer."
          tr: "HTTP hatası (502 gibi) curl'ü başarısız yapsın diye `curl -f` kullan ve `set -e`'yi koru. Onlar olmazsa hata sayfası da cevap sayılır."
      - problem:
          en: "`Permission denied` when running `./smoke.sh`."
          tr: "`./smoke.sh` çalıştırınca `Permission denied`."
        fix:
          en: "The file is not executable yet. Run `chmod +x smoke.sh`."
          tr: "Dosya henüz çalıştırılabilir değil. `chmod +x smoke.sh` çalıştır."
    quiz:
      - q:
          en: "What does `sudo nginx -t` do?"
          tr: "`sudo nginx -t` ne yapar?"
        options:
          en:
            - "Restarts Nginx"
            - "Checks the config files for errors without applying them"
            - "Shows the Nginx logs"
          tr:
            - "Nginx'i yeniden başlatır"
            - "Ayar dosyalarını uygulamadan hatalara karşı kontrol eder"
            - "Nginx log'larını gösterir"
        answer: 1
        why:
          en: "`-t` means test. It reads the files and reports `syntax is ok` or the line with the problem, and changes nothing."
          tr: "`-t` test demek. Dosyaları okur ve `syntax is ok` ya da sorunlu satırı bildirir; hiçbir şeyi değiştirmez."
    sources:
      - title: Nginx, command-line parameters
        url: https://nginx.org/en/docs/switches.html
      - title: systemd-analyze, verify
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd-analyze.html
      - title: sshd, test mode
        url: https://manpages.ubuntu.com/manpages/resolute/en/man8/sshd.8.html

  - id: firewall
    stage: security
    title:
      en: "A firewall with ufw"
      tr: "ufw ile güvenlik duvarı"
    minutes: 30
    needs: [smoke]
    why:
      en: "Every open port is a door. Your server needs only two: SSH for you and HTTP/HTTPS for visitors. A firewall closes all the others, even if some program starts listening by mistake."
      tr: "Açık her port bir kapıdır. Sunucunun sadece ikisine ihtiyacı var: senin için SSH, ziyaretçiler için HTTP/HTTPS. Güvenlik duvarı, bir program yanlışlıkla dinlemeye başlasa bile diğerlerinin hepsini kapatır."
    learn:
      en: |
        - What a port is and which ones you need (22 SSH, 80 HTTP, 443 HTTPS)
        - ufw ("uncomplicated firewall"): it sets the rules of the kernel firewall (nftables) with simple commands
        - Default policy: deny incoming, allow outgoing
        - Application profiles such as `OpenSSH` and `Nginx HTTP`
      tr: |
        - Portun ne olduğu ve hangilerine ihtiyacın olduğu (22 SSH, 80 HTTP, 443 HTTPS)
        - ufw ("uncomplicated firewall"): çekirdeğin güvenlik duvarının (nftables) kurallarını basit komutlarla yazar
        - Varsayılan politika: gelenleri reddet, gidenlere izin ver
        - `OpenSSH` ve `Nginx HTTP` gibi uygulama profilleri
    do:
      en: |
        1. Keep your SSH session open and open a second terminal with `ssh practice`. If you make a mistake you still have one working session.
        2. On the server, look at the status (it is inactive on a fresh Ubuntu).
        3. Allow SSH first, then HTTP, and only then enable the firewall. Answer `y` to the warning.
        4. Read the rules with `status verbose`.
        5. From your computer, run the smoke test again, and open a new SSH session to prove it still works.
      tr: |
        1. SSH oturumunu açık tut ve ikinci bir terminalde `ssh practice` aç. Hata yaparsan çalışan bir oturumun kalır.
        2. Sunucuda durumuna bak (yeni kurulmuş Ubuntu'da inactive'dir).
        3. Önce SSH'e, sonra HTTP'ye izin ver ve ancak ondan sonra güvenlik duvarını aç. Uyarıya `y` cevabı ver.
        4. Kuralları `status verbose` ile oku.
        5. Bilgisayarından smoke test'i tekrar çalıştır ve hâlâ çalıştığını kanıtlamak için yeni bir SSH oturumu aç.
    code:
      - file: terminal
        lang: sh
        text: |
          sudo ufw status
          sudo ufw allow OpenSSH
          sudo ufw allow 'Nginx HTTP'
          sudo ufw enable
          sudo ufw status verbose
    mistakes:
      - problem:
          en: "Enabling ufw before allowing SSH."
          tr: "SSH'e izin vermeden ufw'yu açmak."
        fix:
          en: "You cut your own connection. On a VM, `multipass shell practice` still works; on a VPS use the provider's web console, then run `sudo ufw allow OpenSSH`. Always allow SSH first."
          tr: "Kendi bağlantını kesersin. VM'de `multipass shell practice` hâlâ çalışır; VPS'te sağlayıcının web konsolunu kullan, sonra `sudo ufw allow OpenSSH` çalıştır. Önce her zaman SSH'e izin ver."
      - problem:
          en: "Rules in ufw are right but the site is still unreachable on a VPS."
          tr: "ufw kuralları doğru ama VPS'te site hâlâ açılmıyor."
        fix:
          en: "Most providers have a second firewall outside the server (security list, security group). Open ports 80 and 443 there too."
          tr: "Çoğu sağlayıcının sunucunun dışında ikinci bir güvenlik duvarı vardır (security list, security group). 80 ve 443 portlarını orada da aç."
    quiz:
      - q:
          en: "What should you allow in ufw before you run `ufw enable` over SSH?"
          tr: "SSH üzerinden `ufw enable` çalıştırmadan önce ufw'da neye izin vermelisin?"
        options:
          en:
            - "SSH (OpenSSH)"
            - "Nothing, ufw allows everything by default"
            - "Only port 8000"
          tr:
            - "SSH'e (OpenSSH)"
            - "Hiçbir şeye, ufw varsayılan olarak her şeye izin verir"
            - "Sadece 8000 portuna"
        answer: 0
        why:
          en: "The default for incoming traffic is deny, so without an SSH rule your session is cut and you cannot log in again."
          tr: "Gelen trafik için varsayılan reddetmektir; SSH kuralı olmazsa oturumun kesilir ve tekrar giriş yapamazsın."
    sources:
      - title: Ubuntu Server, firewalls (ufw)
        url: https://documentation.ubuntu.com/server/how-to/security/firewalls/
      - title: ufw manual
        url: https://manpages.ubuntu.com/manpages/resolute/en/man8/ufw.8.html

  - id: hardening
    stage: security
    title:
      en: "Key-only SSH and fail2ban"
      tr: "Sadece anahtarlı SSH ve fail2ban"
    minutes: 40
    needs: [firewall]
    why:
      en: "Within minutes of going online, a server is hit by bots trying thousands of passwords on SSH. If passwords are turned off, those attempts can never work. fail2ban also bans the addresses that keep failing, which keeps your logs and your CPU quiet."
      tr: "İnternete çıktıktan dakikalar sonra sunucu, SSH'te binlerce şifre deneyen botlarla karşılaşır. Şifreler kapatılırsa bu denemeler asla işe yaramaz. fail2ban ayrıca sürekli başarısız olan adresleri yasaklar; log'larını ve işlemciyi sakin tutar."
    learn:
      en: |
        - `sshd_config.d`: small files that change the SSH server's settings; the first value wins, so our file is named `00-`
        - Why root login and password login are turned off
        - What fail2ban watches (the SSH log) and what it does (a temporary ban in the firewall)
      tr: |
        - `sshd_config.d`: SSH sunucusunun ayarlarını değiştiren küçük dosyalar; ilk değer geçerli olduğu için dosyamızın adı `00-` ile başlar
        - Root girişinin ve şifreyle girişin neden kapatıldığı
        - fail2ban neye bakar (SSH log'u) ve ne yapar (güvenlik duvarında geçici yasak)
    do:
      en: |
        1. Make sure `ssh practice` works with your key (it should have since the SSH keys step). Keep this session open.
        2. Create `server/00-hardening.conf` and `server/jail.local`, copy the folder to the server.
        3. Install the SSH file, check it with `sshd -t`, look at the settings sshd will really use, then reload SSH.
        4. In a second terminal check that your key still works, and that a password login is refused.
        5. Install fail2ban, put in your settings and restart it. Check the jail.
      tr: |
        1. `ssh practice`'in anahtarınla çalıştığından emin ol (SSH anahtarları adımından beri çalışıyor olmalı). Bu oturumu açık tut.
        2. `server/00-hardening.conf` ve `server/jail.local` dosyalarını oluştur, klasörü sunucuya kopyala.
        3. SSH dosyasını kur, `sshd -t` ile kontrol et, sshd'nin gerçekte kullanacağı ayarlara bak, sonra SSH'i reload et.
        4. İkinci bir terminalde anahtarının hâlâ çalıştığını ve şifreyle girişin reddedildiğini kontrol et.
        5. fail2ban'ı kur, ayarlarını koy ve yeniden başlat. Jail'i kontrol et.
    code:
      - file: server/00-hardening.conf
        lang: text
        text: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
      - file: server/jail.local
        lang: ini
        text: |
          [sshd]
          enabled = true
          maxretry = 5
          findtime = 10m
          bantime = 1h
      - file: terminal
        lang: sh
        text: |
          # on your computer
          scp -r server practice:

          # on the server
          sudo install -m 0644 ~/server/00-hardening.conf /etc/ssh/sshd_config.d/00-hardening.conf
          sudo sshd -t
          sudo sshd -T | grep -E '^(passwordauthentication|kbdinteractiveauthentication|permitrootlogin)'
          sudo systemctl reload ssh

          # in a second terminal on your computer
          ssh practice true && echo "key login works"
          ssh -o PubkeyAuthentication=no practice

          # on the server
          sudo apt install -y fail2ban
          sudo install -m 0644 ~/server/jail.local /etc/fail2ban/jail.local
          sudo systemctl restart fail2ban
          sudo fail2ban-client status sshd
    mistakes:
      - problem:
          en: "Closing your only session, then finding out the key login does not work."
          tr: "Tek oturumunu kapatıp sonra anahtarla girişin çalışmadığını fark etmek."
        fix:
          en: "Test a new login in a second terminal before you close the first. If you are locked out of a VM, use `multipass shell practice`; on a VPS use the provider's web console and delete the hardening file."
          tr: "İlkini kapatmadan önce ikinci bir terminalde yeni giriş dene. VM'de dışarıda kalırsan `multipass shell practice` kullan; VPS'te sağlayıcının web konsolunu kullan ve hardening dosyasını sil."
      - problem:
          en: "`sshd -T` still says `passwordauthentication yes`."
          tr: "`sshd -T` hâlâ `passwordauthentication yes` diyor."
        fix:
          en: "Another file in `/etc/ssh/sshd_config.d/` (cloud images ship `50-cloud-init.conf`) sets it earlier. The first value wins, so make sure your file is named `00-hardening.conf`, and read the files with `ls /etc/ssh/sshd_config.d/`."
          tr: "`/etc/ssh/sshd_config.d/` içindeki başka bir dosya (cloud imajları `50-cloud-init.conf` ile gelir) onu daha önce ayarlıyor. İlk değer geçerli olduğu için dosyanın adının `00-hardening.conf` olduğundan emin ol ve dosyaları `ls /etc/ssh/sshd_config.d/` ile oku."
      - problem:
          en: "fail2ban bans your own address after a few typos."
          tr: "fail2ban birkaç yazım hatasından sonra kendi adresini yasaklıyor."
        fix:
          en: "Unban it from another connection with `sudo fail2ban-client set sshd unbanip <address>`. With key-only login a typo in the password cannot happen anymore."
          tr: "Başka bir bağlantıdan `sudo fail2ban-client set sshd unbanip <adres>` ile yasağı kaldır. Sadece anahtarla girişte şifre yazım hatası artık olamaz."
    quiz:
      - q:
          en: "Why name the file `00-hardening.conf`?"
          tr: "Dosyaya neden `00-hardening.conf` adı veriliyor?"
        options:
          en:
            - "Files are read in order and the first value of a setting wins"
            - "Only names that start with 00 are allowed"
            - "00 means root"
          tr:
            - "Dosyalar sırayla okunur ve bir ayarın ilk değeri geçerlidir"
            - "Sadece 00 ile başlayan adlara izin verilir"
            - "00 root demektir"
        answer: 0
        why:
          en: "sshd uses the first value it finds for each keyword. A file named 00- is read before 50-cloud-init.conf, so your setting wins."
          tr: "sshd her anahtar kelime için bulduğu ilk değeri kullanır. 00- ile başlayan dosya 50-cloud-init.conf'tan önce okunur, bu yüzden senin ayarın geçerli olur."
    sources:
      - title: sshd_config, PasswordAuthentication and Include
        url: https://manpages.ubuntu.com/manpages/resolute/en/man5/sshd_config.5.html
      - title: fail2ban documentation
        url: https://fail2ban.readthedocs.io/en/latest/
      - title: Ubuntu Server, OpenSSH
        url: https://documentation.ubuntu.com/server/how-to/security/openssh-server/

  - id: tuning
    stage: performance
    title:
      en: "Smaller answers and a memory limit"
      tr: "Daha küçük cevaplar ve bir bellek sınırı"
    minutes: 30
    needs: [hardening]
    why:
      en: "A small server has little memory and bandwidth. Compressing answers makes pages load faster, and a memory limit makes sure one runaway app cannot freeze the whole machine: systemd stops just the app."
      tr: "Küçük bir sunucunun belleği ve bant genişliği azdır. Cevapları sıkıştırmak sayfaları hızlandırır; bellek sınırı da kontrolden çıkan bir uygulamanın bütün makineyi dondurmamasını sağlar: systemd sadece uygulamayı durdurur."
    learn:
      en: |
        - Gzip compression in Nginx (`gzip_types`; HTML is always compressed once gzip is on)
        - systemd limits and sandboxing: `MemoryMax`, `NoNewPrivileges`, `PrivateTmp`, `ProtectSystem`, `ProtectHome`
        - How to measure first: `free -h`, `curl -s -D -`
      tr: |
        - Nginx'te gzip sıkıştırma (`gzip_types`; gzip açılınca HTML her zaman sıkıştırılır)
        - systemd sınırları ve sandbox: `MemoryMax`, `NoNewPrivileges`, `PrivateTmp`, `ProtectSystem`, `ProtectHome`
        - Önce nasıl ölçülür: `free -h`, `curl -s -D -`
    do:
      en: |
        1. Replace `server/nginx-site.conf` and `server/hello-server.service` with the versions below.
        2. Copy the folder to the server and install both files. Test Nginx, reload it, reload systemd and restart the app.
        3. Ask for the JSON with the header `Accept-Encoding: gzip` and look for `Content-Encoding: gzip` in the answer.
        4. Check that the app still works (`./smoke.sh`) and see the memory limit with `systemctl show`.
        5. Optional: run `systemd-analyze security hello-server` to see how exposed the service is.
      tr: |
        1. `server/nginx-site.conf` ve `server/hello-server.service` dosyalarını aşağıdaki sürümlerle değiştir.
        2. Klasörü sunucuya kopyala ve iki dosyayı kur. Nginx'i test et, reload et, systemd'yi reload et ve uygulamayı yeniden başlat.
        3. JSON'u `Accept-Encoding: gzip` header'ıyla iste ve cevapta `Content-Encoding: gzip` ara.
        4. Uygulamanın hâlâ çalıştığını (`./smoke.sh`) kontrol et ve bellek sınırını `systemctl show` ile gör.
        5. İsteğe bağlı: servisin ne kadar açık olduğunu görmek için `systemd-analyze security hello-server` çalıştır.
    code:
      - file: server/nginx-site.conf
        lang: nginx
        text: |
          server {
              listen 80;
              listen [::]:80;
              server_name _;

              gzip on;
              gzip_types application/json text/plain;
              gzip_min_length 20;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      - file: server/hello-server.service
        lang: ini
        text: |
          [Unit]
          Description=hello-server, a small web app
          After=network.target

          [Service]
          User=webapp
          Group=webapp
          WorkingDirectory=/opt/hello-server/current
          EnvironmentFile=/etc/hello-server.env
          ExecStart=/usr/bin/python3 /opt/hello-server/current/app.py
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          MemoryMax=200M

          [Install]
          WantedBy=multi-user.target
      - file: terminal
        lang: sh
        text: |
          # on the server, after copying the folder
          sudo install -m 0644 ~/server/nginx-site.conf /etc/nginx/sites-available/hello-server
          sudo install -m 0644 ~/server/hello-server.service /etc/systemd/system/hello-server.service
          sudo nginx -t && sudo systemctl reload nginx
          sudo systemctl daemon-reload
          sudo systemctl restart hello-server
          curl -s -D - -o /dev/null -H 'Accept-Encoding: gzip' http://127.0.0.1/api/status | grep -i content-encoding
          systemctl show hello-server -p MemoryMax
          free -h
    mistakes:
      - problem:
          en: "Setting `MemoryMax` so low that the app is killed again and again."
          tr: "`MemoryMax`'i o kadar düşük ayarlamak ki uygulama defalarca öldürülüyor."
        fix:
          en: "Measure first (`systemctl status` shows `Memory:`), then set the limit well above normal use. `journalctl -u hello-server` shows when it was killed."
          tr: "Önce ölç (`systemctl status` `Memory:` gösterir), sonra sınırı normal kullanımın epey üstüne koy. `journalctl -u hello-server` ne zaman öldürüldüğünü gösterir."
      - problem:
          en: "Compressing images, zip files or videos."
          tr: "Resim, zip ya da video dosyalarını sıkıştırmak."
        fix:
          en: "They are already compressed, so gzip only costs CPU. Compress text types such as HTML, CSS, JavaScript and JSON."
          tr: "Onlar zaten sıkıştırılmış; gzip sadece işlemci harcar. HTML, CSS, JavaScript ve JSON gibi metin türlerini sıkıştır."
    quiz:
      - q:
          en: "What does `MemoryMax=200M` do when the app uses more?"
          tr: "Uygulama daha fazla bellek kullanınca `MemoryMax=200M` ne yapar?"
        options:
          en:
            - "The kernel kills processes of that service, not the whole machine"
            - "The server reboots"
            - "Nothing, it is only a hint"
          tr:
            - "Çekirdek bütün makineyi değil, o servisin process'lerini öldürür"
            - "Sunucu yeniden başlar"
            - "Hiçbir şey, sadece bir ipucu"
        answer: 0
        why:
          en: "It is a hard limit for the service's control group. Past it, the out-of-memory killer ends the service, and `Restart=on-failure` starts it again."
          tr: "Servisin kontrol grubu için sert bir sınırdır. Aşılınca bellek yetersizliği öldürücüsü servisi sonlandırır ve `Restart=on-failure` onu tekrar başlatır."
    sources:
      - title: Nginx, ngx_http_gzip_module
        url: https://nginx.org/en/docs/http/ngx_http_gzip_module.html
      - title: systemd.resource-control, MemoryMax
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html#MemoryMax=bytes
      - title: systemd.exec, sandboxing
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Sandboxing

  - id: deploy-script
    stage: packaging
    title:
      en: "A deploy script"
      tr: "Bir deploy script'i"
    minutes: 35
    needs: [tuning]
    why:
      en: "Copying files by hand and restarting the app is how people forget a step. A script does the same steps in the same order every time. With one narrow sudo rule, the `deploy` user can restart only this service, not do anything it likes."
      tr: "Dosyaları elle kopyalayıp uygulamayı yeniden başlatmak, insanların bir adımı unutma yoludur. Script aynı adımları her seferinde aynı sırayla yapar. Tek bir dar sudo kuralıyla `deploy` kullanıcısı sadece bu servisi yeniden başlatabilir, canının istediğini yapamaz."
    learn:
      en: |
        - `rsync`: copies only what changed, over SSH
        - A small Bash script with `set -euo pipefail` and arguments (`$1`)
        - `/etc/sudoers.d/`: giving one user one exact command without a password, and `visudo -cf` to check the file first
      tr: |
        - `rsync`: SSH üzerinden sadece değişenleri kopyalar
        - `set -euo pipefail` ve argümanlı (`$1`) küçük bir Bash script'i
        - `/etc/sudoers.d/`: bir kullanıcıya şifresiz tek bir komut vermek ve dosyayı önce `visudo -cf` ile kontrol etmek
    do:
      en: |
        1. Create `deploy.sh` and `server/hello-sudoers` with the code below. `rsync` must exist on your computer (on Windows use WSL) and on the server (`sudo apt install -y rsync` if missing).
        2. Check the sudoers file with `visudo -cf` before installing it. A broken sudoers file can lock you out of `sudo`. Install it with mode 0440.
        3. Make the script executable and deploy: `./deploy.sh practice`.
        4. Change the text in `app.py`, deploy again and run the smoke test.
        5. Commit the script and the `server` folder to Git.
      tr: |
        1. Aşağıdaki kodla `deploy.sh` ve `server/hello-sudoers` dosyalarını oluştur. `rsync` bilgisayarında (Windows'ta WSL kullan) ve sunucuda olmalı (yoksa `sudo apt install -y rsync`).
        2. Sudoers dosyasını kurmadan önce `visudo -cf` ile kontrol et. Bozuk bir sudoers dosyası seni `sudo`'dan mahrum bırakabilir. 0440 izniyle kur.
        3. Script'i çalıştırılabilir yap ve deploy et: `./deploy.sh practice`.
        4. `app.py` içindeki metni değiştir, tekrar deploy et ve smoke test'i çalıştır.
        5. Script'i ve `server` klasörünü Git'e commit et.
    code:
      - file: deploy.sh
        lang: bash
        text: |
          #!/usr/bin/env bash
          # Usage: ./deploy.sh <ssh host or alias>   for example ./deploy.sh practice
          set -euo pipefail
          HOST="${1:?usage: ./deploy.sh <ssh host or alias>}"

          rsync -az app.py smoke.sh "$HOST:/opt/hello-server/current/"
          ssh "$HOST" 'sudo systemctl restart hello-server'
          echo "Deployed to $HOST"
      - file: server/hello-sudoers
        lang: text
        text: |
          deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart hello-server
      - file: terminal
        lang: sh
        text: |
          # on your computer
          scp -r server practice:

          # on the server
          sudo visudo -cf ~/server/hello-sudoers
          sudo install -m 0440 ~/server/hello-sudoers /etc/sudoers.d/hello-server
          sudo visudo -c

          # on your computer
          chmod +x deploy.sh
          ./deploy.sh practice
          ./smoke.sh http://192.168.64.5
    mistakes:
      - problem:
          en: "`sudo: a terminal is required` or a password prompt inside the script."
          tr: "Script içinde `sudo: a terminal is required` hatası ya da şifre sorusu."
        fix:
          en: "The sudoers rule must match the command exactly, including the full path of `systemctl` (`command -v systemctl` shows it) and the service name."
          tr: "Sudoers kuralı komutla tam olarak eşleşmeli: `systemctl`'in tam yolu (`command -v systemctl` gösterir) ve servis adı dahil."
      - problem:
          en: "Editing `/etc/sudoers` or a sudoers.d file with a normal editor."
          tr: "`/etc/sudoers` ya da sudoers.d dosyasını normal bir editörle düzenlemek."
        fix:
          en: "Use `sudo visudo` (or `visudo -cf file` to check a file first). It refuses to save a file with errors."
          tr: "`sudo visudo` kullan (ya da dosyayı önce `visudo -cf dosya` ile kontrol et). Hatalı dosyayı kaydetmeyi reddeder."
    quiz:
      - q:
          en: "Why not give `deploy` full passwordless sudo?"
          tr: "`deploy`'a neden tam şifresiz sudo verilmiyor?"
        options:
          en:
            - "Because Ubuntu does not allow it"
            - "If the deploy key leaks, an attacker would own the whole server"
            - "Because rsync would stop working"
          tr:
            - "Ubuntu buna izin vermediği için"
            - "Deploy anahtarı sızarsa saldırgan bütün sunucuyu ele geçirir"
            - "rsync çalışmaz hale geleceği için"
        answer: 1
        why:
          en: "Give automation only what it needs. One exact command means a stolen deploy key can restart this app and nothing else."
          tr: "Otomasyona sadece ihtiyacı olanı ver. Tek bir kesin komut, çalınan bir deploy anahtarının sadece bu uygulamayı yeniden başlatabilmesi demektir."
    sources:
      - title: rsync manual
        url: https://download.samba.org/pub/rsync/rsync.1
      - title: sudoers manual
        url: https://www.sudo.ws/docs/man/sudoers.man/
      - title: Bash reference, the set builtin
        url: https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html

  - id: vps
    stage: deploy
    title:
      en: "Repeat it on a real server (VPS)"
      tr: "Aynısını gerçek bir sunucuda (VPS) tekrarla"
    minutes: 90
    needs: [deploy-script]
    why:
      en: "You practised on a VM; now you do it for real. A VPS is a small Linux machine in a data centre with a public IP address. Because you wrote down every command and saved every config file, this is mostly copy and paste."
      tr: "VM'de pratik yaptın; şimdi gerçeğini yapıyorsun. VPS, veri merkezindeki, herkese açık bir IP adresi olan küçük bir Linux makinesidir. Her komutu not ettiğin ve her ayar dosyasını kaydettiğin için bu çoğunlukla kopyala-yapıştırdır."
    learn:
      en: |
        - What to look for in a VPS: Ubuntu 26.04 LTS, your SSH key at creation, 1 GB of memory is enough for this app
        - The cloud firewall (outside the server) and ufw (inside) are two separate layers
        - The order that keeps you safe: update, user, key, firewall, then the app, and SSH hardening last
      tr: |
        - VPS'te neye bakılır: Ubuntu 26.04 LTS, oluştururken SSH anahtarın, bu uygulama için 1 GB bellek yeter
        - Bulut güvenlik duvarı (sunucunun dışında) ile ufw (içinde) iki ayrı katmandır
        - Seni güvende tutan sıra: güncelleme, kullanıcı, anahtar, güvenlik duvarı, sonra uygulama; SSH sertleştirmesi en sonda
    do:
      en: |
        1. Pick a server. Free option: Oracle Cloud's Always Free tier. Its documentation still lists Always Free compute VMs (Ampere A1 Arm shape), but sign-up asks for a payment card to verify you, free capacity is not always available in your region, and your home region cannot be changed later. Otherwise rent the cheapest VPS you can find from any provider (a few dollars a month); everything else in this roadmap is free. Both run this app fine.
        2. Create the server with the image **Ubuntu 26.04 LTS** and paste your public key (`cat ~/.ssh/id_ed25519_hello.pub`) into the provider's SSH key field. Note its public IP address and the default user (often `ubuntu`).
        3. In the provider's console (security list, security group or firewall) allow incoming TCP ports 22 and 80. Port 443 comes in the next step.
        4. Add a second alias to `~/.ssh/config` named `vps`, with the server's IP and the default user. Connect with `ssh vps`.
        5. Run the first block below on the VPS. It repeats the users and keys steps. Then log out and log in as `deploy`: change the `vps` alias to `User deploy`.
        6. Copy the project's `server` folder over and run the second block on the VPS. It repeats the firewall, the service, Nginx, fail2ban and the sudo rule.
        7. From your computer run `./deploy.sh vps`, then `./smoke.sh http://<VPS IP>`. Open the address in your browser.
        8. Only now turn off password logins: install `00-hardening.conf` as in the hardening step, after testing a second `ssh vps` session.
      tr: |
        1. Bir sunucu seç. Ücretsiz seçenek: Oracle Cloud'un Always Free katmanı. Dokümantasyonu Always Free compute VM'lerini (Ampere A1 Arm shape) hâlâ listeliyor ama kayıt olurken seni doğrulamak için ödeme kartı istiyor, bölgende ücretsiz kapasite her zaman bulunmayabilir ve ana bölgeni sonra değiştiremezsin. Aksi halde herhangi bir sağlayıcıdan bulabildiğin en ucuz VPS'i kirala (ayda birkaç dolar); yol haritasının geri kalanı ücretsiz. İkisi de bu uygulamayı rahat çalıştırır.
        2. Sunucuyu **Ubuntu 26.04 LTS** imajıyla oluştur ve açık anahtarını (`cat ~/.ssh/id_ed25519_hello.pub`) sağlayıcının SSH anahtarı alanına yapıştır. Herkese açık IP adresini ve varsayılan kullanıcıyı (çoğunlukla `ubuntu`) not al.
        3. Sağlayıcının konsolunda (security list, security group ya da firewall) gelen TCP 22 ve 80 portlarına izin ver. 443 sonraki adımda gelecek.
        4. `~/.ssh/config` dosyasına `vps` adında ikinci bir takma ad ekle; sunucunun IP'sini ve varsayılan kullanıcıyı yaz. `ssh vps` ile bağlan.
        5. Aşağıdaki ilk bloğu VPS'te çalıştır. Kullanıcılar ve anahtarlar adımını tekrarlar. Sonra çıkış yap ve `deploy` olarak gir: `vps` takma adını `User deploy` yap.
        6. Projenin `server` klasörünü kopyala ve ikinci bloğu VPS'te çalıştır. Güvenlik duvarını, servisi, Nginx'i, fail2ban'ı ve sudo kuralını tekrarlar.
        7. Bilgisayarından `./deploy.sh vps`, sonra `./smoke.sh http://<VPS IP>` çalıştır. Adresi tarayıcında aç.
        8. Şifreyle girişi ancak şimdi kapat: ikinci bir `ssh vps` oturumunu test ettikten sonra `00-hardening.conf` dosyasını sertleştirme adımındaki gibi kur.
    code:
      - file: terminal
        lang: sh
        text: |
          # block 1, on the VPS as the default user (ssh vps)
          sudo apt update && sudo apt full-upgrade -y
          sudo adduser deploy
          sudo usermod -aG sudo deploy
          sudo install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
          sudo install -m 600 -o deploy -g deploy ~/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
          sudo adduser --system --group --no-create-home webapp
          sudo install -d -o deploy -g deploy /opt/hello-server /opt/hello-server/current
          sudo apt install -y nginx rsync fail2ban

          # on your computer, with the alias now using User deploy
          scp -r server vps:

          # block 2, on the VPS as deploy
          sudo ufw allow OpenSSH
          sudo ufw allow 'Nginx HTTP'
          sudo ufw enable
          cd ~/server
          sudo install -m 0644 hello-server.service /etc/systemd/system/hello-server.service
          sudo install -m 0600 hello-server.env /etc/hello-server.env
          sudo install -m 0644 nginx-site.conf /etc/nginx/sites-available/hello-server
          sudo ln -sf /etc/nginx/sites-available/hello-server /etc/nginx/sites-enabled/hello-server
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo install -m 0440 hello-sudoers /etc/sudoers.d/hello-server
          sudo install -m 0644 jail.local /etc/fail2ban/jail.local
          sudo systemctl daemon-reload
          sudo nginx -t && sudo systemctl reload nginx
          sudo systemctl restart fail2ban
          sudo systemctl enable hello-server

          # on your computer
          ./deploy.sh vps
          ./smoke.sh http://203.0.113.10
    mistakes:
      - problem:
          en: "Locked out after `ufw enable` or the SSH change."
          tr: "`ufw enable` ya da SSH değişikliğinden sonra dışarıda kalmak."
        fix:
          en: "Every provider has a web console that works without SSH. Log in there, run `sudo ufw allow OpenSSH` or delete `/etc/ssh/sshd_config.d/00-hardening.conf`, and reload SSH."
          tr: "Her sağlayıcının SSH gerektirmeyen bir web konsolu vardır. Oradan gir, `sudo ufw allow OpenSSH` çalıştır ya da `/etc/ssh/sshd_config.d/00-hardening.conf` dosyasını sil ve SSH'i reload et."
      - problem:
          en: "The page works on the server (`curl` there) but not from your browser."
          tr: "Sayfa sunucuda (orada `curl` ile) çalışıyor ama tarayıcında açılmıyor."
        fix:
          en: "Check the layers from outside to inside: the provider's firewall rule for port 80, then `sudo ufw status`, then Nginx. Some provider images also ship their own packet filter rules; if everything above is right, look at `sudo iptables -L INPUT -n --line-numbers`."
          tr: "Katmanları dıştan içe kontrol et: sağlayıcının 80 portu kuralı, sonra `sudo ufw status`, sonra Nginx. Bazı sağlayıcı imajları kendi paket filtresi kurallarıyla da gelir; yukarıdakilerin hepsi doğruysa `sudo iptables -L INPUT -n --line-numbers` çıktısına bak."
      - problem:
          en: "Using the provider's root password or default user for everything."
          tr: "Her şey için sağlayıcının root şifresini ya da varsayılan kullanıcısını kullanmak."
        fix:
          en: "Use `deploy` for daily work and deploys; use the default user only for the first setup."
          tr: "Günlük iş ve deploy için `deploy` kullan; varsayılan kullanıcıyı sadece ilk kurulum için kullan."
    quiz:
      - q:
          en: "The site works inside the server but not from the internet. What is the likely cause?"
          tr: "Site sunucunun içinde çalışıyor ama internetten açılmıyor. Olası neden nedir?"
        options:
          en:
            - "A firewall layer (the provider's or ufw) blocks port 80"
            - "Python is too slow"
            - "The domain name is missing"
          tr:
            - "Bir güvenlik duvarı katmanı (sağlayıcının ya da ufw) 80 portunu engelliyor"
            - "Python çok yavaş"
            - "Alan adı eksik"
        answer: 0
        why:
          en: "A public IP address works without a domain name. If the answer comes from inside but not outside, something filters the traffic."
          tr: "Herkese açık IP adresi alan adı olmadan da çalışır. Cevap içeriden geliyor ama dışarıdan gelmiyorsa trafiği bir şey filtreliyordur."
    sources:
      - title: Oracle Cloud, Always Free resources
        url: https://docs.oracle.com/en-us/iaas/Content/FreeTier/freetier_topic-Always_Free_Resources.htm
      - title: Ubuntu Server, firewalls (ufw)
        url: https://documentation.ubuntu.com/server/how-to/security/firewalls/
      - title: Ubuntu Server, installation
        url: https://documentation.ubuntu.com/server/how-to/installation/

  - id: tls
    stage: deploy
    title:
      en: "A free HTTPS certificate with Certbot"
      tr: "Certbot ile ücretsiz HTTPS sertifikası"
    minutes: 45
    needs: [vps]
    why:
      en: "Without HTTPS, everything between the visitor and your server is readable on the way, and browsers show a warning. Let's Encrypt gives free certificates, and Certbot gets one, sets Nginx up for it and renews it by itself."
      tr: "HTTPS olmadan ziyaretçi ile sunucun arasındaki her şey yolda okunabilir ve tarayıcılar uyarı gösterir. Let's Encrypt ücretsiz sertifika verir; Certbot da bir tane alır, Nginx'i ona göre ayarlar ve kendiliğinden yeniler."
    learn:
      en: |
        - What a certificate is and why a domain name is needed to get one
        - How Let's Encrypt checks that the domain is yours (it asks your server for a file on port 80)
        - Why certificates are short-lived (currently up to 90 days, and the trend is shorter) and renewal must be automatic
        - What Certbot changes in the Nginx file
      tr: |
        - Sertifikanın ne olduğu ve almak için neden bir alan adının gerektiği
        - Let's Encrypt'in alan adının senin olduğunu nasıl kontrol ettiği (sunucundan 80 portunda bir dosya ister)
        - Sertifikaların neden kısa ömürlü olduğu (şu an en fazla 90 gün, eğilim daha kısa) ve yenilemenin neden otomatik olması gerektiği
        - Certbot'un Nginx dosyasında neleri değiştirdiği
    do:
      en: |
        1. You need a domain name. Use one you own, or get a free subdomain from a free DNS service such as DuckDNS. Point an `A` record (and an `AAAA` record if the server has IPv6) at the VPS address. Wait until `getent hosts <your-domain>` on your computer prints the address.
        2. In `server/nginx-site.conf` change `server_name _;` to `server_name <your-domain>;`. Copy the folder and install the file. Test and reload Nginx.
        3. Open port 443: in the provider's console and in ufw. `Nginx Full` covers ports 80 and 443, so the older `Nginx HTTP` rule can go. Port 80 must stay open: Let's Encrypt checks your domain through it and Certbot's redirect uses it.
        4. Install Certbot the way its own instructions say (the snap) and run it for Nginx. It asks for an email and for you to accept the terms; choose the redirect from HTTP to HTTPS when asked.
        5. Open `https://<your-domain>` and check the lock icon. Run `./smoke.sh https://<your-domain>`.
        6. Test automatic renewal with a dry run and find the renewal timer.
        7. Pull Certbot's changes back into your project so the next deploy does not undo them.
      tr: |
        1. Bir alan adına ihtiyacın var. Sahip olduğun bir tane kullan ya da DuckDNS gibi ücretsiz bir DNS servisinden ücretsiz alt alan adı al. Bir `A` kaydını (sunucuda IPv6 varsa `AAAA` kaydını da) VPS adresine yönlendir. Bilgisayarında `getent hosts <alan-adın>` adresi yazana kadar bekle.
        2. `server/nginx-site.conf` içinde `server_name _;` satırını `server_name <alan-adın>;` yap. Klasörü kopyala ve dosyayı kur. Nginx'i test et ve reload et.
        3. 443 portunu aç: sağlayıcının konsolunda ve ufw'da. `Nginx Full` 80 ve 443 portlarını kapsar, bu yüzden eski `Nginx HTTP` kuralı gidebilir. 80 portu açık kalmalı: Let's Encrypt alan adını oradan kontrol eder ve Certbot'un yönlendirmesi onu kullanır.
        4. Certbot'u kendi yönergelerinin söylediği şekilde kur (snap) ve Nginx için çalıştır. E-posta ve şartları kabul etmeni ister; sorulunca HTTP'den HTTPS'e yönlendirmeyi seç.
        5. `https://<alan-adın>` adresini aç ve kilit simgesine bak. `./smoke.sh https://<alan-adın>` çalıştır.
        6. Otomatik yenilemeyi dry run ile test et ve yenileme timer'ını bul.
        7. Certbot'un değişikliklerini projene geri çek; böylece sonraki deploy onları geri almaz.
    code:
      - file: server/nginx-site.conf
        lang: nginx
        text: |
          server {
              listen 80;
              listen [::]:80;
              server_name hello.example.com;

              gzip on;
              gzip_types application/json text/plain;
              gzip_min_length 20;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      - file: terminal
        lang: sh
        text: |
          getent hosts hello.example.com

          # on your computer
          scp -r server vps:

          # on the VPS
          sudo install -m 0644 ~/server/nginx-site.conf /etc/nginx/sites-available/hello-server
          sudo nginx -t && sudo systemctl reload nginx
          sudo ufw allow 'Nginx Full'
          sudo ufw delete allow 'Nginx HTTP'
          sudo snap install --classic certbot
          sudo ln -s /snap/bin/certbot /usr/local/bin/certbot
          sudo certbot --nginx -d hello.example.com
          sudo certbot renew --dry-run
          systemctl list-timers | grep certbot

          # on your computer
          ./smoke.sh https://hello.example.com
          scp vps:/etc/nginx/sites-available/hello-server server/nginx-site.conf
    mistakes:
      - problem:
          en: "Certbot says the challenge failed or it cannot connect."
          tr: "Certbot challenge'ın başarısız olduğunu ya da bağlanamadığını söylüyor."
        fix:
          en: "Let's Encrypt must reach your server on port 80 from the internet. Check the DNS record (`getent hosts <domain>` must show the VPS IP), the provider's firewall and `sudo ufw status`. Certbot's docs describe the requirements."
          tr: "Let's Encrypt, sunucuna internetten 80 portunda ulaşabilmeli. DNS kaydını (`getent hosts <alan-adı>` VPS IP'sini göstermeli), sağlayıcının güvenlik duvarını ve `sudo ufw status` çıktısını kontrol et. Certbot dokümanları gereksinimleri anlatır."
      - problem:
          en: "Installing your original nginx-site.conf again later removes the HTTPS lines."
          tr: "Sonradan ilk nginx-site.conf'u tekrar kurmak HTTPS satırlarını siler."
        fix:
          en: "Certbot edited the file on the server. Copy it back into your project (the last command above) and commit it, and reinstall from that copy."
          tr: "Certbot sunucudaki dosyayı düzenledi. Onu projene geri kopyala (yukarıdaki son komut), commit et ve o kopyadan kur."
      - problem:
          en: "Asking for many certificates while testing."
          tr: "Test ederken çok sayıda sertifika istemek."
        fix:
          en: "Let's Encrypt has rate limits. Use `sudo certbot renew --dry-run` for tests; it uses a staging server."
          tr: "Let's Encrypt'in istek sınırları var. Testler için `sudo certbot renew --dry-run` kullan; staging sunucusunu kullanır."
    quiz:
      - q:
          en: "Why is the certificate renewal automatic?"
          tr: "Sertifika yenilemesi neden otomatik?"
        options:
          en:
            - "Certificates expire after a short time, and an expired one makes browsers block your site"
            - "Certbot is paid and renews to earn money"
            - "Nginx deletes certificates every night"
          tr:
            - "Sertifikalar kısa sürede dolar ve süresi dolmuş sertifika tarayıcıların siteni engellemesine yol açar"
            - "Certbot ücretlidir ve para kazanmak için yeniler"
            - "Nginx sertifikaları her gece siler"
        answer: 0
        why:
          en: "Short lifetimes limit the damage of a leaked key, so renewing is routine. The Certbot package installs a timer that does it."
          tr: "Kısa ömür, sızan bir anahtarın zararını sınırlar; bu yüzden yenileme rutindir. Certbot paketi bunu yapan bir timer kurar."
    sources:
      - title: Certbot, instructions for Nginx on Ubuntu
        url: https://certbot.eff.org/instructions?ws=nginx&os=snap
      - title: Let's Encrypt, how it works
        url: https://letsencrypt.org/how-it-works/
      - title: Let's Encrypt, rate limits
        url: https://letsencrypt.org/docs/rate-limits/

  - id: logs-check
    stage: monitoring
    title:
      en: "Logs with journalctl and a disk and memory check"
      tr: "journalctl ile log'lar ve disk ile bellek kontrolü"
    minutes: 40
    needs: [tls]
    why:
      en: "Servers fail quietly: a full disk or a crashing app does not send you a message. You need to know where to look when something is wrong, and a small check that raises its hand before the disk is full."
      tr: "Sunucular sessizce bozulur: dolu bir disk ya da çöken bir uygulama sana mesaj atmaz. Bir şey ters gittiğinde nereye bakacağını bilmen ve disk dolmadan el kaldıran küçük bir kontrol gerekir."
    learn:
      en: |
        - `journalctl`: logs of every systemd service in one place (`-u` unit, `-f` follow, `-n` last lines, `--since`, `-p err` errors only)
        - Nginx's own logs in `/var/log/nginx/`
        - `df -h` (disk), `free -h` (memory), `du` (what takes the space)
        - A systemd timer: a `.timer` file says when, the `.service` file with the same name says what
      tr: |
        - `journalctl`: her systemd servisinin log'u tek yerde (`-u` unit, `-f` takip, `-n` son satırlar, `--since`, `-p err` sadece hatalar)
        - Nginx'in kendi log'ları `/var/log/nginx/` içinde
        - `df -h` (disk), `free -h` (bellek), `du` (yeri ne kaplıyor)
        - systemd timer: `.timer` dosyası ne zaman, aynı adlı `.service` dosyası ne yapılacağını söyler
    do:
      en: |
        1. Practise reading logs on the server with the first block below. Visit the site in your browser and watch the lines appear.
        2. Create the check script, its service and its timer in your `server` folder.
        3. Copy the folder and install the three files: the script in `/usr/local/bin` (executable), the unit files in `/etc/systemd/system`.
        4. Check the unit files, reload systemd and enable the timer with `--now`.
        5. Run the check once by hand and read its line in the journal. Then list the timers to see the next run.
        6. Test the alarm: run the script with `LIMIT=1`; it must fail, and `systemctl --failed` is a quick way to see failed services.
      tr: |
        1. Aşağıdaki ilk blokla sunucuda log okumayı dene. Siteyi tarayıcında ziyaret et ve satırların belirmesini izle.
        2. `server` klasöründe kontrol script'ini, servisini ve timer'ını oluştur.
        3. Klasörü kopyala ve üç dosyayı kur: script `/usr/local/bin` içine (çalıştırılabilir), unit dosyaları `/etc/systemd/system` içine.
        4. Unit dosyalarını kontrol et, systemd'yi reload et ve timer'ı `--now` ile enable et.
        5. Kontrolü bir kez elle çalıştır ve satırını journal'da oku. Sonra bir sonraki çalışmayı görmek için timer'ları listele.
        6. Alarmı test et: script'i `LIMIT=1` ile çalıştır; başarısız olmalı. `systemctl --failed` başarısız servisleri görmenin hızlı yoludur.
    code:
      - file: server/hello-check.sh
        lang: bash
        text: |
          #!/usr/bin/env bash
          set -euo pipefail
          LIMIT="${LIMIT:-85}"
          disk=$(df --output=pcent / | tail -n 1 | tr -dc '0-9')
          mem=$(free | awk '/^Mem:/ { printf "%d", $3 * 100 / $2 }')
          msg="disk ${disk}% memory ${mem}%"
          if [ "$disk" -ge "$LIMIT" ] || [ "$mem" -ge "$LIMIT" ]; then
            logger -p user.warning -t hello-check "WARNING $msg"
            exit 1
          fi
          logger -t hello-check "ok $msg"
      - file: server/hello-check.service
        lang: ini
        text: |
          [Unit]
          Description=hello-server check

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/hello-check.sh
      - file: server/hello-check.timer
        lang: ini
        text: |
          [Unit]
          Description=Check disk and memory every 15 minutes

          [Timer]
          OnCalendar=*:0/15
          Persistent=true

          [Install]
          WantedBy=timers.target
      - file: terminal
        lang: sh
        text: |
          # reading logs, on the server
          journalctl -u hello-server -n 20 --no-pager
          journalctl -u hello-server -f
          journalctl -u nginx --since "1 hour ago" --no-pager
          journalctl -p err -b --no-pager
          sudo tail -n 5 /var/log/nginx/access.log
          df -h /
          free -h
          sudo du -sh /var/log/* | sort -h | tail -n 5

          # on your computer
          scp -r server vps:

          # installing the check, on the server
          sudo install -m 0755 ~/server/hello-check.sh /usr/local/bin/hello-check.sh
          sudo install -m 0644 ~/server/hello-check.service ~/server/hello-check.timer /etc/systemd/system/
          systemd-analyze verify /etc/systemd/system/hello-check.service /etc/systemd/system/hello-check.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now hello-check.timer
          sudo systemctl start hello-check.service
          journalctl -t hello-check -n 3 --no-pager
          systemctl list-timers hello-check.timer
          sudo LIMIT=1 /usr/local/bin/hello-check.sh; echo "exit code: $?"
          systemctl --failed
    mistakes:
      - problem:
          en: "`journalctl` shows nothing or \"No journal files were found\"."
          tr: "`journalctl` hiçbir şey göstermiyor ya da \"No journal files were found\" yazıyor."
        fix:
          en: "Your user may not be allowed to read the system journal. Members of the `adm` or `systemd-journal` group can; otherwise put `sudo` in front."
          tr: "Kullanıcının sistem journal'ını okumasına izin olmayabilir. `adm` ya da `systemd-journal` grubundakiler okuyabilir; yoksa başına `sudo` koy."
      - problem:
          en: "Enabling the `.service` of the check instead of the `.timer`."
          tr: "Kontrolün `.timer`'ı yerine `.service`'ini enable etmek."
        fix:
          en: "The timer starts the service. Enable the `.timer` (it has the `[Install]` section) and only start the `.service` by hand to test it."
          tr: "Timer servisi başlatır. `.timer`'ı enable et (`[Install]` bölümü onda) ve `.service`'i sadece test için elle başlat."
      - problem:
          en: "Logs grow until the disk is full."
          tr: "Log'lar disk dolana kadar büyüyor."
        fix:
          en: "journald and Nginx's logrotate already limit size on Ubuntu, but check with `journalctl --disk-usage`. To shrink the journal, run `sudo journalctl --vacuum-time=14d`."
          tr: "Ubuntu'da journald ve Nginx'in logrotate'i boyutu zaten sınırlar ama `journalctl --disk-usage` ile kontrol et. Journal'ı küçültmek için `sudo journalctl --vacuum-time=14d` çalıştır."
    quiz:
      - q:
          en: "How do you follow the app's log live?"
          tr: "Uygulamanın log'unu canlı olarak nasıl takip edersin?"
        options:
          en:
            - "journalctl -u hello-server -f"
            - "systemctl status -f"
            - "cat /var/log/hello-server"
          tr:
            - "journalctl -u hello-server -f"
            - "systemctl status -f"
            - "cat /var/log/hello-server"
        answer: 0
        why:
          en: "`-u` picks the service and `-f` follows new lines, like `tail -f`. The app writes to the terminal and systemd stores it in the journal."
          tr: "`-u` servisi seçer, `-f` yeni satırları `tail -f` gibi takip eder. Uygulama terminale yazar, systemd onu journal'da saklar."
    sources:
      - title: journalctl
        url: https://www.freedesktop.org/software/systemd/man/latest/journalctl.html
      - title: systemd.timer
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html
      - title: free(1)
        url: https://man7.org/linux/man-pages/man1/free.1.html

  - id: backups
    stage: monitoring
    title:
      en: "Nightly backups with a systemd timer"
      tr: "systemd timer ile gece yedekleri"
    minutes: 40
    needs: [logs-check]
    why:
      en: "Disks die, files get deleted by mistake and servers get hacked. A backup you never tested is only a hope, and a backup on the same disk dies with the disk. So we back up every night and copy the files to another place."
      tr: "Diskler bozulur, dosyalar yanlışlıkla silinir, sunucular hacklenir. Hiç test etmediğin yedek sadece bir umuttur; aynı diskteki yedek de diskle birlikte ölür. Bu yüzden her gece yedek alıp dosyaları başka bir yere kopyalıyoruz."
    learn:
      en: |
        - `tar -czf`: pack folders into one compressed file; `tar -tzf` lists what is inside
        - `find -mtime +14 -delete`: remove old backups
        - `OnCalendar=` and `Persistent=true`: run at a time, and catch up if the server was off
        - The rule: a backup counts only after you restored from it once, and it must also live off the server
      tr: |
        - `tar -czf`: klasörleri tek bir sıkıştırılmış dosyaya paketler; `tar -tzf` içindekileri listeler
        - `find -mtime +14 -delete`: eski yedekleri siler
        - `OnCalendar=` ve `Persistent=true`: belli bir saatte çalış, sunucu kapalıysa sonradan yakala
        - Kural: yedek ancak bir kez ondan geri yükleme yaptıktan sonra sayılır ve sunucunun dışında da durmalıdır
    do:
      en: |
        1. Create the backup script, its service and its timer in your `server` folder.
        2. Copy the folder to the server and install them like the check script. The backup runs as root because it reads `/etc/hello-server.env`.
        3. Check the calendar line with `systemd-analyze calendar`, enable the timer and run the backup once by hand.
        4. Look at the file: it belongs to root and group `deploy`, mode 0640, so `deploy` can copy it away but others cannot read it.
        5. Practise a restore into a temporary folder.
        6. Copy the backups to your own computer with `rsync` and add that command to your calendar or notes.
      tr: |
        1. `server` klasöründe yedek script'ini, servisini ve timer'ını oluştur.
        2. Klasörü sunucuya kopyala ve kontrol script'i gibi kur. Yedek `/etc/hello-server.env` dosyasını okuduğu için root olarak çalışır.
        3. Takvim satırını `systemd-analyze calendar` ile kontrol et, timer'ı enable et ve yedeği bir kez elle çalıştır.
        4. Dosyaya bak: sahibi root, grubu `deploy`, izni 0640; böylece `deploy` onu kopyalayabilir ama diğerleri okuyamaz.
        5. Geçici bir klasöre geri yüklemeyi dene.
        6. Yedekleri `rsync` ile kendi bilgisayarına kopyala ve bu komutu takvimine ya da notlarına ekle.
    code:
      - file: server/hello-backup.sh
        lang: bash
        text: |
          #!/usr/bin/env bash
          set -euo pipefail
          DEST=/var/backups/hello-server
          umask 027
          install -d -m 0750 -o root -g deploy "$DEST"
          FILE="$DEST/hello-server-$(date +%F).tar.gz"
          tar -czf "$FILE" -C / opt/hello-server etc/hello-server.env
          chgrp deploy "$FILE"
          find "$DEST" -name 'hello-server-*.tar.gz' -mtime +14 -delete
          echo "Backup written to $FILE"
      - file: server/hello-backup.service
        lang: ini
        text: |
          [Unit]
          Description=hello-server backup

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/hello-backup.sh
      - file: server/hello-backup.timer
        lang: ini
        text: |
          [Unit]
          Description=Back up hello-server every night

          [Timer]
          OnCalendar=*-*-* 03:00
          Persistent=true

          [Install]
          WantedBy=timers.target
      - file: terminal
        lang: sh
        text: |
          # on your computer
          scp -r server vps:

          # on the server
          sudo install -m 0755 ~/server/hello-backup.sh /usr/local/bin/hello-backup.sh
          sudo install -m 0644 ~/server/hello-backup.service ~/server/hello-backup.timer /etc/systemd/system/
          systemd-analyze verify /etc/systemd/system/hello-backup.service /etc/systemd/system/hello-backup.timer
          systemd-analyze calendar '*-*-* 03:00'
          sudo systemctl daemon-reload
          sudo systemctl enable --now hello-backup.timer
          sudo systemctl start hello-backup.service
          ls -l /var/backups/hello-server
          mkdir -p /tmp/restore-test
          tar -xzf /var/backups/hello-server/hello-server-*.tar.gz -C /tmp/restore-test
          ls -R /tmp/restore-test/opt | head
          rm -rf /tmp/restore-test

          # on your computer
          rsync -az vps:/var/backups/hello-server/ ./backups/
    mistakes:
      - problem:
          en: "Never restoring a backup, then finding it was empty when it mattered."
          tr: "Yedeği hiç geri yüklememek ve gerektiğinde boş çıktığını görmek."
        fix:
          en: "Restore into a temporary folder every few months and look at the files, like in step 5. List an archive any time with `tar -tzf <file>`."
          tr: "Birkaç ayda bir geçici bir klasöre geri yükle ve dosyalara bak; 5. adımdaki gibi. Bir arşivi istediğin zaman `tar -tzf <dosya>` ile listele."
      - problem:
          en: "Keeping the only backups on the same server."
          tr: "Tek yedekleri aynı sunucuda tutmak."
        fix:
          en: "If the server is lost, so are they. Copy them away (the `rsync` line) or send them to a free cloud storage tier."
          tr: "Sunucu kaybolursa yedekler de kaybolur. Onları başka yere kopyala (`rsync` satırı) ya da ücretsiz bir bulut depolama katmanına gönder."
      - problem:
          en: "A real app with a database backed up by copying its files while it runs."
          tr: "Veritabanı olan gerçek bir uygulamada, çalışırken dosyalarını kopyalayarak yedek almak."
        fix:
          en: "Use the database's own dump tool (for PostgreSQL, `pg_dump`) in the script. This app has no database, so tar is enough."
          tr: "Script'te veritabanının kendi dump aracını kullan (PostgreSQL için `pg_dump`). Bu uygulamada veritabanı yok, tar yeterli."
    quiz:
      - q:
          en: "What does `Persistent=true` do in a timer?"
          tr: "Timer'da `Persistent=true` ne yapar?"
        options:
          en:
            - "If the server was off at the scheduled time, it runs the job soon after boot"
            - "It keeps the job running forever"
            - "It saves the output to a file"
          tr:
            - "Sunucu zamanlanan saatte kapalıysa işi açılıştan hemen sonra çalıştırır"
            - "İşi sonsuza kadar çalışır tutar"
            - "Çıktıyı bir dosyaya kaydeder"
        answer: 0
        why:
          en: "systemd remembers when the timer last ran, so a missed run is caught up. Plain cron skips a job when the machine is off."
          tr: "systemd timer'ın en son ne zaman çalıştığını hatırlar, kaçan çalışma telafi edilir. Düz cron makine kapalıyken işi atlar."
    sources:
      - title: systemd.timer
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html
      - title: GNU tar manual
        url: https://www.gnu.org/software/tar/manual/tar.html
      - title: systemd.time, calendar events
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.time.html#Calendar%20Events

  - id: auto-updates
    stage: advanced
    title:
      en: "Automatic security updates and where to go next"
      tr: "Otomatik güvenlik güncellemeleri ve sonra nereye gidilir"
    minutes: 30
    needs: [backups]
    why:
      en: "New holes in Linux and Nginx are found every month, and attackers scan for servers that did not patch. Ubuntu can install security updates by itself, so a server you forget about for a month is still safe."
      tr: "Linux ve Nginx'te her ay yeni açıklar bulunur ve saldırganlar yama yapmamış sunucuları tarar. Ubuntu güvenlik güncellemelerini kendisi kurabilir; böylece bir ay unuttuğun sunucu yine de güvende kalır."
    learn:
      en: |
        - `unattended-upgrades`: installs updates from the security channel daily
        - Why it only takes security updates by default (they are small and safe)
        - Some updates, like a new kernel, need a reboot; you can allow an automatic reboot at a quiet hour
      tr: |
        - `unattended-upgrades`: güvenlik kanalındaki güncellemeleri her gün kurar
        - Varsayılan olarak neden sadece güvenlik güncellemelerini aldığı (küçük ve güvenlidirler)
        - Yeni çekirdek gibi bazı güncellemeler yeniden başlatma ister; sakin bir saatte otomatik yeniden başlatmaya izin verebilirsin
    do:
      en: |
        1. On the server check whether it is installed and switched on. Ubuntu Server usually has it by default. If the file is missing, install it and run the reconfigure command.
        2. Do a dry run: it shows what would be installed and which sources are allowed (`-security`) without changing anything.
        3. Optional: allow a reboot at 04:00 when an update needs one. Put the file below in `/etc/apt/apt.conf.d/` and see that apt reads it. Only do this if a few minutes of downtime at night is fine.
        4. Look at the log the next day: `/var/log/unattended-upgrades/`.
        5. Tick the list of what you built, then pick the next goal below.
      tr: |
        1. Sunucuda kurulu ve açık olup olmadığını kontrol et. Ubuntu Server'da genelde varsayılan olarak vardır. Dosya yoksa kur ve reconfigure komutunu çalıştır.
        2. Dry run yap: hiçbir şeyi değiştirmeden nelerin kurulacağını ve hangi kaynaklara (`-security`) izin verildiğini gösterir.
        3. İsteğe bağlı: bir güncelleme gerektirdiğinde saat 04:00'te yeniden başlatmaya izin ver. Aşağıdaki dosyayı `/etc/apt/apt.conf.d/` içine koy ve apt'in onu okuduğunu gör. Bunu sadece geceleri birkaç dakikalık kesinti sorun değilse yap.
        4. Ertesi gün log'a bak: `/var/log/unattended-upgrades/`.
        5. Yaptıklarının listesini işaretle, sonra aşağıdaki sonraki hedeflerden birini seç.
    code:
      - file: /etc/apt/apt.conf.d/52unattended-upgrades-local
        lang: text
        text: |
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:00";
      - file: terminal
        lang: sh
        text: |
          cat /etc/apt/apt.conf.d/20auto-upgrades
          sudo apt install -y unattended-upgrades
          sudo dpkg-reconfigure -plow unattended-upgrades
          sudo unattended-upgrade --dry-run --debug | head -n 20
          sudo nano /etc/apt/apt.conf.d/52unattended-upgrades-local
          apt-config dump | grep Automatic-Reboot
          ls /var/log/unattended-upgrades/
      - file: terminal
        lang: text
        text: |
          Checklist
          [x] Ubuntu 26.04 LTS on a practice VM and a VPS
          [x] deploy user, key-only SSH, root login off
          [x] ufw: only SSH, HTTP, HTTPS
          [x] app as a systemd service, running as webapp, with a memory limit
          [x] Nginx reverse proxy with a free Let's Encrypt certificate
          [x] logs with journalctl, a disk and memory check
          [x] nightly backup, restored once, copied off the server
          [x] fail2ban and automatic security updates

          Next: Docker roadmap (run the app in a container), CI/CD roadmap
          (deploy on every push to main), a second server and a load balancer.
    mistakes:
      - problem:
          en: "Turning on automatic reboot without thinking about when it happens."
          tr: "Ne zaman olacağını düşünmeden otomatik yeniden başlatmayı açmak."
        fix:
          en: "Set a quiet hour (`Automatic-Reboot-Time`). Because the app is enabled in systemd, it starts again by itself after the reboot."
          tr: "Sakin bir saat ayarla (`Automatic-Reboot-Time`). Uygulama systemd'de enable olduğu için yeniden başlatmadan sonra kendiliğinden tekrar başlar."
      - problem:
          en: "Thinking automatic updates replace everything else."
          tr: "Otomatik güncellemelerin diğer her şeyin yerini tuttuğunu sanmak."
        fix:
          en: "They patch Ubuntu packages only. Your own app and its libraries still need your updates, and you still need backups and monitoring."
          tr: "Sadece Ubuntu paketlerini yamalar. Kendi uygulamanın ve kütüphanelerinin güncellemelerini hâlâ sen yapmalısın; yedek ve izlemeye de hâlâ ihtiyacın var."
    quiz:
      - q:
          en: "Which updates does Ubuntu install by itself by default?"
          tr: "Ubuntu varsayılan olarak hangi güncellemeleri kendisi kurar?"
        options:
          en:
            - "Security updates"
            - "Every update, including new Ubuntu releases"
            - "None"
          tr:
            - "Güvenlik güncellemeleri"
            - "Yeni Ubuntu sürümleri dahil her güncelleme"
            - "Hiçbiri"
        answer: 0
        why:
          en: "The default allowed origins are the main release and its `-security` pocket. Other updates, and release upgrades, stay a decision for you."
          tr: "Varsayılan izinli kaynaklar ana sürüm ve onun `-security` bölümüdür. Diğer güncellemeler ve sürüm yükseltmeleri senin kararın olarak kalır."
    sources:
      - title: Ubuntu Server, automatic updates
        url: https://documentation.ubuntu.com/server/how-to/software/automatic-updates/
      - title: Ubuntu Server, security
        url: https://documentation.ubuntu.com/server/explanation/intro-to/security/
