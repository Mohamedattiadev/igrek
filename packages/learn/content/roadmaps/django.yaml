id: django
title: Django
summary:
  en: "From an empty computer to your own Django website on the internet. You build a real recipe site with an admin panel, forms, user accounts and tests, and put it online for free."
  tr: "Boş bir bilgisayardan internette yayında olan kendi Django sitene. Admin paneli, formlar, kullanıcı hesapları ve testleri olan gerçek bir tarif sitesi yazar ve ücretsiz yayına alırsın."
teacher: backend
project:
  en: 'Recipe Box, a small recipe site: anyone can read recipes, people sign up and log in to add and edit their own, you manage everything in Django''s admin panel, it has tests, and it runs for free on PythonAnywhere.'
  tr: 'Recipe Box, küçük bir tarif sitesi: herkes tarifleri okuyabilir, kullanıcılar kayıt olup giriş yaparak kendi tariflerini ekler ve düzenler, her şeyi Django''nun admin panelinden yönetirsin; testleri vardır ve PythonAnywhere''de ücretsiz çalışır.'
detect:
  pip: [django]
version: "6.1"
latest: eol:django
checked: 2026-10
after: [python]
sheets: [python, django, git, sql, http]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Python, an editor and Git"
      tr: "Python, bir editör ve Git kurma"
    minutes: 40
    why:
      en: "Django is a Python library, so everything starts with Python. Django 6.1 needs Python 3.12 or newer. An editor makes writing code comfortable, and Git keeps every version of your work so you can never really lose it."
      tr: "Django bir Python kütüphanesi, o yüzden her şey Python ile başlar. Django 6.1 için Python 3.12 ya da daha yenisi gerekir. Editör kod yazmayı rahatlatır, Git de işinin her sürümünü saklar; böylece hiçbir şeyi gerçekten kaybetmezsin."
    learn:
      en: |
        - What a terminal is and how to check that a program is installed
        - Why Django needs Python 3.12 or newer
        - What Git is for
      tr: |
        - Terminalin ne olduğu ve bir programın kurulu olup olmadığını nasıl kontrol edeceğin
        - Django'nun neden Python 3.12 ya da daha yenisini istediği
        - Git'in ne işe yaradığı
    do:
      en: |
        1. Download the newest **Python 3** from python.org and install it. You need 3.12 or newer. On Windows, tick **Add python.exe to PATH** on the first screen of the installer.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor.
        3. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it.
        4. Open a terminal (in VS Code: *Terminal → New Terminal*) and run the commands below. Each should print a version number. On Windows use `python` instead of `python3`.
        5. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
      tr: |
        1. python.org'dan en yeni **Python 3** sürümünü indirip kur. 3.12 ya da daha yenisi gerekir. Windows'ta kurucunun ilk ekranında **Add python.exe to PATH** kutusunu işaretle.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u kur (code.visualstudio.com).
        3. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir.
        4. Bir terminal aç (VS Code'da: *Terminal → New Terminal*) ve aşağıdaki komutları çalıştır. Her biri bir sürüm numarası yazmalı. Windows'ta `python3` yerine `python` yaz.
        5. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
    code:
      - file: terminal
        lang: sh
        text: |
          python3 --version
          git --version
    mistakes:
      - problem:
          en: "Python is older than 3.12 (for example 3.10 from the system)."
          tr: "Python 3.12'den eski (örneğin sistemden gelen 3.10)."
        fix:
          en: "Install a new Python from python.org. Django 6.1 refuses to install on older Python versions."
          tr: "python.org'dan yeni bir Python kur. Django 6.1 eski Python sürümlerine kurulmaz."
      - problem:
          en: "\"command not found\" or \"python is not recognized\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found\" ya da \"python is not recognized\" hatası."
        fix:
          en: "Close the terminal (or VS Code) and open it again so it sees the new program. On Windows, reinstall and tick Add python.exe to PATH."
          tr: "Terminali (ya da VS Code'u) kapatıp yeniden aç ki yeni programı görsün. Windows'ta Python'u yeniden kur ve Add python.exe to PATH kutusunu işaretle."
    quiz:
      - q:
          en: "Which Python version does Django 6.1 need?"
          tr: "Django 6.1 hangi Python sürümünü ister?"
        options:
          en:
            - "Python 2.7 or newer"
            - "Python 3.12 or newer"
            - "Only Python 3.14"
          tr:
            - "Python 2.7 ya da yenisi"
            - "Python 3.12 ya da yenisi"
            - "Sadece Python 3.14"
        answer: 1
        why:
          en: "Django 6.1 supports Python 3.12, 3.13 and 3.14."
          tr: "Django 6.1; Python 3.12, 3.13 ve 3.14'ü destekler."
    sources:
      - title: Django 6.1 release notes, Python compatibility
        url: https://docs.djangoproject.com/en/6.1/releases/6.1/#python-compatibility
      - title: How to install Django
        url: https://docs.djangoproject.com/en/6.1/intro/install/
      - title: Git installation
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: first-site
    stage: first-code
    title:
      en: "Create your first Django project"
      tr: "İlk Django projeni oluşturma"
    minutes: 30
    needs: [setup]
    why:
      en: "A Django site needs many files before the first page works: settings, a main URL file, a server entry point. Django creates all of them with one command, and its built-in server shows you a working page in a minute."
      tr: "Bir Django sitesinde ilk sayfanın çalışması için ayarlar, ana URL dosyası, sunucu giriş noktası gibi birçok dosya gerekir. Django hepsini tek komutla oluşturur ve yerleşik sunucusu bir dakika içinde çalışan bir sayfa gösterir."
    learn:
      en: |
        - What a virtual environment is: a private folder of packages for one project
        - What `django-admin startproject` creates, and what `manage.py` is
        - What a migration is, and why `migrate` runs before anything else
        - How to start the development server and stop it again
      tr: |
        - Sanal ortamın (virtual environment) ne olduğu: tek bir projeye ait özel bir paket klasörü
        - `django-admin startproject` komutunun ne oluşturduğu ve `manage.py` dosyasının ne olduğu
        - Migration'ın ne olduğu ve `migrate` komutunun neden en başta çalıştığı
        - Geliştirme sunucusunu nasıl başlatıp durduracağın
    do:
      en: |
        1. Make a folder for the project and go into it. The folder is called `recipebox`. On Windows write `python` instead of `python3`.
        2. Create a virtual environment and switch it on. On Linux and macOS use the first activation line. On Windows PowerShell use `.venv\Scripts\Activate.ps1`. You should see `(.venv)` at the start of the prompt. Do this again every time you open a new terminal.
        3. Install Django with pip, Python's package installer.
        4. Create the project. **Do not forget the dot at the end**: it puts the files in the current folder.
        5. Run `migrate`. It creates the database file `db.sqlite3` and the tables Django itself needs (users, sessions and so on).
        6. Start the server and open http://127.0.0.1:8000. You see Django's welcome page with a rocket. Stop the server with `Ctrl+C`.
        7. Save this first version with Git: `git init`, then `git add .`, then `git commit -m "Start Recipe Box"`. Do not worry about `.venv` and `db.sqlite3` now; the packaging step adds a `.gitignore` file.
      tr: |
        1. Proje için bir klasör oluştur ve içine gir. Klasörün adı `recipebox`. Windows'ta `python3` yerine `python` yaz.
        2. Bir sanal ortam oluştur ve etkinleştir. Linux ve macOS'ta ilk etkinleştirme satırını kullan. Windows PowerShell'de `.venv\Scripts\Activate.ps1` yaz. İstemin (prompt) başında `(.venv)` görmelisin. Yeni bir terminal her açtığında bunu yeniden yap.
        3. Django'yu Python'un paket kurucusu pip ile kur.
        4. Projeyi oluştur. **Sondaki noktayı unutma**: dosyaları bulunduğun klasöre koyar.
        5. `migrate` çalıştır. `db.sqlite3` veritabanı dosyasını ve Django'nun kendisinin ihtiyaç duyduğu tabloları (kullanıcılar, oturumlar vb.) oluşturur.
        6. Sunucuyu başlat ve http://127.0.0.1:8000 adresini aç. Roket çizimli Django karşılama sayfasını görürsün. Sunucuyu `Ctrl+C` ile durdur.
        7. Bu ilk sürümü Git ile kaydet: `git init`, sonra `git add .`, sonra `git commit -m "Start Recipe Box"`. `.venv` ve `db.sqlite3` şimdilik dert değil; paketleme adımında bir `.gitignore` dosyası ekleyeceğiz.
    code:
      - file: terminal
        lang: sh
        text: |
          mkdir recipebox
          cd recipebox
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install django
          django-admin startproject mysite .
          python manage.py migrate
          python manage.py runserver
    mistakes:
      - problem:
          en: "Leaving out the final dot in `startproject`."
          tr: "`startproject` komutunda sondaki noktayı unutmak."
        fix:
          en: "Without the dot you get an extra nested folder `recipebox/mysite/manage.py`. Delete the project folder and start again with the dot."
          tr: "Nokta olmazsa fazladan iç içe bir klasör oluşur: `recipebox/mysite/manage.py`. Proje klasörünü silip noktayla yeniden başla."
      - problem:
          en: "\"django-admin: command not found\" or \"No module named django\"."
          tr: "\"django-admin: command not found\" ya da \"No module named django\" hatası."
        fix:
          en: "The virtual environment is not switched on in this terminal. Run the activation line again, then `python -m pip install django`."
          tr: "Sanal ortam bu terminalde etkin değil. Etkinleştirme satırını yeniden çalıştır, sonra `python -m pip install django` yaz."
    quiz:
      - q:
          en: "What does `python manage.py runserver` do?"
          tr: "`python manage.py runserver` ne yapar?"
        options:
          en:
            - "Starts a local development server that reloads when you save code"
            - "Publishes your site on the internet"
            - "Installs Django"
          tr:
            - "Kodu kaydettikçe kendini yenileyen yerel bir geliştirme sunucusu başlatır"
            - "Siteni internette yayınlar"
            - "Django'yu kurar"
        answer: 0
        why:
          en: "It is only for your own computer while you build. A real server for the internet comes in the deploy step."
          tr: "Sadece sen yazarken kendi bilgisayarın içindir. İnternet için gerçek sunucu deploy adımında gelecek."
    sources:
      - title: "Writing your first Django app, part 1"
        url: https://docs.djangoproject.com/en/6.1/intro/tutorial01/
      - title: Python venv, creating virtual environments
        url: https://docs.python.org/3/library/venv.html
      - title: "django-admin and manage.py"
        url: https://docs.djangoproject.com/en/6.1/ref/django-admin/

  - id: first-view
    stage: first-code
    title:
      en: "Your first page: an app, a view and a URL"
      tr: "İlk sayfan: bir app, bir view ve bir URL"
    minutes: 25
    needs: [first-site]
    why:
      en: "Every page in Django comes from the same chain: a URL is matched to a view, and the view returns a response. If you understand this chain once, the rest of Django is just more of it."
      tr: "Django'daki her sayfa aynı zincirden çıkar: URL bir view ile eşleşir, view de bir yanıt (response) döndürür. Bu zinciri bir kere anlarsan Django'nun geri kalanı bunun devamıdır."
    learn:
      en: |
        - A project is the whole site; an app is one part of it (here: recipes)
        - A view is a Python function that takes a request and returns a response
        - `path()` connects a URL to a view, and `include()` hands a group of URLs to an app
        - Why `INSTALLED_APPS` must list your app
      tr: |
        - Proje tüm sitedir; app ise onun bir parçasıdır (burada: tarifler)
        - View, bir istek (request) alıp yanıt döndüren Python fonksiyonudur
        - `path()` bir URL'yi view'a bağlar, `include()` bir URL grubunu app'e devreder
        - `INSTALLED_APPS` listesinin neden app'ini içermesi gerektiği
    do:
      en: |
        1. Create the app with the first command below. It makes a `recipes` folder.
        2. Open `mysite/settings.py` and add `'recipes',` as the last line inside the `INSTALLED_APPS` list.
        3. Replace the content of `recipes/views.py` with the first file below.
        4. Create the new file `recipes/urls.py` with the second file below.
        5. Replace the content of `mysite/urls.py` with the third file below. The `admin/` line is already part of the project; you add the `include`.
        6. Run the server (`python manage.py runserver`) and open http://127.0.0.1:8000. You see the text from the view instead of the rocket.
        7. Commit: `git add .` then `git commit -m "First view"`.
      tr: |
        1. Aşağıdaki ilk komutla app'i oluştur. Bir `recipes` klasörü çıkar.
        2. `mysite/settings.py` dosyasını aç ve `INSTALLED_APPS` listesinin içine son satır olarak `'recipes',` ekle.
        3. `recipes/views.py` içeriğini aşağıdaki ilk dosyayla değiştir.
        4. Aşağıdaki ikinci dosyayla yeni `recipes/urls.py` dosyasını oluştur.
        5. `mysite/urls.py` içeriğini aşağıdaki üçüncü dosyayla değiştir. `admin/` satırı zaten projede var; sen `include` satırını eklersin.
        6. Sunucuyu çalıştır (`python manage.py runserver`) ve http://127.0.0.1:8000 adresini aç. Roket yerine view'daki yazıyı görürsün.
        7. Commit'le: `git add .` sonra `git commit -m "First view"`.
    code:
      - file: terminal
        lang: sh
        text: |
          python manage.py startapp recipes
      - file: "mysite/settings.py (change)"
        lang: py
        text: |
          INSTALLED_APPS = [
              'django.contrib.admin',
              'django.contrib.auth',
              'django.contrib.contenttypes',
              'django.contrib.sessions',
              'django.contrib.messages',
              'django.contrib.staticfiles',
              'recipes',
          ]
      - file: recipes/views.py
        lang: py
        text: |
          from django.http import HttpResponse


          def home(request):
              return HttpResponse("Recipe Box is alive.")
      - file: recipes/urls.py
        lang: py
        text: |
          from django.urls import path

          from . import views

          app_name = "recipes"
          urlpatterns = [
              path("", views.home, name="home"),
          ]
      - file: mysite/urls.py
        lang: py
        text: |
          from django.contrib import admin
          from django.urls import include, path

          urlpatterns = [
              path("admin/", admin.site.urls),
              path("", include("recipes.urls")),
          ]
    mistakes:
      - problem:
          en: "Forgetting to add the app to `INSTALLED_APPS`."
          tr: "App'i `INSTALLED_APPS`'e eklemeyi unutmak."
        fix:
          en: "The page may still work, but later the model gets no migration and the templates are not found. Add `'recipes',` now."
          tr: "Sayfa yine çalışabilir ama sonra modele migration oluşmaz ve template'ler bulunmaz. `'recipes',` satırını şimdi ekle."
      - problem:
          en: "\"ModuleNotFoundError: No module named 'recipes.urls'\"."
          tr: "\"ModuleNotFoundError: No module named 'recipes.urls'\" hatası."
        fix:
          en: "You did not create `recipes/urls.py` yet (it is not made by `startapp`). Create it with the content above."
          tr: "`recipes/urls.py` dosyasını henüz oluşturmadın (`startapp` bunu yapmaz). Yukarıdaki içerikle oluştur."
    quiz:
      - q:
          en: "What does a view return?"
          tr: "View ne döndürür?"
        options:
          en:
            - "A response, such as a page or JSON"
            - "A database table"
            - "A URL pattern"
          tr:
            - "Bir yanıt (response), örneğin bir sayfa ya da JSON"
            - "Bir veritabanı tablosu"
            - "Bir URL kalıbı"
        answer: 0
        why:
          en: "A view takes the request and returns a response; the URL file only decides which view runs."
          tr: "View isteği alır ve yanıt döndürür; URL dosyası yalnızca hangi view'ın çalışacağına karar verir."
    sources:
      - title: "Writing your first Django app, part 1: views and URLs"
        url: https://docs.djangoproject.com/en/6.1/intro/tutorial01/#write-your-first-view
      - title: URL dispatcher
        url: https://docs.djangoproject.com/en/6.1/topics/http/urls/
      - title: Applications
        url: https://docs.djangoproject.com/en/6.1/ref/applications/

  - id: models
    stage: basics
    title:
      en: "Store recipes: a model and a migration"
      tr: "Tarifleri saklama: bir model ve bir migration"
    minutes: 35
    needs: [first-view]
    why:
      en: "A site that forgets everything when you restart it is not useful. A model describes the data you keep, and Django turns it into a database table for you, so you do not write SQL by hand."
      tr: "Yeniden başlatınca her şeyi unutan bir site işe yaramaz. Model, sakladığın veriyi tanımlar; Django bunu senin için bir veritabanı tablosuna çevirir, yani elle SQL yazmazsın."
    learn:
      en: |
        - A model is a Python class; each field becomes a column
        - `ForeignKey` links a recipe to its author (a user)
        - `makemigrations` writes a migration file; `migrate` applies it to the database
        - The Django shell: Python with your project loaded, to try queries
      tr: |
        - Model bir Python sınıfıdır; her alan (field) bir sütun olur
        - `ForeignKey` bir tarifi yazarına (bir kullanıcıya) bağlar
        - `makemigrations` bir migration dosyası yazar; `migrate` onu veritabanına uygular
        - Django shell: projen yüklenmiş Python; sorguları denemek için
    do:
      en: |
        1. Replace the content of `recipes/models.py` with the file below.
        2. Run `makemigrations`. Django reads your model and writes `recipes/migrations/0001_initial.py`. Open that file and read it: it is plain Python.
        3. Run `migrate` to create the table.
        4. Open the Django shell and try the commands. The shell has already imported your models and `User`. Leave it with `exit()`.
        5. Commit: `git add .` then `git commit -m "Recipe model"`.
      tr: |
        1. `recipes/models.py` içeriğini aşağıdaki dosyayla değiştir.
        2. `makemigrations` çalıştır. Django modelini okur ve `recipes/migrations/0001_initial.py` dosyasını yazar. O dosyayı aç ve oku: düz Python.
        3. Tabloyu oluşturmak için `migrate` çalıştır.
        4. Django shell'i aç ve komutları dene. Shell modellerini ve `User`'ı kendisi import etmiş olur. `exit()` ile çık.
        5. Commit'le: `git add .` sonra `git commit -m "Recipe model"`.
    code:
      - file: recipes/models.py
        lang: py
        text: |
          from django.conf import settings
          from django.db import models


          class Recipe(models.Model):
              title = models.CharField(max_length=120)
              ingredients = models.TextField(help_text="One ingredient per line.")
              steps = models.TextField()
              author = models.ForeignKey(
                  settings.AUTH_USER_MODEL,
                  on_delete=models.CASCADE,
                  related_name="recipes",
              )
              created = models.DateTimeField(auto_now_add=True)

              class Meta:
                  ordering = ["-created"]

              def __str__(self):
                  return self.title
      - file: terminal
        lang: sh
        text: |
          python manage.py makemigrations
          python manage.py migrate
          python manage.py shell
      - file: terminal (in the shell)
        lang: py
        text: |
          >>> cook = User.objects.create_user("cook")
          >>> Recipe.objects.create(title="Pancakes", ingredients="200 g flour\n300 ml milk\n2 eggs", steps="Whisk everything.\nFry in a hot pan.", author=cook)
          <Recipe: Pancakes>
          >>> Recipe.objects.count()
          1
          >>> Recipe.objects.filter(title__contains="Pan").first().author
          <User: cook>
    mistakes:
      - problem:
          en: "Changing a model and forgetting `makemigrations` and `migrate`."
          tr: "Modeli değiştirip `makemigrations` ve `migrate` çalıştırmayı unutmak."
        fix:
          en: "The database does not change by itself. After every model change run both commands, in that order. The error \"no such column\" means you skipped one."
          tr: "Veritabanı kendiliğinden değişmez. Her model değişikliğinden sonra iki komutu bu sırayla çalıştır. \"no such column\" hatası birini atladığın anlamına gelir."
      - problem:
          en: "\"No changes detected\" after `makemigrations`."
          tr: "`makemigrations` sonrası \"No changes detected\" mesajı."
        fix:
          en: "The app is probably missing from `INSTALLED_APPS`, or you did not save `models.py`."
          tr: "App büyük ihtimalle `INSTALLED_APPS`'te yok ya da `models.py` dosyasını kaydetmedin."
    quiz:
      - q:
          en: "What does `python manage.py migrate` do?"
          tr: "`python manage.py migrate` ne yapar?"
        options:
          en:
            - "Applies migration files to the database"
            - "Writes the migration files from your models"
            - "Copies the database to the server"
          tr:
            - "Migration dosyalarını veritabanına uygular"
            - "Modellerinden migration dosyalarını yazar"
            - "Veritabanını sunucuya kopyalar"
        answer: 0
        why:
          en: "`makemigrations` writes the files, `migrate` runs them against the database."
          tr: "`makemigrations` dosyaları yazar, `migrate` onları veritabanına uygular."
    sources:
      - title: "Writing your first Django app, part 2: models and the database"
        url: https://docs.djangoproject.com/en/6.1/intro/tutorial02/
      - title: Model field reference
        url: https://docs.djangoproject.com/en/6.1/ref/models/fields/
      - title: Migrations
        url: https://docs.djangoproject.com/en/6.1/topics/migrations/

  - id: admin
    stage: basics
    title:
      en: "Manage data with the admin panel"
      tr: "Admin paneliyle veri yönetme"
    minutes: 25
    needs: [models]
    why:
      en: "Django ships a full admin panel that reads your models and gives you forms to add, edit, search and delete rows. It saves you from writing a management screen, and you can use it for the whole life of the site."
      tr: "Django, modellerini okuyup satır ekleme, düzenleme, arama ve silme formları sunan eksiksiz bir admin paneliyle gelir. Bir yönetim ekranı yazmaktan kurtarır ve sitenin bütün ömrü boyunca kullanabilirsin."
    learn:
      en: |
        - A superuser is an account that may do everything in the admin
        - `admin.py` tells the admin which models to show and how
        - `list_display`, `search_fields` and `list_filter` shape the list page
      tr: |
        - Superuser, admin içinde her şeyi yapabilen hesaptır
        - `admin.py` admin'e hangi modelleri nasıl göstereceğini söyler
        - `list_display`, `search_fields` ve `list_filter` liste sayfasını şekillendirir
    do:
      en: |
        1. Create the new file `recipes/admin.py` content below (replace what is there).
        2. Create a superuser with `createsuperuser`. Pick a username, an email (you may leave it empty) and a password. The password is not shown while you type; that is normal.
        3. Start the server and open http://127.0.0.1:8000/admin/. Log in.
        4. Click **Recipes** → **Add recipe**. Fill the form, choose yourself as the author, and save. Add two or three recipes.
        5. Use the search box and the filter on the list page.
        6. Commit: `git add .` then `git commit -m "Admin for recipes"`.
      tr: |
        1. `recipes/admin.py` içeriğini aşağıdaki gibi yap (içindekini değiştir).
        2. `createsuperuser` ile bir superuser oluştur. Bir kullanıcı adı, bir e-posta (boş bırakabilirsin) ve bir parola seç. Yazarken parola görünmez; bu normal.
        3. Sunucuyu başlat ve http://127.0.0.1:8000/admin/ adresini aç. Giriş yap.
        4. **Recipes** → **Add recipe** üzerine tıkla. Formu doldur, yazar olarak kendini seç ve kaydet. İki üç tarif ekle.
        5. Liste sayfasındaki arama kutusunu ve süzgeci dene.
        6. Commit'le: `git add .` sonra `git commit -m "Admin for recipes"`.
    code:
      - file: recipes/admin.py
        lang: py
        text: |
          from django.contrib import admin

          from .models import Recipe


          @admin.register(Recipe)
          class RecipeAdmin(admin.ModelAdmin):
              list_display = ["title", "author", "created"]
              search_fields = ["title", "ingredients"]
              list_filter = ["created"]
      - file: terminal
        lang: sh
        text: |
          python manage.py createsuperuser
          python manage.py runserver
    mistakes:
      - problem:
          en: "The model does not appear in the admin."
          tr: "Model admin'de görünmüyor."
        fix:
          en: "It has to be registered in `admin.py`, and the app has to be in `INSTALLED_APPS`. Restart the server if you just created `admin.py`."
          tr: "`admin.py` içinde kayıtlı olmalı ve app `INSTALLED_APPS`'te olmalı. `admin.py`'yi yeni oluşturduysan sunucuyu yeniden başlat."
      - problem:
          en: "Forgetting the superuser password."
          tr: "Superuser parolasını unutmak."
        fix:
          en: "Run `python manage.py changepassword <username>` and set a new one."
          tr: "`python manage.py changepassword <kullanıcı adı>` çalıştırıp yenisini belirle."
    quiz:
      - q:
          en: "What must you do for a model to show up in the admin?"
          tr: "Bir modelin admin'de görünmesi için ne yapmalısın?"
        options:
          en:
            - "Register it in admin.py"
            - "Nothing, all models always show up"
            - "Run collectstatic"
          tr:
            - "admin.py içinde kaydetmelisin"
            - "Hiçbir şey, bütün modeller kendiliğinden görünür"
            - "collectstatic çalıştırmalısın"
        answer: 0
        why:
          en: "Django's own models (users, groups) are registered for you; your models are not until you register them."
          tr: "Django'nun kendi modelleri (kullanıcı, grup) senin için kayıtlıdır; seninkiler sen kaydedene kadar kayıtlı değildir."
    sources:
      - title: "Writing your first Django app, part 2: the admin"
        url: https://docs.djangoproject.com/en/6.1/intro/tutorial02/#introducing-the-django-admin
      - title: The Django admin site
        url: https://docs.djangoproject.com/en/6.1/ref/contrib/admin/

  - id: templates
    stage: basics
    title:
      en: "Show recipes: templates, a list page and CSS"
      tr: "Tarifleri gösterme: template'ler, bir liste sayfası ve CSS"
    minutes: 40
    needs: [admin]
    why:
      en: "A view that builds HTML in Python strings turns messy fast. Templates keep the HTML in its own files and let you fill in the data. Template inheritance lets every page share one layout."
      tr: "HTML'i Python metinleriyle üreten bir view çabuk karmaşıklaşır. Template'ler HTML'i kendi dosyalarında tutar ve veriyi içine koymana izin verir. Template kalıtımı (inheritance) bütün sayfaların tek bir düzeni paylaşmasını sağlar."
    learn:
      en: |
        - `render()` fills a template with data (the context)
        - `{{ value }}` prints data and `{% for %}` loops; Django escapes HTML for you
        - `{% extends %}` and `{% block %}` share one layout between pages
        - Template partials (new in Django 6.0): `{% partialdef %}` defines a reusable piece and `{% partial %}` renders it
        - Static files such as CSS and the `{% static %}` tag
      tr: |
        - `render()` bir template'i veriyle (context) doldurur
        - `{{ value }}` veriyi yazdırır, `{% for %}` döngü kurar; Django HTML'i senin için kaçırır (escape)
        - `{% extends %}` ve `{% block %}` sayfalar arasında tek bir düzeni paylaştırır
        - Template partial'ları (Django 6.0 ile geldi): `{% partialdef %}` yeniden kullanılabilir bir parça tanımlar, `{% partial %}` onu çizer
        - CSS gibi statik dosyalar ve `{% static %}` etiketi
    do:
      en: |
        1. Replace `recipes/views.py` with the first file below. The old `home` view is gone; the new one is `recipe_list`.
        2. Replace `recipes/urls.py` with the second file below.
        3. Create the folders `recipes/templates/recipes/` and `recipes/static/recipes/` (the app name appears twice on purpose: it stops two apps from clashing on a file name).
        4. Create `base.html`, `list.html` and `style.css` with the files below.
        5. Reload http://127.0.0.1:8000. You see your recipes with their authors. Change a title in the admin and reload to see it change.
        6. Open `list.html` and read how the `card` partial is defined once and used inside the loop.
        7. Commit: `git add .` then `git commit -m "Recipe list page"`.
      tr: |
        1. `recipes/views.py` dosyasını aşağıdaki ilk dosyayla değiştir. Eski `home` view'ı gitti; yenisi `recipe_list`.
        2. `recipes/urls.py` dosyasını aşağıdaki ikinci dosyayla değiştir.
        3. `recipes/templates/recipes/` ve `recipes/static/recipes/` klasörlerini oluştur (app adı bilerek iki kez geçiyor: iki app'in dosya adında çakışmasını önler).
        4. Aşağıdaki dosyalarla `base.html`, `list.html` ve `style.css` dosyalarını oluştur.
        5. http://127.0.0.1:8000 adresini yenile. Tariflerini yazarlarıyla birlikte görürsün. Admin'de bir başlığı değiştirip yenileyerek değişimi gör.
        6. `list.html` dosyasını aç ve `card` partial'ının bir kere tanımlanıp döngü içinde nasıl kullanıldığını oku.
        7. Commit'le: `git add .` sonra `git commit -m "Recipe list page"`.
    code:
      - file: recipes/views.py
        lang: py
        text: |
          from django.shortcuts import render

          from .models import Recipe


          def recipe_list(request):
              recipes = Recipe.objects.all()
              return render(request, "recipes/list.html", {"recipes": recipes})
      - file: recipes/urls.py
        lang: py
        text: |
          from django.urls import path

          from . import views

          app_name = "recipes"
          urlpatterns = [
              path("", views.recipe_list, name="list"),
          ]
      - file: recipes/templates/recipes/base.html
        lang: html
        text: |
          {% load static %}<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>{% block title %}Recipe Box{% endblock %}</title>
              <link rel="stylesheet" href="{% static 'recipes/style.css' %}">
            </head>
            <body>
              <header class="top">
                <a class="brand" href="{% url 'recipes:list' %}">Recipe Box</a>
              </header>
              <main>
                {% block content %}{% endblock %}
              </main>
            </body>
          </html>
      - file: recipes/templates/recipes/list.html
        lang: html
        text: |
          {% extends "recipes/base.html" %}

          {% block title %}All recipes - Recipe Box{% endblock %}

          {% block content %}
            <h1>Recipes</h1>

            {% partialdef card %}
              <article class="card">
                <h2>{{ recipe.title }}</h2>
                <p class="meta">by {{ recipe.author.username }}</p>
              </article>
            {% endpartialdef %}

            {% for recipe in recipes %}
              {% partial card %}
            {% empty %}
              <p>No recipes yet.</p>
            {% endfor %}
          {% endblock %}
      - file: recipes/static/recipes/style.css
        lang: css
        text: |
          body {
            font-family: system-ui, sans-serif;
            line-height: 1.5;
            margin: 0;
            color: #222;
            background: #faf7f2;
          }
          .top {
            display: flex;
            gap: 1rem;
            align-items: center;
            padding: 0.75rem 1rem;
            background: #7a2e0e;
          }
          .top a, .top button {
            color: #fff;
            text-decoration: none;
          }
          .top form {
            display: inline;
          }
          .top button {
            background: none;
            border: 0;
            font: inherit;
            cursor: pointer;
            padding: 0;
          }
          .brand {
            font-weight: 700;
            margin-right: auto;
          }
          main {
            max-width: 42rem;
            margin: 0 auto;
            padding: 1rem;
          }
          .card {
            background: #fff;
            border: 1px solid #e4dccd;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            margin-bottom: 1rem;
          }
          .card h2 {
            margin: 0.25rem 0;
            font-size: 1.2rem;
          }
          .meta {
            color: #6b6258;
            margin: 0 0 0.5rem;
          }
          label {
            display: block;
            margin-top: 0.75rem;
            font-weight: 600;
          }
          input[type=text], input[type=password], textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 0.4rem;
            font: inherit;
          }
          .helptext, .errorlist {
            font-size: 0.9rem;
            color: #6b6258;
          }
          .errorlist {
            color: #b00020;
            list-style: none;
            padding: 0;
          }
          .pages {
            display: flex;
            gap: 1rem;
            justify-content: space-between;
          }
    mistakes:
      - problem:
          en: "\"TemplateDoesNotExist: recipes/list.html\"."
          tr: "\"TemplateDoesNotExist: recipes/list.html\" hatası."
        fix:
          en: "The path must be exactly `recipes/templates/recipes/list.html` (two `recipes`), and `recipes` must be in `INSTALLED_APPS`."
          tr: "Yol tam olarak `recipes/templates/recipes/list.html` olmalı (iki kez `recipes`) ve `recipes` `INSTALLED_APPS`'te olmalı."
      - problem:
          en: "The page has no style, or the CSS file is not found."
          tr: "Sayfada stil yok ya da CSS dosyası bulunamıyor."
        fix:
          en: "Put the file in `recipes/static/recipes/style.css`, start the template with `{% load static %}`, and restart the server after creating the static folder for the first time."
          tr: "Dosyayı `recipes/static/recipes/style.css` yoluna koy, template'e `{% load static %}` ile başla ve static klasörünü ilk kez oluşturduysan sunucuyu yeniden başlat."
    quiz:
      - q:
          en: "What does {% extends \"recipes/base.html\" %} do?"
          tr: "{% extends \"recipes/base.html\" %} ne yapar?"
        options:
          en:
            - "Makes the page reuse the layout of base.html and fill its blocks"
            - "Installs a new app"
            - "Copies base.html into the database"
          tr:
            - "Sayfanın base.html düzenini kullanıp bloklarını doldurmasını sağlar"
            - "Yeni bir app kurar"
            - "base.html dosyasını veritabanına kopyalar"
        answer: 0
        why:
          en: "The child template only writes the blocks it wants to change; the rest comes from the parent."
          tr: "Alt template yalnızca değiştirmek istediği blokları yazar; geri kalanı üst template'ten gelir."
    sources:
      - title: "Writing your first Django app, part 3: templates"
        url: https://docs.djangoproject.com/en/6.1/intro/tutorial03/#use-the-template-system
      - title: "Template partials, partialdef and partial"
        url: https://docs.djangoproject.com/en/6.1/ref/templates/builtins/#partial
      - title: "Writing your first Django app, part 6: static files"
        url: https://docs.djangoproject.com/en/6.1/intro/tutorial06/

  - id: recipe-site
    stage: first-project
    title:
      en: "Finish the reading side: detail pages and 404"
      tr: "Okuma tarafını bitirme: detay sayfaları ve 404"
    minutes: 35
    needs: [templates]
    why:
      en: "Now the site becomes a real site: every recipe gets its own page and its own address you can share. You also learn what to do when someone asks for a recipe that does not exist."
      tr: "Site artık gerçek bir siteye dönüşüyor: her tarifin kendi sayfası ve paylaşabileceğin kendi adresi olur. Olmayan bir tarif istendiğinde ne yapılacağını da öğrenirsin."
    learn:
      en: |
        - A URL with a variable part: `<int:pk>`
        - `get_object_or_404()` returns the row or a clean 404 page
        - `get_absolute_url()` gives a model one place that knows its own address
        - A custom `404.html` template
      tr: |
        - Değişken parçalı bir URL: `<int:pk>`
        - `get_object_or_404()` satırı ya da temiz bir 404 sayfası döndürür
        - `get_absolute_url()` modelin kendi adresini bilen tek bir yer verir
        - Özel bir `404.html` template'i
    do:
      en: |
        1. Replace `recipes/models.py` with the first file below. It adds `get_absolute_url()` and a helper that splits the ingredients into lines. The database does not change, so no migration is needed (run `python manage.py makemigrations --check` to see "No changes detected").
        2. Replace `recipes/views.py` and `recipes/urls.py` with the next two files.
        3. Create `detail.html` and `404.html` in `recipes/templates/recipes/` and `recipes/templates/` as shown, and replace `list.html` so the title becomes a link.
        4. Open a recipe from the list. Then open http://127.0.0.1:8000/9999/ . While `DEBUG` is on you see Django's technical 404 page. You will see your own `404.html` after the security step turns debug off.
        5. Commit: `git add .` then `git commit -m "Recipe detail page"`.
      tr: |
        1. `recipes/models.py` dosyasını aşağıdaki ilk dosyayla değiştir. `get_absolute_url()` ve malzemeleri satırlara ayıran bir yardımcı ekler. Veritabanı değişmez, migration gerekmez (`python manage.py makemigrations --check` ile "No changes detected" gör).
        2. `recipes/views.py` ve `recipes/urls.py` dosyalarını sonraki iki dosyayla değiştir.
        3. `detail.html` ve `404.html` dosyalarını gösterilen yerlerde (`recipes/templates/recipes/` ve `recipes/templates/`) oluştur, `list.html` dosyasını da başlık bağlantı olacak şekilde değiştir.
        4. Listeden bir tarif aç. Sonra http://127.0.0.1:8000/9999/ adresini aç. `DEBUG` açıkken Django'nun teknik 404 sayfasını görürsün. Kendi `404.html` sayfanı, güvenlik adımı debug'ı kapatınca göreceksin.
        5. Commit'le: `git add .` sonra `git commit -m "Recipe detail page"`.
    code:
      - file: recipes/models.py
        lang: py
        text: |
          from django.conf import settings
          from django.db import models
          from django.urls import reverse


          class Recipe(models.Model):
              title = models.CharField(max_length=120)
              ingredients = models.TextField(help_text="One ingredient per line.")
              steps = models.TextField()
              author = models.ForeignKey(
                  settings.AUTH_USER_MODEL,
                  on_delete=models.CASCADE,
                  related_name="recipes",
              )
              created = models.DateTimeField(auto_now_add=True)

              class Meta:
                  ordering = ["-created"]

              def __str__(self):
                  return self.title

              def get_absolute_url(self):
                  return reverse("recipes:detail", kwargs={"pk": self.pk})

              def ingredient_list(self):
                  return [line.strip() for line in self.ingredients.splitlines() if line.strip()]
      - file: recipes/views.py
        lang: py
        text: |
          from django.shortcuts import get_object_or_404, render

          from .models import Recipe


          def recipe_list(request):
              recipes = Recipe.objects.all()
              return render(request, "recipes/list.html", {"recipes": recipes})


          def recipe_detail(request, pk):
              recipe = get_object_or_404(Recipe, pk=pk)
              return render(request, "recipes/detail.html", {"recipe": recipe})
      - file: recipes/urls.py
        lang: py
        text: |
          from django.urls import path

          from . import views

          app_name = "recipes"
          urlpatterns = [
              path("", views.recipe_list, name="list"),
              path("<int:pk>/", views.recipe_detail, name="detail"),
          ]
      - file: recipes/templates/recipes/list.html
        lang: html
        text: |
          {% extends "recipes/base.html" %}

          {% block title %}All recipes - Recipe Box{% endblock %}

          {% block content %}
            <h1>Recipes</h1>

            {% partialdef card %}
              <article class="card">
                <h2><a href="{{ recipe.get_absolute_url }}">{{ recipe.title }}</a></h2>
                <p class="meta">by {{ recipe.author.username }}</p>
              </article>
            {% endpartialdef %}

            {% for recipe in recipes %}
              {% partial card %}
            {% empty %}
              <p>No recipes yet.</p>
            {% endfor %}
          {% endblock %}
      - file: recipes/templates/recipes/detail.html
        lang: html
        text: |
          {% extends "recipes/base.html" %}

          {% block title %}{{ recipe.title }} - Recipe Box{% endblock %}

          {% block content %}
            <article>
              <h1>{{ recipe.title }}</h1>
              <p class="meta">by {{ recipe.author.username }} on {{ recipe.created|date:"j F Y" }}</p>

              <h2>Ingredients</h2>
              <ul>
                {% for item in recipe.ingredient_list %}
                  <li>{{ item }}</li>
                {% endfor %}
              </ul>

              <h2>Steps</h2>
              {{ recipe.steps|linebreaks }}
            </article>
            <p><a href="{% url 'recipes:list' %}">All recipes</a></p>
          {% endblock %}
      - file: recipes/templates/404.html
        lang: html
        text: |
          {% extends "recipes/base.html" %}

          {% block title %}Not found - Recipe Box{% endblock %}

          {% block content %}
            <h1>Not found</h1>
            <p>This page does not exist. <a href="{% url 'recipes:list' %}">Back to all recipes</a>.</p>
          {% endblock %}
    mistakes:
      - problem:
          en: "\"NoReverseMatch: Reverse for 'detail' not found\"."
          tr: "\"NoReverseMatch: Reverse for 'detail' not found\" hatası."
        fix:
          en: "The name must match in both places: `name=\"detail\"` in `urls.py` and `recipes:detail` in the template (`recipes` is the `app_name`)."
          tr: "Ad iki yerde de aynı olmalı: `urls.py` içinde `name=\"detail\"` ve template'te `recipes:detail` (`recipes`, `app_name` değeridir)."
      - problem:
          en: "Using `Recipe.objects.get(pk=pk)` in a view."
          tr: "View'da `Recipe.objects.get(pk=pk)` kullanmak."
        fix:
          en: "A missing row raises `DoesNotExist` and the visitor gets a 500 error. `get_object_or_404()` returns a proper 404."
          tr: "Olmayan satır `DoesNotExist` fırlatır ve ziyaretçi 500 hatası görür. `get_object_or_404()` düzgün bir 404 döndürür."
    quiz:
      - q:
          en: "Why use get_object_or_404 instead of Recipe.objects.get?"
          tr: "Neden Recipe.objects.get yerine get_object_or_404 kullanılır?"
        options:
          en:
            - "A missing recipe becomes a clean 404 page instead of a 500 error"
            - "It is faster"
            - "It also creates the recipe"
          tr:
            - "Olmayan tarif 500 hatası yerine temiz bir 404 sayfası olur"
            - "Daha hızlıdır"
            - "Tarifi ayrıca oluşturur"
        answer: 0
        why:
          en: "404 means \"no such page\", which is the true answer; 500 means your code is broken."
          tr: "404 \"böyle bir sayfa yok\" demektir ve doğru cevap odur; 500 ise kodunun bozuk olduğunu söyler."
    sources:
      - title: "Writing your first Django app, part 3: raising 404"
        url: https://docs.djangoproject.com/en/6.1/intro/tutorial03/#raising-a-404-error
      - title: "Model.get_absolute_url()"
        url: https://docs.djangoproject.com/en/6.1/ref/models/instances/#get-absolute-url
      - title: "Customizing error views"
        url: https://docs.djangoproject.com/en/6.1/topics/http/views/#customizing-error-views

  - id: forms
    stage: data-api
    title:
      en: "Let people add recipes with a form"
      tr: "Formla tarif eklemeyi sağlama"
    minutes: 40
    needs: [recipe-site]
    why:
      en: "Until now only you could add recipes, through the admin. A form lets visitors send data to your site. Django forms check the data and show errors, so you never trust what a browser sends."
      tr: "Şimdiye kadar tarifleri sadece sen, admin üzerinden ekleyebiliyordun. Form, ziyaretçilerin siteye veri göndermesini sağlar. Django formları veriyi doğrular ve hata gösterir; tarayıcının gönderdiğine asla körü körüne güvenmezsin."
    learn:
      en: |
        - A `ModelForm` builds a form (and its checks) from a model
        - GET shows the form, POST receives it; after a successful POST you redirect
        - `{% csrf_token %}` protects the form from forged requests
        - `@login_required` keeps a view for logged-in users
        - `save(commit=False)` lets you set `author` yourself before saving
      tr: |
        - `ModelForm` bir modelden form (ve kontrollerini) üretir
        - GET formu gösterir, POST formu alır; başarılı bir POST'tan sonra yönlendirirsin (redirect)
        - `{% csrf_token %}` formu sahte isteklere karşı korur
        - `@login_required` bir view'ı yalnızca giriş yapmış kullanıcılara açar
        - `save(commit=False)` kaydetmeden önce `author` alanını kendin vermeni sağlar
    do:
      en: |
        1. Create `recipes/forms.py` with the first file below. The author is not in the form on purpose: people must not choose who wrote a recipe.
        2. Replace `recipes/views.py`, `recipes/urls.py` with the next files and create `recipes/templates/recipes/form.html`.
        3. Log in at http://127.0.0.1:8000/admin/ first (the site and the admin share the same login session). Then open http://127.0.0.1:8000/new/ , add a recipe, and see the redirect to its page.
        4. Submit the form with the title empty. Django shows an error and keeps what you typed.
        5. Log out of the admin, open `/new/` again. You are sent to `/accounts/login/`, which does not exist yet; the next step builds it.
        6. Commit: `git add .` then `git commit -m "Add recipe form"`.
      tr: |
        1. `recipes/forms.py` dosyasını aşağıdaki ilk dosyayla oluştur. Yazar bilerek formda yok: insanlar bir tarifi kimin yazdığını seçememeli.
        2. `recipes/views.py` ve `recipes/urls.py` dosyalarını sonraki dosyalarla değiştir, `recipes/templates/recipes/form.html` dosyasını oluştur.
        3. Önce http://127.0.0.1:8000/admin/ adresinde giriş yap (site ve admin aynı oturumu paylaşır). Sonra http://127.0.0.1:8000/new/ adresini aç, bir tarif ekle ve tarifin sayfasına yönlendirildiğini gör.
        4. Formu başlık boşken gönder. Django bir hata gösterir ve yazdıklarını korur.
        5. Admin'den çıkış yap ve `/new/` adresini yeniden aç. Henüz var olmayan `/accounts/login/` adresine yönlendirilirsin; sonraki adım onu yapacak.
        6. Commit'le: `git add .` sonra `git commit -m "Add recipe form"`.
    code:
      - file: recipes/forms.py
        lang: py
        text: |
          from django import forms

          from .models import Recipe


          class RecipeForm(forms.ModelForm):
              class Meta:
                  model = Recipe
                  fields = ["title", "ingredients", "steps"]
      - file: recipes/views.py
        lang: py
        text: |
          from django.contrib.auth.decorators import login_required
          from django.shortcuts import get_object_or_404, redirect, render

          from .forms import RecipeForm
          from .models import Recipe


          def recipe_list(request):
              recipes = Recipe.objects.all()
