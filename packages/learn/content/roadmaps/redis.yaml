  - id: monitoring
    stage: monitoring
    title:
      en: "Watch Redis: INFO, SLOWLOG and latency"
      tr: "Redis'i izleme: INFO, SLOWLOG ve gecikme"
    minutes: 50
    needs: [deploy]
    why:
      en: "A cache that quietly stops helping, or a memory that slowly fills, is only noticed when the site gets slow. Redis can tell you its own health: how much memory it uses, whether the cache is hit, which commands are slow. A few numbers, looked at regularly, catch most problems early."
      tr: "Sessizce işe yaramaz hale gelen bir cache ya da yavaş yavaş dolan bir bellek, ancak site yavaşlayınca fark edilir. Redis kendi sağlığını söyleyebilir: ne kadar bellek kullanıyor, cache isabet alıyor mu, hangi komutlar yavaş. Düzenli bakılan birkaç sayı çoğu sorunu erken yakalar."
    learn:
      en: |
        - `INFO` prints server statistics in sections; `INFO memory`, `INFO stats`, `INFO clients`, `INFO keyspace`, `INFO commandstats` show one section
        - The numbers to watch: `used_memory_human` against `maxmemory_human`; `evicted_keys` (rising means the cache is too small); `connected_clients`; `keyspace_hits` and `keyspace_misses`
        - **Hit rate** = hits / (hits + misses). A low or falling rate means the cache is not doing its job (TTL too short, keys too specific, or eviction)
        - **SLOWLOG** keeps the commands that took longer than `slowlog-log-slower-than` microseconds (default 10 000, that is 10 ms). `SLOWLOG GET 5`, `SLOWLOG LEN`, `SLOWLOG RESET`. The time counted is the command's own run time, not the network
        - **Latency**: `redis-cli --latency` pings the server again and again and prints min, max and average in milliseconds; `LATENCY LATEST` and `LATENCY DOCTOR` need `latency-monitor-threshold` to be set first
        - Redis runs commands one at a time, so one slow command (`KEYS *`, a huge `HGETALL`, a big `SMEMBERS`) delays every client behind it. This is why slow commands matter so much
        - `MONITOR` shows every command live. It is useful for a few seconds while debugging, but it slows the server, so never leave it running
        - On Redis Cloud the console has a metrics page with memory, operations per second and connections (see the link below). `docker stats` shows the container's real memory against its limit
      tr: |
        - `INFO` sunucu istatistiklerini bölümler halinde yazar; `INFO memory`, `INFO stats`, `INFO clients`, `INFO keyspace`, `INFO commandstats` tek bir bölümü gösterir
        - İzlenecek sayılar: `maxmemory_human`'a karşı `used_memory_human`; `evicted_keys` (artıyorsa cache çok küçük); `connected_clients`; `keyspace_hits` ve `keyspace_misses`
        - **İsabet oranı (hit rate)** = hits / (hits + misses). Düşük ya da düşen bir oran cache'in işini yapmadığı demektir (TTL çok kısa, anahtarlar çok özel ya da eviction)
        - **SLOWLOG**, `slowlog-log-slower-than` mikrosaniyeden uzun süren komutları tutar (varsayılan 10 000, yani 10 ms). `SLOWLOG GET 5`, `SLOWLOG LEN`, `SLOWLOG RESET`. Sayılan süre ağ değil, komutun kendi çalışma süresidir
        - **Gecikme**: `redis-cli --latency` sunucuya tekrar tekrar ping atar ve min, max ve ortalamayı milisaniye olarak yazar; `LATENCY LATEST` ve `LATENCY DOCTOR` için önce `latency-monitor-threshold` ayarlanmalı
        - Redis komutları teker teker çalıştırır, bu yüzden tek bir yavaş komut (`KEYS *`, dev bir `HGETALL`, büyük bir `SMEMBERS`) arkasındaki her istemciyi geciktirir. Yavaş komutlar bu yüzden bu kadar önemli
        - `MONITOR` her komutu canlı gösterir. Hata ayıklarken birkaç saniye işe yarar ama sunucuyu yavaşlatır, bu yüzden asla çalışır halde bırakma
        - Redis Cloud'da konsolda bellek, saniyedeki işlem ve bağlantıları gösteren bir metrik sayfası var (aşağıdaki bağlantıya bak). `docker stats` container'ın gerçek belleğini sınırına karşı gösterir
    do:
      en: |
        1. Open the admin CLI: `docker exec -it redis-shop redis-cli --user admin --pass admin-secret-456 --no-auth-warning`. Generate some traffic first (open product URLs in the browser or run the loop from the rate-limit step).
        2. Run `INFO memory`, `INFO stats` and `INFO clients`. Find `used_memory_human`, `keyspace_hits`, `keyspace_misses`, `evicted_keys` and `connected_clients`. Your app shows 3 clients plus your CLI.
        3. Run `INFO commandstats` to see which commands your app uses most and how long each call takes on average (`usec_per_call`).
        4. Make the slow log record everything for a moment: `CONFIG SET slowlog-log-slower-than 0`, run a command, then `SLOWLOG GET 2`. Each entry has an id, a time, the duration in microseconds and the command. Set the threshold back to `10000` and run `SLOWLOG RESET`.
        5. Create `scripts/stats.js` below and run `node --env-file=.env scripts/stats.js`. It prints the version, memory, client count, evictions and the hit rate.
        6. In a normal terminal run `docker exec redis-shop redis-cli --user admin --pass admin-secret-456 --no-auth-warning --latency` for a few seconds, then stop it with Ctrl+C. Also run `docker stats --no-stream redis-shop` to compare the container's memory with its 256 MiB limit.
        7. Decide on alerts you would want on a real service: memory above 80% of `maxmemory`, `evicted_keys` rising, hit rate falling, slow log entries appearing, `connected_clients` near the limit.
      tr: |
        1. Admin CLI'ı aç: `docker exec -it redis-shop redis-cli --user admin --pass admin-secret-456 --no-auth-warning`. Önce biraz trafik üret (tarayıcıda ürün URL'lerini aç ya da rate-limit adımındaki döngüyü çalıştır).
        2. `INFO memory`, `INFO stats` ve `INFO clients` çalıştır. `used_memory_human`, `keyspace_hits`, `keyspace_misses`, `evicted_keys` ve `connected_clients` değerlerini bul. Uygulaman 3 istemci gösterir, bir de senin CLI'ın.
        3. Uygulamanın hangi komutları en çok kullandığını ve her çağrının ortalama ne kadar sürdüğünü (`usec_per_call`) görmek için `INFO commandstats` çalıştır.
        4. Slow log'u bir an her şeyi kaydettir: `CONFIG SET slowlog-log-slower-than 0`, bir komut çalıştır, sonra `SLOWLOG GET 2`. Her kayıtta bir id, bir zaman, mikrosaniye cinsinden süre ve komut var. Eşiği `10000`'e geri koy ve `SLOWLOG RESET` çalıştır.
        5. Aşağıdaki `scripts/stats.js` dosyasını oluştur ve `node --env-file=.env scripts/stats.js` çalıştır. Sürümü, belleği, istemci sayısını, eviction'ları ve isabet oranını yazar.
        6. Normal bir terminalde birkaç saniye `docker exec redis-shop redis-cli --user admin --pass admin-secret-456 --no-auth-warning --latency` çalıştır, sonra Ctrl+C ile durdur. Ayrıca container'ın belleğini 256 MiB sınırıyla karşılaştırmak için `docker stats --no-stream redis-shop` çalıştır.
        7. Gerçek bir serviste isteyeceğin alarmlara karar ver: bellek `maxmemory`'nin yüzde 80'inin üstünde, `evicted_keys` artıyor, isabet oranı düşüyor, slow log kayıtları çıkıyor, `connected_clients` sınıra yakın.
    code:
      - file: redis-cli
        lang: text
        text: |
          INFO memory                           # used_memory_human, maxmemory_human
          INFO stats                            # keyspace_hits, keyspace_misses, evicted_keys
          INFO clients                          # connected_clients
          INFO commandstats                     # calls and usec_per_call of each command
          INFO keyspace                         # db0:keys=...,expires=...

          CONFIG SET slowlog-log-slower-than 0  # record every command, just for the demo
          SET app:demo 1
          SLOWLOG GET 2
          CONFIG SET slowlog-log-slower-than 10000
          SLOWLOG RESET

          CONFIG SET latency-monitor-threshold 100
          LATENCY LATEST                        # empty when nothing was slower than 100 ms
          LATENCY DOCTOR
      - file: scripts/stats.js
        lang: js
        text: |
          // A small health report from INFO. Run it as the admin user.
          import { connect } from "../src/redis.js";

          const redis = await connect(process.env.REDIS_ADMIN_URL);
          const info = Object.fromEntries(
            (await redis.info())
              .split("\r\n")
              .filter((line) => line && !line.startsWith("#"))
              .map((line) => line.split(":")),
          );

          const hits = Number(info.keyspace_hits);
          const misses = Number(info.keyspace_misses);
          console.log({
            version: info.redis_version,
            usedMemory: info.used_memory_human,
            maxMemory: info.maxmemory_human,
            clients: info.connected_clients,
            evictedKeys: info.evicted_keys,
            hitRate: hits + misses > 0 ? (hits / (hits + misses)).toFixed(2) : "n/a",
          });
          await redis.close();
      - file: terminal
        lang: sh
        text: |
          node --env-file=.env scripts/stats.js
          docker exec redis-shop redis-cli --user admin --pass admin-secret-456 --no-auth-warning --latency
          docker stats --no-stream redis-shop
          docker logs --tail 20 redis-shop
    mistakes:
      - problem:
          en: "Running `MONITOR` on a busy production server and leaving it."
          tr: "Yoğun bir production sunucusunda `MONITOR` çalıştırıp bırakmak."
        fix:
          en: "MONITOR copies every command to your screen and slows the server down. Use it for seconds, on purpose. For ongoing insight use `INFO`, `SLOWLOG` and your host's metrics."
          tr: "MONITOR her komutu ekranına kopyalar ve sunucuyu yavaşlatır. Saniyeler boyunca, bilerek kullan. Sürekli içgörü için `INFO`, `SLOWLOG` ve host'unun metriklerini kullan."
      - problem:
          en: "Reading the hit rate right after start and worrying."
          tr: "Hemen başlangıçtan sonra isabet oranına bakıp endişelenmek."
        fix:
          en: "A new or just-flushed cache starts with misses. Judge the rate after traffic has run for a while, and watch the trend, not one number. `CONFIG RESETSTAT` resets the counters if you want a clean measurement."
          tr: "Yeni ya da yeni boşaltılmış bir cache miss'lerle başlar. Oranı trafik bir süre aktıktan sonra değerlendir ve tek bir sayıya değil eğilime bak. Temiz bir ölçüm istersen `CONFIG RESETSTAT` sayaçları sıfırlar."
      - problem:
          en: "Looking only at the SLOWLOG when the app is slow."
          tr: "Uygulama yavaşken sadece SLOWLOG'a bakmak."
        fix:
          en: "SLOWLOG counts only the time the command runs inside Redis. A slow network, many small round trips or a busy app server do not show up there. Measure the latency from the app's side too (`redis-cli --latency` from the app's machine)."
          tr: "SLOWLOG sadece komutun Redis içinde çalışma süresini sayar. Yavaş bir ağ, çok sayıda küçük gidiş-dönüş ya da meşgul bir uygulama sunucusu orada görünmez. Gecikmeyi uygulamanın tarafından da ölç (uygulamanın makinesinden `redis-cli --latency`)."
    quiz:
      - q:
          en: "`keyspace_hits` is 900 and `keyspace_misses` is 100. What is the hit rate?"
          tr: "`keyspace_hits` 900 ve `keyspace_misses` 100. İsabet oranı nedir?"
        options:
          en:
            - "0.1"
            - "0.9"
            - "9"
          tr:
            - "0,1"
            - "0,9"
            - "9"
        answer: 1
        why:
          en: "900 / (900 + 100) = 0.9, so nine of ten lookups were found in the cache."
          tr: "900 / (900 + 100) = 0,9; yani on aramanın dokuzu cache'te bulundu."
      - q:
          en: "Why can one slow command hurt every client?"
          tr: "Tek bir yavaş komut neden her istemciye zarar verebilir?"
        options:
          en:
            - "Redis runs commands one at a time, so others wait behind it"
            - "Slow commands delete other keys"
            - "Each client shares one password"
          tr:
            - "Redis komutları teker teker çalıştırır, diğerleri arkasında bekler"
            - "Yavaş komutlar diğer anahtarları siler"
            - "Her istemci aynı şifreyi paylaşır"
        answer: 0
        why:
          en: "Command execution is single threaded, so a long command blocks the ones queued after it."
          tr: "Komut çalıştırma tek iş parçacıklıdır, bu yüzden uzun bir komut arkasındakileri bloklar."
    sources:
      - title: "INFO"
        url: https://redis.io/docs/latest/commands/info/
      - title: "SLOWLOG GET"
        url: https://redis.io/docs/latest/commands/slowlog-get/
      - title: "Monitor Redis Cloud performance"
        url: https://redis.io/docs/latest/operate/rc/databases/monitor-performance/

  - id: advanced
    stage: advanced
    title:
      en: "Stop cache stampedes with a lock, and meet Valkey"
      tr: "Kilitle cache stampede'i önleme ve Valkey ile tanışma"
    minutes: 50
    needs: [monitoring]
    why:
      en: "When a popular cache entry expires, hundreds of requests can miss at the same moment and all ask the slow database together. This is called a cache stampede. A short lock in Redis lets one request rebuild the entry while the others wait for it. It also shows how far the basic commands take you, and that your knowledge carries over to Valkey."
      tr: "Popüler bir cache kaydının süresi dolunca yüzlerce istek aynı anda miss alıp hep birlikte yavaş veritabanına sorabilir. Buna cache stampede denir. Redis'te kısa bir kilit, bir isteğin kaydı yeniden oluşturmasını, diğerlerinin onu beklemesini sağlar. Ayrıca temel komutların seni ne kadar götürdüğünü ve bildiklerinin Valkey'e de taşındığını gösterir."
    learn:
      en: |
        - The lock is one command: `SET lock:key 1 NX EX 10`. `NX` means "only if absent", so exactly one caller gets `OK`; `EX 10` makes the lock vanish after 10 seconds even if its owner crashes
        - The winner loads from the database, writes the cache entry and deletes the lock (in a `finally` block). The losers wait 50 ms and read the cache again
        - A limit on waiting (20 tries here) keeps a request from waiting forever
        - The lock key lives under `app:` too, so the app user is allowed to use it
        - The honest limits: this lock guards one Redis server and short jobs. If the lock expires while its owner is still working, a second owner can start. Do not use it for tasks where two owners would cause damage; look at the Redis docs on distributed locks first
        - Other ideas for stampedes: add a small random amount to each TTL so entries do not expire together, or refresh popular entries before they expire
        - **Valkey** is an open source (BSD) fork of Redis OSS maintained under the Linux Foundation, as its own site says. Its basic commands match, and this project's whole test suite also passes on `valkey/valkey:8-alpine` (Valkey 8.1) with no code changes. Newer Redis-only features may not exist in Valkey and the other way round, so check each one's documentation. Valkey 8 even reports `redis_version:7.2.4` in `INFO` for compatibility, which is good to know if a tool checks that number
        - For Redis, license terms changed with version 8 (AGPLv3, RSALv2 or SSPLv1 to choose from; see the license page). For an app that only uses Redis as a database server these usually change nothing in daily work, but read the terms if you redistribute Redis or offer it as a service
      tr: |
        - Kilit tek bir komuttur: `SET lock:key 1 NX EX 10`. `NX` "sadece yoksa" demektir, yani tam olarak bir çağıran `OK` alır; `EX 10`, sahibi çökse bile kilidin 10 saniye sonra kaybolmasını sağlar
        - Kazanan veritabanından yükler, cache kaydını yazar ve kilidi siler (`finally` bloğunda). Kaybedenler 50 ms bekler ve cache'i yeniden okur
        - Beklemeye konan sınır (burada 20 deneme) bir isteğin sonsuza dek beklemesini önler
        - Kilit anahtarı da `app:` altında yaşar, bu yüzden app kullanıcısının kullanmasına izin var
        - Dürüst sınırlar: bu kilit tek bir Redis sunucusunu ve kısa işleri korur. Sahibi hâlâ çalışırken kilidin süresi dolarsa ikinci bir sahip başlayabilir. İki sahibin zarar vereceği işler için kullanma; önce Redis'in dağıtık kilitler dokümanına bak
        - Stampede için başka fikirler: kayıtlar birlikte dolmasın diye her TTL'e küçük rastgele bir miktar ekle ya da popüler kayıtları süreleri dolmadan yenile
        - **Valkey**, kendi sitesinin dediği gibi, Linux Foundation altında sürdürülen, Redis OSS'in açık kaynak (BSD) bir fork'udur. Temel komutları aynıdır ve bu projenin bütün test paketi `valkey/valkey:8-alpine` (Valkey 8.1) üzerinde de kod değişikliği olmadan geçer. Yeni Redis'e özel özellikler Valkey'de olmayabilir ve tersi de geçerli; her birinin dokümanına bak. Valkey 8, uyumluluk için `INFO` içinde `redis_version:7.2.4` bile bildirir; bir araç bu sayıya bakıyorsa bilmekte fayda var
        - Redis için lisans koşulları 8. sürümle değişti (AGPLv3, RSALv2 ya da SSPLv1 arasından seçilir; lisans sayfasına bak). Redis'i sadece veritabanı sunucusu olarak kullanan bir uygulama için bunlar genelde günlük işte bir şey değiştirmez; ama Redis'i yeniden dağıtıyor ya da servis olarak sunuyorsan koşulları oku
    do:
      en: |
        1. Replace `src/cache.js` with the version below: it keeps `key` and `cached` and adds `cachedOnce`.
        2. In `src/products.js` change the import to `cachedOnce` and the read to `await cachedOnce(redis, ...)` (two small edits).
        3. Add the extra test at the end of `test/app.test.js`: it deletes the cache entry and sends 4 requests at the same moment, then checks that the database was read only once. Run `npm test` (8 passing tests).
        4. To see the difference, change `cachedOnce` back to `cached` in `src/products.js` and run the tests again: the new test fails because the database was read 4 times. Change it back.
        5. Optional, to try Valkey: stop Redis (`docker stop redis-shop`) and run `docker run --rm --name valkey-try --memory 256m -p 127.0.0.1:6380:6379 valkey/valkey:8-alpine`. In another terminal run the tests with `REDIS_TEST_URL=redis://127.0.0.1:6380/15` and `REDIS_URL=redis://127.0.0.1:6380` (put those two lines into `.env` temporarily). Stop it with Ctrl+C, restore `.env` and run `docker start redis-shop`.
        6. Where to go next: Redis Insight (the free graphical tool), the Redis University courses, replicas and Sentinel or cluster for high availability, TLS, and queue libraries like BullMQ.
      tr: |
        1. `src/cache.js`'i aşağıdaki sürümle değiştir: `key` ve `cached` kalır, `cachedOnce` eklenir.
        2. `src/products.js` içinde import'u `cachedOnce` yap ve okumayı `await cachedOnce(redis, ...)` olarak değiştir (iki küçük düzenleme).
        3. `test/app.test.js` sonuna ek testi ekle: cache kaydını siler ve aynı anda 4 istek gönderir, sonra veritabanının sadece bir kez okunduğunu kontrol eder. `npm test` çalıştır (8 geçen test).
        4. Farkı görmek için `src/products.js` içinde `cachedOnce`'ı yeniden `cached` yap ve testleri tekrar çalıştır: yeni test başarısız olur çünkü veritabanı 4 kez okundu. Geri değiştir.
        5. İsteğe bağlı, Valkey'i denemek için: Redis'i durdur (`docker stop redis-shop`) ve `docker run --rm --name valkey-try --memory 256m -p 127.0.0.1:6380:6379 valkey/valkey:8-alpine` çalıştır. Başka bir terminalde testleri `REDIS_TEST_URL=redis://127.0.0.1:6380/15` ve `REDIS_URL=redis://127.0.0.1:6380` ile çalıştır (bu iki satırı geçici olarak `.env`'e koy). Ctrl+C ile durdur, `.env`'i geri yükle ve `docker start redis-shop` çalıştır.
        6. Sonra nereye: Redis Insight (ücretsiz grafik araç), Redis University kursları, yüksek erişilebilirlik için replica'lar ile Sentinel ya da cluster, TLS ve BullMQ gibi kuyruk kütüphaneleri.
    code:
      - file: src/cache.js
        lang: js
        text: |
          // Every key the app writes starts with "app:", so one ACL rule can cover them all.
          export const key = (...parts) => ["app", ...parts].join(":");

          // Cache-aside: look in Redis first, ask the database only on a miss.
          export async function cached(redis, k, ttlSeconds, load) {
            const hit = await redis.get(k);
            if (hit !== null) return { value: JSON.parse(hit), hit: true };

            const value = await load();
            if (value !== null) {
              await redis.set(k, JSON.stringify(value), { expiration: { type: "EX", value: ttlSeconds } });
            }
            return { value, hit: false };
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          // Like cached(), but when the entry is missing only ONE caller asks the database.
          // The others wait a moment and read what the first one stored (a "cache stampede" guard).
          export async function cachedOnce(redis, k, ttlSeconds, load) {
            for (let attempt = 0; attempt < 20; attempt++) {
              const hit = await redis.get(k);
              if (hit !== null) return { value: JSON.parse(hit), hit: true };

              // SET ... NX only succeeds for the first caller. EX makes the lock vanish if that caller crashes.
              const gotLock = await redis.set(key("lock", k), "1", { condition: "NX", expiration: { type: "EX", value: 10 } });
              if (gotLock) {
                try {
                  const value = await load();
                  if (value !== null) {
                    await redis.set(k, JSON.stringify(value), { expiration: { type: "EX", value: ttlSeconds } });
                  }
                  return { value, hit: false };
                } finally {
                  await redis.del(key("lock", k));
                }
              }
              await sleep(50);
            }
            throw new Error("cache is busy, try again");
          }
      - file: src/products.js
        lang: js
        text: |
          // change these two lines, the rest stays as it was
          import { cachedOnce, key } from "./cache.js";
          // ...
          const { value, hit } = await cachedOnce(redis, key("product", id), ttl, () => db.getProduct(id));
      - file: test/app.test.js
        lang: js
        text: |
          // add at the end of the file
          test("four parallel misses ask the database once", async () => {
            await redis.del("app:product:3");
            const replies = await Promise.all(Array.from({ length: 4 }, () => fetch(`${base}/products/3`)));
            assert.ok(replies.every((r) => r.status === 200));
            assert.equal(db.reads, 1);
          });
    mistakes:
      - problem:
          en: "A lock without an expiry (`SET lock 1 NX`)."
          tr: "Süresi olmayan bir kilit (`SET lock 1 NX`)."
        fix:
          en: "If the owner crashes, nobody can ever take the lock. Always add `EX` so the lock removes itself."
          tr: "Sahibi çökerse kimse kilidi bir daha alamaz. Kilit kendini kaldırsın diye her zaman `EX` ekle."
      - problem:
          en: "Setting the lock time shorter than the slowest load, then expecting only one load."
          tr: "Kilit süresini en yavaş yüklemeden kısa ayarlayıp tek bir yükleme beklemek."
        fix:
          en: "When the lock expires early a second request gets it and loads too. Set the lock time clearly longer than the normal load time."
          tr: "Kilit erken dolarsa ikinci bir istek onu alır ve o da yükler. Kilit süresini normal yükleme süresinden belirgin biçimde uzun ayarla."
      - problem:
          en: "Assuming a command that works on Redis 8.10 is also in Valkey."
          tr: "Redis 8.10'da çalışan bir komutun Valkey'de de olduğunu varsaymak."
        fix:
          en: "The two projects have grown apart. The basics in this roadmap work on both, but for newer features read the documentation of the one you run."
          tr: "İki proje birbirinden uzaklaştı. Bu roadmap'teki temeller ikisinde de çalışır ama yeni özellikler için çalıştırdığının dokümanını oku."
    quiz:
      - q:
          en: "What does `SET lock 1 NX EX 10` give you?"
          tr: "`SET lock 1 NX EX 10` sana ne verir?"
        options:
          en:
            - "A lock that only one caller can take, and that removes itself after 10 seconds"
            - "A key that is always overwritten"
            - "A list of 10 locks"
          tr:
            - "Sadece bir çağıranın alabildiği ve 10 saniye sonra kendini kaldıran bir kilit"
            - "Her zaman üzerine yazılan bir anahtar"
            - "10 kilitlik bir liste"
        answer: 0
        why:
          en: "NX makes the command succeed only for the first caller and EX gives it a time limit."
          tr: "NX komutun sadece ilk çağıran için başarılı olmasını, EX ona bir süre sınırı vermesini sağlar."
