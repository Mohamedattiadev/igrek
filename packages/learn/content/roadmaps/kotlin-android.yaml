          package dev.example.habits.ui

          import android.Manifest
          import android.os.Build
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.material3.Button
          import androidx.compose.material3.OutlinedButton
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import dev.example.habits.reminder.cancelDailyReminder
          import dev.example.habits.reminder.scheduleDailyReminder
          import dev.example.habits.reminder.sendTestReminder

          @Composable
          fun ReminderSection(modifier: Modifier = Modifier) {
              val context = LocalContext.current
              var waitingForPermission by remember { mutableStateOf<(() -> Unit)?>(null) }
              val askPermission = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                  if (granted) waitingForPermission?.invoke()
                  waitingForPermission = null
              }

              // Android 13 and newer ask the user first. On older versions just do the action.
              fun withNotificationPermission(action: () -> Unit) {
                  if (Build.VERSION.SDK_INT >= 33) {
                      waitingForPermission = action
                      askPermission.launch(Manifest.permission.POST_NOTIFICATIONS)
                  } else {
                      action()
                  }
              }

              Column(modifier = modifier, verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Text("Evening reminder at 20:00")
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      Button(onClick = { withNotificationPermission { scheduleDailyReminder(context) } }) {
                          Text("Turn on")
                      }
                      OutlinedButton(onClick = { cancelDailyReminder(context) }) { Text("Turn off") }
                  }
                  TextButton(onClick = { withNotificationPermission { sendTestReminder(context) } }) {
                      Text("Send a test now")
                  }
              }
          }
