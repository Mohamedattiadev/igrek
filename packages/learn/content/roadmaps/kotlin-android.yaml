      - file: app/src/main/java/dev/example/habits/data/QuoteApi.kt
        lang: kotlin
        text: |
          package dev.example.habits.data

          import java.io.IOException
          import kotlinx.serialization.SerializationException
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.json.Json
          import retrofit2.converter.kotlinx.serialization.asConverterFactory
          import okhttp3.MediaType.Companion.toMediaType
          import retrofit2.HttpException
          import retrofit2.Retrofit
          import retrofit2.http.GET

          @Serializable
          data class Quote(val quote: String, val author: String)

          interface QuoteService {
              @GET("quotes/random")
              suspend fun random(): Quote
          }

          fun createQuoteService(baseUrl: String = "https://dummyjson.com/"): QuoteService {
              val json = Json { ignoreUnknownKeys = true }
              return Retrofit.Builder()
                  .baseUrl(baseUrl)
                  .addConverterFactory(json.asConverterFactory("application/json".toMediaType()))
                  .build()
                  .create(QuoteService::class.java)
          }

          sealed interface QuoteState {
              data object Loading : QuoteState
              data class Ready(val quote: Quote) : QuoteState
              data object Failed : QuoteState
          }

          class QuoteRepository(private val service: QuoteService) {
              suspend fun load(): QuoteState =
                  try {
                      QuoteState.Ready(service.random())
                  } catch (e: IOException) {
                      QuoteState.Failed
                  } catch (e: HttpException) {
                      QuoteState.Failed
                  } catch (e: SerializationException) {
                      QuoteState.Failed
                  }
          }
      - file: app/src/main/java/dev/example/habits/ui/QuoteCard.kt
        lang: kotlin
        text: |
          package dev.example.habits.ui

          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.Card
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import dev.example.habits.data.QuoteState

          @Composable
          fun QuoteCard(state: QuoteState, onRetry: () -> Unit, modifier: Modifier = Modifier) {
              Card(modifier = modifier.fillMaxWidth()) {
                  Column(modifier = Modifier.padding(16.dp)) {
                      when (state) {
                          QuoteState.Loading -> Text("Loading a quote...")
                          is QuoteState.Ready -> {
                              Text("\"${state.quote.quote}\"", style = MaterialTheme.typography.bodyLarge)
                              Text("- ${state.quote.author}", style = MaterialTheme.typography.bodySmall)
                          }
                          QuoteState.Failed -> {
                              Text("No quote right now. Check your connection.")
                              TextButton(onClick = onRetry) { Text("Try again") }
                          }
                      }
                  }
              }
          }
