  - id: networking
    stage: data-api
    title:
      en: "Load a daily quote from a web API"
      tr: "Bir web API'den günlük söz yükleme"
    minutes: 90
    needs: [room]
    why:
      en: "Most apps talk to a server. You will fetch a random quote from a free public API and show it above the list. The important part is what happens when it goes wrong: no internet, a server error, a changed answer. The screen must say so politely and let the user try again, never crash."
      tr: "Çoğu uygulama bir sunucuyla konuşur. Ücretsiz herkese açık bir API'den rastgele bir söz çekip listenin üstünde göstereceksin. Önemli olan işlerin ters gittiği an: internet yok, sunucu hatası, değişen bir cevap. Ekran bunu kibarca söylemeli ve kullanıcıya yeniden deneme şansı vermeli, asla çökmemeli."
    learn:
      en: |
        - HTTP and JSON in one minute: ask a URL, get text back, turn it into a Kotlin class
        - Retrofit: you write an interface with `@GET`, it builds the client. The official Android networking guide shows Retrofit and Ktor as the two Kotlin options; we use Retrofit
        - `suspend` functions and coroutines: the call waits without blocking the screen
        - A `sealed interface` with Loading, Ready and Failed states
        - The `INTERNET` permission, and why plain `http://` is blocked by default
      tr: |
        - Bir dakikada HTTP ve JSON: bir URL'ye sor, metin al, Kotlin sınıfına çevir
        - Retrofit: `@GET` ile bir arayüz yazarsın, istemciyi o kurar. Resmi Android ağ rehberi Kotlin için Retrofit ve Ktor'u iki seçenek olarak gösterir; biz Retrofit kullanıyoruz
        - `suspend` fonksiyonlar ve coroutine'ler: çağrı ekranı kilitlemeden bekler
        - Loading, Ready ve Failed durumlu bir `sealed interface`
        - `INTERNET` izni ve düz `http://` adreslerinin neden varsayılan olarak engellendiği
    do:
      en: |
        1. Open `https://dummyjson.com/quotes/random` in a browser. It is a free public service that answers with JSON like `{"id":1,"quote":"...","author":"..."}`. Reload to get another.
        2. In `AndroidManifest.xml` add the internet permission line above the `<application>` tag. It is a normal permission: it is granted when the app is installed and the user is not asked.
        3. In `app/build.gradle.kts` add the two Retrofit lines. Sync. (The JSON library is already there from the navigation step.)
        4. Add `data/QuoteApi.kt` and `ui/QuoteCard.kt`.
        5. Replace `HabitsApplication.kt`, `HabitsViewModel.kt` and `HabitsApp.kt` with the versions below.
        6. Run it with the internet on: a quote shows above the list. Switch the emulator or phone to airplane mode and tap **Try again**: the polite message shows. Switch it back and try again.
        7. Commit: `git add .` and `git commit -m "Load a daily quote"`.
      tr: |
        1. Tarayıcıda `https://dummyjson.com/quotes/random` adresini aç. `{"id":1,"quote":"...","author":"..."}` gibi JSON döndüren ücretsiz, herkese açık bir servis. Başka bir söz için yenile.
        2. `AndroidManifest.xml` içinde `<application>` etiketinin üstüne internet izni satırını ekle. Bu normal bir izin: uygulama kurulurken verilir ve kullanıcıya sorulmaz.
        3. `app/build.gradle.kts` içine iki Retrofit satırını ekle. Sync yap. (JSON kütüphanesi navigation adımından beri zaten orada.)
        4. `data/QuoteApi.kt` ve `ui/QuoteCard.kt` dosyalarını ekle.
        5. `HabitsApplication.kt`, `HabitsViewModel.kt` ve `HabitsApp.kt`'i aşağıdaki sürümlerle değiştir.
        6. İnternet açıkken çalıştır: listenin üstünde bir söz görünür. Emülatörü ya da telefonu uçak moduna al ve **Try again**'e bas: kibar mesaj görünür. Uçak modunu kapat ve yeniden dene.
        7. Commit'le: `git add .` ve `git commit -m "Load a daily quote"`.
