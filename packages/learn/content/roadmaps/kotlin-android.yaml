        lang: kotlin
        text: |
          package dev.example.habits.reminder

          import android.Manifest
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import androidx.core.app.NotificationChannelCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.ContextCompat
          import androidx.work.CoroutineWorker
          import androidx.work.WorkerParameters
          import dev.example.habits.HabitsApplication
          import dev.example.habits.MainActivity
          import dev.example.habits.R
          import dev.example.habits.toItems
          import java.time.LocalDate
          import kotlinx.coroutines.flow.first

          class ReminderWorker(context: Context, params: WorkerParameters) : CoroutineWorker(context, params) {

              override suspend fun doWork(): Result {
                  val app = applicationContext as HabitsApplication
                  val today = LocalDate.now().toEpochDay()
                  val notDone = toItems(app.habitRepository.habits.first(), today).count { !it.doneToday }
                  if (notDone > 0) showNotification(notDone)
                  return Result.success()
              }

              private fun showNotification(notDone: Int) {
                  val allowed = ContextCompat.checkSelfPermission(
                      applicationContext,
                      Manifest.permission.POST_NOTIFICATIONS,
                  ) == PackageManager.PERMISSION_GRANTED
                  if (!allowed) return

                  val manager = NotificationManagerCompat.from(applicationContext)
                  manager.createNotificationChannel(
                      NotificationChannelCompat.Builder(CHANNEL_ID, NotificationManagerCompat.IMPORTANCE_DEFAULT)
                          .setName("Reminders")
                          .build(),
                  )

                  val openApp = PendingIntent.getActivity(
                      applicationContext,
                      0,
                      Intent(applicationContext, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE,
                  )
                  val text = if (notDone == 1) "1 habit is not done yet today." else "$notDone habits are not done yet today."
                  val notification = NotificationCompat.Builder(applicationContext, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_stat_habit)
                      .setContentTitle("Habits")
                      .setContentText(text)
                      .setContentIntent(openApp)
                      .setAutoCancel(true)
                      .build()
                  manager.notify(NOTIFICATION_ID, notification)
              }

              private companion object {
                  const val CHANNEL_ID = "reminders"
                  const val NOTIFICATION_ID = 1
              }
          }
