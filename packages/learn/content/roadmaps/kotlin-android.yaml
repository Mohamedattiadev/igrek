        lang: kotlin
        text: |
          package dev.example.habits.data

          import androidx.room3.Dao
          import androidx.room3.Database
          import androidx.room3.Entity
          import androidx.room3.ForeignKey
          import androidx.room3.Insert
          import androidx.room3.PrimaryKey
          import androidx.room3.Query
          import androidx.room3.RoomDatabase
          import kotlinx.coroutines.flow.Flow

          @Entity(tableName = "habit")
          data class HabitEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val name: String,
          )

          @Entity(
              tableName = "check_in",
              primaryKeys = ["habitId", "epochDay"],
              foreignKeys = [
                  ForeignKey(
                      entity = HabitEntity::class,
                      parentColumns = ["id"],
                      childColumns = ["habitId"],
                      onDelete = ForeignKey.CASCADE,
                  ),
              ],
          )
          data class CheckInEntity(val habitId: Long, val epochDay: Long)

          @Dao
          interface HabitDao {
              @Query("SELECT * FROM habit ORDER BY id")
              fun observeHabits(): Flow<List<HabitEntity>>

              @Query("SELECT * FROM check_in")
              fun observeCheckIns(): Flow<List<CheckInEntity>>

              @Insert
              suspend fun insertHabit(habit: HabitEntity)

              @Insert
              suspend fun insertCheckIn(checkIn: CheckInEntity)

              @Query("DELETE FROM check_in WHERE habitId = :habitId AND epochDay = :epochDay")
              suspend fun deleteCheckIn(habitId: Long, epochDay: Long): Int

              @Query("DELETE FROM habit WHERE id = :habitId")
              suspend fun deleteHabit(habitId: Long)
          }

          @Database(entities = [HabitEntity::class, CheckInEntity::class], version = 1, exportSchema = false)
          abstract class HabitDatabase : RoomDatabase() {
              abstract fun habitDao(): HabitDao
          }
      - file: app/src/main/java/dev/example/habits/data/RoomHabitRepository.kt
        lang: kotlin
        text: |
          package dev.example.habits.data

          import dev.example.habits.HabitState
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.combine

          class RoomHabitRepository(private val dao: HabitDao) : HabitRepository {

              override val habits: Flow<List<HabitState>> =
                  combine(dao.observeHabits(), dao.observeCheckIns()) { habits, checkIns ->
                      val daysByHabit = checkIns.groupBy({ it.habitId }, { it.epochDay })
                      habits.map { habit ->
                          HabitState(habit.id, habit.name, daysByHabit[habit.id].orEmpty().toSet())
                      }
                  }

              override suspend fun add(name: String) {
                  dao.insertHabit(HabitEntity(name = name))
              }

              override suspend fun toggleToday(habitId: Long, today: Long) {
                  // Nothing deleted means the day was not ticked yet, so tick it.
                  if (dao.deleteCheckIn(habitId, today) == 0) {
                      dao.insertCheckIn(CheckInEntity(habitId, today))
                  }
              }

              override suspend fun delete(habitId: Long) {
                  dao.deleteHabit(habitId)
              }
          }
