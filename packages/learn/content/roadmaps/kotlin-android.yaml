        lang: kotlin
        text: |
          package dev.example.habits.reminder

          import android.content.Context
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import java.time.LocalDateTime
          import java.util.concurrent.TimeUnit

          private const val WORK_NAME = "daily-reminder"

          /** Repeats every day. The first run waits until the next [hour]:00; Android may run it a little later. */
          fun scheduleDailyReminder(context: Context, hour: Int = 20) {
              val request = PeriodicWorkRequestBuilder<ReminderWorker>(1, TimeUnit.DAYS)
                  .setInitialDelay(delayUntilNext(LocalDateTime.now(), hour))
                  .build()
              WorkManager.getInstance(context)
                  .enqueueUniquePeriodicWork(WORK_NAME, ExistingPeriodicWorkPolicy.UPDATE, request)
          }

          fun cancelDailyReminder(context: Context) {
              WorkManager.getInstance(context).cancelUniqueWork(WORK_NAME)
          }

          fun sendTestReminder(context: Context) {
              WorkManager.getInstance(context).enqueue(OneTimeWorkRequestBuilder<ReminderWorker>().build())
          }
