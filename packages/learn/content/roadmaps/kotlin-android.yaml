      - file: app/src/main/java/dev/example/habits/HabitsViewModel.kt
        lang: kotlin
        text: |
          package dev.example.habits

          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.ViewModelProvider
          import androidx.lifecycle.ViewModelProvider.AndroidViewModelFactory.Companion.APPLICATION_KEY
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.viewmodel.initializer
          import androidx.lifecycle.viewmodel.viewModelFactory
          import dev.example.habits.data.HabitRepository
          import dev.example.habits.data.QuoteRepository
          import dev.example.habits.data.QuoteState
          import java.time.LocalDate
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch

          class HabitsViewModel(
              private val repository: HabitRepository,
              private val quotes: QuoteRepository,
              private val today: () -> Long = { LocalDate.now().toEpochDay() },
          ) : ViewModel() {

              val items: StateFlow<List<HabitItem>> = repository.habits
                  .map { habits -> toItems(habits, today()) }
                  .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())

              private val _quote = MutableStateFlow<QuoteState>(QuoteState.Loading)
              val quote: StateFlow<QuoteState> = _quote

              init {
                  loadQuote()
              }

              fun loadQuote() {
                  viewModelScope.launch {
                      _quote.value = QuoteState.Loading
                      _quote.value = quotes.load()
                  }
              }

              fun add(name: String) {
                  viewModelScope.launch { repository.add(name.trim()) }
              }

              fun toggle(id: Long) {
                  viewModelScope.launch { repository.toggleToday(id, today()) }
              }

              fun delete(id: Long) {
                  viewModelScope.launch { repository.delete(id) }
              }

              companion object {
                  val Factory: ViewModelProvider.Factory = viewModelFactory {
                      initializer {
                          val app = this[APPLICATION_KEY] as HabitsApplication
                          HabitsViewModel(app.habitRepository, app.quoteRepository)
                      }
                  }
              }
          }
      - file: app/src/main/java/dev/example/habits/HabitsApp.kt
        lang: kotlin
        text: |
          package dev.example.habits

          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import androidx.lifecycle.viewmodel.compose.viewModel
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.rememberNavController
          import androidx.navigation.toRoute
          import dev.example.habits.ui.AddHabitScreen
          import dev.example.habits.ui.HabitDetailScreen
          import dev.example.habits.ui.HabitListScreen
          import dev.example.habits.ui.QuoteCard
          import kotlinx.serialization.Serializable

          @Serializable
          object HabitList

          @Serializable
          object AddHabit

          @Serializable
          data class HabitDetail(val habitId: Long)

          @Composable
          fun HabitsApp(viewModel: HabitsViewModel = viewModel(factory = HabitsViewModel.Factory)) {
              val navController = rememberNavController()
              val habits by viewModel.items.collectAsStateWithLifecycle()
              val quote by viewModel.quote.collectAsStateWithLifecycle()

              NavHost(navController = navController, startDestination = HabitList) {
                  composable<HabitList> {
                      HabitListScreen(
                          habits = habits,
                          onToggle = viewModel::toggle,
                          onDelete = viewModel::delete,
                          onOpen = { id -> navController.navigate(HabitDetail(id)) },
                          onAdd = { navController.navigate(AddHabit) },
                          header = { QuoteCard(state = quote, onRetry = viewModel::loadQuote) },
                      )
                  }
                  composable<AddHabit> {
                      AddHabitScreen(
                          onSave = { name ->
                              viewModel.add(name)
                              navController.popBackStack()
                          },
                          onBack = { navController.popBackStack() },
                      )
                  }
                  composable<HabitDetail> { entry ->
                      val route: HabitDetail = entry.toRoute()
                      HabitDetailScreen(
                          habit = habits.firstOrNull { it.id == route.habitId },
                          onBack = { navController.popBackStack() },
                      )
                  }
              }
          }
    mistakes:
      - problem:
          en: "\"Try again\" always shows, and Logcat says `UnknownHostException` or \"Permission denied (missing INTERNET permission?)\"."
          tr: "Hep \"Try again\" görünüyor ve Logcat `UnknownHostException` ya da \"Permission denied (missing INTERNET permission?)\" diyor."
        fix:
          en: "Add `<uses-permission android:name=\"android.permission.INTERNET\" />` to the manifest (outside `<application>`), and check that the emulator or phone has internet."
          tr: "Manifest'e `<uses-permission android:name=\"android.permission.INTERNET\" />` ekle (`<application>`'ın dışına) ve emülatörde ya da telefonda internet olduğunu kontrol et."
      - problem:
          en: "Catching `Exception` everywhere to be safe."
          tr: "Güvende olmak için her yerde `Exception` yakalamak."
        fix:
          en: "In coroutines that also catches `CancellationException`, which the system uses to stop work, and can leave the app confused. Catch the specific errors you expect, like here: `IOException`, `HttpException`, `SerializationException`."
          tr: "Coroutine'lerde bu, sistemin işi durdurmak için kullandığı `CancellationException`'ı da yakalar ve uygulamayı şaşırtabilir. Burada olduğu gibi beklediğin hataları yakala: `IOException`, `HttpException`, `SerializationException`."
      - problem:
          en: "Using an `http://` address and getting \"Cleartext HTTP traffic not permitted\"."
          tr: "`http://` adresi kullanıp \"Cleartext HTTP traffic not permitted\" hatası almak."
        fix:
          en: "Android blocks unencrypted HTTP by default, and that is good. Use `https://`. Do not switch cleartext on for a real app."
          tr: "Android şifresiz HTTP'yi varsayılan olarak engeller ve bu iyi bir şey. `https://` kullan. Gerçek bir uygulamada cleartext'i açma."
    quiz:
      - q:
          en: "Does the user get asked to grant the `INTERNET` permission?"
          tr: "Kullanıcıya `INTERNET` izni verip vermeyeceği sorulur mu?"
        options:
          en:
            - "Yes, every time the app starts"
            - "No, it is a normal permission granted at install time"
