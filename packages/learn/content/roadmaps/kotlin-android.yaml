    mistakes:
      - problem:
          en: "The list scrolls under the top bar or the + button covers the last row."
          tr: "Liste üst çubuğun altına kayıyor ya da + düğmesi son satırı kapatıyor."
        fix:
          en: "Use the `padding` that `Scaffold` gives to its content lambda (we pass it to the `LazyColumn`), and leave extra `bottom` padding in `contentPadding` for the button."
          tr: "`Scaffold`'un içerik lambda'sına verdiği `padding`'i kullan (biz onu `LazyColumn`'a veriyoruz) ve `contentPadding` içinde düğme için fazladan `bottom` boşluk bırak."
      - problem:
          en: "Forgetting `key` in `items(...)`."
          tr: "`items(...)` içinde `key` vermeyi unutmak."
        fix:
          en: "Without a key, Compose tracks rows by position. When you delete a row, the ticks and animations can jump to the wrong habit. Pass a stable id: `key = { it.id }`."
          tr: "Key olmadan Compose satırları konumla takip eder. Bir satırı silince işaretler ve animasyonlar yanlış alışkanlığa kayabilir. Sabit bir id ver: `key = { it.id }`."
    quiz:
      - q:
          en: "Why use `LazyColumn` instead of a `Column` with a `for` loop for a long list?"
          tr: "Uzun bir liste için neden `for` döngülü `Column` yerine `LazyColumn` kullanılır?"
        options:
          en:
            - "It only builds the rows that are visible"
            - "It is the only one that can show text"
            - "It saves the list to the database"
          tr:
            - "Sadece görünen satırları oluşturur"
            - "Metin gösterebilen tek o"
            - "Listeyi veritabanına kaydeder"
        answer: 0
        why:
          en: "A `Column` builds every child at once. A `LazyColumn` builds rows as they scroll into view, so a list of thousands stays fast."
          tr: "`Column` bütün çocukları bir kerede oluşturur. `LazyColumn` satırları ekrana kaydıkça oluşturur; binlerce satırlık liste de hızlı kalır."
