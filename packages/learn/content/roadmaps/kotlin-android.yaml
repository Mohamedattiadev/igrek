    mistakes:
      - problem:
          en: "Copying an older tutorial: `androidx.room:room-runtime`, `kapt(...)`, `Room.databaseBuilder(context, AppDatabase::class.java, ...)` and no driver."
          tr: "Eski bir eğitimi kopyalamak: `androidx.room:room-runtime`, `kapt(...)`, `Room.databaseBuilder(context, AppDatabase::class.java, ...)` ve driver yok."
        fix:
          en: "That is Room 2. This roadmap uses Room 3: group `androidx.room3`, `ksp(...)` instead of `kapt(...)`, and `.setDriver(AndroidSQLiteDriver())` on the builder. Do not mix the two."
          tr: "O Room 2. Bu roadmap Room 3 kullanıyor: grup `androidx.room3`, `kapt(...)` yerine `ksp(...)` ve builder'da `.setDriver(AndroidSQLiteDriver())`. İkisini karıştırma."
      - problem:
          en: "The app crashes at start with \"ClassNotFoundException\" or \"cannot find implementation for HabitDatabase\"."
          tr: "Uygulama açılışta \"ClassNotFoundException\" ya da \"cannot find implementation for HabitDatabase\" ile çöküyor."
        fix:
          en: "Room did not generate its code. Check that the `ksp` plugin is applied in `app/build.gradle.kts` and that the compiler line says `ksp(...)`. Then do Build, Clean Project and Rebuild."
          tr: "Room kodunu üretememiş. `ksp` eklentisinin `app/build.gradle.kts` içinde uygulandığını ve derleyici satırının `ksp(...)` dediğini kontrol et. Sonra Build, Clean Project ve Rebuild yap."
      - problem:
          en: "Changing a table (a new column) after the app is installed makes it crash."
          tr: "Uygulama kurulduktan sonra bir tabloyu değiştirmek (yeni sütun) çökmeye yol açıyor."
        fix:
          en: "Room checks the table layout against the `version` number. While you learn, uninstall the app from the phone to start with a fresh database. A published app needs a migration; read the Room migration guide before you change a table that real users have."
          tr: "Room, tablo yapısını `version` numarasıyla karşılaştırır. Öğrenirken uygulamayı telefondan silip taze bir veritabanıyla başla. Yayınlanmış bir uygulama migration ister; gerçek kullanıcıların olduğu bir tabloyu değiştirmeden önce Room migration rehberini oku."
