id: kotlin-android
title: Kotlin and Android
summary:
  en: "From an empty computer to a real app on your own phone. You build a habit tracker with Kotlin and Jetpack Compose: screens, state, navigation, a database, a web API, tests, security, an app icon, a signed release build, honest publishing options and crash reports."
  tr: "Boş bir bilgisayardan kendi telefonunda çalışan gerçek bir uygulamaya. Kotlin ve Jetpack Compose ile bir alışkanlık takip uygulaması yazarsın: ekranlar, state, sayfalar arası geçiş, veritabanı, web API, testler, güvenlik, uygulama ikonu, imzalı release build'i, dürüst yayınlama seçenekleri ve çökme raporları."
teacher: mobile
project:
  en: 'A habit tracker for Android: add habits, tick them off each day, see your streak, keep everything in a database on the phone, load a daily quote from a public API, store a token safely, with tests, an app icon, a signed release build, a free way to share it and crash reports.'
  tr: 'Android için bir alışkanlık takip uygulaması: alışkanlık ekleme, her gün işaretleme, seri (streak) görme, her şeyi telefondaki bir veritabanında tutma, herkese açık bir API''den günlük söz yükleme, bir token''ı güvenle saklama; testleri, uygulama ikonu, imzalı bir release build''i, ücretsiz paylaşma yolu ve çökme raporları var.'
detect:
  files: [AndroidManifest.xml]
version: "2.4"
latest: eol:kotlin
checked: 2026-10
sheets: [git, java]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Android Studio and Git"
      tr: "Android Studio ve Git kurma"
    minutes: 90
    why:
      en: "Android Studio is the official free editor for Android apps. It brings everything else with it: its own Java runtime, the Gradle build tool, the Android SDK (the libraries and tools your app is built against) and an emulator, a pretend phone on your computer. Git keeps every version of your work."
      tr: "Android Studio, Android uygulamaları için resmi ve ücretsiz editördür. Gerisini de kendisi getirir: kendi Java çalışma ortamı, Gradle build aracı, Android SDK (uygulamanın üzerine kurulduğu kütüphaneler ve araçlar) ve emülatör, yani bilgisayarının içinde sahte bir telefon. Git de işinin her sürümünü saklar."
    learn:
      en: |
        - What Android Studio, the Android SDK and the emulator each are
        - Why you do not install Java yourself: Android Studio ships its own
        - What the first start downloads, and how much space it needs
      tr: |
        - Android Studio'nun, Android SDK'nın ve emülatörün ayrı ayrı ne olduğu
        - Java'yı neden kendin kurmadığın: Android Studio kendisininkini getirir
        - İlk açılışta neyin indirildiği ve ne kadar yer gerektiği
    do:
      en: |
        1. Check your computer. Android Studio needs 8 GB of RAM (16 GB if you also run the emulator) and 8 GB of free disk space (16 GB with the emulator). The emulator needs hardware virtualization (Intel VT-x or AMD-V), which is on by default on most computers but is sometimes switched off in the BIOS. Windows on ARM processors is not supported. No fast computer? Skip the emulator and use a real phone in the next step.
        2. Download Android Studio from developer.android.com/studio and accept the license. It is a download of about 1.5 GB.
        3. Install it. Windows: run the `.exe`. macOS: open the `.dmg` and drag Android Studio into Applications (choose the Apple silicon or the Intel file to match your Mac). Linux: unpack the `.tar.gz` somewhere (for example `/opt`), install the 64-bit libraries listed on the install page, then run `studio` from the `android-studio/bin` folder.
        4. Start it and finish the Setup Wizard. Choose the **Standard** setup. It downloads the Android SDK, which takes a while and several gigabytes.
        5. Install **Git** (git-scm.com; on macOS `git --version` offers to install it). Open a terminal and run the commands below.
        6. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
      tr: |
        1. Bilgisayarını kontrol et. Android Studio 8 GB RAM (emülatörü de çalıştıracaksan 16 GB) ve 8 GB boş disk alanı (emülatörle 16 GB) ister. Emülatör donanım sanallaştırması (Intel VT-x ya da AMD-V) gerektirir; çoğu bilgisayarda açıktır ama bazen BIOS'ta kapatılmıştır. ARM işlemcili Windows desteklenmiyor. Bilgisayarın yavaşsa emülatörü atla, sonraki adımda gerçek bir telefon kullan.
        2. developer.android.com/studio adresinden Android Studio'yu indir ve lisansı kabul et. Yaklaşık 1,5 GB'lık bir indirme.
        3. Kur. Windows: `.exe`'yi çalıştır. macOS: `.dmg`'yi aç ve Android Studio'yu Applications'a sürükle (Mac'ine göre Apple silicon ya da Intel dosyasını seç). Linux: `.tar.gz`'yi bir yere aç (örneğin `/opt`), kurulum sayfasında yazan 64 bit kütüphaneleri kur, sonra `android-studio/bin` klasöründen `studio`'yu çalıştır.
        4. Aç ve Setup Wizard'ı bitir. **Standard** kurulumu seç. Android SDK'yı indirir; bu biraz sürer ve birkaç gigabayt tutar.
        5. **Git**'i kur (git-scm.com; macOS'ta `git --version` kurmayı kendisi önerir). Bir terminal aç ve aşağıdaki komutu çalıştır.
        6. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
    code:
      - file: terminal
        lang: sh
        text: |
          git --version
    mistakes:
      - problem:
          en: "The emulator says it cannot start because virtualization is off."
          tr: "Emülatör, sanallaştırma kapalı olduğu için başlamıyor."
        fix:
          en: "Turn on Intel VT-x or AMD-V (called SVM) in the BIOS settings, or skip the emulator and use a real phone."
          tr: "BIOS ayarlarından Intel VT-x ya da AMD-V'yi (SVM adıyla geçer) aç, ya da emülatörü bırakıp gerçek telefon kullan."
      - problem:
          en: "The SDK download stops because the disk is full."
          tr: "Disk dolduğu için SDK indirmesi duruyor."
        fix:
          en: "Free at least 16 GB first. Every virtual phone you create also takes up to 6 GB. Delete virtual phones you do not use in Device Manager."
          tr: "Önce en az 16 GB yer aç. Oluşturduğun her sanal telefon da 6 GB'a kadar yer kaplar. Kullanmadığın sanal telefonları Device Manager'dan sil."
    quiz:
      - q:
          en: "Do you have to install Java yourself to build Android apps with Android Studio?"
          tr: "Android Studio ile Android uygulaması yapmak için Java'yı kendin kurman gerekir mi?"
        options:
          en:
            - "Yes, always"
            - "No, Android Studio brings its own Java runtime"
            - "Only on Windows"
          tr:
            - "Evet, her zaman"
            - "Hayır, Android Studio kendi Java çalışma ortamını getirir"
            - "Sadece Windows'ta"
        answer: 1
        why:
          en: "Android Studio includes the runtime that runs the editor and Gradle. You never have to install or pick a Java version for it."
          tr: "Android Studio, editörü ve Gradle'ı çalıştıran ortamı içinde getirir. Onun için Java sürümü kurman ya da seçmen gerekmez."
    sources:
      - title: Install Android Studio (system requirements and steps)
        url: https://developer.android.com/studio/install
      - title: Android Studio download
        url: https://developer.android.com/studio
      - title: Git installation
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: first-app
    stage: first-code
    title:
      en: "Create your first app and run it on a phone"
      tr: "İlk uygulamanı oluşturma ve telefonda çalıştırma"
    minutes: 75
    needs: [setup]
    why:
      en: "The project wizard writes a complete working app with Kotlin and Jetpack Compose (the modern way to draw Android screens in code). Running it on a real or virtual phone shows that the whole chain works: editor, build, phone. From here every change is a few seconds away from your eyes."
      tr: "Proje sihirbazı, Kotlin ve Jetpack Compose (Android ekranlarını kodla çizmenin modern yolu) ile eksiksiz çalışan bir uygulama yazar. Bunu gerçek ya da sanal bir telefonda çalıştırmak bütün zincirin çalıştığını gösterir: editör, build, telefon. Bundan sonra her değişiklik birkaç saniyede gözünün önünde."
    learn:
      en: |
        - What is in a new project: `MainActivity.kt`, `AndroidManifest.xml`, `app/build.gradle.kts`, `gradle/libs.versions.toml`
        - What Gradle does: it downloads libraries and builds the app, and the first build is slow
        - What a package name (application id) is and why it should be yours
      tr: |
        - Yeni projede neler olduğu: `MainActivity.kt`, `AndroidManifest.xml`, `app/build.gradle.kts`, `gradle/libs.versions.toml`
        - Gradle'ın ne yaptığı: kütüphaneleri indirir ve uygulamayı derler; ilk build yavaştır
        - Package name'in (application id) ne olduğu ve neden sana ait olması gerektiği
    do:
      en: |
        1. In Android Studio choose **New Project**. Under **Phone and Tablet** pick **Empty Activity** and click Next.
        2. Name: `Habits`. Package name: `dev.example.habits`; change `example` to something that is yours (your nickname, for example `dev.ayse.habits`). The package name identifies your app worldwide and can never change after you publish, and the code in this roadmap uses `dev.example.habits`, so replace it in the files you copy. Minimum SDK: **API 26** (Android 8.0). Build configuration language: **Kotlin DSL**. Click Finish.
        3. Wait while Gradle syncs (the bar at the bottom). The first time it downloads many libraries and can take several minutes.
        4. Pick a device. **Virtual phone:** open **Device Manager** (the phone icon in the right-hand bar), click **Create Virtual Device**, pick a Pixel phone, download the recommended system image when asked, and finish. **Real phone:** on the phone open Settings, About phone, tap **Build number** seven times, go back to Settings, open **Developer options** and switch on **USB debugging**. Plug the phone in with a USB cable and accept the "Allow USB debugging?" question on its screen. On Linux you may also need your user in the `plugdev` group; on Windows an OEM USB driver.
        5. Choose your device in the device list at the top and press the green **Run** triangle. The app opens with a greeting.
        6. In `MainActivity.kt` change the text passed to `Greeting` and run again. Watch it change.
        7. Save this first version: open the **Terminal** tab at the bottom of Android Studio and run the Git commands below. The wizard already created a `.gitignore` for you.
      tr: |
        1. Android Studio'da **New Project**'i seç. **Phone and Tablet** altında **Empty Activity**'yi seçip Next'e bas.
        2. Name: `Habits`. Package name: `dev.example.habits`; `example` kısmını sana ait bir şeyle değiştir (takma adın, örneğin `dev.ayse.habits`). Package name uygulamanı dünyada tek başına tanımlar ve yayınladıktan sonra asla değişmez. Bu roadmap'teki kod `dev.example.habits` kullanıyor, o yüzden kopyaladığın dosyalarda onu kendi adınla değiştir. Minimum SDK: **API 26** (Android 8.0). Build configuration language: **Kotlin DSL**. Finish'e bas.
        3. Gradle sync bitene kadar bekle (altta çubuk görünür). İlk seferde birçok kütüphane indirir ve birkaç dakika sürebilir.
        4. Bir cihaz seç. **Sanal telefon:** sağdaki çubukta **Device Manager**'ı (telefon simgesi) aç, **Create Virtual Device**'a bas, bir Pixel telefon seç, sorulunca önerilen sistem imajını indir ve bitir. **Gerçek telefon:** telefonda Ayarlar, Telefon hakkında bölümüne git, **Build number**'a (Derleme numarası) yedi kez dokun, Ayarlar'a dön, **Developer options**'ı (Geliştirici seçenekleri) aç ve **USB debugging**'i aç. Telefonu USB kablosuyla bağla ve ekrandaki "Allow USB debugging?" sorusunu kabul et. Linux'ta kullanıcının `plugdev` grubunda olması, Windows'ta üreticinin USB sürücüsü gerekebilir.
        5. Üstteki cihaz listesinden cihazını seç ve yeşil **Run** üçgenine bas. Uygulama bir selamlamayla açılır.
        6. `MainActivity.kt` içinde `Greeting`'e verilen metni değiştir ve yeniden çalıştır. Değiştiğini izle.
        7. İlk sürümü kaydet: Android Studio'nun altındaki **Terminal** sekmesini aç ve aşağıdaki Git komutlarını çalıştır. Sihirbaz senin için zaten bir `.gitignore` oluşturdu.
    code:
      - file: app/src/main/java/dev/example/habits/MainActivity.kt
        lang: kotlin
        text: |
          package dev.example.habits

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.Scaffold
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import dev.example.habits.ui.theme.HabitsTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent {
                      HabitsTheme {
                          Scaffold(modifier = Modifier.fillMaxSize()) { innerPadding ->
                              Greeting(name = "my habit app", modifier = Modifier.padding(innerPadding))
                          }
                      }
                  }
              }
          }

          @Composable
          fun Greeting(name: String, modifier: Modifier = Modifier) {
              Text(text = "Hello $name!", modifier = modifier)
          }
      - file: terminal
        lang: sh
        text: |
          git init
          git add .
          git commit -m "Start the habits app"
    mistakes:
      - problem:
          en: "Gradle sync fails with a network error."
          tr: "Gradle sync bir ağ hatasıyla başarısız oluyor."
        fix:
          en: "Check your internet connection (and proxy settings if you use one), then click **Try Again** in the error message or use File, Sync Project with Gradle Files. The first sync must download from the internet."
          tr: "İnternet bağlantını (ve varsa proxy ayarlarını) kontrol et, sonra hata mesajındaki **Try Again**'e bas ya da File, Sync Project with Gradle Files'ı kullan. İlk sync internetten indirmek zorunda."
      - problem:
          en: "A real phone does not show up in the device list."
          tr: "Gerçek telefon cihaz listesinde görünmüyor."
        fix:
          en: "Try another USB cable (some only charge), set the USB mode to file transfer, and accept the RSA dialog on the phone. In Android Studio open Tools, Troubleshoot Device Connections and let it restart the adb server."
          tr: "Başka bir USB kablosu dene (bazıları sadece şarj eder), USB modunu dosya aktarımına çevir ve telefondaki RSA penceresini kabul et. Android Studio'da Tools, Troubleshoot Device Connections'ı aç ve adb sunucusunu yeniden başlatmasına izin ver."
      - problem:
          en: "Keeping the package name `com.example.something` and wanting to publish later."
          tr: "Paket adını `com.example.something` bırakıp sonra yayınlamak istemek."
        fix:
          en: "Use your own name from the start. Renaming a package later touches every file and the app id cannot change once the app is published."
          tr: "En baştan kendi adını kullan. Paketi sonradan yeniden adlandırmak her dosyaya dokunur ve uygulama yayınlandıktan sonra application id değişmez."
    quiz:
      - q:
          en: "What does Gradle do in an Android project?"
          tr: "Bir Android projesinde Gradle ne yapar?"
        options:
          en:
            - "It draws the screens"
            - "It downloads libraries and builds the app"
            - "It is the emulator"
          tr:
            - "Ekranları çizer"
            - "Kütüphaneleri indirir ve uygulamayı derler"
            - "Emülatörün kendisidir"
        answer: 1
        why:
          en: "Gradle is the build tool. Compose draws the screens and the emulator is a separate program."
          tr: "Gradle build aracıdır. Ekranları Compose çizer, emülatör ise ayrı bir programdır."
    sources:
      - title: Set up Jetpack Compose and create a project
        url: https://developer.android.com/develop/ui/compose/setup
      - title: Run apps on a hardware device
        url: https://developer.android.com/studio/run/device
      - title: Create and manage virtual devices
        url: https://developer.android.com/studio/run/managing-avds

  - id: kotlin-basics
    stage: basics
    title:
      en: "Kotlin basics: the habit logic"
      tr: "Kotlin temelleri: alışkanlık mantığı"
    minutes: 90
    needs: [first-app]
    why:
      en: "Every Android screen you write is Kotlin. The habit rules (what is a valid name, how long is a streak) do not need a phone at all, so you write them as plain Kotlin and try them in a browser first. Rules that live apart from the screens are also the easiest code to test."
      tr: "Yazdığın her Android ekranı Kotlin'dir. Alışkanlık kuralları (geçerli isim nedir, seri kaç gün sürer) telefon gerektirmez; bu yüzden onları düz Kotlin olarak yazıp önce tarayıcıda denersin. Ekranlardan ayrı duran kurallar test etmesi en kolay koddur."
    learn:
      en: |
        - `val` (cannot change) versus `var` (can change), and types that Kotlin works out for you
        - Null safety: `String?` may be empty, and `?.` and `?:` handle that
        - Functions, `data class`, `enum class`, `when`, `if` as an expression
        - Collections and lambdas: `map`, `filter`, `firstOrNull`, `maxByOrNull`
        - Kotlin runs on the JVM like Java, so many ideas carry over (see the Java cheatsheet), but Kotlin needs far less code
      tr: |
        - `val` (değişmez) ile `var` (değişir) farkı ve Kotlin'in senin yerine bulduğu tipler
        - Null safety: `String?` boş olabilir, `?.` ve `?:` bunu yönetir
        - Fonksiyonlar, `data class`, `enum class`, `when`, ifade olarak `if`
        - Koleksiyonlar ve lambda'lar: `map`, `filter`, `firstOrNull`, `maxByOrNull`
        - Kotlin da Java gibi JVM üzerinde çalışır, o yüzden birçok fikir aynıdır (Java kopya kâğıdına bak) ama Kotlin çok daha az kod ister
    do:
      en: |
        1. Open play.kotlinlang.org in a browser. It runs Kotlin for free with nothing to install.
        2. Paste the code of `Habit.kt` below, but **delete its first line** (`package ...`; the playground does not need it). Then paste the `main` function from the second block under it and press **Run**.
        3. The output should be exactly the lines in the comment at the end of the second block. Read each line and find the code that printed it.
        4. Experiment. Change `today` to `11`: what happens to the streaks? Add a habit with `setOf(10)`. Pass a name of 41 letters to `checkHabitName`.
        5. Add the file to your project: in Android Studio, in the `app/src/main/java` folder, open `dev/example/habits`, right-click it, choose **New, Kotlin Class/File**, name it `Habit`, and paste the whole code including the `package` line. (Fix the package line if you chose another package name.)
        6. Commit: `git add .` then `git commit -m "Add the habit logic"`.
      tr: |
        1. Tarayıcıda play.kotlinlang.org adresini aç. Kotlin'i hiçbir şey kurmadan ücretsiz çalıştırır.
        2. Aşağıdaki `Habit.kt` kodunu yapıştır ama **ilk satırını sil** (`package ...`; playground'un buna ihtiyacı yok). Sonra ikinci bloktaki `main` fonksiyonunu altına yapıştır ve **Run**'a bas.
        3. Çıktı, ikinci bloğun sonundaki yorumdaki satırlarla birebir aynı olmalı. Her satırı oku ve onu yazdıran kodu bul.
        4. Deneme yap. `today`'i `11` yap: seriler ne olur? `setOf(10)` ile bir alışkanlık ekle. `checkHabitName`'e 41 harflik bir isim ver.
        5. Dosyayı projene ekle: Android Studio'da `app/src/main/java` içinde `dev/example/habits` klasörüne sağ tıkla, **New, Kotlin Class/File**'ı seç, adını `Habit` yap ve `package` satırı dahil bütün kodu yapıştır. (Başka bir package adı seçtiysen package satırını düzelt.)
        6. Commit'le: `git add .` sonra `git commit -m "Add the habit logic"`.
    code:
      - file: app/src/main/java/dev/example/habits/Habit.kt
        lang: kotlin
        text: |
          package dev.example.habits

          const val MAX_NAME_LENGTH = 40

          /** Why a habit name is not accepted. */
          enum class NameProblem { Empty, TooLong }

          /** Returns the problem with a name, or null when the name is fine. */
          fun checkHabitName(raw: String): NameProblem? {
              val name = raw.trim()
              return when {
                  name.isEmpty() -> NameProblem.Empty
                  name.length > MAX_NAME_LENGTH -> NameProblem.TooLong
                  else -> null
              }
          }

          /** A habit and the days it was done. A day is a number: days since 1970-01-01 (LocalDate.toEpochDay). */
          data class HabitState(val id: Long, val name: String, val doneDays: Set<Long>)

          /** What the screen shows for one habit. */
          data class HabitItem(
              val id: Long,
              val name: String,
              val doneToday: Boolean,
              val streak: Int,
              val totalDays: Int,
          )

          /** Days in a row, ending today. If today is not ticked yet, the streak is still alive until midnight. */
          fun currentStreak(doneDays: Set<Long>, today: Long): Int {
              var day = if (today in doneDays) today else today - 1
              var streak = 0
              while (day in doneDays) {
                  streak++
                  day--
              }
              return streak
          }

          fun toItems(habits: List<HabitState>, today: Long): List<HabitItem> =
              habits.map { habit ->
                  HabitItem(
                      id = habit.id,
                      name = habit.name,
                      doneToday = today in habit.doneDays,
                      streak = currentStreak(habit.doneDays, today),
                      totalDays = habit.doneDays.size,
                  )
              }
      - file: play.kotlinlang.org
        lang: kotlin
        text: |
          fun main() {
              val habits = listOf(
                  HabitState(1, "Read", setOf(8, 9, 10)),
                  HabitState(2, "Run", setOf(7, 9)),
                  HabitState(3, "Write", emptySet()),
              )
              val today = 10L
              for (item in toItems(habits, today)) {
                  println("${item.name}: streak ${item.streak}, done today: ${item.doneToday}")
              }
              val best = habits.maxByOrNull { currentStreak(it.doneDays, today) }
              println("Best streak: ${best?.name ?: "none"}")
              val firstWithoutDays: HabitState? = habits.firstOrNull { it.doneDays.isEmpty() }
              println(firstWithoutDays?.name?.uppercase() ?: "all habits have days")
              println(checkHabitName("   "))
              println(checkHabitName("Drink water"))
          }

          // Read: streak 3, done today: true
          // Run: streak 1, done today: false
          // Write: streak 0, done today: false
          // Best streak: Read
          // WRITE
          // Empty
          // null
    mistakes:
      - problem:
          en: "\"Unresolved reference\" in red after pasting code."
          tr: "Kod yapıştırınca kırmızı \"Unresolved reference\" hatası."
        fix:
          en: "A name is used in a file that does not know it. In the playground you probably pasted only the `main` function without `Habit.kt`. In Android Studio, put the cursor on the red name and press Alt+Enter to add the missing `import`."
          tr: "Bir isim, onu tanımayan bir dosyada kullanılıyor. Playground'da büyük ihtimalle `Habit.kt` olmadan sadece `main`'i yapıştırdın. Android Studio'da imleci kırmızı isme koy ve eksik `import`'u eklemek için Alt+Enter'a bas."
      - problem:
          en: "Writing `val streak = 0` and then `streak++`."
          tr: "`val streak = 0` yazıp sonra `streak++` yapmak."
        fix:
          en: "A `val` cannot change. Use `var` for values that change, like the counter in `currentStreak`."
          tr: "`val` değişmez. `currentStreak` içindeki sayaç gibi değişen değerler için `var` kullan."
    quiz:
      - q:
          en: "What does `habit?.name ?: \"none\"` give when `habit` is `null`?"
          tr: "`habit` `null` iken `habit?.name ?: \"none\"` ne verir?"
        options:
          en:
            - "It crashes with an error"
            - "The text \"none\""
            - "An empty string"
          tr:
            - "Hata verip çöker"
            - "\"none\" metni"
            - "Boş bir string"
        answer: 1
        why:
          en: "`?.` stops and gives `null` when the left side is `null`, and `?:` (the Elvis operator) then takes the value on its right."
          tr: "Soldaki `null` ise `?.` durur ve `null` verir, sonra `?:` (Elvis operatörü) sağındaki değeri alır."
    sources:
