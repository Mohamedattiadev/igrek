          package dev.example.habits.reminder

          import java.time.Duration
          import java.time.LocalDateTime
          import org.junit.Assert.assertEquals
          import org.junit.Test

          class ReminderTimeTest {
              @Test
              fun waits_until_this_evening_when_it_is_still_before_the_hour() {
                  val now = LocalDateTime.of(2026, 10, 18, 9, 30)
                  assertEquals(Duration.ofHours(10).plusMinutes(30), delayUntilNext(now, hour = 20))
              }

              @Test
              fun waits_until_tomorrow_when_the_hour_has_passed() {
                  val now = LocalDateTime.of(2026, 10, 18, 21, 0)
                  assertEquals(Duration.ofHours(23), delayUntilNext(now, hour = 20))
              }

              @Test
              fun at_exactly_the_hour_the_next_one_is_tomorrow() {
                  val now = LocalDateTime.of(2026, 10, 18, 20, 0)
                  assertEquals(Duration.ofHours(24), delayUntilNext(now, hour = 20))
              }
          }
    mistakes:
      - problem:
          en: "The reminder does not arrive exactly at 20:00."
          tr: "Hatırlatıcı tam saat 20:00'de gelmiyor."
        fix:
          en: "That is normal. WorkManager runs deferrable work when the system allows, to save battery. A habit nudge does not need to be exact. Exact alarms exist but need extra permissions and are meant for things like alarm clocks."
          tr: "Bu normal. WorkManager, pil tasarrufu için ertelenebilir işleri sistem uygun gördüğünde çalıştırır. Bir alışkanlık dürtmesinin tam olması gerekmez. Tam zamanlı alarmlar var ama ekstra izin ister ve çalar saat gibi şeyler içindir."
      - problem:
          en: "Calling `notify` and seeing nothing on Android 13 or newer."
          tr: "`notify` çağırıp Android 13 ve sonrasında hiçbir şey görmemek."
        fix:
          en: "Without the `POST_NOTIFICATIONS` permission granted at runtime, notifications are dropped. Ask with the permission launcher, and check the app's notification settings in the phone settings."
          tr: "`POST_NOTIFICATIONS` izni çalışma zamanında verilmeden bildirimler atılır. İzin başlatıcısıyla iste ve telefon ayarlarında uygulamanın bildirim ayarlarına bak."
      - problem:
          en: "Scheduling the reminder again on every app start."
          tr: "Hatırlatıcıyı her uygulama açılışında yeniden planlamak."
        fix:
          en: "Use `enqueueUniquePeriodicWork` with a fixed name, as here. WorkManager then keeps a single job instead of piling up copies."
          tr: "Burada olduğu gibi sabit bir adla `enqueueUniquePeriodicWork` kullan. WorkManager kopyaları üst üste yığmak yerine tek bir iş tutar."
    quiz:
      - q:
          en: "Why does the reminder code use `enqueueUniquePeriodicWork`?"
          tr: "Hatırlatıcı kodu neden `enqueueUniquePeriodicWork` kullanıyor?"
        options:
          en:
            - "So only one reminder job exists, however often you press Turn on"
            - "So it runs exactly on the second"
            - "So it works without a permission"
          tr:
