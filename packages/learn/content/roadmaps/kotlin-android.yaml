      - file: app/src/test/java/dev/example/habits/AesGcmTest.kt
        lang: kotlin
        text: |
          package dev.example.habits

          import dev.example.habits.data.AesGcm
          import javax.crypto.KeyGenerator
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNull
          import org.junit.Test

          class AesGcmTest {
              @Test
              fun a_sealed_text_opens_again_but_not_with_another_key() {
                  val generator = KeyGenerator.getInstance("AES").apply { init(256) }
                  val key = generator.generateKey()
                  val packed = AesGcm.seal(key, "secret-token")
                  assertEquals("secret-token", AesGcm.open(key, packed))
                  assertNull(AesGcm.open(generator.generateKey(), packed))
              }
          }
    mistakes:
      - problem:
          en: "Hiding an API key in the code, in `strings.xml` or in a `BuildConfig` field and thinking it is safe."
          tr: "Bir API anahtarını kodun, `strings.xml`'in ya da bir `BuildConfig` alanının içine saklayıp güvende sanmak."
        fix:
          en: "Everything in the APK can be read. Keep real secrets on a server you control and let the app ask your server. The Keystore protects what the user or the app creates on the phone, like a login token, not secrets you ship."
          tr: "APK'nın içindeki her şey okunabilir. Gerçek sırları kendi kontrol ettiğin bir sunucuda tut ve uygulama sunucuna sorsun. Keystore, kullanıcının ya da uygulamanın telefonda ürettiği şeyleri korur (giriş token'ı gibi), uygulamayla birlikte dağıttığın sırları değil."
      - problem:
          en: "Using the same IV again for two encryptions with the same key."
          tr: "Aynı anahtarla iki şifrelemede aynı IV'yi tekrar kullanmak."
        fix:
          en: "With AES-GCM that breaks the security. Do not pass an IV when encrypting with a Keystore key: it makes a fresh one, and `AesGcm.seal` saves it in front of the data."
          tr: "AES-GCM'de bu güvenliği bozar. Keystore anahtarıyla şifrelerken IV verme: yeni bir tane üretir ve `AesGcm.seal` onu verinin önüne koyup kaydeder."
      - problem:
          en: "After restoring the app on a new phone the token cannot be opened."
          tr: "Uygulamayı yeni bir telefona geri yükleyince token açılamıyor."
        fix:
          en: "Keystore keys never leave the phone, but Android's backup may copy the data file. That is why `read` returns `null` when decryption fails and the user simply signs in again. For files like this one you can also exclude them from backup with the rules in `res/xml/data_extraction_rules.xml`."
          tr: "Keystore anahtarları telefondan asla çıkmaz ama Android yedeği veri dosyasını kopyalayabilir. Bu yüzden şifre çözme başarısız olunca `read` `null` döndürür ve kullanıcı yeniden giriş yapar. Böyle dosyaları `res/xml/data_extraction_rules.xml` kurallarıyla yedekten de çıkarabilirsin."
    quiz:
      - q:
          en: "Where does the encryption key live in this design?"
          tr: "Bu tasarımda şifreleme anahtarı nerede duruyor?"
        options:
          en:
            - "In a Kotlin constant in the code"
            - "In the Android Keystore, which your app can use but not read"
            - "In the same DataStore file as the token"
          tr:
            - "Kodda bir Kotlin sabitinde"
            - "Android Keystore'da; uygulaman kullanabilir ama okuyamaz"
            - "Token ile aynı DataStore dosyasında"
        answer: 1
        why:
          en: "Key material never enters your app's process: the system does the encrypting and decrypting for you."
          tr: "Anahtar malzemesi uygulamanın sürecine hiç girmez: şifreleme ve çözmeyi sistem senin için yapar."
    sources:
      - title: Android Keystore system
        url: https://developer.android.com/privacy-and-security/keystore
      - title: Security library release notes (deprecation of security-crypto)
        url: https://developer.android.com/jetpack/androidx/releases/security
      - title: Security tips for data and API keys
        url: https://developer.android.com/topic/security/data

  - id: baseline-profiles
    stage: performance
    title:
      en: "Faster start: R8 and a Baseline Profile"
      tr: "Daha hızlı açılış: R8 ve Baseline Profile"
    minutes: 90
    needs: [secure-token]
    why:
      en: "The first time an app runs, Android has to read and translate your code on the fly, which makes the first launch and the first scroll slower. A Baseline Profile is a list of the important code paths, shipped with the app, so Android prepares them ahead of time. Google's guide says apps often see about 30% faster code execution from the first launch. R8 makes the release build smaller by removing unused code."
      tr: "Bir uygulama ilk çalıştığında Android kodunu anında okuyup çevirmek zorundadır; ilk açılış ve ilk kaydırma bu yüzden yavaştır. Baseline Profile, uygulamayla birlikte gelen önemli kod yollarının listesidir; Android onları önceden hazırlar. Google'ın rehberi uygulamaların ilk açılıştan itibaren yaklaşık %30 daha hızlı kod çalıştırma gördüğünü söylüyor. R8 kullanılmayan kodu silerek release build'ini küçültür."
    learn:
      en: |
        - Measure first: a feeling of slowness is not a measurement
        - R8: shrinks, renames and optimizes the code of the release build (`isMinifyEnabled = true`)
        - What a Baseline Profile is, and that it only has an effect in release builds
        - The Baseline Profile Generator module: a test that starts the app while Android records which code ran
        - Compose habits you already use: stable `key`s in lists, state read with `collectAsStateWithLifecycle`, no heavy work inside a composable
      tr: |
        - Önce ölç: yavaş hissetmek bir ölçüm değildir
        - R8: release build'inin kodunu küçültür, yeniden adlandırır ve optimize eder (`isMinifyEnabled = true`)
        - Baseline Profile'ın ne olduğu ve sadece release build'lerde etkili olduğu
        - Baseline Profile Generator modülü: uygulamayı başlatırken Android'in hangi kodun çalıştığını kaydettiği bir test
        - Zaten kullandığın Compose alışkanlıkları: listelerde sabit `key`'ler, `collectAsStateWithLifecycle` ile okunan state, bir composable içinde ağır iş yapmamak
    do:
      en: |
        1. Turn on R8 for release builds: in `app/build.gradle.kts` set `isMinifyEnabled = true` and `isShrinkResources = true` in the `release` build type (code below).
        2. Test the release build: run **Build, Select Build Variant** and choose `release` for the `app` module, or build it from the terminal (see the next steps). Click through every screen: list, add, detail, settings, quote. R8 can remove code that is only used through reflection; if a screen breaks only in release, read the R8 mapping and add a keep rule to `proguard-rules.pro`. Retrofit, kotlinx.serialization and Room ship their own rules, so you should not need any.
        3. Create the generator module: **File, New, New Module, Baseline Profile Generator** (needs a recent Android Studio, which you have). Choose the `app` module as the target. The template changes `app/build.gradle.kts` for you and adds a `baselineprofile` module with a test called `BaselineProfileGenerator` and one called `StartupBenchmarks`.
        4. Open `BaselineProfileGenerator`. The template starts the app with `pressHome()` and `startActivityAndWait()`. That is enough for app start. For a better profile add the steps a user does often right after it (open the add screen and go back).
        5. Generate the profile with the run configuration **Generate Baseline Profile** or the command below. It runs the test on a rooted device, an emulator, or (Android 13 and newer with a recent Macrobenchmark library) a normal phone. The result is written to a `baseline-prof.txt` under `app/src/<variant>/generated/baselineProfiles/`.
        6. Measure: run `StartupBenchmarks` on a real phone with the release-like variant. It prints `timeToInitialDisplayMs` for two cases, with and without the profile. Compare the numbers. For a small app the difference is small; the idea is to learn the tools.
        7. Commit the generated profile file: `git add .` and `git commit -m "Shrink with R8 and add a baseline profile"`.
      tr: |
        1. Release build'leri için R8'i aç: `app/build.gradle.kts` içinde `release` build type'ında `isMinifyEnabled = true` ve `isShrinkResources = true` yap (aşağıdaki kod).
        2. Release build'ini dene: **Build, Select Build Variant** menüsünden `app` modülü için `release`'i seç ya da terminalden derle (sonraki adımlara bak). Bütün ekranlara tıkla: liste, ekleme, ayrıntı, ayarlar, söz. R8 sadece reflection ile kullanılan kodu silebilir; bir ekran sadece release'te bozulursa R8 mapping'ini oku ve `proguard-rules.pro` içine bir keep kuralı ekle. Retrofit, kotlinx.serialization ve Room kendi kurallarını getirir, o yüzden gerek kalmaması lazım.
        3. Generator modülünü oluştur: **File, New, New Module, Baseline Profile Generator** (yeni bir Android Studio ister, sende var). Hedef olarak `app` modülünü seç. Şablon `app/build.gradle.kts`'i senin için değiştirir ve `BaselineProfileGenerator` ile `StartupBenchmarks` adında iki test içeren bir `baselineprofile` modülü ekler.
        4. `BaselineProfileGenerator`'ı aç. Şablon uygulamayı `pressHome()` ve `startActivityAndWait()` ile başlatır. Uygulamanın açılışı için bu yeter. Daha iyi bir profil için kullanıcının hemen ardından sık yaptığı adımları ekle (ekleme ekranını aç ve geri dön).
        5. Profili **Generate Baseline Profile** çalıştırma ayarıyla ya da aşağıdaki komutla üret. Testi root'lu bir cihazda, bir emülatörde ya da (Android 13 ve üstünde, yeni bir Macrobenchmark kütüphanesiyle) normal bir telefonda çalıştırır. Sonuç `app/src/<variant>/generated/baselineProfiles/` altında `baseline-prof.txt` olarak yazılır.
        6. Ölç: `StartupBenchmarks`'ı gerçek bir telefonda release benzeri varyantla çalıştır. İki durum için `timeToInitialDisplayMs` yazar: profilli ve profilsiz. Sayıları karşılaştır. Küçük bir uygulamada fark küçüktür; amaç araçları öğrenmek.
        7. Üretilen profil dosyasını commit'le: `git add .` ve `git commit -m "Shrink with R8 and add a baseline profile"`.
    code:
      - file: app/build.gradle.kts
        lang: kotlin
        text: |
          android {
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro",
                      )
                  }
              }
          }
      - file: terminal
        lang: sh
        text: |
          # Build the release variant from the terminal (on Windows use gradlew.bat)
          ./gradlew :app:assembleRelease

          # Generate the Baseline Profile
          ./gradlew :app:generateBaselineProfile
    mistakes:
      - problem:
          en: "Judging speed on the emulator or on a debug build."
          tr: "Hızı emülatörde ya da debug build'inde yargılamak."
        fix:
          en: "A debug build is slow on purpose and emulators are not real phones. Judge with a release-like variant on a real phone. Baseline Profiles only apply to release builds."
          tr: "Debug build bilerek yavaştır ve emülatörler gerçek telefon değildir. Gerçek telefonda release benzeri varyantla yargıla. Baseline Profile sadece release build'lerde uygulanır."
      - problem:
          en: "The profile generation fails on the emulator or does nothing."
          tr: "Profil üretimi emülatörde başarısız oluyor ya da hiçbir şey yapmıyor."
        fix:
          en: "Generation needs root access, or Android 13 or newer with a recent Macrobenchmark library. Use an emulator image that is not marked with Google Play (those can be rooted), a Gradle managed device with an \"aosp\" image, or an Android 13+ phone. The guide lists known problems on some brands."
          tr: "Üretim root erişimi ya da Android 13 veya üstü ile yeni bir Macrobenchmark kütüphanesi ister. Google Play işaretli olmayan bir emülatör imajı (onlara root verilebilir), \"aosp\" imajlı bir Gradle managed device ya da Android 13+ bir telefon kullan. Rehber bazı markalardaki bilinen sorunları sıralıyor."
      - problem:
          en: "Turning on R8 and shipping without testing the release build."
          tr: "R8'i açıp release build'ini denemeden yayınlamak."
        fix:
          en: "R8 renames and removes code, so some bugs appear only in release. Always click through the release build on a phone before you share it."
          tr: "R8 kodu yeniden adlandırır ve siler; bazı hatalar sadece release'te görünür. Paylaşmadan önce release build'ini telefonda baştan sona gez."
    quiz:
      - q:
          en: "When does a Baseline Profile make your app faster?"
          tr: "Baseline Profile uygulamanı ne zaman hızlandırır?"
        options:
          en:
            - "In debug builds while you develop"
            - "In release builds, from the first launch after install"
            - "Only after the user has used the app for a week"
          tr:
            - "Geliştirirken debug build'lerde"
            - "Release build'lerde, kurulumdan sonraki ilk açılıştan itibaren"
            - "Sadece kullanıcı uygulamayı bir hafta kullandıktan sonra"
        answer: 1
        why:
          en: "The profile is installed with a release build, so Android can prepare the listed code ahead of time, before the first launch."
          tr: "Profil release build'le birlikte kurulur; Android listelenen kodu ilk açılıştan önce hazırlayabilir."
    sources:
      - title: Baseline Profiles overview
        url: https://developer.android.com/topic/performance/baselineprofiles/overview
      - title: Create Baseline Profiles
        url: https://developer.android.com/topic/performance/baselineprofiles/create-baselineprofile
      - title: Android performance
        url: https://developer.android.com/topic/performance

  - id: app-icon
    stage: packaging
    title:
      en: "App name and app icon"
      tr: "Uygulama adı ve uygulama ikonu"
    minutes: 60
    needs: [baseline-profiles]
    why:
      en: "The icon and the name are the first things anyone sees, on the home screen and in the store. Android icons are adaptive: two layers (a background and a foreground) that the phone masks into a circle, a squircle or a square depending on the brand of the phone, and can tint with the wallpaper colors."
      tr: "İkon ve ad, ana ekranda ve mağazada herkesin ilk gördüğü şeydir. Android ikonları adaptiftir: iki katman (arka plan ve ön plan) telefonun markasına göre daire, squircle ya da kare şeklinde kesilir ve duvar kâğıdının renkleriyle boyanabilir."
    learn:
      en: |
        - Adaptive icons: a background layer and a foreground layer on a 108 dp canvas; keep the picture inside the middle circle of about 66 dp because the phone cuts the edges
        - The monochrome layer used for themed icons on newer Android versions
        - Image Asset Studio: it writes all sizes into the `mipmap` folders and updates the manifest
        - `app_name` in `res/values/strings.xml` is the name shown under the icon
      tr: |
        - Adaptif ikonlar: 108 dp'lik bir tuval üzerinde arka plan ve ön plan katmanı; telefon kenarları kestiği için resmi ortadaki yaklaşık 66 dp'lik dairenin içinde tut
        - Yeni Android sürümlerinde temalı ikonlar için kullanılan monochrome katman
        - Image Asset Studio: bütün boyutları `mipmap` klasörlerine yazar ve manifest'i günceller
        - `res/values/strings.xml` içindeki `app_name`, ikonun altında görünen addır
    do:
      en: |
        1. Open `app/src/main/res/values/strings.xml` and make sure `app_name` is `Habits` (or the name you want people to see).
        2. In the Project window switch to the **Android** view. Right-click the `res` folder and choose **New, Image Asset**.
        3. Icon Type: **Launcher Icons (Adaptive and Legacy)**. Name: `ic_launcher`.
        4. Foreground Layer: Asset Type **Clip Art**, click the picture, search `check` and pick a check mark. Choose a color for it (white works well on a dark background). Use **Resize** until the mark sits inside the circle in the preview.
        5. Background Layer: Asset Type **Color** and pick a color you like. Leave the Monochrome layer on its default so it reuses the foreground.
        6. Look at the preview with the different shapes. On the **Options** tab keep legacy, round and Google Play Store icons switched on. Click Next, then Finish. Overwrite the existing files when asked.
        7. Run the app and look at your home screen. If your phone supports themed icons (Android 13 and newer, switched on in the wallpaper settings), try that too.
        8. Commit: `git add .` and `git commit -m "Add the app icon"`. The Play Store icon is created for you too (a 512 pixel image is needed later for the store page).
      tr: |
        1. `app/src/main/res/values/strings.xml` dosyasını aç ve `app_name`'in `Habits` (ya da insanların görmesini istediğin ad) olduğundan emin ol.
        2. Project penceresinde **Android** görünümüne geç. `res` klasörüne sağ tıkla ve **New, Image Asset**'i seç.
        3. Icon Type: **Launcher Icons (Adaptive and Legacy)**. Name: `ic_launcher`.
        4. Foreground Layer: Asset Type **Clip Art**, resme tıkla, `check` ara ve bir onay işareti seç. Ona bir renk ver (koyu arka planda beyaz iyi durur). Önizlemede işaret dairenin içine girene kadar **Resize** ile küçült.
        5. Background Layer: Asset Type **Color** ve beğendiğin bir rengi seç. Monochrome katmanı varsayılanda bırak; ön planı yeniden kullanır.
        6. Önizlemeye farklı şekillerle bak. **Options** sekmesinde legacy, round ve Google Play Store ikonlarının açık kalmasına dikkat et. Next'e, sonra Finish'e bas. Sorulunca mevcut dosyaların üzerine yaz.
        7. Uygulamayı çalıştır ve ana ekranına bak. Telefonun temalı ikonları destekliyorsa (Android 13 ve sonrası, duvar kâğıdı ayarlarından açılır) onu da dene.
        8. Commit'le: `git add .` ve `git commit -m "Add the app icon"`. Play Store ikonu da senin için oluşturulur (mağaza sayfası için sonra 512 piksellik bir resim gerekir).
    code:
      - file: app/src/main/res/values/strings.xml
        lang: xml
        text: |
          <resources>
              <string name="app_name">Habits</string>
          </resources>
      - file: app/src/main/AndroidManifest.xml
        lang: xml
        text: |
          <!-- Image Asset Studio keeps these two lines pointing at the new icon. -->
          <application
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:label="@string/app_name"
              ...>
    mistakes:
      - problem:
          en: "The picture is cut off on some phones."
          tr: "Resim bazı telefonlarda kesiliyor."
        fix:
          en: "Each phone brand masks the icon in its own shape. Keep the important part of the foreground inside the middle circle (about 66 dp of the 108 dp canvas) and use the preview shapes to check."
          tr: "Her telefon markası ikonu kendi şeklinde keser. Ön planın önemli kısmını ortadaki dairenin (108 dp'lik tuvalde yaklaşık 66 dp) içinde tut ve kontrol için önizleme şekillerini kullan."
      - problem:
          en: "Still seeing the old icon after changing it."
          tr: "İkonu değiştirdikten sonra hâlâ eski ikonu görmek."
        fix:
          en: "The launcher caches icons. Uninstall the app from the phone and run it again."
          tr: "Başlatıcı ikonları önbelleğe alır. Uygulamayı telefondan sil ve yeniden çalıştır."
    quiz:
      - q:
          en: "Why does an adaptive icon have a background and a foreground layer?"
          tr: "Adaptif ikonun neden bir arka plan ve bir ön plan katmanı var?"
        options:
          en:
            - "So the phone can cut it into its own shape and move the layers a little"
            - "So the app can start faster"
            - "Because Google Play requires two files"
          tr:
            - "Telefon onu kendi şeklinde kesebilsin ve katmanları biraz hareket ettirebilsin diye"
            - "Uygulama daha hızlı açılsın diye"
            - "Google Play iki dosya istediği için"
        answer: 0
        why:
          en: "The system draws the layers together and applies the mask of the phone. That is why the edges of the foreground may be cut."
          tr: "Sistem katmanları birlikte çizer ve telefonun maskesini uygular. Ön planın kenarlarının kesilebilmesi bu yüzdendir."
    sources:
      - title: Create app icons with Image Asset Studio
        url: https://developer.android.com/studio/write/create-app-icons
      - title: Adaptive icons
        url: https://developer.android.com/develop/ui/views/launch/icon_design_adaptive
      - title: App resources overview
        url: https://developer.android.com/guide/topics/resources/providing-resources

  - id: signed-build
    stage: packaging
    title:
      en: "Build a signed release: AAB and APK"
      tr: "İmzalı release build'i alma: AAB ve APK"
    minutes: 90
    needs: [app-icon]
    why:
      en: "Android only installs apps that are signed with a key. The signature proves that an update comes from the same author. Google Play wants an AAB (Android App Bundle, a file Google turns into the right APK for each phone), while a plain APK is what you hand to friends. Both are signed with a key that only you hold."
      tr: "Android sadece bir anahtarla imzalanmış uygulamaları kurar. İmza, bir güncellemenin aynı yazardan geldiğini kanıtlar. Google Play AAB (Android App Bundle; Google'ın her telefon için doğru APK'ya çevirdiği dosya) ister, düz APK ise arkadaşlarına verdiğin dosyadır. İkisi de sadece sende olan bir anahtarla imzalanır."
    learn:
      en: |
        - The upload key: a keystore file (`.jks`) with a password. Lose it and you cannot update an app you shared as an APK; with Play App Signing you can ask Google to reset an upload key
        - Play App Signing: Google keeps the real app signing key, and you sign uploads with a separate upload key
        - `versionCode` (a whole number that must go up with every upload) and `versionName` (the text users see)
        - Keeping passwords out of Git: a `keystore.properties` file that is ignored
        - AAB for the Play Store, APK for sharing
      tr: |
        - Upload key: parolası olan bir keystore dosyası (`.jks`). Kaybedersen APK olarak paylaştığın bir uygulamayı güncelleyemezsin; Play App Signing ile Google'dan upload key'i sıfırlamasını isteyebilirsin
        - Play App Signing: gerçek uygulama imza anahtarını Google tutar, sen yüklemeleri ayrı bir upload key ile imzalarsın
        - `versionCode` (her yüklemede artması gereken tam sayı) ve `versionName` (kullanıcıların gördüğü metin)
        - Parolaları Git'ten uzak tutmak: yok sayılan bir `keystore.properties` dosyası
        - Play Store için AAB, paylaşmak için APK
    do:
      en: |
        1. Make the key. In Android Studio choose **Build, Generate Signed App Bundle or APK** (in some versions it is under **Build, Generate App Bundles or APKs**). Pick **Android App Bundle**, click Next, then **Create new** under Key store path. Save the file as `upload-keystore.jks` **outside** your project folder, for example in a `keys` folder in your home folder. Set a strong password, alias `upload`, validity at least 25 years, and fill in your name. Click OK, then Cancel on the wizard (we sign from Gradle instead).
        2. Back up `upload-keystore.jks` and the passwords in two safe places (a password manager and an offline copy). Never commit it and never send it in chat.
        3. Create `keystore.properties` in the project root folder (next to `settings.gradle.kts`) with the four lines below, using your own values. Add the two ignore lines to `.gitignore`.
        4. In `app/build.gradle.kts` add the `import` at the very top, the `keystoreProperties` block above `android { }`, the `signingConfigs` block and the `signingConfig` line in the release build type.
        5. In `defaultConfig` set `versionCode = 1` and `versionName = "1.0.0"`. Raise `versionCode` by one for every build you upload or share later.
        6. Build both files from a terminal in the project folder (on Windows use `gradlew.bat`). Android Studio shows where the files are; they are normally under `app/build/outputs/bundle/release/` and `app/build/outputs/apk/release/`.
        7. Install the signed APK on your phone to test the real thing: connect it and run `adb install -r` with the path. `adb` lives in the `platform-tools` folder of your Android SDK. Click through the whole app.
        8. Commit: `git add .` and `git commit -m "Sign release builds"`. Check with `git status` that `keystore.properties` and the `.jks` file are not in the list.
      tr: |
        1. Anahtarı üret. Android Studio'da **Build, Generate Signed App Bundle or APK**'yı seç (bazı sürümlerde **Build, Generate App Bundles or APKs** altında). **Android App Bundle**'ı seç, Next'e bas, sonra Key store path altında **Create new**'e bas. Dosyayı `upload-keystore.jks` adıyla proje klasörünün **dışına** kaydet, örneğin ev klasöründeki bir `keys` klasörüne. Güçlü bir parola, alias `upload`, en az 25 yıl geçerlilik ver ve adını yaz. OK'e, sonra sihirbazda Cancel'a bas (imzalamayı Gradle'dan yapacağız).
        2. `upload-keystore.jks` dosyasını ve parolaları iki güvenli yere yedekle (bir parola yöneticisi ve çevrimdışı bir kopya). Asla commit'leme, asla sohbette gönderme.
        3. Proje kök klasöründe (`settings.gradle.kts`'in yanında) kendi değerlerinle aşağıdaki dört satırlık `keystore.properties` dosyasını oluştur. İki yok sayma satırını `.gitignore`'a ekle.
        4. `app/build.gradle.kts` içine en üste `import`'u, `android { }` bloğunun üstüne `keystoreProperties` bloğunu, `signingConfigs` bloğunu ve release build type'ına `signingConfig` satırını ekle.
        5. `defaultConfig` içinde `versionCode = 1` ve `versionName = "1.0.0"` yap. Sonradan yüklediğin ya da paylaştığın her build için `versionCode`'u bir artır.
        6. Proje klasöründe bir terminalden iki dosyayı da derle (Windows'ta `gradlew.bat`). Android Studio dosyaların yerini gösterir; normalde `app/build/outputs/bundle/release/` ve `app/build/outputs/apk/release/` altındadır.
        7. Gerçeğini denemek için imzalı APK'yı telefonuna kur: telefonu bağla ve yolu vererek `adb install -r` çalıştır. `adb`, Android SDK'nın `platform-tools` klasöründedir. Bütün uygulamayı gez.
        8. Commit'le: `git add .` ve `git commit -m "Sign release builds"`. `git status` ile `keystore.properties` ve `.jks` dosyasının listede olmadığını kontrol et.
    code:
      - file: keystore.properties
        lang: properties
        text: |
          storePassword=the-password-you-chose
          keyPassword=the-password-you-chose
          keyAlias=upload
          storeFile=/home/you/keys/upload-keystore.jks
      - file: .gitignore
        lang: text
        text: |
          keystore.properties
          *.jks
      - file: app/build.gradle.kts
        lang: kotlin
        text: |
          import java.util.Properties

          // ... the plugins { } block stays here ...

          val keystoreProperties = Properties().apply {
              val file = rootProject.file("keystore.properties")
              if (file.exists()) file.inputStream().use { load(it) }
          }

          android {
              // ... namespace, compileSdk and the rest stay as they are ...

              defaultConfig {
                  // ... applicationId, minSdk and the rest stay as they are ...
                  versionCode = 1
                  versionName = "1.0.0"
              }

              signingConfigs {
                  create("release") {
                      if (keystoreProperties.isNotEmpty()) {
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                          storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                          storePassword = keystoreProperties["storePassword"] as String
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro",
                      )
                      if (keystoreProperties.isNotEmpty()) {
                          signingConfig = signingConfigs.getByName("release")
                      }
                  }
              }
          }
      - file: terminal
        lang: sh
        text: |
          # AAB for Google Play
          ./gradlew :app:bundleRelease

          # APK to share or to install on a phone
          ./gradlew :app:assembleRelease

          # Install the APK on a connected phone (adb is in <Android SDK>/platform-tools)
          adb install -r app/build/outputs/apk/release/app-release.apk
    mistakes:
      - problem:
          en: "Committing the keystore or `keystore.properties` to Git."
          tr: "Keystore'u ya da `keystore.properties`'i Git'e commit'lemek."
        fix:
          en: "Treat it as a leaked key: anyone with the file and the password can publish apps that look like yours. Create a new key; if the app is on Play, request an upload key reset in Play Console. Remove the file from the repository history, not only from the latest commit."
          tr: "Anahtar sızmış say: dosyaya ve parolaya sahip olan herkes seninki gibi görünen uygulamalar yayınlayabilir. Yeni anahtar üret; uygulama Play'deyse Play Console'dan upload key sıfırlama iste. Dosyayı sadece son commit'ten değil, depo geçmişinden de sil."
      - problem:
          en: "Losing the keystore of an app you only shared as an APK."
          tr: "Sadece APK olarak paylaştığın bir uygulamanın keystore'unu kaybetmek."
        fix:
          en: "Updates must be signed with the same key, so your friends would have to uninstall and lose their data. Back the file up in two places from day one."
          tr: "Güncellemeler aynı anahtarla imzalanmak zorunda; arkadaşların uygulamayı silip verilerini kaybetmek zorunda kalır. Dosyayı ilk günden iki yere yedekle."
      - problem:
          en: "The build produces `app-release-unsigned.apk`, or fails with a message about the signing config."
          tr: "Build `app-release-unsigned.apk` üretiyor ya da imza ayarı hakkında hata veriyor."
        fix:
          en: "Gradle did not find `keystore.properties` or a value in it. Check the file name and place (project root), the four keys, and the path in `storeFile`. Then build again."
          tr: "Gradle `keystore.properties` dosyasını ya da içindeki bir değeri bulamadı. Dosya adını ve yerini (proje kökü), dört anahtarı ve `storeFile` yolunu kontrol et. Sonra yeniden derle."
    quiz:
      - q:
          en: "Which file do you upload to Google Play, and which one do you give to a friend?"
          tr: "Google Play'e hangi dosyayı yüklersin, arkadaşına hangisini verirsin?"
        options:
          en:
            - "Upload the APK, give the AAB to a friend"
            - "Upload the AAB, give the APK to a friend"
            - "The same file for both, it makes no difference"
          tr:
            - "APK'yı yükle, AAB'yi arkadaşına ver"
            - "AAB'yi yükle, APK'yı arkadaşına ver"
            - "İkisi için de aynı dosya, fark etmez"
        answer: 1
        why:
          en: "Play builds the right APKs from an AAB for each phone. A friend can only install an APK directly."
          tr: "Play, bir AAB'den her telefon için doğru APK'ları üretir. Bir arkadaşın doğrudan sadece APK kurabilir."
    sources:
      - title: Sign your app (Play App Signing, upload key)
        url: https://developer.android.com/studio/publish/app-signing
      - title: Prepare your app for release
        url: https://developer.android.com/studio/publish/preparing
      - title: Version your app
        url: https://developer.android.com/studio/publish/versioning

  - id: publish
    stage: deploy
    title:
      en: "Publish honestly: share an APK for free, or use Google Play"
      tr: "Dürüstçe yayınlama: APK'yı ücretsiz paylaş ya da Google Play'i kullan"
    minutes: 75
    needs: [signed-build]
    why:
      en: "There are two real ways to put an Android app in other people's hands. Sharing the APK is free and takes minutes, but people have to allow installs from outside the store and updates are manual. Google Play is where most users look, but it costs money and, for new personal accounts, a testing period. Knowing both lets you choose."
      tr: "Bir Android uygulamasını başkalarının eline vermenin iki gerçek yolu var. APK'yı paylaşmak ücretsizdir ve dakikalar sürer ama insanların mağaza dışından kuruluma izin vermesi gerekir ve güncellemeler elle yapılır. Google Play çoğu kullanıcının baktığı yerdir ama paralıdır ve yeni kişisel hesaplar için bir test süreci vardır. İkisini bilmek seçim yapmanı sağlar."
    learn:
      en: |
        - Free path: a public GitHub repository with a Release that carries the signed APK
        - Why people see a warning: the app does not come from a store, and they must allow installs for the app they use to open the file
        - Updates by APK need the same key and a higher `versionCode`
        - Google Play: a one-time registration fee of US$25, identity checks, a store page, a data safety form and a privacy policy
        - New personal developer accounts (created after 13 November 2023) must first run a closed test with at least 12 testers opted in for 14 days in a row, then apply for production access; the review usually takes up to seven days
      tr: |
        - Ücretsiz yol: imzalı APK'yı taşıyan bir Release'i olan herkese açık bir GitHub deposu
        - İnsanların neden uyarı gördüğü: uygulama bir mağazadan gelmiyor ve dosyayı açtıkları uygulama için kuruluma izin vermeleri gerekiyor
        - APK ile güncelleme aynı anahtarı ve daha yüksek bir `versionCode` ister
        - Google Play: tek seferlik 25 ABD doları kayıt ücreti, kimlik doğrulama, bir mağaza sayfası, veri güvenliği formu ve gizlilik politikası
        - Yeni kişisel geliştirici hesapları (13 Kasım 2023'ten sonra açılanlar) önce en az 12 test kullanıcısının 14 gün üst üste katıldığı kapalı bir test yapmak, sonra üretim erişimi için başvurmak zorunda; inceleme genelde yedi güne kadar sürer
    do:
      en: |
        1. **Free path.** Create a repository on github.com (it can be public), then in your project folder run the commands below to push your code. Do this only after you checked that `keystore.properties` and `.jks` files are not committed.
        2. On github.com open your repository, go to **Releases, Draft a new release**, create the tag `v1.0.0`, drag `app-release.apk` into the files box and publish. Or run the `gh release create` command below if you use the GitHub CLI.
        3. Send the release link to a friend. On their phone: open the link, download the APK, tap it and, when asked, allow the browser or file app to install unknown apps. They may see a Google Play Protect warning for apps not from the store.
        4. For an update: raise `versionCode` and `versionName`, build again with the same key, make `v1.0.1` and share it. Android refuses an update signed with another key.
        5. **Google Play path (read before you pay).** Open the Play Console sign-up page from the help article below. You pay US$25 once and verify your identity (a government ID and a payment card in your legal name may be asked). Then create the app, fill in the store listing (name, descriptions, screenshots, the 512 pixel icon from the last step), the content rating, the data safety form and a link to a privacy policy.
        6. Upload `app-release.aab` to a **closed testing** track and add your testers. With a personal account created after 13 November 2023 you need at least 12 testers who stay opted in for 14 days in a row before you can apply for production. Plan for about three weeks.
        7. When the 14 days are over, click **Apply for production** on the Play Console dashboard and answer the questions about your test. Release to production after approval.
        8. Decide: for learning and for friends, the free APK path is enough. For strangers to find your app, Play is worth the fee and the wait.
      tr: |
        1. **Ücretsiz yol.** github.com'da bir depo oluştur (herkese açık olabilir), sonra proje klasöründe kodunu göndermek için aşağıdaki komutları çalıştır. Bunu sadece `keystore.properties` ve `.jks` dosyalarının commit'lenmediğini kontrol ettikten sonra yap.
        2. github.com'da deponu aç, **Releases, Draft a new release**'e git, `v1.0.0` tag'ini oluştur, `app-release.apk`'yı dosya kutusuna sürükle ve yayınla. GitHub CLI kullanıyorsan aşağıdaki `gh release create` komutunu da çalıştırabilirsin.
        3. Release bağlantısını bir arkadaşına gönder. Onun telefonunda: bağlantıyı aç, APK'yı indir, üzerine dokun ve sorulunca tarayıcının ya da dosya uygulamasının bilinmeyen uygulamaları kurmasına izin ver. Mağazadan gelmeyen uygulamalar için Google Play Protect uyarısı görebilir.
        4. Güncelleme için: `versionCode` ve `versionName`'i artır, aynı anahtarla yeniden derle, `v1.0.1`'i oluştur ve paylaş. Android başka bir anahtarla imzalanmış güncellemeyi reddeder.
        5. **Google Play yolu (para ödemeden önce oku).** Aşağıdaki yardım makalesinden Play Console kayıt sayfasını aç. Bir kere 25 ABD doları ödersin ve kimliğini doğrularsın (yasal adına bir resmi kimlik ve ödeme kartı istenebilir). Sonra uygulamayı oluştur; mağaza sayfasını (ad, açıklamalar, ekran görüntüleri, son adımdaki 512 piksellik ikon), içerik derecelendirmesini, veri güvenliği formunu ve bir gizlilik politikası bağlantısını doldur.
        6. `app-release.aab` dosyasını bir **closed testing** (kapalı test) kanalına yükle ve test kullanıcılarını ekle. 13 Kasım 2023'ten sonra açılmış kişisel bir hesapla, üretime başvurmadan önce en az 12 test kullanıcısının 14 gün üst üste katılmış kalması gerekir. Yaklaşık üç hafta planla.
        7. 14 gün bitince Play Console panosunda **Apply for production**'a bas ve testinle ilgili soruları cevapla. Onaydan sonra üretime çıkar.
        8. Karar ver: öğrenmek ve arkadaşların için ücretsiz APK yolu yeter. Yabancıların uygulamanı bulması için Play, ücrete ve beklemeye değer.
    code:
      - file: terminal
        lang: sh
        text: |
          # Push the code (replace YOUR-NAME; create the empty repository on github.com first)
          git branch -M main
          git remote add origin https://github.com/YOUR-NAME/habits.git
          git push -u origin main

          # Optional: create the release with the GitHub CLI instead of the web page
          gh release create v1.0.0 app/build/outputs/apk/release/app-release.apk \
            --title "Habits 1.0.0" --notes "First release"
    mistakes:
      - problem:
          en: "Expecting Google Play to be free or instant."
          tr: "Google Play'in ücretsiz ya da anında olmasını beklemek."
        fix:
          en: "Registration costs US$25 once, and a new personal account needs the closed test (12 testers, 14 days) before production. Start the test as early as possible and ask friends to stay opted in."
          tr: "Kayıt bir kere 25 ABD doları tutar ve yeni bir kişisel hesap üretimden önce kapalı test ister (12 test kullanıcısı, 14 gün). Testi mümkün olduğunca erken başlat ve arkadaşlarından katılımda kalmalarını iste."
      - problem:
          en: "Sending the `debug` APK because it was easier to find."
          tr: "Bulması daha kolay diye `debug` APK'yı göndermek."
        fix:
          en: "The debug build is slow, bigger and signed with a throwaway key. Always share the signed release APK."
          tr: "Debug build yavaştır, daha büyüktür ve atılacak bir anahtarla imzalıdır. Her zaman imzalı release APK'yı paylaş."
      - problem:
          en: "Forgetting `versionCode` for an update: Play says the version code was already used."
          tr: "Güncellemede `versionCode`'u artırmayı unutmak: Play, version code'un zaten kullanıldığını söylüyor."
        fix:
          en: "Every upload needs a higher `versionCode` than any earlier one. Raise it by one and build again."
          tr: "Her yüklemenin `versionCode`'u öncekilerden yüksek olmalı. Bir artır ve yeniden derle."
    quiz:
      - q:
          en: "What is true for a new personal Google Play developer account?"
          tr: "Yeni bir kişisel Google Play geliştirici hesabı için hangisi doğru?"
        options:
          en:
            - "It must run a closed test with at least 12 testers for 14 days before production"
            - "It can publish to everyone on the first day"
            - "It never has to pay anything"
          tr:
            - "Üretimden önce en az 12 test kullanıcısıyla 14 gün kapalı test yapmak zorunda"
            - "İlk gün herkese yayın yapabilir"
            - "Hiçbir zaman bir şey ödemek zorunda değil"
        answer: 0
        why:
          en: "Google's help page requires 12 testers opted in continuously for 14 days for personal accounts created after 13 November 2023, plus a one-time US$25 fee to register."
          tr: "Google'ın yardım sayfası, 13 Kasım 2023'ten sonra açılan kişisel hesaplar için 14 gün kesintisiz katılmış 12 test kullanıcısı ve kayıt için tek seferlik 25 ABD doları ücret ister."
    sources:
      - title: Create and set up your Play Console developer account
        url: https://support.google.com/googleplay/android-developer/answer/6112435
      - title: App testing requirements for new personal developer accounts
        url: https://support.google.com/googleplay/android-developer/answer/14151465
      - title: Managing releases in a GitHub repository
        url: https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository

  - id: crash-reports
    stage: monitoring
    title:
      en: "Crash reports with Firebase Crashlytics"
      tr: "Firebase Crashlytics ile çökme raporları"
    minutes: 75
    needs: [publish]
    why:
      en: "When the app crashes on a stranger's phone you will never see it. A crash reporter sends you the error with the exact line of code, the phone model and the Android version, so you fix real problems instead of guessing. If you publish on Google Play you also get crash and ANR (app not responding) numbers in Android vitals for free."
      tr: "Uygulama bir yabancının telefonunda çöktüğünde bunu asla görmezsin. Çökme raporlayıcı sana hatayı, kodun tam satırını, telefon modelini ve Android sürümünü gönderir; böylece tahmin etmek yerine gerçek sorunları düzeltirsin. Google Play'de yayınlıyorsan çökme ve ANR (uygulama yanıt vermiyor) sayılarını Android vitals'ta ücretsiz de görürsün."
    learn:
      en: |
        - What a stack trace is and how to read it from the top down to the first line of your own code
        - Firebase Crashlytics: a free crash reporter from Google; you need a Google account and a Firebase project
        - Why release builds need a mapping file (R8 renamed everything) and that the Crashlytics plugin uploads it for you
        - Android vitals in Play Console: crash and ANR rates without any code
        - Privacy: a crash reporter collects data, so say so in your privacy policy and in the Play data safety form
      tr: |
        - Stack trace'in ne olduğu ve onu yukarıdan aşağı, kendi kodunun ilk satırına kadar nasıl okuyacağın
        - Firebase Crashlytics: Google'ın ücretsiz çökme raporlayıcısı; bir Google hesabı ve bir Firebase projesi gerekir
        - Release build'lerin neden bir mapping dosyasına ihtiyaç duyduğu (R8 her şeyi yeniden adlandırdı) ve Crashlytics eklentisinin onu senin için yüklediği
        - Play Console'daki Android vitals: hiç kod yazmadan çökme ve ANR oranları
        - Gizlilik: çökme raporlayıcı veri toplar; bunu gizlilik politikanda ve Play veri güvenliği formunda belirt
    do:
      en: |
        1. Go to console.firebase.google.com, sign in with a Google account and create a project (you can say no to Google Analytics, but breadcrumb logs in crash reports need it, so say yes if you want them).
        2. In the project add an **Android app**: use your exact package name (`dev.example.habits` or yours), download `google-services.json` and put it in the `app` folder (next to `app/build.gradle.kts`).
        3. In the root `build.gradle.kts` add the two plugins with `apply false`. In `app/build.gradle.kts` apply them and add the dependencies. The Firebase BoM sets matching versions for the libraries. Sync. (If the sync complains about plugin compatibility, follow the current Firebase setup page; versions change often.)
        4. Add a temporary test button to `SettingsScreen` that throws an exception (code below).
        5. Run the app (a release build is best, to see mapped names), tap the button, then **open the app again**: the report is sent on the next start. In the Firebase console open **Crashlytics**; the first crash can take a few minutes to show up.
        6. Click the crash. Read the stack trace from the top: the first line that names your own code (`dev.example.habits...`) is where to look.
        7. Delete the test button. Add a line about crash reports to your privacy policy.
        8. If your app is on Google Play, open Play Console and find **Android vitals** in the left menu to see crash and ANR rates there.
        9. Commit: `git add .` and `git commit -m "Add Crashlytics"`.
      tr: |
        1. console.firebase.google.com adresine git, bir Google hesabıyla giriş yap ve bir proje oluştur (Google Analytics'e hayır diyebilirsin ama çökme raporlarındaki breadcrumb log'ları ona ihtiyaç duyar; istiyorsan evet de).
        2. Projede bir **Android uygulaması** ekle: tam paket adını kullan (`dev.example.habits` ya da seninki), `google-services.json` dosyasını indir ve `app` klasörüne koy (`app/build.gradle.kts`'in yanına).
        3. Kök `build.gradle.kts` içine iki eklentiyi `apply false` ile ekle. `app/build.gradle.kts` içinde onları uygula ve bağımlılıkları ekle. Firebase BoM kütüphanelere uyumlu sürümleri verir. Sync yap. (Sync eklenti uyumluluğundan şikâyet ederse güncel Firebase kurulum sayfasını izle; sürümler sık değişir.)
        4. `SettingsScreen`'e bir istisna fırlatan geçici bir test düğmesi ekle (aşağıdaki kod).
        5. Uygulamayı çalıştır (isimlerin çözülmüş görünmesi için en iyisi release build), düğmeye bas, sonra **uygulamayı yeniden aç**: rapor bir sonraki açılışta gönderilir. Firebase konsolunda **Crashlytics**'i aç; ilk çökmenin görünmesi birkaç dakika sürebilir.
        6. Çökmeye tıkla. Stack trace'i yukarıdan oku: kendi kodunu (`dev.example.habits...`) adlandıran ilk satır bakacağın yerdir.
        7. Test düğmesini sil. Gizlilik politikana çökme raporları hakkında bir satır ekle.
        8. Uygulaman Google Play'deyse Play Console'u aç ve soldaki menüde **Android vitals**'ı bul; çökme ve ANR oranlarını orada gör.
        9. Commit'le: `git add .` ve `git commit -m "Add Crashlytics"`.
    code:
      - file: build.gradle.kts
        lang: kotlin
        text: |
          plugins {
              // ... the lines you already have stay as they are ...
              id("com.google.gms.google-services") version "4.5.0" apply false
              id("com.google.firebase.crashlytics") version "3.0.8" apply false
          }
      - file: app/build.gradle.kts
        lang: kotlin
        text: |
          plugins {
              // ... the lines you already have stay as they are ...
              id("com.google.gms.google-services")
              id("com.google.firebase.crashlytics")
          }

          dependencies {
              // ... the lines you already have stay as they are ...
              implementation(platform("com.google.firebase:firebase-bom:35.0.2"))
              implementation("com.google.firebase:firebase-crashlytics")
              implementation("com.google.firebase:firebase-analytics")
          }
      - file: app/src/main/java/dev/example/habits/ui/SettingsScreen.kt
        lang: kotlin
        text: |
          // TEMPORARY: put this inside the Column of SettingsScreen, then delete it after the test.
          Button(onClick = { throw RuntimeException("Test crash") }) {
              Text("Test crash")
          }
    mistakes:
      - problem:
          en: "No crash shows up in the Firebase console."
          tr: "Firebase konsolunda hiç çökme görünmüyor."
        fix:
          en: "The report is sent on the next start of the app, so open the app again after the crash, wait a few minutes, and check that `google-services.json` is in the `app` folder and its package name matches. Also run the app without the debugger attached."
          tr: "Rapor uygulamanın bir sonraki açılışında gönderilir; çökmeden sonra uygulamayı yeniden aç, birkaç dakika bekle ve `google-services.json` dosyasının `app` klasöründe olduğunu, paket adının uyduğunu kontrol et. Uygulamayı debugger bağlı olmadan çalıştır."
      - problem:
          en: "Stack traces full of names like `a.b.c` in a release build."
          tr: "Release build'de `a.b.c` gibi isimlerle dolu stack trace'ler."
        fix:
          en: "R8 renamed the code. The Crashlytics Gradle plugin uploads the mapping file when you build a release, so make sure the plugin is applied. Without it you cannot read the report."
          tr: "R8 kodu yeniden adlandırdı. Crashlytics Gradle eklentisi release derlediğinde mapping dosyasını yükler; eklentinin uygulandığından emin ol. Onsuz raporu okuyamazsın."
      - problem:
          en: "Forgetting to tell users that crash data is collected."
          tr: "Kullanıcılara çökme verisinin toplandığını söylemeyi unutmak."
        fix:
          en: "Mention it in your privacy policy, and declare it in the data safety form if you publish on Google Play."
          tr: "Gizlilik politikanda belirt ve Google Play'de yayınlıyorsan veri güvenliği formunda bildir."
    quiz:
      - q:
          en: "In a stack trace, which line do you look for first?"
          tr: "Bir stack trace'te ilk hangi satırı ararsın?"
        options:
          en:
            - "The last line"
            - "The first line that names your own package"
            - "Any line that mentions Android"
          tr:
            - "Son satırı"
            - "Kendi paketini adlandıran ilk satırı"
            - "Android'den bahseden herhangi bir satırı"
        answer: 1
        why:
          en: "Lines from libraries and the system are not where your bug is. The first line with your own package shows the code that was running."
          tr: "Kütüphanelerin ve sistemin satırlarında hatan yoktur. Kendi paketini taşıyan ilk satır çalışan kodu gösterir."
    sources:
      - title: Get started with Firebase Crashlytics on Android
        url: https://firebase.google.com/docs/crashlytics/android/get-started
      - title: Android vitals
        url: https://developer.android.com/topic/performance/vitals
      - title: Read and understand a stack trace
        url: https://developer.android.com/studio/debug/stacktraces

  - id: reminders
    stage: advanced
    title:
      en: "A daily reminder with WorkManager"
      tr: "WorkManager ile günlük hatırlatıcı"
    minutes: 90
    needs: [crash-reports]
    why:
      en: "A habit app is only useful if it nudges you. WorkManager is the official tool for work that must happen later, even if the app is closed or the phone restarts. A notification shows the nudge. Since Android 13 the user also has to allow notifications, so you ask politely."
      tr: "Bir alışkanlık uygulaması ancak seni dürtüyorsa işe yarar. WorkManager, uygulama kapalı olsa ya da telefon yeniden başlasa bile sonra yapılması gereken işler için resmi araçtır. Dürtmeyi bir bildirim gösterir. Android 13'ten beri kullanıcının bildirimlere de izin vermesi gerekir, o yüzden nazikçe izin istersin."
    learn:
      en: |
        - `CoroutineWorker`: your background job as a `suspend` function
        - `PeriodicWorkRequest` with an initial delay, and `enqueueUniquePeriodicWork` so you never schedule it twice
        - Android decides the real time to save battery: a reminder at 20:00 may arrive a little later
        - Notification channels, and the runtime permission `POST_NOTIFICATIONS` (Android 13 and newer)
        - A small pure function (`delayUntilNext`) that you can unit test
      tr: |
        - `CoroutineWorker`: arka plan işin bir `suspend` fonksiyon olarak
        - Başlangıç gecikmeli `PeriodicWorkRequest` ve onu iki kere planlamamak için `enqueueUniquePeriodicWork`
        - Gerçek zamanı pil tasarrufu için Android belirler: saat 20:00 hatırlatıcısı biraz geç gelebilir
        - Bildirim kanalları ve çalışma zamanı izni `POST_NOTIFICATIONS` (Android 13 ve sonrası)
        - Unit test edebileceğin küçük bir saf fonksiyon (`delayUntilNext`)
    do:
      en: |
        1. In `app/build.gradle.kts` add the WorkManager line. Sync.
        2. In `AndroidManifest.xml` add the `POST_NOTIFICATIONS` permission line next to the internet permission.
        3. Add the vector file `res/drawable/ic_stat_habit.xml` (the small check mark shown in the status bar), then the Kotlin files `reminder/ReminderTime.kt`, `reminder/Reminders.kt`, `reminder/ReminderWorker.kt` and `ui/ReminderSection.kt`.
        4. In `SettingsScreen.kt` add `ReminderSection()` inside the Column, below the token buttons.
        5. Add `ReminderTimeTest.kt` under `app/src/test/java/dev/example/habits/reminder/` and run it. It checks the three cases: before the hour, after the hour, and exactly on the hour.
        6. Run the app. Open settings, press **Send a test now** and allow notifications when asked. The notification appears within a few seconds if at least one habit is not done today. Tap it: the app opens.
        7. Press **Turn on** to schedule the evening reminder, and **Turn off** to cancel it.
        8. Commit: `git add .` and `git commit -m "Add a daily reminder"`.
      tr: |
        1. `app/build.gradle.kts` içine WorkManager satırını ekle. Sync yap.
        2. `AndroidManifest.xml` içinde internet izninin yanına `POST_NOTIFICATIONS` izin satırını ekle.
        3. `res/drawable/ic_stat_habit.xml` vektör dosyasını (durum çubuğunda görünen küçük onay işareti), sonra `reminder/ReminderTime.kt`, `reminder/Reminders.kt`, `reminder/ReminderWorker.kt` ve `ui/ReminderSection.kt` Kotlin dosyalarını ekle.
        4. `SettingsScreen.kt` içinde Column'un içine, token düğmelerinin altına `ReminderSection()` ekle.
        5. `ReminderTimeTest.kt`'i `app/src/test/java/dev/example/habits/reminder/` altına ekle ve çalıştır. Üç durumu kontrol eder: saatten önce, saatten sonra ve tam saatinde.
        6. Uygulamayı çalıştır. Ayarları aç, **Send a test now**'a bas ve sorulunca bildirimlere izin ver. Bugün yapılmamış en az bir alışkanlık varsa bildirim birkaç saniye içinde görünür. Ona dokun: uygulama açılır.
        7. Akşam hatırlatıcısını planlamak için **Turn on**'a, iptal etmek için **Turn off**'a bas.
        8. Commit'le: `git add .` ve `git commit -m "Add a daily reminder"`.
    code:
      - file: app/build.gradle.kts
        lang: kotlin
        text: |
          dependencies {
              // ... the lines you already have stay as they are ...
              implementation("androidx.work:work-runtime-ktx:2.12.0")
          }
      - file: app/src/main/AndroidManifest.xml
        lang: xml
        text: |
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
      - file: app/src/main/res/drawable/ic_stat_habit.xml
        lang: xml
        text: |
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M9,16.2L4.8,12l-1.4,1.4L9,19 21,7l-1.4,-1.4z" />
          </vector>
      - file: app/src/main/java/dev/example/habits/reminder/ReminderTime.kt
        lang: kotlin
        text: |
          package dev.example.habits.reminder

          import java.time.Duration
          import java.time.LocalDateTime

          /** How long to wait from now until the next time the clock shows [hour]:00. */
          fun delayUntilNext(now: LocalDateTime, hour: Int): Duration {
              var next = now.toLocalDate().atTime(hour, 0)
              if (!next.isAfter(now)) next = next.plusDays(1)
              return Duration.between(now, next)
          }
