  - id: hardening
    stage: security
    title:
      en: "Limits, a secret token and no unwrap on user input"
      tr: "Sınırlar, gizli bir token ve kullanıcı girdisinde unwrap yok"
    minutes: 60
    needs: [tests]
    why:
      en: "The moment your API is on the internet, anyone can send it anything: huge bodies, absurd numbers, a thousand requests. Security here means three habits: never trust input, put a limit on everything, and let only the right people change data."
      tr: "API'n internete çıktığı an herkes ona her şeyi gönderebilir: dev gövdeler, saçma sayılar, bin istek. Buradaki güvenlik üç alışkanlık demek: girdiye asla güvenme, her şeye bir sınır koy ve veriyi sadece doğru kişilerin değiştirmesine izin ver."
    learn:
      en: |
        - Limits: body size (`DefaultBodyLimit`), title length, page size (`limit` is clamped to 1..=100), and a request timeout
        - Authentication with a bearer token: reading is open, changing data needs `Authorization: Bearer <token>`, and the token comes from an environment variable, never from the code
        - Errors that reach the client must not leak details (paths, SQL); we send "internal error" and keep the details for the log
        - `unwrap()` on input the user controls is a bug: a panic stops that request. We make clippy forbid `unwrap_used` outside tests
        - `#![forbid(unsafe_code)]` guarantees our own code has no `unsafe` blocks
      tr: |
        - Sınırlar: gövde boyutu (`DefaultBodyLimit`), başlık uzunluğu, sayfa boyutu (`limit` 1..=100 arasına sıkıştırılır) ve istek zaman aşımı
        - Bearer token ile kimlik doğrulama: okumak açık, veri değiştirmek `Authorization: Bearer <token>` ister ve token koddan değil bir ortam değişkeninden gelir
        - İstemciye ulaşan hatalar ayrıntı sızdırmamalı (yollar, SQL); biz "internal error" gönderir, ayrıntıyı log için saklarız
        - Kullanıcının kontrol ettiği girdide `unwrap()` bir hatadır: panic o isteği durdurur. Testler dışında clippy'nin `unwrap_used`'u yasaklamasını sağlıyoruz
        - `#![forbid(unsafe_code)]` kendi kodumuzda hiç `unsafe` blok olmadığını garanti eder
    do:
      en: |
        1. Add the `tower-http` crate (for the timeout) with the command below.
        2. Add the `unwrap_used` lint to the end of `Cargo.toml`, and create `clippy.toml` (below). Now `cargo clippy` refuses `unwrap()` in the real code but allows it inside tests.
        3. Replace `src/error.rs` (new `Config` variant), `src/api.rs` (token check, limits, timeout), `src/main.rs` (the `serve` command needs a token) and `src/lib.rs` (`forbid(unsafe_code)`).
        4. Replace `tests/api.rs`. It now passes the token and has new tests: no token gives 401, a huge body gives 413, a too long title gives 400, and strange `limit` and `offset` values do not break anything. Note the first line: it allows `unwrap` in this test file, because helper functions outside `#[test]` are not seen as tests by clippy.
        5. Run `cargo test` and `cargo clippy --all-targets`. Both should pass without warnings.
        6. Start the server with a token and try the curl commands below. The token needs at least 8 characters; make a long random one with `openssl rand -hex 24` (or, without openssl, `python3 -c "import secrets; print(secrets.token_hex(24))"`). On Windows PowerShell set the variable with `$env:API_TOKEN="..."` instead of the first line.
        7. Commit: `git add .` and `git commit -m "Add limits and a token"`.
      tr: |
        1. Aşağıdaki komutla `tower-http` crate'ini ekle (zaman aşımı için).
        2. `Cargo.toml` sonuna `unwrap_used` lint'ini ekle ve `clippy.toml` dosyasını oluştur (aşağıda). Artık `cargo clippy` gerçek kodda `unwrap()`'ı reddeder ama testlerin içinde izin verir.
        3. `src/error.rs` (yeni `Config` varyantı), `src/api.rs` (token kontrolü, sınırlar, zaman aşımı), `src/main.rs` (`serve` komutu artık token ister) ve `src/lib.rs` (`forbid(unsafe_code)`) dosyalarını değiştir.
        4. `tests/api.rs` dosyasını değiştir. Artık token gönderiyor ve yeni testleri var: token yoksa 401, dev gövde 413, çok uzun başlık 400 döner ve garip `limit` ile `offset` değerleri hiçbir şeyi bozmaz. İlk satıra dikkat: bu test dosyasında `unwrap`'a izin verir, çünkü `#[test]` dışındaki yardımcı fonksiyonları clippy test olarak görmez.
        5. `cargo test` ve `cargo clippy --all-targets` çalıştır. İkisi de uyarısız geçmeli.
        6. Sunucuyu bir token ile başlat ve aşağıdaki curl komutlarını dene. Token en az 8 karakter olmalı; `openssl rand -hex 24` ile uzun, rastgele bir tane üret (openssl yoksa `python3 -c "import secrets; print(secrets.token_hex(24))"`). Windows PowerShell'de ilk satır yerine değişkeni `$env:API_TOKEN="..."` ile ayarla.
        7. Commit'le: `git add .` ve `git commit -m "Add limits and a token"`.
