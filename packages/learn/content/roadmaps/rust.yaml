id: rust
title: Rust
summary:
  en: "From an empty computer to your own small web API on the internet, written in Rust. You start with a command-line todo tool and grow it into an API step by step, and you understand why each step is there."
  tr: "Boş bir bilgisayardan internette yayında olan kendi küçük web API'ne, Rust ile. Komut satırında çalışan bir todo aracıyla başlarsın, onu adım adım bir API'ye dönüştürürsün ve her adımın neden orada olduğunu anlarsın."
teacher: backend
project:
  en: 'todo: first a command-line todo tool (add, list, finish and remove tasks, saved in a JSON file), then the same ideas as a small web API on SQLite with a secret token for changes, tests, a tiny Docker image, logs and health checks, deployed on Render''s free plan.'
  tr: 'todo: önce komut satırında çalışan bir yapılacaklar aracı (iş ekleme, listeleme, bitirme ve silme; JSON dosyasında saklanır), sonra aynı fikirler SQLite üzerinde küçük bir web API olarak: değişiklikler için gizli bir token, testler, küçücük bir Docker image''ı, loglar ve sağlık kontrolleri; Render''ın ücretsiz planında yayında.'
detect:
  files: [Cargo.toml]
after: [web]
version: "1.99"
latest: eol:rust
checked: 2026-10
sheets: [rust, git, http, sql, docker, github-actions]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Rust, a C compiler and an editor"
      tr: "Rust, bir C derleyicisi ve bir editör kurma"
    minutes: 45
    why:
      en: "Rust programs are built with `cargo`, which comes with Rust. Rust also needs a linker (a program that joins compiled pieces into one program), and the SQLite library we use later is compiled from C code, so a C compiler must be on your computer."
      tr: "Rust programları, Rust ile birlikte gelen `cargo` ile derlenir. Rust'ın ayrıca bir linker'a (derlenmiş parçaları tek bir programda birleştiren program) ihtiyacı var; ileride kullanacağımız SQLite kütüphanesi de C kodundan derlenir, bu yüzden bilgisayarında bir C derleyicisi olmalı."
    learn:
      en: |
        - What `rustup` (installs and updates Rust), `rustc` (the compiler) and `cargo` (build tool and package manager) are
        - What a linker and a C compiler are for, and how to get one on your system
        - How to check that everything works from a terminal
      tr: |
        - `rustup` (Rust'ı kurar ve günceller), `rustc` (derleyici) ve `cargo`'nun (build aracı ve paket yöneticisi) ne olduğu
        - Linker ve C derleyicisinin ne işe yaradığı ve sisteminde nasıl edinileceği
        - Her şeyin çalıştığını terminalden nasıl kontrol edeceğin
    do:
      en: |
        1. Install Rust with **rustup** from rust-lang.org/tools/install. On macOS and Linux run the first command below in a terminal and press Enter to accept the default (option 1). On Windows download and run `rustup-init.exe`; it asks you to install the **Microsoft C++ Build Tools**, which is the C compiler and linker, so say yes.
        2. On macOS run `xcode-select --install`. On Ubuntu or Debian run `sudo apt install build-essential`. On other Linux systems install `gcc` with your package manager. (Windows is already done in step 1.)
        3. Close the terminal and open a new one, so it sees the new programs. Run the version commands below. Each should print a version number (`cc --version` is for macOS and Linux).
        4. Install **Visual Studio Code** (code.visualstudio.com) and its **rust-analyzer** extension; it shows errors while you type. Install **Git** (git-scm.com) too.
        5. Rust gets a new version every six weeks. To update later, run `rustup update`.
      tr: |
        1. rust-lang.org/tools/install adresinden **rustup** ile Rust'ı kur. macOS ve Linux'ta aşağıdaki ilk komutu terminalde çalıştır, varsayılanı kabul etmek için Enter'a bas (1. seçenek). Windows'ta `rustup-init.exe` dosyasını indirip çalıştır; senden **Microsoft C++ Build Tools** kurmanı ister, bu C derleyicisi ve linker'dır, evet de.
        2. macOS'ta `xcode-select --install` çalıştır. Ubuntu ya da Debian'da `sudo apt install build-essential` çalıştır. Diğer Linux sistemlerinde paket yöneticinle `gcc` kur. (Windows 1. adımda zaten tamam.)
        3. Terminali kapatıp yenisini aç ki yeni programları görsün. Aşağıdaki sürüm komutlarını çalıştır. Her biri bir sürüm numarası yazmalı (`cc --version` macOS ve Linux içindir).
        4. **Visual Studio Code**'u (code.visualstudio.com) ve **rust-analyzer** eklentisini kur; yazarken hataları gösterir. **Git**'i de kur (git-scm.com).
        5. Rust her altı haftada bir yeni sürüm alır. Sonradan güncellemek için `rustup update` çalıştır.
    code:
      - file: "terminal"
        lang: sh
        text: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
      - file: "terminal"
        lang: sh
        text: |
          rustc --version
          cargo --version
          git --version
          cc --version
    mistakes:
      - problem:
          en: "Building says: linker `cc` not found (or `link.exe` not found on Windows)."
          tr: "Derleme şunu söylüyor: linker `cc` not found (Windows'ta `link.exe` not found)."
        fix:
          en: "The C compiler and linker are missing. Install build-essential (Ubuntu), the Xcode command line tools (macOS) or the Microsoft C++ Build Tools (Windows), then open a new terminal."
          tr: "C derleyicisi ve linker eksik. build-essential (Ubuntu), Xcode komut satırı araçları (macOS) ya da Microsoft C++ Build Tools (Windows) kur, sonra yeni bir terminal aç."
      - problem:
          en: "`cargo: command not found` right after installing."
          tr: "Kurduktan hemen sonra `cargo: command not found`."
        fix:
          en: "rustup puts the tools in `~/.cargo/bin` and adds it to your PATH for new terminals. Close and reopen the terminal. On Linux or macOS you can also run `source ~/.cargo/env`."
          tr: "rustup araçları `~/.cargo/bin` klasörüne koyar ve yeni terminaller için PATH'e ekler. Terminali kapatıp yeniden aç. Linux ya da macOS'ta `source ~/.cargo/env` de çalıştırabilirsin."
      - problem:
          en: "cargo says: feature `edition2024` is required."
          tr: "cargo şunu söylüyor: feature `edition2024` is required."
        fix:
          en: "The Rust from your system's package manager is too old. Edition 2024 needs Rust 1.85 or newer. Install Rust with rustup instead, or run `rustup update`."
          tr: "Sistemindeki paket yöneticisinden gelen Rust çok eski. 2024 edition için Rust 1.85 ya da daha yenisi gerekir. Rust'ı rustup ile kur ya da `rustup update` çalıştır."
    quiz:
      - q:
          en: "What is `cargo` for?"
          tr: "`cargo` ne işe yarar?"
        options:
          en:
            - "It builds, runs and tests your project and downloads libraries (crates) for it"
            - "It only formats your code"
            - "It is the editor you write Rust in"
          tr:
            - "Projeni derler, çalıştırır, test eder ve ona kütüphaneleri (crate) indirir"
            - "Sadece kodunu biçimlendirir"
            - "Rust yazdığın editördür"
        answer: 0
        why:
          en: "Cargo is Rust's build tool and package manager. You will use `cargo new`, `cargo run`, `cargo add` and `cargo test` all the time."
          tr: "Cargo, Rust'ın build aracı ve paket yöneticisidir. `cargo new`, `cargo run`, `cargo add` ve `cargo test` komutlarını sürekli kullanacaksın."
    sources:
      - title: "Rust, install Rust"
        url: https://www.rust-lang.org/tools/install
      - title: "The Rust Book, installation"
        url: https://doc.rust-lang.org/book/ch01-01-installation.html

  - id: hello-cargo
    stage: first-code
    title:
      en: "Create your first project with cargo"
      tr: "cargo ile ilk projeni oluşturma"
    minutes: 30
    needs: [setup]
    why:
      en: "A Rust project is more than one file: it has a `Cargo.toml` that lists its name and libraries. `cargo new` makes all of it, and `cargo run` builds and starts the program, so you can see the result of every change."
      tr: "Bir Rust projesi tek dosyadan fazlasıdır: adını ve kütüphanelerini listeleyen bir `Cargo.toml` dosyası vardır. `cargo new` hepsini oluşturur, `cargo run` da programı derleyip başlatır; böylece her değişikliğin sonucunu görürsün."
    learn:
      en: |
        - What is in a new project: `Cargo.toml`, `src/main.rs`, and the `target` folder that appears after a build
        - The difference between `cargo run`, `cargo check` and `cargo build`
        - Rust is compiled: the compiler checks your code first, and its error messages are very helpful, so read them
      tr: |
        - Yeni bir projede neler olduğu: `Cargo.toml`, `src/main.rs` ve build'den sonra beliren `target` klasörü
        - `cargo run`, `cargo check` ve `cargo build` arasındaki fark
        - Rust derlenen bir dildir: derleyici önce kodunu kontrol eder ve hata mesajları çok yardımcıdır, o yüzden onları oku
    do:
      en: |
        1. In the terminal, go to the folder where you keep projects and run `cargo new todo`. It creates a folder `todo` with a Git repository already inside.
        2. Go into it with `cd todo` and open the folder in VS Code (`code .`). Look at `Cargo.toml` and `src/main.rs`.
        3. Run `cargo run`. The first time it compiles, then it prints `Hello, world!`. Run it again: it does not compile again, because nothing changed.
        4. Change the text in `src/main.rs` to the code below and run `cargo run` again.
        5. Try `cargo check`. It checks that the code compiles without making the program, so it is faster. Then run `cargo fmt` (formats your code) and `cargo clippy` (points out common mistakes).
        6. Save this first version: `git add .` then `git commit -m "Start the todo tool"`. The `.gitignore` that cargo made already keeps the big `target` folder out.
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git ve `cargo new todo` çalıştır. İçinde hazır bir Git deposu olan `todo` klasörünü oluşturur.
        2. `cd todo` ile içine gir ve klasörü VS Code'da aç (`code .`). `Cargo.toml` ve `src/main.rs` dosyalarına bak.
        3. `cargo run` çalıştır. İlk seferde derler, sonra `Hello, world!` yazar. Tekrar çalıştır: bir şey değişmediği için yeniden derlemez.
        4. `src/main.rs` içindeki metni aşağıdaki kodla değiştir ve `cargo run`'ı tekrar çalıştır.
        5. `cargo check` dene. Programı üretmeden kodun derlendiğini kontrol eder, bu yüzden daha hızlıdır. Sonra `cargo fmt` (kodunu biçimlendirir) ve `cargo clippy` (yaygın hataları gösterir) çalıştır.
        6. Bu ilk sürümü kaydet: `git add .` sonra `git commit -m "Start the todo tool"`. cargo'nun yaptığı `.gitignore` büyük `target` klasörünü zaten dışarıda tutar.
    code:
      - file: "terminal"
        lang: sh
        text: |
          cargo new todo
          cd todo
          cargo run
          cargo check
          cargo fmt
          cargo clippy
      - file: "src/main.rs"
        lang: rust
        text: |
          fn main() {
              println!("Hello, todo!");
          }
    mistakes:
      - problem:
          en: "`cargo run` says: could not find `Cargo.toml` in the current directory or any parent."
          tr: "`cargo run` şunu söylüyor: could not find `Cargo.toml` in the current directory or any parent."
        fix:
          en: "You are in the wrong folder. Run `cd todo` first. cargo commands work inside the project folder."
          tr: "Yanlış klasördesin. Önce `cd todo` çalıştır. cargo komutları proje klasörünün içinde çalışır."
      - problem:
          en: "Measuring how fast the program is with `cargo run`."
          tr: "Programın ne kadar hızlı olduğunu `cargo run` ile ölçmek."
        fix:
          en: "`cargo run` makes a debug build, which is made for quick compiling and good errors, not speed. Use `cargo run --release` for real timings (we do this in the performance step)."
          tr: "`cargo run` debug build yapar; bu build hızlı derleme ve iyi hatalar içindir, hız için değil. Gerçek süreler için `cargo run --release` kullan (bunu performans adımında yapacağız)."
    quiz:
      - q:
          en: "Which command checks that your code compiles without building the final program?"
          tr: "Hangi komut, son programı üretmeden kodunun derlendiğini kontrol eder?"
        options:
          en: ["cargo check", "cargo fmt", "cargo new"]
          tr: ["cargo check", "cargo fmt", "cargo new"]
        answer: 0
        why:
          en: "`cargo check` stops after the compiler's checks, so it is faster than `cargo build`. `cargo fmt` only formats and `cargo new` makes a new project."
          tr: "`cargo check` derleyicinin kontrollerinden sonra durur, bu yüzden `cargo build`'den hızlıdır. `cargo fmt` sadece biçimlendirir, `cargo new` yeni proje oluşturur."
    sources:
      - title: "The Rust Book, hello cargo"
        url: https://doc.rust-lang.org/book/ch01-03-hello-cargo.html
      - title: "The Cargo Book, package layout"
        url: https://doc.rust-lang.org/cargo/guide/project-layout.html
      - title: "The Cargo Book, cargo check"
        url: https://doc.rust-lang.org/cargo/commands/cargo-check.html

  - id: model
    stage: basics
    title:
      en: "Model the tasks: structs, enums, ownership and borrowing"
      tr: "Görevleri modelleme: struct, enum, sahiplik ve ödünç alma"
    minutes: 60
    needs: [hello-cargo]
    why:
      en: "Rust has no garbage collector. Instead every value has exactly one owner, and the compiler checks at build time who owns and who only borrows. This is the idea that makes Rust fast and safe, and the sooner you meet it, the easier it gets. We learn it by writing the heart of the todo tool: a `Task`, a `TaskList` and the filters."
      tr: "Rust'ta garbage collector yoktur. Onun yerine her değerin tam olarak bir sahibi vardır ve derleyici kimin sahip, kimin sadece ödünç aldığını derleme anında kontrol eder. Rust'ı hızlı ve güvenli yapan fikir budur; ne kadar erken tanışırsan o kadar kolaylaşır. Bunu todo aracının kalbini yazarak öğreniyoruz: bir `Task`, bir `TaskList` ve filtreler."
    learn:
      en: |
        - A `struct` groups named fields, and an `impl` block gives it methods
        - An `enum` is one of several variants, and `match` must handle every variant
        - Ownership: assigning a `String` to another variable moves it, and the old name stops working
        - Borrowing: `&x` lends a value to read it, `&mut x` lends it to change it. You can have many readers or one writer at a time
        - `String` owns its text, `&str` only borrows a view of text; take `&str` in functions that only read
      tr: |
        - `struct` adlandırılmış alanları toplar, `impl` bloğu ona metotlar verir
        - `enum` birkaç varyanttan biridir ve `match` her varyantı ele almak zorundadır
        - Sahiplik: bir `String`'i başka değişkene atamak onu taşır (move) ve eski ad çalışmaz olur
        - Ödünç alma: `&x` değeri okumak için, `&mut x` değiştirmek için ödünç verir. Aynı anda birçok okuyucu ya da tek bir yazıcı olabilir
        - `String` metnin sahibidir, `&str` sadece bir metin görünümünü ödünç alır; sadece okuyan fonksiyonlarda `&str` al
    do:
      en: |
        1. Create `src/lib.rs` and `src/model.rs` with the code below. `lib.rs` makes the project a library as well, so other files (and later our tests) can use the model. `main.rs` will use it with `use todo::model::...`.
        2. Replace `src/main.rs` with the small demo below and run `cargo run`. You should see two tasks, the second one marked `[x]`.
        3. Read `model.rs` slowly. Find: where a `&str` is borrowed and a `String` is created (`add`), where `&self` only reads (`list`), where `&mut self` changes (`mark_done`), and the `match` on `Filter`.
        4. Experiment, then undo it. Put the lines from the experiment below into `main` and run `cargo run`. The compiler refuses and explains. Read the message: it names the line where the value moved.
        5. Commit: `git add .` and `git commit -m "Add the task model"`.
      tr: |
        1. Aşağıdaki kodla `src/lib.rs` ve `src/model.rs` dosyalarını oluştur. `lib.rs` projeyi aynı zamanda bir kütüphane yapar, böylece diğer dosyalar (ve ileride testlerimiz) modeli kullanabilir. `main.rs` onu `use todo::model::...` ile kullanacak.
        2. `src/main.rs` içeriğini aşağıdaki küçük demoyla değiştir ve `cargo run` çalıştır. İkincisi `[x]` işaretli iki görev görmelisin.
        3. `model.rs` dosyasını yavaşça oku. Şunları bul: `&str`'ın ödünç alınıp `String` oluşturulduğu yer (`add`), `&self`'in sadece okuduğu yer (`list`), `&mut self`'in değiştirdiği yer (`mark_done`) ve `Filter` üzerindeki `match`.
        4. Deney yap, sonra geri al. Aşağıdaki deney satırlarını `main`'e koy ve `cargo run` çalıştır. Derleyici reddeder ve açıklar. Mesajı oku: değerin hangi satırda taşındığını söyler.
        5. Commit'le: `git add .` ve `git commit -m "Add the task model"`.
    code:
      - file: "src/lib.rs"
        lang: rust
        text: |
          pub mod model;
      - file: "src/model.rs"
        lang: rust
        text: |
          /// One thing to do.
          #[derive(Debug, Clone, PartialEq)]
          pub struct Task {
              pub id: i64,
              pub title: String,
              pub done: bool,
          }

          /// Which tasks to show.
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]
          pub enum Filter {
              #[default]
              All,
              Open,
              Done,
          }

          /// All tasks, plus the number the next task will get.
          #[derive(Debug, Default)]
          pub struct TaskList {
              tasks: Vec<Task>,
              next_id: i64,
          }

          impl TaskList {
              pub fn new() -> Self {
                  Self::default()
              }

              /// Borrows the title (&str) and makes the Task own its own copy (String).
              pub fn add(&mut self, title: &str) -> i64 {
                  self.next_id += 1;
                  self.tasks.push(Task {
                      id: self.next_id,
                      title: title.trim().to_string(),
                      done: false,
                  });
                  self.next_id
              }

              /// Lends out the tasks that match; nothing is copied or moved.
              pub fn list(&self, filter: Filter) -> Vec<&Task> {
                  self.tasks
                      .iter()
                      .filter(|t| match filter {
                          Filter::All => true,
                          Filter::Open => !t.done,
                          Filter::Done => t.done,
                      })
                      .collect()
              }

              /// Returns true when a task with this id existed.
              pub fn mark_done(&mut self, id: i64) -> bool {
                  match self.tasks.iter_mut().find(|t| t.id == id) {
                      Some(task) => {
                          task.done = true;
                          true
                      }
                      None => false,
                  }
              }

              /// Returns true when a task with this id existed.
              pub fn remove(&mut self, id: i64) -> bool {
                  let before = self.tasks.len();
                  self.tasks.retain(|t| t.id != id);
                  self.tasks.len() != before
              }
          }
      - file: "src/main.rs"
        lang: rust
        text: |
          use todo::model::{Filter, TaskList};

          fn main() {
              let mut list = TaskList::new();
              list.add("Learn ownership");
              let id = list.add("Write the CLI");
              list.mark_done(id);

              for task in list.list(Filter::All) {
                  let mark = if task.done { "x" } else { " " };
                  println!("[{mark}] {} {}", task.id, task.title);
              }
          }
      - file: "src/main.rs (experiment: this does not compile, undo it afterwards)"
        lang: rust
        text: |
          let a = String::from("hi");
          let b = a; // the String moves to b
          println!("{a} {b}"); // error[E0382]: borrow of moved value: `a`
    mistakes:
      - problem:
          en: "error[E0382]: borrow of moved value."
          tr: "error[E0382]: borrow of moved value."
        fix:
          en: "You used a value after giving it away. Pass a reference (`&value`) when the function only needs to read, or call `.clone()` when you really need a second copy."
          tr: "Bir değeri başkasına verdikten sonra kullandın. Fonksiyon sadece okuyacaksa referans (`&value`) ver; gerçekten ikinci bir kopya gerekiyorsa `.clone()` çağır."
      - problem:
          en: "Calling `.clone()` everywhere to make the compiler quiet."
          tr: "Derleyici sussun diye her yerde `.clone()` çağırmak."
        fix:
          en: "Cloning copies data and hides the real question: who should own this? Borrow with `&` first, and clone only when you need an independent copy."
          tr: "Clone veriyi kopyalar ve asıl soruyu gizler: bu değerin sahibi kim olmalı? Önce `&` ile ödünç ver, sadece bağımsız bir kopya gerektiğinde clone'la."
      - problem:
          en: "Adding `_ => {}` to every `match` to silence the compiler."
          tr: "Derleyiciyi susturmak için her `match`'e `_ => {}` eklemek."
        fix:
          en: "Then the compiler cannot warn you when you add a new variant later. List every variant instead, as `list` does with `Filter`."
          tr: "O zaman sonradan yeni bir varyant eklediğinde derleyici seni uyaramaz. Bunun yerine `list`'in `Filter` ile yaptığı gibi her varyantı yaz."
    quiz:
      - q:
          en: "A function only needs to read some text. Which parameter type is best?"
          tr: "Bir fonksiyon sadece bir metni okuyacak. Hangi parametre tipi en iyisi?"
        options:
          en: ["&str", "String", "&mut String"]
          tr: ["&str", "String", "&mut String"]
        answer: 0
        why:
          en: "`&str` only borrows the text, and both a `String` (as `&s`) and a text literal can be passed. `String` would take ownership and `&mut String` allows changes you do not need."
          tr: "`&str` metni sadece ödünç alır ve hem `String` (`&s` olarak) hem de metin literali verilebilir. `String` sahipliği alırdı, `&mut String` ise ihtiyacın olmayan değişikliklere izin verirdi."
    sources:
      - title: "The Rust Book, what is ownership"
        url: https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html
      - title: "The Rust Book, references and borrowing"
        url: https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html
      - title: "The Rust Book, enums and match"
        url: https://doc.rust-lang.org/book/ch06-02-match.html

  - id: errors
    stage: basics
    title:
      en: "Handle errors with Result and ?"
      tr: "Result ve ? ile hataları yönetme"
    minutes: 45
    needs: [model]
    why:
      en: "Things go wrong: an empty title, an id that does not exist, a missing file. Rust has no exceptions. A function that can fail returns a `Result`, and the compiler forces you to deal with it. Handling errors well now means the program never crashes on bad input later."
      tr: "İşler ters gider: boş bir başlık, var olmayan bir id, eksik bir dosya. Rust'ta exception yoktur. Başarısız olabilen bir fonksiyon `Result` döner ve derleyici seni onunla ilgilenmeye zorlar. Hataları şimdi iyi yönetmek, programın ileride kötü girdide asla çökmemesi demektir."
    learn:
      en: |
        - `Result<T, E>` is either `Ok(value)` or `Err(error)`
        - The `?` operator gives you the value, or returns the error to the caller at once
        - Your own error `enum` (with `Display`) lets callers react to the kind of failure
        - Validate input in one place (`clean_title`), so every way into the program is checked
        - Why `unwrap()` on user input is a bug: it panics, which stops the program
      tr: |
        - `Result<T, E>` ya `Ok(değer)` ya da `Err(hata)`'dır
        - `?` operatörü sana değeri verir ya da hatayı hemen çağırana döner
        - Kendi hata `enum`'ın (`Display` ile) çağıranın hata türüne göre davranmasını sağlar
        - Girdiyi tek bir yerde doğrula (`clean_title`); programa giren her yol kontrol edilir
        - Kullanıcı girdisinde `unwrap()` neden hatadır: panic verir, bu da programı durdurur
    do:
      en: |
        1. Create `src/error.rs` and add `pub mod error;` to `src/lib.rs` (both below).
        2. Replace `src/model.rs`. Notice: `clean_title` trims and checks a title, `add` returns `Result<i64, TodoError>`, and `mark_done` and `remove` return `Result<(), TodoError>` instead of a `bool`.
        3. Replace `src/main.rs`. `main` calls `run`, and prints the error if there is one. `run` uses `?` after each call.
        4. Run `cargo run`. The two tasks print, then the program ends with `error: no task with id 99`, because the last line asks for a task that does not exist. Check the exit code: `echo $?` on macOS and Linux (`echo $LASTEXITCODE` in PowerShell). It is `1`.
        5. Commit: `git add .` and `git commit -m "Return errors with Result"`.
      tr: |
        1. `src/error.rs` dosyasını oluştur ve `src/lib.rs` içine `pub mod error;` ekle (ikisi de aşağıda).
        2. `src/model.rs` dosyasını değiştir. Dikkat: `clean_title` bir başlığı kırpar ve kontrol eder, `add` `Result<i64, TodoError>` döner, `mark_done` ve `remove` ise `bool` yerine `Result<(), TodoError>` döner.
        3. `src/main.rs` dosyasını değiştir. `main`, `run`'ı çağırır ve hata varsa yazdırır. `run` her çağrıdan sonra `?` kullanır.
        4. `cargo run` çalıştır. İki görev yazılır, sonra program `error: no task with id 99` ile biter; çünkü son satır var olmayan bir görev ister. Çıkış kodunu kontrol et: macOS ve Linux'ta `echo $?` (PowerShell'de `echo $LASTEXITCODE`). Değeri `1`'dir.
        5. Commit'le: `git add .` ve `git commit -m "Return errors with Result"`.
    code:
      - file: "src/lib.rs"
        lang: rust
        text: |
          pub mod error;
          pub mod model;
      - file: "src/error.rs"
        lang: rust
        text: |
          use std::fmt;

          /// Everything that can go wrong in the todo tool.
          #[derive(Debug)]
          pub enum TodoError {
              EmptyTitle,
              TitleTooLong { max: usize },
              NotFound(i64),
          }

          impl fmt::Display for TodoError {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  match self {
                      TodoError::EmptyTitle => write!(f, "the title is empty"),
                      TodoError::TitleTooLong { max } => {
                          write!(f, "the title is longer than {max} characters")
                      }
                      TodoError::NotFound(id) => write!(f, "no task with id {id}"),
                  }
              }
          }

          impl std::error::Error for TodoError {}
      - file: "src/model.rs"
        lang: rust
        text: |
          use crate::error::TodoError;

          /// The longest title we accept, counted in characters.
          pub const MAX_TITLE_CHARS: usize = 200;

          /// One thing to do.
          #[derive(Debug, Clone, PartialEq)]
          pub struct Task {
              pub id: i64,
              pub title: String,
              pub done: bool,
          }

          /// Which tasks to show.
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]
          pub enum Filter {
              #[default]
              All,
              Open,
              Done,
          }

          /// All tasks, plus the number the next task will get.
          #[derive(Debug, Default)]
          pub struct TaskList {
              tasks: Vec<Task>,
              next_id: i64,
          }

          /// Trims a title and checks it. Every way into the program goes through this.
          pub fn clean_title(title: &str) -> Result<String, TodoError> {
              let title = title.trim();
              if title.is_empty() {
                  return Err(TodoError::EmptyTitle);
              }
              if title.chars().count() > MAX_TITLE_CHARS {
                  return Err(TodoError::TitleTooLong {
                      max: MAX_TITLE_CHARS,
                  });
              }
              Ok(title.to_string())
          }

          impl TaskList {
              pub fn new() -> Self {
                  Self::default()
              }

              /// Borrows the title (&str) and makes the Task own its own copy (String).
              pub fn add(&mut self, title: &str) -> Result<i64, TodoError> {
                  let title = clean_title(title)?;
                  self.next_id += 1;
                  self.tasks.push(Task {
                      id: self.next_id,
                      title,
                      done: false,
                  });
                  Ok(self.next_id)
              }

              /// Lends out the tasks that match; nothing is copied or moved.
              pub fn list(&self, filter: Filter) -> Vec<&Task> {
                  self.tasks
                      .iter()
                      .filter(|t| match filter {
                          Filter::All => true,
                          Filter::Open => !t.done,
                          Filter::Done => t.done,
                      })
                      .collect()
              }

              pub fn mark_done(&mut self, id: i64) -> Result<(), TodoError> {
                  let task = self
                      .tasks
                      .iter_mut()
                      .find(|t| t.id == id)
                      .ok_or(TodoError::NotFound(id))?;
                  task.done = true;
                  Ok(())
              }

              pub fn remove(&mut self, id: i64) -> Result<(), TodoError> {
                  let before = self.tasks.len();
                  self.tasks.retain(|t| t.id != id);
                  if self.tasks.len() == before {
                      return Err(TodoError::NotFound(id));
                  }
                  Ok(())
              }
          }
      - file: "src/main.rs"
        lang: rust
        text: |
          use todo::error::TodoError;
          use todo::model::{Filter, TaskList};

          fn main() {
              if let Err(e) = run() {
                  eprintln!("error: {e}");
                  std::process::exit(1);
              }
          }

          fn run() -> Result<(), TodoError> {
              let mut list = TaskList::new();
              list.add("Learn ownership")?;
              let id = list.add("Write the CLI")?;
              list.mark_done(id)?;

              for task in list.list(Filter::All) {
                  let mark = if task.done { "x" } else { " " };
                  println!("[{mark}] {} {}", task.id, task.title);
              }

              list.mark_done(99)?; // there is no task 99
              Ok(())
          }
    mistakes:
      - problem:
          en: "error: the `?` operator can only be used in a function that returns `Result` or `Option`."
          tr: "error: the `?` operator can only be used in a function that returns `Result` or `Option`."
        fix:
          en: "`?` returns the error from the current function, so that function must return a `Result`. Change `fn main()` to call a `run()` that returns `Result`, as shown."
          tr: "`?` hatayı bulunduğu fonksiyondan döndürür, bu yüzden o fonksiyon `Result` dönmeli. Gösterildiği gibi `fn main()` içinde `Result` dönen bir `run()` çağır."
      - problem:
          en: "Writing `.unwrap()` to get past an error."
          tr: "Hatayı geçmek için `.unwrap()` yazmak."
        fix:
          en: "`unwrap()` panics when the value is an error, and a panic stops the program. Use `?`, `match` or `unwrap_or`. Keep `expect(\"reason\")` for things that can only fail because of a bug in your own code."
          tr: "`unwrap()` değer hata olduğunda panic verir ve panic programı durdurur. `?`, `match` ya da `unwrap_or` kullan. `expect(\"neden\")` sadece kendi kodundaki bir hata yüzünden başarısız olabilecek durumlar için kalsın."
      - problem:
          en: "Counting the title length with `.len()`."
          tr: "Başlık uzunluğunu `.len()` ile saymak."
        fix:
          en: "`.len()` counts bytes, and a letter like `ç` takes two. Use `.chars().count()` to count characters, as `clean_title` does."
          tr: "`.len()` byte sayar ve `ç` gibi bir harf iki byte tutar. `clean_title`'ın yaptığı gibi karakter saymak için `.chars().count()` kullan."
    quiz:
      - q:
          en: "What does `?` do when the `Result` it is applied to is an `Err`?"
          tr: "`?` uygulandığı `Result` bir `Err` ise ne yapar?"
        options:
          en:
            - "It returns that error from the current function at once"
            - "It ignores the error and continues"
            - "It panics and stops the program"
          tr:
            - "O hatayı bulunduğu fonksiyondan hemen döndürür"
            - "Hatayı yok sayıp devam eder"
            - "Panic verip programı durdurur"
        answer: 0
        why:
          en: "On `Ok(value)` the `?` gives you the value; on `Err(e)` the function returns `Err(e)` (converted with `From` if needed). Only `unwrap` and `expect` panic."
          tr: "`Ok(değer)` olduğunda `?` sana değeri verir; `Err(e)` olduğunda fonksiyon `Err(e)` döner (gerekirse `From` ile çevrilir). Sadece `unwrap` ve `expect` panic verir."
    sources:
      - title: "The Rust Book, recoverable errors with Result"
        url: https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html
      - title: "The Rust Book, to panic or not to panic"
        url: https://doc.rust-lang.org/book/ch09-03-to-panic-or-not-to-panic.html

  - id: json-store
    stage: first-project
    title:
      en: "Keep tasks in a JSON file with serde"
      tr: "serde ile görevleri bir JSON dosyasında saklama"
    minutes: 45
    needs: [errors]
    why:
      en: "Right now the tasks vanish when the program ends. A JSON file is the simplest way to keep them. serde is the Rust library that turns structs into JSON and back, and it checks the data for you."
      tr: "Şu an görevler program bitince kayboluyor. JSON dosyası onları saklamanın en basit yolu. serde, struct'ları JSON'a ve geri çeviren Rust kütüphanesidir ve veriyi senin için kontrol eder."
    learn:
      en: |
        - A crate is a Rust library; `cargo add` puts one in `Cargo.toml`, and `Cargo.lock` records the exact versions
        - `#[derive(Serialize, Deserialize)]` writes the conversion code for you
        - Why we write to a temporary file and then rename it: a crash can never leave a half-written file
        - `From` implementations let `?` turn an `io::Error` or a JSON error into our `TodoError`
      tr: |
        - Crate bir Rust kütüphanesidir; `cargo add` onu `Cargo.toml`'a ekler, `Cargo.lock` da tam sürümleri kaydeder
        - `#[derive(Serialize, Deserialize)]` dönüştürme kodunu senin yerine yazar
        - Neden önce geçici bir dosyaya yazıp sonra yeniden adlandırıyoruz: bir çökme asla yarım yazılmış dosya bırakamaz
        - `From` uygulamaları, `?`'in bir `io::Error` ya da JSON hatasını `TodoError`'a çevirmesini sağlar
    do:
      en: |
        1. Add the two crates with the commands below. Open `Cargo.toml` and see them under `[dependencies]`.
        2. Replace `src/error.rs` and `src/model.rs`, create `src/store.rs`, and add `pub mod store;` to `src/lib.rs`. In `model.rs` the only changes are the serde import and the derives on `Task` and `TaskList`.
        3. Replace `src/main.rs` with the small demo and run `cargo run` twice. The second run shows two tasks: the file kept the first one.
        4. Open the new `todo.json` and read it. Then break it on purpose (write `{oops` into it) and run again: you get a clear `error:` line, not a crash.
        5. Add the lines below to `.gitignore` so your own data file is not committed. Commit the code, including `Cargo.lock`.
      tr: |
        1. Aşağıdaki komutlarla iki crate'i ekle. `Cargo.toml`'u aç ve `[dependencies]` altında gör.
        2. `src/error.rs` ve `src/model.rs` dosyalarını değiştir, `src/store.rs` dosyasını oluştur ve `src/lib.rs` içine `pub mod store;` ekle. `model.rs` içindeki tek değişiklikler serde import'u ve `Task` ile `TaskList` üzerindeki derive'lar.
        3. `src/main.rs` dosyasını küçük demoyla değiştir ve `cargo run`'ı iki kez çalıştır. İkinci çalıştırma iki görev gösterir: dosya ilkini saklamış.
        4. Yeni oluşan `todo.json` dosyasını aç ve oku. Sonra bilerek boz (içine `{oops` yaz) ve tekrar çalıştır: çökme değil, anlaşılır bir `error:` satırı alırsın.
        5. Kendi veri dosyan commit'lenmesin diye aşağıdaki satırları `.gitignore`'a ekle. Kodu `Cargo.lock` dahil commit'le.
    code:
      - file: "terminal"
        lang: sh
        text: |
          cargo add serde --features derive
          cargo add serde_json
      - file: "src/lib.rs"
        lang: rust
        text: |
          pub mod error;
          pub mod model;
          pub mod store;
      - file: "src/error.rs"
        lang: rust
        text: |
          use std::fmt;
          use std::io;

          /// Everything that can go wrong in the todo tool.
          #[derive(Debug)]
          pub enum TodoError {
              EmptyTitle,
              TitleTooLong { max: usize },
              NotFound(i64),
              Io(io::Error),
              Json(serde_json::Error),
          }

          impl fmt::Display for TodoError {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  match self {
                      TodoError::EmptyTitle => write!(f, "the title is empty"),
                      TodoError::TitleTooLong { max } => {
                          write!(f, "the title is longer than {max} characters")
                      }
                      TodoError::NotFound(id) => write!(f, "no task with id {id}"),
                      TodoError::Io(e) => write!(f, "file problem: {e}"),
                      TodoError::Json(e) => write!(f, "the data file is not valid JSON: {e}"),
                  }
              }
          }

          impl std::error::Error for TodoError {}

          // These two let `?` turn an io::Error or a serde_json::Error into a TodoError.
          impl From<io::Error> for TodoError {
              fn from(e: io::Error) -> Self {
                  TodoError::Io(e)
              }
          }

          impl From<serde_json::Error> for TodoError {
              fn from(e: serde_json::Error) -> Self {
                  TodoError::Json(e)
              }
          }
