          en: "Tests run in parallel, so they must not share a file or a database. Give each test its own `tempfile::tempdir()` or `Db::open_in_memory()`."
          tr: "Testler paralel çalışır, bu yüzden bir dosyayı ya da veritabanını paylaşmamalı. Her teste kendi `tempfile::tempdir()` ya da `Db::open_in_memory()` değerini ver."
      - problem:
          en: "error[E0432]: unresolved import `todo::...` in a file under `tests/`."
          tr: "`tests/` altındaki bir dosyada error[E0432]: unresolved import `todo::...`."
        fix:
          en: "Integration tests can only use the library (`src/lib.rs` and its modules, items marked `pub`). Code that lives only in `main.rs` cannot be imported, so keep logic in the library and keep `main.rs` thin."
          tr: "Entegrasyon testleri sadece kütüphaneyi kullanabilir (`src/lib.rs` ve modülleri, `pub` işaretli öğeler). Sadece `main.rs` içinde yaşayan kod import edilemez; bu yüzden mantığı kütüphanede tut, `main.rs`'i ince bırak."
    quiz:
      - q:
          en: "Why do the API tests use `Db::open_in_memory()`?"
          tr: "API testleri neden `Db::open_in_memory()` kullanıyor?"
        options:
          en:
            - "Each test gets a fresh, private database that disappears afterwards"
            - "Because SQLite cannot use files"
            - "To make the production database faster"
          tr:
            - "Her test taze, kendine ait bir veritabanı alır ve sonra kaybolur"
            - "SQLite dosya kullanamadığı için"
            - "Üretim veritabanını hızlandırmak için"
        answer: 0
        why:
          en: "Tests must not touch real data and must not affect each other. An in-memory database is created per test and dropped at its end."
          tr: "Testler gerçek veriye dokunmamalı ve birbirini etkilememeli. Bellekteki veritabanı her test için oluşturulur ve sonunda atılır."
    sources:
