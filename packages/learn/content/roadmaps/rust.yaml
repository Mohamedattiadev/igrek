  - id: tests
    stage: testing
    title:
      en: "Write unit and integration tests"
      tr: "Birim ve entegrasyon testleri yazma"
    minutes: 60
    needs: [api]
    why:
      en: "Tests are small programs that check your program for you, in seconds, every time. Without them every change is a guess. Rust has testing built in, so there is nothing to install."
      tr: "Testler, programını senin için, her seferinde saniyeler içinde kontrol eden küçük programlardır. Onlar olmadan her değişiklik bir tahmindir. Rust'ta test desteği yerleşiktir, kurulacak bir şey yok."
    learn:
      en: |
        - Unit tests live next to the code in a `#[cfg(test)] mod tests` and may use private items
        - Integration tests live in the `tests/` folder and use your program from outside, like a user would; they can only reach `pub` items of the library (this is why we have `lib.rs`)
        - `assert!`, `assert_eq!` and `matches!` check things; `cargo test` runs everything in parallel
        - Tests need their own data: an in-memory database and a temporary folder (`tempfile`), never your real files
        - You can test the whole API without a network: send a request straight into the router
      tr: |
        - Birim testleri kodun yanında `#[cfg(test)] mod tests` içinde yaşar ve private öğeleri kullanabilir
        - Entegrasyon testleri `tests/` klasöründe yaşar ve programını bir kullanıcı gibi dışarıdan kullanır; sadece kütüphanenin `pub` öğelerine erişebilir (`lib.rs`'in olmasının sebebi bu)
        - `assert!`, `assert_eq!` ve `matches!` bir şeyleri kontrol eder; `cargo test` hepsini paralel çalıştırır
        - Testlerin kendi verisi olmalı: bellekte bir veritabanı ve geçici bir klasör (`tempfile`); asla gerçek dosyaların değil
        - Bütün API'yi ağ olmadan test edebilirsin: isteği doğrudan router'a gönder
    do:
      en: |
        1. Add the two development-only crates with the commands below. `[dev-dependencies]` are used only by tests and are not in the final program.
        2. Add the `tests` module at the end of `src/model.rs`, `src/db.rs` and `src/store.rs` (each below).
        3. Create the folder `tests/` and the two files `tests/cli.rs` and `tests/api.rs`. `cli.rs` runs the real compiled program with a private data file. `api.rs` builds the router on an in-memory database and sends requests into it.
        4. Run `cargo test`. You should see 10 unit tests, 3 API tests and 2 command line tests pass.
        5. Break something on purpose, for example change `MAX_TITLE_CHARS` to `10`, and run `cargo test`. See a test fail and read the message. Undo the change.
        6. Commit: `git add .` and `git commit -m "Add tests"`.
      tr: |
        1. Aşağıdaki komutlarla sadece geliştirmede kullanılan iki crate'i ekle. `[dev-dependencies]` sadece testlerde kullanılır ve son programda yoktur.
        2. `src/model.rs`, `src/db.rs` ve `src/store.rs` dosyalarının sonuna `tests` modülünü ekle (her biri aşağıda).
        3. `tests/` klasörünü ve `tests/cli.rs` ile `tests/api.rs` dosyalarını oluştur. `cli.rs` gerçek derlenmiş programı kendine ait bir veri dosyasıyla çalıştırır. `api.rs` router'ı bellekteki bir veritabanı üzerinde kurar ve ona istek gönderir.
        4. `cargo test` çalıştır. 10 birim testi, 3 API testi ve 2 komut satırı testinin geçtiğini görmelisin.
        5. Bilerek bir şeyi boz, örneğin `MAX_TITLE_CHARS` değerini `10` yap ve `cargo test` çalıştır. Bir testin kaldığını gör ve mesajı oku. Değişikliği geri al.
        6. Commit'le: `git add .` ve `git commit -m "Add tests"`.
