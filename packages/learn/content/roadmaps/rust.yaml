          async fn readyz_checks_the_database() {
              let (status, body) = send(&app(), Method::GET, "/readyz", None).await;
              assert_eq!(status, StatusCode::OK);
              assert!(body.contains("ready"));
          }
      - file: "terminal"
        lang: sh
        text: |
          export API_TOKEN=$(openssl rand -hex 24)
          cargo run -- serve
          RUST_LOG=warn cargo run -- serve
      - file: "example log lines"
        lang: text
        text: |
          INFO todo::api: listening on http://0.0.0.0:8080
          DEBUG request{method=GET uri=/readyz version=HTTP/1.1}: tower_http::trace::on_response: finished processing request latency=0 ms status=200
          DEBUG request{method=GET uri=/tasks/5 version=HTTP/1.1}: tower_http::trace::on_response: finished processing request latency=0 ms status=404
    mistakes:
      - problem:
          en: "No log lines appear."
          tr: "Hiç log satırı görünmüyor."
        fix:
          en: "Check `RUST_LOG`: a value like `warn` hides info lines, and a wrong name hides everything from that crate. Unset it to get the default (`info,tower_http=debug`)."
          tr: "`RUST_LOG`'u kontrol et: `warn` gibi bir değer info satırlarını gizler, yanlış bir ad o crate'in her şeyini gizler. Varsayılanı (`info,tower_http=debug`) almak için değişkeni kaldır."
      - problem:
          en: "Using `println!` for logs in a server."
          tr: "Bir sunucuda log için `println!` kullanmak."
        fix:
          en: "`println!` has no level, no time and cannot be filtered. Use `tracing::info!`, `warn!` and `error!` so the host can show, search and filter them."
          tr: "`println!`'in seviyesi, zamanı yoktur ve süzülemez. Sunucunun gösterebilmesi, arayabilmesi ve süzebilmesi için `tracing::info!`, `warn!` ve `error!` kullan."
      - problem:
          en: "Logging the whole request, including the `Authorization` header or tokens in the URL."
          tr: "`Authorization` başlığı ya da URL'deki token'lar dahil bütün isteği loglamak."
        fix:
          en: "TraceLayer logs method, path and status, not headers; keep it that way. Never put secrets in query strings, because the path is logged and stored by proxies as well."
          tr: "TraceLayer metodu, yolu ve durumu loglar, başlıkları değil; böyle kalsın. Sorgu metinlerine asla sır koyma, çünkü yol loglanır ve vekil sunucularda da saklanır."
