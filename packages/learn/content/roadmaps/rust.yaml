  - id: sqlite
    stage: data-api
    title:
      en: "Store tasks in SQLite with rusqlite"
      tr: "rusqlite ile görevleri SQLite'ta saklama"
    minutes: 50
    needs: [cli]
    why:
      en: "A web API serves many requests, and a JSON file that is rewritten as a whole is not made for that. SQLite is a real database in one file, with no server to run. We give the API its own store, `Db`, next to the JSON store the command line keeps using."
      tr: "Bir web API birçok isteğe cevap verir ve bütünüyle yeniden yazılan bir JSON dosyası bunun için yapılmamıştır. SQLite, çalıştırılacak sunucusu olmayan, tek dosyada gerçek bir veritabanıdır. API'ye kendi deposunu, `Db`'yi veriyoruz; komut satırı JSON deposunu kullanmaya devam ediyor."
    learn:
      en: |
        - A table, rows and columns, and the SQL to create, read, update and delete (see the SQL cheatsheet)
        - Placeholders (`?1`): the value travels apart from the SQL text, so text from a user can never become SQL (this stops SQL injection)
        - `Option` from `.optional()` for "maybe no row", turned into our `NotFound` error
        - The `bundled` feature compiles SQLite with the C compiler from the setup step, so nothing else needs to be installed
      tr: |
        - Bir tablo, satırlar ve sütunlar; oluşturmak, okumak, güncellemek ve silmek için SQL (SQL kopya kâğıdına bak)
        - Yer tutucular (`?1`): değer SQL metninden ayrı gider, bu yüzden kullanıcıdan gelen metin asla SQL olamaz (SQL injection'ı bu engeller)
        - "Belki satır yok" için `.optional()`'dan gelen `Option`, bizim `NotFound` hatamıza çevrilir
        - `bundled` özelliği SQLite'ı kurulum adımındaki C derleyicisiyle derler, yani başka bir şey kurmak gerekmez
    do:
      en: |
        1. Add rusqlite with the command below. The first build compiles SQLite, so it takes a minute.
        2. Replace `src/error.rs` (one new variant, `Db`, and its `From`), create `src/db.rs`, and update `src/lib.rs`.
        3. Create `examples/try_db.rs`. Anything in `examples/` is a small program you start with `cargo run --example <name>`, handy for trying a module.
        4. Run `cargo run --example try_db`. It adds two tasks (one with a title that looks like an attack), lists them, and ends with `Error: NotFound(7)`. The attack title is stored as plain text and the `tasks` table is untouched.
        5. Read `db.rs`: find the placeholders and how `list` picks one of three fixed SQL texts for the filter. We never glue user text into SQL.
        6. Commit: `git add .` and `git commit -m "Add the SQLite store"`.
      tr: |
        1. Aşağıdaki komutla rusqlite'ı ekle. İlk build SQLite'ı derler, bu yüzden bir dakika sürer.
        2. `src/error.rs` dosyasını değiştir (bir yeni varyant, `Db`, ve onun `From`'u), `src/db.rs` dosyasını oluştur ve `src/lib.rs` dosyasını güncelle.
        3. `examples/try_db.rs` dosyasını oluştur. `examples/` içindeki her dosya `cargo run --example <ad>` ile başlattığın küçük bir programdır; bir modülü denemek için kullanışlıdır.
        4. `cargo run --example try_db` çalıştır. İki görev ekler (birinin başlığı saldırı gibi görünür), listeler ve `Error: NotFound(7)` ile biter. Saldırı başlığı düz metin olarak saklanır ve `tasks` tablosuna dokunulmaz.
        5. `db.rs` dosyasını oku: yer tutucuları ve `list`'in filtre için sabit üç SQL metninden birini nasıl seçtiğini bul. Kullanıcı metnini asla SQL'e yapıştırmıyoruz.
        6. Commit'le: `git add .` ve `git commit -m "Add the SQLite store"`.
    code:
      - file: "terminal"
        lang: sh
        text: |
          cargo add rusqlite --features bundled
      - file: "src/lib.rs"
        lang: rust
        text: |
          pub mod db;
          pub mod error;
          pub mod model;
          pub mod store;
      - file: "src/error.rs"
        lang: rust
        text: |
          use std::fmt;
          use std::io;

          /// Everything that can go wrong in the todo tool.
          #[derive(Debug)]
          pub enum TodoError {
              EmptyTitle,
              TitleTooLong { max: usize },
              NotFound(i64),
              Io(io::Error),
              Json(serde_json::Error),
              Db(rusqlite::Error),
          }

          impl fmt::Display for TodoError {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  match self {
                      TodoError::EmptyTitle => write!(f, "the title is empty"),
                      TodoError::TitleTooLong { max } => {
                          write!(f, "the title is longer than {max} characters")
                      }
                      TodoError::NotFound(id) => write!(f, "no task with id {id}"),
                      TodoError::Io(e) => write!(f, "file problem: {e}"),
                      TodoError::Json(e) => write!(f, "the data file is not valid JSON: {e}"),
                      TodoError::Db(e) => write!(f, "database problem: {e}"),
                  }
              }
          }

          impl std::error::Error for TodoError {}

          // These two let `?` turn an io::Error or a serde_json::Error into a TodoError.
          impl From<io::Error> for TodoError {
              fn from(e: io::Error) -> Self {
                  TodoError::Io(e)
              }
          }

          impl From<serde_json::Error> for TodoError {
              fn from(e: serde_json::Error) -> Self {
                  TodoError::Json(e)
              }
          }

          impl From<rusqlite::Error> for TodoError {
              fn from(e: rusqlite::Error) -> Self {
                  TodoError::Db(e)
              }
          }
      - file: "src/db.rs"
        lang: rust
        text: |
          use rusqlite::{Connection, OptionalExtension, Row, params};

          use crate::error::TodoError;
          use crate::model::{Filter, Task, clean_title};

          /// The tasks of the web API, kept in a SQLite database.
          pub struct Db {
              conn: Connection,
          }

          impl Db {
              /// Opens (and creates, if needed) a database file.
              pub fn open(path: &str) -> Result<Db, TodoError> {
                  Db::init(Connection::open(path)?)
              }

              /// A database that lives in memory only; handy for tests.
              pub fn open_in_memory() -> Result<Db, TodoError> {
                  Db::init(Connection::open_in_memory()?)
              }

              fn init(conn: Connection) -> Result<Db, TodoError> {
                  conn.execute_batch(
                      "CREATE TABLE IF NOT EXISTS tasks (
                           id    INTEGER PRIMARY KEY,
                           title TEXT NOT NULL,
                           done  INTEGER NOT NULL DEFAULT 0
                       );",
                  )?;
                  Ok(Db { conn })
              }

              pub fn add(&self, title: &str) -> Result<Task, TodoError> {
                  let title = clean_title(title)?;
                  // The ?1 is a placeholder: the value travels separately from the SQL text.
                  self.conn
                      .execute("INSERT INTO tasks (title) VALUES (?1)", params![title])?;
                  Ok(Task {
                      id: self.conn.last_insert_rowid(),
                      title,
                      done: false,
                  })
              }

              pub fn get(&self, id: i64) -> Result<Task, TodoError> {
                  self.conn
                      .query_row(
                          "SELECT id, title, done FROM tasks WHERE id = ?1",
                          params![id],
                          row_to_task,
                      )
                      .optional()?
                      .ok_or(TodoError::NotFound(id))
              }

              pub fn list(&self, filter: Filter, limit: i64, offset: i64) -> Result<Vec<Task>, TodoError> {
                  let sql = match filter {
                      Filter::All => "SELECT id, title, done FROM tasks ORDER BY id LIMIT ?1 OFFSET ?2",
                      Filter::Open => {
                          "SELECT id, title, done FROM tasks WHERE done = 0 ORDER BY id LIMIT ?1 OFFSET ?2"
                      }
                      Filter::Done => {
                          "SELECT id, title, done FROM tasks WHERE done = 1 ORDER BY id LIMIT ?1 OFFSET ?2"
                      }
                  };
                  let mut stmt = self.conn.prepare(sql)?;
                  let tasks = stmt
                      .query_map(params![limit, offset], row_to_task)?
                      .collect::<Result<Vec<_>, _>>()?;
                  Ok(tasks)
              }

              pub fn mark_done(&self, id: i64) -> Result<Task, TodoError> {
                  let changed = self
                      .conn
                      .execute("UPDATE tasks SET done = 1 WHERE id = ?1", params![id])?;
                  if changed == 0 {
                      return Err(TodoError::NotFound(id));
                  }
                  self.get(id)
              }

              pub fn remove(&self, id: i64) -> Result<(), TodoError> {
                  let changed = self
                      .conn
                      .execute("DELETE FROM tasks WHERE id = ?1", params![id])?;
                  if changed == 0 {
                      return Err(TodoError::NotFound(id));
                  }
                  Ok(())
              }
          }

          fn row_to_task(row: &Row) -> rusqlite::Result<Task> {
              Ok(Task {
                  id: row.get(0)?,
                  title: row.get(1)?,
                  done: row.get(2)?,
              })
          }
      - file: "examples/try_db.rs"
        lang: rust
        text: |
          use todo::db::Db;
          use todo::error::TodoError;
          use todo::model::Filter;

          fn main() -> Result<(), TodoError> {
              let db = Db::open_in_memory()?;
              db.add("Learn SQLite")?;
              let tricky = db.add("Robert'); DROP TABLE tasks;--")?;
              db.mark_done(tricky.id)?;
              println!("{:?}", db.list(Filter::All, 10, 0)?);
              println!("{:?}", db.list(Filter::Open, 10, 0)?);
              db.get(7)?; // there is no task 7
              Ok(())
          }
      - file: ".gitignore (add these lines)"
        lang: text
        text: |
          *.db
          *.db-shm
          *.db-wal
    mistakes:
      - problem:
          en: "Building SQL with `format!(\"... WHERE title = '{title}'\")`."
          tr: "SQL'i `format!(\"... WHERE title = '{title}'\")` ile kurmak."
        fix:
          en: "That lets a user write SQL. Always use placeholders and pass values with `params![...]`, as `db.rs` does."
          tr: "Bu, kullanıcının SQL yazmasına izin verir. Her zaman yer tutucu kullan ve değerleri `params![...]` ile ver; `db.rs` böyle yapıyor."
      - problem:
          en: "The build fails with a message about `cc` or a C compiler while compiling `libsqlite3-sys`."
          tr: "`libsqlite3-sys` derlenirken build, `cc` ya da bir C derleyicisi hakkındaki bir mesajla başarısız oluyor."
        fix:
          en: "The C compiler from the setup step is missing. Install it (build-essential, Xcode tools or the Windows C++ build tools) and build again."
          tr: "Kurulum adımındaki C derleyicisi eksik. Onu kur (build-essential, Xcode araçları ya da Windows C++ build tools) ve tekrar derle."
      - problem:
          en: "Using `.unwrap()` on `query_row`, so a missing id crashes the program."
          tr: "`query_row` üzerinde `.unwrap()` kullanıp var olmayan bir id'de programı çökertmek."
        fix:
          en: "Use `.optional()?` and turn \"no row\" into `TodoError::NotFound`, as `get` does. A missing row is normal, not a bug."
          tr: "`.optional()?` kullan ve \"satır yok\" durumunu `get`'in yaptığı gibi `TodoError::NotFound`'a çevir. Eksik satır normaldir, hata değildir."
    quiz:
      - q:
          en: "Why do we write `WHERE id = ?1` and pass the id separately instead of putting the id into the SQL text?"
          tr: "Neden id'yi SQL metnine koymak yerine `WHERE id = ?1` yazıp id'yi ayrıca veriyoruz?"
        options:
          en:
            - "So text from a user can never be run as SQL"
            - "Because SQLite cannot read numbers in text"
            - "Because it makes the query shorter"
          tr:
            - "Kullanıcıdan gelen metin asla SQL olarak çalışmasın diye"
            - "SQLite metin içindeki sayıları okuyamadığı için"
            - "Sorguyu kısalttığı için"
        answer: 0
        why:
          en: "With placeholders the database receives the SQL and the values separately, so a value is always only data. This is the standard defence against SQL injection."
          tr: "Yer tutucularla veritabanı SQL'i ve değerleri ayrı alır, bu yüzden bir değer her zaman sadece veridir. SQL injection'a karşı standart savunma budur."
    sources:
      - title: "rusqlite, documentation"
        url: https://docs.rs/rusqlite/latest/rusqlite/
      - title: "SQLite, quick start for the SQL language"
        url: https://www.sqlite.org/lang.html
      - title: "The Rust Book, the Option enum"
        url: https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html#the-option-enum-and-its-advantages-over-null-values

  - id: api
    stage: data-api
    title:
      en: "Turn it into a web API with axum and tokio"
      tr: "axum ve tokio ile web API'ye dönüştürme"
    minutes: 75
    needs: [sqlite]
    why:
      en: "A web API lets other programs, a website or a phone app, use your tasks over HTTP. axum maps a method and a path (like `POST /tasks`) to a Rust function, and tokio is the async runtime that lets one server handle many connections at once."
      tr: "Bir web API, başka programların, bir sitenin ya da telefon uygulamasının görevlerini HTTP üzerinden kullanmasını sağlar. axum bir metodu ve yolu (`POST /tasks` gibi) bir Rust fonksiyonuna bağlar; tokio da tek bir sunucunun aynı anda birçok bağlantıyı yönetmesini sağlayan async runtime'dır."
    learn:
      en: |
        - HTTP in short: a method (`GET`, `POST`, `DELETE`), a path, a status code (200, 201, 400, 404) and a JSON body (see the HTTP cheatsheet)
        - A handler is an `async fn`; its parameters (`State`, `Path`, `Query`, `Json`) are "extractors" that axum fills from the request
        - Handlers return `Result<_, TodoError>`; an `IntoResponse` implementation turns each error into a status code and a JSON message
        - What `async` and `.await` are: a function can wait (for the network) without blocking the thread
        - Shared state: the database connection lives in an `Arc<Mutex<...>>`, because many requests run at once
      tr: |
        - Kısaca HTTP: bir metot (`GET`, `POST`, `DELETE`), bir yol, bir durum kodu (200, 201, 400, 404) ve bir JSON gövdesi (HTTP kopya kâğıdına bak)
        - Handler bir `async fn`'dir; parametreleri (`State`, `Path`, `Query`, `Json`) axum'un istekten doldurduğu "extractor"lardır
        - Handler'lar `Result<_, TodoError>` döner; bir `IntoResponse` uygulaması her hatayı bir durum koduna ve JSON mesajına çevirir
        - `async` ve `.await` nedir: bir fonksiyon thread'i bloklamadan (ağı) bekleyebilir
        - Paylaşılan durum: veritabanı bağlantısı bir `Arc<Mutex<...>>` içinde yaşar, çünkü birçok istek aynı anda çalışır
    do:
      en: |
        1. Add axum and tokio with the commands below.
        2. In `src/model.rs`, change the `Filter` enum so a URL like `?filter=open` can be read (the new lines are below). Everything else in the file stays as it is.
        3. Create `src/api.rs`, update `src/lib.rs`, and replace `src/main.rs`. The new `serve` command builds the runtime and starts the server.
        4. Start the server with `cargo run -- serve`. If port 8080 is already used on your computer, use `cargo run -- serve --port 3000` and change the port in the commands below.
        5. Open a second terminal and try the `curl` commands below (on Windows use Git Bash, which comes with Git). Watch the status codes: 201 for create, 404 for a missing id, 400 for an empty title.
        6. Stop the server with Ctrl+C. Run `cargo clippy` to check the code, then commit: `git add .` and `git commit -m "Add the web API"`.
      tr: |
        1. Aşağıdaki komutlarla axum ve tokio'yu ekle.
        2. `src/model.rs` içinde `Filter` enum'unu, `?filter=open` gibi bir URL okunabilsin diye değiştir (yeni satırlar aşağıda). Dosyadaki her şey olduğu gibi kalır.
        3. `src/api.rs` dosyasını oluştur, `src/lib.rs` dosyasını güncelle ve `src/main.rs` dosyasını değiştir. Yeni `serve` komutu runtime'ı kurar ve sunucuyu başlatır.
        4. Sunucuyu `cargo run -- serve` ile başlat. Bilgisayarında 8080 portu zaten kullanılıyorsa `cargo run -- serve --port 3000` kullan ve aşağıdaki komutlarda portu değiştir.
        5. İkinci bir terminal aç ve aşağıdaki `curl` komutlarını dene (Windows'ta Git ile gelen Git Bash'i kullan). Durum kodlarını izle: oluşturmada 201, var olmayan id'de 404, boş başlıkta 400.
        6. Sunucuyu Ctrl+C ile durdur. Kodu kontrol etmek için `cargo clippy` çalıştır, sonra commit'le: `git add .` ve `git commit -m "Add the web API"`.
    code:
      - file: "terminal"
        lang: sh
        text: |
          cargo add axum
          cargo add tokio --features rt-multi-thread,net,signal,macros
      - file: "src/model.rs (the Filter enum, replace it)"
        lang: rust
        text: |
          /// Which tasks to show. In a URL it is written in lower case: ?filter=open
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Default, Deserialize)]
          #[serde(rename_all = "lowercase")]
          pub enum Filter {
              #[default]
              All,
              Open,
              Done,
          }
      - file: "src/lib.rs"
        lang: rust
        text: |
          pub mod api;
          pub mod db;
          pub mod error;
          pub mod model;
          pub mod store;
      - file: "src/api.rs"
        lang: rust
        text: |
          use std::sync::{Arc, Mutex, MutexGuard};

          use axum::extract::{Path, Query, State};
          use axum::http::StatusCode;
          use axum::response::{IntoResponse, Response};
          use axum::routing::{get, post};
          use axum::{Json, Router};
          use serde::Deserialize;
          use serde_json::json;

          use crate::db::Db;
          use crate::error::TodoError;
          use crate::model::{Filter, Task};

          /// What every handler can reach. Clone is cheap: it copies the Arc, not the database.
          #[derive(Clone)]
          pub struct AppState {
              db: Arc<Mutex<Db>>,
          }

          impl AppState {
              /// A rusqlite Connection can be used by one thread at a time, so it sits behind a Mutex.
              fn db(&self) -> MutexGuard<'_, Db> {
                  // If another request panicked while holding the lock, the data is still fine.
                  self.db
                      .lock()
                      .unwrap_or_else(|poisoned| poisoned.into_inner())
              }
          }

          pub fn router(db: Db) -> Router {
              let state = AppState {
                  db: Arc::new(Mutex::new(db)),
              };
              Router::new()
                  .route("/healthz", get(healthz))
                  .route("/tasks", get(list_tasks).post(create_task))
                  .route("/tasks/{id}", get(get_task).delete(delete_task))
                  .route("/tasks/{id}/done", post(finish_task))
                  .with_state(state)
          }

          /// Binds to all interfaces so a container or a host can reach the server.
          pub async fn serve(db: Db, port: u16) -> std::io::Result<()> {
              let listener = tokio::net::TcpListener::bind(("0.0.0.0", port)).await?;
              println!("listening on http://{}", listener.local_addr()?);
              axum::serve(listener, router(db)).await
          }

          #[derive(Deserialize)]
          struct NewTask {
              title: String,
          }

          #[derive(Deserialize)]
          struct ListParams {
              filter: Option<Filter>,
              limit: Option<i64>,
              offset: Option<i64>,
          }

          async fn healthz() -> Json<serde_json::Value> {
              Json(json!({ "status": "ok" }))
          }

          async fn list_tasks(
              State(state): State<AppState>,
              Query(params): Query<ListParams>,
          ) -> Result<Json<Vec<Task>>, TodoError> {
              let tasks = state.db().list(
                  params.filter.unwrap_or_default(),
                  params.limit.unwrap_or(50),
                  params.offset.unwrap_or(0),
              )?;
              Ok(Json(tasks))
          }

          async fn create_task(
              State(state): State<AppState>,
              Json(body): Json<NewTask>,
          ) -> Result<(StatusCode, Json<Task>), TodoError> {
              let task = state.db().add(&body.title)?;
              Ok((StatusCode::CREATED, Json(task)))
          }

          async fn get_task(
              State(state): State<AppState>,
              Path(id): Path<i64>,
          ) -> Result<Json<Task>, TodoError> {
              Ok(Json(state.db().get(id)?))
          }

          async fn finish_task(
              State(state): State<AppState>,
              Path(id): Path<i64>,
          ) -> Result<Json<Task>, TodoError> {
              Ok(Json(state.db().mark_done(id)?))
          }

          async fn delete_task(
              State(state): State<AppState>,
              Path(id): Path<i64>,
          ) -> Result<StatusCode, TodoError> {
              state.db().remove(id)?;
              Ok(StatusCode::NO_CONTENT)
          }

          /// How a TodoError looks to a client of the API.
          impl IntoResponse for TodoError {
              fn into_response(self) -> Response {
                  let status = match &self {
                      TodoError::EmptyTitle | TodoError::TitleTooLong { .. } => StatusCode::BAD_REQUEST,
                      TodoError::NotFound(_) => StatusCode::NOT_FOUND,
                      // Our own faults: do not show file paths or SQL details to the client.
                      TodoError::Io(_) | TodoError::Json(_) | TodoError::Db(_) => {
                          return (
                              StatusCode::INTERNAL_SERVER_ERROR,
                              Json(json!({ "error": "internal error" })),
                          )
                              .into_response();
                      }
                  };
                  (status, Json(json!({ "error": self.to_string() }))).into_response()
              }
          }
      - file: "src/main.rs"
        lang: rust
        text: |
          use std::path::{Path, PathBuf};
          use std::process::ExitCode;

          use clap::{Parser, Subcommand, ValueEnum};

          use todo::api;
          use todo::db::Db;
          use todo::error::TodoError;
          use todo::model::Filter;
          use todo::store;

          /// A tiny todo list.
          #[derive(Parser)]
          #[command(version)]
          struct Cli {
              /// The JSON file that keeps your tasks
              #[arg(long, global = true, env = "TODO_FILE", default_value = "todo.json")]
              file: PathBuf,

              #[command(subcommand)]
              command: Command,
          }

          #[derive(Subcommand)]
          enum Command {
              /// Add a task
              Add {
                  /// What has to be done
                  title: String,
              },
              /// Show tasks
              List {
                  /// Which tasks to show
                  #[arg(long, value_enum, default_value_t = Show::All)]
                  filter: Show,
              },
              /// Mark a task as done
              Done {
                  /// The number of the task
                  id: i64,
              },
              /// Delete a task
              Remove {
                  /// The number of the task
                  id: i64,
              },
              /// Start the web API
              Serve {
                  /// The port to listen on
                  #[arg(long, env = "PORT", default_value_t = 8080)]
                  port: u16,
                  /// The SQLite database file
                  #[arg(long, env = "DATABASE_PATH", default_value = "todo.db")]
                  database: String,
              },
          }

          /// The same choices as `Filter`, but with the extra derive clap needs.
          #[derive(Clone, Copy, ValueEnum)]
          enum Show {
              All,
              Open,
              Done,
          }

          impl From<Show> for Filter {
              fn from(show: Show) -> Self {
                  match show {
                      Show::All => Filter::All,
                      Show::Open => Filter::Open,
                      Show::Done => Filter::Done,
                  }
              }
          }

          fn main() -> ExitCode {
              match run(Cli::parse()) {
                  Ok(()) => ExitCode::SUCCESS,
                  Err(e) => {
                      eprintln!("error: {e}");
                      ExitCode::FAILURE
                  }
              }
          }

          fn run(cli: Cli) -> Result<(), TodoError> {
              match cli.command {
                  Command::Serve { port, database } => serve(port, &database),
                  command => run_on_file(command, &cli.file),
              }
          }

          fn serve(port: u16, database: &str) -> Result<(), TodoError> {
              let db = Db::open(database)?;
              let runtime = tokio::runtime::Runtime::new()?;
              runtime.block_on(api::serve(db, port))?;
              Ok(())
          }

          /// The commands that work on the JSON file.
          fn run_on_file(command: Command, file: &Path) -> Result<(), TodoError> {
              let mut list = store::load(file)?;
              match command {
                  Command::Add { title } => {
                      let id = list.add(&title)?;
                      store::save(file, &list)?;
                      println!("added #{id}");
                  }
                  Command::List { filter } => {
                      let tasks = list.list(filter.into());
                      if tasks.is_empty() {
                          println!("no tasks");
                      }
                      for task in tasks {
                          let mark = if task.done { "x" } else { " " };
                          println!("[{mark}] {:>3}  {}", task.id, task.title);
                      }
                  }
                  Command::Done { id } => {
                      list.mark_done(id)?;
                      store::save(file, &list)?;
                      println!("done #{id}");
                  }
                  Command::Remove { id } => {
                      list.remove(id)?;
                      store::save(file, &list)?;
                      println!("removed #{id}");
                  }
                  Command::Serve { .. } => unreachable!("serve is handled in run"),
              }
              Ok(())
          }
      - file: "terminal (server)"
        lang: sh
        text: |
          cargo run -- serve
