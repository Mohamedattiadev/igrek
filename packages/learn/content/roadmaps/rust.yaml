        text: |
          use std::process::{Command, Output};

          /// Runs the real `todo` program with the given arguments and a private data file.
          fn todo(file: &std::path::Path, args: &[&str]) -> Output {
              Command::new(env!("CARGO_BIN_EXE_todo"))
                  .arg("--file")
                  .arg(file)
                  .args(args)
                  .output()
                  .expect("could not start the todo program")
          }

          fn stdout(output: &Output) -> String {
              String::from_utf8_lossy(&output.stdout).into_owned()
          }

          #[test]
          fn add_list_done_remove_round_trip() {
              let dir = tempfile::tempdir().unwrap();
              let file = dir.path().join("todo.json");

              assert!(todo(&file, &["add", "Buy milk"]).status.success());
              assert!(todo(&file, &["add", "Learn Rust"]).status.success());
              assert!(todo(&file, &["done", "1"]).status.success());

              let list = stdout(&todo(&file, &["list"]));
              assert!(list.contains("[x]   1  Buy milk"));
              assert!(list.contains("[ ]   2  Learn Rust"));

              let open = stdout(&todo(&file, &["list", "--filter", "open"]));
              assert!(!open.contains("Buy milk"));

              assert!(todo(&file, &["remove", "1"]).status.success());
              assert!(!stdout(&todo(&file, &["list"])).contains("Buy milk"));
          }

          #[test]
          fn a_bad_id_fails_with_a_message() {
              let dir = tempfile::tempdir().unwrap();
              let file = dir.path().join("todo.json");

              let output = todo(&file, &["done", "42"]);
              assert!(!output.status.success());
              let message = String::from_utf8_lossy(&output.stderr);
              assert!(message.contains("no task with id 42"));
          }
      - file: "tests/api.rs"
        lang: rust
        text: |
          use axum::Router;
          use axum::body::{Body, to_bytes};
          use axum::http::{Method, Request, StatusCode};
          use tower::ServiceExt; // gives us .oneshot(request)

          use todo::api::router;
          use todo::db::Db;

          fn app() -> Router {
              router(Db::open_in_memory().unwrap())
          }

          /// Sends one request to the router and returns the status and the body text.
          async fn send(app: &Router, method: Method, uri: &str, body: Option<&str>) -> (StatusCode, String) {
              let mut builder = Request::builder().method(method).uri(uri);
              let body = match body {
                  Some(json) => {
                      builder = builder.header("content-type", "application/json");
                      Body::from(json.to_string())
                  }
                  None => Body::empty(),
              };
              let response = app
                  .clone()
                  .oneshot(builder.body(body).unwrap())
                  .await
                  .unwrap();
              let status = response.status();
              let bytes = to_bytes(response.into_body(), 1024 * 1024).await.unwrap();
              (status, String::from_utf8(bytes.to_vec()).unwrap())
          }

          #[tokio::test]
          async fn healthz_says_ok() {
              let (status, body) = send(&app(), Method::GET, "/healthz", None).await;
              assert_eq!(status, StatusCode::OK);
              assert!(body.contains("ok"));
          }

          #[tokio::test]
          async fn create_then_read_a_task() {
              let app = app();
              let (status, body) = send(
                  &app,
                  Method::POST,
                  "/tasks",
                  Some(r#"{"title":"Buy milk"}"#),
              )
              .await;
              assert_eq!(status, StatusCode::CREATED);
              assert!(body.contains(r#""title":"Buy milk""#));

              let (status, body) = send(&app, Method::GET, "/tasks/1", None).await;
              assert_eq!(status, StatusCode::OK);
              assert!(body.contains(r#""done":false"#));
          }

          #[tokio::test]
          async fn bad_input_gets_a_4xx_not_a_crash() {
              let app = app();
              let (status, _) = send(&app, Method::POST, "/tasks", Some(r#"{"title":"   "}"#)).await;
              assert_eq!(status, StatusCode::BAD_REQUEST);
              let (status, _) = send(&app, Method::POST, "/tasks", Some("{not json")).await;
              assert_eq!(status, StatusCode::BAD_REQUEST);
              let (status, _) = send(&app, Method::GET, "/tasks/999", None).await;
              assert_eq!(status, StatusCode::NOT_FOUND);
          }
