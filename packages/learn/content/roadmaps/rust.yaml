  - id: cli
    stage: first-project
    title:
      en: "Build the command line with clap"
      tr: "clap ile komut satırını yazma"
    minutes: 50
    needs: [json-store]
    why:
      en: "A real tool takes commands like `todo add \"Buy milk\"` and prints help when you ask. clap reads the arguments, checks them, writes `--help` for you and rejects wrong input with a clear message, so you do not parse text by hand."
      tr: "Gerçek bir araç `todo add \"Buy milk\"` gibi komutlar alır ve sorunca yardım yazar. clap argümanları okur, kontrol eder, `--help` metnini senin için yazar ve yanlış girdiyi anlaşılır bir mesajla reddeder; metni elle ayrıştırmazsın."
    learn:
      en: |
        - Describing a command line with structs and enums: `#[derive(Parser)]`, `#[derive(Subcommand)]`
        - A doc comment (`///`) above a field becomes its help text
        - `--file` can also come from an environment variable (`TODO_FILE`), which is handy for tests and servers
        - `main` can return an `ExitCode`, so scripts can tell success from failure
      tr: |
        - Komut satırını struct ve enum'larla tarif etmek: `#[derive(Parser)]`, `#[derive(Subcommand)]`
        - Bir alanın üstündeki doküman yorumu (`///`) onun yardım metni olur
        - `--file` bir ortam değişkeninden (`TODO_FILE`) de gelebilir; testler ve sunucular için kullanışlıdır
        - `main` bir `ExitCode` dönebilir; böylece betikler başarıyı başarısızlıktan ayırt eder
    do:
      en: |
        1. Add clap with the command below. The `derive` feature gives us the struct-and-enum style, and `env` lets an argument read an environment variable.
        2. Replace `src/main.rs` with the code below. Read it from the top: `Cli` is the whole command line, `Command` is the list of commands, and `run_on_file` loads the file, does one command and saves.
        3. Try it. Note the extra `--` after `cargo run`: it separates cargo's own options from your program's.
        4. Run `cargo run -- --help`, `cargo run -- add --help` and a wrong command such as `cargo run -- list --filter bogus`. The help and the error messages were written by clap.
        5. Optional: `cargo install --path .` installs `todo` as a normal command on your computer, so you can type `todo list` anywhere.
        6. Commit: `git add .` and `git commit -m "Add the command line"`.
      tr: |
        1. Aşağıdaki komutla clap'i ekle. `derive` özelliği struct ve enum tarzını verir, `env` ise bir argümanın ortam değişkeni okumasını sağlar.
        2. `src/main.rs` dosyasını aşağıdaki kodla değiştir. Yukarıdan oku: `Cli` tüm komut satırıdır, `Command` komutların listesidir, `run_on_file` dosyayı yükler, bir komut yapar ve kaydeder.
        3. Dene. `cargo run`'dan sonraki fazladan `--` işaretine dikkat: cargo'nun kendi seçeneklerini programının seçeneklerinden ayırır.
        4. `cargo run -- --help`, `cargo run -- add --help` ve `cargo run -- list --filter bogus` gibi yanlış bir komut çalıştır. Yardım ve hata mesajlarını clap yazdı.
        5. İsteğe bağlı: `cargo install --path .` `todo`'yu bilgisayarında normal bir komut olarak kurar; her yerde `todo list` yazabilirsin.
        6. Commit'le: `git add .` ve `git commit -m "Add the command line"`.
    code:
      - file: "terminal"
        lang: sh
        text: |
          cargo add clap --features derive,env
      - file: "src/main.rs"
        lang: rust
        text: |
          use std::path::PathBuf;
          use std::process::ExitCode;

          use clap::{Parser, Subcommand, ValueEnum};

          use todo::error::TodoError;
          use todo::model::Filter;
          use todo::store;

          /// A tiny todo list.
          #[derive(Parser)]
          #[command(version)]
          struct Cli {
              /// The JSON file that keeps your tasks
              #[arg(long, global = true, env = "TODO_FILE", default_value = "todo.json")]
              file: PathBuf,

              #[command(subcommand)]
              command: Command,
          }

          #[derive(Subcommand)]
          enum Command {
              /// Add a task
              Add {
                  /// What has to be done
                  title: String,
              },
              /// Show tasks
              List {
                  /// Which tasks to show
                  #[arg(long, value_enum, default_value_t = Show::All)]
                  filter: Show,
              },
              /// Mark a task as done
              Done {
                  /// The number of the task
                  id: i64,
              },
              /// Delete a task
              Remove {
                  /// The number of the task
                  id: i64,
              },
          }

          /// The same choices as `Filter`, but with the extra derive clap needs.
          #[derive(Clone, Copy, ValueEnum)]
          enum Show {
              All,
              Open,
              Done,
          }

          impl From<Show> for Filter {
              fn from(show: Show) -> Self {
                  match show {
                      Show::All => Filter::All,
                      Show::Open => Filter::Open,
                      Show::Done => Filter::Done,
                  }
              }
          }

          fn main() -> ExitCode {
              match run(Cli::parse()) {
                  Ok(()) => ExitCode::SUCCESS,
                  Err(e) => {
                      eprintln!("error: {e}");
                      ExitCode::FAILURE
                  }
              }
          }

          fn run(cli: Cli) -> Result<(), TodoError> {
              let mut list = store::load(&cli.file)?;
              match cli.command {
                  Command::Add { title } => {
                      let id = list.add(&title)?;
                      store::save(&cli.file, &list)?;
                      println!("added #{id}");
                  }
                  Command::List { filter } => {
                      let tasks = list.list(filter.into());
                      if tasks.is_empty() {
                          println!("no tasks");
                      }
                      for task in tasks {
                          let mark = if task.done { "x" } else { " " };
                          println!("[{mark}] {:>3}  {}", task.id, task.title);
                      }
                  }
                  Command::Done { id } => {
                      list.mark_done(id)?;
                      store::save(&cli.file, &list)?;
                      println!("done #{id}");
                  }
                  Command::Remove { id } => {
                      list.remove(id)?;
                      store::save(&cli.file, &list)?;
                      println!("removed #{id}");
                  }
              }
              Ok(())
          }
      - file: "terminal"
        lang: sh
        text: |
          cargo run -- add "Buy milk"
          cargo run -- add "Learn Rust"
          cargo run -- done 1
          cargo run -- list
          cargo run -- list --filter open
          cargo run -- done 9
          cargo run -- remove 2
    mistakes:
      - problem:
          en: "`cargo run add \"Buy milk\"` fails with an error from cargo itself."
          tr: "`cargo run add \"Buy milk\"` cargo'nun kendi hatasıyla başarısız oluyor."
        fix:
          en: "Put `--` between cargo's part and your program's part: `cargo run -- add \"Buy milk\"`. Everything after `--` goes to your program."
          tr: "cargo'nun kısmı ile programının kısmı arasına `--` koy: `cargo run -- add \"Buy milk\"`. `--`'dan sonrası programına gider."
      - problem:
          en: "A title with spaces is split into several arguments."
          tr: "Boşluklu bir başlık birkaç argümana bölünüyor."
        fix:
          en: "Put quotes around it in the terminal: `todo add \"Buy milk\"`. The terminal, not clap, splits at spaces."
          tr: "Terminalde etrafına tırnak koy: `todo add \"Buy milk\"`. Boşluklardan bölen clap değil terminaldir."
      - problem:
          en: "`todo done -1` is rejected as an unknown option."
          tr: "`todo done -1` bilinmeyen seçenek diye reddediliyor."
        fix:
          en: "A leading `-` looks like an option. That is fine here, since ids start at 1; use `--` (`todo done -- -1`) if you ever need a negative value."
          tr: "Başta `-` olunca seçenek gibi görünür. Burada sorun değil, çünkü id'ler 1'den başlar; bir gün negatif değer gerekirse `--` kullan (`todo done -- -1`)."
    quiz:
      - q:
          en: "Where does clap get the text shown by `--help` for the `title` argument?"
          tr: "clap, `title` argümanı için `--help` ile gösterilen metni nereden alır?"
        options:
          en:
            - "From the doc comment (`///`) above the field"
            - "From a separate help.txt file"
            - "It has to be printed by hand with println!"
          tr:
            - "Alanın üstündeki doküman yorumundan (`///`)"
            - "Ayrı bir help.txt dosyasından"
            - "println! ile elle yazdırılmak zorundadır"
        answer: 0
        why:
          en: "With the derive style, clap turns doc comments into help text, so the code and the help never drift apart."
          tr: "derive tarzında clap doküman yorumlarını yardım metnine çevirir; böylece kod ile yardım birbirinden ayrılmaz."
    sources:
