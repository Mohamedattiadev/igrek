  - id: shutdown
    stage: advanced
    title:
      en: "Shut down gracefully and what to learn next"
      tr: "Düzgün kapanma ve sonra ne öğrenmeli"
    minutes: 40
    needs: [logging]
    why:
      en: "Platforms stop your program all the time: every deploy and restart. They send it a polite signal (SIGTERM) and wait. A program that ignores the signal gets killed after a few seconds, in the middle of a request. A graceful shutdown finishes the requests in progress, then exits."
      tr: "Platformlar programını sürekli durdurur: her deploy'da ve yeniden başlatmada. Ona kibar bir sinyal (SIGTERM) gönderir ve beklerler. Sinyali yok sayan program birkaç saniye sonra bir isteğin ortasında öldürülür. Düzgün kapanma, devam eden istekleri bitirir ve sonra çıkar."
    learn:
      en: |
        - What a signal is: Ctrl+C sends SIGINT, and `docker stop` and hosts send SIGTERM
        - `tokio::signal` waits for signals, and `tokio::select!` continues when the first of several futures finishes
        - `axum::serve(...).with_graceful_shutdown(...)` stops taking new connections and lets the running requests end
        - `#[cfg(unix)]` compiles a piece of code only on Unix systems (Linux, macOS), because SIGTERM does not exist on Windows
        - The request timeout from the security step also matters here: a request that never ends would hold up the shutdown
      tr: |
        - Sinyal nedir: Ctrl+C SIGINT gönderir, `docker stop` ve sunucular SIGTERM gönderir
        - `tokio::signal` sinyalleri bekler, `tokio::select!` birkaç future'dan ilki bitince devam eder
        - `axum::serve(...).with_graceful_shutdown(...)` yeni bağlantı almayı bırakır ve çalışan isteklerin bitmesine izin verir
        - `#[cfg(unix)]` bir kod parçasını sadece Unix sistemlerde (Linux, macOS) derler, çünkü SIGTERM Windows'ta yoktur
        - Güvenlik adımındaki istek zaman aşımı burada da önemli: hiç bitmeyen bir istek kapanmayı geciktirir
    do:
      en: |
        1. First see the problem. Build and run the image from the Docker step in the background (`docker run -d --name todo -p 8080:8080 -e API_TOKEN=change-me-please todo`), then run `time docker stop todo` (on macOS and Linux). It takes about 10 seconds: nobody handles SIGTERM, so Docker waits and then kills it. Remove it with `docker rm todo`.
        2. In `src/api.rs` replace the `serve` function with the new one below and add `shutdown_signal` after it.
        3. Run `cargo run -- serve` and press Ctrl+C. You see `shutting down` and `stopped cleanly`, and the program exits at once.
        4. Rebuild the image (`docker build -t todo .`), run it again in the background and time `docker stop todo`. It now stops in a moment.
        5. Commit and push: `git add .`, `git commit -m "Shut down gracefully"`, `git push`. Render redeploys, and each future deploy now ends requests politely.
        6. Where to go next: put the data in Postgres with sqlx so it survives restarts, add user accounts, add rate limiting, run `cargo audit` in CI, and read the rest of the Rust Book (traits, generics, lifetimes, async). The Rust cheatsheet in the learning center covers them.
      tr: |
        1. Önce sorunu gör. Docker adımındaki image'ı derle ve arka planda çalıştır (`docker run -d --name todo -p 8080:8080 -e API_TOKEN=change-me-please todo`), sonra `time docker stop todo` çalıştır (macOS ve Linux'ta). Yaklaşık 10 saniye sürer: SIGTERM'i kimse ele almıyor, bu yüzden Docker bekler ve sonra öldürür. `docker rm todo` ile sil.
        2. `src/api.rs` içinde `serve` fonksiyonunu aşağıdaki yenisiyle değiştir ve ardına `shutdown_signal` ekle.
        3. `cargo run -- serve` çalıştır ve Ctrl+C'ye bas. `shutting down` ve `stopped cleanly` yazısını görürsün ve program hemen çıkar.
        4. Image'ı yeniden derle (`docker build -t todo .`), tekrar arka planda çalıştır ve `docker stop todo` süresini ölç. Artık bir anda duruyor.
        5. Commit'le ve push et: `git add .`, `git commit -m "Shut down gracefully"`, `git push`. Render yeniden deploy eder ve bundan sonraki her deploy istekleri kibarca bitirir.
        6. Sonra nereye: veriyi yeniden başlatmalardan etkilenmesin diye sqlx ile Postgres'e koy, kullanıcı hesapları ekle, rate limiting ekle, `cargo audit`'i CI'da çalıştır ve Rust Book'un kalanını oku (trait'ler, generic'ler, lifetime'lar, async). Öğrenme merkezindeki Rust kopya kâğıdı bunları kapsar.
    code:
      - file: "src/api.rs (replace serve, add shutdown_signal)"
        lang: rust
        text: |
          /// Binds to all interfaces so a container or a host can reach the server.
          pub async fn serve(db: Db, token: &str, port: u16) -> std::io::Result<()> {
              let listener = tokio::net::TcpListener::bind(("0.0.0.0", port)).await?;
              tracing::info!("listening on http://{}", listener.local_addr()?);
              axum::serve(listener, router(db, token))
                  .with_graceful_shutdown(shutdown_signal())
                  .await?;
              tracing::info!("stopped cleanly");
              Ok(())
          }

          /// Finishes when someone presses Ctrl+C or the platform sends SIGTERM ("please stop").
          async fn shutdown_signal() {
              let ctrl_c = async {
                  let _ = tokio::signal::ctrl_c().await;
              };

              #[cfg(unix)]
              let terminate = async {
                  use tokio::signal::unix::{SignalKind, signal};
                  match signal(SignalKind::terminate()) {
                      Ok(mut stream) => {
                          stream.recv().await;
                      }
                      // Could not listen for SIGTERM: just never finish on that branch.
                      Err(_) => std::future::pending::<()>().await,
                  }
              };
              #[cfg(not(unix))]
              let terminate = std::future::pending::<()>();

              tokio::select! {
                  _ = ctrl_c => {},
                  _ = terminate => {},
              }
              tracing::info!("shutting down: finishing the requests in progress");
          }
      - file: "terminal"
        lang: sh
        text: |
          docker run -d --name todo -p 8080:8080 -e API_TOKEN=change-me-please todo
          time docker stop todo
          docker rm todo
    mistakes:
      - problem:
          en: "`docker stop` always takes 10 seconds."
          tr: "`docker stop` her seferinde 10 saniye sürüyor."
        fix:
          en: "Docker sends SIGTERM and, after 10 seconds, SIGKILL. If the program does not handle SIGTERM, the wait is always the full 10 seconds. Handle it as shown. Also write the command as `CMD [\"todo\", \"serve\"]` (a list), so `todo` itself, not a shell, receives the signal."
          tr: "Docker SIGTERM gönderir ve 10 saniye sonra SIGKILL. Program SIGTERM'i ele almıyorsa bekleme hep tam 10 saniyedir. Gösterildiği gibi ele al. Komutu ayrıca `CMD [\"todo\", \"serve\"]` (bir liste) olarak yaz; böylece sinyali bir kabuk değil `todo`'nun kendisi alır."
      - problem:
          en: "The shutdown seems stuck after Ctrl+C."
          tr: "Ctrl+C'den sonra kapanma takılmış gibi."
        fix:
          en: "A graceful shutdown waits for running requests. A client that keeps a connection busy can delay it. Keep the timeout layer, and if needed press Ctrl+C a second time to end the process."
          tr: "Düzgün kapanma çalışan istekleri bekler. Bağlantıyı meşgul tutan bir istemci onu geciktirebilir. Zaman aşımı katmanını koru, gerekirse süreci bitirmek için Ctrl+C'ye ikinci kez bas."
      - problem:
          en: "The code does not compile on Windows because of `tokio::signal::unix`."
          tr: "Kod, `tokio::signal::unix` yüzünden Windows'ta derlenmiyor."
        fix:
          en: "Keep the Unix-only part under `#[cfg(unix)]` and give other systems the `#[cfg(not(unix))]` version, as shown. Windows then only reacts to Ctrl+C."
          tr: "Sadece Unix'e özel kısmı `#[cfg(unix)]` altında tut ve diğer sistemlere gösterildiği gibi `#[cfg(not(unix))]` sürümünü ver. Windows o zaman sadece Ctrl+C'ye tepki verir."
    quiz:
      - q:
          en: "What happens to a program that ignores SIGTERM when you run `docker stop`?"
          tr: "SIGTERM'i yok sayan bir program için `docker stop` çalıştırınca ne olur?"
        options:
          en:
            - "Docker waits (10 seconds by default), then kills it with SIGKILL"
            - "It stops at once"
            - "Docker leaves it running forever"
          tr:
            - "Docker bekler (varsayılan 10 saniye), sonra SIGKILL ile öldürür"
            - "Hemen durur"
            - "Docker onu sonsuza dek çalışır bırakır"
        answer: 0
        why:
          en: "`docker stop` sends SIGTERM, waits for the grace period and then sends SIGKILL, which cannot be ignored. Handling SIGTERM lets the program finish its work first."
          tr: "`docker stop` SIGTERM gönderir, bekleme süresini bekler ve sonra yok sayılamayan SIGKILL gönderir. SIGTERM'i ele almak programın önce işini bitirmesini sağlar."
    sources:
      - title: "axum, with_graceful_shutdown"
        url: https://docs.rs/axum/latest/axum/serve/struct.Serve.html#method.with_graceful_shutdown
      - title: "tokio, signal module"
        url: https://docs.rs/tokio/latest/tokio/signal/index.html
      - title: "Docker, docker container stop"
        url: https://docs.docker.com/reference/cli/docker/container/stop/
