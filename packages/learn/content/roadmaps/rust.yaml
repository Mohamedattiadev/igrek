          en: "A client asks for `GET /tasks/999` and there is no such task. What should the API answer?"
          tr: "Bir istemci `GET /tasks/999` istiyor ve böyle bir görev yok. API ne cevap vermeli?"
        options:
          en:
            - "404 with a JSON error message"
            - "200 with an empty body"
            - "A crash, so the client sees the problem"
          tr:
            - "JSON hata mesajıyla 404"
