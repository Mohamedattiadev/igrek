      - file: "src/error.rs"
        lang: rust
        text: |
          use std::fmt;
          use std::io;

          /// Everything that can go wrong in the todo tool.
          #[derive(Debug)]
          pub enum TodoError {
              EmptyTitle,
              TitleTooLong { max: usize },
              NotFound(i64),
              Io(io::Error),
              Json(serde_json::Error),
              Db(rusqlite::Error),
              Config(&'static str),
          }

          impl fmt::Display for TodoError {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  match self {
                      TodoError::EmptyTitle => write!(f, "the title is empty"),
                      TodoError::TitleTooLong { max } => {
                          write!(f, "the title is longer than {max} characters")
                      }
                      TodoError::NotFound(id) => write!(f, "no task with id {id}"),
                      TodoError::Io(e) => write!(f, "file problem: {e}"),
                      TodoError::Json(e) => write!(f, "the data file is not valid JSON: {e}"),
                      TodoError::Db(e) => write!(f, "database problem: {e}"),
                      TodoError::Config(message) => write!(f, "bad configuration: {message}"),
                  }
              }
          }

          impl std::error::Error for TodoError {}

          // These two let `?` turn an io::Error or a serde_json::Error into a TodoError.
          impl From<io::Error> for TodoError {
              fn from(e: io::Error) -> Self {
                  TodoError::Io(e)
              }
          }

          impl From<serde_json::Error> for TodoError {
              fn from(e: serde_json::Error) -> Self {
                  TodoError::Json(e)
              }
          }

          impl From<rusqlite::Error> for TodoError {
              fn from(e: rusqlite::Error) -> Self {
                  TodoError::Db(e)
              }
          }
      - file: "src/api.rs"
        lang: rust
        text: |
          use std::sync::{Arc, Mutex, MutexGuard};
          use std::time::Duration;

          use axum::extract::{DefaultBodyLimit, Path, Query, Request, State};
          use axum::http::{StatusCode, header};
          use axum::middleware::{self, Next};
          use axum::response::{IntoResponse, Response};
          use axum::routing::{delete, get, post};
          use axum::{Json, Router};
          use serde::Deserialize;
          use serde_json::json;
          use tower_http::timeout::TimeoutLayer;

          use crate::db::Db;
          use crate::error::TodoError;
          use crate::model::{Filter, Task};

          /// Request bodies bigger than this are refused (a task is a few hundred bytes).
          const MAX_BODY_BYTES: usize = 4 * 1024;
          /// The most tasks one list request may return.
          const MAX_PAGE: i64 = 100;
          /// A request that takes longer than this is cut off.
          const REQUEST_TIMEOUT: Duration = Duration::from_secs(5);

          /// What every handler can reach. Clone is cheap: it copies the Arcs, not the data.
          #[derive(Clone)]
          pub struct AppState {
              db: Arc<Mutex<Db>>,
              token: Arc<str>,
          }

          impl AppState {
              /// A rusqlite Connection can be used by one thread at a time, so it sits behind a Mutex.
              fn db(&self) -> MutexGuard<'_, Db> {
                  // If another request panicked while holding the lock, the data is still fine.
                  self.db
                      .lock()
                      .unwrap_or_else(|poisoned| poisoned.into_inner())
              }
          }

          /// Anyone may read; changing data needs `Authorization: Bearer <token>`.
          pub fn router(db: Db, token: &str) -> Router {
              let state = AppState {
                  db: Arc::new(Mutex::new(db)),
                  token: token.into(),
              };

              let read = Router::new()
                  .route("/healthz", get(healthz))
                  .route("/tasks", get(list_tasks))
                  .route("/tasks/{id}", get(get_task));

              let write = Router::new()
                  .route("/tasks", post(create_task))
                  .route("/tasks/{id}", delete(delete_task))
                  .route("/tasks/{id}/done", post(finish_task))
                  .route_layer(middleware::from_fn_with_state(state.clone(), require_token));

              read.merge(write)
                  .layer(DefaultBodyLimit::max(MAX_BODY_BYTES))
                  .layer(TimeoutLayer::with_status_code(
                      StatusCode::REQUEST_TIMEOUT,
                      REQUEST_TIMEOUT,
                  ))
                  .with_state(state)
          }

          /// Lets a request through only when it carries the right bearer token.
          async fn require_token(State(state): State<AppState>, request: Request, next: Next) -> Response {
              let sent = request
                  .headers()
                  .get(header::AUTHORIZATION)
                  .and_then(|value| value.to_str().ok())
                  .and_then(|value| value.strip_prefix("Bearer "));
              if sent == Some(&*state.token) {
                  next.run(request).await
              } else {
                  (
                      StatusCode::UNAUTHORIZED,
                      Json(json!({ "error": "missing or wrong token" })),
                  )
                      .into_response()
              }
          }

          /// Binds to all interfaces so a container or a host can reach the server.
          pub async fn serve(db: Db, token: &str, port: u16) -> std::io::Result<()> {
              let listener = tokio::net::TcpListener::bind(("0.0.0.0", port)).await?;
              println!("listening on http://{}", listener.local_addr()?);
              axum::serve(listener, router(db, token)).await
          }

          #[derive(Deserialize)]
          struct NewTask {
              title: String,
          }

          #[derive(Deserialize)]
          struct ListParams {
              filter: Option<Filter>,
              limit: Option<i64>,
              offset: Option<i64>,
          }

          async fn healthz() -> Json<serde_json::Value> {
              Json(json!({ "status": "ok" }))
          }

          async fn list_tasks(
              State(state): State<AppState>,
              Query(params): Query<ListParams>,
          ) -> Result<Json<Vec<Task>>, TodoError> {
              let tasks = state.db().list(
                  params.filter.unwrap_or_default(),
                  params.limit.unwrap_or(50).clamp(1, MAX_PAGE),
                  params.offset.unwrap_or(0).max(0),
              )?;
              Ok(Json(tasks))
          }

          async fn create_task(
              State(state): State<AppState>,
              Json(body): Json<NewTask>,
          ) -> Result<(StatusCode, Json<Task>), TodoError> {
              let task = state.db().add(&body.title)?;
              Ok((StatusCode::CREATED, Json(task)))
          }

          async fn get_task(
              State(state): State<AppState>,
              Path(id): Path<i64>,
          ) -> Result<Json<Task>, TodoError> {
              Ok(Json(state.db().get(id)?))
          }

          async fn finish_task(
              State(state): State<AppState>,
              Path(id): Path<i64>,
          ) -> Result<Json<Task>, TodoError> {
              Ok(Json(state.db().mark_done(id)?))
          }

          async fn delete_task(
              State(state): State<AppState>,
              Path(id): Path<i64>,
          ) -> Result<StatusCode, TodoError> {
              state.db().remove(id)?;
              Ok(StatusCode::NO_CONTENT)
          }

          /// How a TodoError looks to a client of the API.
          impl IntoResponse for TodoError {
              fn into_response(self) -> Response {
                  let status = match &self {
                      TodoError::EmptyTitle | TodoError::TitleTooLong { .. } => StatusCode::BAD_REQUEST,
                      TodoError::NotFound(_) => StatusCode::NOT_FOUND,
                      // Our own faults: do not show file paths or SQL details to the client.
                      TodoError::Io(_) | TodoError::Json(_) | TodoError::Db(_) | TodoError::Config(_) => {
                          return (
                              StatusCode::INTERNAL_SERVER_ERROR,
                              Json(json!({ "error": "internal error" })),
                          )
                              .into_response();
                      }
                  };
                  (status, Json(json!({ "error": self.to_string() }))).into_response()
              }
          }
      - file: "src/main.rs"
        lang: rust
        text: |
          #![forbid(unsafe_code)]

          use std::path::{Path, PathBuf};
          use std::process::ExitCode;

          use clap::{Parser, Subcommand, ValueEnum};

          use todo::api;
          use todo::db::Db;
          use todo::error::TodoError;
          use todo::model::Filter;
          use todo::store;

          /// A tiny todo list.
          #[derive(Parser)]
          #[command(version)]
          struct Cli {
              /// The JSON file that keeps your tasks
              #[arg(long, global = true, env = "TODO_FILE", default_value = "todo.json")]
              file: PathBuf,

              #[command(subcommand)]
              command: Command,
          }

          #[derive(Subcommand)]
          enum Command {
              /// Add a task
              Add {
                  /// What has to be done
                  title: String,
              },
              /// Show tasks
              List {
                  /// Which tasks to show
                  #[arg(long, value_enum, default_value_t = Show::All)]
                  filter: Show,
              },
              /// Mark a task as done
              Done {
                  /// The number of the task
                  id: i64,
              },
              /// Delete a task
              Remove {
                  /// The number of the task
                  id: i64,
              },
              /// Start the web API
              Serve {
                  /// The port to listen on
                  #[arg(long, env = "PORT", default_value_t = 8080)]
                  port: u16,
                  /// The secret that is needed to change data (at least 8 characters)
                  #[arg(long, env = "API_TOKEN", hide_env_values = true)]
                  token: String,
                  /// The SQLite database file
                  #[arg(long, env = "DATABASE_PATH", default_value = "todo.db")]
                  database: String,
              },
          }

          /// The same choices as `Filter`, but with the extra derive clap needs.
          #[derive(Clone, Copy, ValueEnum)]
          enum Show {
              All,
              Open,
              Done,
          }

          impl From<Show> for Filter {
              fn from(show: Show) -> Self {
                  match show {
                      Show::All => Filter::All,
                      Show::Open => Filter::Open,
                      Show::Done => Filter::Done,
                  }
              }
          }

          fn main() -> ExitCode {
              match run(Cli::parse()) {
                  Ok(()) => ExitCode::SUCCESS,
                  Err(e) => {
                      eprintln!("error: {e}");
                      ExitCode::FAILURE
                  }
              }
          }

          fn run(cli: Cli) -> Result<(), TodoError> {
              match cli.command {
                  Command::Serve {
                      port,
                      token,
                      database,
                  } => serve(port, &token, &database),
                  command => run_on_file(command, &cli.file),
              }
          }

          fn serve(port: u16, token: &str, database: &str) -> Result<(), TodoError> {
              let db = Db::open(database)?;
              let runtime = tokio::runtime::Runtime::new()?;
              runtime.block_on(api::serve(db, token, port))?;
              Ok(())
          }

          /// The commands that work on the JSON file.
          fn run_on_file(command: Command, file: &Path) -> Result<(), TodoError> {
              let mut list = store::load(file)?;
              match command {
                  Command::Add { title } => {
                      let id = list.add(&title)?;
                      store::save(file, &list)?;
                      println!("added #{id}");
                  }
                  Command::List { filter } => {
                      let tasks = list.list(filter.into());
                      if tasks.is_empty() {
                          println!("no tasks");
                      }
                      for task in tasks {
                          let mark = if task.done { "x" } else { " " };
                          println!("[{mark}] {:>3}  {}", task.id, task.title);
                      }
                  }
                  Command::Done { id } => {
                      list.mark_done(id)?;
                      store::save(file, &list)?;
                      println!("done #{id}");
                  }
                  Command::Remove { id } => {
                      list.remove(id)?;
                      store::save(file, &list)?;
                      println!("removed #{id}");
                  }
                  Command::Serve { .. } => unreachable!("serve is handled in run"),
              }
              Ok(())
          }
      - file: "tests/api.rs"
        lang: rust
        text: |
          #![allow(clippy::unwrap_used)] // tests may unwrap: a panic is how a test fails

          use axum::Router;
          use axum::body::{Body, to_bytes};
          use axum::http::{Method, Request, StatusCode};
          use tower::ServiceExt; // gives us .oneshot(request)

          use todo::api::router;
          use todo::db::Db;

          const TOKEN: &str = "test-token-1234";

          fn app() -> Router {
              router(Db::open_in_memory().unwrap(), TOKEN)
          }

          /// Sends one request with the right token and returns the status and the body text.
          async fn send(app: &Router, method: Method, uri: &str, body: Option<&str>) -> (StatusCode, String) {
              send_as(app, method, uri, body, Some(TOKEN)).await
          }

          /// Like `send`, but you choose the token (or none at all).
          async fn send_as(
              app: &Router,
              method: Method,
              uri: &str,
              body: Option<&str>,
              token: Option<&str>,
          ) -> (StatusCode, String) {
              let mut builder = Request::builder().method(method).uri(uri);
              if let Some(token) = token {
                  builder = builder.header("authorization", format!("Bearer {token}"));
              }
              let body = match body {
                  Some(json) => {
                      builder = builder.header("content-type", "application/json");
                      Body::from(json.to_string())
                  }
                  None => Body::empty(),
              };
              let response = app
                  .clone()
                  .oneshot(builder.body(body).unwrap())
                  .await
                  .unwrap();
              let status = response.status();
              let bytes = to_bytes(response.into_body(), 1024 * 1024).await.unwrap();
              (status, String::from_utf8(bytes.to_vec()).unwrap())
          }

          #[tokio::test]
          async fn healthz_says_ok() {
              let (status, body) = send(&app(), Method::GET, "/healthz", None).await;
              assert_eq!(status, StatusCode::OK);
              assert!(body.contains("ok"));
          }

          #[tokio::test]
          async fn create_then_read_a_task() {
              let app = app();
              let (status, body) = send(
                  &app,
                  Method::POST,
                  "/tasks",
                  Some(r#"{"title":"Buy milk"}"#),
              )
              .await;
              assert_eq!(status, StatusCode::CREATED);
              assert!(body.contains(r#""title":"Buy milk""#));

              let (status, body) = send(&app, Method::GET, "/tasks/1", None).await;
              assert_eq!(status, StatusCode::OK);
              assert!(body.contains(r#""done":false"#));
          }

          #[tokio::test]
          async fn bad_input_gets_a_4xx_not_a_crash() {
              let app = app();
              let (status, _) = send(&app, Method::POST, "/tasks", Some(r#"{"title":"   "}"#)).await;
              assert_eq!(status, StatusCode::BAD_REQUEST);
              let (status, _) = send(&app, Method::POST, "/tasks", Some("{not json")).await;
              assert_eq!(status, StatusCode::BAD_REQUEST);
              let (status, _) = send(&app, Method::GET, "/tasks/999", None).await;
              assert_eq!(status, StatusCode::NOT_FOUND);
          }

          #[tokio::test]
          async fn changing_data_needs_the_token() {
              let app = app();
              let body = Some(r#"{"title":"Buy milk"}"#);
              let (status, _) = send_as(&app, Method::POST, "/tasks", body, None).await;
              assert_eq!(status, StatusCode::UNAUTHORIZED);
              let (status, _) = send_as(&app, Method::POST, "/tasks", body, Some("wrong")).await;
              assert_eq!(status, StatusCode::UNAUTHORIZED);
              // Reading stays open.
              let (status, _) = send_as(&app, Method::GET, "/tasks", None, None).await;
              assert_eq!(status, StatusCode::OK);
          }

          #[tokio::test]
          async fn a_huge_body_is_refused() {
              let big = format!(r#"{{"title":"{}"}}"#, "a".repeat(10_000));
              let (status, _) = send(&app(), Method::POST, "/tasks", Some(&big)).await;
              assert_eq!(status, StatusCode::PAYLOAD_TOO_LARGE);
          }

          #[tokio::test]
          async fn a_title_over_the_limit_is_refused() {
              let long = format!(r#"{{"title":"{}"}}"#, "a".repeat(201));
              let (status, _) = send(&app(), Method::POST, "/tasks", Some(&long)).await;
              assert_eq!(status, StatusCode::BAD_REQUEST);
          }

          #[tokio::test]
          async fn paging_numbers_are_clamped_not_trusted() {
              // Negative and huge values must not break the query.
              let (status, _) = send(&app(), Method::GET, "/tasks?limit=-5&offset=-1", None).await;
              assert_eq!(status, StatusCode::OK);
              let (status, _) = send(&app(), Method::GET, "/tasks?limit=999999999999", None).await;
              assert_eq!(status, StatusCode::OK);
          }
      - file: "terminal"
        lang: sh
        text: |
          export API_TOKEN=$(openssl rand -hex 24)
          cargo run -- serve
      - file: "terminal (second terminal, use the same token)"
        lang: sh
        text: |
          export API_TOKEN=paste-the-token-of-the-first-terminal-here
          curl -i -X POST localhost:8080/tasks -H 'content-type: application/json' -d '{"title":"Buy milk"}'
          curl -i -X POST localhost:8080/tasks -H 'content-type: application/json' -H "authorization: Bearer $API_TOKEN" -d '{"title":"Buy milk"}'
          curl localhost:8080/tasks
    mistakes:
      - problem:
          en: "Putting the token in the code or in git."
          tr: "Token'ı koda ya da git'e koymak."
        fix:
          en: "Anything in git is public to everyone with access, forever. Read secrets from environment variables (as `--token` does with `API_TOKEN`) and set them in the host's settings. If a secret leaked, make a new one."
          tr: "Git'teki her şey erişimi olan herkese sonsuza dek açıktır. Gizli bilgileri ortam değişkenlerinden oku (`--token`'ın `API_TOKEN` ile yaptığı gibi) ve sunucunun ayarlarından gir. Bir sır sızdıysa yenisini üret."
      - problem:
          en: "Trusting numbers from the client, such as passing `limit` straight into `LIMIT`."
          tr: "İstemciden gelen sayılara güvenmek; örneğin `limit`'i doğrudan `LIMIT`'e vermek."
        fix:
          en: "Clamp every number to a range you accept, as `.clamp(1, MAX_PAGE)` does, or one request can ask for the whole database."
          tr: "Her sayıyı kabul ettiğin bir aralığa sıkıştır, `.clamp(1, MAX_PAGE)`'in yaptığı gibi; yoksa tek bir istek bütün veritabanını isteyebilir."
      - problem:
          en: "`cargo clippy` complains about `unwrap` inside the tests."
          tr: "`cargo clippy` testlerin içindeki `unwrap` için şikayet ediyor."
        fix:
          en: "Make sure `clippy.toml` exists in the project root with `allow-unwrap-in-tests = true`, and that a test file whose helper functions use `unwrap` (like `tests/api.rs`) starts with `#![allow(clippy::unwrap_used)]` as shown."
          tr: "Proje kökünde `allow-unwrap-in-tests = true` içeren `clippy.toml` olduğundan ve yardımcı fonksiyonları `unwrap` kullanan bir test dosyasının (`tests/api.rs` gibi) gösterildiği gibi `#![allow(clippy::unwrap_used)]` ile başladığından emin ol."
    quiz:
      - q:
          en: "Why is `unwrap()` on a value that comes from a user a problem?"
          tr: "Kullanıcıdan gelen bir değerde `unwrap()` neden sorundur?"
        options:
          en:
            - "A bad value makes it panic, so anyone can crash the request on purpose"
            - "It makes the program slower"
            - "It is not allowed by the compiler"
          tr:
            - "Kötü bir değer panic verdirir, yani herkes isteği bilerek çökertebilir"
            - "Programı yavaşlatır"
            - "Derleyici buna izin vermez"
        answer: 0
        why:
          en: "`unwrap()` panics on `Err` and `None`. Input from outside can always be wrong, so handle it with `?`, `match` or a clear error response instead."
          tr: "`unwrap()` `Err` ve `None` durumunda panic verir. Dışarıdan gelen girdi her zaman yanlış olabilir; bu yüzden onu `?`, `match` ya da anlaşılır bir hata cevabıyla ele al."
      - q:
          en: "The `limit` query parameter is clamped to 1 to 100. What attack does this prevent?"
          tr: "`limit` sorgu parametresi 1 ile 100 arasına sıkıştırılıyor. Bu hangi saldırıyı önler?"
        options:
          en:
            - "One request asking for the whole table and exhausting memory and time"
            - "SQL injection"
            - "Guessing the token"
          tr:
            - "Tek bir isteğin bütün tabloyu isteyip bellek ve zamanı tüketmesi"
            - "SQL injection"
            - "Token'ı tahmin etme"
        answer: 0
        why:
          en: "A limit on result size protects memory and time. SQL injection is stopped by placeholders, and token guessing by a long random token."
          tr: "Sonuç boyutuna konan sınır bellek ve zamanı korur. SQL injection'ı yer tutucular, token tahminini uzun rastgele bir token durdurur."
    sources:
      - title: "axum, DefaultBodyLimit"
        url: https://docs.rs/axum/latest/axum/extract/struct.DefaultBodyLimit.html
      - title: "axum, middleware (from_fn_with_state)"
        url: https://docs.rs/axum/latest/axum/middleware/index.html
      - title: "OWASP, API Security Top 10"
        url: https://owasp.org/API-Security/editions/2023/en/0x00-header/

  - id: audit
    stage: security
    title:
      en: "Check your dependencies with cargo audit"
      tr: "cargo audit ile bağımlılıklarını kontrol etme"
    minutes: 30
    needs: [hardening]
    why:
      en: "Your program is mostly other people's code: about a hundred crates came in with axum, tokio and the others. When one of them has a known security hole, you need to hear about it. `cargo audit` compares your `Cargo.lock` with the RustSec advisory database, which lists such problems."
      tr: "Programının büyük kısmı başkalarının kodu: axum, tokio ve diğerleriyle yaklaşık yüz crate geldi. Bunlardan birinde bilinen bir güvenlik açığı olduğunda bunu duyman gerekir. `cargo audit`, `Cargo.lock` dosyanı bu tür sorunları listeleyen RustSec advisory veritabanıyla karşılaştırır."
    learn:
      en: |
        - `Cargo.lock` lists the exact version of every crate in your build, and that list is what gets checked
        - `cargo tree` shows which crate brought in which; `cargo update` moves to newer compatible versions
        - An advisory is a published report about a vulnerable or unmaintained crate, with the fixed version
        - Run the audit now and then (for example weekly), because new advisories appear for old code
      tr: |
        - `Cargo.lock` build'indeki her crate'in tam sürümünü listeler ve kontrol edilen o listedir
        - `cargo tree` hangi crate'in hangisini getirdiğini gösterir; `cargo update` daha yeni uyumlu sürümlere geçer
        - Advisory, açığı olan ya da artık bakımı yapılmayan bir crate hakkında, düzeltilmiş sürümü de içeren yayımlanmış bir rapordur
        - Denetimi ara sıra çalıştır (örneğin haftalık), çünkü eski kod için yeni advisory'ler çıkar
    do:
      en: |
        1. Install the tool once: `cargo install cargo-audit --locked`. It compiles a bit, so it takes a few minutes.
        2. In the project folder run `cargo audit`. It fetches the advisory database, scans `Cargo.lock` and prints how many crates it checked. If it finds a problem it prints the advisory, and the command ends with an error code.
        3. Look at the dependency tree: `cargo tree --depth 1` shows only the crates you added yourself.
        4. Run `cargo update`, then `cargo test` and `cargo audit` again. Updating inside the allowed version ranges is how most advisories get fixed.
        5. If an advisory has no fix yet, read it: it says whether your code is affected. To make warnings (like an unmaintained crate) fail a script too, use `cargo audit --deny warnings`.
        6. Commit the updated `Cargo.lock`: `git add Cargo.lock` and `git commit -m "Update dependencies"`.
      tr: |
        1. Aracı bir kez kur: `cargo install cargo-audit --locked`. Biraz derleme yapar, bu yüzden birkaç dakika sürer.
        2. Proje klasöründe `cargo audit` çalıştır. Advisory veritabanını indirir, `Cargo.lock` dosyasını tarar ve kaç crate kontrol ettiğini yazar. Bir sorun bulursa advisory'yi yazar ve komut hata koduyla biter.
        3. Bağımlılık ağacına bak: `cargo tree --depth 1` sadece senin eklediğin crate'leri gösterir.
        4. `cargo update`, sonra `cargo test` ve tekrar `cargo audit` çalıştır. İzin verilen sürüm aralıkları içinde güncellemek, advisory'lerin çoğunun düzeltilme yoludur.
        5. Bir advisory'nin henüz düzeltmesi yoksa oku: kodunun etkilenip etkilenmediğini söyler. Uyarıların (bakımsız crate gibi) bir betiği de başarısız yapması için `cargo audit --deny warnings` kullan.
        6. Güncellenen `Cargo.lock` dosyasını commit'le: `git add Cargo.lock` ve `git commit -m "Update dependencies"`.
    code:
      - file: "terminal"
        lang: sh
        text: |
          cargo install cargo-audit --locked
          cargo audit
          cargo tree --depth 1
          cargo update
          cargo test
          cargo audit
    mistakes:
      - problem:
          en: "`cargo audit` says it could not load `Cargo.lock`."
          tr: "`cargo audit` `Cargo.lock` dosyasını yükleyemediğini söylüyor."
        fix:
          en: "Run it in the project folder, and run `cargo build` once so `Cargo.lock` exists. An application should commit this file."
          tr: "Proje klasöründe çalıştır ve `Cargo.lock` oluşsun diye bir kez `cargo build` çalıştır. Bir uygulama bu dosyayı commit'lemeli."
      - problem:
          en: "Updating everything with `cargo update` and pushing without running the tests."
          tr: "`cargo update` ile her şeyi güncelleyip testleri çalıştırmadan push etmek."
        fix:
          en: "Even compatible updates can change behaviour. After `cargo update` always run `cargo test` (the CI in the next steps does it for you)."
          tr: "Uyumlu güncellemeler bile davranışı değiştirebilir. `cargo update`'ten sonra her zaman `cargo test` çalıştır (sonraki adımlardaki CI bunu senin için yapar)."
      - problem:
          en: "Thinking a clean audit means the program is secure."
          tr: "Temiz bir denetimin programın güvenli olduğu anlamına geldiğini sanmak."
        fix:
          en: "The audit only knows about published advisories for your dependencies. Your own mistakes (missing checks, leaked secrets) are what the earlier step and your tests are for."
          tr: "Denetim sadece bağımlılıkların için yayımlanmış advisory'leri bilir. Kendi hataların (eksik kontroller, sızan sırlar) için önceki adım ve testlerin var."
    quiz:
      - q:
          en: "What does `cargo audit` compare?"
          tr: "`cargo audit` neyi karşılaştırır?"
        options:
          en:
            - "The crate versions in `Cargo.lock` against the RustSec advisory database"
            - "Your source code against the Rust style guide"
            - "Your program's speed against the previous build"
          tr:
            - "`Cargo.lock` içindeki crate sürümlerini RustSec advisory veritabanıyla"
            - "Kaynak kodunu Rust stil rehberiyle"
            - "Programının hızını önceki build ile"
        answer: 0
        why:
          en: "It reads the exact versions you ship and looks them up in the list of known vulnerabilities. It does not read your own code."
          tr: "Yayınladığın tam sürümleri okur ve bilinen açıklar listesinde arar. Senin kendi kodunu okumaz."
    sources:
      - title: "RustSec, cargo-audit"
        url: https://docs.rs/cargo-audit/latest/cargo_audit/
      - title: "RustSec advisory database"
        url: https://rustsec.org/
      - title: "The Cargo Book, cargo tree"
        url: https://doc.rust-lang.org/cargo/commands/cargo-tree.html

  - id: speed
    stage: performance
    title:
      en: "Release builds and measuring speed"
      tr: "Release build ve hızı ölçme"
    minutes: 40
    needs: [audit]
    why:
      en: "Rust is fast only when you ask for it: the default `cargo run` makes a slow debug build. Before you change anything to be faster, measure, because the slow part is rarely where you guess."
      tr: "Rust sadece sen isteyince hızlıdır: varsayılan `cargo run` yavaş bir debug build üretir. Hızlansın diye bir şeyi değiştirmeden önce ölç; çünkü yavaş kısım nadiren tahmin ettiğin yerdedir."
    learn:
      en: |
        - Debug build (`cargo build`) compiles fast and runs slowly; release build (`cargo build --release`) compiles slowly and runs fast. Real programs are shipped as release builds
        - `[profile.release]` settings: `lto = "thin"` (optimizes across crates) and `strip = true` (removes debug symbols, a smaller file)
        - Measuring with `std::time::Instant`: run it several times, and look at the proportions, not the exact numbers
        - A database lesson: every commit waits for the disk, so many inserts in one transaction are far faster than one by one. WAL mode also helps
        - For careful, repeatable benchmarks there are crates such as criterion; for most programs a simple timer is enough to find the big problems
      tr: |
        - Debug build (`cargo build`) hızlı derlenir ve yavaş çalışır; release build (`cargo build --release`) yavaş derlenir ve hızlı çalışır. Gerçek programlar release build olarak yayınlanır
        - `[profile.release]` ayarları: `lto = "thin"` (crate'ler arası optimizasyon) ve `strip = true` (debug sembollerini siler, dosya küçülür)
        - `std::time::Instant` ile ölçme: birkaç kez çalıştır ve tam sayılara değil oranlara bak
        - Bir veritabanı dersi: her commit diski bekler, bu yüzden tek bir transaction içinde çok ekleme, tek tek eklemekten çok daha hızlıdır. WAL modu da yardımcı olur
        - Dikkatli ve tekrarlanabilir benchmark'lar için criterion gibi crate'ler var; çoğu program için büyük sorunları bulmaya basit bir zamanlayıcı yeter
    do:
      en: |
        1. Add the release profile to the end of `Cargo.toml` (below).
        2. In `src/db.rs` make the two changes below: `open` switches the file database to WAL mode, and the new `add_many` adds many tasks inside one transaction.
        3. Create `examples/timing.rs`. It builds 50 000 tasks and writes them to JSON, then adds 500 tasks to a SQLite file one by one and again in one transaction.
        4. Run it as a debug build: `cargo run --example timing`. Then as a release build: `cargo run --release --example timing`. The first release build is slow; that is normal. Compare the numbers.
        5. Build the real program with `cargo build --release` and look at the file in `target/release/` (`todo`, or `todo.exe` on Windows). Compare its size with the one in `target/debug/`.
        6. Run `cargo test` again, then commit: `git add .` and `git commit -m "Release profile and timing"`.
      tr: |
        1. Release profilini `Cargo.toml` sonuna ekle (aşağıda).
        2. `src/db.rs` içinde aşağıdaki iki değişikliği yap: `open` dosya veritabanını WAL moduna alır, yeni `add_many` ise çok görevi tek bir transaction içinde ekler.
        3. `examples/timing.rs` dosyasını oluştur. 50 000 görev üretip JSON'a yazar, sonra bir SQLite dosyasına 500 görevi tek tek ve bir de tek transaction içinde ekler.
        4. Debug build olarak çalıştır: `cargo run --example timing`. Sonra release build olarak: `cargo run --release --example timing`. İlk release build yavaştır, normal. Sayıları karşılaştır.
        5. Gerçek programı `cargo build --release` ile derle ve `target/release/` içindeki dosyaya bak (`todo`, Windows'ta `todo.exe`). Boyutunu `target/debug/` içindekiyle karşılaştır.
        6. `cargo test`'i tekrar çalıştır, sonra commit'le: `git add .` ve `git commit -m "Release profile and timing"`.
    code:
      - file: "Cargo.toml (add at the end)"
        lang: toml
        text: |
          [profile.release]
          lto = "thin"
          strip = true
      - file: "src/db.rs (replace the open function)"
        lang: rust
        text: |
          /// Opens (and creates, if needed) a database file.
          pub fn open(path: &str) -> Result<Db, TodoError> {
              let conn = Connection::open(path)?;
              // WAL keeps readers and the writer out of each other's way and makes writes cheaper.
              conn.pragma_update(None, "journal_mode", "WAL")?;
              Db::init(conn)
          }
      - file: "src/db.rs (add this method inside impl Db)"
        lang: rust
        text: |
          /// Adds many tasks inside one transaction. One commit instead of one per task.
          pub fn add_many(&mut self, titles: &[String]) -> Result<usize, TodoError> {
              let tx = self.conn.transaction()?;
              {
                  let mut stmt = tx.prepare_cached("INSERT INTO tasks (title) VALUES (?1)")?;
                  for title in titles {
                      stmt.execute(params![clean_title(title)?])?;
                  }
              }
              tx.commit()?;
              Ok(titles.len())
          }
      - file: "examples/timing.rs"
        lang: rust
        text: |
          //! Run with: cargo run --release --example timing
          use std::time::Instant;

          use todo::db::Db;
          use todo::error::TodoError;
          use todo::model::{Filter, TaskList};

          fn main() -> Result<(), TodoError> {
              // 1. The JSON list: add 50 000 tasks, filter them, write them to a string.
              let start = Instant::now();
              let mut list = TaskList::new();
              for i in 0..50_000 {
                  list.add(&format!("task number {i}"))?;
              }
              let open = list.list(Filter::Open).len();
              let json = serde_json::to_string(&list)?;
              println!(
                  "json:   {open} tasks, {} bytes, {:?}",
                  json.len(),
                  start.elapsed()
              );

              // 2. SQLite: 500 inserts one by one, then 500 in one transaction.
              let dir = std::env::temp_dir().join(format!("todo-timing-{}", std::process::id()));
              std::fs::create_dir_all(&dir)?;
              let path = dir.join("timing.db");
              let mut db = Db::open(&path.to_string_lossy())?;
              let titles: Vec<String> = (0..500).map(|i| format!("task {i}")).collect();

              let start = Instant::now();
              for title in &titles {
                  db.add(title)?;
              }
              println!("sqlite: one by one       {:?}", start.elapsed());

              let start = Instant::now();
              db.add_many(&titles)?;
              println!("sqlite: one transaction  {:?}", start.elapsed());

              std::fs::remove_dir_all(&dir)?;
              Ok(())
          }
      - file: "terminal"
        lang: sh
        text: |
          cargo run --example timing
          cargo run --release --example timing
          cargo build --release
          ls -lh target/debug/todo target/release/todo
      - file: "example output (your numbers will differ)"
        lang: text
        text: |
          debug:    json: 50000 tasks, 2677811 bytes, 448ms
          release:  json: 50000 tasks, 2677811 bytes, 11ms

          sqlite, one by one (500 inserts)    2.5 s
          sqlite, one transaction (500)       3 ms
          debug binary 47 MB, release binary 5 MB
    mistakes:
      - problem:
          en: "Judging speed from `cargo run`, and finding Rust slow."
          tr: "Hızı `cargo run`'dan yargılayıp Rust'ı yavaş bulmak."
        fix:
          en: "Always time `--release` builds. In the example the same JSON work is about forty times faster in release."
          tr: "Zamanı her zaman `--release` build'lerde ölç. Örnekte aynı JSON işi release'de yaklaşık kırk kat daha hızlı."
      - problem:
          en: "Setting `lto = true` and `codegen-units = 1` and then the build is killed on a small machine or server."
          tr: "`lto = true` ve `codegen-units = 1` ayarlayıp küçük bir makinede ya da sunucuda build'in öldürülmesi."
        fix:
          en: "Those settings make the smallest and fastest binary, but they need much more memory and time. When a Docker build with 512 MB of memory was killed, `lto = \"thin\"` and one build job fixed it. Choose what your build machine can bear."
          tr: "O ayarlar en küçük ve en hızlı binary'yi verir ama çok daha fazla bellek ve zaman ister. 512 MB bellekli bir Docker build'i öldürüldüğünde `lto = \"thin\"` ve tek build işi sorunu çözdü. Build makinenin kaldırabileceğini seç."
      - problem:
          en: "Optimizing without measuring, or trusting one single run."
          tr: "Ölçmeden optimize etmek ya da tek bir çalıştırmaya güvenmek."
        fix:
          en: "Run the timing several times and change one thing at a time. The disk, other programs and the cache change the numbers. Look for big ratios, like 11 ms against 448 ms."
          tr: "Zamanlamayı birkaç kez çalıştır ve her seferinde tek bir şeyi değiştir. Disk, diğer programlar ve önbellek sayıları değiştirir. 448 ms'ye karşı 11 ms gibi büyük oranlara bak."
    quiz:
      - q:
          en: "Why is adding 500 tasks in one transaction so much faster than adding them one by one?"
          tr: "500 görevi tek transaction içinde eklemek, onları tek tek eklemekten neden çok daha hızlı?"
        options:
          en:
            - "There is one commit (one wait for the disk) instead of 500"
            - "SQLite skips the checks in a transaction"
            - "The release build only speeds up transactions"
          tr:
            - "500 yerine tek commit var (diski tek kez bekler)"
            - "SQLite transaction içinde kontrolleri atlar"
            - "Release build sadece transaction'ları hızlandırır"
        answer: 0
        why:
          en: "Each commit must reach the disk safely, and that wait dominates. One transaction pays it once."
          tr: "Her commit'in diske güvenle ulaşması gerekir ve baskın olan bu bekleyiştir. Tek transaction bunu bir kez öder."
    sources:
      - title: "The Cargo Book, profiles"
        url: https://doc.rust-lang.org/cargo/reference/profiles.html
      - title: "SQLite, write-ahead logging"
        url: https://www.sqlite.org/wal.html
      - title: "std, Instant"
        url: https://doc.rust-lang.org/std/time/struct.Instant.html

  - id: docker
    stage: packaging
    title:
      en: "Package a small Docker image"
      tr: "Küçük bir Docker image'ı paketleme"
    minutes: 45
    needs: [speed]
    why:
      en: "A host needs your program in one self-contained box that runs the same everywhere. A Docker image is that box. With a multi-stage build the Rust toolchain stays in a first stage, and the final image holds only the finished program, so it is tiny."
      tr: "Bir sunucu programını her yerde aynı çalışan, kendi kendine yeten tek bir kutuda ister. Docker image'ı o kutudur. Çok aşamalı (multi-stage) bir build'de Rust araç zinciri ilk aşamada kalır ve son image sadece bitmiş programı taşır, bu yüzden küçücüktür."
    learn:
      en: |
        - `cargo build --release --locked` makes the optimized program, using exactly the versions in `Cargo.lock`
        - A multi-stage Dockerfile: stage one compiles, stage two copies only the finished program into a small base (Alpine Linux)
        - The container runs as a normal user (`USER app`), not as root, so a bug does less damage
        - The server reads `PORT` and `API_TOKEN` from environment variables and listens on `0.0.0.0` (all interfaces), which a container needs
        - `.dockerignore` keeps the huge `target` folder and your data files out of the build
      tr: |
        - `cargo build --release --locked` optimize edilmiş programı, tam olarak `Cargo.lock` içindeki sürümlerle üretir
        - Çok aşamalı Dockerfile: ilk aşama derler, ikinci aşama sadece bitmiş programı küçük bir tabana (Alpine Linux) kopyalar
        - Container normal bir kullanıcı olarak çalışır (`USER app`), root olarak değil; böylece bir hata daha az zarar verir
        - Sunucu `PORT` ve `API_TOKEN` değerlerini ortam değişkenlerinden okur ve `0.0.0.0` (tüm arayüzler) üzerinde dinler; container'ın ihtiyacı budur
        - `.dockerignore` kocaman `target` klasörünü ve veri dosyalarını build'in dışında tutar
    do:
      en: |
        1. Install Docker (docs.docker.com/get-started/get-docker) and check `docker --version`.
        2. Create `Dockerfile` and `.dockerignore` in the project root (below). Read the Dockerfile from the top: `FROM ... AS build` is stage one, the second `FROM` is the final image.
        3. Build the image: `docker build -t todo .`. The first build compiles everything and takes several minutes. It uses one build job on purpose, to need little memory.
        4. Look at the size with `docker images todo`. It is about 20 MB here, while the Rust build image is over a gigabyte.
        5. Run it: `docker run --rm -p 8080:8080 -e API_TOKEN=change-me-please todo`. If port 8080 is taken on your computer, use `-p 18080:8080` and call port 18080.
        6. In another terminal call `curl -i localhost:8080/readyz`, create a task with the token (see the hardening step) and list it. Stop the container with Ctrl+C.
        7. Commit: `git add .` and `git commit -m "Add a Dockerfile"`.
      tr: |
        1. Docker'ı kur (docs.docker.com/get-started/get-docker) ve `docker --version` ile kontrol et.
        2. Proje kökünde `Dockerfile` ve `.dockerignore` dosyalarını oluştur (aşağıda). Dockerfile'ı yukarıdan oku: `FROM ... AS build` ilk aşamadır, ikinci `FROM` son image'dır.
        3. Image'ı derle: `docker build -t todo .`. İlk build her şeyi derler ve birkaç dakika sürer. Az bellek gereksin diye bilerek tek build işi kullanır.
        4. Boyutuna `docker images todo` ile bak. Burada yaklaşık 20 MB, Rust build image'ı ise bir gigabyte'ın üzerinde.
        5. Çalıştır: `docker run --rm -p 8080:8080 -e API_TOKEN=change-me-please todo`. Bilgisayarında 8080 doluysa `-p 18080:8080` kullan ve 18080 portuna istek at.
        6. Başka bir terminalde `curl -i localhost:8080/readyz` çağır, token ile bir görev oluştur (güvenlik adımına bak) ve listele. Container'ı Ctrl+C ile durdur.
        7. Commit'le: `git add .` ve `git commit -m "Add a Dockerfile"`.
    code:
      - file: "Dockerfile"
        lang: dockerfile
        text: |
          # Stage 1: build the program with the Rust toolchain
          FROM rust:1.99-alpine AS build
          RUN apk add --no-cache musl-dev
          WORKDIR /app
          COPY Cargo.toml Cargo.lock ./
          COPY src ./src
          RUN CARGO_BUILD_JOBS=1 cargo build --release --locked

          # Stage 2: a tiny image that only holds the finished program
          FROM alpine:3
          RUN adduser -D -u 10001 app && mkdir /data && chown app /data
          USER app
          COPY --from=build /app/target/release/todo /usr/local/bin/todo
          ENV DATABASE_PATH=/data/todo.db
          EXPOSE 8080
          CMD ["todo", "serve"]
      - file: ".dockerignore"
        lang: text
        text: |
          target
          .git
          *.db
          *.db-shm
          *.db-wal
          todo.json
      - file: "terminal"
        lang: sh
        text: |
          docker build -t todo .
          docker images todo
          docker run --rm -p 8080:8080 -e API_TOKEN=change-me-please todo
    mistakes:
      - problem:
          en: "The build stops with `signal: 9, SIGKILL` while compiling a crate."
          tr: "Build bir crate derlenirken `signal: 9, SIGKILL` ile duruyor."
        fix:
          en: "The build ran out of memory and was killed. Close other programs, give Docker more memory in its settings, or keep `CARGO_BUILD_JOBS=1` and `lto = \"thin\"` as in this step."
          tr: "Build belleği doldurdu ve öldürüldü. Diğer programları kapat, Docker ayarlarında ona daha fazla bellek ver ya da bu adımdaki gibi `CARGO_BUILD_JOBS=1` ve `lto = \"thin\"` kullan."
      - problem:
          en: "The container exits at once, or the page cannot be reached."
          tr: "Container hemen kapanıyor ya da sayfaya ulaşılamıyor."
        fix:
          en: "Run `docker logs <container>` to see why. A missing `API_TOKEN` stops the server on purpose. Also make sure the program listens on `0.0.0.0`: a server on `127.0.0.1` is unreachable from outside its container."
          tr: "Nedenini görmek için `docker logs <container>` çalıştır. Eksik `API_TOKEN` sunucuyu bilerek durdurur. Programın `0.0.0.0` üzerinde dinlediğinden de emin ol: `127.0.0.1` üzerindeki sunucuya container'ın dışından ulaşılamaz."
      - problem:
          en: "`docker build` fails with: the lock file needs to be updated but --locked was passed."
          tr: "`docker build` şu hatayla başarısız oluyor: the lock file needs to be updated but --locked was passed."
        fix:
          en: "`Cargo.lock` is out of date or not copied. Run `cargo build` locally so it updates, commit it, and make sure the Dockerfile copies it and `.dockerignore` does not list it."
          tr: "`Cargo.lock` eski ya da kopyalanmamış. Güncellensin diye yerelde `cargo build` çalıştır, commit'le ve Dockerfile'ın onu kopyaladığından, `.dockerignore`'un listelemediğinden emin ol."
    quiz:
      - q:
          en: "Why does the Dockerfile have two `FROM` stages?"
          tr: "Dockerfile'da neden iki `FROM` aşaması var?"
        options:
          en:
            - "The big Rust toolchain stays in stage one; the final image holds only the finished program"
            - "One stage is for Linux and one for Windows"
            - "Docker needs two stages to run a program"
          tr:
            - "Büyük Rust araç zinciri ilk aşamada kalır; son image sadece bitmiş programı taşır"
            - "Biri Linux, biri Windows içindir"
            - "Docker'ın bir programı çalıştırması için iki aşama gerekir"
        answer: 0
        why:
          en: "Only what is copied with `COPY --from=build` reaches the final image, so the compiler and the source code stay behind. That is why it is about 20 MB."
          tr: "Sadece `COPY --from=build` ile kopyalananlar son image'a ulaşır; derleyici ve kaynak kod geride kalır. Bu yüzden yaklaşık 20 MB."
    sources:
      - title: "Docker, multi-stage builds"
        url: https://docs.docker.com/build/building/multi-stage/
      - title: "Docker, Dockerfile reference"
        url: https://docs.docker.com/reference/dockerfile/
      - title: "The Cargo Book, cargo build (--release, --locked)"
        url: https://doc.rust-lang.org/cargo/commands/cargo-build.html

  - id: deploy
    stage: deploy
    title:
      en: "Test on every push and deploy free on Render"
      tr: "Her push'ta test etme ve Render'da ücretsiz deploy"
    minutes: 90
    needs: [docker]
    why:
      en: "A deploy puts your API on a public address with HTTPS. GitHub Actions runs your checks on every push, and Render builds your Dockerfile and starts the container. Render has a free plan with real limits; read them below so nothing surprises you."
      tr: "Deploy, API'ni HTTPS'li herkese açık bir adrese koyar. GitHub Actions her push'ta kontrollerini çalıştırır, Render da Dockerfile'ını build edip container'ı başlatır. Render'ın gerçek sınırları olan ücretsiz bir planı var; sürpriz yaşamamak için aşağıdakileri oku."
    learn:
      en: |
        - A health check: a cheap route (`/healthz`) a platform calls to see that your program is alive
        - Hosts tell your program its port in the `PORT` environment variable; `serve` already reads it, and Render's default is 10000
        - A GitHub Actions workflow that runs `cargo fmt --check`, `cargo clippy` and `cargo test` on every push
        - **Render free web service, limits from Render's docs (checked October 2026):** it spins down after 15 minutes without traffic and takes about a minute to wake up on the next request; its filesystem is temporary, so **the SQLite file is lost on every restart, redeploy or spin-down** (free services cannot attach a persistent disk); you get 750 free instance hours per month for the workspace; there is a single instance, and Render may restart it at any time
        - So on the free plan the API is a demo whose data resets. For data that must stay, use a database that lives outside the container, for example Render Postgres (a free one expires 30 days after creation) with a Rust Postgres crate such as sqlx
      tr: |
        - Sağlık kontrolü: bir platformun programının canlı olduğunu görmek için çağırdığı ucuz bir rota (`/healthz`)
        - Barındırıcılar programına portunu `PORT` ortam değişkeninde söyler; `serve` bunu zaten okuyor, Render'ın varsayılanı 10000'dir
        - Her push'ta `cargo fmt --check`, `cargo clippy` ve `cargo test` çalıştıran bir GitHub Actions workflow'u
        - **Render ücretsiz web servisi, Render dokümanlarındaki sınırlar (Ekim 2026'da kontrol edildi):** 15 dakika trafik almazsa kapanır ve sonraki istekte uyanması yaklaşık bir dakika sürer; dosya sistemi geçicidir, yani **SQLite dosyası her yeniden başlatmada, yeniden deploy'da ve kapanmada kaybolur** (ücretsiz servislere kalıcı disk bağlanamaz); workspace için ayda 750 ücretsiz instance saati verilir; tek bir instance vardır ve Render onu her an yeniden başlatabilir
        - Yani ücretsiz planda API, verisi sıfırlanan bir demodur. Kalması gereken veri için container'ın dışında yaşayan bir veritabanı kullan; örneğin Render Postgres (ücretsiz olan oluşturulduktan 30 gün sonra sona erer) ve sqlx gibi bir Rust Postgres crate'i
    do:
      en: |
        1. Run the checks locally first, so CI is green the first time: `cargo fmt`, then `cargo clippy --all-targets -- -D warnings`, then `cargo test`.
        2. Create `.github/workflows/ci.yml` below. Check that `.gitignore` has the lines shown (cargo already added `/target`). Make sure `Cargo.lock` is committed.
        3. Create an empty repository on github.com (for example `todo-api`; no README), then connect and push (the first commands below).
        4. Open the *Actions* tab: the CI workflow should turn green.
        5. Make a long random token (`openssl rand -hex 24`) and keep it somewhere safe.
        6. Go to render.com and sign in with GitHub. Choose *New → Web Service* and pick your repository. Render finds the `Dockerfile`; choose Docker as the language and **Free** as the instance type. Under *Advanced* add the environment variable `API_TOKEN` with your token, and set the *Health Check Path* to `/healthz`. Then create the service. The first build takes a long time because Rust compiles every dependency.
        7. In the service's *Settings* find *Auto-Deploy* and choose *After CI Checks Pass*, so a broken commit is never deployed.
        8. Open your service address (`https://<name>.onrender.com`) and try it with the curl commands, replacing `localhost:8080` and using your token. The first request after an idle time is slow: that is the spin-up.
      tr: |
        1. Önce kontrolleri yerelde çalıştır ki CI ilk seferde yeşil olsun: `cargo fmt`, sonra `cargo clippy --all-targets -- -D warnings`, sonra `cargo test`.
        2. Aşağıdaki `.github/workflows/ci.yml` dosyasını oluştur. `.gitignore` dosyasında gösterilen satırların olduğunu kontrol et (cargo `/target` satırını zaten ekledi). `Cargo.lock` dosyasının commit'li olduğundan emin ol.
        3. github.com'da boş bir repo oluştur (örneğin `todo-api`; README olmadan), sonra bağla ve push et (aşağıdaki ilk komutlar).
        4. *Actions* sekmesini aç: CI workflow'u yeşile dönmeli.
        5. Uzun, rastgele bir token üret (`openssl rand -hex 24`) ve güvenli bir yerde sakla.
        6. render.com'a git ve GitHub ile giriş yap. *New → Web Service*'i seç ve repo'nu seç. Render `Dockerfile`'ı bulur; dil olarak Docker'ı, instance tipi olarak **Free**'yi seç. *Advanced* altında `API_TOKEN` ortam değişkenini token'ınla ekle ve *Health Check Path* alanını `/healthz` yap. Sonra servisi oluştur. İlk build uzun sürer, çünkü Rust bütün bağımlılıkları derler.
        7. Servisin *Settings* sayfasında *Auto-Deploy*'u bul ve *After CI Checks Pass*'i seç; böylece bozuk bir commit asla deploy edilmez.
        8. Servis adresini (`https://<ad>.onrender.com`) aç ve `localhost:8080` yerine onu koyup token'ını kullanarak curl komutlarıyla dene. Boşta kaldıktan sonraki ilk istek yavaştır: bu, uyanma süresidir.
    code:
      - file: ".gitignore"
        lang: text
        text: |
          /target
          todo.json
          todo.json.tmp
          *.db
          *.db-shm
          *.db-wal
      - file: ".github/workflows/ci.yml"
        lang: yaml
        text: |
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - run: cargo fmt --check
                - run: cargo clippy --all-targets --locked -- -D warnings
                - run: cargo test --locked
      - file: "terminal"
        lang: sh
        text: |
          cargo fmt
          cargo clippy --all-targets -- -D warnings
          cargo test
          git add .
          git commit -m "Add CI"
          git remote add origin https://github.com/<your-user>/todo-api.git
          git branch -M main
          git push -u origin main
      - file: "terminal (try the deployed API)"
        lang: sh
        text: |
          curl -i https://<name>.onrender.com/healthz
          curl -i -X POST https://<name>.onrender.com/tasks -H 'content-type: application/json' -H "authorization: Bearer $API_TOKEN" -d '{"title":"First task from the internet"}'
          curl https://<name>.onrender.com/tasks
    mistakes:
      - problem:
          en: "The Render deploy says no open port was detected, or the service never gets healthy."
          tr: "Render deploy'u açık port bulunamadı diyor ya da servis hiç sağlıklı olmuyor."
        fix:
          en: "Listen on `0.0.0.0` and on the port from the `PORT` variable (Render's default is 10000); `serve` already does. Also check the logs: a missing or too short `API_TOKEN` stops the server at start."
          tr: "`0.0.0.0` üzerinde ve `PORT` değişkenindeki portta dinle (Render'ın varsayılanı 10000); `serve` zaten böyle yapıyor. Logları da kontrol et: eksik ya da çok kısa bir `API_TOKEN` sunucuyu başlangıçta durdurur."
      - problem:
          en: "Tasks disappear on the free plan."
          tr: "Ücretsiz planda görevler kayboluyor."
        fix:
          en: "This is expected: the free instance has a temporary filesystem, so the SQLite file is lost on restart, redeploy and spin-down. Treat the free deploy as a demo, or move the data to a database outside the container."
          tr: "Bu beklenen bir durum: ücretsiz instance'ın dosya sistemi geçicidir; SQLite dosyası yeniden başlatmada, yeniden deploy'da ve kapanmada kaybolur. Ücretsiz deploy'u demo say ya da veriyi container'ın dışındaki bir veritabanına taşı."
      - problem:
          en: "CI fails at `cargo fmt --check` or at clippy, although it works on your computer."
          tr: "Bilgisayarında çalışmasına rağmen CI `cargo fmt --check` ya da clippy'de başarısız oluyor."
        fix:
          en: "CI checks the formatting and treats warnings as errors. Run `cargo fmt` and `cargo clippy --all-targets -- -D warnings` locally, commit the result and push again."
          tr: "CI biçimlendirmeyi kontrol eder ve uyarıları hata sayar. Yerelde `cargo fmt` ve `cargo clippy --all-targets -- -D warnings` çalıştır, sonucu commit'le ve tekrar push et."
    quiz:
      - q:
          en: "A friend adds a task on your free Render deploy; a day later it is gone. Why?"
          tr: "Bir arkadaşın ücretsiz Render deploy'una bir görev ekliyor; bir gün sonra yok. Neden?"
        options:
          en:
            - "The free instance's disk is temporary, so the SQLite file was lost when the service restarted or spun down"
            - "The token expired"
            - "GitHub deleted the repository"
          tr:
            - "Ücretsiz instance'ın diski geçici; servis yeniden başlayınca ya da kapanınca SQLite dosyası kayboldu"
            - "Token'ın süresi doldu"
            - "GitHub repo'yu sildi"
        answer: 0
        why:
          en: "Render's docs say the filesystem of a free web service is ephemeral: local changes, including SQLite files, are lost on redeploy, restart and spin-down."
          tr: "Render dokümanları, ücretsiz bir web servisinin dosya sisteminin geçici olduğunu söyler: SQLite dosyaları dahil yerel değişiklikler yeniden deploy'da, yeniden başlatmada ve kapanmada kaybolur."
    sources:
      - title: "Render, deploy for free (limits)"
        url: https://render.com/docs/free
      - title: "Render, web services and the PORT variable"
        url: https://render.com/docs/web-services
      - title: "Render, deploying with a Dockerfile"
        url: https://render.com/docs/docker
      - title: "GitHub, workflow syntax"
        url: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

  - id: logging
    stage: monitoring
    title:
      en: "Logs with tracing and health checks"
      tr: "tracing ile loglar ve sağlık kontrolleri"
    minutes: 45
    needs: [deploy]
    why:
      en: "When the API is on a server you cannot attach a debugger or look at the screen. Logs are how it talks to you: what happened, when, and how long it took. A health check lets the platform and you ask: are you alive, and can you reach your database?"
      tr: "API bir sunucudayken debugger bağlayamaz ya da ekrana bakamazsın. Loglar onun seninle konuşma biçimidir: ne oldu, ne zaman ve ne kadar sürdü. Sağlık kontrolü platformun ve senin şunu sormanı sağlar: canlı mısın ve veritabanına ulaşabiliyor musun?"
    learn:
      en: |
        - `tracing` is Rust's logging library; `tracing_subscriber` prints the events. Levels are `error`, `warn`, `info`, `debug` and `trace`
        - `RUST_LOG` chooses what is shown, for example `RUST_LOG=debug` or `RUST_LOG=info,tower_http=debug`
        - `TraceLayer` from tower-http logs one line per request: method, path, status and the time it took
        - Two health routes: `/healthz` means "the process is up" and `/readyz` means "and the database answers"
        - What must never be logged: tokens, passwords and secrets, and also nothing secret in a URL, because URLs are logged
      tr: |
        - `tracing` Rust'ın log kütüphanesidir; `tracing_subscriber` olayları yazdırır. Seviyeler `error`, `warn`, `info`, `debug` ve `trace`'dir
        - `RUST_LOG` nelerin gösterileceğini seçer, örneğin `RUST_LOG=debug` ya da `RUST_LOG=info,tower_http=debug`
        - tower-http'nin `TraceLayer`'ı istek başına bir satır loglar: metot, yol, durum ve süre
        - İki sağlık rotası: `/healthz` "süreç ayakta", `/readyz` ise "ve veritabanı cevap veriyor" demektir
        - Asla loglanmaması gerekenler: token'lar, şifreler ve sırlar; ayrıca URL'de de gizli bir şey olmamalı, çünkü URL'ler loglanır
    do:
      en: |
        1. Add the crates with the commands below. The second command only adds the `trace` feature to the `tower-http` you already have.
        2. Replace `src/api.rs` (new `/readyz` route, `TraceLayer`, an error log line for internal errors) and `src/main.rs` (the logger is set up in `serve`).
        3. In `src/db.rs` add the small `ping` method (below).
        4. Add the readyz test (below) at the end of `tests/api.rs`. Run `cargo test`.
        5. Start the server with a token and call `curl localhost:8080/readyz` and a missing task. Watch the terminal: one line per request with its status and latency. Start it again with `RUST_LOG=warn` and see the request lines disappear.
        6. On Render open your service's *Logs* tab and see the same lines. Change the *Health Check Path* of the service to `/readyz` if you want the platform to check the database too. Environment variables like `RUST_LOG` are set in *Environment*.
        7. Commit and push: `git add .`, `git commit -m "Add logging and readyz"`, `git push`.
      tr: |
        1. Aşağıdaki komutlarla crate'leri ekle. İkinci komut, sahip olduğun `tower-http`'ye sadece `trace` özelliğini ekler.
        2. `src/api.rs` (yeni `/readyz` rotası, `TraceLayer`, iç hatalar için bir hata log satırı) ve `src/main.rs` (logger `serve` içinde kurulur) dosyalarını değiştir.
        3. `src/db.rs` içine küçük `ping` metodunu ekle (aşağıda).
        4. readyz testini (aşağıda) `tests/api.rs` sonuna ekle. `cargo test` çalıştır.
        5. Sunucuyu bir token ile başlat ve `curl localhost:8080/readyz` ile var olmayan bir görevi çağır. Terminali izle: istek başına, durumu ve gecikmesiyle bir satır. `RUST_LOG=warn` ile tekrar başlat ve istek satırlarının kaybolduğunu gör.
        6. Render'da servisinin *Logs* sekmesini aç ve aynı satırları gör. Platformun veritabanını da kontrol etmesini istersen servisin *Health Check Path* alanını `/readyz` yap. `RUST_LOG` gibi ortam değişkenleri *Environment* içinde ayarlanır.
        7. Commit'le ve push et: `git add .`, `git commit -m "Add logging and readyz"`, `git push`.
    code:
      - file: "terminal"
        lang: sh
        text: |
          cargo add tracing
          cargo add tracing-subscriber --features env-filter
          cargo add tower-http --features timeout,trace
      - file: "src/api.rs"
        lang: rust
        text: |
          use std::sync::{Arc, Mutex, MutexGuard};
          use std::time::Duration;

          use axum::extract::{DefaultBodyLimit, Path, Query, Request, State};
          use axum::http::{StatusCode, header};
          use axum::middleware::{self, Next};
          use axum::response::{IntoResponse, Response};
          use axum::routing::{delete, get, post};
          use axum::{Json, Router};
          use serde::Deserialize;
          use serde_json::json;
          use tower_http::timeout::TimeoutLayer;
          use tower_http::trace::TraceLayer;

          use crate::db::Db;
          use crate::error::TodoError;
          use crate::model::{Filter, Task};

          /// Request bodies bigger than this are refused (a task is a few hundred bytes).
          const MAX_BODY_BYTES: usize = 4 * 1024;
          /// The most tasks one list request may return.
          const MAX_PAGE: i64 = 100;
          /// A request that takes longer than this is cut off.
          const REQUEST_TIMEOUT: Duration = Duration::from_secs(5);

          /// What every handler can reach. Clone is cheap: it copies the Arcs, not the data.
          #[derive(Clone)]
          pub struct AppState {
              db: Arc<Mutex<Db>>,
              token: Arc<str>,
          }

          impl AppState {
              /// A rusqlite Connection can be used by one thread at a time, so it sits behind a Mutex.
              fn db(&self) -> MutexGuard<'_, Db> {
                  // If another request panicked while holding the lock, the data is still fine.
                  self.db
                      .lock()
                      .unwrap_or_else(|poisoned| poisoned.into_inner())
              }
          }

          /// Anyone may read; changing data needs `Authorization: Bearer <token>`.
          pub fn router(db: Db, token: &str) -> Router {
              let state = AppState {
                  db: Arc::new(Mutex::new(db)),
                  token: token.into(),
              };

              let read = Router::new()
                  .route("/healthz", get(healthz))
                  .route("/readyz", get(readyz))
                  .route("/tasks", get(list_tasks))
                  .route("/tasks/{id}", get(get_task));

              let write = Router::new()
                  .route("/tasks", post(create_task))
                  .route("/tasks/{id}", delete(delete_task))
                  .route("/tasks/{id}/done", post(finish_task))
                  .route_layer(middleware::from_fn_with_state(state.clone(), require_token));

              read.merge(write)
                  .layer(DefaultBodyLimit::max(MAX_BODY_BYTES))
                  .layer(TimeoutLayer::with_status_code(
                      StatusCode::REQUEST_TIMEOUT,
                      REQUEST_TIMEOUT,
                  ))
                  // Logs one line per request: method, path, status and how long it took.
                  .layer(TraceLayer::new_for_http())
                  .with_state(state)
          }

          /// Lets a request through only when it carries the right bearer token.
          async fn require_token(State(state): State<AppState>, request: Request, next: Next) -> Response {
              let sent = request
                  .headers()
                  .get(header::AUTHORIZATION)
                  .and_then(|value| value.to_str().ok())
                  .and_then(|value| value.strip_prefix("Bearer "));
              if sent == Some(&*state.token) {
                  next.run(request).await
              } else {
                  (
                      StatusCode::UNAUTHORIZED,
                      Json(json!({ "error": "missing or wrong token" })),
                  )
                      .into_response()
              }
          }

          /// Binds to all interfaces so a container or a host can reach the server.
          pub async fn serve(db: Db, token: &str, port: u16) -> std::io::Result<()> {
              let listener = tokio::net::TcpListener::bind(("0.0.0.0", port)).await?;
              tracing::info!("listening on http://{}", listener.local_addr()?);
              axum::serve(listener, router(db, token)).await
          }

          #[derive(Deserialize)]
          struct NewTask {
              title: String,
          }

          #[derive(Deserialize)]
          struct ListParams {
              filter: Option<Filter>,
              limit: Option<i64>,
              offset: Option<i64>,
          }

          async fn healthz() -> Json<serde_json::Value> {
              Json(json!({ "status": "ok" }))
          }

          /// Ready means: the program is up AND its database answers.
          async fn readyz(State(state): State<AppState>) -> Result<Json<serde_json::Value>, TodoError> {
              state.db().ping()?;
              Ok(Json(json!({ "status": "ready" })))
          }

          async fn list_tasks(
              State(state): State<AppState>,
              Query(params): Query<ListParams>,
          ) -> Result<Json<Vec<Task>>, TodoError> {
              let tasks = state.db().list(
                  params.filter.unwrap_or_default(),
                  params.limit.unwrap_or(50).clamp(1, MAX_PAGE),
                  params.offset.unwrap_or(0).max(0),
              )?;
              Ok(Json(tasks))
          }

          async fn create_task(
              State(state): State<AppState>,
              Json(body): Json<NewTask>,
          ) -> Result<(StatusCode, Json<Task>), TodoError> {
              let task = state.db().add(&body.title)?;
              Ok((StatusCode::CREATED, Json(task)))
          }

          async fn get_task(
              State(state): State<AppState>,
              Path(id): Path<i64>,
          ) -> Result<Json<Task>, TodoError> {
              Ok(Json(state.db().get(id)?))
          }

          async fn finish_task(
              State(state): State<AppState>,
              Path(id): Path<i64>,
          ) -> Result<Json<Task>, TodoError> {
              Ok(Json(state.db().mark_done(id)?))
          }

          async fn delete_task(
              State(state): State<AppState>,
              Path(id): Path<i64>,
          ) -> Result<StatusCode, TodoError> {
              state.db().remove(id)?;
              Ok(StatusCode::NO_CONTENT)
          }

          /// How a TodoError looks to a client of the API.
          impl IntoResponse for TodoError {
              fn into_response(self) -> Response {
                  let status = match &self {
                      TodoError::EmptyTitle | TodoError::TitleTooLong { .. } => StatusCode::BAD_REQUEST,
                      TodoError::NotFound(_) => StatusCode::NOT_FOUND,
                      // Our own faults: do not show file paths or SQL details to the client.
                      TodoError::Io(_) | TodoError::Json(_) | TodoError::Db(_) | TodoError::Config(_) => {
                          // The details go to the log, not to the client.
                          tracing::error!("internal error: {self}");
                          return (
                              StatusCode::INTERNAL_SERVER_ERROR,
                              Json(json!({ "error": "internal error" })),
                          )
                              .into_response();
                      }
                  };
                  (status, Json(json!({ "error": self.to_string() }))).into_response()
              }
          }
      - file: "src/main.rs"
        lang: rust
        text: |
          #![forbid(unsafe_code)]

          use std::io::IsTerminal;
          use std::path::{Path, PathBuf};
          use std::process::ExitCode;

          use clap::{Parser, Subcommand, ValueEnum};

          use todo::api;
          use todo::db::Db;
          use todo::error::TodoError;
          use todo::model::Filter;
          use todo::store;

          /// A tiny todo list.
          #[derive(Parser)]
          #[command(version)]
          struct Cli {
              /// The JSON file that keeps your tasks
              #[arg(long, global = true, env = "TODO_FILE", default_value = "todo.json")]
              file: PathBuf,

              #[command(subcommand)]
              command: Command,
          }

          #[derive(Subcommand)]
          enum Command {
              /// Add a task
              Add {
                  /// What has to be done
                  title: String,
              },
              /// Show tasks
              List {
                  /// Which tasks to show
                  #[arg(long, value_enum, default_value_t = Show::All)]
                  filter: Show,
              },
              /// Mark a task as done
              Done {
                  /// The number of the task
                  id: i64,
              },
              /// Delete a task
              Remove {
                  /// The number of the task
                  id: i64,
              },
              /// Start the web API
              Serve {
                  /// The port to listen on
                  #[arg(long, env = "PORT", default_value_t = 8080)]
                  port: u16,
                  /// The secret that is needed to change data (at least 8 characters)
                  #[arg(long, env = "API_TOKEN", hide_env_values = true)]
                  token: String,
                  /// The SQLite database file
                  #[arg(long, env = "DATABASE_PATH", default_value = "todo.db")]
                  database: String,
              },
          }

          /// The same choices as `Filter`, but with the extra derive clap needs.
          #[derive(Clone, Copy, ValueEnum)]
          enum Show {
              All,
              Open,
              Done,
          }

          impl From<Show> for Filter {
              fn from(show: Show) -> Self {
                  match show {
                      Show::All => Filter::All,
                      Show::Open => Filter::Open,
                      Show::Done => Filter::Done,
                  }
              }
          }

          fn main() -> ExitCode {
              match run(Cli::parse()) {
                  Ok(()) => ExitCode::SUCCESS,
                  Err(e) => {
                      eprintln!("error: {e}");
                      ExitCode::FAILURE
                  }
              }
          }

          fn run(cli: Cli) -> Result<(), TodoError> {
              match cli.command {
                  Command::Serve {
                      port,
                      token,
                      database,
                  } => serve(port, &token, &database),
                  command => run_on_file(command, &cli.file),
              }
          }

          fn serve(port: u16, token: &str, database: &str) -> Result<(), TodoError> {
              // RUST_LOG picks what is shown, for example RUST_LOG=debug.
              // The default shows our own info lines and one line per request (tower_http).
              // Colors only when a person reads the terminal, not in a log file.
              tracing_subscriber::fmt()
                  .with_env_filter(
                      tracing_subscriber::EnvFilter::try_from_default_env()
                          .unwrap_or_else(|_| tracing_subscriber::EnvFilter::new("info,tower_http=debug")),
                  )
                  .with_ansi(std::io::stdout().is_terminal())
                  .init();
              if token.len() < 8 {
                  return Err(TodoError::Config(
                      "API_TOKEN must have at least 8 characters",
                  ));
              }
              let db = Db::open(database)?;
              let runtime = tokio::runtime::Runtime::new()?;
              runtime.block_on(api::serve(db, token, port))?;
              Ok(())
          }

          /// The commands that work on the JSON file.
          fn run_on_file(command: Command, file: &Path) -> Result<(), TodoError> {
              let mut list = store::load(file)?;
              match command {
                  Command::Add { title } => {
                      let id = list.add(&title)?;
                      store::save(file, &list)?;
                      println!("added #{id}");
                  }
                  Command::List { filter } => {
                      let tasks = list.list(filter.into());
                      if tasks.is_empty() {
                          println!("no tasks");
                      }
                      for task in tasks {
                          let mark = if task.done { "x" } else { " " };
                          println!("[{mark}] {:>3}  {}", task.id, task.title);
                      }
                  }
                  Command::Done { id } => {
                      list.mark_done(id)?;
                      store::save(file, &list)?;
                      println!("done #{id}");
                  }
                  Command::Remove { id } => {
                      list.remove(id)?;
                      store::save(file, &list)?;
                      println!("removed #{id}");
                  }
                  Command::Serve { .. } => unreachable!("serve is handled in run"),
              }
              Ok(())
          }
      - file: "src/db.rs (add this method inside impl Db)"
        lang: rust
        text: |
          /// Checks that the database answers.
          pub fn ping(&self) -> Result<(), TodoError> {
              self.conn.query_row("SELECT 1", [], |_| Ok(()))?;
              Ok(())
          }
      - file: "tests/api.rs (add at the end)"
        lang: rust
