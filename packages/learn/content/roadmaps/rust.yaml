          en: "error: no matching package named `serde_json` or a network error while adding crates."
          tr: "Crate eklerken `no matching package named serde_json` ya da bir ağ hatası."
        fix:
          en: "Check the spelling and your internet connection; crates come from crates.io. Run the command again."
          tr: "Yazımı ve internet bağlantını kontrol et; crate'ler crates.io'dan gelir. Komutu tekrar çalıştır."
      - problem:
          en: "Leaving `Cargo.lock` out of git."
          tr: "`Cargo.lock` dosyasını git dışında bırakmak."
        fix:
          en: "For an application, commit `Cargo.lock`. It pins the exact versions, so every build (yours, CI, the server) uses the same ones."
          tr: "Bir uygulamada `Cargo.lock`'u commit'le. Tam sürümleri sabitler; böylece her build (seninki, CI, sunucu) aynı sürümleri kullanır."
      - problem:
          en: "Writing straight into `todo.json` with `fs::write`."
          tr: "Doğrudan `todo.json` içine `fs::write` ile yazmak."
        fix:
          en: "If the computer stops in the middle of the write, the file is half written and the tasks are lost. Write `todo.json.tmp` first and `fs::rename` it over the real file, as `save` does."
          tr: "Bilgisayar yazarken ortada durursa dosya yarım kalır ve görevler kaybolur. `save`'in yaptığı gibi önce `todo.json.tmp` dosyasına yaz, sonra `fs::rename` ile gerçek dosyanın üzerine taşı."
    quiz:
      - q:
          en: "What does `#[derive(Serialize, Deserialize)]` on a struct give you?"
          tr: "Bir struct üzerindeki `#[derive(Serialize, Deserialize)]` sana ne verir?"
        options:
          en:
            - "Code that turns the struct into JSON and JSON back into the struct"
            - "A database table"
            - "Faster compile times"
          tr:
            - "Struct'ı JSON'a ve JSON'u tekrar struct'a çeviren kod"
            - "Bir veritabanı tablosu"
            - "Daha hızlı derleme"
        answer: 0
        why:
          en: "serde writes the conversion code at compile time, so there is no slow guessing at run time. It works with many formats, JSON being one."
          tr: "serde dönüştürme kodunu derleme anında yazar, yani çalışırken yavaş tahmin yoktur. Birçok biçimle çalışır, JSON bunlardan biridir."
    sources:
      - title: "serde, derive"
        url: https://serde.rs/derive.html
      - title: "The Cargo Book, specifying dependencies"
        url: https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html
