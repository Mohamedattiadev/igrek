          en: "The server panics at start with: Path segments must not start with `:`."
          tr: "Sunucu başlarken panic veriyor: Path segments must not start with `:`."
        fix:
          en: "axum 0.8 writes path parameters in braces: `/tasks/{id}`. The older `/tasks/:id` form is from axum 0.7 and many old tutorials."
          tr: "axum 0.8 yol parametrelerini süslü parantezle yazar: `/tasks/{id}`. Eski `/tasks/:id` biçimi axum 0.7'den ve birçok eski eğitimden gelir."
      - problem:
          en: "POST returns 415 Unsupported Media Type."
          tr: "POST 415 Unsupported Media Type döndürüyor."
        fix:
          en: "Send the header `content-type: application/json`. The `Json` extractor refuses bodies that do not say they are JSON."
          tr: "`content-type: application/json` başlığını gönder. `Json` extractor'ı JSON olduğunu söylemeyen gövdeleri reddeder."
      - problem:
          en: "A long error says the handler trait is not implemented, after you added an `.await` while holding the database lock."
          tr: "Veritabanı kilidini tutarken bir `.await` ekledikten sonra uzun bir hata handler trait'inin uygulanmadığını söylüyor."
        fix:
          en: "A `std::sync::MutexGuard` must not be held across an `.await`. Use the database inside a small block, finish with it, and only then await. Our handlers do not await while locked."
          tr: "Bir `std::sync::MutexGuard` bir `.await` boyunca tutulmamalı. Veritabanını küçük bir blokta kullan, işin bitince bırak ve ancak sonra await et. Bizim handler'larımız kilitliyken await etmez."
    quiz:
