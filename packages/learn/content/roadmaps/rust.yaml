        text: |
          use serde::{Deserialize, Serialize};

          use crate::error::TodoError;

          /// The longest title we accept, counted in characters.
          pub const MAX_TITLE_CHARS: usize = 200;

          /// One thing to do.
          #[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
          pub struct Task {
              pub id: i64,
              pub title: String,
              pub done: bool,
          }

          /// Which tasks to show.
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]
          pub enum Filter {
              #[default]
              All,
              Open,
              Done,
          }

          /// All tasks, plus the number the next task will get.
          #[derive(Debug, Default, Serialize, Deserialize)]
          pub struct TaskList {
              tasks: Vec<Task>,
              next_id: i64,
          }

          /// Trims a title and checks it. Every way into the program goes through this.
          pub fn clean_title(title: &str) -> Result<String, TodoError> {
              let title = title.trim();
              if title.is_empty() {
                  return Err(TodoError::EmptyTitle);
              }
              if title.chars().count() > MAX_TITLE_CHARS {
                  return Err(TodoError::TitleTooLong {
                      max: MAX_TITLE_CHARS,
                  });
              }
              Ok(title.to_string())
          }

          impl TaskList {
              pub fn new() -> Self {
                  Self::default()
              }

              /// Borrows the title (&str) and makes the Task own its own copy (String).
              pub fn add(&mut self, title: &str) -> Result<i64, TodoError> {
                  let title = clean_title(title)?;
                  self.next_id += 1;
                  self.tasks.push(Task {
                      id: self.next_id,
                      title,
                      done: false,
                  });
                  Ok(self.next_id)
              }

              /// Lends out the tasks that match; nothing is copied or moved.
              pub fn list(&self, filter: Filter) -> Vec<&Task> {
                  self.tasks
                      .iter()
                      .filter(|t| match filter {
                          Filter::All => true,
                          Filter::Open => !t.done,
                          Filter::Done => t.done,
                      })
                      .collect()
              }

              pub fn mark_done(&mut self, id: i64) -> Result<(), TodoError> {
                  let task = self
                      .tasks
                      .iter_mut()
                      .find(|t| t.id == id)
                      .ok_or(TodoError::NotFound(id))?;
                  task.done = true;
                  Ok(())
              }

              pub fn remove(&mut self, id: i64) -> Result<(), TodoError> {
                  let before = self.tasks.len();
                  self.tasks.retain(|t| t.id != id);
                  if self.tasks.len() == before {
                      return Err(TodoError::NotFound(id));
                  }
                  Ok(())
              }
          }
      - file: "src/store.rs"
        lang: rust
        text: |
          use std::fs;
          use std::io::ErrorKind;
          use std::path::Path;

          use crate::error::TodoError;
          use crate::model::TaskList;

          /// Reads the task list from a JSON file. A missing file is an empty list.
          pub fn load(path: &Path) -> Result<TaskList, TodoError> {
              match fs::read_to_string(path) {
                  Ok(text) => Ok(serde_json::from_str(&text)?),
                  Err(e) if e.kind() == ErrorKind::NotFound => Ok(TaskList::new()),
                  Err(e) => Err(e.into()),
              }
          }

          /// Writes the list to a temporary file first, then renames it over the real one,
          /// so a crash in the middle never leaves a half-written file.
          pub fn save(path: &Path, list: &TaskList) -> Result<(), TodoError> {
              let text = serde_json::to_string_pretty(list)?;
              let tmp = path.with_extension("json.tmp");
              fs::write(&tmp, text)?;
              fs::rename(&tmp, path)?;
              Ok(())
          }
      - file: "src/main.rs"
        lang: rust
        text: |
          use std::path::Path;

          use todo::error::TodoError;
          use todo::model::Filter;
          use todo::store;

          fn main() {
              if let Err(e) = run() {
                  eprintln!("error: {e}");
                  std::process::exit(1);
              }
          }

          fn run() -> Result<(), TodoError> {
              let path = Path::new("todo.json");
              let mut list = store::load(path)?;
              list.add("Try the JSON store")?;
              store::save(path, &list)?;

              for task in list.list(Filter::All) {
                  let mark = if task.done { "x" } else { " " };
                  println!("[{mark}] {} {}", task.id, task.title);
              }
              Ok(())
          }
      - file: ".gitignore (add these lines)"
        lang: text
        text: |
          todo.json
          todo.json.tmp
    mistakes:
