    mistakes:
      - problem:
          en: "Storing the password as typed, or hashing it yourself with `hashlib.sha256`."
          tr: "Şifreyi yazıldığı gibi saklamak ya da kendin `hashlib.sha256` ile hash'lemek."
        fix:
          en: "Plain hashes are far too fast to compute, so stolen databases are cracked quickly. Use `generate_password_hash()`, which salts and uses a slow, designed-for-passwords algorithm."
          tr: "Düz hash'ler çok hızlı hesaplanır; çalınan veritabanları çabucak kırılır. Salt ekleyen ve şifreler için tasarlanmış yavaş bir algoritma kullanan `generate_password_hash()` kullan."
      - problem:
          en: "`DELETE FROM link WHERE id = ?` without `AND user_id = ?` because \"only logged-in users see the button\"."
          tr: "\"Butonu sadece giriş yapanlar görüyor\" diye `AND user_id = ?` olmadan `DELETE FROM link WHERE id = ?` yazmak."
        fix:
          en: "Anyone can send a POST for any id. The server must check ownership on every request. This mistake is called IDOR (insecure direct object reference)."
          tr: "Herkes istediği id için POST gönderebilir. Sunucu her istekte sahipliği kontrol etmeli. Bu hataya IDOR (insecure direct object reference) denir."
      - problem:
          en: "Telling the user which part was wrong: \"No such user\" or \"Wrong password\"."
          tr: "Kullanıcıya hangi kısmın yanlış olduğunu söylemek: \"Böyle bir kullanıcı yok\" ya da \"Şifre yanlış\"."
        fix:
          en: "That lets attackers find out which usernames exist. Use one message for both cases."
          tr: "Bu, saldırganların hangi kullanıcı adlarının var olduğunu öğrenmesini sağlar. İki durum için tek bir mesaj kullan."
    quiz:
      - q:
          en: "What is stored in the `password_hash` column?"
          tr: "`password_hash` sütununda ne saklanır?"
        options:
          en: ["The password, encrypted with SECRET_KEY", "A salted one-way hash that cannot be turned back into the password", "The first 8 characters of the password"]
          tr: ["SECRET_KEY ile şifrelenmiş parola", "Parolaya geri çevrilemeyen, salt'lı tek yönlü bir hash", "Parolanın ilk 8 karakteri"]
        answer: 1
        why:
          en: "A hash cannot be reversed. At login Flask hashes the typed password again and compares the results."
          tr: "Hash geri çevrilemez. Girişte Flask yazılan şifreyi yeniden hash'ler ve sonuçları karşılaştırır."
      - q:
          en: "Why does `delete` check `user_id` in the SQL even though only logged-in users see the Delete button?"
          tr: "Sadece giriş yapanlar Delete butonunu görse de `delete` neden SQL'de `user_id`'yi kontrol ediyor?"
        options:
          en: ["Because hiding a button is not security: anyone can send the request by hand", "To make the query faster", "Because SQLite requires it"]
          tr: ["Çünkü butonu gizlemek güvenlik değil: herkes isteği elle gönderebilir", "Sorguyu hızlandırmak için", "Çünkü SQLite bunu ister"]
        answer: 0
        why:
          en: "The server only sees requests. It must decide on every one of them whether this user owns this row."
          tr: "Sunucu sadece istekleri görür. Her istekte bu kullanıcının bu satırın sahibi olup olmadığına kendisi karar vermeli."
