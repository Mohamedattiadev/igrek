          uv add flask-wtf "flask>=3.1.3"
      - file: linkbox/__init__.py
        lang: py
        text: |
          import os

          from flask import Flask
          from flask_wtf.csrf import CSRFProtect

          csrf = CSRFProtect()


          def create_app(test_config=None):
              app = Flask(__name__, instance_relative_config=True)
              app.config.from_mapping(
                  SECRET_KEY="dev",
                  DATABASE=os.path.join(app.instance_path, "linkbox.sqlite"),
                  MAX_CONTENT_LENGTH=64 * 1024,
                  SESSION_COOKIE_SAMESITE="Lax",
              )

              if test_config is None:
                  # FLASK_SECRET_KEY, FLASK_DATABASE, ... in the environment
                  app.config.from_prefixed_env()
              else:
                  app.config.update(test_config)

              if not (app.debug or app.testing):
                  if app.config["SECRET_KEY"] == "dev":
                      raise RuntimeError(
                          "Set the FLASK_SECRET_KEY environment variable to a long random value."
                      )
                  app.config["SESSION_COOKIE_SECURE"] = True

              os.makedirs(app.instance_path, exist_ok=True)
              csrf.init_app(app)

              from . import auth, db, links

              db.init_app(app)
              app.register_blueprint(auth.bp)
              app.register_blueprint(links.bp)

              @app.after_request
              def add_security_headers(response):
                  response.headers["X-Content-Type-Options"] = "nosniff"
                  response.headers["Referrer-Policy"] = "same-origin"
                  response.headers["Content-Security-Policy"] = (
                      "default-src 'self'; frame-ancestors 'none'; form-action 'self'"
                  )
                  return response

              return app
