          en: "A visitor saves the title `<script>alert(1)</script>`. What does Jinja do with `{{ link.title }}`?"
          tr: "Bir ziyaretçi başlığı `<script>alert(1)</script>` olarak kaydetti. Jinja `{{ link.title }}` ile ne yapar?"
