  - id: performance
    stage: performance
    title:
      en: "Performance: measure a query, add an index, paginate, cache static files"
      tr: "Performans: bir sorguyu ölç, index ekle, sayfalandır, statik dosyaları cache'le"
    minutes: 55
    needs: [security]
    why:
      en: "A page with 10 links is fast no matter what. A page for a user with 10,000 links, in a table of 1,000,000 rows, is where careless queries hurt. You learn to measure first, then fix the one thing that is slow."
      tr: "10 linkli bir sayfa ne yaparsan yap hızlıdır. 1.000.000 satırlık bir tabloda 10.000 linki olan bir kullanıcının sayfasında ise özensiz sorgular acıtır. Önce ölçmeyi, sonra yavaş olan tek şeyi düzeltmeyi öğrenirsin."
    learn:
      en: |
        - `EXPLAIN QUERY PLAN` shows how SQLite will run a query: `SCAN` reads every row, `SEARCH ... USING INDEX` jumps to the right rows
        - An **index** is a sorted shortcut for a column (or columns) you filter and sort by. It speeds reads and slows writes a little.
        - **Pagination** (`LIMIT` and `OFFSET`): never send thousands of rows to one page
        - Avoid the **N+1** pattern: one query for the list plus one more per row. Use one query with a `JOIN`, or fetch what you need at once.
        - **HTTP caching**: static files can be cached by the browser (`Cache-Control: max-age`); pages with personal data must not be stored by caches (`no-store`)
        - Server-side caching (like Redis) comes later and only when measuring says you need it
      tr: |
        - `EXPLAIN QUERY PLAN` SQLite'ın bir sorguyu nasıl çalıştıracağını gösterir: `SCAN` her satırı okur, `SEARCH ... USING INDEX` doğru satırlara atlar
        - **Index**, filtrelediğin ve sıraladığın sütun (ya da sütunlar) için sıralı bir kısayoldur. Okumayı hızlandırır, yazmayı biraz yavaşlatır.
        - **Sayfalandırma** (`LIMIT` ve `OFFSET`): bir sayfaya asla binlerce satır gönderme
        - **N+1** desenine dikkat: liste için bir sorgu ve her satır için bir sorgu daha. `JOIN` ile tek sorgu kullan ya da ihtiyacın olanı bir seferde çek.
        - **HTTP cache'i**: statik dosyaları tarayıcı cache'leyebilir (`Cache-Control: max-age`); kişisel veri içeren sayfaları cache'ler saklamamalı (`no-store`)
        - Sunucu tarafı cache (Redis gibi) daha sonra gelir ve sadece ölçüm ihtiyaç olduğunu gösterirse
    do:
      en: |
        1. Replace `linkbox/schema.sql`: it gets an index on `(user_id, id DESC)`, the exact columns the home page filters and sorts by. The command `init-db` is safe to run again, so run it now. It has `--debug` because, since the security step, the app needs a real secret key outside debug mode.
        2. Replace `linkbox/links.py` (the home page now shows 20 links per page) and `linkbox/templates/links/index.html` (it gets Newer and Older links).
        3. Replace `linkbox/__init__.py`: static files may be cached for an hour, and every other response is marked `no-store`.
        4. Create `scripts/seed.py`. (Run it as `python -m scripts.seed`, as in the code below.) It adds 50,000 fake links for another user and prints how SQLite runs your home-page query without and with the index. You need at least one registered account first.
        5. Run it and read the two query plans. The first says `SCAN link`, the second `SEARCH link USING INDEX`. On this small data the time difference is a few milliseconds; it grows with the table.
        6. Open the app: your list is paginated. Run `uv run pytest` again, then commit. The fake links stay in your development database; delete `instance/linkbox.sqlite` and run `init-db` if you want a clean start.
      tr: |
        1. `linkbox/schema.sql` dosyasını değiştir: ana sayfanın tam olarak filtrelediği ve sıraladığı sütunlar olan `(user_id, id DESC)` için bir index alır. `init-db` komutunu tekrar çalıştırmak güvenli, şimdi çalıştır. Komutta `--debug` var, çünkü güvenlik adımından beri uygulama debug modu dışında gerçek bir secret key ister.
        2. `linkbox/links.py` (ana sayfa artık sayfada 20 link gösterir) ve `linkbox/templates/links/index.html` (Newer ve Older linkleri alır) dosyalarını değiştir.
        3. `linkbox/__init__.py` dosyasını değiştir: statik dosyalar bir saat cache'lenebilir ve diğer her yanıt `no-store` işaretlenir.
        4. `scripts/seed.py` dosyasını oluştur. (Aşağıdaki gibi `python -m scripts.seed` ile çalıştır.) Başka bir kullanıcı için 50.000 sahte link ekler ve SQLite'ın ana sayfa sorgunu index olmadan ve index ile nasıl çalıştırdığını yazdırır. Önce kayıtlı en az bir hesabın olmalı.
        5. Çalıştır ve iki sorgu planını oku. Birincisi `SCAN link`, ikincisi `SEARCH link USING INDEX` der. Bu küçük veride süre farkı birkaç milisaniye; tablo büyüdükçe artar.
        6. Uygulamayı aç: listen sayfalandırılmış. `uv run pytest` komutunu tekrar çalıştır, sonra commit'le. Sahte linkler geliştirme veritabanında kalır; temiz başlamak istersen `instance/linkbox.sqlite` dosyasını sil ve `init-db` çalıştır.
    code:
      - file: linkbox/schema.sql
        lang: sql
        text: |
          CREATE TABLE IF NOT EXISTS user (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              username TEXT UNIQUE NOT NULL,
              password_hash TEXT NOT NULL
          );

          CREATE TABLE IF NOT EXISTS link (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              user_id INTEGER NOT NULL REFERENCES user (id) ON DELETE CASCADE,
              title TEXT NOT NULL,
              url TEXT NOT NULL,
              created TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          );

          CREATE INDEX IF NOT EXISTS link_user_id_id ON link (user_id, id DESC);
      - file: linkbox/links.py
        lang: py
        text: |
          from urllib.parse import urlparse

          from flask import Blueprint, abort, flash, g, redirect, render_template, request, url_for

          from .auth import login_required
          from .db import get_db

          bp = Blueprint("links", __name__)

          PER_PAGE = 20


          def check_link(title, url):
              """Return an error message, or None when the link is fine."""
              if not title:
                  return "A title is required."
              if len(title) > 100:
                  return "The title can be at most 100 characters."
              if len(url) > 2000:
                  return "The address is too long."
              try:
                  parts = urlparse(url)
              except ValueError:
                  return "That is not a valid address."
              if parts.scheme not in ("http", "https") or not parts.netloc:
                  return "The address must start with http:// or https://."
              return None


          @bp.route("/")
          def index():
              links, page, pages = [], 1, 1
              if g.user is not None:
                  db = get_db()
                  total = db.execute(
                      "SELECT COUNT(*) FROM link WHERE user_id = ?", (g.user["id"],)
                  ).fetchone()[0]
                  pages = max(1, -(-total // PER_PAGE))
                  page = min(max(request.args.get("page", 1, type=int), 1), pages)
                  links = db.execute(
                      "SELECT id, title, url, created FROM link WHERE user_id = ? "
                      "ORDER BY id DESC LIMIT ? OFFSET ?",
                      (g.user["id"], PER_PAGE, (page - 1) * PER_PAGE),
                  ).fetchall()
              return render_template("links/index.html", links=links, page=page, pages=pages)


          @bp.route("/add", methods=("GET", "POST"))
          @login_required
          def add():
              title = url = ""
              if request.method == "POST":
                  title = request.form.get("title", "").strip()
                  url = request.form.get("url", "").strip()
                  error = check_link(title, url)
                  if error is None:
                      db = get_db()
                      db.execute(
                          "INSERT INTO link (user_id, title, url) VALUES (?, ?, ?)",
                          (g.user["id"], title, url),
                      )
                      db.commit()
                      flash("Link saved.")
                      return redirect(url_for("links.index"))
                  flash(error)
              return render_template("links/add.html", title=title, url=url)


          @bp.route("/<int:id>/delete", methods=("POST",))
          @login_required
          def delete(id):
              db = get_db()
              cursor = db.execute(
                  "DELETE FROM link WHERE id = ? AND user_id = ?", (id, g.user["id"])
              )
              db.commit()
              if cursor.rowcount == 0:
                  abort(404)
              flash("Link deleted.")
              return redirect(url_for("links.index"))
      - file: linkbox/templates/links/index.html
        lang: html
        text: |
          {% extends "base.html" %}
          {% block title %}Your links{% endblock %}
          {% block content %}
            {% if g.user %}
              <h1>Your links</h1>
              <p><a href="{{ url_for('links.add') }}">Add a link</a></p>
              {% for link in links %}
                <article>
                  <span>
                    <a href="{{ link.url }}">{{ link.title }}</a><br>
                    <small>{{ link.created }}</small>
                  </span>
                  <form method="post" action="{{ url_for('links.delete', id=link.id) }}" class="inline">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit">Delete</button>
                  </form>
                </article>
              {% else %}
                <p>No links yet.</p>
              {% endfor %}
              {% if pages > 1 %}
                <nav class="pager">
                  {% if page > 1 %}
                    <a href="{{ url_for('links.index', page=page - 1) }}">Newer</a>
                  {% else %}
                    <span></span>
                  {% endif %}
                  <span>Page {{ page }} of {{ pages }}</span>
                  {% if page < pages %}
                    <a href="{{ url_for('links.index', page=page + 1) }}">Older</a>
                  {% else %}
                    <span></span>
                  {% endif %}
                </nav>
              {% endif %}
            {% else %}
              <h1>Linkbox</h1>
              <p>Save the links you want to keep. <a href="{{ url_for('auth.register') }}">Create an account</a> or <a href="{{ url_for('auth.login') }}">log in</a>.</p>
            {% endif %}
          {% endblock %}
      - file: linkbox/__init__.py
        lang: py
        text: |
          import os
          from datetime import timedelta

          from flask import Flask, request
          from flask_wtf.csrf import CSRFProtect

          csrf = CSRFProtect()


          def create_app(test_config=None):
              app = Flask(__name__, instance_relative_config=True)
              app.config.from_mapping(
                  SECRET_KEY="dev",
                  DATABASE=os.path.join(app.instance_path, "linkbox.sqlite"),
                  MAX_CONTENT_LENGTH=64 * 1024,
                  SESSION_COOKIE_SAMESITE="Lax",
                  SEND_FILE_MAX_AGE_DEFAULT=timedelta(hours=1),
              )

              if test_config is None:
                  # FLASK_SECRET_KEY, FLASK_DATABASE, ... in the environment
                  app.config.from_prefixed_env()
              else:
                  app.config.update(test_config)

              if not (app.debug or app.testing):
                  if app.config["SECRET_KEY"] == "dev":
                      raise RuntimeError(
                          "Set the FLASK_SECRET_KEY environment variable to a long random value."
                      )
                  app.config["SESSION_COOKIE_SECURE"] = True

              os.makedirs(app.instance_path, exist_ok=True)
              csrf.init_app(app)

              from . import auth, db, links

              db.init_app(app)
              app.register_blueprint(auth.bp)
              app.register_blueprint(links.bp)

              @app.after_request
              def add_headers(response):
                  response.headers["X-Content-Type-Options"] = "nosniff"
                  response.headers["Referrer-Policy"] = "same-origin"
                  response.headers["Content-Security-Policy"] = (
                      "default-src 'self'; frame-ancestors 'none'; form-action 'self'"
                  )
                  if request.endpoint != "static":
                      # personal pages must not be kept by browsers or shared caches
                      response.headers.setdefault("Cache-Control", "no-store")
                  return response

              return app
      - file: scripts/seed.py
        lang: py
        text: |
          """Add 50,000 fake links for another user and show how SQLite runs the home-page query.

          Run from the project folder: uv run python -m scripts.seed
          """
          import time

          from linkbox import create_app
          from linkbox.db import get_db

          QUERY = (
              "SELECT id, title, url, created FROM link WHERE user_id = ? "
              "ORDER BY id DESC LIMIT 20 OFFSET 0"
          )

          app = create_app({"SECRET_KEY": "seed-script"})

          with app.app_context():
              db = get_db()
              me = db.execute("SELECT id FROM user ORDER BY id LIMIT 1").fetchone()
              if me is None:
                  raise SystemExit("Register an account in the app first.")

              db.execute(
                  "INSERT OR IGNORE INTO user (username, password_hash) VALUES ('seed-user', 'x')"
              )
              other = db.execute("SELECT id FROM user WHERE username = 'seed-user'").fetchone()
              db.executemany(
                  "INSERT INTO link (user_id, title, url) VALUES (?, ?, ?)",
                  [(other["id"], f"Link {i}", f"https://example.com/{i}") for i in range(50_000)],
              )
              db.commit()

              def measure(label):
                  plan = db.execute("EXPLAIN QUERY PLAN " + QUERY, (me["id"],)).fetchall()
                  start = time.perf_counter()
                  for _ in range(100):
                      db.execute(QUERY, (me["id"],)).fetchall()
                  ms = (time.perf_counter() - start) * 1000 / 100
                  print(f"{label}: {plan[0]['detail']}  ({ms:.3f} ms per query)")

              db.execute("DROP INDEX IF EXISTS link_user_id_id")
              measure("without the index")
              db.execute("CREATE INDEX link_user_id_id ON link (user_id, id DESC)")
              measure("with the index   ")
              db.commit()
      - file: terminal
        lang: sh
        text: |
          uv run flask --app linkbox --debug init-db
          uv run python -m scripts.seed
          uv run pytest
    mistakes:
      - problem:
          en: "Adding an index to every column \"to be fast\"."
          tr: "\"Hızlı olsun\" diye her sütuna index eklemek."
        fix:
          en: "Each index costs disk space and slows every INSERT. Add one when a query you measured is slow, for the columns it filters and sorts by."
          tr: "Her index disk alanı harcar ve her INSERT'i yavaşlatır. Ölçtüğün bir sorgu yavaşsa, filtrelediği ve sıraladığı sütunlar için bir tane ekle."
      - problem:
          en: "Loading all rows and filtering them in Python."
          tr: "Bütün satırları yükleyip Python'da süzmek."
        fix:
          en: "The database is built for this. Put the `WHERE`, `ORDER BY` and `LIMIT` in the SQL so only the rows you need leave the database."
          tr: "Veritabanı bunun için yapıldı. `WHERE`, `ORDER BY` ve `LIMIT`'i SQL'e koy ki sadece ihtiyacın olan satırlar veritabanından çıksın."
      - problem:
          en: "Letting a browser or CDN cache pages that show a user's data."
          tr: "Bir tarayıcının ya da CDN'in kullanıcı verisi gösteren sayfaları cache'lemesine izin vermek."
        fix:
          en: "Then another person may be served your page. Personal pages get `Cache-Control: no-store` (or `private`); only static files are cached."
          tr: "O zaman başka biri senin sayfanı görebilir. Kişisel sayfalara `Cache-Control: no-store` (ya da `private`) ver; sadece statik dosyalar cache'lenir."
    quiz:
      - q:
          en: "What does `SEARCH link USING INDEX link_user_id_id` tell you?"
          tr: "`SEARCH link USING INDEX link_user_id_id` sana ne söyler?"
        options:
          en: ["SQLite reads every row of the table", "SQLite jumps straight to the rows of one user through the index", "The query is wrong"]
          tr: ["SQLite tablonun her satırını okuyor", "SQLite index sayesinde doğrudan bir kullanıcının satırlarına atlıyor", "Sorgu yanlış"]
        answer: 1
        why:
          en: "`SCAN` means a full read of the table; `SEARCH ... USING INDEX` means the index narrowed the work."
          tr: "`SCAN` tablonun tamamının okunması demek; `SEARCH ... USING INDEX` index'in işi daralttığı anlamına gelir."
    sources:
      - title: SQLite, query planning
        url: https://www.sqlite.org/queryplanner.html
      - title: SQLite, EXPLAIN QUERY PLAN
        url: https://www.sqlite.org/eqp.html
      - title: MDN, HTTP caching
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching

  - id: packaging
    stage: packaging
    title:
      en: "Package the app with pyproject.toml and build a wheel"
      tr: "Uygulamayı pyproject.toml ile paketle ve bir wheel üret"
    minutes: 40
    needs: [performance]
    why:
      en: "Right now Linkbox only works because you are in its folder. A proper package lists its dependencies, includes its templates and database schema, and can be built into one file (a wheel) that installs anywhere. That is also what servers expect."
      tr: "Şu an Linkbox sadece klasörünün içinde olduğun için çalışıyor. Düzgün bir paket bağımlılıklarını listeler, şablonlarını ve veritabanı şemasını içerir ve her yere kurulabilen tek bir dosyaya (wheel) dönüştürülebilir. Sunucuların beklediği de budur."
    learn:
      en: |
        - `pyproject.toml` is the standard file that describes a Python project: name, version, dependencies and the build backend
        - A **build backend** (here `flit_core`) turns the project into a **wheel**, a zip file pip can install
        - Dependencies in `[project]` are what the app needs to run; the `dev` group holds tools like pytest
        - A **lock file** (`uv.lock`) pins exact versions, so every install gets the same packages. Commit it.
        - `.gitignore` keeps `.venv`, `dist` and `instance` out of Git
      tr: |
        - `pyproject.toml` bir Python projesini tarif eden standart dosyadır: ad, sürüm, bağımlılıklar ve build backend
        - **Build backend** (burada `flit_core`) projeyi, pip'in kurabildiği bir zip dosyası olan **wheel**'e çevirir
        - `[project]` içindeki bağımlılıklar uygulamanın çalışmak için ihtiyaç duyduklarıdır; `dev` grubu pytest gibi araçları tutar
        - **Kilit dosyası** (`uv.lock`) tam sürümleri sabitler, böylece her kurulum aynı paketleri alır. Commit'le.
        - `.gitignore`, `.venv`, `dist` ve `instance` klasörlerini Git dışında tutar
    do:
      en: |
        1. Replace the whole `pyproject.toml` with the version below. It names the project, lists the dependencies, picks Flit as the build backend and keeps the pytest settings.
        2. Run `uv sync` so uv installs Linkbox itself into the environment and updates `uv.lock`, then `uv run pytest` to confirm nothing broke.
        3. Build the package with `uv build`. It creates the folder `dist` with a `.whl` and a `.tar.gz` file.
        4. List what is inside the wheel and check that it contains `linkbox/schema.sql`, the templates and `static/style.css`.
        5. Commit `pyproject.toml` and `uv.lock`. The `dist` folder is ignored by Git.
      tr: |
        1. Bütün `pyproject.toml` dosyasını aşağıdaki sürümle değiştir. Projeye ad verir, bağımlılıkları sıralar, build backend olarak Flit'i seçer ve pytest ayarlarını korur.
        2. `uv sync` çalıştır; uv Linkbox'ı ortama kurar ve `uv.lock` dosyasını günceller. Sonra hiçbir şeyin bozulmadığını `uv run pytest` ile doğrula.
        3. `uv build` ile paketi üret. İçinde bir `.whl` ve bir `.tar.gz` dosyası olan `dist` klasörünü oluşturur.
        4. Wheel'in içindekileri listele ve `linkbox/schema.sql`, şablonlar ve `static/style.css` dosyalarının içinde olduğunu kontrol et.
        5. `pyproject.toml` ve `uv.lock` dosyalarını commit'le. `dist` klasörünü Git yok sayar.
    code:
      - file: pyproject.toml
        lang: toml
        text: |
          [build-system]
          requires = ["flit_core>=3.11,<5"]
          build-backend = "flit_core.buildapi"

          [project]
          name = "linkbox"
          version = "0.1.0"
          description = "A small link saver built with Flask."
          requires-python = ">=3.10"
          dependencies = [
              "flask>=3.1.3",
              "flask-wtf>=1.2",
          ]

          [dependency-groups]
          dev = ["pytest>=8"]

          [tool.pytest.ini_options]
          testpaths = ["tests"]
          pythonpath = ["."]
      - file: terminal
        lang: sh
        text: |
          uv sync
          uv run pytest
          uv build
          uv run python -m zipfile -l dist/linkbox-0.1.0-py3-none-any.whl
    mistakes:
      - problem:
          en: "The built package starts but pages crash with \"TemplateNotFound\" or the database cannot be created."
          tr: "Üretilen paket çalışıyor ama sayfalar \"TemplateNotFound\" ile çöküyor ya da veritabanı oluşturulamıyor."
        fix:
          en: "Data files (templates, static, schema.sql) were not packed. Always list the wheel with `python -m zipfile -l` and look for them. Flit includes every file inside the package folder."
          tr: "Veri dosyaları (şablonlar, static, schema.sql) pakete girmemiş. Wheel'i her zaman `python -m zipfile -l` ile listele ve onları ara. Flit paket klasörünün içindeki her dosyayı ekler."
      - problem:
          en: "Not committing `uv.lock`, or committing `.venv`."
          tr: "`uv.lock`'u commit'lememek ya da `.venv`'i commit'lemek."
        fix:
          en: "Commit `uv.lock` (it makes installs repeatable). Never commit `.venv`: it is large, specific to your computer and rebuilt by `uv sync`."
          tr: "`uv.lock`'u commit'le (kurulumları tekrarlanabilir yapar). `.venv`'i asla commit'leme: büyük, bilgisayarına özel ve `uv sync` ile yeniden oluşturulur."
    quiz:
      - q:
          en: "What is a wheel?"
          tr: "Wheel nedir?"
        options:
          en: ["A running server process", "A zip file with your built package that pip can install", "A kind of virtual environment"]
          tr: ["Çalışan bir sunucu süreci", "Üretilmiş paketini içeren, pip'in kurabildiği bir zip dosyası", "Bir tür sanal ortam"]
        answer: 1
        why:
          en: "A wheel (`.whl`) is a ready-to-install archive of the package. `uv build` makes it from `pyproject.toml`."
          tr: "Wheel (`.whl`) paketin kurulmaya hazır arşividir. `uv build` onu `pyproject.toml`'dan üretir."
    sources:
      - title: Python Packaging, writing your pyproject.toml
        url: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
      - title: Flit, the pyproject.toml file
        url: https://flit.pypa.io/en/stable/pyproject_toml.html
      - title: uv, building and publishing a package
        url: https://docs.astral.sh/uv/guides/package/

  - id: serve
    stage: deploy
    title:
      en: "Run it like production: a real WSGI server"
      tr: "Production gibi çalıştır: gerçek bir WSGI sunucusu"
    minutes: 30
    needs: [packaging]
    why:
      en: "`flask run` is a development server: it is slow and not built to be safe on the internet. Production uses a WSGI server, a program that talks to the internet and calls your Flask app. Trying it on your own computer first shows problems before a deploy does."
      tr: "`flask run` bir geliştirme sunucusudur: yavaştır ve internette güvenli olacak şekilde yapılmamıştır. Production, internetle konuşan ve Flask uygulamanı çağıran bir program olan WSGI sunucusu kullanır. Önce kendi bilgisayarında denemek sorunları deploy'dan önce gösterir."
    learn:
      en: |
        - **WSGI** is the standard way a Python web app and a server talk to each other
        - Waitress works on Windows, macOS and Linux; Gunicorn is the popular choice on Linux and macOS only
        - The server needs a way to get the app: a factory call like `linkbox:create_app` or a `wsgi.py` file with a variable called `application`
        - Secrets come from environment variables, never from files in Git
      tr: |
        - **WSGI**, bir Python web uygulamasının ve sunucunun birbiriyle konuşma standart yoludur
        - Waitress Windows, macOS ve Linux'ta çalışır; Gunicorn sadece Linux ve macOS'ta popüler seçimdir
        - Sunucunun uygulamayı alması gerekir: `linkbox:create_app` gibi bir fabrika çağrısı ya da `application` adlı değişkeni olan bir `wsgi.py` dosyası
        - Gizli bilgiler ortam değişkenlerinden gelir, Git'teki dosyalardan asla
    do:
      en: |
        1. Add Waitress with `uv add waitress`.
        2. Create `wsgi.py` in the project folder with the code below. Some hosts (including PythonAnywhere) need a file like it.
        3. Set `FLASK_SECRET_KEY` in this terminal, as in the security step (make a new random key if you closed the terminal).
        4. Start the server with the command below and open http://127.0.0.1:8000. Debug mode is off now. Register, log in and add a link.
        5. Look at the response headers with `curl -I`: you should see your security headers and `Cache-Control: no-store`.
        6. Stop with Ctrl+C. On Linux or macOS you can try Gunicorn too (see the Gunicorn line, from a temporary install with `uv run --with gunicorn`).
        7. Commit your work.
      tr: |
        1. `uv add waitress` ile Waitress'i ekle.
        2. Proje klasöründe aşağıdaki kodla `wsgi.py` dosyasını oluştur. Bazı barındırıcılar (PythonAnywhere dahil) buna benzer bir dosya ister.
        3. Bu terminalde `FLASK_SECRET_KEY` değerini ayarla, güvenlik adımındaki gibi (terminali kapattıysan yeni rastgele bir anahtar üret).
        4. Aşağıdaki komutla sunucuyu başlat ve http://127.0.0.1:8000 adresini aç. Debug modu artık kapalı. Kayıt ol, giriş yap ve bir link ekle.
        5. Yanıt header'larına `curl -I` ile bak: güvenlik header'larını ve `Cache-Control: no-store` değerini görmelisin.
        6. Ctrl+C ile durdur. Linux veya macOS'ta Gunicorn'u da deneyebilirsin (Gunicorn satırına bak, `uv run --with gunicorn` ile geçici kurulum yapar).
        7. Çalışmanı commit'le.
    code:
      - file: wsgi.py
        lang: py
        text: |
          from linkbox import create_app

          application = create_app()
      - file: terminal
        lang: sh
        text: |
          uv add waitress
          # in this terminal, set the key first: export FLASK_SECRET_KEY="..."
          uv run waitress-serve --host 127.0.0.1 --port 8000 --call linkbox:create_app
          # in a second terminal
          curl -I http://127.0.0.1:8000/
          # Linux and macOS only, instead of Waitress
          uv run --with gunicorn gunicorn --workers 2 --bind 127.0.0.1:8000 'linkbox:create_app()'
    mistakes:
      - problem:
          en: "Shipping with `app.run(debug=True)` or `flask run --debug` on the server."
          tr: "Sunucuda `app.run(debug=True)` ya da `flask run --debug` ile yayına çıkmak."
        fix:
          en: "Neither is a production server, and debug mode lets visitors run code. Start the app with a WSGI server and no debug flag; Linkbox also refuses to start with the default secret key."
          tr: "İkisi de production sunucusu değildir ve debug modu ziyaretçilerin kod çalıştırmasına izin verir. Uygulamayı bir WSGI sunucusuyla ve debug bayrağı olmadan başlat; Linkbox varsayılan secret key ile başlamayı da reddeder."
      - problem:
          en: "\"RuntimeError: Set the FLASK_SECRET_KEY environment variable\"."
          tr: "\"RuntimeError: Set the FLASK_SECRET_KEY environment variable\" hatası."
        fix:
          en: "That is the guard from the security step working. Set `FLASK_SECRET_KEY` in the same terminal you start the server from."
          tr: "Bu, güvenlik adımındaki korumanın çalışmasıdır. `FLASK_SECRET_KEY` değerini sunucuyu başlattığın terminalde ayarla."
      - problem:
          en: "Port 8000 is already in use."
          tr: "8000 portu zaten kullanılıyor."
        fix:
          en: "Another program (maybe an older server of yours) uses it. Stop it, or choose another port with `--port 8001`."
          tr: "Başka bir program (belki eski sunucun) kullanıyor. Onu durdur ya da `--port 8001` ile başka bir port seç."
    quiz:
      - q:
          en: "Why not run `flask run` on a public server?"
          tr: "Herkese açık bir sunucuda neden `flask run` çalıştırılmaz?"
        options:
          en: ["Flask does not allow it", "It is a development server, not built for traffic or safety", "It cannot read templates"]
          tr: ["Flask buna izin vermez", "Bir geliştirme sunucusudur, trafik ve güvenlik için yapılmamıştır", "Şablonları okuyamaz"]
        answer: 1
        why:
          en: "The built-in server is for development only. A WSGI server such as Waitress or Gunicorn is made to handle many requests safely."
          tr: "Dahili sunucu sadece geliştirme içindir. Waitress ya da Gunicorn gibi bir WSGI sunucusu çok sayıda isteği güvenle karşılamak için yapılmıştır."
    sources:
      - title: Flask, deploying to production
        url: https://flask.palletsprojects.com/en/stable/deploying/
      - title: Flask, Waitress
        url: https://flask.palletsprojects.com/en/stable/deploying/waitress/
      - title: Flask, Gunicorn
        url: https://flask.palletsprojects.com/en/stable/deploying/gunicorn/

  - id: deploy
    stage: deploy
    title:
      en: "Deploy for free on PythonAnywhere"
      tr: "PythonAnywhere'de ücretsiz deploy et"
    minutes: 60
    needs: [serve]
    why:
      en: "Your app is only useful when other people can open it. PythonAnywhere has a free plan with one web app at `yourname.pythonanywhere.com` over HTTPS, and, unlike some free hosts, it keeps files on disk, so your SQLite file survives."
      tr: "Uygulaman ancak başkaları açabildiğinde işe yarar. PythonAnywhere'in ücretsiz planında HTTPS üzerinden `senin-adin.pythonanywhere.com` adresinde bir web uygulaması var ve bazı ücretsiz barındırıcıların aksine dosyaları diskte tutar; SQLite dosyan kalır."
    learn:
      en: |
        - **Free plan limits** (PythonAnywhere help, "Free Accounts Features"): 1 web app with 1 web worker and a **1 month expiry** (you must extend it before it ends), 512 MiB of disk, 100 CPU seconds, 2 consoles. Outbound internet from the free plan is restricted, which Linkbox does not need.
        - Other free option, **Render** free web services: they spin down after 15 minutes without traffic (the first visit then takes about a minute), the disk is **ephemeral**, so a local SQLite file is lost on every restart, redeploy or spin-down, and 750 free instance hours a month. For Linkbox that means losing all data, so use Render only with a database that persists (a Render Postgres database, which is free but expires after 30 days).
        - Config in the host's settings, not in Git: the secret key lives in the WSGI file on the server
        - Updating a deployed app: pull the new code, then press **Reload**
      tr: |
        - **Ücretsiz plan sınırları** (PythonAnywhere yardım sayfası "Free Accounts Features"): 1 web worker'lı 1 web uygulaması ve **1 ay süre sonu** (bitmeden uzatman gerekir), 512 MiB disk, 100 CPU saniyesi, 2 konsol. Ücretsiz planda dışarıya internet erişimi kısıtlıdır; Linkbox'ın buna ihtiyacı yok.
        - Diğer ücretsiz seçenek **Render** ücretsiz web servisleri: 15 dakika trafik gelmezse uyur (sonraki ilk ziyaret yaklaşık bir dakika sürer), disk **geçicidir**; yani yerel bir SQLite dosyası her yeniden başlatmada, yeniden deploy'da ve uykuya geçişte silinir; ayda 750 ücretsiz instance saati var. Linkbox için bu, bütün verinin kaybı demek; Render'ı sadece kalıcı bir veritabanıyla (Render Postgres ücretsizdir ama 30 gün sonra sona erer) kullan.
        - Ayarlar barındırıcının panelinde durur, Git'te değil: secret key sunucudaki WSGI dosyasında yaşar
        - Yayındaki uygulamayı güncelleme: yeni kodu çek, sonra **Reload**'a bas
    do:
      en: |
        1. Export the exact dependency versions to `requirements.txt` with the first command below and commit it. The server installs from it.
        2. Make a GitHub account if you have none, create an empty repository, and push your project (the second block). A private repository works too, but then PythonAnywhere needs credentials to clone it; to keep this simple, use a public one, or upload a zip of the project in the Files tab.
        3. Sign up at pythonanywhere.com for the free "Beginner" account.
        4. Open a **Bash console** (Consoles tab) and run the third block: it clones the code, creates a virtual environment and installs the packages. Use a Python version PythonAnywhere offers (their Flask guide shows 3.13); it must be 3.10 or newer.
        5. Create the database tables. The key can be any text here, the command does not use sessions.
        6. In the **Web** tab press *Add a new web app*, choose *Manual configuration*, and the same Python version as the virtual environment. In the *Virtualenv* box enter `linkbox-env`.
        7. Open the *WSGI configuration file* link of the Web tab, delete its content, and paste the fourth block. Change `yourname` to your PythonAnywhere username and put a new long random key (from `secrets.token_hex(32)`) in place of the example.
        8. Press the green **Reload** button and open `https://yourname.pythonanywhere.com`. Register, log in and add a link. If there is an error, read the **error log** linked in the Web tab.
        9. Put a reminder in your calendar to extend the web app before the month ends.
      tr: |
        1. Aşağıdaki ilk komutla tam bağımlılık sürümlerini `requirements.txt` dosyasına yaz ve commit'le. Sunucu kurulumu buradan yapar.
        2. GitHub hesabın yoksa aç, boş bir repository oluştur ve projeni push'la (ikinci blok). Özel repository de olur ama o zaman PythonAnywhere'in clone için kimlik bilgisine ihtiyacı olur; işi basit tutmak için herkese açık bir repository kullan ya da projenin zip'ini Files sekmesinden yükle.
        3. pythonanywhere.com'da ücretsiz "Beginner" hesabına kaydol.
        4. Bir **Bash console** aç (Consoles sekmesi) ve üçüncü bloğu çalıştır: kodu clone'lar, bir sanal ortam oluşturur ve paketleri kurar. PythonAnywhere'in sunduğu bir Python sürümünü kullan (Flask rehberlerinde 3.13 görünüyor); 3.10 veya daha yeni olmalı.
        5. Veritabanı tablolarını oluştur. Buradaki anahtar herhangi bir metin olabilir, komut session kullanmaz.
        6. **Web** sekmesinde *Add a new web app*'e bas, *Manual configuration* seç ve sanal ortamla aynı Python sürümünü seç. *Virtualenv* kutusuna `linkbox-env` yaz.
        7. Web sekmesindeki *WSGI configuration file* linkini aç, içeriğini sil ve dördüncü bloğu yapıştır. `yourname` yerine PythonAnywhere kullanıcı adını yaz ve örnek anahtarın yerine yeni uzun rastgele bir anahtar koy (`secrets.token_hex(32)` ile üret).
        8. Yeşil **Reload** butonuna bas ve `https://yourname.pythonanywhere.com` adresini aç. Kayıt ol, giriş yap ve bir link ekle. Hata varsa Web sekmesindeki **error log** linkini oku.
        9. Süre ayın sonunda dolmadan web uygulamasını uzatman için takvimine bir hatırlatma koy.
    code:
      - file: terminal
        lang: sh
        text: |
          uv export --no-dev --no-hashes --no-emit-project -o requirements.txt
          git add requirements.txt
          git commit -m "Add requirements.txt for deploy"
      - file: terminal
        lang: sh
        text: |
          # on your computer: connect the folder to your GitHub repository
          git branch -M main
          git remote add origin https://github.com/YOUR-NAME/linkbox.git
          git push -u origin main
      - file: terminal
        lang: sh
        text: |
          # in a PythonAnywhere Bash console
          git clone https://github.com/YOUR-NAME/linkbox.git
          mkvirtualenv --python=/usr/bin/python3.13 linkbox-env
          cd ~/linkbox
          pip install -r requirements.txt
          FLASK_SECRET_KEY=anything python -m flask --app linkbox init-db
      - file: /var/www/yourname_pythonanywhere_com_wsgi.py
        lang: py
        text: |
          import os
          import sys

          path = "/home/yourname/linkbox"
          if path not in sys.path:
              sys.path.insert(0, path)

          os.environ["FLASK_SECRET_KEY"] = "put-a-long-random-key-here"

          from linkbox import create_app  # noqa: E402

          application = create_app()
    mistakes:
      - problem:
          en: "The site shows \"Something went wrong\" (a 500 or 502) after Reload."
          tr: "Reload'dan sonra site \"Something went wrong\" (500 ya da 502) gösteriyor."
        fix:
          en: "Open the error log from the Web tab. The usual causes: the path in the WSGI file does not match your username, the virtualenv name is wrong, or a package is missing from the virtualenv."
          tr: "Web sekmesindeki error log'u aç. Sık nedenler: WSGI dosyasındaki yol kullanıcı adınla eşleşmiyor, virtualenv adı yanlış ya da virtualenv'de bir paket eksik."
      - problem:
          en: "Pushing changes to GitHub, but the live site does not change."
          tr: "Değişiklikleri GitHub'a push'lamak ama canlı sitenin değişmemesi."
        fix:
          en: "The server has its own copy. In a Bash console run `cd ~/linkbox && git pull`, then press Reload in the Web tab. If you changed the schema, run `init-db` again; it only creates what is missing."
          tr: "Sunucunun kendi kopyası var. Bir Bash console'da `cd ~/linkbox && git pull` çalıştır, sonra Web sekmesinde Reload'a bas. Şemayı değiştirdiysen `init-db`'yi yeniden çalıştır; sadece eksik olanı oluşturur."
      - problem:
          en: "Committing the real secret key, or the `instance` folder with the live database."
          tr: "Gerçek secret key'i ya da canlı veritabanının olduğu `instance` klasörünü commit'lemek."
        fix:
          en: "The key lives only in the WSGI file on the server, and `.gitignore` excludes `instance/`. If a key ever reached Git, treat it as leaked and make a new one."
          tr: "Anahtar sadece sunucudaki WSGI dosyasında durur ve `.gitignore` `instance/` klasörünü dışarıda bırakır. Bir anahtar Git'e girdiyse sızmış say ve yenisini üret."
    quiz:
      - q:
          en: "Why is a free Render web service a bad home for a SQLite file?"
          tr: "Ücretsiz bir Render web servisi neden SQLite dosyası için kötü bir yerdir?"
        options:
          en: ["SQLite does not run on Linux", "Its disk is ephemeral: the file is lost on restart, redeploy and spin-down", "It blocks all databases"]
          tr: ["SQLite Linux'ta çalışmaz", "Diski geçicidir: dosya yeniden başlatma, yeniden deploy ve uykuya geçişte silinir", "Bütün veritabanlarını engeller"]
        answer: 1
        why:
          en: "Render's docs say free web services lose local file changes on every restart, redeploy or spin-down. Use an external database there, or a host that keeps its disk."
          tr: "Render dokümanları ücretsiz web servislerinin her yeniden başlatma, yeniden deploy ve uykuya geçişte yerel dosya değişikliklerini kaybettiğini söyler. Orada harici bir veritabanı ya da diskini koruyan bir barındırıcı kullan."
    sources:
      - title: PythonAnywhere, setting up Flask applications
        url: https://help.pythonanywhere.com/pages/Flask/
      - title: PythonAnywhere, free account features
        url: https://help.pythonanywhere.com/pages/FreeAccountsFeatures/
      - title: Render, deploy for free (limits)
        url: https://render.com/docs/free

  - id: health
    stage: monitoring
    title:
      en: "Logs, error pages and a health check"
      tr: "Loglar, hata sayfaları ve bir sağlık kontrolü"
    minutes: 50
    needs: [deploy]
    why:
      en: "When something breaks on a server you cannot open a debugger, you can only read what the app wrote down. Good logs, friendly error pages and a `/health` address that a monitor can call let you find out about problems before your users tell you."
      tr: "Sunucuda bir şey bozulduğunda debugger açamazsın, sadece uygulamanın yazdıklarını okuyabilirsin. İyi loglar, anlaşılır hata sayfaları ve bir izleyicinin çağırabileceği `/health` adresi, kullanıcılar sana söylemeden önce sorunları öğrenmeni sağlar."
    learn:
      en: |
        - Python's `logging`: levels (`INFO`, `WARNING`, `ERROR`), and `app.logger.exception()` which also writes the traceback
        - Configure logging **before** the app is created, as the Flask docs say
        - One log line per request: method, path, status and time. **Never log passwords, tokens or form bodies.** Leave out query strings too, they can hold secrets.
        - Custom `404` and `500` pages, so visitors never see a stack trace
        - A **health check** endpoint: a cheap request that proves the app and its database work. A free uptime checker can call it, and some hosts use it to restart a broken app.
      tr: |
        - Python'un `logging` modülü: seviyeler (`INFO`, `WARNING`, `ERROR`) ve traceback'i de yazan `app.logger.exception()`
        - Flask dokümanlarının dediği gibi logging'i uygulama oluşturulmadan **önce** ayarla
        - İstek başına bir log satırı: method, path, durum ve süre. **Şifreleri, token'ları ya da form gövdelerini asla loglama.** Query string'leri de çıkar, gizli bilgi taşıyabilirler.
        - Ziyaretçilerin asla stack trace görmemesi için özel `404` ve `500` sayfaları
        - **Sağlık kontrolü** endpoint'i: uygulamanın ve veritabanının çalıştığını kanıtlayan ucuz bir istek. Ücretsiz bir uptime kontrolcüsü onu çağırabilir, bazı barındırıcılar bozuk bir uygulamayı yeniden başlatmak için kullanır.
    do:
      en: |
        1. Create `linkbox/health.py` with the code below.
        2. Replace `linkbox/__init__.py`: it configures logging, writes one log line per request, registers the health blueprint and the error pages.
        3. Create `linkbox/templates/404.html` and `linkbox/templates/500.html`.
        4. Add `tests/test_health.py`, run `uv run pytest`, then run the app and open `/health` and a made-up address like `/nope`.
        5. Watch the terminal while you click through the app: one line per request.
        6. Commit, push, then on PythonAnywhere run `git pull` and press Reload. Open `https://yourname.pythonanywhere.com/health`, and find the log lines in the **error log** (the Web tab links it; the Flask logger writes to the error stream).
        7. Point any free uptime checker at the `/health` address so you hear when the site is down. Remember that a PythonAnywhere free web app has a 1 month expiry.
      tr: |
        1. Aşağıdaki kodla `linkbox/health.py` dosyasını oluştur.
        2. `linkbox/__init__.py` dosyasını değiştir: logging'i ayarlar, istek başına bir log satırı yazar, health blueprint'ini ve hata sayfalarını kaydeder.
        3. `linkbox/templates/404.html` ve `linkbox/templates/500.html` dosyalarını oluştur.
        4. `tests/test_health.py` dosyasını ekle, `uv run pytest` çalıştır; sonra uygulamayı çalıştırıp `/health` ve `/nope` gibi uydurma bir adresi aç.
        5. Uygulamada gezinirken terminale bak: her istek için bir satır.
        6. Commit'le, push'la; sonra PythonAnywhere'de `git pull` çalıştırıp Reload'a bas. `https://yourname.pythonanywhere.com/health` adresini aç ve log satırlarını **error log**'da bul (Web sekmesi linkler; Flask logger'ı hata akışına yazar).
        7. Sitenin kapandığını duyman için ücretsiz bir uptime kontrolcüsünü `/health` adresine yönlendir. PythonAnywhere ücretsiz web uygulamasının 1 aylık süresi olduğunu unutma.
    code:
      - file: linkbox/health.py
        lang: py
        text: |
          import sqlite3

          from flask import Blueprint, current_app

          from .db import get_db

          bp = Blueprint("health", __name__)


          @bp.route("/health")
          def health():
              try:
                  get_db().execute("SELECT 1").fetchone()
              except sqlite3.Error:
                  current_app.logger.exception("health check failed")
                  return {"status": "error"}, 503
              return {"status": "ok"}
      - file: linkbox/__init__.py
        lang: py
        text: |
          import os
          import time
          from datetime import timedelta
          from logging.config import dictConfig

          from flask import Flask, g, render_template, request
          from flask_wtf.csrf import CSRFProtect

          csrf = CSRFProtect()


          def create_app(test_config=None):
              # configure logging before the app is created
              dictConfig(
                  {
                      "version": 1,
                      "disable_existing_loggers": False,
                      "formatters": {
                          "default": {
                              "format": "%(asctime)s %(levelname)s %(name)s: %(message)s",
                          }
                      },
                      "handlers": {
                          "wsgi": {
                              "class": "logging.StreamHandler",
                              "stream": "ext://flask.logging.wsgi_errors_stream",
                              "formatter": "default",
                          }
                      },
                      "root": {"level": "INFO", "handlers": ["wsgi"]},
                  }
              )

              app = Flask(__name__, instance_relative_config=True)
              app.config.from_mapping(
                  SECRET_KEY="dev",
                  DATABASE=os.path.join(app.instance_path, "linkbox.sqlite"),
                  MAX_CONTENT_LENGTH=64 * 1024,
                  SESSION_COOKIE_SAMESITE="Lax",
                  SEND_FILE_MAX_AGE_DEFAULT=timedelta(hours=1),
              )

              if test_config is None:
                  # FLASK_SECRET_KEY, FLASK_DATABASE, ... in the environment
                  app.config.from_prefixed_env()
              else:
                  app.config.update(test_config)

              if not (app.debug or app.testing):
                  if app.config["SECRET_KEY"] == "dev":
                      raise RuntimeError(
                          "Set the FLASK_SECRET_KEY environment variable to a long random value."
                      )
                  app.config["SESSION_COOKIE_SECURE"] = True

              os.makedirs(app.instance_path, exist_ok=True)
              csrf.init_app(app)

              from . import auth, db, health, links

              db.init_app(app)
              app.register_blueprint(auth.bp)
              app.register_blueprint(links.bp)
              app.register_blueprint(health.bp)

              @app.errorhandler(404)
              def not_found(error):
                  return render_template("404.html"), 404

              @app.errorhandler(500)
              def server_error(error):
                  return render_template("500.html"), 500

              @app.before_request
              def start_timer():
                  g.start = time.perf_counter()

              @app.after_request
              def add_headers_and_log(response):
                  response.headers["X-Content-Type-Options"] = "nosniff"
                  response.headers["Referrer-Policy"] = "same-origin"
                  response.headers["Content-Security-Policy"] = (
                      "default-src 'self'; frame-ancestors 'none'; form-action 'self'"
                  )
                  if request.endpoint != "static":
                      # personal pages must not be kept by browsers or shared caches
                      response.headers.setdefault("Cache-Control", "no-store")
                      start = g.get("start")
                      ms = (time.perf_counter() - start) * 1000 if start else 0.0
                      app.logger.info(
                          "%s %s %s %.1f ms", request.method, request.path, response.status_code, ms
                      )
                  return response

              return app
      - file: linkbox/templates/404.html
        lang: html
        text: |
          {% extends "base.html" %}
          {% block title %}Not found{% endblock %}
          {% block content %}
            <h1>Page not found</h1>
            <p>That address does not exist. <a href="{{ url_for('links.index') }}">Go back to your links</a>.</p>
          {% endblock %}
      - file: linkbox/templates/500.html
        lang: html
        text: |
          {% extends "base.html" %}
          {% block title %}Something went wrong{% endblock %}
          {% block content %}
            <h1>Something went wrong</h1>
            <p>It is our fault, not yours, and it has been logged. Please try again in a moment.</p>
          {% endblock %}
      - file: tests/test_health.py
        lang: py
        text: |
          def test_health_is_ok(client):
              response = client.get("/health")
              assert response.status_code == 200
              assert response.json == {"status": "ok"}


          def test_unknown_address_shows_the_404_page(client):
              response = client.get("/nope")
              assert response.status_code == 404
              assert b"Page not found" in response.data


          def test_unexpected_error_shows_the_500_page(app):
              app.config["PROPAGATE_EXCEPTIONS"] = False

              @app.route("/boom")
              def boom():
                  raise RuntimeError("test error")

              response = app.test_client().get("/boom")
              assert response.status_code == 500
              assert b"Something went wrong" in response.data
      - file: terminal
        lang: sh
        text: |
          uv run pytest
          uv run flask --app linkbox run --debug
          # in a second terminal
          curl http://127.0.0.1:5000/health
    mistakes:
      - problem:
          en: "Logging whole request bodies or `request.form` \"to debug login\"."
          tr: "\"Girişi debug etmek için\" bütün request body'lerini ya da `request.form`'u loglamak."
        fix:
          en: "Then passwords sit in the logs, which many people can read and which are kept for a long time. Log events and ids (\"login failed for user 12\"), never secrets."
          tr: "O zaman şifreler, birçok kişinin okuyabildiği ve uzun süre saklanan loglarda durur. Olayları ve id'leri logla (\"12 numaralı kullanıcı için giriş başarısız\"), sırları asla."
      - problem:
          en: "A health check that only returns \"ok\" without touching the database."
          tr: "Veritabanına dokunmadan sadece \"ok\" dönen bir sağlık kontrolü."
        fix:
          en: "It says \"healthy\" while every real page fails. Do one cheap query, like `SELECT 1`, but nothing heavy: monitors call it every minute."
          tr: "Her gerçek sayfa hata verirken \"sağlıklı\" der. `SELECT 1` gibi ucuz bir sorgu çalıştır ama ağır bir şey yapma: izleyiciler onu her dakika çağırır."
      - problem:
          en: "Showing the error text or traceback in the 500 page."
          tr: "500 sayfasında hata metnini ya da traceback'i göstermek."
        fix:
          en: "Visitors learn nothing useful and attackers learn how the app is built. Show a short message; the details go to the log."
          tr: "Ziyaretçi işe yarar bir şey öğrenmez, saldırgan uygulamanın nasıl yapıldığını öğrenir. Kısa bir mesaj göster; ayrıntılar loga gider."
    quiz:
      - q:
          en: "Where do the details of an unexpected error belong?"
          tr: "Beklenmeyen bir hatanın ayrıntıları nereye aittir?"
        options:
          en: ["In the 500 page, so users can report them", "In the log, while the user sees a short friendly page", "Nowhere, errors should be hidden"]
          tr: ["500 sayfasına, kullanıcılar bildirebilsin diye", "Loga; kullanıcı ise kısa ve anlaşılır bir sayfa görür", "Hiçbir yere, hatalar gizlenmeli"]
        answer: 1
        why:
          en: "Logs are for you. The page is for the visitor. Flask logs the full traceback of an unhandled exception for you."
          tr: "Loglar senin için, sayfa ziyaretçi için. Flask, yakalanmayan bir exception'ın tüm traceback'ini senin yerine loglar."
    sources:
      - title: Flask, logging
        url: https://flask.palletsprojects.com/en/stable/logging/
      - title: Flask, handling application errors
        url: https://flask.palletsprojects.com/en/stable/errorhandling/
      - title: Python, logging HOWTO
        url: https://docs.python.org/3/howto/logging.html

  - id: next
    stage: advanced
    title:
      en: "Run the tests on every push and plan what comes next"
      tr: "Her push'ta testleri çalıştır ve sonraki adımları planla"
    minutes: 30
    needs: [health]
    why:
      en: "Tests only help if they run every time. A small GitHub Actions workflow runs them for every push, so you hear about a break within a minute. After that, the real growth path is a list of well-known next skills."
      tr: "Testler ancak her seferinde çalışırsa işe yarar. Küçük bir GitHub Actions workflow'u onları her push'ta çalıştırır, böylece bir bozulmayı bir dakika içinde duyarsın. Sonrasında gerçek gelişim yolu, iyi bilinen sıradaki becerilerin listesidir."
    learn:
      en: |
        - A **workflow** file in `.github/workflows/` tells GitHub to run commands on every push. See the GitHub Actions cheatsheet.
        - **Migrations** (Alembic, through Flask-Migrate, with SQLAlchemy): change a table's shape without deleting data. Linkbox's "delete the database" shortcut only works while there is no real data.
        - **Rate limiting** (Flask-Limiter) to slow down password guessing, and a real database like PostgreSQL when you outgrow one SQLite file
        - Password reset by email, a JSON API in its own blueprint, background jobs, and containers with Docker
        - Read the Flask docs sections on security, configuration and patterns once, start to end
      tr: |
        - `.github/workflows/` içindeki bir **workflow** dosyası GitHub'a her push'ta komut çalıştırmasını söyler. GitHub Actions kopya kâğıdına bak.
        - **Migration**'lar (SQLAlchemy ile Flask-Migrate üzerinden Alembic): veriyi silmeden bir tablonun şeklini değiştirir. Linkbox'ın "veritabanını sil" kısayolu sadece gerçek veri yokken işe yarar.
        - Şifre tahminini yavaşlatmak için **rate limiting** (Flask-Limiter) ve tek bir SQLite dosyası yetmeyince PostgreSQL gibi gerçek bir veritabanı
        - E-postayla şifre sıfırlama, kendi blueprint'inde bir JSON API, arka plan işleri ve Docker ile container'lar
        - Flask dokümanlarındaki güvenlik, yapılandırma ve desenler bölümlerini baştan sona bir kez oku
    do:
      en: |
        1. Create `.github/workflows/test.yml` with the workflow below.
        2. Commit and push. Open the *Actions* tab of your repository and watch the run turn green.
        3. Break a test on purpose in a new branch, push it, and see the run fail. Then fix it.
        4. Pick one item from the list above as your next project. A good first one: add a "tags" column to links and a filter, with a test for it.
      tr: |
        1. Aşağıdaki workflow ile `.github/workflows/test.yml` dosyasını oluştur.
        2. Commit'le ve push'la. Repository'nin *Actions* sekmesini aç ve çalışmanın yeşile dönmesini izle.
        3. Yeni bir branch'te bilerek bir testi boz, push'la ve çalışmanın başarısız olduğunu gör. Sonra düzelt.
        4. Yukarıdaki listeden bir maddeyi bir sonraki projen olarak seç. İyi bir ilk fikir: linklere bir "tags" sütunu ve bir filtre ekle, bunun için de test yaz.
    code:
      - file: .github/workflows/test.yml
        lang: yaml
        text: |
          name: tests

          on:
            push:
            pull_request:

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: astral-sh/setup-uv@v10.3.0
                - run: uv sync
                - run: uv run pytest
    mistakes:
      - problem:
          en: "The workflow does not run at all."
          tr: "Workflow hiç çalışmıyor."
        fix:
          en: "The file must be in `.github/workflows/` (with the dot) and end in `.yml` or `.yaml`, and be pushed to GitHub. Check the *Actions* tab for a YAML error."
          tr: "Dosya `.github/workflows/` içinde (noktayla) olmalı, `.yml` ya da `.yaml` ile bitmeli ve GitHub'a push'lanmış olmalı. YAML hatası için *Actions* sekmesine bak."
      - problem:
          en: "Adding many features at once without tests."
          tr: "Test yazmadan bir sürü özelliği bir anda eklemek."
        fix:
          en: "Add one feature, write its test, push, check that CI is green, then the next one. Small steps keep a project fixable."
          tr: "Bir özellik ekle, testini yaz, push'la, CI'ın yeşil olduğunu kontrol et, sonra sıradakine geç. Küçük adımlar projeyi onarılabilir tutar."
    quiz:
      - q:
          en: "What does the workflow do on every push?"
          tr: "Workflow her push'ta ne yapar?"
        options:
          en: ["Deploys the app to PythonAnywhere", "Installs the dependencies and runs the tests on a clean machine", "Rewrites your code"]
          tr: ["Uygulamayı PythonAnywhere'e deploy eder", "Temiz bir makinede bağımlılıkları kurar ve testleri çalıştırır", "Kodunu yeniden yazar"]
        answer: 1
        why:
          en: "It checks out the code, runs `uv sync` and `uv run pytest`. A clean machine finds problems that only worked on yours."
          tr: "Kodu çeker, `uv sync` ve `uv run pytest` çalıştırır. Temiz bir makine sadece seninkinde çalışan sorunları ortaya çıkarır."
    sources:
      - title: GitHub Actions, building and testing Python
        url: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-python
      - title: uv, using uv in GitHub Actions
        url: https://docs.astral.sh/uv/guides/integration/github/
      - title: Flask, patterns
        url: https://flask.palletsprojects.com/en/stable/patterns/
