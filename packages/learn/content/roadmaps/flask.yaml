  - id: tests
    stage: testing
    title:
      en: "Test the app with pytest and the test client"
      tr: "Uygulamayı pytest ve test client ile test et"
    minutes: 75
    needs: [login]
    why:
      en: "Clicking through the app after every change gets old, and you will miss things. Tests do it in a second, and they are what lets you change code later without fear."
      tr: "Her değişiklikten sonra uygulamada tek tek tıklamak sıkıcı olur ve bir şeyleri kaçırırsın. Testler bunu bir saniyede yapar ve ileride kodu korkmadan değiştirmeni sağlar."
    learn:
      en: |
        - `app.test_client()` sends requests to your app without a server
        - A pytest **fixture** gives each test a fresh app with its own temporary database
        - `assert` checks a result; a test fails when an assertion is false
        - Test the unhappy paths too: bad input, wrong password, someone else's data
        - `TESTING = True` makes errors show up as real exceptions in the test
      tr: |
        - `app.test_client()` uygulamana sunucu olmadan istek gönderir
        - Bir pytest **fixture**'ı her teste kendi geçici veritabanıyla taze bir uygulama verir
        - `assert` bir sonucu kontrol eder; assertion yanlışsa test başarısız olur
        - Mutsuz yolları da test et: kötü girdi, yanlış şifre, başkasının verisi
        - `TESTING = True` hataların testte gerçek exception olarak görünmesini sağlar
    do:
      en: |
        1. Add pytest as a development dependency with the first command below.
        2. Add the pytest settings block to the end of `pyproject.toml`. It tells pytest where the tests are and lets them import `linkbox`.
        3. Create the folder `tests` and the three files below.
        4. Run `uv run pytest`. All tests should pass.
        5. Break something on purpose: remove `AND user_id = ?` from the delete query and run the tests again. The "other user" test fails, which is exactly its job. Put the code back.
        6. Commit your work.
      tr: |
        1. Aşağıdaki ilk komutla pytest'i bir geliştirme bağımlılığı olarak ekle.
        2. pytest ayar bloğunu `pyproject.toml` dosyasının sonuna ekle. pytest'e testlerin nerede olduğunu söyler ve testlerin `linkbox`'ı import etmesini sağlar.
        3. `tests` klasörünü ve aşağıdaki üç dosyayı oluştur.
        4. `uv run pytest` çalıştır. Bütün testler geçmeli.
        5. Bilerek bir şeyi boz: delete sorgusundan `AND user_id = ?` kısmını sil ve testleri yeniden çalıştır. "Başka kullanıcı" testi başarısız olur; işi tam olarak bu. Kodu geri koy.
        6. Çalışmanı commit'le.
    code:
      - file: terminal
        lang: sh
        text: |
          uv add --dev pytest
          uv run pytest
      - file: pyproject.toml
        lang: toml
        text: |
          # add this block at the end of the file
          [tool.pytest.ini_options]
          testpaths = ["tests"]
          pythonpath = ["."]
      - file: tests/conftest.py
        lang: py
        text: |
          import pytest

          from linkbox import create_app
          from linkbox.db import init_db


          @pytest.fixture
          def app(tmp_path):
              app = create_app(
                  {
                      "TESTING": True,
                      "SECRET_KEY": "test",
                      "DATABASE": str(tmp_path / "test.sqlite"),
                  }
              )
              with app.app_context():
                  init_db()
              return app


          @pytest.fixture
          def client(app):
              return app.test_client()


          class AuthActions:
              def __init__(self, client):
                  self._client = client

              def register(self, username="alice", password="correct horse"):
                  return self._client.post(
                      "/auth/register", data={"username": username, "password": password}
                  )

              def login(self, username="alice", password="correct horse"):
                  return self._client.post(
                      "/auth/login", data={"username": username, "password": password}
                  )

              def logout(self):
                  return self._client.post("/auth/logout")


          @pytest.fixture
          def auth(client):
              return AuthActions(client)
      - file: tests/test_auth.py
        lang: py
        text: |
          from flask import session

          from linkbox.db import get_db


          def test_register_stores_a_hash_not_the_password(app, auth):
              auth.register()
              with app.app_context():
                  row = get_db().execute("SELECT password_hash FROM user").fetchone()
              assert row["password_hash"] != "correct horse"
              assert "correct horse" not in row["password_hash"]


          def test_register_rejects_short_password(client, auth):
              response = auth.register(password="short")
              assert b"The password must be 8 to 128 characters." in response.data


          def test_register_rejects_taken_username(client, auth):
              auth.register()
              response = auth.register()
              assert b"That username is already taken." in response.data


          def test_login_and_logout(client, auth):
              auth.register()
              with client:
                  response = auth.login()
                  assert response.status_code == 302
                  client.get("/")
                  assert session["user_id"] == 1
                  auth.logout()
                  assert "user_id" not in session


          def test_wrong_password_is_refused(client, auth):
              auth.register()
              response = auth.login(password="wrong password")
              assert b"Wrong username or password." in response.data
      - file: tests/test_links.py
        lang: py
        text: |
          from linkbox.db import get_db


          def add_link(client, title="Flask docs", url="https://flask.palletsprojects.com/"):
              return client.post("/add", data={"title": title, "url": url}, follow_redirects=True)


          def test_home_asks_visitors_to_log_in(client):
              response = client.get("/")
              assert b"Create an account" in response.data


          def test_add_requires_login(client):
              response = client.get("/add")
              assert response.status_code == 302
              assert "/auth/login" in response.headers["Location"]


          def test_add_and_list_a_link(client, auth):
              auth.register()
              auth.login()
              response = add_link(client)
              assert b"Link saved." in response.data
              assert b"Flask docs" in response.data


          def test_rejects_a_javascript_address(app, client, auth):
              auth.register()
              auth.login()
              response = add_link(client, url="javascript:alert(1)")
              assert b"The address must start with http:// or https://." in response.data
              with app.app_context():
                  assert get_db().execute("SELECT COUNT(*) FROM link").fetchone()[0] == 0


          def test_titles_are_escaped(client, auth):
              auth.register()
              auth.login()
              response = add_link(client, title="<script>alert(1)</script>")
              assert b"<script>alert(1)</script>" not in response.data
              assert b"&lt;script&gt;" in response.data


          def test_delete_own_link(client, auth):
              auth.register()
              auth.login()
              add_link(client)
              response = client.post("/1/delete", follow_redirects=True)
              assert b"Link deleted." in response.data


          def test_cannot_delete_someone_elses_link(client, auth):
              auth.register("alice")
              auth.login("alice")
              add_link(client)
              auth.logout()
              auth.register("bob")
              auth.login("bob")
              response = client.post("/1/delete")
              assert response.status_code == 404
    mistakes:
      - problem:
          en: "\"ModuleNotFoundError: No module named 'linkbox'\" when running pytest."
          tr: "pytest çalıştırırken \"ModuleNotFoundError: No module named 'linkbox'\" hatası."
        fix:
          en: "Check the `pythonpath = [\".\"]` line in `pyproject.toml` and run `uv run pytest` from the project folder."
          tr: "`pyproject.toml` içindeki `pythonpath = [\".\"]` satırını kontrol et ve `uv run pytest` komutunu proje klasöründen çalıştır."
      - problem:
          en: "Tests share one database, so a test passes alone but fails with the others."
          tr: "Testler tek bir veritabanını paylaşıyor; bir test tek başına geçiyor ama diğerleriyle başarısız oluyor."
        fix:
          en: "Give every test its own database, like the `tmp_path` fixture does. Tests must never depend on the order they run in."
          tr: "Her teste, `tmp_path` fixture'ının yaptığı gibi kendi veritabanını ver. Testler hiçbir zaman çalışma sıralarına bağlı olmamalı."
      - problem:
          en: "Only testing the happy path."
          tr: "Sadece mutlu yolu test etmek."
        fix:
          en: "Bugs and attacks live in the unhappy paths: bad input, missing login, other people's data. Write a test for each rule you care about."
          tr: "Hatalar ve saldırılar mutsuz yollarda yaşar: kötü girdi, eksik giriş, başkalarının verisi. Önemsediğin her kural için bir test yaz."
    quiz:
      - q:
          en: "Why does each test get its own database file in `tmp_path`?"
          tr: "Her test neden `tmp_path` içinde kendi veritabanı dosyasını alıyor?"
        options:
          en: ["pytest cannot read other files", "Tests stay independent and never touch your real data", "SQLite needs a new file for each query"]
          tr: ["pytest başka dosyaları okuyamaz", "Testler birbirinden bağımsız kalır ve gerçek verine dokunmaz", "SQLite her sorgu için yeni dosya ister"]
        answer: 1
        why:
          en: "A fresh empty database means the result of a test cannot depend on another test, and your own links in `instance/` are safe."
          tr: "Taze, boş bir veritabanı bir testin sonucunun başka bir teste bağlı olmamasını sağlar ve `instance/` içindeki kendi linklerin güvende kalır."
    sources:
      - title: Flask, testing
        url: https://flask.palletsprojects.com/en/stable/testing/
      - title: Flask tutorial, test coverage
        url: https://flask.palletsprojects.com/en/stable/tutorial/tests/
      - title: pytest, how to use fixtures
        url: https://docs.pytest.org/en/stable/how-to/fixtures.html

  - id: security
    stage: security
    title:
      en: "Security: CSRF, a real secret key, safe cookies and headers"
      tr: "Güvenlik: CSRF, gerçek bir secret key, güvenli çerezler ve header'lar"
    minutes: 70
    needs: [tests]
    why:
      en: "Your app now holds accounts, so it can be attacked. Four cheap defences stop most beginner-level problems: a CSRF token on every form, a secret key that only the server knows, cookies the browser protects, and a few response headers."
      tr: "Uygulamanda artık hesaplar var, yani saldırıya uğrayabilir. Dört ucuz savunma, yeni başlayan seviyesindeki sorunların çoğunu durdurur: her formda CSRF token'ı, sadece sunucunun bildiği bir secret key, tarayıcının koruduğu çerezler ve birkaç yanıt header'ı."
    learn:
      en: |
        - **CSRF** (cross-site request forgery): another website makes your browser send a POST to your app, with your logged-in cookie. A secret per-session **token** in each form stops it, because the other site cannot know it.
        - **SECRET_KEY** signs the session. If it leaks or is the default `"dev"`, anyone can forge a login cookie. Read it from the environment, never from Git.
        - `SECRET_KEY_FALLBACKS`: a list of old keys, so you can change the key without logging everyone out
        - Session cookie settings: `HttpOnly` (JavaScript cannot read it, the default), `Secure` (only over HTTPS), `SameSite=Lax` (not sent on cross-site POSTs)
        - **Debug mode must be off** on a public server: the debugger runs code for whoever can reach it
        - Headers: `Content-Security-Policy`, `X-Content-Type-Options`, `Referrer-Policy`
        - Limits on request size (`MAX_CONTENT_LENGTH`)
      tr: |
        - **CSRF** (cross-site request forgery): başka bir web sitesi tarayıcının, giriş çerezinle birlikte, uygulamana bir POST göndermesini sağlar. Her formdaki oturuma özel gizli bir **token** bunu durdurur, çünkü diğer site onu bilemez.
        - **SECRET_KEY** session'ı imzalar. Sızarsa ya da varsayılan `"dev"` ise herkes sahte bir giriş çerezi üretebilir. Onu ortam değişkeninden oku, Git'ten asla.
        - `SECRET_KEY_FALLBACKS`: eski anahtarların listesi; anahtarı değiştirirken herkesin oturumunu kapatmazsın
        - Session çerez ayarları: `HttpOnly` (JavaScript okuyamaz, varsayılan), `Secure` (sadece HTTPS üzerinden), `SameSite=Lax` (siteler arası POST'larda gönderilmez)
        - Herkese açık bir sunucuda **debug modu kapalı olmalı**: debugger erişebilen herkes için kod çalıştırır
        - Header'lar: `Content-Security-Policy`, `X-Content-Type-Options`, `Referrer-Policy`
        - İstek boyutu sınırları (`MAX_CONTENT_LENGTH`)
    do:
      en: |
        1. Install Flask-WTF. Linkbox only uses its `CSRFProtect`. Also raise the Flask requirement to 3.1.3, which fixed a session security issue.
        2. Replace `linkbox/__init__.py` with the version below. It protects every POST with CSRF, refuses to start in production with the default secret key, sets safe cookie options, limits request size and adds the headers.
        3. Add the hidden `csrf_token` field to every form: replace the five templates below. In a template, `{{ csrf_token() }}` writes the token for the current session.
        4. Run `uv run pytest`. The tests now fail, because they post without a token. In `tests/conftest.py` add `"WTF_CSRF_ENABLED": False` to the test config; real CSRF behaviour gets its own test.
        5. Add `tests/test_security.py`, run the tests again, and then try the app in the browser. Saving a link still works.
        6. Check the secret key rule: start the app without `--debug` and see the error. Then create a key and run it again (the next steps use this). Commands like `init-db` or `shell` need the same: either the key in the terminal, or `--debug` after `--app linkbox`.
        7. Commit your work.
      tr: |
        1. Flask-WTF'i kur. Linkbox sadece onun `CSRFProtect`'ini kullanır. Flask gereksinimini de, bir session güvenlik sorununu düzelten 3.1.3'e çıkar.
        2. `linkbox/__init__.py` dosyasını aşağıdaki sürümle değiştir. Her POST'u CSRF ile korur, varsayılan secret key ile production'da başlamayı reddeder, güvenli çerez seçeneklerini ayarlar, istek boyutunu sınırlar ve header'ları ekler.
        3. Her forma gizli `csrf_token` alanını ekle: aşağıdaki beş şablonu değiştir. Bir şablonda `{{ csrf_token() }}` mevcut oturum için token'ı yazar.
        4. `uv run pytest` çalıştır. Testler artık başarısız olur, çünkü token olmadan POST ediyorlar. `tests/conftest.py` içindeki test ayarına `"WTF_CSRF_ENABLED": False` ekle; gerçek CSRF davranışının kendi testi var.
        5. `tests/test_security.py` dosyasını ekle, testleri yeniden çalıştır, sonra uygulamayı tarayıcıda dene. Link kaydetmek hâlâ çalışır.
        6. Secret key kuralını kontrol et: uygulamayı `--debug` olmadan başlat ve hatayı gör. Sonra bir anahtar üretip yeniden çalıştır (sonraki adımlar bunu kullanır). `init-db` ya da `shell` gibi komutlar da aynısını ister: terminalde anahtar ya da `--app linkbox`'tan sonra `--debug`.
        7. Çalışmanı commit'le.
