    mistakes:
      - problem:
          en: "Hiding the CSRF problem by turning CSRF protection off, or exempting views."
          tr: "CSRF korumasını kapatarak ya da view'ları muaf tutarak sorunu gizlemek."
        fix:
          en: "Add the hidden token field instead. Only the tests turn it off, and one test checks that the real protection works. A POST that works without a token is exactly what an attacker uses."
          tr: "Bunun yerine gizli token alanını ekle. Sadece testler onu kapatır ve bir test gerçek korumanın çalıştığını kontrol eder. Token olmadan çalışan bir POST tam olarak saldırganın kullandığı şeydir."
      - problem:
          en: "Writing the real `SECRET_KEY` in the code or committing a `.env` file with it."
          tr: "Gerçek `SECRET_KEY`'i koda yazmak ya da onu içeren bir `.env` dosyasını commit'lemek."
        fix:
          en: "Anything in Git is public the day the repo is. Keep the key in an environment variable. If it ever leaked, make a new one: all sessions then end, which is fine."
          tr: "Git'teki her şey repo açıldığı gün herkese açık olur. Anahtarı bir ortam değişkeninde tut. Sızdıysa yenisini üret: bütün oturumlar kapanır, sorun değil."
      - problem:
          en: "Login does not stick when you run the app without `--debug` on `http://` in Safari."
          tr: "Safari'de uygulamayı `--debug` olmadan `http://` üzerinde çalıştırınca giriş kalıcı olmuyor."
        fix:
          en: "Outside debug mode the session cookie is `Secure`, so it is only sent over HTTPS. Chrome and Firefox allow it on `localhost`; Safari does not. Test with `--debug` locally, and use the real HTTPS address after deploy."
          tr: "Debug modu dışında session çerezi `Secure` olur, yani sadece HTTPS üzerinden gönderilir. Chrome ve Firefox `localhost`'ta buna izin verir, Safari vermez. Yerelde `--debug` ile test et, deploy sonrası gerçek HTTPS adresini kullan."
    quiz:
      - q:
          en: "What does a CSRF token protect against?"
          tr: "CSRF token'ı neye karşı korur?"
        options:
          en: ["Passwords being guessed", "Another website making your logged-in browser send a request to your app", "SQL injection"]
          tr: ["Şifrelerin tahmin edilmesine", "Başka bir web sitesinin, giriş yapmış tarayıcını uygulamana istek göndermeye zorlamasına", "SQL injection'a"]
        answer: 1
        why:
          en: "The browser sends cookies automatically, even for requests started by another site. The token is only in your own pages, so the other site cannot add it."
          tr: "Tarayıcı çerezleri, başka bir sitenin başlattığı isteklerde bile otomatik gönderir. Token sadece senin sayfalarında olduğu için diğer site onu ekleyemez."
      - q:
          en: "Why does the app refuse to start in production with `SECRET_KEY = \"dev\"`?"
          tr: "Uygulama production'da `SECRET_KEY = \"dev\"` ile neden başlamayı reddediyor?"
        options:
          en: ["Because \"dev\" is too short to type", "Anyone who knows the key can forge a session cookie and log in as any user", "Flask only accepts hex keys"]
          tr: ["Çünkü \"dev\" yazmak için çok kısa", "Anahtarı bilen herkes sahte bir session çerezi üretip herhangi bir kullanıcı olarak girebilir", "Flask sadece hex anahtar kabul eder"]
        answer: 1
        why:
          en: "The session cookie is signed with the key. The default is public knowledge, so a cookie signed with it would be accepted."
          tr: "Session çerezi anahtarla imzalanır. Varsayılan anahtar herkesçe bilinir, bu yüzden onunla imzalanmış bir çerez kabul edilir."
