      - file: tests/test_security.py
        lang: py
        text: |
          import pytest

          from linkbox import create_app
          from linkbox.db import init_db


          def make_app(tmp_path, **extra):
              app = create_app(
                  {
                      "TESTING": True,
                      "SECRET_KEY": "test",
                      "DATABASE": str(tmp_path / "test.sqlite"),
                      **extra,
                  }
              )
              with app.app_context():
                  init_db()
              return app


          def test_post_without_a_csrf_token_is_refused(tmp_path):
              client = make_app(tmp_path).test_client()
              response = client.post("/auth/login", data={"username": "a", "password": "b"})
              assert response.status_code == 400


          def test_forms_carry_a_csrf_token(tmp_path):
              client = make_app(tmp_path).test_client()
              response = client.get("/auth/login")
              assert b'name="csrf_token"' in response.data


          def test_security_headers_are_set(client):
              response = client.get("/")
              assert response.headers["X-Content-Type-Options"] == "nosniff"
              assert "frame-ancestors 'none'" in response.headers["Content-Security-Policy"]


          def test_default_secret_key_is_refused_in_production(tmp_path):
              with pytest.raises(RuntimeError):
                  create_app({"DATABASE": str(tmp_path / "test.sqlite")})
