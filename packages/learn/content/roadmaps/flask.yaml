id: flask
title: Flask
summary:
  en: "From an empty computer to your own Flask web app on the internet. You build Linkbox, a small link saver with accounts, step by step: pages, a SQLite database, forms, login, tests, security, packaging and a free deploy. You understand why each step is there."
  tr: "Boş bir bilgisayardan internette yayında olan kendi Flask web uygulamana. Linkbox adlı, hesapları olan küçük bir link kaydedici yazarsın: sayfalar, SQLite veritabanı, formlar, giriş, testler, güvenlik, paketleme ve ücretsiz deploy. Her adımın neden orada olduğunu anlarsın."
teacher: backend
project:
  en: 'Linkbox: a small web app where people register, log in and save links with a title. It uses an app factory and blueprints, Jinja templates, validated forms, SQLite (sqlite3), hashed passwords, CSRF protection, pytest tests, a pyproject.toml package, the Waitress server, logs and a health check, and runs free on PythonAnywhere.'
  tr: 'Linkbox: insanların kayıt olup giriş yaptığı ve başlıklı linkler kaydettiği küçük bir web uygulaması. Uygulama fabrikası (app factory) ve blueprint''ler, Jinja şablonları, doğrulanan formlar, SQLite (sqlite3), hash''lenmiş şifreler, CSRF koruması, pytest testleri, pyproject.toml paketi, Waitress sunucusu, loglar ve bir sağlık kontrolü kullanır; PythonAnywhere''de ücretsiz çalışır.'
detect:
  pip: [flask]
version: "3.1"
latest: pypi:flask
checked: 2026-10
after: [python]
sheets: [python, flask, sql, http, auth, caching, git, github-actions]
steps:
  - id: setup
    stage: setup
    title:
      en: "Check your tools: uv, Python, an editor and Git"
      tr: "Araçlarını kontrol et: uv, Python, bir editör ve Git"
    minutes: 30
    why:
      en: "A Flask app is a Python program plus a few packages. uv gives each project its own private folder of packages and runs your commands inside it, so Flask for this project never mixes with anything else on your computer."
      tr: "Bir Flask uygulaması, bir Python programı ve birkaç pakettir. uv her projeye kendi özel paket klasörünü verir ve komutlarını onun içinde çalıştırır; böylece bu projenin Flask'ı bilgisayarındaki başka hiçbir şeyle karışmaz."
    learn:
      en: |
        - What a **virtual environment** is: a private folder of packages for one project
        - What uv does: it installs Python, creates that folder for you and runs commands inside it
        - Flask 3.1 needs Python 3.9 or newer; this roadmap works with any recent Python
        - If you did the Python roadmap, you already have everything here: just run the checks
      tr: |
        - **Sanal ortam** (virtual environment) nedir: tek bir projeye ait özel paket klasörü
        - uv'nin ne yaptığı: Python'u kurar, bu klasörü senin için oluşturur ve komutları onun içinde çalıştırır
        - Flask 3.1 için Python 3.9 veya daha yenisi gerekir; bu yol haritası güncel her Python ile çalışır
        - Python yol haritasını yaptıysan burada her şey hazır: sadece kontrolleri çalıştır
    do:
      en: |
        1. Install **uv**. On macOS or Linux run the first command below in a terminal. On Windows run the second one in PowerShell. Then close the terminal and open a new one, so it sees the new program.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor, and its Python extension.
        3. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it.
        4. Run the check commands below. Each should print a version number.
        5. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
      tr: |
        1. **uv**'yi kur. macOS veya Linux'ta bir terminalde aşağıdaki ilk komutu çalıştır. Windows'ta PowerShell'de ikinci komutu çalıştır. Sonra terminali kapatıp yenisini aç ki yeni programı görsün.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u (code.visualstudio.com) ve Python eklentisini kur.
        3. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir.
        4. Aşağıdaki kontrol komutlarını çalıştır. Her biri bir sürüm numarası yazmalı.
        5. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
    code:
      - file: terminal
        lang: sh
        text: |
          # macOS and Linux
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - file: terminal
        lang: powershell
        text: |
          # Windows (PowerShell)
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
      - file: terminal
        lang: sh
        text: |
          uv --version
          git --version
          uv python install 3.15
          uv run --python 3.15 python --version
    mistakes:
      - problem:
          en: "\"command not found: uv\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found: uv\" hatası."
        fix:
          en: "Close the terminal and open a new one so it reloads its list of programs. On Windows, restart the computer if it still fails."
          tr: "Terminali kapatıp yenisini aç ki program listesini yeniden yüklesin. Windows'ta hâlâ olmuyorsa bilgisayarı yeniden başlat."
      - problem:
          en: "Installing Flask into the Python that came with the system with a bare `pip install`, and getting \"externally-managed-environment\"."
          tr: "Flask'ı çıplak bir `pip install` ile sistemle gelen Python'a kurmaya çalışmak ve \"externally-managed-environment\" hatası almak."
        fix:
          en: "Never install project packages into the system Python. Use uv (`uv add`, `uv run`) so every project gets its own environment."
          tr: "Proje paketlerini asla sistem Python'una kurma. uv'yi (`uv add`, `uv run`) kullan, böylece her proje kendi ortamını alır."
    quiz:
      - q:
          en: "Why does each project get its own virtual environment?"
          tr: "Her proje neden kendi sanal ortamını alır?"
        options:
          en: ["It makes Python run faster", "Projects with different package versions cannot break each other", "Flask refuses to run without it"]
          tr: ["Python'u hızlandırır", "Farklı paket sürümleri kullanan projeler birbirini bozmaz", "Flask onsuz çalışmayı reddeder"]
        answer: 1
        why:
          en: "One project may need version 3 of a package and another version 4. Separate folders let both live on one computer."
          tr: "Bir proje bir paketin 3. sürümünü, başkası 4. sürümünü isteyebilir. Ayrı klasörler ikisinin de aynı bilgisayarda yaşamasını sağlar."
    sources:
      - title: uv installation
        url: https://docs.astral.sh/uv/getting-started/installation/
      - title: Flask, installation
        url: https://flask.palletsprojects.com/en/stable/installation/
      - title: Git installation
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: hello
    stage: first-code
    title:
      en: "Create the linkbox project and say hello"
      tr: "linkbox projesini oluştur ve merhaba de"
    minutes: 30
    needs: [setup]
    why:
      en: "The fastest way to understand a web framework is to see a page in your browser. Flask needs only a few lines for that, and its development server reloads your code every time you save."
      tr: "Bir web framework'ünü anlamanın en hızlı yolu tarayıcıda bir sayfa görmektir. Flask bunun için birkaç satır ister ve geliştirme sunucusu her kaydettiğinde kodunu yeniden yükler."
    learn:
      en: |
        - A web app answers **requests** (a browser asking for an address) with **responses** (a page)
        - A **route** connects an address like `/hello/Ada` to a Python function (a **view**)
        - What `--debug` does: it reloads on every save and shows errors in the browser. Use it only on your own computer.
        - Why user input must be escaped before it goes into HTML
      tr: |
        - Bir web uygulaması **istekleri** (tarayıcının bir adres istemesi) **yanıtlarla** (bir sayfa) karşılar
        - **Route**, `/hello/Ada` gibi bir adresi bir Python fonksiyonuna (**view**) bağlar
        - `--debug`'ın ne yaptığı: her kaydedişte yeniden yükler ve hataları tarayıcıda gösterir. Sadece kendi bilgisayarında kullan.
        - Kullanıcıdan gelen yazının HTML'e girmeden önce neden escape edilmesi gerektiği
    do:
      en: |
        1. Create the project folder and set it up with the commands below. `uv init --bare` writes only a `pyproject.toml`; `uv add flask` installs Flask into a private `.venv` folder and records it.
        2. Create the folder `linkbox` inside the project and, in it, the file `linkbox/__init__.py` with the code below. A folder with an `__init__.py` is a Python **package**.
        3. Create `.gitignore` so Git skips files that must not be saved.
        4. Start the development server and open http://127.0.0.1:5000 and http://127.0.0.1:5000/hello/Ada. Change the text, save, and reload the page.
        5. Stop the server with Ctrl+C, then save this first version with Git.
      tr: |
        1. Proje klasörünü oluştur ve aşağıdaki komutlarla hazırla. `uv init --bare` sadece bir `pyproject.toml` yazar; `uv add flask` Flask'ı özel bir `.venv` klasörüne kurar ve kaydeder.
        2. Projenin içinde `linkbox` klasörünü, onun içinde de aşağıdaki kodla `linkbox/__init__.py` dosyasını oluştur. İçinde `__init__.py` olan klasör bir Python **paketidir**.
        3. Git'in kaydetmemesi gereken dosyaları atlaması için `.gitignore` dosyasını oluştur.
        4. Geliştirme sunucusunu başlat ve http://127.0.0.1:5000 ile http://127.0.0.1:5000/hello/Ada adreslerini aç. Yazıyı değiştir, kaydet ve sayfayı yenile.
        5. Sunucuyu Ctrl+C ile durdur, sonra bu ilk sürümü Git ile kaydet.
    code:
      - file: terminal
        lang: sh
        text: |
          mkdir linkbox
          cd linkbox
          uv init --bare
          uv add flask
      - file: linkbox/__init__.py
        lang: py
        text: |
          from flask import Flask
          from markupsafe import escape

          app = Flask(__name__)


          @app.route("/")
          def index():
              return "Hello from Linkbox"


          @app.route("/hello/<name>")
          def hello(name):
              return f"<p>Hello, {escape(name)}!</p>"
      - file: .gitignore
        lang: text
        text: |
          .venv/
          __pycache__/
          instance/
          dist/
          *.egg-info/
          .pytest_cache/
      - file: terminal
        lang: sh
        text: |
          uv run flask --app linkbox run --debug
          # stop with Ctrl+C, then:
          git init
          git add .
          git commit -m "Start Linkbox"
    mistakes:
      - problem:
          en: "\"Error: Could not locate a Flask application\"."
          tr: "\"Error: Could not locate a Flask application\" hatası."
        fix:
          en: "Run the command from the project folder (the one that contains the `linkbox` folder), and check that the file is `linkbox/__init__.py`, with two underscores on each side."
          tr: "Komutu proje klasöründen (içinde `linkbox` klasörü olan klasör) çalıştır ve dosyanın `linkbox/__init__.py` olduğunu, iki yanında ikişer alt çizgi bulunduğunu kontrol et."
      - problem:
          en: "Putting the visitor's text straight into HTML, like `f\"<p>{name}</p>\"`."
          tr: "Ziyaretçinin yazdığı metni doğrudan HTML'e koymak, örneğin `f\"<p>{name}</p>\"`."
        fix:
          en: "Someone could send `<script>` as the name and run code in other people's browsers (XSS). Escape it with `escape()`, or better, use templates, which escape for you (next steps)."
          tr: "Biri isim olarak `<script>` gönderip başkalarının tarayıcısında kod çalıştırabilir (XSS). `escape()` ile escape et ya da daha iyisi, bunu senin yerine yapan şablonları kullan (sonraki adımlar)."
      - problem:
          en: "Leaving `--debug` on when the app is on the internet."
          tr: "Uygulama internetteyken `--debug`'ı açık bırakmak."
        fix:
          en: "The debugger lets anyone who sees an error page run Python on your server. It is for your own computer only. From the deploy steps on, it is never used."
          tr: "Debugger, bir hata sayfası gören herkesin sunucunda Python çalıştırmasına izin verir. Sadece kendi bilgisayarın içindir. Deploy adımlarından itibaren hiç kullanılmaz."
    quiz:
      - q:
          en: "What does `@app.route(\"/hello/<name>\")` do?"
          tr: "`@app.route(\"/hello/<name>\")` ne yapar?"
        options:
          en: ["It creates a file called hello.html", "It runs the function below it when someone opens an address like /hello/Ada, and passes \"Ada\" as name", "It starts the server"]
          tr: ["hello.html adlı bir dosya oluşturur", "Biri /hello/Ada gibi bir adresi açınca altındaki fonksiyonu çalıştırır ve name olarak \"Ada\" verir", "Sunucuyu başlatır"]
        answer: 1
        why:
          en: "A route maps an address pattern to a function. The part in angle brackets becomes an argument."
          tr: "Route, bir adres desenini bir fonksiyona bağlar. Köşeli parantez içindeki kısım fonksiyonun argümanı olur."
    sources:
      - title: Flask quickstart, a minimal application
        url: https://flask.palletsprojects.com/en/stable/quickstart/
      - title: Flask quickstart, debug mode
        url: https://flask.palletsprojects.com/en/stable/quickstart/#debug-mode
      - title: uv, working on projects
        url: https://docs.astral.sh/uv/guides/projects/

  - id: structure
    stage: basics
    title:
      en: "Grow the app: an app factory and a blueprint"
      tr: "Uygulamayı büyüt: uygulama fabrikası ve bir blueprint"
    minutes: 45
    needs: [hello]
    why:
      en: "A single global `app` is fine for ten lines, not for a real app. A function that builds the app (the factory) lets tests create fresh apps with their own settings, and blueprints split the routes into files by topic."
      tr: "Tek bir global `app` on satır için yeterlidir, gerçek bir uygulama için değil. Uygulamayı kuran bir fonksiyon (fabrika) testlerin kendi ayarlarıyla taze uygulamalar oluşturmasını sağlar; blueprint'ler de route'ları konuya göre dosyalara böler."
    learn:
      en: |
        - **Application factory**: a function `create_app()` that builds and returns the app. Flask finds it by that name.
        - **Blueprint**: a group of routes in its own file, registered on the app
        - **Configuration**: settings stored in `app.config`, set in one place
        - Endpoint names: a blueprint called `links` with a view `index` is `links.index`, and `url_for("links.index")` builds its address
      tr: |
        - **Uygulama fabrikası** (application factory): uygulamayı kurup döndüren `create_app()` fonksiyonu. Flask onu bu isimle bulur.
        - **Blueprint**: kendi dosyasında duran ve uygulamaya kaydedilen bir route grubu
        - **Yapılandırma** (configuration): `app.config` içinde duran ayarlar, tek yerde belirlenir
        - Endpoint adları: `links` adlı blueprint'teki `index` view'ı `links.index` olur ve `url_for("links.index")` adresini üretir
    do:
      en: |
        1. Replace the whole content of `linkbox/__init__.py` with the factory below.
        2. Create `linkbox/links.py` with the blueprint below. It moves the home page out of `__init__.py`.
        3. Run the server again with the same command as before. The home page still says hello, but now it comes from a blueprint.
        4. Commit your work.
      tr: |
        1. `linkbox/__init__.py` dosyasının bütün içeriğini aşağıdaki fabrikayla değiştir.
        2. Aşağıdaki blueprint ile `linkbox/links.py` dosyasını oluştur. Ana sayfayı `__init__.py`'den buraya taşır.
        3. Sunucuyu önceki komutla yeniden çalıştır. Ana sayfa yine merhaba diyor ama artık bir blueprint'ten geliyor.
        4. Çalışmanı commit'le.
    code:
      - file: linkbox/__init__.py
        lang: py
        text: |
          import os

          from flask import Flask


          def create_app(test_config=None):
              app = Flask(__name__, instance_relative_config=True)
              app.config.from_mapping(SECRET_KEY="dev")

              if test_config is not None:
                  app.config.update(test_config)

              os.makedirs(app.instance_path, exist_ok=True)

              from . import links

              app.register_blueprint(links.bp)
              return app
      - file: linkbox/links.py
        lang: py
        text: |
          from flask import Blueprint

          bp = Blueprint("links", __name__)


          @bp.route("/")
          def index():
              return "Hello from Linkbox"
      - file: terminal
        lang: sh
        text: |
          uv run flask --app linkbox run --debug
          git add .
          git commit -m "Add the app factory and a links blueprint"
    mistakes:
      - problem:
          en: "Importing the blueprint at the top of `__init__.py` and getting \"circular import\" errors later."
          tr: "Blueprint'i `__init__.py`'nin en üstünde import etmek ve sonradan \"circular import\" hataları almak."
        fix:
          en: "Import blueprints inside `create_app()`, as in the code above, after the app exists."
          tr: "Blueprint'leri yukarıdaki gibi `create_app()` içinde, uygulama oluştuktan sonra import et."
      - problem:
          en: "`url_for(\"index\")` fails with \"Could not build url for endpoint\"."
          tr: "`url_for(\"index\")` \"Could not build url for endpoint\" hatası veriyor."
        fix:
          en: "Endpoints in a blueprint carry the blueprint name: use `url_for(\"links.index\")`."
          tr: "Blueprint içindeki endpoint'ler blueprint adını taşır: `url_for(\"links.index\")` kullan."
    quiz:
      - q:
          en: "Why does Linkbox use a `create_app()` function instead of one global `app`?"
          tr: "Linkbox neden tek bir global `app` yerine `create_app()` fonksiyonu kullanıyor?"
        options:
          en: ["It is faster", "Each test can build a fresh app with its own settings", "Flask forbids global apps"]
          tr: ["Daha hızlıdır", "Her test kendi ayarlarıyla taze bir uygulama kurabilir", "Flask global uygulamaları yasaklar"]
        answer: 1
        why:
          en: "Tests need an app with a test database and test settings, and a new one for every test. A factory makes that easy."
          tr: "Testlerin test veritabanı ve test ayarları olan, her test için yeni bir uygulamaya ihtiyacı var. Fabrika bunu kolaylaştırır."
    sources:
      - title: Flask tutorial, the application setup (factory)
        url: https://flask.palletsprojects.com/en/stable/tutorial/factory/
      - title: Flask, application factories
        url: https://flask.palletsprojects.com/en/stable/patterns/appfactories/
      - title: Flask, modular applications with blueprints
        url: https://flask.palletsprojects.com/en/stable/blueprints/

  - id: templates
    stage: basics
    title:
      en: "Pages with Jinja templates and a stylesheet"
      tr: "Jinja şablonları ve bir stil dosyasıyla sayfalar"
    minutes: 50
    needs: [structure]
    why:
      en: "Building HTML by joining strings is slow to write and unsafe. A template is an HTML file with holes; Flask fills the holes with your data and escapes everything, so a visitor's text can never become code."
      tr: "HTML'i metinleri birleştirerek üretmek hem yavaş hem güvensizdir. Şablon, boşlukları olan bir HTML dosyasıdır; Flask boşlukları verinle doldurur ve her şeyi escape eder, böylece ziyaretçinin yazdığı metin asla koda dönüşemez."
    learn:
      en: |
        - `render_template()` fills a template with values
        - Jinja syntax: `{{ value }}` prints, `{% for %}` and `{% if %}` control, and everything printed is escaped
        - **Template inheritance**: `base.html` holds the page frame and other templates fill its blocks
        - Static files (CSS) live in `linkbox/static/` and `url_for("static", ...)` builds their address
      tr: |
        - `render_template()` bir şablonu değerlerle doldurur
        - Jinja sözdizimi: `{{ value }}` yazdırır, `{% for %}` ve `{% if %}` akışı yönetir, yazdırılan her şey escape edilir
        - **Şablon kalıtımı**: `base.html` sayfanın çerçevesini tutar, diğer şablonlar onun bloklarını doldurur
        - Statik dosyalar (CSS) `linkbox/static/` içinde durur ve `url_for("static", ...)` adreslerini üretir
    do:
      en: |
        1. Create the folders `linkbox/templates/links` and `linkbox/static`.
        2. Create `linkbox/templates/base.html`, `linkbox/templates/links/index.html` and `linkbox/static/style.css` with the code below.
        3. Replace `linkbox/links.py` with the version below. For now the links are a fixed list in the code; the database comes next.
        4. Reload the page. Then add `<b>bold</b>` to one title and see that it shows as text, not bold: Jinja escaped it.
        5. Commit your work.
      tr: |
        1. `linkbox/templates/links` ve `linkbox/static` klasörlerini oluştur.
        2. Aşağıdaki kodla `linkbox/templates/base.html`, `linkbox/templates/links/index.html` ve `linkbox/static/style.css` dosyalarını oluştur.
        3. `linkbox/links.py` dosyasını aşağıdaki sürümle değiştir. Şimdilik linkler kodun içinde sabit bir liste; veritabanı sıradaki adımda.
        4. Sayfayı yenile. Sonra bir başlığa `<b>kalın</b>` ekle ve kalın değil, düz yazı olarak göründüğünü gör: Jinja onu escape etti.
        5. Çalışmanı commit'le.
    code:
      - file: linkbox/templates/base.html
        lang: html
        text: |
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{% block title %}{% endblock %} - Linkbox</title>
            <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
          </head>
          <body>
            <header>
              <a class="brand" href="{{ url_for('links.index') }}">Linkbox</a>
            </header>
            <main>
              {% for message in get_flashed_messages() %}
                <p class="flash">{{ message }}</p>
              {% endfor %}
              {% block content %}{% endblock %}
            </main>
          </body>
          </html>
      - file: linkbox/templates/links/index.html
        lang: html
        text: |
          {% extends "base.html" %}
          {% block title %}Your links{% endblock %}
          {% block content %}
            <h1>Your links</h1>
            {% for link in links %}
              <article>
                <a href="{{ link.url }}">{{ link.title }}</a>
              </article>
            {% else %}
              <p>No links yet.</p>
            {% endfor %}
          {% endblock %}
      - file: linkbox/static/style.css
        lang: css
        text: |
          body {
            font-family: system-ui, sans-serif;
            max-width: 40rem;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
            color: #1b1b1f;
          }
          header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid #c9c9d1;
            padding-bottom: 0.5rem;
          }
          .brand { font-weight: 700; font-size: 1.25rem; text-decoration: none; }
          nav { display: flex; align-items: center; gap: 0.75rem; }
          article {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
          }
          article small { color: #5d5d68; }
          form.inline { display: inline; margin: 0; }
          label { display: block; margin-top: 1rem; font-weight: 600; }
          input { display: block; width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit; }
          button { padding: 0.4rem 0.9rem; font: inherit; cursor: pointer; }
          .flash { background: #fff4d6; border: 1px solid #e6c766; padding: 0.5rem 0.75rem; border-radius: 4px; }
          .pager { display: flex; justify-content: space-between; margin-top: 1rem; }
      - file: linkbox/links.py
        lang: py
        text: |
          from flask import Blueprint, render_template

          bp = Blueprint("links", __name__)

          LINKS = [
              {"title": "Flask documentation", "url": "https://flask.palletsprojects.com/"},
              {"title": "Python tutorial", "url": "https://docs.python.org/3/tutorial/"},
          ]


          @bp.route("/")
          def index():
