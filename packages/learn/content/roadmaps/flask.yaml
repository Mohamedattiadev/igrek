      - file: linkbox/schema.sql
        lang: sql
        text: |
          CREATE TABLE IF NOT EXISTS user (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              username TEXT UNIQUE NOT NULL,
              password_hash TEXT NOT NULL
          );

          CREATE TABLE IF NOT EXISTS link (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              user_id INTEGER NOT NULL REFERENCES user (id) ON DELETE CASCADE,
              title TEXT NOT NULL,
              url TEXT NOT NULL,
              created TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
      - file: linkbox/auth.py
        lang: py
        text: |
          import functools
          import sqlite3

          from flask import Blueprint, flash, g, redirect, render_template, request, session, url_for
          from werkzeug.security import check_password_hash, generate_password_hash

          from .db import get_db

          bp = Blueprint("auth", __name__, url_prefix="/auth")


          def login_required(view):
              @functools.wraps(view)
              def wrapped_view(**kwargs):
                  if g.user is None:
                      return redirect(url_for("auth.login"))
                  return view(**kwargs)

              return wrapped_view


          @bp.before_app_request
          def load_logged_in_user():
              user_id = session.get("user_id")
              if user_id is None:
                  g.user = None
              else:
                  g.user = get_db().execute(
                      "SELECT id, username FROM user WHERE id = ?", (user_id,)
                  ).fetchone()


          @bp.route("/register", methods=("GET", "POST"))
          def register():
              if request.method == "POST":
                  username = request.form.get("username", "").strip()
                  password = request.form.get("password", "")
                  error = None
                  if not 3 <= len(username) <= 30:
                      error = "The username must be 3 to 30 characters."
                  elif not 8 <= len(password) <= 128:
                      error = "The password must be 8 to 128 characters."
                  if error is None:
                      db = get_db()
                      try:
                          db.execute(
                              "INSERT INTO user (username, password_hash) VALUES (?, ?)",
                              (username, generate_password_hash(password)),
                          )
                          db.commit()
                      except sqlite3.IntegrityError:
                          error = "That username is already taken."
                      else:
                          flash("Account created. You can log in now.")
                          return redirect(url_for("auth.login"))
                  flash(error)
              return render_template("auth/register.html")


          @bp.route("/login", methods=("GET", "POST"))
          def login():
              if request.method == "POST":
                  username = request.form.get("username", "").strip()
                  password = request.form.get("password", "")
                  user = get_db().execute(
                      "SELECT id, password_hash FROM user WHERE username = ?", (username,)
                  ).fetchone()
                  if user is None or not check_password_hash(user["password_hash"], password):
                      flash("Wrong username or password.")
                  else:
                      session.clear()
                      session["user_id"] = user["id"]
                      return redirect(url_for("links.index"))
              return render_template("auth/login.html")


          @bp.route("/logout", methods=("POST",))
          def logout():
              session.clear()
              return redirect(url_for("links.index"))
      - file: linkbox/__init__.py
        lang: py
        text: |
          import os

          from flask import Flask


          def create_app(test_config=None):
              app = Flask(__name__, instance_relative_config=True)
              app.config.from_mapping(
                  SECRET_KEY="dev",
                  DATABASE=os.path.join(app.instance_path, "linkbox.sqlite"),
              )

              if test_config is not None:
                  app.config.update(test_config)

              os.makedirs(app.instance_path, exist_ok=True)

              from . import auth, db, links

              db.init_app(app)
              app.register_blueprint(auth.bp)
              app.register_blueprint(links.bp)
              return app
      - file: linkbox/links.py
        lang: py
        text: |
          from urllib.parse import urlparse

          from flask import Blueprint, abort, flash, g, redirect, render_template, request, url_for

          from .auth import login_required
          from .db import get_db

          bp = Blueprint("links", __name__)


          def check_link(title, url):
              """Return an error message, or None when the link is fine."""
              if not title:
                  return "A title is required."
              if len(title) > 100:
                  return "The title can be at most 100 characters."
              if len(url) > 2000:
                  return "The address is too long."
              try:
                  parts = urlparse(url)
              except ValueError:
                  return "That is not a valid address."
              if parts.scheme not in ("http", "https") or not parts.netloc:
                  return "The address must start with http:// or https://."
              return None


          @bp.route("/")
          def index():
              links = []
              if g.user is not None:
                  links = get_db().execute(
                      "SELECT id, title, url, created FROM link WHERE user_id = ? ORDER BY id DESC",
                      (g.user["id"],),
                  ).fetchall()
              return render_template("links/index.html", links=links)


          @bp.route("/add", methods=("GET", "POST"))
          @login_required
          def add():
              title = url = ""
              if request.method == "POST":
                  title = request.form.get("title", "").strip()
                  url = request.form.get("url", "").strip()
                  error = check_link(title, url)
                  if error is None:
                      db = get_db()
                      db.execute(
                          "INSERT INTO link (user_id, title, url) VALUES (?, ?, ?)",
                          (g.user["id"], title, url),
                      )
                      db.commit()
                      flash("Link saved.")
                      return redirect(url_for("links.index"))
                  flash(error)
              return render_template("links/add.html", title=title, url=url)


          @bp.route("/<int:id>/delete", methods=("POST",))
          @login_required
          def delete(id):
              db = get_db()
              cursor = db.execute(
                  "DELETE FROM link WHERE id = ? AND user_id = ?", (id, g.user["id"])
              )
              db.commit()
              if cursor.rowcount == 0:
                  abort(404)
              flash("Link deleted.")
              return redirect(url_for("links.index"))
