  - id: database
    stage: first-project
    title:
      en: "Save links in a SQLite database"
      tr: "Linkleri bir SQLite veritabanına kaydet"
    minutes: 60
    needs: [templates]
    why:
      en: "A list in the code forgets everything when the server restarts. A database keeps data on disk. SQLite is a whole database in one file and Python includes it (`sqlite3`), so there is nothing to install. The official Flask tutorial uses it the same way."
      tr: "Kodun içindeki bir liste sunucu yeniden başlayınca her şeyi unutur. Veritabanı veriyi diskte tutar. SQLite tek bir dosyada duran komple bir veritabanıdır ve Python onu içinde getirir (`sqlite3`), yani kurulacak bir şey yok. Resmi Flask eğitimi de aynı şekilde kullanır."
    learn:
      en: |
        - A table, rows and columns, and the SQL to create and read them (see the SQL cheatsheet)
        - One connection per request: `get_db()` stores it in `g` and `close_db()` closes it after the request
        - **Always** pass values as `?` placeholders, never by joining strings into SQL (SQL injection)
        - A custom command, `flask init-db`, that creates the tables
        - The `instance` folder: files that belong to one installation, like the database, and are not in Git
      tr: |
        - Tablo, satır ve sütun; onları oluşturan ve okuyan SQL (SQL kopya kâğıdına bak)
        - İstek başına tek bağlantı: `get_db()` onu `g` içinde saklar, `close_db()` istek bitince kapatır
        - Değerleri **her zaman** `?` yer tutucularıyla ver, SQL'e metin birleştirerek asla (SQL injection)
        - Tabloları oluşturan özel bir komut: `flask init-db`
        - `instance` klasörü: veritabanı gibi tek bir kuruluma ait ve Git'te olmayan dosyalar
    do:
      en: |
        1. Create `linkbox/schema.sql` and `linkbox/db.py` with the code below.
        2. Replace `linkbox/__init__.py` so it sets the database path and registers the database helpers.
        3. Replace `linkbox/links.py` and `linkbox/templates/links/index.html` so the home page reads from the database.
        4. Create the tables. This makes the file `instance/linkbox.sqlite`.
        5. Add a first row from the Flask shell (a Python prompt with your app loaded) and reload the home page. Stop the server and start it again: the link is still there.
        6. Commit your work.
      tr: |
        1. Aşağıdaki kodla `linkbox/schema.sql` ve `linkbox/db.py` dosyalarını oluştur.
        2. `linkbox/__init__.py` dosyasını, veritabanı yolunu belirleyip veritabanı yardımcılarını kaydedecek şekilde değiştir.
        3. `linkbox/links.py` ve `linkbox/templates/links/index.html` dosyalarını, ana sayfa veritabanından okuyacak şekilde değiştir.
        4. Tabloları oluştur. Bu, `instance/linkbox.sqlite` dosyasını yaratır.
        5. Flask shell'den (uygulaman yüklenmiş bir Python istemi) ilk satırı ekle ve ana sayfayı yenile. Sunucuyu durdurup yeniden başlat: link hâlâ orada.
        6. Çalışmanı commit'le.
    code:
      - file: linkbox/schema.sql
        lang: sql
        text: |
          CREATE TABLE IF NOT EXISTS link (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              title TEXT NOT NULL,
              url TEXT NOT NULL,
              created TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
      - file: linkbox/db.py
        lang: py
        text: |
          import sqlite3
          from pathlib import Path

          import click
          from flask import current_app, g


          def get_db():
              if "db" not in g:
                  g.db = sqlite3.connect(current_app.config["DATABASE"])
                  g.db.row_factory = sqlite3.Row
                  g.db.execute("PRAGMA foreign_keys = ON")
              return g.db


          def close_db(error=None):
              db = g.pop("db", None)
              if db is not None:
                  db.close()


          def init_db():
              schema = Path(current_app.root_path, "schema.sql").read_text(encoding="utf-8")
              get_db().executescript(schema)


          @click.command("init-db")
          def init_db_command():
              """Create the tables (safe to run again)."""
              init_db()
              click.echo("Database ready.")


          def init_app(app):
              app.teardown_appcontext(close_db)
              app.cli.add_command(init_db_command)
      - file: linkbox/__init__.py
        lang: py
        text: |
          import os

          from flask import Flask


          def create_app(test_config=None):
              app = Flask(__name__, instance_relative_config=True)
              app.config.from_mapping(
                  SECRET_KEY="dev",
                  DATABASE=os.path.join(app.instance_path, "linkbox.sqlite"),
              )

              if test_config is not None:
                  app.config.update(test_config)

              os.makedirs(app.instance_path, exist_ok=True)

              from . import db, links

              db.init_app(app)
              app.register_blueprint(links.bp)
              return app
      - file: linkbox/links.py
        lang: py
        text: |
          from flask import Blueprint, render_template

          from .db import get_db

          bp = Blueprint("links", __name__)


          @bp.route("/")
          def index():
              links = get_db().execute(
                  "SELECT id, title, url, created FROM link ORDER BY id DESC"
              ).fetchall()
              return render_template("links/index.html", links=links)
      - file: linkbox/templates/links/index.html
        lang: html
        text: |
          {% extends "base.html" %}
          {% block title %}Your links{% endblock %}
          {% block content %}
            <h1>Your links</h1>
            {% for link in links %}
              <article>
                <span>
                  <a href="{{ link.url }}">{{ link.title }}</a><br>
                  <small>{{ link.created }}</small>
                </span>
              </article>
            {% else %}
              <p>No links yet.</p>
            {% endfor %}
          {% endblock %}
      - file: terminal
        lang: sh
        text: |
          uv run flask --app linkbox init-db
          uv run flask --app linkbox shell
          # at the >>> prompt:
          #   from linkbox.db import get_db
          #   db = get_db()
          #   db.execute("INSERT INTO link (title, url) VALUES (?, ?)", ("Flask docs", "https://flask.palletsprojects.com/"))
          #   db.commit()
          #   exit()
          uv run flask --app linkbox run --debug
    mistakes:
      - problem:
          en: "\"sqlite3.OperationalError: unable to open database file\"."
          tr: "\"sqlite3.OperationalError: unable to open database file\" hatası."
        fix:
          en: "The `instance` folder is missing or `DATABASE` points to a folder that does not exist. `create_app()` makes the folder; run commands from the project folder."
          tr: "`instance` klasörü yok ya da `DATABASE` olmayan bir klasörü gösteriyor. `create_app()` klasörü oluşturur; komutları proje klasöründen çalıştır."
      - problem:
          en: "Forgetting `db.commit()` after an INSERT, so the row is gone."
          tr: "INSERT'ten sonra `db.commit()` yazmayı unutmak ve satırın kaybolması."
        fix:
          en: "Changes are only saved when you commit. Reading needs no commit."
          tr: "Değişiklikler ancak commit edince kaydedilir. Okumak için commit gerekmez."
      - problem:
          en: "Building SQL with an f-string, like `f\"... WHERE id = {id}\"`."
          tr: "SQL'i f-string ile kurmak, örneğin `f\"... WHERE id = {id}\"`."
        fix:
          en: "Use placeholders: `execute(\"... WHERE id = ?\", (id,))`. The database then treats the value only as data, so it can never become SQL."
          tr: "Yer tutucu kullan: `execute(\"... WHERE id = ?\", (id,))`. Veritabanı değeri sadece veri sayar, böylece asla SQL'e dönüşemez."
    quiz:
      - q:
          en: "Why is the value passed as `(title, url)` after the SQL instead of being put inside the SQL text?"
          tr: "Değer neden SQL metninin içine konmak yerine SQL'den sonra `(title, url)` olarak veriliyor?"
        options:
          en: ["It is shorter to write", "The database never treats it as SQL code, which stops SQL injection", "SQLite requires tuples"]
          tr: ["Yazması daha kısa", "Veritabanı onu hiçbir zaman SQL kodu saymaz, bu da SQL injection'ı engeller", "SQLite tuple ister"]
        answer: 1
        why:
          en: "With placeholders the SQL is fixed and the values travel separately, so a value like `'; DROP TABLE link; --` is just text."
          tr: "Yer tutucuyla SQL sabittir ve değerler ayrı gider; `'; DROP TABLE link; --` gibi bir değer sadece metindir."
    sources:
      - title: Flask tutorial, define and access the database
        url: https://flask.palletsprojects.com/en/stable/tutorial/database/
      - title: Python, sqlite3
        url: https://docs.python.org/3/library/sqlite3.html
      - title: Flask, the application context (g)
        url: https://flask.palletsprojects.com/en/stable/appcontext/

  - id: forms
    stage: first-project
    title:
      en: "Add and delete links with validated forms"
      tr: "Doğrulanan formlarla link ekle ve sil"
    minutes: 75
    needs: [database]
    why:
      en: "Everything a browser sends is untrusted: people make typos and attackers send worse. A form handler must check the input, say what is wrong, and only then write to the database."
      tr: "Tarayıcının gönderdiği her şey güvenilmezdir: insanlar yazım hatası yapar, saldırganlar daha kötüsünü gönderir. Form işleyicisi girdiyi kontrol etmeli, neyin yanlış olduğunu söylemeli ve ancak sonra veritabanına yazmalı."
    learn:
      en: |
        - `methods=("GET", "POST")`: GET shows the form, POST receives it
        - `request.form` holds the submitted fields
        - **Validate on the server**: browser checks like `required` are only a convenience
        - **Post/Redirect/Get**: after a successful POST, redirect, so a page reload does not send the form again
        - `flash()` shows a one-time message on the next page
        - Why a link must start with `http://` or `https://` (a `javascript:` link would run code when clicked)
      tr: |
        - `methods=("GET", "POST")`: GET formu gösterir, POST formu alır
        - `request.form` gönderilen alanları tutar
        - **Sunucuda doğrula**: `required` gibi tarayıcı kontrolleri sadece kolaylıktır
        - **Post/Redirect/Get**: başarılı bir POST'tan sonra yönlendir, böylece sayfayı yenilemek formu tekrar göndermez
        - `flash()` sonraki sayfada tek seferlik bir mesaj gösterir
        - Bir linkin neden `http://` ya da `https://` ile başlaması gerektiği (`javascript:` linki tıklanınca kod çalıştırır)
    do:
      en: |
        1. Replace `linkbox/links.py` with the version below. It adds `check_link()`, the `add` view and the `delete` view.
        2. Create `linkbox/templates/links/add.html`.
        3. Replace `linkbox/templates/links/index.html` so it has an "Add a link" button and a Delete button on each row.
        4. Open http://127.0.0.1:5000/add. Save a link, then try an empty title and the address `javascript:alert(1)` and read the messages.
        5. Delete a link. Notice that after saving you land on the list with a message, and reloading does not save twice.
        6. Commit your work.
      tr: |
        1. `linkbox/links.py` dosyasını aşağıdaki sürümle değiştir. `check_link()`, `add` view'ı ve `delete` view'ı ekler.
        2. `linkbox/templates/links/add.html` dosyasını oluştur.
        3. `linkbox/templates/links/index.html` dosyasını, bir "Add a link" butonu ve her satırda bir Delete butonu olacak şekilde değiştir.
        4. http://127.0.0.1:5000/add adresini aç. Bir link kaydet, sonra boş başlığı ve `javascript:alert(1)` adresini dene, mesajları oku.
        5. Bir linki sil. Kaydedince mesajla birlikte listeye geldiğini ve sayfayı yenilemenin iki kez kaydetmediğini fark et.
        6. Çalışmanı commit'le.
    code:
      - file: linkbox/links.py
        lang: py
        text: |
          from urllib.parse import urlparse

          from flask import Blueprint, abort, flash, redirect, render_template, request, url_for

          from .db import get_db

          bp = Blueprint("links", __name__)


          def check_link(title, url):
              """Return an error message, or None when the link is fine."""
              if not title:
                  return "A title is required."
              if len(title) > 100:
                  return "The title can be at most 100 characters."
              if len(url) > 2000:
                  return "The address is too long."
              try:
                  parts = urlparse(url)
              except ValueError:
                  return "That is not a valid address."
              if parts.scheme not in ("http", "https") or not parts.netloc:
                  return "The address must start with http:// or https://."
              return None


          @bp.route("/")
          def index():
              links = get_db().execute(
                  "SELECT id, title, url, created FROM link ORDER BY id DESC"
              ).fetchall()
              return render_template("links/index.html", links=links)


          @bp.route("/add", methods=("GET", "POST"))
          def add():
              title = url = ""
              if request.method == "POST":
                  title = request.form.get("title", "").strip()
                  url = request.form.get("url", "").strip()
                  error = check_link(title, url)
                  if error is None:
                      db = get_db()
                      db.execute("INSERT INTO link (title, url) VALUES (?, ?)", (title, url))
                      db.commit()
                      flash("Link saved.")
                      return redirect(url_for("links.index"))
                  flash(error)
              return render_template("links/add.html", title=title, url=url)


          @bp.route("/<int:id>/delete", methods=("POST",))
          def delete(id):
              db = get_db()
              cursor = db.execute("DELETE FROM link WHERE id = ?", (id,))
              db.commit()
              if cursor.rowcount == 0:
                  abort(404)
              flash("Link deleted.")
              return redirect(url_for("links.index"))
      - file: linkbox/templates/links/add.html
        lang: html
        text: |
          {% extends "base.html" %}
          {% block title %}Add a link{% endblock %}
          {% block content %}
            <h1>Add a link</h1>
            <form method="post">
              <label for="title">Title</label>
              <input name="title" id="title" value="{{ title }}" maxlength="100" required>
              <label for="url">Address</label>
              <input name="url" id="url" type="url" value="{{ url }}" maxlength="2000" required>
              <p><button type="submit">Save</button></p>
            </form>
          {% endblock %}
      - file: linkbox/templates/links/index.html
        lang: html
        text: |
          {% extends "base.html" %}
          {% block title %}Your links{% endblock %}
          {% block content %}
            <h1>Your links</h1>
            <p><a href="{{ url_for('links.add') }}">Add a link</a></p>
            {% for link in links %}
              <article>
                <span>
                  <a href="{{ link.url }}">{{ link.title }}</a><br>
                  <small>{{ link.created }}</small>
                </span>
                <form method="post" action="{{ url_for('links.delete', id=link.id) }}" class="inline">
                  <button type="submit">Delete</button>
                </form>
              </article>
            {% else %}
              <p>No links yet.</p>
            {% endfor %}
          {% endblock %}
    mistakes:
      - problem:
          en: "Trusting the browser: `type=\"url\"` and `required` are in the HTML, so no server check is written."
          tr: "Tarayıcıya güvenmek: HTML'de `type=\"url\"` ve `required` var diye sunucu kontrolü yazmamak."
        fix:
          en: "Anyone can send a request without a browser (`curl`, a script). Even `javascript:alert(1)` passes `type=\"url\"`. Always validate in the view."
          tr: "Herkes tarayıcısız istek gönderebilir (`curl`, bir script). `javascript:alert(1)` bile `type=\"url\"`'dan geçer. Her zaman view içinde doğrula."
      - problem:
          en: "Rendering the page directly after a successful POST, instead of redirecting."
          tr: "Başarılı bir POST'tan sonra yönlendirmek yerine sayfayı doğrudan göstermek."
        fix:
          en: "Then reloading the page asks the browser to send the form again and saves a duplicate. Redirect after success (Post/Redirect/Get)."
          tr: "O zaman sayfayı yenilemek tarayıcıdan formu tekrar göndermesini ister ve kopya kayıt oluşur. Başarıdan sonra yönlendir (Post/Redirect/Get)."
      - problem:
          en: "A delete link that uses GET, like `<a href=\"/3/delete\">`."
          tr: "GET kullanan bir silme linki, örneğin `<a href=\"/3/delete\">`."
        fix:
          en: "Browsers and crawlers open links without asking. Anything that changes data must be a POST form."
          tr: "Tarayıcılar ve tarayıcı botları linkleri sormadan açar. Veriyi değiştiren her şey bir POST formu olmalı."
    quiz:
      - q:
          en: "Why does the `add` view redirect after saving instead of rendering the list?"
          tr: "`add` view'ı kaydettikten sonra listeyi göstermek yerine neden yönlendiriyor?"
        options:
          en: ["Redirects are faster", "A page reload then does not send the form a second time", "Flask requires it"]
          tr: ["Yönlendirme daha hızlıdır", "Böylece sayfayı yenilemek formu ikinci kez göndermez", "Flask bunu zorunlu kılar"]
        answer: 1
        why:
          en: "After a redirect the browser's current page is a normal GET, so reloading only reads the list again."
          tr: "Yönlendirmeden sonra tarayıcının mevcut sayfası normal bir GET'tir; yenilemek listeyi sadece yeniden okur."
    sources:
      - title: Flask tutorial, blueprints and views
        url: https://flask.palletsprojects.com/en/stable/tutorial/views/
      - title: Flask, message flashing
        url: https://flask.palletsprojects.com/en/stable/patterns/flashing/
      - title: Flask quickstart, the request object
        url: https://flask.palletsprojects.com/en/stable/quickstart/#the-request-object

  - id: login
    stage: data-api
    title:
      en: "Accounts: register, log in, and see only your own links"
      tr: "Hesaplar: kayıt ol, giriş yap ve sadece kendi linklerini gör"
    minutes: 90
    needs: [forms]
    why:
      en: "A link saver where everyone sees everyone's links is not much use. Accounts need three things done right: store passwords as hashes, remember the user between requests with a signed cookie (the session), and check the owner on every read and write."
      tr: "Herkesin herkesin linklerini gördüğü bir link kaydedici pek işe yaramaz. Hesaplar için üç şey doğru yapılmalı: şifreleri hash olarak saklamak, kullanıcıyı istekler arasında imzalı bir çerezle (session) hatırlamak ve her okuma ve yazmada sahibini kontrol etmek."
    learn:
      en: |
        - **Never store passwords.** Store a **hash**: a one-way scrambled version. `generate_password_hash()` adds a random salt and a slow algorithm; `check_password_hash()` compares.
        - The **session** is a cookie that Flask signs with `SECRET_KEY`. The browser can read it but cannot change it without Flask noticing.
        - `g.user` loaded before every request, and a `@login_required` decorator for pages that need an account
        - **Authorization** is not the same as login: the SQL must also say `AND user_id = ?`, or user A can delete user B's links by guessing ids
        - Say "Wrong username or password", never which one is wrong
      tr: |
        - **Şifreyi asla saklama.** Bir **hash** sakla: tek yönlü karıştırılmış hâli. `generate_password_hash()` rastgele bir salt ve yavaş bir algoritma ekler; `check_password_hash()` karşılaştırır.
        - **Session**, Flask'ın `SECRET_KEY` ile imzaladığı bir çereziştir. Tarayıcı onu okuyabilir ama Flask fark etmeden değiştiremez.
        - Her istekten önce yüklenen `g.user` ve hesap isteyen sayfalar için bir `@login_required` decorator'ı
        - **Yetkilendirme** girişle aynı şey değil: SQL ayrıca `AND user_id = ?` demeli, yoksa A kullanıcısı id tahmin ederek B kullanıcısının linklerini silebilir
        - "Kullanıcı adı ya da şifre yanlış" de, hangisinin yanlış olduğunu asla söyleme
    do:
      en: |
        1. Replace `linkbox/schema.sql`. It adds a `user` table and a `user_id` column to `link`.
        2. Because the table shape changed, delete your old database and create it again (`rm instance/linkbox.sqlite` on macOS and Linux, or delete the file in your editor). Later, real apps use **migrations** for this; see the last step.
        3. Create `linkbox/auth.py` with the code below.
        4. Replace `linkbox/__init__.py` (it registers the `auth` blueprint), `linkbox/links.py`, `linkbox/templates/base.html` and `linkbox/templates/links/index.html`.
        5. Create `linkbox/templates/auth/register.html` and `linkbox/templates/auth/login.html`.
        6. Register two accounts (use a private window for the second). Save a link in each and check that neither can see the other's links. A link you do not own cannot be deleted: the delete query also checks the owner, and the next step tests it.
        7. Commit your work.
      tr: |
        1. `linkbox/schema.sql` dosyasını değiştir. Bir `user` tablosu ve `link`'e bir `user_id` sütunu ekler.
        2. Tablo yapısı değiştiği için eski veritabanını sil ve yeniden oluştur (macOS ve Linux'ta `rm instance/linkbox.sqlite`, ya da dosyayı editörde sil). Gerçek uygulamalar bunun için **migration** kullanır; son adıma bak.
        3. Aşağıdaki kodla `linkbox/auth.py` dosyasını oluştur.
        4. `linkbox/__init__.py` (`auth` blueprint'ini kaydeder), `linkbox/links.py`, `linkbox/templates/base.html` ve `linkbox/templates/links/index.html` dosyalarını değiştir.
        5. `linkbox/templates/auth/register.html` ve `linkbox/templates/auth/login.html` dosyalarını oluştur.
        6. İki hesap aç (ikincisi için gizli pencere kullan). Her birinde bir link kaydet ve ikisinin birbirinin linklerini görmediğini kontrol et. Sahibi olmadığın bir link silinemez: silme sorgusu sahibi de kontrol eder ve sonraki adım bunu test eder.
        7. Çalışmanı commit'le.
