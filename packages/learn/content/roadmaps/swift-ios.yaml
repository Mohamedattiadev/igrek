          import XCTest

          final class HabitsUITests: XCTestCase {
              override func setUpWithError() throws {
                  continueAfterFailure = false
              }

              @MainActor
              func testAddingAHabit() throws {
                  let app = XCUIApplication()
                  app.launch()

                  app.buttons["Add habit"].tap()
                  let field = app.textFields["For example: Read 10 pages"]
                  field.tap()
                  field.typeText("Stretch")
                  app.buttons["Save"].tap()

                  XCTAssertTrue(app.staticTexts["Stretch"].firstMatch.waitForExistence(timeout: 5))
