      - file: terminal
        lang: sh
        text: |
          xcodebuild -scheme Habits -showdestinations
          xcodebuild test -scheme Habits -destination 'platform=iOS Simulator,name=<a simulator name from the list>'
    mistakes:
      - problem:
          en: "\"Main actor-isolated ... can not be referenced from a nonisolated context\" in a test."
          tr: "Bir testte \"Main actor-isolated ... can not be referenced from a nonisolated context\" hatası."
        fix:
          en: "New app targets run code on the main actor by default. Mark the test or the whole test struct with `@MainActor` (as `HabitTests` does), or mark pure logic types `nonisolated` (as `Streak` and `QuoteService` are)."
          tr: "Yeni app hedefleri kodu varsayılan olarak main actor'da çalıştırır. Testi ya da tüm test struct'ını `@MainActor` ile işaretle (`HabitTests`'in yaptığı gibi) veya saf mantık tiplerini `nonisolated` yap (`Streak` ve `QuoteService` gibi)."
      - problem:
          en: "A test passes today and fails tomorrow, or fails in another country."
          tr: "Bir test bugün geçiyor yarın kalıyor ya da başka bir ülkede kalıyor."
        fix:
          en: "The test used `Date.now` or the phone's time zone. Pass a fixed date and a fixed calendar, as `StreakTests` does."
          tr: "Test `Date.now` ya da telefonun saat dilimini kullanmış. `StreakTests`'in yaptığı gibi sabit bir tarih ve sabit bir takvim ver."
      - problem:
          en: "The UI test fails with \"multiple matching elements found\" on the second run."
          tr: "UI testi ikinci çalıştırmada \"multiple matching elements found\" ile kalıyor."
        fix:
          en: "SwiftData keeps the habit from the first run, so the text now appears twice. Use `.firstMatch`, or delete the app from the Simulator before the test."
          tr: "SwiftData ilk çalıştırmadaki alışkanlığı sakladığı için metin artık iki kez görünüyor. `.firstMatch` kullan ya da testten önce uygulamayı Simulator'dan sil."
    quiz:
      - q:
          en: "Why should a streak test not use the real current date?"
          tr: "Bir seri testi neden gerçek günün tarihini kullanmamalı?"
        options:
          en: [Dates are slow to read, The result would change from day to day and test nothing reliable, Swift Testing does not allow dates]
          tr: [Tarihleri okumak yavaş, Sonuç günden güne değişir ve güvenilir bir şeyi test etmez, Swift Testing tarihe izin vermez]
        answer: 1
        why:
          en: "A good test gives the same result every time. A fixed date and calendar make that true."
          tr: "İyi bir test her seferinde aynı sonucu verir. Sabit tarih ve takvim bunu sağlar."
    sources:
      - title: Swift Testing
        url: https://developer.apple.com/xcode/swift-testing/
      - title: Adding tests to your Xcode project
        url: https://developer.apple.com/documentation/xcode/adding-tests-to-your-xcode-project
      - title: Swift Testing documentation
        url: https://developer.apple.com/documentation/testing

  - id: keychain
    stage: security
    title:
      en: "Store a secret safely in the Keychain"
      tr: "Bir sırrı Keychain'de güvenle saklama"
    minutes: 50
    needs: [tests]
    why:
      en: "Anything you put in UserDefaults, in a file or in your source code can be read by someone who gets the app or the device backup. Passwords and tokens belong in the Keychain, the encrypted store of iOS made for exactly this."
      tr: "UserDefaults'a, bir dosyaya ya da kaynak koduna koyduğun her şey, uygulamaya ya da cihaz yedeğine ulaşan biri tarafından okunabilir. Şifreler ve token'lar Keychain'e aittir; iOS'un tam bunun için yapılmış şifreli deposu."
    learn:
      en: |
        - What the Keychain is and the four calls: `SecItemAdd`, `SecItemCopyMatching`, `SecItemUpdate`, `SecItemDelete`
        - Why secrets must never be in source code, in `Info.plist` or in `UserDefaults`
        - `kSecAttrAccessibleWhenUnlockedThisDeviceOnly`: when the item can be read
        - App Transport Security: iOS requires HTTPS by default, so leave it that way
      tr: |
        - Keychain'in ne olduğu ve dört çağrı: `SecItemAdd`, `SecItemCopyMatching`, `SecItemUpdate`, `SecItemDelete`
        - Sırların neden asla kaynak kodunda, `Info.plist`'te ya da `UserDefaults`'ta olmaması gerektiği
        - `kSecAttrAccessibleWhenUnlockedThisDeviceOnly`: öğenin ne zaman okunabileceği
        - App Transport Security: iOS varsayılan olarak HTTPS ister, böyle bırak
    do:
      en: |
        1. Habits has no server, so we practise with a stand-in: a **sync token** the user pastes in Settings. The same code stores any small secret, such as an API token or a password.
        2. Create `KeychainStore.swift`. It saves, reads and deletes one text value for an account name. It updates the item if it exists and adds it if not.
        3. Replace `SettingsView.swift`. A `SecureField` (the text is hidden) lets the user paste the token, and the buttons call the Keychain.
        4. Run it, open Settings, save a token, close the app completely, run again and open Settings: the token is still there.
        5. Check your own project like a reviewer. In the terminal run the search below, and in the target's Info tab make sure there is no *App Transport Security Settings → Allow Arbitrary Loads* switched on.
        6. Commit: `git add .` and `git commit -m "Keep the sync token in the Keychain"`.
      tr: |
        1. Habits'in sunucusu yok, bu yüzden bir yedek senaryoyla çalışıyoruz: kullanıcının Settings'e yapıştırdığı bir **sync token**. Aynı kod API token'ı ya da şifre gibi her küçük sırrı saklar.
        2. `KeychainStore.swift` oluştur. Bir hesap adı için tek bir metin değerini kaydeder, okur ve siler. Öğe varsa günceller, yoksa ekler.
        3. `SettingsView.swift`'i değiştir. Bir `SecureField` (metin gizlenir) kullanıcının token'ı yapıştırmasını sağlar, düğmeler Keychain'i çağırır.
        4. Çalıştır, Settings'i aç, bir token kaydet, uygulamayı tamamen kapat, tekrar çalıştır ve Settings'i aç: token hâlâ orada.
        5. Kendi projeni bir gözden geçiren gibi kontrol et. Terminalde aşağıdaki aramayı çalıştır, hedefin Info sekmesinde de *App Transport Security Settings → Allow Arbitrary Loads* seçeneğinin açık olmadığından emin ol.
        6. Commit'le: `git add .` ve `git commit -m "Keep the sync token in the Keychain"`.
    code:
      - file: Habits/KeychainStore.swift
        lang: swift
        text: |
          import Foundation
          import Security

          nonisolated enum KeychainError: Error {
              case unexpectedStatus(OSStatus)
          }

          /// Saves small text secrets in the iOS Keychain.
          nonisolated struct KeychainStore: Sendable {
              let service: String

              private func baseQuery(account: String) -> [String: Any] {
                  [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: service,
                      kSecAttrAccount as String: account,
                  ]
              }

              func save(_ value: String, account: String) throws {
                  let query = baseQuery(account: account)
                  let attributes: [String: Any] = [
                      kSecValueData as String: Data(value.utf8),
                      kSecAttrAccessible as String: kSecAttrAccessibleWhenUnlockedThisDeviceOnly,
                  ]

                  var status = SecItemUpdate(query as CFDictionary, attributes as CFDictionary)
                  if status == errSecItemNotFound {
                      status = SecItemAdd(query.merging(attributes) { _, new in new } as CFDictionary, nil)
                  }
                  guard status == errSecSuccess else {
                      throw KeychainError.unexpectedStatus(status)
                  }
              }

              func read(account: String) throws -> String? {
                  var query = baseQuery(account: account)
                  query[kSecReturnData as String] = true
                  query[kSecMatchLimit as String] = kSecMatchLimitOne

                  var result: CFTypeRef?
                  let status = SecItemCopyMatching(query as CFDictionary, &result)
                  if status == errSecItemNotFound { return nil }
                  guard status == errSecSuccess, let data = result as? Data else {
                      throw KeychainError.unexpectedStatus(status)
                  }
                  return String(data: data, encoding: .utf8)
              }

              func delete(account: String) throws {
                  let status = SecItemDelete(baseQuery(account: account) as CFDictionary)
                  guard status == errSecSuccess || status == errSecItemNotFound else {
                      throw KeychainError.unexpectedStatus(status)
                  }
              }
          }
      - file: Habits/SettingsView.swift
        lang: swift
        text: |
          import SwiftUI

          struct SettingsView: View {
              @Environment(\.dismiss) private var dismiss
              @AppStorage("showStreaks") private var showStreaks = true
              @State private var token = ""
              @State private var message: String?

              private let keychain = KeychainStore(service: Bundle.main.bundleIdentifier ?? "Habits")
              private let account = "sync-token"

              var body: some View {
                  NavigationStack {
                      Form {
                          Section {
                              Toggle("Show streaks in the list", isOn: $showStreaks)
                          }
                          Section {
                              SecureField("Paste your token", text: $token)
                              Button("Save token", action: saveToken)
                                  .disabled(token.isEmpty)
                              Button("Remove token", role: .destructive, action: removeToken)
                          } header: {
                              Text("Sync token")
                          } footer: {
                              Text(message ?? "Stored in the iOS Keychain, not in the app's files.")
                          }
                      }
                      .navigationTitle("Settings")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Done") { dismiss() }
                          }
                      }
                      .onAppear {
                          token = (try? keychain.read(account: account)) ?? ""
                      }
                  }
              }

              private func saveToken() {
                  do {
                      try keychain.save(token, account: account)
                      message = "Saved."
                  } catch {
                      message = "Could not save the token."
                  }
              }

              private func removeToken() {
                  do {
                      try keychain.delete(account: account)
                      token = ""
                      message = "Removed."
                  } catch {
                      message = "Could not remove the token."
                  }
              }
          }

          #Preview {
              SettingsView()
          }
      - file: terminal
        lang: sh
        text: |
          git grep -n -i -E "password|secret|api[_-]?key|token" -- '*.swift' '*.plist'
    mistakes:
      - problem:
          en: "Putting an API key in a Swift constant or in `Info.plist` because \"nobody will look\"."
          tr: "\"Kimse bakmaz\" diye bir API anahtarını Swift sabitine ya da `Info.plist`'e koymak."
        fix:
          en: "An app can be downloaded and unpacked, so anything inside it is public. Keep real secrets on your own server, and only keep per-user tokens (that the user or your server gave) in the Keychain."
          tr: "Bir uygulama indirilip açılabilir; içindeki her şey herkese açıktır. Gerçek sırları kendi sunucunda tut, Keychain'de sadece kullanıcı başına token'ları (kullanıcının ya da sunucunun verdiği) sakla."
      - problem:
          en: "`SecItemAdd` returns `errSecDuplicateItem` (-25299) the second time."
          tr: "`SecItemAdd` ikinci seferde `errSecDuplicateItem` (-25299) döndürüyor."
        fix:
          en: "An item with the same class, service and account already exists. Update it with `SecItemUpdate`, as `save` does, or delete it first."
          tr: "Aynı sınıf, servis ve hesapla bir öğe zaten var. `save`'in yaptığı gibi `SecItemUpdate` ile güncelle ya da önce sil."
      - problem:
          en: "Turning off App Transport Security (`NSAllowsArbitraryLoads`) to make an HTTP address work."
          tr: "Bir HTTP adresi çalışsın diye App Transport Security'yi (`NSAllowsArbitraryLoads`) kapatmak."
        fix:
          en: "Use an HTTPS address instead. HTTP sends everything in plain text, and Apple may ask you to justify an exception."
          tr: "Bunun yerine HTTPS adresi kullan. HTTP her şeyi düz metin olarak gönderir ve Apple bir istisnayı gerekçelendirmeni isteyebilir."
    quiz:
      - q:
          en: "Where should a user's login token be stored on the iPhone?"
          tr: "Bir kullanıcının giriş token'ı iPhone'da nerede saklanmalı?"
        options:
          en: [In UserDefaults, In the Keychain, In a constant in the source code]
          tr: [UserDefaults'ta, Keychain'de, Kaynak kodundaki bir sabitte]
        answer: 1
        why:
          en: "The Keychain is encrypted and managed by the system. UserDefaults and files are plain, and source code ships inside the app."
          tr: "Keychain şifrelidir ve sistem tarafından yönetilir. UserDefaults ve dosyalar düzdür, kaynak kodu da uygulamanın içinde dağıtılır."
    sources:
      - title: Keychain services
        url: https://developer.apple.com/documentation/security/keychain-services
      - title: Adding a password to the keychain
        url: https://developer.apple.com/documentation/security/adding-a-password-to-the-keychain
      - title: Preventing insecure network connections
        url: https://developer.apple.com/documentation/security/preventing-insecure-network-connections

  - id: instruments
    stage: performance
    title:
      en: "Find slow code with Instruments"
      tr: "Instruments ile yavaş kodu bulma"
    minutes: 60
    needs: [keychain]
    why:
      en: "A guess about what is slow is often wrong. Instruments records what your app really does, such as which functions use the CPU and how often views redraw, so you fix the real problem. Apple recommends this cycle: measure, change one thing, measure again."
      tr: "Neyin yavaş olduğuna dair tahmin çoğu zaman yanlıştır. Instruments uygulamanın gerçekte ne yaptığını kaydeder; hangi fonksiyonlar işlemciyi kullanıyor, view'ler ne sıklıkla yeniden çiziliyor. Böylece gerçek sorunu düzeltirsin. Apple şu döngüyü önerir: ölç, tek şeyi değiştir, tekrar ölç."
    learn:
      en: |
        - Product → Profile (Cmd+I) and why profiling builds the Release configuration
        - The Time Profiler and the SwiftUI instrument, and how to read a call tree
        - `Self._printChanges()` to see why a view redrew (debug only)
        - A simple timing check in a test with `ContinuousClock`
      tr: |
        - Product → Profile (Cmd+I) ve profillemenin neden Release yapılandırmasıyla derlediği
        - Time Profiler ve SwiftUI instrument'ı, çağrı ağacı (call tree) nasıl okunur
        - Bir view'ün neden yeniden çizildiğini görmek için `Self._printChanges()` (sadece debug)
        - `ContinuousClock` ile testte basit bir süre kontrolü
    do:
      en: |
        1. Make the data big. Add a debug-only habit with ten years of done days (or just add many habits) so slow code becomes visible. Real users will have much more data than you do.
        2. Add the timing test below to `HabitsTests`. Run it with Cmd+U. It checks that counting a ten-year streak is far below a second.
        3. Profile the app: choose a **real iPhone** as the destination if you have one (the Simulator runs on your fast Mac and hides problems), then *Product → Profile* (Cmd+I). Instruments opens: choose **Time Profiler** and press Record.
        4. Use the app for 20 seconds: scroll, open details, toggle habits. Stop. In the call tree switch on *Hide System Libraries* and *Invert Call Tree* and look for your own functions near the top.
        5. Try the **SwiftUI** template the same way to see which views update how often. In debug runs, the `_printChanges()` line in `HabitRow` prints to the Xcode console why a row redrew.
        6. Rule: change one thing, measure again. Commit: `git add .` and `git commit -m "Add a timing test and redraw logging"`.
      tr: |
        1. Veriyi büyüt. Yavaş kod görünür olsun diye sadece debug için on yıllık tamamlanmış günü olan bir alışkanlık ekle (ya da çok sayıda alışkanlık ekle). Gerçek kullanıcıların senden çok daha fazla verisi olacak.
        2. Aşağıdaki süre testini `HabitsTests`'e ekle. Cmd+U ile çalıştır. On yıllık bir serinin sayılmasının bir saniyenin çok altında olduğunu kontrol eder.
        3. Uygulamayı profille: varsa hedef olarak **gerçek bir iPhone** seç (Simulator hızlı Mac'inde çalışır ve sorunları gizler), sonra *Product → Profile* (Cmd+I). Instruments açılır: **Time Profiler**'ı seç ve Record'a bas.
        4. Uygulamayı 20 saniye kullan: kaydır, ayrıntıları aç, alışkanlıkları işaretle. Durdur. Çağrı ağacında *Hide System Libraries* ve *Invert Call Tree*'yi aç ve en üstlerde kendi fonksiyonlarını ara.
        5. Hangi view'ün ne sıklıkla güncellendiğini görmek için aynı şekilde **SwiftUI** şablonunu dene. Debug çalıştırmalarında `HabitRow` içindeki `_printChanges()` satırı bir satırın neden yeniden çizildiğini Xcode konsoluna yazar.
        6. Kural: tek şeyi değiştir, tekrar ölç. Commit'le: `git add .` ve `git commit -m "Add a timing test and redraw logging"`.
    code:
      - file: HabitsTests/StreakPerformanceTests.swift
        lang: swift
        text: |
          import Foundation
          import Testing
          @testable import Habits

          struct StreakPerformanceTests {
              @Test func tenYearStreakIsFast() {
                  var calendar = Calendar(identifier: .gregorian)
                  calendar.timeZone = TimeZone(identifier: "UTC")!
                  let today = Date(timeIntervalSince1970: 1_800_000_000)
                  let days = (0..<3650).map {
                      calendar.date(byAdding: .day, value: -$0, to: today)!
                  }

                  var streak = 0
                  let elapsed = ContinuousClock().measure {
                      streak = Streak.current(completedDays: days, today: today, calendar: calendar)
                  }

                  #expect(streak == 3650)
                  // A generous limit: the test must not fail on a slow computer.
                  #expect(elapsed < .seconds(1))
              }
          }
      - file: Habits/HabitRow.swift
        lang: swift
        text: |
          import SwiftUI

          struct HabitRow: View {
              let habit: Habit
              @AppStorage("showStreaks") private var showStreaks = true

              var body: some View {
                  #if DEBUG
                  let _ = Self._printChanges()
                  #endif
                  HStack(spacing: 12) {
                      Image(systemName: habit.symbol)
                          .font(.title2)
                          .frame(width: 44, height: 44)
                          .background(.tint.opacity(0.15), in: Circle())

                      VStack(alignment: .leading) {
                          Text(habit.name)
                              .font(.headline)
                          if showStreaks {
                              Text("\(habit.streak) days in a row")
                                  .font(.subheadline)
                                  .foregroundStyle(.secondary)
                          }
                      }

                      Spacer()

                      if habit.isDone() {
                          Image(systemName: "checkmark.circle.fill")
                              .foregroundStyle(.green)
                      }
                  }
              }
          }

          #Preview {
              HabitRow(habit: Habit(name: "Read", symbol: "book.fill"))
                  .padding()
          }
      - file: terminal
        lang: sh
        text: |
          xcrun xctrace list templates
    mistakes:
      - problem:
          en: "Profiling a Debug build or only in the Simulator and trusting the numbers."
          tr: "Debug build'i ya da sadece Simulator'da profilleyip sayılara güvenmek."
        fix:
          en: "Profile uses the Release configuration for a reason: Debug code is slower and different. Measure on a real iPhone, ideally an older one, because that is where users feel slowness."
          tr: "Profile'ın Release yapılandırmasını kullanmasının nedeni var: Debug kodu daha yavaş ve farklıdır. Gerçek bir iPhone'da, mümkünse eski bir modelde ölç; kullanıcılar yavaşlığı orada hisseder."
      - problem:
          en: "Doing heavy work (sorting, decoding, loops over thousands of items) directly in `body`."
          tr: "Ağır işi (sıralama, çözme, binlerce öğe üzerinde döngü) doğrudan `body` içinde yapmak."
        fix:
          en: "`body` runs often and must be cheap. Move the work into a model or function, compute it once, and use `@Query` with a sort or a predicate so SwiftData does the filtering."
          tr: "`body` sık çalışır ve ucuz olmalı. İşi bir modele ya da fonksiyona taşı, bir kez hesapla; filtrelemeyi SwiftData yapsın diye sıralamalı ya da predicate'li `@Query` kullan."
      - problem:
          en: "Leaving `_printChanges()` or heavy logging in the shipped app."
          tr: "`_printChanges()`'ı ya da ağır loglamayı yayınlanan uygulamada bırakmak."
        fix:
          en: "Wrap it in `#if DEBUG` as in the code, so it is not compiled into the Release build."
          tr: "Koddaki gibi `#if DEBUG` içine al; böylece Release build'e derlenmez."
    quiz:
      - q:
          en: "Why profile on a real iPhone and not only in the Simulator?"
          tr: "Neden sadece Simulator'da değil, gerçek bir iPhone'da profilleme yapılır?"
        options:
          en: [The Simulator cannot run Instruments at all, The Simulator uses your Mac's power and hides problems a phone has, Real phones are always faster]
          tr: [Simulator'da Instruments hiç çalışmaz, Simulator Mac'inin gücünü kullanır ve telefonda olan sorunları gizler, Gerçek telefonlar her zaman daha hızlıdır]
        answer: 1
        why:
          en: "The Simulator runs on your Mac, which is much faster than an iPhone, so slow code can look fine there."
          tr: "Simulator Mac'inde çalışır ve bir iPhone'dan çok daha hızlıdır; bu yüzden yavaş kod orada iyi görünebilir."
    sources:
      - title: Improving your app's performance
        url: https://developer.apple.com/documentation/xcode/improving-your-app-s-performance
      - title: Instruments User Guide
        url: https://help.apple.com/instruments/mac/current/
      - title: Understanding and improving SwiftUI performance
        url: https://developer.apple.com/documentation/Xcode/understanding-and-improving-swiftui-performance

  - id: icon
    stage: packaging
    title:
      en: "Give the app an icon, a colour and a name"
      tr: "Uygulamaya bir ikon, bir renk ve bir ad verme"
    minutes: 45
    needs: [instruments]
    why:
      en: "The icon and the name are the first things people see on the Home Screen and in the store. Xcode keeps all pictures and colours in an asset catalog and makes the many sizes from one 1024 x 1024 image."
      tr: "İkon ve ad, insanların Ana Ekran'da ve mağazada ilk gördüğü şeylerdir. Xcode tüm resim ve renkleri bir asset catalog'da tutar ve birçok boyutu tek bir 1024 x 1024 resimden üretir."
    learn:
      en: |
        - What an asset catalog (`Assets.xcassets`) is
        - Icon rules: one square 1024 x 1024 image, the system rounds the corners, light, dark and tinted variants
        - Icon Composer, Apple's tool for layered icons
        - `AccentColor`: the colour that `.tint` and buttons use across the app
        - The display name under the icon
      tr: |
        - Asset catalog'un (`Assets.xcassets`) ne olduğu
        - İkon kuralları: tek kare 1024 x 1024 resim, köşeleri sistem yuvarlar, açık, koyu ve tonlu varyantlar
        - Katmanlı ikonlar için Apple'ın aracı Icon Composer
        - `AccentColor`: uygulama genelinde `.tint` ve düğmelerin kullandığı renk
        - İkonun altındaki görünen ad
    do:
      en: |
        1. Design a simple icon: a bold shape or symbol on a solid background, no text, no rounded corners (iOS adds them). Use any design tool you like, or Icon Composer. Export a **1024 x 1024 px PNG**.
        2. Check the size in the terminal with the first command below. If it is not square and 1024 x 1024, fix it in your design tool (do not stretch a non-square image).
        3. In Xcode open `Assets.xcassets` and select **AppIcon**. Drag your PNG into the 1024 x 1024 slot. Keep *Single Size*: Xcode makes the other sizes. Optionally add Dark and Tinted versions as the documentation describes.
        4. Select **AccentColor** and pick your brand colour (set a Dark appearance too if it needs it). Every `.tint` and button in the app now uses it.
        5. Select the app target, open **General** and set **Display Name** to `Habits` (or a nicer name). Keep it short, so it is not cut off under the icon.
        6. Run the app, press Home in the Simulator (*Device → Home* or Shift+Cmd+H) and look at the icon. Commit: `git add .` and `git commit -m "Add the app icon and accent colour"`.
      tr: |
        1. Basit bir ikon tasarla: düz bir arka plan üzerinde cesur bir şekil ya da sembol, yazı yok, yuvarlatılmış köşe yok (iOS ekler). İstediğin tasarım aracını ya da Icon Composer'ı kullan. **1024 x 1024 px PNG** olarak dışa aktar.
        2. Boyutu terminalde aşağıdaki ilk komutla kontrol et. Kare ve 1024 x 1024 değilse tasarım aracında düzelt (kare olmayan resmi germe).
        3. Xcode'da `Assets.xcassets`'i aç ve **AppIcon**'u seç. PNG'ni 1024 x 1024 kutusuna sürükle. *Single Size* seçili kalsın: diğer boyutları Xcode üretir. İstersen belgelerin anlattığı gibi Dark ve Tinted sürümleri de ekle.
        4. **AccentColor**'ı seç ve marka rengini seç (gerekiyorsa Dark görünümünü de ayarla). Uygulamadaki her `.tint` ve düğme artık onu kullanır.
        5. Uygulama hedefini seç, **General**'ı aç ve **Display Name**'i `Habits` (ya da daha güzel bir ad) yap. İkonun altında kesilmesin diye kısa tut.
        6. Uygulamayı çalıştır, Simulator'da Home'a bas (*Device → Home* ya da Shift+Cmd+H) ve ikona bak. Commit'le: `git add .` ve `git commit -m "Add the app icon and accent colour"`.
    code:
      - file: terminal
        lang: sh
        text: |
          sips -g pixelWidth -g pixelHeight AppIcon.png
          # macOS tool "sips": prints the size of the picture in pixels
    mistakes:
      - problem:
          en: "The icon shows as a blank white square, or Xcode warns about the icon."
          tr: "İkon boş beyaz kare görünüyor ya da Xcode ikon hakkında uyarı veriyor."
        fix:
          en: "Check that the picture is exactly 1024 x 1024 pixels and is placed in the right slot of **AppIcon** (the Any appearance slot for the normal icon). Clean the build (*Product → Clean Build Folder*) and delete the app from the Simulator."
          tr: "Resmin tam 1024 x 1024 piksel olduğunu ve **AppIcon**'un doğru kutusuna (normal ikon için Any görünüm kutusu) konduğunu kontrol et. Build'i temizle (*Product → Clean Build Folder*) ve uygulamayı Simulator'dan sil."
      - problem:
          en: "Rounding the corners yourself or adding a border and a shadow."
          tr: "Köşeleri kendin yuvarlamak ya da çerçeve ve gölge eklemek."
        fix:
          en: "Deliver square layers. The system applies the exact corner shape and effects, and your own rounding would show as odd edges."
          tr: "Kare katmanlar ver. Tam köşe şeklini ve efektleri sistem uygular; kendi yuvarlatman tuhaf kenarlar olarak görünür."
      - problem:
          en: "A long display name is cut off with \"...\" under the icon."
          tr: "Uzun bir görünen ad ikonun altında \"...\" ile kesiliyor."
        fix:
          en: "Shorten the display name. The full product name can stay longer on the store page."
          tr: "Görünen adı kısalt. Tam ürün adı mağaza sayfasında daha uzun kalabilir."
    quiz:
      - q:
          en: "How many icon images do you need to start with in Xcode?"
          tr: "Xcode'da başlamak için kaç ikon resmi gerekir?"
        options:
          en: [One square 1024 x 1024 image, Twenty images in different sizes, One 512 x 256 image]
          tr: [Tek bir kare 1024 x 1024 resim, Farklı boyutlarda yirmi resim, Tek bir 512 x 256 resim]
        answer: 0
        why:
          en: "With *Single Size*, Xcode generates the other sizes from one 1024 x 1024 image."
          tr: "*Single Size* ile Xcode diğer boyutları tek bir 1024 x 1024 resimden üretir."
    sources:
      - title: Configuring your app icon
        url: https://developer.apple.com/documentation/xcode/configuring-your-app-icon
      - title: Human Interface Guidelines - App icons
        url: https://developer.apple.com/design/human-interface-guidelines/app-icons
      - title: Icon Composer
        url: https://developer.apple.com/icon-composer/

  - id: on-iphone
    stage: packaging
    title:
      en: "Run the app on your own iPhone with a free Apple Account"
      tr: "Uygulamayı ücretsiz Apple Account ile kendi iPhone'unda çalıştırma"
    minutes: 45
    needs: [icon]
    why:
      en: "The Simulator is not a phone: it has no real touch, speed, sensors or battery. Running on your own iPhone costs nothing, and it is the best test there is. The free account has clear limits that you should know before you start."
      tr: "Simulator bir telefon değildir: gerçek dokunma, hız, sensör ve pil yoktur. Kendi iPhone'unda çalıştırmak ücretsizdir ve yapabileceğin en iyi testtir. Ücretsiz hesabın başlamadan bilmen gereken net sınırları var."
    learn:
      en: |
        - Pairing an iPhone, Developer Mode, and signing with a Personal Team
        - What code signing and a provisioning profile are, in one sentence each
        - The free-account limits from Apple's membership comparison page: 10 App IDs, 3 devices, 3 apps per device, and 7 days
        - What the free account cannot do: TestFlight and the App Store
      tr: |
        - iPhone'u eşleştirmek, Developer Mode ve Personal Team ile imzalama
        - Code signing ve provisioning profile'ın birer cümleyle ne olduğu
        - Apple'ın üyelik karşılaştırma sayfasındaki ücretsiz hesap sınırları: 10 App ID, 3 cihaz, cihaz başına 3 uygulama ve 7 gün
        - Ücretsiz hesabın yapamadıkları: TestFlight ve App Store
    do:
      en: |
        1. Sign in to Xcode with your free Apple Account: *Xcode → Settings → Apple Accounts → +*. Xcode shows it as a **Personal Team**.
        2. Select the app target, open **Signing & Capabilities**, tick *Automatically manage signing*, pick your Personal Team and set a **unique bundle identifier** (for example `com.yourname.Habits`; if it is taken, add something of your own).
        3. Under **General → Minimum Deployments** set the iOS version to the lowest your iPhone and the code allow. The app uses features from **iOS 17**, so 17.0 is the lowest it can be. Your iPhone must run that version or newer, and Xcode 27 can debug on iOS 17 and later.
        4. Connect the iPhone to the Mac with a cable, unlock it and tap **Trust** when asked. (With an iPhone on iOS 27, Device Hub can also pair over the network: *+ → Pair Nearby Device…*.)
        5. Turn on **Developer Mode** on the iPhone: *Settings → Privacy & Security → Developer Mode*, then restart as it asks and confirm. The switch only appears after you have paired the phone with Xcode.
        6. Choose your iPhone as the run destination and press Run. If the iPhone says the developer is not trusted, open *Settings → General → VPN & Device Management* (the name can differ a little between iOS versions), choose your developer entry and trust it, then launch the app again.
        7. Know the limits of the free account (from Apple's membership page). You can register up to 10 App IDs and up to 3 devices, and both expire after 7 days. You can install up to 3 apps on a device. The provisioning profile expires 7 days after it was issued, and then the app stops opening until you rebuild and reinstall it: connect the phone and press Run again. There is no TestFlight and no App Store with a free account, and more advanced app capabilities need the paid Apple Developer Program. This step changes only settings, so there is nothing new to commit.
      tr: |
        1. Xcode'a ücretsiz Apple Account'unla giriş yap: *Xcode → Settings → Apple Accounts → +*. Xcode bunu **Personal Team** olarak gösterir.
        2. Uygulama hedefini seç, **Signing & Capabilities**'i aç, *Automatically manage signing*'i işaretle, Personal Team'ini seç ve **benzersiz bir bundle identifier** yaz (örneğin `com.senin-adin.Habits`; alınmışsa kendi bir şeyini ekle).
        3. **General → Minimum Deployments** altında iOS sürümünü iPhone'unun ve kodun izin verdiği en düşük sürüme ayarla. Uygulama **iOS 17** özellikleri kullanır, yani en düşük 17.0 olabilir. iPhone'un bu sürümü ya da daha yenisini çalıştırmalı; Xcode 27 iOS 17 ve sonrasında hata ayıklayabilir.
        4. iPhone'u kabloyla Mac'e bağla, kilidini aç ve sorulunca **Trust**'a dokun. (iOS 27 çalıştıran bir iPhone'da Device Hub ağ üzerinden de eşleşebilir: *+ → Pair Nearby Device…*.)
        5. iPhone'da **Developer Mode**'u aç: *Settings → Privacy & Security → Developer Mode*, sonra istediği gibi yeniden başlat ve onayla. Anahtar ancak telefonu Xcode ile eşleştirdikten sonra görünür.
        6. Çalıştırma hedefi olarak iPhone'unu seç ve Run'a bas. iPhone geliştiriciye güvenilmediğini söylerse *Settings → General → VPN & Device Management*'i aç (ad iOS sürümlerine göre biraz değişebilir), geliştirici kaydını seç ve güven, sonra uygulamayı tekrar aç.
        7. Ücretsiz hesabın sınırlarını bil (Apple'ın üyelik sayfasından). En fazla 10 App ID ve 3 cihaz kaydedebilirsin, ikisi de 7 gün sonra sona erer. Bir cihaza en fazla 3 uygulama kurabilirsin. Provisioning profile verildikten 7 gün sonra sona erer ve uygulama, yeniden derleyip kurana kadar açılmaz: telefonu bağla ve tekrar Run'a bas. Ücretsiz hesapla TestFlight ve App Store yok, daha gelişmiş uygulama yetenekleri ücretli Apple Developer Program ister. Bu adım sadece ayarları değiştirir, commit'lenecek yeni bir şey yok.
    code:
      - file: terminal
        lang: sh
        text: |
          xcrun devicectl list devices
    mistakes:
      - problem:
          en: "\"Failed to register bundle identifier\" or \"no profiles for ... were found\"."
          tr: "\"Failed to register bundle identifier\" ya da \"no profiles for ... were found\"."
        fix:
          en: "The bundle identifier is already used by someone else. Pick another unique one. A free account may also have hit its limit of 10 App IDs per 7 days; wait or reuse the identifier you already have."
          tr: "Bundle identifier başka biri tarafından kullanılıyor. Başka bir benzersiz tane seç. Ücretsiz hesap 7 günde 10 App ID sınırına da takılmış olabilir; bekle ya da elindeki identifier'ı yeniden kullan."
      - problem:
          en: "The Developer Mode switch is missing on the iPhone."
          tr: "iPhone'da Developer Mode anahtarı yok."
        fix:
          en: "It appears only after the iPhone has been connected to Xcode (or paired in Device Hub). Connect it, unlock it and look again."
          tr: "Sadece iPhone Xcode'a bağlandıktan (ya da Device Hub'da eşleştikten) sonra görünür. Bağla, kilidini aç ve tekrar bak."
      - problem:
          en: "The app worked last week and now it does not open."
          tr: "Uygulama geçen hafta çalışıyordu, şimdi açılmıyor."
        fix:
          en: "With a free account the provisioning profile expires after 7 days. Connect the phone to the Mac and press Run again. A paid Apple Developer Program account removes this limit."
          tr: "Ücretsiz hesapta provisioning profile 7 gün sonra sona erer. Telefonu Mac'e bağla ve tekrar Run'a bas. Ücretli Apple Developer Program hesabı bu sınırı kaldırır."
    quiz:
      - q:
          en: "What happens to an app installed with a free Apple Account after 7 days?"
          tr: "Ücretsiz Apple Account ile kurulan bir uygulamaya 7 gün sonra ne olur?"
        options:
          en: [It is removed from the App Store, It stops opening until you build and install it again, It turns into a paid app]
          tr: [App Store'dan kaldırılır, Yeniden derleyip kurana kadar açılmaz, Ücretli uygulamaya dönüşür]
        answer: 1
        why:
          en: "Apple's page says the provisioning profile expires 7 days after it is issued, and you must rebuild and reinstall the app."
          tr: "Apple'ın sayfası provisioning profile'ın verildikten 7 gün sonra sona erdiğini ve uygulamayı yeniden derleyip kurman gerektiğini söyler."
    sources:
      - title: Apple Developer - Compare memberships (free account limits)
        url: https://developer.apple.com/support/compare-memberships
      - title: Running your app on simulated or physical devices
        url: https://developer.apple.com/documentation/xcode/running-your-app-on-simulated-or-physical-devices
      - title: Enabling Developer Mode on a device
        url: https://developer.apple.com/documentation/xcode/enabling-developer-mode-on-a-device

  - id: testflight-store
    stage: deploy
    title:
      en: "TestFlight and the App Store"
      tr: "TestFlight ve App Store"
    minutes: 120
    needs: [on-iphone]
    why:
      en: "To give the app to other people you must go through Apple. TestFlight lets friends try a beta on their own iPhones, and the App Store is how everyone else gets it. Both need a paid membership, and you should know the cost and the steps before you plan around them."
      tr: "Uygulamayı başkalarına vermek için Apple'dan geçmek gerekir. TestFlight arkadaşlarının betayı kendi iPhone'larında denemesini sağlar, App Store ise herkesin uygulamayı alma yoludur. İkisi de ücretli üyelik ister; bunlara göre plan yapmadan önce maliyeti ve adımları bilmelisin."
    learn:
      en: |
        - The honest cost: the Apple Developer Program is 99 USD per year (in local currency where available); the free account cannot use TestFlight or the App Store
        - The path: archive in Xcode, upload to App Store Connect, TestFlight beta, then submit for App Review
        - Version and build numbers, and the privacy manifest
        - What internal and external testers are, and how long a beta build lasts (90 days)
      tr: |
        - Dürüst maliyet: Apple Developer Program yılda 99 USD'dir (mümkün olan yerlerde yerel para biriminde); ücretsiz hesap TestFlight'ı ya da App Store'u kullanamaz
        - Yol: Xcode'da arşivle, App Store Connect'e yükle, TestFlight betası, sonra App Review'a gönder
        - Sürüm ve build numaraları, privacy manifest
        - Dahili ve harici test edenlerin ne olduğu, bir beta build'in ne kadar yaşadığı (90 gün)
    do:
      en: |
        1. **Decide first.** If you only want to learn, you can stop at the previous step: nothing here is needed for your own iPhone. To go on you must join the **Apple Developer Program** (developer.apple.com/programs): 99 USD per year, an Apple Account with two-factor authentication, and identity verification. Some schools and non-profits can get a fee waiver.
        2. Add a privacy manifest. `@AppStorage` uses UserDefaults, which Apple lists as a "required reason API", so the app must say why (reason `CA92.1`: only the app itself reads its own settings). Use *File → New → File from Template → App Privacy* (or create `PrivacyInfo.xcprivacy` by hand with the content below).
        3. Set the version in the target's **General** tab: **Version** `1.0` and **Build** `1`. Every upload of a version needs a build number higher than the last.
        4. Create the app record: sign in to **App Store Connect** (appstoreconnect.apple.com), *Apps → + → New App*. Choose iOS, a store name, the primary language, your bundle identifier and a SKU (any ID you invent).
        5. In Xcode choose **Any iOS Device** as the destination, then *Product → Archive*. In the Organizer click **Distribute App → App Store Connect → Distribute**. Keep the option to upload symbols, so crash reports are readable later.
        6. Wait for the build to finish processing in App Store Connect. Answer the export compliance question (read Apple's page on encryption export rules; the app only uses system encryption such as HTTPS, but you give the answer).
        7. In **TestFlight** add yourself as an internal tester, install the free TestFlight app on your iPhone and try the build. Internal testers (up to 100 people from your App Store Connect team) need no review. External testers (up to 10,000, invited by email or a public link) need the first build to pass a short beta review. A build expires after 90 days.
        8. When you are happy, fill in the store page: description, keywords, screenshots, support URL, privacy policy URL, age rating, the App Privacy answers and the price. Choose your build and click **Add for Review**, then **Submit**. Read the App Review Guidelines first. Review times vary.
      tr: |
        1. **Önce karar ver.** Sadece öğrenmek istiyorsan bir önceki adımda durabilirsin: kendi iPhone'un için buradakilerin hiçbiri gerekmez. Devam etmek için **Apple Developer Program**'a (developer.apple.com/programs) katılmalısın: yılda 99 USD, iki adımlı doğrulamalı bir Apple Account ve kimlik doğrulaması. Bazı okullar ve kâr amacı gütmeyen kuruluşlar ücret muafiyeti alabilir.
        2. Bir privacy manifest ekle. `@AppStorage` UserDefaults kullanır; Apple bunu "required reason API" olarak listeler, bu yüzden uygulama nedenini söylemeli (`CA92.1` nedeni: ayarları sadece uygulamanın kendisi okur). *File → New → File from Template → App Privacy*'yi kullan (ya da `PrivacyInfo.xcprivacy` dosyasını aşağıdaki içerikle elle oluştur).
        3. Sürümü hedefin **General** sekmesinde ayarla: **Version** `1.0`, **Build** `1`. Bir sürümün her yüklemesi, bir öncekinden büyük bir build numarası ister.
        4. Uygulama kaydını oluştur: **App Store Connect**'e (appstoreconnect.apple.com) gir, *Apps → + → New App*. iOS'u, mağaza adını, ana dili, bundle identifier'ını ve bir SKU'yu (uydurduğun herhangi bir ID) seç.
        5. Xcode'da hedef olarak **Any iOS Device**'ı seç, sonra *Product → Archive*. Organizer'da **Distribute App → App Store Connect → Distribute**'a tıkla. Sembolleri yükleme seçeneği açık kalsın ki çökme raporları sonra okunabilsin.
        6. App Store Connect'te build'in işlenmesini bekle. İhracat uyumluluğu (export compliance) sorusunu yanıtla (Apple'ın şifreleme ihracat kuralları sayfasını oku; uygulama sadece HTTPS gibi sistem şifrelemesini kullanır ama cevabı sen verirsin).
        7. **TestFlight**'ta kendini dahili test eden olarak ekle, iPhone'una ücretsiz TestFlight uygulamasını kur ve build'i dene. Dahili test edenler (App Store Connect ekibinden en fazla 100 kişi) inceleme gerektirmez. Harici test edenler (en fazla 10.000 kişi, e-posta ya da herkese açık bağlantıyla davet edilir) için ilk build kısa bir beta incelemesinden geçmelidir. Build 90 gün sonra sona erer.
        8. Memnun olunca mağaza sayfasını doldur: açıklama, anahtar kelimeler, ekran görüntüleri, destek URL'si, gizlilik politikası URL'si, yaş derecesi, App Privacy cevapları ve fiyat. Build'ini seç, **Add for Review**'a sonra **Submit**'e tıkla. Önce App Review Guidelines'ı oku. İnceleme süreleri değişir.
    code:
      - file: Habits/PrivacyInfo.xcprivacy
        lang: xml
        text: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSPrivacyTracking</key>
              <false/>
              <key>NSPrivacyTrackingDomains</key>
              <array/>
              <key>NSPrivacyCollectedDataTypes</key>
              <array/>
              <key>NSPrivacyAccessedAPITypes</key>
              <array>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategoryUserDefaults</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>CA92.1</string>
                      </array>
                  </dict>
              </array>
          </dict>
          </plist>
      - file: terminal
        lang: sh
        text: |
          xcodebuild -scheme Habits -destination 'generic/platform=iOS' -archivePath build/Habits.xcarchive archive
    mistakes:
      - problem:
          en: "The upload is rejected because the build number was already used."
          tr: "Build numarası daha önce kullanıldığı için yükleme reddediliyor."
        fix:
          en: "Raise **Build** (for example from 1 to 2) and archive again. The **Version** (1.0) can stay the same until you release a new one."
          tr: "**Build**'i artır (örneğin 1'den 2'ye) ve tekrar arşivle. **Version** (1.0) yeni sürüm çıkarana kadar aynı kalabilir."
      - problem:
          en: "Apple emails you about a missing reason for a required reason API, or the upload warns about the privacy manifest."
          tr: "Apple bir required reason API için eksik neden hakkında e-posta atıyor ya da yükleme privacy manifest konusunda uyarı veriyor."
        fix:
          en: "Add the API category and reason to `PrivacyInfo.xcprivacy`, as in the code. Third-party SDKs bring their own manifests."
          tr: "API kategorisini ve nedenini koddaki gibi `PrivacyInfo.xcprivacy`'ye ekle. Üçüncü taraf SDK'ların kendi manifest'leri vardır."
      - problem:
          en: "The review is rejected because there is no way to reach you or no privacy policy."
          tr: "İnceleme, sana ulaşma yolu ya da gizlilik politikası olmadığı için reddediliyor."
        fix:
          en: "Fill in a working support URL and a privacy policy URL (a simple public page is enough), a contact, and honest App Privacy answers. Read the rejection message: it names the guideline."
          tr: "Çalışan bir destek URL'si ve gizlilik politikası URL'si (basit bir herkese açık sayfa yeter), bir iletişim bilgisi ve dürüst App Privacy cevapları gir. Red mesajını oku: hangi kuralın ihlal edildiğini söyler."
    quiz:
      - q:
          en: "Can you put an app on TestFlight or the App Store with only a free Apple Account?"
          tr: "Sadece ücretsiz bir Apple Account ile bir uygulamayı TestFlight'a ya da App Store'a koyabilir misin?"
        options:
          en: [Yes for TestFlight but not the App Store, No you need the paid Apple Developer Program, Yes both are free]
          tr: [TestFlight evet ama App Store hayır, Hayır ücretli Apple Developer Program gerekir, Evet ikisi de ücretsiz]
        answer: 1
        why:
          en: "App Store Connect, TestFlight and App Store distribution come with the Apple Developer Program membership (99 USD per year). The free account can only run apps on your own devices."
          tr: "App Store Connect, TestFlight ve App Store dağıtımı Apple Developer Program üyeliğiyle (yılda 99 USD) gelir. Ücretsiz hesap uygulamaları sadece kendi cihazlarında çalıştırabilir."
    sources:
      - title: Distributing your app for beta testing and releases
        url: https://developer.apple.com/documentation/xcode/distributing-your-app-for-beta-testing-and-releases
      - title: TestFlight overview
        url: https://developer.apple.com/help/app-store-connect/test-a-beta-version/testflight-overview
      - title: Apple Developer Program enrollment
        url: https://developer.apple.com/help/account/membership/program-enrollment/

  - id: crashes
    stage: monitoring
    title:
      en: "Find out when the app crashes"
      tr: "Uygulama çöktüğünde öğrenme"
    minutes: 60
    needs: [testflight-store]
    why:
      en: "Once other people use the app, you are no longer there to see it crash. Apple collects crash reports from TestFlight and the App Store for you, and Xcode shows them with the exact line that failed."
      tr: "Uygulamayı başkaları kullanmaya başlayınca çöktüğünü görmek için yanında olmazsın. Apple TestFlight ve App Store'dan çökme raporlarını senin için toplar, Xcode da bunları başarısız olan satırla birlikte gösterir."
    learn:
      en: |
        - The Crashes organizer (Window → Organizer) and TestFlight feedback in App Store Connect
        - Why symbols (dSYM files) matter: they turn memory addresses into function names and lines
        - How to read a crash report: the crashed thread and the exception type (`EXC_BREAKPOINT` is how a Swift runtime error such as a failed force unwrap looks)
        - MetricKit: your app receives crash and hang diagnostics from the system
      tr: |
        - Crashes organizer (Window → Organizer) ve App Store Connect'teki TestFlight geri bildirimleri
        - Sembollerin (dSYM dosyaları) neden önemli olduğu: bellek adreslerini fonksiyon adlarına ve satırlara çevirirler
        - Çökme raporu nasıl okunur: çöken thread ve istisna türü (`EXC_BREAKPOINT`, `nil` bir optional'ı zorla açmak gibi Swift çalışma zamanı hatalarının görünümüdür)
        - MetricKit: uygulaman sistemden çökme ve takılma tanılamalarını (diagnostics) alır
    do:
      en: |
        1. Make sure symbols are uploaded when you distribute (the option you kept in the previous step). Without them, a report shows only addresses.
        2. Create `DiagnosticsReceiver.swift` and start it in `HabitsApp`. The system hands your app crash and hang reports through MetricKit, usually within a day. For now it writes a line to the log. In a real app you would send it to your own server.
        3. Test the path once: add a debug-only button that crashes on purpose (see the snippet in the `Settings` code below, wrapped in `#if DEBUG`), install a build from TestFlight with it temporarily enabled, crash it, and look for the report. Remove the button after.
        4. Look at reports: in Xcode open *Window → Organizer → Crashes*, choose your app and version. In App Store Connect, TestFlight shows crashes and tester feedback for each build. Testers can also send feedback by taking a screenshot in the beta app.
        5. Read one report: find the crashed thread, then the first line that is your own code. The exception type and the message (for example "Unexpectedly found nil while unwrapping an Optional value") tell you why.
        6. Make it a habit: after every release look at the Crashes organizer. Commit: `git add .` and `git commit -m "Receive MetricKit diagnostics"`.
      tr: |
        1. Dağıtırken sembollerin yüklendiğinden emin ol (önceki adımda açık bıraktığın seçenek). Onlar olmadan rapor sadece adresleri gösterir.
        2. `DiagnosticsReceiver.swift` oluştur ve `HabitsApp` içinde başlat. Sistem çökme ve takılma raporlarını MetricKit ile uygulamana, genelde bir gün içinde verir. Şimdilik log'a bir satır yazar. Gerçek bir uygulamada bunu kendi sunucuna gönderirdin.
        3. Yolu bir kez dene: bilerek çöken, sadece debug'da olan bir düğme ekle (aşağıdaki `Settings` kodundaki `#if DEBUG` içindeki parçaya bak), geçici olarak açık halde TestFlight'tan bir build kur, çökert ve raporu ara. Sonra düğmeyi kaldır.
        4. Raporlara bak: Xcode'da *Window → Organizer → Crashes*'i aç, uygulamanı ve sürümü seç. App Store Connect'te TestFlight her build için çökmeleri ve test edenlerin geri bildirimlerini gösterir. Test edenler beta uygulamada ekran görüntüsü alarak da geri bildirim gönderebilir.
        5. Bir raporu oku: çöken thread'i, sonra kendi kodun olan ilk satırı bul. İstisna türü ve mesaj (örneğin "Unexpectedly found nil while unwrapping an Optional value") nedenini söyler.
        6. Alışkanlık yap: her sürümden sonra Crashes organizer'a bak. Commit'le: `git add .` ve `git commit -m "Receive MetricKit diagnostics"`.
    code:
      - file: Habits/DiagnosticsReceiver.swift
        lang: swift
        text: |
          import MetricKit
          import os

          /// Receives crash and hang reports that the system collects for the app.
          nonisolated final class DiagnosticsReceiver: NSObject, MXMetricManagerSubscriber {
              private let logger = Logger(subsystem: "com.yourname.Habits", category: "diagnostics")

              func didReceive(_ payloads: [MXMetricPayload]) {
                  logger.info("Received \(payloads.count) metric payload(s)")
              }

              func didReceive(_ payloads: [MXDiagnosticPayload]) {
                  for payload in payloads {
                      let crashes = payload.crashDiagnostics?.count ?? 0
                      let hangs = payload.hangDiagnostics?.count ?? 0
                      logger.error("Diagnostics: \(crashes) crash(es), \(hangs) hang(s)")
                  }
              }
          }
      - file: Habits/HabitsApp.swift
        lang: swift
        text: |
          import MetricKit
          import SwiftData
          import SwiftUI

          @main
          struct HabitsApp: App {
              private let diagnostics = DiagnosticsReceiver()

              init() {
                  MXMetricManager.shared.add(diagnostics)
              }

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
                  .modelContainer(for: Habit.self)
              }
          }
      - file: Habits/SettingsView.swift
        lang: swift
        text: |
          // Add this section inside the Form in SettingsView, after the sync token section.
          // It only exists in Debug builds. To test a TestFlight crash, enable it for one build only.
          #if DEBUG
          Section("Debug") {
              Button("Crash now", role: .destructive) {
                  fatalError("Test crash")
              }
          }
          #endif
    mistakes:
      - problem:
          en: "A crash report shows only hex addresses and no function names."
          tr: "Bir çökme raporu sadece onaltılık adresleri gösteriyor, fonksiyon adı yok."
        fix:
          en: "The symbols (dSYM) were not uploaded. Keep *Upload your app's symbols* on when distributing, and keep each archive: the Organizer can re-symbolicate from it."
          tr: "Semboller (dSYM) yüklenmemiş. Dağıtırken *Upload your app's symbols* açık kalsın ve her arşivi sakla: Organizer ondan yeniden sembolleştirebilir."
      - problem:
          en: "The Crashes organizer is empty although people say the app crashes."
          tr: "İnsanlar uygulamanın çöktüğünü söylediği halde Crashes organizer boş."
        fix:
          en: "The Organizer shows reports only from people who share diagnostics with developers, and it takes a while. TestFlight users share crash reports automatically. You can also ask a user to send the crash log from Settings → Privacy & Security → Analytics & Improvements → Analytics Data."
          tr: "Organizer sadece tanılamaları geliştiricilerle paylaşan kişilerin raporlarını gösterir ve biraz zaman alır. TestFlight kullanıcıları çökme raporlarını otomatik paylaşır. Bir kullanıcıdan çökme kaydını Settings → Privacy & Security → Analytics & Improvements → Analytics Data içinden göndermesini de isteyebilirsin."
      - problem:
          en: "Leaving the debug crash button in a build you release."
          tr: "Debug çökme düğmesini yayınladığın bir build'de bırakmak."
        fix:
          en: "Keep it inside `#if DEBUG` and remove it again after the test. An app that can crash on a button is a bad release."
          tr: "`#if DEBUG` içinde tut ve testten sonra tekrar kaldır. Düğmeyle çökebilen bir uygulama kötü bir sürümdür."
    quiz:
      - q:
          en: "Why upload symbols (dSYM) with a build?"
          tr: "Neden bir build ile semboller (dSYM) yüklenir?"
        options:
          en: [To make the app smaller, To turn crash addresses into readable function names and lines, To get the app approved faster]
          tr: [Uygulama küçülsün diye, Çökme adreslerini okunabilir fonksiyon adlarına ve satırlara çevirmek için, Uygulama daha hızlı onaylansın diye]
        answer: 1
        why:
          en: "Release builds hide names. The symbols map addresses back to your functions, so the report points to the line that failed."
          tr: "Release build'ler adları gizler. Semboller adresleri fonksiyonlarına geri eşler; böylece rapor başarısız olan satırı gösterir."
    sources:
      - title: Acquiring crash reports and diagnostic logs
        url: https://developer.apple.com/documentation/xcode/acquiring-crash-reports-and-diagnostic-logs
      - title: Diagnosing issues using crash reports and device logs
        url: https://developer.apple.com/documentation/xcode/diagnosing-issues-using-crash-reports-and-device-logs
      - title: MetricKit
        url: https://developer.apple.com/documentation/metrickit

  - id: next
    stage: advanced
    title:
      en: "Where to go next"
      tr: "Sonraki adımlar"
    minutes: 45
    needs: [crashes]
    why:
      en: "You now know the whole path from an idea to an app on a phone. The best next step is to make this app better for every kind of person, then add one new platform feature at a time."
      tr: "Artık fikirden telefondaki bir uygulamaya giden tüm yolu biliyorsun. En iyi sonraki adım bu uygulamayı her türlü insan için daha iyi yapmak, sonra her seferinde yeni bir platform özelliği eklemek."
    learn:
      en: |
        - Accessibility: VoiceOver labels, Dynamic Type, enough contrast (it is also checked by App Review and loved by users)
        - Widgets (WidgetKit) and App Intents: show the streak on the Home Screen and in Shortcuts
        - Local notifications as daily reminders (the app asks permission first)
        - iCloud sync with SwiftData and CloudKit: needs the paid Developer Program
        - Swift concurrency in depth: actors, `Sendable`, `@MainActor`
        - Localization: `String(localized:)` and String Catalogs
      tr: |
        - Erişilebilirlik: VoiceOver etiketleri, Dynamic Type, yeterli kontrast (App Review da bakar, kullanıcılar da sever)
        - Widget'lar (WidgetKit) ve App Intents: seriyi Ana Ekran'da ve Shortcuts'ta göstermek
        - Günlük hatırlatma olarak yerel bildirimler (uygulama önce izin ister)
        - SwiftData ve CloudKit ile iCloud eşitleme: ücretli Developer Program ister
        - Swift concurrency'yi derinlemesine: actor, `Sendable`, `@MainActor`
        - Yerelleştirme: `String(localized:)` ve String Catalog'lar
    do:
      en: |
        1. Turn on VoiceOver on your iPhone (*Settings → Accessibility → VoiceOver*) and use Habits with your eyes closed. Replace `HabitRow.swift` with the version below: the whole row is read as one item with a clear value.
        2. Set the text size to the largest in *Settings → Accessibility → Display & Text Size → Larger Text*. Does the layout still work? Fix what breaks.
        3. Pick one feature from the list and build it from the official tutorial. A Home Screen widget with today's streak is a good first one.
        4. Read the App Review Guidelines and the Human Interface Guidelines once. They explain why many things in this roadmap are the way they are.
        5. Keep the habit loop: small change, test on your phone, commit.
      tr: |
        1. iPhone'unda VoiceOver'ı aç (*Settings → Accessibility → VoiceOver*) ve Habits'i gözlerin kapalı kullan. `HabitRow.swift`'i aşağıdaki sürümle değiştir: tüm satır net bir değerle tek öğe olarak okunur.
        2. Yazı boyutunu *Settings → Accessibility → Display & Text Size → Larger Text* altında en büyüğe ayarla. Yerleşim hâlâ çalışıyor mu? Bozulanı düzelt.
        3. Listeden bir özellik seç ve resmî eğitimden yap. Bugünün serisini gösteren bir Ana Ekran widget'ı iyi bir ilk seçim.
        4. App Review Guidelines ve Human Interface Guidelines'ı bir kez oku. Bu yol haritasındaki birçok şeyin neden öyle olduğunu açıklarlar.
        5. Alışkanlık döngüsünü sürdür: küçük değişiklik, telefonda test, commit.
    code:
      - file: Habits/HabitRow.swift
        lang: swift
        text: |
          import SwiftUI

          struct HabitRow: View {
              let habit: Habit
              @AppStorage("showStreaks") private var showStreaks = true

              var body: some View {
                  HStack(spacing: 12) {
                      Image(systemName: habit.symbol)
                          .font(.title2)
                          .frame(width: 44, height: 44)
                          .background(.tint.opacity(0.15), in: Circle())
                          .accessibilityHidden(true)

                      VStack(alignment: .leading) {
                          Text(habit.name)
                              .font(.headline)
                          if showStreaks {
                              Text("\(habit.streak) days in a row")
                                  .font(.subheadline)
                                  .foregroundStyle(.secondary)
                          }
                      }

                      Spacer()

                      if habit.isDone() {
                          Image(systemName: "checkmark.circle.fill")
                              .foregroundStyle(.green)
                              .accessibilityHidden(true)
                      }
                  }
                  .accessibilityElement(children: .combine)
                  .accessibilityValue(habit.isDone() ? "Done today" : "Not done today")
              }
          }

          #Preview {
              HabitRow(habit: Habit(name: "Read", symbol: "book.fill"))
                  .padding()
          }
    mistakes:
      - problem:
          en: "Adding many features at once and losing track of what broke."
          tr: "Bir sürü özelliği birden eklemek ve neyin bozulduğunu kaybetmek."
        fix:
          en: "One feature per commit, with the tests green before the next one."
          tr: "Commit başına bir özellik; sonrakine geçmeden testler yeşil olsun."
      - problem:
          en: "Only testing with the Simulator and the default text size."
          tr: "Sadece Simulator'da ve varsayılan yazı boyutuyla test etmek."
        fix:
          en: "Test on a real phone, with VoiceOver, with the largest text size and in Dark Mode. Many users use at least one of these."
          tr: "Gerçek telefonda, VoiceOver ile, en büyük yazı boyutuyla ve Koyu Mod'da test et. Kullanıcıların çoğu bunlardan en az birini kullanır."
    quiz:
      - q:
          en: "What does `.accessibilityElement(children: .combine)` do for the row?"
          tr: "`.accessibilityElement(children: .combine)` satır için ne yapar?"
        options:
          en: [It hides the row from VoiceOver, It makes VoiceOver read the whole row as one item, It makes the text bigger]
          tr: [Satırı VoiceOver'dan gizler, VoiceOver'ın tüm satırı tek öğe olarak okumasını sağlar, Yazıyı büyütür]
        answer: 1
        why:
          en: "The row's texts are combined into one VoiceOver item, so people swipe once per habit instead of once per word."
          tr: "Satırın metinleri tek bir VoiceOver öğesinde birleşir; böylece insanlar kelime başına değil alışkanlık başına bir kez kaydırır."
