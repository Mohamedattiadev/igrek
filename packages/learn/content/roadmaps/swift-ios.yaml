  - id: swiftdata
    stage: data-api
    title:
      en: "Keep the habits on the phone with SwiftData"
      tr: "Alışkanlıkları SwiftData ile telefonda saklama"
    minutes: 75
    needs: [forms]
    why:
      en: "Right now every habit disappears when the app closes. SwiftData is Apple's framework for saving your models in a database on the phone. You mark a class with `@Model`, ask for data with `@Query`, and the views update by themselves when the data changes."
      tr: "Şu an her alışkanlık uygulama kapanınca kayboluyor. SwiftData, modellerini telefondaki bir veritabanına kaydeden Apple framework'üdür. Bir sınıfı `@Model` ile işaretlersin, veriyi `@Query` ile istersin ve veri değişince view'ler kendiliğinden güncellenir."
    learn:
      en: |
        - `@Model`: turns a class into something SwiftData can save
        - `ModelContainer` (the database) and `ModelContext` (the scratch pad you insert into and delete from)
        - `@Query` with sorting, and why it replaces the `HabitStore`
        - `@Bindable` to edit a model in a `TextField`
        - Previews with an in-memory container
      tr: |
        - `@Model`: bir sınıfı SwiftData'nın kaydedebileceği hale getirir
        - `ModelContainer` (veritabanı) ve `ModelContext` (ekleme ve silme yaptığın çalışma alanı)
        - Sıralamalı `@Query` ve neden `HabitStore`'un yerini aldığı
        - Bir modeli `TextField`'da düzenlemek için `@Bindable`
        - Bellekte çalışan container ile önizleme
    do:
      en: |
        1. Replace `Habit.swift`: it is now a `@Model` class (a reference type, not a struct) with an `init`, and it gets a `toggle` function that used to live in the store.
        2. **Delete** `HabitStore.swift` (*Move to Trash*). `@Query` and the model context do its job.
        3. Replace `HabitsApp.swift`: `.modelContainer(for: Habit.self)` creates the database and gives every view a model context.
        4. Replace `ContentView.swift`, `AddHabitView.swift` and `HabitDetailView.swift` with the versions below. `HabitRow.swift` and `SettingsView.swift` stay as they are.
        5. Run the app, add two habits and tick one. Stop the app in Xcode and run it again: the habits are still there.
        6. Commit: `git add .` and `git commit -m "Save habits with SwiftData"`.
      tr: |
        1. `Habit.swift`'i değiştir: artık bir `@Model` sınıfı (struct değil, referans tipi), bir `init`'i var ve eskiden store'da olan `toggle` fonksiyonunu alıyor.
        2. `HabitStore.swift`'i **sil** (*Move to Trash*). Onun işini `@Query` ve model context yapar.
        3. `HabitsApp.swift`'i değiştir: `.modelContainer(for: Habit.self)` veritabanını oluşturur ve her view'e bir model context verir.
        4. `ContentView.swift`, `AddHabitView.swift` ve `HabitDetailView.swift` dosyalarını aşağıdaki sürümlerle değiştir. `HabitRow.swift` ve `SettingsView.swift` olduğu gibi kalır.
        5. Uygulamayı çalıştır, iki alışkanlık ekle ve birini işaretle. Uygulamayı Xcode'da durdurup tekrar çalıştır: alışkanlıklar hâlâ orada.
        6. Commit'le: `git add .` ve `git commit -m "Save habits with SwiftData"`.
    code:
      - file: Habits/Habit.swift
        lang: swift
        text: |
          import Foundation
          import SwiftData

          @Model
          final class Habit {
              var name: String
              var symbol: String
              var createdAt: Date
              var completedDays: [Date]

              init(
                  name: String,
                  symbol: String = "checkmark.circle",
                  createdAt: Date = .now,
                  completedDays: [Date] = []
              ) {
                  self.name = name
                  self.symbol = symbol
                  self.createdAt = createdAt
                  self.completedDays = completedDays
              }

              func isDone(on day: Date = .now, calendar: Calendar = .current) -> Bool {
                  completedDays.contains { calendar.isDate($0, inSameDayAs: day) }
              }

              func toggle(on day: Date = .now, calendar: Calendar = .current) {
                  if isDone(on: day, calendar: calendar) {
                      completedDays.removeAll { calendar.isDate($0, inSameDayAs: day) }
                  } else {
                      completedDays.append(calendar.startOfDay(for: day))
                  }
              }

              var streak: Int {
                  Streak.current(completedDays: completedDays)
              }
          }
      - file: Habits/HabitsApp.swift
        lang: swift
        text: |
          import SwiftData
          import SwiftUI

          @main
          struct HabitsApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
                  .modelContainer(for: Habit.self)
              }
          }
      - file: Habits/ContentView.swift
        lang: swift
        text: |
          import SwiftData
          import SwiftUI

          struct ContentView: View {
              enum Sheet: Identifiable {
                  case add, settings
                  var id: Self { self }
              }

              @Environment(\.modelContext) private var modelContext
              @Query(sort: \Habit.createdAt) private var habits: [Habit]
              @State private var sheet: Sheet?

              var body: some View {
                  NavigationStack {
                      List {
                          ForEach(habits) { habit in
                              NavigationLink(value: habit) {
                                  HabitRow(habit: habit)
                              }
                              .swipeActions(edge: .leading) {
                                  Button(habit.isDone() ? "Undo" : "Done", systemImage: "checkmark") {
                                      habit.toggle()
                                  }
                                  .tint(.green)
                              }
                          }
                          .onDelete(perform: delete)
                      }
                      .overlay {
                          if habits.isEmpty {
                              ContentUnavailableView(
                                  "No habits yet",
                                  systemImage: "checklist",
                                  description: Text("Tap + to add your first one.")
                              )
                          }
                      }
                      .navigationTitle("Today")
                      .navigationDestination(for: Habit.self) { habit in
                          HabitDetailView(habit: habit)
                      }
                      .toolbar {
                          ToolbarItem(placement: .topBarLeading) {
                              Button("Settings", systemImage: "gearshape") {
                                  sheet = .settings
                              }
                          }
                          ToolbarItem(placement: .topBarTrailing) {
                              Button("Add habit", systemImage: "plus") {
                                  sheet = .add
                              }
                          }
                      }
                      .sheet(item: $sheet) { sheet in
                          switch sheet {
                          case .add: AddHabitView()
                          case .settings: SettingsView()
                          }
                      }
                  }
              }

              private func delete(at offsets: IndexSet) {
                  for index in offsets {
                      modelContext.delete(habits[index])
                  }
              }
          }

          #Preview {
              ContentView()
                  .modelContainer(for: Habit.self, inMemory: true)
          }
