    mistakes:
      - problem:
          en: "The app crashes at launch or when opening the list, and the message says SwiftData could not find an active model container."
          tr: "Uygulama açılışta ya da listeyi açarken çöküyor ve mesaj SwiftData'nın etkin bir model container bulamadığını söylüyor."
        fix:
          en: "Add `.modelContainer(for: Habit.self)` to the scene in the app, and to every `#Preview` that shows a view with `@Query` or `modelContext` (use `inMemory: true` there)."
          tr: "Uygulamadaki sahneye ve `@Query` ya da `modelContext` kullanan bir view gösteren her `#Preview`'e `.modelContainer(for: Habit.self)` ekle (orada `inMemory: true` kullan)."
      - problem:
          en: "After you add or rename a property of `Habit`, the app crashes on launch with an error about the store."
          tr: "`Habit`'e özellik ekledikten ya da adını değiştirdikten sonra uygulama store ile ilgili bir hatayla açılışta çöküyor."
        fix:
          en: "The saved database has the old shape. While you are developing, delete the app from the Simulator and run again. Once real users have your app, you must write a migration (see the SwiftData documentation on schema versions) instead."
          tr: "Kayıtlı veritabanı eski şekilde. Geliştirme sırasında uygulamayı Simulator'dan sil ve tekrar çalıştır. Gerçek kullanıcıların elinde uygulama olunca bunun yerine bir migration yazmalısın (SwiftData belgelerindeki şema sürümlerine bak)."
      - problem:
          en: "Using the same `ModelContext` or a `Habit` from a background task."
          tr: "Aynı `ModelContext`'i ya da bir `Habit`'i arka plan görevinden kullanmak."
        fix:
          en: "Models and contexts belong to the actor that made them. Do UI work on the main actor. For heavy background work, SwiftData has `@ModelActor`; read about it when you need it."
          tr: "Modeller ve context'ler onları oluşturan actor'a aittir. Arayüz işlerini main actor'da yap. Ağır arka plan işi için SwiftData'da `@ModelActor` var; ihtiyacın olunca oku."
