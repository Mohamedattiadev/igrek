  - id: tests
    stage: testing
    title:
      en: "Write tests with Swift Testing"
      tr: "Swift Testing ile test yazma"
    minutes: 60
    needs: [networking]
    why:
      en: "A test runs your code and fails when the result is wrong. The streak rule has easy-to-break edge cases (yesterday, gaps, the same day twice), and tests let you change code later without fear."
      tr: "Test kodunu çalıştırır ve sonuç yanlışsa kırmızı olur. Seri kuralının kolay bozulan sınır durumları var (dün, boşluklar, aynı günün iki kez eklenmesi); testler kodu sonradan korkmadan değiştirmeni sağlar."
    learn:
      en: |
        - Swift Testing: `import Testing`, `@Test`, `#expect`, `#require`, parameterized tests with `arguments:`
        - XCTest is still used for UI tests (`XCUIApplication`); both live side by side
        - Test pure logic with fixed dates and a fixed time zone, never "today"
        - Fake the network with the `fetch` parameter, and use an in-memory SwiftData container
      tr: |
        - Swift Testing: `import Testing`, `@Test`, `#expect`, `#require`, `arguments:` ile parametreli testler
        - UI testleri için hâlâ XCTest kullanılır (`XCUIApplication`); ikisi yan yana yaşar
        - Saf mantığı sabit tarihler ve sabit saat dilimiyle test et, asla "bugün" ile değil
        - Ağı `fetch` parametresiyle taklit et, SwiftData için bellekte çalışan container kullan
    do:
      en: |
        1. Open the `HabitsTests` folder. Delete the sample test file Xcode made, then create `StreakTests.swift`, `QuoteServiceTests.swift` and `HabitTests.swift` with the code below.
        2. Press **Cmd+U** (*Product → Test*). Open the Test navigator (Cmd+6) to see each test with a green or red mark.
        3. Break the rule on purpose: change `value: -1` to `value: -2` in the `yesterday` line of `Streak.swift`, run again, read the failure message, then undo.
        4. UI tests use XCTest. In the `HabitsUITests` folder replace the sample with `HabitsUITests.swift`. It launches the app, adds a habit through the form and checks that it shows up.
        5. Optional, from the terminal: `xcodebuild -scheme Habits -showdestinations` lists the destinations, then run `xcodebuild test` with one of them.
        6. Commit: `git add .` and `git commit -m "Add tests"`.
      tr: |
        1. `HabitsTests` klasörünü aç. Xcode'un oluşturduğu örnek test dosyasını sil, sonra aşağıdaki kodla `StreakTests.swift`, `QuoteServiceTests.swift` ve `HabitTests.swift` oluştur.
        2. **Cmd+U**'ya bas (*Product → Test*). Her testi yeşil ya da kırmızı işaretle görmek için Test navigator'ı aç (Cmd+6).
        3. Kuralı bilerek boz: `Streak.swift` içindeki `yesterday` satırında `value: -1`'i `value: -2` yap, tekrar çalıştır, hata mesajını oku, sonra geri al.
        4. UI testleri XCTest kullanır. `HabitsUITests` klasöründe örneği `HabitsUITests.swift` ile değiştir. Uygulamayı açar, formla bir alışkanlık ekler ve göründüğünü kontrol eder.
        5. İsteğe bağlı, terminalden: `xcodebuild -scheme Habits -showdestinations` hedefleri listeler, sonra birini seçip `xcodebuild test` çalıştır.
        6. Commit'le: `git add .` ve `git commit -m "Add tests"`.
    code:
      - file: HabitsTests/StreakTests.swift
        lang: swift
        text: |
          import Foundation
          import Testing
          @testable import Habits

          struct StreakTests {
              let calendar: Calendar = {
                  var calendar = Calendar(identifier: .gregorian)
                  calendar.timeZone = TimeZone(identifier: "UTC")!
                  return calendar
              }()
              let today = Date(timeIntervalSince1970: 1_800_000_000)

              func days(back offsets: [Int]) -> [Date] {
                  offsets.map { calendar.date(byAdding: .day, value: -$0, to: today)! }
              }

              @Test func noDaysMeansNoStreak() {
                  #expect(Streak.current(completedDays: [], today: today, calendar: calendar) == 0)
              }

              @Test func countsDaysInARowEndingToday() {
                  let done = days(back: [0, 1, 2])
                  #expect(Streak.current(completedDays: done, today: today, calendar: calendar) == 3)
              }

              @Test func yesterdayStillCountsWhenTodayIsNotDoneYet() {
                  let done = days(back: [1, 2])
                  #expect(Streak.current(completedDays: done, today: today, calendar: calendar) == 2)
              }

              @Test func aGapEndsTheStreak() {
                  let done = days(back: [0, 1, 3, 4])
                  #expect(Streak.current(completedDays: done, today: today, calendar: calendar) == 2)
              }

              @Test func oldDaysAloneGiveZero() {
                  let done = days(back: [2, 3])
                  #expect(Streak.current(completedDays: done, today: today, calendar: calendar) == 0)
              }

              @Test func theSameDayTwiceCountsOnce() {
                  let done = [today, today.addingTimeInterval(60)]
                  #expect(Streak.current(completedDays: done, today: today, calendar: calendar) == 1)
              }

              @Test(arguments: [1, 7, 30, 365])
              func longStreaks(length: Int) {
                  let done = days(back: Array(0..<length))
                  #expect(Streak.current(completedDays: done, today: today, calendar: calendar) == length)
              }
          }
      - file: HabitsTests/QuoteServiceTests.swift
        lang: swift
        text: |
          import Foundation
          import Testing
          @testable import Habits

          nonisolated private func http(_ status: Int) -> URLResponse {
              HTTPURLResponse(
                  url: URL(string: "https://example.com")!,
                  statusCode: status,
                  httpVersion: nil,
                  headerFields: nil
              )!
          }

          struct QuoteServiceTests {
              @Test func decodesAQuote() async throws {
                  let json = #"{"id": 1, "quote": "Well begun is half done.", "author": "Aristotle"}"#
                  let service = QuoteService(fetch: { _ in (Data(json.utf8), http(200)) })

                  let quote = try await service.randomQuote()

                  #expect(quote == Quote(quote: "Well begun is half done.", author: "Aristotle"))
              }

              @Test func throwsOnABadStatus() async {
                  let service = QuoteService(fetch: { _ in (Data(), http(500)) })

                  await #expect(throws: QuoteError.badStatus(500)) {
                      try await service.randomQuote()
                  }
              }

              @Test func throwsOnBrokenJSON() async {
                  let service = QuoteService(fetch: { _ in (Data("nope".utf8), http(200)) })

                  await #expect(throws: DecodingError.self) {
                      try await service.randomQuote()
                  }
              }
          }
