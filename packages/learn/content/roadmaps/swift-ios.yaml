  - id: networking
    stage: data-api
    title:
      en: "Load a daily quote with async/await and Codable"
      tr: "async/await ve Codable ile günlük söz yükleme"
    minutes: 60
    needs: [swiftdata]
    why:
      en: "Most apps talk to a server. In Swift you describe the JSON with a `Codable` type, fetch it with `URLSession` and `await`, and the app stays responsive while it waits. A service type that you can replace in tests keeps this code easy to check."
      tr: "Çoğu uygulama bir sunucuyla konuşur. Swift'te JSON'u bir `Codable` tipiyle tarif eder, `URLSession` ve `await` ile getirirsin; beklerken uygulama akıcı kalır. Testlerde değiştirebildiğin bir servis tipi bu kodu kontrol etmeyi kolaylaştırır."
    learn:
      en: |
        - `Codable` (`Decodable` and `Encodable`) and `JSONDecoder`
        - `async`, `await`, `throws` and `try await`
        - `URLSession.shared.data(from:)` and checking the HTTP status code
        - `.task { }`: start async work when a view appears, and cancel it when it goes away
        - A loading, loaded and failed state with an `enum`
      tr: |
        - `Codable` (`Decodable` ve `Encodable`) ve `JSONDecoder`
        - `async`, `await`, `throws` ve `try await`
        - `URLSession.shared.data(from:)` ve HTTP durum kodunu kontrol etmek
        - `.task { }`: view görününce async işi başlatmak, kaybolunca iptal etmek
        - `enum` ile yükleniyor, yüklendi ve hata durumu
    do:
      en: |
        1. Open `https://dummyjson.com/quotes/random` in a browser. It is a free public service that returns JSON like `{ "id": 1, "quote": "...", "author": "..." }`. Reload and you get another quote.
        2. Create `Quote.swift`: a `Codable` type with the two fields you need. JSON fields you do not list (like `id`) are ignored.
        3. Create `QuoteService.swift`. It takes the network call as a parameter (`fetch`) with the real `URLSession` as the default, so tests can pass a fake one. It checks the status code before decoding.
        4. Create `QuoteCard.swift` and put it at the top of the list in `ContentView.swift`. The card shows a spinner, the quote, or a retry button.
        5. Run it. Turn Wi-Fi off on the Mac, relaunch and see the retry button. Commit: `git add .` and `git commit -m "Load a daily quote"`.
      tr: |
        1. Tarayıcıda `https://dummyjson.com/quotes/random` adresini aç. `{ "id": 1, "quote": "...", "author": "..." }` gibi bir JSON döndüren ücretsiz, herkese açık bir servis. Yenilersen başka bir söz gelir.
        2. `Quote.swift` oluştur: ihtiyacın olan iki alanlı bir `Codable` tip. Listelemediğin JSON alanları (`id` gibi) yok sayılır.
        3. `QuoteService.swift` oluştur. Ağ çağrısını parametre (`fetch`) olarak alır, varsayılanı gerçek `URLSession`'dır; böylece testler sahte bir tane verebilir. Çözmeden (decode) önce durum kodunu kontrol eder.
        4. `QuoteCard.swift` oluştur ve `ContentView.swift` içinde listenin en üstüne koy. Kart bir yükleniyor göstergesi, sözü ya da yeniden dene düğmesini gösterir.
        5. Çalıştır. Mac'te Wi-Fi'ı kapat, uygulamayı yeniden başlat ve yeniden dene düğmesini gör. Commit'le: `git add .` ve `git commit -m "Load a daily quote"`.
    code:
      - file: Habits/Quote.swift
        lang: swift
        text: |
          import Foundation

          nonisolated struct Quote: Codable, Equatable, Sendable {
              let quote: String
              let author: String
          }
      - file: Habits/QuoteService.swift
        lang: swift
        text: |
          import Foundation

          nonisolated enum QuoteError: Error, Equatable {
              case notHTTP
              case badStatus(Int)
          }

          nonisolated struct QuoteService: Sendable {
              typealias Fetch = @Sendable (URL) async throws -> (Data, URLResponse)

              var fetch: Fetch = { url in
                  try await URLSession.shared.data(from: url)
              }
              var url = URL(string: "https://dummyjson.com/quotes/random")!

              func randomQuote() async throws -> Quote {
                  let (data, response) = try await fetch(url)
                  guard let http = response as? HTTPURLResponse else {
                      throw QuoteError.notHTTP
                  }
                  guard (200..<300).contains(http.statusCode) else {
                      throw QuoteError.badStatus(http.statusCode)
                  }
                  return try JSONDecoder().decode(Quote.self, from: data)
              }
          }
      - file: Habits/QuoteCard.swift
        lang: swift
        text: |
          import SwiftUI

          struct QuoteCard: View {
              enum LoadState {
                  case loading
                  case loaded(Quote)
                  case failed
              }

              var service = QuoteService()
              @State private var state: LoadState = .loading

              var body: some View {
                  Group {
                      switch state {
                      case .loading:
                          ProgressView()
                              .frame(maxWidth: .infinity)
                      case .loaded(let quote):
                          VStack(alignment: .leading, spacing: 4) {
                              Text(quote.quote)
                                  .italic()
                              Text(quote.author)
                                  .font(.footnote)
                                  .foregroundStyle(.secondary)
                          }
                      case .failed:
                          Button("Could not load a quote. Try again", systemImage: "arrow.clockwise") {
                              Task { await load() }
                          }
                      }
                  }
                  .task { await load() }
              }

              private func load() async {
                  state = .loading
                  do {
                      state = .loaded(try await service.randomQuote())
                  } catch {
                      if Task.isCancelled { return }
                      state = .failed
                  }
              }
          }

          #Preview {
              List {
                  Section { QuoteCard() }
              }
          }
      - file: Habits/ContentView.swift
        lang: swift
        text: |
          import SwiftData
          import SwiftUI

          struct ContentView: View {
              enum Sheet: Identifiable {
                  case add, settings
                  var id: Self { self }
              }

              @Environment(\.modelContext) private var modelContext
              @Query(sort: \Habit.createdAt) private var habits: [Habit]
              @State private var sheet: Sheet?

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              QuoteCard()
                          }
                          Section {
                              ForEach(habits) { habit in
                                  NavigationLink(value: habit) {
                                      HabitRow(habit: habit)
                                  }
                                  .swipeActions(edge: .leading) {
                                      Button(habit.isDone() ? "Undo" : "Done", systemImage: "checkmark") {
                                          habit.toggle()
                                      }
                                      .tint(.green)
                                  }
                              }
                              .onDelete(perform: delete)
                          }
                      }
                      .overlay {
                          if habits.isEmpty {
                              ContentUnavailableView(
                                  "No habits yet",
                                  systemImage: "checklist",
                                  description: Text("Tap + to add your first one.")
                              )
                          }
                      }
                      .navigationTitle("Today")
                      .navigationDestination(for: Habit.self) { habit in
                          HabitDetailView(habit: habit)
                      }
                      .toolbar {
                          ToolbarItem(placement: .topBarLeading) {
                              Button("Settings", systemImage: "gearshape") {
                                  sheet = .settings
                              }
                          }
                          ToolbarItem(placement: .topBarTrailing) {
                              Button("Add habit", systemImage: "plus") {
                                  sheet = .add
                              }
                          }
                      }
                      .sheet(item: $sheet) { sheet in
                          switch sheet {
                          case .add: AddHabitView()
                          case .settings: SettingsView()
                          }
                      }
                  }
              }

              private func delete(at offsets: IndexSet) {
                  for index in offsets {
                      modelContext.delete(habits[index])
                  }
              }
          }

          #Preview {
              ContentView()
                  .modelContainer(for: Habit.self, inMemory: true)
          }
    mistakes:
      - problem:
          en: "The decoding fails with \"keyNotFound\" or \"typeMismatch\"."
          tr: "Çözme \"keyNotFound\" ya da \"typeMismatch\" ile başarısız oluyor."
        fix:
          en: "The Swift property names and types must match the JSON. Open the address in a browser and compare. Mark a field optional (`String?`) if the server may leave it out."
          tr: "Swift özellik adları ve tipleri JSON ile eşleşmeli. Adresi tarayıcıda aç ve karşılaştır. Sunucu bir alanı bırakabiliyorsa o alanı optional yap (`String?`)."
      - problem:
          en: "Calling an `async` function without `await`, or from a place that is not async."
          tr: "Bir `async` fonksiyonu `await` olmadan ya da async olmayan bir yerden çağırmak."
        fix:
          en: "Write `try await`. Inside a button action use `Task { await load() }`, and for work that starts when a view appears use `.task { }`."
          tr: "`try await` yaz. Düğme eyleminin içinde `Task { await load() }`, view görününce başlayan iş için `.task { }` kullan."
      - problem:
          en: "Treating every response as success. A 404 or 500 page then fails in confusing ways."
          tr: "Her yanıtı başarılı saymak. O zaman 404 ya da 500 sayfası kafa karıştıran şekillerde patlar."
        fix:
          en: "Always check `statusCode` (200 to 299 is success) before decoding, as `randomQuote()` does."
          tr: "Çözmeden önce her zaman `statusCode`'u kontrol et (200 ile 299 başarıdır), `randomQuote()`'ın yaptığı gibi."
    quiz:
      - q:
          en: "Why does `QuoteService` take `fetch` as a parameter?"
          tr: "`QuoteService` neden `fetch`'i parametre olarak alıyor?"
        options:
          en: [To make requests slower, So tests can give it a fake response without the internet, Because URLSession cannot be used directly]
          tr: [İstekleri yavaşlatmak için, Testler internet olmadan sahte bir yanıt verebilsin diye, Çünkü URLSession doğrudan kullanılamaz]
        answer: 1
        why:
          en: "A replaceable network call lets a test return fixed data, so tests are fast and never depend on a real server."
          tr: "Değiştirilebilir bir ağ çağrısı testin sabit veri döndürmesini sağlar; testler hızlı olur ve gerçek bir sunucuya bağlı kalmaz."
