id: swift-ios
title:
  en: "Swift and SwiftUI (iPhone)"
  tr: "Swift ve SwiftUI (iPhone)"
summary:
  en: "From an empty Mac to your own iPhone app. You build a habit tracker in Swift and SwiftUI step by step, save its data with SwiftData, test it, run it on your own iPhone and learn how TestFlight and the App Store work."
  tr: "Boş bir Mac'ten kendi iPhone uygulamana. Swift ve SwiftUI ile adım adım bir alışkanlık takip uygulaması yazarsın, verisini SwiftData ile kaydedersin, test edersin, kendi iPhone'unda çalıştırırsın ve TestFlight ile App Store'un nasıl işlediğini öğrenirsin."
teacher: mobile
project:
  en: 'A habit tracker for iPhone: add habits, tick them off each day, see your streak, keep everything on the phone with SwiftData, load a daily quote from a public API, store a token in the Keychain, with tests, an app icon, a build on your own iPhone and a plan for TestFlight, the App Store and crash reports.'
  tr: 'iPhone için bir alışkanlık takip uygulaması: alışkanlık ekleme, her gün işaretleme, seri (streak) görme, her şeyi SwiftData ile telefonda tutma, herkese açık bir API''den günlük söz yükleme, bir token''ı Keychain''de saklama; testleri, uygulama ikonu, kendi iPhone''unda çalışan bir build ve TestFlight, App Store ile çökme raporları için bir plan da var.'
detect:
  files: [Package.swift]
version: "27"
latest: eol:ios
checked: 2026-10
sheets: [git]
steps:
  - id: setup
    stage: setup
    title:
      en: "Get a Mac, Xcode and Swift ready"
      tr: "Mac'ini, Xcode'u ve Swift'i hazırlama"
    minutes: 90
    why:
      en: "iPhone apps are built with Xcode, Apple's development tool, and Xcode only runs on a Mac. There is no official way to build or run an iPhone app on Windows or Linux. Knowing this on day one saves you a lot of frustration."
      tr: "iPhone uygulamaları Apple'ın geliştirme aracı Xcode ile hazırlanır ve Xcode sadece Mac'te çalışır. Windows ya da Linux'ta bir iPhone uygulaması derlemenin ya da çalıştırmanın resmi bir yolu yok. Bunu ilk günden bilmek seni çok uğraştan kurtarır."
    learn:
      en: |
        - What you need and what you do not: a Mac, Xcode (free), an Apple Account (free), an iPhone (optional at first)
        - What Swift is (the language) and what SwiftUI is (the toolkit that draws screens)
        - How to check from the terminal that Xcode and Swift are installed
      tr: |
        - Neye ihtiyacın olduğu, neye olmadığı: bir Mac, Xcode (ücretsiz), bir Apple Account (ücretsiz), bir iPhone (başta isteğe bağlı)
        - Swift'in (dil) ve SwiftUI'ın (ekranları çizen araç seti) ne olduğu
        - Xcode ve Swift'in kurulu olduğunu terminalden kontrol etmek
    do:
      en: |
        1. **Be honest about the hardware.** You need a Mac. Xcode 27 needs an Apple silicon Mac running macOS Tahoe 26.6 or later (see the Xcode 27 release notes). If you have no Mac, you can still learn the Swift language on Linux or Windows with the toolchain from swift.org, but you cannot build the iPhone app until you have a Mac (borrow one, or buy a used Mac mini). Cloud Mac rental services exist, but they cost money, so this roadmap does not use them.
        2. Open the **App Store** app on your Mac, search for **Xcode** and install it. It is free and the download is large, so use a good connection.
        3. Open Xcode once. Accept the license and let it install the extra components it asks for. When it offers the **iOS** platform (the Simulator), install it.
        4. Create a free **Apple Account** if you do not have one. You will sign in to Xcode with it later (*Xcode → Settings → Apple Accounts*).
        5. Open the Terminal app and run the commands below. `xcodebuild -version` should print Xcode 27 and `swift --version` should print Swift 6.4.
      tr: |
        1. **Donanım konusunda dürüst olalım.** Bir Mac'e ihtiyacın var. Xcode 27, macOS Tahoe 26.6 ya da daha yenisini çalıştıran Apple silicon bir Mac ister (Xcode 27 sürüm notlarına bak). Mac'in yoksa Swift dilini Linux veya Windows'ta swift.org'daki araç setiyle öğrenebilirsin ama bir Mac bulana kadar iPhone uygulamasını derleyemezsin (birinden ödünç al ya da ikinci el bir Mac mini al). Bulutta Mac kiralayan servisler var ama paralıdır, bu yüzden bu yol haritası onları kullanmaz.
        2. Mac'inde **App Store** uygulamasını aç, **Xcode**'u ara ve kur. Ücretsiz ama indirme büyük, iyi bir bağlantı kullan.
        3. Xcode'u bir kez aç. Lisansı kabul et, istediği ek bileşenleri kurmasına izin ver. **iOS** platformunu (Simulator) önerdiğinde onu da kur.
        4. Yoksa ücretsiz bir **Apple Account** oluştur. Xcode'a onunla giriş yapacaksın (*Xcode → Settings → Apple Accounts*).
        5. Terminal uygulamasını aç ve aşağıdaki komutları çalıştır. `xcodebuild -version` Xcode 27, `swift --version` Swift 6.4 yazmalı.
    code:
      - file: terminal
        lang: sh
        text: |
          xcode-select -p
          xcodebuild -version
          swift --version
    mistakes:
      - problem:
          en: "Xcode will not open or install because macOS is too old."
          tr: "macOS çok eski olduğu için Xcode açılmıyor ya da kurulmuyor."
        fix:
          en: "Update macOS first (System Settings → General → Software Update). The macOS version Xcode needs is in its release notes."
          tr: "Önce macOS'u güncelle (System Settings → General → Software Update). Xcode'un istediği macOS sürümü sürüm notlarında yazar."
      - problem:
          en: "`xcode-select -p` prints `/Library/Developer/CommandLineTools` and `xcodebuild` complains."
          tr: "`xcode-select -p` `/Library/Developer/CommandLineTools` yazıyor ve `xcodebuild` şikâyet ediyor."
        fix:
          en: "Only the small command line tools are selected, not the full Xcode. Run `sudo xcode-select -s /Applications/Xcode.app` and check again."
          tr: "Tam Xcode değil, sadece küçük komut satırı araçları seçili. `sudo xcode-select -s /Applications/Xcode.app` çalıştır ve tekrar kontrol et."
      - problem:
          en: "The install stops because the disk is full."
          tr: "Disk dolu olduğu için kurulum duruyor."
        fix:
          en: "Xcode and the Simulator need tens of gigabytes. Free space in System Settings → General → Storage, then try again."
          tr: "Xcode ve Simulator onlarca gigabayt ister. System Settings → General → Storage'dan yer aç, sonra tekrar dene."
    quiz:
      - q:
          en: "Can you build an iPhone app with Xcode on a Windows PC?"
          tr: "Bir Windows bilgisayarda Xcode ile iPhone uygulaması derleyebilir misin?"
        options:
          en: [Yes if you install the Windows version, No because Xcode only runs on a Mac, Yes but only for free apps]
          tr: [Evet Windows sürümünü kurarsan, Hayır çünkü Xcode sadece Mac'te çalışır, Evet ama sadece ücretsiz uygulamalar için]
        answer: 1
        why:
          en: "Xcode is a Mac app and there is no Windows version. You need a Mac to build and run iPhone apps."
          tr: "Xcode bir Mac uygulaması ve Windows sürümü yok. iPhone uygulaması derlemek ve çalıştırmak için bir Mac gerekir."
    sources:
      - title: Xcode 27 release notes
        url: https://developer.apple.com/documentation/xcode-release-notes/xcode-27-release-notes
      - title: Xcode (Apple Developer)
        url: https://developer.apple.com/xcode/
      - title: Install Swift (swift.org)
        url: https://www.swift.org/install/

  - id: first-app
    stage: first-code
    title:
      en: "Create your first app and run it in the Simulator"
      tr: "İlk uygulamanı oluşturma ve Simulator'da çalıştırma"
    minutes: 40
    needs: [setup]
    why:
      en: "An iPhone app needs a project with a few files, a name that identifies it and a place to run. Xcode creates the project in seconds, and the Simulator is a virtual iPhone on your Mac, so you see every change without a real phone."
      tr: "Bir iPhone uygulaması için birkaç dosyalı bir proje, onu tanıtan bir ad ve çalışacağı bir yer gerekir. Xcode projeyi saniyeler içinde oluşturur, Simulator da Mac'indeki sanal bir iPhone'dur; gerçek telefon olmadan her değişikliği görürsün."
    learn:
      en: |
        - What a new SwiftUI project contains: `HabitsApp.swift`, `ContentView.swift`, `Assets.xcassets`
        - What `@main`, `App`, `WindowGroup` and `View` mean in a few words
        - Run (Cmd+R) and the preview canvas, and how they differ
      tr: |
        - Yeni bir SwiftUI projesinde neler olduğu: `HabitsApp.swift`, `ContentView.swift`, `Assets.xcassets`
        - `@main`, `App`, `WindowGroup` ve `View`'ün kısaca ne demek olduğu
        - Çalıştırma (Cmd+R) ile önizleme kanvasının farkı
    do:
      en: |
        1. In Xcode choose *File → New → Project*, then **iOS → App** and click Next.
        2. Product Name: `Habits`. Interface: **SwiftUI**. Language: **Swift**. Storage: **None** (we add SwiftData by hand later so you see every line). Keep **Include Tests** on and, if Xcode asks for the testing system, choose **Swift Testing**.
        3. Organization Identifier: your own reverse domain, for example `com.yourname`. Xcode builds the **bundle identifier** (the app's unique name, `com.yourname.Habits`) from it. Save the project in your projects folder and tick *Create Git repository*.
        4. At the top of the window pick an iPhone Simulator as the run destination and press **Cmd+R** (or the Run button). The first start of the Simulator can take a few minutes.
        5. Replace `ContentView.swift` with the code below. Open the preview canvas (*Editor → Canvas*) and press **Resume** if it is paused.
        6. Stop the app (Cmd+.) and commit: in the terminal, inside the project folder, run `git add .` and `git commit -m "Create the Habits app"`. If you did not tick the Git box, run `git init` first and add the `.gitignore` below.
      tr: |
        1. Xcode'da *File → New → Project* seç, sonra **iOS → App** ve Next'e bas.
        2. Product Name: `Habits`. Interface: **SwiftUI**. Language: **Swift**. Storage: **None** (SwiftData'yı sonra elle ekleyeceğiz ki her satırı gör). **Include Tests** açık kalsın; Xcode test sistemini sorarsa **Swift Testing**'i seç.
        3. Organization Identifier: kendi ters alan adın, örneğin `com.senin-adin`. Xcode **bundle identifier**'ı (uygulamanın benzersiz adı, `com.senin-adin.Habits`) bundan üretir. Projeyi proje klasörüne kaydet ve *Create Git repository* kutusunu işaretle.
        4. Pencerenin üstünde çalıştırma hedefi olarak bir iPhone Simulator seç ve **Cmd+R**'ye (ya da Run düğmesine) bas. Simulator'ın ilk açılışı birkaç dakika sürebilir.
        5. `ContentView.swift` içeriğini aşağıdaki kodla değiştir. Önizleme kanvasını aç (*Editor → Canvas*), durmuşsa **Resume**'a bas.
        6. Uygulamayı durdur (Cmd+.) ve commit'le: terminalde proje klasöründeyken `git add .` ve `git commit -m "Create the Habits app"` çalıştır. Git kutusunu işaretlemediysen önce `git init` yap ve aşağıdaki `.gitignore`'u ekle.
    code:
      - file: Habits/HabitsApp.swift
        lang: swift
        text: |
          import SwiftUI

          @main
          struct HabitsApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
      - file: Habits/ContentView.swift
        lang: swift
        text: |
          import SwiftUI

          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 12) {
                      Image(systemName: "checkmark.circle")
                          .font(.system(size: 48))
                          .foregroundStyle(.tint)
                      Text("Hello, Habits")
                          .font(.title)
                  }
                  .padding()
              }
          }

          #Preview {
              ContentView()
          }
      - file: .gitignore
        lang: text
        text: |
          .DS_Store
          xcuserdata/
          DerivedData/
          build/
    mistakes:
      - problem:
          en: "\"No simulator runtimes\" or the iOS platform is missing."
          tr: "\"No simulator runtimes\" hatası ya da iOS platformu eksik."
        fix:
          en: "Open *Xcode → Settings → Components* and download the iOS platform. It is a big download."
          tr: "*Xcode → Settings → Components*'i aç ve iOS platformunu indir. İndirme büyüktür."
      - problem:
          en: "The preview canvas is blank or says it is paused."
          tr: "Önizleme kanvası boş ya da durdu yazıyor."
        fix:
          en: "Open *Editor → Canvas* and press Resume. If it still fails, read the error in the canvas, then run the app with Cmd+R to see the full build error."
          tr: "*Editor → Canvas*'ı aç ve Resume'a bas. Yine olmazsa kanvastaki hatayı oku, sonra tam derleme hatasını görmek için Cmd+R ile çalıştır."
      - problem:
          en: "Typing the bundle identifier of someone else's app, or a name with spaces."
          tr: "Başkasının uygulamasının bundle identifier'ını ya da boşluklu bir ad yazmak."
        fix:
          en: "Use your own reverse domain such as `com.yourname.Habits`. It must be unique, because Apple uses it to tell apps apart."
          tr: "`com.senin-adin.Habits` gibi kendi ters alan adını kullan. Benzersiz olmalı, çünkü Apple uygulamaları bununla ayırt eder."
    quiz:
      - q:
          en: "What does the bundle identifier do?"
          tr: "Bundle identifier ne işe yarar?"
        options:
          en: [It is the name shown under the icon, It uniquely identifies your app for Apple and the system, It is your Apple password]
          tr: [İkonun altında görünen addır, Uygulamanı Apple ve sistem için benzersiz olarak tanımlar, Apple şifrendir]
        answer: 1
        why:
          en: "The name under the icon is the display name. The bundle identifier is the unique ID used for signing, the App Store and the Keychain."
          tr: "İkonun altındaki ad görünen addır. Bundle identifier imzalama, App Store ve Keychain için kullanılan benzersiz kimliktir."
    sources:
      - title: Creating an Xcode project for an app
        url: https://developer.apple.com/documentation/xcode/creating-an-xcode-project-for-an-app
      - title: Running your app on simulated or physical devices
        url: https://developer.apple.com/documentation/xcode/running-your-app-on-simulated-or-physical-devices

  - id: playground
    stage: first-code
    title:
      en: "Learn Swift basics in a playground"
      tr: "Swift'in temellerini bir playground'da öğrenme"
    minutes: 40
    needs: [first-app]
    why:
      en: "SwiftUI is written in Swift, so a few Swift ideas make everything after this easier: constants and variables, arrays, optionals, structs and enums. A playground runs your code line by line and shows each value right next to it, so you learn by trying."
      tr: "SwiftUI Swift ile yazılır; bu yüzden birkaç Swift fikri bundan sonrasını kolaylaştırır: sabitler ve değişkenler, dizi (array), optional, struct ve enum. Playground kodunu satır satır çalıştırır ve her değeri hemen yanında gösterir; denerek öğrenirsin."
    learn:
      en: |
        - `let` (constant) and `var` (variable), and string interpolation `"\(value)"`
        - Arrays and closures: `append`, `filter`, `map`
        - Optionals: a value that may be missing (`Int?`), `if let` and `??`
        - `struct` with a function, and `enum` with `switch`
      tr: |
        - `let` (sabit) ve `var` (değişken), string interpolation `"\(value)"`
        - Dizi (array) ve closure: `append`, `filter`, `map`
        - Optional: eksik olabilen değer (`Int?`), `if let` ve `??`
        - Fonksiyonlu `struct` ve `switch` ile `enum`
    do:
      en: |
        1. In Xcode add a new Swift file to the project (*File → New → File from Template*, **Swift File**) and call it `Basics.swift`.
        2. Replace its content with the code below. `#Playground` is a macro: Xcode runs the code inside it and shows the results in the canvas.
        3. Open the canvas (*Editor → Canvas*) and press **Resume**. Look at the value shown next to each line.
        4. Change numbers and words and watch the results change. Try to predict each result before you look: `message` is `"Habits: 4 days in a row"`, `longNames` has three items, `second` is `0`.
        5. This file is only for practice. When you are done, delete `Basics.swift` (*Move to Trash*) so it does not stay in your app. Keep the ideas.
      tr: |
        1. Xcode'da projeye yeni bir Swift dosyası ekle (*File → New → File from Template*, **Swift File**) ve adını `Basics.swift` yap.
        2. İçeriğini aşağıdaki kodla değiştir. `#Playground` bir makrodur: Xcode içindeki kodu çalıştırır ve sonuçları kanvasta gösterir.
        3. Kanvası aç (*Editor → Canvas*) ve **Resume**'a bas. Her satırın yanında gösterilen değere bak.
        4. Sayıları ve kelimeleri değiştir, sonuçların nasıl değiştiğini izle. Bakmadan önce her sonucu tahmin etmeyi dene: `message` `"Habits: 4 days in a row"`, `longNames` üç öğeli, `second` `0` olur.
        5. Bu dosya sadece alıştırma için. İşin bitince `Basics.swift`'i sil (*Move to Trash*) ki uygulamanda kalmasın. Fikirler kalsın.
    code:
      - file: Habits/Basics.swift
        lang: swift
        text: |
          import Playgrounds

          #Playground {
              // let is a constant, var can change
              let appName = "Habits"
              var streak = 3
              streak += 1
              let message = "\(appName): \(streak) days in a row"

              // Arrays and closures
              var habits = ["Drink water", "Read", "Walk"]
              habits.append("Stretch")
              let longNames = habits.filter { $0.count > 5 }
              let shouting = habits.map { $0.uppercased() }

              // Optionals: a value that may be missing
              let inputs = ["7", "seven"]
              let numbers = inputs.map { Int($0) }   // [7, nil]
              if let first = numbers[0] {
                  print("The first number is \(first)")
              }
              let second = numbers[1] ?? 0

              // A struct with a function
              struct Habit {
                  var name: String
                  var days: Int

                  func summary() -> String {
                      "\(name): \(days) days"
                  }
              }
              let read = Habit(name: "Read", days: 12)
              let text = read.summary()

              // An enum and a switch
              enum Mood { case great, ok, bad }
              let mood = Mood.ok
              switch mood {
              case .great: print("Keep going")
              case .ok: print("Do a little today")
              case .bad: print("Start with one minute")
              }
          }
    mistakes:
      - problem:
          en: "\"Cannot find '#Playground' in scope\" or the macro is not recognised."
          tr: "\"Cannot find '#Playground' in scope\" ya da makro tanınmıyor."
        fix:
          en: "Add `import Playgrounds` at the top of the file, as in the code above."
          tr: "Dosyanın başına yukarıdaki gibi `import Playgrounds` ekle."
      - problem:
          en: "\"Cannot assign to value: 'x' is a 'let' constant\"."
          tr: "\"Cannot assign to value: 'x' is a 'let' constant\" hatası."
        fix:
          en: "A `let` never changes. If the value must change, declare it with `var`."
          tr: "`let` hiç değişmez. Değer değişecekse `var` ile tanımla."
      - problem:
          en: "Using `!` to force an optional open and the app crashes when the value is `nil`."
          tr: "Optional'ı `!` ile zorla açmak ve değer `nil` olunca uygulamanın çökmesi."
        fix:
          en: "Prefer `if let` or `??` with a default. A `!` is a promise that the value is never `nil`, and Swift stops the program when the promise is broken."
          tr: "`if let` ya da varsayılan değerli `??` kullan. `!` değerin asla `nil` olmayacağına söz vermektir; söz bozulunca Swift programı durdurur."
    quiz:
      - q:
          en: "What is `numbers[1] ?? 0` when `numbers[1]` is `nil`?"
          tr: "`numbers[1]` `nil` iken `numbers[1] ?? 0` ne olur?"
        options:
          en: [It crashes, It is 0, It is nil]
          tr: [Çöker, 0 olur, nil olur]
        answer: 1
        why:
          en: "`??` gives the value on its right when the left side is `nil`, so the result is 0 and is no longer an optional."
          tr: "`??` soldaki `nil` ise sağdaki değeri verir; sonuç 0 olur ve artık optional değildir."
    sources:
      - title: Running code snippets using the Playground macro
        url: https://developer.apple.com/documentation/xcode/running-code-snippets-using-the-playground-macro
      - title: The Swift Programming Language - The Basics
        url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/thebasics/
      - title: The Swift Programming Language - Collection Types
        url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/collectiontypes/

  - id: views
    stage: basics
    title:
      en: "Build screens with SwiftUI views"
      tr: "SwiftUI view'leriyle ekran kurma"
    minutes: 45
    needs: [playground]
    why:
      en: "In SwiftUI a screen is a small description of what you want, built from simple views like Text, Image and Button that you put inside stacks. Learning how views, stacks and modifiers fit together is most of SwiftUI."
      tr: "SwiftUI'da ekran, ne istediğinin küçük bir tarifidir; Text, Image, Button gibi basit view'lerin yığınların (stack) içine konmasıyla kurulur. View, stack ve modifier'ların nasıl bir araya geldiğini öğrenmek SwiftUI'ın büyük kısmıdır."
    learn:
      en: |
        - `VStack`, `HStack`, `Spacer`: vertical and horizontal layout
        - `Text`, `Image(systemName:)` (SF Symbols, Apple's free icon set), `Button`
        - Modifiers such as `.font`, `.padding`, `.background`, and why their order matters
        - Splitting a big view into small views (`HabitRow`)
      tr: |
        - `VStack`, `HStack`, `Spacer`: dikey ve yatay yerleşim
        - `Text`, `Image(systemName:)` (SF Symbols, Apple'ın ücretsiz ikon seti), `Button`
        - `.font`, `.padding`, `.background` gibi modifier'lar ve sıralarının neden önemli olduğu
        - Büyük bir view'ü küçük view'lere bölmek (`HabitRow`)
    do:
      en: |
        1. Create `HabitRow.swift` (*File → New → File from Template → SwiftUI View*) and replace it with the first code block. It draws one habit: an icon, a name and a streak line.
        2. Replace `ContentView.swift` with the second code block. It shows a title and two rows with fixed data. The data is fake for now.
        3. Watch the canvas. Then change `.padding()` to `.padding(.horizontal)` and see what moves.
        4. Move `.background(...)` above `.padding(...)` on the icon and see why the order changes the look: each modifier wraps the view it is attached to.
        5. Commit: `git add .` and `git commit -m "Draw the habit rows"`.
      tr: |
        1. `HabitRow.swift` oluştur (*File → New → File from Template → SwiftUI View*) ve içeriğini ilk kod bloğuyla değiştir. Bir alışkanlığı çizer: ikon, ad ve seri satırı.
        2. `ContentView.swift` içeriğini ikinci kod bloğuyla değiştir. Bir başlık ve sabit veriyle iki satır gösterir. Veri şimdilik sahte.
        3. Kanvasa bak. Sonra `.padding()` yerine `.padding(.horizontal)` yaz ve neyin kaydığını gör.
        4. İkonda `.background(...)` satırını `.padding(...)` satırının üstüne taşı ve sıranın görünümü neden değiştirdiğini gör: her modifier bağlı olduğu view'ü sarar.
        5. Commit'le: `git add .` ve `git commit -m "Draw the habit rows"`.
    code:
      - file: Habits/HabitRow.swift
        lang: swift
        text: |
          import SwiftUI

          struct HabitRow: View {
              let name: String
              let symbol: String
              let streak: Int

              var body: some View {
                  HStack(spacing: 12) {
                      Image(systemName: symbol)
                          .font(.title2)
                          .frame(width: 44, height: 44)
                          .background(.tint.opacity(0.15), in: Circle())

                      VStack(alignment: .leading) {
                          Text(name)
                              .font(.headline)
                          Text("\(streak) days in a row")
                              .font(.subheadline)
                              .foregroundStyle(.secondary)
                      }

                      Spacer()
                  }
              }
          }

          #Preview {
              HabitRow(name: "Read", symbol: "book.fill", streak: 12)
                  .padding()
          }
      - file: Habits/ContentView.swift
        lang: swift
        text: |
          import SwiftUI

          struct ContentView: View {
              var body: some View {
                  VStack(alignment: .leading, spacing: 16) {
                      Text("Today")
                          .font(.largeTitle.bold())
                      HabitRow(name: "Drink water", symbol: "drop.fill", streak: 4)
                      HabitRow(name: "Read", symbol: "book.fill", streak: 12)
                      Spacer()
                  }
                  .padding()
              }
          }

          #Preview {
              ContentView()
          }
    mistakes:
      - problem:
          en: "The modifiers seem to do nothing, or the look is wrong."
          tr: "Modifier'lar hiçbir şey yapmıyor gibi ya da görünüm yanlış."
        fix:
          en: "Order matters. `.padding().background(.red)` colours the padding too, `.background(.red).padding()` does not. Read modifiers from top to bottom."
          tr: "Sıra önemli. `.padding().background(.red)` boşluğu da boyar, `.background(.red).padding()` boyamaz. Modifier'ları yukarıdan aşağı oku."
      - problem:
          en: "\"Missing argument for parameter\" when using HabitRow."
          tr: "HabitRow kullanırken \"Missing argument for parameter\" hatası."
        fix:
          en: "Each `let` without a value is a required argument, in the same order as declared: `HabitRow(name:symbol:streak:)`."
          tr: "Değersiz her `let` zorunlu bir argümandır ve tanımlandığı sırayla yazılır: `HabitRow(name:symbol:streak:)`."
      - problem:
          en: "A symbol name shows nothing."
          tr: "Bir sembol adı hiçbir şey göstermiyor."
        fix:
          en: "SF Symbol names must be exact. Browse them in the free SF Symbols app from Apple and copy the name."
          tr: "SF Symbol adları tam doğru olmalı. Apple'ın ücretsiz SF Symbols uygulamasından göz at ve adı kopyala."
    quiz:
      - q:
          en: "Which code puts the background behind the padding too?"
          tr: "Hangi kod arka planı boşluğun arkasına da koyar?"
        options:
          en: [".background(.red).padding()", ".padding().background(.red)", "Both give the same result"]
          tr: [".background(.red).padding()", ".padding().background(.red)", "İkisi de aynı sonucu verir"]
        answer: 1
        why:
          en: "`.padding()` first makes the view bigger, then `.background` colours that bigger area."
          tr: "Önce `.padding()` view'ü büyütür, sonra `.background` o büyük alanı boyar."
    sources:
      - title: SwiftUI - View fundamentals
        url: https://developer.apple.com/documentation/swiftui/view-fundamentals
      - title: SwiftUI - Layout fundamentals
        url: https://developer.apple.com/documentation/swiftui/layout-fundamentals
      - title: SF Symbols
        url: https://developer.apple.com/sf-symbols/

  - id: state
    stage: basics
    title:
      en: "Make it interactive with @State and @Observable"
      tr: "@State ve @Observable ile etkileşimli yapma"
    minutes: 60
    needs: [views]
    why:
      en: "A SwiftUI view is a function of your data: when the data changes, SwiftUI draws the view again. You must tell SwiftUI which data to watch. @State does this for a value that belongs to one view, and an @Observable class does it for a model that many views share."
      tr: "SwiftUI view'ü verinin bir fonksiyonudur: veri değişince SwiftUI view'ü yeniden çizer. Hangi veriyi izleyeceğini SwiftUI'a söylemelisin. @State bunu tek bir view'e ait değer için, @Observable bir sınıf ise birçok view'ün paylaştığı model için yapar."
    learn:
      en: |
        - `@State`: a value owned by a view, changed with `count += 1`
        - `@Observable`: a class whose changed properties update the views that read them (Swift Observation, iOS 17 and later)
        - Why `@State private var store = HabitStore()` is how a view owns an observable model
        - Pure logic in its own type (`Streak`), away from the views
      tr: |
        - `@State`: bir view'ün sahip olduğu değer, `count += 1` ile değişir
        - `@Observable`: değişen özellikleri, onları okuyan view'leri güncelleyen bir sınıf (Swift Observation, iOS 17 ve sonrası)
        - Bir view'ün gözlemlenebilir modele sahip olmasının neden `@State private var store = HabitStore()` olduğu
        - Saf mantığı view'lerden ayrı, kendi tipinde tutmak (`Streak`)
    do:
      en: |
        1. Try `@State` alone first: add `CounterDemo.swift` with the first code block, open its preview and tap the button. The number changes because `count` is `@State`. Delete the file when you are done.
        2. Create `Streak.swift`. It counts how many days in a row are done, ending today (or yesterday, if today is not done yet, so the streak does not drop to 0 in the morning). It is plain Swift, so it is easy to test later.
        3. Create `Habit.swift` (a struct) and `HabitStore.swift` (the `@Observable` class that holds the list and the toggle logic).
        4. Update `HabitRow.swift` so it takes a `Habit` and a closure to run when the check button is tapped, and replace `ContentView.swift` with the last block. `@State private var store` makes the view own the store.
        5. Run in the Simulator, tap the circles: the check mark and the streak change. Commit: `git add .` and `git commit -m "Track habits in memory"`.
      tr: |
        1. Önce `@State`'i tek başına dene: ilk kod bloğuyla `CounterDemo.swift` ekle, önizlemesini aç ve düğmeye bas. `count` `@State` olduğu için sayı değişir. İşin bitince dosyayı sil.
        2. `Streak.swift` oluştur. Arka arkaya kaç günün tamamlandığını sayar; bugünle (bugün henüz yapılmadıysa dünle) biter, böylece seri sabahları 0'a düşmez. Düz Swift olduğu için sonra test etmesi kolaydır.
        3. `Habit.swift` (bir struct) ve `HabitStore.swift` (listeyi ve işaretleme mantığını tutan `@Observable` sınıf) oluştur.
        4. `HabitRow.swift`'i bir `Habit` ve onay düğmesine basılınca çalışacak bir closure alacak şekilde güncelle, `ContentView.swift` içeriğini son blokla değiştir. `@State private var store` view'ün store'a sahip olmasını sağlar.
        5. Simulator'da çalıştır, dairelere bas: onay işareti ve seri değişir. Commit'le: `git add .` ve `git commit -m "Track habits in memory"`.
    code:
      - file: Habits/CounterDemo.swift
        lang: swift
        text: |
          import SwiftUI

          struct CounterDemo: View {
              @State private var count = 0

              var body: some View {
                  Button("Pressed \(count) times") {
                      count += 1
                  }
              }
          }

          #Preview {
              CounterDemo()
          }
      - file: Habits/Streak.swift
        lang: swift
        text: |
          import Foundation

          /// Counts the days in a row that are done.
          nonisolated enum Streak {
              /// The streak ends today, or yesterday if today is not done yet.
              static func current(
                  completedDays: [Date],
                  today: Date = .now,
                  calendar: Calendar = .current
              ) -> Int {
                  let days = Set(completedDays.map { calendar.startOfDay(for: $0) })
                  var day = calendar.startOfDay(for: today)

                  if !days.contains(day) {
                      guard let yesterday = calendar.date(byAdding: .day, value: -1, to: day) else { return 0 }
                      day = yesterday
                  }

                  var count = 0
                  while days.contains(day) {
                      count += 1
                      guard let previous = calendar.date(byAdding: .day, value: -1, to: day) else { break }
                      day = previous
                  }
                  return count
              }
          }
      - file: Habits/Habit.swift
        lang: swift
        text: |
          import Foundation

          struct Habit: Identifiable {
              let id = UUID()
              var name: String
              var symbol: String = "checkmark.circle"
              var completedDays: [Date] = []

              func isDone(on day: Date = .now, calendar: Calendar = .current) -> Bool {
                  completedDays.contains { calendar.isDate($0, inSameDayAs: day) }
              }

              var streak: Int {
                  Streak.current(completedDays: completedDays)
              }
          }
      - file: Habits/HabitStore.swift
        lang: swift
        text: |
          import Foundation
          import Observation

          @Observable
          final class HabitStore {
              var habits: [Habit] = [
                  Habit(name: "Drink water", symbol: "drop.fill"),
                  Habit(name: "Read", symbol: "book.fill"),
                  Habit(name: "Walk", symbol: "figure.walk"),
              ]

              func toggleToday(_ habit: Habit, calendar: Calendar = .current, now: Date = .now) {
                  guard let index = habits.firstIndex(where: { $0.id == habit.id }) else { return }
                  if habits[index].isDone(on: now, calendar: calendar) {
                      habits[index].completedDays.removeAll { calendar.isDate($0, inSameDayAs: now) }
                  } else {
                      habits[index].completedDays.append(calendar.startOfDay(for: now))
                  }
              }
          }
      - file: Habits/HabitRow.swift
        lang: swift
        text: |
          import SwiftUI

          struct HabitRow: View {
              let habit: Habit
              let onToggle: () -> Void

              var body: some View {
                  HStack(spacing: 12) {
                      Image(systemName: habit.symbol)
                          .font(.title2)
                          .frame(width: 44, height: 44)
                          .background(.tint.opacity(0.15), in: Circle())

                      VStack(alignment: .leading) {
                          Text(habit.name)
                              .font(.headline)
                          Text("\(habit.streak) days in a row")
                              .font(.subheadline)
                              .foregroundStyle(.secondary)
                      }

                      Spacer()

                      Button(action: onToggle) {
                          Image(systemName: habit.isDone() ? "checkmark.circle.fill" : "circle")
                              .font(.title)
                      }
                      .buttonStyle(.plain)
                  }
              }
          }

          #Preview {
              HabitRow(habit: Habit(name: "Read", symbol: "book.fill")) {}
                  .padding()
          }
      - file: Habits/ContentView.swift
        lang: swift
        text: |
          import SwiftUI

          struct ContentView: View {
              @State private var store = HabitStore()

              var body: some View {
                  VStack(alignment: .leading, spacing: 16) {
                      Text("Today")
                          .font(.largeTitle.bold())
                      ForEach(store.habits) { habit in
                          HabitRow(habit: habit) {
                              store.toggleToday(habit)
                          }
                      }
                      Spacer()
                  }
                  .padding()
              }
          }

          #Preview {
              ContentView()
          }
    mistakes:
      - problem:
          en: "Changing a normal `var` in a view does nothing on screen, or the compiler says \"Cannot assign to property: 'self' is immutable\"."
          tr: "Bir view'deki normal `var`'ı değiştirmek ekranda hiçbir şey yapmıyor ya da derleyici \"Cannot assign to property: 'self' is immutable\" diyor."
        fix:
          en: "A view is a struct and cannot change its own properties. Mark values that change over time as `@State`."
          tr: "View bir struct'tır ve kendi özelliklerini değiştiremez. Zamanla değişen değerleri `@State` olarak işaretle."
      - problem:
          en: "Writing `var store = HabitStore()` without `@State`: the store is created again and the data resets when the view is redrawn."
          tr: "`@State` olmadan `var store = HabitStore()` yazmak: view yeniden çizilince store yeniden oluşur ve veri sıfırlanır."
        fix:
          en: "When a view creates and owns an `@Observable` model, store it in `@State private var`. SwiftUI then keeps the same object between redraws."
          tr: "Bir view `@Observable` bir modeli oluşturup ona sahip oluyorsa `@State private var` içinde tut. SwiftUI de yeniden çizimler arasında aynı nesneyi korur."
      - problem:
          en: "Using the old `ObservableObject`, `@Published` and `@StateObject` from older tutorials."
          tr: "Eski eğitimlerdeki `ObservableObject`, `@Published` ve `@StateObject`'i kullanmak."
        fix:
          en: "They still work, but the current way is the `@Observable` macro with `@State`, `@Environment` and `@Bindable`. Apple has a migration guide if you meet old code."
          tr: "Hâlâ çalışırlar ama güncel yol `@Observable` makrosudur ve `@State`, `@Environment`, `@Bindable` ile kullanılır. Eski kodla karşılaşırsan Apple'ın bir geçiş rehberi var."
    quiz:
      - q:
          en: "Which one makes a view own an @Observable model?"
          tr: "Hangisi bir view'ün @Observable bir modele sahip olmasını sağlar?"
        options:
          en: ["var store = HabitStore()", "@State private var store = HabitStore()", "let store: HabitStore?"]
          tr: ["var store = HabitStore()", "@State private var store = HabitStore()", "let store: HabitStore?"]
        answer: 1
        why:
          en: "`@State` keeps the object alive between redraws, so the data is not lost."
          tr: "`@State` nesneyi yeniden çizimler arasında canlı tutar, böylece veri kaybolmaz."
    sources:
      - title: Managing model data in your app
        url: https://developer.apple.com/documentation/swiftui/managing-model-data-in-your-app
      - title: Migrating from the Observable Object protocol to the Observable macro
        url: https://developer.apple.com/documentation/swiftui/migrating-from-the-observable-object-protocol-to-the-observable-macro
      - title: State
        url: https://developer.apple.com/documentation/swiftui/state

  - id: navigation
    stage: first-project
    title:
      en: "Lists and navigation with NavigationStack"
      tr: "NavigationStack ile liste ve gezinme"
    minutes: 60
    needs: [state]
    why:
      en: "Real apps have a list and a detail screen behind each item. List draws rows efficiently, and NavigationStack gives you the title bar, the push to a new screen and the back button for free."
      tr: "Gerçek uygulamalarda bir liste ve her öğenin ardında bir ayrıntı ekranı olur. List satırları verimli çizer, NavigationStack başlık çubuğunu, yeni ekrana geçişi ve geri düğmesini hazır verir."
    learn:
      en: |
        - `List` and `ForEach` over identifiable data
        - `NavigationStack`, `NavigationLink(value:)` and `.navigationDestination(for:)`
        - Sharing the store with `.environment(store)` and reading it with `@Environment`
        - Swipe actions (`.swipeActions`)
      tr: |
        - Kimlikli (identifiable) veri üzerinde `List` ve `ForEach`
        - `NavigationStack`, `NavigationLink(value:)` ve `.navigationDestination(for:)`
        - Store'u `.environment(store)` ile paylaşmak ve `@Environment` ile okumak
        - Kaydırma eylemleri (`.swipeActions`)
    do:
      en: |
        1. Update `HabitsApp.swift`: the app now creates the store once and hands it to the whole view tree with `.environment(store)`.
        2. Replace `HabitRow.swift`. In a `List` the whole row is a link, so the row only shows the state (a check mark when done). Toggling moves to a swipe action and to the detail screen.
        3. Create `HabitDetailView.swift`. It receives the id of the habit and looks it up in the store, so it always shows the latest data.
        4. Replace `ContentView.swift` with the `NavigationStack` and the `List`.
        5. Run it. Tap a row to open the detail, press back, swipe a row to the right to mark it done. Commit: `git add .` and `git commit -m "Add the list and the detail screen"`.
      tr: |
        1. `HabitsApp.swift`'i güncelle: uygulama artık store'u bir kez oluşturur ve `.environment(store)` ile tüm view ağacına verir.
        2. `HabitRow.swift`'i değiştir. `List` içinde satırın tamamı bir bağlantıdır; bu yüzden satır sadece durumu gösterir (yapıldıysa onay işareti). İşaretleme kaydırma eylemine ve ayrıntı ekranına taşınır.
        3. `HabitDetailView.swift` oluştur. Alışkanlığın id'sini alır ve store'dan bulur; böylece her zaman en güncel veriyi gösterir.
        4. `ContentView.swift` içeriğini `NavigationStack` ve `List` ile değiştir.
        5. Çalıştır. Bir satıra dokunup ayrıntıyı aç, geri bas, bir satırı sağa kaydırıp yapıldı olarak işaretle. Commit'le: `git add .` ve `git commit -m "Add the list and the detail screen"`.
    code:
      - file: Habits/HabitsApp.swift
        lang: swift
        text: |
          import SwiftUI

          @main
          struct HabitsApp: App {
              @State private var store = HabitStore()

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environment(store)
                  }
              }
          }
      - file: Habits/HabitRow.swift
        lang: swift
        text: |
          import SwiftUI

          struct HabitRow: View {
              let habit: Habit

              var body: some View {
                  HStack(spacing: 12) {
                      Image(systemName: habit.symbol)
                          .font(.title2)
                          .frame(width: 44, height: 44)
                          .background(.tint.opacity(0.15), in: Circle())

                      VStack(alignment: .leading) {
                          Text(habit.name)
                              .font(.headline)
                          Text("\(habit.streak) days in a row")
                              .font(.subheadline)
                              .foregroundStyle(.secondary)
                      }

                      Spacer()

                      if habit.isDone() {
                          Image(systemName: "checkmark.circle.fill")
                              .foregroundStyle(.green)
                      }
                  }
              }
          }

          #Preview {
              HabitRow(habit: Habit(name: "Read", symbol: "book.fill"))
                  .padding()
          }
      - file: Habits/HabitDetailView.swift
        lang: swift
        text: |
          import SwiftUI

          struct HabitDetailView: View {
              @Environment(HabitStore.self) private var store
              let habitID: Habit.ID

              var body: some View {
                  if let habit = store.habits.first(where: { $0.id == habitID }) {
                      VStack(spacing: 24) {
                          Image(systemName: habit.symbol)
                              .font(.system(size: 64))
                              .foregroundStyle(.tint)
                          Text("\(habit.streak)")
                              .font(.system(size: 72, weight: .bold, design: .rounded))
                          Text("days in a row")
                              .foregroundStyle(.secondary)
                          Button(habit.isDone() ? "Undo today" : "Done for today") {
                              store.toggleToday(habit)
                          }
                          .buttonStyle(.borderedProminent)
                          .controlSize(.large)
                      }
                      .navigationTitle(habit.name)
                      .navigationBarTitleDisplayMode(.inline)
                  } else {
                      ContentUnavailableView("Habit not found", systemImage: "questionmark.circle")
                  }
              }
          }
      - file: Habits/ContentView.swift
        lang: swift
        text: |
          import SwiftUI

          struct ContentView: View {
              @Environment(HabitStore.self) private var store

              var body: some View {
                  NavigationStack {
                      List {
                          ForEach(store.habits) { habit in
                              NavigationLink(value: habit.id) {
                                  HabitRow(habit: habit)
                              }
                              .swipeActions(edge: .leading) {
                                  Button(habit.isDone() ? "Undo" : "Done", systemImage: "checkmark") {
                                      store.toggleToday(habit)
                                  }
                                  .tint(.green)
                              }
                          }
                      }
                      .navigationTitle("Today")
                      .navigationDestination(for: Habit.ID.self) { id in
                          HabitDetailView(habitID: id)
                      }
                  }
              }
          }

          #Preview {
              ContentView()
                  .environment(HabitStore())
          }
    mistakes:
      - problem:
          en: "A crash that says no `Observable` object of type HabitStore was found in the environment."
          tr: "Ortamda HabitStore tipinde bir `Observable` nesne bulunamadığını söyleyen çökme."
        fix:
          en: "Some ancestor view must call `.environment(store)`. Do it in the app, and also in every `#Preview` that needs the store."
          tr: "Üst view'lerden biri `.environment(store)` çağırmalı. Bunu app'te yap, store'a ihtiyacı olan her `#Preview`'de de yap."
      - problem:
          en: "Tapping a link does nothing."
          tr: "Bağlantıya dokunmak hiçbir şey yapmıyor."
        fix:
          en: "`NavigationLink(value:)` only works inside a `NavigationStack` and needs a `.navigationDestination(for:)` for the same type as the value (here `Habit.ID`)."
          tr: "`NavigationLink(value:)` sadece bir `NavigationStack` içinde çalışır ve değerle aynı tip için (burada `Habit.ID`) bir `.navigationDestination(for:)` ister."
      - problem:
          en: "ForEach says the type does not conform to Identifiable."
          tr: "ForEach tipin Identifiable olmadığını söylüyor."
        fix:
          en: "Add `Identifiable` with an `id`, or write `ForEach(items, id: \\.someProperty)`."
          tr: "Bir `id` ile `Identifiable` ekle ya da `ForEach(items, id: \\.someProperty)` yaz."
    quiz:
      - q:
          en: "What does `.navigationDestination(for: Habit.ID.self)` do?"
          tr: "`.navigationDestination(for: Habit.ID.self)` ne yapar?"
        options:
          en: [It deletes a habit, It tells the stack which screen to show for a value of that type, It sets the title]
          tr: [Bir alışkanlığı siler, Yığına o tipteki bir değer için hangi ekranı göstereceğini söyler, Başlığı ayarlar]
        answer: 1
        why:
          en: "A link pushes a value. The stack finds the destination registered for the type of that value."
          tr: "Bağlantı bir değer iter. Yığın, o değerin tipi için kayıtlı hedefi bulur."
    sources:
      - title: NavigationStack
        url: https://developer.apple.com/documentation/swiftui/navigationstack
      - title: Navigation
        url: https://developer.apple.com/documentation/swiftui/navigation
      - title: List
        url: https://developer.apple.com/documentation/swiftui/list

  - id: forms
    stage: first-project
    title:
      en: "Forms, sheets and settings"
      tr: "Form, sheet ve ayarlar"
    minutes: 60
    needs: [navigation]
    why:
      en: "People need to add their own habits. A form with a text field and a picker, shown in a sheet that slides up, is the standard iOS way to collect input, and bindings (`$name`) connect each control to your data."
      tr: "İnsanların kendi alışkanlıklarını eklemesi gerekir. Metin kutusu ve seçici içeren bir form ve onu gösteren, aşağıdan kayan bir sheet, iOS'ta girdi toplamanın standart yoludur; binding'ler (`$name`) her kontrolü verine bağlar."
    learn:
      en: |
        - `Form`, `Section`, `TextField`, `Picker`, `Toggle`
        - `@Binding` and the `$` prefix: a two-way connection to a `@State` value
        - `.sheet(item:)` and `dismiss`
        - `@AppStorage`: a small setting saved in UserDefaults
        - Validation: disable Save while the name is empty
      tr: |
        - `Form`, `Section`, `TextField`, `Picker`, `Toggle`
        - `@Binding` ve `$` öneki: bir `@State` değerine iki yönlü bağlantı
        - `.sheet(item:)` ve `dismiss`
        - `@AppStorage`: UserDefaults'ta saklanan küçük bir ayar
        - Doğrulama: ad boşken Save'i kapatmak
    do:
      en: |
        1. Add `add` and `delete` functions to `HabitStore.swift`.
        2. Create `AddHabitView.swift`: a `Form` with a name field and an icon picker, a Cancel button and a Save button that stays disabled while the name is empty.
        3. Create `SettingsView.swift` with a switch that decides whether the list shows streaks. `@AppStorage` saves it for you.
        4. Update `HabitRow.swift` to read that setting, and update `ContentView.swift`: a plus button and a gear button open the two sheets, and rows can be deleted by swiping left.
        5. Run it, add a habit, turn the setting off and on, delete a habit. Commit: `git add .` and `git commit -m "Add habits with a form and a settings sheet"`.
      tr: |
        1. `HabitStore.swift`'e `add` ve `delete` fonksiyonlarını ekle.
        2. `AddHabitView.swift` oluştur: ad alanı ve ikon seçicisi olan bir `Form`, bir Cancel düğmesi ve ad boşken kapalı kalan bir Save düğmesi.
        3. Listenin seriyi gösterip göstermeyeceğine karar veren bir anahtarla `SettingsView.swift` oluştur. `@AppStorage` bunu senin için kaydeder.
        4. `HabitRow.swift`'i bu ayarı okuyacak şekilde, `ContentView.swift`'i de güncelle: artı ve çark düğmeleri iki sheet'i açar, satırlar sola kaydırılarak silinebilir.
        5. Çalıştır, bir alışkanlık ekle, ayarı kapat ve aç, bir alışkanlığı sil. Commit'le: `git add .` ve `git commit -m "Add habits with a form and a settings sheet"`.
    code:
      - file: Habits/HabitStore.swift
        lang: swift
        text: |
          import Foundation
          import Observation

          @Observable
          final class HabitStore {
              var habits: [Habit] = [
                  Habit(name: "Drink water", symbol: "drop.fill"),
                  Habit(name: "Read", symbol: "book.fill"),
                  Habit(name: "Walk", symbol: "figure.walk"),
              ]

              func add(_ habit: Habit) {
                  habits.append(habit)
              }

              func delete(at offsets: IndexSet) {
                  habits.remove(atOffsets: offsets)
              }

              func toggleToday(_ habit: Habit, calendar: Calendar = .current, now: Date = .now) {
                  guard let index = habits.firstIndex(where: { $0.id == habit.id }) else { return }
                  if habits[index].isDone(on: now, calendar: calendar) {
                      habits[index].completedDays.removeAll { calendar.isDate($0, inSameDayAs: now) }
                  } else {
                      habits[index].completedDays.append(calendar.startOfDay(for: now))
                  }
              }
          }
