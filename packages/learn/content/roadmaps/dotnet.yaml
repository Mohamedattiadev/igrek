id: dotnet
title:
  en: "C# and ASP.NET Core"
  tr: "C# ve ASP.NET Core"
summary:
  en: "From an empty computer to your own C# web API on the internet. You learn C# in a small console app first, then build a real REST API with ASP.NET Core, a SQLite database, tests, login, a Docker image and a free deploy."
  tr: "Boş bir bilgisayardan internette yayında olan kendi C# web API'ne. Önce küçük bir konsol uygulamasında C# öğrenirsin, sonra ASP.NET Core ile gerçek bir REST API, SQLite veritabanı, test, giriş, Docker image'ı ve ücretsiz bir deploy hazırlarsın."
teacher: backend
project:
  en: 'A todo service: a REST API where each user registers, logs in and then adds, lists, searches, changes and deletes their own todos. It stores them in SQLite with EF Core, validates input, has xUnit tests, caches a public stats route, logs and answers health checks, and runs as a Docker container on a free host.'
  tr: 'Bir yapılacaklar servisi: her kullanıcının kayıt olup giriş yaptığı, sonra kendi işlerini ekleyip listelediği, aradığı, değiştirdiği ve sildiği bir REST API. İşleri EF Core ile SQLite''ta saklar, girdiyi doğrular, xUnit testleri vardır, herkese açık bir istatistik rotasını cache''ler, log yazar, sağlık kontrollerine cevap verir ve ücretsiz bir sunucuda Docker container olarak çalışır.'
detect:
  nuget: [Microsoft.EntityFrameworkCore.Sqlite]
  files: [global.json]
after: [web]
version: "10"
latest: eol:dotnet
checked: 2026-10
sheets: [csharp, sql, http, rest-graphql, docker, git, auth, caching, github-actions]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install the .NET SDK, an editor and Git"
      tr: ".NET SDK, bir editör ve Git kurma"
    minutes: 45
    why:
      en: "C# programs are compiled and run with .NET. The .NET SDK (Software Development Kit) holds the compiler and the `dotnet` command you will use for everything: creating, running, testing and publishing. An editor that understands C# shows mistakes while you type, and Git keeps every version of your work."
      tr: "C# programları .NET ile derlenir ve çalışır. .NET SDK (Software Development Kit) derleyiciyi ve her iş için kullanacağın `dotnet` komutunu içerir: proje oluşturma, çalıştırma, test etme ve publish etme. C#'ı anlayan bir editör sen yazarken hataları gösterir, Git de işinin her sürümünü saklar."
    learn:
      en: |
        - What .NET, the SDK and the `dotnet` command are
        - Which version to pick: **.NET 10 is the current LTS** (long-term support: fixes for years). This roadmap uses .NET 10 and C# 14
        - How to check which SDK is installed
      tr: |
        - .NET, SDK ve `dotnet` komutunun ne olduğu
        - Hangi sürümü seçeceğin: **.NET 10 şu anki LTS sürümü** (uzun süreli destek: yıllarca düzeltme alır). Bu yol haritası .NET 10 ve C# 14 kullanır
        - Hangi SDK'nın kurulu olduğunu nasıl kontrol edeceğin
    do:
      en: |
        1. Install the **.NET 10 SDK** (not only the "runtime"). The official page is dotnet.microsoft.com/download. Windows: run `winget install Microsoft.DotNet.SDK.10` or use the installer. macOS: use the installer from that page. Linux: follow the page for your distribution (Ubuntu example: `sudo apt install dotnet-sdk-10.0`). On Arch Linux also install the `aspnet-runtime` and `aspnet-targeting-pack` packages, because `dotnet-sdk` alone has no ASP.NET Core.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor, and add its **C# Dev Kit** extension (it also installs the C# extension). Visual Studio Community (Windows) and JetBrains Rider are other good choices.
        3. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it. On Windows, Git for Windows also gives you *Git Bash*, a terminal that works with the curl commands in this roadmap.
        4. Open a **new** terminal (in VS Code: *Terminal → New Terminal*) and run the commands below. `dotnet --version` should print something that starts with `10.0`.
        5. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
        6. Optional: `dotnet` sends anonymous usage data to Microsoft. To turn it off, set the environment variable `DOTNET_CLI_TELEMETRY_OPTOUT` to `1`.
      tr: |
        1. **.NET 10 SDK**'yı kur (sadece "runtime" değil). Resmi sayfa dotnet.microsoft.com/download. Windows: `winget install Microsoft.DotNet.SDK.10` komutunu çalıştır ya da yükleyiciyi kullan. macOS: o sayfadaki yükleyiciyi kullan. Linux: dağıtımın için sayfadaki adımları izle (Ubuntu örneği: `sudo apt install dotnet-sdk-10.0`). Arch Linux'ta ayrıca `aspnet-runtime` ve `aspnet-targeting-pack` paketlerini kur, çünkü tek başına `dotnet-sdk` içinde ASP.NET Core yok.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u kur (code.visualstudio.com) ve **C# Dev Kit** eklentisini ekle (C# eklentisini de kurar). Visual Studio Community (Windows) ve JetBrains Rider da iyi seçeneklerdir.
        3. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir. Windows'ta Git for Windows sana *Git Bash* de verir; bu yol haritasındaki curl komutlarıyla çalışan bir terminaldir.
        4. **Yeni** bir terminal aç (VS Code'da: *Terminal → New Terminal*) ve aşağıdaki komutları çalıştır. `dotnet --version` `10.0` ile başlayan bir şey yazmalı.
        5. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
        6. İsteğe bağlı: `dotnet` Microsoft'a anonim kullanım verisi gönderir. Kapatmak için `DOTNET_CLI_TELEMETRY_OPTOUT` ortam değişkenini `1` yap.
    code:
      - file: terminal
        lang: sh
        text: |
          dotnet --version
          dotnet --list-sdks
          git --version
    mistakes:
      - problem:
          en: "\"command not found\" or \"dotnet is not recognized\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found\" ya da \"dotnet is not recognized\" hatası."
        fix:
          en: "Close the terminal (or VS Code) and open a new one so it sees the new program. On Windows, restart if it still fails."
          tr: "Terminali (ya da VS Code'u) kapatıp yenisini aç ki yeni programı görsün. Windows'ta hâlâ olmuyorsa bilgisayarı yeniden başlat."
      - problem:
          en: "Installing only the .NET runtime. `dotnet --version` then fails or says no SDK was found."
          tr: "Sadece .NET runtime'ı kurmak. O zaman `dotnet --version` hata verir ya da SDK bulunamadı der."
        fix:
          en: "The runtime only runs finished programs. To build programs you need the SDK. Install the SDK; it contains the runtime too."
          tr: "Runtime sadece hazır programları çalıştırır. Program yazmak için SDK gerekir. SDK'yı kur; içinde runtime da vardır."
    quiz:
      - q:
          en: "What does the .NET SDK give you that the runtime alone does not?"
          tr: ".NET SDK sana tek başına runtime'ın vermediği ne sağlar?"
        options:
          en:
            - "Nothing, they are the same"
            - "The compiler and the dotnet command to create, build and test projects"
            - "A faster internet connection"
          tr:
            - "Hiçbir şey, ikisi aynı"
            - "Proje oluşturmak, derlemek ve test etmek için derleyici ve dotnet komutu"
            - "Daha hızlı internet bağlantısı"
        answer: 1
        why:
          en: "The runtime can only run programs that are already built. The SDK includes the compiler, the project templates and the dotnet command."
          tr: "Runtime sadece derlenmiş programları çalıştırır. SDK derleyiciyi, proje şablonlarını ve dotnet komutunu içerir."
    sources:
      - title: Install .NET
        url: https://learn.microsoft.com/en-us/dotnet/core/install/
      - title: .NET support policy and release schedule
        url: https://dotnet.microsoft.com/en-us/platform/support/policy/dotnet-core
      - title: What's new in .NET 10
        url: https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-10/overview

  - id: hello
    stage: first-code
    title:
      en: "Your first C# program"
      tr: "İlk C# programın"
    minutes: 30
    needs: [setup]
    why:
      en: "Before a web API, run the smallest possible program. You learn what a project is, what `dotnet run` does, and how to read an error, all with a few lines of code."
      tr: "Web API'den önce mümkün olan en küçük programı çalıştır. Proje nedir, `dotnet run` ne yapar ve bir hata nasıl okunur; hepsini birkaç satır kodla öğrenirsin."
    learn:
      en: |
        - A **project** is a folder with a `.csproj` file that says what to build (the .NET version and settings)
        - **Top-level statements**: the lines in `Program.cs` are the program, with no `Main` method needed
        - `dotnet run` builds and starts the project; errors name the file and line
        - String interpolation: `$"Hello {name}"`
      tr: |
        - **Proje**, neyin derleneceğini söyleyen (.NET sürümü ve ayarlar) bir `.csproj` dosyası olan klasördür
        - **Top-level statement**: `Program.cs` içindeki satırların kendisi programdır, `Main` metodu gerekmez
        - `dotnet run` projeyi derler ve başlatır; hatalar dosyayı ve satırı söyler
        - String interpolation: `$"Merhaba {name}"`
    do:
      en: |
        1. In the terminal go to the folder where you keep projects. Create the project folder `todo`, go into it and let Git watch it (first commands below). `dotnet new gitignore` writes a `.gitignore` that keeps build output out of Git.
        2. Create a throw-away console app called `scratch` with `dotnet new console -o scratch`. It makes `scratch/Program.cs` and `scratch/scratch.csproj`.
        3. Open the `todo` folder in VS Code, open `scratch/scratch.csproj` and look at it: `net10.0` is the .NET version, `Nullable` turns on null checks.
        4. Replace everything in `scratch/Program.cs` with the code below and run it with `dotnet run --project scratch`. It prints two lines.
        5. Change "Hello, .NET!" to your own text and run again. Then break something on purpose (delete the last `)`) and read the error: it shows the file, the line and what is wrong.
        6. Save this version: `git add .` and `git commit -m "Start the todo project"`.
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git. `todo` proje klasörünü oluştur, içine gir ve Git'in izlemesini sağla (aşağıdaki ilk komutlar). `dotnet new gitignore`, build çıktılarını Git'ten uzak tutan bir `.gitignore` yazar.
        2. `dotnet new console -o scratch` ile `scratch` adında, atılacak (deneme) bir konsol uygulaması oluştur. `scratch/Program.cs` ve `scratch/scratch.csproj` dosyalarını yapar.
        3. `todo` klasörünü VS Code'da aç, `scratch/scratch.csproj` dosyasına bak: `net10.0` .NET sürümüdür, `Nullable` null kontrollerini açar.
        4. `scratch/Program.cs` içindeki her şeyi aşağıdaki kodla değiştir ve `dotnet run --project scratch` ile çalıştır. İki satır yazar.
        5. "Hello, .NET!" yerine kendi metnini yaz ve yeniden çalıştır. Sonra bilerek bir şeyi boz (son `)` karakterini sil) ve hatayı oku: dosyayı, satırı ve neyin yanlış olduğunu gösterir.
        6. Bu sürümü kaydet: `git add .` ve `git commit -m "Start the todo project"`.
    code:
      - file: terminal
        lang: sh
        text: |
          mkdir todo
          cd todo
          git init
          dotnet new gitignore
          dotnet new console -o scratch
          dotnet run --project scratch
      - file: scratch/Program.cs
        lang: cs
        text: |
          Console.WriteLine("Hello, .NET!");
          Console.WriteLine($"Running on {Environment.Version}");
    mistakes:
      - problem:
          en: "\"Couldn't find a project to run\" when you type `dotnet run`."
          tr: "`dotnet run` yazınca \"Couldn't find a project to run\" hatası."
        fix:
          en: "You are in a folder with no `.csproj`. Either `cd scratch` first, or keep the folder and run `dotnet run --project scratch`."
          tr: "İçinde `.csproj` olmayan bir klasördesin. Ya önce `cd scratch` yap, ya da klasörde kal ve `dotnet run --project scratch` çalıştır."
      - problem:
          en: "Editing the file but running an old version."
          tr: "Dosyayı değiştirmek ama eski sürümü çalıştırmak."
        fix:
          en: "Save the file first (Ctrl+S). `dotnet run` rebuilds from what is saved on disk."
          tr: "Önce dosyayı kaydet (Ctrl+S). `dotnet run` diskte kayıtlı olandan yeniden derler."
    quiz:
      - q:
          en: "What does `dotnet run` do?"
          tr: "`dotnet run` ne yapar?"
        options:
          en:
            - "Only checks the spelling of your code"
            - "Builds the project and starts the program"
            - "Uploads the program to the internet"
          tr:
            - "Sadece kodunun yazımını kontrol eder"
            - "Projeyi derler ve programı başlatır"
            - "Programı internete yükler"
        answer: 1
        why:
          en: "It compiles the project in the folder (or the one you name with --project) and then runs it."
          tr: "Klasördeki projeyi (ya da --project ile söylediğin projeyi) derler ve sonra çalıştırır."
    sources:
      - title: "Tutorial: Create a .NET console application using Visual Studio Code"
        url: https://learn.microsoft.com/en-us/dotnet/core/tutorials/with-visual-studio-code
      - title: Top-level statements
        url: https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/program-structure/top-level-statements

  - id: csharp
    stage: basics
    title:
      en: "C# basics: records, LINQ, nullable and async"
      tr: "C# temelleri: record, LINQ, nullable ve async"
    minutes: 60
    needs: [hello]
    why:
      en: "The API you build next uses four C# ideas in almost every line: small data types (records), questions about lists (LINQ), values that may be missing (nullable) and waiting without blocking (async). Learning them in a console app, where you see each result at once, is much easier than learning them inside a web server."
      tr: "Sonra yazacağın API neredeyse her satırda dört C# fikrini kullanır: küçük veri tipleri (record), listelere soru sormak (LINQ), eksik olabilen değerler (nullable) ve bloklamadan beklemek (async). Bunları her sonucu hemen gördüğün bir konsol uygulamasında öğrenmek, web sunucusunun içinde öğrenmekten çok daha kolaydır."
    learn:
      en: |
        - **record**: a short way to write a data type. It compares by value and `with` makes a changed copy
        - **LINQ**: `Where`, `OrderBy`, `Select`, `Count`, `FirstOrDefault` ask questions about a list
        - **Nullable reference types**: `TodoItem?` means "may be null"; the compiler warns when you forget to check
        - **async/await**: `await` waits for slow work (a database, the network) and lets the thread do other work meanwhile
        - Collection expressions: `[a, b, c]` makes a list
      tr: |
        - **record**: bir veri tipini kısa yazmanın yolu. Değere göre karşılaştırır ve `with` değiştirilmiş bir kopya yapar
        - **LINQ**: `Where`, `OrderBy`, `Select`, `Count`, `FirstOrDefault` bir liste hakkında soru sorar
        - **Nullable reference type**: `TodoItem?` "null olabilir" demek; kontrol etmeyi unutursan derleyici uyarır
        - **async/await**: `await` yavaş işi (veritabanı, ağ) bekler ve thread'in o sırada başka iş yapmasına izin verir
        - Collection expression: `[a, b, c]` bir liste yapar
    do:
      en: |
        1. Replace everything in `scratch/Program.cs` with the code below.
        2. Run `dotnet run --project scratch`. You should see exactly the output listed below the code (the last line says "about 1 second").
        3. Read the output next to the code. Which line printed `True`? Why are the two records equal although they are two objects?
        4. Change `t => !t.IsDone` to `t => t.IsDone` and run again. Then add a fifth todo to the list and see the counts change.
        5. In `LoadTitleAsync`, change the delay to `2000` and run. Both calls still finish together: `Task.WhenAll` starts them at the same time and waits for both.
        6. Commit: `git add .` and `git commit -m "Try records, LINQ and async"`.
      tr: |
        1. `scratch/Program.cs` içindeki her şeyi aşağıdaki kodla değiştir.
        2. `dotnet run --project scratch` çalıştır. Kodun altındaki çıktıyı aynen görmelisin (son satır "about 1 second" der).
        3. Çıktıyı kodun yanında oku. Hangi satır `True` yazdı? İki record iki ayrı nesne olduğu halde neden eşit?
        4. `t => !t.IsDone` yerine `t => t.IsDone` yaz ve yeniden çalıştır. Sonra listeye beşinci bir iş ekle ve sayıların değiştiğini gör.
        5. `LoadTitleAsync` içinde bekleme süresini `2000` yap ve çalıştır. İki çağrı yine birlikte biter: `Task.WhenAll` ikisini aynı anda başlatır ve ikisini de bekler.
        6. Commit et: `git add .` ve `git commit -m "Try records, LINQ and async"`.
    code:
      - file: scratch/Program.cs
        lang: cs
        text: |
          // A record is a small, read-only data type with a built-in ToString and equality.
          var first = new TodoItem(1, "Buy milk", false);
          var done = first with { IsDone = true };   // a copy with one change
          Console.WriteLine(first);
          Console.WriteLine(done);
          Console.WriteLine(first == new TodoItem(1, "Buy milk", false));   // True: records compare by value

          // LINQ asks questions about a list.
          List<TodoItem> todos =
          [
              first,
              new(2, "Write code", true),
              new(3, "Walk the dog", false),
              new(4, "Read a book", false),
          ];

          var open = todos.Where(t => !t.IsDone).OrderBy(t => t.Title).ToList();
          foreach (var t in open)
              Console.WriteLine($"open: {t.Title}");
          Console.WriteLine($"{todos.Count(t => t.IsDone)} of {todos.Count} done");

          // Nullable types: the ? says "may be missing", so the compiler makes you check.
          TodoItem? found = todos.FirstOrDefault(t => t.Id == 99);
          Console.WriteLine(found?.Title ?? "no such todo");

          // async/await: wait for slow work without blocking the thread.
          var started = DateTime.Now;
          var titles = await Task.WhenAll(LoadTitleAsync(1), LoadTitleAsync(2));
          Console.WriteLine($"{string.Join(" + ", titles)} in about {(DateTime.Now - started).TotalSeconds:F0} second");

          static async Task<string> LoadTitleAsync(int id)
          {
              await Task.Delay(1000);   // pretend this is a database or network call
              return $"todo {id}";
          }

          record TodoItem(int Id, string Title, bool IsDone);
      - file: terminal (expected output)
        lang: text
        text: |
          TodoItem { Id = 1, Title = Buy milk, IsDone = False }
          TodoItem { Id = 1, Title = Buy milk, IsDone = True }
          True
          open: Buy milk
          open: Read a book
          open: Walk the dog
          1 of 4 done
          no such todo
          todo 1 + todo 2 in about 1 second
    mistakes:
      - problem:
          en: "Waiting for async code with `.Result` or `.Wait()`."
          tr: "Async kodu `.Result` ya da `.Wait()` ile beklemek."
        fix:
          en: "Use `await` and make the method `async Task`. Blocking a thread on async work can freeze a web server under load."
          tr: "`await` kullan ve metodu `async Task` yap. Thread'i async işte bloklamak, yük altında bir web sunucusunu dondurabilir."
      - problem:
          en: "Ignoring the warning \"Dereference of a possibly null reference\" (CS8602)."
          tr: "\"Dereference of a possibly null reference\" (CS8602) uyarısını görmezden gelmek."
        fix:
          en: "The compiler found a place where a value can be null. Check it first (`if (x is not null)`), or use `x?.Name`. Do not silence it with `!` unless you are sure."
          tr: "Derleyici bir değerin null olabileceği bir yer buldu. Önce kontrol et (`if (x is not null)`) ya da `x?.Name` kullan. Emin değilsen `!` ile susturma."
      - problem:
          en: "Error CS8803 (\"Top-level statements must precede namespace and type declarations\") after putting the `record` line in the middle of the code."
          tr: "`record` satırını kodun ortasına yazınca CS8803 hatası (\"Top-level statements must precede namespace and type declarations\")."
        fix:
          en: "Type declarations go after the statements (or in their own file). Statements must come before them."
          tr: "Tip tanımları komutlardan sonra (ya da kendi dosyasında) olur. Komutlar onlardan önce gelmeli."
    quiz:
      - q:
          en: "What does `first with { IsDone = true }` do to `first`?"
          tr: "`first with { IsDone = true }` `first` değişkenine ne yapar?"
        options:
          en:
            - "Changes first itself"
            - "Makes a new record with IsDone changed and leaves first as it was"
            - "Deletes first"
          tr:
            - "first'ün kendisini değiştirir"
            - "IsDone değişmiş yeni bir record yapar ve first olduğu gibi kalır"
            - "first'ü siler"
        answer: 1
        why:
          en: "Records are meant to stay unchanged. `with` copies the record and changes only what you name."
          tr: "Record'lar değişmeden kalmak için tasarlanır. `with` record'u kopyalar ve sadece söylediğin alanı değiştirir."
    sources:
      - title: Records (C# reference)
        url: https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/builtin-types/record
      - title: Language Integrated Query (LINQ)
        url: https://learn.microsoft.com/en-us/dotnet/csharp/linq/
      - title: Asynchronous programming
        url: https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/

  - id: minimal-api
    stage: first-project
    title:
      en: "Your first web API with ASP.NET Core Minimal APIs"
      tr: "ASP.NET Core Minimal API ile ilk web API'n"
    minutes: 60
    needs: [csharp]
    why:
      en: "A web API is a program that waits for HTTP requests and answers with data, usually JSON. Other programs (a web page, a phone app) talk to it. Minimal APIs let you write each route in one or two lines, so you can see how a request becomes an answer."
      tr: "Web API, HTTP isteklerini bekleyen ve genelde JSON olan veriyle cevap veren bir programdır. Başka programlar (bir web sayfası, bir telefon uygulaması) onunla konuşur. Minimal API her rotayı bir iki satırda yazmanı sağlar; böylece bir isteğin nasıl cevaba dönüştüğünü görürsün."
    learn:
      en: |
        - HTTP in short: a **method** (GET reads, POST creates, PUT replaces, DELETE removes), a **path** (`/todos/1`) and a **status code** (200 OK, 201 Created, 404 Not Found)
        - `WebApplication.CreateBuilder` makes the app; `app.MapGet`, `app.MapPost` connect a method and a path to a function
        - ASP.NET Core turns your C# objects into JSON and JSON bodies into C# objects
        - `Results.Ok`, `Results.NotFound`, `Results.Created` choose the status code
      tr: |
        - HTTP kısaca: bir **metot** (GET okur, POST oluşturur, PUT değiştirir, DELETE siler), bir **path** (`/todos/1`) ve bir **durum kodu** (200 OK, 201 Created, 404 Not Found)
        - `WebApplication.CreateBuilder` uygulamayı yapar; `app.MapGet`, `app.MapPost` bir metodu ve bir path'i bir fonksiyona bağlar
        - ASP.NET Core C# nesnelerini JSON'a, JSON gövdelerini C# nesnelerine çevirir
        - `Results.Ok`, `Results.NotFound`, `Results.Created` durum kodunu seçer
    do:
      en: |
        1. In the `todo` folder create the web project, a solution file (it groups projects so one command builds and tests them all) and add the project to it (first commands below). Add a line `*.db*` to the end of `.gitignore` so the database file you create later never goes into Git.
        2. Replace everything in `src/TodoApi/Program.cs` with the code below.
        3. Start the app: `dotnet run --project src/TodoApi --urls http://localhost:5080`. Leave it running. (We fix the port so every command in this roadmap matches.)
        4. In a second terminal, try the routes with curl (on Windows use Git Bash). Open http://localhost:5080/todos in a browser too: a GET is just a page visit.
        5. Stop the app with Ctrl+C, start it again and list the todos: they are gone, because the list lives only in memory. A database fixes that later.
        6. Commit: `git add .` and `git commit -m "Add a first Minimal API"`.
      tr: |
        1. `todo` klasöründe web projesini, bir solution dosyasını (projeleri gruplar; tek komut hepsini derler ve test eder) oluştur ve projeyi ona ekle (aşağıdaki ilk komutlar). `.gitignore` dosyasının sonuna `*.db*` satırını ekle; böylece sonra oluşturacağın veritabanı dosyası asla Git'e girmez.
        2. `src/TodoApi/Program.cs` içindeki her şeyi aşağıdaki kodla değiştir.
        3. Uygulamayı başlat: `dotnet run --project src/TodoApi --urls http://localhost:5080`. Açık bırak. (Portu sabitliyoruz ki bu yol haritasındaki her komut uysun.)
        4. İkinci bir terminalde rotaları curl ile dene (Windows'ta Git Bash kullan). http://localhost:5080/todos adresini tarayıcıda da aç: GET sadece bir sayfa ziyaretidir.
        5. Uygulamayı Ctrl+C ile durdur, yeniden başlat ve işleri listele: yok olmuşlar, çünkü liste sadece bellekte yaşıyor. Bunu sonra bir veritabanı çözer.
        6. Commit et: `git add .` ve `git commit -m "Add a first Minimal API"`.
    code:
      - file: terminal
        lang: sh
        text: |
          dotnet new web -o src/TodoApi
          dotnet new sln -n Todo
          dotnet sln add src/TodoApi
      - file: src/TodoApi/Program.cs
        lang: cs
        text: |
          var builder = WebApplication.CreateBuilder(args);
          var app = builder.Build();

          // An in-memory list for now. It is lost when the app stops; a database comes later.
          var todos = new List<Todo>();
          var nextId = 1;

          app.MapGet("/", () => "Todo API is running");

          app.MapGet("/todos", () => todos);

          app.MapGet("/todos/{id:int}", (int id) =>
              todos.FirstOrDefault(t => t.Id == id) is { } todo
                  ? Results.Ok(todo)
                  : Results.NotFound());

          app.MapPost("/todos", (CreateTodo input) =>
          {
              var todo = new Todo(nextId++, input.Title, false);
              todos.Add(todo);
              return Results.Created($"/todos/{todo.Id}", todo);
          });

          app.Run();

          record Todo(int Id, string Title, bool IsDone);
          record CreateTodo(string Title);
      - file: terminal (second terminal)
        lang: sh
        text: |
          curl http://localhost:5080/
          curl -i -X POST http://localhost:5080/todos -H "Content-Type: application/json" -d '{"title":"Buy milk"}'
          curl http://localhost:5080/todos
          curl http://localhost:5080/todos/1
          curl -i http://localhost:5080/todos/9
    mistakes:
      - problem:
          en: "\"Address already in use\" when starting the app."
          tr: "Uygulamayı başlatırken \"Address already in use\" hatası."
        fix:
          en: "The previous run is still going. Find its terminal and press Ctrl+C, or choose another port in `--urls`."
          tr: "Önceki çalıştırma hâlâ açık. Onun terminalini bulup Ctrl+C yap, ya da `--urls` içinde başka bir port seç."
      - problem:
          en: "A POST without the header `Content-Type: application/json` answers 415 (Unsupported Media Type)."
          tr: "`Content-Type: application/json` başlığı olmayan POST 415 (Unsupported Media Type) döner."
        fix:
          en: "Add `-H \"Content-Type: application/json\"` to curl. The server needs to know the body is JSON."
          tr: "curl'e `-H \"Content-Type: application/json\"` ekle. Sunucunun gövdenin JSON olduğunu bilmesi gerekir."
      - problem:
          en: "After changing the code the old behaviour is still there."
          tr: "Kodu değiştirdikten sonra eski davranış hâlâ duruyor."
        fix:
          en: "The running app does not reload by itself. Stop it with Ctrl+C and start it again, or use `dotnet watch --project src/TodoApi` which restarts on every save."
          tr: "Çalışan uygulama kendiliğinden yenilenmez. Ctrl+C ile durdurup yeniden başlat, ya da her kaydedişte yeniden başlayan `dotnet watch --project src/TodoApi` kullan."
    quiz:
      - q:
          en: "Which status code should a successful POST that created a todo return?"
          tr: "Bir işi oluşturan başarılı bir POST hangi durum kodunu döndürmeli?"
        options:
          en:
            - "200 OK"
            - "201 Created"
            - "404 Not Found"
          tr:
            - "200 OK"
            - "201 Created"
            - "404 Not Found"
        answer: 1
        why:
          en: "201 Created says a new thing now exists, and the Location header tells where to find it."
          tr: "201 Created yeni bir şeyin oluştuğunu söyler, Location başlığı da onu nerede bulacağını gösterir."
    sources:
      - title: "Tutorial: Create a Minimal API with ASP.NET Core"
        url: https://learn.microsoft.com/en-us/aspnet/core/tutorials/min-web-api
      - title: Minimal APIs overview
        url: https://learn.microsoft.com/en-us/aspnet/core/fundamentals/minimal-apis

  - id: validation
    stage: first-project
    title:
      en: "Validate what clients send"
      tr: "İstemcilerin gönderdiğini doğrulama"
    minutes: 40
    needs: [minimal-api]
    why:
      en: "Clients send anything: an empty title, a title a million letters long, nothing at all. If you trust the input, bad data ends up in your database. Validation rejects it at the door with a clear 400 answer."
      tr: "İstemciler her şeyi gönderir: boş bir başlık, bir milyon harflik bir başlık, hiçbir şey. Girdiye güvenirsen kötü veri veritabanına girer. Doğrulama onu kapıda, açık bir 400 cevabıyla geri çevirir."
    learn:
      en: |
        - **Data annotations**: attributes such as `[Required]` and `[StringLength]` describe what a valid value is
        - Since .NET 10, `builder.Services.AddValidation()` makes Minimal APIs check these attributes on request bodies, queries and headers by themselves
        - A failed check answers **400 Bad Request** with a JSON list of errors (a "problem details" body)
        - Never trust the client: validation on the server is the one that counts
      tr: |
        - **Data annotation**: `[Required]` ve `[StringLength]` gibi attribute'lar geçerli değerin ne olduğunu anlatır
        - .NET 10'dan beri `builder.Services.AddValidation()` Minimal API'nin bu attribute'ları istek gövdesinde, query'de ve header'larda kendiliğinden kontrol etmesini sağlar
        - Başarısız kontrol, hataların JSON listesiyle (bir "problem details" gövdesi) **400 Bad Request** döner
        - İstemciye asla güvenme: önemli olan sunucudaki doğrulamadır
    do:
      en: |
        1. Create `src/TodoApi/Todo.cs` with the code below. The types move out of `Program.cs`, become `public`, and `CreateTodo` gets validation attributes.
        2. In `src/TodoApi/Program.cs` delete the two `record` lines at the bottom, and add the `AddValidation()` line right after `CreateBuilder` (see the code).
        3. Restart the app and send an empty title, then a missing title, then a good one (curl commands below). The first two now answer 400 with a message.
        4. Commit: `git add .` and `git commit -m "Validate new todos"`.
      tr: |
        1. Aşağıdaki kodla `src/TodoApi/Todo.cs` dosyasını oluştur. Tipler `Program.cs` içinden çıkar, `public` olur ve `CreateTodo` doğrulama attribute'larını alır.
        2. `src/TodoApi/Program.cs` içinde alttaki iki `record` satırını sil ve `CreateBuilder` satırının hemen altına `AddValidation()` satırını ekle (koda bak).
        3. Uygulamayı yeniden başlat ve boş başlık, eksik başlık, sonra düzgün bir başlık gönder (aşağıdaki curl komutları). İlk ikisi artık bir mesajla 400 döner.
        4. Commit et: `git add .` ve `git commit -m "Validate new todos"`.
    code:
      - file: src/TodoApi/Todo.cs
        lang: cs
        text: |
          using System.ComponentModel.DataAnnotations;

          public record Todo(int Id, string Title, bool IsDone);

          public record CreateTodo(
              [Required, StringLength(100, MinimumLength = 1)] string Title);
      - file: src/TodoApi/Program.cs (top of the file)
        lang: cs
        text: |
          var builder = WebApplication.CreateBuilder(args);
          builder.Services.AddValidation();
          var app = builder.Build();
          // ... the routes stay as they were, and the two record lines at the bottom are gone
      - file: terminal
        lang: sh
        text: |
          curl -i -X POST http://localhost:5080/todos -H "Content-Type: application/json" -d '{"title":""}'
          curl -i -X POST http://localhost:5080/todos -H "Content-Type: application/json" -d '{}'
          curl -i -X POST http://localhost:5080/todos -H "Content-Type: application/json" -d '{"title":"Buy milk"}'
    mistakes:
      - problem:
          en: "Bad titles are still accepted (201)."
          tr: "Kötü başlıklar hâlâ kabul ediliyor (201)."
        fix:
          en: "Check that `AddValidation()` is called before `Build()`, and that the types are `public` and in their own file. Types declared as plain types at the bottom of `Program.cs` were not checked at all in my test, and nothing warned about it."
          tr: "`AddValidation()` çağrısının `Build()` öncesinde olduğunu, tiplerin `public` ve kendi dosyasında olduğunu kontrol et. `Program.cs` altında düz tip olarak bırakılan tipler denememde hiç kontrol edilmedi ve hiçbir uyarı çıkmadı."
      - problem:
          en: "Error CS0246: the type or namespace name 'Required' could not be found."
          tr: "CS0246 hatası: the type or namespace name 'Required' could not be found."
        fix:
          en: "The attributes live in `System.ComponentModel.DataAnnotations`. Add `using System.ComponentModel.DataAnnotations;` at the top of the file."
          tr: "Attribute'lar `System.ComponentModel.DataAnnotations` içinde. Dosyanın en üstüne `using System.ComponentModel.DataAnnotations;` ekle."
    quiz:
      - q:
          en: "Why validate on the server when the web page already checks the form?"
          tr: "Web sayfası formu zaten kontrol ediyorsa neden sunucuda da doğrulayalım?"
        options:
          en:
            - "It is not needed"
            - "Anyone can send requests without the page, so only server checks are reliable"
            - "Servers are faster at checking"
          tr:
            - "Gerek yok"
            - "Herkes sayfa olmadan istek gönderebilir; güvenilir olan sadece sunucu kontrolüdür"
            - "Sunucular kontrolü daha hızlı yapar"
        answer: 1
        why:
          en: "curl, scripts and attackers skip your page completely. Only the checks in your API always run."
          tr: "curl, script'ler ve saldırganlar sayfanı tamamen atlar. Her zaman çalışan tek kontrol API'ndeki kontrollerdir."
    sources:
      - title: Validation support in Minimal APIs
        url: https://learn.microsoft.com/en-us/aspnet/core/fundamentals/minimal-apis#validation-support-in-minimal-apis
      - title: Validation in ASP.NET Core
        url: https://learn.microsoft.com/en-us/aspnet/core/fundamentals/validation

  - id: database
    stage: data-api
    title:
      en: "Save todos in SQLite with EF Core"
      tr: "İşleri EF Core ile SQLite'ta saklama"
    minutes: 75
    needs: [validation]
    why:
      en: "Right now every todo is lost when the app stops. A database keeps data on disk. SQLite is a database in one file, so there is nothing to install. EF Core (Entity Framework Core) lets you work with tables as C# classes, and migrations record every change of the table layout so it can be repeated on any machine."
      tr: "Şu an uygulama durunca her iş kayboluyor. Veritabanı veriyi diskte tutar. SQLite tek dosyalık bir veritabanıdır, kurulacak bir şey yoktur. EF Core (Entity Framework Core) tablolarla C# class'ları gibi çalışmanı sağlar; migration'lar tablo düzenindeki her değişikliği kaydeder, böylece her makinede tekrarlanabilir."
    learn:
      en: |
        - An **entity** is a class that maps to a table (`Todo`), a **DbContext** is your session with the database (`TodoDb`), a **DbSet** is one table
        - A **DTO** (data transfer object) is the shape you send out (`TodoDto`), so the table layout does not leak into your API
        - A **migration** is a C# file that creates or changes tables. `dotnet ef` makes it, `Database.Migrate()` applies it
        - Use the `Async` methods (`ToListAsync`, `SaveChangesAsync`) so no thread waits idle
        - A **connection string** says where the database is; it belongs in configuration, not in code
        - Use EF Core packages with the same major version as your SDK (10.x for .NET 10)
      tr: |
        - **Entity** bir tabloya karşılık gelen class'tır (`Todo`), **DbContext** veritabanıyla oturumundur (`TodoDb`), **DbSet** tek bir tablodur
        - **DTO** (data transfer object) dışarı gönderdiğin şekildir (`TodoDto`); böylece tablo düzeni API'ne sızmaz
        - **Migration**, tablo oluşturan ya da değiştiren bir C# dosyasıdır. `dotnet ef` onu üretir, `Database.Migrate()` uygular
        - `Async` metotları kullan (`ToListAsync`, `SaveChangesAsync`); böylece hiçbir thread boşuna beklemez
        - **Connection string** veritabanının nerede olduğunu söyler; kodda değil, yapılandırmada durur
        - SDK'nla aynı ana sürümde EF Core paketleri kullan (.NET 10 için 10.x)
    do:
      en: |
        1. Stop the app. Add the packages (first commands below). `Design` is only used while you build, and `dotnet package add` marks it that way for you. (Before .NET 10 the command was `dotnet add package`.)
        2. Install the `dotnet-ef` tool for this project only: a tool manifest keeps the version in the repo (second block). It is not installed globally.
        3. Replace `src/TodoApi/Todo.cs` with the code below and create `src/TodoApi/TodoDb.cs`.
        4. Open `src/TodoApi/appsettings.json` and add the `ConnectionStrings` part (code below). `todos.db` is a file next to where the app runs.
        5. Replace `src/TodoApi/Program.cs` with the code below. `Migrate()` creates the file and the tables on start.
        6. Create the first migration: the `migrations add` command (second block). Look at the new `Migrations` folder: it contains plain C# that creates the `Todos` table.
        7. Start the app. Create todos with curl, stop the app, start it again: the todos are still there. A `todos.db` file appeared in `src/TodoApi`.
        8. Commit: `git add .` and `git commit -m "Store todos in SQLite"`. The `.gitignore` line from earlier keeps `todos.db` out of Git.
      tr: |
        1. Uygulamayı durdur. Paketleri ekle (aşağıdaki ilk komutlar). `Design` sadece geliştirirken kullanılır ve `dotnet package add` bunu senin için öyle işaretler. (.NET 10'dan önce komut `dotnet add package` idi.)
        2. `dotnet-ef` aracını sadece bu proje için kur: bir tool manifest sürümü repoda tutar (ikinci blok). Global kurulmaz.
        3. `src/TodoApi/Todo.cs` dosyasını aşağıdaki kodla değiştir ve `src/TodoApi/TodoDb.cs` dosyasını oluştur.
        4. `src/TodoApi/appsettings.json` dosyasını aç ve `ConnectionStrings` bölümünü ekle (aşağıdaki kod). `todos.db`, uygulamanın çalıştığı yerin yanındaki bir dosyadır.
        5. `src/TodoApi/Program.cs` dosyasını aşağıdaki kodla değiştir. `Migrate()` başlarken dosyayı ve tabloları oluşturur.
        6. İlk migration'ı oluştur: `migrations add` komutu (ikinci blok). Yeni `Migrations` klasörüne bak: `Todos` tablosunu oluşturan düz C# içerir.
        7. Uygulamayı başlat. curl ile iş oluştur, uygulamayı durdur, yeniden başlat: işler hâlâ orada. `src/TodoApi` içinde bir `todos.db` dosyası oluştu.
        8. Commit et: `git add .` ve `git commit -m "Store todos in SQLite"`. Daha önceki `.gitignore` satırı `todos.db` dosyasını Git'ten uzak tutar.
    code:
      - file: terminal (packages)
        lang: sh
        text: |
          dotnet package add Microsoft.EntityFrameworkCore.Sqlite --project src/TodoApi
          dotnet package add Microsoft.EntityFrameworkCore.Design --project src/TodoApi
      - file: terminal (tool and first migration)
        lang: sh
        text: |
          dotnet new tool-manifest
          dotnet tool install dotnet-ef
          dotnet tool run dotnet-ef migrations add InitialCreate --project src/TodoApi
      - file: src/TodoApi/Todo.cs
        lang: cs
        text: |
          using System.ComponentModel.DataAnnotations;

          // The row in the database.
          public class Todo
          {
              public int Id { get; set; }
              public required string Title { get; set; }
              public bool IsDone { get; set; }
              public DateTimeOffset CreatedAt { get; set; } = DateTimeOffset.UtcNow;
          }

          // What the API sends out.
          public record TodoDto(int Id, string Title, bool IsDone, DateTimeOffset CreatedAt)
          {
              public static TodoDto From(Todo t) => new(t.Id, t.Title, t.IsDone, t.CreatedAt);
          }

          // What the API accepts when someone creates a todo.
          public record CreateTodo(
              [Required, StringLength(100, MinimumLength = 1)] string Title);
      - file: src/TodoApi/TodoDb.cs
        lang: cs
        text: |
          using Microsoft.EntityFrameworkCore;

          public class TodoDb(DbContextOptions<TodoDb> options) : DbContext(options)
          {
              public DbSet<Todo> Todos => Set<Todo>();
          }
      - file: src/TodoApi/appsettings.json
        lang: json
        text: |
          {
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*",
            "ConnectionStrings": {
              "Todos": "Data Source=todos.db"
            }
          }
      - file: src/TodoApi/Program.cs
        lang: cs
        text: |
          using Microsoft.EntityFrameworkCore;

          var builder = WebApplication.CreateBuilder(args);

          builder.Services.AddValidation();
          builder.Services.AddDbContext<TodoDb>((sp, options) =>
              options.UseSqlite(sp.GetRequiredService<IConfiguration>().GetConnectionString("Todos")));

          var app = builder.Build();

          // Create the database file and bring its tables up to date every time the app starts.
          using (var scope = app.Services.CreateScope())
          {
              scope.ServiceProvider.GetRequiredService<TodoDb>().Database.Migrate();
          }

          app.MapGet("/", () => "Todo API is running");

          var todos = app.MapGroup("/todos");

          todos.MapGet("/", async (TodoDb db) =>
          {
              var all = await db.Todos.AsNoTracking().OrderBy(t => t.Id).ToListAsync();
              return all.Select(TodoDto.From);
          });

          todos.MapGet("/{id:int}", async (int id, TodoDb db) =>
              await db.Todos.FindAsync(id) is { } todo
                  ? Results.Ok(TodoDto.From(todo))
                  : Results.NotFound());

          todos.MapPost("/", async (CreateTodo input, TodoDb db) =>
          {
              var todo = new Todo { Title = input.Title.Trim() };
              db.Todos.Add(todo);
              await db.SaveChangesAsync();
              return Results.Created($"/todos/{todo.Id}", TodoDto.From(todo));
          });

          app.Run();
    mistakes:
      - problem:
          en: "\"no such table: Todos\" or \"unable to open database file\"."
          tr: "\"no such table: Todos\" ya da \"unable to open database file\" hatası."
        fix:
          en: "Either you forgot to create the migration, or the connection string is empty. The app reads `appsettings.json` from the project folder, so start it with `dotnet run --project src/TodoApi` (or from inside `src/TodoApi`)."
          tr: "Ya migration'ı oluşturmayı unuttun ya da connection string boş. Uygulama `appsettings.json` dosyasını proje klasöründen okur; bu yüzden `dotnet run --project src/TodoApi` ile (ya da `src/TodoApi` içinden) başlat."
      - problem:
          en: "\"Could not execute because the specified command or file was not found\" for `dotnet ef`."
          tr: "`dotnet ef` için \"Could not execute because the specified command or file was not found\" hatası."
        fix:
          en: "Run `dotnet tool restore` in the `todo` folder (it installs the tools listed in `dotnet-tools.json`) and run the command from that folder, as `dotnet tool run dotnet-ef ...`."
          tr: "`todo` klasöründe `dotnet tool restore` çalıştır (`dotnet-tools.json` içindeki araçları kurar) ve komutu o klasörden `dotnet tool run dotnet-ef ...` şeklinde çalıştır."
      - problem:
          en: "Changing the `Todo` class but not the database."
          tr: "`Todo` class'ını değiştirip veritabanını değiştirmemek."
        fix:
          en: "After every change to an entity, create a new migration (`migrations add <Name>`). On the next start `Migrate()` applies it."
          tr: "Bir entity'yi her değiştirişinde yeni bir migration oluştur (`migrations add <Ad>`). Bir sonraki başlangıçta `Migrate()` onu uygular."
    quiz:
      - q:
          en: "What is a migration?"
          tr: "Migration nedir?"
        options:
          en:
            - "A backup of the database"
            - "A C# file that creates or changes tables, so the layout can be repeated anywhere"
            - "A way to move the app to another server"
          tr:
            - "Veritabanının bir yedeği"
            - "Tablo oluşturan ya da değiştiren, böylece düzenin her yerde tekrarlanmasını sağlayan bir C# dosyası"
            - "Uygulamayı başka bir sunucuya taşımanın yolu"
        answer: 1
        why:
          en: "Migrations are the history of your table layout, kept in the repository. Any machine, including the production server, can replay them."
          tr: "Migration'lar tablo düzeninin geçmişidir ve repoda durur. Üretim sunucusu dahil her makine onları yeniden oynatabilir."
    sources:
      - title: "Getting started with EF Core"
        url: https://learn.microsoft.com/en-us/ef/core/get-started/overview/first-app
      - title: Migrations overview
        url: https://learn.microsoft.com/en-us/ef/core/managing-schemas/migrations/
      - title: SQLite EF Core database provider
        url: https://learn.microsoft.com/en-us/ef/core/providers/sqlite/

  - id: crud
    stage: data-api
    title:
      en: "Update, delete, filter and page"
      tr: "Güncelleme, silme, süzme ve sayfalama"
    minutes: 60
    needs: [database]
    why:
      en: "A real API lets clients change and remove data too, and a list that returns everything stops working once there are thousands of rows. Filtering and paging let a client ask for just what it needs."
      tr: "Gerçek bir API istemcilerin veriyi değiştirmesine ve silmesine de izin verir; her şeyi döndüren bir liste de binlerce satır olunca çalışmaz hale gelir. Süzme ve sayfalama istemcinin sadece ihtiyacı olanı istemesini sağlar."
    learn:
      en: |
        - **PUT** replaces a todo, **DELETE** removes it; unknown ids answer 404
        - **Query string** values (`?done=true&page=2`) become method parameters
        - EF Core builds one SQL query from your `Where`, `Skip` and `Take`; nothing runs until `ToListAsync` or `CountAsync`
        - **Paging**: `Skip((page - 1) * pageSize).Take(pageSize)`, with a maximum page size so nobody asks for a million rows
        - `AsNoTracking()` makes read-only queries a little faster
      tr: |
        - **PUT** bir işi değiştirir, **DELETE** siler; bilinmeyen id 404 döner
        - **Query string** değerleri (`?done=true&page=2`) metot parametresi olur
        - EF Core `Where`, `Skip` ve `Take` çağrılarından tek bir SQL sorgusu üretir; `ToListAsync` ya da `CountAsync`'e kadar hiçbir şey çalışmaz
        - **Sayfalama**: `Skip((page - 1) * pageSize).Take(pageSize)`; kimse milyon satır istemesin diye en büyük sayfa boyutuyla
        - `AsNoTracking()` sadece okuyan sorguları biraz hızlandırır
    do:
      en: |
        1. Add the new records at the end of `src/TodoApi/Todo.cs` (code below).
        2. In `src/TodoApi/Program.cs` replace the list route with the new one, and add the PUT and DELETE routes before `app.Run();` (code below).
        3. Restart the app, create three todos, then try the curl commands below: update, filter, search, page, delete.
        4. Try a bad id (`/todos/77`) and an empty title on PUT: you should get 404 and 400.
        5. Commit: `git add .` and `git commit -m "Add update, delete, filter and paging"`.
      tr: |
        1. Yeni record'ları `src/TodoApi/Todo.cs` sonuna ekle (aşağıdaki kod).
        2. `src/TodoApi/Program.cs` içinde liste rotasını yenisiyle değiştir ve PUT ile DELETE rotalarını `app.Run();` satırından önce ekle (aşağıdaki kod).
        3. Uygulamayı yeniden başlat, üç iş oluştur, sonra aşağıdaki curl komutlarını dene: güncelleme, süzme, arama, sayfalama, silme.
        4. Kötü bir id (`/todos/77`) ve PUT'ta boş başlık dene: 404 ve 400 almalısın.
        5. Commit et: `git add .` ve `git commit -m "Add update, delete, filter and paging"`.
    code:
      - file: src/TodoApi/Todo.cs (add at the end)
        lang: cs
        text: |
          // What the API accepts when someone changes a todo.
          public record UpdateTodo(
              [Required, StringLength(100, MinimumLength = 1)] string Title,
              bool IsDone);

          // One page of results plus the numbers a client needs to ask for the next page.
          public record Page<T>(IReadOnlyList<T> Items, int PageNumber, int PageSize, int Total);
      - file: src/TodoApi/Program.cs (replace the GET list route)
        lang: cs
        text: |
          todos.MapGet("/", async (TodoDb db, bool? done, string? search, int page = 1, int pageSize = 20) =>
          {
              page = Math.Max(page, 1);
              pageSize = Math.Clamp(pageSize, 1, 100);

              // Build the query step by step; nothing runs until ToListAsync / CountAsync.
              var query = db.Todos.AsNoTracking();
              if (done is { } d)
                  query = query.Where(t => t.IsDone == d);
              if (!string.IsNullOrWhiteSpace(search))
                  query = query.Where(t => EF.Functions.Like(t.Title, $"%{search}%"));

              var total = await query.CountAsync();
              var items = await query
                  .OrderBy(t => t.Id)
                  .Skip((page - 1) * pageSize)
                  .Take(pageSize)
                  .ToListAsync();

              return new Page<TodoDto>(items.Select(TodoDto.From).ToList(), page, pageSize, total);
          });
      - file: src/TodoApi/Program.cs (add before app.Run())
        lang: cs
        text: |
          todos.MapPut("/{id:int}", async (int id, UpdateTodo input, TodoDb db) =>
          {
              var todo = await db.Todos.FindAsync(id);
              if (todo is null) return Results.NotFound();

              todo.Title = input.Title.Trim();
              todo.IsDone = input.IsDone;
              await db.SaveChangesAsync();
              return Results.Ok(TodoDto.From(todo));
          });

          todos.MapDelete("/{id:int}", async (int id, TodoDb db) =>
          {
              var deleted = await db.Todos.Where(t => t.Id == id).ExecuteDeleteAsync();
              return deleted == 0 ? Results.NotFound() : Results.NoContent();
          });
