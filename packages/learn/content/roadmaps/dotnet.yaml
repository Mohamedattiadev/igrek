  - id: cache
    stage: performance
    title:
      en: "Make it faster: output caching and async habits"
      tr: "Hızlandırma: output caching ve async alışkanlıkları"
    minutes: 45
    needs: [auth]
    why:
      en: "The fastest answer is one you do not compute again. If many visitors ask the same question (here: how many todos exist?), the server can keep the answer for a short time. The hard part of caching is not storing, it is throwing the answer away when the data changes."
      tr: "En hızlı cevap tekrar hesaplamadığın cevaptır. Çok ziyaretçi aynı soruyu soruyorsa (burada: kaç iş var?) sunucu cevabı kısa süre tutabilir. Cache'in zor kısmı saklamak değil, veri değişince cevabı atmaktır."
    learn:
      en: |
        - **Output caching** stores a whole response in memory and serves it again until it expires
        - A **policy** names the rules (here: 30 seconds); a **tag** lets you remove all entries of a group at once with `EvictByTagAsync`
        - By default output caching **skips responses to authenticated requests** and responses that set cookies, because they are per user. That is why the cached route here is public and the same for everyone
        - `UseOutputCache()` must come after `UseAuthentication()` and `UseAuthorization()`
        - The cache lives in this process: after a restart it is empty, and two servers would each have their own copy
        - Other habits that speed things up: async all the way (no `.Result`), paging (already done), `AsNoTracking()` on read-only queries (already done), and measuring before guessing
      tr: |
        - **Output caching** bir cevabın tamamını bellekte saklar ve süresi dolana kadar yeniden sunar
        - **Policy** kuralları adlandırır (burada: 30 saniye); **tag** bir grubun tüm kayıtlarını `EvictByTagAsync` ile tek seferde silmeni sağlar
        - Output caching varsayılan olarak **kimliği doğrulanmış isteklerin cevaplarını** ve cookie koyan cevapları **atlar**, çünkü bunlar kullanıcıya özeldir. Bu yüzden buradaki cache'lenen rota herkese açık ve herkes için aynı
        - `UseOutputCache()`, `UseAuthentication()` ve `UseAuthorization()` çağrılarından sonra gelmeli
        - Cache bu process'te yaşar: yeniden başlatınca boştur ve iki sunucunun her birinin kendi kopyası olur
        - Hızlandıran diğer alışkanlıklar: baştan sona async (`.Result` yok), sayfalama (yaptık), sadece okuyan sorgularda `AsNoTracking()` (yaptık) ve tahmin etmeden önce ölçmek
    do:
      en: |
        1. Add the `Stats` record at the end of `Todo.cs` (code below).
        2. In `Program.cs`: add the `using`, register the cache policy before `Build()`, add `UseOutputCache()` after `UseAuthorization()`, and add the public `/stats` route (code below).
        3. In the POST, PUT and DELETE routes add `IOutputCacheStore cache` to the parameters and call `await cache.EvictByTagAsync("stats", default);` after the change is saved (shown for POST).
        4. Start the app. Call `/stats` twice and compare `generatedAt`: it is the same, so the second answer came from the cache. Create a todo (with your token) and call `/stats` again: `generatedAt` is new.
        5. Add the test below to `TodoEndpointsTests.cs` and run `dotnet test`: `Passed: 8`. The test calls `/stats` without a token on purpose.
        6. Commit: `git add .` and `git commit -m "Cache the public stats route"`.
      tr: |
        1. `Stats` record'unu `Todo.cs` sonuna ekle (aşağıdaki kod).
        2. `Program.cs` içinde: `using` satırını ekle, cache policy'sini `Build()` öncesinde kaydet, `UseAuthorization()` sonrasına `UseOutputCache()` ekle ve herkese açık `/stats` rotasını ekle (aşağıdaki kod).
        3. POST, PUT ve DELETE rotalarında parametrelere `IOutputCacheStore cache` ekle ve değişiklik kaydedildikten sonra `await cache.EvictByTagAsync("stats", default);` çağır (POST için gösterildi).
        4. Uygulamayı başlat. `/stats` rotasını iki kez çağır ve `generatedAt` değerlerini karşılaştır: aynı; yani ikinci cevap cache'ten geldi. (Token'ınla) bir iş oluştur ve `/stats` rotasını yeniden çağır: `generatedAt` yeni.
        5. Aşağıdaki testi `TodoEndpointsTests.cs` dosyasına ekle ve `dotnet test` çalıştır: `Passed: 8`. Test `/stats` rotasını bilerek token'sız çağırır.
        6. Commit et: `git add .` ve `git commit -m "Cache the public stats route"`.
    code:
      - file: src/TodoApi/Todo.cs (add at the end)
        lang: cs
        text: |
          // Public numbers about the whole service, the same for every visitor.
          public record Stats(int Todos, int Done, int Users, DateTimeOffset GeneratedAt);
      - file: src/TodoApi/Program.cs (the new and changed parts)
        lang: cs
        text: |
          // at the top
          using Microsoft.AspNetCore.OutputCaching;

          // before var app = builder.Build();
          builder.Services.AddOutputCache(options =>
              options.AddPolicy("stats", policy => policy.Expire(TimeSpan.FromSeconds(30)).Tag("stats")));

          // after app.UseAuthorization();
          app.UseOutputCache();

          // next to the "/" route
          // Anyone can read this, and it is the same for everyone, so it is a good fit for the cache.
          // Without the cache, every request would count the whole table again.
          app.MapGet("/stats", async (TodoDb db) => new Stats(
                  await db.Todos.CountAsync(),
                  await db.Todos.CountAsync(t => t.IsDone),
                  await db.Users.CountAsync(),
                  DateTimeOffset.UtcNow))
              .CacheOutput("stats");

          // the POST route now forgets the old copy after saving (do the same in PUT and DELETE)
          todos.MapPost("/", async (CreateTodo input, ClaimsPrincipal user, TodoDb db, IOutputCacheStore cache) =>
          {
              var todo = new Todo
              {
                  Title = input.Title.Trim(),
                  OwnerId = user.FindFirstValue(ClaimTypes.NameIdentifier)!,
              };
              db.Todos.Add(todo);
              await db.SaveChangesAsync();
              await cache.EvictByTagAsync("stats", default);   // the numbers changed: forget the old copy
              return Results.Created($"/todos/{todo.Id}", TodoDto.From(todo));
          });
      - file: tests/TodoApi.Tests/TodoEndpointsTests.cs (add at the end)
        lang: cs
        text: |
          public class StatsTests(ApiFactory factory) : IClassFixture<ApiFactory>
          {
              [Fact]
              public async Task Stats_are_cached_until_a_todo_changes()
              {
                  var visitor = factory.CreateClient();   // no token: the cache skips requests that carry one
                  var client = await factory.CreateLoggedInClientAsync();

                  var first = await visitor.GetFromJsonAsync<Stats>("/stats");
                  var second = await visitor.GetFromJsonAsync<Stats>("/stats");
                  Assert.Equal(first!.GeneratedAt, second!.GeneratedAt);   // the second answer came from the cache

                  await client.PostAsJsonAsync("/todos", new { title = "Evict the cache" });

                  var third = await visitor.GetFromJsonAsync<Stats>("/stats");
                  Assert.True(third!.GeneratedAt > first.GeneratedAt);     // the cache was emptied, so it was rebuilt
                  Assert.Equal(first.Todos + 1, third.Todos);
              }
          }
    mistakes:
      - problem:
          en: "Calling `/stats` with your token and seeing a new `generatedAt` every time."
          tr: "`/stats` rotasını token'ınla çağırıp her seferinde yeni bir `generatedAt` görmek."
        fix:
          en: "That is the default rule at work: responses to authenticated requests are not served from the output cache. Call it without the header (or in the browser) to see caching."
          tr: "Bu varsayılan kural: kimliği doğrulanmış isteklerin cevapları output cache'ten sunulmaz. Cache'i görmek için başlıksız çağır (ya da tarayıcıda aç)."
      - problem:
          en: "Showing old numbers after changes, or caching per-user data."
          tr: "Değişikliklerden sonra eski sayıları göstermek ya da kullanıcıya özel veriyi cache'lemek."
        fix:
          en: "Evict by tag whenever the data changes, keep the expiry short, and only cache answers that are the same for everybody. Never put per-user data behind a shared cache key."
          tr: "Veri her değiştiğinde tag ile temizle, süreyi kısa tut ve sadece herkes için aynı olan cevapları cache'le. Kullanıcıya özel veriyi asla paylaşılan bir cache anahtarının arkasına koyma."
    quiz:
      - q:
          en: "Why is `/stats` a good route to cache but `/todos` is not?"
          tr: "`/stats` neden cache'lenecek iyi bir rota, `/todos` neden değil?"
        options:
          en:
            - "`/stats` is shorter"
            - "`/stats` is the same for every visitor, while `/todos` differs per user"
            - "`/todos` cannot return JSON"
          tr:
            - "`/stats` daha kısa"
            - "`/stats` her ziyaretçi için aynı, `/todos` ise kullanıcıya göre değişiyor"
            - "`/todos` JSON döndüremez"
        answer: 1
        why:
          en: "A cache key is the URL. If two users shared the key of `/todos`, one could receive the other's data."
          tr: "Cache anahtarı URL'dir. İki kullanıcı `/todos` anahtarını paylaşsaydı biri diğerinin verisini alabilirdi."
    sources:
      - title: Output caching middleware in ASP.NET Core
        url: https://learn.microsoft.com/en-us/aspnet/core/performance/caching/output
      - title: ASP.NET Core best practices
        url: https://learn.microsoft.com/en-us/aspnet/core/fundamentals/best-practices

  - id: docker
    stage: packaging
    title:
      en: "Package the API: dotnet publish and a Docker image"
      tr: "API'yi paketleme: dotnet publish ve bir Docker image'ı"
    minutes: 60
    needs: [cache]
    why:
      en: "The code works on your machine because your machine has .NET, the right packages and the right files. A server has none of that. `dotnet publish` collects exactly what must run, and a Docker image wraps it together with the .NET runtime into one box that starts the same way everywhere."
      tr: "Kod senin makinende çalışıyor, çünkü makinende .NET, doğru paketler ve doğru dosyalar var. Bir sunucuda bunların hiçbiri yok. `dotnet publish` çalışması gereken şeyleri toplar; Docker image'ı da onu .NET runtime ile birlikte, her yerde aynı şekilde başlayan tek bir kutuya koyar."
    learn:
      en: |
        - `dotnet publish -c Release -o out` builds an optimized version and copies everything needed into `out`. Deploy what `publish` makes, never the output of `build`
        - **Image** = the recipe and files, **container** = a running copy of an image
        - A **multi-stage Dockerfile**: the big SDK image builds the app, the small ASP.NET image only runs it
        - Copying the `.csproj` and running `restore` first lets Docker cache the package download between builds
        - ASP.NET images listen on port **8080** (not 80) and have a ready-made non-root user; hosts that set `PORT` are handled by the three lines you add to `Program.cs`
        - A container's disk is temporary, so SQLite lives in `/tmp` and its data is lost when the container is replaced
        - Alternative with no Dockerfile: the .NET SDK can build an image itself with `dotnet publish -t:PublishContainer`
      tr: |
        - `dotnet publish -c Release -o out` optimize edilmiş bir sürüm üretir ve gereken her şeyi `out` klasörüne kopyalar. `publish`'in ürettiğini deploy et, `build` çıktısını asla
        - **Image** = tarif ve dosyalar, **container** = bir image'ın çalışan kopyası
        - **Çok aşamalı Dockerfile**: büyük SDK image'ı uygulamayı derler, küçük ASP.NET image'ı sadece çalıştırır
        - `.csproj` dosyasını kopyalayıp önce `restore` çalıştırmak, Docker'ın paket indirmesini build'ler arasında cache'lemesini sağlar
        - ASP.NET image'ları **8080** portunu dinler (80'i değil) ve hazır, root olmayan bir kullanıcıya sahiptir; `PORT` ayarlayan sunucuları `Program.cs`'e ekleyeceğin üç satır halleder
        - Container'ın diski geçicidir; bu yüzden SQLite `/tmp` içinde yaşar ve container değiştirilince verisi kaybolur
        - Dockerfile'sız alternatif: .NET SDK `dotnet publish -t:PublishContainer` ile kendisi image üretebilir
    do:
      en: |
        1. Publish once by hand and look at the result: `dotnet publish src/TodoApi -c Release -o out`, then `dotnet out/TodoApi.dll`. This is what a server would run. Stop it with Ctrl+C. Delete the `out` folder and add the line `out/` to `.gitignore`.
        2. Add the three `PORT` lines near the top of `src/TodoApi/Program.cs`, right after `CreateBuilder` (code below).
        3. Install Docker (Docker Desktop on Windows and macOS, free for personal use and learning; Docker Engine on Linux) and check `docker --version`. No Docker? Read on and skip the local run: the host in the next step builds the image for you.
        4. Create `Dockerfile` and `.dockerignore` in the `todo` folder (code below).
        5. Build and run: the commands below. Open http://localhost:8080/ and http://localhost:8080/stats.
        6. Stop with Ctrl+C (`--rm` removes the container). The data was in `/tmp` of that container, so a new `docker run` starts empty.
        7. Optional: the SDK route, `dotnet publish src/TodoApi -t:PublishContainer -p:ContainerRepository=todo-api` (Docker must be running). That image runs as a non-root user and cannot write to `/app`, so run it with `-e "ConnectionStrings__Todos=Data Source=/tmp/todos.db"`.
        8. Commit: `git add .` and `git commit -m "Add a Dockerfile"`.
      tr: |
        1. Bir kez elle publish et ve sonuca bak: `dotnet publish src/TodoApi -c Release -o out`, sonra `dotnet out/TodoApi.dll`. Bir sunucunun çalıştıracağı şey bu. Ctrl+C ile durdur. `out` klasörünü sil ve `.gitignore` dosyasına `out/` satırını ekle.
        2. `src/TodoApi/Program.cs` dosyasının başına, `CreateBuilder` satırının hemen altına üç `PORT` satırını ekle (aşağıdaki kod).
        3. Docker'ı kur (Windows ve macOS'ta Docker Desktop, kişisel kullanım ve öğrenme için ücretsiz; Linux'ta Docker Engine) ve `docker --version` ile kontrol et. Docker yok mu? Okumaya devam et ve yerel çalıştırmayı atla: sonraki adımdaki sunucu image'ı senin için derler.
        4. `todo` klasöründe `Dockerfile` ve `.dockerignore` dosyalarını oluştur (aşağıdaki kod).
        5. Build et ve çalıştır: aşağıdaki komutlar. http://localhost:8080/ ve http://localhost:8080/stats adreslerini aç.
        6. Ctrl+C ile durdur (`--rm` container'ı siler). Veri o container'ın `/tmp` klasöründeydi; bu yüzden yeni bir `docker run` boş başlar.
        7. İsteğe bağlı: SDK yolu, `dotnet publish src/TodoApi -t:PublishContainer -p:ContainerRepository=todo-api` (Docker çalışıyor olmalı). O image root olmayan bir kullanıcıyla çalışır ve `/app` içine yazamaz; bu yüzden `-e "ConnectionStrings__Todos=Data Source=/tmp/todos.db"` ile çalıştır.
        8. Commit et: `git add .` ve `git commit -m "Add a Dockerfile"`.
    code:
      - file: src/TodoApi/Program.cs (right after CreateBuilder)
        lang: cs
        text: |
          var builder = WebApplication.CreateBuilder(args);

          // Hosting services such as Render tell the app which port to listen on in the PORT variable.
          if (Environment.GetEnvironmentVariable("PORT") is { } port)
              builder.WebHost.UseUrls($"http://0.0.0.0:{port}");
      - file: Dockerfile
        lang: dockerfile
        text: |
          # Stage 1: build with the SDK image (big, has the compiler).
          FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
          WORKDIR /src
          # Copy only the project file first so Docker can cache the package restore.
          COPY src/TodoApi/TodoApi.csproj src/TodoApi/
          RUN dotnet restore src/TodoApi/TodoApi.csproj
          COPY src/TodoApi/ src/TodoApi/
          RUN dotnet publish src/TodoApi/TodoApi.csproj -c Release -o /app --no-restore

          # Stage 2: run with the small ASP.NET runtime image (no compiler).
          FROM mcr.microsoft.com/dotnet/aspnet:10.0
          WORKDIR /app
          COPY --from=build /app .
          # The container's disk is temporary, so the SQLite file lives in /tmp.
          ENV ConnectionStrings__Todos="Data Source=/tmp/todos.db"
          # Run as the non-root user that the image already provides.
          USER $APP_UID
          EXPOSE 8080
          ENTRYPOINT ["dotnet", "TodoApi.dll"]
      - file: .dockerignore
        lang: text
        text: |
          **/bin/
          **/obj/
          **/*.db
          **/*.db-shm
          **/*.db-wal
          .git/
          tests/
          scratch/
      - file: terminal
        lang: sh
        text: |
          dotnet publish src/TodoApi -c Release -o out
          dotnet out/TodoApi.dll
          # with Docker:
          docker build -t todo-api .
          docker run --rm -p 8080:8080 todo-api
    mistakes:
      - problem:
          en: "The app runs in the container but the browser cannot reach it."
          tr: "Uygulama container içinde çalışıyor ama tarayıcı ona ulaşamıyor."
        fix:
          en: "Publish the port: `-p 8080:8080` (host:container). The app inside listens on 8080, not 80."
          tr: "Portu yayınla: `-p 8080:8080` (host:container). İçerideki uygulama 80'i değil, 8080'i dinler."
      - problem:
          en: "\"unable to open database file\" inside the container."
          tr: "Container içinde \"unable to open database file\" hatası."
        fix:
          en: "The app runs as a non-root user and cannot write to `/app`. Keep the `ConnectionStrings__Todos` line in the Dockerfile so the database goes to `/tmp`. (Two underscores stand for the `:` in `ConnectionStrings:Todos`.)"
          tr: "Uygulama root olmayan bir kullanıcıyla çalışır ve `/app` içine yazamaz. Veritabanı `/tmp` içine gitsin diye Dockerfile'daki `ConnectionStrings__Todos` satırını koru. (İki alt çizgi, `ConnectionStrings:Todos` içindeki `:` yerine geçer.)"
      - problem:
          en: "Every build downloads all packages again and is slow."
          tr: "Her build bütün paketleri yeniden indiriyor ve yavaş."
        fix:
          en: "Keep the order: copy the `.csproj` and run `restore` first, copy the rest of the code after. Then Docker reuses the restore layer until the project file changes."
          tr: "Sırayı koru: önce `.csproj` dosyasını kopyala ve `restore` çalıştır, kodun geri kalanını sonra kopyala. O zaman Docker, proje dosyası değişene kadar restore katmanını yeniden kullanır."
    quiz:
      - q:
          en: "Why does the Dockerfile have two `FROM` lines?"
          tr: "Dockerfile'da neden iki `FROM` satırı var?"
        options:
          en:
            - "One is a backup in case the first fails"
            - "The first stage builds with the big SDK, the second image only runs the result and stays small"
            - "Docker needs two to start"
          tr:
            - "Biri, ilki başarısız olursa yedek"
            - "İlk aşama büyük SDK ile derler, ikinci image sadece sonucu çalıştırır ve küçük kalır"
            - "Docker'ın başlaması için iki tane gerekir"
        answer: 1
        why:
          en: "The compiler is only needed to build. Leaving it out of the final image makes the image smaller and gives an attacker less to work with."
          tr: "Derleyiciye sadece derlerken ihtiyaç var. Onu son image'a koymamak image'ı küçültür ve saldırgana daha az malzeme bırakır."
    sources:
      - title: dotnet publish
        url: https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet-publish
      - title: Containerize a .NET app with dotnet publish
        url: https://learn.microsoft.com/en-us/dotnet/core/containers/sdk-publish
      - title: Docker images for ASP.NET Core
        url: https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/docker/building-net-docker-images

  - id: deploy
    stage: deploy
    title:
      en: "Deploy free on Render"
      tr: "Render'da ücretsiz deploy"
    minutes: 90
    needs: [docker]
    why:
      en: "A deploy puts your API on a public address with HTTPS. Render builds your Dockerfile from GitHub and runs the container. Render has a free plan with real limits; read them below so nothing surprises you."
      tr: "Deploy, API'ni HTTPS'li herkese açık bir adrese koyar. Render Dockerfile'ını GitHub'dan build eder ve container'ı çalıştırır. Render'ın gerçek sınırları olan ücretsiz bir planı var; sürpriz yaşamamak için aşağıdakileri oku."
    learn:
      en: |
        - A **health check** is a cheap route (`/healthz`) that a platform calls to see that your program is alive
        - Hosts tell your program its port in the `PORT` environment variable (Render's default is 10000); your `Program.cs` already reads it
        - Render deploys from a GitHub repository, so your code must be pushed first
        - **Render free web service, limits from Render's docs (checked October 2026):** it spins down after 15 minutes without traffic and takes about a minute to wake up on the next request; its disk is temporary, so **the SQLite file is lost on every restart, redeploy or spin-down**; you get 750 free instance hours per month; free instances may be restarted at any time; and they cannot scale beyond one instance
        - So on the free plan this API is a demo whose data resets, and users must register again after a reset. For data that must stay you need a database outside the container, for example Render Postgres (a free one expires after 30 days), which also means switching the EF Core provider to Npgsql
        - Free services are not meant for production use
      tr: |
        - **Health check**, bir platformun programının canlı olduğunu görmek için çağırdığı ucuz bir rotadır (`/healthz`)
        - Barındırıcılar programına portunu `PORT` ortam değişkeninde söyler (Render'ın varsayılanı 10000); `Program.cs` bunu zaten okuyor
        - Render bir GitHub reposundan deploy eder; bu yüzden kodun önce push edilmiş olmalı
        - **Render ücretsiz web servisi, Render dokümanlarındaki sınırlar (Ekim 2026'da kontrol edildi):** 15 dakika trafik almazsa kapanır ve sonraki istekte uyanması yaklaşık bir dakika sürer; diski geçicidir, yani **SQLite dosyası her yeniden başlatmada, yeniden deploy'da ve kapanmada kaybolur**; ayda 750 ücretsiz instance saati verilir; ücretsiz instance'lar her an yeniden başlatılabilir; ve tek instance'tan fazlasına ölçeklenemez
        - Yani ücretsiz planda bu API, verisi sıfırlanan bir demodur ve sıfırlanınca kullanıcıların yeniden kayıt olması gerekir. Kalması gereken veri için container'ın dışında bir veritabanı gerekir; örneğin Render Postgres (ücretsiz olan 30 gün sonra sona erer). Bu, EF Core sağlayıcısını Npgsql'e çevirmek demektir
        - Ücretsiz servisler üretim kullanımı için değildir
    do:
      en: |
        1. Add the health check (code below): one line in the services and one route. Start the app and open http://localhost:5080/healthz: it says `Healthy`. Run `dotnet test` once more.
        2. Check `.gitignore` has the `*.db*` and `out/` lines, then commit: `git add .` and `git commit -m "Add a health check"`.
        3. Create an empty repository on github.com (for example `todo-api`; no README), then connect and push (first commands below, with your own address).
        4. Go to render.com and sign in with GitHub. Choose *New → Web Service* and pick your repository. Render finds the `Dockerfile`; choose Docker as the language and **Free** as the instance type. In the *Advanced* section set the **Health Check Path** to `/healthz`. Create the service. The first build takes several minutes.
        5. When the log says the service is live, open `https://<name>.onrender.com/` and `/stats`, then try register, login and the todo routes with curl, replacing `http://localhost:5080` with your address.
        6. Wait 15 minutes without a request and open it again: the first answer is slow (the spin-up) and your user and todos are gone (the temporary disk). Both are the free plan's limits, not bugs.
      tr: |
        1. Health check'i ekle (aşağıdaki kod): servislerde bir satır ve bir rota. Uygulamayı başlat ve http://localhost:5080/healthz adresini aç: `Healthy` yazar. `dotnet test` komutunu bir kez daha çalıştır.
        2. `.gitignore` dosyasında `*.db*` ve `out/` satırlarının olduğunu kontrol et, sonra commit et: `git add .` ve `git commit -m "Add a health check"`.
        3. github.com'da boş bir repo oluştur (örneğin `todo-api`; README olmadan), sonra bağla ve push et (aşağıdaki ilk komutlar, kendi adresinle).
        4. render.com'a git ve GitHub ile giriş yap. *New → Web Service*'i seç ve repo'nu seç. Render `Dockerfile`'ı bulur; dil olarak Docker'ı, instance tipi olarak **Free**'yi seç. *Advanced* bölümünde **Health Check Path** değerini `/healthz` yap. Servisi oluştur. İlk build birkaç dakika sürer.
        5. Log servisin canlı olduğunu söyleyince `https://<ad>.onrender.com/` ve `/stats` adreslerini aç, sonra kayıt, giriş ve iş rotalarını `http://localhost:5080` yerine kendi adresini koyarak curl ile dene.
        6. 15 dakika istek göndermeden bekle ve yeniden aç: ilk cevap yavaştır (uyanma) ve kullanıcın ile işlerin yok olmuştur (geçici disk). İkisi de ücretsiz planın sınırlarıdır, hata değil.
    code:
      - file: src/TodoApi/Program.cs (health check)
        lang: cs
        text: |
          // before var app = builder.Build();
          builder.Services.AddHealthChecks();

          // next to the "/" route
          // A cheap route that hosting platforms call to see that the app is alive.
          app.MapHealthChecks("/healthz");
      - file: terminal
        lang: sh
        text: |
          git branch -M main
          git remote add origin https://github.com/YOUR-NAME/todo-api.git
          git push -u origin main
    mistakes:
      - problem:
          en: "The deploy fails with a port error, or the service never turns healthy."
          tr: "Deploy bir port hatasıyla başarısız oluyor ya da servis hiç sağlıklı olmuyor."
        fix:
          en: "The app must listen on `0.0.0.0` and the port in `PORT`. Keep the `PORT` lines in `Program.cs`. Check that the Health Check Path is exactly `/healthz`."
          tr: "Uygulama `0.0.0.0` adresini ve `PORT` içindeki portu dinlemeli. `Program.cs` içindeki `PORT` satırlarını koru. Health Check Path değerinin tam olarak `/healthz` olduğunu kontrol et."
      - problem:
          en: "The first request after a break takes a minute, or the users and todos have vanished."
          tr: "Moladan sonraki ilk istek bir dakika sürüyor ya da kullanıcılar ve işler kaybolmuş."
        fix:
          en: "That is the free plan: it spins down after 15 minutes without traffic and its disk is temporary. Register again. For data that stays, use an external database."
          tr: "Bu ücretsiz plan: 15 dakika trafik olmazsa kapanır ve diski geçicidir. Yeniden kayıt ol. Kalıcı veri için dış bir veritabanı kullan."
      - problem:
          en: "Committing `todos.db` or `bin`/`obj` folders to GitHub."
          tr: "`todos.db` ya da `bin`/`obj` klasörlerini GitHub'a commit etmek."
        fix:
          en: "Keep them in `.gitignore`. If already committed, run `git rm -r --cached <path>` and commit again."
          tr: "Onları `.gitignore` içinde tut. Zaten commit edildiyse `git rm -r --cached <yol>` çalıştır ve yeniden commit et."
    quiz:
      - q:
          en: "Your todos disappear after the free Render service wakes from sleep. Why?"
          tr: "Ücretsiz Render servisi uykudan uyanınca işlerin kayboluyor. Neden?"
        options:
          en:
            - "Render deletes accounts that are idle"
            - "The container's disk is temporary and the SQLite file lives on it"
            - "The code has a bug in the DELETE route"
          tr:
            - "Render boştaki hesapları siler"
            - "Container'ın diski geçicidir ve SQLite dosyası onun üzerinde"
            - "Kodun DELETE rotasında bir hata var"
        answer: 1
        why:
          en: "Render's docs say the free filesystem is ephemeral: local files are lost on restart, redeploy or spin-down."
          tr: "Render dokümanlarına göre ücretsiz dosya sistemi geçicidir: yerel dosyalar yeniden başlatmada, yeniden deploy'da ve kapanmada kaybolur."
    sources:
      - title: Render free instances
        url: https://render.com/docs/free
      - title: Render web services (ports and binding)
        url: https://render.com/docs/web-services
      - title: Render deploys and auto-deploy
        url: https://render.com/docs/deploys

  - id: logs
    stage: monitoring
    title:
      en: "Logging and health checks you can trust"
      tr: "Güvenebileceğin loglar ve sağlık kontrolleri"
    minutes: 45
    needs: [deploy]
    why:
      en: "When something breaks on a server you cannot attach a debugger; you read logs. Good logs say what happened and to whom, in a form a tool can search. A good health check says not only \"the process runs\" but also \"the database answers\"."
      tr: "Bir sunucuda bir şey bozulunca debugger bağlayamazsın; logları okursun. İyi loglar neyin kime olduğunu, bir aracın arayabileceği biçimde söyler. İyi bir health check sadece \"process çalışıyor\" değil, \"veritabanı cevap veriyor\" da der."
    learn:
      en: |
        - `ILogger<T>` is injected like any service; levels are Trace, Debug, Information, Warning, Error, Critical
        - **Structured logging**: write `logger.LogInformation("Created todo {TodoId}", id)` with named holes, not `$"..."`. The values stay separate fields, so tools can filter by `TodoId`
        - **JSON console** logging prints one JSON object per line, which hosts and log tools understand
        - Log levels are set per category in `appsettings.json`; EF Core is very chatty at Information, so this roadmap sets it to Warning
        - **Liveness** (`/healthz`: the process answers) and **readiness** (`/readyz`: its dependencies work too) are different questions. A platform should restart on liveness failures, not because a database blinked
        - Never log passwords, tokens or other secrets
      tr: |
        - `ILogger<T>` her servis gibi enjekte edilir; seviyeler Trace, Debug, Information, Warning, Error, Critical
        - **Structured logging**: `$"..."` değil, isimli boşluklarla `logger.LogInformation("Created todo {TodoId}", id)` yaz. Değerler ayrı alan olarak kalır, böylece araçlar `TodoId` ile süzebilir
        - **JSON console** logu her satıra bir JSON nesnesi basar; barındırıcılar ve log araçları bunu anlar
        - Log seviyeleri `appsettings.json` içinde kategori başına ayarlanır; EF Core Information seviyesinde çok konuşkandır, bu yüzden bu yol haritası onu Warning yapar
        - **Liveness** (`/healthz`: process cevap veriyor) ve **readiness** (`/readyz`: bağımlılıkları da çalışıyor) farklı sorulardır. Bir platform liveness başarısızlığında yeniden başlatmalı, bir veritabanı göz kırptı diye değil
        - Şifre, token ya da başka sır asla loglama
    do:
      en: |
        1. Add the health check package for EF Core (first block).
        2. Change `Program.cs` as shown below: JSON logs outside development, a database check tagged `ready`, `/healthz` that runs no checks, a new `/readyz` that runs the `ready` ones, and a log line when a todo is created.
        3. In `appsettings.json` add `"Microsoft.EntityFrameworkCore": "Warning"` to `LogLevel`.
        4. Add the test below to the tests and run `dotnet test`: `Passed: 10`.
        5. Start the app with `dotnet run --project src/TodoApi --no-launch-profile --urls http://localhost:5080`. Plain `dotnet run` uses the Development settings from `launchSettings.json`, which print readable text logs; `--no-launch-profile` gives the Production behaviour. Create a todo and find the JSON line with your `TodoId` in the terminal.
        6. Push to GitHub. After Render redeploys, open the service's *Logs* page and find the same line. Keep the health check path at `/healthz`: it must not depend on the database.
        7. Commit: `git add .` and `git commit -m "Add structured logs and a readiness check"`.
      tr: |
        1. EF Core için health check paketini ekle (ilk blok).
        2. `Program.cs` dosyasını aşağıdaki gibi değiştir: geliştirme dışında JSON loglar, `ready` etiketli bir veritabanı kontrolü, hiç kontrol çalıştırmayan `/healthz`, `ready` olanları çalıştıran yeni bir `/readyz` ve bir iş oluşturulunca bir log satırı.
        3. `appsettings.json` içinde `LogLevel` bölümüne `"Microsoft.EntityFrameworkCore": "Warning"` ekle.
        4. Aşağıdaki testi testlere ekle ve `dotnet test` çalıştır: `Passed: 10`.
        5. Uygulamayı `dotnet run --project src/TodoApi --no-launch-profile --urls http://localhost:5080` ile başlat. Düz `dotnet run`, `launchSettings.json` içindeki Development ayarlarını kullanır ve okunaklı metin loglar basar; `--no-launch-profile` Production davranışını verir. Bir iş oluştur ve terminalde `TodoId` değerini taşıyan JSON satırını bul.
        6. GitHub'a push et. Render yeniden deploy edince servisin *Logs* sayfasını aç ve aynı satırı bul. Health check path değeri `/healthz` kalsın: veritabanına bağlı olmamalı.
        7. Commit et: `git add .` ve `git commit -m "Add structured logs and a readiness check"`.
    code:
      - file: terminal
        lang: sh
        text: |
          dotnet package add Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore --project src/TodoApi
      - file: src/TodoApi/Program.cs (the changed parts)
        lang: cs
        text: |
          // at the top
          using Microsoft.AspNetCore.Diagnostics.HealthChecks;

          // right after CreateBuilder
          // One JSON object per log line outside development: easy for log tools to search and filter.
          if (!builder.Environment.IsDevelopment())
              builder.Logging.AddJsonConsole();

          // replaces builder.Services.AddHealthChecks();
          // "alive" needs no checks; "ready" also proves that the database answers.
          builder.Services.AddHealthChecks()
              .AddDbContextCheck<TodoDb>("database", tags: ["ready"]);

          // replaces app.MapHealthChecks("/healthz");
          app.MapHealthChecks("/healthz", new HealthCheckOptions { Predicate = _ => false });
          app.MapHealthChecks("/readyz", new HealthCheckOptions { Predicate = check => check.Tags.Contains("ready") });

          // the POST route logs what happened, with named values
          todos.MapPost("/", async (CreateTodo input, ClaimsPrincipal user, TodoDb db, IOutputCacheStore cache, ILogger<Program> logger) =>
          {
              var todo = new Todo
              {
                  Title = input.Title.Trim(),
                  OwnerId = user.FindFirstValue(ClaimTypes.NameIdentifier)!,
              };
              db.Todos.Add(todo);
              await db.SaveChangesAsync();
              await cache.EvictByTagAsync("stats", default);
              logger.LogInformation("Created todo {TodoId} for user {UserId}", todo.Id, todo.OwnerId);
              return Results.Created($"/todos/{todo.Id}", TodoDto.From(todo));
          });
      - file: src/TodoApi/appsettings.json
        lang: json
        text: |
          {
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning",
                "Microsoft.EntityFrameworkCore": "Warning"
              }
            },
            "AllowedHosts": "*",
            "ConnectionStrings": {
              "Todos": "Data Source=todos.db"
            }
          }
      - file: tests/TodoApi.Tests/TodoEndpointsTests.cs (add at the end)
        lang: cs
        text: |
          public class HealthTests(ApiFactory factory) : IClassFixture<ApiFactory>
          {
              [Theory]
              [InlineData("/healthz")]
              [InlineData("/readyz")]
              public async Task Health_routes_return_200(string path)
              {
                  var response = await factory.CreateClient().GetAsync(path);

                  Assert.Equal(HttpStatusCode.OK, response.StatusCode);
              }
          }
    mistakes:
      - problem:
          en: "Logging with string interpolation: `logger.LogInformation($\"Created {todo.Id}\")`."
          tr: "String interpolation ile loglamak: `logger.LogInformation($\"Created {todo.Id}\")`."
        fix:
          en: "Use a template with named holes and pass the values as arguments: `LogInformation(\"Created todo {TodoId}\", todo.Id)`. Then the id stays a searchable field."
          tr: "İsimli boşluklu bir şablon kullan ve değerleri argüman olarak geç: `LogInformation(\"Created todo {TodoId}\", todo.Id)`. O zaman id aranabilir bir alan olarak kalır."
      - problem:
          en: "Pointing the platform's health check at `/readyz`, so a short database problem makes it restart your app again and again."
          tr: "Platformun health check'ini `/readyz` adresine yöneltmek; böylece kısa bir veritabanı sorunu uygulamanı tekrar tekrar yeniden başlattırır."
        fix:
          en: "Use the cheap liveness route `/healthz` for restarts. Use `/readyz` for dashboards or for deciding whether to send traffic."
          tr: "Yeniden başlatmalar için ucuz liveness rotası `/healthz` kullan. `/readyz` rotasını panolar için ya da trafik gönderilip gönderilmeyeceğine karar vermek için kullan."
      - problem:
          en: "Logging request bodies, tokens or passwords while debugging and forgetting to remove it."
          tr: "Debug ederken istek gövdelerini, token'ları ya da şifreleri loglayıp silmeyi unutmak."
        fix:
          en: "Logs are copied to many places and kept for a long time. Log ids and counts, never secrets."
          tr: "Loglar birçok yere kopyalanır ve uzun süre saklanır. Id'leri ve sayıları logla, sırları asla."
    quiz:
      - q:
          en: "Why write `LogInformation(\"Created todo {TodoId}\", id)` instead of `LogInformation($\"Created todo {id}\")`?"
          tr: "`LogInformation($\"Created todo {id}\")` yerine neden `LogInformation(\"Created todo {TodoId}\", id)` yazıyoruz?"
        options:
          en:
            - "It is shorter"
            - "The id stays a separate field that log tools can search and filter"
            - "The second form does not compile"
          tr:
            - "Daha kısa"
            - "Id ayrı bir alan olarak kalır ve log araçları onu arayıp süzebilir"
            - "İkinci biçim derlenmez"
        answer: 1
        why:
          en: "A template keeps the message and the values apart. With interpolation everything is merged into one text."
          tr: "Şablon mesajı ve değerleri ayrı tutar. Interpolation'da her şey tek bir metne karışır."
    sources:
      - title: Health checks in ASP.NET Core
        url: https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/health-checks
      - title: Logging in .NET
        url: https://learn.microsoft.com/en-us/dotnet/core/extensions/logging
      - title: Logging in ASP.NET Core
        url: https://learn.microsoft.com/en-us/aspnet/core/fundamentals/logging/

  - id: ci
    stage: advanced
    title:
      en: "Run the tests on every push with GitHub Actions"
      tr: "GitHub Actions ile her push'ta testleri çalıştırma"
    minutes: 40
    needs: [logs]
    why:
      en: "Tests only help if they run. A GitHub Actions workflow runs `dotnet test` on a clean machine for every push and pull request, so a broken change is noticed in minutes, and Render can wait for it before it deploys."
      tr: "Testler ancak çalışırsa işe yarar. GitHub Actions workflow'u her push ve pull request için temiz bir makinede `dotnet test` çalıştırır; böylece bozuk bir değişiklik dakikalar içinde fark edilir ve Render deploy etmeden önce onu bekleyebilir."
    learn:
      en: |
        - A **workflow** is a YAML file in `.github/workflows/`; it runs on events such as `push`
        - A **runner** is the clean machine GitHub starts for each run (`ubuntu-latest`)
        - Steps: get the code (`actions/checkout`), install .NET (`actions/setup-dotnet`), run `dotnet test`
        - GitHub Actions is free for public repositories; private repositories get a monthly amount of free minutes
        - Render can deploy **after CI checks pass** instead of on every commit
      tr: |
        - **Workflow**, `.github/workflows/` içindeki bir YAML dosyasıdır; `push` gibi olaylarda çalışır
        - **Runner**, GitHub'ın her çalıştırma için başlattığı temiz makinedir (`ubuntu-latest`)
        - Adımlar: kodu al (`actions/checkout`), .NET'i kur (`actions/setup-dotnet`), `dotnet test` çalıştır
        - GitHub Actions herkese açık repolar için ücretsizdir; özel repolara aylık belli bir ücretsiz dakika verilir
        - Render her commit'te değil, **CI kontrolleri geçtikten sonra** deploy edebilir
    do:
      en: |
        1. Create the file `.github/workflows/ci.yml` with the code below (the folder names must be exact, including the dot).
        2. Commit and push: `git add .`, `git commit -m "Add CI"`, `git push`.
        3. On github.com open your repository's *Actions* tab. The workflow should turn green after a minute or two. Click it to read the log of each step.
        4. Break a test on purpose, push, and watch the run turn red. Fix it and push again.
        5. In Render, open your service's *Settings*, find *Auto-Deploy* and choose *After CI Checks Pass*, so a red commit is never deployed.
      tr: |
        1. Aşağıdaki kodla `.github/workflows/ci.yml` dosyasını oluştur (klasör adları, noktası dahil, tam olarak aynı olmalı).
        2. Commit et ve push et: `git add .`, `git commit -m "Add CI"`, `git push`.
        3. github.com'da reponun *Actions* sekmesini aç. Workflow bir iki dakika sonra yeşile dönmeli. Her adımın logunu okumak için üzerine tıkla.
        4. Bir testi bilerek boz, push et ve çalıştırmanın kırmızıya döndüğünü izle. Düzelt ve yeniden push et.
        5. Render'da servisinin *Settings* sayfasını aç, *Auto-Deploy* ayarını bul ve *After CI Checks Pass*'i seç; böylece kırmızı bir commit asla deploy edilmez.
    code:
      - file: .github/workflows/ci.yml
        lang: yaml
        text: |
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-dotnet@v6
                  with:
                    dotnet-version: 10.0.x
                - run: dotnet test --configuration Release
    mistakes:
      - problem:
          en: "The workflow does not appear in the Actions tab."
          tr: "Workflow Actions sekmesinde görünmüyor."
        fix:
          en: "The file must be exactly at `.github/workflows/ci.yml` on the branch you pushed, and the YAML must be valid (indentation uses spaces, never tabs)."
          tr: "Dosya, push ettiğin branch'te tam olarak `.github/workflows/ci.yml` yolunda olmalı ve YAML geçerli olmalı (girinti boşlukla yapılır, asla tab ile)."
      - problem:
          en: "Tests pass on your machine but fail in CI."
          tr: "Testler senin makinende geçiyor ama CI'da kalıyor."
        fix:
          en: "CI starts from a clean checkout, so anything that only exists on your machine is missing: ignored files, a local database, environment variables. Make the tests create everything they need, as `ApiFactory` does."
          tr: "CI temiz bir checkout ile başlar; bu yüzden sadece senin makinende olan her şey eksiktir: yok sayılan dosyalar, yerel bir veritabanı, ortam değişkenleri. Testlerin ihtiyaç duyduğu her şeyi kendisi oluşturmasını sağla, `ApiFactory`'nin yaptığı gibi."
    quiz:
      - q:
          en: "What is the main benefit of running tests in CI instead of only on your machine?"
          tr: "Testleri sadece kendi makinende değil CI'da çalıştırmanın ana faydası nedir?"
        options:
          en:
            - "CI makes the code run faster in production"
            - "Every change is checked on a clean machine, automatically, before it is deployed"
            - "You no longer need to write tests"
          tr:
            - "CI kodu üretimde daha hızlı çalıştırır"
            - "Her değişiklik, deploy edilmeden önce temiz bir makinede otomatik kontrol edilir"
            - "Artık test yazmana gerek kalmaz"
        answer: 1
        why:
          en: "Nobody has to remember to run the tests, and \"it works on my machine\" problems show up at once."
          tr: "Testleri çalıştırmayı kimsenin hatırlaması gerekmez ve \"bende çalışıyor\" sorunları hemen ortaya çıkar."
    sources:
      - title: Building and testing .NET (GitHub Actions)
        url: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-net
      - title: actions/setup-dotnet
        url: https://github.com/actions/setup-dotnet
      - title: Render deploys and auto-deploy
        url: https://render.com/docs/deploys
