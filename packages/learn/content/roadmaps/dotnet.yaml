  - id: tests
    stage: testing
    title:
      en: "Test the API with xUnit and WebApplicationFactory"
      tr: "API'yi xUnit ve WebApplicationFactory ile test etme"
    minutes: 75
    needs: [crud]
    why:
      en: "Tests are programs that check your program. They catch the break you did not notice, and they let you change code later without fear. `WebApplicationFactory` starts your whole API in memory, so a test sends real HTTP requests without a port and without you typing curl."
      tr: "Test, programını kontrol eden programlardır. Fark etmediğin bozulmayı yakalar ve sonra korkmadan kod değiştirmeni sağlar. `WebApplicationFactory` tüm API'ni bellekte başlatır; böylece bir test, port açmadan ve curl yazmana gerek kalmadan gerçek HTTP istekleri gönderir."
    learn:
      en: |
        - **xUnit**: a method with `[Fact]` is one test; `Assert.Equal` compares what you got with what you expected
        - An **integration test** runs the real app and checks the whole path: route, validation, database
        - `WebApplicationFactory<Program>` starts the app; `CreateClient()` gives an `HttpClient` that talks to it
        - Each test run should use its own throw-away database, never your real `todos.db`
        - `IClassFixture` shares one started app between the tests of a class, so tests must not depend on an empty database
      tr: |
        - **xUnit**: `[Fact]` taşıyan bir metot tek bir testtir; `Assert.Equal` aldığınla beklediğini karşılaştırır
        - **Integration test** gerçek uygulamayı çalıştırır ve bütün yolu kontrol eder: rota, doğrulama, veritabanı
        - `WebApplicationFactory<Program>` uygulamayı başlatır; `CreateClient()` onunla konuşan bir `HttpClient` verir
        - Her test çalıştırması kendi geçici veritabanını kullanmalı, asla gerçek `todos.db` dosyanı değil
        - `IClassFixture` bir class'ın testleri arasında başlatılmış tek bir uygulamayı paylaştırır; bu yüzden testler boş bir veritabanına güvenmemeli
    do:
      en: |
        1. Create the test project, add it to the solution, point it at the API project and add the testing package (first block). The template gives you xUnit. Delete the sample file `tests/TodoApi.Tests/UnitTest1.cs`.
        2. Add the last two lines to `src/TodoApi/Program.cs` (code below). Top-level `Program` is hidden from other projects; this line makes it visible to the test project.
        3. Create `tests/TodoApi.Tests/ApiFactory.cs` and `tests/TodoApi.Tests/TodoEndpointsTests.cs` with the code below. `ApiFactory` gives each test class a new database file in the temp folder and removes it at the end.
        4. Run all tests from the `todo` folder: `dotnet test`. You should see `Passed! ... Passed: 5`.
        5. Break the API on purpose (for example return 200 instead of 201 in the POST route) and run `dotnet test` again. Read the failure message, then fix it.
        6. Commit: `git add .` and `git commit -m "Add API tests"`.
      tr: |
        1. Test projesini oluştur, solution'a ekle, API projesine bağla ve test paketini ekle (ilk blok). Şablon sana xUnit'i verir. Örnek dosya `tests/TodoApi.Tests/UnitTest1.cs` dosyasını sil.
        2. `src/TodoApi/Program.cs` dosyasının sonuna son iki satırı ekle (aşağıdaki kod). Top-level `Program` diğer projelerden gizlidir; bu satır onu test projesine görünür yapar.
        3. Aşağıdaki kodla `tests/TodoApi.Tests/ApiFactory.cs` ve `tests/TodoApi.Tests/TodoEndpointsTests.cs` dosyalarını oluştur. `ApiFactory` her test class'ına geçici klasörde yeni bir veritabanı dosyası verir ve sonunda siler.
        4. `todo` klasöründen tüm testleri çalıştır: `dotnet test`. `Passed! ... Passed: 5` görmelisin.
        5. API'yi bilerek boz (örneğin POST rotasında 201 yerine 200 döndür) ve `dotnet test` komutunu yeniden çalıştır. Hata mesajını oku, sonra düzelt.
        6. Commit et: `git add .` ve `git commit -m "Add API tests"`.
    code:
      - file: terminal
        lang: sh
        text: |
          dotnet new xunit -o tests/TodoApi.Tests
          dotnet sln add tests/TodoApi.Tests
          dotnet reference add src/TodoApi --project tests/TodoApi.Tests
          dotnet package add Microsoft.AspNetCore.Mvc.Testing --project tests/TodoApi.Tests
          dotnet test
      - file: src/TodoApi/Program.cs (add at the very end)
        lang: cs
        text: |

          // Lets the test project start the whole app (WebApplicationFactory<Program>).
          public partial class Program;
      - file: tests/TodoApi.Tests/ApiFactory.cs
        lang: cs
        text: |
          using Microsoft.AspNetCore.Hosting;
          using Microsoft.AspNetCore.Mvc.Testing;

          // Starts the real app in memory, but on its own throw-away database file.
          public class ApiFactory : WebApplicationFactory<Program>
          {
              private readonly string _dbFile = Path.Combine(Path.GetTempPath(), $"todo-test-{Guid.NewGuid():N}.db");

              protected override void ConfigureWebHost(IWebHostBuilder builder)
              {
                  builder.UseSetting("ConnectionStrings:Todos", $"Data Source={_dbFile};Pooling=False");
              }

              protected override void Dispose(bool disposing)
              {
                  base.Dispose(disposing);
                  if (disposing && File.Exists(_dbFile)) File.Delete(_dbFile);
              }
          }
      - file: tests/TodoApi.Tests/TodoEndpointsTests.cs
        lang: cs
        text: |
          using System.Net;
          using System.Net.Http.Json;

          public class TodoEndpointsTests(ApiFactory factory) : IClassFixture<ApiFactory>
          {
              private readonly HttpClient _client = factory.CreateClient();

              [Fact]
              public async Task Create_returns_201_and_the_todo_can_be_read_back()
              {
                  var response = await _client.PostAsJsonAsync("/todos", new { title = "  Buy milk  " });

                  Assert.Equal(HttpStatusCode.Created, response.StatusCode);
                  var created = await response.Content.ReadFromJsonAsync<TodoDto>();
                  Assert.NotNull(created);
                  Assert.Equal("Buy milk", created.Title);       // trimmed
                  Assert.False(created.IsDone);

                  var fetched = await _client.GetFromJsonAsync<TodoDto>($"/todos/{created.Id}");
                  Assert.Equal(created.Id, fetched?.Id);
              }

              [Fact]
              public async Task Create_with_an_empty_title_returns_400()
              {
                  var response = await _client.PostAsJsonAsync("/todos", new { title = "" });

                  Assert.Equal(HttpStatusCode.BadRequest, response.StatusCode);
              }

              [Fact]
              public async Task Unknown_id_returns_404()
              {
                  var response = await _client.GetAsync("/todos/999999");

                  Assert.Equal(HttpStatusCode.NotFound, response.StatusCode);
              }

              [Fact]
              public async Task Update_then_filter_by_done()
              {
                  var created = await (await _client.PostAsJsonAsync("/todos", new { title = "Write tests" }))
                      .Content.ReadFromJsonAsync<TodoDto>();

                  var put = await _client.PutAsJsonAsync($"/todos/{created!.Id}", new { title = "Write tests", isDone = true });
                  Assert.Equal(HttpStatusCode.OK, put.StatusCode);

                  var done = await _client.GetFromJsonAsync<Page<TodoDto>>("/todos?done=true&search=Write tests");
                  Assert.Contains(done!.Items, t => t.Id == created.Id);
              }

              [Fact]
              public async Task Delete_removes_the_todo()
              {
                  var created = await (await _client.PostAsJsonAsync("/todos", new { title = "Temporary" }))
                      .Content.ReadFromJsonAsync<TodoDto>();

                  var delete = await _client.DeleteAsync($"/todos/{created!.Id}");
                  var again = await _client.GetAsync($"/todos/{created.Id}");

                  Assert.Equal(HttpStatusCode.NoContent, delete.StatusCode);
                  Assert.Equal(HttpStatusCode.NotFound, again.StatusCode);
              }
          }
    mistakes:
      - problem:
          en: "Error CS0122: 'Program' is inaccessible due to its protection level."
          tr: "CS0122 hatası: 'Program' is inaccessible due to its protection level."
        fix:
          en: "Add `public partial class Program;` at the end of `src/TodoApi/Program.cs`."
          tr: "`src/TodoApi/Program.cs` sonuna `public partial class Program;` ekle."
      - problem:
          en: "Tests pass alone but fail together, or fill your real `todos.db`."
          tr: "Testler tek tek geçiyor ama birlikte kalıyor, ya da gerçek `todos.db` dosyanı dolduruyor."
        fix:
          en: "Tests in a class share one database. Create unique data per test (unique titles, ids you just got back) and never count on an empty table. Always override the connection string in the factory, as shown."
          tr: "Bir class'taki testler tek veritabanını paylaşır. Her test için benzersiz veri oluştur (benzersiz başlıklar, az önce geri aldığın id'ler) ve boş bir tabloya güvenme. Connection string'i gösterildiği gibi her zaman factory içinde değiştir."
      - problem:
          en: "Testing only the happy path."
          tr: "Sadece mutlu yolu test etmek."
        fix:
          en: "Bugs live in the unhappy paths: the empty title, the unknown id. Write a test for each answer you promise (400, 404), as above."
          tr: "Hatalar mutsuz yollarda yaşar: boş başlık, bilinmeyen id. Yukarıdaki gibi vaat ettiğin her cevap (400, 404) için bir test yaz."
    quiz:
      - q:
          en: "Why does `ApiFactory` use a different database file for tests?"
          tr: "`ApiFactory` testler için neden farklı bir veritabanı dosyası kullanıyor?"
        options:
          en:
            - "SQLite only allows one file per computer"
            - "So tests never touch your real data and start from a clean state"
            - "To make the tests slower on purpose"
          tr:
            - "SQLite bilgisayar başına tek dosyaya izin verir"
            - "Testler gerçek verine hiç dokunmasın ve temiz bir durumdan başlasın diye"
            - "Testleri bilerek yavaşlatmak için"
        answer: 1
        why:
          en: "A test that changes your real data is dangerous and its result depends on what happens to be saved. A fresh file makes every run repeatable."
          tr: "Gerçek verini değiştiren bir test tehlikelidir ve sonucu kayıtlı olana bağlıdır. Yeni bir dosya her çalıştırmayı tekrarlanabilir yapar."
    sources:
      - title: Integration tests in ASP.NET Core
        url: https://learn.microsoft.com/en-us/aspnet/core/test/integration-tests
      - title: Getting started with xUnit.net (v2)
        url: https://xunit.net/docs/getting-started/v2/getting-started

  - id: auth
    stage: security
    title:
      en: "Register, log in and protect each user's todos"
      tr: "Kayıt, giriş ve her kullanıcının işlerini koruma"
    minutes: 90
    needs: [tests]
    why:
      en: "Right now anyone can read and delete everybody's todos. Authentication answers \"who are you?\" and authorization answers \"what may you do?\". ASP.NET Core Identity stores users and password hashes for you, and its API endpoints give you register and login routes without writing them."
      tr: "Şu an herkes herkesin işlerini okuyabilir ve silebilir. Kimlik doğrulama (authentication) \"sen kimsin?\" sorusunu, yetkilendirme (authorization) \"ne yapabilirsin?\" sorusunu cevaplar. ASP.NET Core Identity kullanıcıları ve şifre hash'lerini senin için saklar; API endpoint'leri de register ve login rotalarını yazmadan verir."
    learn:
      en: |
        - **Never store a password.** Identity stores a salted **hash** (a one-way scramble), so even you cannot read it back
        - `AddIdentityApiEndpoints<IdentityUser>()` plus `MapIdentityApi` give `/auth/register`, `/auth/login` and `/auth/refresh`. Login returns a **bearer token** that the client sends in the `Authorization: Bearer <token>` header
        - These tokens are opaque (protected by the framework), not JWTs. They are fine for learning and small apps; bigger systems often use an external identity provider and JWTs (`AddJwtBearer`)
        - `RequireAuthorization()` answers **401** to anyone without a valid token
        - Checking who owns a row matters as much as logging in: each query filters by the user's id, so one user can never see another's data
        - The default password rules: at least 6 characters with a digit, a lower-case letter, an upper-case letter and a symbol
      tr: |
        - **Şifreyi asla saklama.** Identity tuzlanmış bir **hash** (tek yönlü karıştırma) saklar; sen bile geri okuyamazsın
        - `AddIdentityApiEndpoints<IdentityUser>()` ve `MapIdentityApi` `/auth/register`, `/auth/login` ve `/auth/refresh` rotalarını verir. Login, istemcinin `Authorization: Bearer <token>` başlığında göndereceği bir **bearer token** döndürür
        - Bu token'lar JWT değil, çerçevenin koruduğu opak token'lardır. Öğrenmek ve küçük uygulamalar için uygundur; büyük sistemler çoğunlukla dış bir kimlik sağlayıcı ve JWT kullanır (`AddJwtBearer`)
        - `RequireAuthorization()` geçerli token'ı olmayan herkese **401** döner
        - Bir satırın sahibini kontrol etmek giriş yapmak kadar önemlidir: her sorgu kullanıcının id'siyle süzülür; böylece bir kullanıcı başkasının verisini asla göremez
        - Varsayılan şifre kuralları: en az 6 karakter; bir rakam, bir küçük harf, bir büyük harf ve bir sembol
    do:
      en: |
        1. Stop the app. Add the Identity package (first block).
        2. Replace `TodoDb.cs` so the context also holds users, add `OwnerId` to the `Todo` class, and replace `Program.cs` with the code below. Every route now reads the user's id from the token and filters by it.
        3. Make a migration that adds the user tables and the owner column (first block, last command). `Migrate()` will apply it on start. If you have old todos from before, they get an empty owner and nobody sees them; delete `src/TodoApi/todos.db*` first for a clean start.
        4. Start the app and try the flow with curl (second block): `/todos` without a token gives 401, register, log in (copy the `accessToken` from the answer), then call `/todos` with the header.
        5. Update the tests: replace `ApiFactory.cs` and `TodoEndpointsTests.cs` with the new versions. Every test now gets its own freshly registered and logged-in user, and two new tests check the 401 and that users cannot see each other's data.
        6. Run `dotnet test`: `Passed: 7`.
        7. Commit: `git add .` and `git commit -m "Add Identity login and per-user todos"`.
      tr: |
        1. Uygulamayı durdur. Identity paketini ekle (ilk blok).
        2. `TodoDb.cs` dosyasını kullanıcıları da tutacak şekilde değiştir, `Todo` class'ına `OwnerId` ekle ve `Program.cs` dosyasını aşağıdaki kodla değiştir. Her rota artık kullanıcının id'sini token'dan okur ve onunla süzer.
        3. Kullanıcı tablolarını ve sahip sütununu ekleyen bir migration oluştur (ilk blok, son komut). `Migrate()` onu başlarken uygular. Daha önceden kalan işlerin varsa sahibi boş olur ve kimse onları görmez; temiz bir başlangıç için önce `src/TodoApi/todos.db*` dosyalarını sil.
        4. Uygulamayı başlat ve akışı curl ile dene (ikinci blok): token'sız `/todos` 401 verir; kayıt ol, giriş yap (cevaptaki `accessToken` değerini kopyala), sonra `/todos` rotasını başlıkla çağır.
        5. Testleri güncelle: `ApiFactory.cs` ve `TodoEndpointsTests.cs` dosyalarını yeni sürümlerle değiştir. Her test artık kendi yeni kayıtlı ve giriş yapmış kullanıcısını alır; iki yeni test 401'i ve kullanıcıların birbirinin verisini görememesini kontrol eder.
        6. `dotnet test` çalıştır: `Passed: 7`.
        7. Commit et: `git add .` ve `git commit -m "Add Identity login and per-user todos"`.
    code:
      - file: terminal (package and migration)
        lang: sh
        text: |
          dotnet package add Microsoft.AspNetCore.Identity.EntityFrameworkCore --project src/TodoApi
          dotnet tool run dotnet-ef migrations add AddIdentityAndOwner --project src/TodoApi
      - file: src/TodoApi/TodoDb.cs
        lang: cs
        text: |
          using Microsoft.AspNetCore.Identity;
          using Microsoft.AspNetCore.Identity.EntityFrameworkCore;
          using Microsoft.EntityFrameworkCore;

          // IdentityDbContext adds the tables for users and their passwords next to our Todos table.
          public class TodoDb(DbContextOptions<TodoDb> options) : IdentityDbContext<IdentityUser>(options)
          {
              public DbSet<Todo> Todos => Set<Todo>();
          }
      - file: src/TodoApi/Todo.cs (the Todo class)
        lang: cs
        text: |
          public class Todo
          {
              public int Id { get; set; }
              public required string Title { get; set; }
              public bool IsDone { get; set; }
              public string OwnerId { get; set; } = "";   // the Id of the user who owns this todo
              public DateTimeOffset CreatedAt { get; set; } = DateTimeOffset.UtcNow;
          }
      - file: src/TodoApi/Program.cs
        lang: cs
        text: |
          using System.Security.Claims;
          using Microsoft.AspNetCore.Identity;
          using Microsoft.EntityFrameworkCore;

          var builder = WebApplication.CreateBuilder(args);

          builder.Services.AddValidation();
          builder.Services.AddDbContext<TodoDb>((sp, options) =>
              options.UseSqlite(sp.GetRequiredService<IConfiguration>().GetConnectionString("Todos")));

          builder.Services.AddAuthorization();
          builder.Services.AddIdentityApiEndpoints<IdentityUser>()
              .AddEntityFrameworkStores<TodoDb>();

          var app = builder.Build();

          app.UseAuthentication();
          app.UseAuthorization();

          // Create the database file and bring its tables up to date every time the app starts.
          using (var scope = app.Services.CreateScope())
          {
              scope.ServiceProvider.GetRequiredService<TodoDb>().Database.Migrate();
          }

          app.MapGet("/", () => "Todo API is running");

          // /auth/register, /auth/login and /auth/refresh are written by the framework.
          app.MapGroup("/auth").MapIdentityApi<IdentityUser>();

          // Every route in this group needs a logged-in user.
          var todos = app.MapGroup("/todos").RequireAuthorization();

          todos.MapGet("/", async (ClaimsPrincipal user, TodoDb db, bool? done, string? search, int page = 1, int pageSize = 20) =>
          {
              page = Math.Max(page, 1);
              pageSize = Math.Clamp(pageSize, 1, 100);

              // Build the query step by step; nothing runs until ToListAsync / CountAsync.
              var ownerId = user.FindFirstValue(ClaimTypes.NameIdentifier);
              var query = db.Todos.AsNoTracking().Where(t => t.OwnerId == ownerId);
              if (done is { } d)
                  query = query.Where(t => t.IsDone == d);
              if (!string.IsNullOrWhiteSpace(search))
                  query = query.Where(t => EF.Functions.Like(t.Title, $"%{search}%"));

              var total = await query.CountAsync();
              var items = await query
                  .OrderBy(t => t.Id)
                  .Skip((page - 1) * pageSize)
                  .Take(pageSize)
                  .ToListAsync();

              return new Page<TodoDto>(items.Select(TodoDto.From).ToList(), page, pageSize, total);
          });

          todos.MapGet("/{id:int}", async (int id, ClaimsPrincipal user, TodoDb db) =>
          {
              var ownerId = user.FindFirstValue(ClaimTypes.NameIdentifier);
              var todo = await db.Todos.AsNoTracking().FirstOrDefaultAsync(t => t.Id == id && t.OwnerId == ownerId);
              return todo is null ? Results.NotFound() : Results.Ok(TodoDto.From(todo));
          });

          todos.MapPost("/", async (CreateTodo input, ClaimsPrincipal user, TodoDb db) =>
          {
              var todo = new Todo
              {
                  Title = input.Title.Trim(),
                  OwnerId = user.FindFirstValue(ClaimTypes.NameIdentifier)!,
              };
              db.Todos.Add(todo);
              await db.SaveChangesAsync();
              return Results.Created($"/todos/{todo.Id}", TodoDto.From(todo));
          });

          todos.MapPut("/{id:int}", async (int id, UpdateTodo input, ClaimsPrincipal user, TodoDb db) =>
          {
              var ownerId = user.FindFirstValue(ClaimTypes.NameIdentifier);
              var todo = await db.Todos.FirstOrDefaultAsync(t => t.Id == id && t.OwnerId == ownerId);
              if (todo is null) return Results.NotFound();

              todo.Title = input.Title.Trim();
              todo.IsDone = input.IsDone;
              await db.SaveChangesAsync();
              return Results.Ok(TodoDto.From(todo));
          });

          todos.MapDelete("/{id:int}", async (int id, ClaimsPrincipal user, TodoDb db) =>
          {
              var ownerId = user.FindFirstValue(ClaimTypes.NameIdentifier);
              var deleted = await db.Todos.Where(t => t.Id == id && t.OwnerId == ownerId).ExecuteDeleteAsync();
              return deleted == 0 ? Results.NotFound() : Results.NoContent();
          });

          app.Run();

          // Lets the test project start the whole app (WebApplicationFactory<Program>).
          public partial class Program;
