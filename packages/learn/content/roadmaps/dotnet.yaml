      - file: tests/TodoApi.Tests/ApiFactory.cs
        lang: cs
        text: |
          using System.Net.Http.Headers;
          using System.Net.Http.Json;
          using Microsoft.AspNetCore.Hosting;
          using Microsoft.AspNetCore.Mvc.Testing;

          // Starts the real app in memory, but on its own throw-away database file.
          public class ApiFactory : WebApplicationFactory<Program>
          {
              private readonly string _dbFile = Path.Combine(Path.GetTempPath(), $"todo-test-{Guid.NewGuid():N}.db");

              protected override void ConfigureWebHost(IWebHostBuilder builder)
              {
                  builder.UseSetting("ConnectionStrings:Todos", $"Data Source={_dbFile};Pooling=False");
              }

              // A client that is already registered and logged in as a brand-new user.
              public async Task<HttpClient> CreateLoggedInClientAsync()
              {
                  var client = CreateClient();
                  var login = new { email = $"{Guid.NewGuid():N}@example.com", password = "Passw0rd!" };

                  (await client.PostAsJsonAsync("/auth/register", login)).EnsureSuccessStatusCode();
                  var response = await client.PostAsJsonAsync("/auth/login", login);
                  response.EnsureSuccessStatusCode();

                  var tokens = await response.Content.ReadFromJsonAsync<LoginResponse>();
                  client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", tokens!.AccessToken);
                  return client;
              }

              protected override void Dispose(bool disposing)
              {
                  base.Dispose(disposing);
                  if (disposing && File.Exists(_dbFile)) File.Delete(_dbFile);
              }
          }

          public record LoginResponse(string AccessToken, string RefreshToken);
      - file: tests/TodoApi.Tests/TodoEndpointsTests.cs
        lang: cs
        text: |
          using System.Net;
          using System.Net.Http.Json;

          public class TodoEndpointsTests : IClassFixture<ApiFactory>, IAsyncLifetime
          {
              private readonly ApiFactory _factory;
              private HttpClient _client = null!;

              public TodoEndpointsTests(ApiFactory factory) => _factory = factory;

              // xUnit calls this before every test: each test gets its own new, logged-in user.
              public async Task InitializeAsync() => _client = await _factory.CreateLoggedInClientAsync();

              public Task DisposeAsync() => Task.CompletedTask;

              [Fact]
              public async Task Create_returns_201_and_the_todo_can_be_read_back()
              {
                  var response = await _client.PostAsJsonAsync("/todos", new { title = "  Buy milk  " });

                  Assert.Equal(HttpStatusCode.Created, response.StatusCode);
                  var created = await response.Content.ReadFromJsonAsync<TodoDto>();
                  Assert.NotNull(created);
                  Assert.Equal("Buy milk", created.Title);       // trimmed
                  Assert.False(created.IsDone);

                  var fetched = await _client.GetFromJsonAsync<TodoDto>($"/todos/{created.Id}");
                  Assert.Equal(created.Id, fetched?.Id);
              }

              [Fact]
              public async Task Create_with_an_empty_title_returns_400()
              {
                  var response = await _client.PostAsJsonAsync("/todos", new { title = "" });

                  Assert.Equal(HttpStatusCode.BadRequest, response.StatusCode);
              }

              [Fact]
              public async Task Unknown_id_returns_404()
              {
                  var response = await _client.GetAsync("/todos/999999");

                  Assert.Equal(HttpStatusCode.NotFound, response.StatusCode);
              }

              [Fact]
              public async Task Update_then_filter_by_done()
              {
                  var created = await (await _client.PostAsJsonAsync("/todos", new { title = "Write tests" }))
                      .Content.ReadFromJsonAsync<TodoDto>();

                  var put = await _client.PutAsJsonAsync($"/todos/{created!.Id}", new { title = "Write tests", isDone = true });
                  Assert.Equal(HttpStatusCode.OK, put.StatusCode);

                  var done = await _client.GetFromJsonAsync<Page<TodoDto>>("/todos?done=true&search=Write tests");
                  Assert.Contains(done!.Items, t => t.Id == created.Id);
              }

              [Fact]
              public async Task Delete_removes_the_todo()
              {
                  var created = await (await _client.PostAsJsonAsync("/todos", new { title = "Temporary" }))
                      .Content.ReadFromJsonAsync<TodoDto>();

                  var delete = await _client.DeleteAsync($"/todos/{created!.Id}");
                  var again = await _client.GetAsync($"/todos/{created.Id}");

                  Assert.Equal(HttpStatusCode.NoContent, delete.StatusCode);
                  Assert.Equal(HttpStatusCode.NotFound, again.StatusCode);
              }
          }

          public class AuthTests(ApiFactory factory) : IClassFixture<ApiFactory>
          {
              [Fact]
              public async Task Todos_without_a_token_returns_401()
              {
                  var response = await factory.CreateClient().GetAsync("/todos");

                  Assert.Equal(HttpStatusCode.Unauthorized, response.StatusCode);
              }

              [Fact]
              public async Task A_user_cannot_see_another_users_todo()
              {
                  var ada = await factory.CreateLoggedInClientAsync();
                  var bob = await factory.CreateLoggedInClientAsync();

                  var created = await (await ada.PostAsJsonAsync("/todos", new { title = "Ada only" }))
                      .Content.ReadFromJsonAsync<TodoDto>();

                  var asBob = await bob.GetAsync($"/todos/{created!.Id}");

                  Assert.Equal(HttpStatusCode.NotFound, asBob.StatusCode);
              }
          }
    mistakes:
      - problem:
          en: "Every request answers 401 even with a token."
          tr: "Token olsa bile her istek 401 dönüyor."
        fix:
          en: "Send the header exactly as `Authorization: Bearer <token>` with one space, and use the `accessToken` value, not the refresh token. Tokens also expire (the login answer has `expiresIn` in seconds); log in again. Check that `UseAuthentication()` comes before `UseAuthorization()`."
          tr: "Başlığı tam olarak `Authorization: Bearer <token>` biçiminde, tek boşlukla gönder ve `accessToken` değerini kullan, refresh token'ı değil. Token'ların süresi de dolar (login cevabında saniye cinsinden `expiresIn` var); yeniden giriş yap. `UseAuthentication()` çağrısının `UseAuthorization()` öncesinde olduğunu kontrol et."
      - problem:
          en: "Looking a todo up by id only (`FindAsync(id)`), so any logged-in user can read or change anybody's todo."
          tr: "Bir işi sadece id ile aramak (`FindAsync(id)`); böylece giriş yapmış herkes herkesin işini okuyabilir ya da değiştirebilir."
        fix:
          en: "Always add the owner to the lookup (`t.Id == id && t.OwnerId == ownerId`), as the routes above do. A missing row and somebody else's row both answer 404."
          tr: "Aramaya her zaman sahibi de ekle (`t.Id == id && t.OwnerId == ownerId`); yukarıdaki rotalar böyle yapıyor. Olmayan satır da başkasının satırı da 404 döner."
      - problem:
          en: "Registration answers 400 with \"PasswordRequiresNonAlphanumeric\" or similar."
          tr: "Kayıt \"PasswordRequiresNonAlphanumeric\" gibi bir mesajla 400 dönüyor."
        fix:
          en: "The password breaks the default rules. Use something like `Passw0rd!` (a digit, lower and upper case, a symbol, 6+ characters)."
          tr: "Şifre varsayılan kuralları bozuyor. `Passw0rd!` gibi bir şey kullan (rakam, küçük ve büyük harf, sembol, 6+ karakter)."
    quiz:
      - q:
          en: "Why does Identity store a password hash instead of the password?"
          tr: "Identity neden şifreyi değil, şifrenin hash'ini saklıyor?"
        options:
          en:
            - "A hash takes less disk space"
            - "A hash cannot be turned back into the password, so a stolen database does not reveal passwords directly"
            - "Passwords are illegal to store"
          tr:
            - "Hash diskte daha az yer kaplar"
            - "Hash şifreye geri çevrilemez; çalınan bir veritabanı şifreleri doğrudan göstermez"
            - "Şifre saklamak yasa dışıdır"
        answer: 1
        why:
          en: "Login hashes the typed password and compares the two hashes. The real password is never kept anywhere."
          tr: "Giriş, yazılan şifreyi hash'ler ve iki hash'i karşılaştırır. Gerçek şifre hiçbir yerde tutulmaz."
