  - id: deploy
    stage: deploy
    title:
      en: "Deploy for free on Render"
      tr: "Render'da ücretsiz deploy"
    minutes: 45
    needs: [package]
    why:
      en: "An API on your laptop helps nobody. Render can build a Node.js project straight from a GitHub repository and give it a public https address, with a free web service plan that is fine for learning. It is important to know exactly what \"free\" means here, so you are not surprised."
      tr: "Laptopundaki bir API kimseye yardım etmez. Render, bir Node.js projesini doğrudan bir GitHub reposundan build edip ona herkese açık bir https adresi verebilir; öğrenmek için yeterli ücretsiz bir web servisi planı vardır. \"Ücretsiz\"in burada tam olarak ne demek olduğunu bilmek önemli, böylece şaşırmazsın."
    learn:
      en: |
        - Putting the project on GitHub, and what a build command and a start command are
        - Environment variables on the host: `TRUST_PROXY=1` (Render has one proxy in front of your app)
        - The free plan's limits, from Render's docs: the service spins down after 15 minutes without traffic and takes about a minute to wake up on the next request; the filesystem is ephemeral, so **a SQLite file is lost on every redeploy, restart and spin-down**; a workspace gets 750 free instance hours per month; free Postgres databases expire after 30 days; and Render says free instances are not for production
        - So the deployed Linkly is a demo: accounts and links disappear from time to time. Real data needs a database that lives outside the web service (a hosted Postgres) or a paid plan with a persistent disk
      tr: |
        - Projeyi GitHub'a koymak ve build komutu ile start komutunun ne olduğu
        - Host'taki ortam değişkenleri: `TRUST_PROXY=1` (Render'da uygulamanın önünde bir proxy var)
        - Ücretsiz planın sınırları, Render'ın dokümanından: servis 15 dakika trafik almazsa kapanır ve sonraki istekte uyanması yaklaşık bir dakika sürer; dosya sistemi geçicidir, yani **SQLite dosyası her redeploy'da, yeniden başlatmada ve kapanmada kaybolur**; bir workspace ayda 750 ücretsiz instance saati alır; ücretsiz Postgres veritabanları 30 gün sonra sona erer; ve Render ücretsiz instance'ların production için olmadığını söyler
        - Yani deploy edilen Linkly bir demodur: hesaplar ve bağlantılar zaman zaman kaybolur. Gerçek veri için web servisinin dışında yaşayan bir veritabanı (barındırılan bir Postgres) ya da kalıcı disk veren ücretli bir plan gerekir
    do:
      en: |
        1. Create an empty repository named `linkly` on github.com (no README), then push your project with the first commands below. Check with `git status` first that `node_modules`, `data.db` and `.env` are not listed as new files.
        2. Create a free account at render.com (sign in with GitHub) and click *New → Web Service*. Connect your `linkly` repository.
        3. Fill in the form: *Language*: Node. *Build Command*: `npm ci`. *Start Command*: `node src/server.js` (running node directly makes sure it receives the stop signal; the next step uses that). *Instance type*: **Free**.
        4. Under *Environment Variables* add `TRUST_PROXY` = `1` and `NODE_ENV` = `production`. In *Advanced*, set *Health Check Path* to `/health`.
        5. Click *Deploy*. Watch the logs until the service is live. Render gives you an address like `https://linkly-xxxx.onrender.com`; it already listens on the port Render sets in `PORT`.
        6. Test it from your laptop with the curl commands below (use your own address). The first request after a quiet period is slow: that is the spin-down.
        7. Optional: instead of the form, put the `render.yaml` below in the repository root and use *New → Blueprint*. It describes the same service as code.
        8. From now on every `git push` to `main` deploys a new version by itself.
      tr: |
        1. github.com'da `linkly` adında boş bir repo oluştur (README olmasın), sonra projeni aşağıdaki ilk komutlarla push et. Önce `git status` ile `node_modules`, `data.db` ve `.env`'in yeni dosya olarak listelenmediğini kontrol et.
        2. render.com'da ücretsiz bir hesap aç (GitHub ile giriş yap) ve *New → Web Service*'e tıkla. `linkly` reponu bağla.
        3. Formu doldur: *Language*: Node. *Build Command*: `npm ci`. *Start Command*: `node src/server.js` (node'u doğrudan çalıştırmak durdurma sinyalini aldığından emin olur; sonraki adım bunu kullanıyor). *Instance type*: **Free**.
        4. *Environment Variables* altına `TRUST_PROXY` = `1` ve `NODE_ENV` = `production` ekle. *Advanced* içinde *Health Check Path* alanını `/health` yap.
        5. *Deploy*'a tıkla. Servis canlı olana kadar log'ları izle. Render sana `https://linkly-xxxx.onrender.com` gibi bir adres verir; uygulama zaten Render'ın `PORT` içinde verdiği portu dinliyor.
        6. Aşağıdaki curl komutlarıyla laptopundan dene (kendi adresini kullan). Sessiz bir dönemden sonraki ilk istek yavaştır: kapanma budur.
        7. İsteğe bağlı: form yerine aşağıdaki `render.yaml` dosyasını repo köküne koy ve *New → Blueprint* kullan. Aynı servisi kod olarak tanımlar.
        8. Bundan sonra `main`'e her `git push` yeni bir sürümü kendiliğinden deploy eder.
    code:
      - file: terminal
        lang: sh
        text: |
          git status
          git remote add origin https://github.com/<your-user>/linkly.git
          git branch -M main
          git push -u origin main
      - file: render.yaml
        lang: yaml
        text: |
          services:
            - type: web
              name: linkly
              runtime: node
              plan: free
              buildCommand: npm ci
              startCommand: node src/server.js
              healthCheckPath: /health
              envVars:
                - key: NODE_ENV
                  value: production
                - key: TRUST_PROXY
                  value: "1"
      - file: terminal
        lang: sh
        text: |
          curl -i https://<your-service>.onrender.com/health

          curl -s -X POST https://<your-service>.onrender.com/auth/register \
            -H "content-type: application/json" \
            -d '{"email":"ada@example.com","password":"correct horse battery"}'
    mistakes:
      - problem:
          en: "The deploy fails with `Cannot find package 'express'` or similar."
          tr: "Deploy `Cannot find package 'express'` ya da benzeri bir hatayla başarısız oluyor."
        fix:
          en: "The build command did not install packages, or `package-lock.json` was not pushed. Build Command must be `npm ci` (or `npm install`) and the lock file must be in the repository."
          tr: "Build komutu paketleri kurmadı ya da `package-lock.json` push'lanmadı. Build Command `npm ci` (ya da `npm install`) olmalı ve lock dosyası repoda olmalı."
      - problem:
          en: "`No open ports detected` or the service never becomes live."
          tr: "`No open ports detected` hatası ya da servis hiç canlı olmuyor."
        fix:
          en: "The app must listen on the port from the `PORT` environment variable (the code does: `process.env.PORT`) and not only on `localhost`. Do not hard-code 3000."
          tr: "Uygulama `PORT` ortam değişkenindeki portu dinlemeli (kod bunu yapıyor: `process.env.PORT`) ve sadece `localhost`'u değil. 3000'i koda gömme."
      - problem:
          en: "Accounts and links are gone the next morning."
          tr: "Hesaplar ve bağlantılar ertesi sabah yok."
        fix:
          en: "That is the free plan: its filesystem is ephemeral, so the SQLite file is lost on spin-down and redeploy. It is a demo. For data that must stay, use a hosted Postgres, or a paid plan with a persistent disk."
          tr: "Bu ücretsiz plan: dosya sistemi geçici, bu yüzden SQLite dosyası kapanınca ve redeploy'da kaybolur. Bu bir demo. Kalması gereken veri için barındırılan bir Postgres ya da kalıcı diskli ücretli bir plan kullan."
    quiz:
      - q:
          en: "Why does the deployed Linkly lose its data from time to time?"
          tr: "Deploy edilen Linkly neden zaman zaman verisini kaybediyor?"
        options:
          en:
            - "SQLite deletes old rows by itself"
            - "A free Render web service has an ephemeral filesystem, so the database file is lost when it restarts, redeploys or spins down"
            - "Express clears its data every hour"
          tr:
            - "SQLite eski satırları kendiliğinden siler"
            - "Ücretsiz bir Render web servisinin dosya sistemi geçicidir, bu yüzden veritabanı dosyası yeniden başlayınca, redeploy'da ya da kapanınca kaybolur"
            - "Express verisini her saat temizler"
        answer: 1
        why:
          en: "Render's docs say changes to a free service's local filesystem, such as a SQLite database, are lost on redeploy, restart and spin-down."
          tr: "Render'ın dokümanı, ücretsiz bir servisin yerel dosya sistemindeki değişikliklerin, örneğin bir SQLite veritabanının, redeploy'da, yeniden başlatmada ve kapanmada kaybolduğunu söyler."
    sources:
      - title: "Render: Free instances and their limits"
        url: https://render.com/docs/free
      - title: "Render: Web services"
        url: https://render.com/docs/web-services
      - title: "Render: Node.js version"
        url: https://render.com/docs/node-version

  - id: monitoring
    stage: monitoring
    title:
      en: "Logs, health checks and a clean shutdown"
      tr: "Log'lar, health check'ler ve düzgün kapanış"
    minutes: 50
    needs: [deploy]
    why:
      en: "When something breaks at night you only have what the app wrote down. Structured logs (one JSON line per request, with an id) let you find the failing request. A health check lets the host know when the app is really ready or broken, and a clean shutdown lets a deploy replace the old version without cutting requests in half."
      tr: "Gece bir şey bozulduğunda elinde sadece uygulamanın yazdıkları vardır. Yapılandırılmış log'lar (istek başına bir JSON satırı, bir id ile) hatalı isteği bulmanı sağlar. Health check host'a uygulamanın gerçekten hazır mı yoksa bozuk mu olduğunu söyler, düzgün kapanış da bir deploy'un eski sürümü istekleri ortadan kesmeden değiştirmesini sağlar."
    learn:
      en: |
        - Log to standard output, one JSON object per line; the host collects and shows it (in Render: the *Logs* tab)
        - A request id on every log line and in the `X-Request-Id` response header, so a user's report can be matched to a log line
        - Never log secrets: no passwords, no tokens, no `Authorization` header, no query strings
        - `/health` (is the process alive?) and `/ready` (can it do its job: is the database reachable?)
        - Graceful shutdown: on `SIGTERM` (what hosts send before stopping a service) stop accepting new connections, let running requests finish, close the database, exit
        - Let it crash: for an unexpected error it is often safest to exit and let the host start a fresh process, but log the reason first
      tr: |
        - Standart çıktıya log yaz, satır başına bir JSON nesnesi; host onu toplar ve gösterir (Render'da: *Logs* sekmesi)
        - Her log satırında ve `X-Request-Id` cevap header'ında bir istek id'si; böylece bir kullanıcının şikayeti bir log satırıyla eşleştirilebilir
        - Sırları asla loglama: şifre yok, token yok, `Authorization` header'ı yok, query string yok
        - `/health` (process yaşıyor mu?) ve `/ready` (işini yapabilir mi: veritabanına ulaşılabiliyor mu?)
        - Düzgün kapanış: `SIGTERM` gelince (host'ların bir servisi durdurmadan önce gönderdiği sinyal) yeni bağlantı kabul etmeyi bırak, çalışan istekleri bitir, veritabanını kapat, çık
        - Çökmeye izin ver: beklenmeyen bir hatada çoğu zaman çıkıp host'un yeni bir process başlatmasına izin vermek en güvenlisidir ama önce nedenini logla
    do:
      en: |
        1. Create `src/logger.js` with the code below.
        2. Replace `src/app.js` and `src/server.js`. Compare with the old `app.js`: `/ready` is new, the request logger sits right after the health routes, and the error handler logs the real error with the request id.
        3. Replace `tests/helpers.js` (tests now turn logging off with `log: false`) and add `tests/health.test.js`. Run `npm test`.
        4. Start the server with `npm run dev`, open a few links and watch the JSON lines. Check `curl -i localhost:3000/ready` and the `x-request-id` header.
        5. Test the clean shutdown: start it with `npm start` and press Ctrl+C. You should see the "shutting down" line and then the command returns.
        6. Commit and push: `git add .`, `git commit -m "Logs, readiness and graceful shutdown"`, `git push`. Render deploys it; open the *Logs* tab and find your request lines.
      tr: |
        1. Aşağıdaki kodla `src/logger.js` dosyasını oluştur.
        2. `src/app.js` ve `src/server.js` dosyalarını değiştir. Eski `app.js` ile karşılaştır: `/ready` yeni, istek logger'ı health route'larının hemen arkasında ve hata yakalayıcı gerçek hatayı istek id'siyle logluyor.
        3. `tests/helpers.js` dosyasını değiştir (testler artık `log: false` ile log'u kapatıyor) ve `tests/health.test.js` dosyasını ekle. `npm test` çalıştır.
        4. Sunucuyu `npm run dev` ile başlat, birkaç bağlantı aç ve JSON satırlarını izle. `curl -i localhost:3000/ready` ve `x-request-id` header'ını kontrol et.
        5. Düzgün kapanışı dene: `npm start` ile başlat ve Ctrl+C'ye bas. "shutting down" satırını görmeli, sonra komutun geri dönmesi gerekir.
        6. Commit'le ve push'la: `git add .`, `git commit -m "Logs, readiness and graceful shutdown"`, `git push`. Render deploy eder; *Logs* sekmesini aç ve istek satırlarını bul.
    code:
      - file: src/logger.js
        lang: js
        text: |
          import { randomUUID } from "node:crypto";

          // One JSON object per line on standard output; hosts collect and search these.
          export function logLine(level, fields) {
            const write = level === "error" ? console.error : console.log;
            write(JSON.stringify({ time: new Date().toISOString(), level, ...fields }));
          }

          // Middleware: gives every request an id and logs one line when the response is done.
          // It logs the path without the query string, and never headers or bodies (they may hold secrets).
          export function requestLogger(enabled = true) {
            return (req, res, next) => {
              req.id = randomUUID();
              res.set("X-Request-Id", req.id);
              const start = process.hrtime.bigint();
              res.on("finish", () => {
                if (!enabled) return;
                logLine("info", {
                  id: req.id,
                  method: req.method,
                  path: req.originalUrl.split("?")[0],
                  status: res.statusCode,
                  ms: Math.round(Number(process.hrtime.bigint() - start) / 1e5) / 10,
                });
              });
              next();
            };
          }
      - file: src/app.js
        lang: js
        text: |
          import express from "express";
          import helmet from "helmet";
          import { rateLimit } from "express-rate-limit";
          import { HttpError } from "./validate.js";
          import { accountsRouter } from "./accounts.js";
          import { createCache } from "./cache.js";
          import { linksRouter } from "./links.js";
          import { logLine, requestLogger } from "./logger.js";

          export function createApp(db, { requestsPerMinute = 300, authAttempts = 10, trustProxy = 0, log = true } = {}) {
            const app = express();
            const cache = createCache();
            const findLink = db.prepare("SELECT url FROM links WHERE code = ?");
            const countClick = db.prepare("UPDATE links SET clicks = clicks + 1 WHERE code = ?");

            if (trustProxy) app.set("trust proxy", trustProxy);

            app.use(helmet());

            // Alive: the process answers. Hosts call this; it is not rate limited and not logged.
            app.get("/health", (req, res) => {
              res.json({ status: "ok" });
            });

            // Ready: the app can really do its job, which needs the database.
            app.get("/ready", (req, res) => {
              try {
                db.prepare("SELECT 1").get();
                res.json({ status: "ready" });
              } catch {
                res.status(503).json({ status: "database unavailable" });
              }
            });

            app.use(requestLogger(log));

            app.use(
              rateLimit({
                windowMs: 60 * 1000,
                limit: requestsPerMinute,
                standardHeaders: true,
                legacyHeaders: false,
                message: { error: "too many requests" },
              }),
            );

            app.use(express.json({ limit: "10kb" }));

            const authLimit = rateLimit({
              windowMs: 15 * 60 * 1000,
              limit: authAttempts,
              standardHeaders: true,
              legacyHeaders: false,
              message: { error: "too many attempts, try again later" },
            });

            app.use("/auth", authLimit, accountsRouter(db));
            app.use("/links", linksRouter(db, cache));

            app.get("/:code", (req, res) => {
              const { code } = req.params;
              let url = cache.get(code);
              if (!url) {
                url = findLink.get(code)?.url;
                if (!url) throw new HttpError(404, "not found");
                cache.set(code, url);
              }
              countClick.run(code);
              res.redirect(url);
            });

            app.use((req, res) => {
              res.status(404).json({ error: "not found" });
            });

            app.use((err, req, res, next) => {
              if (err instanceof HttpError) {
                return res.status(err.status).json({ error: err.message, details: err.details });
              }
              if (err.status && err.status < 500) {
                return res.status(err.status).json({ error: err.status === 413 ? "body too large" : "bad request" });
              }
              // The client gets a short message; the log gets the real error and the request id.
              if (log) logLine("error", { id: req.id, message: err.message, stack: err.stack });
              res.status(500).json({ error: "server error", id: req.id });
            });

            return app;
          }
      - file: src/server.js
        lang: js
        text: |
          import { createApp } from "./app.js";
          import { openDb } from "./db.js";
          import { logLine } from "./logger.js";

          const port = Number(process.env.PORT) || 3000;
          const db = openDb(process.env.DB_PATH);

          const app = createApp(db, {
            requestsPerMinute: Number(process.env.RATE_LIMIT) || undefined,
            trustProxy: Number(process.env.TRUST_PROXY) || 0,
          });

          const server = app.listen(port, () => {
            logLine("info", { message: `listening on port ${port}`, pid: process.pid });
          });

          // Hosts send SIGTERM before they stop a service; Ctrl+C sends SIGINT.
          function shutdown(signal) {
            logLine("info", { message: `${signal} received, shutting down` });
            server.close(() => {
              // No requests are running any more.
              db.close();
              process.exit(0);
            });
            server.closeIdleConnections();
            // If something hangs, do not wait forever.
            setTimeout(() => process.exit(1), 10_000).unref();
          }

          process.on("SIGTERM", () => shutdown("SIGTERM"));
          process.on("SIGINT", () => shutdown("SIGINT"));
      - file: tests/helpers.js
        lang: js
        text: |
          import request from "supertest";
          import { createApp } from "../src/app.js";
          import { openDb } from "../src/db.js";

          // A fresh app with a fresh in-memory database; logging is off so test output stays readable.
          export const newApi = (options) => request(createApp(openDb(":memory:"), { log: false, ...options }));

          // Registers and logs in; returns the session token.
          export async function signUp(api, email = "ada@example.com", password = "correct horse battery") {
            await api.post("/auth/register").send({ email, password });
            const res = await api.post("/auth/login").send({ email, password });
            return res.body.token;
          }

          export const bearer = (token) => [token, { type: "bearer" }];
      - file: tests/health.test.js
        lang: js
        text: |
          import { test } from "node:test";
          import assert from "node:assert/strict";
          import request from "supertest";
          import { createApp } from "../src/app.js";
          import { openDb } from "../src/db.js";
          import { newApi } from "./helpers.js";

          test("/health and /ready answer 200", async () => {
            const api = newApi();
            assert.equal((await api.get("/health")).status, 200);
            const ready = await api.get("/ready");
            assert.equal(ready.status, 200);
            assert.deepEqual(ready.body, { status: "ready" });
          });

          test("/ready answers 503 when the database is gone", async () => {
            const db = openDb(":memory:");
            const api = request(createApp(db, { log: false }));
            db.close();
            assert.equal((await api.get("/ready")).status, 503);
            assert.equal((await api.get("/health")).status, 200); // the process itself is still alive
          });

          test("every response has a request id", async () => {
            const res = await newApi().get("/links");
            assert.equal(res.status, 401);
            assert.match(res.headers["x-request-id"], /^[0-9a-f-]{36}$/);
          });

          test("logs one JSON line per request, without secrets or query strings", async (t) => {
            const lines = t.mock.method(console, "log", () => {});
            const api = request(createApp(openDb(":memory:")));
            await api.get("/links?secret=abc").set("Authorization", "Bearer super-secret-token");

            const text = lines.mock.calls.map((c) => c.arguments[0]).join("\n");
            const entry = JSON.parse(text.split("\n").at(-1));
            assert.equal(entry.method, "GET");
            assert.equal(entry.path, "/links");
            assert.equal(entry.status, 401);
            assert.ok(!text.includes("super-secret-token"));
            assert.ok(!text.includes("secret=abc"));
          });
    mistakes:
      - problem:
          en: "Logging the whole request (headers, body) \"to be safe\"."
          tr: "\"Garanti olsun\" diye isteğin tamamını (header'lar, body) loglamak."
        fix:
          en: "Logs are copied, searched and kept for a long time, often by more people than the database. Log only what you need to find problems: id, method, path, status, duration."
          tr: "Log'lar kopyalanır, aranır ve uzun süre saklanır; çoğu zaman veritabanından daha fazla kişi tarafından. Sadece sorunları bulmak için gerekeni logla: id, method, path, status, süre."
      - problem:
          en: "The health check path is rate limited or needs a login, so the host thinks the app is down."
          tr: "Health check yoluna rate limit uygulanıyor ya da giriş gerekiyor, bu yüzden host uygulamanın kapalı olduğunu sanıyor."
        fix:
          en: "Register `/health` before the limiter and the auth routes, as above, and keep it cheap: it must not touch the database."
          tr: "`/health`'i yukarıdaki gibi limiter'dan ve auth route'larından önce tanımla ve ucuz tut: veritabanına dokunmamalı."
      - problem:
          en: "Every deploy drops a few requests with errors."
          tr: "Her deploy birkaç isteği hatayla düşürüyor."
        fix:
          en: "The app is killed in the middle of requests. Handle `SIGTERM` as above, and start the service with `node src/server.js`; through some wrappers the signal never reaches your program."
          tr: "Uygulama isteklerin ortasında öldürülüyor. `SIGTERM`'i yukarıdaki gibi işle ve servisi `node src/server.js` ile başlat; bazı sarmalayıcılarda sinyal programına hiç ulaşmaz."
    quiz:
      - q:
          en: "What is the difference between `/health` and `/ready`?"
          tr: "`/health` ile `/ready` arasındaki fark nedir?"
        options:
          en:
            - "There is none; they are two names for the same thing"
            - "`/health` says the process is alive; `/ready` also checks things it needs, like the database"
            - "`/health` is only for browsers"
          tr:
            - "Fark yok; aynı şeyin iki adı"
            - "`/health` process'in yaşadığını söyler; `/ready` veritabanı gibi ihtiyacı olan şeyleri de kontrol eder"
            - "`/health` sadece tarayıcılar içindir"
        answer: 1
        why:
          en: "A process can be alive but unable to work, for example when its database is unreachable. A readiness check tells that apart; a host restarts on failed liveness and may stop sending traffic on failed readiness."
          tr: "Bir process yaşıyor ama çalışamıyor olabilir, örneğin veritabanına ulaşılamıyorsa. Readiness check bunu ayırt eder; host başarısız liveness'ta yeniden başlatır, başarısız readiness'ta trafik yollamayı bırakabilir."
    sources:
      - title: "Express: Health checks and graceful shutdown"
        url: https://expressjs.com/en/advanced/healthcheck-graceful-shutdown.html
      - title: "Render: Health checks"
        url: https://render.com/docs/health-checks
      - title: "Node.js: Signal events"
        url: https://nodejs.org/docs/latest/api/process.html#signal-events

  - id: next
    stage: advanced
    title:
      en: "Look around: Hono, NestJS and what to learn next"
      tr: "Etrafa bak: Hono, NestJS ve sırada ne öğrenmeli"
    minutes: 60
    needs: [monitoring]
    why:
      en: "You built a real API with plain parts, so you understand what bigger frameworks do for you. Now you can choose with open eyes. Hono is a small, modern framework built on the web-standard `Request` and `Response`; NestJS is a big, opinionated one for large teams. Seeing the same API in Hono takes ten minutes and shows what stays the same and what changes."
      tr: "Düz parçalarla gerçek bir API yazdın, bu yüzden daha büyük framework'lerin senin için ne yaptığını anlıyorsun. Artık gözün açık seçebilirsin. Hono, web standardı `Request` ve `Response` üzerine kurulu küçük, modern bir framework; NestJS ise büyük ekipler için büyük ve kuralları belli bir framework. Aynı API'yi Hono'da görmek on dakika sürer ve nelerin aynı kaldığını, nelerin değiştiğini gösterir."
    learn:
      en: |
        - Hono: handlers get one context object `c` and return a `Response` (`c.json(...)`, `c.redirect(...)`); the same code runs on Node.js (with the `@hono/node-server` adapter), Bun, Deno and Cloudflare Workers; testing is `app.request("/path")` with no extra library
        - NestJS: a TypeScript framework (it runs on top of Express or Fastify) with modules, controllers, services, decorators and dependency injection. It gives a large team one shared structure, but it has a lot to learn and needs a build step because Node.js does not run decorators natively. Do not start there; come back when a project has grown past what a few files can organise
        - What to learn next: TypeScript (Node.js can run `.ts` files that use only erasable types), a hosted Postgres with a migration tool instead of SQLite, cookies with refresh tokens and email verification for logins, a job queue for background work, an OpenAPI description of your API, and OpenTelemetry for traces and metrics
      tr: |
        - Hono: handler'lar tek bir `c` context nesnesi alır ve bir `Response` döndürür (`c.json(...)`, `c.redirect(...)`); aynı kod Node.js'te (`@hono/node-server` adaptörüyle), Bun'da, Deno'da ve Cloudflare Workers'ta çalışır; test etmek ek kütüphane olmadan `app.request("/yol")`'dur
        - NestJS: modüller, controller'lar, servisler, decorator'lar ve dependency injection içeren bir TypeScript framework'ü (Express ya da Fastify'ın üstünde çalışır). Büyük bir ekibe ortak bir yapı verir ama öğrenilecek çok şey vardır ve Node.js decorator'ları doğrudan çalıştırmadığı için bir build adımı ister. Oradan başlama; bir proje birkaç dosyanın düzenleyebileceğinden büyüyünce dön
        - Sırada ne öğrenmeli: TypeScript (Node.js sadece silinebilir tip içeren `.ts` dosyalarını çalıştırabilir), SQLite yerine bir migration aracı olan barındırılan bir Postgres, giriş için refresh token'lı cookie'ler ve e-posta doğrulaması, arka plan işleri için bir iş kuyruğu, API'nın OpenAPI tanımı ve trace ile metrikler için OpenTelemetry
    do:
      en: |
        1. Make a separate playground folder next to your project (not inside it) and install Hono there (first block below).
        2. Create `index.js` in it (`hono-demo/index.js`) with the code below: the same three routes, in Hono, with the data in memory.
        3. Run it with `node index.js`, then try it with the curl commands. The routes behave like the ones you built.
        4. Compare with `src/app.js` and `src/links.js`. What got shorter? What did Express give you that you must now build yourself here (validation, rate limiting, security headers)? Hono has middleware for those too; the ideas are the same.
        5. Read the first page of the NestJS documentation ("First steps") without installing anything. Write down in two sentences when you would choose it.
        6. Pick one item from "What to learn next" for your own next project. A good one: move Linkly to a hosted Postgres so the data survives on Render.
      tr: |
        1. Projenin yanında (içinde değil) ayrı bir deneme klasörü oluştur ve Hono'yu orada kur (aşağıdaki ilk blok).
        2. İçinde aşağıdaki kodla `index.js` dosyasını (`hono-demo/index.js`) oluştur: aynı üç route, Hono'da, veri bellekte.
        3. `node index.js` ile çalıştır, sonra curl komutlarıyla dene. Route'lar senin yazdıklarınla aynı davranır.
        4. `src/app.js` ve `src/links.js` ile karşılaştır. Ne kısaldı? Express'in sana verdiği, burada artık kendin kurman gereken ne var (doğrulama, rate limiting, güvenlik header'ları)? Hono'da bunlar için de middleware var; fikirler aynı.
        5. Hiçbir şey kurmadan NestJS dokümanının ilk sayfasını ("First steps") oku. Onu ne zaman seçeceğini iki cümleyle yaz.
        6. "Sırada ne öğrenmeli" listesinden kendi bir sonraki projen için birini seç. İyi bir seçim: Linkly'yi barındırılan bir Postgres'e taşı ki veri Render'da kalsın.
    code:
      - file: terminal
        lang: sh
        text: |
          cd ..
          mkdir hono-demo
          cd hono-demo
          npm init -y
          npm pkg set type=module
          npm install hono @hono/node-server
      - file: hono-demo/index.js
        lang: js
        text: |
          import { Hono } from "hono";
          import { serve } from "@hono/node-server";

          const links = new Map(); // code -> url
          const app = new Hono();

          app.get("/health", (c) => c.json({ status: "ok" }));

          app.post("/links", async (c) => {
            const body = await c.req.json().catch(() => null);
            if (typeof body?.url !== "string" || !/^https?:\/\//.test(body.url)) {
              return c.json({ error: "a http or https url is required" }, 400);
            }
            const code = crypto.randomUUID().slice(0, 6);
            links.set(code, body.url);
            return c.json({ code, url: body.url }, 201);
          });

          app.get("/:code", (c) => {
            const url = links.get(c.req.param("code"));
            if (!url) return c.json({ error: "not found" }, 404);
            return c.redirect(url);
          });

          serve({ fetch: app.fetch, port: 3001 }, (info) => {
            console.log(`Hono listening on http://localhost:${info.port}`);
          });
      - file: terminal
        lang: sh
        text: |
          node index.js

          curl -i -X POST http://localhost:3001/links \
            -H "content-type: application/json" \
            -d '{"url":"https://hono.dev"}'
          curl -i http://localhost:3001/<code>
    mistakes:
      - problem:
          en: "Starting a new project with the biggest framework because it looks professional."
          tr: "Profesyonel göründüğü için yeni bir projeye en büyük framework'le başlamak."
        fix:
          en: "Pick the smallest tool that fits. Express or Hono is enough for most APIs; a framework with more rules pays off only when many people work in one codebase."
          tr: "Uyan en küçük aracı seç. Çoğu API için Express ya da Hono yeter; daha çok kural koyan bir framework ancak aynı kod tabanında çok kişi çalışınca karşılığını verir."
      - problem:
          en: "Copying Express middleware into Hono (or the other way round) and expecting it to work."
          tr: "Express middleware'ini Hono'ya (ya da tersini) kopyalayıp çalışmasını beklemek."
        fix:
          en: "They use different request and response objects. Use packages made for the framework; for example Hono has its own middleware for security headers and CORS."
          tr: "Farklı request ve response nesneleri kullanırlar. Framework için yazılmış paketleri kullan; örneğin Hono'nun güvenlik header'ları ve CORS için kendi middleware'i var."
    quiz:
      - q:
          en: "When is NestJS a good choice?"
          tr: "NestJS ne zaman iyi bir seçimdir?"
        options:
          en:
            - "For your very first Node.js project"
            - "For a large codebase with many developers who need one shared structure"
            - "When you want no build step and no TypeScript"
          tr:
            - "İlk Node.js projen için"
            - "Ortak bir yapıya ihtiyaç duyan çok sayıda geliştiricinin olduğu büyük bir kod tabanı için"
            - "Build adımı ve TypeScript istemediğinde"
        answer: 1
        why:
          en: "NestJS adds structure (modules, dependency injection) that pays off with big teams and big projects. For small APIs it is more than you need."
          tr: "NestJS büyük ekiplerde ve büyük projelerde karşılığını veren bir yapı (modüller, dependency injection) ekler. Küçük API'ler için ihtiyacından fazladır."
    sources:
      - title: "Hono: Node.js"
        url: https://hono.dev/docs/getting-started/nodejs
      - title: "NestJS: First steps"
        url: https://docs.nestjs.com/first-steps
      - title: "Node.js: Running TypeScript natively"
        url: https://nodejs.org/docs/latest/api/typescript.html
