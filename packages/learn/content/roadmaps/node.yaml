id: node
title:
  en: "Node.js backend"
  tr: "Node.js ile backend"
summary:
  en: "From an empty computer to your own REST API on the internet. You build a URL shortener with Node.js and Express step by step: validation, a SQLite database, logins, tests, security, a Docker image and a free deploy."
  tr: "Boş bir bilgisayardan internette yayında olan kendi REST API'na. Node.js ve Express ile adım adım bir URL kısaltıcı yazarsın: doğrulama, SQLite veritabanı, giriş sistemi, testler, güvenlik, Docker image'ı ve ücretsiz deploy."
teacher: backend
project:
  en: "Linkly, a small URL shortener API: people register and log in, create short links for long web addresses, list and delete their own links, and anyone who opens a short link is redirected. It has input validation, a SQLite database, hashed passwords, tests, rate limiting, logs and health checks, and runs on Render's free plan."
  tr: "Linkly, küçük bir URL kısaltıcı API'si: kişiler kayıt olup giriş yapar, uzun web adresleri için kısa bağlantılar oluşturur, kendi bağlantılarını listeler ve siler; bir kısa bağlantıyı açan herkes asıl adrese yönlendirilir. Girdi doğrulaması, SQLite veritabanı, hash'lenmiş şifreler, testler, rate limiting, loglar ve health check'leri vardır; Render'ın ücretsiz planında çalışır."
detect:
  npm: [express, hono]
  files: [package.json]
version: "26"
latest: eol:nodejs
checked: 2026-10
after: [web]
sheets: [nodejs, javascript, http, auth, rest-graphql, sql, caching, cors, docker, git]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Node.js, an editor, Git and curl"
      tr: "Node.js, bir editör, Git ve curl kurma"
    minutes: 40
    why:
      en: "Node.js is the program that runs your JavaScript on a server instead of in a browser. An editor makes writing code comfortable, Git keeps every version of your work, and curl lets you talk to your own API from the terminal before any website exists."
      tr: "Node.js, JavaScript kodunu tarayıcıda değil sunucuda çalıştıran programdır. Editör kod yazmayı rahatlatır, Git işinin her sürümünü saklar, curl de daha ortada bir web sitesi yokken kendi API'nla terminalden konuşmanı sağlar."
    learn:
      en: |
        - What Node.js and npm are, and what a backend is (a program that waits for requests and answers them)
        - Which Node.js version to pick: the LTS one
        - How to check that a program is installed
      tr: |
        - Node.js ve npm'in ne olduğu, backend'in ne olduğu (istekleri bekleyen ve cevaplayan bir program)
        - Hangi Node.js sürümünü seçmen gerektiği: LTS olanı
        - Bir programın kurulu olup olmadığını nasıl kontrol edeceğin
    do:
      en: |
        1. Download **Node.js LTS** from nodejs.org and install it. LTS means long-term support: it gets fixes for years. At the time of writing the LTS line is Node.js 24, and Node.js 26 becomes LTS on 28 October 2026. Both work for this project. You need version 22.13 or newer, because the project uses the built-in `node:sqlite` module.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor.
        3. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it. On Windows this also installs *Git Bash*; use Git Bash for the terminal commands in this guide, because they are written for it.
        4. Open a terminal (in VS Code: *Terminal → New Terminal*) and run the commands below. Each one should print a version number.
        5. Tell Git who you are: `git config --global user.name "Your Name"` and `git config --global user.email "you@example.com"`.
      tr: |
        1. nodejs.org'dan **Node.js LTS** sürümünü indirip kur. LTS "uzun süreli destek" demek: yıllarca düzeltme alır. Bu yazı hazırlanırken LTS hattı Node.js 24, Node.js 26 ise 28 Ekim 2026'da LTS oluyor. İkisi de bu projede çalışır. 22.13 veya daha yeni bir sürüm gerekir, çünkü proje hazır gelen `node:sqlite` modülünü kullanıyor.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u kur (code.visualstudio.com).
        3. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir. Windows'ta bu, *Git Bash*'i de kurar; bu rehberdeki terminal komutları ona göre yazıldığı için Git Bash kullan.
        4. Bir terminal aç (VS Code'da: *Terminal → New Terminal*) ve aşağıdaki komutları çalıştır. Her biri bir sürüm numarası yazmalı.
        5. Git'e kim olduğunu söyle: `git config --global user.name "Adın Soyadın"` ve `git config --global user.email "sen@example.com"`.
    code:
      - file: terminal
        lang: sh
        text: |
          node --version
          npm --version
          git --version
          curl --version
    mistakes:
      - problem:
          en: "\"command not found\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found\" hatası."
        fix:
          en: "Close the terminal (or VS Code) and open it again so it sees the new program. On Windows, restart the computer if it still fails."
          tr: "Terminali (ya da VS Code'u) kapatıp yeniden aç ki yeni programı görsün. Windows'ta hâlâ olmuyorsa bilgisayarı yeniden başlat."
      - problem:
          en: "`node --version` prints something older than v22.13 because an old Node.js was installed earlier."
          tr: "Daha önce kurulmuş eski bir Node.js yüzünden `node --version` v22.13'ten eski bir sürüm yazıyor."
        fix:
          en: "Install the LTS version over it, or use a version manager such as nvm or fnm. Then open a new terminal and check again."
          tr: "LTS sürümünü üstüne kur ya da nvm veya fnm gibi bir sürüm yöneticisi kullan. Sonra yeni bir terminal açıp tekrar kontrol et."
    quiz:
      - q:
          en: "What does a backend program do?"
          tr: "Bir backend programı ne yapar?"
        options:
          en:
            - "It draws the page in the browser"
            - "It waits for requests and sends back answers"
            - "It only stores files on your computer"
          tr:
            - "Sayfayı tarayıcıda çizer"
            - "İstekleri bekler ve cevap gönderir"
            - "Sadece dosyaları bilgisayarında saklar"
        answer: 1
        why:
          en: "A backend (server) program listens for requests from browsers, apps or tools like curl and answers each one, usually with data."
          tr: "Backend (sunucu) programı, tarayıcılardan, uygulamalardan ya da curl gibi araçlardan gelen istekleri dinler ve her birine, genelde veriyle, cevap verir."
    sources:
      - title: Node.js downloads
        url: https://nodejs.org/en/download
      - title: Node.js release schedule
        url: https://nodejs.org/en/about/previous-releases
      - title: Git installation
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: hello-http
    stage: first-code
    title:
      en: "Your first server with node:http"
      tr: "node:http ile ilk sunucun"
    minutes: 25
    needs: [setup]
    why:
      en: "Every Node.js web framework is built on the same small piece: the built-in `http` module. If you write one server with it yourself, Express and the others stop being magic."
      tr: "Her Node.js web framework'ü aynı küçük parçanın üstüne kurulur: hazır gelen `http` modülü. Onunla bir sunucuyu kendin yazarsan Express ve diğerleri sihir olmaktan çıkar."
    learn:
      en: |
        - What a port is, and what `localhost` means
        - A request comes in, a response goes out: `(req, res) => ...`
        - What `package.json` is, and why we set `"type": "module"` (so `import` works)
        - `node --watch` restarts the server every time you save
      tr: |
        - Port'un ne olduğu ve `localhost`'un ne demek olduğu
        - Bir istek gelir, bir cevap gider: `(req, res) => ...`
        - `package.json`'ın ne olduğu ve `"type": "module"` ayarını neden yaptığımız (`import` çalışsın diye)
        - `node --watch`, her kaydettiğinde sunucuyu yeniden başlatır
    do:
      en: |
        1. In the terminal go to the folder where you keep projects, then create the project folder and a `package.json` (first commands below).
        2. Open the folder in VS Code (`code .`) and create `server.js` with the code below.
        3. Start it with `node --watch server.js`. It prints the address and keeps running.
        4. In a second terminal run `curl -i http://localhost:3000`. `-i` shows the response headers too. You can also open the address in a browser.
        5. Change the text in `server.js`, save, and run curl again. The server restarted by itself.
        6. Stop the server with Ctrl+C.
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git, sonra proje klasörünü ve bir `package.json` oluştur (aşağıdaki ilk komutlar).
        2. Klasörü VS Code'da aç (`code .`) ve aşağıdaki kodla `server.js` dosyasını oluştur.
        3. `node --watch server.js` ile başlat. Adresi yazar ve çalışmaya devam eder.
        4. İkinci bir terminalde `curl -i http://localhost:3000` çalıştır. `-i` cevabın header'larını da gösterir. Adresi tarayıcıda da açabilirsin.
        5. `server.js` içindeki metni değiştir, kaydet ve curl'ü tekrar çalıştır. Sunucu kendiliğinden yeniden başladı.
        6. Sunucuyu Ctrl+C ile durdur.
    code:
      - file: terminal
        lang: sh
        text: |
          mkdir linkly
          cd linkly
          npm init -y
          npm pkg set type=module
      - file: server.js
        lang: js
        text: |
          import http from "node:http";

          const server = http.createServer((req, res) => {
            res.writeHead(200, { "content-type": "text/plain; charset=utf-8" });
            res.end("Hello from my first server\n");
          });

          server.listen(3000, () => {
            console.log("Listening on http://localhost:3000");
          });
    mistakes:
      - problem:
          en: "`Error: listen EADDRINUSE: address already in use :::3000`."
          tr: "`Error: listen EADDRINUSE: address already in use :::3000` hatası."
        fix:
          en: "Another program (often your own earlier server still running in another terminal) already uses port 3000. Stop it with Ctrl+C, or change the number in `server.listen`."
          tr: "Başka bir program (çoğu zaman başka bir terminalde hâlâ çalışan eski sunucun) 3000 portunu kullanıyor. Ctrl+C ile durdur ya da `server.listen` içindeki sayıyı değiştir."
      - problem:
          en: "`SyntaxError: Cannot use import statement outside a module`."
          tr: "`SyntaxError: Cannot use import statement outside a module` hatası."
        fix:
          en: "`package.json` is missing `\"type\": \"module\"`. Run `npm pkg set type=module` in the project folder."
          tr: "`package.json` içinde `\"type\": \"module\"` yok. Proje klasöründe `npm pkg set type=module` çalıştır."
    quiz:
      - q:
          en: "In `http.createServer((req, res) => ...)`, what is `res` for?"
          tr: "`http.createServer((req, res) => ...)` içinde `res` ne işe yarar?"
        options:
          en:
            - "It holds the request that came in"
            - "It is used to build and send the answer"
            - "It restarts the server"
          tr:
            - "Gelen isteği tutar"
            - "Cevabı hazırlayıp göndermek için kullanılır"
            - "Sunucuyu yeniden başlatır"
        answer: 1
        why:
          en: "`req` describes the request (method, URL, headers, body); `res` is how you write the response: status, headers and body."
          tr: "`req` isteği anlatır (method, URL, header'lar, body); `res` cevabı yazdığın yerdir: durum kodu, header'lar ve body."
    sources:
      - title: "Node.js http: http.createServer"
        url: https://nodejs.org/docs/latest/api/http.html#httpcreateserveroptions-requestlistener
      - title: "Node.js: Introduction to Node.js"
        url: https://nodejs.org/en/learn/getting-started/introduction-to-nodejs

  - id: plain-api
    stage: basics
    title:
      en: "A tiny API by hand: routes, JSON and status codes"
      tr: "Elle küçük bir API: route'lar, JSON ve durum kodları"
    minutes: 45
    needs: [hello-http]
    why:
      en: "A REST API is a set of addresses (routes) that take and return JSON, with a status code that says how it went. Writing the first two routes with plain `node:http` shows you exactly what a framework will do for you next, and why you will want one."
      tr: "REST API, JSON alıp veren adreslerden (route'lardan) oluşur ve işin nasıl gittiğini bir durum kodu söyler. İlk iki route'u düz `node:http` ile yazmak, bir framework'ün senin için neleri yapacağını ve neden ona ihtiyaç duyacağını tam olarak gösterir."
    learn:
      en: |
        - HTTP methods: `GET` reads, `POST` creates
        - Status codes: 200 OK, 201 Created, 302 Found (redirect), 400 Bad Request, 404 Not Found
        - Reading a JSON request body and sending a JSON response
        - Why data kept only in memory disappears when the server restarts
      tr: |
        - HTTP method'ları: `GET` okur, `POST` oluşturur
        - Durum kodları: 200 OK, 201 Created, 302 Found (yönlendirme), 400 Bad Request, 404 Not Found
        - JSON istek gövdesini okumak ve JSON cevap göndermek
        - Sadece bellekte tutulan verinin sunucu yeniden başlayınca neden kaybolduğu
    do:
      en: |
        1. Replace everything in `server.js` with the code below. It stores links in a `Map` (a list of key and value pairs kept in memory).
        2. Start it: `node --watch server.js`.
        3. In a second terminal create a short link with the first curl command. The answer has a `code` like `qZ3mXw`.
        4. Open the short link with the second command, using your code. `-i` shows the `302` status and the `location` header: that is the redirect.
        5. Try a request with a body that is not valid JSON, and one without a `url`. Both answer `400`.
        6. Stop the server with Ctrl+C, start it again and open the same short link: `404`. The `Map` was in memory only.
      tr: |
        1. `server.js` içindeki her şeyi aşağıdaki kodla değiştir. Bağlantıları bir `Map`'te (bellekte tutulan anahtar ve değer çiftleri listesi) saklar.
        2. Başlat: `node --watch server.js`.
        3. İkinci bir terminalde ilk curl komutuyla bir kısa bağlantı oluştur. Cevapta `qZ3mXw` gibi bir `code` var.
        4. İkinci komutla, kendi kodunu kullanarak kısa bağlantıyı aç. `-i` `302` durumunu ve `location` header'ını gösterir: yönlendirme budur.
        5. Geçerli JSON olmayan bir body ile ve `url` içermeyen bir istekle dene. İkisi de `400` döner.
        6. Sunucuyu Ctrl+C ile durdur, tekrar başlat ve aynı kısa bağlantıyı aç: `404`. `Map` sadece bellekteydi.
    code:
      - file: server.js
        lang: js
        text: |
          import http from "node:http";
          import { randomBytes } from "node:crypto";

          const links = new Map(); // code -> url

          function send(res, status, body) {
            res.writeHead(status, { "content-type": "application/json; charset=utf-8" });
            res.end(JSON.stringify(body));
          }

          async function readJson(req) {
            req.setEncoding("utf8");
            let text = "";
            for await (const chunk of req) text += chunk;
            return JSON.parse(text);
          }

          const server = http.createServer(async (req, res) => {
            const { pathname } = new URL(req.url, "http://localhost");
            try {
              if (req.method === "POST" && pathname === "/links") {
                const body = await readJson(req);
                if (typeof body?.url !== "string") {
                  return send(res, 400, { error: "url is required" });
                }
                const code = randomBytes(4).toString("base64url");
                links.set(code, body.url);
                return send(res, 201, { code, url: body.url });
              }

              if (req.method === "GET" && pathname.length > 1) {
                const url = links.get(pathname.slice(1));
                if (!url) return send(res, 404, { error: "not found" });
                res.writeHead(302, { location: url });
                return res.end();
              }

              send(res, 404, { error: "not found" });
            } catch {
              send(res, 400, { error: "bad request" });
            }
          });

          server.listen(3000, () => {
            console.log("Listening on http://localhost:3000");
          });
      - file: terminal
        lang: sh
        text: |
          curl -i -X POST http://localhost:3000/links \
            -H "content-type: application/json" \
            -d '{"url":"https://nodejs.org"}'

          curl -i http://localhost:3000/qZ3mXw
    mistakes:
      - problem:
          en: "The request never finishes; curl just waits."
          tr: "İstek hiç bitmiyor; curl sadece bekliyor."
        fix:
          en: "Some code path forgot to call `res.end()` (the helper `send` does it). Every request must end with exactly one response."
          tr: "Bir kod yolu `res.end()` çağırmayı unutmuş (`send` yardımcısı bunu yapar). Her istek tam olarak bir cevapla bitmelidir."
      - problem:
          en: "On Windows the multi-line curl command fails."
          tr: "Windows'ta çok satırlı curl komutu hata veriyor."
        fix:
          en: "Use Git Bash (the `\\` at the end of a line continues the command there), or put the whole command on one line. In PowerShell `curl` is a different command: use `curl.exe`."
          tr: "Git Bash kullan (orada satır sonundaki `\\` komutu devam ettirir) ya da komutun hepsini tek satıra yaz. PowerShell'de `curl` başka bir komuttur: `curl.exe` kullan."
      - problem:
          en: "Expecting the links to still be there after a restart."
          tr: "Yeniden başlatınca bağlantıların hâlâ orada olmasını beklemek."
        fix:
          en: "A `Map` lives in the program's memory and disappears when it stops. A database fixes this; that comes in a few steps."
          tr: "`Map` programın belleğinde yaşar ve program durunca kaybolur. Bunu bir veritabanı çözer; birkaç adım sonra gelecek."
    quiz:
      - q:
          en: "Which status code means a new thing was created?"
          tr: "Hangi durum kodu yeni bir şeyin oluşturulduğunu söyler?"
        options:
          en:
            - "200"
            - "201"
            - "404"
          tr:
            - "200"
            - "201"
            - "404"
        answer: 1
        why:
          en: "201 Created is the answer to a `POST` that made a new resource. 200 is a plain success and 404 means not found."
          tr: "201 Created, yeni bir kaynak oluşturan bir `POST`'un cevabıdır. 200 sade bir başarıdır, 404 ise bulunamadı demektir."
    sources:
      - title: "MDN: HTTP response status codes"
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status
      - title: "MDN: HTTP request methods"
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods
      - title: "Node.js crypto: randomBytes"
        url: https://nodejs.org/docs/latest/api/crypto.html#cryptorandombytessize-callback

  - id: express
    stage: first-project
    title:
      en: "Move to Express 5"
      tr: "Express 5'e geçiş"
    minutes: 40
    needs: [plain-api]
    why:
      en: "Routing by hand with `if` lines does not scale. Express gives you routes, JSON body parsing and redirects in a few readable lines. We pick Express 5 because it is the version npm installs by default, its docs are the most complete, it has the biggest ecosystem of ready-made parts (middleware) and tutorials, and since version 5 it passes errors from async handlers to your error handler by itself. Hono is a great modern alternative; we meet it in the last step."
      tr: "`if` satırlarıyla elle route yazmak büyüyünce yetmez. Express route'ları, JSON body okumayı ve yönlendirmeyi birkaç okunaklı satırda verir. Express 5'i seçiyoruz çünkü npm'in varsayılan olarak kurduğu sürüm bu, dokümantasyonu en eksiksiz olanı, hazır parça (middleware) ve eğitim ekosistemi en büyüğü, ayrıca 5. sürümden beri async handler'lardaki hataları kendiliğinden hata yakalayıcına iletiyor. Hono harika, modern bir alternatif; onu son adımda tanıyacağız."
    learn:
      en: |
        - What a framework is, and what middleware is (a function that runs before your route: `express.json()` reads JSON bodies)
        - Routes: `app.get(path, handler)`, `app.post(...)`, and `:code` parameters
        - Why the app is built by a function `createApp()` in `src/app.js` and started in a separate `src/server.js` (so tests can use the app without opening a port)
      tr: |
        - Framework'ün ne olduğu ve middleware'in ne olduğu (route'undan önce çalışan bir fonksiyon: `express.json()` JSON body'leri okur)
        - Route'lar: `app.get(yol, handler)`, `app.post(...)` ve `:code` parametreleri
        - Uygulamanın neden `src/app.js` içindeki bir `createApp()` fonksiyonuyla kurulup ayrı bir `src/server.js` ile başlatıldığı (testler port açmadan uygulamayı kullanabilsin diye)
    do:
      en: |
        1. Install Express in the project folder (first command below). npm adds it to `package.json` and creates `node_modules` and `package-lock.json`.
        2. Create the folder `src` and the two files below.
        3. Delete the old `server.js`: `rm server.js`.
        4. Add two scripts to `package.json` with the second command below. Now `npm run dev` starts the server with auto-restart.
        5. Run `npm run dev`, then repeat the curl commands from the last step: create a link and open it. `curl -i http://localhost:3000/health` should answer `{"status":"ok"}`.
        6. Create a file named `.gitignore` containing the line `node_modules`, then save this version: `git init`, `git add .`, `git commit -m "Linkly with Express"`.
      tr: |
        1. Express'i proje klasöründe kur (aşağıdaki ilk komut). npm onu `package.json`'a ekler, `node_modules` ve `package-lock.json` dosyalarını oluşturur.
        2. `src` klasörünü ve aşağıdaki iki dosyayı oluştur.
        3. Eski `server.js` dosyasını sil: `rm server.js`.
        4. Aşağıdaki ikinci komutla `package.json`'a iki script ekle. Artık `npm run dev` sunucuyu otomatik yeniden başlatmayla çalıştırır.
        5. `npm run dev` çalıştır, sonra önceki adımdaki curl komutlarını tekrarla: bir bağlantı oluştur ve aç. `curl -i http://localhost:3000/health` komutu `{"status":"ok"}` cevabını vermeli.
        6. İçinde `node_modules` satırı olan `.gitignore` adında bir dosya oluştur, sonra bu sürümü kaydet: `git init`, `git add .`, `git commit -m "Linkly with Express"`.
    code:
      - file: terminal
        lang: sh
        text: |
          npm install express
          npm pkg set scripts.dev="node --watch src/server.js" scripts.start="node src/server.js"
      - file: src/app.js
        lang: js
        text: |
          import express from "express";
          import { randomBytes } from "node:crypto";

          export function createApp() {
            const app = express();
            const links = new Map(); // code -> url, still only in memory

            app.use(express.json());

            app.get("/health", (req, res) => {
              res.json({ status: "ok" });
            });

            app.post("/links", (req, res) => {
              const code = randomBytes(4).toString("base64url");
              links.set(code, req.body.url);
              res.status(201).json({ code, url: req.body.url });
            });

            app.get("/:code", (req, res) => {
              const url = links.get(req.params.code);
              if (!url) return res.status(404).json({ error: "not found" });
              res.redirect(url);
            });

            return app;
          }
      - file: src/server.js
        lang: js
        text: |
          import { createApp } from "./app.js";

          const port = Number(process.env.PORT) || 3000;

          createApp().listen(port, () => {
            console.log(`Listening on http://localhost:${port}`);
          });
      - file: .gitignore
        lang: text
        text: |
          node_modules
    mistakes:
      - problem:
          en: "`Cannot read properties of undefined (reading 'url')` when the request has no JSON body."
          tr: "İstekte JSON body yokken `Cannot read properties of undefined (reading 'url')` hatası."
        fix:
          en: "In Express 5 `req.body` is `undefined` when nothing was parsed (for example a missing `content-type: application/json` header). Do not trust the body; the next step validates it properly."
          tr: "Express 5'te hiçbir şey parse edilmediğinde (örneğin `content-type: application/json` header'ı yoksa) `req.body` `undefined` olur. Body'ye güvenme; sonraki adım onu düzgünce doğrular."
      - problem:
          en: "Following an old Express 4 tutorial and getting errors, for example with `app.get('*', ...)`."
          tr: "Eski bir Express 4 eğitimini izleyip hata almak, örneğin `app.get('*', ...)` ile."
        fix:
          en: "Express 5 changed some things: a catch-all route must be named, like `/*splat`. Read the official migration guide when an old example does not work."
          tr: "Express 5 bazı şeyleri değiştirdi: hepsini yakalayan bir route'a ad verilmesi gerekir, örneğin `/*splat`. Eski bir örnek çalışmazsa resmi geçiş rehberini oku."
    quiz:
      - q:
          en: "Why does `src/app.js` export a `createApp()` function instead of starting the server itself?"
          tr: "`src/app.js` neden sunucuyu kendisi başlatmak yerine bir `createApp()` fonksiyonu dışa aktarıyor?"
        options:
          en:
            - "Express requires it"
            - "Tests can then use the app without opening a port"
            - "It makes the server faster"
          tr:
            - "Express bunu zorunlu kılıyor"
            - "Böylece testler port açmadan uygulamayı kullanabilir"
            - "Sunucuyu hızlandırır"
        answer: 1
        why:
          en: "Separating building the app from listening on a port lets a test create fresh apps with fresh data and call them directly."
          tr: "Uygulamayı kurmakla bir portu dinlemeyi ayırmak, bir testin temiz veriyle yeni uygulamalar oluşturup onları doğrudan çağırmasını sağlar."
    sources:
      - title: "Express: Installing"
        url: https://expressjs.com/en/starter/installing.html
      - title: "Express: Routing"
        url: https://expressjs.com/en/guide/routing.html
      - title: "Express: Migrating to Express 5"
        url: https://expressjs.com/en/guide/migrating-5.html

  - id: validation
    stage: first-project
    title:
      en: "Validate input and handle errors"
      tr: "Girdiyi doğrulama ve hataları yönetme"
    minutes: 45
    needs: [express]
    why:
      en: "Everything that comes from outside is untrusted: a missing field, a wrong type, a `javascript:` address. A good API checks the input at the door and answers with a clear 400, and never crashes or leaks internal details."
      tr: "Dışarıdan gelen her şeye güvenilmez: eksik bir alan, yanlış bir tür, `javascript:` ile başlayan bir adres. İyi bir API girdiyi kapıda kontrol eder, net bir 400 ile cevap verir; asla çökmez ve iç ayrıntıları sızdırmaz."
    learn:
      en: |
        - Describing the allowed shape of the data once with a schema (Zod)
        - Throwing an `HttpError` from a route and catching it in one error handler
        - Express 5 sends errors thrown in handlers (even async ones) to the error handler for you
        - Error handler rules: four parameters `(err, req, res, next)`, and it comes after all routes
        - Why a short link may only point to `http` and `https` addresses
      tr: |
        - Verinin izin verilen şeklini bir şemayla (Zod) bir kez tanımlamak
        - Bir route'tan `HttpError` fırlatıp tek bir hata yakalayıcıda yakalamak
        - Express 5, handler'larda (async olanlarda bile) fırlatılan hataları senin yerine hata yakalayıcıya yollar
        - Hata yakalayıcı kuralları: dört parametre `(err, req, res, next)` ve tüm route'lardan sonra gelir
        - Kısa bağlantının neden sadece `http` ve `https` adreslerine gidebileceği
    do:
      en: |
        1. Install Zod: `npm install zod`.
        2. Create `src/validate.js` with the code below. `parse` checks data against a schema and throws a 400 `HttpError` with the list of problems.
        3. Replace `src/app.js` with the new version below. It adds the schema, a catch-all 404 and the error handler.
        4. Try the bad requests with curl (the commands below). Each should answer 400 with a clear message and `details`.
        5. Try a good one again to check it still works.
      tr: |
        1. Zod'u kur: `npm install zod`.
        2. Aşağıdaki kodla `src/validate.js` dosyasını oluştur. `parse` veriyi bir şemaya göre kontrol eder ve sorunların listesiyle 400 `HttpError` fırlatır.
        3. `src/app.js` dosyasını aşağıdaki yeni sürümle değiştir. Şemayı, her şeyi yakalayan bir 404'ü ve hata yakalayıcıyı ekler.
        4. Kötü istekleri curl ile dene (aşağıdaki komutlar). Her biri net bir mesaj ve `details` ile 400 dönmeli.
        5. Çalıştığını görmek için iyi bir istek daha dene.
    code:
      - file: src/validate.js
        lang: js
        text: |
          export class HttpError extends Error {
            constructor(status, message, details) {
              super(message);
              this.status = status;
              this.details = details;
            }
          }

          // Checks data against a Zod schema; returns the clean data or throws a 400.
          export function parse(schema, data) {
            const result = schema.safeParse(data);
            if (!result.success) {
              throw new HttpError(
                400,
                "invalid input",
                result.error.issues.map((i) => ({ field: i.path.join("."), message: i.message })),
              );
            }
            return result.data;
          }
      - file: src/app.js
        lang: js
        text: |
          import express from "express";
          import { randomBytes } from "node:crypto";
          import { z } from "zod";
          import { HttpError, parse } from "./validate.js";

          const newLink = z.object({
            url: z.url({ protocol: /^https?$/ }).max(2048),
          });

          export function createApp() {
            const app = express();
            const links = new Map(); // code -> url, still only in memory

            app.use(express.json({ limit: "10kb" }));

            app.get("/health", (req, res) => {
              res.json({ status: "ok" });
            });

            app.post("/links", (req, res) => {
              const { url } = parse(newLink, req.body);
              const code = randomBytes(4).toString("base64url");
              links.set(code, url);
              res.status(201).json({ code, url });
            });

            app.get("/:code", (req, res) => {
              const url = links.get(req.params.code);
              if (!url) throw new HttpError(404, "not found");
              res.redirect(url);
            });

            // Nothing matched above.
            app.use((req, res) => {
              res.status(404).json({ error: "not found" });
            });

            // Express knows this is an error handler because it has four parameters.
            app.use((err, req, res, next) => {
              if (err instanceof HttpError) {
                return res.status(err.status).json({ error: err.message, details: err.details });
              }
              if (err.status && err.status < 500) {
                // Errors from Express itself: broken JSON, body too large.
                return res.status(err.status).json({ error: err.status === 413 ? "body too large" : "bad request" });
              }
              console.error(err);
              res.status(500).json({ error: "server error" });
            });

            return app;
          }
      - file: terminal
        lang: sh
        text: |
          # no url
          curl -i -X POST http://localhost:3000/links -H "content-type: application/json" -d '{}'
          # not a web address
          curl -i -X POST http://localhost:3000/links -H "content-type: application/json" -d '{"url":"not a url"}'
          # dangerous scheme
          curl -i -X POST http://localhost:3000/links -H "content-type: application/json" -d '{"url":"javascript:alert(1)"}'
          # broken JSON
          curl -i -X POST http://localhost:3000/links -H "content-type: application/json" -d '{"url":'
    mistakes:
      - problem:
          en: "Your error handler never runs and Express sends its own HTML error page."
          tr: "Hata yakalayıcın hiç çalışmıyor ve Express kendi HTML hata sayfasını gönderiyor."
        fix:
          en: "Either it has only three parameters (Express needs all four: `err, req, res, next`, even if `next` is unused) or it is placed before the routes. Error handlers go last."
          tr: "Ya sadece üç parametresi var (Express dördünü de ister: `err, req, res, next`, `next` kullanılmasa bile) ya da route'lardan önce konmuş. Hata yakalayıcılar en sona konur."
      - problem:
          en: "Sending `error.stack` or the database error text to the client."
          tr: "`error.stack` ya da veritabanı hata metnini istemciye göndermek."
        fix:
          en: "Log the real error on the server (`console.error`) and send the client only a short, safe message. Stack traces help attackers."
          tr: "Gerçek hatayı sunucuda logla (`console.error`) ve istemciye sadece kısa, güvenli bir mesaj gönder. Stack trace'ler saldırganlara yardım eder."
      - problem:
          en: "Allowing any string as the address, including `javascript:` or `file:` ones."
          tr: "Adres olarak her string'e, `javascript:` ya da `file:` ile başlayanlara bile, izin vermek."
        fix:
          en: "Allow only the schemes you need. The schema above restricts to `http` and `https` with `protocol: /^https?$/`."
          tr: "Sadece ihtiyacın olan scheme'lere izin ver. Yukarıdaki şema `protocol: /^https?$/` ile `http` ve `https` ile sınırlar."
    quiz:
      - q:
          en: "Which status code fits \"the client sent data that fails validation\"?"
          tr: "\"İstemci doğrulamadan geçmeyen veri gönderdi\" için hangi durum kodu uygun?"
        options:
          en:
            - "400"
            - "404"
            - "500"
          tr:
            - "400"
            - "404"
            - "500"
        answer: 0
        why:
          en: "4xx codes mean the client made a mistake and 400 is the general one for bad input. 500 would wrongly say the server is broken."
          tr: "4xx kodları hatanın istemcide olduğunu söyler, 400 de kötü girdi için genel olanıdır. 500 sunucunun bozuk olduğunu yanlış biçimde söylerdi."
    sources:
      - title: "Zod documentation"
        url: https://zod.dev/api
      - title: "Express: Error handling"
        url: https://expressjs.com/en/guide/error-handling.html

  - id: sqlite
    stage: data-api
    title:
      en: "Keep links in a SQLite database"
      tr: "Bağlantıları SQLite veritabanında saklama"
    minutes: 45
    needs: [validation]
    why:
      en: "A database keeps data when the server restarts, and lets you ask questions about it. SQLite is a full SQL database in a single file, and Node.js has it built in as `node:sqlite`: nothing to install and no separate database server to run. One honest note: in Node.js 26 this module is a *release candidate* (stability 1.2), not yet fully stable, so its small details may still change. If you need a package that is stable today, `better-sqlite3` is the usual choice; it has a very similar API but needs a native install."
      tr: "Veritabanı, sunucu yeniden başlasa da veriyi saklar ve veriye soru sormanı sağlar. SQLite tek bir dosyada tam bir SQL veritabanıdır ve Node.js onu `node:sqlite` olarak hazır getirir: kurulacak bir şey yok, ayrıca çalıştırılacak bir veritabanı sunucusu yok. Dürüst bir not: Node.js 26'da bu modül *sürüm adayı* (stability 1.2) durumunda, henüz tam kararlı değil; küçük ayrıntıları hâlâ değişebilir. Bugün kararlı bir paket istersen genelde `better-sqlite3` seçilir; API'si çok benzer ama native kurulum ister."
    learn:
      en: |
        - Tables, rows and columns; `CREATE TABLE`, `INSERT`, `SELECT`, `UPDATE`
        - Prepared statements: `db.prepare("... WHERE code = ?")` with `?` placeholders, which stop SQL injection
        - WAL mode and `busy_timeout`, which let several readers and a writer work together; `synchronous = NORMAL` is the setting recommended with WAL: a commit no longer waits for the disk every single time (after a power cut the last few commits may be lost, but the database is not corrupted)
        - Passing the database into `createApp(db)`, so tests can use an in-memory database
      tr: |
        - Tablolar, satırlar ve sütunlar; `CREATE TABLE`, `INSERT`, `SELECT`, `UPDATE`
        - Hazır sorgular (prepared statement): `?` yer tutuculu `db.prepare("... WHERE code = ?")`, SQL injection'ı engeller
        - WAL modu ve `busy_timeout`; birkaç okuyucunun ve bir yazıcının birlikte çalışmasını sağlar; `synchronous = NORMAL` WAL ile önerilen ayardır: her commit artık her seferinde diski beklemez (elektrik kesilirse son birkaç commit kaybolabilir ama veritabanı bozulmaz)
        - Veritabanını `createApp(db)` içine vermek; böylece testler bellekteki bir veritabanı kullanabilir
    do:
      en: |
        1. Create `src/db.js` with the code below. `openDb` opens the file (default `data.db`) and creates the `links` table if it does not exist.
        2. Replace `src/app.js` and `src/server.js` with the versions below. Links now go into the database, and a click on a short link adds 1 to `clicks`.
        3. Add the database files to `.gitignore`: `data.db*` (the `*` also covers the `-wal` and `-shm` files SQLite creates in WAL mode).
        4. Run `npm run dev`, create a link, stop the server with Ctrl+C, start it again and open the short link. It still works.
        5. Optional: look into the database with `sqlite3 data.db "select * from links"` if you have the `sqlite3` tool.
      tr: |
        1. Aşağıdaki kodla `src/db.js` dosyasını oluştur. `openDb` dosyayı (varsayılan `data.db`) açar ve yoksa `links` tablosunu oluşturur.
        2. `src/app.js` ve `src/server.js` dosyalarını aşağıdaki sürümlerle değiştir. Bağlantılar artık veritabanına gidiyor ve bir kısa bağlantıya her tıklama `clicks` değerini 1 artırıyor.
        3. Veritabanı dosyalarını `.gitignore`'a ekle: `data.db*` (`*`, SQLite'ın WAL modunda oluşturduğu `-wal` ve `-shm` dosyalarını da kapsar).
        4. `npm run dev` çalıştır, bir bağlantı oluştur, sunucuyu Ctrl+C ile durdur, tekrar başlat ve kısa bağlantıyı aç. Hâlâ çalışıyor.
        5. İsteğe bağlı: `sqlite3` aracın varsa veritabanının içine `sqlite3 data.db "select * from links"` ile bak.
    code:
      - file: src/db.js
        lang: js
        text: |
          import { DatabaseSync } from "node:sqlite";

          export function openDb(path = "data.db") {
            const db = new DatabaseSync(path);
            db.exec(`
              PRAGMA busy_timeout = 5000;
              PRAGMA journal_mode = WAL;
              PRAGMA synchronous = NORMAL;
              CREATE TABLE IF NOT EXISTS links (
                code TEXT PRIMARY KEY,
                url TEXT NOT NULL,
                clicks INTEGER NOT NULL DEFAULT 0,
                created_at TEXT NOT NULL DEFAULT (datetime('now'))
              );
            `);
            return db;
          }
      - file: src/app.js
        lang: js
        text: |
          import express from "express";
          import { randomBytes } from "node:crypto";
          import { z } from "zod";
          import { HttpError, parse } from "./validate.js";

          const newLink = z.object({
            url: z.url({ protocol: /^https?$/ }).max(2048),
          });

          export function createApp(db) {
            const app = express();
            const insertLink = db.prepare("INSERT INTO links (code, url) VALUES (?, ?)");
            const findLink = db.prepare("SELECT url FROM links WHERE code = ?");
            const countClick = db.prepare("UPDATE links SET clicks = clicks + 1 WHERE code = ?");

            app.use(express.json({ limit: "10kb" }));

            app.get("/health", (req, res) => {
              res.json({ status: "ok" });
            });

            app.post("/links", (req, res) => {
              const { url } = parse(newLink, req.body);
              const code = randomBytes(4).toString("base64url");
              insertLink.run(code, url);
              res.status(201).json({ code, url });
            });

            app.get("/:code", (req, res) => {
              const link = findLink.get(req.params.code);
              if (!link) throw new HttpError(404, "not found");
              countClick.run(req.params.code);
              res.redirect(link.url);
            });

            app.use((req, res) => {
              res.status(404).json({ error: "not found" });
            });

            app.use((err, req, res, next) => {
              if (err instanceof HttpError) {
                return res.status(err.status).json({ error: err.message, details: err.details });
              }
              if (err.status && err.status < 500) {
                return res.status(err.status).json({ error: err.status === 413 ? "body too large" : "bad request" });
              }
              console.error(err);
              res.status(500).json({ error: "server error" });
            });

            return app;
          }
      - file: src/server.js
        lang: js
        text: |
          import { createApp } from "./app.js";
          import { openDb } from "./db.js";

          const port = Number(process.env.PORT) || 3000;
          const db = openDb(process.env.DB_PATH);

          createApp(db).listen(port, () => {
            console.log(`Listening on http://localhost:${port}`);
          });
      - file: .gitignore
        lang: text
        text: |
          node_modules
          data.db*
    mistakes:
      - problem:
          en: "Building SQL by joining strings, like `` `... WHERE code = '${code}'` ``."
          tr: "SQL'i string birleştirerek kurmak, örneğin `` `... WHERE code = '${code}'` ``."
        fix:
          en: "This allows SQL injection: a visitor can put SQL into `code`. Always use `?` placeholders with `db.prepare(...).get(value)`; the database treats the value as data, never as SQL."
          tr: "Bu SQL injection'a izin verir: bir ziyaretçi `code` içine SQL yazabilir. Her zaman `?` yer tutucularını ve `db.prepare(...).get(değer)` kullan; veritabanı değeri hep veri olarak görür, asla SQL olarak değil."
      - problem:
          en: "`No such built-in module: node:sqlite` (or an error asking for a flag) on an old Node.js."
          tr: "Eski bir Node.js'te `No such built-in module: node:sqlite` hatası (ya da bir flag isteyen hata)."
        fix:
          en: "Check `node --version`. `node:sqlite` needs 22.13 or newer without any flag. Install the current LTS."
          tr: "`node --version` ile kontrol et. `node:sqlite` hiçbir flag olmadan 22.13 veya daha yenisini ister. Güncel LTS'i kur."
      - problem:
          en: "Committing `data.db` to Git."
          tr: "`data.db` dosyasını Git'e commit etmek."
        fix:
          en: "The database holds real data and changes all the time. Keep it out of Git with `.gitignore`; if it is already committed, remove it with `git rm --cached data.db`."
          tr: "Veritabanı gerçek veri tutar ve sürekli değişir. `.gitignore` ile Git dışında tut; zaten commit'lendiyse `git rm --cached data.db` ile çıkar."
    quiz:
      - q:
          en: "Why use `?` placeholders in `db.prepare(\"... WHERE code = ?\")`?"
          tr: "`db.prepare(\"... WHERE code = ?\")` içinde neden `?` yer tutucuları kullanıyoruz?"
        options:
          en:
            - "They make the query run faster than any other way"
            - "The value is passed as data, so it can never be run as SQL"
            - "SQLite requires them for every query"
          tr:
            - "Sorguyu her yoldan daha hızlı çalıştırırlar"
            - "Değer veri olarak verilir, bu yüzden asla SQL olarak çalıştırılamaz"
            - "SQLite her sorgu için bunları zorunlu kılar"
        answer: 1
        why:
          en: "Placeholders keep data and SQL apart, which blocks SQL injection. Speed is a small bonus when you reuse a prepared statement."
          tr: "Yer tutucular veriyi ve SQL'i ayrı tutar, bu da SQL injection'ı engeller. Hazır sorguyu tekrar kullanınca hız küçük bir bonustur."
    sources:
      - title: "Node.js: node:sqlite"
        url: https://nodejs.org/docs/latest/api/sqlite.html
      - title: "SQLite: Write-Ahead Logging"
        url: https://sqlite.org/wal.html

  - id: crud
    stage: data-api
    title:
      en: "Complete the API: list, show and delete, in a router"
      tr: "API'yi tamamlama: listeleme, gösterme ve silme, bir router içinde"
    minutes: 40
    needs: [sqlite]
    why:
      en: "A useful REST API lets you create, read and delete things (and update them, when that makes sense). Moving the `/links` routes into their own file with an Express `Router` keeps `app.js` short as the project grows."
      tr: "Kullanışlı bir REST API, şeyleri oluşturmanı, okumanı ve silmeni (mantıklıysa güncellemeni de) sağlar. `/links` route'larını bir Express `Router` ile kendi dosyasına taşımak, proje büyürken `app.js`'i kısa tutar."
    learn:
      en: |
        - REST naming: `GET /links` (list), `GET /links/:code` (one), `DELETE /links/:code`
        - Status codes: 204 No Content for a successful delete, 404 when it does not exist
        - Query strings for paging: `/links?limit=10&offset=20`, validated like any other input
        - `Router`: a mini app you mount at a path with `app.use("/links", router)`
      tr: |
        - REST adlandırması: `GET /links` (liste), `GET /links/:code` (tek bir tane), `DELETE /links/:code`
        - Durum kodları: başarılı silme için 204 No Content, yoksa 404
        - Sayfalama için query string'ler: `/links?limit=10&offset=20`, diğer girdiler gibi doğrulanır
        - `Router`: `app.use("/links", router)` ile bir yola bağladığın küçük bir uygulama
    do:
      en: |
        1. Create `src/links.js` with the code below.
        2. Replace `src/app.js` with the version below. It mounts the router; the redirect stays in `app.js`.
        3. Create two or three links, then try the commands below: list, list with a limit, show one, delete one, show it again (404).
        4. Commit: `git add .` and `git commit -m "Links router"`.
      tr: |
        1. Aşağıdaki kodla `src/links.js` dosyasını oluştur.
        2. `src/app.js` dosyasını aşağıdaki sürümle değiştir. Router'ı bağlar; yönlendirme `app.js` içinde kalır.
        3. İki üç bağlantı oluştur, sonra aşağıdaki komutları dene: listele, limitle listele, birini göster, birini sil, tekrar göster (404).
        4. Commit'le: `git add .` ve `git commit -m "Links router"`.
    code:
      - file: src/links.js
        lang: js
        text: |
          import { Router } from "express";
          import { randomBytes } from "node:crypto";
          import { z } from "zod";
          import { HttpError, parse } from "./validate.js";

          const newLink = z.object({
            url: z.url({ protocol: /^https?$/ }).max(2048),
          });

          const listQuery = z.object({
            limit: z.coerce.number().int().min(1).max(100).default(20),
            offset: z.coerce.number().int().min(0).default(0),
          });

          export function linksRouter(db) {
            const router = Router();
            const insert = db.prepare("INSERT INTO links (code, url) VALUES (?, ?)");
            const list = db.prepare(
              "SELECT code, url, clicks, created_at FROM links ORDER BY rowid DESC LIMIT ? OFFSET ?",
            );
            const one = db.prepare("SELECT code, url, clicks, created_at FROM links WHERE code = ?");
            const remove = db.prepare("DELETE FROM links WHERE code = ?");

            router.post("/", (req, res) => {
              const { url } = parse(newLink, req.body);
              const code = randomBytes(4).toString("base64url");
              insert.run(code, url);
              res.status(201).json({ code, url });
            });

            router.get("/", (req, res) => {
              const { limit, offset } = parse(listQuery, req.query);
              res.json(list.all(limit, offset));
            });

            router.get("/:code", (req, res) => {
              const link = one.get(req.params.code);
              if (!link) throw new HttpError(404, "not found");
              res.json(link);
            });

            router.delete("/:code", (req, res) => {
              const { changes } = remove.run(req.params.code);
              if (changes === 0) throw new HttpError(404, "not found");
              res.status(204).end();
            });

            return router;
          }
      - file: src/app.js
        lang: js
        text: |
          import express from "express";
          import { HttpError } from "./validate.js";
          import { linksRouter } from "./links.js";

          export function createApp(db) {
            const app = express();
            const findLink = db.prepare("SELECT url FROM links WHERE code = ?");
            const countClick = db.prepare("UPDATE links SET clicks = clicks + 1 WHERE code = ?");

            app.use(express.json({ limit: "10kb" }));

            app.get("/health", (req, res) => {
              res.json({ status: "ok" });
            });

            app.use("/links", linksRouter(db));

            app.get("/:code", (req, res) => {
              const link = findLink.get(req.params.code);
              if (!link) throw new HttpError(404, "not found");
              countClick.run(req.params.code);
              res.redirect(link.url);
            });

            app.use((req, res) => {
              res.status(404).json({ error: "not found" });
            });

            app.use((err, req, res, next) => {
              if (err instanceof HttpError) {
                return res.status(err.status).json({ error: err.message, details: err.details });
              }
              if (err.status && err.status < 500) {
                return res.status(err.status).json({ error: err.status === 413 ? "body too large" : "bad request" });
              }
              console.error(err);
              res.status(500).json({ error: "server error" });
            });

            return app;
          }
      - file: terminal
        lang: sh
        text: |
          curl http://localhost:3000/links
          curl "http://localhost:3000/links?limit=2"
          curl http://localhost:3000/links/<code>
          curl -i -X DELETE http://localhost:3000/links/<code>
          curl -i http://localhost:3000/links/<code>
    mistakes:
      - problem:
          en: "`GET /links` is caught by the `/:code` route and answers 404."
          tr: "`GET /links` `/:code` route'una takılıp 404 dönüyor."
        fix:
          en: "Express tries routes in the order you wrote them. Mount specific paths (`/links`, `/health`) before the catch-all `/:code`."
          tr: "Express route'ları yazdığın sırayla dener. Belirli yolları (`/links`, `/health`) her şeyi yakalayan `/:code`'dan önce bağla."
      - problem:
          en: "Letting the client ask for `limit=1000000`."
          tr: "İstemcinin `limit=1000000` istemesine izin vermek."
        fix:
          en: "Always cap list sizes. The schema above allows at most 100 per request."
          tr: "Liste boyutlarına her zaman üst sınır koy. Yukarıdaki şema istek başına en fazla 100'e izin verir."
    quiz:
      - q:
          en: "Which status code should a successful `DELETE` with no body return?"
          tr: "Body'siz başarılı bir `DELETE` hangi durum kodunu döndürmeli?"
        options:
          en:
            - "204"
            - "301"
            - "201"
          tr:
            - "204"
            - "301"
            - "201"
        answer: 0
        why:
          en: "204 No Content means it worked and there is nothing to send back."
          tr: "204 No Content, işin başarılı olduğunu ve geri gönderilecek bir şey olmadığını söyler."
    sources:
      - title: "Express: Router"
        url: https://expressjs.com/en/guide/routing.html#express-router
      - title: "MDN: DELETE"
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods/DELETE

  - id: tests
    stage: testing
    title:
      en: "Write tests with node:test and supertest"
      tr: "node:test ve supertest ile test yazma"
    minutes: 45
    needs: [crud]
    why:
      en: "Tests are small programs that call your API and check the answers. They catch mistakes in seconds, and let you change code later without fear. Node.js has a test runner built in (`node:test`), so you need no Jest or Vitest. `supertest` calls your Express app directly, without opening a port."
      tr: "Testler, API'nı çağırıp cevapları kontrol eden küçük programlardır. Hataları saniyeler içinde yakalar ve sonradan kodu korkmadan değiştirmeni sağlarlar. Node.js'in hazır test çalıştırıcısı var (`node:test`), yani Jest ya da Vitest'e gerek yok. `supertest` Express uygulamanı port açmadan doğrudan çağırır."
    learn:
      en: |
        - `test("name", async () => { ... })` and `assert` from `node:assert/strict`
        - Giving every test its own fresh in-memory database (`openDb(":memory:")`)
        - `supertest`: `request(app).post("/links").send({...})`, then check `status`, `body`, `headers`
        - The other way: start the app on a random port and call it with `fetch`
        - What to test first: the happy path, the bad input, and the not-found cases
      tr: |
        - `test("ad", async () => { ... })` ve `node:assert/strict` içinden `assert`
        - Her teste kendi temiz, bellekteki veritabanını vermek (`openDb(":memory:")`)
        - `supertest`: `request(app).post("/links").send({...})`, sonra `status`, `body`, `headers` kontrolü
        - Diğer yol: uygulamayı rastgele bir portta başlatıp `fetch` ile çağırmak
        - Önce neyi test etmeli: normal akış, kötü girdi ve bulunamadı durumları
    do:
      en: |
        1. Install supertest as a development dependency (it is only needed for tests): `npm install --save-dev supertest`.
        2. Add the test script: `npm pkg set scripts.test="node --test"`. `node --test` finds files named `*.test.js` by itself.
        3. Create `tests/links.test.js` with the code below.
        4. Run `npm test`. You should see every test pass (a green check mark for each).
        5. Break something on purpose, for example change `201` to `200` in `src/links.js`, run the tests again and read the failure message. Then undo the change.
        6. Commit: `git add .` and `git commit -m "Add tests"`.
      tr: |
        1. supertest'i geliştirme bağımlılığı olarak kur (sadece testlerde gerekir): `npm install --save-dev supertest`.
        2. Test script'ini ekle: `npm pkg set scripts.test="node --test"`. `node --test` `*.test.js` adlı dosyaları kendisi bulur.
        3. Aşağıdaki kodla `tests/links.test.js` dosyasını oluştur.
        4. `npm test` çalıştır. Bütün testlerin geçtiğini görmelisin (her biri için yeşil bir onay işareti).
        5. Bilerek bir şeyi boz, örneğin `src/links.js` içinde `201`'i `200` yap, testleri tekrar çalıştır ve hata mesajını oku. Sonra değişikliği geri al.
        6. Commit'le: `git add .` ve `git commit -m "Add tests"`.
    code:
      - file: tests/links.test.js
        lang: js
        text: |
          import { test } from "node:test";
          import assert from "node:assert/strict";
          import { once } from "node:events";
          import request from "supertest";
          import { createApp } from "../src/app.js";
          import { openDb } from "../src/db.js";

          // Every test gets its own app and its own empty in-memory database.
          const newApp = () => createApp(openDb(":memory:"));

          test("creates a link and redirects to it", async () => {
            const api = request(newApp());
            const created = await api.post("/links").send({ url: "https://example.com/a" });
            assert.equal(created.status, 201);

            const res = await api.get(`/${created.body.code}`);
            assert.equal(res.status, 302);
            assert.equal(res.headers.location, "https://example.com/a");
          });

          test("counts clicks", async () => {
            const api = request(newApp());
            const { body } = await api.post("/links").send({ url: "https://example.com/b" });
            await api.get(`/${body.code}`);
            await api.get(`/${body.code}`);

            const link = await api.get(`/links/${body.code}`);
            assert.equal(link.body.clicks, 2);
          });

          test("rejects bad input with 400", async () => {
            const api = request(newApp());
            for (const body of [{}, { url: "nope" }, { url: "javascript:alert(1)" }]) {
              const res = await api.post("/links").send(body);
              assert.equal(res.status, 400);
              assert.equal(res.body.details[0].field, "url");
            }
          });

          test("unknown codes are 404", async () => {
            const api = request(newApp());
            assert.equal((await api.get("/nothing")).status, 404);
            assert.equal((await api.get("/links/nothing")).status, 404);
          });

          test("deletes a link", async () => {
            const api = request(newApp());
            const { body } = await api.post("/links").send({ url: "https://example.com/c" });
            assert.equal((await api.delete(`/links/${body.code}`)).status, 204);
            assert.equal((await api.get(`/${body.code}`)).status, 404);
          });

          test("works over a real connection with fetch", async (t) => {
            const server = newApp().listen(0); // port 0: the system picks a free port
            t.after(() => {
              server.closeAllConnections();
              server.close();
            });
            await once(server, "listening");

            const res = await fetch(`http://127.0.0.1:${server.address().port}/health`);
            assert.deepEqual(await res.json(), { status: "ok" });
          });
    mistakes:
      - problem:
          en: "Tests pass alone but fail together because they share data."
          tr: "Testler tek tek geçiyor ama veriyi paylaştıkları için birlikte çalıştırınca başarısız oluyor."
        fix:
          en: "Give each test its own database, as above with `openDb(\":memory:\")`. Never let one test depend on another."
          tr: "Her teste kendi veritabanını ver, yukarıda `openDb(\":memory:\")` ile yaptığımız gibi. Hiçbir testi diğerine bağımlı yapma."
      - problem:
          en: "`npm test` hangs after the tests finish."
          tr: "Testler bittikten sonra `npm test` takılıp kalıyor."
        fix:
          en: "A server or connection is still open. Close what you open: in the `fetch` test the server is closed in `t.after`."
          tr: "Bir sunucu ya da bağlantı hâlâ açık. Açtığını kapat: `fetch` testinde sunucu `t.after` içinde kapatılıyor."
      - problem:
          en: "Testing only the happy path."
          tr: "Sadece normal akışı test etmek."
        fix:
          en: "Bugs hide in bad input and edge cases. For every route also test a wrong input and a missing item, as the tests above do."
          tr: "Hatalar kötü girdide ve uç durumlarda saklanır. Her route için bir yanlış girdiyi ve eksik bir öğeyi de test et, yukarıdaki testlerin yaptığı gibi."
    quiz:
      - q:
          en: "Why does each test call `openDb(\":memory:\")`?"
          tr: "Her test neden `openDb(\":memory:\")` çağırıyor?"
        options:
          en:
            - "To keep the tests' data after they finish"
            - "So every test starts with a fresh empty database and tests cannot affect each other"
            - "Because SQLite cannot use files"
          tr:
            - "Testler bittikten sonra verilerini saklamak için"
            - "Her test temiz boş bir veritabanıyla başlasın ve testler birbirini etkilemesin diye"
            - "SQLite dosya kullanamadığı için"
        answer: 1
        why:
          en: "An in-memory database disappears when the connection closes, so each test is isolated and leaves nothing behind."
          tr: "Bellekteki veritabanı bağlantı kapanınca yok olur; böylece her test yalıtılmış olur ve arkasında bir şey bırakmaz."
    sources:
      - title: "Node.js: Test runner"
        url: https://nodejs.org/docs/latest/api/test.html
      - title: "supertest"
        url: https://github.com/ladjs/supertest#readme

  - id: auth
    stage: security
    title:
      en: "Accounts: hashed passwords and login sessions"
      tr: "Hesaplar: hash'lenmiş şifreler ve giriş oturumları"
    minutes: 75
    needs: [tests]
    why:
      en: "Right now anyone can create and delete anybody's links. To make links belong to people you need accounts. The two rules you must never break: never store a password (store a slow hash of it), and never trust a request just because it claims to be someone (check a secret token that only the real user received at login)."
      tr: "Şu anda herkes herkesin bağlantısını oluşturup silebilir. Bağlantıları kişilere ait yapmak için hesaplar gerekir. Asla bozmaman gereken iki kural: şifreyi asla saklama (onun yavaş bir hash'ini sakla) ve bir isteğe sadece birisi olduğunu söylediği için güvenme (giriş sırasında sadece gerçek kullanıcıya verilen gizli bir token'ı kontrol et)."
    learn:
      en: |
        - Hashing vs encrypting: a hash cannot be turned back into the password. Use a slow, salted one: scrypt, which is built into Node.js (`node:crypto`)
        - A salt (random bytes stored with the hash) makes two equal passwords look different
        - Sessions with tokens: login returns a long random token; the client sends it as `Authorization: Bearer <token>`; the server stores only the SHA-256 hash of the token, so a stolen database does not give working tokens
        - Not telling attackers more than needed: same message for wrong email and wrong password, and a dummy hash so both take the same time
        - Authorization: a user can only see and delete their own links, and other people's links answer 404
        - Browser apps usually keep the token in an `HttpOnly` cookie instead; the server side idea is the same
      tr: |
        - Hash'leme ile şifrelemenin farkı: hash tekrar şifreye çevrilemez. Yavaş ve salt'lı birini kullan: Node.js'e hazır gelen scrypt (`node:crypto`)
        - Salt (hash ile birlikte saklanan rastgele byte'lar) iki aynı şifrenin farklı görünmesini sağlar
        - Token'lı oturumlar: giriş uzun, rastgele bir token döndürür; istemci onu `Authorization: Bearer <token>` olarak gönderir; sunucu token'ın sadece SHA-256 hash'ini saklar, böylece çalınan bir veritabanı çalışan token vermez
        - Saldırganlara gerekenden fazlasını söylememek: yanlış e-posta ve yanlış şifre için aynı mesaj, ve ikisi de aynı sürede bitsin diye sahte bir hash
        - Yetkilendirme: kullanıcı sadece kendi bağlantılarını görüp silebilir, başkalarının bağlantıları 404 döner
        - Tarayıcı uygulamaları token'ı genelde bir `HttpOnly` cookie'de tutar; sunucu tarafındaki fikir aynıdır
    do:
      en: |
        1. Delete your development data: `rm -f data.db*`. The tables change, and in a real project you would write a migration (an `ALTER TABLE` script); for local test data starting fresh is fine.
        2. Replace `src/db.js` with the new version (users, sessions, and `user_id` on links).
        3. Create `src/auth.js` (password hashing, tokens, the `requireAuth` middleware) and `src/accounts.js` (register, login, logout, me).
        4. Replace `src/links.js` (every route now needs a login and only touches your own links) and `src/app.js` (it mounts `/auth`).
        5. Replace `tests/links.test.js` and add `tests/helpers.js` and `tests/auth.test.js`. Run `npm test` and check everything passes.
        6. Try it by hand with the curl commands below: register, log in (copy the token), create a link with the token, and try the same without it (401).
        7. Commit: `git add .` and `git commit -m "Accounts and sessions"`.
      tr: |
        1. Geliştirme verini sil: `rm -f data.db*`. Tablolar değişiyor; gerçek bir projede bir migration (`ALTER TABLE` script'i) yazardın, yerel test verisi için baştan başlamak yeterli.
        2. `src/db.js` dosyasını yeni sürümle değiştir (users, sessions ve links üzerinde `user_id`).
        3. `src/auth.js` (şifre hash'leme, token'lar, `requireAuth` middleware'i) ve `src/accounts.js` (kayıt, giriş, çıkış, me) dosyalarını oluştur.
        4. `src/links.js` (her route artık giriş ister ve sadece senin bağlantılarına dokunur) ve `src/app.js` (`/auth`'u bağlar) dosyalarını değiştir.
        5. `tests/links.test.js` dosyasını değiştir, `tests/helpers.js` ve `tests/auth.test.js` dosyalarını ekle. `npm test` çalıştır ve hepsinin geçtiğini kontrol et.
        6. Aşağıdaki curl komutlarıyla elle dene: kayıt ol, giriş yap (token'ı kopyala), token ile bağlantı oluştur ve aynısını token olmadan dene (401).
        7. Commit'le: `git add .` ve `git commit -m "Accounts and sessions"`.
    code:
      - file: src/db.js
        lang: js
        text: |
          import { DatabaseSync } from "node:sqlite";

          export function openDb(path = "data.db") {
            const db = new DatabaseSync(path);
            db.exec(`
              PRAGMA busy_timeout = 5000;
              PRAGMA journal_mode = WAL;
              PRAGMA synchronous = NORMAL;
              PRAGMA foreign_keys = ON;

              CREATE TABLE IF NOT EXISTS users (
                id INTEGER PRIMARY KEY,
                email TEXT NOT NULL UNIQUE,
                password_hash TEXT NOT NULL,
                created_at TEXT NOT NULL DEFAULT (datetime('now'))
              );

              CREATE TABLE IF NOT EXISTS sessions (
                token_hash TEXT PRIMARY KEY,
                user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                expires_at INTEGER NOT NULL
              );

              CREATE TABLE IF NOT EXISTS links (
                code TEXT PRIMARY KEY,
                url TEXT NOT NULL,
                clicks INTEGER NOT NULL DEFAULT 0,
                user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                created_at TEXT NOT NULL DEFAULT (datetime('now'))
              );
            `);
            return db;
          }
      - file: src/auth.js
        lang: js
        text: |
          import { createHash, randomBytes, scrypt as scryptCallback, timingSafeEqual } from "node:crypto";
          import { promisify } from "node:util";
          import { HttpError } from "./validate.js";

          const scrypt = promisify(scryptCallback);

          // scrypt cost: 64 MiB of memory per hash (N = 2^16, r = 8, p = 2 is one of the
          // combinations the OWASP Password Storage Cheat Sheet lists as equally strong).
          const COST = { N: 2 ** 16, r: 8, p: 2, maxmem: 128 * 1024 * 1024 };

          export async function hashPassword(password) {
            const salt = randomBytes(16);
            const key = await scrypt(password, salt, 64, COST);
            return `${salt.toString("hex")}:${key.toString("hex")}`;
          }

          export async function checkPassword(password, stored) {
            const [saltHex, keyHex] = stored.split(":");
            if (!saltHex || !keyHex) return false;
            const expected = Buffer.from(keyHex, "hex");
            const key = await scrypt(password, Buffer.from(saltHex, "hex"), expected.length, COST);
            return timingSafeEqual(key, expected);
          }

          // The token the user receives is random; we store only its hash.
          export const newToken = () => randomBytes(32).toString("base64url");
          export const hashToken = (token) => createHash("sha256").update(token).digest("hex");

          export function tokenFrom(req) {
            const [scheme, token] = (req.get("authorization") ?? "").split(" ");
            return scheme === "Bearer" && token ? token : undefined;
          }

          // Middleware: stops the request with 401 unless the token is a valid, unexpired session.
          export function requireAuth(db) {
            const find = db.prepare(
              `SELECT users.id, users.email FROM sessions
               JOIN users ON users.id = sessions.user_id
               WHERE sessions.token_hash = ? AND sessions.expires_at > ?`,
            );
            return (req, res, next) => {
              const token = tokenFrom(req);
              const user = token ? find.get(hashToken(token), Date.now()) : undefined;
              if (!user) throw new HttpError(401, "login required");
              req.user = { id: user.id, email: user.email };
              next();
            };
          }
      - file: src/accounts.js
        lang: js
        text: |
          import { Router } from "express";
          import { z } from "zod";
          import { HttpError, parse } from "./validate.js";
          import { checkPassword, hashPassword, hashToken, newToken, requireAuth, tokenFrom } from "./auth.js";

          const SESSION_MS = 7 * 24 * 60 * 60 * 1000; // a session lasts 7 days

          const credentials = z.object({
            email: z
              .email()
              .max(254)
              .transform((email) => email.toLowerCase()),
            password: z.string().min(8).max(128),
          });

          // A real hash of a throwaway password. When the email is unknown we still check against it,
          // so "wrong email" takes as long as "wrong password" and timing gives nothing away.
          const dummyHash = await hashPassword("not-a-real-password");

          export function accountsRouter(db) {
            const router = Router();
            const insertUser = db.prepare(
              "INSERT INTO users (email, password_hash) VALUES (?, ?) ON CONFLICT(email) DO NOTHING",
            );
            const findUser = db.prepare("SELECT id, password_hash FROM users WHERE email = ?");
            const insertSession = db.prepare("INSERT INTO sessions (token_hash, user_id, expires_at) VALUES (?, ?, ?)");
            const deleteExpired = db.prepare("DELETE FROM sessions WHERE expires_at <= ?");
            const deleteSession = db.prepare("DELETE FROM sessions WHERE token_hash = ?");

            router.post("/register", async (req, res) => {
              const { email, password } = parse(credentials, req.body);
              const { changes } = insertUser.run(email, await hashPassword(password));
              if (changes === 0) throw new HttpError(409, "email already registered");
              res.status(201).json({ email });
            });

            router.post("/login", async (req, res) => {
              const { email, password } = parse(credentials, req.body);
              const user = findUser.get(email);
              const ok = await checkPassword(password, user?.password_hash ?? dummyHash);
              if (!user || !ok) throw new HttpError(401, "wrong email or password");

              deleteExpired.run(Date.now());
              const token = newToken();
              insertSession.run(hashToken(token), user.id, Date.now() + SESSION_MS);
              res.json({ token, expiresInSeconds: SESSION_MS / 1000 });
            });

            router.post("/logout", requireAuth(db), (req, res) => {
              deleteSession.run(hashToken(tokenFrom(req)));
              res.status(204).end();
            });

            router.get("/me", requireAuth(db), (req, res) => {
              res.json(req.user);
            });

            return router;
          }
      - file: src/links.js
        lang: js
        text: |
          import { Router } from "express";
          import { randomBytes } from "node:crypto";
          import { z } from "zod";
          import { requireAuth } from "./auth.js";
          import { HttpError, parse } from "./validate.js";

          const newLink = z.object({
            url: z.url({ protocol: /^https?$/ }).max(2048),
          });

          const listQuery = z.object({
            limit: z.coerce.number().int().min(1).max(100).default(20),
            offset: z.coerce.number().int().min(0).default(0),
          });

          export function linksRouter(db) {
            const router = Router();
            const insert = db.prepare("INSERT INTO links (code, url, user_id) VALUES (?, ?, ?)");
            const list = db.prepare(
              "SELECT code, url, clicks, created_at FROM links WHERE user_id = ? ORDER BY rowid DESC LIMIT ? OFFSET ?",
            );
            const one = db.prepare("SELECT code, url, clicks, created_at FROM links WHERE code = ? AND user_id = ?");
            const remove = db.prepare("DELETE FROM links WHERE code = ? AND user_id = ?");

            router.use(requireAuth(db)); // every route below needs a login

            router.post("/", (req, res) => {
              const { url } = parse(newLink, req.body);
              const code = randomBytes(4).toString("base64url");
              insert.run(code, url, req.user.id);
              res.status(201).json({ code, url });
            });

            router.get("/", (req, res) => {
              const { limit, offset } = parse(listQuery, req.query);
              res.json(list.all(req.user.id, limit, offset));
            });

            // Someone else's link answers 404, not 403: we do not reveal that it exists.
            router.get("/:code", (req, res) => {
              const link = one.get(req.params.code, req.user.id);
              if (!link) throw new HttpError(404, "not found");
              res.json(link);
            });

            router.delete("/:code", (req, res) => {
              const { changes } = remove.run(req.params.code, req.user.id);
              if (changes === 0) throw new HttpError(404, "not found");
              res.status(204).end();
            });

            return router;
          }
      - file: src/app.js
        lang: js
        text: |
          import express from "express";
          import { HttpError } from "./validate.js";
          import { accountsRouter } from "./accounts.js";
          import { linksRouter } from "./links.js";

          export function createApp(db) {
            const app = express();
            const findLink = db.prepare("SELECT url FROM links WHERE code = ?");
            const countClick = db.prepare("UPDATE links SET clicks = clicks + 1 WHERE code = ?");

            app.use(express.json({ limit: "10kb" }));

            app.get("/health", (req, res) => {
              res.json({ status: "ok" });
            });

            app.use("/auth", accountsRouter(db));
            app.use("/links", linksRouter(db));

            // Following a short link is public: no login needed.
            app.get("/:code", (req, res) => {
              const link = findLink.get(req.params.code);
              if (!link) throw new HttpError(404, "not found");
              countClick.run(req.params.code);
              res.redirect(link.url);
            });

            app.use((req, res) => {
              res.status(404).json({ error: "not found" });
            });

            app.use((err, req, res, next) => {
              if (err instanceof HttpError) {
                return res.status(err.status).json({ error: err.message, details: err.details });
              }
              if (err.status && err.status < 500) {
                return res.status(err.status).json({ error: err.status === 413 ? "body too large" : "bad request" });
              }
              console.error(err);
              res.status(500).json({ error: "server error" });
            });

            return app;
          }
      - file: tests/helpers.js
        lang: js
        text: |
          import request from "supertest";
          import { createApp } from "../src/app.js";
          import { openDb } from "../src/db.js";

          // A fresh app with a fresh in-memory database.
          export const newApi = (options) => request(createApp(openDb(":memory:"), options));

          // Registers and logs in; returns the session token.
          export async function signUp(api, email = "ada@example.com", password = "correct horse battery") {
            await api.post("/auth/register").send({ email, password });
            const res = await api.post("/auth/login").send({ email, password });
            return res.body.token;
          }

          export const bearer = (token) => [token, { type: "bearer" }];
      - file: tests/links.test.js
        lang: js
        text: |
          import { test } from "node:test";
          import assert from "node:assert/strict";
          import { once } from "node:events";
          import { createApp } from "../src/app.js";
          import { openDb } from "../src/db.js";
          import { bearer, newApi, signUp } from "./helpers.js";

          test("creates a link and redirects to it, without a login", async () => {
            const api = newApi();
            const token = await signUp(api);
            const created = await api.post("/links").auth(...bearer(token)).send({ url: "https://example.com/a" });
            assert.equal(created.status, 201);

            const res = await api.get(`/${created.body.code}`);
            assert.equal(res.status, 302);
            assert.equal(res.headers.location, "https://example.com/a");
          });

          test("counts clicks", async () => {
            const api = newApi();
            const token = await signUp(api);
            const { body } = await api.post("/links").auth(...bearer(token)).send({ url: "https://example.com/b" });
            await api.get(`/${body.code}`);
            await api.get(`/${body.code}`);

            const link = await api.get(`/links/${body.code}`).auth(...bearer(token));
            assert.equal(link.body.clicks, 2);
          });

          test("rejects bad input with 400", async () => {
            const api = newApi();
            const token = await signUp(api);
            for (const body of [{}, { url: "nope" }, { url: "javascript:alert(1)" }]) {
              const res = await api.post("/links").auth(...bearer(token)).send(body);
              assert.equal(res.status, 400);
              assert.equal(res.body.details[0].field, "url");
            }
          });

          test("needs a login to create, list or delete", async () => {
            const api = newApi();
            assert.equal((await api.post("/links").send({ url: "https://example.com" })).status, 401);
            assert.equal((await api.get("/links")).status, 401);
            assert.equal((await api.delete("/links/abc")).status, 401);
            assert.equal((await api.get("/links").auth(...bearer("made-up-token"))).status, 401);
          });

          test("unknown codes are 404", async () => {
            const api = newApi();
            const token = await signUp(api);
            assert.equal((await api.get("/nothing")).status, 404);
            assert.equal((await api.get("/links/nothing").auth(...bearer(token))).status, 404);
          });

          test("users only see and delete their own links", async () => {
            const api = newApi();
            const ada = await signUp(api, "ada@example.com");
            const bob = await signUp(api, "bob@example.com");
            const { body } = await api.post("/links").auth(...bearer(ada)).send({ url: "https://example.com/c" });

            assert.deepEqual((await api.get("/links").auth(...bearer(bob))).body, []);
            assert.equal((await api.get(`/links/${body.code}`).auth(...bearer(bob))).status, 404);
            assert.equal((await api.delete(`/links/${body.code}`).auth(...bearer(bob))).status, 404);

            assert.equal((await api.delete(`/links/${body.code}`).auth(...bearer(ada))).status, 204);
            assert.equal((await api.get(`/${body.code}`)).status, 404);
          });

          test("works over a real connection with fetch", async (t) => {
            const server = createApp(openDb(":memory:")).listen(0); // port 0: the system picks a free port
            t.after(() => {
              server.closeAllConnections();
              server.close();
            });
            await once(server, "listening");

            const res = await fetch(`http://127.0.0.1:${server.address().port}/health`);
            assert.deepEqual(await res.json(), { status: "ok" });
          });
      - file: tests/auth.test.js
        lang: js
        text: |
          import { test } from "node:test";
          import assert from "node:assert/strict";
          import request from "supertest";
          import { createApp } from "../src/app.js";
          import { openDb } from "../src/db.js";
          import { bearer, newApi, signUp } from "./helpers.js";

          const good = { email: "ada@example.com", password: "correct horse battery" };

          test("register, login and /auth/me", async () => {
            const api = newApi();
            assert.equal((await api.post("/auth/register").send(good)).status, 201);

            const login = await api.post("/auth/login").send(good);
            assert.equal(login.status, 200);
            assert.ok(login.body.token.length > 30);

            const me = await api.get("/auth/me").auth(...bearer(login.body.token));
            assert.equal(me.body.email, "ada@example.com");
          });

          test("the password is stored as a salted hash, never as text", async () => {
            const db = openDb(":memory:");
            const api = request(createApp(db));
            await api.post("/auth/register").send(good);

            const { password_hash } = db.prepare("SELECT password_hash FROM users").get();
            assert.ok(!password_hash.includes(good.password));
            assert.match(password_hash, /^[0-9a-f]{32}:[0-9a-f]{128}$/);
          });

          test("only a hash of the token is stored", async () => {
            const db = openDb(":memory:");
            const api = request(createApp(db));
            const token = await signUp(api);
            const rows = db.prepare("SELECT token_hash FROM sessions").all();
            assert.equal(rows.length, 1);
            assert.notEqual(rows[0].token_hash, token);
          });

          test("wrong password and unknown email give the same answer", async () => {
            const api = newApi();
            await api.post("/auth/register").send(good);
            const wrongPassword = await api.post("/auth/login").send({ ...good, password: "not the password" });
            const unknownEmail = await api.post("/auth/login").send({ ...good, email: "nobody@example.com" });
            assert.equal(wrongPassword.status, 401);
            assert.deepEqual(wrongPassword.body, unknownEmail.body);
          });

          test("rejects a second registration with the same email, and short passwords", async () => {
            const api = newApi();
            await api.post("/auth/register").send(good);
            assert.equal((await api.post("/auth/register").send(good)).status, 409);
            assert.equal((await api.post("/auth/register").send({ ...good, email: "x@example.com", password: "short" })).status, 400);
          });

          test("logout ends the session", async () => {
            const api = newApi();
            const token = await signUp(api);
            assert.equal((await api.post("/auth/logout").auth(...bearer(token))).status, 204);
            assert.equal((await api.get("/auth/me").auth(...bearer(token))).status, 401);
          });
