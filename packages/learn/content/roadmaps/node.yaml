    mistakes:
      - problem:
          en: "Storing passwords with a fast hash such as plain SHA-256 or MD5, or in plain text."
          tr: "Şifreleri düz SHA-256 ya da MD5 gibi hızlı bir hash ile ya da düz metin olarak saklamak."
        fix:
          en: "A fast hash can be guessed billions of times per second. Use a slow, salted password hash (scrypt, argon2 or bcrypt). Never write your own scheme."
          tr: "Hızlı bir hash saniyede milyarlarca kez tahmin edilebilir. Yavaş, salt'lı bir şifre hash'i kullan (scrypt, argon2 ya da bcrypt). Asla kendi yöntemini yazma."
      - problem:
          en: "Making tokens with `Math.random()` or from the user's id."
          tr: "Token'ları `Math.random()` ile ya da kullanıcının id'sinden üretmek."
        fix:
          en: "Those can be guessed. Use `crypto.randomBytes` (as above): 32 random bytes cannot be guessed."
          tr: "Bunlar tahmin edilebilir. `crypto.randomBytes` kullan (yukarıdaki gibi): 32 rastgele byte tahmin edilemez."
      - problem:
          en: "`SQLITE_ERROR: table links has no column named user_id` after replacing `db.js`."
          tr: "`db.js`'i değiştirdikten sonra `SQLITE_ERROR: table links has no column named user_id` hatası."
        fix:
          en: "`CREATE TABLE IF NOT EXISTS` does not change a table that already exists. Delete the old development database (`rm -f data.db*`) and start again."
          tr: "`CREATE TABLE IF NOT EXISTS` zaten var olan bir tabloyu değiştirmez. Eski geliştirme veritabanını sil (`rm -f data.db*`) ve yeniden başla."
    quiz:
      - q:
          en: "Why does the server store only a hash of each session token?"
          tr: "Sunucu neden her oturum token'ının sadece hash'ini saklıyor?"
        options:
          en:
            - "To save disk space"
            - "So a leaked database does not contain working tokens"
            - "Because tokens must be numbers"
          tr:
            - "Disk alanından tasarruf için"
            - "Sızan bir veritabanında çalışan token'lar olmasın diye"
            - "Token'ların sayı olması gerektiği için"
        answer: 1
        why:
          en: "Tokens are long and random, so a fast SHA-256 hash is enough. Someone who steals the table cannot turn the hashes back into tokens to log in."
          tr: "Token'lar uzun ve rastgele olduğu için hızlı bir SHA-256 hash'i yeter. Tabloyu çalan biri hash'leri giriş yapmak için tekrar token'a çeviremez."
      - q:
          en: "Why does the login code check a dummy hash when the email is unknown?"
          tr: "Login kodu e-posta bilinmiyorken neden sahte bir hash'i kontrol ediyor?"
        options:
          en:
            - "Unknown emails would otherwise answer faster, which tells an attacker which emails have accounts"
            - "To make the server slower on purpose for everyone"
            - "Because scrypt cannot run without a stored hash"
          tr:
            - "Aksi halde bilinmeyen e-postalar daha hızlı cevaplanır ve bu, saldırgana hangi e-postaların hesabı olduğunu söyler"
            - "Herkes için sunucuyu bilerek yavaşlatmak için"
            - "scrypt saklanmış bir hash olmadan çalışamadığı için"
        answer: 0
        why:
          en: "Equal work for both cases means equal response time, so timing leaks nothing about which emails exist."
          tr: "İki durumda da eşit iş, eşit cevap süresi demektir; böylece süre hangi e-postaların var olduğunu sızdırmaz."
    sources:
      - title: "Node.js crypto: scrypt"
        url: https://nodejs.org/docs/latest/api/crypto.html#cryptoscryptpassword-salt-keylen-options-callback
      - title: "OWASP: Password Storage Cheat Sheet"
        url: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
      - title: "OWASP: Session Management Cheat Sheet"
        url: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html

  - id: hardening
    stage: security
    title:
      en: "Security headers and rate limiting"
      tr: "Güvenlik header'ları ve rate limiting"
    minutes: 40
    needs: [auth]
    why:
      en: "Once the API is on the internet, bots will find it within hours. Two cheap defences stop a lot: security headers that tell browsers to be careful, and a rate limit that stops someone from trying thousands of passwords or flooding you with requests."
      tr: "API internete çıkınca botlar onu saatler içinde bulur. İki ucuz savunma çok şeyi durdurur: tarayıcılara dikkatli olmalarını söyleyen güvenlik header'ları ve birinin binlerce şifre denemesini ya da seni isteklerle boğmasını engelleyen bir rate limit."
    learn:
      en: |
        - `helmet` sets a group of safe response headers (for example `X-Content-Type-Options: nosniff`) and removes `X-Powered-By`
        - A rate limit counts requests per client address in a time window and answers 429 Too Many Requests when it is exceeded; logins get a much stricter limit
        - Behind a proxy (Render, nginx) every request seems to come from the proxy; `trust proxy` tells Express to read the real address from `X-Forwarded-For`, and you must set it to the real number of proxies, not `true`
        - Limits you already have: JSON body size (10 kb), list size (100), input validation
        - CORS: a browser app on another website can call your API only if the API allows it; with the `cors` package you list the allowed origins, never `*` for APIs with logins
      tr: |
        - `helmet` güvenli bir grup cevap header'ı ayarlar (örneğin `X-Content-Type-Options: nosniff`) ve `X-Powered-By`'ı kaldırır
        - Rate limit, bir zaman aralığında her istemci adresi için istekleri sayar ve aşılınca 429 Too Many Requests döner; girişlere çok daha sıkı bir limit uygulanır
        - Bir proxy'nin (Render, nginx) arkasında her istek proxy'den geliyormuş gibi görünür; `trust proxy` Express'e gerçek adresi `X-Forwarded-For`'dan okumasını söyler ve `true` değil, gerçek proxy sayısı verilmelidir
        - Zaten sahip olduğun sınırlar: JSON body boyutu (10 kb), liste boyutu (100), girdi doğrulaması
        - CORS: başka bir web sitesindeki tarayıcı uygulaması API'nı ancak API izin verirse çağırabilir; `cors` paketiyle izin verilen origin'leri listelersin, girişli API'lerde asla `*` değil
    do:
      en: |
        1. Install the two packages: `npm install helmet express-rate-limit`.
        2. Replace `src/app.js` with the version below. Note the order: `helmet` first, then `/health` (health checks must not be rate limited), then the general limit, then the body parser and the routes.
        3. Replace `src/server.js`. It now reads two optional settings from environment variables: `RATE_LIMIT` (requests per minute per address, default 300) and `TRUST_PROXY` (how many proxies are in front, default 0).
        4. Add `tests/security.test.js`. Run `npm test`.
        5. Look at the headers with `curl -i http://localhost:3000/health`. You should see `x-content-type-options`, `strict-transport-security` and others, and no `x-powered-by`.
        6. Commit: `git add .` and `git commit -m "Security headers and rate limits"`.
      tr: |
        1. İki paketi kur: `npm install helmet express-rate-limit`.
        2. `src/app.js` dosyasını aşağıdaki sürümle değiştir. Sıraya dikkat: önce `helmet`, sonra `/health` (health check'lere rate limit uygulanmamalı), sonra genel limit, sonra body parser ve route'lar.
        3. `src/server.js` dosyasını değiştir. Artık ortam değişkenlerinden iki isteğe bağlı ayarı okuyor: `RATE_LIMIT` (adres başına dakikadaki istek sayısı, varsayılan 300) ve `TRUST_PROXY` (önde kaç proxy olduğu, varsayılan 0).
        4. `tests/security.test.js` dosyasını ekle. `npm test` çalıştır.
        5. Header'lara `curl -i http://localhost:3000/health` ile bak. `x-content-type-options`, `strict-transport-security` ve başkalarını görmelisin, `x-powered-by` olmamalı.
        6. Commit'le: `git add .` ve `git commit -m "Security headers and rate limits"`.
    code:
      - file: src/app.js
        lang: js
        text: |
          import express from "express";
          import helmet from "helmet";
          import { rateLimit } from "express-rate-limit";
          import { HttpError } from "./validate.js";
          import { accountsRouter } from "./accounts.js";
          import { linksRouter } from "./links.js";

          export function createApp(db, { requestsPerMinute = 300, authAttempts = 10, trustProxy = 0 } = {}) {
            const app = express();
            const findLink = db.prepare("SELECT url FROM links WHERE code = ?");
            const countClick = db.prepare("UPDATE links SET clicks = clicks + 1 WHERE code = ?");

            // How many proxies sit in front of the app (Render: 1). Never set this to `true`.
            if (trustProxy) app.set("trust proxy", trustProxy);

            app.use(helmet());

            app.get("/health", (req, res) => {
              res.json({ status: "ok" });
            });

            app.use(
              rateLimit({
                windowMs: 60 * 1000,
                limit: requestsPerMinute,
                standardHeaders: true,
                legacyHeaders: false,
                message: { error: "too many requests" },
              }),
            );

            app.use(express.json({ limit: "10kb" }));

            // Logins and registrations: much stricter, to stop password guessing.
            const authLimit = rateLimit({
              windowMs: 15 * 60 * 1000,
              limit: authAttempts,
              standardHeaders: true,
              legacyHeaders: false,
              message: { error: "too many attempts, try again later" },
            });

            app.use("/auth", authLimit, accountsRouter(db));
            app.use("/links", linksRouter(db));

            app.get("/:code", (req, res) => {
              const link = findLink.get(req.params.code);
              if (!link) throw new HttpError(404, "not found");
              countClick.run(req.params.code);
              res.redirect(link.url);
            });

            app.use((req, res) => {
              res.status(404).json({ error: "not found" });
            });

            app.use((err, req, res, next) => {
              if (err instanceof HttpError) {
                return res.status(err.status).json({ error: err.message, details: err.details });
              }
              if (err.status && err.status < 500) {
                return res.status(err.status).json({ error: err.status === 413 ? "body too large" : "bad request" });
              }
              console.error(err);
              res.status(500).json({ error: "server error" });
            });

            return app;
          }
      - file: src/server.js
        lang: js
        text: |
          import { createApp } from "./app.js";
          import { openDb } from "./db.js";

          const port = Number(process.env.PORT) || 3000;
          const db = openDb(process.env.DB_PATH);

          const app = createApp(db, {
            requestsPerMinute: Number(process.env.RATE_LIMIT) || undefined,
            trustProxy: Number(process.env.TRUST_PROXY) || 0,
          });

          app.listen(port, () => {
            console.log(`Listening on http://localhost:${port} (pid ${process.pid})`);
          });
      - file: tests/security.test.js
        lang: js
        text: |
          import { test } from "node:test";
          import assert from "node:assert/strict";
          import { newApi } from "./helpers.js";

          test("sends security headers and hides X-Powered-By", async () => {
            const res = await newApi().get("/health");
            assert.equal(res.headers["x-content-type-options"], "nosniff");
            assert.ok(res.headers["strict-transport-security"]);
            assert.equal(res.headers["x-powered-by"], undefined);
          });

          test("too many login attempts get 429", async () => {
            const api = newApi({ authAttempts: 3 });
            const attempt = () => api.post("/auth/login").send({ email: "ada@example.com", password: "wrong password" });
            for (let i = 0; i < 3; i++) assert.equal((await attempt()).status, 401);
            const blocked = await attempt();
            assert.equal(blocked.status, 429);
            assert.ok(blocked.headers["retry-after"]);
          });

          test("a too large body gets 413", async () => {
            const res = await newApi().post("/links").send({ url: "https://example.com/" + "a".repeat(20000) });
            assert.equal(res.status, 413);
          });
    mistakes:
      - problem:
          en: "Everybody shares one rate-limit counter when the app is deployed behind a proxy."
          tr: "Uygulama bir proxy'nin arkasına deploy edilince herkes tek bir rate-limit sayacını paylaşıyor."
        fix:
          en: "The app sees the proxy's address for every request. Set `TRUST_PROXY=1` on the host (one proxy in front, as on Render) so Express reads the real client address."
          tr: "Uygulama her istek için proxy'nin adresini görüyor. Host'ta `TRUST_PROXY=1` ayarla (önde bir proxy var, Render'daki gibi) ki Express gerçek istemci adresini okusun."
      - problem:
          en: "Setting `trust proxy` to `true` on a server that is directly on the internet."
          tr: "Doğrudan internete açık bir sunucuda `trust proxy`'yi `true` yapmak."
        fix:
          en: "Then anyone can send a fake `X-Forwarded-For` header and pretend to be any address, escaping the limit. Use the exact number of proxies, or leave it off."
          tr: "O zaman herkes sahte bir `X-Forwarded-For` header'ı gönderip istediği adres gibi davranabilir ve limitten kaçar. Proxy sayısını tam olarak ver ya da kapalı bırak."
      - problem:
          en: "Thinking helmet and a rate limit make the app secure."
          tr: "Helmet ve rate limit uygulamayı güvenli yapar sanmak."
        fix:
          en: "They are layers, not a guarantee. Validation, hashed passwords, ownership checks, updated dependencies (`npm audit`) and keeping secrets out of Git matter just as much."
          tr: "Bunlar katmanlardır, garanti değil. Doğrulama, hash'lenmiş şifreler, sahiplik kontrolleri, güncel bağımlılıklar (`npm audit`) ve sırları Git'in dışında tutmak da aynı derecede önemli."
    quiz:
      - q:
          en: "What does HTTP status 429 mean?"
          tr: "HTTP 429 durum kodu ne demek?"
        options:
          en:
            - "The server crashed"
            - "The client sent too many requests"
            - "The page moved"
          tr:
            - "Sunucu çöktü"
            - "İstemci çok fazla istek gönderdi"
            - "Sayfa taşındı"
        answer: 1
        why:
          en: "429 Too Many Requests is the standard answer of a rate limiter; the `Retry-After` header says when to try again."
          tr: "429 Too Many Requests bir rate limiter'ın standart cevabıdır; `Retry-After` header'ı ne zaman tekrar denenebileceğini söyler."
    sources:
      - title: "Helmet"
        url: https://helmetjs.github.io/
      - title: "express-rate-limit"
        url: https://express-rate-limit.mintlify.app/overview
      - title: "Express: Production best practices, security"
        url: https://expressjs.com/en/advanced/best-practice-security.html

  - id: cache-cluster
    stage: performance
    title:
      en: "Measure first, then cache and use all CPU cores"
      tr: "Önce ölç, sonra cache kullan ve tüm CPU çekirdeklerinden yararlan"
    minutes: 50
    needs: [hardening]
    why:
      en: "Fast enough is a number, not a feeling. First measure how many requests per second the redirect handles; then try the two classic fixes: a small in-memory cache so hot links skip the database, and a cluster of several Node.js processes so more than one CPU core is used (Node.js runs your JavaScript on one core per process)."
      tr: "Yeterince hızlı bir his değil, bir sayıdır. Önce yönlendirmenin saniyede kaç isteği karşıladığını ölç; sonra iki klasik çözümü dene: sık kullanılan bağlantılar veritabanını atlasın diye küçük bir bellek içi cache ve birden fazla CPU çekirdeği kullanılsın diye birkaç Node.js process'inden oluşan bir cluster (Node.js JavaScript kodunu process başına tek bir çekirdekte çalıştırır)."
    learn:
      en: |
        - Measure before you optimise; one number from a small benchmark beats a guess
        - A cache with a time limit (TTL) and a size limit, and the hard part: invalidating it when the data changes (delete a link, drop it from the cache)
        - `node:cluster`: a primary process starts workers that share one port; if one crashes, start another
        - The honest limits: with a local SQLite file a lookup is already microseconds, so the cache helps little here (it matters when each lookup is a network call to a remote database); each worker has its own cache and its own rate-limit counters; on a 1-CPU or shared-CPU host (like Render's free plan) a cluster gives nothing
      tr: |
        - Optimize etmeden önce ölç; küçük bir benchmark'tan çıkan bir sayı tahminden iyidir
        - Süre sınırlı (TTL) ve boyut sınırlı bir cache ve işin zor kısmı: veri değişince onu geçersiz kılmak (bir bağlantıyı silince cache'ten de düşürmek)
        - `node:cluster`: bir ana process, tek bir portu paylaşan worker'lar başlatır; biri çökerse yenisini başlatır
        - Dürüst sınırlar: yerel bir SQLite dosyasında bir sorgu zaten mikrosaniyeler sürer, bu yüzden cache burada çok az yardım eder (her sorgu uzak bir veritabanına ağ çağrısı olduğunda önemlidir); her worker'ın kendi cache'i ve kendi rate-limit sayaçları vardır; 1 CPU'lu ya da paylaşımlı CPU'lu bir host'ta (Render'ın ücretsiz planı gibi) cluster hiçbir şey kazandırmaz
    do:
      en: |
        1. Create `scripts/bench.js` and `src/cache.js`, and replace `src/links.js` and `src/app.js` with the versions below. In `src/db.js` nothing changes.
        2. Start the server with a high rate limit, so the benchmark is not blocked: `RATE_LIMIT=1000000 npm start`. In a second terminal register, log in and create a link (the curl commands from the last step) and note the code.
        3. Measure the redirect: `node scripts/bench.js http://localhost:3000/<code>`. Write down the number.
        4. To compare, temporarily remove the cache lines in `app.js` and measure again. Do not be surprised if the difference is small.
        5. Add `tests/cache.test.js` and run `npm test`.
        6. Create `src/cluster.js` and add the script: `npm pkg set scripts.cluster="node src/cluster.js"`. Run `RATE_LIMIT=1000000 WORKERS=2 npm run cluster`, and see two different `pid` values in the output. Measure again. The number may rise, stay the same or even fall: the benchmark program itself uses a CPU core, and every redirect also writes the click count to the same SQLite file, so the CPU is not the only limit. That is the real lesson: find the bottleneck before you scale.
        7. Commit: `git add .` and `git commit -m "Cache and cluster"`.
      tr: |
        1. `scripts/bench.js` ve `src/cache.js` dosyalarını oluştur, `src/links.js` ve `src/app.js` dosyalarını aşağıdaki sürümlerle değiştir. `src/db.js`'de bir şey değişmez.
        2. Sunucuyu yüksek bir rate limit ile başlat ki benchmark engellenmesin: `RATE_LIMIT=1000000 npm start`. İkinci bir terminalde kayıt ol, giriş yap ve bir bağlantı oluştur (önceki adımın curl komutları) ve code'u not al.
        3. Yönlendirmeyi ölç: `node scripts/bench.js http://localhost:3000/<code>`. Sayıyı yaz.
        4. Karşılaştırmak için `app.js` içindeki cache satırlarını geçici olarak kaldır ve tekrar ölç. Fark küçükse şaşırma.
        5. `tests/cache.test.js` dosyasını ekle ve `npm test` çalıştır.
        6. `src/cluster.js` dosyasını oluştur ve script'i ekle: `npm pkg set scripts.cluster="node src/cluster.js"`. `RATE_LIMIT=1000000 WORKERS=2 npm run cluster` çalıştır ve çıktıda iki farklı `pid` değeri gör. Tekrar ölç. Sayı artabilir, aynı kalabilir ya da düşebilir: benchmark programının kendisi bir CPU çekirdeği kullanır ve her yönlendirme tıklama sayısını aynı SQLite dosyasına yazar, yani sınır sadece CPU değil. Asıl ders bu: ölçeklemeden önce darboğazı bul.
        7. Commit'le: `git add .` ve `git commit -m "Cache and cluster"`.
    code:
      - file: scripts/bench.js
        lang: js
        text: |
          // A tiny benchmark: node scripts/bench.js <url>
          const url = process.argv[2];
          if (!url) {
            console.error("usage: node scripts/bench.js <url>");
            process.exit(1);
          }

          const total = 3000;
          const concurrency = 20;
          let started = 0;
          let failed = 0;

          async function worker() {
            while (started < total) {
              started++;
              const res = await fetch(url, { redirect: "manual" });
              if (res.status >= 400) failed++;
              await res.body?.cancel();
            }
          }

          const t0 = performance.now();
          await Promise.all(Array.from({ length: concurrency }, worker));
          const seconds = (performance.now() - t0) / 1000;
          console.log(`${total} requests in ${seconds.toFixed(2)} s = ${Math.round(total / seconds)} per second, ${failed} failed`);
      - file: src/cache.js
        lang: js
        text: |
          // A small cache: keeps at most `max` entries, each for at most `ttlMs` milliseconds.
          // A Map remembers insertion order, so the first key is the least recently used one.
          export function createCache({ max = 1000, ttlMs = 60_000 } = {}) {
            const map = new Map();
            return {
              get(key) {
                const hit = map.get(key);
                if (!hit) return undefined;
                map.delete(key);
                if (hit.expires <= Date.now()) return undefined;
                map.set(key, hit); // move to the end: most recently used
                return hit.value;
              },
              set(key, value) {
                map.delete(key);
                map.set(key, { value, expires: Date.now() + ttlMs });
                if (map.size > max) map.delete(map.keys().next().value);
              },
              delete(key) {
                map.delete(key);
              },
            };
          }
      - file: src/links.js
        lang: js
        text: |
          import { Router } from "express";
          import { randomBytes } from "node:crypto";
          import { z } from "zod";
          import { requireAuth } from "./auth.js";
          import { HttpError, parse } from "./validate.js";

          const newLink = z.object({
            url: z.url({ protocol: /^https?$/ }).max(2048),
          });

          const listQuery = z.object({
            limit: z.coerce.number().int().min(1).max(100).default(20),
            offset: z.coerce.number().int().min(0).default(0),
          });

          export function linksRouter(db, cache) {
            const router = Router();
            const insert = db.prepare("INSERT INTO links (code, url, user_id) VALUES (?, ?, ?)");
            const list = db.prepare(
              "SELECT code, url, clicks, created_at FROM links WHERE user_id = ? ORDER BY rowid DESC LIMIT ? OFFSET ?",
            );
            const one = db.prepare("SELECT code, url, clicks, created_at FROM links WHERE code = ? AND user_id = ?");
            const remove = db.prepare("DELETE FROM links WHERE code = ? AND user_id = ?");

            router.use(requireAuth(db));

            router.post("/", (req, res) => {
              const { url } = parse(newLink, req.body);
              const code = randomBytes(4).toString("base64url");
              insert.run(code, url, req.user.id);
              res.status(201).json({ code, url });
            });

            router.get("/", (req, res) => {
              const { limit, offset } = parse(listQuery, req.query);
              res.json(list.all(req.user.id, limit, offset));
            });

            router.get("/:code", (req, res) => {
              const link = one.get(req.params.code, req.user.id);
              if (!link) throw new HttpError(404, "not found");
              res.json(link);
            });

            router.delete("/:code", (req, res) => {
              const { changes } = remove.run(req.params.code, req.user.id);
              if (changes === 0) throw new HttpError(404, "not found");
              cache.delete(req.params.code); // the hard part of caching: forget what is no longer true
              res.status(204).end();
            });

            return router;
          }
      - file: src/app.js
        lang: js
        text: |
          import express from "express";
          import helmet from "helmet";
          import { rateLimit } from "express-rate-limit";
          import { HttpError } from "./validate.js";
          import { accountsRouter } from "./accounts.js";
          import { createCache } from "./cache.js";
          import { linksRouter } from "./links.js";

          export function createApp(db, { requestsPerMinute = 300, authAttempts = 10, trustProxy = 0 } = {}) {
            const app = express();
            const cache = createCache(); // code -> url, so hot links skip the database lookup
            const findLink = db.prepare("SELECT url FROM links WHERE code = ?");
            const countClick = db.prepare("UPDATE links SET clicks = clicks + 1 WHERE code = ?");

            if (trustProxy) app.set("trust proxy", trustProxy);

            app.use(helmet());

            app.get("/health", (req, res) => {
              res.json({ status: "ok" });
            });

            app.use(
              rateLimit({
                windowMs: 60 * 1000,
                limit: requestsPerMinute,
                standardHeaders: true,
                legacyHeaders: false,
                message: { error: "too many requests" },
              }),
            );

            app.use(express.json({ limit: "10kb" }));

            const authLimit = rateLimit({
              windowMs: 15 * 60 * 1000,
              limit: authAttempts,
              standardHeaders: true,
              legacyHeaders: false,
              message: { error: "too many attempts, try again later" },
            });

            app.use("/auth", authLimit, accountsRouter(db));
            app.use("/links", linksRouter(db, cache));

            app.get("/:code", (req, res) => {
              const { code } = req.params;
              let url = cache.get(code);
              if (!url) {
                url = findLink.get(code)?.url;
                if (!url) throw new HttpError(404, "not found");
                cache.set(code, url);
              }
              countClick.run(code);
              res.redirect(url);
            });

            app.use((req, res) => {
              res.status(404).json({ error: "not found" });
            });

            app.use((err, req, res, next) => {
              if (err instanceof HttpError) {
                return res.status(err.status).json({ error: err.message, details: err.details });
              }
              if (err.status && err.status < 500) {
                return res.status(err.status).json({ error: err.status === 413 ? "body too large" : "bad request" });
              }
              console.error(err);
              res.status(500).json({ error: "server error" });
            });

            return app;
          }
      - file: tests/cache.test.js
        lang: js
        text: |
          import { test } from "node:test";
          import assert from "node:assert/strict";
          import { setTimeout as sleep } from "node:timers/promises";
          import { createCache } from "../src/cache.js";
          import { bearer, newApi, signUp } from "./helpers.js";

          test("cache forgets the oldest entry when it is full", () => {
            const cache = createCache({ max: 2 });
            cache.set("a", 1);
            cache.set("b", 2);
            cache.get("a"); // a is now more recent than b
            cache.set("c", 3);
            assert.equal(cache.get("b"), undefined);
            assert.equal(cache.get("a"), 1);
            assert.equal(cache.get("c"), 3);
          });

          test("cache entries expire", async () => {
            const cache = createCache({ ttlMs: 20 });
            cache.set("a", 1);
            assert.equal(cache.get("a"), 1);
            await sleep(40);
            assert.equal(cache.get("a"), undefined);
          });

          test("a deleted link stops redirecting even if it was cached", async () => {
            const api = newApi();
            const token = await signUp(api);
            const { body } = await api.post("/links").auth(...bearer(token)).send({ url: "https://example.com/d" });
            assert.equal((await api.get(`/${body.code}`)).status, 302); // now it is in the cache
            await api.delete(`/links/${body.code}`).auth(...bearer(token));
            assert.equal((await api.get(`/${body.code}`)).status, 404);
          });
      - file: src/cluster.js
        lang: js
        text: |
          import cluster from "node:cluster";
          import { availableParallelism } from "node:os";

          if (cluster.isPrimary) {
            const workers = Number(process.env.WORKERS) || availableParallelism();
            console.log(`Primary ${process.pid} starts ${workers} workers`);
            for (let i = 0; i < workers; i++) cluster.fork();

            // If a worker dies, start another one (after a short pause, so a crash loop is not instant).
            cluster.on("exit", (worker, code) => {
              console.log(`Worker ${worker.process.pid} exited with code ${code}, starting another`);
              setTimeout(() => cluster.fork(), 1000);
            });
          } else {
            // Every worker runs the normal server; the workers share the same port.
            await import("./server.js");
          }
    mistakes:
      - problem:
          en: "A deleted link still redirects for a while."
          tr: "Silinmiş bir bağlantı bir süre daha yönlendirmeye devam ediyor."
        fix:
          en: "A cache keeps old answers. Delete the entry when the data changes (as `DELETE` does above). With a cluster each worker has its own cache, so another worker may still answer from its cache until the entry expires (60 seconds); use a shared cache such as Redis if that matters."
          tr: "Cache eski cevapları tutar. Veri değişince kaydı sil (yukarıda `DELETE`'in yaptığı gibi). Cluster'da her worker'ın kendi cache'i vardır, bu yüzden başka bir worker kayıt süresi dolana kadar (60 saniye) cache'inden cevap vermeye devam edebilir; bu önemliyse Redis gibi paylaşımlı bir cache kullan."
      - problem:
          en: "The benchmark shows many failed requests."
          tr: "Benchmark çok sayıda başarısız istek gösteriyor."
        fix:
          en: "You hit the rate limit (429). Start the server with `RATE_LIMIT=1000000` for the benchmark, and never use that value in production."
          tr: "Rate limit'e takıldın (429). Benchmark için sunucuyu `RATE_LIMIT=1000000` ile başlat ve bu değeri production'da asla kullanma."
      - problem:
          en: "Adding a cache or a cluster without measuring, and then keeping it because it feels faster."
          tr: "Ölçmeden cache ya da cluster eklemek ve sonra daha hızlı hissettirdiği için tutmak."
        fix:
          en: "Every optimisation adds code and new kinds of bugs. Keep it only if the number clearly improves."
          tr: "Her optimizasyon kod ve yeni hata türleri ekler. Sadece sayı açıkça iyileşiyorsa tut."
    quiz:
      - q:
          en: "Why can a single Node.js process not use all the CPU cores for your JavaScript?"
          tr: "Tek bir Node.js process'i JavaScript kodun için neden tüm CPU çekirdeklerini kullanamaz?"
        options:
          en:
            - "Your JavaScript runs on one main thread per process, so you start more processes (a cluster)"
            - "Node.js is limited to 512 MB"
            - "Express allows only one request at a time"
          tr:
            - "JavaScript kodun process başına tek bir ana thread'de çalışır, bu yüzden daha fazla process (cluster) başlatırsın"
            - "Node.js 512 MB ile sınırlıdır"
            - "Express aynı anda sadece bir isteğe izin verir"
        answer: 0
        why:
          en: "Node.js handles many requests at once by not blocking, but the JavaScript itself runs on one thread. Several processes can run on several cores."
          tr: "Node.js engellemeyerek aynı anda çok isteği karşılar ama JavaScript'in kendisi tek thread'de çalışır. Birkaç process birkaç çekirdekte çalışabilir."
    sources:
      - title: "Node.js: Cluster"
        url: https://nodejs.org/docs/latest/api/cluster.html
      - title: "Express: Production best practices, performance"
        url: https://expressjs.com/en/advanced/best-practice-performance.html

  - id: package
    stage: packaging
    title:
      en: "Package it: scripts, settings from the environment and a Docker image"
      tr: "Paketleme: script'ler, ortamdan gelen ayarlar ve bir Docker image'ı"
    minutes: 50
    needs: [cache-cluster]
    why:
      en: "A project is ready to ship when anyone (or any server) can install it and start it with the same two commands, and when settings that change between your laptop and a server live outside the code. A Docker image goes one step further: it carries Node.js and your code together, so it runs the same everywhere."
      tr: "Bir proje, herkes (ya da herhangi bir sunucu) onu aynı iki komutla kurup başlatabildiğinde ve laptopunla sunucu arasında değişen ayarlar kodun dışında durduğunda yayına hazırdır. Docker image'ı bir adım daha ileri gider: Node.js'i ve kodunu birlikte taşır, böylece her yerde aynı çalışır."
    learn:
      en: |
        - `package.json` scripts (`npm start`, `npm test`) and `engines` (which Node.js versions the project needs)
        - Why you commit `package-lock.json` and install with `npm ci` (exact versions, fails if the lock file is out of date)
        - Settings from environment variables (`PORT`, `DB_PATH`, `TRUST_PROXY`, `RATE_LIMIT`), and a `.env` file for your laptop read with `node --env-file-if-exists=.env` (no extra package needed); secrets never go into Git
        - A `Dockerfile`: a base image, install only production dependencies, run as a normal user (not root), keep the database in a volume
      tr: |
        - `package.json` script'leri (`npm start`, `npm test`) ve `engines` (projenin hangi Node.js sürümlerini istediği)
        - `package-lock.json`'ı neden commit'lediğin ve `npm ci` ile kurduğun (tam sürümler, lock dosyası güncel değilse hata verir)
        - Ortam değişkenlerinden gelen ayarlar (`PORT`, `DB_PATH`, `TRUST_PROXY`, `RATE_LIMIT`) ve laptopun için `node --env-file-if-exists=.env` ile okunan bir `.env` dosyası (ek paket gerekmez); sırlar asla Git'e girmez
        - Bir `Dockerfile`: bir temel image, sadece production bağımlılıklarını kurmak, normal bir kullanıcıyla (root değil) çalıştırmak, veritabanını bir volume'da tutmak
    do:
      en: |
        1. Set the project info and start scripts with the first terminal block below. `dev` now reads a local `.env` file when it exists.
        2. Create `.env` (only for your laptop) with one line, `PORT=3000`, and make sure `.gitignore` lists `.env` (replace it with the version below). Run `npm run dev` and check it still works.
        3. Create `.node-version` (hosts use it to pick Node.js), `.dockerignore` and `Dockerfile` with the code below.
        4. Build and run the image (second terminal block). Inside the build, `npm ci --omit=dev` installs exactly what the lock file says, without test tools. The database lives in a Docker volume named `linkly-data`, so links survive container restarts.
        5. In another terminal run `curl -i http://localhost:3000/health`. Stop the container with Ctrl+C.
        6. Docker is optional for the deploy that follows (the host builds from your code), but you now know how to package any Node.js service. If you do not have Docker, skip steps 4 and 5.
        7. Commit: `git add .` and `git commit -m "Package for deploy"`.
      tr: |
        1. Aşağıdaki ilk terminal bloğuyla proje bilgilerini ve başlatma script'lerini ayarla. `dev` artık varsa yerel bir `.env` dosyasını okuyor.
        2. İçinde tek satır, `PORT=3000`, olan `.env` dosyasını oluştur (sadece laptopun için) ve `.gitignore`'un `.env`'i listelediğinden emin ol (aşağıdaki sürümle değiştir). `npm run dev` çalıştır ve hâlâ çalıştığını kontrol et.
        3. Aşağıdaki kodla `.node-version` (host'lar Node.js sürümünü seçmek için kullanır), `.dockerignore` ve `Dockerfile` dosyalarını oluştur.
        4. Image'ı build edip çalıştır (ikinci terminal bloğu). Build sırasında `npm ci --omit=dev` lock dosyasındaki sürümlerin aynısını, test araçları olmadan kurar. Veritabanı `linkly-data` adlı bir Docker volume'unda durur, böylece bağlantılar container yeniden başlayınca kaybolmaz.
        5. Başka bir terminalde `curl -i http://localhost:3000/health` çalıştır. Container'ı Ctrl+C ile durdur.
        6. Sonraki deploy için Docker isteğe bağlıdır (host kodundan build eder) ama artık herhangi bir Node.js servisini nasıl paketleyeceğini biliyorsun. Docker'ın yoksa 4. ve 5. adımları atla.
        7. Commit'le: `git add .` ve `git commit -m "Package for deploy"`.
    code:
      - file: terminal
        lang: sh
        text: |
          npm pkg set name=linkly "engines.node=>=22.13"
          npm pkg set private=true --json
          npm pkg set scripts.dev="node --watch --env-file-if-exists=.env src/server.js"
      - file: .gitignore
        lang: text
        text: |
          node_modules
          data.db*
          .env
      - file: .node-version
        lang: text
        text: |
          24
      - file: .dockerignore
        lang: text
        text: |
          node_modules
          data.db*
          .env
          .git
          tests
      - file: Dockerfile
        lang: dockerfile
        text: |
          FROM node:24-alpine

          ENV NODE_ENV=production
          ENV DB_PATH=/data/linkly.db

          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev

          COPY src ./src

          # The database lives in /data, a folder the unprivileged user may write to.
          RUN mkdir /data && chown node:node /data
          USER node
          VOLUME /data

          EXPOSE 3000
          HEALTHCHECK --interval=30s --timeout=3s CMD wget -qO- http://127.0.0.1:3000/health || exit 1
          CMD ["node", "src/server.js"]
      - file: terminal
        lang: sh
        text: |
          docker build -t linkly .
          docker run --rm --name linkly --memory 512m -p 3000:3000 -v linkly-data:/data linkly
    mistakes:
      - problem:
          en: "`npm ci` fails with \"package.json and package-lock.json are not in sync\"."
          tr: "`npm ci` \"package.json and package-lock.json are not in sync\" hatası veriyor."
        fix:
          en: "You changed dependencies without updating the lock file. Run `npm install`, commit the updated `package-lock.json`, and try again."
          tr: "Lock dosyasını güncellemeden bağımlılıkları değiştirmişsin. `npm install` çalıştır, güncellenen `package-lock.json`'ı commit'le ve tekrar dene."
      - problem:
          en: "`SQLITE_CANTOPEN: unable to open database file` inside the container."
          tr: "Container içinde `SQLITE_CANTOPEN: unable to open database file` hatası."
        fix:
          en: "The user running the app may not write to the database folder. The Dockerfile creates `/data` and gives it to the `node` user, and `DB_PATH` points into it."
          tr: "Uygulamayı çalıştıran kullanıcı veritabanı klasörüne yazamıyor olabilir. Dockerfile `/data`'yı oluşturup `node` kullanıcısına verir ve `DB_PATH` onun içini gösterir."
      - problem:
          en: "Committing `.env` with secrets, or copying it into the image."
          tr: "Sırlar içeren `.env` dosyasını commit'lemek ya da image'a kopyalamak."
        fix:
          en: "List `.env` in both `.gitignore` and `.dockerignore`. If a secret ever reached Git, treat it as leaked and replace it; deleting the file later does not remove it from history."
          tr: "`.env`'i hem `.gitignore` hem `.dockerignore` içinde listele. Bir sır Git'e girdiyse sızmış say ve değiştir; dosyayı sonradan silmek onu geçmişten kaldırmaz."
    quiz:
      - q:
          en: "Why install with `npm ci` instead of `npm install` on a server?"
          tr: "Bir sunucuda neden `npm install` yerine `npm ci` ile kuruyoruz?"
        options:
          en:
            - "It installs exactly the versions in package-lock.json and fails if they do not match"
            - "It installs the newest version of every package"
            - "It is the only command that works without internet"
          tr:
            - "package-lock.json içindeki tam sürümleri kurar ve uyuşmazsa hata verir"
            - "Her paketin en yeni sürümünü kurar"
            - "İnternetsiz çalışan tek komut odur"
        answer: 0
        why:
          en: "A server must run the same versions you tested. `npm ci` is repeatable; `npm install` may change the lock file."
          tr: "Bir sunucu senin test ettiğin sürümlerle çalışmalı. `npm ci` tekrarlanabilirdir; `npm install` lock dosyasını değiştirebilir."
    sources:
      - title: "npm: npm ci"
        url: https://docs.npmjs.com/cli/v12/commands/npm-ci
      - title: "Node.js: --env-file"
        url: https://nodejs.org/docs/latest/api/cli.html#--env-filefile
      - title: "Docker: Dockerfile reference"
