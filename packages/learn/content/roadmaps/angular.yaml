      - file: src/app/add.spec.ts
        lang: ts
        text: |
          import { TestBed } from '@angular/core/testing';
          import { provideRouter, Router } from '@angular/router';
          import { Add } from './add';
          import { BookStore } from './book-store';

          function type(page: HTMLElement, label: string, value: string) {
            const field = [...page.querySelectorAll('label')].find((l) => l.textContent?.includes(label));
            const input = field?.querySelector('input') as HTMLInputElement;
            input.value = value;
            input.dispatchEvent(new Event('input'));
          }

          describe('Add', () => {
            beforeEach(() => {
              localStorage.clear();
              TestBed.configureTestingModule({ providers: [provideRouter([{ path: '', children: [] }])] });
            });

            it('saves a valid book and goes back to the list', async () => {
              const fixture = TestBed.createComponent(Add);
              const page = fixture.nativeElement as HTMLElement;
              await fixture.whenStable();

              type(page, 'Title', '  Emma  ');
              type(page, 'Author', 'Jane Austen');
              type(page, 'Pages', '474');
              page.querySelector('form')?.dispatchEvent(new Event('submit'));
              await fixture.whenStable();

              expect(TestBed.inject(BookStore).books().at(-1)).toMatchObject({
                title: 'Emma',
                author: 'Jane Austen',
                pages: 474,
              });
              expect(TestBed.inject(Router).url).toBe('/');
            });

            it('does not save an empty form and shows the errors', async () => {
              const fixture = TestBed.createComponent(Add);
              const page = fixture.nativeElement as HTMLElement;
              const store = TestBed.inject(BookStore);
              const before = store.books().length;
              await fixture.whenStable();

              page.querySelector('form')?.dispatchEvent(new Event('submit'));
              await fixture.whenStable();

              expect(store.books().length).toBe(before);
              expect(page.textContent).toContain('Enter a title');
              expect(page.textContent).toContain('A book has at least 1 page');
            });
          });
      - file: src/app/discover.spec.ts
        lang: ts
        text: |
          import { provideHttpClient } from '@angular/common/http';
          import { HttpTestingController, provideHttpClientTesting } from '@angular/common/http/testing';
          import { TestBed } from '@angular/core/testing';
          import { BookStore } from './book-store';
          import { Discover } from './discover';

          describe('Discover', () => {
            beforeEach(() => {
              localStorage.clear();
              TestBed.configureTestingModule({ providers: [provideHttpClient(), provideHttpClientTesting()] });
            });

            it('sends no request until the user searches, then shows the results', async () => {
              const http = TestBed.inject(HttpTestingController);
              const fixture = TestBed.createComponent(Discover);
              const page = fixture.nativeElement as HTMLElement;
              fixture.detectChanges();
              http.expectNone(() => true);

              const input = page.querySelector('input') as HTMLInputElement;
              input.value = 'dune';
              page.querySelector('button')?.click();
              fixture.detectChanges();

              const request = http.expectOne((r) => r.url === 'https://openlibrary.org/search.json');
              expect(request.request.params.get('q')).toBe('dune');
              request.flush({
                numFound: 1,
                docs: [{ key: '/works/OL893414W', title: 'Dune', author_name: ['Frank Herbert'], number_of_pages_median: 608 }],
              });
              await fixture.whenStable();

              expect(page.textContent).toContain('Dune');
              expect(page.textContent).toContain('Frank Herbert');
            });

            it('adds a found book to the list', async () => {
              const http = TestBed.inject(HttpTestingController);
              const fixture = TestBed.createComponent(Discover);
              const page = fixture.nativeElement as HTMLElement;
              fixture.detectChanges();

              (page.querySelector('input') as HTMLInputElement).value = 'piranesi';
              page.querySelector('button')?.click();
              fixture.detectChanges();
              http
                .expectOne((r) => r.url === 'https://openlibrary.org/search.json')
                .flush({ numFound: 1, docs: [{ key: '/works/OL1W', title: 'Piranesi' }] });
              await fixture.whenStable();

              const add = [...page.querySelectorAll('article button')].find((b) => b.textContent?.includes('Add to my list'));
              (add as HTMLButtonElement).click();

              expect(TestBed.inject(BookStore).books().at(-1)).toMatchObject({
                title: 'Piranesi',
                author: 'Unknown author',
                pages: 0,
              });
            });
          });
      - file: terminal
        lang: sh
        text: |
          npm test -- --no-watch
    mistakes:
      - problem:
          en: "A test checks the page right after a click and sees the old text."
          tr: "Bir test tıklamadan hemen sonra sayfayı kontrol ediyor ve eski metni görüyor."
        fix:
          en: "Await fixture.whenStable() so Angular can update the page before you look at it."
          tr: "Sayfaya bakmadan önce Angular güncelleyebilsin diye fixture.whenStable()'ı bekle (await)."
      - problem:
          en: "Tests pass alone but fail together."
          tr: "Testler tek tek geçiyor ama birlikte başarısız oluyor."
        fix:
          en: "They share localStorage. Clear it in beforeEach, as the specs here do."
          tr: "localStorage'ı paylaşıyorlar. Buradaki spec'lerin yaptığı gibi beforeEach içinde temizle."
    quiz:
      - q:
          en: "Why does the Discover test use HttpTestingController?"
          tr: "Discover testi neden HttpTestingController kullanıyor?"
        options:
          en: [To call the real Open Library faster, So the test never uses the network and controls the answer, Because Vitest cannot run without it]
          tr: [Gerçek Open Library'yi daha hızlı çağırmak için, Test ağı hiç kullanmasın ve cevabı kendisi belirlesin diye, Vitest onsuz çalışamadığı için]
        answer: 1
        why:
          en: "Real network calls make tests slow and flaky. The controller lets the test check the request and answer it with fake data."
          tr: "Gerçek ağ çağrıları testleri yavaş ve güvenilmez yapar. Controller testin isteği kontrol etmesini ve sahte veriyle cevaplamasını sağlar."
    sources:
      - title: Unit testing overview
        url: https://angular.dev/guide/testing
      - title: Testing HTTP requests
        url: https://angular.dev/guide/http/testing
      - title: Testing components
        url: https://angular.dev/guide/testing/components-basics

  - id: security
    stage: security
    title:
      en: "Keep it safe: XSS and dependencies"
      tr: "Güvende tut: XSS ve bağımlılıklar"
    minutes: 40
    needs: [tests]
    why:
      en: "The app shows text that users and APIs control. If that text could run as code (XSS, cross-site scripting), an attacker could act as your user. Angular treats every value as untrusted by default, and you must not turn that off."
      tr: "Uygulama, kullanıcıların ve API'lerin kontrol ettiği metni gösterir. Bu metin kod olarak çalışabilseydi (XSS, cross-site scripting) saldırgan kullanıcın gibi davranabilirdi. Angular her değeri varsayılan olarak güvenilmez sayar ve sen bunu kapatmamalısın."
    learn:
      en: |
        - Interpolation `{{ }}` always escapes: markup shows as plain text
        - Values bound to `[innerHTML]` and `[href]` are sanitized: scripts and `javascript:` links are removed or disarmed
        - `bypassSecurityTrust...` switches this off for one value. Never use it with data a user or an API can control
        - A Content Security Policy (CSP) tells the browser which scripts may run; `autoCsp` builds one for static hosting
        - `npm audit` lists known problems in your packages
      tr: |
        - Interpolation `{{ }}` her zaman kaçırır (escape): HTML işaretleri düz metin olarak görünür
        - `[innerHTML]` ve `[href]`'e bağlanan değerler temizlenir (sanitize): script'ler ve `javascript:` linkleri kaldırılır ya da etkisizleştirilir
        - `bypassSecurityTrust...` bunu tek bir değer için kapatır. Kullanıcının ya da API'nin kontrol edebildiği veriyle asla kullanma
        - Content Security Policy (CSP) tarayıcıya hangi script'lerin çalışabileceğini söyler; `autoCsp` statik barındırma için bir tane üretir
        - `npm audit` paketlerindeki bilinen sorunları listeler
    do:
      en: |
        1. Create `src/app/security.spec.ts`. It proves that a book titled `<img src=x onerror=alert(1)>` shows as text and that Angular disarms a `javascript:` link and removes scripts from `innerHTML`. Run `npm test -- --no-watch`; expect `Tests 14 passed`.
        2. Turn on the automatic CSP with the first command below, then run `npm run build`. Open `dist/reading-log/browser/index.html` and find the `Content-Security-Policy` meta tag.
        3. Run `npm audit`. Read what it says; `found 0 vulnerabilities` is the goal.
        4. Rule for the whole project: no `bypassSecurityTrust...` calls and no `innerHTML` with data you did not write.
        5. Commit your work.
      tr: |
        1. `src/app/security.spec.ts` dosyasını oluştur. `<img src=x onerror=alert(1)>` başlıklı bir kitabın metin olarak göründüğünü, Angular'ın bir `javascript:` linkini etkisizleştirdiğini ve `innerHTML` içinden script'leri kaldırdığını kanıtlar. `npm test -- --no-watch` çalıştır; `Tests 14 passed` görmelisin.
        2. Aşağıdaki ilk komutla otomatik CSP'yi aç, sonra `npm run build` çalıştır. `dist/reading-log/browser/index.html` dosyasını aç ve `Content-Security-Policy` meta etiketini bul.
        3. `npm audit` çalıştır. Ne dediğini oku; hedef `found 0 vulnerabilities`.
        4. Bütün proje için kural: `bypassSecurityTrust...` çağrısı yok ve kendi yazmadığın veriyle `innerHTML` yok.
        5. Çalışmanı commit et.
    code:
      - file: src/app/security.spec.ts
        lang: ts
        text: |
          import { Component } from '@angular/core';
          import { TestBed } from '@angular/core/testing';
          import { Book } from './book';
          import { BookCard } from './book-card';

          @Component({
            selector: 'app-probe',
            template: `
              <a [href]="link">link</a>
              <div [innerHTML]="html"></div>
            `,
          })
          class Probe {
            link = 'javascript:alert(1)';
            html = '<b>bold</b><script>alert(1)</script><img src="x" onerror="alert(1)">';
          }

          describe('Angular protects against XSS', () => {
            it('shows markup in a book title as plain text', async () => {
              const book: Book = { id: 'x', title: '<img src=x onerror=alert(1)>', author: 'A', pages: 1, finished: false };
              const fixture = TestBed.createComponent(BookCard);
              fixture.componentRef.setInput('book', book);
              await fixture.whenStable();

              const page = fixture.nativeElement as HTMLElement;
              expect(page.querySelector('img')).toBeNull();
              expect(page.querySelector('h3')?.textContent).toBe('<img src=x onerror=alert(1)>');
            });

            it('sanitizes a javascript: link and removes scripts from innerHTML', async () => {
              const fixture = TestBed.createComponent(Probe);
              await fixture.whenStable();

              const page = fixture.nativeElement as HTMLElement;
              expect(page.querySelector('a')?.getAttribute('href')).toBe('unsafe:javascript:alert(1)');
              expect(page.querySelector('div')?.innerHTML).toContain('<b>bold</b>');
              expect(page.querySelector('script')).toBeNull();
              expect(page.querySelector('div')?.innerHTML).not.toContain('onerror');
            });
          });
      - file: terminal
        lang: sh
        text: |
          npx ng config projects.reading-log.architect.build.options.security.autoCsp true
          npm run build
          npm audit
    mistakes:
      - problem:
          en: "Using bypassSecurityTrustHtml to make some API text look nice."
          tr: "Bir API metni güzel görünsün diye bypassSecurityTrustHtml kullanmak."
        fix:
          en: "That text is untrusted. Show it with {{ }}. If you really need HTML, sanitize it first or render it with real components."
          tr: "O metin güvenilmezdir. {{ }} ile göster. Gerçekten HTML gerekiyorsa önce temizle ya da gerçek component'lerle çiz."
      - problem:
          en: "Believing autoCsp protects everything."
          tr: "autoCsp'nin her şeyi koruduğunu sanmak."
        fix:
          en: "It covers scripts only, and a meta tag cannot carry every directive. GitHub Pages cannot send custom headers, so for stricter rules use a host where you can set them."
          tr: "Sadece script'leri kapsar ve meta etiketi her direktifi taşıyamaz. GitHub Pages özel header gönderemez; daha sıkı kurallar için header koyabildiğin bir barındırma kullan."
    quiz:
      - q:
          en: "A book title contains <script>alert(1)</script> and you show it with {{ book().title }}. What happens?"
          tr: "Bir kitap başlığı <script>alert(1)</script> içeriyor ve onu {{ book().title }} ile gösteriyorsun. Ne olur?"
        options:
          en: [The script runs, The text is shown as is and nothing runs, The build fails]
          tr: [Script çalışır, Metin olduğu gibi gösterilir ve hiçbir şey çalışmaz, Build başarısız olur]
        answer: 1
        why:
          en: "Interpolation escapes the value, so the browser shows the angle brackets instead of treating them as HTML."
          tr: "Interpolation değeri kaçırır; bu yüzden tarayıcı açılı parantezleri HTML saymak yerine olduğu gibi gösterir."
    sources:
      - title: Angular security
        url: https://angular.dev/best-practices/security
      - title: Content security policy with autoCsp
        url: https://angular.dev/best-practices/security#content-security-policy
      - title: npm audit
        url: https://docs.npmjs.com/cli/commands/npm-audit

  - id: performance
    stage: performance
    title:
      en: "Fast by default: zoneless, OnPush and @defer"
      tr: "Varsayılan olarak hızlı: zoneless, OnPush ve @defer"
    minutes: 50
    needs: [security]
    why:
      en: "A fast app downloads little and redraws little. Angular 22 helps by default; you keep it fast by using signals and by loading rarely used parts later."
      tr: "Hızlı bir uygulama az indirir ve az yeniden çizer. Angular 22 varsayılan olarak yardım eder; signal kullanarak ve nadir kullanılan parçaları sonra yükleyerek hızlı tutarsın."
    learn:
      en: |
        - Zoneless: new apps run without zone.js; the page updates when a signal, an event or `markForCheck` says something changed
        - OnPush is the default change detection since Angular 22: a component is checked when its inputs, signals or events change. `ChangeDetectionStrategy.Eager` is the old behavior
        - `@defer (on viewport)` loads a component and its code only when its placeholder scrolls into view
        - Lazy routes and `@defer` both make separate files; the build output lists them
      tr: |
        - Zoneless: yeni uygulamalar zone.js olmadan çalışır; sayfa bir signal, bir olay ya da `markForCheck` bir şeyin değiştiğini söyleyince güncellenir
        - Angular 22'den beri varsayılan change detection OnPush'tur: component, input'ları, signal'leri ya da olayları değişince kontrol edilir. `ChangeDetectionStrategy.Eager` eski davranıştır
        - `@defer (on viewport)` bir component'i ve kodunu sadece placeholder'ı ekrana kayınca yükler
        - Lazy route'lar ve `@defer` ikisi de ayrı dosyalar üretir; build çıktısı onları listeler
    do:
      en: |
        1. Check that your project is zoneless: `grep zone package.json` prints nothing (no `zone.js` package), and none of your components set `changeDetection`.
        2. Create `src/app/reading-goal.ts` and replace `src/app/stats.ts` with the version that wraps the goal in `@defer`.
        3. Run `npm run build`. A new lazy chunk named `reading-goal` appears: that part of the page is not in the first download.
        4. Open the statistics page. The goal appears when the placeholder is visible. Change the goal and see the progress bar follow.
        5. Optional: in Chrome, open DevTools → Lighthouse and run a report on your page to see the scores.
        6. Commit your work.
      tr: |
        1. Projenin zoneless olduğunu kontrol et: `grep zone package.json` hiçbir şey yazmaz (`zone.js` paketi yok) ve component'lerinden hiçbiri `changeDetection` ayarlamaz.
        2. `src/app/reading-goal.ts` dosyasını oluştur ve `src/app/stats.ts` dosyasını hedefi `@defer` içine saran sürümle değiştir.
        3. `npm run build` çalıştır. `reading-goal` adlı yeni bir lazy chunk görünür: sayfanın o parçası ilk indirmede yok.
        4. İstatistik sayfasını aç. Hedef, placeholder görününce çıkar. Hedefi değiştir ve ilerleme çubuğunun takip ettiğini gör.
        5. İsteğe bağlı: Chrome'da DevTools → Lighthouse'u aç ve sayfan için bir rapor çalıştır; puanları gör.
        6. Çalışmanı commit et.
    code:
      - file: src/app/reading-goal.ts
        lang: ts
        text: |
          import { Component, computed, inject, signal } from '@angular/core';
          import { BookStore } from './book-store';

          @Component({
            selector: 'app-reading-goal',
            template: `
              <h3>Reading goal</h3>
              <label>
                Pages to read
                <input #goalInput type="number" min="1" [value]="goal()" (input)="goal.set(goalInput.valueAsNumber > 0 ? goalInput.valueAsNumber : 1)" />
              </label>
              <progress [value]="percent()" max="100"></progress>
              <p>{{ store.pagesRead() }} of {{ goal() }} pages ({{ percent() }}%)</p>
            `,
          })
          export class ReadingGoal {
            protected readonly store = inject(BookStore);
            protected readonly goal = signal(1000);
            protected readonly percent = computed(() => Math.min(100, Math.round((this.store.pagesRead() / this.goal()) * 100)));
          }
      - file: src/app/stats.ts
        lang: ts
        text: |
          import { Component, inject } from '@angular/core';
          import { BookStore } from './book-store';
          import { ReadingGoal } from './reading-goal';

          @Component({
            selector: 'app-stats',
            imports: [ReadingGoal],
            template: `
              <h2>Statistics</h2>
              <ul>
                <li>Books in the list: {{ store.books().length }}</li>
                <li>Books finished: {{ store.finishedCount() }}</li>
                <li>Pages read: {{ store.pagesRead() }}</li>
              </ul>

              @defer (on viewport) {
                <app-reading-goal />
              } @placeholder {
                <p>The reading goal loads when you scroll here.</p>
              } @loading (minimum 300ms) {
                <p>Loading...</p>
              }
            `,
          })
          export class Stats {
            protected readonly store = inject(BookStore);
          }
      - file: terminal
        lang: sh
        text: |
          grep zone package.json
          npm run build
    mistakes:
      - problem:
          en: "Changing a plain field (count = 5) and the page does not update."
          tr: "Düz bir field'ı değiştirmek (count = 5) ve sayfanın güncellenmemesi."
        fix:
          en: "Without zone.js nothing watches plain fields. Keep changing state in a signal."
          tr: "zone.js olmadan düz field'ları kimse izlemez. State'i signal içinde değiştirmeye devam et."
      - problem:
          en: "Using the deferred component outside the @defer block too: nothing is deferred."
          tr: "Ertelenen component'i @defer bloğunun dışında da kullanmak: hiçbir şey ertelenmez."
        fix:
          en: "Then it is part of the main bundle. Use it only inside @defer."
          tr: "O zaman ana bundle'ın parçası olur. Sadece @defer içinde kullan."
      - problem:
          en: "Changing a property of an object that an input holds (book.title = 'x') and seeing no update."
          tr: "Bir input'un tuttuğu objenin özelliğini değiştirmek (book.title = 'x') ve güncelleme görmemek."
        fix:
          en: "OnPush components update when the input gets a new object. Replace the object, as toggle() does."
          tr: "OnPush component'ler input yeni bir obje alınca güncellenir. toggle()'daki gibi objeyi yenisiyle değiştir."
    quiz:
      - q:
          en: "What makes the reading-goal code a separate file in the build?"
          tr: "reading-goal kodunu build'de ayrı bir dosya yapan nedir?"
        options:
          en: [The @defer block that is the only place using it, The file name, A setting in package.json]
          tr: [Onu kullanan tek yer olan @defer bloğu, Dosyanın adı, package.json'daki bir ayar]
        answer: 0
        why:
          en: "The compiler moves a component that is used only inside @defer into its own chunk and downloads it when the trigger fires."
          tr: "Derleyici, sadece @defer içinde kullanılan component'i kendi chunk'ına taşır ve tetikleyici çalışınca indirir."
    sources:
      - title: Zoneless Angular
        url: https://angular.dev/guide/zoneless
      - title: Skipping component subtrees (OnPush)
        url: https://angular.dev/best-practices/skipping-subtrees
      - title: Deferrable views (@defer)
        url: https://angular.dev/guide/templates/defer

  - id: build
    stage: packaging
    title:
      en: "Build the app for production"
      tr: "Uygulamayı production için build etme"
    minutes: 30
    needs: [performance]
    why:
      en: "ng build turns your TypeScript and templates into small optimized files. Those files are what you put on a server. The build also warns you when the app gets too big."
      tr: "ng build TypeScript ve template'lerini küçük, optimize dosyalara çevirir. Sunucuya koyduğun şey bu dosyalardır. Build, uygulama çok büyüyünce de seni uyarır."
    learn:
      en: |
        - `npm run build` runs `ng build`; the production configuration is the default
        - The output is in `dist/reading-log/browser`: `index.html`, hashed JavaScript chunks and CSS
        - File names contain a hash of the content, so browsers cache them safely
        - Budgets in `angular.json` warn at 500 kB and fail at 1 MB for the first download
      tr: |
        - `npm run build` `ng build`'i çalıştırır; production yapılandırması varsayılandır
        - Çıktı `dist/reading-log/browser` içindedir: `index.html`, hash'li JavaScript chunk'ları ve CSS
        - Dosya adları içeriğin hash'ini taşır; böylece tarayıcılar onları güvenle önbelleğe alır
        - `angular.json` içindeki budget'lar ilk indirme için 500 kB'ta uyarır, 1 MB'ta başarısız olur
    do:
      en: |
        1. Run the first block below and read the output: the "Initial total" is what a visitor downloads first (about 290 kB raw and 80 kB compressed here). The lazy chunks come later.
        2. Look inside `dist/reading-log/browser`.
        3. Serve it locally with the second block and open http://localhost:8080. This is exactly what a web server will deliver.
        4. Stop it with `Ctrl+C`. The `dist` folder stays out of Git: the CLI's `.gitignore` already lists it.
        5. Run `npm run build` again after every change before you publish.
      tr: |
        1. Aşağıdaki ilk bloğu çalıştır ve çıktıyı oku: "Initial total" ziyaretçinin ilk indirdiği şeydir (burada ham yaklaşık 290 kB, sıkıştırılmış 80 kB). Lazy chunk'lar sonra gelir.
        2. `dist/reading-log/browser` içine bak.
        3. İkinci blokla yerelde sun ve http://localhost:8080 adresini aç. Bir web sunucusunun vereceği şey tam olarak budur.
        4. `Ctrl+C` ile durdur. `dist` klasörü Git'e girmez: CLI'ın `.gitignore` dosyası onu zaten listeler.
        5. Yayınlamadan önce her değişiklikten sonra `npm run build`'i tekrar çalıştır.
    code:
      - file: terminal
        lang: sh
        text: |
          npm run build
      - file: terminal
        lang: sh
        text: |
          python3 -m http.server 8080 --directory dist/reading-log/browser
    mistakes:
      - problem:
          en: "Opening dist/reading-log/browser/index.html by double click: the page is blank."
          tr: "dist/reading-log/browser/index.html dosyasına çift tıklayıp açmak: sayfa boş."
        fix:
          en: "The files must be served over http. Use a server, as in the second block."
          tr: "Dosyalar http üzerinden sunulmalı. İkinci bloktaki gibi bir sunucu kullan."
      - problem:
          en: "The build fails because of the bundle budget."
          tr: "Build bundle budget'ı yüzünden başarısız oluyor."
        fix:
          en: "Find what is big with the build output. Lazy load pages, use @defer, remove unused packages. Raise the budget in angular.json only when you understand why."
          tr: "Neyin büyük olduğunu build çıktısından bul. Sayfaları lazy yükle, @defer kullan, kullanılmayan paketleri kaldır. Budget'ı angular.json'da sadece nedenini anlayınca yükselt."
    quiz:
      - q:
          en: "Why do built file names contain a hash like main-TQHI4BB6.js?"
          tr: "Build edilen dosya adları neden main-TQHI4BB6.js gibi bir hash içerir?"
        options:
          en: [To hide the code, So a changed file gets a new name and browsers can cache the others for long, To make it smaller]
          tr: [Kodu gizlemek için, Değişen dosya yeni ad alsın ve tarayıcılar diğerlerini uzun süre önbellekte tutabilsin diye, Küçültmek için]
        answer: 1
        why:
          en: "The hash comes from the content. Unchanged files keep their name and stay cached; a changed file is downloaded fresh."
          tr: "Hash içerikten gelir. Değişmeyen dosyalar adını korur ve önbellekte kalır; değişen dosya yeniden indirilir."
    sources:
      - title: Building Angular apps
        url: https://angular.dev/tools/cli/build
      - title: Deployment (production build)
        url: https://angular.dev/tools/cli/deployment
      - title: Python http.server
        url: https://docs.python.org/3/library/http.server.html

  - id: deploy
    stage: deploy
    title:
      en: "Publish on GitHub Pages"
      tr: "GitHub Pages'te yayınlama"
    minutes: 60
    needs: [build]
    why:
      en: "Publishing makes your app reachable by anyone with the link. With GitHub Actions every push to main tests, builds and publishes the app by itself, for free."
      tr: "Yayınlamak uygulamanı bağlantıya sahip herkesin erişebileceği hale getirir. GitHub Actions ile main'e her push'ta uygulama kendiliğinden test edilir, build edilir ve ücretsiz yayınlanır."
    learn:
      en: |
        - Putting your project on GitHub
        - A GitHub Actions workflow that tests, builds and deploys
        - `--base-href /reading-log/` for a project site at `https://<user>.github.io/<repo>/`
        - GitHub Pages is static: a copy of `index.html` named `404.html` lets Angular handle deep links like `/stats`
        - Limits from GitHub's docs: sites up to 1 GB, a soft bandwidth limit of 100 GB per month, and deployments time out after 10 minutes. On a free account the repository must be public. Pages is not for running a business or a shop
      tr: |
        - Projeni GitHub'a koymak
        - Test eden, build eden ve yayınlayan bir GitHub Actions workflow'u
        - `https://<kullanıcı>.github.io/<repo>/` adresindeki proje sitesi için `--base-href /reading-log/`
        - GitHub Pages statiktir: `404.html` adlı bir `index.html` kopyası, Angular'ın `/stats` gibi derin linkleri yönetmesini sağlar
        - GitHub dokümanındaki limitler: 1 GB'a kadar site, ayda 100 GB'lık yumuşak bant genişliği limiti ve 10 dakikada zaman aşımına uğrayan deploy'lar. Ücretsiz hesapta repo herkese açık (public) olmalı. Pages bir iş ya da mağaza işletmek için değildir
    do:
      en: |
        1. On github.com create a new **public** repository named `reading-log`, empty (no README).
        2. Connect it and push (first block below). `git branch -M main` makes sure your branch is called `main`.
        3. Create `.github/workflows/deploy.yml` with the content below, commit and push.
        4. On GitHub: *Settings → Pages → Build and deployment → Source: GitHub Actions*.
        5. Open the *Actions* tab and wait for the green check. Your app is at `https://<your-user>.github.io/reading-log/`.
        6. Open `/reading-log/stats` directly in a new tab: it works because of `404.html`.
        7. Another free option is Firebase Hosting: `ng add @angular/fire` (see the Angular deployment docs).
      tr: |
        1. github.com'da **herkese açık (public)** `reading-log` adında boş yeni bir repo oluştur (README yok).
        2. Bağla ve push et (aşağıdaki ilk blok). `git branch -M main` dalının adının `main` olmasını sağlar.
        3. Aşağıdaki içerikle `.github/workflows/deploy.yml` dosyasını oluştur, commit ve push et.
        4. GitHub'da: *Settings → Pages → Build and deployment → Source: GitHub Actions*.
        5. *Actions* sekmesini aç ve yeşil onayı bekle. Uygulaman `https://<kullanıcı-adın>.github.io/reading-log/` adresinde.
        6. Yeni sekmede `/reading-log/stats` adresini doğrudan aç: `404.html` sayesinde çalışır.
        7. Bir diğer ücretsiz seçenek Firebase Hosting: `ng add @angular/fire` (Angular deployment dokümanına bak).
    code:
      - file: terminal
        lang: sh
        text: |
          git branch -M main
          git remote add origin https://github.com/<your-user>/reading-log.git
          git push -u origin main
      - file: .github/workflows/deploy.yml
        lang: yaml
        text: |
          name: Deploy to GitHub Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-node@v7
                  with:
                    node-version: lts/*
                    cache: npm
                - run: npm ci
                - run: npm test -- --no-watch
                - run: npm run build -- --base-href /${{ github.event.repository.name }}/
                # GitHub Pages shows 404.html for unknown paths. Angular starts from it and shows the right page.
                - run: cp dist/reading-log/browser/index.html dist/reading-log/browser/404.html
                - uses: actions/configure-pages@v6
                - uses: actions/upload-pages-artifact@v5
                  with:
                    path: ./dist/reading-log/browser
                - id: deployment
                  uses: actions/deploy-pages@v5
    mistakes:
      - problem:
          en: "The published page is blank and the console shows 404 for the JavaScript files."
          tr: "Yayınlanan sayfa boş ve konsolda JavaScript dosyaları için 404 görünüyor."
        fix:
          en: "The base href is missing or wrong. For https://user.github.io/reading-log/ it must be /reading-log/ with both slashes. The workflow passes it with --base-href."
          tr: "Base href eksik ya da yanlış. https://user.github.io/reading-log/ için iki eğik çizgisiyle /reading-log/ olmalı. Workflow bunu --base-href ile verir."
      - problem:
          en: "The workflow fails at npm ci, or the deploy step says Pages is not enabled."
          tr: "Workflow npm ci'da başarısız oluyor ya da deploy adımı Pages'in açık olmadığını söylüyor."
        fix:
          en: "Commit package-lock.json (npm ci installs exactly what it lists). And set Settings → Pages → Source to GitHub Actions."
          tr: "package-lock.json'u commit et (npm ci tam olarak onda yazanları kurar). Ve Settings → Pages → Source'u GitHub Actions yap."
    quiz:
      - q:
          en: "Why does the workflow run the tests before building?"
          tr: "Workflow neden build'den önce testleri çalıştırıyor?"
        options:
          en: [GitHub requires it, So a broken version is never published, To make the build smaller]
          tr: [GitHub zorunlu tutuyor, Bozuk bir sürüm asla yayınlanmasın diye, Build'i küçültmek için]
        answer: 1
        why:
          en: "If a test fails the job stops and the last good version stays online."
          tr: "Bir test başarısız olursa iş durur ve son sağlam sürüm yayında kalır."
    sources:
      - title: Angular deployment guide
        url: https://angular.dev/tools/cli/deployment
      - title: GitHub Pages with a custom workflow
        url: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
      - title: GitHub Pages limits
        url: https://docs.github.com/en/pages/getting-started-with-github-pages/github-pages-limits

  - id: monitoring
    stage: monitoring
    title:
      en: "Know when it breaks"
      tr: "Bozulduğunda haberin olsun"
    minutes: 45
    needs: [deploy]
    why:
      en: "Once real people use the app you will not see their screens. Angular sends unexpected errors to one place, the ErrorHandler. You report them from there, and an uptime check tells you when the site is down."
      tr: "Uygulamayı gerçek insanlar kullanmaya başlayınca onların ekranını göremezsin. Angular beklenmeyen hataları tek bir yere, ErrorHandler'a gönderir. Onları oradan raporlarsın; uptime kontrolü de site çöktüğünde haber verir."
    learn:
      en: |
        - `ErrorHandler` receives errors that nobody caught; replace it with your own class in `app.config.ts`
        - `provideBrowserGlobalErrorListeners()` (already in the generated config) also sends window errors and unhandled promise rejections to it
        - Errors you expect, like a failed request, belong at the place they happen: `httpResource` shows them in `error()`
        - `navigator.sendBeacon` sends a small POST that survives a closing tab
        - Uptime checks and keeping packages up to date
      tr: |
        - `ErrorHandler` kimsenin yakalamadığı hataları alır; `app.config.ts` içinde onu kendi class'ınla değiştir
        - `provideBrowserGlobalErrorListeners()` (oluşan yapılandırmada zaten var) pencere hatalarını ve yakalanmamış promise reddedişlerini de ona gönderir
        - Başarısız istek gibi beklediğin hatalar, oluştukları yerde ele alınır: `httpResource` onları `error()` içinde gösterir
        - `navigator.sendBeacon` sekme kapanırken bile gönderilen küçük bir POST yollar
        - Uptime kontrolleri ve paketleri güncel tutmak
    do:
      en: |
        1. Create `src/app/error-reporter.ts` and `src/app/error-reporter.spec.ts` below, and replace `src/app/app.config.ts`.
        2. Run `npm test -- --no-watch`; expect `Tests 15 passed`.
        3. Send the errors somewhere: set the `ERROR_ENDPOINT` value to your collector's address. In God Eye: the project's *Monitoring* tab gives you a snippet that sends errors to God Eye. With the empty default the errors only go to the console.
        4. Add your site's address as an uptime check (God Eye *Tools → Uptime*).
        5. Once a month: `npm outdated`, then `npx ng update` to see and apply Angular updates, run the tests, push.
        6. Commit and push: the workflow deploys the new version.
      tr: |
        1. Aşağıdaki `src/app/error-reporter.ts` ve `src/app/error-reporter.spec.ts` dosyalarını oluştur ve `src/app/app.config.ts` dosyasını değiştir.
        2. `npm test -- --no-watch` çalıştır; `Tests 15 passed` görmelisin.
        3. Hataları bir yere gönder: `ERROR_ENDPOINT` değerini toplayıcının adresi yap. God Eye'da: projenin *İzleme* sekmesi hataları God Eye'a gönderen bir kod parçası verir. Boş varsayılanla hatalar sadece konsola gider.
        4. Sitenin adresini uptime kontrolü olarak ekle (God Eye *Araçlar → Uptime*).
        5. Ayda bir: `npm outdated`, sonra Angular güncellemelerini görmek ve uygulamak için `npx ng update`, testleri çalıştır, push et.
        6. Commit et ve push et: workflow yeni sürümü yayınlar.
    code:
      - file: src/app/error-reporter.ts
        lang: ts
        text: |
          import { ErrorHandler, inject, InjectionToken } from '@angular/core';
          import { Router } from '@angular/router';

          /** Address of your error collector. Empty means: only write to the console. */
          export const ERROR_ENDPOINT = new InjectionToken<string>('ERROR_ENDPOINT', {
            providedIn: 'root',
            factory: () => '',
          });

          export class ErrorReporter implements ErrorHandler {
            private readonly router = inject(Router);
            private readonly endpoint = inject(ERROR_ENDPOINT);

            handleError(error: unknown) {
              const report = {
                message: error instanceof Error ? error.message : String(error),
                page: this.router.url,
                time: new Date().toISOString(),
              };
              console.error('Reading log error', report, error);
              if (this.endpoint) {
                // sendBeacon sends a small POST in the background and survives a closing tab.
                navigator.sendBeacon(this.endpoint, JSON.stringify(report));
              }
            }
          }
      - file: src/app/app.config.ts
        lang: ts
        text: |
          import { ApplicationConfig, ErrorHandler, provideBrowserGlobalErrorListeners } from '@angular/core';
          import { provideRouter } from '@angular/router';
          import { ErrorReporter } from './error-reporter';
          import { routes } from './app.routes';

          export const appConfig: ApplicationConfig = {
            providers: [
              provideBrowserGlobalErrorListeners(),
              provideRouter(routes),
              { provide: ErrorHandler, useClass: ErrorReporter },
            ],
          };
      - file: src/app/error-reporter.spec.ts
        lang: ts
        text: |
          import { ErrorHandler } from '@angular/core';
          import { TestBed } from '@angular/core/testing';
          import { provideRouter } from '@angular/router';
          import { ERROR_ENDPOINT, ErrorReporter } from './error-reporter';

          describe('ErrorReporter', () => {
            it('writes the error to the console and sends it to the collector', () => {
              const sendBeacon = vi.fn();
              Object.defineProperty(navigator, 'sendBeacon', { value: sendBeacon, configurable: true });
              const consoleError = vi.spyOn(console, 'error').mockImplementation(() => {});
              TestBed.configureTestingModule({
                providers: [
                  provideRouter([]),
                  { provide: ErrorHandler, useClass: ErrorReporter },
                  { provide: ERROR_ENDPOINT, useValue: 'https://errors.example.com/collect' },
                ],
              });

              TestBed.inject(ErrorHandler).handleError(new Error('boom'));

              expect(consoleError).toHaveBeenCalled();
              expect(sendBeacon).toHaveBeenCalledWith(
                'https://errors.example.com/collect',
                expect.stringContaining('"message":"boom"'),
              );
            });
          });
    mistakes:
      - problem:
          en: "Expecting the ErrorHandler to see a failed request from httpResource."
          tr: "ErrorHandler'ın httpResource'taki başarısız isteği görmesini beklemek."
        fix:
          en: "A resource keeps its error in error(). Show it in the template, and report it yourself if you want to track it."
          tr: "Resource hatasını error() içinde tutar. Onu template'te göster; takip etmek istiyorsan kendin raporla."
      - problem:
          en: "Sending users' private data in the error report."
          tr: "Hata raporunda kullanıcıların özel verisini göndermek."
        fix:
          en: "Send the message, the page and the time only. Never the content of forms or saved data."
          tr: "Sadece mesajı, sayfayı ve zamanı gönder. Asla form içeriğini ya da kayıtlı veriyi değil."
    quiz:
      - q:
          en: "Which errors reach your ErrorHandler?"
          tr: "Hangi hatalar ErrorHandler'a ulaşır?"
        options:
          en: [Only errors you catch with try/catch, Unexpected errors that nothing else caught, Every console.log]
          tr: [Sadece try/catch ile yakaladıkların, Başka hiçbir şeyin yakalamadığı beklenmeyen hatalar, Her console.log]
        answer: 1
        why:
          en: "Errors you handle yourself never reach it. It is the last place, good for reporting what you did not expect."
          tr: "Kendin ele aldığın hatalar ona hiç ulaşmaz. O son duraktır ve beklemediğin şeyleri raporlamak için iyidir."
    sources:
      - title: Unhandled errors in Angular
        url: https://angular.dev/best-practices/error-handling
      - title: Updating Angular (ng update)
        url: https://angular.dev/cli/update
      - title: npm outdated
        url: https://docs.npmjs.com/cli/commands/npm-outdated

  - id: next
    stage: advanced
    title:
      en: "Where to go next"
      tr: "Bundan sonra nereye"
    minutes: 120
    needs: [deploy]
    why:
      en: "You have a tested Angular app on the internet. The next topics are what real projects add as they grow; pick the one your next project needs instead of learning all of them at once."
      tr: "İnternette yayında, testleri yazılmış bir Angular uygulaman var. Sıradaki konular, gerçek projelerin büyüdükçe eklediği şeyler; hepsini birden öğrenmek yerine bir sonraki projenin ihtiyaç duyduğunu seç."
    learn:
      en: |
        - **RxJS**: Angular's `HttpClient` returns observables; `toSignal` connects them to signals
        - **HttpClient and interceptors**: POST requests, auth headers
        - **Server-side rendering**: `ng add @angular/ssr` for search engines and a faster first view
        - **Angular Material and the CDK**: ready-made accessible components
        - **Accessibility**: keyboard use, labels and screen readers
        - **End-to-end tests** with a browser tool such as Playwright
        - **A backend**: build one with the Node.js or another backend roadmap
      tr: |
        - **RxJS**: Angular'ın `HttpClient`'ı observable döndürür; `toSignal` onları signal'lere bağlar
        - **HttpClient ve interceptor'lar**: POST istekleri, auth header'ları
        - **Sunucu tarafı render**: arama motorları ve daha hızlı ilk görünüm için `ng add @angular/ssr`
        - **Angular Material ve CDK**: hazır, erişilebilir component'ler
        - **Erişilebilirlik**: klavyeyle kullanım, etiketler ve ekran okuyucular
        - **Uçtan uca testler**: Playwright gibi bir tarayıcı aracıyla
        - **Bir backend**: Node.js ya da başka bir backend yol haritasıyla yaz
    do:
      en: |
        1. Add a field to the form, for example a rating from 1 to 5, with `min()` and `max()` rules and a test.
        2. Or add a "Delete all" button that asks the user first.
        3. Or follow the Angular tutorials at angular.dev/tutorials for a second view of the same ideas.
        4. Then start a backend roadmap in the learning center and make the app save its books on a server.
      tr: |
        1. Forma bir alan ekle, örneğin 1 ile 5 arası bir puan; `min()` ve `max()` kurallarıyla ve bir testle.
        2. Ya da önce kullanıcıya soran bir "Hepsini sil" butonu ekle.
        3. Ya da aynı fikirlere ikinci bir bakış için angular.dev/tutorials adresindeki Angular eğitimlerini izle.
        4. Sonra öğrenme merkezinde bir backend yol haritasına başla ve uygulamanın kitaplarını bir sunucuda saklamasını sağla.
    code:
      - file: terminal
        lang: sh
        text: |
          npx ng generate component rating
          npx ng add @angular/material
    mistakes:
      - problem:
          en: "Learning every library at once and never finishing a project."
          tr: "Her kütüphaneyi aynı anda öğrenmeye çalışıp hiçbir projeyi bitirememek."
        fix:
          en: "Add one thing at a time, only when your app needs it."
          tr: "Her seferinde tek bir şey ekle, sadece uygulaman ona ihtiyaç duyduğunda."
    quiz:
      - q:
          en: "Search engines should show your pages with their content. What do you add?"
          tr: "Arama motorları sayfalarını içeriğiyle göstermeli. Ne eklersin?"
        options:
          en: [Server-side rendering, A bigger bundle budget, More signals]
          tr: [Sunucu tarafı render, Daha büyük bir bundle budget'ı, Daha fazla signal]
        answer: 0
        why:
          en: "With SSR the server sends finished HTML, so crawlers and users see content before the JavaScript loads."
          tr: "SSR ile sunucu hazır HTML gönderir; böylece tarayıcı botları ve kullanıcılar JavaScript yüklenmeden içeriği görür."
    sources:
      - title: Angular essentials
        url: https://angular.dev/essentials/components
      - title: Server-side rendering
        url: https://angular.dev/guide/ssr
      - title: Angular Aria and accessibility best practices
        url: https://angular.dev/best-practices/a11y
