              const fixture = TestBed.createComponent(BookCard);
              fixture.componentRef.setInput('book', value);
              return fixture;
            }

            it('shows the title and the author', async () => {
              const fixture = create();
              await fixture.whenStable();

              const text = (fixture.nativeElement as HTMLElement).textContent;
              expect(text).toContain('Dune');
              expect(text).toContain('Frank Herbert');
              expect(text).toContain('608 pages');
            });

            it('sends the id when the toggle button is clicked', async () => {
              const fixture = create();
              const received: string[] = [];
              fixture.componentInstance.toggled.subscribe((id) => received.push(id));
              await fixture.whenStable();

              const button = (fixture.nativeElement as HTMLElement).querySelector('button');
              button?.click();

