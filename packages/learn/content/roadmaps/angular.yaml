id: angular
title: Angular
summary:
  en: "From an empty computer to your own Angular app on the internet. You build a real reading log step by step: standalone components, signals, routing, a signal form, an API call, tests, and a free deploy."
  tr: "Boş bir bilgisayardan internette yayında olan kendi Angular uygulamana. Adım adım gerçek bir okuma günlüğü yazarsın: standalone component'ler, signal'ler, routing, signal form, API çağrısı, testler ve ücretsiz deploy."
teacher: frontend
project:
  en: 'A reading log: add books, tick them off as finished, search the list, see statistics, find books from the free Open Library API, keep everything after a reload, with tests, and published on GitHub Pages.'
  tr: 'Bir okuma günlüğü: kitap ekleme, bitti olarak işaretleme, listede arama, istatistik görme, ücretsiz Open Library API''sinden kitap bulma, sayfa yenilenince hepsinin kalması; testleri yazılmış ve GitHub Pages''te yayında.'
detect:
  npm: ["@angular/core"]
  files: [angular.json]
version: "22.2"
latest: npm:@angular/core
checked: 2026-10
after: [typescript]
sheets: [angular, typescript, javascript, git, github-actions]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Node.js, an editor and Git"
      tr: "Node.js, bir editör ve Git kurma"
    minutes: 45
    why:
      en: "Angular's tools run on Node.js. An editor makes writing code comfortable, and Git keeps every version of your work so you can never really lose it."
      tr: "Angular'ın araçları Node.js üzerinde çalışır. Editör kod yazmayı rahatlatır, Git de işinin her sürümünü saklar; böylece hiçbir şeyi gerçekten kaybetmezsin."
    learn:
      en: |
        - What Node.js and npm are (Node runs JavaScript on your computer, npm installs packages)
        - How to open a terminal and check that a program is installed
        - Which Node.js version Angular 22 needs
      tr: |
        - Node.js ve npm'in ne olduğu (Node, JavaScript'i bilgisayarında çalıştırır; npm paket kurar)
        - Terminal açmak ve bir programın kurulu olup olmadığını kontrol etmek
        - Angular 22'nin hangi Node.js sürümünü istediği
    do:
      en: |
        1. Download **Node.js LTS** from nodejs.org and install it. Angular 22 needs Node.js 22.22.3 or newer, 24.15 or newer, or 26 and up, and the current LTS download meets that. LTS means "long-term support": it gets fixes for years.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor.
        3. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it.
        4. Open a terminal (in VS Code: *Terminal → New Terminal*) and run the commands below. Each should print a version number.
        5. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
        6. Read the TypeScript roadmap first if you have not: Angular code is written in TypeScript.
      tr: |
        1. nodejs.org'dan **Node.js LTS** sürümünü indirip kur. Angular 22, Node.js 22.22.3 ya da daha yenisini, 24.15 ya da daha yenisini veya 26 ve üstünü ister; güncel LTS indirmesi bunu karşılar. LTS "uzun süreli destek" demek: yıllarca düzeltme alır.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u kur (code.visualstudio.com).
        3. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir.
        4. Bir terminal aç (VS Code'da: *Terminal → New Terminal*) ve aşağıdaki komutları çalıştır. Her biri bir sürüm numarası yazmalı.
        5. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
        6. Henüz yapmadıysan önce TypeScript yol haritasını oku: Angular kodu TypeScript ile yazılır.
    code:
      - file: terminal
        lang: sh
        text: |
          node --version
          npm --version
          git --version
    mistakes:
      - problem:
          en: "\"command not found\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found\" hatası."
        fix:
          en: "Close the terminal (or VS Code) and open it again so it sees the new program. On Windows, restart if it still fails."
          tr: "Terminali (ya da VS Code'u) kapatıp yeniden aç ki yeni programı görsün. Windows'ta hâlâ olmuyorsa bilgisayarı yeniden başlat."
      - problem:
          en: "node --version prints an old number such as 18 or 20."
          tr: "node --version 18 ya da 20 gibi eski bir numara yazıyor."
        fix:
          en: "Angular 22 refuses to run on it. Install the current LTS from nodejs.org, then open a new terminal."
          tr: "Angular 22 onda çalışmayı reddeder. nodejs.org'dan güncel LTS'i kur, sonra yeni bir terminal aç."
    quiz:
      - q:
          en: "What does npm do?"
          tr: "npm ne işe yarar?"
        options:
          en: [It installs and runs packages for your project, It edits your code, It hosts your website]
          tr: [Projen için paket kurar ve çalıştırır, Kodunu düzenler, Web sitene barındırma sağlar]
        answer: 0
        why:
          en: "npm is the package manager that comes with Node.js. Angular and its tools are packages that npm installs."
          tr: "npm, Node.js ile gelen paket yöneticisidir. Angular ve araçları npm'in kurduğu paketlerdir."
    sources:
      - title: Angular installation and prerequisites
        url: https://angular.dev/installation
      - title: Node.js downloads
        url: https://nodejs.org/en/download
      - title: Git installation
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: first-app
    stage: first-code
    title:
      en: "Create your first Angular app"
      tr: "İlk Angular uygulamanı oluşturma"
    minutes: 40
    needs: [setup]
    why:
      en: "The Angular CLI (command line tool) creates a complete working project in one command: build, test and dev server are already set up. You see your first page and learn what the generated files are for."
      tr: "Angular CLI (komut satırı aracı) tek komutla çalışan eksiksiz bir proje oluşturur: build, test ve geliştirme sunucusu hazır gelir. İlk sayfanı görür ve oluşan dosyaların ne işe yaradığını öğrenirsin."
    learn:
      en: |
        - `npx` runs a package without installing it for good, so `npx @angular/cli@22 new` creates a project with the CLI version 22
        - What `src/main.ts`, `src/app/app.ts`, `app.html`, `app.config.ts` and `app.routes.ts` do
        - The dev server reloads the page every time you save
      tr: |
        - `npx` bir paketi kalıcı kurmadan çalıştırır; `npx @angular/cli@22 new` CLI'ın 22 sürümüyle proje oluşturur
        - `src/main.ts`, `src/app/app.ts`, `app.html`, `app.config.ts` ve `app.routes.ts` dosyalarının ne yaptığı
        - Geliştirme sunucusu her kaydedişinde sayfayı yeniler
    do:
      en: |
        1. Run the first block below in a folder where you keep projects. If npx asks "Ok to proceed?", type `y`. The flags choose plain CSS, no server-side rendering and no AI config files. The CLI installs the packages and makes a Git repository with the first commit.
        2. Run `cd reading-log` and `npm start`. Open http://localhost:4200 in the browser: you see the Angular welcome page.
        3. Open the folder in VS Code (`code .`). Replace the whole content of `src/app/app.html` with the two lines below and save. The page changes by itself.
        4. Stop the server with `Ctrl+C` when you are done.
        5. Commit your work (second block).
        6. Know that `npm test` fails for now: the generated test looks for the old welcome text. You rewrite the tests in step 10.
      tr: |
        1. Aşağıdaki ilk bloğu projelerini tuttuğun bir klasörde çalıştır. npx "Ok to proceed?" diye sorarsa `y` yaz. Bayraklar düz CSS'i, sunucu tarafı render olmamasını ve AI yapılandırma dosyası olmamasını seçer. CLI paketleri kurar ve ilk commit'iyle bir Git repo'su oluşturur.
        2. `cd reading-log` ve `npm start` çalıştır. Tarayıcıda http://localhost:4200 adresini aç: Angular karşılama sayfasını görürsün.
        3. Klasörü VS Code'da aç (`code .`). `src/app/app.html` dosyasının bütün içeriğini aşağıdaki iki satırla değiştir ve kaydet. Sayfa kendiliğinden değişir.
        4. İşin bitince sunucuyu `Ctrl+C` ile durdur.
        5. Çalışmanı commit et (ikinci blok).
        6. `npm test` şimdilik hata verir: oluşan test eski karşılama metnini arar. Testleri 10. adımda yeniden yazarsın.
    code:
      - file: terminal
        lang: sh
        text: |
          npx @angular/cli@22 new reading-log --defaults --style=css --ssr=false --ai-config=none
          cd reading-log
          npm start
      - file: src/app/app.html
        lang: html
        text: |
          <h1>Reading log</h1>
          <p>Books I want to read, and books I have finished.</p>
      - file: terminal
        lang: sh
        text: |
          git add -A
          git commit -m "Hello Angular"
    mistakes:
      - problem:
          en: "Running npm start outside the project folder (\"Missing script: start\")."
          tr: "npm start'ı proje klasörünün dışında çalıştırmak (\"Missing script: start\")."
        fix:
          en: "Run cd reading-log first. The folder with package.json and angular.json is the project."
          tr: "Önce cd reading-log çalıştır. package.json ve angular.json dosyalarının olduğu klasör projedir."
      - problem:
          en: "Port 4200 is already in use."
          tr: "4200 portu zaten kullanımda."
        fix:
          en: "Stop the other server, or start on another port: npm start -- --port 4300."
          tr: "Diğer sunucuyu durdur ya da başka bir portta başlat: npm start -- --port 4300."
    quiz:
      - q:
          en: "Which file do you deploy to the internet: the project folder or the build output?"
          tr: "İnternete hangisini yayınlarsın: proje klasörünü mü, build çıktısını mı?"
        options:
          en: [The whole project folder, The build output made by ng build, The node_modules folder]
          tr: [Proje klasörünün tamamını, ng build'in ürettiği build çıktısını, node_modules klasörünü]
        answer: 1
        why:
          en: "The source needs Node.js tools to run. The build output is plain HTML, JavaScript and CSS that any web server can serve. You make it in step 13."
          tr: "Kaynak kodun çalışması için Node.js araçları gerekir. Build çıktısı her web sunucusunun verebileceği düz HTML, JavaScript ve CSS'tir. Onu 13. adımda üreteceksin."
    sources:
      - title: Angular installation, creating a project
        url: https://angular.dev/installation
      - title: ng new (CLI reference)
        url: https://angular.dev/cli/new
      - title: Angular components, the basics
        url: https://angular.dev/essentials/components

  - id: components
    stage: basics
    title:
      en: "Components, inputs and outputs"
      tr: "Component'ler, input'lar ve output'lar"
    minutes: 60
    needs: [first-app]
    why:
      en: "An Angular page is a tree of components. Each component is a TypeScript class with a template. Small components that get data in and send events out are the building block of every app."
      tr: "Bir Angular sayfası component ağacıdır. Her component, template'i olan bir TypeScript class'ıdır. Veri alan ve olay gönderen küçük component'ler her uygulamanın yapı taşıdır."
    learn:
      en: |
        - A component: `@Component` with a `selector` and a `template`
        - Standalone components list what their template uses in `imports`
        - `input.required<T>()` receives data from the parent, `output<T>()` sends an event to it
        - `@for` repeats a block (and `track` is required), `@empty` shows when the list is empty
        - `[class.finished]="..."` switches a CSS class from a value
      tr: |
        - Component: `selector` ve `template` olan bir `@Component`
        - Standalone component'ler template'inin kullandıklarını `imports` içinde listeler
        - `input.required<T>()` parent'tan veri alır, `output<T>()` ona olay gönderir
        - `@for` bir bloğu tekrar eder (`track` zorunludur), `@empty` liste boşken gösterilir
        - `[class.finished]="..."` bir değere göre CSS class'ını açıp kapatır
    do:
      en: |
        1. Run `npm start` in a terminal and keep it open. Use a second terminal for other commands.
        2. Create `src/app/book.ts` (the shape of a book) and `src/app/book-card.ts` (the card component) with the code below.
        3. Replace `src/app/app.ts` and `src/app/app.html`. Delete `src/app/app.css`: the root component no longer uses it.
        4. Replace `src/styles.css` with the global styles below.
        5. Open the page. You see three cards. Open the developer tools (F12 → Console), click the buttons and read the messages.
        6. Commit your work.
      tr: |
        1. Bir terminalde `npm start` çalıştır ve açık bırak. Diğer komutlar için ikinci bir terminal kullan.
        2. Aşağıdaki kodla `src/app/book.ts` (kitabın şekli) ve `src/app/book-card.ts` (kart component'i) dosyalarını oluştur.
        3. `src/app/app.ts` ve `src/app/app.html` dosyalarını değiştir. `src/app/app.css` dosyasını sil: kök component artık onu kullanmıyor.
        4. `src/styles.css` dosyasını aşağıdaki global stillerle değiştir.
        5. Sayfayı aç. Üç kart görürsün. Geliştirici araçlarını aç (F12 → Console), butonlara tıkla ve mesajları oku.
        6. Çalışmanı commit et.
    code:
      - file: src/app/book.ts
        lang: ts
        text: |
          export interface Book {
            id: string;
            title: string;
            author: string;
            pages: number;
            finished: boolean;
          }
      - file: src/app/book-card.ts
        lang: ts
        text: |
          import { Component, input, output } from '@angular/core';
          import { Book } from './book';

          @Component({
            selector: 'app-book-card',
            template: `
              <article [class.finished]="book().finished">
                <h3>{{ book().title }}</h3>
                <p>{{ book().author }}, {{ book().pages }} pages</p>
                <button type="button" (click)="toggled.emit(book().id)">
                  {{ book().finished ? 'Mark as not finished' : 'Mark as finished' }}
                </button>
                <button type="button" (click)="removed.emit(book().id)">Remove</button>
              </article>
            `,
          })
          export class BookCard {
            readonly book = input.required<Book>();
            readonly toggled = output<string>();
            readonly removed = output<string>();
          }
      - file: src/app/app.ts
        lang: ts
        text: |
          import { Component } from '@angular/core';
          import { Book } from './book';
          import { BookCard } from './book-card';

          @Component({
            selector: 'app-root',
            imports: [BookCard],
            templateUrl: './app.html',
          })
          export class App {
            protected readonly books: Book[] = [
              { id: '1', title: 'Dune', author: 'Frank Herbert', pages: 608, finished: true },
              { id: '2', title: 'The Pragmatic Programmer', author: 'Andrew Hunt and David Thomas', pages: 352, finished: false },
              { id: '3', title: 'Piranesi', author: 'Susanna Clarke', pages: 272, finished: false },
            ];

            protected log(id: string) {
              console.log('clicked on book', id);
            }
          }
      - file: src/app/app.html
        lang: html
        text: |
          <h1>Reading log</h1>

          @for (book of books; track book.id) {
            <app-book-card [book]="book" (toggled)="log($event)" (removed)="log($event)" />
          } @empty {
            <p>No books yet.</p>
          }
      - file: src/styles.css
        lang: css
        text: |
          body {
            font-family: system-ui, sans-serif;
            max-width: 40rem;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
          }

          nav {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
          }

          nav a.active {
            font-weight: bold;
          }

          article {
            border: 1px solid #bbb;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
          }

          article.finished {
            background: #eef8ee;
          }

          label {
            display: block;
            margin-bottom: 0.75rem;
          }

          input {
            display: block;
            padding: 0.4rem;
            margin-top: 0.25rem;
          }

          button {
            padding: 0.4rem 0.8rem;
            margin-right: 0.5rem;
          }

          .error {
            color: #b00020;
          }
    mistakes:
      - problem:
          en: "The page is empty and the console says the element app-book-card is not a known element."
          tr: "Sayfa boş ve konsol app-book-card elementinin bilinmediğini söylüyor."
        fix:
          en: "Add BookCard to the imports array of the component whose template uses it (App here)."
          tr: "BookCard'ı, template'inde kullanan component'in (burada App) imports dizisine ekle."
      - problem:
          en: "The build fails with an error about track in @for."
          tr: "Build @for içindeki track ile ilgili bir hatayla başarısız oluyor."
        fix:
          en: "track is required. Track something unique, like book.id, so Angular can tell the items apart."
          tr: "track zorunludur. Angular elemanları ayırt edebilsin diye book.id gibi benzersiz bir şeyi izle."
      - problem:
          en: "Writing {{ book.title }} in the card and getting an error."
          tr: "Kartta {{ book.title }} yazıp hata almak."
        fix:
          en: "An input is a signal: call it. Write book().title."
          tr: "Input bir signal'dir: onu çağır. book().title yaz."
    quiz:
      - q:
          en: "How does a child component tell its parent that something happened?"
          tr: "Child component, parent'a bir şey olduğunu nasıl söyler?"
        options:
          en: [It changes the input, It emits an output event that the parent listens to with parentheses, It calls the parent's constructor]
          tr: [Input'u değiştirir, Parent'ın yuvarlak parantezle dinlediği bir output olayı gönderir, Parent'ın constructor'ını çağırır]
        answer: 1
        why:
          en: "Inputs are read-only inside the child. An output() emits events, and the parent listens with (toggled)=\"...\"."
          tr: "Input'lar child içinde salt okunurdur. output() olay gönderir, parent de (toggled)=\"...\" ile dinler."
    sources:
      - title: Anatomy of a component
        url: https://angular.dev/guide/components/anatomy-of-components
      - title: Accepting data with input properties
        url: https://angular.dev/guide/components/inputs
      - title: Custom events with outputs
        url: https://angular.dev/guide/components/outputs
      - title: Control flow (@if, @for, @switch)
        url: https://angular.dev/guide/templates/control-flow

  - id: signals
    stage: basics
    title:
      en: "Signals: state that updates the page"
      tr: "Signal'ler: sayfayı güncelleyen state"
    minutes: 60
    needs: [components]
    why:
      en: "Right now the buttons do nothing. A signal holds a value, and everything that reads it updates when it changes. Signals are how modern Angular knows what to redraw."
      tr: "Şu an butonlar bir şey yapmıyor. Signal bir değer tutar ve onu okuyan her şey değişince güncellenir. Modern Angular neyi yeniden çizeceğini signal'lerle bilir."
    learn:
      en: |
        - `signal(value)` holds state: read with `count()`, change with `.set()` or `.update()`
        - Never change an array or object in place: make a new one (`[...list]`, `{ ...book }`)
        - `computed(() => ...)` is a read-only value that recalculates only when the signals it reads change
        - `model()` is an input the child can also change, so the parent can use two-way binding `[(value)]`
      tr: |
        - `signal(değer)` state tutar: `count()` ile oku, `.set()` ya da `.update()` ile değiştir
        - Bir diziyi ya da objeyi yerinde değiştirme: yenisini üret (`[...list]`, `{ ...book }`)
        - `computed(() => ...)` sadece okuduğu signal'ler değişince yeniden hesaplanan salt okunur değerdir
        - `model()` child'ın da değiştirebildiği bir input'tur; böylece parent `[(value)]` iki yönlü bağlamasını kullanabilir
    do:
      en: |
        1. Create `src/app/search-box.ts`, a small component with a `model()`.
        2. Replace `src/app/app.ts` and `src/app/app.html` with the versions below.
        3. In the browser: type in the search box, mark a book as finished, remove a book. The counter at the top follows.
        4. Commit your work.
      tr: |
        1. `model()` kullanan küçük bir component olan `src/app/search-box.ts` dosyasını oluştur.
        2. `src/app/app.ts` ve `src/app/app.html` dosyalarını aşağıdaki sürümlerle değiştir.
        3. Tarayıcıda: arama kutusuna yaz, bir kitabı bitti olarak işaretle, bir kitabı sil. Üstteki sayaç bunları takip eder.
        4. Çalışmanı commit et.
    code:
      - file: src/app/search-box.ts
        lang: ts
        text: |
          import { Component, model } from '@angular/core';

          @Component({
            selector: 'app-search-box',
            template: `
              <label>
                Search
                <input #box type="search" [value]="value()" (input)="value.set(box.value)" />
              </label>
            `,
          })
          export class SearchBox {
            readonly value = model('');
          }
      - file: src/app/app.ts
        lang: ts
        text: |
          import { Component, computed, signal } from '@angular/core';
          import { Book } from './book';
          import { BookCard } from './book-card';
          import { SearchBox } from './search-box';

          @Component({
            selector: 'app-root',
            imports: [BookCard, SearchBox],
            templateUrl: './app.html',
          })
          export class App {
            protected readonly books = signal<Book[]>([
              { id: '1', title: 'Dune', author: 'Frank Herbert', pages: 608, finished: true },
              { id: '2', title: 'The Pragmatic Programmer', author: 'Andrew Hunt and David Thomas', pages: 352, finished: false },
              { id: '3', title: 'Piranesi', author: 'Susanna Clarke', pages: 272, finished: false },
            ]);
            protected readonly query = signal('');

            protected readonly visible = computed(() => {
              const q = this.query().trim().toLowerCase();
              return this.books().filter(
                (book) => book.title.toLowerCase().includes(q) || book.author.toLowerCase().includes(q),
              );
            });
            protected readonly finishedCount = computed(() => this.books().filter((book) => book.finished).length);

            protected toggle(id: string) {
              this.books.update((list) => list.map((book) => (book.id === id ? { ...book, finished: !book.finished } : book)));
            }

            protected remove(id: string) {
              this.books.update((list) => list.filter((book) => book.id !== id));
            }
          }
      - file: src/app/app.html
        lang: html
        text: |
          <h1>Reading log</h1>
          <p>{{ finishedCount() }} of {{ books().length }} books finished</p>

          <app-search-box [(value)]="query" />

          @for (book of visible(); track book.id) {
            <app-book-card [book]="book" (toggled)="toggle($event)" (removed)="remove($event)" />
          } @empty {
            <p>No books found.</p>
          }
    mistakes:
      - problem:
          en: "The page shows [object Object] or a function instead of the value."
          tr: "Sayfa değer yerine [object Object] ya da bir fonksiyon gösteriyor."
        fix:
          en: "You printed the signal itself. Call it with parentheses: {{ books().length }}."
          tr: "Signal'in kendisini yazdırdın. Parantezle çağır: {{ books().length }}."
      - problem:
          en: "Changing a book with book.finished = true and nothing updates."
          tr: "Bir kitabı book.finished = true ile değiştirmek ve hiçbir şeyin güncellenmemesi."
        fix:
          en: "A signal only notices a new value. Use update() and return a new array with a new object, as toggle() does."
          tr: "Signal sadece yeni bir değeri fark eder. update() kullan ve toggle()'daki gibi yeni objeli yeni bir dizi döndür."
    quiz:
      - q:
          en: "Why is visible a computed() and not a second signal that you update by hand?"
          tr: "visible neden elle güncellediğin ikinci bir signal değil de computed()?"
        options:
          en: [Computed is the only way to filter, It can never get out of sync with books and query, It makes the page load faster]
          tr: [Filtrelemenin tek yolu computed, books ve query ile asla uyumsuz kalamaz, Sayfayı daha hızlı yükler]
        answer: 1
        why:
          en: "A computed value is derived from the signals it reads, so it is always correct. A second copy would drift away whenever you forget to update it."
          tr: "Computed değer okuduğu signal'lerden türetilir, bu yüzden hep doğrudur. İkinci bir kopya, güncellemeyi unuttuğun anda uyumsuz kalır."
    sources:
      - title: Signals overview
        url: https://angular.dev/guide/signals
      - title: Two-way binding
        url: https://angular.dev/guide/templates/two-way-binding
      - title: Component inputs
        url: https://angular.dev/guide/components/inputs

  - id: service
    stage: first-project
    title:
      en: "A service for the shared data"
      tr: "Ortak veri için bir service"
    minutes: 50
    needs: [signals]
    why:
      en: "Soon several pages need the same list of books. A service is a class that holds shared data and logic, and inject() gives every component the one shared instance. The component only shows things."
      tr: "Birazdan birkaç sayfa aynı kitap listesine ihtiyaç duyacak. Service, ortak veriyi ve mantığı tutan bir class'tır; inject() her component'e paylaşılan tek örneği verir. Component sadece gösterir."
    learn:
      en: |
        - `@Service()` makes a class a service that exists once for the whole app
        - `inject(BookStore)` gives a component that service (only in field initializers and the constructor)
        - Components stay small: the store holds state and rules, the component shows them
      tr: |
        - `@Service()` bir class'ı tüm uygulama için tek bir örneği olan service yapar
        - `inject(BookStore)` component'e o service'i verir (sadece field başlangıç değerlerinde ve constructor'da)
        - Component'ler küçük kalır: store state'i ve kuralları tutar, component onları gösterir
    do:
      en: |
        1. Create `src/app/book-store.ts` with the service below. It moves the list and the actions out of `App`.
        2. Create `src/app/home.ts`, the page that shows the list. It keeps only the search text.
        3. Replace `src/app/app.ts` and `src/app/app.html`: the root component now just shows the home page.
        4. The page looks the same as before. That is the point: you moved code without changing behavior.
        5. Commit your work.
      tr: |
        1. Aşağıdaki service ile `src/app/book-store.ts` dosyasını oluştur. Liste ve işlemler `App`'ten buraya taşınır.
        2. Listeyi gösteren sayfa olan `src/app/home.ts` dosyasını oluştur. Sadece arama metnini tutar.
        3. `src/app/app.ts` ve `src/app/app.html` dosyalarını değiştir: kök component artık sadece ana sayfayı gösterir.
        4. Sayfa öncekiyle aynı görünür. Amaç da bu: davranışı değiştirmeden kodu taşıdın.
        5. Çalışmanı commit et.
    code:
      - file: src/app/book-store.ts
        lang: ts
        text: |
          import { computed, Service, signal } from '@angular/core';
          import { Book } from './book';

          @Service()
          export class BookStore {
            readonly books = signal<Book[]>([
              { id: '1', title: 'Dune', author: 'Frank Herbert', pages: 608, finished: true },
              { id: '2', title: 'The Pragmatic Programmer', author: 'Andrew Hunt and David Thomas', pages: 352, finished: false },
              { id: '3', title: 'Piranesi', author: 'Susanna Clarke', pages: 272, finished: false },
            ]);

            readonly finishedCount = computed(() => this.books().filter((book) => book.finished).length);
            readonly pagesRead = computed(() =>
              this.books()
                .filter((book) => book.finished)
                .reduce((sum, book) => sum + book.pages, 0),
            );

            add(details: { title: string; author: string; pages: number }) {
              const book: Book = { id: crypto.randomUUID(), ...details, finished: false };
              this.books.update((list) => [...list, book]);
            }

            toggle(id: string) {
              this.books.update((list) => list.map((book) => (book.id === id ? { ...book, finished: !book.finished } : book)));
            }

            remove(id: string) {
              this.books.update((list) => list.filter((book) => book.id !== id));
            }
          }
      - file: src/app/home.ts
        lang: ts
        text: |
          import { Component, computed, inject, signal } from '@angular/core';
          import { BookCard } from './book-card';
          import { BookStore } from './book-store';
          import { SearchBox } from './search-box';

          @Component({
            selector: 'app-home',
            imports: [BookCard, SearchBox],
            template: `
              <p>{{ store.finishedCount() }} of {{ store.books().length }} books finished</p>

              <app-search-box [(value)]="query" />

              @for (book of visible(); track book.id) {
                <app-book-card [book]="book" (toggled)="store.toggle($event)" (removed)="store.remove($event)" />
              } @empty {
                <p>No books found.</p>
              }
            `,
          })
          export class Home {
            protected readonly store = inject(BookStore);
            protected readonly query = signal('');

            protected readonly visible = computed(() => {
              const q = this.query().trim().toLowerCase();
              return this.store
                .books()
                .filter((book) => book.title.toLowerCase().includes(q) || book.author.toLowerCase().includes(q));
            });
          }
      - file: src/app/app.ts
        lang: ts
        text: |
          import { Component } from '@angular/core';
          import { Home } from './home';

          @Component({
            selector: 'app-root',
            imports: [Home],
            templateUrl: './app.html',
          })
          export class App {}
      - file: src/app/app.html
        lang: html
        text: |
          <h1>Reading log</h1>
          <app-home />
    mistakes:
      - problem:
          en: "Calling inject() inside a method (error: inject() must be called from an injection context)."
          tr: "inject()'i bir metodun içinde çağırmak (hata: inject() must be called from an injection context)."
        fix:
          en: "Call it where Angular builds the class: a field initializer (store = inject(BookStore)) or the constructor."
          tr: "Angular'ın class'ı kurduğu yerde çağır: field başlangıç değeri (store = inject(BookStore)) ya da constructor."
      - problem:
          en: "Using @Service with constructor parameters."
          tr: "@Service'i constructor parametreleriyle kullanmak."
        fix:
          en: "@Service supports only inject(). Use the older @Injectable({ providedIn: 'root' }) if you need constructor injection."
          tr: "@Service sadece inject()'i destekler. Constructor injection gerekiyorsa eski @Injectable({ providedIn: 'root' })'u kullan."
    quiz:
      - q:
          en: "Two components both call inject(BookStore). How many BookStore objects exist?"
          tr: "İki component da inject(BookStore) çağırıyor. Kaç tane BookStore objesi vardır?"
        options:
          en: [Two, one shared by both, None until you call new]
          tr: [İki, ikisinin paylaştığı bir tane, new çağırana kadar hiç]
        answer: 1
        why:
          en: "A root service is created once and shared, so a change made by one component shows up in the other."
          tr: "Kök service bir kez oluşturulur ve paylaşılır; bu yüzden bir component'in yaptığı değişiklik diğerinde görünür."
    sources:
      - title: Creating and using services
        url: https://angular.dev/guide/di/creating-and-using-services
      - title: Dependency injection overview
        url: https://angular.dev/guide/di
      - title: Injection context
        url: https://angular.dev/guide/di/dependency-injection-context

  - id: routing
    stage: first-project
    title:
      en: "Several pages with the router"
      tr: "Router ile birden fazla sayfa"
    minutes: 50
    needs: [service]
    why:
      en: "A real app has several pages. The router shows a different component for each URL and changes the address without reloading. Loading a page's code only when it is visited keeps the first load small."
      tr: "Gerçek bir uygulamanın birden fazla sayfası olur. Router her URL için farklı bir component gösterir ve adresi sayfayı yenilemeden değiştirir. Bir sayfanın kodunu sadece ziyaret edilince yüklemek ilk yüklemeyi küçük tutar."
    learn:
      en: |
        - A `routes` array maps URL paths to components, and `provideRouter(routes)` in `app.config.ts` turns it on
        - `<router-outlet />` is where the matched page appears, `routerLink` makes links that do not reload the page
        - `loadComponent: () => import(...)` makes a lazy route: its code downloads on the first visit
        - The wildcard route `**` goes last and catches unknown URLs
      tr: |
        - `routes` dizisi URL yollarını component'lere eşler; `app.config.ts` içindeki `provideRouter(routes)` onu açar
        - `<router-outlet />` eşleşen sayfanın göründüğü yerdir, `routerLink` sayfayı yenilemeyen link yapar
        - `loadComponent: () => import(...)` lazy route yapar: kodu ilk ziyarette iner
        - `**` wildcard route'u en sona konur ve bilinmeyen URL'leri yakalar
    do:
      en: |
        1. Create `src/app/stats.ts` (statistics page) and `src/app/not-found.ts`.
        2. Create `src/app/app.routes.ts`: this file already exists from the CLI, replace its content. `app.config.ts` already calls `provideRouter(routes)`, no change needed.
        3. Replace `src/app/app.ts` and `src/app/app.html` with the shell: title, navigation, `<router-outlet />`.
        4. Click "Statistics" and then the browser's back button. The page does not reload. Open http://localhost:4200/nothing to see the not found page.
        5. Run `npm run build` once. The output lists a lazy chunk named `stats`: that is the separate file for the lazy route.
        6. Commit your work.
      tr: |
        1. `src/app/stats.ts` (istatistik sayfası) ve `src/app/not-found.ts` dosyalarını oluştur.
        2. `src/app/app.routes.ts` dosyasını oluştur: bu dosya CLI'dan zaten var, içeriğini değiştir. `app.config.ts` zaten `provideRouter(routes)` çağırıyor, değişiklik gerekmez.
        3. `src/app/app.ts` ve `src/app/app.html` dosyalarını kabukla değiştir: başlık, gezinme ve `<router-outlet />`.
        4. "Statistics"e tıkla, sonra tarayıcının geri butonuna bas. Sayfa yenilenmez. Bulunamadı sayfasını görmek için http://localhost:4200/nothing adresini aç.
        5. Bir kez `npm run build` çalıştır. Çıktıda `stats` adlı bir lazy chunk listelenir: lazy route'un ayrı dosyası odur.
        6. Çalışmanı commit et.
    code:
      - file: src/app/stats.ts
        lang: ts
        text: |
          import { Component, inject } from '@angular/core';
          import { BookStore } from './book-store';

          @Component({
            selector: 'app-stats',
            template: `
              <h2>Statistics</h2>
              <ul>
                <li>Books in the list: {{ store.books().length }}</li>
                <li>Books finished: {{ store.finishedCount() }}</li>
                <li>Pages read: {{ store.pagesRead() }}</li>
              </ul>
            `,
          })
          export class Stats {
            protected readonly store = inject(BookStore);
          }
      - file: src/app/not-found.ts
        lang: ts
        text: |
          import { Component } from '@angular/core';
          import { RouterLink } from '@angular/router';

          @Component({
            selector: 'app-not-found',
            imports: [RouterLink],
            template: `
              <h2>Page not found</h2>
              <p><a routerLink="/">Back to the list</a></p>
            `,
          })
          export class NotFound {}
      - file: src/app/app.routes.ts
        lang: ts
        text: |
          import { Routes } from '@angular/router';
          import { Home } from './home';
          import { NotFound } from './not-found';

          export const routes: Routes = [
            { path: '', component: Home, title: 'Reading log' },
            {
              path: 'stats',
              loadComponent: () => import('./stats').then((m) => m.Stats),
              title: 'Statistics',
            },
            { path: '**', component: NotFound, title: 'Page not found' },
          ];
      - file: src/app/app.ts
        lang: ts
        text: |
          import { Component } from '@angular/core';
          import { RouterLink, RouterLinkActive, RouterOutlet } from '@angular/router';

          @Component({
            selector: 'app-root',
            imports: [RouterOutlet, RouterLink, RouterLinkActive],
            templateUrl: './app.html',
          })
          export class App {}
      - file: src/app/app.html
        lang: html
        text: |
          <h1>Reading log</h1>

          <nav>
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">My books</a>
            <a routerLink="/stats" routerLinkActive="active">Statistics</a>
          </nav>

          <router-outlet />
    mistakes:
      - problem:
          en: "Using href=\"/stats\" for links: the whole app reloads."
          tr: "Linklerde href=\"/stats\" kullanmak: bütün uygulama yeniden yüklenir."
        fix:
          en: "Use routerLink and add RouterLink to the component imports."
          tr: "routerLink kullan ve RouterLink'i component imports'una ekle."
      - problem:
          en: "A lazy route does not make a separate chunk."
          tr: "Lazy route ayrı bir chunk üretmiyor."
        fix:
          en: "You also imported the component at the top of the routes file. A normal import puts it back in the main bundle; keep only the import() inside loadComponent."
          tr: "Component'i route dosyasının üstünde de import etmişsin. Normal import onu tekrar ana bundle'a koyar; sadece loadComponent içindeki import()'u bırak."
    quiz:
      - q:
          en: "Why does the ** route come last?"
          tr: "** route'u neden en sonda?"
        options:
          en: [Routes are matched from top to bottom and ** matches everything, It is faster there, Angular requires alphabetical order]
          tr: [Route'lar yukarıdan aşağıya eşleşir ve ** her şeyi yakalar, Orada daha hızlıdır, Angular alfabetik sıra ister]
        answer: 0
        why:
          en: "The first matching route wins. If ** were first, every URL would show the not found page."
          tr: "İlk eşleşen route kazanır. ** başta olsaydı her URL bulunamadı sayfasını gösterirdi."
    sources:
      - title: Define routes
        url: https://angular.dev/guide/routing/define-routes
      - title: Show routes with outlets
        url: https://angular.dev/guide/routing/show-routes-with-outlets
      - title: Lazy-loaded routes
        url: https://angular.dev/guide/routing/loading-strategies

  - id: forms
    stage: data-api
    title:
      en: "A form with signal forms"
      tr: "Signal form ile bir form"
    minutes: 60
    needs: [routing]
    why:
      en: "People need to add their own books. A form must check what they type before it is saved. Signal forms keep the form data in a signal and check it with rules, and they are stable in Angular 22."
      tr: "İnsanların kendi kitaplarını eklemesi gerekir. Form, yazılanı kaydedilmeden önce kontrol etmelidir. Signal form'lar form verisini bir signal'de tutar ve kurallarla kontrol eder; Angular 22'de kararlıdır."
    learn:
      en: |
        - The form model is a `signal` holding an object; `form(model, rules, options)` wraps it in fields
        - `[formField]` binds an input to a field; `FormField` and `FormRoot` go in the component's `imports`
        - Rules like `required()` and `min()` take an optional `message`
        - A field shows `touched()` and `errors()`; show errors only after the user touched the field
        - The `submission.action` runs only when the form is valid, and `[formRoot]` stops the page from reloading
      tr: |
        - Form modeli, bir obje tutan `signal`'dir; `form(model, kurallar, seçenekler)` onu alanlara sarar
        - `[formField]` bir input'u alana bağlar; `FormField` ve `FormRoot` component'in `imports` listesine girer
        - `required()` ve `min()` gibi kurallar isteğe bağlı bir `message` alır
        - Alan `touched()` ve `errors()` sunar; hataları sadece kullanıcı alana dokunduktan sonra göster
        - `submission.action` sadece form geçerliyse çalışır ve `[formRoot]` sayfanın yenilenmesini engeller
    do:
      en: |
        1. Create `src/app/add.ts` with the form page below.
        2. Replace `src/app/app.routes.ts` (a new lazy route `add`) and `src/app/app.html` (a new link).
        3. Open "Add a book". Click "Save book" with the empty form: the errors appear. Fill it in and save: you go back to the list and the book is there.
        4. Commit your work.
      tr: |
        1. Aşağıdaki form sayfasıyla `src/app/add.ts` dosyasını oluştur.
        2. `src/app/app.routes.ts` (yeni `add` lazy route'u) ve `src/app/app.html` (yeni link) dosyalarını değiştir.
        3. "Add a book" sayfasını aç. Boş formla "Save book"a tıkla: hatalar görünür. Formu doldur ve kaydet: listeye dönersin ve kitap oradadır.
        4. Çalışmanı commit et.
    code:
      - file: src/app/add.ts
        lang: ts
        text: |
          import { Component, inject, signal } from '@angular/core';
          import { form, FormField, FormRoot, min, required } from '@angular/forms/signals';
          import { Router } from '@angular/router';
          import { BookStore } from './book-store';

          @Component({
            selector: 'app-add',
            imports: [FormField, FormRoot],
            template: `
              <h2>Add a book</h2>

              <form [formRoot]="bookForm">
                <label>
                  Title
                  <input [formField]="bookForm.title" />
                </label>
                @if (bookForm.title().touched()) {
                  @for (error of bookForm.title().errors(); track error.kind) {
                    <p class="error">{{ error.message }}</p>
                  }
                }

                <label>
                  Author
                  <input [formField]="bookForm.author" />
                </label>
                @if (bookForm.author().touched()) {
                  @for (error of bookForm.author().errors(); track error.kind) {
                    <p class="error">{{ error.message }}</p>
                  }
                }

                <label>
                  Pages
                  <input type="number" [formField]="bookForm.pages" />
                </label>
                @if (bookForm.pages().touched()) {
                  @for (error of bookForm.pages().errors(); track error.kind) {
                    <p class="error">{{ error.message }}</p>
                  }
                }

                <button type="submit" [disabled]="bookForm().submitting()">Save book</button>
              </form>
            `,
          })
          export class Add {
            private readonly store = inject(BookStore);
            private readonly router = inject(Router);

            private readonly model = signal({ title: '', author: '', pages: 0 });

            protected readonly bookForm = form(
              this.model,
              (path) => {
                required(path.title, { message: 'Enter a title' });
                required(path.author, { message: 'Enter an author' });
                min(path.pages, 1, { message: 'A book has at least 1 page' });
              },
              {
                submission: {
                  action: async () => {
                    const value = this.model();
                    this.store.add({ title: value.title.trim(), author: value.author.trim(), pages: value.pages });
                    await this.router.navigateByUrl('/');
                  },
                },
              },
            );
          }
      - file: src/app/app.routes.ts
        lang: ts
        text: |
          import { Routes } from '@angular/router';
          import { Home } from './home';
          import { NotFound } from './not-found';

          export const routes: Routes = [
            { path: '', component: Home, title: 'Reading log' },
            {
              path: 'add',
              loadComponent: () => import('./add').then((m) => m.Add),
              title: 'Add a book',
            },
            {
              path: 'stats',
              loadComponent: () => import('./stats').then((m) => m.Stats),
              title: 'Statistics',
            },
            { path: '**', component: NotFound, title: 'Page not found' },
          ];
      - file: src/app/app.html
        lang: html
        text: |
          <h1>Reading log</h1>

          <nav>
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">My books</a>
            <a routerLink="/add" routerLinkActive="active">Add a book</a>
            <a routerLink="/stats" routerLinkActive="active">Statistics</a>
          </nav>

          <router-outlet />
    mistakes:
      - problem:
          en: "The inputs do not react: the form seems dead."
          tr: "Input'lar tepki vermiyor: form ölü gibi."
        fix:
          en: "FormField (and FormRoot for the form element) must be in the component's imports array."
          tr: "FormField (ve form elementi için FormRoot) component'in imports dizisinde olmalı."
      - problem:
          en: "Errors show up while the user is still typing the first letter."
          tr: "Kullanıcı daha ilk harfi yazarken hatalar görünüyor."
        fix:
          en: "Wrap the errors in @if (field().touched()). A field becomes touched when the user leaves it or submits."
          tr: "Hataları @if (field().touched()) içine al. Alan, kullanıcı ondan ayrılınca ya da gönderince touched olur."
      - problem:
          en: "Trusting the form check as the only check."
          tr: "Form kontrolünü tek kontrol olarak görmek."
        fix:
          en: "Checks in the browser help users, they do not protect a server. If you add a backend later, check the data there too."
          tr: "Tarayıcıdaki kontroller kullanıcıya yardım eder, sunucuyu korumaz. İleride backend eklersen veriyi orada da kontrol et."
    quiz:
      - q:
          en: "When does the submission action run?"
          tr: "Submission action ne zaman çalışır?"
        options:
          en: [On every key press, Only when all rules pass, Only when the form is empty]
          tr: [Her tuş basışında, Sadece bütün kurallar geçince, Sadece form boşken]
        answer: 1
        why:
          en: "submit() first marks the fields as touched and checks the rules. If a rule fails it stops, so the errors show and nothing is saved."
          tr: "submit() önce alanları touched yapar ve kuralları kontrol eder. Bir kural başarısızsa durur; hatalar görünür ve hiçbir şey kaydedilmez."
    sources:
      - title: Signal forms overview
        url: https://angular.dev/guide/forms/signals/overview
      - title: Signal forms validation
        url: https://angular.dev/guide/forms/signals/validation
      - title: Signal forms submission
        url: https://angular.dev/guide/forms/signals/form-submission
      - title: Signal forms state management
        url: https://angular.dev/guide/forms/signals/field-state-management

  - id: persist
    stage: data-api
    title:
      en: "Keep the books after a reload"
      tr: "Sayfa yenilenince kitapları koruma"
    minutes: 40
    needs: [forms]
    why:
      en: "A reload empties the list again. Saving it in the browser's localStorage keeps it on this computer. An effect is the right tool: it runs code outside Angular whenever a signal changes."
      tr: "Sayfa yenilenince liste yine boşalıyor. Onu tarayıcının localStorage'ında saklamak bu bilgisayarda korur. Effect doğru araçtır: bir signal değiştikçe Angular dışındaki kodu çalıştırır."
    learn:
      en: |
        - `localStorage` keeps text per site in the browser; objects go in as JSON
        - `effect(() => ...)` runs once and again whenever a signal it reads changes
        - Saved data is untrusted: it can be missing, broken or edited by hand, so check it when you read it
      tr: |
        - `localStorage` tarayıcıda site başına metin saklar; objeler JSON olarak girer
        - `effect(() => ...)` bir kez çalışır ve okuduğu signal değişince tekrar çalışır
        - Kayıtlı veriye güvenilmez: eksik, bozuk ya da elle değiştirilmiş olabilir; okurken kontrol et
    do:
      en: |
        1. Replace `src/app/book-store.ts` with the version below. It reads the saved list when the app starts and saves it in an effect.
        2. Add a book, mark one as finished and reload the page: everything stays.
        3. Look at the saved JSON: F12 → Application → Local Storage.
        4. Commit your work.
      tr: |
        1. `src/app/book-store.ts` dosyasını aşağıdaki sürümle değiştir. Uygulama başlarken kayıtlı listeyi okur ve bir effect içinde kaydeder.
        2. Bir kitap ekle, birini bitti işaretle ve sayfayı yenile: her şey yerinde kalır.
        3. Kayıtlı JSON'a bak: F12 → Application → Local Storage.
        4. Çalışmanı commit et.
    code:
      - file: src/app/book-store.ts
        lang: ts
        text: |
          import { computed, effect, Service, signal } from '@angular/core';
          import { Book } from './book';

          const STORAGE_KEY = 'reading-log.books';

          const SAMPLE_BOOKS: Book[] = [
            { id: '1', title: 'Dune', author: 'Frank Herbert', pages: 608, finished: true },
            { id: '2', title: 'The Pragmatic Programmer', author: 'Andrew Hunt and David Thomas', pages: 352, finished: false },
            { id: '3', title: 'Piranesi', author: 'Susanna Clarke', pages: 272, finished: false },
          ];

          function isBook(value: unknown): value is Book {
            const book = value as Partial<Book> | null;
            return (
              typeof book === 'object' &&
              book !== null &&
              typeof book.id === 'string' &&
              typeof book.title === 'string' &&
              typeof book.author === 'string' &&
              typeof book.pages === 'number' &&
              typeof book.finished === 'boolean'
            );
          }

          // Saved data is untrusted: it may be missing, broken or edited by hand.
          function loadBooks(): Book[] {
            try {
              const text = localStorage.getItem(STORAGE_KEY);
              if (text === null) return SAMPLE_BOOKS;
              const data: unknown = JSON.parse(text);
              return Array.isArray(data) ? data.filter(isBook) : SAMPLE_BOOKS;
            } catch {
              return SAMPLE_BOOKS;
            }
          }

          @Service()
          export class BookStore {
            readonly books = signal<Book[]>(loadBooks());

            readonly finishedCount = computed(() => this.books().filter((book) => book.finished).length);
            readonly pagesRead = computed(() =>
              this.books()
                .filter((book) => book.finished)
                .reduce((sum, book) => sum + book.pages, 0),
            );

            constructor() {
              // Runs once now and again whenever the list changes.
              effect(() => {
                const text = JSON.stringify(this.books());
                try {
                  localStorage.setItem(STORAGE_KEY, text);
                } catch {
                  // Storage can be full or blocked (private mode). The app keeps working without saving.
                }
              });
            }

            add(details: { title: string; author: string; pages: number }) {
              const book: Book = { id: crypto.randomUUID(), ...details, finished: false };
              this.books.update((list) => [...list, book]);
            }

            toggle(id: string) {
              this.books.update((list) => list.map((book) => (book.id === id ? { ...book, finished: !book.finished } : book)));
            }

            remove(id: string) {
              this.books.update((list) => list.filter((book) => book.id !== id));
            }
          }
    mistakes:
      - problem:
          en: "Using an effect to copy one signal into another."
          tr: "Bir signal'i diğerine kopyalamak için effect kullanmak."
        fix:
          en: "Use computed for derived values. Effects are for things outside Angular: storage, logs, canvas."
          tr: "Türetilmiş değerler için computed kullan. Effect'ler Angular dışındaki şeyler içindir: storage, log, canvas."
      - problem:
          en: "Calling JSON.parse on saved text without try/catch: one broken value crashes the app at start."
          tr: "Kayıtlı metinde try/catch olmadan JSON.parse çağırmak: tek bir bozuk değer uygulamayı açılışta çökertir."
        fix:
          en: "Wrap it in try/catch and fall back to a safe value, as loadBooks() does."
          tr: "Onu try/catch içine al ve loadBooks()'taki gibi güvenli bir değere dön."
    quiz:
      - q:
          en: "Why check the saved data with isBook() when you wrote it yourself?"
          tr: "Veriyi kendin yazdığın halde neden isBook() ile kontrol ediyorsun?"
        options:
          en: [Anyone can edit localStorage and old versions of the app may have saved other shapes, JSON.parse needs it, Angular requires it]
          tr: [localStorage'ı herkes değiştirebilir ve uygulamanın eski sürümleri başka şekiller kaydetmiş olabilir, JSON.parse bunu ister, Angular bunu zorunlu tutar]
        answer: 0
        why:
          en: "Data from outside your code is untrusted, even when your own app saved it earlier."
          tr: "Kodunun dışından gelen veriye güvenilmez; onu eskiden kendi uygulaman kaydetmiş olsa bile."
    sources:
      - title: Effects
        url: https://angular.dev/guide/signals/effect
      - title: Web Storage API (MDN)
        url: https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API/Using_the_Web_Storage_API
      - title: JSON.parse (MDN)
        url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse

  - id: api
    stage: data-api
    title:
      en: "Find books from a public API"
      tr: "Herkese açık bir API'den kitap bulma"
    minutes: 60
    needs: [persist]
    why:
      en: "Most apps talk to a server. An API is an address that answers with data. Open Library offers a free search API without a key. httpResource makes the request from a signal and gives you the result, the loading state and the error as signals."
      tr: "Çoğu uygulama bir sunucuyla konuşur. API, veriyle cevap veren bir adrestir. Open Library anahtarsız ücretsiz bir arama API'si sunar. httpResource isteği bir signal'den yapar ve sonucu, yüklenme durumunu ve hatayı signal olarak verir."
    learn:
      en: |
        - `httpResource<T>(() => request)` sends a GET request whenever the signals inside change
        - If the function returns `undefined`, no request is sent: that is how we wait for the user
        - `isLoading()`, `error()`, `hasValue()` and `value()` are signals; check `hasValue()` before `value()`
        - Pass query values as `params`, so Angular encodes them
        - For POST, PUT and DELETE use `HttpClient` instead
      tr: |
        - `httpResource<T>(() => istek)` içindeki signal'ler değişince GET isteği gönderir
        - Fonksiyon `undefined` döndürürse istek gönderilmez: kullanıcıyı böyle bekleriz
        - `isLoading()`, `error()`, `hasValue()` ve `value()` signal'dir; `value()`'dan önce `hasValue()`'ya bak
        - Sorgu değerlerini `params` olarak ver; Angular onları kodlar
        - POST, PUT ve DELETE için bunun yerine `HttpClient` kullan
    do:
      en: |
        1. Create `src/app/discover.ts` with the search page below.
        2. Replace `src/app/book-card.ts` (it now hides "0 pages" for books without a page count), `src/app/app.routes.ts` and `src/app/app.html`.
        3. Open "Find books", search for `piranesi`, and add a result to your list. It appears under "My books".
        4. Commit your work.
      tr: |
        1. Aşağıdaki arama sayfasıyla `src/app/discover.ts` dosyasını oluştur.
        2. `src/app/book-card.ts` (artık sayfa sayısı olmayan kitaplarda "0 pages" yazısını gizler), `src/app/app.routes.ts` ve `src/app/app.html` dosyalarını değiştir.
        3. "Find books" sayfasını aç, `piranesi` ara ve bir sonucu listene ekle. "My books" altında görünür.
        4. Çalışmanı commit et.
    code:
      - file: src/app/discover.ts
        lang: ts
        text: |
          import { httpResource } from '@angular/common/http';
          import { Component, inject, signal } from '@angular/core';
          import { BookStore } from './book-store';

          interface SearchDoc {
            key: string;
            title: string;
            author_name?: string[];
            number_of_pages_median?: number;
          }

          interface SearchResponse {
            numFound: number;
            docs: SearchDoc[];
          }

          @Component({
            selector: 'app-discover',
            template: `
              <h2>Find books</h2>

              <label>
                Search Open Library
                <input #box (keyup.enter)="term.set(box.value)" />
              </label>
              <button type="button" (click)="term.set(box.value)">Search</button>

              @if (results.isLoading()) {
                <p>Searching...</p>
              } @else if (results.error()) {
                <p class="error">Could not reach Open Library. Try again later.</p>
              } @else if (results.hasValue()) {
                @for (doc of results.value().docs; track doc.key) {
                  <article>
                    <h3>{{ doc.title }}</h3>
                    <p>{{ doc.author_name?.[0] ?? 'Unknown author' }}</p>
                    <button type="button" (click)="add(doc)">Add to my list</button>
                    <a [href]="'https://openlibrary.org' + doc.key" target="_blank" rel="noopener">Open Library page</a>
                  </article>
                } @empty {
                  <p>No books found.</p>
                }
              }
            `,
          })
          export class Discover {
            private readonly store = inject(BookStore);

            protected readonly term = signal('');

            protected readonly results = httpResource<SearchResponse>(() => {
              const q = this.term().trim();
              if (!q) return undefined; // no request until the user searches
              return {
                url: 'https://openlibrary.org/search.json',
                params: { q, limit: 8, fields: 'key,title,author_name,number_of_pages_median' },
              };
            });

            protected add(doc: SearchDoc) {
              this.store.add({
                title: doc.title,
                author: doc.author_name?.[0] ?? 'Unknown author',
                pages: doc.number_of_pages_median ?? 0,
              });
            }
          }
      - file: src/app/book-card.ts
        lang: ts
        text: |
          import { Component, input, output } from '@angular/core';
          import { Book } from './book';

          @Component({
            selector: 'app-book-card',
            template: `
              <article [class.finished]="book().finished">
                <h3>{{ book().title }}</h3>
                <p>{{ book().author }}{{ book().pages > 0 ? ', ' + book().pages + ' pages' : '' }}</p>
                <button type="button" (click)="toggled.emit(book().id)">
                  {{ book().finished ? 'Mark as not finished' : 'Mark as finished' }}
                </button>
                <button type="button" (click)="removed.emit(book().id)">Remove</button>
              </article>
            `,
          })
          export class BookCard {
            readonly book = input.required<Book>();
            readonly toggled = output<string>();
            readonly removed = output<string>();
          }
      - file: src/app/app.routes.ts
        lang: ts
        text: |
          import { Routes } from '@angular/router';
          import { Home } from './home';
          import { NotFound } from './not-found';

          export const routes: Routes = [
            { path: '', component: Home, title: 'Reading log' },
            {
              path: 'add',
              loadComponent: () => import('./add').then((m) => m.Add),
              title: 'Add a book',
            },
            {
              path: 'discover',
              loadComponent: () => import('./discover').then((m) => m.Discover),
              title: 'Find books',
            },
            {
              path: 'stats',
              loadComponent: () => import('./stats').then((m) => m.Stats),
              title: 'Statistics',
            },
            { path: '**', component: NotFound, title: 'Page not found' },
          ];
      - file: src/app/app.html
        lang: html
        text: |
          <h1>Reading log</h1>

          <nav>
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">My books</a>
            <a routerLink="/add" routerLinkActive="active">Add a book</a>
            <a routerLink="/discover" routerLinkActive="active">Find books</a>
            <a routerLink="/stats" routerLinkActive="active">Statistics</a>
          </nav>

          <router-outlet />
    mistakes:
      - problem:
          en: "The page crashes when the request fails."
          tr: "İstek başarısız olunca sayfa çöküyor."
        fix:
          en: "Reading value() while the resource is in error state throws. Check hasValue() first, and show error() to the user, as the template does."
          tr: "Resource hata durumundayken value() okumak hata fırlatır. Önce hasValue()'ya bak ve şablondaki gibi error()'ı kullanıcıya göster."
      - problem:
          en: "The browser blocks the request with a CORS error."
          tr: "Tarayıcı isteği CORS hatasıyla engelliyor."
        fix:
          en: "The API must allow your site. Open Library does for any site; for another API check its docs, or call it from your own backend."
          tr: "API'nin sitene izin vermesi gerekir. Open Library her siteye izin verir; başka bir API için dokümanına bak ya da kendi backend'inden çağır."
    quiz:
      - q:
          en: "What happens while the search term is empty?"
          tr: "Arama metni boşken ne olur?"
        options:
          en: [A request for everything is sent, The resource stays idle and sends no request, The app crashes]
          tr: [Her şey için bir istek gönderilir, Resource boşta kalır ve istek göndermez, Uygulama çöker]
        answer: 1
        why:
          en: "The request function returns undefined for an empty term, and a resource sends nothing in that case."
          tr: "İstek fonksiyonu boş metinde undefined döndürür ve resource bu durumda hiçbir şey göndermez."
    sources:
      - title: Reactive data fetching with httpResource
        url: https://angular.dev/guide/http/http-resource
      - title: Making HTTP requests
        url: https://angular.dev/guide/http/making-requests
      - title: Open Library Search API
        url: https://openlibrary.org/dev/docs/api/search

  - id: tests
    stage: testing
    title:
      en: "Test the app with Vitest"
      tr: "Uygulamayı Vitest ile test etme"
    minutes: 60
    needs: [api]
    why:
      en: "Tests run your code and tell you when something breaks. New Angular projects test with Vitest and jsdom (a fake browser in Node.js), so tests are fast and need no real browser. Tests that never call the real API are fast and do not break when the network does."
      tr: "Testler kodunu çalıştırır ve bir şey bozulduğunda sana söyler. Yeni Angular projeleri Vitest ve jsdom (Node.js içinde sahte bir tarayıcı) ile test eder; bu yüzden testler hızlıdır ve gerçek tarayıcı gerekmez. Gerçek API'yi hiç çağırmayan testler hızlıdır ve ağ bozulunca bozulmaz."
    learn:
      en: |
        - `describe`, `it` and `expect` are Vitest's way to group and check things
        - `TestBed.createComponent(...)` builds a component in a test; `await fixture.whenStable()` waits until the page is updated
        - `TestBed.inject(Service)` gets a service; `fixture.componentRef.setInput(...)` sets an input
        - `provideHttpClientTesting()` and `HttpTestingController` replace the network with answers you write
      tr: |
        - `describe`, `it` ve `expect` Vitest'in şeyleri gruplama ve kontrol etme yoludur
        - `TestBed.createComponent(...)` bir testte component kurar; `await fixture.whenStable()` sayfa güncellenene kadar bekler
        - `TestBed.inject(Service)` service alır; `fixture.componentRef.setInput(...)` input verir
        - `provideHttpClientTesting()` ve `HttpTestingController` ağın yerine senin yazdığın cevapları koyar
    do:
      en: |
        1. Replace `src/app/app.spec.ts` with the version below (the CLI's test looked for the welcome text).
        2. Create the four other spec files below.
        3. Run `npm test -- --no-watch`. Without `--no-watch` the tests run again on every save, which is nice while writing them. Expect `Tests 12 passed`.
        4. Break something on purpose, for example change `pages: 474` to `475` in a test, and see it fail. Then fix it.
        5. Commit your work.
      tr: |
        1. `src/app/app.spec.ts` dosyasını aşağıdaki sürümle değiştir (CLI'ın testi karşılama metnini arıyordu).
        2. Aşağıdaki diğer dört spec dosyasını oluştur.
        3. `npm test -- --no-watch` çalıştır. `--no-watch` olmadan testler her kaydedişte yeniden çalışır; yazarken güzeldir. `Tests 12 passed` görmelisin.
        4. Bilerek bir şeyi boz, örneğin bir testte `pages: 474`'ü `475` yap ve başarısız olduğunu gör. Sonra düzelt.
        5. Çalışmanı commit et.
    code:
      - file: src/app/app.spec.ts
        lang: ts
        text: |
          import { TestBed } from '@angular/core/testing';
          import { provideRouter } from '@angular/router';
          import { App } from './app';
          import { routes } from './app.routes';

          describe('App', () => {
            beforeEach(() => {
              localStorage.clear();
              TestBed.configureTestingModule({ imports: [App], providers: [provideRouter(routes)] });
            });

            it('shows the title and the navigation', async () => {
              const fixture = TestBed.createComponent(App);
              await fixture.whenStable();

              const page = fixture.nativeElement as HTMLElement;
              expect(page.querySelector('h1')?.textContent).toBe('Reading log');
              expect(page.querySelectorAll('nav a').length).toBe(4);
            });
          });
      - file: src/app/book-store.spec.ts
        lang: ts
        text: |
          import { TestBed } from '@angular/core/testing';
          import { BookStore } from './book-store';

          describe('BookStore', () => {
            beforeEach(() => localStorage.clear());

            it('adds a book that is not finished', () => {
              const store = TestBed.inject(BookStore);
              const before = store.books().length;

              store.add({ title: 'Test book', author: 'Test author', pages: 100 });

              expect(store.books().length).toBe(before + 1);
              expect(store.books().at(-1)).toMatchObject({ title: 'Test book', finished: false });
            });

            it('counts the pages of finished books only', () => {
              const store = TestBed.inject(BookStore);
              expect(store.pagesRead()).toBe(608); // Dune is finished in the sample data

              store.toggle('2'); // The Pragmatic Programmer, 352 pages

              expect(store.finishedCount()).toBe(2);
              expect(store.pagesRead()).toBe(608 + 352);
            });

            it('removes a book', () => {
              const store = TestBed.inject(BookStore);

              store.remove('1');

              expect(store.books().some((book) => book.id === '1')).toBe(false);
            });

            it('saves the list in localStorage', () => {
              const store = TestBed.inject(BookStore);

              store.add({ title: 'Saved book', author: 'Someone', pages: 50 });
              TestBed.tick(); // runs the effect that saves

              expect(localStorage.getItem('reading-log.books')).toContain('Saved book');
            });

            it('starts with the sample books when the saved data is broken', () => {
              localStorage.setItem('reading-log.books', 'this is not json');

              const store = TestBed.inject(BookStore);

              expect(store.books().length).toBe(3);
            });
          });
      - file: src/app/book-card.spec.ts
        lang: ts
        text: |
          import { TestBed } from '@angular/core/testing';
          import { Book } from './book';
          import { BookCard } from './book-card';

          const book: Book = { id: 'b1', title: 'Dune', author: 'Frank Herbert', pages: 608, finished: false };

