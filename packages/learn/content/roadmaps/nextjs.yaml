      - file: app/actions.ts
        lang: ts
        text: |
          "use server";

          import { and, eq } from "drizzle-orm";
          import { updateTag } from "next/cache";
          import { redirect } from "next/navigation";
          import { db } from "@/lib/db";
          import { bookmarks } from "@/lib/db/schema";
          import { requireUser } from "@/lib/session";
          import { parseBookmark, type FormState } from "@/lib/validation";

          export async function addBookmark(_prev: FormState, formData: FormData): Promise<FormState> {
            const user = await requireUser();
            const parsed = parseBookmark(formData);
            if (!parsed.ok) return { errors: parsed.errors, values: parsed.values };

            await db.insert(bookmarks).values({ ...parsed.data, userId: user.id });
            updateTag("bookmarks");
            redirect("/bookmarks");
          }

          export async function deleteBookmark(id: number) {
            const user = await requireUser();
            await db.delete(bookmarks).where(and(eq(bookmarks.id, id), eq(bookmarks.userId, user.id)));
            updateTag("bookmarks");
            redirect("/bookmarks");
          }
      - file: app/bookmarks/[id]/page.tsx
        lang: tsx
        text: |
          import { Suspense } from "react";
          import { notFound } from "next/navigation";
          import CopyButton from "@/app/components/CopyButton";
          import { deleteBookmark } from "@/app/actions";
          import { getBookmark } from "@/lib/bookmarks";
          import { getSession } from "@/lib/session";

          export default function BookmarkPage(props: PageProps<"/bookmarks/[id]">) {
            return (
              <main className="mx-auto max-w-2xl p-6">
                <Suspense fallback={<p>Loading...</p>}>
                  <BookmarkDetails params={props.params} />
                </Suspense>
              </main>
            );
          }

          async function BookmarkDetails({
            params,
          }: {
            params: PageProps<"/bookmarks/[id]">["params"];
          }) {
            const { id } = await params;
            const bookmark = await getBookmark(Number(id));
            if (!bookmark) notFound();
            const session = await getSession();
            const isOwner = session?.user.id === bookmark.userId;

            return (
              <article>
                <h1 className="text-3xl font-bold">{bookmark.title}</h1>
                <p className="mt-2">{bookmark.note}</p>
                <p className="mt-4 flex items-center gap-3">
                  <a href={bookmark.url} className="underline" rel="noopener noreferrer" target="_blank">
                    {bookmark.url}
                  </a>
                  <CopyButton text={bookmark.url} />
                </p>
                {isOwner && (
                  <form action={deleteBookmark.bind(null, bookmark.id)} className="mt-6">
                    <button type="submit" className="rounded border border-red-600 px-3 py-1 text-red-600">
                      Delete
                    </button>
                  </form>
                )}
              </article>
            );
          }
      - file: app/api/bookmarks/route.ts
        lang: ts
        text: |
          import { getBookmarks } from "@/lib/bookmarks";
          import { filterBookmarks } from "@/lib/search";

          export async function GET(request: Request) {
            const q = new URL(request.url).searchParams.get("q");
            const found = filterBookmarks(await getBookmarks(), q);
            // Send only public fields, never userId.
            return Response.json(
              found.map(({ id, title, url, note, createdAt }) => ({ id, title, url, note, createdAt })),
            );
          }
      - file: proxy.ts
        lang: ts
        text: |
          import { getSessionCookie } from "better-auth/cookies";
          import { NextResponse, type NextRequest } from "next/server";

          // A quick, optimistic check: no session cookie, no page. The real check is in the actions.
          export function proxy(request: NextRequest) {
            if (!getSessionCookie(request)) {
              return NextResponse.redirect(new URL("/sign-in", request.url));
            }
            return NextResponse.next();
          }

          export const config = {
            matcher: ["/new"],
          };
      - file: tests/e2e/bookmarks.spec.ts
        lang: ts
        text: |
          import { expect, test } from "@playwright/test";

          test("sign up, add a bookmark, see it, delete it", async ({ page }) => {
            const email = `test-${Date.now()}@example.com`;

            await page.goto("/new");
            await expect(page).toHaveURL(/\/sign-in/);

            await page.goto("/sign-up");
            await page.getByLabel("Name").fill("Test User");
            await page.getByLabel("Email").fill(email);
            await page.getByLabel(/Password/).fill("a-long-password");
            await page.getByRole("button", { name: "Create account" }).click();
            await expect(page.getByText("Test User")).toBeVisible();

            await page.getByRole("link", { name: "Add" }).click();
            await page.getByLabel("Title").fill("Playwright docs");
            await page.getByLabel("Link").fill("https://playwright.dev");
            await page.getByRole("button", { name: "Save bookmark" }).click();

            await expect(page).toHaveURL(/\/bookmarks$/);
            await page.getByRole("link", { name: "Playwright docs" }).click();
            await page.getByRole("button", { name: "Delete" }).click();

            await expect(page).toHaveURL(/\/bookmarks$/);
            await expect(page.getByRole("link", { name: "Playwright docs" })).toHaveCount(0);
          });
    mistakes:
      - problem:
          en: "Sign-in seems to work but you are still signed out."
          tr: "Giriş çalışıyor gibi görünüyor ama hâlâ çıkış yapmış durumdasın."
        fix:
          en: "The nextCookies() plugin is missing or not the last plugin in lib/auth.ts. Server actions need it to set the session cookie."
          tr: "nextCookies() plugin'i eksik ya da lib/auth.ts içinde son plugin değil. Server action'ların oturum cookie'sini koyması için ona ihtiyaç var."
      - problem:
          en: "Protecting the app only with proxy.ts."
          tr: "Uygulamayı sadece proxy.ts ile korumak."
        fix:
          en: "proxy only checks that a cookie exists, and server actions can be called directly. Always call requireUser() and check ownership inside every action that changes data, as app/actions.ts does."
          tr: "proxy sadece cookie'nin var olduğuna bakar ve server action'lar doğrudan çağrılabilir. Veriyi değiştiren her action'ın içinde requireUser() çağır ve sahipliği kontrol et; app/actions.ts bunu yapıyor."
      - problem:
          en: "A middleware.ts file from an older tutorial does nothing, or logs a deprecation warning."
          tr: "Eski bir eğitimden kalma middleware.ts dosyası bir şey yapmıyor ya da deprecation uyarısı veriyor."
        fix:
          en: "Since Next.js 16 the file is called proxy.ts and the exported function proxy. The codemod npx @next/codemod@canary middleware-to-proxy . renames it."
          tr: "Next.js 16'dan beri dosyanın adı proxy.ts ve dışa aktarılan fonksiyonun adı proxy. npx @next/codemod@canary middleware-to-proxy . komutu yeniden adlandırır."
    quiz:
      - q:
          en: "Where must the check \"is this the owner of the link?\" happen?"
          tr: "\"Bu linkin sahibi mi?\" kontrolü nerede yapılmalı?"
        options:
          en: [Only in proxy.ts, In the server action that deletes the link, Only in the browser]
          tr: [Sadece proxy.ts içinde, Linki silen server action'ın içinde, Sadece tarayıcıda]
        answer: 1
        why:
          en: "The action is the place where data changes, and it can be called without your pages. Checks in the browser or only before the page are not enough."
          tr: "Action verinin değiştiği yerdir ve sayfalarına uğramadan çağrılabilir. Tarayıcıdaki ya da sadece sayfadan önceki kontroller yetmez."
