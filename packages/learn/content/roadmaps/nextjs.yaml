    title:
      en: "Fast pages: images, fonts and streaming"
      tr: "Hızlı sayfalar: görseller, fontlar ve streaming"
    minutes: 60
    needs: [auth]
    why:
      en: "Big images and slow data are the two usual reasons a site feels slow. Next.js resizes images for you, loads fonts without layout jumps, and with streaming the visitor sees the page frame at once while the slow part loads."
      tr: "Büyük görseller ve yavaş veri, bir sitenin yavaş hissettirmesinin iki olağan sebebidir. Next.js görselleri senin için küçültür, fontları yerleşim kayması olmadan yükler ve streaming ile ziyaretçi yavaş kısım yüklenirken sayfa çerçevesini hemen görür."
    learn:
      en: |
        - `next/image`: resizes, serves modern formats, lazy loads, and reserves space so the page does not jump. `sizes` tells the browser how wide the image will be on screen
        - An image at the top of the page should load at once: `loading="eager"`. (The old `priority` prop is deprecated in Next.js 16)
        - Images from other websites must be allowed in `next.config.ts` under `images.remotePatterns`
        - `next/font` downloads Google fonts at build time and serves them from your own site (already set up in the layout)
        - Streaming: the heading and the search box are in the first HTML, the list streams in behind `<Suspense>` because it reads `searchParams`
        - Measure with Lighthouse (Chrome DevTools) on the production build, not on `npm run dev`
      tr: |
        - `next/image`: küçültür, modern formatlarda sunar, tembel (lazy) yükler ve sayfa zıplamasın diye yer ayırır. `sizes` tarayıcıya görselin ekranda ne kadar geniş olacağını söyler
        - Sayfanın en üstündeki görsel hemen yüklenmeli: `loading="eager"`. (Eski `priority` prop'u Next.js 16'da deprecated)
        - Başka sitelerdeki görsellere `next.config.ts` içinde `images.remotePatterns` ile izin verilmelidir
        - `next/font` Google fontlarını build sırasında indirir ve kendi siteninden sunar (layout'ta zaten kurulu)
        - Streaming: başlık ve arama kutusu ilk HTML'de gelir, liste `searchParams` okuduğu için `<Suspense>` arkasında akar
        - Lighthouse (Chrome DevTools) ile `npm run dev`'de değil, production build'de ölç
    do:
      en: |
        1. Save any wide picture as `public/hero.jpg` (about 1600 by 600 pixels works well).
        2. Replace `app/page.tsx` so the home page shows it with `next/image`. A static import (`import hero from "@/public/hero.jpg"`) gives Next.js the width and height.
        3. Replace `app/bookmarks/page.tsx` with the version that has a search box. The form uses the normal browser GET: submitting it opens `/bookmarks?q=react`, with no JavaScript needed.
        4. Try the search, also with a word that matches nothing.
        5. Run `npm run build` and `npm run start`, open the site in Chrome, open DevTools, choose the *Lighthouse* tab and run a report for mobile. Read the performance score and the hints.
        6. Commit.
      tr: |
        1. Geniş bir resmi `public/hero.jpg` olarak kaydet (yaklaşık 1600'e 600 piksel iyi olur).
        2. Ana sayfa onu `next/image` ile göstersin diye `app/page.tsx` dosyasını değiştir. Statik import (`import hero from "@/public/hero.jpg"`) Next.js'e genişlik ve yüksekliği verir.
        3. `app/bookmarks/page.tsx` dosyasını arama kutulu sürümle değiştir. Form normal tarayıcı GET'ini kullanır: gönderince `/bookmarks?q=react` açılır, JavaScript gerekmez.
        4. Aramayı dene, hiçbir şeyle eşleşmeyen bir kelimeyle de.
        5. `npm run build` ve `npm run start` çalıştır, siteyi Chrome'da aç, DevTools'u aç, *Lighthouse* sekmesini seç ve mobil için bir rapor çalıştır. Performans puanını ve önerileri oku.
        6. Commit'le.
    code:
      - file: app/page.tsx
        lang: tsx
        text: |
          import Image from "next/image";
          import hero from "@/public/hero.jpg";

          export default function HomePage() {
            return (
              <main className="mx-auto max-w-2xl p-6">
                <Image
                  src={hero}
                  alt="A blue gradient banner"
                  loading="eager"
                  sizes="(min-width: 42rem) 42rem, 100vw"
                  className="h-auto w-full rounded"
                />
                <h1 className="mt-6 text-3xl font-bold">Bookmarks</h1>
                <p className="mt-2">A small place to keep the links you want to find again.</p>
              </main>
            );
          }
      - file: app/bookmarks/page.tsx
        lang: tsx
        text: |
          import Link from "next/link";
          import { Suspense } from "react";
          import { getBookmarks } from "@/lib/bookmarks";
          import { filterBookmarks } from "@/lib/search";

          export default function BookmarksPage(props: PageProps<"/bookmarks">) {
            return (
              <main className="mx-auto max-w-2xl p-6">
                <h1 className="text-3xl font-bold">All links</h1>
                <form action="/bookmarks" className="mt-4 flex gap-2">
                  <input name="q" type="search" placeholder="Search" aria-label="Search" className="w-full rounded border p-2" />
                  <button type="submit" className="rounded border px-3">Search</button>
                </form>
                <Suspense fallback={<p className="mt-4">Loading...</p>}>
                  <BookmarkList searchParams={props.searchParams} />
                </Suspense>
              </main>
            );
          }

          async function BookmarkList({
            searchParams,
          }: {
            searchParams: PageProps<"/bookmarks">["searchParams"];
          }) {
            const { q } = await searchParams;
            const bookmarks = filterBookmarks(await getBookmarks(), typeof q === "string" ? q : "");

            if (bookmarks.length === 0) return <p className="mt-4">Nothing found.</p>;

            return (
              <ul className="mt-4 space-y-3">
                {bookmarks.map((b) => (
                  <li key={b.id}>
                    <Link href={`/bookmarks/${b.id}`} className="font-semibold underline">
                      {b.title}
                    </Link>
                    <p className="text-sm text-gray-600">{b.url}</p>
                  </li>
                ))}
              </ul>
            );
          }
    mistakes:
      - problem:
          en: "A plain <img> for big pictures."
          tr: "Büyük resimler için düz <img> kullanmak."
        fix:
          en: "The browser downloads the full-size file. Use next/image with a sensible sizes value so phones get a small version."
          tr: "Tarayıcı tam boyutlu dosyayı indirir. Telefonlar küçük sürümü alsın diye makul bir sizes değeriyle next/image kullan."
      - problem:
          en: "An image from another site fails with \"hostname is not configured under images\"."
          tr: "Başka bir siteden gelen görsel \"hostname is not configured under images\" hatası veriyor."
        fix:
          en: "Add that exact host to images.remotePatterns in next.config.ts. The list exists so strangers cannot use your server to resize any image."
          tr: "O host'u aynen next.config.ts içindeki images.remotePatterns'e ekle. Liste, yabancıların senin server'ını herhangi bir görseli küçültmek için kullanamaması için var."
      - problem:
          en: "Measuring speed with npm run dev."
          tr: "Hızı npm run dev ile ölçmek."
        fix:
          en: "The dev server compiles on demand and is much slower than production. Measure with npm run build and npm run start."
          tr: "Dev sunucusu isteğe göre derler ve production'dan çok daha yavaştır. npm run build ve npm run start ile ölç."
    quiz:
      - q:
          en: "Why is the list on /bookmarks inside <Suspense>?"
          tr: "/bookmarks üzerindeki liste neden <Suspense> içinde?"
        options:
          en: [Because it reads searchParams that exist only at request time, Because lists are always slow, Because Suspense makes images smaller]
          tr: [Çünkü sadece istek anında var olan searchParams'ı okuyor, Çünkü listeler her zaman yavaştır, Çünkü Suspense görselleri küçültür]
        answer: 0
        why:
          en: "The page frame can be prepared ahead and sent at once; the part that needs the request streams in after it."
          tr: "Sayfa çerçevesi önceden hazırlanıp hemen gönderilebilir; isteğe ihtiyaç duyan kısım ondan sonra akar."
    sources:
      - title: Next.js, optimizing images
        url: https://nextjs.org/docs/app/getting-started/images
      - title: Next.js, Image component reference
        url: https://nextjs.org/docs/app/api-reference/components/image
      - title: Next.js, optimizing fonts
        url: https://nextjs.org/docs/app/getting-started/fonts

  - id: seo
    stage: performance
    title:
      en: "Metadata and SEO: titles, sitemap and share images"
      tr: "Metadata ve SEO: başlıklar, sitemap ve paylaşım görseli"
    minutes: 45
    needs: [images-streaming]
    why:
      en: "Search engines and chat apps read your page title, description and share image. Good metadata decides how your links look in search results and when someone shares them."
      tr: "Arama motorları ve sohbet uygulamaları sayfanın başlığını, açıklamasını ve paylaşım görselini okur. İyi metadata, linklerinin arama sonuçlarında ve biri paylaştığında nasıl göründüğünü belirler."
    learn:
      en: |
        - `metadata` for fixed values and `generateMetadata` when the title depends on the page, such as a bookmark's title
        - `metadataBase`: the base address that makes relative URLs in metadata absolute
        - A title template (`%s | Bookmarks`) gives every page a consistent title
        - Special files: `sitemap.ts`, `robots.ts` and `opengraph-image.tsx` become `/sitemap.xml`, `/robots.txt` and the share image
        - The site address comes from `BETTER_AUTH_URL`, which you set to the live address when you deploy
      tr: |
        - Sabit değerler için `metadata`, başlık sayfaya göre değişiyorsa (bir yer iminin başlığı gibi) `generateMetadata`
        - `metadataBase`: metadata'daki göreli URL'leri mutlak yapan temel adres
        - Başlık şablonu (`%s | Bookmarks`) her sayfaya tutarlı bir başlık verir
        - Özel dosyalar: `sitemap.ts`, `robots.ts` ve `opengraph-image.tsx` sırasıyla `/sitemap.xml`, `/robots.txt` ve paylaşım görseli olur
        - Site adresi, deploy ederken canlı adrese ayarlayacağın `BETTER_AUTH_URL`'den gelir
    do:
      en: |
        1. Create `lib/site.ts` with the site address.
        2. Replace `app/layout.tsx` with the final version: `metadataBase` and a title template are added.
        3. Replace `app/bookmarks/[id]/page.tsx`: it now exports `generateMetadata`, so every link gets its own title and description.
        4. Create `app/sitemap.ts`, `app/robots.ts` and `app/opengraph-image.tsx`.
        5. Run the app and check: the browser tab shows "MDN Web Docs | Bookmarks" on a link page, and http://localhost:3000/sitemap.xml, /robots.txt and /opengraph-image work. Right-click a page and choose "View page source" to find the `<title>` and `<meta name="description">`.
        6. Commit.
      tr: |
        1. Site adresiyle `lib/site.ts` dosyasını oluştur.
        2. `app/layout.tsx` dosyasını son sürümle değiştir: `metadataBase` ve bir başlık şablonu eklenir.
        3. `app/bookmarks/[id]/page.tsx` dosyasını değiştir: artık `generateMetadata` dışa aktarır, böylece her linkin kendi başlığı ve açıklaması olur.
        4. `app/sitemap.ts`, `app/robots.ts` ve `app/opengraph-image.tsx` dosyalarını oluştur.
        5. Uygulamayı çalıştır ve kontrol et: bir link sayfasında tarayıcı sekmesi "MDN Web Docs | Bookmarks" gösterir; http://localhost:3000/sitemap.xml, /robots.txt ve /opengraph-image çalışır. Bir sayfaya sağ tıklayıp "View page source" seçerek `<title>` ve `<meta name="description">`'ı bul.
        6. Commit'le.
    code:
      - file: lib/site.ts
        lang: ts
        text: |
          export const siteUrl = process.env.BETTER_AUTH_URL ?? "http://localhost:3000";
      - file: app/layout.tsx
        lang: tsx
        text: |
          import type { Metadata } from "next";
          import Link from "next/link";
          import { Suspense } from "react";
          import { Geist, Geist_Mono } from "next/font/google";
          import "./globals.css";
          import UserMenu from "./components/UserMenu";
          import { siteUrl } from "@/lib/site";

          const geistSans = Geist({
            variable: "--font-geist-sans",
            subsets: ["latin"],
          });

          const geistMono = Geist_Mono({
            variable: "--font-geist-mono",
            subsets: ["latin"],
          });

          export const metadata: Metadata = {
            metadataBase: new URL(siteUrl),
            title: { default: "Bookmarks", template: "%s | Bookmarks" },
            description: "A small place to keep the links you want to find again.",
          };

          export default function RootLayout({ children }: LayoutProps<"/">) {
            return (
              <html
                lang="en"
                className={`${geistSans.variable} ${geistMono.variable} h-full antialiased`}
              >
                <body className="min-h-full flex flex-col">
                  <header className="border-b border-gray-300 p-4">
                    <nav className="mx-auto flex max-w-2xl gap-4">
                      <Link href="/" className="font-bold">Bookmarks</Link>
                      <Link href="/bookmarks">All links</Link>
                      <Link href="/new">Add</Link>
                      <Link href="/about">About</Link>
                      <span className="ml-auto">
                        <Suspense fallback={null}>
                          <UserMenu />
                        </Suspense>
                      </span>
                    </nav>
                  </header>
                  {children}
                </body>
              </html>
            );
          }
      - file: app/bookmarks/[id]/page.tsx
        lang: tsx
        text: |
          import type { Metadata } from "next";
          import { Suspense } from "react";
          import { notFound } from "next/navigation";
          import CopyButton from "@/app/components/CopyButton";
          import { deleteBookmark } from "@/app/actions";
          import { getBookmark } from "@/lib/bookmarks";
          import { getSession } from "@/lib/session";

          export async function generateMetadata(props: PageProps<"/bookmarks/[id]">): Promise<Metadata> {
            const { id } = await props.params;
            const bookmark = await getBookmark(Number(id));
            if (!bookmark) return { title: "Not found" };
            return { title: bookmark.title, description: bookmark.note || bookmark.url };
          }

          export default function BookmarkPage(props: PageProps<"/bookmarks/[id]">) {
            return (
              <main className="mx-auto max-w-2xl p-6">
                <Suspense fallback={<p>Loading...</p>}>
                  <BookmarkDetails params={props.params} />
                </Suspense>
              </main>
            );
          }

          async function BookmarkDetails({
            params,
          }: {
            params: PageProps<"/bookmarks/[id]">["params"];
          }) {
            const { id } = await params;
            const bookmark = await getBookmark(Number(id));
            if (!bookmark) notFound();
            const session = await getSession();
            const isOwner = session?.user.id === bookmark.userId;

            return (
              <article>
                <h1 className="text-3xl font-bold">{bookmark.title}</h1>
                <p className="mt-2">{bookmark.note}</p>
                <p className="mt-4 flex items-center gap-3">
                  <a href={bookmark.url} className="underline" rel="noopener noreferrer" target="_blank">
                    {bookmark.url}
                  </a>
                  <CopyButton text={bookmark.url} />
                </p>
                {isOwner && (
                  <form action={deleteBookmark.bind(null, bookmark.id)} className="mt-6">
                    <button type="submit" className="rounded border border-red-600 px-3 py-1 text-red-600">
                      Delete
                    </button>
                  </form>
                )}
              </article>
            );
          }
      - file: app/sitemap.ts
        lang: ts
        text: |
          import type { MetadataRoute } from "next";
          import { getBookmarks } from "@/lib/bookmarks";
          import { siteUrl } from "@/lib/site";

          export default async function sitemap(): Promise<MetadataRoute.Sitemap> {
            const bookmarks = await getBookmarks();
            return [
              { url: siteUrl },
              { url: `${siteUrl}/bookmarks` },
              ...bookmarks.map((b) => ({
                url: `${siteUrl}/bookmarks/${b.id}`,
                lastModified: b.createdAt,
              })),
            ];
          }
      - file: app/robots.ts
        lang: ts
        text: |
          import type { MetadataRoute } from "next";
          import { siteUrl } from "@/lib/site";

          export default function robots(): MetadataRoute.Robots {
            return {
              rules: { userAgent: "*", allow: "/", disallow: ["/api/", "/new"] },
              sitemap: `${siteUrl}/sitemap.xml`,
            };
          }
      - file: app/opengraph-image.tsx
        lang: tsx
        text: |
          import { ImageResponse } from "next/og";

          export const alt = "Bookmarks";
          export const size = { width: 1200, height: 630 };
          export const contentType = "image/png";

          export default function OpengraphImage() {
            return new ImageResponse(
              (
                <div
                  style={{
                    width: "100%",
                    height: "100%",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    background: "#0f172a",
                    color: "white",
                    fontSize: 96,
                  }}
                >
                  Bookmarks
                </div>
              ),
              size,
            );
          }
    mistakes:
      - problem:
          en: "The build says a relative metadata URL needs metadataBase."
          tr: "Build, göreli bir metadata URL'si için metadataBase gerektiğini söylüyor."
        fix:
          en: "Set metadataBase in the root layout, as in the code above, so Next.js can make the address absolute."
          tr: "Next.js adresi mutlak yapabilsin diye yukarıdaki kodda olduğu gibi root layout'ta metadataBase ayarla."
      - problem:
          en: "The sitemap on the live site lists localhost addresses."
          tr: "Canlı sitedeki sitemap localhost adreslerini listeliyor."
        fix:
          en: "BETTER_AUTH_URL is not set in the host's environment variables. The deploy step sets it to the live address."
          tr: "BETTER_AUTH_URL hosting'in ortam değişkenlerinde ayarlı değil. Deploy adımı onu canlı adrese ayarlıyor."
    quiz:
      - q:
          en: "A page's title depends on data from the database. Which one do you export?"
          tr: "Bir sayfanın başlığı veritabanındaki veriye bağlı. Hangisini dışa aktarırsın?"
        options:
          en: [const metadata, generateMetadata, A title in globals.css]
          tr: [const metadata, generateMetadata, globals.css içinde bir başlık]
        answer: 1
        why:
          en: "metadata is a fixed object. generateMetadata is a function that can read params and data to build the title."
          tr: "metadata sabit bir object'tir. generateMetadata, başlığı oluşturmak için params ve veri okuyabilen bir fonksiyondur."
    sources:
      - title: Next.js, metadata and OG images
        url: https://nextjs.org/docs/app/getting-started/metadata-and-og-images
      - title: Next.js, generateMetadata reference
        url: https://nextjs.org/docs/app/api-reference/functions/generate-metadata
      - title: Next.js, sitemap.xml file convention
        url: https://nextjs.org/docs/app/api-reference/file-conventions/metadata/sitemap

  - id: build
    stage: packaging
    title:
      en: "The production build and the settings your app needs"
      tr: "Production build ve uygulamanın ihtiyaç duyduğu ayarlar"
    minutes: 30
    needs: [seo]
    why:
      en: "What runs on the internet is not the dev server but the production build: compiled, checked and prerendered. Building it yourself first shows problems early, and listing the settings the app needs makes the deploy simple."
      tr: "İnternette çalışan şey dev sunucusu değil, production build'dir: derlenmiş, kontrol edilmiş ve prerender edilmiş. Önce kendin build etmek sorunları erken gösterir; uygulamanın ihtiyaç duyduğu ayarları listelemek de deploy'u kolaylaştırır."
    learn:
      en: |
        - `next build` compiles with Turbopack, checks the TypeScript types and prerenders what it can. Linting is separate: run `npm run lint`
        - Reading the route table: `○` static, `◐` partial prerender (a ready shell plus streamed parts), `ƒ` rendered on every request
        - Your app needs four environment variables in production: `DATABASE_URL`, `DATABASE_AUTH_TOKEN`, `BETTER_AUTH_SECRET` and `BETTER_AUTH_URL`. They hold secrets, so they never go into Git
        - Pages that read the database are prerendered during the build, so the build needs access to the database too
        - Hosts that run containers can use `output: "standalone"` in `next.config.ts` for a small self-contained server (Vercel does not need it)
      tr: |
        - `next build` Turbopack ile derler, TypeScript tiplerini kontrol eder ve yapabildiğini prerender eder. Lint ayrıdır: `npm run lint` çalıştır
        - Route tablosunu okumak: `○` statik, `◐` kısmi prerender (hazır bir kabuk artı akan parçalar), `ƒ` her istekte çizilir
        - Uygulaman production'da dört ortam değişkenine ihtiyaç duyar: `DATABASE_URL`, `DATABASE_AUTH_TOKEN`, `BETTER_AUTH_SECRET` ve `BETTER_AUTH_URL`. Sır tutarlar, bu yüzden asla Git'e girmezler
        - Veritabanı okuyan sayfalar build sırasında prerender edilir, yani build'in de veritabanına erişmesi gerekir
        - Container çalıştıran hosting'ler küçük ve kendi başına yeten bir server için `next.config.ts` içinde `output: "standalone"` kullanabilir (Vercel'e gerekmez)
    do:
      en: |
        1. Run the checks below one by one. Fix anything they report.
        2. Run `npm run start` and open http://localhost:3000. Sign up, add a link, and delete it: it must behave as in development.
        3. Open http://localhost:3000/api/health in the browser. We add this endpoint in the monitoring step; skip this check for now.
        4. Make sure no secret is in Git: `git status` must not list `.env.local` or `local.db`, and `git log` must not contain them.
        5. Commit.
      tr: |
        1. Aşağıdaki kontrolleri tek tek çalıştır. Bildirdiği her şeyi düzelt.
        2. `npm run start` çalıştır ve http://localhost:3000 adresini aç. Kayıt ol, bir link ekle ve sil: geliştirmedeki gibi davranmalı.
        3. Tarayıcıda http://localhost:3000/api/health adresini aç. Bu endpoint'i izleme adımında ekliyoruz; şimdilik bu kontrolü atla.
        4. Hiçbir sırrın Git'te olmadığından emin ol: `git status` `.env.local` ya da `local.db` göstermemeli, `git log` onları içermemeli.
        5. Commit'le.
    code:
      - file: terminal
        lang: sh
        text: |
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build
          npm run start
    mistakes:
      - problem:
          en: "The build fails with \"no such table\" or cannot open the database."
          tr: "Build \"no such table\" hatasıyla bozuluyor ya da veritabanını açamıyor."
        fix:
          en: "Pages that read data are prerendered during the build. Create the tables first (npm run db:push) and make sure DATABASE_URL points to a database that exists."
          tr: "Veri okuyan sayfalar build sırasında prerender edilir. Önce tabloları oluştur (npm run db:push) ve DATABASE_URL'nin var olan bir veritabanını gösterdiğinden emin ol."
      - problem:
          en: "Everything works with npm run dev but breaks after npm run build."
          tr: "Her şey npm run dev ile çalışıyor ama npm run build sonrası bozuluyor."
        fix:
          en: "The dev server is forgiving. Read the build error: it usually names the file, and often is a runtime-data read outside Suspense or a missing environment variable."
          tr: "Dev sunucusu hoşgörülüdür. Build hatasını oku: genelde dosyayı söyler; çoğu zaman Suspense dışında bir istek verisi okuması ya da eksik bir ortam değişkenidir."
    quiz:
      - q:
          en: "Which files must never be committed to Git?"
          tr: "Hangi dosyalar asla Git'e commit'lenmemeli?"
        options:
          en: [package.json and app/page.tsx, .env.local and local.db, vitest.config.mts]
          tr: [package.json ve app/page.tsx, .env.local ve local.db, vitest.config.mts]
        answer: 1
        why:
          en: ".env.local holds secrets and local.db holds data. Code is committed; secrets and data are not."
          tr: ".env.local sırları, local.db veriyi tutar. Kod commit'lenir; sırlar ve veri commit'lenmez."
    sources:
      - title: Next.js, deploying
        url: https://nextjs.org/docs/app/getting-started/deploying
      - title: Next.js, environment variables
        url: https://nextjs.org/docs/app/guides/environment-variables
      - title: Next.js, next build reference
        url: https://nextjs.org/docs/app/api-reference/cli/next

  - id: deploy
    stage: deploy
    title:
      en: "Deploy for free on Vercel with a Turso database"
      tr: "Turso veritabanıyla Vercel'de ücretsiz deploy"
    minutes: 75
    needs: [build]
    why:
      en: "Deploying puts your app on the internet. Vercel (made by the team behind Next.js) runs it for free on the Hobby plan, for personal projects. A file database like local.db cannot live on Vercel, because its servers do not keep files between requests, so the live site uses Turso, a free hosted SQLite that your code already speaks."
      tr: "Deploy uygulamanı internete koyar. Vercel (Next.js'in arkasındaki ekip) Hobby planında kişisel projeler için onu ücretsiz çalıştırır. local.db gibi dosya tabanlı bir veritabanı Vercel'de duramaz, çünkü server'ları istekler arasında dosya saklamaz; bu yüzden canlı site, kodunun zaten konuştuğu ücretsiz barındırılan bir SQLite olan Turso'yu kullanır."
    learn:
      en: |
        - Why serverless hosting needs a hosted database
        - Environment variables on the host: how the same code uses `local.db` on your computer and Turso live
        - The deploy flow: push to GitHub, Vercel builds the project and publishes it; every push to `main` deploys again
        - The Hobby plan is free for personal, non-commercial use and has usage limits; read them on vercel.com/docs/plans/hobby. Turso's free plan has a generous allowance and needs no credit card
      tr: |
        - Serverless hosting'in neden barındırılan bir veritabanına ihtiyaç duyduğu
        - Host üzerindeki ortam değişkenleri: aynı kodun bilgisayarında `local.db`'yi, canlıda Turso'yu nasıl kullandığı
        - Deploy akışı: GitHub'a push et, Vercel projeyi build edip yayınlar; `main`'e her push yeniden deploy eder
        - Hobby planı kişisel, ticari olmayan kullanım için ücretsizdir ve kullanım limitleri vardır; vercel.com/docs/plans/hobby sayfasında oku. Turso'nun ücretsiz planının cömert bir hakkı var ve kredi kartı istemez
    do:
      en: |
        1. Put the code on GitHub. On github.com create a new empty repository named `bookmarks` (private is fine), then run the commands the page shows, like the first block below.
        2. Install the Turso CLI (macOS: `brew install tursodatabase/tap/turso`; Linux and WSL: the `curl` line below), sign up, and create a database. Then print its address and make an access token. Copy both somewhere safe for the next steps.
        3. Create the tables and the starter links in the live database. The values are put in front of the command only for this one run. (In Windows PowerShell write `$env:DATABASE_URL="..."` and `$env:DATABASE_AUTH_TOKEN="..."` on their own lines first.)
        4. Sign up at vercel.com with your GitHub account. Choose *Add New → Project*, import the `bookmarks` repository. Vercel detects Next.js by itself.
        5. Before pressing Deploy, open *Environment Variables* and add four: `DATABASE_URL` (the libsql:// address), `DATABASE_AUTH_TOKEN` (the token), `BETTER_AUTH_SECRET` (a new secret from the node command in the auth step; do not reuse the local one) and `BETTER_AUTH_URL` (put `https://example.vercel.app` for now). Press Deploy.
        6. When it finishes, open the project's *Domains* settings and copy the production address (like `https://bookmarks-abc.vercel.app`). Change `BETTER_AUTH_URL` to that address. Environment variable changes only apply to new deployments, so go to *Deployments*, open the menu of the latest one and choose *Redeploy*.
        7. Open the live address. Sign up, add a link, open it, delete it. Open `/sitemap.xml` and check that it shows the live address, not localhost.
        8. From now on, `git push` to `main` deploys a new version by itself.
      tr: |
        1. Kodu GitHub'a koy. github.com'da `bookmarks` adında yeni boş bir repository oluştur (private olabilir), sonra sayfanın gösterdiği komutları çalıştır; aşağıdaki ilk blok gibi.
        2. Turso CLI'ı kur (macOS: `brew install tursodatabase/tap/turso`; Linux ve WSL: aşağıdaki `curl` satırı), kayıt ol ve bir veritabanı oluştur. Sonra adresini yazdır ve bir erişim token'ı üret. İkisini de sonraki adımlar için güvenli bir yere kopyala.
        3. Canlı veritabanında tabloları ve başlangıç linklerini oluştur. Değerler komutun önüne sadece bu tek çalıştırma için konur. (Windows PowerShell'de önce ayrı satırlarda `$env:DATABASE_URL="..."` ve `$env:DATABASE_AUTH_TOKEN="..."` yaz.)
        4. vercel.com'a GitHub hesabınla kayıt ol. *Add New → Project* seç, `bookmarks` repository'sini import et. Vercel Next.js'i kendisi tanır.
        5. Deploy'a basmadan önce *Environment Variables* kısmını aç ve dört tane ekle: `DATABASE_URL` (libsql:// adresi), `DATABASE_AUTH_TOKEN` (token), `BETTER_AUTH_SECRET` (auth adımındaki node komutuyla ürettiğin yeni bir secret; yereldekini kullanma) ve `BETTER_AUTH_URL` (şimdilik `https://example.vercel.app` yaz). Deploy'a bas.
        6. Bitince projenin *Domains* ayarlarını aç ve production adresini kopyala (`https://bookmarks-abc.vercel.app` gibi). `BETTER_AUTH_URL`'yi o adresle değiştir. Ortam değişkeni değişiklikleri sadece yeni deployment'lara uygulanır, bu yüzden *Deployments*'a git, en son olanın menüsünü aç ve *Redeploy* seç.
        7. Canlı adresi aç. Kayıt ol, bir link ekle, aç, sil. `/sitemap.xml` sayfasını aç ve localhost değil canlı adresi gösterdiğini kontrol et.
        8. Bundan sonra `main`'e her `git push` yeni bir sürümü kendiliğinden deploy eder.
    code:
      - file: terminal
        lang: sh
        text: |
          git remote add origin https://github.com/YOUR-NAME/bookmarks.git
          git branch -M main
          git push -u origin main
      - file: terminal
        lang: sh
        text: |
          curl -sSfL https://get.tur.so/install.sh | bash
          turso auth signup
          turso db create bookmarks
          turso db show bookmarks --url
          turso db tokens create bookmarks
      - file: terminal
        lang: sh
        text: |
          env DATABASE_URL="libsql://YOUR-DATABASE-ADDRESS" DATABASE_AUTH_TOKEN="YOUR-TOKEN" npm run db:push
          env DATABASE_URL="libsql://YOUR-DATABASE-ADDRESS" DATABASE_AUTH_TOKEN="YOUR-TOKEN" npm run db:seed
    mistakes:
      - problem:
          en: "The Vercel build fails because the database is not reachable or has no tables."
          tr: "Vercel build'i veritabanına ulaşılamadığı ya da tabloların olmadığı için bozuluyor."
        fix:
          en: "Pages read the database during the build. Check that the three database variables are set for the Production environment, and that you ran db:push against Turso before deploying."
          tr: "Sayfalar build sırasında veritabanını okur. Veritabanı değişkenlerinin Production ortamı için ayarlı olduğunu ve deploy etmeden önce Turso'ya db:push çalıştırdığını kontrol et."
      - problem:
          en: "Sign-in fails on the live site, or on a preview address Vercel makes for a branch."
          tr: "Canlı sitede ya da Vercel'in bir branch için yaptığı preview adresinde giriş başarısız oluyor."
        fix:
          en: "BETTER_AUTH_URL must be the exact address people use, and it names only the production address. Fix the variable and redeploy; test sign-in on the production address."
          tr: "BETTER_AUTH_URL insanların kullandığı adresin aynısı olmalı ve sadece production adresini söyler. Değişkeni düzelt ve yeniden deploy et; girişi production adresinde test et."
      - problem:
          en: "Pasting the real token or secret into a file that is committed."
          tr: "Gerçek token'ı ya da secret'ı commit'lenen bir dosyaya yapıştırmak."
        fix:
          en: "Keep them only in .env.local (ignored by Git) and in Vercel's settings. If one leaks, create a new token (turso db tokens create) or a new secret and update Vercel."
          tr: "Onları sadece .env.local'da (Git yok sayar) ve Vercel ayarlarında tut. Biri sızarsa yeni bir token (turso db tokens create) ya da yeni bir secret üret ve Vercel'i güncelle."
    quiz:
      - q:
          en: "Why can the live site not use the local.db file?"
          tr: "Canlı site neden local.db dosyasını kullanamaz?"
        options:
          en: [SQLite is not allowed on the internet, Serverless servers do not keep files between requests, Vercel blocks all databases]
          tr: [SQLite internette yasak, Serverless server'lar istekler arasında dosya saklamaz, Vercel bütün veritabanlarını engeller]
        answer: 1
        why:
          en: "Each request may run on a fresh machine with no memory of earlier writes, so data must live in a hosted database such as Turso."
          tr: "Her istek, önceki yazılanları hatırlamayan yeni bir makinede çalışabilir; bu yüzden veri Turso gibi barındırılan bir veritabanında durmalı."
    sources:
      - title: Vercel, Next.js on Vercel
        url: https://vercel.com/docs/frameworks/full-stack/nextjs
      - title: Vercel, Hobby plan
        url: https://vercel.com/docs/plans/hobby
      - title: Vercel, environment variables
        url: https://vercel.com/docs/environment-variables
      - title: Turso, quickstart
        url: https://docs.turso.tech/quickstart

  - id: monitoring
    stage: monitoring
    title:
      en: "Error pages, logs and a health check"
      tr: "Hata sayfaları, log'lar ve bir sağlık kontrolü"
    minutes: 45
    needs: [deploy]
    why:
      en: "Once real people use the site you cannot see their screens. An error page shows a friendly message instead of a blank page, the error hook writes every server error to the logs, and a health check lets a free monitor tell you when the site or the database is down."
      tr: "Gerçek insanlar siteyi kullanmaya başlayınca onların ekranını göremezsin. Hata sayfası boş sayfa yerine dostça bir mesaj gösterir, error hook'u her server hatasını log'a yazar, sağlık kontrolü de site ya da veritabanı çöktüğünde ücretsiz bir izleyicinin sana haber vermesini sağlar."
    learn:
      en: |
        - `error.tsx` catches errors in a part of the app and shows a fallback; it receives `retry`, which tries to render the segment again. `global-error.tsx` is the last resort for errors in the root layout
        - `not-found.tsx` is the page for unknown addresses
        - `instrumentation.ts` with `onRequestError` runs on the server for every error Next.js catches; the error `digest` matches the short id users see
        - Writing one JSON line per error with `console.error` makes logs easy to search; on Vercel see them under the project's *Logs* (Hobby keeps them for a short time)
        - A health endpoint returns 200 only if the database answers. `await connection()` at its start makes it run on every request instead of being prerendered at build time; an uptime service (UptimeRobot and similar have free plans) calls it every few minutes and emails you on failure
        - Keep dependencies current: `npm outdated`, then update, test and deploy
      tr: |
        - `error.tsx` uygulamanın bir kısmındaki hataları yakalar ve yedek bir arayüz gösterir; segment'i yeniden çizmeyi deneyen `retry`'ı alır. `global-error.tsx` root layout'taki hatalar için son çaredir
        - `not-found.tsx` bilinmeyen adresler için sayfadır
        - `onRequestError` içeren `instrumentation.ts`, Next.js'in yakaladığı her hata için server'da çalışır; hatanın `digest`'i kullanıcıların gördüğü kısa id ile eşleşir
        - `console.error` ile hata başına bir JSON satırı yazmak log'ları aranabilir yapar; Vercel'de projenin *Logs* kısmında görürsün (Hobby onları kısa süre tutar)
        - Sağlık endpoint'i sadece veritabanı cevap verirse 200 döner. Başındaki `await connection()` onu build sırasında prerender etmek yerine her istekte çalıştırır; bir uptime servisi (UptimeRobot ve benzerlerinin ücretsiz planı var) onu birkaç dakikada bir çağırır ve bozulunca sana e-posta atar
        - Bağımlılıkları güncel tut: `npm outdated`, sonra güncelle, test et ve deploy et
    do:
      en: |
        1. Create `app/error.tsx`, `app/global-error.tsx`, `app/not-found.tsx`, `instrumentation.ts` and `app/api/health/route.ts`.
        2. Test the error hook: create a temporary file `app/api/boom/route.ts` (below), run `npm run build` and `npm run start`, open /api/boom, and look at the terminal: one JSON line with the message. Delete the file afterwards.
        3. Open an address that does not exist, like /nothing: you see your not-found page. Open /api/health: `{"status":"ok"}`.
        4. Commit and push; Vercel deploys it. Open `https://YOUR-ADDRESS/api/health` on the live site.
        5. Create a free account at an uptime service (for example uptimerobot.com), add an HTTP monitor for that health address and your email as the alert contact.
        6. Look at the live logs in the Vercel project (*Logs*) after you visit a few pages.
      tr: |
        1. `app/error.tsx`, `app/global-error.tsx`, `app/not-found.tsx`, `instrumentation.ts` ve `app/api/health/route.ts` dosyalarını oluştur.
        2. Error hook'u test et: geçici bir `app/api/boom/route.ts` dosyası oluştur (aşağıda), `npm run build` ve `npm run start` çalıştır, /api/boom adresini aç ve terminale bak: mesajlı bir JSON satırı. Sonra dosyayı sil.
        3. /nothing gibi olmayan bir adres aç: not-found sayfanı görürsün. /api/health adresini aç: `{"status":"ok"}`.
        4. Commit'le ve push et; Vercel deploy eder. Canlı sitede `https://SENIN-ADRESIN/api/health` adresini aç.
        5. Bir uptime servisinde (örneğin uptimerobot.com) ücretsiz hesap aç, o sağlık adresi için bir HTTP monitor ekle ve uyarı e-postası olarak kendi adresini ver.
        6. Birkaç sayfa gezdikten sonra Vercel projesindeki canlı log'lara (*Logs*) bak.
    code:
      - file: app/error.tsx
        lang: tsx
        text: |
          "use client";

          import { useEffect } from "react";

          export default function Error({ error, retry }: { error: unknown; retry: () => void }) {
            useEffect(() => {
              console.error(error);
            }, [error]);

            return (
              <main className="mx-auto max-w-2xl p-6">
                <h1 className="text-2xl font-bold">Something went wrong</h1>
                <p className="mt-2">We could not show this page. Please try again.</p>
                <button type="button" onClick={() => retry()} className="mt-4 rounded border px-3 py-1">
                  Try again
                </button>
              </main>
            );
          }
      - file: app/global-error.tsx
        lang: tsx
        text: |
          "use client";

          export default function GlobalError({ retry }: { error: unknown; retry: () => void }) {
            return (
              <html lang="en">
                <body>
                  <h1>Something went wrong</h1>
                  <button type="button" onClick={() => retry()}>
                    Try again
                  </button>
                </body>
              </html>
            );
          }
      - file: app/not-found.tsx
        lang: tsx
        text: |
          import Link from "next/link";

          export default function NotFound() {
            return (
              <main className="mx-auto max-w-2xl p-6">
                <h1 className="text-2xl font-bold">Page not found</h1>
                <p className="mt-2">
                  There is nothing here. <Link href="/bookmarks" className="underline">See all links</Link>
                </p>
              </main>
            );
          }
      - file: instrumentation.ts
        lang: ts
        text: |
          import type { Instrumentation } from "next";

          // Runs on the server for every error Next.js catches. Logs go to your host's log viewer.
          export const onRequestError: Instrumentation.onRequestError = async (error, request, context) => {
            console.error(
              JSON.stringify({
                level: "error",
                message: error instanceof Error ? error.message : String(error),
                digest:
                  typeof error === "object" && error !== null && "digest" in error
                    ? String(error.digest)
                    : undefined,
                path: request.path,
                method: request.method,
                routePath: context.routePath,
                routeType: context.routeType,
              }),
            );
          };
      - file: app/api/health/route.ts
        lang: ts
        text: |
          import { sql } from "drizzle-orm";
          import { connection } from "next/server";
          import { db } from "@/lib/db";

          export async function GET() {
            // Always run at request time, never during the build.
            await connection();
            try {
              await db.run(sql`select 1`);
              return Response.json({ status: "ok" });
            } catch {
              return Response.json({ status: "database unreachable" }, { status: 503 });
            }
          }
      - file: app/api/boom/route.ts
        lang: ts
        text: |
          // Temporary: delete this file after the test.
          export async function GET(request: Request) {
            void request.url;
            throw new Error("test boom");
          }
    mistakes:
      - problem:
          en: "error.tsx does not show up for errors in the root layout."
          tr: "error.tsx root layout'taki hatalar için görünmüyor."
        fix:
          en: "An error.tsx wraps the page below its layout, not the layout itself. Errors in the root layout need app/global-error.tsx, which must render its own <html> and <body>."
          tr: "error.tsx kendi layout'unun altındaki sayfayı sarar, layout'un kendisini değil. Root layout'taki hatalar için app/global-error.tsx gerekir; o kendi <html> ve <body>'sini çizmelidir."
      - problem:
          en: "Using reset in error.tsx from older tutorials."
          tr: "Eski eğitimlerdeki gibi error.tsx içinde reset kullanmak."
        fix:
          en: "In the current Next.js the prop to try again is retry; it re-fetches and re-renders the segment. reset only clears the error without fetching again."
          tr: "Güncel Next.js'te tekrar denemek için prop retry'dır; segment'i yeniden getirir ve çizer. reset sadece hatayı temizler, yeniden getirmez."
      - problem:
          en: "A health check that always says ok."
          tr: "Her zaman ok diyen bir sağlık kontrolü."
        fix:
          en: "A check that does not touch the database, or that was prerendered during the build, cannot notice an outage. Call await connection() first, run a real query like select 1, and return an error status when it fails."
          tr: "Veritabanına dokunmayan ya da build sırasında prerender edilmiş bir kontrol kesintiyi fark edemez. Önce await connection() çağır, select 1 gibi gerçek bir sorgu çalıştır ve başarısız olursa hata durumu döndür."
    quiz:
      - q:
          en: "An error happens in app/layout.tsx. Which file catches it?"
          tr: "app/layout.tsx içinde bir hata oluşuyor. Hangi dosya yakalar?"
        options:
          en: [app/error.tsx, app/global-error.tsx, app/not-found.tsx]
          tr: [app/error.tsx, app/global-error.tsx, app/not-found.tsx]
        answer: 1
        why:
          en: "error.tsx sits inside the layout. Only global-error.tsx can replace the root layout when it fails."
          tr: "error.tsx layout'un içinde durur. Root layout bozulunca onun yerine sadece global-error.tsx geçebilir."
    sources:
      - title: Next.js, error handling
        url: https://nextjs.org/docs/app/getting-started/error-handling
      - title: Next.js, instrumentation.js (onRequestError)
        url: https://nextjs.org/docs/app/api-reference/file-conventions/instrumentation
      - title: Vercel, runtime logs
        url: https://vercel.com/docs/logs/runtime

  - id: next
    stage: advanced
    title:
      en: "Where to go next"
      tr: "Bundan sonra nereye"
    minutes: 60
    needs: [monitoring]
    why:
      en: "You have a tested, monitored app on the internet. The next topics are what real projects add as they grow. Pick the one your next project needs instead of learning all of them at once."
      tr: "İnternette yayında, testli ve izlenen bir uygulaman var. Sıradaki konular, gerçek projelerin büyüdükçe eklediği şeyler. Hepsini birden öğrenmek yerine bir sonraki projenin ihtiyaç duyduğunu seç."
    learn:
      en: |
        - **Caching in depth**: `cacheLife` profiles, `revalidateTag`, and `"use cache: private"` for per-user data
        - **Instant feel**: `useOptimistic` so a new link appears before the server answers
        - **More sign-in options**: email verification, password reset and GitHub or Google sign-in in Better Auth
        - **A bigger database**: Postgres (for example a free Neon database) with Drizzle migrations instead of `push`
        - **CI**: a GitHub Actions workflow that runs lint, tests and the build on every pull request
        - **Protecting your server actions**: rate limiting and bot protection (Vercel Firewall includes some rules on the free plan)
        - **Other hosts**: a Docker image with `output: "standalone"` on any server
      tr: |
        - **Cache'i derinlemesine**: `cacheLife` profilleri, `revalidateTag` ve kullanıcıya özel veri için `"use cache: private"`
        - **Anlık his**: sunucu cevap vermeden yeni linkin görünmesi için `useOptimistic`
        - **Daha fazla giriş seçeneği**: e-posta doğrulama, parola sıfırlama ve Better Auth'ta GitHub ya da Google ile giriş
        - **Daha büyük bir veritabanı**: `push` yerine Drizzle migration'larıyla Postgres (örneğin ücretsiz bir Neon veritabanı)
        - **CI**: her pull request'te lint, test ve build çalıştıran bir GitHub Actions workflow'u
        - **Server action'larını korumak**: rate limiting ve bot koruması (Vercel Firewall'un ücretsiz planda da bazı kuralları var)
        - **Başka hosting'ler**: herhangi bir server'da `output: "standalone"` ile bir Docker image'ı
    do:
      en: |
        1. Pick one topic from the list and add it to the bookmarks app. A good first one: allow editing a bookmark (a new action, a form, `updateTag`, a test).
        2. Read the Next.js upgrade guides when a new major version comes out: `npx @next/codemod@canary upgrade latest` does most of the work, then run your tests.
        3. Skim the Next.js docs site, the Caching and Revalidating pages first, once a few months from now: the framework moves quickly.
      tr: |
        1. Listeden bir konu seç ve bookmarks uygulamasına ekle. İyi bir ilk seçim: yer imi düzenlemeye izin vermek (yeni bir action, bir form, `updateTag`, bir test).
        2. Yeni bir major sürüm çıkınca Next.js upgrade rehberlerini oku: `npx @next/codemod@canary upgrade latest` işin çoğunu yapar, sonra testlerini çalıştır.
        3. Birkaç ay sonra Next.js dokümantasyonuna, önce Caching ve Revalidating sayfalarına bir kez daha göz at: framework hızlı ilerliyor.
    mistakes:
      - problem:
          en: "Learning every topic before building anything."
          tr: "Bir şey yapmadan önce her konuyu öğrenmeye çalışmak."
        fix:
          en: "Build a small feature with one new idea at a time. Each project teaches more than a list of topics."
          tr: "Her seferinde tek bir yeni fikirle küçük bir özellik yap. Her proje bir konu listesinden daha çok öğretir."
      - problem:
          en: "Copying Next.js code from articles written for version 13 or 14."
          tr: "Next.js 13 ya da 14 için yazılmış makalelerden kod kopyalamak."
        fix:
          en: "Caching, params, middleware and error.tsx changed a lot. Check the date and the Next.js version, and prefer nextjs.org/docs, which matches the current version."
          tr: "Caching, params, middleware ve error.tsx çok değişti. Tarihe ve Next.js sürümüne bak ve güncel sürümle uyumlu olan nextjs.org/docs'u tercih et."
    quiz:
      - q:
          en: "A tutorial reads params.slug without await and uses middleware.ts. What do you do?"
          tr: "Bir eğitim params.slug'ı await etmeden okuyor ve middleware.ts kullanıyor. Ne yaparsın?"
        options:
          en: [Copy it exactly, Check the Next.js version it was written for and use the current docs, Downgrade Node.js]
          tr: [Aynen kopyalarım, Hangi Next.js sürümü için yazıldığına bakar ve güncel dokümanı kullanırım, Node.js'i düşürürüm]
        answer: 1
        why:
          en: "Both are from older versions: Next.js 16 needs await params and renamed middleware to proxy."
