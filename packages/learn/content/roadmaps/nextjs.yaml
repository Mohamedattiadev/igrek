        text: |
          "use client";

          import { useActionState } from "react";
          import type { AuthState } from "@/app/auth-actions";

          type Props = {
            action: (prev: AuthState, form: FormData) => Promise<AuthState>;
            withName?: boolean;
            button: string;
          };

          export default function AuthForm({ action, withName = false, button }: Props) {
            const [state, formAction, pending] = useActionState<AuthState, FormData>(action, null);

            return (
              <form action={formAction} className="mt-4 space-y-4">
                {withName && (
                  <label className="block">
                    <span className="font-semibold">Name</span>
                    <input name="name" required className="mt-1 w-full rounded border p-2" />
                  </label>
                )}
                <label className="block">
                  <span className="font-semibold">Email</span>
                  <input name="email" type="email" required autoComplete="email" className="mt-1 w-full rounded border p-2" />
                </label>
                <label className="block">
                  <span className="font-semibold">Password (at least 8 characters)</span>
                  <input
                    name="password"
                    type="password"
                    required
                    minLength={8}
                    autoComplete={withName ? "new-password" : "current-password"}
                    className="mt-1 w-full rounded border p-2"
                  />
                </label>
                {state?.error && <p role="alert" className="text-sm text-red-600">{state.error}</p>}
                <button type="submit" disabled={pending} className="rounded bg-black px-4 py-2 text-white disabled:opacity-50">
                  {pending ? "Please wait..." : button}
                </button>
              </form>
            );
          }
