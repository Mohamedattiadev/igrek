      - file: tests/test_login.py
        lang: python
        text: |
          from fastapi.testclient import TestClient

          USER = {"email": "ada@example.com", "password": "correct horse battery"}


          def login(client: TestClient, password: str = USER["password"]):
              # The login form is form data (not JSON) and its email field is called "username".
              return client.post(
                  "/auth/token", data={"username": USER["email"], "password": password}
              )


          def test_login_gives_a_token_that_opens_me(client: TestClient):
              client.post("/auth/register", json=USER)
              response = login(client)
              assert response.status_code == 200
              token = response.json()["access_token"]

              me = client.get("/auth/me", headers={"Authorization": f"Bearer {token}"})
              assert me.status_code == 200
              assert me.json()["email"] == USER["email"]


          def test_wrong_password_is_401(client: TestClient):
              client.post("/auth/register", json=USER)
              assert login(client, "wrong password").status_code == 401


          def test_unknown_email_is_401(client: TestClient):
              assert login(client).status_code == 401


          def test_me_without_a_token_is_401(client: TestClient):
              assert client.get("/auth/me").status_code == 401


          def test_a_forged_token_is_401(client: TestClient):
              response = client.get("/auth/me", headers={"Authorization": "Bearer not.a.token"})
              assert response.status_code == 401
    mistakes:
      - problem:
          en: "The secret key is written in the code or committed to Git."
          tr: "Gizli anahtar kodun içine yazılmış ya da Git'e commit edilmiş."
        fix:
          en: "Keep it in `.env` (ignored by Git) or in the host's environment settings. If it was ever pushed, make a new one: everyone who saw the old one can forge tokens."
          tr: "Onu `.env` dosyasında (Git yok sayar) ya da barındırıcının ortam ayarlarında tut. Bir kez bile push edildiyse yenisini üret: eskisini gören herkes token taklit edebilir."
      - problem:
          en: "`POST /auth/token` answers 422 when you send JSON."
          tr: "`POST /auth/token`, JSON gönderince 422 veriyor."
        fix:
          en: "The OAuth2 login is a **form** (`username` and `password` fields), not JSON. Use the Authorize button in `/docs`, or send form data. The `username` field carries the email."
          tr: "OAuth2 girişi JSON değil bir **form**dur (`username` ve `password` alanları). `/docs`'taki Authorize düğmesini kullan ya da form verisi gönder. `username` alanı e-postayı taşır."
      - problem:
          en: "`jwt.decode` fails with \"Subject must be a string\", or asks for `algorithms`."
          tr: "`jwt.decode` \"Subject must be a string\" hatası veriyor ya da `algorithms` istiyor."
        fix:
          en: "Store the id as text (`str(user_id)`) in `sub` (a number there makes decoding fail), and always pass `algorithms=[\"HS256\"]` when you decode. Accepting any algorithm is a known attack."
          tr: "`sub` içine id'yi metin olarak (`str(user_id)`) koy (sayı olursa decode başarısız olur) ve decode ederken her zaman `algorithms=[\"HS256\"]` ver. Her algoritmayı kabul etmek bilinen bir saldırıdır."
    quiz:
      - q:
          en: "Why can a client not simply change the user id inside its token?"
          tr: "İstemci token'ın içindeki kullanıcı id'sini neden basitçe değiştiremez?"
        options:
          en:
            - "The token is encrypted with the password"
            - "FastAPI stores all tokens in the database and compares them"
            - "The token is signed with the secret key, so any change makes the signature invalid"
          tr:
            - "Token şifre ile şifrelenmiştir"
            - "FastAPI bütün token'ları veritabanında saklayıp karşılaştırır"
            - "Token gizli anahtarla imzalıdır; herhangi bir değişiklik imzayı geçersiz yapar"
        answer: 2
        why:
          en: "A JWT is signed, not hidden: anyone can read it, but only the holder of the secret key can make a valid one."
          tr: "JWT imzalıdır, gizli değildir: herkes okuyabilir ama geçerli birini sadece gizli anahtarın sahibi üretebilir."
