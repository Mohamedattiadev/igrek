      - file: tests/test_notes.py
        lang: python
        text: |
          from fastapi.testclient import TestClient


          def make_note(client: TestClient, auth: dict, **fields) -> dict:
              body = {"title": "Buy milk", **fields}
              response = client.post("/notes", json=body, headers=auth)
              assert response.status_code == 201
              return response.json()


          def test_notes_need_a_token(client: TestClient):
              assert client.get("/notes").status_code == 401
              assert client.post("/notes", json={"title": "x"}).status_code == 401


          def test_create_and_read_note(client: TestClient, auth: dict):
              created = make_note(client, auth, content="2 liters")
              assert created["id"] == 1
              assert created["done"] is False
              assert "owner_id" not in created

              response = client.get(f"/notes/{created['id']}", headers=auth)
              assert response.status_code == 200
              assert response.json()["content"] == "2 liters"


          def test_empty_title_is_rejected(client: TestClient, auth: dict):
              response = client.post("/notes", json={"title": ""}, headers=auth)
              assert response.status_code == 422


          def test_missing_note_is_404(client: TestClient, auth: dict):
              assert client.get("/notes/999", headers=auth).status_code == 404


          def test_filter_and_search(client: TestClient, auth: dict):
              make_note(client, auth, title="Buy milk", done=True)
              make_note(client, auth, title="Learn FastAPI")

              assert len(client.get("/notes", headers=auth).json()) == 2
              done = client.get("/notes", params={"done": True}, headers=auth).json()
              assert len(done) == 1
              found = client.get("/notes", params={"q": "fast"}, headers=auth).json()
              assert [n["title"] for n in found] == ["Learn FastAPI"]


          def test_limit_is_capped(client: TestClient, auth: dict):
              response = client.get("/notes", params={"limit": 1000}, headers=auth)
              assert response.status_code == 422


          def test_patch_changes_only_what_is_sent(client: TestClient, auth: dict):
              note = make_note(client, auth, content="2 liters")
              response = client.patch(f"/notes/{note['id']}", json={"done": True}, headers=auth)
              assert response.status_code == 200
              assert response.json()["done"] is True
              assert response.json()["content"] == "2 liters"


          def test_delete_note(client: TestClient, auth: dict):
              note = make_note(client, auth)
              assert client.delete(f"/notes/{note['id']}", headers=auth).status_code == 204
              assert client.get(f"/notes/{note['id']}", headers=auth).status_code == 404


          def test_users_cannot_see_each_others_notes(client: TestClient, auth: dict, sign_up):
              note = make_note(client, auth)
              grace = sign_up("grace@example.com")

              assert client.get("/notes", headers=grace).json() == []
              assert client.get(f"/notes/{note['id']}", headers=grace).status_code == 404
              assert client.delete(f"/notes/{note['id']}", headers=grace).status_code == 404
              # Ada still has her note.
              assert client.get(f"/notes/{note['id']}", headers=auth).status_code == 200


          def test_cors_allows_only_the_listed_origin(client: TestClient):
              asked = {
                  "Access-Control-Request-Method": "GET",
                  "Access-Control-Request-Headers": "authorization",
              }
              good = client.options("/notes", headers={"Origin": "http://localhost:5173", **asked})
              assert good.headers["access-control-allow-origin"] == "http://localhost:5173"

              bad = client.options("/notes", headers={"Origin": "https://evil.example", **asked})
              assert "access-control-allow-origin" not in bad.headers
