  - id: private-notes
    stage: security
    title:
      en: "Make notes private and set CORS"
      tr: "Notları özel yapma ve CORS ayarı"
    minutes: 45
    needs: [login-token]
    why:
      en: "Users exist now, but every user still sees every note. Each note must belong to one user and every endpoint must check that. And if a web page on another address (your future frontend) calls the API, the browser blocks it unless the API allows that address."
      tr: "Artık kullanıcılar var ama her kullanıcı hâlâ her notu görüyor. Her not bir kullanıcıya ait olmalı ve her endpoint bunu kontrol etmeli. Ayrıca başka bir adresteki bir web sayfası (ileride yazacağın frontend) API'yi çağırırsa, API o adrese izin vermedikçe tarayıcı engeller."
    learn:
      en: |
        - A **foreign key** (`owner_id`) links each note to its user
        - `CurrentUser` is a dependency: any endpoint that lists it is locked, and it gives the endpoint the logged-in user
        - Why another user's note answers 404 and not 403: the caller should not learn that the id exists
        - What **CORS** is: a browser rule that blocks a page from calling another address unless that address says it is allowed. It protects browsers only, not your API from other programs
      tr: |
        - **Foreign key** (`owner_id`) her notu kullanıcısına bağlar
        - `CurrentUser` bir dependency'dir: onu yazan her endpoint kilitlenir ve endpoint'e giriş yapmış kullanıcıyı verir
        - Başka kullanıcının notunun neden 403 değil 404 döndürdüğü: çağıran id'nin var olduğunu öğrenmemeli
        - **CORS**'un ne olduğu: bir sayfanın başka bir adresi çağırmasını, o adres izin verdiğini söylemedikçe engelleyen tarayıcı kuralı. Sadece tarayıcıları korur, API'ni başka programlardan korumaz
    do:
      en: |
        1. Your old `notes.db` has notes without an owner, and the new column cannot be added to an existing table by `create_all`. During development, **delete the file `notes.db`**. (A real app would use a migration tool, see the last step.)
        2. Replace `app/models.py`, `app/routers/notes.py` and `app/main.py` with the code below.
        3. Add a line to `.env` so your future frontend may call the API (it is a JSON list): `CORS_ORIGINS=["http://localhost:5173"]`.
        4. Replace `tests/conftest.py` and `tests/test_notes.py`. They now log in before calling notes, and they test two users and CORS.
        5. Run `uv run pytest`. You should see `19 passed`.
        6. Start the server. `GET /notes` without logging in answers 401. Register and log in two users (use **Authorize**, log out between them) and check that each sees only their own notes.
        7. Commit: `git add .` and `git commit -m "Private notes and CORS"`.
      tr: |
        1. Eski `notes.db` dosyanda sahibi olmayan notlar var ve `create_all` yeni sütunu var olan tabloya ekleyemez. Geliştirme sırasında **`notes.db` dosyasını sil**. (Gerçek bir uygulama migration aracı kullanır, son adıma bak.)
        2. `app/models.py`, `app/routers/notes.py` ve `app/main.py` dosyalarını aşağıdaki kodla değiştir.
        3. Gelecekteki frontend'in API'yi çağırabilmesi için `.env` dosyasına bir satır ekle (bu bir JSON listesi): `CORS_ORIGINS=["http://localhost:5173"]`.
        4. `tests/conftest.py` ve `tests/test_notes.py` dosyalarını değiştir. Artık notları çağırmadan önce giriş yaparlar; iki kullanıcıyı ve CORS'u da test ederler.
        5. `uv run pytest` çalıştır. `19 passed` görmelisin.
        6. Sunucuyu başlat. Giriş yapmadan `GET /notes` 401 verir. İki kullanıcı kaydet ve giriş yap (**Authorize** ile, aralarda çıkış yap) ve her birinin sadece kendi notlarını gördüğünü kontrol et.
        7. Kaydet: `git add .` ve `git commit -m "Private notes and CORS"`.
    code:
      - file: app/models.py
        lang: python
        text: |
          from pydantic import EmailStr
          from sqlmodel import Field, SQLModel


          class User(SQLModel, table=True):
              id: int | None = Field(default=None, primary_key=True)
              email: str = Field(unique=True, index=True, max_length=254)
              hashed_password: str


          class UserCreate(SQLModel):
              email: EmailStr
              password: str = Field(min_length=8, max_length=128)


          class UserPublic(SQLModel):
              id: int
              email: str


          class Token(SQLModel):
              access_token: str
              token_type: str = "bearer"


          class NoteBase(SQLModel):
              title: str = Field(min_length=1, max_length=100)
              content: str = Field(default="", max_length=2000)
              done: bool = False


          class Note(NoteBase, table=True):
              id: int | None = Field(default=None, primary_key=True)
              owner_id: int = Field(foreign_key="user.id", index=True)


          class NoteCreate(NoteBase):
              pass


          class NoteUpdate(SQLModel):
              title: str | None = Field(default=None, min_length=1, max_length=100)
              content: str | None = Field(default=None, max_length=2000)
              done: bool | None = None


          class NotePublic(NoteBase):
              id: int
      - file: app/routers/notes.py
        lang: python
        text: |
          from typing import Annotated

          from fastapi import APIRouter, HTTPException, Query, status
          from sqlmodel import col, select

          from ..db import SessionDep
          from ..models import Note, NoteCreate, NotePublic, NoteUpdate, User
          from ..security import CurrentUser

          router = APIRouter(prefix="/notes", tags=["notes"])


          def get_own_note(session: SessionDep, note_id: int, user: User) -> Note:
              note = session.get(Note, note_id)
              # Someone else's note gets the same 404 as a missing one, so ids are not revealed.
              if note is None or note.owner_id != user.id:
                  raise HTTPException(status_code=404, detail="Note not found")
              return note


          @router.post("", status_code=status.HTTP_201_CREATED)
          def create_note(note: NoteCreate, session: SessionDep, user: CurrentUser) -> NotePublic:
              db_note = Note.model_validate(note, update={"owner_id": user.id})
              session.add(db_note)
              session.commit()
              session.refresh(db_note)
              return db_note


          @router.get("")
          def list_notes(
              session: SessionDep,
              user: CurrentUser,
              done: bool | None = None,
              q: Annotated[str | None, Query(max_length=50)] = None,
              offset: Annotated[int, Query(ge=0)] = 0,
              limit: Annotated[int, Query(ge=1, le=100)] = 20,
          ) -> list[NotePublic]:
              statement = select(Note).where(Note.owner_id == user.id)
              if done is not None:
                  statement = statement.where(Note.done == done)
              if q:
                  statement = statement.where(col(Note.title).contains(q))
              statement = statement.order_by(col(Note.id)).offset(offset).limit(limit)
              return list(session.exec(statement).all())


          @router.get("/{note_id}")
          def read_note(note_id: int, session: SessionDep, user: CurrentUser) -> NotePublic:
              return get_own_note(session, note_id, user)


          @router.patch("/{note_id}")
          def update_note(
              note_id: int, changes: NoteUpdate, session: SessionDep, user: CurrentUser
          ) -> NotePublic:
              note = get_own_note(session, note_id, user)
              note.sqlmodel_update(changes.model_dump(exclude_unset=True, exclude_none=True))
              session.add(note)
              session.commit()
              session.refresh(note)
              return note


          @router.delete("/{note_id}", status_code=status.HTTP_204_NO_CONTENT)
          def delete_note(note_id: int, session: SessionDep, user: CurrentUser) -> None:
              note = get_own_note(session, note_id, user)
              session.delete(note)
              session.commit()
      - file: app/main.py
        lang: python
        text: |
          from contextlib import asynccontextmanager

          from fastapi import FastAPI
          from fastapi.middleware.cors import CORSMiddleware

          from .db import create_db_and_tables
          from .routers import auth, notes
          from .settings import get_settings


          @asynccontextmanager
          async def lifespan(app: FastAPI):
              create_db_and_tables()  # runs once, before the first request
              yield


          app = FastAPI(title="Notes API", lifespan=lifespan)

          settings = get_settings()
          if settings.cors_origins:
              app.add_middleware(
                  CORSMiddleware,
                  allow_origins=settings.cors_origins,  # the real addresses of your frontend
                  allow_methods=["GET", "POST", "PATCH", "DELETE"],
                  allow_headers=["Authorization", "Content-Type"],
              )

          app.include_router(auth.router)
          app.include_router(notes.router)


          @app.get("/")
          def root():
              return {"message": "Hello, notes"}
