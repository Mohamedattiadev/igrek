  - id: fast-enough
    stage: performance
    title:
      en: "Measure, compress and keep it fast"
      tr: "Ölç, sıkıştır ve hızlı tut"
    minutes: 30
    needs: [private-notes]
    why:
      en: "You cannot make something faster that you cannot measure. First you make the time of every request visible. Then you do the few cheap things that help almost every API: compress big answers and never return unlimited lists."
      tr: "Ölçemediğin şeyi hızlandıramazsın. Önce her isteğin süresini görünür yaparsın. Sonra neredeyse her API'ye yarayan birkaç ucuz şeyi yaparsın: büyük cevapları sıkıştırır ve asla sınırsız liste döndürmezsin."
    learn:
      en: |
        - What **middleware** is: code that wraps every request and response
        - How to read the `X-Process-Time` header you add, and in the browser DevTools (*Network* tab)
        - Why plain `def` endpoints are right for a synchronous database like SQLite: FastAPI runs them in a thread pool, so one slow query does not stop the others
        - Why `async def` is dangerous when it calls blocking code (a normal database call, `requests`, `time.sleep`): it freezes the whole server
        - What **gzip** does to a big JSON list, and why the `limit` cap and the `owner_id` index already do most of the work
      tr: |
        - **Middleware**'in ne olduğu: her isteği ve cevabı saran kod
        - Eklediğin `X-Process-Time` header'ını ve tarayıcı DevTools'unda (*Network* sekmesi) nasıl okuyacağın
        - SQLite gibi senkron bir veritabanı için düz `def` endpoint'lerin neden doğru olduğu: FastAPI onları bir thread havuzunda çalıştırır, yani yavaş bir sorgu diğerlerini durdurmaz
        - `async def` bloklayan kodu (normal bir veritabanı çağrısı, `requests`, `time.sleep`) çağırınca neden tehlikeli olduğu: tüm sunucuyu dondurur
        - **gzip**'in büyük bir JSON listesine ne yaptığı ve `limit` sınırı ile `owner_id` index'inin işin çoğunu zaten neden yaptığı
    do:
      en: |
        1. Replace `app/main.py` with the code below. It adds gzip compression for answers bigger than 500 bytes and the timing header.
        2. Add `tests/test_speed.py` and run `uv run pytest`. You should see `20 passed`.
        3. Start the server and call any endpoint with `curl -i http://127.0.0.1:8000/` (or look at the response headers in the browser DevTools, *Network* tab). Find the `x-process-time` line. A simple call should take a few milliseconds.
        4. Look at `app/models.py`: `owner_id` has `index=True`, so listing the notes of one user does not read the whole table. Keep this in mind for every column you filter by.
        5. Commit: `git add .` and `git commit -m "Timing and gzip"`.
      tr: |
        1. `app/main.py` dosyasını aşağıdaki kodla değiştir. 500 baytı geçen cevaplar için gzip sıkıştırma ve süre header'ını ekler.
        2. `tests/test_speed.py` dosyasını ekle ve `uv run pytest` çalıştır. `20 passed` görmelisin.
        3. Sunucuyu başlat ve herhangi bir endpoint'i `curl -i http://127.0.0.1:8000/` ile çağır (ya da tarayıcı DevTools'unda, *Network* sekmesinde cevap header'larına bak). `x-process-time` satırını bul. Basit bir çağrı birkaç milisaniye sürmeli.
        4. `app/models.py` dosyasına bak: `owner_id` alanında `index=True` var, yani bir kullanıcının notlarını listelemek tüm tabloyu okumaz. Süzdüğün her sütun için bunu aklında tut.
        5. Kaydet: `git add .` ve `git commit -m "Timing and gzip"`.
    code:
      - file: app/main.py
        lang: python
        text: |
          import time
          from contextlib import asynccontextmanager

          from fastapi import FastAPI, Request
          from fastapi.middleware.cors import CORSMiddleware
          from fastapi.middleware.gzip import GZipMiddleware

          from .db import create_db_and_tables
          from .routers import auth, notes
          from .settings import get_settings


          @asynccontextmanager
          async def lifespan(app: FastAPI):
              create_db_and_tables()  # runs once, before the first request
              yield


          app = FastAPI(title="Notes API", lifespan=lifespan)

          settings = get_settings()
          if settings.cors_origins:
              app.add_middleware(
                  CORSMiddleware,
                  allow_origins=settings.cors_origins,  # the real addresses of your frontend
                  allow_methods=["GET", "POST", "PATCH", "DELETE"],
                  allow_headers=["Authorization", "Content-Type"],
              )
          # Compress responses bigger than 500 bytes when the client accepts it.
          app.add_middleware(GZipMiddleware, minimum_size=500)


          @app.middleware("http")
          async def add_process_time(request: Request, call_next):
              start = time.perf_counter()
              response = await call_next(request)
              response.headers["X-Process-Time"] = f"{(time.perf_counter() - start) * 1000:.1f}ms"
              return response


          app.include_router(auth.router)
          app.include_router(notes.router)


          @app.get("/")
          def root():
              return {"message": "Hello, notes"}
      - file: tests/test_speed.py
        lang: python
        text: |
          from fastapi.testclient import TestClient
          from sqlmodel import Session

          from app.models import Note, User
          from app.security import create_access_token


          def test_big_lists_are_compressed_and_timed(client: TestClient, session: Session):
              session.add(User(email="bulk@example.com", hashed_password="x"))
              session.commit()
              session.add_all(
                  Note(title=f"Note number {i}", content="some text " * 5, owner_id=1)
                  for i in range(100)
              )
              session.commit()

              # Make a token directly, so the test does not need the password.
              headers = {"Authorization": f"Bearer {create_access_token(1)}"}
              response = client.get("/notes?limit=100", headers=headers)

              assert response.status_code == 200
              assert len(response.json()) == 100
              assert response.headers["content-encoding"] == "gzip"
              assert response.headers["x-process-time"].endswith("ms")
    mistakes:
      - problem:
          en: "Writing `async def` for every endpoint, and then calling the database inside it."
          tr: "Her endpoint'i `async def` yapıp içinde veritabanını çağırmak."
        fix:
          en: "Our database calls block, so keep these endpoints as plain `def`. Use `async def` only when you `await` an async library."
          tr: "Veritabanı çağrılarımız bloklar; bu yüzden bu endpoint'leri düz `def` bırak. `async def`'i sadece async bir kütüphaneyi `await` ederken kullan."
      - problem:
          en: "Optimizing by guessing."
          tr: "Tahminle optimizasyon yapmak."
        fix:
          en: "Measure first (the timing header, the logs, the DevTools). Fix the slowest thing, measure again. Most notes APIs are fast enough until real traffic shows otherwise."
          tr: "Önce ölç (süre header'ı, loglar, DevTools). En yavaş şeyi düzelt, tekrar ölç. Gerçek trafik aksini göstermedikçe çoğu not API'si yeterince hızlıdır."
    quiz:
      - q:
          en: "An `async def` endpoint calls `time.sleep(5)`. What happens?"
          tr: "Bir `async def` endpoint `time.sleep(5)` çağırıyor. Ne olur?"
        options:
          en:
            - "Only that request waits"
            - "FastAPI moves it to a thread by itself"
            - "The whole server waits for 5 seconds and other users are blocked"
          tr:
            - "Sadece o istek bekler"
            - "FastAPI onu kendiliğinden bir thread'e taşır"
            - "Tüm sunucu 5 saniye bekler, diğer kullanıcılar bloklanır"
        answer: 2
        why:
          en: "An async endpoint runs on the single event loop; blocking code stops it. Plain `def` endpoints run in threads and do not have this problem."
          tr: "Async endpoint tek olay döngüsünde çalışır; bloklayan kod onu durdurur. Düz `def` endpoint'ler thread'lerde çalışır ve bu sorun olmaz."
    sources:
      - title: Concurrency and async / await
        url: https://fastapi.tiangolo.com/async/
      - title: Advanced middleware (GZipMiddleware)
        url: https://fastapi.tiangolo.com/advanced/middleware/
      - title: Middleware
        url: https://fastapi.tiangolo.com/tutorial/middleware/

  - id: docker
    stage: packaging
    title:
      en: "Package the API in a Docker container"
      tr: "API'yi Docker container'ına paketleme"
    minutes: 45
    needs: [fast-enough]
    why:
      en: "\"It works on my computer\" is not enough for a server. A Docker image holds your code, Python and every package in one box that runs the same everywhere: your laptop, a friend's computer and the host you deploy to."
      tr: "Bir sunucu için \"bende çalışıyor\" yetmez. Docker image'ı kodunu, Python'u ve bütün paketleri tek bir kutuda tutar; o kutu her yerde aynı çalışır: dizüstü bilgisayarında, arkadaşının bilgisayarında ve deploy edeceğin sunucuda."
    learn:
      en: |
        - **Image** and **container**: the image is the recipe and the files, a container is one running copy
        - What each line of the `Dockerfile` does, and why `requirements.txt` is copied and installed before the code (Docker reuses unchanged layers, so rebuilds are fast)
        - `fastapi run` is the production command: no auto-reload, and it listens on `0.0.0.0` so it can be reached from outside the container
        - Why secrets are passed with `-e` at run time and never built into the image
        - Why the database file lives in `/data`, a folder you can keep with a **volume**
      tr: |
        - **Image** ve **container**: image tarif ve dosyalardır, container çalışan bir kopyasıdır
        - `Dockerfile`'ın her satırının ne yaptığı ve `requirements.txt`'in neden koddan önce kopyalanıp kurulduğu (Docker değişmeyen katmanları yeniden kullanır, yani yeniden build hızlıdır)
        - `fastapi run` production komutudur: auto-reload yok ve `0.0.0.0` üzerinde dinler, böylece container'ın dışından erişilebilir
        - Gizli bilgilerin neden çalıştırırken `-e` ile verildiği ve image'ın içine asla konmadığı
        - Veritabanı dosyasının neden `/data` içinde durduğu; bu klasörü bir **volume** ile saklayabilirsin
    do:
      en: |
        1. Install **Docker Desktop** (docs.docker.com/get-started/get-docker/) and start it. Check with `docker --version`.
        2. Export the exact package versions that uv locked into a `requirements.txt`, with the first command below. Run it again whenever you add a package.
        3. Create `Dockerfile` and `.dockerignore` in the project folder. `.dockerignore` keeps your `.env`, the database and the tests out of the image.
        4. Build the image: `docker build -t notes-api .`. The first build downloads Python and takes a few minutes.
        5. Run it with the last command below (put your own long text from `.env` in place of the example). Open http://localhost:10000/docs. Register, log in and create a note.
        6. Stop it with Ctrl+C, run it again with the same command: your user is still there, because the volume `notes-data` kept `/data`.
        7. Commit: `git add .` and `git commit -m "Docker image"`.
      tr: |
        1. **Docker Desktop**'ı kur (docs.docker.com/get-started/get-docker/) ve başlat. `docker --version` ile kontrol et.
        2. uv'nin kilitlediği tam paket sürümlerini ilk komutla bir `requirements.txt` dosyasına aktar. Paket eklediğinde tekrar çalıştır.
        3. Proje klasöründe `Dockerfile` ve `.dockerignore` dosyalarını oluştur. `.dockerignore`, `.env`'ini, veritabanını ve testleri image'ın dışında tutar.
        4. Image'ı build et: `docker build -t notes-api .`. İlk build Python'u indirir ve birkaç dakika sürer.
        5. Son komutla çalıştır (örnekteki metnin yerine `.env` içindeki kendi uzun metnini koy). http://localhost:10000/docs adresini aç. Kayıt ol, giriş yap ve bir not oluştur.
        6. Ctrl+C ile durdur ve aynı komutla tekrar çalıştır: kullanıcın hâlâ orada, çünkü `notes-data` volume'u `/data`'yı sakladı.
        7. Kaydet: `git add .` ve `git commit -m "Docker image"`.
    code:
      - file: terminal
        lang: sh
        text: |
          uv export --format requirements-txt --no-dev --no-emit-project --output-file requirements.txt
      - file: Dockerfile
        lang: dockerfile
        text: |
          FROM python:3.14-slim

          # Run as a normal user, not as root. /data is where the SQLite file lives.
          RUN useradd --create-home appuser && mkdir /data && chown appuser /data

          WORKDIR /code
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY app ./app

          ENV DATABASE_URL=sqlite:////data/notes.db
          USER appuser
          EXPOSE 10000
          CMD ["fastapi", "run", "app/main.py", "--port", "10000", "--proxy-headers"]
      - file: .dockerignore
        lang: text
        text: |
          .git
          .venv
          .env
          *.db
          __pycache__
          .pytest_cache
          tests
      - file: terminal
        lang: sh
        text: |
          docker build -t notes-api .
          docker run --rm -p 10000:10000 -e SECRET_KEY=paste-your-long-random-text-here -v notes-data:/data notes-api
    mistakes:
      - problem:
          en: "The container starts but http://localhost:10000 does not answer."
          tr: "Container başlıyor ama http://localhost:10000 cevap vermiyor."
        fix:
          en: "Use `fastapi run` (it listens on 0.0.0.0), not `fastapi dev` (only 127.0.0.1, unreachable from outside the container), and publish the port with `-p 10000:10000`."
          tr: "`fastapi dev` değil `fastapi run` kullan (0.0.0.0'ı dinler; `dev` sadece 127.0.0.1'i dinler, container dışından erişilemez) ve portu `-p 10000:10000` ile yayınla."
      - problem:
          en: "The new package is missing in the container (ModuleNotFoundError)."
          tr: "Yeni paket container'da yok (ModuleNotFoundError)."
        fix:
          en: "The image installs from `requirements.txt`, not from `pyproject.toml`. Run the `uv export` command again after `uv add`, then rebuild."
          tr: "Image `pyproject.toml`'dan değil `requirements.txt`'ten kurar. `uv add`'den sonra `uv export` komutunu tekrar çalıştır, sonra yeniden build et."
      - problem:
          en: "`.env`, `notes.db` or the `.venv` folder ends up inside the image."
          tr: "`.env`, `notes.db` ya da `.venv` klasörü image'ın içine giriyor."
        fix:
          en: "List them in `.dockerignore`. An image is easy to share, and a secret inside it is shared with it."
          tr: "Hepsini `.dockerignore`'a yaz. Image'ı paylaşmak kolaydır ve içindeki gizli bilgi de onunla paylaşılır."
    quiz:
      - q:
          en: "Why is `requirements.txt` copied and installed before the `app` folder in the Dockerfile?"
          tr: "Dockerfile'da `requirements.txt` neden `app` klasöründen önce kopyalanıp kuruluyor?"
        options:
          en:
            - "Python needs the packages before it can read any file"
            - "Docker reuses the installed packages when only your code changed, so rebuilds are fast"
            - "It is required by the fastapi command"
          tr:
            - "Python herhangi bir dosyayı okumadan önce paketlere ihtiyaç duyar"
            - "Sadece kodun değiştiğinde Docker kurulu paketleri yeniden kullanır, yani build hızlı olur"
            - "fastapi komutu bunu gerektirir"
        answer: 1
        why:
          en: "Each Dockerfile line is a cached layer. The package layer only changes when `requirements.txt` changes, and your code changes much more often."
          tr: "Dockerfile'ın her satırı önbelleğe alınan bir katmandır. Paket katmanı sadece `requirements.txt` değişince değişir; kodun ise çok daha sık değişir."
    sources:
      - title: FastAPI in containers - Docker
        url: https://fastapi.tiangolo.com/deployment/docker/
      - title: Get Docker
        url: https://docs.docker.com/get-started/get-docker/
      - title: Dockerfile reference
        url: https://docs.docker.com/reference/dockerfile/

  - id: render
    stage: deploy
    title:
      en: "Put the API on the internet for free (Render)"
      tr: "API'yi ücretsiz internete koyma (Render)"
    minutes: 50
    needs: [docker]
    why:
      en: "An API on your laptop helps nobody else. Render builds your Dockerfile from GitHub and gives it a public https address, and it has a free web service, so you can learn how deploying works without paying."
      tr: "Dizüstü bilgisayarındaki bir API başkasına yaramaz. Render, Dockerfile'ını GitHub'dan build eder ve ona herkese açık bir https adresi verir; ücretsiz bir web service seçeneği de olduğundan para vermeden deploy etmeyi öğrenebilirsin."
    learn:
      en: |
        - What **deploying** is: running your container on a computer that is always on and reachable
        - What GitHub is for here: Render reads your repository, and every `git push` can deploy a new version
        - **Environment variables** on the host: `SECRET_KEY` is set in Render's dashboard, never in the repository
        - What the **free** plan means: the service sleeps after 15 minutes without requests and the first request wakes it in about a minute; and its files are temporary, so the SQLite database is wiped on every restart, redeploy or sleep
      tr: |
        - **Deploy**'un ne olduğu: container'ını hep açık ve erişilebilir bir bilgisayarda çalıştırmak
        - GitHub'ın burada ne işe yaradığı: Render repository'ni okur ve her `git push` yeni bir sürümü deploy edebilir
        - Barındırıcıdaki **ortam değişkenleri**: `SECRET_KEY` Render'ın panelinde ayarlanır, asla repository'de durmaz
        - **Ücretsiz** planın anlamı: servis 15 dakika istek almazsa uyur ve ilk istek onu yaklaşık bir dakikada uyandırır; ayrıca dosyaları geçicidir, yani SQLite veritabanı her yeniden başlatmada, yeniden deploy'da ve uykuda silinir
    do:
      en: |
        1. Make a free account on **github.com**. Create a new repository called `notes-api` (private is fine) and do not add a README there.
        2. Push your project with the commands below (replace `YOUR-NAME`). `git status` should say the working tree is clean, because you committed after each step. Open the repository on GitHub and check that there is **no `.env` file** in it.
        3. Make a free account on **render.com** (you can sign in with GitHub) and allow it to read your `notes-api` repository.
        4. In the Render dashboard click *New → Web Service* and pick your repository.
        5. Choose **Docker** as the language and **Free** as the instance type. Render finds the `Dockerfile` by itself.
        6. Under *Environment Variables* add `SECRET_KEY` with your long random text. Use a **new** one for the internet, not the one in your `.env`. If you have a frontend, also add `CORS_ORIGINS` with a JSON list of its addresses.
        7. Click the deploy button and watch the logs. The first build takes a few minutes. When you see `Application startup complete`, open the address Render shows (`https://notes-api-....onrender.com/docs`).
        8. Register, log in and create a note on your live API. Wait 20 minutes, open the address again and see the one-minute wake-up. Notice that your user and notes are gone: free services have temporary files.
        9. If Render does not work for you, see the second block of commands for a fallback.
      tr: |
        1. **github.com**'da ücretsiz bir hesap aç. `notes-api` adında yeni bir repository oluştur (private olabilir) ve orada README ekleme.
        2. Projeni aşağıdaki komutlarla push et (`YOUR-NAME` yerine kendi adını yaz). Her adımdan sonra commit ettiğin için `git status` çalışma ağacının temiz olduğunu söylemeli. GitHub'da repository'yi aç ve içinde **`.env` dosyası olmadığını** kontrol et.
        3. **render.com**'da ücretsiz bir hesap aç (GitHub ile giriş yapabilirsin) ve `notes-api` repository'ni okumasına izin ver.
        4. Render panelinde *New → Web Service*'e tıkla ve repository'ni seç.
        5. Dil olarak **Docker**'ı, instance tipi olarak **Free**'yi seç. Render `Dockerfile`'ı kendisi bulur.
        6. *Environment Variables* altına uzun rastgele metninle `SECRET_KEY` ekle. İnternet için **yeni** bir tane kullan, `.env`'dekini değil. Frontend'in varsa adreslerinin JSON listesiyle `CORS_ORIGINS` de ekle.
        7. Deploy düğmesine tıkla ve logları izle. İlk build birkaç dakika sürer. `Application startup complete` görünce Render'ın gösterdiği adresi aç (`https://notes-api-....onrender.com/docs`).
        8. Canlı API'nde kayıt ol, giriş yap ve bir not oluştur. 20 dakika bekle, adresi tekrar aç ve bir dakikalık uyanmayı gör. Kullanıcının ve notlarının silindiğini fark et: ücretsiz servislerde dosyalar geçicidir.
        9. Render sende çalışmazsa, yedek yol için ikinci komut bloğuna bak.
    code:
      - file: terminal
        lang: sh
        text: |
          git status
          git branch -M main
          git remote add origin https://github.com/YOUR-NAME/notes-api.git
          git push -u origin main
      - file: terminal
        lang: sh
        text: |
          # Fallback: FastAPI Cloud, from the makers of FastAPI (Hobby plan, check the price page)
          uv run fastapi deploy
          # (set the same SECRET_KEY there too, see the FastAPI Cloud docs)
          # Last resort: run the container on a computer of yours that stays on
          docker run -d --restart unless-stopped -p 10000:10000 -e SECRET_KEY=your-secret -v notes-data:/data notes-api
    mistakes:
      - problem:
          en: "The deploy fails and the logs show `ValidationError ... secret_key Field required`."
          tr: "Deploy başarısız oluyor ve loglarda `ValidationError ... secret_key Field required` yazıyor."
        fix:
          en: "The `SECRET_KEY` environment variable is missing on Render. Add it under *Environment* and redeploy. The app refuses to start without it, on purpose."
          tr: "Render'da `SECRET_KEY` ortam değişkeni yok. *Environment* altına ekle ve yeniden deploy et. Uygulama onsuz bilerek başlamıyor."
      - problem:
          en: "The first request after a break takes a minute, or users and notes are gone."
          tr: "Moladan sonraki ilk istek bir dakika sürüyor ya da kullanıcılar ve notlar kaybolmuş."
        fix:
          en: "That is how the free plan works, not a bug. Free web services sleep and have temporary files. For data that must stay, use a real database service (see the last step) or a paid instance with a persistent disk."
          tr: "Ücretsiz plan böyle çalışır, bu bir hata değil. Ücretsiz web servisleri uyur ve dosyaları geçicidir. Kalması gereken veri için gerçek bir veritabanı servisi (son adıma bak) ya da kalıcı diskli ücretli bir instance kullan."
      - problem:
          en: "A `.env` file was pushed to GitHub."
          tr: "GitHub'a bir `.env` dosyası push edilmiş."
        fix:
          en: "Treat the secret as leaked: make a new `SECRET_KEY`, set it on the host, and remove the file from the repository. Deleting the file in a new commit does not erase it from the history."
          tr: "Gizli anahtarı sızmış say: yeni bir `SECRET_KEY` üret, barındırıcıda ayarla ve dosyayı repository'den çıkar. Dosyayı yeni bir commit'te silmek onu geçmişten silmez."
    quiz:
      - q:
          en: "Why are your users gone after the free Render service sleeps?"
          tr: "Ücretsiz Render servisi uyuyunca kullanıcıların neden kayboluyor?"
        options:
          en:
            - "Render deletes accounts that are not used for 15 minutes"
            - "FastAPI clears the database on every start"
            - "Free services have a temporary filesystem, so the SQLite file is deleted"
          tr:
            - "Render 15 dakika kullanılmayan hesapları siler"
            - "FastAPI her başlangıçta veritabanını temizler"
            - "Ücretsiz servislerin dosya sistemi geçicidir, yani SQLite dosyası silinir"
        answer: 2
        why:
          en: "The notes live in a file inside the container, and on the free plan any local file is lost when the service restarts, redeploys or spins down."
          tr: "Notlar container içindeki bir dosyada durur ve ücretsiz planda servis yeniden başlayınca, yeniden deploy olunca ya da uyuyunca her yerel dosya kaybolur."
    sources:
      - title: Render, deploy for free
        url: https://render.com/docs/free
      - title: Render, web services (port 10000)
        url: https://render.com/docs/web-services
      - title: Render, Docker
        url: https://render.com/docs/docker
      - title: FastAPI Cloud
        url: https://fastapi.tiangolo.com/deployment/fastapicloud/

  - id: health-logs
    stage: monitoring
    title:
      en: "Health check and logs"
      tr: "Sağlık kontrolü ve loglar"
    minutes: 30
    needs: [render]
    why:
      en: "Once the API is live you are not looking at it anymore. You need a cheap address that says \"I am alive and I can reach my database\", and logs that tell you what happened when something goes wrong."
      tr: "API canlıya çıkınca artık ona bakmıyorsun. \"Yaşıyorum ve veritabanıma ulaşabiliyorum\" diyen ucuz bir adrese ve bir şey ters gidince ne olduğunu söyleyen loglara ihtiyacın var."
    learn:
      en: |
        - What a **health check** is: an endpoint the host calls every few seconds; it must answer fast, need no login and fail when something important is broken
        - Log **levels**: `info` for normal events, `warning` for something odd (a slow request), `error` for failures
        - Why logs must never contain passwords, tokens or other secrets (log the user id, not the email or the password)
        - Where to read logs: your terminal locally, the *Logs* tab on Render
      tr: |
        - **Sağlık kontrolü**nün ne olduğu: barındırıcının birkaç saniyede bir çağırdığı endpoint; hızlı cevap vermeli, giriş istememeli ve önemli bir şey bozulunca başarısız olmalı
        - Log **seviyeleri**: normal olaylar için `info`, tuhaf bir şey için (yavaş bir istek) `warning`, başarısızlıklar için `error`
        - Logların neden asla şifre, token ya da başka gizli bilgi içermemesi gerektiği (e-posta ya da şifre değil, kullanıcı id'sini logla)
        - Logları nerede okuyacağın: yerelde terminalin, Render'da *Logs* sekmesi
    do:
      en: |
        1. Replace `app/main.py` and `app/routers/auth.py` with the code below. `main.py` gets the `/health` endpoint, log settings and a warning for requests slower than half a second. `auth.py` logs the id of each new user.
        2. Add `tests/test_health.py` and run `uv run pytest`. You should see `21 passed`.
        3. Start the server, open http://127.0.0.1:8000/health, then register a user in `/docs` and find the lines `Notes API started` and `new user registered` in the terminal.
        4. Commit and push: `git add .`, `git commit -m "Health check and logs"`, `git push`. Render deploys the new version by itself.
        5. In the Render dashboard open your service, go to *Settings* and scroll down to the *Health Checks* section. Click *Edit*, set the path to `/health` and click *Save Changes*. Render now calls it, waits for it to pass before it sends traffic to a new deploy, and restarts the service if it keeps failing.
        6. Open the *Logs* tab and find your own `Notes API started` line.
        7. Optional: a free outside service can call `/health` every few minutes and email you when it fails. Be careful: calling it all the time keeps the free service awake, and the free plan has about 750 hours per month.
      tr: |
        1. `app/main.py` ve `app/routers/auth.py` dosyalarını aşağıdaki kodla değiştir. `main.py`'ye `/health` endpoint'i, log ayarları ve yarım saniyeden yavaş istekler için bir uyarı gelir. `auth.py` her yeni kullanıcının id'sini loglar.
        2. `tests/test_health.py` dosyasını ekle ve `uv run pytest` çalıştır. `21 passed` görmelisin.
        3. Sunucuyu başlat, http://127.0.0.1:8000/health adresini aç, sonra `/docs`'ta bir kullanıcı kaydet ve terminalde `Notes API started` ve `new user registered` satırlarını bul.
        4. Kaydet ve push et: `git add .`, `git commit -m "Health check and logs"`, `git push`. Render yeni sürümü kendiliğinden deploy eder.
        5. Render panelinde servisini aç, *Settings*'e git ve aşağı kaydırıp *Health Checks* bölümünü bul. *Edit*'e tıkla, path olarak `/health` yaz ve *Save Changes*'e tıkla. Render artık onu çağırır, yeni bir deploy'a trafik vermeden önce geçmesini bekler ve sürekli başarısız olursa servisi yeniden başlatır.
        6. *Logs* sekmesini aç ve kendi `Notes API started` satırını bul.
        7. İsteğe bağlı: ücretsiz bir dış servis `/health`'i birkaç dakikada bir çağırıp başarısız olunca sana e-posta atabilir. Dikkat: sürekli çağırmak ücretsiz servisi uyanık tutar ve ücretsiz planda ayda yaklaşık 750 saat var.
    code:
      - file: app/main.py
        lang: python
        text: |
          import logging
          import time
          from contextlib import asynccontextmanager

          from fastapi import FastAPI, HTTPException, Request
          from fastapi.middleware.cors import CORSMiddleware
          from fastapi.middleware.gzip import GZipMiddleware
          from sqlalchemy import text

          from .db import SessionDep, create_db_and_tables
          from .routers import auth, notes
          from .settings import get_settings

          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(name)s: %(message)s")
          logger = logging.getLogger("notes")


          @asynccontextmanager
          async def lifespan(app: FastAPI):
              create_db_and_tables()  # runs once, before the first request
              logger.info("Notes API started")
              yield


          app = FastAPI(title="Notes API", version="1.0.0", lifespan=lifespan)

          settings = get_settings()
          if settings.cors_origins:
              app.add_middleware(
                  CORSMiddleware,
                  allow_origins=settings.cors_origins,  # the real addresses of your frontend
                  allow_methods=["GET", "POST", "PATCH", "DELETE"],
                  allow_headers=["Authorization", "Content-Type"],
              )
          # Compress responses bigger than 500 bytes when the client accepts it.
          app.add_middleware(GZipMiddleware, minimum_size=500)


          @app.middleware("http")
          async def add_process_time(request: Request, call_next):
              start = time.perf_counter()
              response = await call_next(request)
              ms = (time.perf_counter() - start) * 1000
              response.headers["X-Process-Time"] = f"{ms:.1f}ms"
              if ms > 500:  # slow requests are worth a line in the logs
                  logger.warning("slow request: %s %s took %.0f ms", request.method, request.url.path, ms)
              return response


          app.include_router(auth.router)
          app.include_router(notes.router)


          @app.get("/")
          def root():
              return {"message": "Hello, notes"}


          @app.get("/health")
          def health(session: SessionDep):
              """Used by the host to check that the app is alive and can reach its database."""
              try:
                  session.connection().execute(text("SELECT 1"))
              except Exception:
                  logger.exception("health check: database is not reachable")
                  raise HTTPException(status_code=503, detail="Database unavailable")
              return {"status": "ok", "version": app.version}
      - file: app/routers/auth.py
        lang: python
        text: |
          import logging
          from typing import Annotated

          from fastapi import APIRouter, Depends, HTTPException, status
          from fastapi.security import OAuth2PasswordRequestForm
          from sqlmodel import select

          from ..db import SessionDep
          from ..models import Token, User, UserCreate, UserPublic
          from ..security import (
              DUMMY_HASH,
              CurrentUser,
              create_access_token,
              hash_password,
              verify_password,
          )

          logger = logging.getLogger("notes")
          router = APIRouter(prefix="/auth", tags=["auth"])


          @router.post("/register", status_code=status.HTTP_201_CREATED)
          def register(data: UserCreate, session: SessionDep) -> UserPublic:
              email = data.email.lower()
              if session.exec(select(User).where(User.email == email)).first():
                  raise HTTPException(status_code=409, detail="Email already registered")
              user = User(email=email, hashed_password=hash_password(data.password))
              session.add(user)
              session.commit()
              session.refresh(user)
              logger.info("new user registered: id=%s", user.id)  # the id, never the password
              return user


          @router.post("/token")
          def login(
              form: Annotated[OAuth2PasswordRequestForm, Depends()], session: SessionDep
          ) -> Token:
              # The form field is called "username" by the OAuth2 standard; we put the email in it.
              user = session.exec(select(User).where(User.email == form.username.lower())).first()
              if user is None:
                  verify_password(form.password, DUMMY_HASH)  # same time as a wrong password
                  valid = False
              else:
                  valid = verify_password(form.password, user.hashed_password)
              if user is None or not valid:
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail="Incorrect email or password",
                      headers={"WWW-Authenticate": "Bearer"},
                  )
              assert user.id is not None
              return Token(access_token=create_access_token(user.id))


          @router.get("/me")
          def me(user: CurrentUser) -> UserPublic:
              return user
      - file: tests/test_health.py
        lang: python
        text: |
          from fastapi.testclient import TestClient


          def test_health_is_ok_and_needs_no_login(client: TestClient):
              response = client.get("/health")
              assert response.status_code == 200
              assert response.json() == {"status": "ok", "version": "1.0.0"}
    mistakes:
      - problem:
          en: "A health check that always answers \"ok\" without touching the database."
          tr: "Veritabanına hiç dokunmadan hep \"ok\" cevabı veren bir sağlık kontrolü."
        fix:
          en: "Do one tiny query (`SELECT 1`) and answer 503 when it fails, as `/health` does. Otherwise the host thinks a broken app is healthy."
          tr: "Küçücük bir sorgu çalıştır (`SELECT 1`) ve başarısız olursa 503 döndür, `/health`'in yaptığı gibi. Aksi halde barındırıcı bozuk bir uygulamayı sağlıklı sanar."
      - problem:
          en: "The health check answers 401."
          tr: "Sağlık kontrolü 401 cevabı veriyor."
        fix:
          en: "Do not add `CurrentUser` to `/health`. The host has no token, so it would think your app is down."
          tr: "`/health`'e `CurrentUser` ekleme. Barındırıcıda token yok; uygulamanın çöktüğünü sanır."
      - problem:
          en: "Passwords, tokens or full emails appear in the logs."
          tr: "Loglarda şifreler, token'lar ya da tam e-postalar görünüyor."
        fix:
          en: "Log ids and counts, never secrets. Logs are copied to other places and read by more people than your database."
          tr: "Id'leri ve sayıları logla, gizli bilgileri asla. Loglar başka yerlere kopyalanır ve veritabanından daha fazla kişi tarafından okunur."
    quiz:
      - q:
          en: "Why should `/health` not need a login?"
          tr: "`/health` neden giriş istememeli?"
        options:
          en:
            - "Login makes the answer slower than a second"
            - "The host calling it has no token and must still be able to check the app"
            - "FastAPI does not allow login on small endpoints"
          tr:
            - "Giriş cevabı bir saniyeden yavaşlatır"
            - "Onu çağıran barındırıcıda token yok ve yine de uygulamayı kontrol edebilmeli"
            - "FastAPI küçük endpoint'lerde girişe izin vermez"
        answer: 1
        why:
          en: "A health check is an automatic caller. It must be public, cheap and say nothing secret: just \"ok\" and a version."
          tr: "Sağlık kontrolünü çağıran otomatik bir istemcidir. Herkese açık, ucuz olmalı ve gizli bir şey söylememeli: sadece \"ok\" ve bir sürüm."
