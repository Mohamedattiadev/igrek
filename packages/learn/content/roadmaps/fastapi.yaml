id: fastapi
title: FastAPI
summary:
  en: "From an empty computer to your own API on the internet. You build a notes API with FastAPI step by step: a database, users who log in, tests and a container, and you understand why each step is there."
  tr: "Boş bir bilgisayardan internette yayında olan kendi API'ne. FastAPI ile adım adım bir notlar API'si yazarsın: veritabanı, giriş yapan kullanıcılar, testler ve bir container; her adımın neden orada olduğunu anlarsın."
teacher: backend
after: [python]
project:
  en: 'A notes and todo REST API: users sign up and log in with a token, each user keeps private notes in a SQLite database, with search, paging, tests, a Docker image and a free deploy on Render.'
  tr: 'Notlar ve yapılacaklar için bir REST API: kullanıcılar kayıt olup token ile giriş yapar, her kullanıcı kendi özel notlarını bir SQLite veritabanında tutar; arama, sayfalama, testler, bir Docker image''ı ve Render''da ücretsiz deploy var.'
detect:
  pip: [fastapi]
version: "0.143"
latest: pypi:fastapi
checked: 2026-10
sheets: [python, fastapi, http, rest-graphql, auth, cors, sql, docker, git]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install uv, an editor and Git"
      tr: "uv, bir editör ve Git kurma"
    minutes: 40
    why:
      en: "A FastAPI app is Python code plus a few packages. uv installs Python itself, keeps the packages of each project apart and runs your commands, so you do not fight with versions. An editor makes writing code comfortable, and Git keeps every version of your work."
      tr: "Bir FastAPI uygulaması Python kodu ve birkaç pakettir. uv, Python'un kendisini kurar, her projenin paketlerini ayrı tutar ve komutlarını çalıştırır; böylece sürümlerle uğraşmazsın. Editör kod yazmayı rahatlatır, Git de işinin her sürümünü saklar."
    learn:
      en: |
        - What a terminal is and how to check that a program is installed
        - What **uv** does: it installs Python, creates a private folder of packages for each project (a "virtual environment") and runs commands inside it
        - What an API is: a program that other programs talk to over HTTP, usually by sending and receiving JSON
      tr: |
        - Terminalin ne olduğu ve bir programın kurulu olup olmadığını nasıl kontrol edeceğin
        - **uv**'nin ne yaptığı: Python'u kurar, her proje için paketlerin durduğu özel bir klasör ("virtual environment", sanal ortam) oluşturur ve komutları onun içinde çalıştırır
        - API'nin ne olduğu: diğer programların HTTP üzerinden konuştuğu, genelde JSON gönderip alan bir program
    do:
      en: |
        1. Install **uv**. On macOS or Linux, open a terminal and run the first command below. On Windows, open PowerShell and run the second one. Close the terminal and open a new one afterwards.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor, and its Python extension (search "Python" in the Extensions panel).
        3. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it.
        4. Open a terminal (in VS Code: *Terminal → New Terminal*) and run the check commands below. Each should print a version number.
        5. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
        6. You do not need to install Python yourself: uv downloads the right version when your project asks for it.
      tr: |
        1. **uv**'yi kur. macOS veya Linux'ta bir terminal açıp aşağıdaki ilk komutu çalıştır. Windows'ta PowerShell açıp ikinci komutu çalıştır. Sonra terminali kapatıp yenisini aç.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u (code.visualstudio.com) ve Python eklentisini kur (Extensions panelinde "Python" ara).
        3. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir.
        4. Bir terminal aç (VS Code'da: *Terminal → New Terminal*) ve aşağıdaki kontrol komutlarını çalıştır. Her biri bir sürüm numarası yazmalı.
        5. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
        6. Python'u kendin kurmana gerek yok: projen istediğinde uv doğru sürümü indirir.
    code:
      - file: terminal
        lang: sh
        text: |
          # macOS and Linux
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - file: terminal
        lang: powershell
        text: |
          # Windows (PowerShell)
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
      - file: terminal
        lang: sh
        text: |
          uv --version
          git --version
    mistakes:
      - problem:
          en: "\"command not found: uv\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found: uv\" hatası."
        fix:
          en: "Close the terminal (or VS Code) and open a new one so it sees the new program. If it still fails, restart the computer."
          tr: "Terminali (ya da VS Code'u) kapatıp yenisini aç ki yeni programı görsün. Hâlâ olmuyorsa bilgisayarı yeniden başlat."
      - problem:
          en: "Installing Python from python.org as well and then not knowing which one runs."
          tr: "Bir de python.org'dan Python kurup hangisinin çalıştığını bilememek."
        fix:
          en: "In this roadmap always start commands with `uv run`. It uses the Python of the project, whatever else is on your computer."
          tr: "Bu yol haritasında komutlara hep `uv run` ile başla. Bilgisayarında başka ne olursa olsun projenin Python'unu kullanır."
    quiz:
      - q:
          en: "What does uv do for your project?"
          tr: "uv projen için ne yapar?"
        options:
          en:
            - "It hosts your API on the internet"
            - "It installs Python and the packages of the project and runs commands with them"
            - "It writes the FastAPI code for you"
          tr:
            - "API'ni internette barındırır"
            - "Python'u ve projenin paketlerini kurar, komutları onlarla çalıştırır"
            - "FastAPI kodunu senin yerine yazar"
        answer: 1
        why:
          en: "uv manages Python versions and the packages of each project. Hosting comes much later and the code is yours to write."
          tr: "uv Python sürümlerini ve her projenin paketlerini yönetir. Barındırma çok sonra gelir, kodu da sen yazarsın."
    sources:
      - title: uv installation
        url: https://docs.astral.sh/uv/getting-started/installation/
      - title: Git installation
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: hello
    stage: first-code
    title:
      en: "Your first endpoint and the automatic docs"
      tr: "İlk endpoint ve otomatik doküman"
    minutes: 35
    needs: [setup]
    why:
      en: "Before notes, databases or users, you need one thing working end to end: a URL that answers. FastAPI also writes a page where you can try your API in the browser, which you will use all the way through this roadmap."
      tr: "Notlardan, veritabanından ya da kullanıcılardan önce baştan sona çalışan tek bir şey lazım: cevap veren bir URL. FastAPI ayrıca API'ni tarayıcıda denemen için bir sayfa da yazar; bu yol haritası boyunca onu kullanacaksın."
    learn:
      en: |
        - What a project folder looks like with uv: `pyproject.toml` (the project's settings and package list) and `uv.lock` (the exact versions)
        - What `@app.get("/")` does: it connects the URL `/` and the HTTP method GET to a function
        - That `fastapi dev` restarts the server by itself whenever you save a file
        - Where the interactive docs live: `/docs`
      tr: |
        - uv ile bir proje klasörünün nasıl göründüğü: `pyproject.toml` (projenin ayarları ve paket listesi) ve `uv.lock` (paketlerin tam sürümleri)
        - `@app.get("/")` ne yapar: `/` adresini ve GET HTTP metodunu bir fonksiyona bağlar
        - `fastapi dev` bir dosyayı kaydettiğin anda sunucuyu kendiliğinden yeniden başlatır
        - Etkileşimli dokümanın nerede durduğu: `/docs`
    do:
      en: |
        1. In the terminal, go to the folder where you keep projects. Create the project folder, go into it and let Git watch it (first block below).
        2. Create the project with uv and add FastAPI. The quotes around `"fastapi[standard]"` matter. `[standard]` also installs the server (Uvicorn) and the `fastapi` command.
        3. Create a folder `app` with three files: `.gitignore` in the project folder, and `app/__init__.py` and `app/main.py` as shown. `.gitignore` lists files Git must never save: the packages, secrets and the database.
        4. Open `pyproject.toml` and add the `[tool.fastapi]` lines at the bottom. They tell the `fastapi` command where your app is.
        5. Start the server with `uv run fastapi dev`. Open http://127.0.0.1:8000 and then http://127.0.0.1:8000/docs.
        6. In `/docs` click the `GET /` row, then *Try it out* and *Execute*. Change the message in `main.py`, save, and execute again.
        7. Stop the server with Ctrl+C. Save your work: `git add .` and `git commit -m "Hello endpoint"`.
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git. Proje klasörünü oluştur, içine gir ve Git'in izlemesini sağla (aşağıdaki ilk blok).
        2. Projeyi uv ile oluştur ve FastAPI'yi ekle. `"fastapi[standard]"` etrafındaki tırnaklar önemli. `[standard]` sunucuyu (Uvicorn) ve `fastapi` komutunu da kurar.
        3. `app` klasörü ve üç dosya oluştur: proje klasöründe `.gitignore`, ayrıca gösterildiği gibi `app/__init__.py` ve `app/main.py`. `.gitignore`, Git'in asla kaydetmemesi gereken dosyaları listeler: paketler, gizli bilgiler ve veritabanı.
        4. `pyproject.toml`'u aç ve en alta `[tool.fastapi]` satırlarını ekle. `fastapi` komutuna uygulamanın nerede olduğunu söylerler.
        5. Sunucuyu `uv run fastapi dev` ile başlat. http://127.0.0.1:8000 adresini, sonra http://127.0.0.1:8000/docs adresini aç.
        6. `/docs` sayfasında `GET /` satırına tıkla, sonra *Try it out* ve *Execute*. `main.py` içindeki mesajı değiştir, kaydet ve tekrar çalıştır.
        7. Sunucuyu Ctrl+C ile durdur. Çalışmanı kaydet: `git add .` ve `git commit -m "Hello endpoint"`.
    code:
      - file: terminal
        lang: sh
        text: |
          mkdir notes-api
          cd notes-api
          git init
          uv init --bare --python 3.14
          uv add "fastapi[standard]"
          mkdir app
      - file: .gitignore
        lang: text
        text: |
          .venv
          .env
          *.db
          __pycache__
          .pytest_cache
      - file: app/__init__.py
        lang: python
        text: |
          # The notes API package.
      - file: app/main.py
        lang: python
        text: |
          from fastapi import FastAPI

          app = FastAPI(title="Notes API")


          @app.get("/")
          def root():
              return {"message": "Hello, notes"}
      - file: pyproject.toml
        lang: toml
        text: |
          # add this at the bottom of the file
          [tool.fastapi]
          entrypoint = "app.main:app"
      - file: terminal
        lang: sh
        text: |
          uv run fastapi dev
    mistakes:
      - problem:
          en: "`uv add fastapi[standard]` without quotes fails in some shells (zsh)."
          tr: "`uv add fastapi[standard]` komutunu tırnaksız yazmak bazı shell'lerde (zsh) hata verir."
        fix:
          en: "Write `uv add \"fastapi[standard]\"`. Shells treat square brackets as a pattern."
          tr: "`uv add \"fastapi[standard]\"` diye yaz. Shell'ler köşeli parantezi kalıp sanar."
      - problem:
          en: "\"Error loading ASGI app\" or an import error when starting."
          tr: "Başlarken \"Error loading ASGI app\" ya da import hatası."
        fix:
          en: "Check that you run the command in the project folder (the one with `pyproject.toml`), that `app/__init__.py` exists, and that the entrypoint is `app.main:app`. Never name a file `fastapi.py`: it hides the real package."
          tr: "Komutu proje klasöründe (içinde `pyproject.toml` olan) çalıştırdığını, `app/__init__.py` dosyasının var olduğunu ve entrypoint'in `app.main:app` olduğunu kontrol et. Hiçbir dosyaya `fastapi.py` adını verme: gerçek paketi gölgeler."
    quiz:
      - q:
          en: "What does `@app.get(\"/\")` do?"
          tr: "`@app.get(\"/\")` ne yapar?"
        options:
          en:
            - "It starts the server"
            - "It creates a database table"
            - "It connects the URL / and the GET method to the function below it"
          tr:
            - "Sunucuyu başlatır"
            - "Bir veritabanı tablosu oluşturur"
            - "/ adresini ve GET metodunu altındaki fonksiyona bağlar"
        answer: 2
        why:
          en: "The decorator registers the function as the handler for that path and method."
          tr: "Decorator, fonksiyonu o path ve metot için işleyici olarak kaydeder."
    sources:
      - title: FastAPI first steps
        url: https://fastapi.tiangolo.com/tutorial/first-steps/
      - title: FastAPI CLI (fastapi dev and the entrypoint)
        url: https://fastapi.tiangolo.com/fastapi-cli/
      - title: uv, creating projects
        url: https://docs.astral.sh/uv/concepts/projects/init/

  - id: params
    stage: basics
    title:
      en: "Path and query parameters"
      tr: "Path ve query parametreleri"
    minutes: 35
    needs: [hello]
    why:
      en: "An API is useful when callers can say what they want: one note by its id, only the finished ones, only titles that contain a word. FastAPI reads these from the URL, checks their types and answers with a clear error when they are wrong."
      tr: "Bir API, çağıran ne istediğini söyleyebildiğinde işe yarar: id'siyle tek bir not, sadece bitmiş olanlar, başlığında bir kelime geçenler. FastAPI bunları URL'den okur, tiplerini kontrol eder ve yanlışsa net bir hatayla cevap verir."
    learn:
      en: |
        - A path parameter is part of the path: `/notes/2`. A query parameter comes after a question mark: `/notes?done=true&q=fast`
        - FastAPI converts and checks values by their Python type hint (`int`, `bool`)
        - `Annotated[..., Query(max_length=50)]` adds rules and shows them in the docs
        - Status codes tell the caller what happened: 200 worked, 404 not found, 422 your data is wrong
      tr: |
        - Path parametresi yolun parçasıdır: `/notes/2`. Query parametresi soru işaretinden sonra gelir: `/notes?done=true&q=fast`
        - FastAPI değerleri Python tip ipucuna (`int`, `bool`) göre dönüştürür ve kontrol eder
        - `Annotated[..., Query(max_length=50)]` kural ekler ve bunları dokümanda gösterir
        - Durum kodları çağırana ne olduğunu söyler: 200 oldu, 404 bulunamadı, 422 verin yanlış
    do:
      en: |
        1. Replace `app/main.py` with the code below. The `NOTES` list is a pretend database that lives in memory.
        2. Run `uv run fastapi dev` and open http://127.0.0.1:8000/docs. Try `GET /notes` with *Try it out*.
        3. Type in the browser bar: `/notes?done=false`, then `/notes?q=fast`, then `/notes/2`.
        4. Break it on purpose: `/notes/abc` answers 422 (not a number) and `/notes/99` answers 404. Read the error messages.
        5. Commit: `git add .` and `git commit -m "Path and query parameters"`.
      tr: |
        1. `app/main.py` dosyasını aşağıdaki kodla değiştir. `NOTES` listesi bellekte duran sahte bir veritabanıdır.
        2. `uv run fastapi dev` çalıştır ve http://127.0.0.1:8000/docs adresini aç. *Try it out* ile `GET /notes` dene.
        3. Tarayıcı adres çubuğuna sırayla yaz: `/notes?done=false`, sonra `/notes?q=fast`, sonra `/notes/2`.
        4. Bilerek boz: `/notes/abc` 422 (sayı değil), `/notes/99` 404 cevabı verir. Hata mesajlarını oku.
        5. Kaydet: `git add .` ve `git commit -m "Path and query parameters"`.
    code:
      - file: app/main.py
        lang: python
        text: |
          from typing import Annotated

          from fastapi import FastAPI, HTTPException, Query

          app = FastAPI(title="Notes API")

          # A fake database for now: a plain list in memory.
          NOTES = [
              {"id": 1, "title": "Buy milk", "done": False},
              {"id": 2, "title": "Learn FastAPI", "done": False},
              {"id": 3, "title": "Drink water", "done": True},
          ]


          @app.get("/")
          def root():
              return {"message": "Hello, notes"}


          @app.get("/notes")
          def list_notes(
              done: bool | None = None,
              q: Annotated[str | None, Query(max_length=50)] = None,
          ):
              notes = NOTES
              if done is not None:
                  notes = [n for n in notes if n["done"] == done]
              if q:
                  notes = [n for n in notes if q.lower() in n["title"].lower()]
              return notes


          @app.get("/notes/{note_id}")
          def read_note(note_id: int):
              for note in NOTES:
                  if note["id"] == note_id:
                      return note
              raise HTTPException(status_code=404, detail="Note not found")
    mistakes:
      - problem:
          en: "Writing `done: bool` without a default value: the parameter becomes required and a plain `GET /notes` gets 422."
          tr: "`done: bool` diye varsayılan değer vermeden yazmak: parametre zorunlu olur ve düz `GET /notes` 422 alır."
        fix:
          en: "Give optional query parameters a default, like `done: bool | None = None`."
          tr: "İsteğe bağlı query parametrelerine varsayılan ver, örneğin `done: bool | None = None`."
      - problem:
          en: "Returning `{\"error\": \"not found\"}` with status 200."
          tr: "200 durumuyla `{\"error\": \"not found\"}` döndürmek."
        fix:
          en: "Raise `HTTPException(status_code=404, ...)`. Clients and monitoring tools read the status code, not your message."
          tr: "`HTTPException(status_code=404, ...)` fırlat. İstemciler ve izleme araçları mesajını değil durum kodunu okur."
    quiz:
      - q:
          en: "In `/notes/2?done=true`, which part is the query parameter?"
          tr: "`/notes/2?done=true` içinde query parametresi hangisi?"
        options:
          en:
            - "2"
            - "done=true"
            - "/notes"
          tr:
            - "2"
            - "done=true"
            - "/notes"
        answer: 1
        why:
          en: "Everything after the question mark is the query string. The 2 is a path parameter."
          tr: "Soru işaretinden sonrası query string'dir. 2 ise path parametresidir."
    sources:
      - title: FastAPI path parameters
        url: https://fastapi.tiangolo.com/tutorial/path-params/
      - title: FastAPI query parameters
        url: https://fastapi.tiangolo.com/tutorial/query-params/
      - title: Query parameters with validation
        url: https://fastapi.tiangolo.com/tutorial/query-params-str-validations/

  - id: notes-memory
    stage: first-project
    title:
      en: "Create and delete notes with models"
      tr: "Modellerle not oluşturma ve silme"
    minutes: 45
    needs: [params]
    why:
      en: "Real clients send data to your API, not just read from it. A Pydantic model describes exactly what a note looks like, and FastAPI rejects anything else before your code runs. Splitting the code into files now keeps it easy to grow later."
      tr: "Gerçek istemciler API'ne sadece veri okumaz, veri de gönderir. Bir Pydantic modeli bir notun tam olarak nasıl göründüğünü tarif eder ve FastAPI geri kalanı senin kodun çalışmadan reddeder. Kodu şimdiden dosyalara bölmek ileride büyütmeyi kolaylaştırır."
    learn:
      en: |
        - What a Pydantic model is: a class that lists the fields of the data and their types and rules
        - Why there are two models: `NoteCreate` is what the client may send, `NotePublic` is what you send back (it adds the `id`)
        - What POST, GET and DELETE mean in a REST API, and why creating answers 201 and deleting answers 204
        - How `APIRouter` moves a group of endpoints into their own file
      tr: |
        - Pydantic modelinin ne olduğu: verinin alanlarını, tiplerini ve kurallarını sıralayan bir sınıf
        - Neden iki model olduğu: `NoteCreate` istemcinin gönderebileceği, `NotePublic` senin geri göndereceğin şey (`id`'yi ekler)
        - REST API'de POST, GET ve DELETE'in ne anlama geldiği; oluşturmanın neden 201, silmenin neden 204 döndürdüğü
        - `APIRouter`'ın bir grup endpoint'i kendi dosyasına nasıl taşıdığı
    do:
      en: |
        1. Create `app/models.py`, then the folder `app/routers` with `__init__.py` and `notes.py`, and replace `app/main.py`, all as shown below.
        2. Start `uv run fastapi dev` and open `/docs`. There are now three endpoints under *notes*.
        3. Open `POST /notes`, click *Try it out*, change the body to `{"title": "Buy milk"}` and *Execute*. You get 201 and a note with `id` 1. Create two more.
        4. Run `GET /notes`, then `GET /notes/1`, then `DELETE /notes/1` (204, no body), then `GET /notes/1` again (404).
        5. Send `{"title": ""}` to `POST /notes`: 422, because the title must have at least one character.
        6. Stop and start the server: the notes are gone. That is expected, they live in memory only. The next step fixes it.
        7. Commit: `git add .` and `git commit -m "Notes in memory"`.
      tr: |
        1. Aşağıda gösterildiği gibi `app/models.py` dosyasını, `app/routers` klasörünü (içinde `__init__.py` ve `notes.py`) oluştur ve `app/main.py`'yi değiştir.
        2. `uv run fastapi dev` ile başlat ve `/docs` sayfasını aç. *notes* altında artık üç endpoint var.
        3. `POST /notes` satırını aç, *Try it out*'a tıkla, body'yi `{"title": "Buy milk"}` yap ve *Execute*. 201 ve `id`'si 1 olan bir not alırsın. İki tane daha oluştur.
        4. Sırayla `GET /notes`, `GET /notes/1`, `DELETE /notes/1` (204, body yok), sonra tekrar `GET /notes/1` (404) çalıştır.
        5. `POST /notes`'a `{"title": ""}` gönder: 422, çünkü başlık en az bir karakter olmalı.
        6. Sunucuyu durdurup yeniden başlat: notlar gitti. Beklenen bu, sadece bellekte duruyorlar. Bir sonraki adım bunu çözer.
        7. Kaydet: `git add .` ve `git commit -m "Notes in memory"`.
    code:
      - file: app/models.py
        lang: python
        text: |
          from pydantic import BaseModel, Field


          class NoteCreate(BaseModel):
              title: str = Field(min_length=1, max_length=100)
              content: str = Field(default="", max_length=2000)
              done: bool = False


          class NotePublic(NoteCreate):
              id: int
      - file: app/routers/__init__.py
        lang: python
        text: |
          # The route files of the API.
      - file: app/routers/notes.py
        lang: python
        text: |
          from itertools import count

          from fastapi import APIRouter, HTTPException, status

          from ..models import NoteCreate, NotePublic

          router = APIRouter(prefix="/notes", tags=["notes"])

          # Still a fake database: a dict in memory, gone when the server restarts.
          NOTES: dict[int, NotePublic] = {}
          ids = count(1)


          @router.post("", status_code=status.HTTP_201_CREATED)
          def create_note(note: NoteCreate) -> NotePublic:
              created = NotePublic(id=next(ids), **note.model_dump())
              NOTES[created.id] = created
              return created


          @router.get("")
          def list_notes() -> list[NotePublic]:
              return list(NOTES.values())


          @router.get("/{note_id}")
          def read_note(note_id: int) -> NotePublic:
              note = NOTES.get(note_id)
              if note is None:
                  raise HTTPException(status_code=404, detail="Note not found")
              return note


          @router.delete("/{note_id}", status_code=status.HTTP_204_NO_CONTENT)
          def delete_note(note_id: int) -> None:
              if NOTES.pop(note_id, None) is None:
                  raise HTTPException(status_code=404, detail="Note not found")
      - file: app/main.py
        lang: python
        text: |
          from fastapi import FastAPI

          from .routers import notes

          app = FastAPI(title="Notes API")
          app.include_router(notes.router)


          @app.get("/")
          def root():
              return {"message": "Hello, notes"}
    mistakes:
      - problem:
          en: "`POST /notes` answers 422 \"Field required\" from the docs page."
          tr: "Doküman sayfasından `POST /notes` 422 \"Field required\" cevabı veriyor."
        fix:
          en: "The body must be valid JSON with a `title` field, for example `{\"title\": \"Buy milk\"}`. Check the quotes and the commas."
          tr: "Body, `title` alanı olan geçerli bir JSON olmalı, örneğin `{\"title\": \"Buy milk\"}`. Tırnakları ve virgülleri kontrol et."
      - problem:
          en: "Calling `note.dict()` (an old Pydantic v1 method)."
          tr: "`note.dict()` çağırmak (eski Pydantic v1 metodu)."
        fix:
          en: "Pydantic v2, which FastAPI uses now, calls it `note.model_dump()`."
          tr: "FastAPI'nin artık kullandığı Pydantic v2'de adı `note.model_dump()`."
      - problem:
          en: "Calling `/notes/` with a trailing slash gives a redirect (307)."
          tr: "`/notes/` diye sonuna eğik çizgi koyunca yönlendirme (307) geliyor."
        fix:
          en: "The route is `/notes`. Use the exact path; FastAPI redirects the other form, but some clients lose the body when they follow a redirect."
          tr: "Route `/notes`. Tam yolu kullan; FastAPI diğer biçimi yönlendirir ama bazı istemciler yönlendirmeyi izlerken body'yi kaybeder."
    quiz:
      - q:
          en: "Why does the client send a `NoteCreate` but get back a `NotePublic`?"
          tr: "İstemci neden `NoteCreate` gönderiyor da `NotePublic` geri alıyor?"
        options:
          en:
            - "Two models are faster than one"
            - "The client must not choose the id; the server makes it and returns it"
            - "FastAPI requires exactly two models"
          tr:
            - "İki model, bir modelden daha hızlı"
            - "İstemci id'yi seçmemeli; onu sunucu üretir ve geri döndürür"
            - "FastAPI tam olarak iki model ister"
        answer: 1
        why:
          en: "Separate input and output models give you control over what comes in and what goes out. You will rely on this again for passwords."
          tr: "Ayrı giriş ve çıkış modelleri, içeri ne girdiğini ve dışarı ne çıktığını kontrol etmeni sağlar. Şifrelerde bunu yine kullanacaksın."
    sources:
      - title: Request body
        url: https://fastapi.tiangolo.com/tutorial/body/
      - title: Response model - return type
        url: https://fastapi.tiangolo.com/tutorial/response-model/
      - title: Bigger applications (APIRouter)
        url: https://fastapi.tiangolo.com/tutorial/bigger-applications/

  - id: database
    stage: data-api
    title:
      en: "Save notes in SQLite with SQLModel"
      tr: "Notları SQLModel ile SQLite'a kaydetme"
    minutes: 45
    needs: [notes-memory]
    why:
      en: "Notes in memory disappear when the server restarts. A database keeps them on disk. SQLite is a database in a single file, so there is nothing to install, and SQLModel (made by the author of FastAPI, it is what the official tutorial uses) lets one class be both a table and a Pydantic model."
      tr: "Bellekteki notlar sunucu yeniden başlayınca kaybolur. Veritabanı onları diskte saklar. SQLite tek dosyalık bir veritabanıdır, yani kurulacak bir şey yoktur; SQLModel (FastAPI'nin yazarı yaptı, resmi eğitim de onu kullanıyor) bir sınıfın hem tablo hem Pydantic modeli olmasını sağlar."
    learn:
      en: |
        - What a database table is: rows and columns, one row per note, and a primary key (`id`) that identifies each row
        - What a **session** is: one conversation with the database; you `add`, `commit` and `refresh`
        - How a **dependency** (`Depends`) gives every endpoint its own session and closes it afterwards
        - Why the table model `Note` is never used as a request body: the client could choose the `id`
        - What `lifespan` is: code that runs once when the app starts
      tr: |
        - Veritabanı tablosunun ne olduğu: satırlar ve sütunlar, her not için bir satır ve her satırı belirleyen bir primary key (`id`)
        - **Session**'ın ne olduğu: veritabanıyla tek bir konuşma; `add`, `commit` ve `refresh` yaparsın
        - Bir **dependency**'nin (`Depends`) her endpoint'e kendi session'ını verip sonra kapattığı
        - Tablo modeli `Note`'un neden request body olarak kullanılmadığı: istemci `id`'yi seçebilirdi
        - `lifespan`'ın ne olduğu: uygulama başlarken bir kez çalışan kod
    do:
      en: |
        1. Add SQLModel: `uv add sqlmodel`.
        2. Replace `app/models.py` and `app/routers/notes.py`, create `app/db.py`, and replace `app/main.py`, as shown below.
        3. Start `uv run fastapi dev`. A file `notes.db` appears in the project folder: that is your database.
        4. In `/docs` create two notes. Stop the server, start it again and call `GET /notes`: the notes are still there.
        5. Commit: `git add .` and `git commit -m "SQLite with SQLModel"`. The `.gitignore` you made earlier keeps `notes.db` out.
      tr: |
        1. SQLModel'i ekle: `uv add sqlmodel`.
        2. Aşağıda gösterildiği gibi `app/models.py` ve `app/routers/notes.py` dosyalarını değiştir, `app/db.py` dosyasını oluştur ve `app/main.py`'yi değiştir.
        3. `uv run fastapi dev` ile başlat. Proje klasöründe `notes.db` dosyası belirir: veritabanın bu.
        4. `/docs` sayfasında iki not oluştur. Sunucuyu durdur, yeniden başlat ve `GET /notes` çağır: notlar duruyor.
        5. Kaydet: `git add .` ve `git commit -m "SQLite with SQLModel"`. Daha önce yazdığın `.gitignore` `notes.db`'yi dışarıda tutar.
    code:
      - file: terminal
        lang: sh
        text: |
          uv add sqlmodel
      - file: app/models.py
        lang: python
        text: |
          from sqlmodel import Field, SQLModel


          class NoteBase(SQLModel):
              title: str = Field(min_length=1, max_length=100)
              content: str = Field(default="", max_length=2000)
              done: bool = False


          class Note(NoteBase, table=True):
              id: int | None = Field(default=None, primary_key=True)


          class NoteCreate(NoteBase):
              pass


          class NotePublic(NoteBase):
              id: int
      - file: app/db.py
        lang: python
        text: |
          from collections.abc import Iterator
          from typing import Annotated

          from fastapi import Depends
          from sqlmodel import Session, SQLModel, create_engine

          engine = create_engine("sqlite:///notes.db", connect_args={"check_same_thread": False})


          def create_db_and_tables() -> None:
              SQLModel.metadata.create_all(engine)


          def get_session() -> Iterator[Session]:
              with Session(engine) as session:
                  yield session


          SessionDep = Annotated[Session, Depends(get_session)]
      - file: app/routers/notes.py
        lang: python
        text: |
          from fastapi import APIRouter, HTTPException, status
          from sqlmodel import select

          from ..db import SessionDep
          from ..models import Note, NoteCreate, NotePublic

          router = APIRouter(prefix="/notes", tags=["notes"])


          @router.post("", status_code=status.HTTP_201_CREATED)
          def create_note(note: NoteCreate, session: SessionDep) -> NotePublic:
              db_note = Note.model_validate(note)
              session.add(db_note)
              session.commit()
              session.refresh(db_note)
              return db_note


          @router.get("")
          def list_notes(session: SessionDep) -> list[NotePublic]:
              return list(session.exec(select(Note)).all())


          @router.get("/{note_id}")
          def read_note(note_id: int, session: SessionDep) -> NotePublic:
              note = session.get(Note, note_id)
              if note is None:
                  raise HTTPException(status_code=404, detail="Note not found")
              return note


          @router.delete("/{note_id}", status_code=status.HTTP_204_NO_CONTENT)
          def delete_note(note_id: int, session: SessionDep) -> None:
              note = session.get(Note, note_id)
              if note is None:
                  raise HTTPException(status_code=404, detail="Note not found")
              session.delete(note)
              session.commit()
      - file: app/main.py
        lang: python
        text: |
          from contextlib import asynccontextmanager

          from fastapi import FastAPI

          from .db import create_db_and_tables
          from .routers import notes


          @asynccontextmanager
          async def lifespan(app: FastAPI):
              create_db_and_tables()  # runs once, before the first request
              yield


          app = FastAPI(title="Notes API", lifespan=lifespan)
          app.include_router(notes.router)


          @app.get("/")
          def root():
              return {"message": "Hello, notes"}
    mistakes:
      - problem:
          en: "\"SQLite objects created in a thread can only be used in that same thread\"."
          tr: "\"SQLite objects created in a thread can only be used in that same thread\" hatası."
        fix:
          en: "Keep `connect_args={\"check_same_thread\": False}` in `create_engine`. FastAPI runs each request in a thread pool and every request gets its own session, so this is safe for SQLite."
          tr: "`create_engine` içindeki `connect_args={\"check_same_thread\": False}` kalsın. FastAPI her isteği bir thread havuzunda çalıştırır ve her isteğin kendi session'ı vardır; SQLite için bu güvenlidir."
      - problem:
          en: "\"no such table: note\"."
          tr: "\"no such table: note\" hatası."
        fix:
          en: "Tables are only created for models that were imported before `create_all` runs. The router imports the models, so check that `lifespan` is passed to `FastAPI(...)`."
          tr: "Tablolar sadece `create_all` çalışmadan önce import edilmiş modeller için oluşturulur. Router modelleri import eder; o yüzden `lifespan`'ın `FastAPI(...)`'a verildiğini kontrol et."
      - problem:
          en: "Using the table class `Note` as the type of the request body."
          tr: "Tablo sınıfı `Note`'u request body tipi olarak kullanmak."
        fix:
          en: "Use `NoteCreate` for input. Then the client cannot set the `id` or other columns you add later."
          tr: "Girdi için `NoteCreate` kullan. Böylece istemci `id`'yi ya da sonradan ekleyeceğin diğer sütunları ayarlayamaz."
    quiz:
      - q:
          en: "Why do the endpoints get their session from `Depends(get_session)` instead of creating one themselves?"
          tr: "Endpoint'ler session'ı neden kendileri oluşturmak yerine `Depends(get_session)` ile alıyor?"
        options:
          en:
            - "It makes SQLite faster"
            - "FastAPI cannot create sessions inside endpoints"
            - "Each request gets a fresh session that is closed afterwards, and tests can swap it"
          tr:
            - "SQLite'ı hızlandırır"
            - "FastAPI endpoint içinde session oluşturamaz"
            - "Her istek yeni bir session alır, o kapanır ve testlerde değiştirilebilir"
        answer: 2
        why:
          en: "The `yield` in `get_session` opens and closes the session around every request, and the same hook lets tests use a different database."
          tr: "`get_session` içindeki `yield` her isteğin etrafında session'ı açıp kapatır; aynı kanca testlerin başka bir veritabanı kullanmasına da izin verir."
    sources:
      - title: SQL databases (SQLModel) in the FastAPI tutorial
        url: https://fastapi.tiangolo.com/tutorial/sql-databases/
      - title: Lifespan events
        url: https://fastapi.tiangolo.com/advanced/events/
      - title: SQLite, about
        url: https://www.sqlite.org/about.html

  - id: update-filter
    stage: data-api
    title:
      en: "Update, search and page through notes"
      tr: "Notları güncelleme, arama ve sayfalama"
    minutes: 40
    needs: [database]
    why:
      en: "A notes app must let you tick a note as done without sending the whole note again, find notes by a word, and not load ten thousand notes at once. These are the three things almost every list endpoint needs."
      tr: "Bir notlar uygulaması, notun tamamını tekrar göndermeden onu bitti diye işaretlemeye, bir kelimeyle not bulmaya ve on bin notu bir anda yüklememeye izin vermeli. Neredeyse her liste endpoint'inin ihtiyacı olan üç şey bunlar."
    learn:
      en: |
        - PUT replaces a whole note, **PATCH** changes only the fields you send
        - `model_dump(exclude_unset=True)` gives only the fields the client really sent
        - Filtering in SQL with `.where(...)` and searching text with `contains`
        - **Paging** with `offset` and `limit`, always with an `order_by`, and a maximum `limit` so nobody can ask for a million rows
      tr: |
        - PUT notun tamamını değiştirir, **PATCH** sadece gönderdiğin alanları değiştirir
        - `model_dump(exclude_unset=True)` istemcinin gerçekten gönderdiği alanları verir
        - SQL'de `.where(...)` ile süzme ve `contains` ile metin arama
        - `offset` ve `limit` ile **sayfalama**; her zaman bir `order_by` ile ve kimse bir milyon satır isteyemesin diye en fazla `limit` ile
    do:
      en: |
        1. Replace `app/models.py` (it gets a `NoteUpdate` model) and `app/routers/notes.py` with the code below.
        2. In `/docs` create four or five notes with different titles.
        3. Try `GET /notes?done=false`, `GET /notes?q=milk` and `GET /notes?limit=2&offset=2`.
        4. Try `PATCH /notes/1` with the body `{"done": true}`. Only `done` changes; the title stays.
        5. Try `GET /notes?limit=1000`. It answers 422 because the limit is capped at 100.
        6. Commit: `git add .` and `git commit -m "Update, search and paging"`.
      tr: |
        1. `app/models.py` (artık bir `NoteUpdate` modeli var) ve `app/routers/notes.py` dosyalarını aşağıdaki kodla değiştir.
        2. `/docs` sayfasında farklı başlıklarla dört beş not oluştur.
        3. `GET /notes?done=false`, `GET /notes?q=milk` ve `GET /notes?limit=2&offset=2` dene.
        4. `PATCH /notes/1` isteğini `{"done": true}` body'siyle dene. Sadece `done` değişir; başlık aynı kalır.
        5. `GET /notes?limit=1000` dene. Limit 100 ile sınırlı olduğu için 422 döner.
        6. Kaydet: `git add .` ve `git commit -m "Update, search and paging"`.
    code:
      - file: app/models.py
        lang: python
        text: |
          from sqlmodel import Field, SQLModel


          class NoteBase(SQLModel):
              title: str = Field(min_length=1, max_length=100)
              content: str = Field(default="", max_length=2000)
              done: bool = False


          class Note(NoteBase, table=True):
              id: int | None = Field(default=None, primary_key=True)


          class NoteCreate(NoteBase):
              pass


          class NoteUpdate(SQLModel):
              title: str | None = Field(default=None, min_length=1, max_length=100)
              content: str | None = Field(default=None, max_length=2000)
              done: bool | None = None


          class NotePublic(NoteBase):
              id: int
      - file: app/routers/notes.py
        lang: python
        text: |
          from typing import Annotated

          from fastapi import APIRouter, HTTPException, Query, status
          from sqlmodel import col, select

          from ..db import SessionDep
          from ..models import Note, NoteCreate, NotePublic, NoteUpdate

          router = APIRouter(prefix="/notes", tags=["notes"])


          def get_note_or_404(session: SessionDep, note_id: int) -> Note:
              note = session.get(Note, note_id)
              if note is None:
                  raise HTTPException(status_code=404, detail="Note not found")
              return note


          @router.post("", status_code=status.HTTP_201_CREATED)
          def create_note(note: NoteCreate, session: SessionDep) -> NotePublic:
              db_note = Note.model_validate(note)
              session.add(db_note)
              session.commit()
              session.refresh(db_note)
              return db_note


          @router.get("")
          def list_notes(
              session: SessionDep,
              done: bool | None = None,
              q: Annotated[str | None, Query(max_length=50)] = None,
              offset: Annotated[int, Query(ge=0)] = 0,
              limit: Annotated[int, Query(ge=1, le=100)] = 20,
          ) -> list[NotePublic]:
              statement = select(Note)
              if done is not None:
                  statement = statement.where(Note.done == done)
              if q:
                  statement = statement.where(col(Note.title).contains(q))
              statement = statement.order_by(col(Note.id)).offset(offset).limit(limit)
              return list(session.exec(statement).all())


          @router.get("/{note_id}")
          def read_note(note_id: int, session: SessionDep) -> NotePublic:
              return get_note_or_404(session, note_id)


          @router.patch("/{note_id}")
          def update_note(note_id: int, changes: NoteUpdate, session: SessionDep) -> NotePublic:
              note = get_note_or_404(session, note_id)
              note.sqlmodel_update(changes.model_dump(exclude_unset=True, exclude_none=True))
              session.add(note)
              session.commit()
              session.refresh(note)
              return note


          @router.delete("/{note_id}", status_code=status.HTTP_204_NO_CONTENT)
          def delete_note(note_id: int, session: SessionDep) -> None:
              note = get_note_or_404(session, note_id)
              session.delete(note)
              session.commit()
    mistakes:
      - problem:
          en: "A PATCH wipes fields that the client did not send."
          tr: "PATCH, istemcinin göndermediği alanları da siliyor."
        fix:
          en: "Use `changes.model_dump(exclude_unset=True)`. Without `exclude_unset`, every missing field comes back as `None` and overwrites the stored value."
          tr: "`changes.model_dump(exclude_unset=True)` kullan. `exclude_unset` olmazsa eksik her alan `None` olarak gelir ve kayıtlı değerin üstüne yazar."
      - problem:
          en: "Pages overlap or skip notes."
          tr: "Sayfalarda notlar tekrar ediyor ya da atlanıyor."
        fix:
          en: "SQL does not promise any order unless you ask. Always add `order_by` when you use `offset` and `limit`."
          tr: "SQL sen istemedikçe hiçbir sıra garanti etmez. `offset` ve `limit` kullanırken her zaman `order_by` ekle."
    quiz:
      - q:
          en: "A client sends `PATCH /notes/1` with `{\"done\": true}`. What should happen to the title?"
          tr: "İstemci `PATCH /notes/1` isteğini `{\"done\": true}` ile gönderiyor. Başlığa ne olmalı?"
        options:
          en:
            - "It becomes empty"
            - "It stays as it was"
            - "The request fails with 422"
          tr:
            - "Boş olur"
            - "Olduğu gibi kalır"
            - "İstek 422 ile başarısız olur"
        answer: 1
        why:
          en: "PATCH is a partial update: fields that are not sent are left alone."
          tr: "PATCH kısmi bir güncellemedir: gönderilmeyen alanlara dokunulmaz."
    sources:
      - title: Body updates (PUT and PATCH)
        url: https://fastapi.tiangolo.com/tutorial/body-updates/
      - title: SQLModel with FastAPI, read and update
        url: https://sqlmodel.tiangolo.com/tutorial/fastapi/update/
      - title: SQLModel, limit and offset
        url: https://sqlmodel.tiangolo.com/tutorial/limit-and-offset/

  - id: tests
    stage: testing
    title:
      en: "Test the API with pytest and TestClient"
      tr: "API'yi pytest ve TestClient ile test etme"
    minutes: 40
    needs: [update-filter]
    why:
      en: "Clicking through /docs after every change does not scale. A test calls your API in code and checks the answer in less than a second. When you change something later, the tests tell you at once if you broke something else."
      tr: "Her değişiklikten sonra /docs'ta tıklamak ölçeklenmez. Bir test API'ni kodla çağırır ve cevabı bir saniyeden kısa sürede kontrol eder. Sonra bir şey değiştirdiğinde, başka bir şeyi bozup bozmadığını testler hemen söyler."
    learn:
      en: |
        - `pytest` runs every function named `test_...` in the `tests` folder; `assert` is the check
        - `TestClient` calls your app inside the same process, without a running server
        - A **fixture** prepares something for tests (here a clean database), and `dependency_overrides` swaps the real session for a test one
        - Why tests use a separate in-memory database: they must never touch real data
      tr: |
        - `pytest`, `tests` klasöründeki `test_...` adlı her fonksiyonu çalıştırır; `assert` kontrolün kendisidir
        - `TestClient` uygulamanı çalışan bir sunucu olmadan aynı process içinde çağırır
        - **Fixture** testler için bir şey hazırlar (burada temiz bir veritabanı), `dependency_overrides` ise gerçek session'ı test session'ıyla değiştirir
        - Testlerin neden ayrı, bellekte duran bir veritabanı kullandığı: gerçek veriye asla dokunmamalılar
    do:
      en: |
        1. Add the test tools as development packages: the first command below. (`httpx2` is what `TestClient` uses to make requests.)
        2. Open `pyproject.toml` and add the `[tool.pytest.ini_options]` lines at the bottom. They let tests import your `app` package.
        3. Create the folder `tests` with `conftest.py` and `test_notes.py`, as shown. `conftest.py` is a special file: its fixtures are available to every test file.
        4. Run the tests with `uv run pytest`. You should see `7 passed`.
        5. Break something on purpose, for example change `le=100` to `le=10` in `notes.py`, run the tests and read the failure. Then undo it.
        6. Commit: `git add .` and `git commit -m "Tests"`.
      tr: |
        1. Test araçlarını geliştirme paketi olarak ekle: aşağıdaki ilk komut. (`httpx2`, `TestClient`'ın istek yapmak için kullandığı pakettir.)
        2. `pyproject.toml`'u aç ve en alta `[tool.pytest.ini_options]` satırlarını ekle. Testlerin `app` paketini import etmesini sağlarlar.
        3. Gösterildiği gibi `tests` klasörünü oluştur; içine `conftest.py` ve `test_notes.py` koy. `conftest.py` özel bir dosyadır: fixture'ları her test dosyasında kullanılabilir.
        4. Testleri `uv run pytest` ile çalıştır. `7 passed` görmelisin.
        5. Bilerek bir şeyi boz, örneğin `notes.py` içinde `le=100`'ü `le=10` yap, testleri çalıştır ve hatayı oku. Sonra geri al.
        6. Kaydet: `git add .` ve `git commit -m "Tests"`.
    code:
      - file: terminal
        lang: sh
        text: |
          uv add --dev pytest httpx2
      - file: pyproject.toml
        lang: toml
        text: |
          # add this at the bottom of the file
          [tool.pytest.ini_options]
          pythonpath = ["."]
          testpaths = ["tests"]
      - file: tests/conftest.py
        lang: python
        text: |
          from collections.abc import Iterator

          import pytest
          from fastapi.testclient import TestClient
          from sqlmodel import Session, SQLModel, create_engine
          from sqlmodel.pool import StaticPool

          from app.db import get_session
          from app.main import app


          @pytest.fixture(name="session")
          def session_fixture() -> Iterator[Session]:
              # A fresh database in memory for every test: fast, and nothing is left behind.
              engine = create_engine(
                  "sqlite://",
                  connect_args={"check_same_thread": False},
                  poolclass=StaticPool,
              )
              SQLModel.metadata.create_all(engine)
              with Session(engine) as session:
                  yield session


          @pytest.fixture(name="client")
          def client_fixture(session: Session) -> Iterator[TestClient]:
              app.dependency_overrides[get_session] = lambda: session
              yield TestClient(app)
              app.dependency_overrides.clear()
      - file: tests/test_notes.py
        lang: python
        text: |
          from fastapi.testclient import TestClient


          def make_note(client: TestClient, **fields) -> dict:
              body = {"title": "Buy milk", **fields}
              response = client.post("/notes", json=body)
              assert response.status_code == 201
              return response.json()


          def test_create_and_read_note(client: TestClient):
              created = make_note(client, content="2 liters")
              assert created["id"] == 1
              assert created["done"] is False

              response = client.get(f"/notes/{created['id']}")
              assert response.status_code == 200
              assert response.json()["content"] == "2 liters"


          def test_empty_title_is_rejected(client: TestClient):
              response = client.post("/notes", json={"title": ""})
              assert response.status_code == 422


          def test_missing_note_is_404(client: TestClient):
              assert client.get("/notes/999").status_code == 404


          def test_filter_and_search(client: TestClient):
              make_note(client, title="Buy milk", done=True)
              make_note(client, title="Learn FastAPI")

              assert len(client.get("/notes").json()) == 2
              assert len(client.get("/notes", params={"done": True}).json()) == 1
              found = client.get("/notes", params={"q": "fast"}).json()
              assert [n["title"] for n in found] == ["Learn FastAPI"]


          def test_limit_is_capped(client: TestClient):
              assert client.get("/notes", params={"limit": 1000}).status_code == 422


          def test_patch_changes_only_what_is_sent(client: TestClient):
              note = make_note(client, content="2 liters")
              response = client.patch(f"/notes/{note['id']}", json={"done": True})
              assert response.status_code == 200
              assert response.json()["done"] is True
              assert response.json()["content"] == "2 liters"


          def test_delete_note(client: TestClient):
              note = make_note(client)
              assert client.delete(f"/notes/{note['id']}").status_code == 204
              assert client.get(f"/notes/{note['id']}").status_code == 404
      - file: terminal
        lang: sh
        text: |
          uv run pytest
    mistakes:
      - problem:
          en: "`ModuleNotFoundError: No module named 'app'` when running pytest."
          tr: "pytest çalıştırırken `ModuleNotFoundError: No module named 'app'`."
        fix:
          en: "Add `pythonpath = [\".\"]` under `[tool.pytest.ini_options]` in `pyproject.toml` and run `uv run pytest` from the project folder."
          tr: "`pyproject.toml` içinde `[tool.pytest.ini_options]` altına `pythonpath = [\".\"]` ekle ve `uv run pytest`'i proje klasöründen çalıştır."
      - problem:
          en: "Tests leave notes behind in `notes.db`, or one test sees the notes of another."
          tr: "Testler `notes.db` içinde not bırakıyor ya da bir test başka bir testin notlarını görüyor."
        fix:
          en: "The session must be overridden for every test, with a new in-memory database each time, as `conftest.py` does. Never point tests at the real file."
          tr: "Session her test için değiştirilmeli ve her seferinde yeni bir bellek veritabanı kullanılmalı, `conftest.py`'nin yaptığı gibi. Testleri asla gerçek dosyaya yöneltme."
      - problem:
          en: "A warning says `httpx` is deprecated for the TestClient."
          tr: "Bir uyarı, TestClient için `httpx`'in deprecated olduğunu söylüyor."
        fix:
          en: "Install `httpx2` (`uv add --dev httpx2`). The tutorial still says `httpx`, which works, but Starlette now prefers `httpx2`."
          tr: "`httpx2`'yi kur (`uv add --dev httpx2`). Eğitim hâlâ `httpx` diyor ve o da çalışıyor ama Starlette artık `httpx2`'yi tercih ediyor."
    quiz:
      - q:
          en: "Why do the tests use a database in memory?"
          tr: "Testler neden bellekte bir veritabanı kullanıyor?"
        options:
          en:
            - "SQLite on disk does not work with pytest"
            - "FastAPI forbids files in tests"
            - "It is fast and cannot touch your real notes"
          tr:
            - "Diskteki SQLite pytest ile çalışmaz"
            - "FastAPI testlerde dosyayı yasaklar"
            - "Hızlıdır ve gerçek notlarına dokunamaz"
        answer: 2
        why:
          en: "Each test starts with an empty database that disappears afterwards, so tests cannot affect each other or your data."
          tr: "Her test boş bir veritabanıyla başlar ve sonunda o yok olur; böylece testler birbirini ya da verini etkileyemez."
    sources:
      - title: Testing in FastAPI
        url: https://fastapi.tiangolo.com/tutorial/testing/
      - title: Testing dependencies with overrides
        url: https://fastapi.tiangolo.com/advanced/testing-dependencies/
      - title: SQLModel, testing with FastAPI
        url: https://sqlmodel.tiangolo.com/tutorial/fastapi/tests/

  - id: users-hash
    stage: security
    title:
      en: "Users and password hashing"
      tr: "Kullanıcılar ve şifre hash'leme"
    minutes: 40
    needs: [tests]
    why:
      en: "Right now anyone can read and delete every note. To make notes private you first need users. A password must never be stored as it is: if the database leaks, everyone's password leaks. You store a hash instead, a one-way scramble that cannot be turned back."
      tr: "Şu an herkes bütün notları okuyabilir ve silebilir. Notları özel yapmak için önce kullanıcılar lazım. Şifre asla olduğu gibi saklanmaz: veritabanı sızarsa herkesin şifresi sızar. Onun yerine hash saklarsın; geri çevrilemeyen tek yönlü bir karıştırma."
    learn:
      en: |
        - What a **hash** is, and why a password hash must be slow on purpose (Argon2): so that guessing millions of passwords takes too long
        - Why you use a tested library (`pwdlib`) and never write your own
        - Why `UserCreate` (has a password) and `UserPublic` (has none) are different models
        - Why email addresses are saved in lower case and why the same email gets 409 (conflict)
      tr: |
        - **Hash**'in ne olduğu ve şifre hash'inin neden bilerek yavaş olması gerektiği (Argon2): milyonlarca şifre denemek çok uzun sürsün diye
        - Neden test edilmiş bir kütüphane (`pwdlib`) kullandığın ve kendi hash kodunu asla yazmadığın
        - `UserCreate` (şifre var) ve `UserPublic`'in (şifre yok) neden farklı modeller olduğu
        - E-postaların neden küçük harfle kaydedildiği ve aynı e-postanın neden 409 (conflict) aldığı
    do:
      en: |
        1. Add the hashing library: `uv add "pwdlib[argon2]"`.
        2. Replace `app/models.py` (it gets the `User` table and the user models) and `app/main.py`. Create `app/security.py` and `app/routers/auth.py`, all as shown.
        3. Start the server and open `/docs`. Use `POST /auth/register` with `{"email": "ada@example.com", "password": "correct horse battery"}`. The answer has an `id` and the email, and no password.
        4. Register the same email again: 409. Try a password with 5 characters: 422.
        5. Add the new test file `tests/test_auth.py` and run `uv run pytest`. You should see `11 passed`.
        6. Commit: `git add .` and `git commit -m "Users and password hashing"`.
      tr: |
        1. Hash kütüphanesini ekle: `uv add "pwdlib[argon2]"`.
        2. `app/models.py` (artık `User` tablosu ve kullanıcı modelleri var) ve `app/main.py` dosyalarını değiştir. `app/security.py` ve `app/routers/auth.py` dosyalarını oluştur, hepsi gösterildiği gibi.
        3. Sunucuyu başlat ve `/docs`'u aç. `POST /auth/register` isteğini `{"email": "ada@example.com", "password": "correct horse battery"}` ile kullan. Cevapta `id` ve e-posta var, şifre yok.
        4. Aynı e-postayı tekrar kaydet: 409. 5 karakterlik bir şifre dene: 422.
        5. Yeni test dosyası `tests/test_auth.py`'yi ekle ve `uv run pytest` çalıştır. `11 passed` görmelisin.
        6. Kaydet: `git add .` ve `git commit -m "Users and password hashing"`.
    code:
      - file: terminal
        lang: sh
        text: |
          uv add "pwdlib[argon2]"
      - file: app/models.py
        lang: python
        text: |
          from pydantic import EmailStr
          from sqlmodel import Field, SQLModel


          class NoteBase(SQLModel):
              title: str = Field(min_length=1, max_length=100)
              content: str = Field(default="", max_length=2000)
              done: bool = False


          class Note(NoteBase, table=True):
              id: int | None = Field(default=None, primary_key=True)


          class NoteCreate(NoteBase):
              pass


          class NoteUpdate(SQLModel):
              title: str | None = Field(default=None, min_length=1, max_length=100)
              content: str | None = Field(default=None, max_length=2000)
              done: bool | None = None


          class NotePublic(NoteBase):
              id: int


          class User(SQLModel, table=True):
              id: int | None = Field(default=None, primary_key=True)
              email: str = Field(unique=True, index=True, max_length=254)
              hashed_password: str


          class UserCreate(SQLModel):
              email: EmailStr
              password: str = Field(min_length=8, max_length=128)


          class UserPublic(SQLModel):
              id: int
              email: str
      - file: app/security.py
        lang: python
        text: |
          from pwdlib import PasswordHash

          # recommended() uses Argon2, a slow hash made for passwords.
          password_hash = PasswordHash.recommended()


          def hash_password(password: str) -> str:
              return password_hash.hash(password)


          def verify_password(password: str, hashed: str) -> bool:
              return password_hash.verify(password, hashed)
      - file: app/routers/auth.py
        lang: python
        text: |
          from fastapi import APIRouter, HTTPException, status
          from sqlmodel import select

          from ..db import SessionDep
          from ..models import User, UserCreate, UserPublic
          from ..security import hash_password

          router = APIRouter(prefix="/auth", tags=["auth"])


          @router.post("/register", status_code=status.HTTP_201_CREATED)
          def register(data: UserCreate, session: SessionDep) -> UserPublic:
              email = data.email.lower()
              if session.exec(select(User).where(User.email == email)).first():
                  raise HTTPException(status_code=409, detail="Email already registered")
              user = User(email=email, hashed_password=hash_password(data.password))
              session.add(user)
              session.commit()
              session.refresh(user)
              return user
      - file: app/main.py
        lang: python
        text: |
          from contextlib import asynccontextmanager

          from fastapi import FastAPI

          from .db import create_db_and_tables
          from .routers import auth, notes


          @asynccontextmanager
          async def lifespan(app: FastAPI):
              create_db_and_tables()  # runs once, before the first request
              yield


          app = FastAPI(title="Notes API", lifespan=lifespan)
          app.include_router(auth.router)
          app.include_router(notes.router)


          @app.get("/")
          def root():
              return {"message": "Hello, notes"}
      - file: tests/test_auth.py
        lang: python
        text: |
          from fastapi.testclient import TestClient
          from sqlmodel import Session, select

          from app.models import User

          USER = {"email": "Ada@Example.com", "password": "correct horse battery"}


          def test_register_hides_the_password(client: TestClient):
              response = client.post("/auth/register", json=USER)
              assert response.status_code == 201
              assert response.json() == {"id": 1, "email": "ada@example.com"}


          def test_password_is_stored_as_a_hash(client: TestClient, session: Session):
              client.post("/auth/register", json=USER)
              user = session.exec(select(User)).one()
              assert user.hashed_password != USER["password"]
              assert user.hashed_password.startswith("$argon2")


          def test_same_email_twice_is_409(client: TestClient):
              client.post("/auth/register", json=USER)
              again = client.post("/auth/register", json={**USER, "email": "ada@example.com"})
              assert again.status_code == 409


          def test_short_password_is_422(client: TestClient):
              response = client.post("/auth/register", json={**USER, "password": "short"})
              assert response.status_code == 422
    mistakes:
      - problem:
          en: "Saving the password as it is, or hashing it with a fast hash such as SHA-256."
          tr: "Şifreyi olduğu gibi kaydetmek ya da SHA-256 gibi hızlı bir hash ile hash'lemek."
        fix:
          en: "Fast hashes can be guessed billions of times per second. Use a password hash from a library: `PasswordHash.recommended()` gives Argon2."
          tr: "Hızlı hash'ler saniyede milyarlarca kez denenebilir. Kütüphaneden bir şifre hash'i kullan: `PasswordHash.recommended()` Argon2 verir."
      - problem:
          en: "Returning the `User` table object, so the hash goes out in the response."
          tr: "`User` tablo nesnesini döndürüp hash'in cevapla birlikte dışarı gitmesi."
        fix:
          en: "Always declare the output model: `-> UserPublic`. FastAPI then sends only `id` and `email`."
          tr: "Çıktı modelini her zaman belirt: `-> UserPublic`. FastAPI o zaman sadece `id` ve `email` gönderir."
      - problem:
          en: "`Ada@Example.com` and `ada@example.com` become two accounts."
          tr: "`Ada@Example.com` ve `ada@example.com` iki ayrı hesap oluyor."
        fix:
          en: "Lower-case the email before you save and before you look it up, as `register` does."
          tr: "E-postayı kaydetmeden önce ve ararken küçük harfe çevir, `register`'ın yaptığı gibi."
    quiz:
      - q:
          en: "Why is a password hash made slow on purpose?"
          tr: "Şifre hash'i neden bilerek yavaş yapılır?"
        options:
          en:
            - "To save memory on the server"
            - "So an attacker with a leaked database needs far too long to guess passwords"
            - "To make login pages look busy"
          tr:
            - "Sunucuda bellek tasarrufu için"
            - "Veritabanını ele geçiren saldırganın şifreleri tahmin etmesi çok uzun sürsün diye"
            - "Giriş sayfaları meşgul görünsün diye"
        answer: 1
        why:
          en: "One login costs you a few milliseconds, but a guesser who must try billions of passwords pays that price every time."
          tr: "Tek bir giriş sana birkaç milisaniyeye mal olur ama milyarlarca şifre deneyen biri bu bedeli her denemede öder."
    sources:
      - title: OAuth2 with password hashing and JWT (pwdlib)
        url: https://fastapi.tiangolo.com/tutorial/security/oauth2-jwt/
      - title: OWASP password storage cheat sheet
        url: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html

  - id: login-token
    stage: security
    title:
      en: "Settings, login and tokens"
      tr: "Ayarlar, giriş ve token'lar"
    minutes: 55
    needs: [users-hash]
    why:
      en: "After the login the user must not send the password with every request. Instead the server gives a signed token, and the user sends the token. Signing needs a secret key, and a secret must never live in your code or in Git, so you also learn to read settings from the environment."
      tr: "Girişten sonra kullanıcı her istekte şifreyi göndermemeli. Bunun yerine sunucu imzalı bir token verir ve kullanıcı token'ı gönderir. İmzalamak için gizli bir anahtar gerekir ve gizli anahtar asla kodda ya da Git'te durmamalı; o yüzden ayarları ortam değişkenlerinden okumayı da öğrenirsin."
    learn:
      en: |
        - What a **JWT** is: a small signed text with the user id and an expiry time. The server can check the signature but nobody can forge it without the secret key
        - How `OAuth2PasswordBearer` makes the **Authorize** button appear in `/docs` and reads the `Authorization: Bearer ...` header
        - What an **environment variable** is, and how `pydantic-settings` reads them (and a `.env` file) with type checks
        - Why a wrong email and a wrong password get the same answer, and why the code hashes a dummy password for an unknown email
        - 401 means "I do not know who you are"
      tr: |
        - **JWT**'nin ne olduğu: kullanıcı id'sini ve bitiş zamanını taşıyan küçük imzalı bir metin. Sunucu imzayı kontrol edebilir ama gizli anahtar olmadan kimse sahtesini üretemez
        - `OAuth2PasswordBearer`'ın `/docs`'ta **Authorize** düğmesini nasıl çıkardığı ve `Authorization: Bearer ...` header'ını nasıl okuduğu
        - **Ortam değişkeni**nin ne olduğu ve `pydantic-settings`'in bunları (ve bir `.env` dosyasını) tip kontrolüyle nasıl okuduğu
        - Yanlış e-posta ile yanlış şifrenin neden aynı cevabı aldığı ve bilinmeyen e-posta için kodun neden sahte bir şifreyi hash'lediği
        - 401 "kim olduğunu bilmiyorum" demektir
    do:
      en: |
        1. Add the token library: `uv add pyjwt`.
        2. Create `app/settings.py`. Replace `app/db.py`, `app/models.py` (it gets a `Token` model), `app/security.py` and `app/routers/auth.py`, as shown.
        3. Make a secret key with the second command below, copy the long text it prints, and create a file `.env` in the project folder with one line: `SECRET_KEY=` followed by that text. The `.gitignore` you wrote in the first steps keeps `.env` out of Git. Never share this value.
        4. Replace `tests/conftest.py` (it sets a test secret before the app loads) and add `tests/test_login.py`. Run `uv run pytest`. You should see `16 passed`.
        5. Start the server. In `/docs` register a user (or reuse the one from the last step), then click **Authorize** at the top right and enter the email as *username* and the password. Then call `GET /auth/me`: it shows your user.
        6. Stop the server, remove the `.env` file for a moment and start again: the app refuses to start and says `secret_key` is required. Put the file back. That is the point: no secret, no start.
        7. Commit: `git add .` and `git commit -m "Login with tokens"`.
      tr: |
        1. Token kütüphanesini ekle: `uv add pyjwt`.
        2. `app/settings.py` dosyasını oluştur. `app/db.py`, `app/models.py` (artık bir `Token` modeli var), `app/security.py` ve `app/routers/auth.py` dosyalarını gösterildiği gibi değiştir.
        3. Aşağıdaki ikinci komutla bir gizli anahtar üret, yazdığı uzun metni kopyala ve proje klasöründe tek satırlık bir `.env` dosyası oluştur: `SECRET_KEY=` ve hemen ardından o metin. İlk adımlarda yazdığın `.gitignore` `.env`'i Git'in dışında tutar. Bu değeri kimseyle paylaşma.
        4. `tests/conftest.py` dosyasını değiştir (uygulama yüklenmeden önce test için bir gizli anahtar ayarlar) ve `tests/test_login.py` dosyasını ekle. `uv run pytest` çalıştır. `16 passed` görmelisin.
        5. Sunucuyu başlat. `/docs`'ta bir kullanıcı kaydet (ya da önceki adımdakini kullan), sonra sağ üstteki **Authorize**'a tıkla ve *username* olarak e-postayı, şifreyi gir. Sonra `GET /auth/me` çağır: kullanıcını gösterir.
        6. Sunucuyu durdur, `.env` dosyasını bir an kaldır ve tekrar başlat: uygulama başlamayı reddeder ve `secret_key` gerekli der. Dosyayı geri koy. Mesele bu: gizli anahtar yoksa başlamaz.
        7. Kaydet: `git add .` ve `git commit -m "Login with tokens"`.
    code:
      - file: terminal
        lang: sh
        text: |
          uv add pyjwt
      - file: terminal
        lang: sh
        text: |
          uv run python -c "import secrets; print(secrets.token_urlsafe(32))"
      - file: app/settings.py
        lang: python
        text: |
          from functools import lru_cache

          from pydantic_settings import BaseSettings, SettingsConfigDict


          class Settings(BaseSettings):
              model_config = SettingsConfigDict(env_file=".env")

              secret_key: str  # no default on purpose: the app refuses to start without it
              database_url: str = "sqlite:///notes.db"
              access_token_minutes: int = 60
              cors_origins: list[str] = []


          @lru_cache
          def get_settings() -> Settings:
              return Settings()
      - file: app/db.py
        lang: python
        text: |
          from collections.abc import Iterator
          from typing import Annotated

          from fastapi import Depends
          from sqlmodel import Session, SQLModel, create_engine

          from .settings import get_settings

          database_url = get_settings().database_url
          # check_same_thread is a SQLite-only option.
          connect_args = {"check_same_thread": False} if database_url.startswith("sqlite") else {}
          engine = create_engine(database_url, connect_args=connect_args)


          def create_db_and_tables() -> None:
              SQLModel.metadata.create_all(engine)


          def get_session() -> Iterator[Session]:
              with Session(engine) as session:
                  yield session


          SessionDep = Annotated[Session, Depends(get_session)]
      - file: app/models.py
        lang: python
        text: |
          from pydantic import EmailStr
          from sqlmodel import Field, SQLModel


          class NoteBase(SQLModel):
              title: str = Field(min_length=1, max_length=100)
              content: str = Field(default="", max_length=2000)
              done: bool = False


          class Note(NoteBase, table=True):
              id: int | None = Field(default=None, primary_key=True)


          class NoteCreate(NoteBase):
              pass


          class NoteUpdate(SQLModel):
              title: str | None = Field(default=None, min_length=1, max_length=100)
              content: str | None = Field(default=None, max_length=2000)
              done: bool | None = None


          class NotePublic(NoteBase):
              id: int


          class User(SQLModel, table=True):
              id: int | None = Field(default=None, primary_key=True)
              email: str = Field(unique=True, index=True, max_length=254)
              hashed_password: str


          class UserCreate(SQLModel):
              email: EmailStr
              password: str = Field(min_length=8, max_length=128)


          class UserPublic(SQLModel):
              id: int
              email: str


          class Token(SQLModel):
              access_token: str
              token_type: str = "bearer"
      - file: app/security.py
        lang: python
        text: |
          from datetime import datetime, timedelta, timezone
          from typing import Annotated

          import jwt
          from fastapi import Depends, HTTPException, status
          from fastapi.security import OAuth2PasswordBearer
          from jwt.exceptions import InvalidTokenError
          from pwdlib import PasswordHash

          from .db import SessionDep
          from .models import User
          from .settings import get_settings

          # recommended() uses Argon2, a slow hash made for passwords.
          password_hash = PasswordHash.recommended()
          # Used to spend the same time when the email is unknown (see the login route).
          DUMMY_HASH = password_hash.hash("not-a-real-password")

          ALGORITHM = "HS256"
          oauth2_scheme = OAuth2PasswordBearer(tokenUrl="auth/token")


          def hash_password(password: str) -> str:
              return password_hash.hash(password)


          def verify_password(password: str, hashed: str) -> bool:
              return password_hash.verify(password, hashed)


          def create_access_token(user_id: int) -> str:
              settings = get_settings()
              expires = datetime.now(timezone.utc) + timedelta(minutes=settings.access_token_minutes)
              claims = {"sub": str(user_id), "exp": expires}  # "sub" must be a string
              return jwt.encode(claims, settings.secret_key, algorithm=ALGORITHM)


          def get_current_user(
              token: Annotated[str, Depends(oauth2_scheme)], session: SessionDep
          ) -> User:
              unauthorized = HTTPException(
                  status_code=status.HTTP_401_UNAUTHORIZED,
                  detail="Could not validate credentials",
                  headers={"WWW-Authenticate": "Bearer"},
              )
              try:
                  payload = jwt.decode(token, get_settings().secret_key, algorithms=[ALGORITHM])
                  user_id = int(payload["sub"])
              except (InvalidTokenError, KeyError, ValueError):
                  raise unauthorized
              user = session.get(User, user_id)
              if user is None:
                  raise unauthorized
              return user


          CurrentUser = Annotated[User, Depends(get_current_user)]
      - file: app/routers/auth.py
        lang: python
        text: |
          from typing import Annotated

          from fastapi import APIRouter, Depends, HTTPException, status
          from fastapi.security import OAuth2PasswordRequestForm
          from sqlmodel import select

          from ..db import SessionDep
          from ..models import Token, User, UserCreate, UserPublic
          from ..security import (
              DUMMY_HASH,
              CurrentUser,
              create_access_token,
              hash_password,
              verify_password,
          )

          router = APIRouter(prefix="/auth", tags=["auth"])


          @router.post("/register", status_code=status.HTTP_201_CREATED)
          def register(data: UserCreate, session: SessionDep) -> UserPublic:
              email = data.email.lower()
              if session.exec(select(User).where(User.email == email)).first():
                  raise HTTPException(status_code=409, detail="Email already registered")
              user = User(email=email, hashed_password=hash_password(data.password))
              session.add(user)
              session.commit()
              session.refresh(user)
              return user


          @router.post("/token")
          def login(
              form: Annotated[OAuth2PasswordRequestForm, Depends()], session: SessionDep
          ) -> Token:
              # The form field is called "username" by the OAuth2 standard; we put the email in it.
              user = session.exec(select(User).where(User.email == form.username.lower())).first()
              if user is None:
                  verify_password(form.password, DUMMY_HASH)  # same time as a wrong password
                  valid = False
              else:
                  valid = verify_password(form.password, user.hashed_password)
              if user is None or not valid:
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail="Incorrect email or password",
                      headers={"WWW-Authenticate": "Bearer"},
                  )
              assert user.id is not None
              return Token(access_token=create_access_token(user.id))


          @router.get("/me")
          def me(user: CurrentUser) -> UserPublic:
              return user
