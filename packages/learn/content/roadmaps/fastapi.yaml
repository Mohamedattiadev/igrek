          en: "\"no such column: note.owner_id\" after the change."
          tr: "Değişiklikten sonra \"no such column: note.owner_id\" hatası."
        fix:
          en: "`create_all` only creates missing tables, it never changes an existing one. Delete `notes.db` while developing. For real data use migrations (Alembic)."
          tr: "`create_all` sadece eksik tabloları oluşturur, var olanı asla değiştirmez. Geliştirirken `notes.db`'yi sil. Gerçek veri için migration kullan (Alembic)."
      - problem:
          en: "Reading a note by id without checking the owner: anyone can read any note by trying ids."
          tr: "Bir notu sahibini kontrol etmeden id ile okumak: id deneyerek herkes her notu okuyabilir."
        fix:
          en: "Check `note.owner_id == user.id` in one shared function (`get_own_note`) used by read, update and delete, so you cannot forget it in one of them."
          tr: "`note.owner_id == user.id` kontrolünü okuma, güncelleme ve silmenin kullandığı tek bir ortak fonksiyonda (`get_own_note`) yap; böylece birinde unutmazsın."
      - problem:
          en: "Setting `allow_origins=[\"*\"]` to make a CORS error go away."
          tr: "Bir CORS hatasını gidermek için `allow_origins=[\"*\"]` yazmak."
        fix:
          en: "List the exact addresses of your frontend. Also remember that CORS is only a browser rule: login and the owner checks are what protect the data."
          tr: "Frontend'inin tam adreslerini listele. Ayrıca CORS'un sadece bir tarayıcı kuralı olduğunu unutma: veriyi koruyan şey giriş ve sahip kontrolleridir."
    quiz:
      - q:
          en: "User B asks for the note of user A by its id. What should the API answer?"
          tr: "B kullanıcısı, A kullanıcısının notunu id ile istiyor. API ne cevap vermeli?"
        options:
          en:
            - "200 with the note, since the id is right"
            - "404, the same as for a note that does not exist"
            - "500, because something is wrong"
          tr:
            - "id doğru olduğu için notla birlikte 200"
            - "404, var olmayan bir not için verilenle aynı"
            - "Bir şey ters gittiği için 500"
        answer: 1
        why:
          en: "A 404 tells nothing about whether the id exists, so the caller cannot map other users' notes."
          tr: "404, id'nin var olup olmadığı hakkında bir şey söylemez; böylece çağıran başka kullanıcıların notlarını çıkaramaz."
