  - id: export-next
    stage: advanced
    title:
      en: "Stream an export and plan the next steps"
      tr: "Dışa aktarmayı akıtma ve sonraki adımları planlama"
    minutes: 35
    needs: [health-logs]
    why:
      en: "Your API is complete and live. This last step adds a feature that only newer FastAPI can do in a few lines, an export that sends notes one by one, and then shows what to learn next to make the API ready for real users."
      tr: "API'n tamam ve canlıda. Bu son adım, sadece yeni FastAPI'nin birkaç satırda yapabildiği bir özellik ekler: notları tek tek gönderen bir dışa aktarma. Sonra API'yi gerçek kullanıcılara hazırlamak için sırada ne öğreneceğini gösterir."
    learn:
      en: |
        - **Streaming**: an endpoint that gives (`yield`s) items one at a time sends them as **JSON Lines**, one JSON object per line, so a huge export never has to fit in memory (FastAPI 0.134 and newer)
        - Why route order matters: `/notes/export` must be written before `/notes/{note_id}`, or "export" is read as a note id
        - What to learn next: migrations with Alembic (change tables without losing data), a real database such as PostgreSQL for data that must stay, rate limiting, and a background job queue
      tr: |
        - **Streaming**: öğeleri tek tek veren (`yield`) bir endpoint onları **JSON Lines** olarak gönderir, satır başına bir JSON nesnesi; böylece dev bir dışa aktarma belleğe sığmak zorunda kalmaz (FastAPI 0.134 ve yeni)
        - Route sırasının neden önemli olduğu: `/notes/export`, `/notes/{note_id}`'den önce yazılmalı, yoksa "export" bir not id'si sanılır
        - Sırada ne öğreneceğin: Alembic ile migration (tabloları veri kaybetmeden değiştirme), kalması gereken veri için PostgreSQL gibi gerçek bir veritabanı, rate limiting ve arka plan iş kuyruğu
    do:
      en: |
        1. Replace `app/routers/notes.py` with the code below. The new `export_notes` function sits above `read_note` and returns an iterator of notes.
        2. Add `tests/test_export.py` and run `uv run pytest`. You should see `22 passed`.
        3. Start the server, log in with **Authorize**, create a few notes and call `GET /notes/export`. Each note is its own line.
        4. Move `export_notes` below `read_note` and call it again: it answers 422 because "export" is not a number. Put it back.
        5. Commit and push: `git add .`, `git commit -m "Export notes as JSON Lines"`, `git push`. Render deploys it.
        6. Plan the next steps. To keep data on the free tier, create a Render Postgres database (free ones expire after 30 days, so check the current rules) or any other hosted PostgreSQL, add `psycopg[binary]` with `uv add`, regenerate `requirements.txt`, and set the `DATABASE_URL` environment variable to its address in the form `postgresql+psycopg://...`. The code already reads `DATABASE_URL` from the settings. Add Alembic before you change tables in a real database.
      tr: |
        1. `app/routers/notes.py` dosyasını aşağıdaki kodla değiştir. Yeni `export_notes` fonksiyonu `read_note`'un üstünde durur ve notların bir iterator'ını döndürür.
        2. `tests/test_export.py` dosyasını ekle ve `uv run pytest` çalıştır. `22 passed` görmelisin.
        3. Sunucuyu başlat, **Authorize** ile giriş yap, birkaç not oluştur ve `GET /notes/export` çağır. Her not ayrı bir satırdır.
        4. `export_notes`'u `read_note`'un altına taşı ve tekrar çağır: "export" bir sayı olmadığı için 422 verir. Geri koy.
        5. Kaydet ve push et: `git add .`, `git commit -m "Export notes as JSON Lines"`, `git push`. Render deploy eder.
        6. Sonraki adımları planla. Ücretsiz planda veriyi saklamak için bir Render Postgres veritabanı oluştur (ücretsiz olanlar 30 gün sonra sona erer, güncel kurallara bak) ya da başka bir barındırılan PostgreSQL kullan, `uv add` ile `psycopg[binary]` ekle, `requirements.txt`'i yeniden üret ve `DATABASE_URL` ortam değişkenini `postgresql+psycopg://...` biçimindeki adresine ayarla. Kod `DATABASE_URL`'yi zaten ayarlardan okuyor. Gerçek bir veritabanında tabloları değiştirmeden önce Alembic ekle.
    code:
      - file: app/routers/notes.py
        lang: python
        text: |
          from collections.abc import Iterator
          from typing import Annotated

          from fastapi import APIRouter, HTTPException, Query, status
          from sqlmodel import col, select

          from ..db import SessionDep
          from ..models import Note, NoteCreate, NotePublic, NoteUpdate, User
          from ..security import CurrentUser

          router = APIRouter(prefix="/notes", tags=["notes"])


          def get_own_note(session: SessionDep, note_id: int, user: User) -> Note:
              note = session.get(Note, note_id)
              # Someone else's note gets the same 404 as a missing one, so ids are not revealed.
              if note is None or note.owner_id != user.id:
                  raise HTTPException(status_code=404, detail="Note not found")
              return note


          @router.post("", status_code=status.HTTP_201_CREATED)
          def create_note(note: NoteCreate, session: SessionDep, user: CurrentUser) -> NotePublic:
              db_note = Note.model_validate(note, update={"owner_id": user.id})
              session.add(db_note)
              session.commit()
              session.refresh(db_note)
              return db_note


          @router.get("")
          def list_notes(
              session: SessionDep,
              user: CurrentUser,
              done: bool | None = None,
              q: Annotated[str | None, Query(max_length=50)] = None,
              offset: Annotated[int, Query(ge=0)] = 0,
              limit: Annotated[int, Query(ge=1, le=100)] = 20,
          ) -> list[NotePublic]:
              statement = select(Note).where(Note.owner_id == user.id)
              if done is not None:
                  statement = statement.where(Note.done == done)
              if q:
                  statement = statement.where(col(Note.title).contains(q))
              statement = statement.order_by(col(Note.id)).offset(offset).limit(limit)
              return list(session.exec(statement).all())


          # This route must come BEFORE /{note_id}, or "export" would be read as a note id.
          @router.get("/export")
          def export_notes(session: SessionDep, user: CurrentUser) -> Iterator[NotePublic]:
              """Every note of the user, sent one by one as JSON Lines."""
              statement = select(Note).where(Note.owner_id == user.id).order_by(col(Note.id))
              for note in session.exec(statement):
                  yield NotePublic.model_validate(note)


          @router.get("/{note_id}")
          def read_note(note_id: int, session: SessionDep, user: CurrentUser) -> NotePublic:
              return get_own_note(session, note_id, user)


          @router.patch("/{note_id}")
          def update_note(
              note_id: int, changes: NoteUpdate, session: SessionDep, user: CurrentUser
          ) -> NotePublic:
              note = get_own_note(session, note_id, user)
              note.sqlmodel_update(changes.model_dump(exclude_unset=True, exclude_none=True))
              session.add(note)
              session.commit()
              session.refresh(note)
              return note


          @router.delete("/{note_id}", status_code=status.HTTP_204_NO_CONTENT)
          def delete_note(note_id: int, session: SessionDep, user: CurrentUser) -> None:
              note = get_own_note(session, note_id, user)
              session.delete(note)
              session.commit()
      - file: tests/test_export.py
        lang: python
        text: |
          import json

          from fastapi.testclient import TestClient


          def test_export_streams_one_json_object_per_line(client: TestClient, auth: dict):
              for title in ["First", "Second", "Third"]:
                  client.post("/notes", json={"title": title}, headers=auth)

              response = client.get("/notes/export", headers=auth)

              assert response.status_code == 200
              lines = response.text.splitlines()
              assert [json.loads(line)["title"] for line in lines] == ["First", "Second", "Third"]
    mistakes:
      - problem:
          en: "`GET /notes/export` answers 422 \"Input should be a valid integer\"."
          tr: "`GET /notes/export` 422 \"Input should be a valid integer\" cevabı veriyor."
        fix:
          en: "The route `/notes/{note_id}` is declared first and catches \"export\". Declare fixed paths before paths with parameters."
          tr: "`/notes/{note_id}` route'u önce tanımlanmış ve \"export\"u yakalıyor. Sabit path'leri parametreli path'lerden önce tanımla."
      - problem:
          en: "A client expects one JSON array but gets lines."
          tr: "İstemci tek bir JSON dizisi bekliyor ama satırlar geliyor."
        fix:
          en: "JSON Lines is one JSON object per line (`application/jsonl`). Read it line by line, and use `GET /notes` when you want a normal list."
          tr: "JSON Lines satır başına bir JSON nesnesidir (`application/jsonl`). Satır satır oku; normal liste istiyorsan `GET /notes` kullan."
    quiz:
      - q:
          en: "Why is a streamed export better than returning one big list for a user with a million notes?"
          tr: "Bir milyon notu olan kullanıcı için akıtılan dışa aktarma neden tek büyük liste döndürmekten iyi?"
        options:
          en:
            - "Streaming makes the database faster"
            - "JSON Lines is encrypted"
            - "The server sends notes as it reads them and does not hold them all in memory"
          tr:
            - "Streaming veritabanını hızlandırır"
            - "JSON Lines şifrelidir"
            - "Sunucu notları okudukça gönderir ve hepsini bellekte tutmaz"
        answer: 2
        why:
          en: "Memory use stays small and the client can start reading before the end."
          tr: "Bellek kullanımı küçük kalır ve istemci bitmeden okumaya başlayabilir."
