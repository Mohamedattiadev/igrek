  - id: tests
    stage: testing
    title:
      en: "Test the code and the page"
      tr: "Kodu ve sayfayı test etme"
    minutes: 60
    needs: [fetch]
    why:
      en: "Every change can break something you are not looking at. A test checks in a second what you would check by hand in five minutes. Node.js has a test runner built in, so you need no extra packages."
      tr: "Her değişiklik bakmadığın bir yeri bozabilir. Bir test, elle beş dakikada kontrol edeceğin şeyi bir saniyede kontrol eder. Node.js'in test çalıştırıcısı hazır gelir; ek paket gerekmez."
    learn:
      en: |
        - `node:test` (`test`) and `node:assert` (`assert.deepEqual`, `assert.rejects`)
        - Testing pure functions with plain data, and replacing `fetch` with a fake
        - Why `package.json` has `"type": "module"` (so Node reads `import` like the browser)
        - Manual testing with the browser's tools: Console, Network, device toolbar
      tr: |
        - `node:test` (`test`) ve `node:assert` (`assert.deepEqual`, `assert.rejects`)
        - Saf fonksiyonları düz verilerle test etmek ve `fetch`'i sahte bir fonksiyonla değiştirmek
        - `package.json` içinde neden `"type": "module"` olduğu (Node'un `import`'u tarayıcı gibi okuması için)
        - Tarayıcı araçlarıyla elle test: Console, Network, cihaz araç çubuğu
    do:
      en: |
        1. Create `package.json` in the project folder with the code below. It installs nothing; it only tells Node to treat `.js` files as modules and adds a `test` command.
        2. Create the folder `test` and the file `test/repos.test.js` with the code below.
        3. Run `npm test`. You should see 5 passing tests.
        4. Break the code on purpose: in `js/repos.js` remove `!repo.fork &&`. Run `npm test`: one test fails and shows which. Put it back.
        5. Do the manual check once, with the page open: the Console has no red errors, the Network tab shows the call to `api.github.com` with status 200, and the device toolbar shows a good layout on a small phone.
        6. Add a `.gitignore` file with the lines `node_modules` and `_site`, then commit: `git add .` and `git commit -m "Add tests"`.
      tr: |
        1. Proje klasöründe aşağıdaki kodla `package.json` oluştur. Hiçbir şey kurmaz; sadece Node'a `.js` dosyalarını modül saymasını söyler ve bir `test` komutu ekler.
        2. `test` klasörünü ve aşağıdaki kodla `test/repos.test.js` dosyasını oluştur.
        3. `npm test` çalıştır. 5 testin geçtiğini görmelisin.
        4. Kodu bilerek boz: `js/repos.js` içinde `!repo.fork &&` kısmını sil. `npm test` çalıştır: bir test kırılır ve hangisi olduğunu gösterir. Geri koy.
        5. Elle kontrolü bir kez yap, sayfa açıkken: Console'da kırmızı hata yok, Network sekmesinde `api.github.com` çağrısı 200 durumuyla görünüyor, cihaz araç çubuğunda küçük telefonda düzen iyi.
        6. `node_modules` ve `_site` satırlarını içeren bir `.gitignore` dosyası ekle, sonra commit et: `git add .` ve `git commit -m "Add tests"`.
    code:
      - file: package.json
        lang: json
        text: |
          {
            "name": "personal-site",
            "private": true,
            "type": "module",
            "scripts": {
              "test": "node --test"
            }
          }
      - file: test/repos.test.js
        lang: js
        text: |
          import assert from "node:assert/strict";
          import { test } from "node:test";
          import { loadRepos, pickRepos } from "../js/repos.js";

          // A fake GitHub repository; each test changes only what it cares about.
          const repo = (changes = {}) => ({
            name: "site",
            description: "A site",
            html_url: "https://github.com/me/site",
            language: "JavaScript",
            stargazers_count: 0,
            pushed_at: "2026-01-01T00:00:00Z",
            fork: false,
            archived: false,
            ...changes,
          });

          test("skips forks and archived repositories", () => {
            const list = [
              repo({ name: "mine" }),
              repo({ name: "copy", fork: true }),
              repo({ name: "old", archived: true }),
            ];
            assert.deepEqual(pickRepos(list).map((r) => r.name), ["mine"]);
          });

          test("puts the most starred first", () => {
            const list = [
              repo({ name: "a", stargazers_count: 1 }),
              repo({ name: "b", stargazers_count: 5 }),
            ];
            assert.deepEqual(pickRepos(list).map((r) => r.name), ["b", "a"]);
          });

          test("keeps at most six and fills a missing description", () => {
            const list = Array.from({ length: 10 }, (_, i) =>
              repo({ name: `r${i}`, description: null }),
            );
            const picked = pickRepos(list);
            assert.equal(picked.length, 6);
            assert.equal(picked[0].description, "No description yet.");
          });

          test("loadRepos asks the GitHub API for the user", async () => {
            let asked = "";
            const fake = async (address) => {
              asked = address;
              return { ok: true, json: async () => [repo()] };
            };
            const repos = await loadRepos("me", fake);
            assert.equal(asked, "https://api.github.com/users/me/repos?per_page=100");
            assert.equal(repos[0].name, "site");
          });

          test("loadRepos throws when GitHub says no", async () => {
            const fake = async () => ({ ok: false, status: 403 });
            await assert.rejects(loadRepos("me", fake), /403/);
          });
    mistakes:
      - problem:
          en: "\"Cannot use import statement outside a module\" when running `npm test`."
          tr: "`npm test` çalıştırınca \"Cannot use import statement outside a module\" hatası."
        fix:
          en: "`package.json` is missing `\"type\": \"module\"`, or you run the command in the wrong folder. Run it where `package.json` is."
          tr: "`package.json` içinde `\"type\": \"module\"` eksik ya da komutu yanlış klasörde çalıştırıyorsun. `package.json`'ın olduğu yerde çalıştır."
      - problem:
          en: "A test that calls the real GitHub API."
          tr: "Gerçek GitHub API'sini çağıran bir test."
        fix:
          en: "It is slow, it fails without internet and it uses your rate limit. Pass a fake `fetch` function instead, as the tests above do."
          tr: "Yavaştır, internet yokken kırılır ve istek limitini harcar. Yukarıdaki testler gibi sahte bir `fetch` fonksiyonu ver."
      - problem:
          en: "`assert.rejects` is used without `await` and the test passes even when the code is wrong."
          tr: "`assert.rejects` `await` olmadan kullanılıyor ve kod yanlış olsa bile test geçiyor."
        fix:
          en: "It returns a Promise. Write `await assert.rejects(...)` inside an `async` test."
          tr: "Bir Promise döndürür. `async` test içinde `await assert.rejects(...)` yaz."
    quiz:
      - q:
          en: "Why do the tests pass a fake function to `loadRepos`?"
          tr: "Testler `loadRepos`'a neden sahte bir fonksiyon veriyor?"
        options:
          en: [So the test is fast, works offline and does not depend on GitHub, Because fetch does not exist in Node.js, To make the code shorter]
          tr: [Test hızlı olsun, internetsiz çalışsın ve GitHub'a bağlı olmasın, Node.js'te fetch olmadığı için, Kod kısalsın diye]
        answer: 0
        why:
          en: "A good test gives the same answer every time. The real network can be slow, down or rate-limited."
          tr: "İyi bir test her seferinde aynı cevabı verir. Gerçek ağ yavaş, kapalı ya da sınırlı olabilir."
    sources:
      - title: "Node.js: test runner"
        url: https://nodejs.org/api/test.html
      - title: "Node.js: assert"
        url: https://nodejs.org/api/assert.html
      - title: "MDN: Debugging HTML, CSS and JavaScript with the browser tools"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Tools_and_setup/What_are_browser_developer_tools

  - id: security
    stage: security
    title:
      en: "Keep the site and its visitors safe"
      tr: "Siteyi ve ziyaretçileri güvende tutma"
    minutes: 45
    needs: [tests]
    why:
      en: "Your page shows text written by other people (repository descriptions). If that text could run as code, an attacker could steal data or trick visitors. This attack is called XSS (cross-site scripting). A static site has few risks, but these few habits close the main doors."
      tr: "Sayfan başkalarının yazdığı metinleri gösteriyor (repo açıklamaları). Bu metin kod olarak çalışabilseydi, bir saldırgan veri çalabilir ya da ziyaretçileri kandırabilirdi. Bu saldırıya XSS (cross-site scripting) denir. Statik sitenin riski azdır ama birkaç alışkanlık ana kapıları kapatır."
    learn:
      en: |
        - XSS: why `textContent` is safe and `innerHTML` with outside data is not
        - Only linking to addresses you expect (`https://github.com/...`, never `javascript:`)
        - A Content Security Policy (CSP) that lets the page load only from places you list
        - Never put secrets (API tokens, passwords) in front-end code: everyone can read it
      tr: |
        - XSS: `textContent`'in neden güvenli, dışarıdan gelen veriyle `innerHTML`'in neden güvensiz olduğu
        - Sadece beklediğin adreslere bağlantı vermek (`https://github.com/...`, asla `javascript:` değil)
        - Sayfanın sadece listelediğin yerlerden yüklemesini sağlayan Content Security Policy (CSP)
        - Gizli bilgileri (API token, parola) asla front-end koduna koymamak: herkes okuyabilir
    do:
      en: |
        1. Update `js/repos.js` with the code below. The new `githubUrl` function accepts only `https://github.com/...` addresses, so a bad value like `javascript:alert(1)` never becomes a link.
        2. Replace `test/repos.test.js` with the new version below (it adds one test) and run `npm test`. 6 tests should pass.
        3. In `index.html`, add the Content Security Policy line (third code block) inside `<head>`, before the `<script>` line. It says: load only from this site; the page may contact only `api.github.com`.
        4. Refresh the page served by `npx serve .`. Projects still load. In the Console, try `document.body.append(Object.assign(document.createElement("script"), { src: "https://example.com/x.js" }))`: the browser refuses to load it and reports a CSP error.
        5. Search your project for the words `innerHTML`, `token`, `password` and `apiKey`. There should be none. Commit: `git add .` and `git commit -m "Safer links and CSP"`.
      tr: |
        1. `js/repos.js` dosyasını aşağıdaki kodla güncelle. Yeni `githubUrl` fonksiyonu sadece `https://github.com/...` adreslerini kabul eder; böylece `javascript:alert(1)` gibi kötü bir değer asla bağlantıya dönüşmez.
        2. `test/repos.test.js` dosyasını aşağıdaki yeni sürümle değiştir (bir test ekler) ve `npm test` çalıştır. 6 test geçmeli.
        3. `index.html` içinde `<head>` bölümüne, `<script>` satırından önce Content Security Policy satırını ekle (üçüncü kod bloğu). Şunu söyler: sadece bu siteden yükle; sayfa yalnızca `api.github.com` ile konuşabilir.
        4. `npx serve .` ile sunulan sayfayı yenile. Projeler hâlâ yükleniyor. Console'da şunu dene: `document.body.append(Object.assign(document.createElement("script"), { src: "https://example.com/x.js" }))`. Tarayıcı yüklemeyi reddeder ve bir CSP hatası bildirir.
        5. Projende `innerHTML`, `token`, `password` ve `apiKey` kelimelerini ara. Hiçbiri çıkmamalı. Commit et: `git add .` ve `git commit -m "Safer links and CSP"`.
    code:
      - file: js/repos.js
        lang: js
        text: |
          // Returns the address only when it points to https://github.com, otherwise "".
          export function githubUrl(value) {
            try {
              const url = new URL(value);
              return url.protocol === "https:" && url.hostname === "github.com" ? url.href : "";
            } catch {
              return ""; // not a valid address at all
            }
          }

          // Turns the raw GitHub answer into the few fields the page needs.
          export function pickRepos(list, max = 6) {
            return list
              .filter((repo) => !repo.fork && !repo.archived && githubUrl(repo.html_url))
              .sort(
                (a, b) =>
                  b.stargazers_count - a.stargazers_count ||
                  new Date(b.pushed_at) - new Date(a.pushed_at),
              )
              .slice(0, max)
              .map((repo) => ({
                name: repo.name,
                description: repo.description ?? "No description yet.",
                url: githubUrl(repo.html_url),
                language: repo.language,
                stars: repo.stargazers_count,
              }));
          }

          // Asks GitHub for the public repositories of a user.
          // `fetchFn` is a parameter so tests can pass a fake instead of the network.
          export async function loadRepos(user, fetchFn = fetch) {
            const response = await fetchFn(
              `https://api.github.com/users/${encodeURIComponent(user)}/repos?per_page=100`,
            );
            if (!response.ok) {
              throw new Error(`GitHub answered ${response.status}`);
            }
            return pickRepos(await response.json());
          }
