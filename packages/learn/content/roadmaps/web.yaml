id: web
title: Web basics
summary:
  en: "From an empty computer to your own website on the internet. You write HTML, CSS and JavaScript by hand, with no framework and no build tool, and you understand what every line does."
  tr: "Boş bir bilgisayardan internette yayında olan kendi web siteni yapmaya. HTML, CSS ve JavaScript'i framework ve build aracı olmadan elle yazarsın ve her satırın ne yaptığını anlarsın."
teacher: frontend
project:
  en: 'A small personal site: about page, responsive layout, dark mode that is remembered, and a projects section that loads your repositories from the GitHub API with fetch. Tested and published free on GitHub Pages.'
  tr: 'Küçük bir kişisel site: hakkında bölümü, her ekrana uyan düzen, hatırlanan karanlık mod ve GitHub API''sinden fetch ile repolarını yükleyen bir projeler bölümü. Testleri yazılmış ve GitHub Pages''te ücretsiz yayında.'
detect:
  files: [index.html]
checked: 2026-10
sheets: [javascript, http, cors, git]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install an editor, a browser toolbox and Git"
      tr: "Bir editör, tarayıcı araçları ve Git kurma"
    minutes: 40
    why:
      en: "A website is just text files that a browser reads, so you only need an editor and a browser. Git keeps every version of your work. Node.js is optional, but we use it later to run small tests."
      tr: "Bir web sitesi, tarayıcının okuduğu düz metin dosyalarından ibarettir; yani bir editör ve bir tarayıcı yeter. Git işinin her sürümünü saklar. Node.js zorunlu değil ama ileride küçük testleri çalıştırmak için kullanacağız."
    learn:
      en: |
        - A website is files (`.html`, `.css`, `.js`) that a browser downloads and shows
        - How to open a terminal and check that a program is installed
        - How to open the browser developer tools (they are built in and free)
      tr: |
        - Web sitesinin, tarayıcının indirip gösterdiği dosyalar (`.html`, `.css`, `.js`) olduğu
        - Terminal açmak ve bir programın kurulu olup olmadığını kontrol etmek
        - Tarayıcı geliştirici araçlarını açmak (tarayıcıda hazır gelir ve ücretsizdir)
    do:
      en: |
        1. Install **Visual Studio Code** (code.visualstudio.com), a free editor.
        2. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it.
        3. Install **Node.js LTS** from nodejs.org. LTS means "long-term support": it gets fixes for years. You will not need it to write the site, only to run tests later.
        4. Use any modern browser (Chrome, Firefox, Edge or Safari). Open any page and press **F12** (on macOS Safari: enable the Develop menu first). This opens the developer tools: you will use the *Elements*, *Console* and *Network* tabs a lot.
        5. Open a terminal (in VS Code: *Terminal → New Terminal*) and run the commands below. Each should print a version number.
        6. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
      tr: |
        1. Ücretsiz bir editör olan **Visual Studio Code**'u kur (code.visualstudio.com).
        2. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir.
        3. nodejs.org'dan **Node.js LTS** sürümünü kur. LTS "uzun süreli destek" demek: yıllarca düzeltme alır. Siteyi yazmak için gerekmez, sadece ileride testleri çalıştırmak için lazım.
        4. Güncel bir tarayıcı kullan (Chrome, Firefox, Edge ya da Safari). Herhangi bir sayfayı aç ve **F12**'ye bas (macOS Safari'de önce Develop menüsünü açman gerekir). Geliştirici araçları açılır: *Elements*, *Console* ve *Network* sekmelerini çok kullanacaksın.
        5. Bir terminal aç (VS Code'da: *Terminal → New Terminal*) ve aşağıdaki komutları çalıştır. Her biri bir sürüm numarası yazmalı.
        6. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
    code:
      - file: terminal
        lang: sh
        text: |
          git --version
          node --version
          npm --version
    mistakes:
      - problem:
          en: "\"command not found\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found\" hatası."
        fix:
          en: "Close the terminal (or VS Code) and open it again so it sees the new program. On Windows, restart if it still fails."
          tr: "Terminali (ya da VS Code'u) kapatıp yeniden aç ki yeni programı görsün. Windows'ta hâlâ olmuyorsa bilgisayarı yeniden başlat."
      - problem:
          en: "F12 does nothing on a laptop."
          tr: "Dizüstü bilgisayarda F12 hiçbir şey yapmıyor."
        fix:
          en: "Some laptops need the Fn key too (Fn + F12). You can also right-click the page and choose *Inspect*."
          tr: "Bazı dizüstü bilgisayarlarda Fn tuşu da gerekir (Fn + F12). Sayfaya sağ tıklayıp *Inspect* (İncele) seçeneğini de kullanabilirsin."
    quiz:
      - q:
          en: "What does a browser need to show a website?"
          tr: "Tarayıcının bir web sitesini göstermesi için neye ihtiyacı var?"
        options:
          en: [A special server program on your computer, The site's files (HTML, CSS and JavaScript), A framework]
          tr: [Bilgisayarında özel bir sunucu programı, Sitenin dosyaları (HTML, CSS ve JavaScript), Bir framework]
        answer: 1
        why:
          en: "A browser reads files. HTML gives the content, CSS the looks and JavaScript the behavior. Nothing else is required."
          tr: "Tarayıcı dosyaları okur. HTML içeriği, CSS görünümü, JavaScript davranışı verir. Başka bir şey gerekmez."
    sources:
      - title: "MDN: Install and set up the basic software"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Environment_setup/Installing_software
      - title: "MDN: What are browser developer tools?"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Tools_and_setup/What_are_browser_developer_tools
      - title: Git installation
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: first-page
    stage: first-code
    title:
      en: "Your first web page"
      tr: "İlk web sayfan"
    minutes: 25
    needs: [setup]
    why:
      en: "The fastest way to learn is to see a result. One small file is already a real web page, and you can open it by double-clicking it."
      tr: "Öğrenmenin en hızlı yolu sonucu görmek. Küçücük bir dosya bile gerçek bir web sayfasıdır ve çift tıklayarak açabilirsin."
    learn:
      en: |
        - What an HTML file is: text with tags like `<h1>` that tell the browser what each part is
        - The minimum every page needs (`<!doctype html>`, `<head>`, `<body>`)
        - How to refresh the page after each save
      tr: |
        - HTML dosyasının ne olduğu: tarayıcıya her parçanın ne olduğunu söyleyen `<h1>` gibi etiketler içeren metin
        - Her sayfanın en az neye ihtiyacı olduğu (`<!doctype html>`, `<head>`, `<body>`)
        - Her kayıttan sonra sayfayı nasıl yenileyeceğin
    do:
      en: |
        1. Create a folder called `personal-site` somewhere you can find it (for example in your Documents folder).
        2. Open the folder in VS Code (*File → Open Folder*).
        3. Create a new file named `index.html` and paste the code below. `index.html` is the special name a web server shows first.
        4. Save it, then open it in your browser: double-click the file, or right-click it and choose *Open with* and your browser.
        5. Change "Hello, web!" to something else, save, and press **F5** in the browser. The page changes.
        6. Save this first version with Git (commands below).
      tr: |
        1. Bulabileceğin bir yerde (örneğin Belgeler klasöründe) `personal-site` adında bir klasör oluştur.
        2. Klasörü VS Code'da aç (*File → Open Folder*).
        3. `index.html` adında yeni bir dosya oluştur ve aşağıdaki kodu yapıştır. `index.html`, web sunucusunun ilk gösterdiği özel addır.
        4. Kaydet, sonra tarayıcıda aç: dosyaya çift tıkla ya da sağ tıklayıp *Birlikte aç* ile tarayıcını seç.
        5. "Hello, web!" yazısını değiştir, kaydet ve tarayıcıda **F5**'e bas. Sayfa değişir.
        6. Bu ilk sürümü Git ile kaydet (aşağıdaki komutlar).
    code:
      - file: index.html
        lang: html
        text: |
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>My site</title>
            </head>
            <body>
              <h1>Hello, web!</h1>
              <p>This is my first page.</p>
            </body>
          </html>
      - file: terminal
        lang: sh
        text: |
          git init -b main
          git add .
          git commit -m "First page"
    mistakes:
      - problem:
          en: "The browser shows the code as plain text, or the file is called `index.html.txt`."
          tr: "Tarayıcı kodu düz metin olarak gösteriyor ya da dosyanın adı `index.html.txt` olmuş."
        fix:
          en: "The name must end with `.html`. In VS Code, create the file with the right name. On Windows, enable *File name extensions* in File Explorer to see the real name."
          tr: "Ad `.html` ile bitmeli. VS Code'da dosyayı doğru adla oluştur. Windows'ta gerçek adı görmek için Dosya Gezgini'nde *Dosya adı uzantıları*'nı aç."
      - problem:
          en: "Strange characters instead of letters like ü or ş."
          tr: "ü ya da ş gibi harfler yerine garip karakterler çıkıyor."
        fix:
          en: "Keep `<meta charset=\"utf-8\">` in the `<head>` and save the file as UTF-8 (VS Code does this by default)."
          tr: "`<head>` içinde `<meta charset=\"utf-8\">` satırını tut ve dosyayı UTF-8 olarak kaydet (VS Code varsayılan olarak böyle yapar)."
    quiz:
      - q:
          en: "Why is the file named `index.html`?"
          tr: "Dosyanın adı neden `index.html`?"
        options:
          en: [Browsers only open files with that name, A web server shows it first when someone visits a folder, It makes the page faster]
          tr: [Tarayıcılar sadece bu adlı dosyaları açar, Biri bir klasörü ziyaret edince web sunucusu önce onu gösterir, Sayfayı hızlandırır]
        answer: 1
        why:
          en: "Visiting `https://example.com/` actually serves `index.html` from the root folder. GitHub Pages does the same."
          tr: "`https://example.com/` adresini ziyaret etmek aslında kök klasördeki `index.html` dosyasını sunar. GitHub Pages de aynısını yapar."
    sources:
      - title: "MDN: Basic HTML syntax"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Basic_HTML_syntax
      - title: "MDN: HTML document structure"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Webpage_metadata

  - id: html
    stage: basics
    title:
      en: "Structure the content with HTML"
      tr: "İçeriği HTML ile yapılandırma"
    minutes: 60
    needs: [first-page]
    why:
      en: "HTML says what each part of the page is: a heading, a list, a link, a navigation. Good structure helps search engines, screen readers and you, and it makes the CSS in the next step easy."
      tr: "HTML sayfanın her parçasının ne olduğunu söyler: başlık, liste, bağlantı, gezinme. İyi yapı arama motorlarına, ekran okuyuculara ve sana yardım eder; sonraki adımdaki CSS'i de kolaylaştırır."
    learn:
      en: |
        - Headings (`h1` to `h6`), paragraphs, links and lists
        - Meaning-carrying elements: `header`, `nav`, `main`, `section`, `footer`
        - Why the page has exactly one `h1`, and what `id` and `class` are for
        - The `viewport` tag that makes pages work on phones
      tr: |
        - Başlıklar (`h1`'den `h6`'ya), paragraflar, bağlantılar ve listeler
        - Anlam taşıyan elemanlar: `header`, `nav`, `main`, `section`, `footer`
        - Sayfada neden tek bir `h1` olduğu, `id` ve `class`'ın ne işe yaradığı
        - Sayfaların telefonda düzgün çalışmasını sağlayan `viewport` etiketi
    do:
      en: |
        1. Replace the whole content of `index.html` with the code below. Change "Your Name" and the email to your own.
        2. Save and refresh the browser. It looks plain: that is correct, the looks come next.
        3. Click the links in the menu. The page jumps to the section whose `id` matches (`#about` goes to `id="about"`).
        4. Open the developer tools, *Elements* tab. Click the little arrow icon and then an element on the page to see its HTML.
        5. Commit: `git add .` and `git commit -m "Page structure"`.
      tr: |
        1. `index.html` içindeki her şeyi aşağıdaki kodla değiştir. "Your Name" ve e-postayı kendi bilgilerinle değiştir.
        2. Kaydet ve tarayıcıyı yenile. Sade görünür: doğru, görünüm sıradaki adımda.
        3. Menüdeki bağlantılara tıkla. Sayfa `id`'si eşleşen bölüme atlar (`#about`, `id="about"` olan yere gider).
        4. Geliştirici araçlarını aç, *Elements* sekmesi. Küçük ok simgesine, sonra sayfadaki bir elemana tıkla; HTML'ini görürsün.
        5. Commit et: `git add .` ve `git commit -m "Page structure"`.
    code:
      - file: index.html
        lang: html
        text: |
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Your Name - personal site</title>
            </head>
            <body>
              <a class="skip" href="#main">Skip to content</a>
              <header class="site-header">
                <p class="brand">Your Name</p>
                <nav aria-label="Main">
                  <a href="#about">About</a>
                  <a href="#projects">Projects</a>
                  <a href="#contact">Contact</a>
                </nav>
              </header>
              <main id="main">
                <section class="hero">
                  <h1>Hi, I am Your Name</h1>
                  <p>I am learning to build for the web.</p>
                </section>
                <section id="about">
                  <h2>About</h2>
                  <p>I write HTML, CSS and JavaScript by hand. This site is my practice project.</p>
                </section>
                <section id="projects">
                  <h2>Projects</h2>
                  <p id="repos-status" role="status">Projects will show up here soon.</p>
                  <ul id="repos" class="cards"></ul>
                </section>
                <section id="contact">
                  <h2>Contact</h2>
                  <p>Write to <a href="mailto:you@example.com">you@example.com</a>.</p>
                </section>
              </main>
              <footer>
                <p>Built with HTML, CSS and JavaScript. No framework.</p>
              </footer>
            </body>
          </html>
    mistakes:
      - problem:
          en: "Using `<h3>` just because it looks smaller, or several `<h1>` tags."
          tr: "Sadece daha küçük göründüğü için `<h3>` kullanmak ya da birden çok `<h1>` koymak."
        fix:
          en: "Headings describe the outline, not the size. One `h1`, then `h2` for sections, `h3` inside them. Change the size with CSS later."
          tr: "Başlıklar boyutu değil, ana hatları anlatır. Bir `h1`, bölümler için `h2`, onların içinde `h3`. Boyutu sonra CSS ile değiştirirsin."
      - problem:
          en: "A tag is not closed (`<section>` without `</section>`) and the page looks broken far below."
          tr: "Bir etiket kapatılmamış (`</section>` olmadan `<section>`) ve sayfa çok aşağıda bozuk görünüyor."
        fix:
          en: "Indent the code the same way as above. A missing closing tag then shows up as a line that is out of place."
          tr: "Kodu yukarıdaki gibi girintili yaz. Eksik kapanış etiketi yerinde durmayan bir satır olarak göze çarpar."
      - problem:
          en: "Two elements with the same `id`."
          tr: "Aynı `id`'ye sahip iki eleman."
        fix:
          en: "An `id` must be unique in a page. Use `class` when many elements share a style."
          tr: "Bir sayfada `id` benzersiz olmalı. Birçok eleman aynı stili paylaşacaksa `class` kullan."
    quiz:
      - q:
          en: "Why use `<nav>` and `<main>` instead of `<div>` for everything?"
          tr: "Her şey için `<div>` yerine neden `<nav>` ve `<main>` kullanıyoruz?"
        options:
          en: [They have built-in colors, They tell browsers and screen readers what each part is, They run faster]
          tr: [Hazır renkleri var, Tarayıcılara ve ekran okuyuculara her parçanın ne olduğunu söylerler, Daha hızlı çalışırlar]
        answer: 1
        why:
          en: "These elements carry meaning. A screen reader user can jump straight to the main content or the navigation."
          tr: "Bu elemanlar anlam taşır. Ekran okuyucu kullanan biri doğrudan ana içeriğe ya da menüye atlayabilir."
    sources:
      - title: "MDN: HTML text fundamentals"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Headings_and_paragraphs
      - title: "MDN: Document and website structure"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Document_and_website_structure
      - title: "MDN: HTML elements reference"
        url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements

  - id: css
    stage: basics
    title:
      en: "Make it look good with CSS"
      tr: "CSS ile güzel görünmesini sağlama"
    minutes: 60
    needs: [html]
    why:
      en: "CSS is the second layer: colors, fonts and spacing. Keeping looks in a separate file means you can change the whole site by editing one place."
      tr: "CSS ikinci katman: renkler, yazı tipleri ve boşluklar. Görünümü ayrı bir dosyada tutmak, tüm siteyi tek yerden değiştirmeni sağlar."
    learn:
      en: |
        - A CSS rule: selector, property, value
        - Linking a stylesheet with `<link rel="stylesheet">`
        - Custom properties (variables) such as `--accent`, used with `var(--accent)`
        - The box model: content, padding, border, margin, and why `box-sizing: border-box` helps
      tr: |
        - CSS kuralı: seçici, özellik, değer
        - `<link rel="stylesheet">` ile stil dosyası bağlamak
        - `--accent` gibi özel özellikler (değişkenler) ve `var(--accent)` ile kullanımı
        - Kutu modeli: içerik, padding, border, margin ve `box-sizing: border-box`'ın neden işe yaradığı
    do:
      en: |
        1. Create `style.css` next to `index.html` with the code below.
        2. In `index.html`, add the line `<link rel="stylesheet" href="style.css">` just before `</head>`.
        3. Save both files and refresh. Colors and a readable font appear.
        4. Change `--accent` to another color (try `#c2410c`) and refresh. Every link changes: that is the power of a variable.
        5. In the browser's *Elements* tab, click an element and look at the *Styles* panel and the box-model picture to see which rules apply.
        6. Commit: `git add .` and `git commit -m "Basic styles"`.
      tr: |
        1. `index.html`'in yanında aşağıdaki kodla `style.css` dosyasını oluştur.
        2. `index.html` içinde `</head>` satırından hemen önce `<link rel="stylesheet" href="style.css">` satırını ekle.
        3. İki dosyayı da kaydet ve yenile. Renkler ve okunaklı bir yazı tipi gelir.
        4. `--accent` değerini başka bir renkle değiştir (`#c2410c` dene) ve yenile. Tüm bağlantılar değişir: değişkenin gücü bu.
        5. Tarayıcıda *Elements* sekmesinde bir elemana tıkla; hangi kuralların uygulandığını *Styles* panelinden ve kutu modeli resminden gör.
        6. Commit et: `git add .` ve `git commit -m "Basic styles"`.
    code:
      - file: style.css
        lang: css
        text: |
          :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --muted: #555555;
            --accent: #0b5cad;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            font-family: system-ui, sans-serif;
            line-height: 1.6;
            background: var(--bg);
            color: var(--text);
          }

          a {
            color: var(--accent);
          }

          h1,
          h2 {
            line-height: 1.2;
          }

          footer {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--muted);
          }
    mistakes:
      - problem:
          en: "The styles do not apply at all."
          tr: "Stiller hiç uygulanmıyor."
        fix:
          en: "Open the *Network* tab and refresh: if `style.css` is red (404), the `href` does not match the file name or folder."
          tr: "*Network* sekmesini aç ve yenile: `style.css` kırmızıysa (404) `href`, dosya adıyla ya da klasörle uyuşmuyor."
      - problem:
          en: "A rule with a typo is ignored silently (for example `colour: red`)."
          tr: "Yazım hatalı kural sessizce yok sayılıyor (örneğin `colour: red`)."
        fix:
          en: "CSS does not show errors. In the *Styles* panel a wrong property is shown crossed out. Check the spelling and the semicolon at the end of each line."
          tr: "CSS hata göstermez. *Styles* panelinde yanlış özellik üstü çizili görünür. Yazımı ve her satır sonundaki noktalı virgülü kontrol et."
    quiz:
      - q:
          en: "What is the benefit of `--accent` and `var(--accent)`?"
          tr: "`--accent` ve `var(--accent)` kullanmanın faydası nedir?"
        options:
          en: [The color loads faster, You change a value in one place and it updates everywhere, Variables are required by CSS]
          tr: [Renk daha hızlı yüklenir, Değeri tek yerde değiştirirsin ve her yerde güncellenir, CSS değişken kullanmayı zorunlu tutar]
        answer: 1
        why:
          en: "Custom properties remove repeated values. Later they also make dark mode simple: you only swap the variables."
          tr: "Özel özellikler tekrar eden değerleri ortadan kaldırır. İleride karanlık modu da basitleştirir: sadece değişkenleri değiştirirsin."
    sources:
      - title: "MDN: CSS styling basics"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics
      - title: "MDN: Using CSS custom properties"
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascading_variables/Using_custom_properties
      - title: "MDN: The box model"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Box_model

  - id: layout
    stage: basics
    title:
      en: "Layout that fits every screen"
      tr: "Her ekrana uyan düzen"
    minutes: 60
    needs: [css]
    why:
      en: "Most visitors use a phone. A layout that adapts to the screen width (responsive design) is not extra work: with Flexbox and Grid it is a few lines."
      tr: "Ziyaretçilerin çoğu telefon kullanır. Ekran genişliğine uyum sağlayan düzen (responsive tasarım) ek iş değil: Flexbox ve Grid ile birkaç satır."
    learn:
      en: |
        - Flexbox for a row of items (the header) and Grid for cards
        - `repeat(auto-fill, minmax(16rem, 1fr))`: as many columns as fit
        - A media query for small screens, and `clamp()` for fluid text size
        - Why the viewport meta tag from the HTML step matters
      tr: |
        - Bir sıra eleman için (başlık) Flexbox, kartlar için Grid
        - `repeat(auto-fill, minmax(16rem, 1fr))`: sığdığı kadar sütun
        - Küçük ekranlar için media query ve akışkan yazı boyutu için `clamp()`
        - HTML adımındaki viewport meta etiketinin neden önemli olduğu
    do:
      en: |
        1. Replace the whole content of `style.css` with the code below. It keeps the variables from the last step and adds the layout.
        2. To see cards, temporarily add three `<li class="card"><h3>Project</h3><p>Description</p></li>` lines inside `<ul id="repos" class="cards">` in `index.html`. You will remove them in a later step, when JavaScript fills the list.
        3. Refresh. Make the browser window narrow and wide: the cards reflow and the header stacks on small screens.
        4. Open the developer tools and click the *device toolbar* icon (a phone and tablet) to test phone sizes.
        5. Commit: `git add .` and `git commit -m "Responsive layout"`.
      tr: |
        1. `style.css` içindeki her şeyi aşağıdaki kodla değiştir. Önceki adımın değişkenlerini korur ve düzeni ekler.
        2. Kartları görmek için `index.html` içinde `<ul id="repos" class="cards">` elemanının içine geçici olarak üç tane `<li class="card"><h3>Project</h3><p>Description</p></li>` satırı ekle. Sonraki bir adımda liste JavaScript ile dolacağı için bunları sileceksin.
        3. Yenile. Tarayıcı penceresini daralt ve genişlet: kartlar yeniden dizilir, başlık küçük ekranlarda alt alta geçer.
        4. Geliştirici araçlarında *cihaz araç çubuğu* simgesine (telefon ve tablet) tıklayıp telefon boyutlarını dene.
        5. Commit et: `git add .` ve `git commit -m "Responsive layout"`.
    code:
      - file: style.css
        lang: css
        text: |
          :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --muted: #555555;
            --accent: #0b5cad;
            --card: #f3f5f8;
            --border: #d5dae1;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            font-family: system-ui, sans-serif;
            line-height: 1.6;
            background: var(--bg);
            color: var(--text);
          }

          a {
            color: var(--accent);
          }

          h1,
          h2 {
            line-height: 1.2;
          }

          .skip {
            position: absolute;
            left: -999px;
            top: 0;
            padding: 0.5rem 1rem;
            background: var(--bg);
          }

          .skip:focus {
            left: 0;
          }

          .site-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
          }

          .site-header nav {
            display: flex;
            gap: 1rem;
          }

          .brand {
            margin: 0;
            font-weight: 700;
          }

          main {
            max-width: 56rem;
            margin: 0 auto;
            padding: 0 1rem;
          }

          section {
            padding: 2rem 0;
          }

          .hero h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            margin-bottom: 0.5rem;
          }

          .cards {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
            gap: 1rem;
          }

          .card {
            padding: 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
          }

          .card h3 {
            margin: 0 0 0.5rem;
          }

          .card p {
            margin: 0 0 0.5rem;
            color: var(--muted);
          }

          button {
            font: inherit;
            padding: 0.4rem 0.9rem;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            cursor: pointer;
          }

          footer {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--muted);
            border-top: 1px solid var(--border);
          }

          @media (max-width: 40rem) {
            .site-header {
              flex-direction: column;
              align-items: flex-start;
            }
          }
    mistakes:
      - problem:
          en: "On a real phone the page looks tiny, like a zoomed-out desktop page."
          tr: "Gerçek telefonda sayfa küçücük, uzaklaştırılmış bir masaüstü sayfası gibi görünüyor."
        fix:
          en: "The `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">` line is missing from `<head>`."
          tr: "`<head>` içinde `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">` satırı eksik."
      - problem:
          en: "Using fixed widths like `width: 800px`, so the page scrolls sideways on phones."
          tr: "`width: 800px` gibi sabit genişlikler kullanmak; sayfa telefonda yana kayıyor."
        fix:
          en: "Use `max-width`, percentages, `rem` and Grid/Flex so content can shrink."
          tr: "İçerik küçülebilsin diye `max-width`, yüzde, `rem` ve Grid/Flex kullan."
    quiz:
      - q:
          en: "What does `repeat(auto-fill, minmax(16rem, 1fr))` do?"
          tr: "`repeat(auto-fill, minmax(16rem, 1fr))` ne yapar?"
        options:
          en: [Makes exactly 16 columns, Fits as many columns of at least 16rem as the width allows, Hides cards that are too wide]
          tr: [Tam 16 sütun yapar, Genişliğin izin verdiği kadar en az 16rem'lik sütun sığdırır, Fazla geniş kartları gizler]
        answer: 1
        why:
          en: "Each column is at least 16rem wide and shares leftover space equally (1fr). On a phone you get one column, on a laptop three or four."
          tr: "Her sütun en az 16rem genişliğinde olur ve artan yeri eşit paylaşır (1fr). Telefonda tek sütun, dizüstünde üç dört sütun elde edersin."
    sources:
      - title: "MDN: CSS grid layout"
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout
      - title: "MDN: Flexbox"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Flexbox
      - title: "MDN: Using media queries"
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_media_queries/Using_media_queries

  - id: dom
    stage: first-project
    title:
      en: "JavaScript: a dark mode button"
      tr: "JavaScript: karanlık mod düğmesi"
    minutes: 75
    needs: [layout]
    why:
      en: "JavaScript is the third layer: it reacts to what the visitor does. A dark mode button is small but uses the three core ideas: find an element, listen for a click, change the page."
      tr: "JavaScript üçüncü katman: ziyaretçinin yaptıklarına tepki verir. Karanlık mod düğmesi küçük ama üç temel fikri kullanır: bir eleman bul, tıklamayı dinle, sayfayı değiştir."
    learn:
      en: |
        - Loading a script with `<script type="module" src="...">` (it runs after the page is parsed)
        - `document.querySelector` to find an element, `addEventListener` to react to a click
        - Changing the page through an attribute (`data-theme`) that CSS reacts to
        - Why a local web server is needed for modules (and how to start one)
      tr: |
        - `<script type="module" src="...">` ile script yüklemek (sayfa okunduktan sonra çalışır)
        - Eleman bulmak için `document.querySelector`, tıklamaya tepki vermek için `addEventListener`
        - Sayfayı, CSS'in tepki verdiği bir öznitelik (`data-theme`) üzerinden değiştirmek
        - Modüller için neden yerel bir web sunucusu gerektiği (ve nasıl başlatılacağı)
    do:
      en: |
        1. Modules do not load from a file opened by double-click (`file://`), so start a tiny local server. In the terminal, inside the `personal-site` folder, run the first command below and open the address it prints (usually http://localhost:3000). Stop it with Ctrl+C. The first run asks to install `serve`: answer yes.
        2. Create the folder `js` and the file `js/main.js` with the code below.
        3. Replace `index.html` with the version below: it has the new button in the header and the script tag. Remove the three temporary cards from the layout step if you added them.
        4. Add the dark theme at the end of `style.css` (second code block).
        5. Refresh and click "Dark mode". The page switches. Open the *Console* tab: there should be no red errors.
        6. Commit: `git add .` and `git commit -m "Dark mode button"`.
      tr: |
        1. Modüller çift tıklayarak açılan (`file://`) dosyadan yüklenmez; bu yüzden küçük bir yerel sunucu başlat. Terminalde `personal-site` klasörünün içinde aşağıdaki ilk komutu çalıştır ve yazdığı adresi aç (genelde http://localhost:3000). Ctrl+C ile durdurursun. İlk çalıştırmada `serve` kurmayı sorar: evet de.
        2. `js` klasörünü ve aşağıdaki kodla `js/main.js` dosyasını oluştur.
        3. `index.html` dosyasını aşağıdaki sürümle değiştir: başlıkta yeni düğme ve script etiketi var. Düzen adımında eklediysen üç geçici kartı kaldır.
        4. Karanlık temayı `style.css` dosyasının sonuna ekle (ikinci kod bloğu).
        5. Yenile ve "Dark mode" düğmesine tıkla. Sayfa değişir. *Console* sekmesini aç: kırmızı hata olmamalı.
        6. Commit et: `git add .` ve `git commit -m "Dark mode button"`.
    code:
      - file: terminal
        lang: sh
        text: |
          npx serve .
      - file: js/main.js
        lang: js
        text: |
          const toggle = document.querySelector("#theme-toggle");

          function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            toggle.setAttribute("aria-pressed", String(theme === "dark"));
          }

          toggle.addEventListener("click", () => {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            applyTheme(next);
          });

          const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
          applyTheme(prefersDark ? "dark" : "light");
      - file: index.html
        lang: html
        text: |
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Your Name - personal site</title>
              <link rel="stylesheet" href="style.css">
              <script type="module" src="js/main.js"></script>
            </head>
            <body>
              <a class="skip" href="#main">Skip to content</a>
              <header class="site-header">
                <p class="brand">Your Name</p>
                <nav aria-label="Main">
                  <a href="#about">About</a>
                  <a href="#projects">Projects</a>
                  <a href="#contact">Contact</a>
                </nav>
                <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
              </header>
              <main id="main">
                <section class="hero">
                  <h1>Hi, I am Your Name</h1>
                  <p>I am learning to build for the web.</p>
                </section>
                <section id="about">
                  <h2>About</h2>
                  <p>I write HTML, CSS and JavaScript by hand. This site is my practice project.</p>
                </section>
                <section id="projects">
                  <h2>Projects</h2>
                  <p id="repos-status" role="status">Projects will show up here soon.</p>
                  <ul id="repos" class="cards"></ul>
                </section>
                <section id="contact">
                  <h2>Contact</h2>
                  <p>Write to <a href="mailto:you@example.com">you@example.com</a>.</p>
                </section>
              </main>
              <footer>
                <p>Built with HTML, CSS and JavaScript. No framework.</p>
              </footer>
            </body>
          </html>
      - file: style.css
        lang: css
        text: |
          /* add at the end of style.css */

          /* Dark theme. The first block is used before JavaScript runs, so dark-mode users
             do not see a white flash; the second one is the button's choice. */
          @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
              color-scheme: dark;
              --bg: #121417;
              --text: #eceff3;
              --muted: #aab2bd;
              --accent: #6cb2ff;
              --card: #1c2026;
              --border: #323943;
            }
          }

          :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #121417;
            --text: #eceff3;
            --muted: #aab2bd;
            --accent: #6cb2ff;
            --card: #1c2026;
            --border: #323943;
          }
    mistakes:
      - problem:
          en: "The console says \"Access to script ... from origin 'null' has been blocked by CORS policy\" and nothing works."
          tr: "Konsol \"Access to script ... from origin 'null' has been blocked by CORS policy\" diyor ve hiçbir şey çalışmıyor."
        fix:
          en: "You opened the page with `file://`. Start the local server (`npx serve .`) and use the `http://localhost` address."
          tr: "Sayfayı `file://` ile açmışsın. Yerel sunucuyu başlat (`npx serve .`) ve `http://localhost` adresini kullan."
      - problem:
          en: "\"Cannot read properties of null (reading 'addEventListener')\"."
          tr: "\"Cannot read properties of null (reading 'addEventListener')\" hatası."
        fix:
          en: "`querySelector` found nothing, so `toggle` is `null`. Check that the button has `id=\"theme-toggle\"` and the selector is `#theme-toggle` (the `#` means id)."
          tr: "`querySelector` hiçbir şey bulamadı, yani `toggle` değeri `null`. Düğmede `id=\"theme-toggle\"` olduğunu ve seçicinin `#theme-toggle` olduğunu kontrol et (`#` id demektir)."
      - problem:
          en: "Calling `toggle.addEventListener(\"click\", applyTheme())` with parentheses."
          tr: "`toggle.addEventListener(\"click\", applyTheme())` diye parantezli yazmak."
        fix:
          en: "Parentheses call the function right now. Pass a function, as the arrow function above does, so it runs later on click."
          tr: "Parantez fonksiyonu hemen çağırır. Yukarıdaki ok fonksiyonu gibi bir fonksiyon ver ki tıklayınca sonradan çalışsın."
    quiz:
      - q:
          en: "How does the button change the look of the whole page?"
          tr: "Düğme tüm sayfanın görünümünü nasıl değiştiriyor?"
        options:
          en: [It rewrites the CSS file, It sets the data-theme attribute and CSS variables change in response, It reloads the page]
          tr: [CSS dosyasını yeniden yazar, data-theme özniteliğini ayarlar ve CSS değişkenleri buna göre değişir, Sayfayı yeniden yükler]
        answer: 1
        why:
          en: "JavaScript only flips one attribute. The CSS rule `:root[data-theme=\"dark\"]` swaps the variables, and every color follows."
          tr: "JavaScript sadece bir özniteliği çevirir. `:root[data-theme=\"dark\"]` kuralı değişkenleri değiştirir, tüm renkler onu izler."
    sources:
      - title: "MDN: DOM scripting"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/DOM_scripting
      - title: "MDN: JavaScript modules"
        url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules
      - title: "MDN: prefers-color-scheme"
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-color-scheme

  - id: storage
    stage: data-api
    title:
      en: "Remember the visitor's choice"
      tr: "Ziyaretçinin seçimini hatırlama"
    minutes: 30
    needs: [dom]
    why:
      en: "Right now the page forgets the theme when it is reloaded. The browser can keep small pieces of data for your site with `localStorage`, with no server and no database."
      tr: "Şu an sayfa yenilenince tema unutuluyor. Tarayıcı, siten için `localStorage` ile küçük veriler saklayabilir; sunucu ve veritabanı gerekmez."
    learn:
      en: |
        - `localStorage.getItem` and `setItem` (they store strings only)
        - Why storage code goes in `try`/`catch` (private windows or blocked storage can throw)
        - Checking saved data before trusting it
      tr: |
        - `localStorage.getItem` ve `setItem` (sadece string saklarlar)
        - Saklama kodunun neden `try`/`catch` içinde olduğu (gizli pencere ya da engellenmiş depolama hata fırlatabilir)
        - Kayıtlı veriye güvenmeden önce kontrol etmek
    do:
      en: |
        1. Replace `js/main.js` with the code below.
        2. Refresh, click "Dark mode", then refresh again. The dark theme stays.
        3. Open developer tools, *Application* tab (Firefox: *Storage*), then *Local Storage*. You see the key `theme` with the value `dark`. Delete it and refresh to see the default again.
        4. Commit: `git add .` and `git commit -m "Remember theme"`.
      tr: |
        1. `js/main.js` dosyasını aşağıdaki kodla değiştir.
        2. Yenile, "Dark mode" düğmesine tıkla, sonra tekrar yenile. Karanlık tema kalır.
        3. Geliştirici araçlarında *Application* sekmesini (Firefox'ta *Storage*), sonra *Local Storage*'ı aç. Değeri `dark` olan `theme` anahtarını görürsün. Sil ve yenile; varsayılan hâli yeniden görürsün.
        4. Commit et: `git add .` ve `git commit -m "Remember theme"`.
    code:
      - file: js/main.js
        lang: js
        text: |
          const KEY = "theme";
          const toggle = document.querySelector("#theme-toggle");

          function savedTheme() {
            try {
              const value = localStorage.getItem(KEY);
              return value === "dark" || value === "light" ? value : null;
            } catch {
              return null; // storage is blocked: just use the default
            }
          }

          function saveTheme(theme) {
            try {
              localStorage.setItem(KEY, theme);
            } catch {
              // storage is blocked: the choice lasts until the page closes
            }
          }

          function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            toggle.setAttribute("aria-pressed", String(theme === "dark"));
          }

          toggle.addEventListener("click", () => {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            applyTheme(next);
            saveTheme(next);
          });

          const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
          applyTheme(savedTheme() ?? (prefersDark ? "dark" : "light"));
    mistakes:
      - problem:
          en: "Saving an object with `setItem(\"user\", {name: \"Ada\"})` and getting \"[object Object]\" back."
          tr: "`setItem(\"user\", {name: \"Ada\"})` ile nesne kaydedip \"[object Object]\" geri almak."
        fix:
          en: "`localStorage` stores only strings. Use `JSON.stringify(object)` to save and `JSON.parse(text)` to read."
          tr: "`localStorage` sadece string saklar. Kaydederken `JSON.stringify(nesne)`, okurken `JSON.parse(metin)` kullan."
      - problem:
          en: "Storing passwords or private data in `localStorage`."
          tr: "`localStorage` içinde parola ya da özel veri saklamak."
        fix:
          en: "Any script on your page can read it. Keep only harmless settings like a theme there."
          tr: "Sayfandaki her script onu okuyabilir. Orada sadece tema gibi zararsız ayarları tut."
    quiz:
      - q:
          en: "Why check that the saved value is \"dark\" or \"light\"?"
          tr: "Kayıtlı değerin \"dark\" ya da \"light\" olduğu neden kontrol ediliyor?"
        options:
          en: [Because localStorage is slow, Because stored data can be missing or edited and should not be trusted blindly, Because the browser requires it]
          tr: [localStorage yavaş olduğu için, Kayıtlı veri eksik olabilir ya da değiştirilmiş olabilir ve körü körüne güvenilmemeli, Tarayıcı zorunlu tuttuğu için]
        answer: 1
        why:
          en: "Anyone can edit local storage in the developer tools. Always validate input, even your own saved input."
          tr: "Local storage'ı geliştirici araçlarından herkes değiştirebilir. Girdiyi, kendi kaydettiğin girdi bile olsa, her zaman doğrula."
    sources:
      - title: "MDN: Using the Web Storage API"
        url: https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API/Using_the_Web_Storage_API
      - title: "MDN: Window.localStorage"
        url: https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage

  - id: fetch
    stage: data-api
    title:
      en: "Load your projects with fetch"
      tr: "fetch ile projelerini yükleme"
    minutes: 90
    needs: [storage]
    why:
      en: "Real sites load data from other places. `fetch` asks a web API (an address that returns data) for information. GitHub has a free public API, so your Projects section can list your real repositories and never go out of date."
      tr: "Gerçek siteler başka yerlerden veri yükler. `fetch`, bir web API'sinden (veri döndüren bir adres) bilgi ister. GitHub'ın ücretsiz, herkese açık bir API'si var; böylece Projeler bölümün gerçek repolarını listeler ve hiç eskimez."
    learn:
      en: |
        - What an API and JSON are, and what `fetch` returns (a Promise)
        - `async`/`await` and handling errors with `try`/`catch`
        - Checking `response.ok`: `fetch` does not throw for a 404 or 403
        - Building page elements with `createElement` and `textContent`
        - Splitting code into modules (`import`/`export`)
      tr: |
        - API ve JSON'un ne olduğu, `fetch`'in ne döndürdüğü (bir Promise)
        - `async`/`await` ve hataları `try`/`catch` ile yakalamak
        - `response.ok` kontrolü: `fetch` 404 ya da 403 için hata fırlatmaz
        - `createElement` ve `textContent` ile sayfa elemanları oluşturmak
        - Kodu modüllere bölmek (`import`/`export`)
    do:
      en: |
        1. Open https://api.github.com/users/octocat/repos in your browser. This is the data your page will use: a list of repositories as JSON.
        2. Create `js/repos.js` with the first code block. It holds the data logic (no page code), which makes it easy to test later.
        3. Replace `js/main.js` with the second code block. Change `GITHUB_USER` to your own GitHub username (you can keep `octocat` until you have repositories).
        4. If you added temporary cards in the layout step, remove them. Refresh the page served by `npx serve .`: the Projects section fills with cards.
        5. Test the failure path: in the *Network* tab choose *Offline* and reload. You should see the friendly message instead of an empty section.
        6. Commit: `git add .` and `git commit -m "Load projects from GitHub"`.
      tr: |
        1. Tarayıcıda https://api.github.com/users/octocat/repos adresini aç. Sayfanın kullanacağı veri bu: JSON olarak bir repo listesi.
        2. İlk kod bloğuyla `js/repos.js` dosyasını oluştur. Veri mantığını tutar (sayfa kodu yok); böylece sonra test etmesi kolay olur.
        3. `js/main.js` dosyasını ikinci kod bloğuyla değiştir. `GITHUB_USER` değerini kendi GitHub kullanıcı adınla değiştir (repoların olana kadar `octocat` kalabilir).
        4. Düzen adımında geçici kart eklediysen kaldır. `npx serve .` ile sunulan sayfayı yenile: Projeler bölümü kartlarla dolar.
        5. Hata yolunu dene: *Network* sekmesinde *Offline*'ı seç ve yeniden yükle. Boş bir bölüm yerine kullanıcı dostu mesajı görmelisin.
        6. Commit et: `git add .` ve `git commit -m "Load projects from GitHub"`.
    code:
      - file: js/repos.js
        lang: js
        text: |
          // Turns the raw GitHub answer into the few fields the page needs.
          export function pickRepos(list, max = 6) {
            return list
              .filter((repo) => !repo.fork && !repo.archived)
              .sort(
                (a, b) =>
                  b.stargazers_count - a.stargazers_count ||
                  new Date(b.pushed_at) - new Date(a.pushed_at),
              )
              .slice(0, max)
              .map((repo) => ({
                name: repo.name,
                description: repo.description ?? "No description yet.",
                url: repo.html_url,
                language: repo.language,
                stars: repo.stargazers_count,
              }));
          }

          // Asks GitHub for the public repositories of a user.
          // `fetchFn` is a parameter so tests can pass a fake instead of the network.
          export async function loadRepos(user, fetchFn = fetch) {
            const response = await fetchFn(
              `https://api.github.com/users/${encodeURIComponent(user)}/repos?per_page=100`,
            );
            if (!response.ok) {
              throw new Error(`GitHub answered ${response.status}`);
            }
            return pickRepos(await response.json());
          }
      - file: js/main.js
        lang: js
        text: |
          import { loadRepos } from "./repos.js";

          const GITHUB_USER = "octocat"; // put your own GitHub username here
          const KEY = "theme";
          const toggle = document.querySelector("#theme-toggle");
          const list = document.querySelector("#repos");
          const status = document.querySelector("#repos-status");

          // --- theme ---

          function savedTheme() {
            try {
              const value = localStorage.getItem(KEY);
              return value === "dark" || value === "light" ? value : null;
            } catch {
              return null;
            }
          }

          function saveTheme(theme) {
            try {
              localStorage.setItem(KEY, theme);
            } catch {
              // storage is blocked: the choice lasts until the page closes
            }
          }

          function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            toggle.setAttribute("aria-pressed", String(theme === "dark"));
          }

          toggle.addEventListener("click", () => {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            applyTheme(next);
            saveTheme(next);
          });

          const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
          applyTheme(savedTheme() ?? (prefersDark ? "dark" : "light"));

          // --- projects ---

          function card(repo) {
            const item = document.createElement("li");
            item.className = "card";

            const title = document.createElement("h3");
            const link = document.createElement("a");
            link.href = repo.url;
            link.textContent = repo.name;
            title.append(link);

            const description = document.createElement("p");
            description.textContent = repo.description;

            const meta = document.createElement("p");
            meta.textContent = `${repo.language ?? "Mixed"}, ${repo.stars} stars`;

            item.append(title, description, meta);
            return item;
          }

          async function showRepos() {
            status.textContent = "Loading projects...";
            try {
              const repos = await loadRepos(GITHUB_USER);
              list.replaceChildren(...repos.map(card));
              status.textContent = repos.length ? "" : "No public projects yet.";
            } catch (error) {
              console.error(error);
              status.textContent = "Could not load projects right now. Please try again later.";
            }
          }

          showRepos();
    mistakes:
      - problem:
          en: "The page prints \"[object Promise]\" or `undefined` instead of data."
          tr: "Sayfa veri yerine \"[object Promise]\" ya da `undefined` yazıyor."
        fix:
          en: "`fetch` and `response.json()` return Promises. Put `await` in front of both, inside an `async` function."
          tr: "`fetch` ve `response.json()` Promise döndürür. İkisinin önüne de `async` fonksiyon içinde `await` koy."
      - problem:
          en: "Treating a 403 or 404 answer as success, then crashing on the data."
          tr: "403 ya da 404 cevabını başarı sanıp veride hata almak."
        fix:
          en: "`fetch` only fails on network problems. Always check `response.ok` (as `loadRepos` does) and throw an error yourself."
          tr: "`fetch` sadece ağ sorunlarında hata verir. Her zaman `response.ok` kontrol et (`loadRepos`'ta olduğu gibi) ve hatayı kendin fırlat."
      - problem:
          en: "Error 403 \"rate limit exceeded\" after many reloads."
          tr: "Çok sayıda yenilemeden sonra 403 \"rate limit exceeded\" hatası."
        fix:
          en: "GitHub allows 60 requests per hour per IP address without a token. Wait, or see the performance step where we cache the answer. Never put a token in front-end code: everyone can read it."
          tr: "GitHub, token olmadan IP adresi başına saatte 60 isteğe izin verir. Bekle ya da cevabı önbelleğe aldığımız performans adımına bak. Front-end koduna asla token koyma: herkes okuyabilir."
    quiz:
      - q:
          en: "What does `fetch` do when the server answers 404?"
          tr: "Sunucu 404 cevabı verince `fetch` ne yapar?"
        options:
          en: [Throws an error, Resolves normally and you must check response.ok, Retries three times]
          tr: [Hata fırlatır, Normal şekilde tamamlanır ve response.ok değerini senin kontrol etmen gerekir, Üç kere yeniden dener]
        answer: 1
        why:
          en: "`fetch` rejects only when the request cannot be made at all (no network). HTTP errors are normal responses with `ok` set to false."
          tr: "`fetch` sadece istek hiç yapılamadığında (ağ yok) reddedilir. HTTP hataları `ok` değeri false olan normal cevaplardır."
      - q:
          en: "Why set `textContent` instead of building HTML strings with the repository description?"
          tr: "Repo açıklamasıyla HTML metni oluşturmak yerine neden `textContent` kullanıyoruz?"
        options:
          en: [It is shorter, The text is shown as plain text and can never run as code, It works in more browsers]
          tr: [Daha kısa, Metin düz yazı olarak gösterilir ve asla kod olarak çalışamaz, Daha çok tarayıcıda çalışır]
        answer: 1
        why:
          en: "The description is written by someone else. As text it is safe; as HTML it could contain a script. The security step explains this in detail."
          tr: "Açıklamayı başkası yazmış. Metin olarak güvenli; HTML olarak içinde script olabilir. Güvenlik adımı bunu ayrıntılı anlatıyor."
