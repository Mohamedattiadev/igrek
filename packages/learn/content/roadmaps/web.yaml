          tr: "API'den gelen metin için hangi satır güvenlidir?"
        options:
          en: ["el.innerHTML = text", "el.textContent = text", "el.outerHTML = text"]
          tr: ["el.innerHTML = text", "el.textContent = text", "el.outerHTML = text"]
        answer: 1
        why:
          en: "`textContent` always treats the value as plain text. The other two parse it as HTML."
          tr: "`textContent` değeri her zaman düz metin sayar. Diğer ikisi HTML olarak çözümler."
      - q:
          en: "Can a Content Security Policy replace safe coding?"
          tr: "Content Security Policy güvenli kod yazmanın yerini tutar mı?"
        options:
          en: [Yes it blocks everything, No it is a second safety net on top of safe code, Only on GitHub Pages]
          tr: [Evet her şeyi engeller, Hayır güvenli kodun üstüne ikinci bir güvenlik ağıdır, Sadece GitHub Pages'te]
        answer: 1
        why:
          en: "Defense in depth: safe code is the first layer and CSP limits the damage if a mistake slips through."
          tr: "Katmanlı savunma: güvenli kod birinci katman, CSP ise bir hata kaçarsa zararı sınırlar."
    sources:
      - title: "MDN: Cross-site scripting (XSS)"
        url: https://developer.mozilla.org/en-US/docs/Web/Security/Attacks/XSS
      - title: "MDN: Content Security Policy (CSP)"
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP
      - title: "MDN: Node.textContent"
        url: https://developer.mozilla.org/en-US/docs/Web/API/Node/textContent

  - id: performance
    stage: performance
    title:
      en: "Make it fast and measure it"
      tr: "Hızlandırma ve ölçme"
    minutes: 50
    needs: [security]
    why:
      en: "Visitors leave slow pages. A static site is already fast, so the job is to not slow it down and to measure instead of guessing. Lighthouse in your browser gives a score and concrete advice, for free."
      tr: "Ziyaretçiler yavaş sayfaları terk eder. Statik site zaten hızlıdır; iş onu yavaşlatmamak ve tahmin yerine ölçmek. Tarayıcındaki Lighthouse ücretsiz olarak bir puan ve somut öneriler verir."
    learn:
      en: |
        - Measuring first: Lighthouse and the Network tab
        - Giving images `width` and `height` so the page does not jump while loading
        - Do not lazy-load the first image on the page; lazy-load images further down
        - `preconnect` to start the connection to `api.github.com` early
        - Caching the API answer in `sessionStorage` to save requests and avoid the rate limit
      tr: |
        - Önce ölçmek: Lighthouse ve Network sekmesi
        - Sayfa yüklenirken zıplamasın diye görsellere `width` ve `height` vermek
        - Sayfadaki ilk görseli lazy-load yapma; daha aşağıdakileri yap
        - `api.github.com` bağlantısını erken başlatmak için `preconnect`
        - İstek sayısını azaltmak ve limite takılmamak için API cevabını `sessionStorage`'da önbelleğe almak
    do:
      en: |
        1. Measure first. Open the served page in Chrome or Edge, open developer tools, go to the *Lighthouse* tab and run it for *Mobile*. Note the four scores. (Firefox has no Lighthouse; use the *Network* tab and look at the total size and time.)
        2. Create `images/me.svg` (first code block). It is a simple placeholder; replace it later with your own photo, saved as `.jpg`, `.png` or `.webp` and no wider than about 640 pixels.
        3. In `index.html` add the image to the hero section, and the `preconnect` line in `<head>` (second code block). Notice `width` and `height`: the browser reserves the space before the image arrives.
        4. Add the image styles at the end of `style.css` (third code block).
        5. Replace `js/main.js` with the cached version (fourth code block). The repository list is saved for the browser session, so reloads do not call GitHub again.
        6. Run Lighthouse again and compare. Run `npm test` too, then commit: `git add .` and `git commit -m "Faster page"`.
      tr: |
        1. Önce ölç. Sunulan sayfayı Chrome ya da Edge'de aç, geliştirici araçlarında *Lighthouse* sekmesine git ve *Mobile* için çalıştır. Dört puanı not et. (Firefox'ta Lighthouse yok; *Network* sekmesinde toplam boyuta ve süreye bak.)
        2. `images/me.svg` dosyasını oluştur (ilk kod bloğu). Basit bir yer tutucu; sonra kendi fotoğrafınla değiştir (`.jpg`, `.png` ya da `.webp` olarak kaydet, genişliği yaklaşık 640 pikseli geçmesin).
        3. `index.html` içinde hero bölümüne görseli, `<head>` içine `preconnect` satırını ekle (ikinci kod bloğu). `width` ve `height` değerlerine dikkat: tarayıcı görsel gelmeden yerini ayırır.
        4. Görsel stillerini `style.css` dosyasının sonuna ekle (üçüncü kod bloğu).
        5. `js/main.js` dosyasını önbellekli sürümle değiştir (dördüncü kod bloğu). Repo listesi tarayıcı oturumu boyunca saklanır; yenilemeler GitHub'ı tekrar çağırmaz.
        6. Lighthouse'u yeniden çalıştır ve karşılaştır. `npm test` de çalıştır, sonra commit et: `git add .` ve `git commit -m "Faster page"`.
    code:
      - file: images/me.svg
        lang: svg
        text: |
          <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
            <rect width="160" height="160" fill="#0b5cad"/>
            <circle cx="80" cy="62" r="28" fill="#ffffff"/>
            <path d="M24 148c0-30 24-48 56-48s56 18 56 48z" fill="#ffffff"/>
          </svg>
      - file: index.html
        lang: html
        text: |
          <!-- add inside <head> -->
          <link rel="preconnect" href="https://api.github.com" crossorigin>

          <!-- add as the first line inside <section class="hero"> -->
          <img src="images/me.svg" alt="Portrait of Your Name" width="160" height="160">
      - file: style.css
        lang: css
        text: |
          /* add at the end of style.css */
          .hero img {
            display: block;
            max-width: 100%;
            height: auto;
            margin-bottom: 1rem;
            border-radius: 50%;
          }
      - file: js/main.js
        lang: js
        text: |
          import { loadRepos } from "./repos.js";

          const GITHUB_USER = "octocat"; // put your own GitHub username here
          const KEY = "theme";
          const CACHE_KEY = "repos-v1";
          const toggle = document.querySelector("#theme-toggle");
          const list = document.querySelector("#repos");
          const status = document.querySelector("#repos-status");

          // --- theme ---

          function savedTheme() {
            try {
              const value = localStorage.getItem(KEY);
              return value === "dark" || value === "light" ? value : null;
            } catch {
              return null;
            }
          }

          function saveTheme(theme) {
            try {
              localStorage.setItem(KEY, theme);
            } catch {
              // storage is blocked: the choice lasts until the page closes
            }
          }

          function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            toggle.setAttribute("aria-pressed", String(theme === "dark"));
          }

          toggle.addEventListener("click", () => {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            applyTheme(next);
            saveTheme(next);
          });

          const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
          applyTheme(savedTheme() ?? (prefersDark ? "dark" : "light"));

          // --- projects ---

          // Keeps the list for this browser session so reloads do not call GitHub again.
          async function reposWithCache() {
            try {
              const saved = sessionStorage.getItem(CACHE_KEY);
              if (saved) return JSON.parse(saved);
            } catch {
              // no cache available: fall through and ask GitHub
            }
            const repos = await loadRepos(GITHUB_USER);
            try {
              sessionStorage.setItem(CACHE_KEY, JSON.stringify(repos));
            } catch {
              // storage is blocked: skip the cache
            }
            return repos;
          }

          function card(repo) {
            const item = document.createElement("li");
            item.className = "card";

            const title = document.createElement("h3");
            const link = document.createElement("a");
            link.href = repo.url;
            link.textContent = repo.name;
            title.append(link);

            const description = document.createElement("p");
            description.textContent = repo.description;

            const meta = document.createElement("p");
            meta.textContent = `${repo.language ?? "Mixed"}, ${repo.stars} stars`;

            item.append(title, description, meta);
            return item;
          }

          async function showRepos() {
            status.textContent = "Loading projects...";
            try {
              const repos = await reposWithCache();
              list.replaceChildren(...repos.map(card));
              status.textContent = repos.length ? "" : "No public projects yet.";
            } catch (error) {
              console.error(error);
              status.textContent = "Could not load projects right now. Please try again later.";
            }
          }

          showRepos();
    mistakes:
      - problem:
          en: "Adding `loading=\"lazy\"` to the first image on the page."
          tr: "Sayfadaki ilk görsele `loading=\"lazy\"` eklemek."
        fix:
          en: "Lazy loading delays the image until it is near the screen, which makes the visible top of the page slower. Use it only for images below the first screen."
          tr: "Lazy loading görseli ekrana yaklaşana kadar geciktirir; sayfanın görünen üst kısmını yavaşlatır. Sadece ilk ekranın altındaki görsellerde kullan."
      - problem:
          en: "Putting a 4000-pixel photo from a phone straight into the site."
          tr: "Telefondan çıkan 4000 piksellik fotoğrafı doğrudan siteye koymak."
        fix:
          en: "Resize it to the size it is shown at (about twice that for sharp screens) and save it as WebP or JPEG. Big images are the most common reason for slow pages."
          tr: "Gösterildiği boyuta küçült (keskin ekranlar için yaklaşık iki katı) ve WebP ya da JPEG olarak kaydet. Büyük görseller yavaş sayfaların en yaygın nedenidir."
      - problem:
          en: "Optimizing without measuring."
          tr: "Ölçmeden optimize etmek."
        fix:
          en: "Run Lighthouse before and after. Fix the biggest item it names first; ignore small gains."
          tr: "Öncesinde ve sonrasında Lighthouse çalıştır. Önce söylediği en büyük sorunu düzelt; küçük kazançları boş ver."
    quiz:
      - q:
          en: "Why do images get `width` and `height` attributes?"
          tr: "Görsellere neden `width` ve `height` öznitelikleri veriliyor?"
        options:
          en: [To make the file smaller, So the browser reserves the space and the page does not jump when the image loads, Because HTML requires them]
          tr: [Dosya küçülsün diye, Tarayıcı yeri ayırsın ve görsel yüklenince sayfa zıplamasın diye, HTML zorunlu tuttuğu için]
        answer: 1
        why:
          en: "A jumping layout is called layout shift and it is one of the things Lighthouse measures."
          tr: "Zıplayan düzene layout shift (düzen kayması) denir ve Lighthouse'un ölçtüğü şeylerden biridir."
    sources:
      - title: "Chrome for Developers: Lighthouse overview"
        url: https://developer.chrome.com/docs/lighthouse/overview
      - title: "MDN: Lazy loading"
        url: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/Lazy_loading
      - title: "MDN: Using the Web Storage API (sessionStorage)"
        url: https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API/Using_the_Web_Storage_API

  - id: packaging
    stage: packaging
    title:
      en: "Get the site ready to publish"
      tr: "Siteyi yayına hazırlama"
    minutes: 45
    needs: [performance]
    why:
      en: "Without a build tool, packaging is simple: decide which files belong on the internet (the site) and which stay at home (tests, notes). A last check plus a few meta tags make the site look right in search results and when someone shares the link."
      tr: "Build aracı olmadan paketleme basit: hangi dosyaların internete gideceğine (site) ve hangilerinin evde kalacağına (testler, notlar) karar verirsin. Son bir kontrol ve birkaç meta etiketi, siteyi arama sonuçlarında ve biri bağlantıyı paylaşınca doğru gösterir."
    learn:
      en: |
        - Meta tags: `description`, `theme-color`, Open Graph (`og:`) for link previews
        - A favicon, and a `404.html` page that GitHub Pages shows for unknown addresses
        - A small script that copies only the site files into a `_site` folder
        - A test that checks the page itself: every local file it uses exists and every image has an alt text
      tr: |
        - Meta etiketleri: `description`, `theme-color`, bağlantı önizlemeleri için Open Graph (`og:`)
        - Bir favicon ve GitHub Pages'in bilinmeyen adreslerde gösterdiği `404.html` sayfası
        - Sadece site dosyalarını `_site` klasörüne kopyalayan küçük bir script
        - Sayfanın kendisini kontrol eden bir test: kullandığı her yerel dosya var mı, her görselin alt metni var mı
    do:
      en: |
        1. Create `favicon.svg`, `404.html` and `scripts/package.js` with the code below. In `404.html`, replace `personal-site` in the link with your repository name (the one you will create in the next step).
        2. Replace `package.json` with the new version (it adds the `package` command).
        3. Replace `index.html` with the final version below: it collects everything added so far plus the new meta tags and favicon. Change the name and texts to yours.
        4. Create `test/site.test.js` (last code block) and run `npm test`. Break it on purpose (rename `style.css` for a moment) to see the "missing file" message, then undo.
        5. Run `npm run package`. A `_site` folder appears with only the files visitors need. Open it with `npx serve _site` to check that the packaged site works.
        6. Commit: `git add .` and `git commit -m "Prepare for publishing"`.
      tr: |
        1. Aşağıdaki kodla `favicon.svg`, `404.html` ve `scripts/package.js` dosyalarını oluştur. `404.html` içindeki bağlantıda `personal-site` yerine repo adını yaz (bir sonraki adımda oluşturacağın repo).
        2. `package.json` dosyasını yeni sürümle değiştir (`package` komutunu ekler).
        3. `index.html` dosyasını aşağıdaki son sürümle değiştir: şimdiye kadar eklenen her şeyi ve yeni meta etiketleriyle favicon'u içerir. Ad ve metinleri kendine göre değiştir.
        4. `test/site.test.js` dosyasını oluştur (son kod bloğu) ve `npm test` çalıştır. Bilerek boz (`style.css` adını bir an değiştir) ve "missing file" mesajını gör, sonra geri al.
        5. `npm run package` çalıştır. Sadece ziyaretçilerin ihtiyacı olan dosyalarla bir `_site` klasörü oluşur. Paketlenmiş sitenin çalıştığını görmek için `npx serve _site` ile aç.
        6. Commit et: `git add .` ve `git commit -m "Prepare for publishing"`.
    code:
      - file: favicon.svg
        lang: svg
        text: |
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
            <rect width="32" height="32" rx="6" fill="#0b5cad"/>
            <text x="16" y="23" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">Y</text>
          </svg>
      - file: 404.html
        lang: html
        text: |
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Page not found</title>
            </head>
            <body>
              <h1>Page not found</h1>
              <p>That address does not exist. <a href="/personal-site/">Go to the home page</a>.</p>
            </body>
          </html>
      - file: scripts/package.js
        lang: js
        text: |
          // Copies only what visitors need into the _site folder.
          import { cpSync, mkdirSync, rmSync } from "node:fs";

          const files = ["index.html", "404.html", "style.css", "favicon.svg", "js", "images"];

          rmSync("_site", { recursive: true, force: true });
          mkdirSync("_site");
          for (const file of files) {
            cpSync(file, `_site/${file}`, { recursive: true });
          }
          console.log(`Packaged ${files.length} items into _site`);
      - file: package.json
        lang: json
        text: |
          {
            "name": "personal-site",
            "private": true,
            "type": "module",
            "scripts": {
              "test": "node --test",
              "package": "node scripts/package.js"
            }
          }
      - file: index.html
        lang: html
        text: |
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Your Name - personal site</title>
              <meta name="description" content="Projects and notes from Your Name, a web developer in training.">
              <meta name="theme-color" content="#0b5cad">
              <meta property="og:title" content="Your Name - personal site">
              <meta property="og:description" content="Projects and notes from Your Name, a web developer in training.">
              <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; img-src 'self'">
              <link rel="icon" href="favicon.svg" type="image/svg+xml">
              <link rel="preconnect" href="https://api.github.com" crossorigin>
              <link rel="stylesheet" href="style.css">
              <script type="module" src="js/main.js"></script>
            </head>
            <body>
              <a class="skip" href="#main">Skip to content</a>
              <header class="site-header">
                <p class="brand">Your Name</p>
                <nav aria-label="Main">
                  <a href="#about">About</a>
                  <a href="#projects">Projects</a>
                  <a href="#contact">Contact</a>
                </nav>
                <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
              </header>
              <main id="main">
                <section class="hero">
                  <img src="images/me.svg" alt="Portrait of Your Name" width="160" height="160">
                  <h1>Hi, I am Your Name</h1>
                  <p>I am learning to build for the web.</p>
                </section>
                <section id="about">
                  <h2>About</h2>
                  <p>I write HTML, CSS and JavaScript by hand. This site is my practice project.</p>
                </section>
                <section id="projects">
                  <h2>Projects</h2>
                  <p id="repos-status" role="status">Projects will show up here soon.</p>
                  <ul id="repos" class="cards"></ul>
                </section>
                <section id="contact">
                  <h2>Contact</h2>
                  <p>Write to <a href="mailto:you@example.com">you@example.com</a>.</p>
                </section>
              </main>
              <footer>
                <p>Built with HTML, CSS and JavaScript. No framework.</p>
              </footer>
            </body>
          </html>
      - file: test/site.test.js
        lang: js
        text: |
          import assert from "node:assert/strict";
          import { existsSync, readFileSync } from "node:fs";
          import { test } from "node:test";

          const html = readFileSync(new URL("../index.html", import.meta.url), "utf8");

          test("the page has a language, a title and a description", () => {
            assert.match(html, /<html lang="[a-z-]+"/);
            assert.match(html, /<title>[^<]+<\/title>/);
            assert.match(html, /<meta name="description" content="[^"]+"/);
          });

          test("every local file the page uses exists", () => {
            // Finds href="..." and src="..." that are not links to other sites, anchors or mailto.
            const paths = [...html.matchAll(/(?:href|src)="([^"#:]+)"/g)].map((match) => match[1]);
            assert.ok(paths.length > 0);
            for (const path of paths) {
              assert.ok(existsSync(new URL(`../${path}`, import.meta.url)), `missing file: ${path}`);
            }
          });

          test("every image has an alt text", () => {
            for (const tag of html.match(/<img\b[^>]*>/g) ?? []) {
              assert.match(tag, /\salt="[^"]+"/);
            }
          });
    mistakes:
      - problem:
          en: "Sharing the link and the preview shows a blank title or no description."
          tr: "Bağlantıyı paylaşınca önizlemede başlık boş ya da açıklama yok."
        fix:
          en: "Add the `og:` meta tags and a `description`. Some apps cache previews, so a change can take a while to show."
          tr: "`og:` meta etiketlerini ve `description` ekle. Bazı uygulamalar önizlemeyi önbelleğe alır; değişiklik görünmek için biraz zaman alabilir."
      - problem:
          en: "Publishing the whole folder, including `test/` and `package.json`."
          tr: "Tüm klasörü, `test/` ve `package.json` dahil, yayınlamak."
        fix:
          en: "Visitors do not need them. Copy only the site files to `_site` and publish that folder, as `scripts/package.js` does."
          tr: "Ziyaretçilerin bunlara ihtiyacı yok. `scripts/package.js` gibi sadece site dosyalarını `_site` içine kopyala ve o klasörü yayınla."
      - problem:
          en: "File names with capital letters (`Style.css`) work on your computer but give 404 online."
          tr: "Büyük harfli dosya adları (`Style.css`) bilgisayarında çalışıyor ama internette 404 veriyor."
        fix:
          en: "Web servers usually treat names as case-sensitive. Use lowercase names everywhere and write them exactly in the HTML."
          tr: "Web sunucuları genelde adları büyük/küçük harfe duyarlı kabul eder. Her yerde küçük harfli adlar kullan ve HTML'de birebir aynı yaz."
    quiz:
      - q:
          en: "Why does the project copy files to `_site` instead of publishing the whole folder?"
          tr: "Proje neden tüm klasörü yayınlamak yerine dosyaları `_site` içine kopyalıyor?"
        options:
          en: [GitHub Pages cannot publish the root folder, Only the files visitors need go online and nothing private or useless is published, It makes the site faster by itself]
          tr: [GitHub Pages kök klasörü yayınlayamaz, İnternete sadece ziyaretçilerin ihtiyacı olan dosyalar gider; özel ya da gereksiz bir şey yayınlanmaz, Siteyi kendiliğinden hızlandırır]
        answer: 1
        why:
          en: "What you publish is public. Choosing the files on purpose avoids leaking notes, drafts or settings by accident."
          tr: "Yayınladığın her şey herkese açıktır. Dosyaları bilerek seçmek, not, taslak ya da ayarların yanlışlıkla sızmasını önler."
    sources:
      - title: "MDN: Webpage metadata"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Webpage_metadata
      - title: "MDN: The Open Graph protocol and meta tags"
        url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta
      - title: "Node.js: file system (cpSync)"
        url: https://nodejs.org/api/fs.html#fscpsyncsrc-dest-options

  - id: deploy
    stage: deploy
    title:
      en: "Publish on GitHub Pages"
      tr: "GitHub Pages'te yayınlama"
    minutes: 60
    needs: [packaging]
    why:
      en: "Publishing makes your site reachable by anyone with the link. With GitHub Actions, every push to main tests, packages and publishes the site by itself, for free."
      tr: "Yayınlamak siteni bağlantıya sahip herkesin erişebileceği hale getirir. GitHub Actions ile main'e her push'ta site kendiliğinden test edilir, paketlenir ve ücretsiz yayınlanır."
    learn:
      en: |
        - Putting your project on GitHub
        - A GitHub Actions workflow that tests, packages and deploys
        - Where the site lives: `https://<user>.github.io/<repo>/`
      tr: |
        - Projeni GitHub'a koymak
        - Test eden, paketleyen ve yayınlayan bir GitHub Actions workflow'u
        - Sitenin nerede durduğu: `https://<kullanıcı>.github.io/<repo>/`
    do:
      en: |
        1. Create an empty repository named `personal-site` on github.com (no README, no .gitignore). Make it public: GitHub Pages is free for public repositories.
        2. Connect and push (first commands below).
        3. Create `.github/workflows/deploy.yml` with the content below, commit and push.
        4. On GitHub: *Settings → Pages → Build and deployment → Source: GitHub Actions*.
        5. Open the *Actions* tab and wait for the green check (you may need to re-run the workflow after step 4: *Re-run all jobs*).
        6. Open `https://<your-user>.github.io/personal-site/`. Your site is live. Check that the Projects section loads and the dark mode button works.
      tr: |
        1. github.com'da `personal-site` adında boş bir repo oluştur (README ve .gitignore olmadan). Herkese açık yap: GitHub Pages herkese açık repolar için ücretsizdir.
        2. Bağla ve push et (aşağıdaki ilk komutlar).
        3. Aşağıdaki içerikle `.github/workflows/deploy.yml` dosyasını oluştur, commit ve push et.
        4. GitHub'da: *Settings → Pages → Build and deployment → Source: GitHub Actions*.
        5. *Actions* sekmesini aç ve yeşil onayı bekle (4. adımdan sonra workflow'u yeniden çalıştırman gerekebilir: *Re-run all jobs*).
        6. `https://<kullanıcı-adın>.github.io/personal-site/` adresini aç. Siten yayında. Projeler bölümünün yüklendiğini ve karanlık mod düğmesinin çalıştığını kontrol et.
    code:
      - file: terminal
        lang: sh
        text: |
          git remote add origin https://github.com/<your-user>/personal-site.git
          git push -u origin main
      - file: .github/workflows/deploy.yml
        lang: yaml
        text: |
          name: Deploy to GitHub Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-node@v7
                  with:
                    node-version: lts/*
                - run: npm test
                - run: npm run package
                - uses: actions/configure-pages@v6
                - uses: actions/upload-pages-artifact@v5
                  with:
                    path: ./_site
                - id: deployment
                  uses: actions/deploy-pages@v5
    mistakes:
      - problem:
          en: "The workflow fails at the deploy step with an error about Pages not being enabled."
          tr: "Workflow deploy adımında, Pages'in açık olmadığını söyleyen bir hatayla başarısız oluyor."
        fix:
          en: "Do step 4 (*Settings → Pages → Source: GitHub Actions*), then re-run the workflow."
          tr: "4. adımı yap (*Settings → Pages → Source: GitHub Actions*), sonra workflow'u yeniden çalıştır."
      - problem:
          en: "The page loads but style or script is missing (404 in the Network tab)."
          tr: "Sayfa açılıyor ama stil ya da script eksik (Network sekmesinde 404)."
        fix:
          en: "Use relative paths like `style.css` and `js/main.js`, not `/style.css`. A leading slash points to `github.io/` instead of `github.io/personal-site/`."
          tr: "`/style.css` değil, `style.css` ve `js/main.js` gibi göreli yollar kullan. Baştaki eğik çizgi `github.io/personal-site/` yerine `github.io/` adresine gider."
      - problem:
          en: "The site shows an old version after a push."
          tr: "Push'tan sonra site eski sürümü gösteriyor."
        fix:
          en: "Check the *Actions* tab: the run must be green and finished. Then hard-refresh with Ctrl+Shift+R (Cmd+Shift+R on macOS) to skip the browser cache."
          tr: "*Actions* sekmesine bak: çalıştırma yeşil ve bitmiş olmalı. Sonra tarayıcı önbelleğini atlamak için Ctrl+Shift+R (macOS'ta Cmd+Shift+R) ile yenile."
    quiz:
      - q:
          en: "Why does the workflow run `npm test` before packaging?"
          tr: "Workflow paketlemeden önce neden `npm test` çalıştırıyor?"
        options:
          en: [GitHub requires it, So a broken version is never published, To make the package smaller]
          tr: [GitHub zorunlu tutuyor, Bozuk bir sürüm asla yayınlanmasın diye, Paket küçülsün diye]
        answer: 1
        why:
          en: "If a test fails the job stops and the last good version stays online."
          tr: "Bir test başarısız olursa iş durur ve son sağlam sürüm yayında kalır."
    sources:
      - title: GitHub Pages with a custom workflow
        url: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
      - title: GitHub Pages quickstart
        url: https://docs.github.com/en/pages/quickstart
      - title: Pushing to a remote (Git)
        url: https://git-scm.com/book/en/v2/Git-Basics-Working-with-Remotes

  - id: monitoring
    stage: monitoring
    title:
      en: "Know when the site is down or broken"
      tr: "Sitenin ne zaman çöktüğünü ya da bozulduğunu öğrenme"
    minutes: 40
    needs: [deploy]
    why:
      en: "A site can break without you touching it: GitHub can change something, the API can start refusing requests. A daily automatic check tells you before your visitors do, and the page itself must fail politely."
      tr: "Bir site sen dokunmadan da bozulabilir: GitHub bir şeyi değiştirebilir, API istekleri reddetmeye başlayabilir. Günlük otomatik bir kontrol, ziyaretçilerinden önce sana haber verir; sayfanın kendisi de nazikçe hata vermeli."
    learn:
      en: |
        - A scheduled GitHub Actions workflow (`cron`) that opens the live site once a day
        - How GitHub emails you when a workflow fails
        - Reading the browser Console and Network tab when a visitor reports a problem
        - What the page shows when the GitHub API is down (you built this in the fetch step)
      tr: |
        - Canlı siteyi günde bir kez açan zamanlanmış bir GitHub Actions workflow'u (`cron`)
        - Bir workflow başarısız olunca GitHub'ın sana nasıl e-posta gönderdiği
        - Bir ziyaretçi sorun bildirdiğinde tarayıcıda Console ve Network sekmelerini okumak
        - GitHub API çalışmadığında sayfanın ne gösterdiği (fetch adımında yaptın)
    do:
      en: |
        1. Create `.github/workflows/check-site.yml` with the content below. It downloads your live page every day and fails if the page is missing or has no `<title>`. It finds your address by itself from the repository name.
        2. Commit and push. On GitHub open *Actions → Check site → Run workflow* to run it once now. It should turn green.
        3. See what a failure looks like: temporarily change the address in the file to `.../does-not-exist/`, run it, and watch it turn red. GitHub sends an email to the person who last changed the schedule. Undo the change.
        4. Practice reading problems: open your live site, press F12, and look at the Console (red errors) and Network tab (red rows, status codes). Block `api.github.com` by choosing *Offline* and reload: the page should show the "Could not load projects" message and stay usable.
        5. Optional: a free uptime service such as UptimeRobot can ping your site every few minutes and email you.
        6. Commit: `git add .` and `git commit -m "Daily site check"`.
      tr: |
        1. Aşağıdaki içerikle `.github/workflows/check-site.yml` dosyasını oluştur. Canlı sayfanı her gün indirir; sayfa yoksa ya da `<title>` içermiyorsa başarısız olur. Adresini repo adından kendisi bulur.
        2. Commit ve push et. GitHub'da *Actions → Check site → Run workflow* ile şimdi bir kez çalıştır. Yeşil olmalı.
        3. Başarısızlığın nasıl göründüğünü gör: dosyadaki adresi geçici olarak `.../does-not-exist/` yap, çalıştır ve kırmızıya dönmesini izle. GitHub, zamanlamayı en son değiştiren kişiye e-posta gönderir. Değişikliği geri al.
        4. Sorun okumayı alıştır: canlı siteni aç, F12'ye bas ve Console'a (kırmızı hatalar) ve Network sekmesine (kırmızı satırlar, durum kodları) bak. *Offline*'ı seçerek `api.github.com` erişimini kes ve yenile: sayfa "Could not load projects" mesajını göstermeli ve kullanılabilir kalmalı.
        5. İsteğe bağlı: UptimeRobot gibi ücretsiz bir uptime servisi siteni birkaç dakikada bir kontrol edip sana e-posta atabilir.
        6. Commit et: `git add .` ve `git commit -m "Daily site check"`.
    code:
      - file: .github/workflows/check-site.yml
        lang: yaml
        text: |
          name: Check site

          on:
            schedule:
              - cron: "17 6 * * *" # every day at 06:17 UTC
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - name: Download the live page
                  run: curl --fail --silent --show-error --location --output page.html "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
                - name: Check the page has a title
                  run: grep -q "<title>" page.html
    mistakes:
      - problem:
          en: "The scheduled workflow never runs."
          tr: "Zamanlanmış workflow hiç çalışmıyor."
        fix:
          en: "Scheduled workflows run only from the default branch (`main`) and GitHub pauses them in public repositories with no activity for 60 days. Push a change or press *Enable workflow* in the Actions tab."
          tr: "Zamanlanmış workflow'lar sadece varsayılan branch'ten (`main`) çalışır ve GitHub, 60 gün hareketsiz kalan herkese açık repolarda bunları durdurur. Bir değişiklik push et ya da Actions sekmesinde *Enable workflow*'a bas."
      - problem:
          en: "Only checking that the server answers, while the page itself is broken."
          tr: "Sadece sunucunun cevap verdiğini kontrol edip sayfanın kendisinin bozuk olmasını gözden kaçırmak."
        fix:
          en: "Check for something the page must contain, like the `<title>` above. A blank page can still answer 200."
          tr: "Yukarıdaki `<title>` gibi sayfanın içermesi gereken bir şeyi kontrol et. Bomboş bir sayfa da 200 cevabı verebilir."
      - problem:
          en: "Ignoring errors in the Console because the page \"looks fine\"."
          tr: "Sayfa \"iyi görünüyor\" diye Console'daki hataları yok saymak."
        fix:
          en: "A red error often means a feature quietly does not work for some visitors. Keep the Console clean."
          tr: "Kırmızı bir hata çoğu zaman bir özelliğin bazı ziyaretçilerde sessizce çalışmadığı anlamına gelir. Console'u temiz tut."
    quiz:
      - q:
          en: "Why does the check look for `<title>` and not only for a 200 status?"
          tr: "Kontrol neden sadece 200 durumuna değil `<title>` varlığına da bakıyor?"
        options:
          en: [A title is faster to download, A server can answer 200 with an empty or wrong page, 200 is not a valid status]
          tr: [Title daha hızlı iner, Sunucu boş ya da yanlış bir sayfa için de 200 verebilir, 200 geçerli bir durum değil]
        answer: 1
        why:
          en: "Status 200 means the server answered, not that the content is right. A small content check catches more problems."
          tr: "200 durumu sunucunun cevap verdiği anlamına gelir, içeriğin doğru olduğu anlamına değil. Küçük bir içerik kontrolü daha çok sorunu yakalar."
    sources:
      - title: "GitHub Actions: the schedule event"
        url: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
      - title: "GitHub Actions: notifications for workflow runs"
        url: https://docs.github.com/en/subscriptions-and-notifications/concepts/about-notifications
      - title: "Chrome for Developers: Network features reference"
        url: https://developer.chrome.com/docs/devtools/network/reference

  - id: next
    stage: advanced
    title:
      en: "Polish it and choose what to learn next"
      tr: "Cilalama ve sırada ne öğreneceğini seçme"
    minutes: 60
    needs: [monitoring]
    why:
      en: "You now know the three layers of the web. Before you move on, a few small improvements make the site kinder to visitors without JavaScript or with motion sensitivity, and a plan for the next skill keeps you going."
      tr: "Artık web'in üç katmanını biliyorsun. İlerlemeden önce birkaç küçük iyileştirme, JavaScript'siz ya da hareket hassasiyeti olan ziyaretçilere siteyi daha nazik yapar; sıradaki beceri için bir plan da seni motive tutar."
    learn:
      en: |
        - `<noscript>` for visitors without JavaScript
        - `prefers-reduced-motion`: smooth scrolling only for people who did not turn animations off
        - Keyboard test: can you reach and use everything with Tab, Enter and Space?
        - Your own domain name (optional, paid) and what to learn next
      tr: |
        - JavaScript'i olmayan ziyaretçiler için `<noscript>`
        - `prefers-reduced-motion`: yumuşak kaydırma sadece animasyonları kapatmamış kişilere
        - Klavye testi: Tab, Enter ve Space ile her şeye ulaşıp kullanabiliyor musun?
        - Kendi alan adın (isteğe bağlı, ücretli) ve sırada ne öğreneceğin
    do:
      en: |
        1. In `index.html` add the `<noscript>` message (first code block) inside `<section id="projects">`, below the status line, so visitors without JavaScript know why the list is empty. Run `npm test`.
        2. Add the smooth-scroll rule at the end of `style.css` (second code block).
        3. Test with the keyboard only: press Tab from the top. The "Skip to content" link appears first, then the menu, then the button, each with a visible focus outline. Press Enter on the button to switch the theme.
        4. Run Lighthouse again on the live site and look at *Accessibility* and *SEO*. Fix what it names.
        5. Commit and push. The workflow publishes the update by itself.
        6. Where next: learn TypeScript to catch mistakes before running, then pick a framework (React, Vue or Svelte). You now understand what they build on: the DOM, events, fetch, modules and CSS. A custom domain is optional and costs money; your free `github.io` address is enough to show your work.
      tr: |
        1. `index.html` içinde `<noscript>` mesajını ekle (ilk kod bloğu): `<section id="projects">` içinde, durum satırının altına. JavaScript'siz ziyaretçiler listenin neden boş olduğunu anlasın. `npm test` çalıştır.
        2. Yumuşak kaydırma kuralını `style.css` dosyasının sonuna ekle (ikinci kod bloğu).
        3. Sadece klavyeyle test et: en üstten Tab'a bas. Önce "Skip to content" bağlantısı, sonra menü, sonra düğme gelir; hepsinde görünür bir odak çerçevesi olmalı. Temayı değiştirmek için düğmede Enter'a bas.
        4. Canlı sitede Lighthouse'u yeniden çalıştır ve *Accessibility* ile *SEO* puanlarına bak. Söylediklerini düzelt.
        5. Commit ve push et. Workflow güncellemeyi kendisi yayınlar.
        6. Sırada ne var: hataları çalıştırmadan yakalamak için TypeScript öğren, sonra bir framework seç (React, Vue ya da Svelte). Artık onların üzerine kurulduğu şeyleri anlıyorsun: DOM, olaylar, fetch, modüller ve CSS. Kendi alan adı isteğe bağlı ve ücretli; işini göstermek için ücretsiz `github.io` adresin yeter.
    code:
      - file: index.html
        lang: html
        text: |
          <!-- add inside <section id="projects">, below the status line -->
          <noscript><p>The project list needs JavaScript. You can see all my work on GitHub.</p></noscript>
      - file: style.css
        lang: css
        text: |
          /* add at the end of style.css */
          @media (prefers-reduced-motion: no-preference) {
            html {
              scroll-behavior: smooth;
            }
          }
    mistakes:
      - problem:
          en: "Removing the focus outline because it looks ugly (`outline: none`)."
          tr: "Çirkin görünüyor diye odak çerçevesini kaldırmak (`outline: none`)."
        fix:
          en: "Keyboard users cannot see where they are. If you restyle it, replace it with something equally visible, never with nothing."
          tr: "Klavye kullanıcıları nerede olduklarını göremez. Değiştiriyorsan aynı derecede görünür bir şeyle değiştir, asla hiçbir şeyle değil."
      - problem:
          en: "Starting a framework before the basics feel comfortable."
          tr: "Temeller rahat gelmeden bir framework'e başlamak."
        fix:
          en: "Extend this site first: add a contact form link, a blog page, a second language. Each one practices what you learned."
          tr: "Önce bu siteyi geliştir: bir iletişim bağlantısı, bir blog sayfası, ikinci bir dil ekle. Her biri öğrendiklerini pekiştirir."
    quiz:
      - q:
          en: "Why wrap smooth scrolling in `prefers-reduced-motion: no-preference`?"
          tr: "Yumuşak kaydırma neden `prefers-reduced-motion: no-preference` içine alınıyor?"
        options:
          en: [It is faster, Some people get dizzy from motion and set their system to reduce it, Older browsers need it]
          tr: [Daha hızlı, Bazı insanlar harekette başı döner ve sistemini azaltacak şekilde ayarlar, Eski tarayıcılar gerektirir]
        answer: 1
        why:
          en: "The setting is the visitor's way of asking for less motion. Respecting it is a small, real accessibility win."
          tr: "Bu ayar ziyaretçinin daha az hareket isteme yolu. Buna saygı göstermek küçük ama gerçek bir erişilebilirlik kazancı."
    sources:
      - title: "MDN: prefers-reduced-motion"
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-reduced-motion
      - title: "MDN: noscript element"
        url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/noscript
      - title: "MDN: Accessibility, learn"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility
