    why:
      en: "Now you join the two halves: find the best chunks, put them in the prompt, and make the model answer only from them and say where each fact came from. Sources let a reader check the answer, which is what makes an AI answer trustworthy."
      tr: "Şimdi iki yarıyı birleştiriyorsun: en iyi chunk'ları bul, prompt'a koy ve modelin sadece onlardan cevap vermesini, her bilginin nereden geldiğini söylemesini sağla. Kaynaklar okuyucunun cevabı kontrol etmesini sağlar; bir yapay zekâ cevabını güvenilir yapan da budur."
    learn:
      en: |
        - The RAG loop: **retrieve** (search the index), **augment** (build a prompt with the excerpts), **generate** (the model answers)
        - How a **grounding prompt** works: "use only these excerpts", "say you do not know", "cite like [1]"
        - How citations are checked in code: only numbers that match a real excerpt count, so the program never prints a source that does not exist
        - Why an exact refusal phrase ("I do not know based on the notes.") is useful: your code and your evals can detect it
        - Why `max_tokens` is set: it limits the length of the answer, so a rambling model cannot run for minutes
      tr: |
        - RAG döngüsü: **retrieve** (indeksi ara), **augment** (alıntılarla bir prompt kur), **generate** (model cevaplar)
        - **Dayanak prompt'u** nasıl çalışır: "sadece bu alıntıları kullan", "bilmiyorsan bilmediğini söyle", "[1] gibi kaynak göster"
        - Kaynak gösterimi kodda nasıl kontrol edilir: sadece gerçek bir alıntıya denk gelen numaralar sayılır; böylece program olmayan bir kaynağı asla yazmaz
        - Kesin bir ret cümlesinin ("I do not know based on the notes.") neden işe yaradığı: kodun ve evals'in onu tanıyabilir
        - `max_tokens` neden ayarlanıyor: cevabın uzunluğunu sınırlar; böylece gevezelik eden bir model dakikalarca çalışamaz
    do:
      en: |
        1. Create `rag.py`. `retrieve` searches, `build_messages` builds the prompt, `cited` finds which excerpts the answer mentions, `ask` runs all of it and returns an `Answer`.
        2. Create `commands/ask.py`, which prints the answer and the sources it cited.
        3. Ask questions the notes can answer, then one they cannot. The last one should get the exact refusal phrase.
        4. Look at `search` for the same question: the sources should be the chunks closest to the question.
        5. Commit: `git add .`, `git commit -m "Answer with sources"`.
      tr: |
        1. `rag.py` dosyasını oluştur. `retrieve` arar, `build_messages` prompt'u kurar, `cited` cevabın hangi alıntılardan söz ettiğini bulur, `ask` hepsini çalıştırıp bir `Answer` döndürür.
        2. `commands/ask.py` dosyasını oluştur; cevabı ve gösterdiği kaynakları yazdırır.
        3. Notların cevaplayabileceği sorular sor, sonra cevaplayamayacağı bir soru. Sonuncusu kesin ret cümlesini almalı.
        4. Aynı soru için `search` komutuna bak: kaynaklar soruya en yakın chunk'lar olmalı.
        5. Commit'le: `git add .`, `git commit -m "Answer with sources"`.
    code:
      - file: docshelper/rag.py
        lang: python
        text: |
          import re
          from dataclasses import dataclass

          from . import embeddings, llm, store

          SYSTEM = (
              "You answer questions about the user's notes. Use only the numbered excerpts you are given. "
              'If they do not contain the answer, say exactly: "I do not know based on the notes." '
              "Cite the excerpts you used like [1] or [2]. Keep the answer short."
          )


          @dataclass
          class Answer:
              text: str
              sources: list[tuple[int, store.Hit]]  # (number, excerpt) the answer cites
              retrieved: list[store.Hit]            # every excerpt the model was shown
              warning: str = ""


          def retrieve(question: str, k: int = 4) -> list[store.Hit]:
              db = store.connect()
              try:
                  return store.search(db, embeddings.embed_query(question), k)
              finally:
                  db.close()


          def build_messages(question: str, hits: list[store.Hit]) -> list[dict]:
              excerpts = "\n\n".join(f"[{number}] ({hit.source}, {hit.heading})\n{hit.text}" for number, hit in enumerate(hits, start=1))
              return [
                  {"role": "system", "content": SYSTEM},
                  {"role": "user", "content": f"Excerpts:\n\n{excerpts}\n\nQuestion: {question}"},
              ]


          def cited(text: str, hits: list[store.Hit]) -> list[tuple[int, store.Hit]]:
              numbers = {int(number) for number in re.findall(r"\[(\d+)\]", text)}
              return [(number, hit) for number, hit in enumerate(hits, start=1) if number in numbers]


          def ask(question: str, k: int = 4) -> Answer:
              hits = retrieve(question, k)
              text = llm.chat(build_messages(question, hits), temperature=0, max_tokens=400)
              return Answer(text, cited(text, hits), hits)
      - file: docshelper/commands/ask.py
        lang: python
        text: |
          from .. import rag
          from ..errors import UserError


          def run(args: list[str]) -> None:
              if not args:
                  raise UserError('Usage: python -m docshelper ask "your question"')
              answer = rag.ask(" ".join(args))
              print(answer.text)
              if answer.warning:
                  print(f"\nWarning: {answer.warning}")
              if answer.sources:
                  print("\nSources:")
                  for number, hit in answer.sources:
                      print(f"  [{number}] {hit.source} ({hit.heading})")
      - file: terminal
        lang: sh
        text: |
          uv run python -m docshelper ask "How do I undo my last commit but keep my changes?"
          uv run python -m docshelper ask "Who is the release owner in October?"
          uv run python -m docshelper ask "What is the Wi-Fi password of the office?"
    mistakes:
      - problem:
          en: "The model answers from its own memory and ignores the excerpts."
          tr: "Model alıntıları yok sayıp kendi hafızasından cevap veriyor."
        fix:
          en: "Make the rule explicit and short in the system message, use `temperature=0`, and test with a question whose answer only your notes have (the release owner). If a small model still ignores it, try a slightly bigger one."
          tr: "Kuralı system mesajında açık ve kısa yaz, `temperature=0` kullan ve cevabı sadece notlarında olan bir soruyla test et (release sahibi). Küçük model yine de dinlemiyorsa biraz daha büyüğünü dene."
      - problem:
          en: "Sources are missing even though the answer is right."
          tr: "Cevap doğru olduğu halde kaynaklar yok."
        fix:
          en: "Small models forget the citation rule sometimes. Keep the rule in the system message, and in step 10 you add a warning for answers without a citation."
          tr: "Küçük modeller kaynak kuralını bazen unutur. Kuralı system mesajında tut; 10. adımda kaynaksız cevaplar için bir uyarı ekleyeceksin."
      - problem:
          en: "Too many chunks (a large `k`) make the answer worse and slower."
          tr: "Çok fazla chunk (büyük `k`) cevabı kötüleştiriyor ve yavaşlatıyor."
        fix:
          en: "Start with 3 or 4. More text means more tokens, more noise and a longer wait. Raise `k` only if the evals show that the right chunk is often missing."
          tr: "3 ya da 4 ile başla. Daha fazla metin daha çok token, daha çok gürültü ve daha uzun bekleme demek. `k` değerini sadece evals doğru chunk'ın sık sık eksik olduğunu gösterirse artır."
    quiz:
      - q:
          en: "What is the main reason to make the model cite the excerpt numbers?"
          tr: "Modele alıntı numaralarını yazdırmanın ana nedeni nedir?"
        options:
          en:
            - "It makes the answer longer"
            - "A reader can check where each fact came from"
            - "It speeds up the search"
          tr:
            - "Cevabı uzatır"
            - "Okuyucu her bilginin nereden geldiğini kontrol edebilir"
            - "Aramayı hızlandırır"
        answer: 1
        why:
          en: "Without sources you can only trust or distrust the model. With sources you can open the note and verify."
          tr: "Kaynak yoksa modele ancak güvenir ya da güvenmezsin. Kaynak varsa notu açıp doğrulayabilirsin."
    sources:
      - title: sqlite-vec KNN queries
        url: https://alexgarcia.xyz/sqlite-vec/features/knn.html
      - title: Ollama OpenAI compatibility
        url: https://docs.ollama.com/api/openai-compatibility

  - id: agent
    stage: data-api
    title:
      en: "Tools and a small agent loop"
      tr: "Araçlar ve küçük bir agent döngüsü"
    minutes: 60
    needs: [ask]
    why:
      en: "With RAG, your code decides what to search. With tools, the model decides: it can list notes, search, or open a whole note, and keep going until it has the answer. That loop is what people call an agent, and it is only a few lines."
      tr: "RAG'de neyin aranacağına kodun karar verir. Araçlarda karar modeldedir: notları listeleyebilir, arayabilir ya da bir notun tamamını açabilir ve cevabı bulana kadar devam eder. İnsanların agent dediği bu döngü ve sadece birkaç satır."
    learn:
      en: |
        - What **tool calling** is: you describe functions to the model (name, purpose, arguments). The model never runs them. It replies with "please call `search_notes` with this query", **your code** runs the function and sends the result back.
        - The **agent loop**: ask the model, run the tools it requested, add the results to the conversation, ask again, until it answers with plain text
        - Why the loop needs a **step limit** (`max_steps`): a confused model could ask for tools forever
        - Why tool errors go back to the model as text: it can read "No such note" and try something else
        - Why not every model can do this: look for the `tools` label on the model's page at ollama.com/library. `llama3.2` and `qwen3` have it.
      tr: |
        - **Araç çağırma** (tool calling) nedir: modele fonksiyonları tarif edersin (ad, amaç, argümanlar). Model onları asla çalıştırmaz. "`search_notes` fonksiyonunu şu sorguyla çağır" diye cevap verir, fonksiyonu **senin kodun** çalıştırır ve sonucu geri gönderir.
        - **Agent döngüsü**: modele sor, istediği araçları çalıştır, sonuçları konuşmaya ekle, düz metinle cevap verene kadar tekrar sor
        - Döngünün neden **adım sınırına** (`max_steps`) ihtiyacı var: kafası karışan bir model sonsuza kadar araç isteyebilir
        - Araç hatalarının neden metin olarak modele geri gittiği: "No such note" yazısını okuyup başka bir şey deneyebilir
        - Her model bunu neden yapamaz: modelin ollama.com/library sayfasında `tools` etiketine bak. `llama3.2` ve `qwen3`'te var.
    do:
      en: |
        1. Create `tools.py` with three read-only tools: `list_notes`, `search_notes` and `read_note`. `TOOLS` is the description the model sees. `call_tool` runs a tool and turns any problem into text.
        2. Notice that `read_note` only opens `.md` files inside the notes folder (`find_note` in `notes.py`). The model chooses the file name, so you must never trust it.
        3. Create `agent.py` (the loop) and `commands/agent.py`.
        4. Run it. The program prints each tool call, so you can watch the model work. Ask a question that needs a search, and a question that needs the whole note ("Summarize the release process").
        5. Try to trick it: ask it to read `../pyproject.toml`. The tool must answer with an error, and the model should say it cannot.
        6. Commit: `git add .`, `git commit -m "Agent with tools"`.
      tr: |
        1. Üç salt okunur araçla `tools.py` dosyasını oluştur: `list_notes`, `search_notes` ve `read_note`. `TOOLS`, modelin gördüğü tariftir. `call_tool` bir aracı çalıştırır ve her sorunu metne çevirir.
        2. `read_note`'un sadece not klasörünün içindeki `.md` dosyalarını açtığına dikkat et (`notes.py` içindeki `find_note`). Dosya adını model seçiyor; ona asla güvenmemelisin.
        3. `agent.py` (döngü) ve `commands/agent.py` dosyalarını oluştur.
        4. Çalıştır. Program her araç çağrısını yazdırır; böylece modelin çalışmasını izlersin. Arama gerektiren bir soru ve notun tamamını gerektiren bir soru sor ("Release sürecini özetle").
        5. Kandırmayı dene: ondan `../pyproject.toml` dosyasını okumasını iste. Araç hata ile cevap vermeli ve model okuyamadığını söylemeli.
        6. Commit'le: `git add .`, `git commit -m "Agent with tools"`.
    code:
      - file: docshelper/tools.py
        lang: python
        text: |
          import json

          from . import embeddings, notes, store
          from .errors import UserError


          def list_notes() -> list[str]:
              """List the file names of all notes."""
              return [notes.note_name(path) for path in notes.note_paths()]


          def search_notes(query: str, k: int = 3) -> list[dict[str, str]]:
              """Find the note excerpts that best match a question or some keywords."""
              k = max(1, min(k, 8))
              db = store.connect()
              try:
                  hits = store.search(db, embeddings.embed_query(query), k)
              finally:
                  db.close()
              return [{"source": hit.source, "heading": hit.heading, "text": hit.text} for hit in hits]


          def read_note(name: str) -> str:
              """Read one whole note by file name, for example git-undo.md."""
              return notes.read_note_text(notes.find_note(name))[:6000]


          FUNCTIONS = {"list_notes": list_notes, "search_notes": search_notes, "read_note": read_note}

          # The same three tools described in the format chat models expect.
          TOOLS = [
              {
                  "type": "function",
                  "function": {
                      "name": "list_notes",
                      "description": "List the file names of all notes.",
                      "parameters": {"type": "object", "properties": {}},
                  },
              },
              {
                  "type": "function",
                  "function": {
                      "name": "search_notes",
                      "description": "Find the note excerpts that best match a question or some keywords.",
                      "parameters": {
                          "type": "object",
                          "properties": {"query": {"type": "string", "description": "what to look for"}},
                          "required": ["query"],
                      },
                  },
              },
              {
                  "type": "function",
                  "function": {
                      "name": "read_note",
                      "description": "Read one whole note by file name, for example git-undo.md.",
                      "parameters": {
                          "type": "object",
                          "properties": {"name": {"type": "string", "description": "the note's file name"}},
                          "required": ["name"],
                      },
                  },
              },
          ]


          def call_tool(name: str, arguments: dict) -> str:
              """Run a tool the model asked for. Problems come back as text so the model can try again."""
              function = FUNCTIONS.get(name)
              if function is None:
                  return f"Error: there is no tool called {name}."
              try:
                  return json.dumps(function(**arguments), ensure_ascii=False)
              except (TypeError, UserError) as error:
                  return f"Error: {error}"
      - file: docshelper/agent.py
        lang: python
        text: |
          import json

          from . import llm
          from .tools import TOOLS, call_tool

          SYSTEM = (
              "You answer questions about the user's Markdown notes. Use the tools to find the answer: "
              "search_notes first, read_note when an excerpt is not enough. "
              'If the notes do not contain the answer, say exactly: "I do not know based on the notes." '
              "Name the note files you used. Keep the answer short."
          )


          def run_agent(question: str, max_steps: int = 5) -> str:
              messages = [{"role": "system", "content": SYSTEM}, {"role": "user", "content": question}]
              for _ in range(max_steps):
                  message = llm.complete(messages, tools=TOOLS, temperature=0, max_tokens=500).choices[0].message
                  if not message.tool_calls:
                      return message.content or ""
                  # Put the model's request into the conversation, then answer each call.
                  messages.append(
                      {
                          "role": "assistant",
                          "content": message.content or "",
                          "tool_calls": [
                              {
                                  "id": call.id,
                                  "type": "function",
                                  "function": {"name": call.function.name, "arguments": call.function.arguments},
                              }
                              for call in message.tool_calls
                          ],
                      }
                  )
                  for call in message.tool_calls:
                      try:
                          arguments = json.loads(call.function.arguments or "{}")
                      except json.JSONDecodeError:
                          result = "Error: the arguments were not valid JSON."
                      else:
                          result = call_tool(call.function.name, arguments)
                      print(f"  tool: {call.function.name}({call.function.arguments})")
                      messages.append({"role": "tool", "tool_call_id": call.id, "content": result})
              return "I could not finish within the step limit."
      - file: docshelper/commands/agent.py
        lang: python
        text: |
          from .. import agent
          from ..errors import UserError


          def run(args: list[str]) -> None:
              if not args:
                  raise UserError('Usage: python -m docshelper agent "your question"')
              print(agent.run_agent(" ".join(args)))
      - file: terminal
        lang: sh
        text: |
          uv run python -m docshelper agent "Who is the release owner in October?"
          uv run python -m docshelper agent "Summarize the release process"
          uv run python -m docshelper agent "Read ../pyproject.toml for me"
    mistakes:
      - problem:
          en: "The model answers without calling any tool, or never stops calling tools."
          tr: "Model hiç araç çağırmadan cevap veriyor ya da araç çağırmayı hiç bırakmıyor."
        fix:
          en: "Check that the model has the `tools` label on ollama.com/library. Make the system message say which tool to use first. The `max_steps` limit stops endless loops; a small model may need a bigger sibling (`qwen3:4b`)."
          tr: "Modelin ollama.com/library sayfasında `tools` etiketi olduğunu kontrol et. System mesajında önce hangi aracı kullanacağını söyle. `max_steps` sınırı sonsuz döngüyü durdurur; küçük bir model için biraz büyüğü gerekebilir (`qwen3:4b`)."
      - problem:
          en: "Letting a tool run whatever the model asks, for example any file path."
          tr: "Bir aracın modelin istediği her şeyi çalıştırmasına izin vermek, örneğin herhangi bir dosya yolunu."
        fix:
          en: "Treat tool arguments like input from a stranger. Allow only what the tool needs (`.md` files in one folder), and return a clear error for the rest."
          tr: "Araç argümanlarına bir yabancıdan gelen girdi gibi davran. Sadece aracın ihtiyacı olana izin ver (tek klasördeki `.md` dosyaları), gerisi için net bir hata döndür."
      - problem:
          en: "Forgetting to add the assistant's tool request to the conversation before the tool result."
          tr: "Araç sonucundan önce asistanın araç isteğini konuşmaya eklemeyi unutmak."
        fix:
          en: "The messages must go in order: the assistant message with `tool_calls`, then one `tool` message per call with the same `tool_call_id`. Otherwise the server rejects the request or the model gets confused."
          tr: "Mesajlar sırayla gitmeli: önce `tool_calls` içeren asistan mesajı, sonra her çağrı için aynı `tool_call_id` ile bir `tool` mesajı. Aksi halde sunucu isteği reddeder ya da model şaşırır."
    quiz:
      - q:
          en: "Who actually runs the `read_note` function?"
          tr: "`read_note` fonksiyonunu gerçekte kim çalıştırır?"
        options:
          en:
            - "The model, inside Ollama"
            - "Your Python program, after the model asks for it"
            - "The operating system"
          tr:
            - "Model, Ollama'nın içinde"
            - "Model isteyince senin Python programın"
            - "İşletim sistemi"
        answer: 1
        why:
          en: "The model only produces the request. Your code runs the function, so your code decides what is allowed."
          tr: "Model sadece isteği üretir. Fonksiyonu senin kodun çalıştırır; neye izin verileceğine de kodun karar verir."
    sources:
      - title: Ollama tool calling
        url: https://docs.ollama.com/capabilities/tool-calling
      - title: Ollama model library, llama3.2
        url: https://ollama.com/library/llama3.2

  - id: mcp
    stage: data-api
    title:
      en: "Offer your tools as an MCP server"
      tr: "Araçlarını MCP sunucusu olarak sun"
    minutes: 45
    needs: [agent]
    why:
      en: "Your three tools work only inside your program. MCP (Model Context Protocol) is an open standard that lets any AI app, such as an editor or a chat app, use your tools without custom code. Write the tools once, use them everywhere."
      tr: "Üç aracın sadece senin programının içinde çalışıyor. MCP (Model Context Protocol), bir editör ya da sohbet uygulaması gibi herhangi bir yapay zekâ uygulamasının özel kod yazmadan senin araçlarını kullanmasını sağlayan açık bir standart. Araçları bir kez yaz, her yerde kullan."
    learn:
      en: |
        - What an **MCP server** is: a program that lists tools (name, description, arguments) and runs them when asked. The AI app is the **client**.
        - What the **stdio transport** is: the client starts your server as a child process and they talk through its standard input and output. No port, no network.
        - Why a stdio server must never `print()`: standard output carries the protocol, so stray text corrupts it. Messages for humans go to standard error (logging does this by default).
        - How the official Python SDK turns a function into a tool: the type hints become the argument schema and the docstring becomes the description
        - The SDK is at version 2: the server class is called `MCPServer` (it was `FastMCP` in version 1), so older articles show different imports
      tr: |
        - **MCP sunucusu** nedir: araçları listeleyen (ad, açıklama, argümanlar) ve istenince çalıştıran bir program. Yapay zekâ uygulaması **client**'tır.
        - **stdio transport** nedir: client sunucunu bir alt süreç olarak başlatır ve standart girdi/çıktı üzerinden konuşurlar. Port yok, ağ yok.
        - stdio sunucusunun neden asla `print()` kullanmaması gerektiği: standart çıktı protokolü taşır, başıboş bir metin onu bozar. İnsanlara mesajlar standart hataya gider (logging varsayılan olarak bunu yapar).
        - Resmî Python SDK'sının bir fonksiyonu nasıl araca çevirdiği: tür bilgileri argüman şemasına, docstring açıklamaya dönüşür
        - SDK 2. sürümde: sunucu sınıfının adı `MCPServer` (1. sürümde `FastMCP`'ti); bu yüzden eski yazılarda import'lar farklıdır
    do:
      en: |
        1. Create `mcp_server.py`. `expose` registers a function from `tools.py` as an MCP tool and turns a `UserError` into a clean tool error. The tools themselves are the same functions the agent uses.
        2. Create `commands/mcp.py`, so `python -m docshelper mcp` starts the server.
        3. Create `try_mcp.py`, a tiny MCP client. It starts your server, lists the tools and calls one, exactly as an AI app would.
        4. Run it. You should see the three tools with their descriptions, and then the start of a note.
        5. Do not run `python -m docshelper mcp` by hand and wait for output: it is silent and waits for a client. Press Ctrl+C to leave.
        6. Commit: `git add .`, `git commit -m "MCP server"`. In step 15 you connect it to a real AI app.
      tr: |
        1. `mcp_server.py` dosyasını oluştur. `expose`, `tools.py` içindeki bir fonksiyonu MCP aracı olarak kaydeder ve bir `UserError`'ı temiz bir araç hatasına çevirir. Araçların kendisi agent'ın kullandığı aynı fonksiyonlardır.
        2. `commands/mcp.py` dosyasını oluştur; böylece `python -m docshelper mcp` sunucuyu başlatır.
        3. `try_mcp.py` dosyasını oluştur; küçük bir MCP client'ı. Sunucunu başlatır, araçları listeler ve birini çağırır; tam olarak bir yapay zekâ uygulamasının yapacağı gibi.
        4. Çalıştır. Üç aracı açıklamalarıyla ve ardından bir notun başlangıcını görmelisin.
        5. `python -m docshelper mcp` komutunu elle çalıştırıp çıktı bekleme: sessizdir ve bir client bekler. Çıkmak için Ctrl+C.
        6. Commit'le: `git add .`, `git commit -m "MCP server"`. 15. adımda onu gerçek bir yapay zekâ uygulamasına bağlayacaksın.
    code:
      - file: docshelper/mcp_server.py
        lang: python
        text: |
          from functools import wraps

          from mcp.server import MCPServer
          from mcp.server.mcpserver.exceptions import ToolError

          from . import tools
          from .errors import UserError

          mcp = MCPServer("docs-helper")


          def expose(function):
              """Offer a function from tools.py as an MCP tool. Its type hints and docstring become the description."""

              @wraps(function)
              def wrapper(*args, **kwargs):
                  try:
                      return function(*args, **kwargs)
                  except UserError as error:  # a clean message for the client instead of a crash
                      raise ToolError(str(error)) from error

              return mcp.tool()(wrapper)


          expose(tools.list_notes)
          expose(tools.search_notes)
          expose(tools.read_note)

          if __name__ == "__main__":
              mcp.run()  # stdio: the client starts this program and talks to it through stdin and stdout
      - file: docshelper/commands/mcp.py
        lang: python
        text: |
          from ..mcp_server import mcp


          def run(args: list[str]) -> None:
              mcp.run()
      - file: try_mcp.py
        lang: python
        text: |
          """A tiny MCP client: starts the server and calls its tools, like an AI app would."""
          import asyncio
          import sys

          from mcp import Client, StdioServerParameters


          async def main() -> None:
              server = StdioServerParameters(command=sys.executable, args=["-m", "docshelper.mcp_server"])
              async with Client(server) as client:
                  listed = await client.list_tools()
                  for tool in listed.tools:
                      print(f"tool: {tool.name} - {tool.description}")
                  result = await client.call_tool("read_note", {"name": "release-process.md"})
                  print(result.content[0].text[:120])


          asyncio.run(main())
      - file: terminal
        lang: sh
        text: |
          uv run python try_mcp.py
    mistakes:
      - problem:
          en: "A `print()` in the server code makes the client fail with a strange protocol error."
          tr: "Sunucu kodundaki bir `print()` client'ın tuhaf bir protokol hatasıyla çökmesine yol açıyor."
        fix:
          en: "Never print to standard output in a stdio server. Use `logging` (it writes to standard error) or `print(..., file=sys.stderr)`."
          tr: "stdio sunucusunda standart çıktıya asla yazdırma. `logging` kullan (standart hataya yazar) ya da `print(..., file=sys.stderr)`."
      - problem:
          en: "`ModuleNotFoundError: mcp.server.fastmcp` after copying code from an older article."
          tr: "Eski bir yazıdan kod kopyalayınca `ModuleNotFoundError: mcp.server.fastmcp` hatası."
        fix:
          en: "That is the version 1 import. In version 2 use `from mcp.server import MCPServer`. The SDK has a migration guide."
          tr: "Bu 1. sürümün import'u. 2. sürümde `from mcp.server import MCPServer` kullan. SDK'nın bir geçiş rehberi var."
      - problem:
          en: "Tools with no type hints or docstring show up with empty descriptions."
          tr: "Tür bilgisi ya da docstring olmayan araçlar boş açıklamayla görünüyor."
        fix:
          en: "The model chooses a tool by its name and description. Give every tool a clear one-line docstring and typed arguments."
          tr: "Model bir aracı adı ve açıklamasıyla seçer. Her araca net, tek satırlık bir docstring ve türlü argümanlar ver."
    quiz:
      - q:
          en: "Why must a stdio MCP server never print to standard output?"
          tr: "stdio MCP sunucusu neden standart çıktıya asla yazdırmamalı?"
        options:
          en:
            - "Because printing is slow"
            - "Because standard output carries the protocol messages"
            - "Because Python forbids it"
          tr:
            - "Çünkü yazdırmak yavaş"
            - "Çünkü standart çıktı protokol mesajlarını taşır"
            - "Çünkü Python yasaklıyor"
        answer: 1
        why:
          en: "Client and server exchange JSON messages over standard output and input. Any extra text breaks the message stream."
          tr: "Client ve sunucu JSON mesajlarını standart çıktı ve girdi üzerinden değiş tokuş eder. Fazladan her metin mesaj akışını bozar."
    sources:
