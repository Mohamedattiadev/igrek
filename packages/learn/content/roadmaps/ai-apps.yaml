          # Release process

          ## Who does what
          The release owner for October is Dana. Dana approves every release and writes the changelog.

          ## Rules
          We never deploy on Fridays. Releases go out on Tuesday or Wednesday before 15:00. The staging site is reset every Monday morning.

          ## Rollback
          If the error rate goes above 2 percent for 10 minutes, roll back first and investigate after.
      - file: docshelper/structured.py
        lang: python
        text: |
          import json
          from typing import TypeVar

          from pydantic import BaseModel, ValidationError

          from . import llm
          from .errors import UserError

          T = TypeVar("T", bound=BaseModel)


          def chat_json(schema: type[T], messages: list[dict], retries: int = 1, **options) -> T:
              """Ask for JSON that fits a Pydantic model, check it, and ask again once if it does not fit."""
              schema_json = schema.model_json_schema()
              response_format = {
                  "type": "json_schema",
                  "json_schema": {"name": schema.__name__, "schema": schema_json, "strict": True},
              }
              # Telling the model the schema in words as well makes small models more reliable.
              messages = [
                  {"role": "system", "content": f"Reply only with JSON that matches this JSON schema:\n{json.dumps(schema_json)}"},
                  *messages,
              ]
              for attempt in range(retries + 1):
                  raw = llm.complete(messages, response_format=response_format, **options).choices[0].message.content or ""
                  try:
                      return schema.model_validate_json(raw)
                  except ValidationError as error:
                      if attempt == retries:
                          raise UserError(f"The model did not return valid {schema.__name__} JSON ({error.error_count()} problems).") from error
                      messages = [
                          *messages,
                          {"role": "assistant", "content": raw},
                          {"role": "user", "content": f"That did not fit the schema: {error}. Reply again with valid JSON only."},
                      ]
              raise AssertionError("unreachable")
      - file: docshelper/commands/describe.py
        lang: python
        text: |
          from pathlib import Path

          from pydantic import BaseModel, ConfigDict, Field

          from ..errors import UserError
          from ..structured import chat_json


          class NoteInfo(BaseModel):
              model_config = ConfigDict(extra="forbid")
              title: str
              tags: list[str] = Field(description="two to five lowercase tags")
              summary: str = Field(description="one plain sentence")


          def run(args: list[str]) -> None:
              if len(args) != 1:
                  raise UserError("Usage: python -m docshelper describe <path to a note>")
              path = Path(args[0])
              if not path.is_file():
                  raise UserError(f"No such file: {path}")
              text = path.read_text(encoding="utf-8")[:4000]
              info = chat_json(
                  NoteInfo,
                  [{"role": "user", "content": f"Describe this note.\n\n{text}"}],
                  temperature=0,
              )
              print(info.title)
              print("Tags: " + ", ".join(info.tags))
              print(info.summary)
      - file: terminal
        lang: sh
        text: |
          uv run python -m docshelper describe notes/release-process.md
