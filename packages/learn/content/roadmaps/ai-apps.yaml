      - file: docshelper/evals.py
        lang: python
        text: |
          import json
          from dataclasses import dataclass, field
          from pathlib import Path

          from . import rag


          @dataclass
          class Result:
              question: str
              answer: str
              problems: list[str] = field(default_factory=list)

              @property
              def passed(self) -> bool:
                  return not self.problems


          def load_cases(path: Path) -> list[dict]:
              return json.loads(path.read_text(encoding="utf-8"))


          def check(case: dict, answer: rag.Answer) -> list[str]:
              """What is wrong with an answer. Empty means it passes."""
              problems = []
              for word in case.get("must_include", []):
                  if word.lower() not in answer.text.lower():
                      problems.append(f"the answer does not contain {word!r}")
              source = case.get("source")
              if source and source not in {hit.source for hit in answer.retrieved}:
                  problems.append(f"{source} was not found by the search")
              return problems


          def run_evals(cases: list[dict], ask=None) -> list[Result]:
              ask = ask or rag.ask
              results = []
              for case in cases:
                  answer = ask(case["question"])
                  results.append(Result(case["question"], answer.text, check(case, answer)))
              return results
      - file: docshelper/commands/evals.py
        lang: python
        text: |
          from pathlib import Path

          from .. import evals
          from ..errors import UserError


          def run(args: list[str]) -> int:
              minimum = float(args[args.index("--min") + 1]) if "--min" in args else 0.8
              path = Path("evals/cases.json")
              if not path.is_file():
                  raise UserError("evals/cases.json not found. Run this from the project folder.")
              results = evals.run_evals(evals.load_cases(path))
              for result in results:
                  print(("PASS  " if result.passed else "FAIL  ") + result.question)
                  for problem in result.problems:
                      print(f"        {problem}")
                  if not result.passed:
                      print(f"        answer: {result.answer[:200]}")
              rate = sum(r.passed for r in results) / len(results)
              print(f"\n{sum(r.passed for r in results)} of {len(results)} passed ({rate:.0%}). Needed: {minimum:.0%}.")
              return 0 if rate >= minimum else 1
      - file: tests/test_evals.py
        lang: python
        text: |
          import json
          from pathlib import Path

          from docshelper import evals, rag
          from docshelper.store import Hit


          def fake_answer(text, source="release-process.md"):
              hit = Hit(source, "Who does what", "text", 0.1)
              return rag.Answer(text, [], [hit])


          def test_passing_case():
              case = {"question": "q", "must_include": ["Dana"], "source": "release-process.md"}
              assert evals.check(case, fake_answer("The owner is dana.")) == []


          def test_failing_cases_say_why():
              case = {"question": "q", "must_include": ["Dana"], "source": "git-undo.md"}
              problems = evals.check(case, fake_answer("I have no idea."))
              assert len(problems) == 2


          def test_run_evals_collects_results():
              cases = [{"question": "a", "must_include": ["yes"]}, {"question": "b", "must_include": ["yes"]}]
              answers = iter([fake_answer("yes"), fake_answer("no")])
              results = evals.run_evals(cases, ask=lambda question: next(answers))
              assert [r.passed for r in results] == [True, False]


          def test_the_real_case_file_is_well_formed():
              cases = evals.load_cases(Path(__file__).parent.parent / "evals" / "cases.json")
              assert len(cases) >= 5
              assert all("question" in case and case.get("must_include") for case in cases)
              json.dumps(cases)
