            - "Notların iyi yazıldığını"
        answer: 1
        why:
          en: "With a scripted model you test your own logic: the loop, the tools, the search, the checks. Answer quality needs evals."
          tr: "Senaryolu bir modelle kendi mantığını test edersin: döngü, araçlar, arama, kontroller. Cevap kalitesi için evals gerekir."
    sources:
