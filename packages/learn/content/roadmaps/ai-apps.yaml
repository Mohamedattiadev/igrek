id: ai-apps
title: AI apps
summary:
  en: "From an empty computer to your own AI app on the internet. You build a docs helper step by step: a small Python program that answers questions about a folder of Markdown notes, runs on a free local model, cites its sources, and you learn how to test, secure and watch it."
  tr: "Boş bir bilgisayardan internette yayında olan kendi yapay zekâ uygulamana. Adım adım bir dokümantasyon yardımcısı yazarsın: Markdown notlarından oluşan bir klasör hakkındaki soruları cevaplayan küçük bir Python programı. Ücretsiz bir yerel modelle çalışır, kaynak gösterir; onu nasıl test edeceğini, güvenli yapacağını ve izleyeceğini de öğrenirsin."
teacher: ai-engineer
after: [python]
project:
  en: 'A docs helper: a Python app that answers questions about a folder of Markdown notes. It starts as a plain chat call, then returns structured output, finds the right notes with embeddings and a local vector store (sqlite-vec) and cites them, uses tools in a small agent loop, offers its tools as an MCP server, and has evals, safety checks, streaming, a web API, a Docker image, a free deploy on Render and a log of every model call.'
  tr: 'Bir dokümantasyon yardımcısı: Markdown notlarından oluşan bir klasör hakkındaki soruları cevaplayan bir Python uygulaması. Düz bir sohbet çağrısıyla başlar; sonra yapılandırılmış çıktı verir, embedding''ler ve yerel bir vektör deposuyla (sqlite-vec) doğru notları bulup kaynak gösterir, küçük bir agent döngüsünde araçları kullanır, araçlarını MCP sunucusu olarak sunar; ayrıca evals, güvenlik kontrolleri, streaming, bir web API''si, bir Docker image''ı, Render''da ücretsiz deploy ve her model çağrısının kaydı vardır.'
detect:
  pip: [openai, mcp, ollama, anthropic, chromadb, sqlite-vec]
version: "2.3"
latest: pypi:mcp
checked: 2026-10
sheets: [python, fastapi, http, docker, git, sql]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Ollama, pull two small models and start the project"
      tr: "Ollama'yı kur, iki küçük model indir ve projeyi başlat"
    minutes: 40
    why:
      en: "An AI app needs a language model to talk to. Ollama runs open models on your own computer: it is free, needs no account, and your notes never leave your machine. You will use it for the whole roadmap, so no paid key is ever needed."
      tr: "Bir yapay zekâ uygulamasının konuşacağı bir dil modeline ihtiyacı var. Ollama açık modelleri kendi bilgisayarında çalıştırır: ücretsizdir, hesap gerektirmez ve notların makinenden hiç çıkmaz. Bütün yol haritası boyunca onu kullanacaksın; yani hiç ücretli anahtar gerekmez."
    learn:
      en: |
        - What a **language model** (LLM) is: a program that continues text. You send it messages and it sends back text.
        - What **Ollama** does: it downloads models and serves them on `http://localhost:11434`, so your code can call them like a web API
        - Which models fit a small computer. Sizes are what `ollama.com/library` shows for the default download:
          - `llama3.2:3b`, 2.0 GB, can use tools. The default of this roadmap.
          - `llama3.2:1b`, 1.3 GB, faster but weaker. Good if your computer is slow.
          - `qwen3:4b`, 2.5 GB, can use tools and "thinks" before answering, so it is slower.
          - `nomic-embed-text`, 274 MB, an **embedding model**: it turns text into numbers so you can search by meaning (step 4). It cannot chat.
        - Why the 8 GB rule: a model must fit in memory next to your system and browser. With 8 GB of RAM stay at 4 billion parameters ("4b") or less. `qwen3:8b` is 5.2 GB, too big for comfort.
      tr: |
        - **Dil modeli** (LLM) nedir: metni devam ettiren bir program. Ona mesaj gönderirsin, o da metin geri yollar.
        - **Ollama** ne yapar: modelleri indirir ve `http://localhost:11434` adresinde sunar; böylece kodun onları bir web API'si gibi çağırabilir
        - Hangi modeller küçük bir bilgisayara sığar. Boyutlar `ollama.com/library` sayfasında varsayılan indirme için yazanlardır:
          - `llama3.2:3b`, 2,0 GB, araç kullanabilir. Bu yol haritasının varsayılanı.
          - `llama3.2:1b`, 1,3 GB, daha hızlı ama daha zayıf. Bilgisayarın yavaşsa iyi.
          - `qwen3:4b`, 2,5 GB, araç kullanabilir ve cevap vermeden önce "düşünür"; bu yüzden daha yavaştır.
          - `nomic-embed-text`, 274 MB, bir **embedding modeli**: metni sayılara çevirir, böylece anlama göre arama yapabilirsin (4. adım). Sohbet edemez.
        - 8 GB kuralı neden var: model, sistemin ve tarayıcının yanında belleğe sığmalı. 8 GB RAM'de 4 milyar parametre ("4b") ya da daha küçük modellerde kal. `qwen3:8b` 5,2 GB; rahat sığmaz.
    do:
      en: |
        1. You need **uv**, an editor and Git from the Python roadmap. Check with `uv --version`. If uv is missing, install it from docs.astral.sh/uv.
        2. Install **Ollama**. On macOS and Windows download the app from ollama.com/download and open it. On Linux run the install command below. The server starts by itself (on Linux as a service).
        3. Check it: `ollama --version`. Opening `http://localhost:11434` in a browser (or `curl http://localhost:11434`) says "Ollama is running". If it does not, run `ollama serve` in a separate terminal and leave that terminal open.
        4. Download the two models. This is 2.3 GB in total, so make sure you have the disk space. It takes a few minutes.
        5. Try the chat model once from the terminal. The first answer is slow because the model is loading into memory.
        6. Models stay in memory for 5 minutes after their last use and then unload (Ollama FAQ). `ollama ps` shows what is loaded.
        7. Create the project folder. `uv init --bare` writes only a `pyproject.toml`, the file that lists your packages. `uv add` installs them into a private environment. `fastapi` and `uvicorn` are for step 12, `pytest` and `httpx` for step 8.
        8. Add the `.gitignore` file below, then save the first version: `git init`, `git add .`, `git commit -m "Start the docs helper"`.
      tr: |
        1. Python yol haritasından **uv**, bir editör ve Git gerekiyor. `uv --version` ile kontrol et. uv yoksa docs.astral.sh/uv adresinden kur.
        2. **Ollama**'yı kur. macOS ve Windows'ta ollama.com/download adresinden uygulamayı indirip aç. Linux'ta aşağıdaki kurulum komutunu çalıştır. Sunucu kendiliğinden başlar (Linux'ta bir servis olarak).
        3. Kontrol et: `ollama --version`. Tarayıcıda `http://localhost:11434` adresini açmak (ya da `curl http://localhost:11434`) "Ollama is running" yazdırır. Yazdırmıyorsa ayrı bir terminalde `ollama serve` çalıştır ve o terminali açık bırak.
        4. İki modeli indir. Toplam 2,3 GB; yeterli disk alanın olduğundan emin ol. Birkaç dakika sürer.
        5. Sohbet modelini terminalden bir kez dene. İlk cevap yavaş gelir, çünkü model belleğe yükleniyor.
        6. Modeller son kullanımdan sonra 5 dakika bellekte kalır, sonra boşaltılır (Ollama SSS). `ollama ps` neyin yüklü olduğunu gösterir.
        7. Proje klasörünü oluştur. `uv init --bare` sadece bir `pyproject.toml` yazar; paketlerini listeleyen dosya bu. `uv add` onları özel bir ortama kurar. `fastapi` ve `uvicorn` 12. adım için, `pytest` ve `httpx` 8. adım için.
        8. Aşağıdaki `.gitignore` dosyasını ekle, sonra ilk sürümü kaydet: `git init`, `git add .`, `git commit -m "Start the docs helper"`.
    code:
      - file: terminal
        lang: sh
        text: |
          # Linux only (macOS and Windows: download the app instead)
          curl -fsSL https://ollama.com/install.sh | sh

          ollama --version
          ollama pull llama3.2:3b
          ollama pull nomic-embed-text
          ollama run llama3.2:3b "Say hello in one short sentence."
          ollama list
          ollama ps

          mkdir docs-helper
          cd docs-helper
          uv init --bare --python 3.14
          uv add openai pydantic sqlite-vec mcp fastapi uvicorn
          uv add --dev pytest httpx
      - file: .gitignore
        lang: text
        text: |
          .venv/
          __pycache__/
          index.db
          calls.jsonl
          dist/
          .env
    mistakes:
      - problem:
          en: "`ollama pull` or the first answer is very slow, or the computer freezes."
          tr: "`ollama pull` ya da ilk cevap çok yavaş, ya da bilgisayar donuyor."
        fix:
          en: "The download is a few GB, so wait for it. If the computer freezes, the model is too big for your RAM: use `llama3.2:1b`, close the browser tabs, and set `LLM_MODEL=llama3.2:1b` later."
          tr: "İndirme birkaç GB; bekle. Bilgisayar donuyorsa model RAM'ine göre çok büyük: `llama3.2:1b` kullan, tarayıcı sekmelerini kapat ve ileride `LLM_MODEL=llama3.2:1b` ayarla."
      - problem:
          en: "\"command not found: ollama\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found: ollama\" hatası."
        fix:
          en: "Close the terminal and open a new one so it sees the new program. On Windows restart the terminal after the installer finishes."
          tr: "Terminali kapatıp yenisini aç ki yeni programı görsün. Windows'ta kurulum bitince terminali yeniden başlat."
      - problem:
          en: "Pulling a bigger model because \"bigger is smarter\"."
          tr: "\"Büyük olan daha akıllı\" diye daha büyük bir model indirmek."
        fix:
          en: "Bigger models are better, but one that does not fit in RAM is unusable. Start small, measure (step 9), and only then try a bigger one."
          tr: "Büyük modeller daha iyidir ama RAM'e sığmayan model kullanılamaz. Küçükle başla, ölç (9. adım) ve ancak sonra daha büyüğünü dene."
    quiz:
      - q:
          en: "Why does this roadmap use Ollama by default?"
          tr: "Bu yol haritası neden varsayılan olarak Ollama kullanıyor?"
        options:
          en:
            - "It is the only way to call a language model"
            - "It runs models on your own computer for free, with no account or key"
            - "It is faster than every hosted service"
          tr:
            - "Dil modelini çağırmanın tek yolu bu"
            - "Modelleri kendi bilgisayarında ücretsiz çalıştırır; hesap ya da anahtar gerekmez"
            - "Her barındırılan servisten daha hızlı"
        answer: 1
        why:
          en: "Hosted services are fine, but they need an account and usually a paid key. Ollama keeps the learning path free and your notes private."
          tr: "Barındırılan servisler de iyidir ama hesap ve genelde ücretli bir anahtar ister. Ollama öğrenme yolunu ücretsiz ve notlarını gizli tutar."
    sources:
      - title: Ollama quickstart
        url: https://docs.ollama.com/quickstart
      - title: Ollama on Linux
        url: https://docs.ollama.com/linux
      - title: Ollama model library, llama3.2
        url: https://ollama.com/library/llama3.2

  - id: first-call
    stage: first-code
    title:
      en: "Your first chat call"
      tr: "İlk sohbet çağrın"
    minutes: 35
    needs: [setup]
    why:
      en: "Everything in an AI app starts with one call: send messages to a model, get text back. Once you have this working and understand its pieces, RAG, agents and MCP are only more of the same."
      tr: "Bir yapay zekâ uygulamasındaki her şey tek bir çağrıyla başlar: modele mesaj gönder, metin geri al. Bunu çalıştırıp parçalarını anladığında RAG, agent ve MCP aynı şeyin devamıdır."
    learn:
      en: |
        - What a **message** is: a role (`system`, `user` or `assistant`) and a text. The `system` message sets the rules, the `user` message is the question.
        - Why the code uses the `openai` package even for Ollama: Ollama speaks the same HTTP protocol as OpenAI ("OpenAI-compatible"), so only the address (`base_url`) changes. That is how you can switch to another provider later with three environment variables.
        - What an **environment variable** is: a named setting outside your code. Never write a secret key into code.
        - What `temperature` does: 0 gives the most predictable answer, higher values give more varied ones
        - How the program is organized: `python -m docshelper <command>` runs `docshelper/commands/<command>.py`. Each step of this roadmap adds one file there.
      tr: |
        - **Mesaj** nedir: bir rol (`system`, `user` ya da `assistant`) ve bir metin. `system` mesajı kuralları koyar, `user` mesajı sorudur.
        - Ollama için bile neden `openai` paketini kullandığımız: Ollama, OpenAI ile aynı HTTP protokolünü konuşur ("OpenAI uyumlu"); yani sadece adres (`base_url`) değişir. İleride üç ortam değişkeniyle başka bir sağlayıcıya geçebilmenin yolu bu.
        - **Ortam değişkeni** nedir: kodunun dışında duran, adı olan bir ayar. Gizli bir anahtarı asla koda yazma.
        - `temperature` ne yapar: 0 en tahmin edilebilir cevabı verir, yüksek değerler daha çeşitli cevaplar verir
        - Programın düzeni: `python -m docshelper <komut>`, `docshelper/commands/<komut>.py` dosyasını çalıştırır. Bu yol haritasının her adımı oraya bir dosya ekler.
    do:
      en: |
        1. Inside the `docs-helper` folder, create the files below. The folder `docshelper` is your Python package (the code), `commands` inside it holds one file per command.
        2. `config.py` reads all settings from environment variables and has free local defaults. `errors.py` and `__main__.py` turn common problems (server not running, model not pulled) into one clear sentence instead of a long traceback.
        3. Run the first command. The first answer can take a minute while the model loads.
        4. Run it again with a different question, and run it with no command to see the list of commands.
        5. Optional, and never required: to use a hosted service that speaks the OpenAI protocol, set the three variables in the second block below in the same terminal. The code does not change. Keep the key in the terminal or a password manager, never in a file you commit. Skip this if you do not have a key.
        6. Commit: `git add .`, `git commit -m "First chat call"`.
      tr: |
        1. `docs-helper` klasörünün içinde aşağıdaki dosyaları oluştur. `docshelper` klasörü Python paketin (kod), içindeki `commands` her komut için bir dosya tutar.
        2. `config.py` bütün ayarları ortam değişkenlerinden okur ve ücretsiz yerel varsayılanları vardır. `errors.py` ile `__main__.py`, sık görülen sorunları (sunucu çalışmıyor, model indirilmemiş) uzun bir hata dökümü yerine tek net cümleye çevirir.
        3. İlk komutu çalıştır. Model yüklenirken ilk cevap bir dakika sürebilir.
        4. Farklı bir soruyla tekrar çalıştır; komutsuz çalıştırıp komut listesini de gör.
        5. İsteğe bağlı ve asla zorunlu değil: OpenAI protokolünü konuşan barındırılan bir servis kullanmak için aynı terminalde aşağıdaki ikinci bloktaki üç değişkeni ayarla. Kod değişmez. Anahtarı terminalde ya da bir parola yöneticisinde tut; commit'lediğin bir dosyaya asla yazma. Anahtarın yoksa bunu atla.
        6. Commit'le: `git add .`, `git commit -m "First chat call"`.
    code:
      - file: docshelper/__init__.py
        lang: python
        text: |
          """Docs helper: answers questions about a folder of Markdown notes."""
      - file: docshelper/commands/__init__.py
        lang: python
        text: |
          """Each file in this folder is one command: python -m docshelper <file name> ..."""
      - file: docshelper/errors.py
        lang: python
        text: |
          class UserError(Exception):
              """A problem the user can fix. The command line prints the message without a traceback."""
      - file: docshelper/config.py
        lang: python
        text: |
          import os
          from pathlib import Path

          # The chat model. The defaults point at Ollama on your own computer: free, no account.
          CHAT_BASE_URL = os.environ.get("LLM_BASE_URL", "http://localhost:11434/v1")
          CHAT_API_KEY = os.environ.get("LLM_API_KEY", "ollama")  # Ollama ignores the key but the client needs one
          CHAT_MODEL = os.environ.get("LLM_MODEL", "llama3.2:3b")

          # The embedding model (step 4). It can live on a different server than the chat model.
          EMBED_BASE_URL = os.environ.get("EMBED_BASE_URL", "http://localhost:11434/v1")
          EMBED_API_KEY = os.environ.get("EMBED_API_KEY", "ollama")
          EMBED_MODEL = os.environ.get("EMBED_MODEL", "nomic-embed-text")

          # Where the notes are and where the search index is kept.
          NOTES_DIR = Path(os.environ.get("NOTES_DIR", "notes"))
          DB_PATH = Path(os.environ.get("DB_PATH", "index.db"))
      - file: docshelper/llm.py
        lang: python
        text: |
          from functools import lru_cache

          from openai import OpenAI

          from . import config


          @lru_cache
          def chat_client() -> OpenAI:
              """One client for the whole program. The first call can be slow while the model loads."""
              return OpenAI(base_url=config.CHAT_BASE_URL, api_key=config.CHAT_API_KEY, timeout=300)


          def complete(messages: list[dict], **options):
              """Send messages to the chat model and return the whole response object."""
              return chat_client().chat.completions.create(model=config.CHAT_MODEL, messages=messages, **options)


          def chat(messages: list[dict], **options) -> str:
              """Send messages and return only the text of the reply."""
              return complete(messages, **options).choices[0].message.content or ""
      - file: docshelper/commands/chat.py
        lang: python
        text: |
          from .. import llm


          def run(args: list[str]) -> None:
              question = " ".join(args) or "Say hello in one short sentence."
              messages = [
                  {"role": "system", "content": "You are a helpful assistant. Answer in at most three sentences."},
                  {"role": "user", "content": question},
              ]
              print(llm.chat(messages, temperature=0))
      - file: docshelper/__main__.py
        lang: python
        text: |
          import importlib
          import pkgutil
          import sys

          import openai

          from . import commands, config
          from .errors import UserError


          def main(argv: list[str] | None = None) -> int:
              argv = sys.argv[1:] if argv is None else argv
              names = sorted(module.name for module in pkgutil.iter_modules(commands.__path__))
              if not argv or argv[0] not in names:
                  print("Usage: python -m docshelper <command> [text]")
                  print("Commands: " + ", ".join(names))
                  return 2
              try:
                  return importlib.import_module(f"docshelper.commands.{argv[0]}").run(argv[1:]) or 0
              except UserError as error:
                  print(f"Error: {error}", file=sys.stderr)
              except openai.APIConnectionError:
                  print(
                      f"Error: cannot reach the model server (chat: {config.CHAT_BASE_URL}, "
                      f"embeddings: {config.EMBED_BASE_URL}). With Ollama, is it running? Try: ollama serve",
                      file=sys.stderr,
                  )
              except openai.NotFoundError:
                  print(
                      f"Error: the server does not know a model. Chat model: {config.CHAT_MODEL}, "
                      f"embedding model: {config.EMBED_MODEL}. With Ollama, run: ollama pull <model name>",
                      file=sys.stderr,
                  )
              except openai.AuthenticationError:
                  print("Error: the server rejected the API key. Check LLM_API_KEY / EMBED_API_KEY.", file=sys.stderr)
              return 1


          if __name__ == "__main__":
              raise SystemExit(main())
      - file: terminal
        lang: sh
        text: |
          uv run python -m docshelper chat "What is a vector, in one sentence?"
          uv run python -m docshelper
      - file: terminal
        lang: sh
        text: |
          # Optional: a hosted OpenAI-compatible service instead of Ollama (macOS / Linux)
          export LLM_BASE_URL="https://api.openai.com/v1"
          export LLM_API_KEY="paste-your-key-here"
          export LLM_MODEL="the-model-name-from-the-provider"
          # Windows PowerShell: $env:LLM_API_KEY = "paste-your-key-here"
          # Back to free and local: close the terminal, or unset the three variables.
    mistakes:
      - problem:
          en: "\"cannot reach the model server\"."
          tr: "\"cannot reach the model server\" hatası."
        fix:
          en: "Ollama is not running. Open the Ollama app, or run `ollama serve` in another terminal. Check that `http://localhost:11434` answers."
          tr: "Ollama çalışmıyor. Ollama uygulamasını aç ya da başka bir terminalde `ollama serve` çalıştır. `http://localhost:11434` adresinin cevap verdiğini kontrol et."
      - problem:
          en: "\"the server does not know a model\" (a 404 error)."
          tr: "\"the server does not know a model\" hatası (404)."
        fix:
          en: "The model name in `LLM_MODEL` is not downloaded. Run `ollama list` to see the exact names, and `ollama pull llama3.2:3b` if it is missing."
          tr: "`LLM_MODEL` içindeki model indirilmemiş. Tam adları görmek için `ollama list` çalıştır; yoksa `ollama pull llama3.2:3b` ile indir."
      - problem:
          en: "`No module named docshelper`."
          tr: "`No module named docshelper` hatası."
        fix:
          en: "You are not in the project folder. Run `cd docs-helper` first, and always start with `uv run`."
          tr: "Proje klasöründe değilsin. Önce `cd docs-helper` çalıştır ve komutlara hep `uv run` ile başla."
    quiz:
      - q:
          en: "To switch from Ollama to a hosted OpenAI-compatible service, what do you change?"
          tr: "Ollama'dan barındırılan, OpenAI uyumlu bir servise geçmek için neyi değiştirirsin?"
        options:
          en:
            - "The three environment variables: address, key and model name"
            - "You rewrite llm.py"
            - "You must change the programming language"
          tr:
            - "Üç ortam değişkenini: adres, anahtar ve model adı"
            - "llm.py'yi baştan yazarsın"
            - "Programlama dilini değiştirmen gerekir"
        answer: 0
        why:
          en: "Both speak the same protocol, so only the address, the key and the model name differ. Config comes from the environment, not from code."
          tr: "İkisi de aynı protokolü konuşur; yani sadece adres, anahtar ve model adı farklıdır. Ayar koddan değil ortamdan gelir."
    sources:
      - title: Ollama OpenAI compatibility
        url: https://docs.ollama.com/api/openai-compatibility
      - title: OpenAI Python library
        url: https://github.com/openai/openai-python

  - id: structured
    stage: basics
    title:
      en: "Structured output: ask for JSON and check it"
      tr: "Yapılandırılmış çıktı: JSON iste ve kontrol et"
    minutes: 40
    needs: [first-call]
    why:
      en: "A program cannot do much with a paragraph of free text. When the model must fill fields (a title, tags, a summary), you ask for JSON that fits a schema and you check it. Models make mistakes, so checking is not optional."
      tr: "Bir program serbest metinden pek bir şey yapamaz. Modelin alanları doldurması gerektiğinde (başlık, etiketler, özet) bir şemaya uyan JSON istersin ve onu kontrol edersin. Modeller hata yapar; bu yüzden kontrol isteğe bağlı değildir."
    learn:
      en: |
        - What a **JSON schema** is: a description of the shape of the data you expect (field names and types)
        - How **Pydantic** turns a Python class into that schema and checks real data against it (`model_json_schema()`, `model_validate_json()`)
        - How `response_format` asks the server to produce JSON that fits the schema, and why you still validate: small models can fail, and some servers ignore the schema
        - Why the schema is also written into the prompt, and why `temperature=0` helps
        - The **retry** pattern: when validation fails, send the error back once and ask again
      tr: |
        - **JSON şeması** nedir: beklediğin verinin biçiminin tarifi (alan adları ve türleri)
        - **Pydantic**'in bir Python sınıfını nasıl şemaya çevirdiği ve gerçek veriyi ona göre kontrol ettiği (`model_json_schema()`, `model_validate_json()`)
        - `response_format`'ın sunucudan şemaya uyan JSON üretmesini nasıl istediği ve neden yine de doğruladığımız: küçük modeller başarısız olabilir, bazı sunucular şemayı yok sayar
        - Şemanın neden prompt'a da yazıldığı ve `temperature=0`'ın neden yardım ettiği
        - **Yeniden deneme** kalıbı: doğrulama başarısız olursa hatayı bir kez geri gönder ve tekrar iste
    do:
      en: |
        1. Make a `notes` folder in the project and create the four sample notes below. They are the "knowledge" of the helper for the rest of the roadmap, and the facts in them (the release owner, the Friday rule) are things no model could know. You can add your own notes later.
        2. Create `structured.py`. `chat_json` takes a Pydantic class, builds the schema, sends the request, validates the answer and retries once with the error message.
        3. Create `commands/describe.py`. `NoteInfo` is the shape you want back: a title, tags and a summary.
        4. Run it on a note and read the three lines it prints. Try the other notes, then run it twice on the same note: with `temperature=0` the result should be the same or nearly so.
        5. Commit: `git add .`, `git commit -m "Structured output"`.
      tr: |
        1. Projede bir `notes` klasörü aç ve aşağıdaki dört örnek notu oluştur. Yol haritasının geri kalanında yardımcının "bilgisi" bunlar; içlerindeki bilgileri (release sahibi, Cuma kuralı) hiçbir model bilemez. Kendi notlarını sonra ekleyebilirsin.
        2. `structured.py` dosyasını oluştur. `chat_json` bir Pydantic sınıfı alır, şemayı çıkarır, isteği gönderir, cevabı doğrular ve hata mesajıyla bir kez yeniden dener.
        3. `commands/describe.py` dosyasını oluştur. `NoteInfo` geri istediğin biçim: bir başlık, etiketler ve bir özet.
        4. Bir not üzerinde çalıştır ve yazdığı üç satırı oku. Diğer notları dene, sonra aynı notta iki kez çalıştır: `temperature=0` ile sonuç aynı ya da neredeyse aynı olmalı.
        5. Commit'le: `git add .`, `git commit -m "Structured output"`.
    code:
      - file: notes/git-undo.md
        lang: markdown
        text: |
          # Undoing things in Git

          ## Undo the last commit but keep the changes
          Run `git reset --soft HEAD~1`. The files stay as they were and are staged again.

          ## Throw away changes in one file
          Run `git restore notes.txt`. This cannot be undone, so check `git status` first.

          ## Undo a commit that is already pushed
          Do not rewrite shared history. Run `git revert <sha>`, which adds a new commit that cancels the old one.
      - file: notes/python-setup.md
        lang: markdown
        text: |
          # Python setup at our team

          ## Tools
          We use uv for everything. Create a project with `uv init`, add a package with `uv add requests` and run code with `uv run main.py`. Never run `pip install` in the system Python.

          ## Version
          The team standard is Python 3.14.
      - file: notes/docker-basics.md
        lang: markdown
        text: |
          # Docker basics

          ## Build and run
          Build an image with `docker build -t shop .` and run it with `docker run -p 8000:8000 shop`. The first number is the port on your computer, the second is the port inside the container.

          ## Keep images small
          Use a slim base image such as python:3.14-slim and add a .dockerignore file that lists .git and .venv.
