  - id: index
    stage: first-project
    title:
      en: "Chunks, embeddings and a local vector store"
      tr: "Chunk'lar, embedding'ler ve yerel bir vektör deposu"
    minutes: 60
    needs: [structured]
    why:
      en: "A model knows nothing about your notes, and you cannot paste every note into every question. RAG (retrieval-augmented generation) fixes that: find the few pieces of text that matter, then give only those to the model. This step builds the finding part."
      tr: "Model notların hakkında hiçbir şey bilmez ve her soruya bütün notları yapıştıramazsın. RAG (retrieval-augmented generation, getirerek zenginleştirilmiş üretim) bunu çözer: önemli birkaç metin parçasını bul, sonra modele sadece onları ver. Bu adım bulma kısmını kurar."
    learn:
      en: |
        - What a **chunk** is: a piece of a note, small enough to be about one thing. Here, text under one Markdown heading, cut further at about 800 characters.
        - What an **embedding** is: a list of numbers (a vector) that stands for the meaning of a text. Texts with similar meaning get vectors that are close.
        - What **distance** means: with `cosine` distance, 0 is the same direction (same meaning) and bigger numbers are less alike
        - What a **vector store** does: it keeps vectors and finds the nearest ones fast. You use **sqlite-vec**, an extension for SQLite, so the whole index is one file and needs no server. Chroma is a popular alternative with the same idea.
        - Why the index must be rebuilt when you change the embedding model: vectors from different models do not mix, and they can even have a different length
      tr: |
        - **Chunk** nedir: bir notun, tek bir şey hakkında olacak kadar küçük parçası. Burada tek bir Markdown başlığının altındaki metin; gerekirse yaklaşık 800 karakterde bölünür.
        - **Embedding** nedir: bir metnin anlamını temsil eden sayı listesi (vektör). Benzer anlamlı metinlerin vektörleri yakın olur.
        - **Uzaklık** ne demek: `cosine` uzaklığında 0 aynı yön (aynı anlam), büyük sayılar daha az benzer demek
        - **Vektör deposu** ne yapar: vektörleri saklar ve en yakınları hızlıca bulur. Sen SQLite için bir eklenti olan **sqlite-vec** kullanırsın; böylece bütün indeks tek bir dosyadır ve sunucu gerekmez. Chroma aynı fikre sahip popüler bir alternatif.
        - Embedding modelini değiştirince indeksin neden yeniden kurulması gerektiği: farklı modellerin vektörleri karışmaz, uzunlukları bile farklı olabilir
    do:
      en: |
        1. Create the files below. In short: `chunking.py` cuts notes, `embeddings.py` asks the embedding model for vectors, `notes.py` finds and reads note files (and refuses names outside the folder), `store.py` is the sqlite-vec index, `indexer.py` does the whole job.
        2. Build the index. It reads the four notes and prints how many chunks it made.
        3. Search without any chat model. Try a question that shares no words with the answer (for example "who signs off on shipping") and see which chunk is nearest. This is search by meaning, not by keywords.
        4. Look at the distances: the first result is usually clearly smaller than the rest. Ask something unrelated ("best pizza topping") and compare: the distances are usually all larger.
        5. Commit: `git add .`, `git commit -m "Index the notes"`.
      tr: |
        1. Aşağıdaki dosyaları oluştur. Kısaca: `chunking.py` notları keser, `embeddings.py` embedding modelinden vektör ister, `notes.py` not dosyalarını bulur ve okur (klasörün dışındaki adları reddeder), `store.py` sqlite-vec indeksidir, `indexer.py` bütün işi yapar.
        2. İndeksi kur. Dört notu okur ve kaç chunk çıkardığını yazar.
        3. Hiçbir sohbet modeli olmadan ara. Cevapla hiç ortak kelimesi olmayan bir soru dene (örneğin "yayına almayı kim onaylıyor") ve hangi chunk'ın en yakın olduğuna bak. Bu, anahtar kelimeyle değil anlamla aramadır.
        4. Uzaklıklara bak: ilk sonuç genelde diğerlerinden belirgin biçimde küçüktür. Alakasız bir şey sor ("en iyi pizza malzemesi") ve karşılaştır: uzaklıklar genelde hep daha büyüktür.
        5. Commit'le: `git add .`, `git commit -m "Index the notes"`.
    code:
      - file: docshelper/chunking.py
        lang: python
        text: |
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class Chunk:
              source: str   # the note's file name
              heading: str  # the Markdown heading the text sits under
              text: str


          def _sections(text: str) -> list[tuple[str, str]]:
              """Split Markdown into (heading, body) pieces. Lines inside code fences are never headings."""
              sections: list[tuple[str, str]] = []
              heading, lines, in_fence = "", [], False
              for line in text.splitlines():
                  if line.startswith("```"):
                      in_fence = not in_fence
                  if line.startswith("#") and not in_fence:
                      if "".join(lines).strip():
                          sections.append((heading, "\n".join(lines).strip()))
                      heading, lines = line.lstrip("#").strip(), []
                  else:
                      lines.append(line)
              if "".join(lines).strip():
                  sections.append((heading, "\n".join(lines).strip()))
              return sections


          def chunk_markdown(source: str, text: str, max_chars: int = 800) -> list[Chunk]:
              """Cut a note into pieces of about max_chars: by heading first, then by paragraph."""
              chunks: list[Chunk] = []
              for heading, body in _sections(text):
                  current = ""
                  for paragraph in (p.strip() for p in body.split("\n\n")):
                      if not paragraph:
                          continue
                      if current and len(current) + len(paragraph) + 2 > max_chars:
                          chunks.append(Chunk(source, heading, current))
                          current = ""
                      while len(paragraph) > max_chars:  # one huge paragraph: cut it hard
                          chunks.append(Chunk(source, heading, paragraph[:max_chars]))
                          paragraph = paragraph[max_chars:]
                      if paragraph:
                          current = f"{current}\n\n{paragraph}" if current else paragraph
                  if current:
                      chunks.append(Chunk(source, heading, current))
              return chunks
      - file: docshelper/embeddings.py
        lang: python
        text: |
          from functools import lru_cache

          from openai import OpenAI

          from . import config


          @lru_cache
          def embed_client() -> OpenAI:
              return OpenAI(base_url=config.EMBED_BASE_URL, api_key=config.EMBED_API_KEY, timeout=300)


          def embed(texts: list[str]) -> list[list[float]]:
              """Turn texts into vectors (lists of numbers). Similar meaning gives similar vectors."""
              vectors: list[list[float]] = []
              for start in range(0, len(texts), 32):  # a few texts per request
                  response = embed_client().embeddings.create(model=config.EMBED_MODEL, input=texts[start : start + 32])
                  vectors.extend(item.embedding for item in sorted(response.data, key=lambda item: item.index))
              return vectors


          def embed_query(text: str) -> list[float]:
              return embed([text])[0]
      - file: docshelper/notes.py
        lang: python
        text: |
          from pathlib import Path

          from . import config
          from .errors import UserError


          def note_paths() -> list[Path]:
              return sorted(config.NOTES_DIR.rglob("*.md"))


          def note_name(path: Path) -> str:
              return path.relative_to(config.NOTES_DIR).as_posix()


          def read_note_text(path: Path) -> str:
              return path.read_text(encoding="utf-8")


          def find_note(name: str) -> Path:
              """The file for a note name. Only .md files inside the notes folder are allowed."""
              root = config.NOTES_DIR.resolve()
              path = (root / name).resolve()
              if path.suffix != ".md" or not path.is_relative_to(root) or not path.is_file():
                  raise UserError(f"No such note: {name}")
              return path
      - file: docshelper/store.py
        lang: python
        text: |
          import sqlite3
          from dataclasses import dataclass

          import sqlite_vec

          from . import config
          from .chunking import Chunk
          from .errors import UserError


          @dataclass(frozen=True)
          class Hit:
              source: str
              heading: str
              text: str
              distance: float  # 0 means identical meaning; bigger means less alike


          def connect() -> sqlite3.Connection:
              db = sqlite3.connect(config.DB_PATH)
              db.enable_load_extension(True)
              sqlite_vec.load(db)
              db.enable_load_extension(False)
              return db


          def build(db: sqlite3.Connection, chunks: list[Chunk], vectors: list[list[float]]) -> None:
              """Throw the old index away and store the chunks with their vectors."""
              db.execute("DROP TABLE IF EXISTS vec_chunks")
              db.execute("DROP TABLE IF EXISTS chunks")
              db.execute("CREATE TABLE chunks(id INTEGER PRIMARY KEY, source TEXT, heading TEXT, text TEXT)")
              db.execute(f"CREATE VIRTUAL TABLE vec_chunks USING vec0(embedding float[{len(vectors[0])}] distance_metric=cosine)")
              for number, (chunk, vector) in enumerate(zip(chunks, vectors, strict=True), start=1):
                  db.execute("INSERT INTO chunks VALUES (?, ?, ?, ?)", (number, chunk.source, chunk.heading, chunk.text))
                  db.execute(
                      "INSERT INTO vec_chunks(rowid, embedding) VALUES (?, ?)",
                      (number, sqlite_vec.serialize_float32(vector)),
                  )
              db.commit()


          def search(db: sqlite3.Connection, vector: list[float], k: int = 4) -> list[Hit]:
              """The k chunks whose meaning is closest to the vector."""
              try:
                  rows = db.execute(
                      """
                      SELECT chunks.source, chunks.heading, chunks.text, matches.distance
                      FROM (SELECT rowid, distance FROM vec_chunks WHERE embedding MATCH ? AND k = ?) AS matches
                      JOIN chunks ON chunks.id = matches.rowid
                      ORDER BY matches.distance
                      """,
                      (sqlite_vec.serialize_float32(vector), k),
                  ).fetchall()
              except sqlite3.OperationalError as error:
                  if "no such table" in str(error):
                      raise UserError("There is no index yet. Run: python -m docshelper index") from error
                  raise UserError(f"The index does not fit the embedding model (did you change EMBED_MODEL?). Run: python -m docshelper index ({error})") from error
              return [Hit(*row) for row in rows]
      - file: docshelper/indexer.py
        lang: python
        text: |
          from . import config, embeddings, notes, store
          from .chunking import chunk_markdown
          from .errors import UserError


          def build_index() -> tuple[int, int]:
              """Read every note, cut it into chunks, embed them and store them. Returns (notes, chunks)."""
              paths = notes.note_paths()
              if not paths:
                  raise UserError(f"No .md files in {config.NOTES_DIR}")
              chunks = []
              for path in paths:
                  chunks += chunk_markdown(notes.note_name(path), notes.read_note_text(path))
              if not chunks:
                  raise UserError("The notes are empty.")
              vectors = embeddings.embed([f"{chunk.heading}\n{chunk.text}" for chunk in chunks])
              db = store.connect()
              try:
                  store.build(db, chunks, vectors)
              finally:
                  db.close()
              return len(paths), len(chunks)
      - file: docshelper/commands/index.py
        lang: python
        text: |
          from .. import indexer


          def run(args: list[str]) -> None:
              notes, chunks = indexer.build_index()
              print(f"Indexed {notes} notes as {chunks} chunks.")
      - file: docshelper/commands/search.py
        lang: python
        text: |
          from .. import embeddings, store
          from ..errors import UserError


          def run(args: list[str]) -> None:
              if not args:
                  raise UserError('Usage: python -m docshelper search "your question"')
              db = store.connect()
              try:
                  hits = store.search(db, embeddings.embed_query(" ".join(args)), k=4)
              finally:
                  db.close()
              for hit in hits:
                  print(f"{hit.distance:.3f}  {hit.source}  #{hit.heading}")
                  print("       " + hit.text.replace("\n", " ")[:100])
      - file: terminal
        lang: sh
        text: |
          uv run python -m docshelper index
          uv run python -m docshelper search who signs off on shipping
          uv run python -m docshelper search best pizza topping
    mistakes:
