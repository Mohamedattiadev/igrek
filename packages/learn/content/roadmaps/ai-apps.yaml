    mistakes:
      - problem:
          en: "Thinking the `<excerpt>` tags and the \"never follow instructions\" sentence make injection impossible."
          tr: "`<excerpt>` etiketlerinin ve \"talimatlara asla uyma\" cümlesinin injection'ı imkânsız kıldığını sanmak."
        fix:
          en: "They only make it harder. Assume a clever text can still steer the model, and design so that a steered model can do little harm: read-only tools, one folder, short outputs, no secrets in reach."
          tr: "Sadece zorlaştırırlar. Zeki bir metnin modeli yine de yönlendirebileceğini varsay ve yönlendirilmiş bir modelin az zarar vereceği şekilde tasarla: salt okunur araçlar, tek klasör, kısa çıktılar, erişilebilir yerde gizli bilgi yok."
      - problem:
          en: "Secrets reach the model or the logs because redaction runs only on the answer."
          tr: "Gizli bilgiler modele ya da loglara ulaşıyor çünkü gizleme sadece cevapta çalışıyor."
        fix:
          en: "Hide secrets at the door: when notes are read (before the index, before the prompt), then again on the way out. Old index files still hold the old text, so rebuild after you add a pattern."
          tr: "Gizli bilgileri kapıda gizle: notlar okunurken (indeksten ve prompt'tan önce), sonra çıkışta bir kez daha. Eski indeks dosyaları eski metni tutar; bu yüzden bir kalıp ekledikten sonra indeksi yeniden kur."
      - problem:
          en: "Trusting a file name or an argument the model chose."
          tr: "Modelin seçtiği bir dosya adına ya da argümana güvenmek."
        fix:
          en: "A model can be tricked into asking for `../../.ssh/id_rsa`. Check every tool argument in code, as `find_note` does: right extension, inside the folder after `resolve()`."
          tr: "Model `../../.ssh/id_rsa` istemesi için kandırılabilir. Her araç argümanını kodda kontrol et, `find_note`'un yaptığı gibi: doğru uzantı, `resolve()` sonrası klasörün içinde."
    quiz:
      - q:
          en: "Which design best limits the damage of a successful prompt injection?"
          tr: "Başarılı bir prompt injection'ın zararını en iyi hangi tasarım sınırlar?"
        options:
          en:
            - "Telling the model in capital letters to be careful"
            - "Read-only tools with narrow limits and no secrets in reach"
            - "Using a bigger model"
          tr:
            - "Modele büyük harflerle dikkatli olmasını söylemek"
            - "Dar sınırları olan, salt okunur araçlar ve erişilebilir yerde gizli bilgi olmaması"
            - "Daha büyük bir model kullanmak"
        answer: 1
        why:
          en: "You cannot make a model immune, so you make a fooled model harmless: it can only read a small set of files and has nothing secret to leak."
          tr: "Bir modeli bağışık yapamazsın; bu yüzden kandırılmış bir modeli zararsız yaparsın: sadece küçük bir dosya kümesini okuyabilir ve sızdıracak gizli bir şeyi yoktur."
    sources:
      - title: OWASP, LLM01 Prompt Injection
        url: https://genai.owasp.org/llmrisk/llm01-prompt-injection/
      - title: OWASP, LLM02 Sensitive Information Disclosure
        url: https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
      - title: MCP security best practices
        url: https://modelcontextprotocol.io/docs/tutorials/security/security_best_practices

  - id: speed
    stage: performance
    title:
      en: "Cost and speed: caching, streaming, smaller models"
      tr: "Maliyet ve hız: önbellek, streaming, daha küçük modeller"
    minutes: 45
    needs: [safety]
    why:
      en: "Model calls are the slow and (on hosted services) the expensive part of an AI app. Time and cost both grow with the number of tokens and the size of the model. A few cheap habits make the app feel much faster."
      tr: "Model çağrıları bir yapay zekâ uygulamasının yavaş ve (barındırılan servislerde) pahalı kısmıdır. Süre ve maliyet token sayısıyla ve modelin boyutuyla artar. Birkaç ucuz alışkanlık uygulamayı çok daha hızlı hissettirir."
    learn:
      en: |
        - What a **token** is: a piece of a word. Models read and write tokens, and hosted services charge per token (input and output separately).
        - **Streaming**: show the answer word by word as it is produced. The total time is the same, but the first words appear in about a second, so it feels fast.
        - **Caching**: do not repeat work. `lru_cache` keeps the vector of the last 256 questions, so the same question never calls the embedding model twice.
        - **Smaller models**: a 1B model answers much faster than a 4B one. Use evals to find the smallest model that still passes.
        - **Limits**: `max_tokens` caps the output, and fewer retrieved chunks mean a shorter prompt
        - Ollama keeps a model in memory for 5 minutes after use (`OLLAMA_KEEP_ALIVE` changes it), so the first call after a pause is slow
        - Hosted providers offer discounts for repeated long prompt prefixes ("prompt caching"). The details differ per provider, so read their docs if you use one.
      tr: |
        - **Token** nedir: bir kelimenin parçası. Modeller token okur ve yazar, barındırılan servisler token başına ücret alır (girdi ve çıktı ayrı).
        - **Streaming**: cevabı üretildikçe kelime kelime göster. Toplam süre aynı ama ilk kelimeler yaklaşık bir saniyede çıkar; bu yüzden hızlı hissettirir.
        - **Önbellek** (caching): işi tekrarlama. `lru_cache` son 256 sorunun vektörünü tutar; böylece aynı soru embedding modelini iki kez çağırmaz.
        - **Daha küçük modeller**: 1B bir model 4B bir modelden çok daha hızlı cevap verir. Hâlâ geçen en küçük modeli bulmak için evals kullan.
        - **Sınırlar**: `max_tokens` çıktıyı sınırlar; daha az getirilen chunk daha kısa prompt demek
        - Ollama bir modeli kullanımdan sonra 5 dakika bellekte tutar (`OLLAMA_KEEP_ALIVE` bunu değiştirir); bu yüzden bir aradan sonraki ilk çağrı yavaştır
        - Barındırılan sağlayıcılar tekrarlanan uzun prompt başlangıçları için indirim sunar ("prompt caching"). Ayrıntılar sağlayıcıya göre değişir; birini kullanıyorsan dokümanını oku.
    do:
      en: |
        1. Replace `embeddings.py` with the version below. `embed_query` now remembers recent questions.
        2. Add `chat_stream` at the end of `llm.py`, and `ask_stream` at the end of `rag.py`. Replace `commands/ask.py` so that `--stream` prints the answer as it arrives.
        3. Add `tests/test_speed.py` and run `uv run pytest`.
        4. Measure before you believe. Run the same question with `time`, normally and with `--stream`, and watch when the first word appears. Run it twice: the second run is faster because the model is already loaded.
        5. Compare models (`ollama pull llama3.2:1b` first if you do not have it): run it with `LLM_MODEL=llama3.2:1b` and with `llama3.2:3b`, and run the evals for each. Pick the smallest model that keeps the score you accept.
        6. A trade-off to remember: with `--stream` the program prints text before it can check the whole answer, so the citation warning from step 10 does not run. Use streaming where speed matters more than the check, or check the final text afterwards.
        7. Commit: `git add .`, `git commit -m "Caching and streaming"`.
      tr: |
        1. `embeddings.py` dosyasını aşağıdaki sürümle değiştir. `embed_query` artık son soruları hatırlıyor.
        2. `llm.py` sonuna `chat_stream`, `rag.py` sonuna `ask_stream` ekle. `commands/ask.py` dosyasını değiştir; böylece `--stream` cevabı geldikçe yazdırır.
        3. `tests/test_speed.py` dosyasını ekle ve `uv run pytest` çalıştır.
        4. İnanmadan önce ölç. Aynı soruyu `time` ile normal ve `--stream` ile çalıştır; ilk kelimenin ne zaman çıktığını izle. İki kez çalıştır: ikinci çalıştırma daha hızlıdır, çünkü model zaten yüklü.
        5. Modelleri karşılaştır (yoksa önce `ollama pull llama3.2:1b`): `LLM_MODEL=llama3.2:1b` ve `llama3.2:3b` ile çalıştır, her biri için evals'i çalıştır. Kabul ettiğin skoru koruyan en küçük modeli seç.
        6. Hatırlanacak bir takas: `--stream` ile program, cevabın tamamını kontrol edemeden metni yazdırır; bu yüzden 10. adımdaki kaynak uyarısı çalışmaz. Streaming'i hızın kontrolden önemli olduğu yerde kullan ya da son metni sonradan kontrol et.
        7. Commit'le: `git add .`, `git commit -m "Caching and streaming"`.
    code:
      - file: docshelper/embeddings.py
        lang: python
        text: |
          from functools import lru_cache

          from openai import OpenAI

          from . import config


          @lru_cache
          def embed_client() -> OpenAI:
              return OpenAI(base_url=config.EMBED_BASE_URL, api_key=config.EMBED_API_KEY, timeout=300)


          def embed(texts: list[str]) -> list[list[float]]:
              """Turn texts into vectors (lists of numbers). Similar meaning gives similar vectors."""
              vectors: list[list[float]] = []
              for start in range(0, len(texts), 32):  # a few texts per request
                  response = embed_client().embeddings.create(model=config.EMBED_MODEL, input=texts[start : start + 32])
                  vectors.extend(item.embedding for item in sorted(response.data, key=lambda item: item.index))
              return vectors


          @lru_cache(maxsize=256)
          def _embed_query_cached(text: str) -> tuple[float, ...]:
              return tuple(embed([text])[0])


          def embed_query(text: str) -> list[float]:
              """Embed a question. The same question twice costs one call: the second answer comes from memory."""
              return list(_embed_query_cached(text))
      - file: docshelper/llm.py
        lang: python
        text: |


          def chat_stream(messages: list[dict], **options):
              """Yield the reply piece by piece, so the user sees the first words quickly."""
              stream = chat_client().chat.completions.create(model=config.CHAT_MODEL, messages=messages, stream=True, **options)
              for chunk in stream:
                  if chunk.choices and chunk.choices[0].delta.content:
                      yield chunk.choices[0].delta.content
      - file: docshelper/rag.py
        lang: python
        text: |


          def ask_stream(question: str, k: int = 4):
              """Like ask, but yields the answer in pieces. The citation check cannot run before the text is shown."""
              question = safety.check_question(question)
              hits = retrieve(question, k)
              yield from llm.chat_stream(build_messages(question, hits), temperature=0, max_tokens=400)
      - file: docshelper/commands/ask.py
        lang: python
        text: |
          from .. import rag
          from ..errors import UserError


          def run(args: list[str]) -> None:
              stream = "--stream" in args
              words = [word for word in args if word != "--stream"]
              if not words:
                  raise UserError('Usage: python -m docshelper ask [--stream] "your question"')
              question = " ".join(words)
              if stream:
                  for piece in rag.ask_stream(question):
                      print(piece, end="", flush=True)
                  print()
                  return
              answer = rag.ask(question)
              print(answer.text)
              if answer.warning:
                  print(f"\nWarning: {answer.warning}")
              if answer.sources:
                  print("\nSources:")
                  for number, hit in answer.sources:
                      print(f"  [{number}] {hit.source} ({hit.heading})")
      - file: tests/test_speed.py
        lang: python
        text: |
          from types import SimpleNamespace

          from fakes import fake_embed

          from docshelper import embeddings, llm, rag


          def test_the_same_question_is_embedded_once(monkeypatch):
              calls = []

              def counting_embed(texts):
                  calls.append(texts)
                  return fake_embed(texts)

              monkeypatch.setattr(embeddings, "embed", counting_embed)
              embeddings._embed_query_cached.cache_clear()
              embeddings.embed_query("who is the release owner")
              embeddings.embed_query("who is the release owner")
              assert len(calls) == 1


          def test_streaming_yields_pieces(monkeypatch, indexed):
              def chunk(text):
                  return SimpleNamespace(choices=[SimpleNamespace(delta=SimpleNamespace(content=text))])

              def create(**request):
                  assert request["stream"] is True
                  return iter([chunk("Da"), chunk("na"), SimpleNamespace(choices=[]), chunk(None)])

              client = SimpleNamespace(chat=SimpleNamespace(completions=SimpleNamespace(create=create)))
              monkeypatch.setattr(llm, "chat_client", lambda: client)
              assert "".join(rag.ask_stream("Who is the release owner?")) == "Dana"
      - file: terminal
        lang: sh
        text: |
          uv run pytest
          time uv run python -m docshelper ask "Who is the release owner in October?"
          time uv run python -m docshelper ask --stream "Who is the release owner in October?"
          LLM_MODEL=llama3.2:1b uv run python -m docshelper evals
    mistakes:
      - problem:
          en: "Caching answers that depend on changing data, so users get stale results."
          tr: "Değişen veriye bağlı cevapları önbelleğe alıp kullanıcılara eski sonuç göstermek."
        fix:
          en: "Cache only what is safe to repeat. A question's vector never changes for one embedding model, so it is safe. A whole answer depends on your notes and your prompt, so cache it only with a way to clear it."
          tr: "Sadece tekrarı güvenli olanı önbelleğe al. Bir sorunun vektörü tek bir embedding modeli için asla değişmez; güvenli. Bütün bir cevap notlarına ve prompt'una bağlı; onu sadece temizleme yolu olan bir önbellekte tut."
      - problem:
          en: "Picking the model by feeling, then being surprised by the bill or the speed."
          tr: "Modeli hisle seçip faturaya ya da hıza şaşırmak."
        fix:
          en: "Measure time and score for each model with the same evals. Choose the smallest one that passes."
          tr: "Her model için süreyi ve skoru aynı evals ile ölç. Geçen en küçüğünü seç."
      - problem:
          en: "The first call after a pause takes a minute and you think the app is broken."
          tr: "Bir aradan sonraki ilk çağrı bir dakika sürüyor ve uygulamanın bozulduğunu sanıyorsun."
        fix:
          en: "The model was unloaded after 5 idle minutes and is loading again. `ollama ps` shows what is loaded. Set `OLLAMA_KEEP_ALIVE` on the server if you want it kept longer."
          tr: "Model 5 boş dakikadan sonra boşaltıldı ve yeniden yükleniyor. `ollama ps` neyin yüklü olduğunu gösterir. Daha uzun tutulmasını istiyorsan sunucuda `OLLAMA_KEEP_ALIVE` ayarla."
    quiz:
      - q:
          en: "What does streaming improve?"
          tr: "Streaming neyi iyileştirir?"
        options:
          en:
            - "The time until the user sees the first words"
            - "The accuracy of the answer"
            - "The size of the model"
          tr:
            - "Kullanıcının ilk kelimeleri görene kadar geçen süreyi"
            - "Cevabın doğruluğunu"
            - "Modelin boyutunu"
        answer: 0
        why:
          en: "The model takes as long as before, but the user starts reading at once, so it feels much faster."
          tr: "Model eskisi kadar sürer ama kullanıcı hemen okumaya başlar; bu yüzden çok daha hızlı hissettirir."
    sources:
      - title: Ollama FAQ, keeping models loaded
        url: https://docs.ollama.com/faq
      - title: Python functools.lru_cache
        url: https://docs.python.org/3/library/functools.html#functools.lru_cache
      - title: Ollama OpenAI compatibility
        url: https://docs.ollama.com/api/openai-compatibility

  - id: package
    stage: packaging
    title:
      en: "Package it: a web API, a wheel and a Docker image"
      tr: "Paketle: bir web API'si, bir wheel ve bir Docker image'ı"
    minutes: 60
    needs: [speed]
    why:
      en: "So far the helper is a command on your computer. To let other programs and people use it, it needs a web API, and to run it anywhere it needs to be packaged: a Python wheel (an installable file) and a Docker image (a sealed box with the program and everything it needs)."
      tr: "Şimdiye kadar yardımcı bilgisayarındaki bir komut. Diğer programların ve insanların kullanabilmesi için bir web API'sine, her yerde çalışabilmesi için paketlenmeye ihtiyacı var: bir Python wheel (kurulabilir dosya) ve bir Docker image'ı (programı ve ihtiyacı olan her şeyi içeren kapalı bir kutu)."
    learn:
      en: |
        - A tiny web API with **FastAPI**: `POST /ask` takes `{"question": "..."}` and returns the answer and its sources. Pydantic checks the input before your code runs (empty and huge questions get a 422 error).
        - Why the API needs a **token**: without it, anyone who finds the URL can use your model quota. `API_TOKEN` is checked on every request with a safe comparison.
        - What a **build backend** is (here `hatchling`) and how `[project.scripts]` makes the `docs-helper` command
        - What a **Dockerfile** does: it starts from a small Python image, installs your package, copies the notes, and runs the server as a normal user, not root
        - Why the index is built on the first request: the container starts with no index, and `/tmp` is enough to hold it
        - A container cannot see your `localhost`: inside it, `localhost` is the container itself. It therefore needs the address of a model server it can reach (step 13).
      tr: |
        - **FastAPI** ile küçük bir web API'si: `POST /ask` `{"question": "..."}` alır, cevabı ve kaynaklarını döndürür. Pydantic girdiyi kodun çalışmadan önce kontrol eder (boş ve çok büyük sorular 422 hatası alır).
        - API'nin neden bir **token**'a ihtiyacı var: o olmadan URL'yi bulan herkes senin model kotanı kullanabilir. `API_TOKEN` her istekte güvenli bir karşılaştırmayla kontrol edilir.
        - **Build backend** nedir (burada `hatchling`) ve `[project.scripts]` `docs-helper` komutunu nasıl üretir
        - **Dockerfile** ne yapar: küçük bir Python image'ından başlar, paketini kurar, notları kopyalar ve sunucuyu root olarak değil normal bir kullanıcı olarak çalıştırır
        - İndeksin neden ilk istekte kurulduğu: container indekssiz başlar ve `/tmp` onu tutmaya yeter
        - Bir container senin `localhost`'unu göremez: içinde `localhost` container'ın kendisidir. Bu yüzden ulaşabileceği bir model sunucusunun adresine ihtiyacı var (13. adım).
    do:
      en: |
        1. Append the line below to `docshelper/config.py`, then create `docshelper/web.py`.
        2. Add `tests/test_web.py` and run `uv run pytest`. FastAPI's `TestClient` calls the app without starting a server.
        3. Run the API with Ollama running: `uv run uvicorn docshelper.web:app`. In another terminal call it with curl (second block). The first request builds the index.
        4. Open `http://127.0.0.1:8000/docs` in a browser: FastAPI writes interactive documentation for you.
        5. Add the packaging lines to the end of `pyproject.toml`, then run `uv build`. The `dist` folder now holds a wheel. `uv run docs-helper ask "..."` works too.
        6. Create the `Dockerfile` and `.dockerignore`. Build the image and run it: `docker run --rm -p 8000:8000 -e API_TOKEN=secret docs-helper`. The `/health` endpoint answers without a model. `/ask` answers 401 without the token, and 503 if the model server cannot be reached, because the container cannot see your Ollama yet.
        7. Commit: `git add .`, `git commit -m "Web API and Docker image"`.
      tr: |
        1. Aşağıdaki satırı `docshelper/config.py` dosyasının sonuna ekle, sonra `docshelper/web.py` dosyasını oluştur.
        2. `tests/test_web.py` dosyasını ekle ve `uv run pytest` çalıştır. FastAPI'nin `TestClient`'ı sunucu başlatmadan uygulamayı çağırır.
        3. Ollama çalışırken API'yi çalıştır: `uv run uvicorn docshelper.web:app`. Başka bir terminalde curl ile çağır (ikinci blok). İlk istek indeksi kurar.
        4. Tarayıcıda `http://127.0.0.1:8000/docs` adresini aç: FastAPI senin için etkileşimli dokümantasyon yazar.
        5. Paketleme satırlarını `pyproject.toml` sonuna ekle, sonra `uv build` çalıştır. `dist` klasöründe artık bir wheel var. `uv run docs-helper ask "..."` de çalışır.
        6. `Dockerfile` ve `.dockerignore` dosyalarını oluştur. Image'ı derle ve çalıştır: `docker run --rm -p 8000:8000 -e API_TOKEN=secret docs-helper`. `/health` modelsiz cevap verir. `/ask` token olmadan 401, model sunucusuna ulaşılamıyorsa 503 verir; çünkü container henüz senin Ollama'nı göremiyor.
        7. Commit'le: `git add .`, `git commit -m "Web API and Docker image"`.
    code:
      - file: docshelper/config.py
        lang: python
        text: |

          # The web API (step 12). If this is set, every request must send "Authorization: Bearer <token>".
          API_TOKEN = os.environ.get("API_TOKEN", "")
      - file: docshelper/web.py
        lang: python
        text: |
          import hmac
          import threading

          import openai
          from fastapi import Depends, FastAPI, Header, HTTPException
          from pydantic import BaseModel, Field

          from . import config, indexer, rag
          from .errors import UserError

          app = FastAPI(title="docs-helper")
          _index_lock = threading.Lock()


          class AskBody(BaseModel):
              question: str = Field(min_length=1, max_length=1000)


          class SourceOut(BaseModel):
              number: int
              source: str
              heading: str


          class AskReply(BaseModel):
              answer: str
              sources: list[SourceOut]
              warning: str


          def require_token(authorization: str = Header(default="")) -> None:
              """Without this, anyone who finds the URL can spend your model quota."""
              if config.API_TOKEN and not hmac.compare_digest(authorization.encode(), f"Bearer {config.API_TOKEN}".encode()):
                  raise HTTPException(status_code=401, detail="Missing or wrong token.")


          @app.get("/health")
          def health() -> dict[str, str]:
              return {"status": "ok"}


          @app.post("/ask", response_model=AskReply, dependencies=[Depends(require_token)])
          def ask(body: AskBody) -> AskReply:
              try:
                  with _index_lock:  # build the index on the first request, once
                      if not config.DB_PATH.exists():
                          indexer.build_index()
                  answer = rag.ask(body.question)
              except UserError as error:
                  raise HTTPException(status_code=400, detail=str(error)) from error
              except openai.APIConnectionError as error:
                  raise HTTPException(status_code=503, detail="The model server cannot be reached.") from error
              except openai.AuthenticationError as error:
                  raise HTTPException(status_code=503, detail="The model server rejected our API key.") from error
              sources = [SourceOut(number=n, source=hit.source, heading=hit.heading) for n, hit in answer.sources]
              return AskReply(answer=answer.text, sources=sources, warning=answer.warning)
      - file: tests/test_web.py
        lang: python
        text: |
          from fakes import say
          from fastapi.testclient import TestClient

          from docshelper import config
          from docshelper.web import app

          client = TestClient(app)


          def test_health():
              assert client.get("/health").json() == {"status": "ok"}


          def test_ask_builds_the_index_and_answers(fake_chat):
              fake_chat(say("Dana is the release owner [1]."))
              reply = client.post("/ask", json={"question": "Who is the release owner?"})
              assert reply.status_code == 200
              body = reply.json()
              assert body["sources"][0]["source"] == "release-process.md"
              assert body["warning"] == ""


          def test_bad_input_is_refused():
              assert client.post("/ask", json={"question": ""}).status_code == 422
              assert client.post("/ask", json={"question": "x" * 1001}).status_code == 422
              assert client.post("/ask", json={}).status_code == 422


          def test_token_is_required_when_set(monkeypatch, fake_chat):
              monkeypatch.setattr(config, "API_TOKEN", "s3cret")
              assert client.post("/ask", json={"question": "hi"}).status_code == 401
              assert client.post("/ask", json={"question": "hi"}, headers={"Authorization": "Bearer wrong"}).status_code == 401
              fake_chat(say("I do not know based on the notes."))
              ok = client.post("/ask", json={"question": "hi"}, headers={"Authorization": "Bearer s3cret"})
              assert ok.status_code == 200
      - file: pyproject.toml
        lang: toml
        text: |

          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [project.scripts]
          docs-helper = "docshelper.__main__:main"

          [tool.hatch.build.targets.wheel]
          packages = ["docshelper"]
      - file: Dockerfile
        lang: dockerfile
        text: |
          FROM python:3.14-slim

          WORKDIR /app
          COPY pyproject.toml ./
          COPY docshelper ./docshelper
          RUN pip install --no-cache-dir .
          COPY notes ./notes

          # The index is rebuilt on the first request, so a temporary folder is enough.
          ENV NOTES_DIR=/app/notes DB_PATH=/tmp/index.db
          RUN useradd --create-home app
          USER app

          # Render tells the program which port to use in $PORT. Locally it is 8000.
          CMD ["sh", "-c", "uvicorn docshelper.web:app --host 0.0.0.0 --port ${PORT:-8000}"]
      - file: .dockerignore
        lang: text
        text: |
          .git
          .venv
          __pycache__
          tests
          evals
          index.db
          calls.jsonl
          try_mcp.py
      - file: terminal
        lang: sh
        text: |
          uv run pytest
          uv run uvicorn docshelper.web:app
      - file: terminal
        lang: sh
        text: |
          curl -s -X POST http://127.0.0.1:8000/ask \
            -H "Content-Type: application/json" \
            -d '{"question": "Who is the release owner in October?"}'
      - file: terminal
        lang: sh
        text: |
          uv build
          docker build -t docs-helper .
          docker run --rm -p 8000:8000 -e API_TOKEN=secret docs-helper
          curl -s http://127.0.0.1:8000/health
    mistakes:
      - problem:
          en: "The container answers 503 \"The model server cannot be reached\"."
          tr: "Container 503 \"The model server cannot be reached\" cevabı veriyor."
        fix:
          en: "Inside a container `localhost` is the container. Point `LLM_BASE_URL` and `EMBED_BASE_URL` at a server it can reach: a hosted service, or Ollama on another machine. Opening your own Ollama to containers means changing `OLLAMA_HOST`, which exposes it to the network, so do that only on a trusted network."
          tr: "Bir container'ın içinde `localhost` container'ın kendisidir. `LLM_BASE_URL` ve `EMBED_BASE_URL` değerlerini ulaşabileceği bir sunucuya yönlendir: barındırılan bir servis ya da başka bir makinedeki Ollama. Kendi Ollama'nı container'lara açmak `OLLAMA_HOST` değiştirmek demek; bu onu ağa açar, bu yüzden sadece güvendiğin bir ağda yap."
      - problem:
          en: "Leaving the API open with no token, then finding a surprise bill or an empty quota."
          tr: "API'yi token olmadan açık bırakıp sürpriz bir fatura ya da boşalmış bir kota bulmak."
        fix:
          en: "Always set `API_TOKEN` on anything reachable from the internet, and set spending limits at your model provider if it has any."
          tr: "İnternetten ulaşılabilen her şeyde `API_TOKEN` ayarla; model sağlayıcında varsa harcama limitleri koy."
      - problem:
          en: "Copying `.venv`, `.git` or the index into the image."
          tr: "`.venv`, `.git` ya da indeksi image'a kopyalamak."
        fix:
          en: "List them in `.dockerignore`. The image gets smaller, and an old index built with another embedding model cannot sneak in."
          tr: "Onları `.dockerignore` içine yaz. Image küçülür ve başka bir embedding modeliyle kurulmuş eski bir indeks içeri sızamaz."
    quiz:
      - q:
          en: "Why does `/ask` check an API token?"
          tr: "`/ask` neden bir API token'ı kontrol ediyor?"
        options:
          en:
            - "To make answers more accurate"
            - "So only people you allow can spend your model quota"
            - "Because FastAPI requires it"
          tr:
            - "Cevapları daha doğru yapmak için"
            - "Model kotanı sadece izin verdiğin kişiler harcayabilsin diye"
            - "Çünkü FastAPI bunu zorunlu kılıyor"
        answer: 1
        why:
          en: "Every request costs time and maybe money. An open endpoint on the internet will be found and used."
          tr: "Her istek zamana ve belki paraya mal olur. İnternetteki açık bir endpoint bulunur ve kullanılır."
    sources:
      - title: uv, building and publishing a package
        url: https://docs.astral.sh/uv/guides/package/
      - title: FastAPI in containers
        url: https://fastapi.tiangolo.com/deployment/docker/
      - title: Dockerfile reference
        url: https://docs.docker.com/reference/dockerfile/

  - id: deploy
    stage: deploy
    title:
      en: "A free deploy on Render"
      tr: "Render'da ücretsiz deploy"
    minutes: 50
    needs: [package]
    why:
      en: "A deploy makes the helper reachable at a public address. Free web hosts have only 512 MB of RAM, so they cannot run a model with Ollama. This is the one place where the app needs a model server on the internet. You decide which one, and the code does not change: it is the same environment variables as in step 2."
      tr: "Deploy, yardımcıyı herkese açık bir adreste ulaşılabilir yapar. Ücretsiz web barındırıcılarında sadece 512 MB RAM var; bu yüzden Ollama ile model çalıştıramazlar. Uygulamanın internette bir model sunucusuna ihtiyaç duyduğu tek yer burası. Hangisini kullanacağına sen karar verirsin ve kod değişmez: 2. adımdaki aynı ortam değişkenleri."
    learn:
      en: |
        - How **Render** builds your Dockerfile from a Git repository and runs it. The Free plan has 0.1 CPU and 512 MB RAM, sleeps after 15 minutes without traffic (the next request waits about a minute) and gets 750 free hours a month.
        - What `render.yaml` (a **Blueprint**) is: the service described in a file in your repo. `sync: false` means "ask me for this value", and `generateValue: true` lets Render invent a random one (used here for `API_TOKEN`).
        - Why secrets go into the host's environment variables and never into the repository
        - Why the notes need a **private** repository: the Dockerfile copies them into the image, and a public repository would publish them
        - Your choices for the model server: a hosted provider with an OpenAI-compatible API (many have a free tier, check its limits and whether a card is needed), or keep the app on your own computer where Ollama is free. A hosted embedding model has a different vector length than `nomic-embed-text`, which is fine because the deployed app builds its own index.
      tr: |
        - **Render**'ın Dockerfile'ını bir Git deposundan nasıl derleyip çalıştırdığı. Free planda 0,1 CPU ve 512 MB RAM var, 15 dakika trafik gelmezse uyur (sonraki istek yaklaşık bir dakika bekler) ve ayda 750 ücretsiz saat verir.
        - `render.yaml` (bir **Blueprint**) nedir: servisin deponda bir dosyada tarifi. `sync: false` "bu değeri bana sor" demek, `generateValue: true` Render'ın rastgele bir değer üretmesi demek (burada `API_TOKEN` için).
        - Gizli bilgilerin neden barındırıcının ortam değişkenlerine gittiği ve depoya asla girmediği
        - Notların neden **özel** (private) bir depo gerektirdiği: Dockerfile onları image'a kopyalar, herkese açık depo onları yayımlar
        - Model sunucusu için seçeneklerin: OpenAI uyumlu API'si olan barındırılan bir sağlayıcı (çoğunun ücretsiz bir katmanı var; sınırlarına ve kart isteyip istemediğine bak) ya da uygulamayı Ollama'nın ücretsiz olduğu kendi bilgisayarında tutmak. Barındırılan bir embedding modelinin vektör uzunluğu `nomic-embed-text`'ten farklıdır; sorun değil, çünkü deploy edilen uygulama kendi indeksini kurar.
    do:
      en: |
        1. Make sure `.gitignore` lists `.venv/`, `index.db`, `calls.jsonl` and `.env`. Read your notes once: nothing in them should be private to you if the repository ever became public, and there must be no real keys.
        2. Create `render.yaml` below.
        3. Create a **private** repository on GitHub and push: `git remote add origin <your repository address>`, `git push -u origin main`.
        4. Make a Render account (render.com). The Free plan is enough. Create a Blueprint from your repository (Render's Blueprints docs show where), and fill in the values it asks for: `LLM_BASE_URL`, `LLM_API_KEY`, `LLM_MODEL` for the chat model and `EMBED_BASE_URL`, `EMBED_API_KEY`, `EMBED_MODEL` for the embedding model. Take them from the docs of the provider you chose. Render generates `API_TOKEN` for you; you find it in the service's environment settings.
        5. Wait for the build to finish. Open `https://<your service>.onrender.com/health`: it should say `{"status":"ok"}`. If the service was asleep, the first request is slow.
        6. Ask a question with the token (first block below). The first `/ask` also builds the index, so it takes longer.
        7. Call it without the token and see the 401. Then look at the service logs in Render, and remember the model provider's usage page is where you check the real cost.
        8. If you do not want a hosted model at all, stop here: the helper still runs for free on your computer, and the Docker image works on any machine that can reach a model server.
      tr: |
        1. `.gitignore` dosyasında `.venv/`, `index.db`, `calls.jsonl` ve `.env` olduğundan emin ol. Notlarını bir kez oku: depo bir gün herkese açık olsa bile içlerinde sana özel bir şey olmamalı ve gerçek anahtar olmamalı.
        2. Aşağıdaki `render.yaml` dosyasını oluştur.
        3. GitHub'da **özel** (private) bir depo oluştur ve push'la: `git remote add origin <deponun adresi>`, `git push -u origin main`.
        4. Bir Render hesabı aç (render.com). Free plan yeterli. Deponun üzerinden bir Blueprint oluştur (nerede olduğunu Render'ın Blueprint dokümanı gösterir) ve istediği değerleri doldur: sohbet modeli için `LLM_BASE_URL`, `LLM_API_KEY`, `LLM_MODEL`; embedding modeli için `EMBED_BASE_URL`, `EMBED_API_KEY`, `EMBED_MODEL`. Seçtiğin sağlayıcının dokümanından al. `API_TOKEN` değerini Render senin için üretir; servisin ortam ayarlarında bulursun.
        5. Derlemenin bitmesini bekle. `https://<servisin>.onrender.com/health` adresini aç: `{"status":"ok"}` yazmalı. Servis uyuyorsa ilk istek yavaş olur.
        6. Token ile bir soru sor (aşağıdaki ilk blok). İlk `/ask` indeksi de kurar; bu yüzden daha uzun sürer.
        7. Token olmadan çağır ve 401'i gör. Sonra Render'daki servis loglarına bak ve gerçek maliyeti model sağlayıcının kullanım sayfasında kontrol edeceğini unutma.
        8. Hiç barındırılan model istemiyorsan burada dur: yardımcı yine bilgisayarında ücretsiz çalışır ve Docker image'ı bir model sunucusuna ulaşabilen her makinede çalışır.
    code:
      - file: render.yaml
        lang: yaml
        text: |
          services:
            - type: web
              name: docs-helper
              runtime: docker
              plan: free
              healthCheckPath: /health
              envVars:
                - key: LLM_BASE_URL
                  sync: false
                - key: LLM_API_KEY
                  sync: false
                - key: LLM_MODEL
                  sync: false
                - key: EMBED_BASE_URL
                  sync: false
                - key: EMBED_API_KEY
                  sync: false
                - key: EMBED_MODEL
                  sync: false
                - key: API_TOKEN
                  generateValue: true
      - file: terminal
        lang: sh
        text: |
          git remote add origin <your repository address>
          git push -u origin main
      - file: terminal
        lang: sh
        text: |
          curl -s https://<your service>.onrender.com/health

          curl -s -X POST https://<your service>.onrender.com/ask \
            -H "Authorization: Bearer <your API_TOKEN>" \
            -H "Content-Type: application/json" \
            -d '{"question": "Who is the release owner in October?"}'
    mistakes:
      - problem:
          en: "Committing a real API key to the repository, or putting it in the Dockerfile."
          tr: "Gerçek bir API anahtarını depoya commit'lemek ya da Dockerfile'a yazmak."
        fix:
          en: "Keys live only in the host's environment settings. If one leaked, revoke it at the provider at once and make a new one; deleting the commit is not enough."
          tr: "Anahtarlar sadece barındırıcının ortam ayarlarında durur. Biri sızdıysa hemen sağlayıcıda iptal et ve yenisini üret; commit'i silmek yetmez."
      - problem:
          en: "Pushing the notes to a public repository."
          tr: "Notları herkese açık bir depoya push'lamak."
        fix:
          en: "Use a private repository for anything with real notes. Render can build from private repositories."
          tr: "Gerçek not içeren her şey için özel depo kullan. Render özel depolardan derleyebilir."
      - problem:
          en: "Expecting the Free service to keep the index, logs or any file after it sleeps."
          tr: "Free servisin uyuduktan sonra indeksi, logları ya da herhangi bir dosyayı tutmasını beklemek."
        fix:
          en: "Local files are lost when the service spins down. That is why the app rebuilds the index on the first request. Keep important data in a database or at the model provider's dashboard, not on that disk."
          tr: "Servis uyuyunca yerel dosyalar kaybolur. Uygulamanın indeksi ilk istekte yeniden kurmasının nedeni bu. Önemli veriyi o diskte değil, bir veritabanında ya da model sağlayıcının panelinde tut."
    quiz:
      - q:
          en: "Why does the deployed helper need a hosted model server instead of Ollama?"
          tr: "Deploy edilen yardımcı neden Ollama yerine barındırılan bir model sunucusuna ihtiyaç duyar?"
        options:
          en:
            - "Ollama is not allowed on the internet"
            - "The free host has only 512 MB of RAM, too little to run a model"
            - "Hosted models are always free"
          tr:
            - "Ollama'nın internette kullanılması yasak"
            - "Ücretsiz barındırıcıda sadece 512 MB RAM var, model çalıştırmaya yetmez"
            - "Barındırılan modeller her zaman ücretsizdir"
        answer: 1
        why:
          en: "Even a 1B model is more than 1 GB. The free plan's memory is too small, so the model must run elsewhere. Check each provider's limits and prices yourself."
          tr: "1B bir model bile 1 GB'tan büyük. Free planın belleği çok küçük; bu yüzden model başka yerde çalışmalı. Her sağlayıcının limitlerini ve fiyatlarını kendin kontrol et."
    sources:
      - title: Render, Free instance limits
        url: https://render.com/docs/free
      - title: Render, Blueprint specification
        url: https://render.com/docs/blueprint-spec
      - title: Render, Web services
        url: https://render.com/docs/web-services

  - id: monitoring
    stage: monitoring
    title:
      en: "Log every model call: tokens, time and cost"
      tr: "Her model çağrısını kaydet: token, süre ve maliyet"
    minutes: 45
    needs: [deploy]
    why:
      en: "When an AI app misbehaves or the bill grows, you need to know what was sent, how long it took and how many tokens it used. One line per model call in a log file answers most of those questions. Prompts can hold private text, so the log stores them only if you turn that on."
      tr: "Bir yapay zekâ uygulaması yanlış davrandığında ya da fatura büyüdüğünde, neyin gönderildiğini, ne kadar sürdüğünü ve kaç token kullandığını bilmen gerekir. Log dosyasında model çağrısı başına bir satır bu soruların çoğunu cevaplar. Prompt'lar özel metin içerebilir; bu yüzden log onları sadece sen açarsan saklar."
    learn:
      en: |
        - What to record for each call: time, model, input and output tokens, seconds, cost. The response's `usage` field has the token counts.
        - Why **JSON Lines** (one JSON object per line): easy to append, easy to read with any tool
        - How **cost** is computed: tokens times the provider's price per million tokens. With Ollama it is 0, and the settings stay at 0 unless you set prices.
        - **Privacy**: prompts are not stored by default (`LOG_PROMPTS=1` turns it on), and stored prompts go through `redact` first
        - Why a broken log must never break the app: logging is a side job, so a full disk only prints a warning
        - What else to watch in production: error rate, slowest calls, the share of answers without a citation, and the eval score over time
      tr: |
        - Her çağrı için neyi kaydetmeli: zaman, model, girdi ve çıktı token'ları, saniye, maliyet. Token sayıları cevabın `usage` alanında.
        - **JSON Lines** neden (satır başına bir JSON nesnesi): eklemesi kolay, her araçla okuması kolay
        - **Maliyet** nasıl hesaplanır: token sayısı çarpı sağlayıcının milyon token başına fiyatı. Ollama ile 0'dır; fiyat girmedikçe ayarlar 0 kalır.
        - **Gizlilik**: prompt'lar varsayılan olarak saklanmaz (`LOG_PROMPTS=1` açar) ve saklanan prompt'lar önce `redact`'ten geçer
        - Bozuk bir logun uygulamayı neden asla bozmaması gerektiği: loglama yan iştir; dolu bir disk sadece bir uyarı yazdırır
        - Üretimde başka neye bakmalı: hata oranı, en yavaş çağrılar, kaynaksız cevapların oranı ve zaman içinde eval skoru
    do:
      en: |
        1. Append the settings below to `docshelper/config.py`.
        2. Create `docshelper/monitor.py`, replace `llm.py` with the new version (every chat call is timed and recorded), and create `commands/usage.py`.
        3. Add the fixture to the end of `tests/conftest.py`, so tests never write to your real log, then add `tests/test_monitor.py` and run `uv run pytest`.
        4. Ask a few questions, then run `usage`. Open `calls.jsonl` and read a line.
        5. To see costs, set prices (dollars per million tokens, from your provider's price page) and ask again. With Ollama leave them at 0.
        6. Turn prompt logging on for one run (`LOG_PROMPTS=1`), look at the log, and think about whether you would ever want it on a server with other people's questions.
        7. On Render the log file disappears when the service sleeps, so it is not a record to rely on there. The model provider's usage page is the reliable source of cost. A good small exercise: also print each log line to standard error, so the Render log page shows it.
        8. Commit: `git add .`, `git commit -m "Log model calls"`.
      tr: |
        1. Aşağıdaki ayarları `docshelper/config.py` sonuna ekle.
        2. `docshelper/monitor.py` dosyasını oluştur, `llm.py` dosyasını yeni sürümle değiştir (her sohbet çağrısı ölçülür ve kaydedilir) ve `commands/usage.py` dosyasını oluştur.
        3. Fixture'ı `tests/conftest.py` sonuna ekle; böylece testler gerçek loguna asla yazmaz. Sonra `tests/test_monitor.py` dosyasını ekle ve `uv run pytest` çalıştır.
        4. Birkaç soru sor, sonra `usage` çalıştır. `calls.jsonl` dosyasını aç ve bir satırı oku.
        5. Maliyetleri görmek için fiyatları ayarla (milyon token başına dolar, sağlayıcının fiyat sayfasından) ve tekrar sor. Ollama ile 0 bırak.
        6. Bir çalıştırma için prompt loglamayı aç (`LOG_PROMPTS=1`), loga bak ve başka insanların sorularının geldiği bir sunucuda bunu hiç açmak isteyip istemeyeceğini düşün.
        7. Render'da servis uyuyunca log dosyası kaybolur; yani orada güvenilecek bir kayıt değildir. Maliyet için güvenilir kaynak model sağlayıcının kullanım sayfasıdır. İyi bir küçük alıştırma: her log satırını standart hataya da yazdır; böylece Render'ın log sayfası onu gösterir.
        8. Commit'le: `git add .`, `git commit -m "Log model calls"`.
    code:
      - file: docshelper/config.py
        lang: python
        text: |

          # Monitoring (step 14).
          LOG_PATH = Path(os.environ.get("LOG_PATH", "calls.jsonl"))
          LOG_PROMPTS = os.environ.get("LOG_PROMPTS", "") == "1"  # off by default: prompts can hold private text
          PRICE_IN_PER_MILLION = float(os.environ.get("PRICE_IN_PER_MILLION", "0"))   # dollars per million input tokens
          PRICE_OUT_PER_MILLION = float(os.environ.get("PRICE_OUT_PER_MILLION", "0"))  # dollars per million output tokens
      - file: docshelper/monitor.py
        lang: python
        text: |
          import json
          import sys
          from datetime import UTC, datetime

          from . import config
          from .safety import redact


          def record(kind: str, model: str, usage, seconds: float, messages: list[dict]) -> None:
              """Add one line to the log file: when, which model, how many tokens, how long, what it cost."""
              prompt_tokens = getattr(usage, "prompt_tokens", 0) or 0
              completion_tokens = getattr(usage, "completion_tokens", 0) or 0
              entry = {
                  "time": datetime.now(UTC).isoformat(timespec="seconds"),
                  "kind": kind,
                  "model": model,
                  "prompt_tokens": prompt_tokens,
                  "completion_tokens": completion_tokens,
                  "seconds": round(seconds, 3),
                  "cost": (prompt_tokens * config.PRICE_IN_PER_MILLION + completion_tokens * config.PRICE_OUT_PER_MILLION) / 1_000_000,
              }
              if config.LOG_PROMPTS and messages:
                  entry["prompt"] = redact(str(messages[-1].get("content", "")))[:500]
              try:
                  with config.LOG_PATH.open("a", encoding="utf-8") as file:
                      file.write(json.dumps(entry) + "\n")
              except OSError as error:  # a full disk must not break answering questions
                  print(f"warning: cannot write the log: {error}", file=sys.stderr)


          def summary() -> dict:
              """Totals over the whole log file."""
              calls = tokens_in = tokens_out = 0
              seconds = cost = 0.0
              if config.LOG_PATH.is_file():
                  for line in config.LOG_PATH.read_text(encoding="utf-8").splitlines():
                      entry = json.loads(line)
                      calls += 1
                      tokens_in += entry["prompt_tokens"]
                      tokens_out += entry["completion_tokens"]
                      seconds += entry["seconds"]
                      cost += entry["cost"]
              return {"calls": calls, "prompt_tokens": tokens_in, "completion_tokens": tokens_out, "seconds": seconds, "cost": cost}
      - file: docshelper/llm.py
        lang: python
        text: |
          import time
          from functools import lru_cache

          from openai import OpenAI

          from . import config, monitor


          @lru_cache
          def chat_client() -> OpenAI:
              """One client for the whole program. The first call can be slow while the model loads."""
              return OpenAI(base_url=config.CHAT_BASE_URL, api_key=config.CHAT_API_KEY, timeout=300)


          def complete(messages: list[dict], **options):
              """Send messages to the chat model and return the whole response object. Every call is logged."""
              started = time.perf_counter()
              response = chat_client().chat.completions.create(model=config.CHAT_MODEL, messages=messages, **options)
              monitor.record("chat", config.CHAT_MODEL, response.usage, time.perf_counter() - started, messages)
              return response


          def chat(messages: list[dict], **options) -> str:
              """Send messages and return only the text of the reply."""
              return complete(messages, **options).choices[0].message.content or ""


          def chat_stream(messages: list[dict], **options):
              """Yield the reply piece by piece, so the user sees the first words quickly."""
              started = time.perf_counter()
              stream = chat_client().chat.completions.create(model=config.CHAT_MODEL, messages=messages, stream=True, **options)
              for chunk in stream:
                  if chunk.choices and chunk.choices[0].delta.content:
                      yield chunk.choices[0].delta.content
              monitor.record("chat-stream", config.CHAT_MODEL, None, time.perf_counter() - started, messages)
      - file: docshelper/commands/usage.py
        lang: python
        text: |
          from .. import monitor


          def run(args: list[str]) -> None:
              total = monitor.summary()
              print(f"Calls:             {total['calls']}")
              print(f"Prompt tokens:     {total['prompt_tokens']}")
              print(f"Completion tokens: {total['completion_tokens']}")
              print(f"Time in the model: {total['seconds']:.1f} s")
              print(f"Cost:              ${total['cost']:.4f}")
      - file: tests/conftest.py
        lang: python
        text: |


          @pytest.fixture(autouse=True)
          def log_in_tmp(tmp_path, monkeypatch):
              """Tests must never write to the real calls.jsonl."""
              monkeypatch.setattr(config, "LOG_PATH", tmp_path / "calls.jsonl")
      - file: tests/test_monitor.py
        lang: python
        text: |
          import json

          from fakes import say

          from docshelper import config, llm, monitor


          def test_a_call_is_logged_with_tokens_and_cost(fake_chat, monkeypatch):
              monkeypatch.setattr(config, "PRICE_IN_PER_MILLION", 1.0)
              monkeypatch.setattr(config, "PRICE_OUT_PER_MILLION", 2.0)
              fake_chat(say("hello"))
              assert llm.chat([{"role": "user", "content": "hi"}]) == "hello"
              entry = json.loads(config.LOG_PATH.read_text().splitlines()[0])
              assert entry["prompt_tokens"] == 10 and entry["completion_tokens"] == 5
              assert abs(entry["cost"] - 0.00002) < 1e-12
              assert "prompt" not in entry  # prompts are not stored unless LOG_PROMPTS=1


          def test_prompts_are_stored_redacted_only_when_asked(fake_chat, monkeypatch):
              monkeypatch.setattr(config, "LOG_PROMPTS", True)
              fake_chat(say("ok"))
              llm.chat([{"role": "user", "content": "my password: hunter2 please"}])
              entry = json.loads(config.LOG_PATH.read_text().splitlines()[0])
              assert "hunter2" not in entry["prompt"]


          def test_summary_adds_up(fake_chat):
              fake_chat(say("a"), say("b"))
              llm.chat([{"role": "user", "content": "1"}])
              llm.chat([{"role": "user", "content": "2"}])
              assert monitor.summary()["calls"] == 2
              assert monitor.summary()["prompt_tokens"] == 20


          def test_a_broken_log_does_not_break_the_call(fake_chat, monkeypatch, tmp_path):
              monkeypatch.setattr(config, "LOG_PATH", tmp_path / "missing-folder" / "calls.jsonl")
              fake_chat(say("fine"))
              assert llm.chat([{"role": "user", "content": "hi"}]) == "fine"
      - file: terminal
        lang: sh
        text: |
          uv run pytest
          uv run python -m docshelper ask "Who is the release owner in October?"
          uv run python -m docshelper usage
          head -n 1 calls.jsonl
          PRICE_IN_PER_MILLION=0.15 PRICE_OUT_PER_MILLION=0.60 uv run python -m docshelper ask "On which day do we never deploy?"
    mistakes:
      - problem:
          en: "Logging full prompts by default and storing other people's private text or secrets."
          tr: "Varsayılan olarak tam prompt'ları loglayıp başkalarının özel metnini ya da gizli bilgilerini saklamak."
        fix:
          en: "Log sizes and timings by default. Store prompts only when you need to debug, only for a short time, and always after redaction."
          tr: "Varsayılan olarak boyutları ve süreleri logla. Prompt'ları sadece hata ayıklamak gerektiğinde, kısa süre ve her zaman gizlemeden sonra sakla."
      - problem:
          en: "Believing your own cost estimate instead of the provider's dashboard."
          tr: "Sağlayıcının panelini değil kendi maliyet tahminine inanmak."
        fix:
          en: "Your log is an estimate based on the prices you typed and on calls that went through this code. The provider's usage page is the truth. Use your log to find which calls are expensive."
          tr: "Logun, girdiğin fiyatlara ve bu koddan geçen çağrılara dayanan bir tahmin. Gerçek, sağlayıcının kullanım sayfasıdır. Logunu hangi çağrıların pahalı olduğunu bulmak için kullan."
      - problem:
          en: "Streaming calls show 0 tokens in the log."
          tr: "Streaming çağrıları logda 0 token gösteriyor."
        fix:
          en: "In this version the streamed calls record time only. Servers that support `stream_options={\"include_usage\": True}` (Ollama does) send the counts in the last chunk if you ask for them."
          tr: "Bu sürümde streaming çağrıları sadece süreyi kaydeder. `stream_options={\"include_usage\": True}` destekleyen sunucular (Ollama destekler) istersen sayıları son parçada gönderir."
    quiz:
      - q:
          en: "Why are prompts not stored in the log by default?"
          tr: "Prompt'lar neden varsayılan olarak logda saklanmaz?"
        options:
          en:
            - "They are too long for a file"
            - "They can contain private text or secrets"
            - "The model forbids it"
          tr:
            - "Bir dosya için çok uzunlar"
            - "Özel metin ya da gizli bilgi içerebilirler"
            - "Model yasaklıyor"
        answer: 1
        why:
          en: "A log is another copy of the data, often kept longer and seen by more people than the app itself. Store only what you need."
          tr: "Log verinin bir kopyası daha; çoğu zaman uygulamanın kendisinden uzun saklanır ve daha fazla kişi görür. Sadece ihtiyacın olanı sakla."
    sources:
      - title: OpenAI Python library, usage and streaming
        url: https://github.com/openai/openai-python
      - title: Ollama OpenAI compatibility
        url: https://docs.ollama.com/api/openai-compatibility
      - title: OWASP, LLM02 Sensitive Information Disclosure
        url: https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/

  - id: host
    stage: advanced
    title:
      en: "Use your MCP server in a real AI app, and where to go next"
      tr: "MCP sunucunu gerçek bir yapay zekâ uygulamasında kullan ve sonra nereye"
    minutes: 45
    needs: [monitoring]
    why:
      en: "The reason to write an MCP server is that other AI apps can use it. Connecting it to one shows that the tools you wrote work outside your own program, and gives you a docs helper inside the tool you already use."
      tr: "MCP sunucusu yazmanın nedeni, diğer yapay zekâ uygulamalarının onu kullanabilmesi. Birine bağlamak, yazdığın araçların kendi programının dışında da çalıştığını gösterir ve sana zaten kullandığın aracın içinde bir dokümantasyon yardımcısı verir."
    learn:
      en: |
        - What a **host** is: the AI app (an editor, a chat app, a coding agent) that starts your server and lets its model use the tools
        - That a host starts your server by running a command, so the command must work from anywhere: `uv run --directory <project folder> docs-helper mcp`
        - Why you need the **absolute path** of the project folder
        - That the host's model decides when to call your tools from their names and descriptions, which is why the docstrings matter
        - What to build next: the ideas at the end of the steps below
      tr: |
        - **Host** nedir: sunucunu başlatan ve modelinin araçları kullanmasına izin veren yapay zekâ uygulaması (bir editör, bir sohbet uygulaması, bir kodlama agent'ı)
        - Host'un sunucunu bir komut çalıştırarak başlattığı; bu yüzden komutun her yerden çalışması gerektiği: `uv run --directory <proje klasörü> docs-helper mcp`
        - Neden proje klasörünün **mutlak yoluna** ihtiyacın olduğu
        - Host'un modelinin araçlarını adlarından ve açıklamalarından yola çıkarak ne zaman çağıracağına karar verdiği; docstring'lerin önemi bu
        - Sırada ne yapmalı: aşağıdaki adımların sonundaki fikirler
    do:
      en: |
        1. Make sure the index exists (`uv run python -m docshelper index`) and that Ollama is running, because the `search_notes` tool needs the embedding model.
        2. Find the absolute path of the project folder: run `pwd` (macOS and Linux) or `cd` (Windows), inside `docs-helper`.
        3. Test the exact command a host will run, with the real path, using the first block below. It must start and wait silently; press Ctrl+C.
        4. Register the server with **Claude Code** using the `claude mcp add` command (second block), or follow your own host's documentation. Hosts that use a JSON configuration file take the same command and arguments, as in the third block.
        5. Ask the host something your notes know, for example "Who is the release owner in October? Check my notes." Watch it call your tools.
        6. Try the MCP Inspector, the official debugging tool, with `uv run mcp dev docshelper/mcp_server.py`. It needs Node.js (`npx`) and shows your tools in a browser. (The `mcp` command comes from the `cli` extra: `uv add "mcp[cli]"`.)
        7. Pick one next step: hybrid search (keywords plus vectors), a reranking step, re-indexing when a note changes, a small chat web page for `/ask`, running the evals in a GitHub Actions workflow (see the CI/CD roadmap), or a bigger model once the evals show you need it.
      tr: |
        1. İndeksin var olduğundan (`uv run python -m docshelper index`) ve Ollama'nın çalıştığından emin ol; çünkü `search_notes` aracı embedding modeline ihtiyaç duyar.
        2. Proje klasörünün mutlak yolunu bul: `docs-helper` içinde `pwd` (macOS ve Linux) ya da `cd` (Windows) çalıştır.
        3. Bir host'un çalıştıracağı komutun aynısını gerçek yolla, aşağıdaki ilk blokla test et. Başlamalı ve sessizce beklemeli; Ctrl+C ile çık.
        4. Sunucuyu `claude mcp add` komutuyla **Claude Code**'a kaydet (ikinci blok) ya da kendi host'unun dokümanını izle. JSON ayar dosyası kullanan host'lar aynı komutu ve argümanları alır, üçüncü blokta olduğu gibi.
        5. Host'a notlarının bildiği bir şey sor, örneğin "Who is the release owner in October? Check my notes." Araçlarını çağırmasını izle.
        6. Resmî hata ayıklama aracı MCP Inspector'ı `uv run mcp dev docshelper/mcp_server.py` ile dene. Node.js (`npx`) gerektirir ve araçlarını tarayıcıda gösterir. (`mcp` komutu `cli` ekstrasından gelir: `uv add "mcp[cli]"`.)
        7. Sıradaki adımlardan birini seç: hibrit arama (anahtar kelime artı vektör), yeniden sıralama adımı, bir not değişince yeniden indeksleme, `/ask` için küçük bir sohbet web sayfası, evals'i bir GitHub Actions workflow'unda çalıştırmak (CI/CD yol haritasına bak) ya da evals ihtiyacın olduğunu gösterince daha büyük bir model.
    code:
      - file: terminal
        lang: sh
        text: |
          uv run --directory /absolute/path/to/docs-helper docs-helper mcp
      - file: terminal
        lang: sh
        text: |
          claude mcp add docs-helper -- uv run --directory /absolute/path/to/docs-helper docs-helper mcp
      - file: claude_desktop_config.json
        lang: json
        text: |
          {
            "mcpServers": {
              "docs-helper": {
                "command": "uv",
                "args": ["run", "--directory", "/absolute/path/to/docs-helper", "docs-helper", "mcp"]
              }
            }
          }
      - file: terminal
        lang: sh
        text: |
          uv add "mcp[cli]"
          uv run mcp dev docshelper/mcp_server.py
    mistakes:
      - problem:
          en: "The host says the server failed to start."
          tr: "Host sunucunun başlatılamadığını söylüyor."
        fix:
          en: "Run the exact command in a terminal first. Usual causes: a relative path instead of an absolute one, `uv` not on the host's PATH (use the full path to `uv`), or a `print()` somewhere that writes to standard output."
          tr: "Önce aynı komutu terminalde çalıştır. Genel nedenler: mutlak yol yerine göreli yol, `uv`'nin host'un PATH'inde olmaması (`uv`'nin tam yolunu kullan) ya da bir yerde standart çıktıya yazan bir `print()`."
      - problem:
          en: "The tools are listed but `search_notes` returns an error."
          tr: "Araçlar listeleniyor ama `search_notes` hata döndürüyor."
        fix:
          en: "Ollama is not running, or there is no index yet in the folder the host starts the server in. The `--directory` option makes `notes` and `index.db` resolve inside your project."
          tr: "Ollama çalışmıyor ya da host'un sunucuyu başlattığı klasörde henüz indeks yok. `--directory` seçeneği `notes` ve `index.db` yollarının projenin içinde çözülmesini sağlar."
      - problem:
          en: "Giving a host's model tools that can write or delete without thinking about it."
          tr: "Bir host'un modeline yazabilen ya da silebilen araçları düşünmeden vermek."
        fix:
          en: "Your tools are read-only on purpose. Before adding a tool that changes things, decide how the user confirms it, and treat everything the model passes as untrusted input."
          tr: "Araçların bilerek salt okunur. Bir şeyleri değiştiren bir araç eklemeden önce kullanıcının bunu nasıl onaylayacağına karar ver ve modelin ilettiği her şeyi güvenilmez girdi say."
    quiz:
      - q:
          en: "What does an MCP host need to start your server?"
          tr: "Bir MCP host'unun sunucunu başlatması için neye ihtiyacı var?"
        options:
          en:
            - "A command that works from any folder, with absolute paths"
            - "The source code uploaded to the host's company"
            - "A paid API key"
          tr:
            - "Her klasörden çalışan, mutlak yollu bir komut"
            - "Kaynak kodunun host'un şirketine yüklenmesi"
            - "Ücretli bir API anahtarı"
        answer: 0
        why:
          en: "The host runs your command as a child process and talks to it through standard input and output. Nothing is uploaded and no key is needed."
          tr: "Host komutunu bir alt süreç olarak çalıştırır ve onunla standart girdi/çıktı üzerinden konuşur. Hiçbir şey yüklenmez ve anahtar gerekmez."
    sources:
      - title: MCP Python SDK, connect to a real host
        url: https://py.sdk.modelcontextprotocol.io/get-started/real-host/
      - title: Claude Code, connect tools with MCP
        url: https://code.claude.com/docs/en/mcp
      - title: MCP Inspector
        url: https://modelcontextprotocol.io/docs/tools/inspector
