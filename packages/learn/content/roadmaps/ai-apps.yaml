  - id: evals
    stage: testing
    title:
      en: "Evals: measure the answers of the real model"
      tr: "Evals: gerçek modelin cevaplarını ölç"
    minutes: 45
    needs: [tests]
    why:
      en: "Unit tests cannot tell whether the model answers well. Evals can: a small list of questions with the expected answer, run against the real model, giving a score. Without them, every change to the model, the prompt or the chunk size is a guess."
      tr: "Birim testleri modelin iyi cevap verip vermediğini söyleyemez. Evals söyler: gerçek modele karşı çalıştırılan, beklenen cevabı olan küçük bir soru listesi ve sonunda bir skor. Onlar olmadan modelde, prompt'ta ya da chunk boyutunda yaptığın her değişiklik bir tahmindir."
    learn:
      en: |
        - What an **eval** is: test cases (question, what the answer must contain, which note should be found) and a score
        - Why checks are simple on purpose: "contains the word Dana" is cheap and clear. Fancier ways exist (a second model as judge), but start with this.
        - Two separate questions: did the **search** find the right note, and did the **model** say the right thing?
        - Why include a question the notes cannot answer: the helper must refuse, not invent
        - Why the pass mark is below 100%: small models vary, so use a threshold (80%) and watch it over time
      tr: |
        - **Eval** nedir: test durumları (soru, cevabın içermesi gerekenler, hangi notun bulunması gerektiği) ve bir skor
        - Kontrollerin neden bilerek basit olduğu: "Dana kelimesini içeriyor" ucuz ve net. Daha süslü yollar var (ikinci bir modeli hakem yapmak) ama bununla başla.
        - İki ayrı soru: **arama** doğru notu buldu mu ve **model** doğru şeyi söyledi mi?
        - Notların cevaplayamayacağı bir sorunun neden eklendiği: yardımcı uydurmamalı, reddetmeli
        - Geçme notunun neden %100'ün altında olduğu: küçük modeller değişir; bu yüzden eşik (%80) kullan ve zaman içinde izle
    do:
      en: |
        1. Create `evals/cases.json` with the five cases below. Write the expected words from the notes yourself, before you look at what the model says. Otherwise you only measure how well you copy the model.
        2. Create `evals.py` (the logic) and `commands/evals.py` (the command). The command exits with code 1 when the score is under the pass mark, so a script or CI can fail on it.
        3. Run `uv run python -m docshelper evals`. Read each FAIL: is it the search (note not found) or the model (wrong words)?
        4. Add `tests/test_evals.py`, which tests the eval code itself with fake answers, and run `uv run pytest`.
        5. Try one change and measure it: run `ollama pull llama3.2:1b` (1.3 GB), set `LLM_MODEL=llama3.2:1b` and run the evals again. Write the two scores down. This is how you will choose models from now on.
        6. Commit: `git add .`, `git commit -m "Evals"`.
      tr: |
        1. Aşağıdaki beş durumla `evals/cases.json` dosyasını oluştur. Beklenen kelimeleri modelin ne dediğine bakmadan, notlardan kendin yaz. Yoksa sadece modeli ne kadar iyi kopyaladığını ölçersin.
        2. `evals.py` (mantık) ve `commands/evals.py` (komut) dosyalarını oluştur. Komut skor geçme notunun altındaysa 1 koduyla çıkar; böylece bir betik ya da CI buna göre başarısız olabilir.
        3. `uv run python -m docshelper evals` çalıştır. Her FAIL'i oku: sorun arama mı (not bulunamadı) yoksa model mi (yanlış kelimeler)?
        4. Eval kodunun kendisini sahte cevaplarla test eden `tests/test_evals.py` dosyasını ekle ve `uv run pytest` çalıştır.
        5. Bir değişiklik dene ve ölç: `ollama pull llama3.2:1b` ile modeli indir (1,3 GB), `LLM_MODEL=llama3.2:1b` ayarla ve evals'i tekrar çalıştır. İki skoru not et. Bundan sonra modelleri böyle seçeceksin.
        6. Commit'le: `git add .`, `git commit -m "Evals"`.
