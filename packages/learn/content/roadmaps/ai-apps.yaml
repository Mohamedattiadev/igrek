  - id: tests
    stage: testing
    title:
      en: "Tests that need no model"
      tr: "Modele ihtiyaç duymayan testler"
    minutes: 60
    needs: [mcp]
    why:
      en: "A real model is slow, changes between runs and may not even be running. Tests need to be fast and always give the same result. So you test everything around the model with fakes: a fake embedding function and a scripted model. What you test is your code: chunking, search, the agent loop, the tools and the MCP server."
      tr: "Gerçek model yavaştır, çalıştırmalar arasında değişir ve belki çalışmıyordur bile. Testler hızlı olmalı ve hep aynı sonucu vermeli. Bu yüzden modelin etrafındaki her şeyi sahtelerle test edersin: sahte bir embedding fonksiyonu ve senaryolu bir model. Test ettiğin şey kendi kodun: chunking, arama, agent döngüsü, araçlar ve MCP sunucusu."
    learn:
      en: |
        - What a **fake** (test double) is: a simple stand-in that behaves the same every time. Here: `fake_embed` builds a vector from the words of a text, and `FakeClient` returns replies from a script.
        - How **pytest** finds tests (`test_*.py`, functions named `test_*`) and how **fixtures** share setup. `conftest.py` holds fixtures for all tests.
        - **monkeypatch**: it replaces something (a setting, a function) for one test and puts it back afterwards
        - Why every test gets its own temporary notes folder and index: tests must not depend on each other or touch your real files
        - What these tests cannot tell you: whether the real model answers well. That is the job of evals (next step).
      tr: |
        - **Sahte** (test double) nedir: her seferinde aynı davranan basit bir yedek. Burada: `fake_embed` bir metnin kelimelerinden vektör üretir, `FakeClient` bir senaryodan cevaplar döndürür.
        - **pytest** testleri nasıl bulur (`test_*.py` dosyaları, `test_*` adlı fonksiyonlar) ve **fixture**'lar kurulumu nasıl paylaşır. `conftest.py` bütün testler için fixture'ları tutar.
        - **monkeypatch**: bir şeyi (bir ayarı, bir fonksiyonu) tek bir test için değiştirir ve sonra geri koyar
        - Her testin neden kendi geçici not klasörü ve indeksi olduğu: testler birbirine bağlı olmamalı ve gerçek dosyalarına dokunmamalı
        - Bu testlerin sana söyleyemediği şey: gerçek modelin iyi cevap verip vermediği. Bu evals'in işi (sonraki adım).
    do:
      en: |
        1. Open `pyproject.toml` and add the lines below at the end. They tell pytest to look in `tests` and to find your package in the project folder.
        2. Create the `tests` folder with `fakes.py` and `conftest.py`. Read `fakes.py` first: it is short and it is the idea of the whole step.
        3. Add the test files. Each one covers one part of the program.
        4. Run `uv run pytest`. All tests should pass in about a second, with Ollama stopped. Try stopping Ollama to prove it.
        5. Break something on purpose (for example change `max_chars` in `chunking.py` to 10) and watch a test fail. Then undo it.
        6. Commit: `git add .`, `git commit -m "Tests with fakes"`.
      tr: |
        1. `pyproject.toml` dosyasını aç ve aşağıdaki satırları sonuna ekle. pytest'e `tests` klasörüne bakmasını ve paketini proje klasöründe bulmasını söyler.
        2. `fakes.py` ve `conftest.py` ile `tests` klasörünü oluştur. Önce `fakes.py` dosyasını oku: kısa ve bu adımın bütün fikri o.
        3. Test dosyalarını ekle. Her biri programın bir parçasını kapsar.
        4. `uv run pytest` çalıştır. Ollama kapalıyken bile bütün testler yaklaşık bir saniyede geçmeli. Kanıtlamak için Ollama'yı kapatmayı dene.
        5. Bilerek bir şeyi boz (örneğin `chunking.py` içinde `max_chars` değerini 10 yap) ve bir testin kırılmasını izle. Sonra geri al.
        6. Commit'le: `git add .`, `git commit -m "Tests with fakes"`.
    code:
      - file: pyproject.toml
        lang: toml
        text: |

          [tool.pytest.ini_options]
          pythonpath = ["."]
          testpaths = ["tests"]
      - file: tests/fakes.py
        lang: python
        text: |
          """Stand-ins for the model, so tests run in a second, offline, and always give the same result."""
          import json
          import math
          import re
          import zlib
          from types import SimpleNamespace


          def fake_embed(texts: list[str]) -> list[list[float]]:
              """A vector from the words of a text: texts that share words get similar vectors."""
              vectors = []
              for text in texts:
                  vector = [0.0] * 64
                  for word in re.findall(r"[a-z0-9]+", text.lower()):
                      vector[zlib.crc32(word.encode()) % 64] += 1.0
                  length = math.sqrt(sum(x * x for x in vector)) or 1.0
                  vectors.append([x / length for x in vector])
              return vectors


          def say(text: str):
              """A scripted reply: the model answers with text."""
              return SimpleNamespace(content=text, tool_calls=None)


          def call(tool: str, /, **arguments):
              """A scripted reply: the model asks for a tool."""
              function = SimpleNamespace(name=tool, arguments=json.dumps(arguments))
              return SimpleNamespace(content="", tool_calls=[SimpleNamespace(id=f"call_{tool}", function=function)])


          class FakeClient:
              """Looks like the OpenAI client and hands out the scripted replies one by one."""

              def __init__(self, replies):
                  self.replies = list(replies)
                  self.requests = []  # what the program sent, for assertions
                  self.chat = SimpleNamespace(completions=SimpleNamespace(create=self._create))

              def _create(self, **request):
                  self.requests.append(request)
                  message = self.replies.pop(0)
                  usage = SimpleNamespace(prompt_tokens=10, completion_tokens=5)
                  return SimpleNamespace(choices=[SimpleNamespace(message=message)], usage=usage)
      - file: tests/conftest.py
        lang: python
        text: |
          import shutil
          from pathlib import Path

          import pytest
          from fakes import FakeClient, fake_embed

          from docshelper import config, embeddings, indexer, llm


          @pytest.fixture(autouse=True)
          def isolated(tmp_path, monkeypatch):
              """Every test gets its own copy of the notes, its own index, and the fake embeddings."""
              notes = tmp_path / "notes"
              shutil.copytree(Path(__file__).parent.parent / "notes", notes)
              monkeypatch.setattr(config, "NOTES_DIR", notes)
              monkeypatch.setattr(config, "DB_PATH", tmp_path / "index.db")
              monkeypatch.setattr(embeddings, "embed", fake_embed)


          @pytest.fixture
          def indexed():
              indexer.build_index()


          @pytest.fixture
          def fake_chat(monkeypatch):
              """fake_chat(reply, reply, ...) puts a scripted model in place of the real one."""

              def install(*replies):
                  client = FakeClient(replies)
                  monkeypatch.setattr(llm, "chat_client", lambda: client)
                  return client

              return install
      - file: tests/test_chunking.py
        lang: python
        text: |
          from docshelper.chunking import chunk_markdown


          def test_splits_by_heading():
              text = "# Title\n\n## One\nfirst part\n\n## Two\nsecond part\n"
              chunks = chunk_markdown("a.md", text)
              assert [(c.heading, c.text) for c in chunks] == [("One", "first part"), ("Two", "second part")]


          def test_long_section_is_cut_into_pieces():
              text = "## Long\n" + "\n\n".join(["word " * 30] * 6)
              chunks = chunk_markdown("a.md", text, max_chars=400)
              assert len(chunks) > 1
              assert all(len(c.text) <= 400 for c in chunks)


          def test_hash_inside_a_code_fence_is_not_a_heading():
              text = "## Setup\n```sh\n# install it\nuv sync\n```\n"
              chunks = chunk_markdown("a.md", text)
              assert len(chunks) == 1
              assert "# install it" in chunks[0].text


          def test_empty_text_gives_no_chunks():
              assert chunk_markdown("a.md", "") == []
      - file: tests/test_search.py
        lang: python
        text: |
          from fakes import fake_embed

          from docshelper import indexer, store, tools
          from docshelper.errors import UserError


          def test_index_counts():
              notes, chunks = indexer.build_index()
              assert notes == 4
              assert chunks >= 4


          def test_search_finds_the_right_note(indexed):
              db = store.connect()
              hits = store.search(db, fake_embed(["who is the release owner"])[0], k=2)
              db.close()
              assert hits[0].source == "release-process.md"
              assert hits[0].distance <= hits[1].distance


          def test_search_without_index_explains_what_to_do():
              db = store.connect()
              try:
                  store.search(db, fake_embed(["anything"])[0])
              except UserError as error:
                  assert "python -m docshelper index" in str(error)
              else:
                  raise AssertionError("expected a UserError")
              finally:
                  db.close()


          def test_search_tool_returns_plain_dicts(indexed):
              results = tools.search_notes("undo the last commit", k=1)
              assert results[0]["source"] == "git-undo.md"
      - file: tests/test_tools.py
        lang: python
        text: |
          import json

          from docshelper import config, tools


          def test_read_note_works():
              assert "Dana" in tools.read_note("release-process.md")


          def test_path_traversal_is_refused():
              for name in ["../secret.md", "/etc/passwd", "../../etc/passwd", "release-process.md/../../x.md"]:
                  assert tools.call_tool("read_note", {"name": name}).startswith("Error:")


          def test_only_markdown_files_are_readable():

              (config.NOTES_DIR / "secret.txt").write_text("hidden")
              assert tools.call_tool("read_note", {"name": "secret.txt"}).startswith("Error:")


          def test_bad_tool_calls_come_back_as_text():
              assert tools.call_tool("delete_everything", {}).startswith("Error:")
              assert tools.call_tool("read_note", {"wrong": 1}).startswith("Error:")
              assert tools.call_tool("read_note", ["not", "a", "dict"]).startswith("Error:")


          def test_list_notes_is_json():
              assert "git-undo.md" in json.loads(tools.call_tool("list_notes", {}))
      - file: tests/test_agent.py
        lang: python
        text: |
          from fakes import call, say

          from docshelper.agent import run_agent


          def test_agent_searches_then_answers(indexed, fake_chat):
              client = fake_chat(call("search_notes", query="release owner"), say("Dana, see release-process.md"))
              assert run_agent("Who is the release owner?") == "Dana, see release-process.md"
              # The second request must contain the tool result, so the model can read it.
              tool_messages = [m for m in client.requests[1]["messages"] if m["role"] == "tool"]
              assert len(tool_messages) == 1
              assert "release-process.md" in tool_messages[0]["content"]


          def test_agent_survives_a_bad_tool_call(indexed, fake_chat):
              fake_chat(call("read_note", name="../../etc/passwd"), say("I do not know based on the notes."))
              assert run_agent("Read the passwd file") == "I do not know based on the notes."


          def test_agent_stops_after_max_steps(indexed, fake_chat):
              fake_chat(*[call("list_notes")] * 3)
              assert "step limit" in run_agent("loop forever", max_steps=3)
      - file: tests/test_ask.py
        lang: python
        text: |
          from fakes import say

          from docshelper import rag


          def test_ask_cites_sources(indexed, fake_chat):
              client = fake_chat(say("The release owner is Dana [1]."))
              answer = rag.ask("Who is the release owner?")
              assert answer.sources[0][0] == 1
              assert answer.sources[0][1].source == "release-process.md"
              prompt = client.requests[0]["messages"][1]["content"]
              assert "release owner" in prompt.lower()


          def test_citation_numbers_that_do_not_exist_are_ignored(indexed, fake_chat):
              fake_chat(say("Made up [9]."))
              assert rag.ask("anything about git").sources == []
      - file: tests/test_mcp.py
        lang: python
        text: |
          import asyncio
          import json

          from mcp import Client

          from docshelper.mcp_server import mcp


          def test_server_lists_the_three_tools():
              async def go():
                  async with Client(mcp) as client:
                      return sorted(tool.name for tool in (await client.list_tools()).tools)

              assert asyncio.run(go()) == ["list_notes", "read_note", "search_notes"]


          def test_server_runs_a_tool(indexed):
              async def go():
                  async with Client(mcp) as client:
                      return await client.call_tool("search_notes", {"query": "release owner", "k": 1})

              result = asyncio.run(go())
              assert not result.is_error
              assert result.structured_content["result"][0]["source"] == "release-process.md"
              assert "release-process.md" in json.dumps(result.structured_content)


          def test_server_reports_tool_errors():
              async def go():
                  async with Client(mcp) as client:
                      return await client.call_tool("read_note", {"name": "../x.md"})

              result = asyncio.run(go())
              assert result.is_error
              assert "No such note" in result.content[0].text
      - file: terminal
        lang: sh
        text: |
          uv run pytest
    mistakes:
      - problem:
          en: "Tests call the real Ollama and sometimes fail or take a minute."
          tr: "Testler gerçek Ollama'yı çağırıyor ve bazen başarısız oluyor ya da bir dakika sürüyor."
        fix:
          en: "Patch the model in `conftest.py` (the `isolated` and `fake_chat` fixtures do). Call functions through the module (`embeddings.embed(...)`, `llm.chat_client()`), not copies imported by name, otherwise the patch does not reach them."
          tr: "Modeli `conftest.py` içinde değiştir (`isolated` ve `fake_chat` fixture'ları bunu yapar). Fonksiyonları ada göre import edilmiş kopyalar yerine modül üzerinden çağır (`embeddings.embed(...)`, `llm.chat_client()`); aksi halde değişiklik onlara ulaşmaz."
      - problem:
          en: "`ModuleNotFoundError: No module named 'docshelper'` in pytest."
          tr: "pytest içinde `ModuleNotFoundError: No module named 'docshelper'` hatası."
        fix:
          en: "The `pythonpath = [\".\"]` setting is missing in `pyproject.toml`, or you ran `pytest` outside the project folder. Use `uv run pytest` from `docs-helper`."
          tr: "`pyproject.toml` içinde `pythonpath = [\".\"]` ayarı eksik ya da `pytest`'i proje klasörünün dışında çalıştırdın. `docs-helper` içinden `uv run pytest` kullan."
      - problem:
          en: "A test passes alone but fails with the others."
          tr: "Bir test tek başına geçiyor ama diğerleriyle birlikte kalıyor."
        fix:
          en: "Tests share something: a file, a global, a cache. Give each test its own files with `tmp_path` and restore settings with `monkeypatch`."
          tr: "Testler bir şeyi paylaşıyor: bir dosya, bir global değişken, bir cache. Her teste `tmp_path` ile kendi dosyalarını ver ve ayarları `monkeypatch` ile geri al."
    quiz:
      - q:
          en: "What do these tests prove?"
          tr: "Bu testler neyi kanıtlar?"
        options:
          en:
            - "That the real model gives good answers"
            - "That your code handles the model's replies correctly"
            - "That the notes are well written"
          tr:
            - "Gerçek modelin iyi cevaplar verdiğini"
