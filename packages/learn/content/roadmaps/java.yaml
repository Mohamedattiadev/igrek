id: java
title:
  en: "Java and Spring Boot"
  tr: "Java ve Spring Boot"
summary:
  en: "From an empty computer to your own Java web service on the internet. You write plain Java first, then build a real REST API with Spring Boot, a database, tests, login, a Docker image and a free deploy."
  tr: "Boş bir bilgisayardan internette yayında olan kendi Java web servisine. Önce düz Java yazarsın, sonra Spring Boot ile gerçek bir REST API, veritabanı, test, giriş, Docker image'ı ve ücretsiz bir deploy hazırlarsın."
teacher: backend
project:
  en: 'A small library service: a REST API to add, list, search, change and delete books. It stores them in H2 and then PostgreSQL, validates input, has tests, needs a login to change data, caches reads, and runs as a Docker container on a free host.'
  tr: 'Küçük bir kütüphane servisi: kitap ekleyen, listeleyen, arayan, değiştiren ve silen bir REST API. Kitapları önce H2''de, sonra PostgreSQL''de saklar, girdiyi doğrular, testleri vardır, veriyi değiştirmek için giriş ister, okumaları cache''ler ve ücretsiz bir sunucuda Docker container olarak çalışır.'
detect:
  files: [pom.xml, build.gradle, build.gradle.kts]
version: "27"
latest: eol:oracle-jdk
checked: 2026-10
sheets: [java, sql, http, rest-graphql, docker, git, auth, caching]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install a JDK, an editor and Git"
      tr: "JDK, bir editör ve Git kurma"
    minutes: 40
    why:
      en: "Java programs are compiled and run by the JDK (Java Development Kit). Without it nothing else works. An editor that understands Java will point out mistakes while you type, and Git keeps every version of your work."
      tr: "Java programlarını JDK (Java Development Kit) derler ve çalıştırır. O olmadan hiçbir şey çalışmaz. Java'yı anlayan bir editör sen yazarken hataları gösterir, Git de işinin her sürümünü saklar."
    learn:
      en: |
        - What the JDK is, and what LTS means (a version that gets fixes for many years)
        - Which version to pick: **Java 25 is the current LTS**; Java 27 is newer but a normal release with a short life
        - How to check that `java` and `javac` are installed and are the same version
      tr: |
        - JDK'nın ne olduğu ve LTS'in ne demek olduğu (uzun yıllar düzeltme alan sürüm)
        - Hangi sürümü seçeceğin: **Java 25 şu anki LTS**; Java 27 daha yeni ama kısa ömürlü normal bir sürüm
        - `java` ve `javac`'in kurulu olduğunu ve aynı sürüm olduğunu kontrol etmek
    do:
      en: |
        1. Install a **JDK 25** (the free Temurin build from adoptium.net is a good choice). On Windows and macOS use the installer. On Linux use the package for your distribution (Adoptium and most distributions have one) and pick the JDK, not only the JRE.
        2. Install an editor: **IntelliJ IDEA Community** (free, best Java support) or **Visual Studio Code** with the "Extension Pack for Java".
        3. Install **Git** (git-scm.com) and tell it who you are (see the Git cheatsheet).
        4. Open a *new* terminal and run the commands below. `java` runs programs and `javac` compiles them; both must print the same major version.
        5. You do **not** need to install Maven: the project you create later contains `mvnw`, a small script that downloads the right Maven by itself.
        6. Newer JDKs such as 27 also work for everything in this roadmap. Only the Dockerfile and the CI file name 25, change them if you prefer another version.
      tr: |
        1. Bir **JDK 25** kur (adoptium.net'teki ücretsiz Temurin sürümü iyi bir seçim). Windows ve macOS'ta yükleyiciyi kullan. Linux'ta dağıtımının paketini kullan (Adoptium'un ve çoğu dağıtımın paketi var) ve sadece JRE'yi değil, JDK'yı seç.
        2. Bir editör kur: **IntelliJ IDEA Community** (ücretsiz, en iyi Java desteği) ya da "Extension Pack for Java" eklentisiyle **Visual Studio Code**.
        3. **Git**'i kur (git-scm.com) ve ona kim olduğunu söyle (Git kopya kâğıdına bak).
        4. *Yeni* bir terminal aç ve aşağıdaki komutları çalıştır. `java` programları çalıştırır, `javac` derler; ikisi de aynı ana sürümü yazmalı.
        5. Maven kurman **gerekmiyor**: sonra oluşturacağın projede `mvnw` adında küçük bir script var, doğru Maven'ı kendisi indirir.
        6. 27 gibi daha yeni JDK'lar da bu roadmap'teki her şeyle çalışır. Sadece Dockerfile ve CI dosyasında 25 yazıyor, istersen başka bir sürüm yaz.
    code:
      - file: terminal
        lang: sh
        text: |
          java -version
          javac -version
          git --version
    mistakes:
      - problem:
          en: "`java -version` shows an old version (for example 17) after installing a new JDK."
          tr: "Yeni JDK kurduktan sonra `java -version` eski bir sürüm (mesela 17) gösteriyor."
        fix:
          en: "An older JDK comes first on your PATH. Close and reopen the terminal; if it persists, remove the old JDK or point the `JAVA_HOME` variable to the new one."
          tr: "PATH'te eski bir JDK önce geliyor. Terminali kapatıp yeniden aç; sürerse eski JDK'yı kaldır ya da `JAVA_HOME` değişkenini yenisine yönlendir."
      - problem:
          en: "`java` works but `javac` is \"command not found\"."
          tr: "`java` çalışıyor ama `javac` \"command not found\" diyor."
        fix:
          en: "Only a JRE (runtime) is installed. Install the full JDK, which contains the compiler."
          tr: "Sadece JRE (çalışma ortamı) kurulu. Derleyiciyi de içeren tam JDK'yı kur."
    quiz:
      - q:
          en: "What does the JDK have that a plain JRE does not?"
          tr: "JDK'da, düz bir JRE'de olmayan ne var?"
        options:
          en: ["The compiler and developer tools", "A faster JVM", "A built-in editor"]
          tr: ["Derleyici ve geliştirici araçları", "Daha hızlı bir JVM", "Yerleşik bir editör"]
        answer: 0
        why:
          en: "The JDK contains `javac` and other tools used to build programs. A JRE can only run them."
          tr: "JDK, program derlemek için kullanılan `javac` ve diğer araçları içerir. JRE sadece çalıştırabilir."
    sources:
      - title: Adoptium, installation
        url: https://adoptium.net/installation/
      - title: JDK 25 installation guide
        url: https://docs.oracle.com/en/java/javase/25/install/overview-jdk-installation.html
      - title: Java release schedule (which versions are LTS)
        url: https://endoflife.date/oracle-jdk

  - id: hello-java
    stage: first-code
    title:
      en: "Run your first Java program"
      tr: "İlk Java programını çalıştırma"
    minutes: 20
    needs: [setup]
    why:
      en: "Before any framework, you should see how a Java program starts and how it is compiled and run. Everything Spring does later is plain Java underneath."
      tr: "Herhangi bir framework'ten önce bir Java programının nasıl başladığını, nasıl derlenip çalıştığını görmelisin. Spring'in sonradan yaptığı her şey altta düz Java."
    learn:
      en: |
        - A program starts in the `main` method of a class
        - `java Hello.java` compiles and runs one file in a single step
        - `javac` and `java` as two separate steps, and what a `.class` file is
      tr: |
        - Bir program, bir class'ın `main` metodunda başlar
        - `java Hello.java` tek bir dosyayı tek adımda derleyip çalıştırır
        - `javac` ve `java`'nın iki ayrı adım olarak kullanımı, `.class` dosyasının ne olduğu
    do:
      en: |
        1. Make a folder for your work, for example `library-playground`, and open it in your editor.
        2. Create the file `Hello.java` with the code below. The file name must match the class name: `Hello` lives in `Hello.java`.
        3. Run it with `java Hello.java`. You should see the greeting.
        4. Now do it in two steps: `javac -d out Hello.java` creates `out/Hello.class`, and `java -cp out Hello` runs it. This is what build tools do for you later.
        5. Change the text, run again, and break it on purpose (remove a semicolon) to see what a compiler error looks like.
      tr: |
        1. Çalışman için bir klasör aç, mesela `library-playground`, ve editörde aç.
        2. Aşağıdaki kodla `Hello.java` dosyasını oluştur. Dosya adı class adıyla aynı olmalı: `Hello`, `Hello.java` içinde durur.
        3. `java Hello.java` ile çalıştır. Selamlama yazısını görmelisin.
        4. Şimdi iki adımda yap: `javac -d out Hello.java` `out/Hello.class` dosyasını oluşturur, `java -cp out Hello` onu çalıştırır. Build araçları bunu sonradan senin yerine yapar.
        5. Metni değiştir, yeniden çalıştır, sonra bilerek bozup (bir noktalı virgülü sil) derleyici hatasının nasıl göründüğüne bak.
    code:
      - file: Hello.java
        lang: java
        text: |
          public class Hello {
              public static void main(String[] args) {
                  String name = "library";
                  System.out.println("Hello from the " + name + " project");
              }
          }
      - file: terminal
        lang: sh
        text: |
          java Hello.java
          javac -d out Hello.java
          java -cp out Hello
    mistakes:
      - problem:
          en: "\"class Hello is public, should be declared in a file named Hello.java\"."
          tr: "\"class Hello is public, should be declared in a file named Hello.java\" hatası."
        fix:
          en: "The public class and the file must have the same name, including upper and lower case letters. Rename the file or the class."
          tr: "Public class ile dosyanın adı, büyük küçük harfler dahil, aynı olmalı. Dosyayı ya da class'ı yeniden adlandır."
      - problem:
          en: "\"Could not find or load main class Hello\" when using `java -cp out Hello`."
          tr: "`java -cp out Hello` çalıştırırken \"Could not find or load main class Hello\" hatası."
        fix:
          en: "You are in the wrong folder, or you wrote `Hello.class` or `out/Hello`. Run it from the folder that contains `out`, and give the class name only."
          tr: "Yanlış klasördesin ya da `Hello.class` veya `out/Hello` yazdın. `out` klasörünü içeren klasörden çalıştır ve sadece class adını ver."
    quiz:
      - q:
          en: "What does `java Hello.java` do?"
          tr: "`java Hello.java` ne yapar?"
        options:
          en: ["Only compiles the file", "Compiles and runs the file in one step", "Installs the program"]
          tr: ["Sadece dosyayı derler", "Dosyayı tek adımda derleyip çalıştırır", "Programı kurar"]
        answer: 1
        why:
          en: "The source launcher compiles the file in memory and runs it at once, which is handy for small programs and learning."
          tr: "Kaynak başlatıcı dosyayı bellekte derler ve hemen çalıştırır; küçük programlar ve öğrenme için çok kullanışlıdır."
    sources:
      - title: dev.java, your first Java code
        url: https://dev.java/learn/first-steps/first-java-code/
      - title: The java command
        url: https://docs.oracle.com/en/java/javase/25/docs/specs/man/java.html

  - id: records-streams
    stage: basics
    title:
      en: "Records, collections and streams"
      tr: "Record'lar, koleksiyonlar ve stream'ler"
    minutes: 60
    needs: [hello-java]
    why:
      en: "The library service is about books: a type that holds data, lists of them, searching and grouping. Records, `List`, `Map`, `Optional` and streams are the tools you will use in every Spring controller and service."
      tr: "Kütüphane servisi kitaplarla ilgili: veri tutan bir tip, onların listeleri, arama ve gruplama. Record, `List`, `Map`, `Optional` ve stream'ler her Spring controller ve service'inde kullanacağın araçlar."
    learn:
      en: |
        - A **record** is a short class for data: Java writes the constructor, accessors, `equals` and `toString`
        - A compact constructor checks the values when a record is created
        - `List`, `Map` and `Optional`, and how to read generic types like `List<Book>`
        - **Streams**: `filter`, `map`, `sorted`, `toList` and `groupingBy` describe what you want instead of writing loops
      tr: |
        - **Record**, veri için kısa bir class: Java constructor'ı, erişim metotlarını, `equals` ve `toString`'i senin yerine yazar
        - Compact constructor, record oluşturulurken değerleri kontrol eder
        - `List`, `Map` ve `Optional`; `List<Book>` gibi generic tipler nasıl okunur
        - **Stream**'ler: `filter`, `map`, `sorted`, `toList` ve `groupingBy`, döngü yazmak yerine ne istediğini anlatır
    do:
      en: |
        1. Create `Catalog.java` in the same playground folder with the code below.
        2. Run it with `java Catalog.java` and compare the output with what you expect from each line.
        3. Add a fifth book and change the filter to `b.year() < 1900`. Predict the output before you run it.
        4. Try `new Book(6, null, "X", 2000)` and read the error message.
      tr: |
        1. Aynı playground klasöründe aşağıdaki kodla `Catalog.java` oluştur.
        2. `java Catalog.java` ile çalıştır ve çıktıyı her satırdan beklediğinle karşılaştır.
        3. Beşinci bir kitap ekle ve filtreyi `b.year() < 1900` yap. Çalıştırmadan önce çıktıyı tahmin et.
        4. `new Book(6, null, "X", 2000)` dene ve hata mesajını oku.
    code:
      - file: Catalog.java
        lang: java
        text: |
          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Map;
          import java.util.Optional;
          import java.util.stream.Collectors;

          public class Catalog {

              // A record is a small class that only holds data. Java writes the constructor,
              // the getters (title(), author() ...), equals, hashCode and toString for you.
              record Book(long id, String title, String author, int year) {
                  Book {
                      if (title == null || title.isBlank()) {
                          throw new IllegalArgumentException("title is required");
                      }
                  }
              }

              public static void main(String[] args) {
                  List<Book> books = new ArrayList<>();
                  books.add(new Book(1, "Dune", "Frank Herbert", 1965));
                  books.add(new Book(2, "Emma", "Jane Austen", 1815));
                  books.add(new Book(3, "Persuasion", "Jane Austen", 1817));
                  books.add(new Book(4, "Neuromancer", "William Gibson", 1984));

                  System.out.println(books.get(0));

                  // Stream: describe what you want, not how to loop.
                  List<String> titles = books.stream()
                          .filter(b -> b.year() < 1970)
                          .sorted(Comparator.comparing(Book::title))
                          .map(Book::title)
                          .toList();
                  System.out.println("Before 1970: " + titles);

                  // Group books by author.
                  Map<String, List<String>> byAuthor = books.stream()
                          .collect(Collectors.groupingBy(Book::author,
                                  Collectors.mapping(Book::title, Collectors.toList())));
                  System.out.println("Austen wrote: " + byAuthor.get("Jane Austen"));

                  // Optional: "maybe there is a value".
                  Optional<Book> found = books.stream().filter(b -> b.id() == 9).findFirst();
                  System.out.println(found.map(Book::title).orElse("no book with id 9"));

                  try {
                      new Book(5, " ", "Nobody", 2000);
                  } catch (IllegalArgumentException e) {
                      System.out.println("Rejected: " + e.getMessage());
                  }
              }
          }
      - file: terminal
        lang: sh
        text: |
          java Catalog.java
    mistakes:
      - problem:
          en: "Comparing strings with `==`, for example `book.author() == \"Jane Austen\"`."
          tr: "String'leri `==` ile karşılaştırmak, mesela `book.author() == \"Jane Austen\"`."
        fix:
          en: "`==` compares object identity, not text. Use `book.author().equals(\"Jane Austen\")` or `equalsIgnoreCase`."
          tr: "`==` metni değil nesne kimliğini karşılaştırır. `book.author().equals(\"Jane Austen\")` ya da `equalsIgnoreCase` kullan."
      - problem:
          en: "Trying to change a record field: `book.title = \"New\"` or looking for `setTitle`."
          tr: "Record alanını değiştirmeye çalışmak: `book.title = \"New\"` ya da `setTitle` aramak."
        fix:
          en: "Records are immutable. Create a new record with the changed value instead. (This is also why the database entity later is a normal class.)"
          tr: "Record'lar değiştirilemez. Bunun yerine değişen değerle yeni bir record oluştur. (Veritabanı entity'sinin sonradan normal bir class olmasının sebebi de bu.)"
    quiz:
      - q:
          en: "What does `Optional<Book>` tell the reader?"
          tr: "`Optional<Book>` okuyana ne söyler?"
        options:
          en: ["The book is optional to print", "There may be no book at all", "The book can be changed"]
          tr: ["Kitabı yazdırmak isteğe bağlı", "Hiç kitap olmayabilir", "Kitap değiştirilebilir"]
        answer: 1
        why:
          en: "It is a box that holds a value or nothing. It forces the caller to decide what to do when the value is missing, instead of getting a surprise `null`."
          tr: "İçinde ya bir değer ya da hiçbir şey olan bir kutudur. Değer yokken ne yapılacağını çağıranın düşünmesini sağlar; sürpriz bir `null` gelmez."
    sources:
      - title: Java language guide, records
        url: https://docs.oracle.com/en/java/javase/25/language/records.html
      - title: java.util.stream package
        url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/package-summary.html
      - title: dev.java, learn Java
        url: https://dev.java/learn/

  - id: spring-project
    stage: first-project
    title:
      en: "Create the Spring Boot project and run it"
      tr: "Spring Boot projesini oluşturma ve çalıştırma"
    minutes: 45
    needs: [records-streams]
    why:
      en: "Spring Boot is the most used Java framework for web services. It starts a web server inside your program and wires everything together with almost no setup. start.spring.io generates a project that already builds and runs."
      tr: "Spring Boot, web servisleri için en çok kullanılan Java framework'ü. Programının içinde bir web sunucusu başlatır ve neredeyse hiç ayar yapmadan her şeyi birbirine bağlar. start.spring.io, zaten derlenen ve çalışan bir proje üretir."
    learn:
      en: |
        - What a **dependency** is, and how `pom.xml` (Maven) lists them
        - What each starter gives you: Web (HTTP server and controllers), Validation, JPA (database access), H2 (an in-memory database), PostgreSQL driver, Actuator (health and metrics)
        - The layout: `src/main/java`, `src/main/resources/application.properties`, `src/test/java`
        - `mvnw` (Maven wrapper) runs the build without installing Maven
      tr: |
        - **Dependency** (bağımlılık) nedir ve `pom.xml` (Maven) bunları nasıl listeler
        - Her starter'ın ne verdiği: Web (HTTP sunucusu ve controller'lar), Validation, JPA (veritabanı erişimi), H2 (bellekte çalışan veritabanı), PostgreSQL driver, Actuator (sağlık ve metrikler)
        - Klasör yapısı: `src/main/java`, `src/main/resources/application.properties`, `src/test/java`
        - `mvnw` (Maven wrapper), Maven kurmadan build'i çalıştırır
    do:
      en: |
        1. Open **start.spring.io**. Choose: Project **Maven**, Language **Java**, the newest stable Spring Boot (not a SNAPSHOT or M release; this roadmap used **4.1.1**), Group `dev.igrek`, Artifact `library`, Packaging **Jar**, Java **25**.
        2. Add these dependencies: **Spring Web**, **Validation**, **Spring Data JPA**, **H2 Database**, **PostgreSQL Driver**, **Spring Boot Actuator**. Click **Generate** and unzip the file. (Instead of the website you can run the `curl` command below, which asks for the same project.)
        3. Open the `library` folder in your editor. Look at `pom.xml`, `LibraryApplication.java` and the test that came with it.
        4. Start the app with `./mvnw spring-boot:run` (on Windows PowerShell: `.\mvnw spring-boot:run`). The first run downloads Maven and the libraries and takes a few minutes.
        5. Wait for the line `Started LibraryApplication`. Open http://localhost:8080/actuator/health in a browser: it shows `{"groups":["liveness","readiness"],"status":"UP"}`. Stop the app with Ctrl+C.
        6. Add `Book.java` and `BookController.java` below, in `src/main/java/dev/igrek/library/`. Run the app again and open http://localhost:8080/api/books.
        7. Put the project under Git: `git init`, `git add .`, `git commit -m "Create the library project"`. The generated `.gitignore` already skips `target/`.
      tr: |
        1. **start.spring.io**'yu aç. Şunları seç: Project **Maven**, Language **Java**, en yeni kararlı Spring Boot (SNAPSHOT ya da M sürümü değil; bu roadmap **4.1.1** kullandı), Group `dev.igrek`, Artifact `library`, Packaging **Jar**, Java **25**.
        2. Şu bağımlılıkları ekle: **Spring Web**, **Validation**, **Spring Data JPA**, **H2 Database**, **PostgreSQL Driver**, **Spring Boot Actuator**. **Generate**'e tıkla ve zip'i aç. (Web sitesi yerine aşağıdaki `curl` komutunu da çalıştırabilirsin, aynı projeyi ister.)
        3. `library` klasörünü editörde aç. `pom.xml`, `LibraryApplication.java` ve yanında gelen teste bak.
        4. Uygulamayı `./mvnw spring-boot:run` ile başlat (Windows PowerShell'de: `.\mvnw spring-boot:run`). İlk çalıştırmada Maven ve kütüphaneler iner, birkaç dakika sürer.
        5. `Started LibraryApplication` satırını bekle. Tarayıcıda http://localhost:8080/actuator/health adresini aç: `{"groups":["liveness","readiness"],"status":"UP"}` görürsün. Uygulamayı Ctrl+C ile durdur.
        6. Aşağıdaki `Book.java` ve `BookController.java` dosyalarını `src/main/java/dev/igrek/library/` içine ekle. Uygulamayı yeniden çalıştır ve http://localhost:8080/api/books adresini aç.
        7. Projeyi Git'e koy: `git init`, `git add .`, `git commit -m "Create the library project"`. Üretilen `.gitignore` zaten `target/` klasörünü atlar.
    code:
      - file: terminal
        lang: sh
        text: |
          curl https://start.spring.io/starter.zip -o library.zip \
            -d type=maven-project -d language=java -d bootVersion=4.1.1 -d javaVersion=25 \
            -d groupId=dev.igrek -d artifactId=library -d name=library -d packageName=dev.igrek.library \
            -d dependencies=web,validation,data-jpa,h2,postgresql,actuator
          unzip library.zip -d library
          cd library
          ./mvnw spring-boot:run
      - file: src/main/java/dev/igrek/library/Book.java
        lang: java
        text: |
          package dev.igrek.library;

          public record Book(long id, String title, String author, int year) {
          }
      - file: src/main/java/dev/igrek/library/BookController.java
        lang: java
        text: |
          package dev.igrek.library;

          import java.util.List;

          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RequestMapping;
          import org.springframework.web.bind.annotation.RestController;

          @RestController
          @RequestMapping("/api/books")
          public class BookController {

              @GetMapping
              public List<Book> list() {
                  return List.of(new Book(1, "Dune", "Frank Herbert", 1965));
              }
          }
    mistakes:
      - problem:
          en: "\"Web server failed to start. Port 8080 was already in use.\""
          tr: "\"Web server failed to start. Port 8080 was already in use.\" hatası."
        fix:
          en: "Another program (or an older run of this app) uses port 8080. Stop it, or start this app on another port: `./mvnw spring-boot:run -Dspring-boot.run.arguments=--server.port=8081`."
          tr: "Başka bir program (ya da bu uygulamanın eski bir çalıştırması) 8080 portunu kullanıyor. Onu durdur ya da bu uygulamayı başka bir portta başlat: `./mvnw spring-boot:run -Dspring-boot.run.arguments=--server.port=8081`."
      - problem:
          en: "\"error: release version 25 not supported\" when building."
          tr: "Build sırasında \"error: release version 25 not supported\" hatası."
        fix:
          en: "The JDK that runs Maven is older than the Java version in `pom.xml`. Check `java -version` and `JAVA_HOME`, install JDK 25, or choose a lower Java version on start.spring.io (Spring Boot 4 needs at least 17)."
          tr: "Maven'ı çalıştıran JDK, `pom.xml`'deki Java sürümünden eski. `java -version` ve `JAVA_HOME`'a bak, JDK 25 kur ya da start.spring.io'da daha düşük bir Java sürümü seç (Spring Boot 4 en az 17 ister)."
      - problem:
          en: "The page at /api/books shows \"Whitelabel Error Page\" or 404."
          tr: "/api/books sayfası \"Whitelabel Error Page\" ya da 404 gösteriyor."
        fix:
          en: "The controller is not found. It must be in the same package as `LibraryApplication` (or below it), because Spring only scans that package. Also check that the file is saved and the app was restarted."
          tr: "Controller bulunamıyor. `LibraryApplication` ile aynı paketin (ya da altının) içinde olmalı, çünkü Spring sadece o paketi tarar. Dosyanın kayıtlı olduğuna ve uygulamanın yeniden başlatıldığına da bak."
    quiz:
      - q:
          en: "What does `@RestController` do?"
          tr: "`@RestController` ne yapar?"
        options:
          en: ["Starts the database", "Marks a class whose methods answer HTTP requests and return data as JSON", "Restarts the server"]
          tr: ["Veritabanını başlatır", "Metotları HTTP isteklerine cevap veren ve veriyi JSON olarak döndüren bir class'ı işaretler", "Sunucuyu yeniden başlatır"]
        answer: 1
        why:
          en: "Spring finds the class, routes matching requests to its methods and turns the returned objects into JSON."
          tr: "Spring class'ı bulur, uyan istekleri metotlarına yönlendirir ve döndürülen nesneleri JSON'a çevirir."
    sources:
