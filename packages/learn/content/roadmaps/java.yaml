  - id: rest-api
    stage: first-project
    title:
      en: "A REST API with validation"
      tr: "Doğrulamalı bir REST API"
    minutes: 70
    needs: [spring-project]
    why:
      en: "A real API lets clients create, read, change and delete data, rejects bad input with a clear message, and answers \"not found\" properly. You build all of that now with books kept in memory, so you can focus on HTTP before adding a database."
      tr: "Gerçek bir API, istemcilerin veri oluşturmasına, okumasına, değiştirmesine ve silmesine izin verir, kötü girdiyi açık bir mesajla reddeder ve \"bulunamadı\" cevabını doğru verir. Hepsini şimdi, kitaplar bellekte dururken yapıyorsun; böylece veritabanından önce HTTP'ye odaklanırsın."
    learn:
      en: |
        - HTTP methods and status codes: GET 200, POST 201 with a `Location` header, PUT 200, DELETE 204, bad input 400, missing 404
        - Controller to service: the controller handles HTTP, the service holds the logic
        - **Validation**: `@Valid` on the request body and annotations like `@NotBlank` on a record
        - One place that turns exceptions into JSON errors (`@RestControllerAdvice` and `ProblemDetail`)
      tr: |
        - HTTP metotları ve durum kodları: GET 200, `Location` başlıklı POST 201, PUT 200, DELETE 204, kötü girdi 400, bulunamadı 404
        - Controller'dan service'e: controller HTTP'yi yönetir, service mantığı tutar
        - **Validation** (doğrulama): istek gövdesinde `@Valid` ve bir record üzerinde `@NotBlank` gibi anotasyonlar
        - Exception'ları JSON hatalarına çeviren tek bir yer (`@RestControllerAdvice` ve `ProblemDetail`)
    do:
      en: |
        1. Replace `BookController.java` with the version below and add the other four files: `BookRequest.java` (the JSON a client sends, with validation rules), `BookNotFoundException.java`, `BookService.java` (the books live in a map for now) and `ApiExceptionHandler.java`.
        2. Run the app and try the `curl` commands below in a second terminal. On Windows use Git Bash or WSL (PowerShell treats the quotes differently, and `curl` there is an alias; `curl.exe` is the real one).
        3. Check each answer: the POST returns `201` and the new book, the invalid POST returns `400` with an `errors` field, an unknown id returns `404`.
        4. Stop and restart the app: the books are gone, because memory is not storage. That is the next problem to solve.
      tr: |
        1. `BookController.java` dosyasını aşağıdaki sürümle değiştir ve diğer dört dosyayı ekle: `BookRequest.java` (istemcinin gönderdiği JSON, doğrulama kurallarıyla), `BookNotFoundException.java`, `BookService.java` (kitaplar şimdilik bir map'te durur) ve `ApiExceptionHandler.java`.
        2. Uygulamayı çalıştır ve ikinci bir terminalde aşağıdaki `curl` komutlarını dene. Windows'ta Git Bash ya da WSL kullan (PowerShell tırnakları farklı işler ve oradaki `curl` bir alias; gerçeği `curl.exe`).
        3. Her cevabı kontrol et: POST `201` ve yeni kitabı döner, geçersiz POST `errors` alanıyla `400` döner, bilinmeyen id `404` döner.
        4. Uygulamayı durdur ve yeniden başlat: kitaplar gitti, çünkü bellek depolama değil. Çözülecek sıradaki sorun bu.
    code:
      - file: src/main/java/dev/igrek/library/BookRequest.java
        lang: java
        text: |
          package dev.igrek.library;

          import jakarta.validation.constraints.Max;
          import jakarta.validation.constraints.Min;
          import jakarta.validation.constraints.NotBlank;
          import jakarta.validation.constraints.Size;

          public record BookRequest(
                  @NotBlank @Size(max = 200) String title,
                  @NotBlank @Size(max = 100) String author,
                  @Min(1000) @Max(2100) int year) {
          }
      - file: src/main/java/dev/igrek/library/BookNotFoundException.java
        lang: java
        text: |
          package dev.igrek.library;

          public class BookNotFoundException extends RuntimeException {

              public BookNotFoundException(long id) {
                  super("No book with id " + id);
              }
          }
      - file: src/main/java/dev/igrek/library/BookService.java
        lang: java
        text: |
          package dev.igrek.library;

          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.atomic.AtomicLong;

          import org.springframework.stereotype.Service;

          // For now the books live in memory and disappear when the app stops.
          @Service
          public class BookService {

              private final Map<Long, Book> books = new ConcurrentHashMap<>();
              private final AtomicLong nextId = new AtomicLong(1);

              public List<Book> list(String author) {
                  return books.values().stream()
                          .filter(b -> author == null || b.author().equalsIgnoreCase(author))
                          .sorted((a, b) -> Long.compare(a.id(), b.id()))
                          .toList();
              }

              public Book get(long id) {
                  Book book = books.get(id);
                  if (book == null) {
                      throw new BookNotFoundException(id);
                  }
                  return book;
              }

              public Book create(BookRequest request) {
                  Book book = new Book(nextId.getAndIncrement(), request.title(), request.author(), request.year());
                  books.put(book.id(), book);
                  return book;
              }

              public Book update(long id, BookRequest request) {
                  get(id); // throws if it does not exist
                  Book book = new Book(id, request.title(), request.author(), request.year());
                  books.put(id, book);
                  return book;
              }

              public void delete(long id) {
                  if (books.remove(id) == null) {
                      throw new BookNotFoundException(id);
                  }
              }
          }
      - file: src/main/java/dev/igrek/library/ApiExceptionHandler.java
        lang: java
        text: |
          package dev.igrek.library;

          import java.util.LinkedHashMap;
          import java.util.Map;

          import org.springframework.http.HttpStatus;
          import org.springframework.http.ProblemDetail;
          import org.springframework.validation.FieldError;
          import org.springframework.web.bind.MethodArgumentNotValidException;
          import org.springframework.web.bind.annotation.ExceptionHandler;
          import org.springframework.web.bind.annotation.RestControllerAdvice;

          // Turns exceptions into clear JSON answers (RFC 9457 "problem details").
          @RestControllerAdvice
          public class ApiExceptionHandler {

              @ExceptionHandler(BookNotFoundException.class)
              public ProblemDetail notFound(BookNotFoundException e) {
                  return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage());
              }

              @ExceptionHandler(MethodArgumentNotValidException.class)
              public ProblemDetail invalid(MethodArgumentNotValidException e) {
                  Map<String, String> errors = new LinkedHashMap<>();
                  for (FieldError fe : e.getBindingResult().getFieldErrors()) {
                      errors.put(fe.getField(), fe.getDefaultMessage());
                  }
                  ProblemDetail problem = ProblemDetail.forStatusAndDetail(HttpStatus.BAD_REQUEST, "Validation failed");
                  problem.setProperty("errors", errors);
                  return problem;
              }
          }
      - file: src/main/java/dev/igrek/library/BookController.java
        lang: java
        text: |
          package dev.igrek.library;

          import java.net.URI;
          import java.util.List;

          import jakarta.validation.Valid;

          import org.springframework.http.ResponseEntity;
          import org.springframework.web.bind.annotation.DeleteMapping;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.PathVariable;
          import org.springframework.web.bind.annotation.PostMapping;
          import org.springframework.web.bind.annotation.PutMapping;
          import org.springframework.web.bind.annotation.RequestBody;
          import org.springframework.web.bind.annotation.RequestMapping;
          import org.springframework.web.bind.annotation.RequestParam;
          import org.springframework.web.bind.annotation.RestController;

          @RestController
          @RequestMapping("/api/books")
          public class BookController {

              private final BookService service;

              public BookController(BookService service) {
                  this.service = service;
              }

              @GetMapping
              public List<Book> list(@RequestParam(required = false) String author) {
                  return service.list(author);
              }

              @GetMapping("/{id}")
              public Book get(@PathVariable long id) {
                  return service.get(id);
              }

              @PostMapping
              public ResponseEntity<Book> create(@Valid @RequestBody BookRequest request) {
                  Book created = service.create(request);
                  return ResponseEntity.created(URI.create("/api/books/" + created.id())).body(created);
              }

              @PutMapping("/{id}")
              public Book update(@PathVariable long id, @Valid @RequestBody BookRequest request) {
                  return service.update(id, request);
              }

              @DeleteMapping("/{id}")
              public ResponseEntity<Void> delete(@PathVariable long id) {
                  service.delete(id);
                  return ResponseEntity.noContent().build();
              }
          }
