          curl -i -X POST localhost:8080/api/books -H 'Content-Type: application/json' \
            -d '{"title":"Dune","author":"Frank Herbert","year":1965}'
          # invalid input (400 with the list of problems)
          curl -i -X POST localhost:8080/api/books -H 'Content-Type: application/json' \
            -d '{"title":"","author":"X","year":5}'
          # list, search by author, one book, unknown book (404)
          curl localhost:8080/api/books
          curl "localhost:8080/api/books?author=frank%20herbert"
          curl localhost:8080/api/books/1
          curl -i localhost:8080/api/books/99
          # change and delete (204 No Content)
          curl -X PUT localhost:8080/api/books/1 -H 'Content-Type: application/json' \
            -d '{"title":"Dune Messiah","author":"Frank Herbert","year":1969}'
          curl -i -X DELETE localhost:8080/api/books/1
    mistakes:
      - problem:
          en: "Every POST answers 400 or 415, or the fields arrive empty."
          tr: "Her POST 400 ya da 415 dönüyor, ya da alanlar boş geliyor."
        fix:
          en: "The `Content-Type: application/json` header is missing or the JSON is broken (single quotes inside the JSON, missing quotes around keys). Copy the curl commands exactly."
          tr: "`Content-Type: application/json` başlığı eksik ya da JSON bozuk (JSON içinde tek tırnak, anahtarların etrafında tırnak yok). curl komutlarını aynen kopyala."
      - problem:
          en: "Validation does nothing: a blank title is accepted."
          tr: "Doğrulama hiçbir şey yapmıyor: boş başlık kabul ediliyor."
        fix:
          en: "The `@Valid` annotation is missing on the controller parameter, or the `validation` starter is not in `pom.xml`. Annotations on the record alone are only rules; `@Valid` makes Spring check them."
          tr: "Controller parametresinde `@Valid` eksik ya da `validation` starter'ı `pom.xml`'de yok. Sadece record üzerindeki anotasyonlar kuraldır; Spring'in kontrol etmesini `@Valid` sağlar."
      - problem:
          en: "Returning the same class you receive (for example saving a `Book` sent by the client)."
          tr: "Gelen class'ı aynen geri döndürmek (mesela istemcinin gönderdiği `Book`'u kaydetmek)."
        fix:
          en: "Use a separate request type (`BookRequest`). Then a client cannot choose the `id`, and the rules for input and output can change independently."
          tr: "Ayrı bir istek tipi kullan (`BookRequest`). Böylece istemci `id`'yi seçemez ve girdi ile çıktı kuralları birbirinden bağımsız değişebilir."
    quiz:
      - q:
          en: "Which status code should a successful POST that creates a book return?"
          tr: "Kitap oluşturan başarılı bir POST hangi durum kodunu döndürmeli?"
        options:
          en: ["200 OK", "201 Created", "204 No Content"]
          tr: ["200 OK", "201 Created", "204 No Content"]
        answer: 1
        why:
          en: "201 means a new resource was created; the `Location` header tells the client where it lives."
          tr: "201, yeni bir kaynağın oluşturulduğunu söyler; `Location` başlığı istemciye nerede durduğunu bildirir."
