  - id: jpa-h2
    stage: data-api
    title:
      en: "Store books in a database with Spring Data JPA"
      tr: "Kitapları Spring Data JPA ile veritabanında saklama"
    minutes: 60
    needs: [rest-api]
    why:
      en: "Data in memory disappears when the app stops. A database keeps it. Spring Data JPA lets you save and query rows by writing a small interface, and H2 is a database that runs inside your app, so you need to install nothing yet."
      tr: "Bellekteki veri uygulama durunca kaybolur. Veritabanı onu saklar. Spring Data JPA, küçük bir interface yazarak satır kaydetmeni ve sorgulamanı sağlar; H2 ise uygulamanın içinde çalışan bir veritabanı, yani henüz hiçbir şey kurman gerekmez."
    learn:
      en: |
        - An **entity** is a class mapped to a table; `@Id` marks the primary key
        - A **repository** interface gives you `save`, `findById`, `findAll`, `deleteById` with no code, and queries from method names like `findByAuthorIgnoreCaseOrderById`
        - `@Transactional`: the work in a method succeeds or fails as one unit; changes to a loaded entity are saved when it ends
        - Why a record cannot be an entity, and why a SQL word like `year` cannot be a column name
      tr: |
        - **Entity**, bir tabloya eşlenen class'tır; `@Id` birincil anahtarı işaretler
        - **Repository** interface'i, kod yazmadan `save`, `findById`, `findAll`, `deleteById` verir ve `findByAuthorIgnoreCaseOrderById` gibi metot adlarından sorgu üretir
        - `@Transactional`: bir metottaki iş tek parça olarak başarılı olur ya da başarısız olur; yüklenen bir entity'deki değişiklikler metot bitince kaydedilir
        - Record'un neden entity olamayacağı ve `year` gibi bir SQL kelimesinin neden kolon adı olamayacağı
    do:
      en: |
        1. Replace `Book.java` with the entity below (it is now a normal class, not a record). Add `BookRepository.java`.
        2. Replace `BookService.java` with the version below. It has the same methods as before, so the controller only needs one change: in `create`, write `created.getId()` instead of `created.id()`.
        3. Add the line `spring.jpa.show-sql=true` to `src/main/resources/application.properties` so the SQL that Hibernate runs is printed.
        4. Run the app and repeat the `curl` commands from the last step. Watch the terminal: every request prints its SQL.
        5. Notice that the app still forgets the books when you restart it. H2 here is an *in-memory* database: it is recreated empty every time. The next step fixes that with a real database.
      tr: |
        1. `Book.java` dosyasını aşağıdaki entity ile değiştir (artık record değil, normal bir class). `BookRepository.java` dosyasını ekle.
        2. `BookService.java` dosyasını aşağıdaki sürümle değiştir. Metotları öncekiyle aynı, bu yüzden controller'da sadece bir değişiklik gerekiyor: `create` içinde `created.id()` yerine `created.getId()` yaz.
        3. `src/main/resources/application.properties` dosyasına `spring.jpa.show-sql=true` satırını ekle; böylece Hibernate'in çalıştırdığı SQL yazdırılır.
        4. Uygulamayı çalıştır ve son adımdaki `curl` komutlarını tekrarla. Terminale bak: her istek kendi SQL'ini yazdırır.
        5. Uygulamanın yeniden başlatınca kitapları hâlâ unuttuğuna dikkat et. Buradaki H2 *bellekte çalışan* bir veritabanı: her seferinde boş olarak yeniden oluşturulur. Sıradaki adım bunu gerçek bir veritabanıyla çözer.
    code:
      - file: src/main/java/dev/igrek/library/Book.java
        lang: java
        text: |
          package dev.igrek.library;

          import jakarta.persistence.Column;
          import jakarta.persistence.Entity;
          import jakarta.persistence.GeneratedValue;
          import jakarta.persistence.GenerationType;
          import jakarta.persistence.Id;

          // An entity is a class JPA maps to a database table. (Records cannot be entities.)
          @Entity
          public class Book {

              @Id
              @GeneratedValue(strategy = GenerationType.IDENTITY)
              private Long id;

              @Column(nullable = false, length = 200)
              private String title;

              @Column(nullable = false, length = 100)
              private String author;

              // "year" is a reserved word in SQL databases, so the column gets another name
              @Column(name = "published_year", nullable = false)
              private int year;

              protected Book() {
                  // JPA needs an empty constructor
              }

              public Book(String title, String author, int year) {
                  this.title = title;
                  this.author = author;
                  this.year = year;
              }

              public Long getId() { return id; }
              public String getTitle() { return title; }
              public String getAuthor() { return author; }
              public int getYear() { return year; }

              public void change(String title, String author, int year) {
                  this.title = title;
                  this.author = author;
                  this.year = year;
              }
          }
      - file: src/main/java/dev/igrek/library/BookRepository.java
        lang: java
        text: |
          package dev.igrek.library;

          import java.util.List;

          import org.springframework.data.jpa.repository.JpaRepository;

          // No code needed: Spring Data builds the implementation, and even the query from the method name.
          public interface BookRepository extends JpaRepository<Book, Long> {

              List<Book> findByAuthorIgnoreCaseOrderById(String author);
          }
      - file: src/main/java/dev/igrek/library/BookService.java
        lang: java
        text: |
          package dev.igrek.library;

          import java.util.List;

          import org.springframework.data.domain.Sort;
          import org.springframework.stereotype.Service;
          import org.springframework.transaction.annotation.Transactional;

          @Service
          @Transactional
          public class BookService {

              private final BookRepository repository;

              public BookService(BookRepository repository) {
                  this.repository = repository;
              }

              @Transactional(readOnly = true)
              public List<Book> list(String author) {
                  if (author == null) {
                      return repository.findAll(Sort.by("id"));
                  }
                  return repository.findByAuthorIgnoreCaseOrderById(author);
              }

              @Transactional(readOnly = true)
              public Book get(long id) {
                  return repository.findById(id).orElseThrow(() -> new BookNotFoundException(id));
              }

              public Book create(BookRequest request) {
                  return repository.save(new Book(request.title(), request.author(), request.year()));
              }

              public Book update(long id, BookRequest request) {
                  Book book = get(id);
                  book.change(request.title(), request.author(), request.year());
                  return book; // saved automatically when the transaction ends
              }

              public void delete(long id) {
                  if (!repository.existsById(id)) {
                      throw new BookNotFoundException(id);
                  }
                  repository.deleteById(id);
              }
          }
      - file: src/main/resources/application.properties
        lang: properties
        text: |
          spring.application.name=library

          # Show the SQL that Hibernate runs, so you can see what happens (turn off later)
          spring.jpa.show-sql=true
    mistakes:
      - problem:
          en: "A \"Syntax error in SQL statement ... create table book (year integer ...\" appears at start-up and every request answers 500."
          tr: "Başlangıçta \"Syntax error in SQL statement ... create table book (year integer ...\" hatası çıkıyor ve her istek 500 dönüyor."
        fix:
          en: "`year` is a reserved word in SQL. Give the column another name, as the entity does with `@Column(name = \"published_year\")`. The Java field and the JSON can keep the name `year`."
          tr: "`year` SQL'de ayrılmış bir kelime. Kolona başka bir ad ver; entity bunu `@Column(name = \"published_year\")` ile yapıyor. Java alanı ve JSON `year` adını koruyabilir."
      - problem:
          en: "\"No default constructor for entity\" or \"Entity class ... must not be a record\"."
          tr: "\"No default constructor for entity\" ya da \"Entity class ... must not be a record\" hatası."
        fix:
          en: "JPA creates entities itself, so it needs a normal class with an empty constructor (it can be `protected`). Records cannot be entities."
          tr: "JPA entity'leri kendisi oluşturur, bu yüzden boş constructor'lı normal bir class ister (`protected` olabilir). Record'lar entity olamaz."
      - problem:
          en: "Changing a field in `update` and expecting nothing to be saved, or the reverse: the change does not reach the database."
          tr: "`update` içinde bir alanı değiştirip kaydedilmeyeceğini sanmak, ya da tersi: değişiklik veritabanına ulaşmıyor."
        fix:
          en: "Inside a `@Transactional` method a loaded entity is tracked, so changes are written when the method ends. Without `@Transactional` they are not. Keep `@Transactional` on the service class."
          tr: "`@Transactional` bir metodun içinde yüklenen entity takip edilir, değişiklikler metot bitince yazılır. `@Transactional` yoksa yazılmaz. `@Transactional`'ı service class'ında tut."
    quiz:
      - q:
          en: "You write `List<Book> findByAuthorIgnoreCaseOrderById(String author);` in the repository and no other code. What happens?"
          tr: "Repository'ye `List<Book> findByAuthorIgnoreCaseOrderById(String author);` yazıyorsun, başka kod yok. Ne olur?"
        options:
          en: ["Nothing, you must write the SQL", "Spring Data builds the query from the method name", "It only works with H2"]
          tr: ["Hiçbir şey, SQL'i yazman gerekir", "Spring Data sorguyu metot adından üretir", "Sadece H2 ile çalışır"]
        answer: 1
        why:
          en: "Spring Data reads the name (find by author, ignore case, order by id) and creates the query at start-up. It works with any supported database."
          tr: "Spring Data adı okur (author'a göre bul, büyük küçük harfi yoksay, id'ye göre sırala) ve sorguyu başlangıçta oluşturur. Desteklenen her veritabanıyla çalışır."
    sources:
      - title: Spring Boot, working with SQL databases
        url: https://docs.spring.io/spring-boot/reference/data/sql.html
      - title: Spring Data JPA, query methods
        url: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html

  - id: postgres
    stage: data-api
    title:
      en: "Switch to PostgreSQL with a profile"
      tr: "Bir profile ile PostgreSQL'e geçme"
    minutes: 45
    needs: [jpa-h2]
    why:
      en: "Real services use a database server that keeps data on disk and handles many users. PostgreSQL is the most common free one. A Spring **profile** lets the same code use H2 for quick local work and PostgreSQL when you ask for it, with the settings outside the code."
      tr: "Gerçek servisler, veriyi diskte tutan ve çok kullanıcıyı kaldıran bir veritabanı sunucusu kullanır. PostgreSQL en yaygın ücretsiz olanı. Spring **profile**'ı, aynı kodun hızlı yerel çalışma için H2'yi, istediğinde de PostgreSQL'i kullanmasını sağlar; ayarlar kodun dışında durur."
    learn:
      en: |
        - A **profile** is a named set of settings; `application-postgres.properties` is read only when the profile `postgres` is active
        - The JDBC URL `jdbc:postgresql://host:port/database`, and why secrets come from environment variables (`${NAME:default}`)
        - `ddl-auto=update` creates missing tables for you; real projects use migrations (the last step names the tool)
        - Running PostgreSQL in a Docker container so you install nothing on your computer
      tr: |
        - **Profile**, adı olan bir ayar kümesidir; `application-postgres.properties` sadece `postgres` profile'ı aktifken okunur
        - `jdbc:postgresql://host:port/database` biçimindeki JDBC URL'si ve sırların neden ortam değişkenlerinden geldiği (`${NAME:default}`)
        - `ddl-auto=update` eksik tabloları senin için oluşturur; gerçek projeler migration kullanır (son adım aracın adını verir)
        - Bilgisayarına hiçbir şey kurmamak için PostgreSQL'i bir Docker container'ında çalıştırmak
    do:
      en: |
        1. Install Docker (Docker Desktop, or Docker Engine on Linux) if you do not have it.
        2. Start PostgreSQL with the first command below. It creates a database named `library` with user and password `library`, which is fine for local learning only.
        3. Create `src/main/resources/application-postgres.properties` with the content below.
        4. Start the app with the `postgres` profile (second command) and create a book with `curl`.
        5. Stop the app and start it again: the book is still there, because PostgreSQL stored it. Look at the table with the `psql` command.
        6. Without the profile the app still uses H2, so tests and quick runs need no database server.
      tr: |
        1. Docker kurulu değilse kur (Docker Desktop ya da Linux'ta Docker Engine).
        2. Aşağıdaki ilk komutla PostgreSQL'i başlat. Kullanıcı adı ve şifresi `library` olan `library` adında bir veritabanı oluşturur; sadece yerel öğrenme için uygundur.
        3. Aşağıdaki içerikle `src/main/resources/application-postgres.properties` dosyasını oluştur.
        4. Uygulamayı `postgres` profile'ı ile başlat (ikinci komut) ve `curl` ile bir kitap oluştur.
        5. Uygulamayı durdurup yeniden başlat: kitap hâlâ orada, çünkü PostgreSQL sakladı. Tabloya `psql` komutuyla bak.
        6. Profile olmadan uygulama yine H2 kullanır; yani testler ve hızlı çalıştırmalar için veritabanı sunucusu gerekmez.
    code:
      - file: terminal
        lang: sh
        text: |
          docker run -d --name library-db \
            -e POSTGRES_USER=library -e POSTGRES_PASSWORD=library -e POSTGRES_DB=library \
            -p 5432:5432 postgres:18-alpine

          ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres

          docker exec library-db psql -U library -c "select * from book"
      - file: src/main/resources/application-postgres.properties
        lang: properties
        text: |
          # Used when the "postgres" profile is active: SPRING_PROFILES_ACTIVE=postgres
          spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/library}
          spring.datasource.username=${DATABASE_USER:library}
          spring.datasource.password=${DATABASE_PASSWORD:library}

          # update: create missing tables and columns at start-up (fine for learning;
          # real projects use migrations, see the last step)
          spring.jpa.hibernate.ddl-auto=update
    mistakes:
      - problem:
          en: "\"FATAL: password authentication failed for user library\", although the container is running."
          tr: "Container çalışıyor olduğu halde \"FATAL: password authentication failed for user library\" hatası."
        fix:
          en: "Often another PostgreSQL already listens on port 5432 on your computer and the app talks to that one. Stop it, or publish the container on another port (`-p 5433:5432`) and set `DATABASE_URL=jdbc:postgresql://localhost:5433/library`."
          tr: "Çoğu zaman bilgisayarında 5432 portunu başka bir PostgreSQL dinliyordur ve uygulama onunla konuşuyordur. Onu durdur ya da container'ı başka bir portta yayınla (`-p 5433:5432`) ve `DATABASE_URL=jdbc:postgresql://localhost:5433/library` ayarla."
      - problem:
          en: "\"Connection refused\" right after `docker run`."
          tr: "`docker run` sonrası hemen \"Connection refused\" hatası."
        fix:
          en: "The database needs a few seconds to start. Wait until `docker logs library-db` says it is ready to accept connections, then start the app."
          tr: "Veritabanının başlaması birkaç saniye sürer. `docker logs library-db` bağlantı kabul etmeye hazır diyene kadar bekle, sonra uygulamayı başlat."
      - problem:
          en: "Putting the real database password in `application.properties` and committing it."
          tr: "Gerçek veritabanı şifresini `application.properties` içine yazıp commit etmek."
        fix:
          en: "Keep passwords out of Git. Read them from environment variables (`${DATABASE_PASSWORD}`) and set them on the host. The `library` defaults above are only for the local container."
          tr: "Şifreleri Git'ten uzak tut. Onları ortam değişkenlerinden oku (`${DATABASE_PASSWORD}`) ve sunucuda ayarla. Yukarıdaki `library` varsayılanları sadece yerel container içindir."
    quiz:
      - q:
          en: "When is `application-postgres.properties` read?"
          tr: "`application-postgres.properties` ne zaman okunur?"
        options:
          en: ["Always", "Only when the postgres profile is active", "Only in tests"]
          tr: ["Her zaman", "Sadece postgres profile'ı aktifken", "Sadece testlerde"]
        answer: 1
        why:
          en: "Profile files are added on top of `application.properties` only for the active profiles."
          tr: "Profile dosyaları sadece aktif profile'lar için `application.properties`'in üstüne eklenir."
    sources:
      - title: Spring Boot, profiles
        url: https://docs.spring.io/spring-boot/reference/features/profiles.html
      - title: Spring Boot, externalized configuration
        url: https://docs.spring.io/spring-boot/reference/features/external-config.html
      - title: PostgreSQL image on Docker Hub
        url: https://hub.docker.com/_/postgres

  - id: tests
    stage: testing
    title:
      en: "Test the API with JUnit 5 and MockMvc"
      tr: "API'yi JUnit 5 ve MockMvc ile test etme"
    minutes: 60
    needs: [postgres]
    why:
      en: "Tests let you change the code without fear. Spring Boot can start the whole app, or only a slice of it (just the web layer, or just the database layer), so you can choose between a realistic test and a fast one."
      tr: "Testler, kodu korkmadan değiştirmeni sağlar. Spring Boot tüm uygulamayı ya da sadece bir dilimini (sadece web katmanı ya da sadece veritabanı katmanı) başlatabilir; böylece gerçekçi bir test ile hızlı bir test arasında seçim yaparsın."
    learn:
      en: |
        - A test is a method with `@Test` (JUnit 5); AssertJ's `assertThat(...)` reads like a sentence
        - `@SpringBootTest` starts the whole app; `MockMvc` sends requests to it without a real network
        - **Slices**: `@DataJpaTest` (database only, with H2) and `@WebMvcTest` (web only, with a mocked service via `@MockitoBean`)
        - How to read a failing test: expected value, actual value, line number
      tr: |
        - Test, `@Test` ile işaretli bir metottur (JUnit 5); AssertJ'in `assertThat(...)` ifadesi cümle gibi okunur
        - `@SpringBootTest` tüm uygulamayı başlatır; `MockMvc` gerçek ağ olmadan ona istek gönderir
        - **Slice**'lar: `@DataJpaTest` (sadece veritabanı, H2 ile) ve `@WebMvcTest` (sadece web, `@MockitoBean` ile taklit edilmiş service ile)
        - Başarısız bir test nasıl okunur: beklenen değer, gelen değer, satır numarası
    do:
      en: |
        1. Make sure no profile is active (`echo $SPRING_PROFILES_ACTIVE` should print nothing), so the tests use H2.
        2. Add the three test files below in `src/test/java/dev/igrek/library/`. Keep the `LibraryApplicationTests` file that start.spring.io created: it checks that the app starts.
        3. Run `./mvnw test`. You should see `Tests run: 6, Failures: 0`.
        4. Break something on purpose, for example change `.isCreated()` to `.isOk()`, and read the failure. Fix it again.
        5. Commit the tests with the code. From now on run `./mvnw test` before every commit.
      tr: |
        1. Hiçbir profile'ın aktif olmadığından emin ol (`echo $SPRING_PROFILES_ACTIVE` hiçbir şey yazmamalı); böylece testler H2 kullanır.
        2. Aşağıdaki üç test dosyasını `src/test/java/dev/igrek/library/` içine ekle. start.spring.io'nun oluşturduğu `LibraryApplicationTests` dosyasını tut: uygulamanın başladığını kontrol eder.
        3. `./mvnw test` çalıştır. `Tests run: 6, Failures: 0` görmelisin.
        4. Bilerek bir şeyi boz, mesela `.isCreated()` yerine `.isOk()` yaz, ve hatayı oku. Sonra düzelt.
        5. Testleri kodla birlikte commit'le. Bundan sonra her commit'ten önce `./mvnw test` çalıştır.
    code:
      - file: src/test/java/dev/igrek/library/BookRepositoryTest.java
        lang: java
        text: |
          package dev.igrek.library;

          import static org.assertj.core.api.Assertions.assertThat;

          import java.util.List;

          import org.junit.jupiter.api.Test;
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.boot.data.jpa.test.autoconfigure.DataJpaTest;

          // @DataJpaTest starts only the database part, with an in-memory H2 database.
          @DataJpaTest
          class BookRepositoryTest {

              @Autowired
              BookRepository repository;

              @Test
              void findsBooksByAuthorIgnoringCase() {
                  repository.save(new Book("Emma", "Jane Austen", 1815));
                  repository.save(new Book("Persuasion", "Jane Austen", 1817));
                  repository.save(new Book("Dune", "Frank Herbert", 1965));

                  List<Book> found = repository.findByAuthorIgnoreCaseOrderById("jane austen");

                  assertThat(found).extracting(Book::getTitle).containsExactly("Emma", "Persuasion");
              }
          }
      - file: src/test/java/dev/igrek/library/BookControllerTest.java
        lang: java
        text: |
          package dev.igrek.library;

          import static org.hamcrest.Matchers.containsString;
          import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.get;
          import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.post;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.header;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.jsonPath;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.status;

          import org.junit.jupiter.api.Test;
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.boot.test.context.SpringBootTest;
          import org.springframework.boot.webmvc.test.autoconfigure.AutoConfigureMockMvc;
          import org.springframework.http.MediaType;
          import org.springframework.test.web.servlet.MockMvc;

          // The whole application starts; MockMvc sends requests to it without a real network.
          @SpringBootTest
          @AutoConfigureMockMvc
          class BookControllerTest {

              static final String DUNE = """
                      {"title": "Dune", "author": "Frank Herbert", "year": 1965}
                      """;

              @Autowired
              MockMvc mvc;

              @Test
              void createsAndReadsABook() throws Exception {
                  mvc.perform(post("/api/books").contentType(MediaType.APPLICATION_JSON).content(DUNE))
                          .andExpect(status().isCreated())
                          .andExpect(header().string("Location", containsString("/api/books/")))
                          .andExpect(jsonPath("$.title").value("Dune"));

                  mvc.perform(get("/api/books").param("author", "frank herbert"))
                          .andExpect(status().isOk())
                          .andExpect(jsonPath("$[0].title").value("Dune"));
              }

              @Test
              void rejectsABookWithoutTitle() throws Exception {
                  mvc.perform(post("/api/books")
                                  .contentType(MediaType.APPLICATION_JSON)
                                  .content("""
                                          {"title": "", "author": "Someone", "year": 2000}
                                          """))
                          .andExpect(status().isBadRequest())
                          .andExpect(jsonPath("$.errors.title").exists());
              }

              @Test
              void returns404ForAnUnknownBook() throws Exception {
                  mvc.perform(get("/api/books/99999"))
                          .andExpect(status().isNotFound())
                          .andExpect(jsonPath("$.detail").value("No book with id 99999"));
              }
          }
      - file: src/test/java/dev/igrek/library/BookControllerWebTest.java
        lang: java
        text: |
          package dev.igrek.library;

          import static org.mockito.BDDMockito.given;
          import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.get;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.jsonPath;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.status;

          import java.util.List;

          import org.junit.jupiter.api.Test;
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.boot.webmvc.test.autoconfigure.WebMvcTest;
          import org.springframework.test.context.bean.override.mockito.MockitoBean;
          import org.springframework.test.web.servlet.MockMvc;

          // @WebMvcTest starts only the web layer; the service is replaced by a mock.
          @WebMvcTest(BookController.class)
          class BookControllerWebTest {

              @Autowired
              MockMvc mvc;

              @MockitoBean
              BookService service;

              @Test
              void listsBooksFromTheService() throws Exception {
                  given(service.list(null)).willReturn(List.of(new Book("Emma", "Jane Austen", 1815)));

                  mvc.perform(get("/api/books"))
                          .andExpect(status().isOk())
                          .andExpect(jsonPath("$[0].author").value("Jane Austen"));
              }
          }
      - file: terminal
        lang: sh
        text: |
          ./mvnw test
    mistakes:
      - problem:
          en: "Following an older tutorial: \"package org.springframework.boot.test.autoconfigure.web.servlet does not exist\"."
          tr: "Eski bir eğitimi izlerken: \"package org.springframework.boot.test.autoconfigure.web.servlet does not exist\" hatası."
        fix:
          en: "Spring Boot 4 split its test support into modules and moved the packages. Use `org.springframework.boot.webmvc.test.autoconfigure` for `@WebMvcTest` and `@AutoConfigureMockMvc`, `org.springframework.boot.data.jpa.test.autoconfigure` for `@DataJpaTest`, and `org.springframework.test.context.bean.override.mockito.MockitoBean` (`@MockBean` is gone)."
          tr: "Spring Boot 4 test desteğini modüllere böldü ve paketleri taşıdı. `@WebMvcTest` ve `@AutoConfigureMockMvc` için `org.springframework.boot.webmvc.test.autoconfigure`, `@DataJpaTest` için `org.springframework.boot.data.jpa.test.autoconfigure`, `org.springframework.test.context.bean.override.mockito.MockitoBean` kullan (`@MockBean` kalktı)."
      - problem:
          en: "A test passes alone but fails with the others, because it assumes an empty database."
          tr: "Bir test tek başına geçiyor ama diğerleriyle birlikte başarısız oluyor, çünkü veritabanının boş olduğunu varsayıyor."
        fix:
          en: "`@SpringBootTest` tests share one application and one database. Create the data a test needs inside the test and make assertions that other tests cannot break (look up your own book, do not count all rows). `@DataJpaTest` rolls back after each test."
          tr: "`@SpringBootTest` testleri tek bir uygulamayı ve tek bir veritabanını paylaşır. Bir testin ihtiyacı olan veriyi testin içinde oluştur ve diğer testlerin bozamayacağı kontroller yaz (kendi kitabını ara, tüm satırları sayma). `@DataJpaTest` her testten sonra geri alır."
      - problem:
          en: "The tests suddenly talk to your real PostgreSQL."
          tr: "Testler birden gerçek PostgreSQL'ine bağlanıyor."
        fix:
          en: "The environment variable `SPRING_PROFILES_ACTIVE=postgres` is set in your terminal. Unset it (`unset SPRING_PROFILES_ACTIVE`) before running tests."
          tr: "Terminalinde `SPRING_PROFILES_ACTIVE=postgres` ortam değişkeni ayarlı. Test çalıştırmadan önce kaldır (`unset SPRING_PROFILES_ACTIVE`)."
    quiz:
      - q:
          en: "What does `@MockitoBean BookService service` do in a `@WebMvcTest`?"
          tr: "Bir `@WebMvcTest` içinde `@MockitoBean BookService service` ne yapar?"
        options:
          en: ["Connects to the real database", "Replaces the real service with a fake you can program", "Runs the service twice"]
          tr: ["Gerçek veritabanına bağlanır", "Gerçek service'i programlayabildiğin sahte bir service ile değiştirir", "Service'i iki kez çalıştırır"]
        answer: 1
        why:
          en: "The web slice does not create services. The mock stands in, so the test checks only the controller: routes, JSON and status codes."
          tr: "Web slice'ı service oluşturmaz. Mock onun yerine geçer; böylece test sadece controller'ı kontrol eder: route'lar, JSON ve durum kodları."
    sources:
      - title: Spring Boot, testing Spring Boot applications
        url: https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html
      - title: Spring Framework, MockMvc
        url: https://docs.spring.io/spring-framework/reference/testing/mockmvc.html
      - title: JUnit 5 user guide
        url: https://docs.junit.org/current/user-guide/

  - id: security
    stage: security
    title:
      en: "Protect changes with Spring Security"
      tr: "Spring Security ile değişiklikleri koruma"
    minutes: 60
    needs: [tests]
    why:
      en: "Right now anyone on the internet can delete your books. Spring Security checks who is calling. In this step everybody may read, but only a logged-in user may add, change or delete."
      tr: "Şu anda internetteki herkes kitaplarını silebilir. Spring Security kimin çağırdığını kontrol eder. Bu adımda herkes okuyabilir ama sadece giriş yapmış kullanıcı ekleyebilir, değiştirebilir ya da silebilir."
    learn:
      en: |
        - **Authentication** (who are you?) and **authorization** (what may you do?)
        - HTTP Basic: the client sends the user name and password with each request (only safe over HTTPS)
        - `401 Unauthorized` means "not logged in", `403 Forbidden` means "logged in but not allowed"
        - Why a stateless API with no cookies can turn CSRF protection off, and why the password comes from an environment variable
      tr: |
        - **Authentication** (kimsin?) ve **authorization** (ne yapabilirsin?)
        - HTTP Basic: istemci kullanıcı adını ve şifreyi her istekte gönderir (sadece HTTPS üzerinde güvenli)
        - `401 Unauthorized` "giriş yapılmamış", `403 Forbidden` "giriş yapılmış ama izin yok" demektir
        - Cookie kullanmayan, durumsuz bir API'nin neden CSRF korumasını kapatabileceği ve şifrenin neden bir ortam değişkeninden geldiği
    do:
      en: |
        1. Add the two dependencies below to `pom.xml`, inside `<dependencies>`: the security starter and its test support.
        2. Create `SecurityConfig.java`. It says: health checks and all GET requests are public, everything else needs a login, and the login method is HTTP Basic.
        3. Add the user lines to `application.properties`. The default password is for local work only; the deployed app will get a real one from the environment variable `LIBRARY_PASSWORD`.
        4. Update the two web tests as shown: add `@WithMockUser` to the tests that create data, add a test that an anonymous POST gets 401, and `@Import(SecurityConfig.class)` on the web slice test.
        5. Run `./mvnw test` (now 7 tests), then start the app and try the `curl` commands. Check: anonymous POST gives 401, a wrong password gives 401, the right one gives 201, GET stays public.
      tr: |
        1. Aşağıdaki iki bağımlılığı `pom.xml`'e, `<dependencies>` içine ekle: security starter'ı ve test desteği.
        2. `SecurityConfig.java` dosyasını oluştur. Şunu söylüyor: sağlık kontrolleri ve tüm GET istekleri herkese açık, geri kalan her şey giriş ister, giriş yöntemi HTTP Basic.
        3. Kullanıcı satırlarını `application.properties`'e ekle. Varsayılan şifre sadece yerel çalışma için; yayındaki uygulama gerçek şifreyi `LIBRARY_PASSWORD` ortam değişkeninden alacak.
        4. İki web testini gösterildiği gibi güncelle: veri oluşturan testlere `@WithMockUser` ekle, anonim bir POST'un 401 aldığını kontrol eden bir test ekle ve web slice testine `@Import(SecurityConfig.class)` ekle.
        5. `./mvnw test` çalıştır (artık 7 test), sonra uygulamayı başlat ve `curl` komutlarını dene. Kontrol et: anonim POST 401 verir, yanlış şifre 401 verir, doğrusu 201 verir, GET herkese açık kalır.
    code:
      - file: pom.xml
        lang: xml
        text: |
          <dependency>
              <groupId>org.springframework.boot</groupId>
              <artifactId>spring-boot-starter-security</artifactId>
          </dependency>
          <dependency>
              <groupId>org.springframework.boot</groupId>
              <artifactId>spring-boot-starter-security-test</artifactId>
              <scope>test</scope>
          </dependency>
      - file: src/main/java/dev/igrek/library/SecurityConfig.java
        lang: java
        text: |
          package dev.igrek.library;

          import static org.springframework.security.config.Customizer.withDefaults;

          import org.springframework.context.annotation.Bean;
          import org.springframework.context.annotation.Configuration;
          import org.springframework.http.HttpMethod;
          import org.springframework.security.config.annotation.web.builders.HttpSecurity;
          import org.springframework.security.config.annotation.web.configurers.AbstractHttpConfigurer;
          import org.springframework.security.web.SecurityFilterChain;

          @Configuration
          public class SecurityConfig {

              @Bean
              SecurityFilterChain api(HttpSecurity http) {
                  http
                      .authorizeHttpRequests(auth -> auth
                          .requestMatchers("/actuator/health/**").permitAll()
                          .requestMatchers(HttpMethod.GET, "/api/**").permitAll()
                          .anyRequest().authenticated())
                      .httpBasic(withDefaults())
                      // CSRF protects browser sessions with cookies; this API has none
                      .csrf(AbstractHttpConfigurer::disable);
                  return http.build();
              }
          }
      - file: src/main/resources/application.properties
        lang: properties
        text: |
          # add to the end:

          # The one user who may change data. Override the password with LIBRARY_PASSWORD.
          spring.security.user.name=admin
          spring.security.user.password=${LIBRARY_PASSWORD:dev-only-password}
      - file: src/test/java/dev/igrek/library/BookControllerTest.java
        lang: java
        text: |
          package dev.igrek.library;

          import static org.hamcrest.Matchers.containsString;
          import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.get;
          import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.post;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.header;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.jsonPath;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.status;

          import org.junit.jupiter.api.Test;
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.boot.test.context.SpringBootTest;
          import org.springframework.boot.webmvc.test.autoconfigure.AutoConfigureMockMvc;
          import org.springframework.http.MediaType;
          import org.springframework.security.test.context.support.WithMockUser;
          import org.springframework.test.web.servlet.MockMvc;

          // The whole application starts; MockMvc sends requests to it without a real network.
          @SpringBootTest
          @AutoConfigureMockMvc
          class BookControllerTest {

              static final String DUNE = """
                      {"title": "Dune", "author": "Frank Herbert", "year": 1965}
                      """;

              @Autowired
              MockMvc mvc;

              @Test
              @WithMockUser
              void createsAndReadsABook() throws Exception {
                  mvc.perform(post("/api/books").contentType(MediaType.APPLICATION_JSON).content(DUNE))
                          .andExpect(status().isCreated())
                          .andExpect(header().string("Location", containsString("/api/books/")))
                          .andExpect(jsonPath("$.title").value("Dune"));

                  mvc.perform(get("/api/books").param("author", "frank herbert"))
                          .andExpect(status().isOk())
                          .andExpect(jsonPath("$[0].title").value("Dune"));
              }

              @Test
              @WithMockUser
              void rejectsABookWithoutTitle() throws Exception {
                  mvc.perform(post("/api/books")
                                  .contentType(MediaType.APPLICATION_JSON)
                                  .content("""
                                          {"title": "", "author": "Someone", "year": 2000}
                                          """))
                          .andExpect(status().isBadRequest())
                          .andExpect(jsonPath("$.errors.title").exists());
              }

              @Test
              void returns404ForAnUnknownBook() throws Exception {
                  mvc.perform(get("/api/books/99999"))
                          .andExpect(status().isNotFound())
                          .andExpect(jsonPath("$.detail").value("No book with id 99999"));
              }

              @Test
              void anonymousUsersCannotCreateBooks() throws Exception {
                  mvc.perform(post("/api/books").contentType(MediaType.APPLICATION_JSON).content(DUNE))
                          .andExpect(status().isUnauthorized());
              }
          }
      - file: src/test/java/dev/igrek/library/BookControllerWebTest.java
        lang: java
        text: |
          package dev.igrek.library;

          import static org.mockito.BDDMockito.given;
          import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.get;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.jsonPath;
          import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.status;

          import java.util.List;

          import org.junit.jupiter.api.Test;
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.boot.webmvc.test.autoconfigure.WebMvcTest;
          import org.springframework.context.annotation.Import;
          import org.springframework.test.context.bean.override.mockito.MockitoBean;
          import org.springframework.test.web.servlet.MockMvc;

          // @WebMvcTest starts only the web layer; the service is replaced by a mock.
          @WebMvcTest(BookController.class)
          @Import(SecurityConfig.class)
          class BookControllerWebTest {

              @Autowired
              MockMvc mvc;

              @MockitoBean
              BookService service;

              @Test
              void listsBooksFromTheService() throws Exception {
                  given(service.list(null)).willReturn(List.of(new Book("Emma", "Jane Austen", 1815)));

                  mvc.perform(get("/api/books"))
                          .andExpect(status().isOk())
                          .andExpect(jsonPath("$[0].author").value("Jane Austen"));
              }
          }
      - file: terminal
        lang: sh
        text: |
          ./mvnw test
          ./mvnw spring-boot:run

          # in a second terminal
          curl -i -X POST localhost:8080/api/books -H 'Content-Type: application/json' \
            -d '{"title":"Dune","author":"Frank Herbert","year":1965}'
          curl -i -u admin:dev-only-password -X POST localhost:8080/api/books \
            -H 'Content-Type: application/json' \
            -d '{"title":"Dune","author":"Frank Herbert","year":1965}'
          curl localhost:8080/api/books
    mistakes:
      - problem:
          en: "The `@WebMvcTest` now fails with 401, although `SecurityConfig` allows GET."
          tr: "`SecurityConfig` GET'e izin vermesine rağmen `@WebMvcTest` artık 401 ile başarısız oluyor."
        fix:
          en: "A web slice test does not load your own `@Configuration` classes, so Spring's default (everything locked) applies. Add `@Import(SecurityConfig.class)` to the test."
          tr: "Web slice testi kendi `@Configuration` class'larını yüklemez, bu yüzden Spring'in varsayılanı (her şey kilitli) geçerli olur. Teste `@Import(SecurityConfig.class)` ekle."
      - problem:
          en: "A POST with the right password still gets 403 Forbidden."
          tr: "Doğru şifreyle yapılan POST yine de 403 Forbidden alıyor."
        fix:
          en: "CSRF protection is on and wants a token. It protects browser sessions that use cookies. This API has no cookies (Basic auth is sent each time), so the config turns it off. Do not turn it off for an app with cookie logins."
          tr: "CSRF koruması açık ve bir token istiyor. Cookie kullanan tarayıcı oturumlarını korur. Bu API'de cookie yok (Basic auth her seferinde gönderilir), bu yüzden config onu kapatıyor. Cookie ile giriş yapan bir uygulamada kapatma."
      - problem:
          en: "Leaving the default password `dev-only-password` on the deployed app."
          tr: "Yayındaki uygulamada varsayılan `dev-only-password` şifresini bırakmak."
        fix:
          en: "Always set `LIBRARY_PASSWORD` on the host (a long random value) and never commit real passwords. The next steps pass it to the jar, the container and the host."
          tr: "Sunucuda her zaman `LIBRARY_PASSWORD` ayarla (uzun, rastgele bir değer) ve gerçek şifreleri asla commit'leme. Sonraki adımlar onu jar'a, container'a ve sunucuya iletir."
    quiz:
      - q:
          en: "A user sends the right password but is not allowed to do the action. Which status code is correct?"
          tr: "Bir kullanıcı doğru şifreyi gönderiyor ama o işlemi yapmasına izin yok. Doğru durum kodu hangisi?"
        options:
          en: ["401 Unauthorized", "403 Forbidden", "404 Not Found"]
          tr: ["401 Unauthorized", "403 Forbidden", "404 Not Found"]
        answer: 1
        why:
          en: "401 is for missing or wrong credentials. 403 means the server knows who you are and still refuses."
          tr: "401 eksik ya da yanlış kimlik bilgisi içindir. 403, sunucunun kim olduğunu bildiği halde yine de reddettiği anlamına gelir."
    sources:
      - title: Spring Boot, Spring Security
        url: https://docs.spring.io/spring-boot/reference/web/spring-security.html
      - title: Spring Security, authorize HTTP requests
        url: https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html
      - title: Spring Security, HTTP Basic authentication
        url: https://docs.spring.io/spring-security/reference/servlet/authentication/passwords/basic.html

  - id: caching-threads
    stage: performance
    title:
      en: "Cache reads and use virtual threads"
      tr: "Okumaları cache'leme ve virtual thread kullanma"
    minutes: 55
    needs: [security]
    why:
      en: "Reading the same book again and again should not hit the database every time, and a web server should not waste a whole operating system thread on every waiting request. A cache and virtual threads fix both with a few lines."
      tr: "Aynı kitabı tekrar tekrar okumak her seferinde veritabanına gitmemeli ve bir web sunucusu bekleyen her istek için koca bir işletim sistemi thread'i harcamamalı. Bir cache ve virtual thread'ler ikisini de birkaç satırla çözer."
    learn:
      en: |
        - A **cache** keeps the result of a call: `@Cacheable` stores it, `@CachePut` refreshes it, `@CacheEvict` removes it
        - The price of caching: stale data. A size limit and an expiry time (`expireAfterWrite`) keep it bounded
        - **Virtual threads** (Java 21+) are very cheap threads. With `spring.threads.virtual.enabled=true` each request gets one, which helps code that mostly waits for the database or the network
        - Virtual threads do not make calculations faster; measure before and after you tune anything
      tr: |
        - **Cache**, bir çağrının sonucunu saklar: `@Cacheable` saklar, `@CachePut` yeniler, `@CacheEvict` siler
        - Cache'in bedeli: eski veri. Boyut sınırı ve süre sınırı (`expireAfterWrite`) bunu sınırlar
        - **Virtual thread**'ler (Java 21+) çok ucuz thread'lerdir. `spring.threads.virtual.enabled=true` ile her isteğe biri verilir; çoğunlukla veritabanını ya da ağı bekleyen koda yardım eder
        - Virtual thread'ler hesaplamaları hızlandırmaz; bir şeyi ayarlamadan önce ve sonra ölç
    do:
      en: |
        1. Add the two dependencies below to `pom.xml`: the cache starter and Caffeine, a fast cache library (its version is managed by Spring Boot).
        2. Create `CacheConfig.java` and replace `BookService.java` with the version below: `get` is cached, `update` refreshes the cache entry, `delete` removes it.
        3. Add the cache and virtual thread settings to `application.properties`.
        4. Add `BookCacheTest.java`. It reads the same book twice and checks (with a Mockito spy) that the repository was asked only once.
        5. Run `./mvnw test` (now 8 tests).
        6. Optional check: temporarily add `System.out.println(Thread.currentThread());` to `BookService.create`, start the app, create a book and look for `VirtualThread[...]` in the terminal. Remove the line again.
      tr: |
        1. Aşağıdaki iki bağımlılığı `pom.xml`'e ekle: cache starter'ı ve hızlı bir cache kütüphanesi olan Caffeine (sürümünü Spring Boot yönetir).
        2. `CacheConfig.java` dosyasını oluştur ve `BookService.java` dosyasını aşağıdaki sürümle değiştir: `get` cache'lenir, `update` cache kaydını yeniler, `delete` siler.
        3. Cache ve virtual thread ayarlarını `application.properties`'e ekle.
        4. `BookCacheTest.java` dosyasını ekle. Aynı kitabı iki kez okur ve (bir Mockito spy ile) repository'nin sadece bir kez sorulduğunu kontrol eder.
        5. `./mvnw test` çalıştır (artık 8 test).
        6. İsteğe bağlı kontrol: `BookService.create` içine geçici olarak `System.out.println(Thread.currentThread());` ekle, uygulamayı başlat, bir kitap oluştur ve terminalde `VirtualThread[...]` ara. Satırı tekrar sil.
    code:
      - file: pom.xml
        lang: xml
        text: |
          <dependency>
              <groupId>org.springframework.boot</groupId>
              <artifactId>spring-boot-starter-cache</artifactId>
          </dependency>
          <dependency>
              <groupId>com.github.ben-manes.caffeine</groupId>
              <artifactId>caffeine</artifactId>
          </dependency>
      - file: src/main/java/dev/igrek/library/CacheConfig.java
        lang: java
        text: |
          package dev.igrek.library;

          import org.springframework.cache.annotation.EnableCaching;
          import org.springframework.context.annotation.Configuration;

          // Kept out of LibraryApplication so that slice tests (@WebMvcTest, @DataJpaTest) do not need a cache.
          @Configuration
          @EnableCaching
          public class CacheConfig {
          }
      - file: src/main/java/dev/igrek/library/BookService.java
        lang: java
        text: |
          package dev.igrek.library;

          import java.util.List;

          import org.springframework.cache.annotation.CacheEvict;
          import org.springframework.cache.annotation.CachePut;
          import org.springframework.cache.annotation.Cacheable;
          import org.springframework.data.domain.Sort;
          import org.springframework.stereotype.Service;
          import org.springframework.transaction.annotation.Transactional;

          @Service
          @Transactional
          public class BookService {

              private final BookRepository repository;

              public BookService(BookRepository repository) {
                  this.repository = repository;
              }

              @Transactional(readOnly = true)
              public List<Book> list(String author) {
                  if (author == null) {
                      return repository.findAll(Sort.by("id"));
                  }
                  return repository.findByAuthorIgnoreCaseOrderById(author);
              }

              @Cacheable(value = "books", key = "#id")
              @Transactional(readOnly = true)
              public Book get(long id) {
                  return repository.findById(id).orElseThrow(() -> new BookNotFoundException(id));
              }

              public Book create(BookRequest request) {
                  return repository.save(new Book(request.title(), request.author(), request.year()));
              }

              @CachePut(value = "books", key = "#id")
              public Book update(long id, BookRequest request) {
                  Book book = get(id);
                  book.change(request.title(), request.author(), request.year());
                  return book; // saved automatically when the transaction ends
              }

              @CacheEvict(value = "books", key = "#id")
              public void delete(long id) {
                  if (!repository.existsById(id)) {
                      throw new BookNotFoundException(id);
                  }
                  repository.deleteById(id);
              }
          }
      - file: src/main/resources/application.properties
        lang: properties
        text: |
          # add to the end:

          # Keep at most 500 books in the cache, each for 10 minutes
          spring.cache.cache-names=books
          spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

          # Run each request on a cheap virtual thread (needs Java 21 or newer)
          spring.threads.virtual.enabled=true
      - file: src/test/java/dev/igrek/library/BookCacheTest.java
        lang: java
        text: |
          package dev.igrek.library;

          import static org.mockito.Mockito.times;
          import static org.mockito.Mockito.verify;

          import org.junit.jupiter.api.Test;
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.boot.test.context.SpringBootTest;
          import org.springframework.test.context.bean.override.mockito.MockitoSpyBean;

          @SpringBootTest
          class BookCacheTest {

              @Autowired
              BookService service;

              @MockitoSpyBean
              BookRepository repository;

              @Test
              void secondReadComesFromTheCache() {
                  Book saved = service.create(new BookRequest("Emma", "Jane Austen", 1815));

                  service.get(saved.getId());
                  service.get(saved.getId());

                  verify(repository, times(1)).findById(saved.getId());
              }
          }
    mistakes:
      - problem:
          en: "After adding `@EnableCaching` to `LibraryApplication`, `@WebMvcTest` and `@DataJpaTest` fail to start."
          tr: "`LibraryApplication`'a `@EnableCaching` ekleyince `@WebMvcTest` ve `@DataJpaTest` başlamıyor."
        fix:
          en: "Annotations on the main class also apply to slice tests, which have no cache setup. Put `@EnableCaching` in its own `@Configuration` class (`CacheConfig`), which slices do not load."
          tr: "Ana class üzerindeki anotasyonlar, cache ayarı olmayan slice testlere de uygulanır. `@EnableCaching`'i kendi `@Configuration` class'ına (`CacheConfig`) koy; slice'lar onu yüklemez."
      - problem:
          en: "A cached method is called from another method of the same class and the cache is ignored."
          tr: "Cache'li bir metot aynı class'taki başka bir metottan çağrılıyor ve cache yok sayılıyor."
        fix:
          en: "Spring adds caching through a proxy around the bean, and a call from inside the class skips the proxy. Call the cached method from another bean (like the controller does)."
          tr: "Spring cache'i bean'in etrafındaki bir proxy ile ekler ve class içinden yapılan çağrı proxy'yi atlar. Cache'li metodu başka bir bean'den çağır (controller'ın yaptığı gibi)."
      - problem:
          en: "Old data is returned after someone edited the table directly in the database."
          tr: "Biri tabloyu doğrudan veritabanında düzenledikten sonra eski veri dönüyor."
        fix:
          en: "The cache cannot see changes made outside the app. That is why the entries expire after 10 minutes. Cache only data that may be a little old, and keep the time short for data that changes often."
          tr: "Cache, uygulamanın dışında yapılan değişiklikleri göremez. Kayıtların 10 dakika sonra silinmesinin sebebi bu. Sadece biraz eski olabilecek veriyi cache'le ve sık değişen veri için süreyi kısa tut."
    quiz:
      - q:
          en: "When do virtual threads help most?"
          tr: "Virtual thread'ler en çok ne zaman yardım eder?"
        options:
          en: ["When the code does heavy calculations", "When many requests mostly wait for a database or network", "When the app has only one user"]
          tr: ["Kod ağır hesaplamalar yaparken", "Çok sayıda istek çoğunlukla bir veritabanını ya da ağı beklerken", "Uygulamanın tek kullanıcısı varken"]
        answer: 1
        why:
          en: "A waiting virtual thread costs almost nothing, so thousands of waiting requests fit. Calculations still need real CPU time."
          tr: "Bekleyen bir virtual thread neredeyse hiçbir şeye mal olmaz, bu yüzden binlerce bekleyen istek sığar. Hesaplamalar yine gerçek CPU zamanı ister."
    sources:
      - title: Spring Boot, caching
        url: https://docs.spring.io/spring-boot/reference/io/caching.html
      - title: Spring Framework, cache annotations
        url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      - title: Java, virtual threads
        url: https://docs.oracle.com/en/java/javase/25/core/virtual-threads.html

  - id: jar
    stage: packaging
    title:
      en: "Build an executable jar"
      tr: "Çalıştırılabilir bir jar üretme"
    minutes: 25
    needs: [caching-threads]
    why:
      en: "A server does not need Maven or your source code. It needs one file it can run. Spring Boot packages your code, its libraries and the web server into a single jar that starts with `java -jar`."
      tr: "Bir sunucunun Maven'a ya da kaynak koduna ihtiyacı yok. Çalıştırabileceği tek bir dosyaya ihtiyacı var. Spring Boot kodunu, kütüphanelerini ve web sunucusunu `java -jar` ile başlayan tek bir jar'a paketler."
    learn:
      en: |
        - What `./mvnw package` does: compiles, runs the tests, builds `target/library-0.0.1-SNAPSHOT.jar`
        - A jar is a zip file; Spring Boot's "fat jar" also contains all libraries (about 60 MB here)
        - Settings from the outside: environment variables such as `LIBRARY_PASSWORD` and `PORT` override `application.properties`
      tr: |
        - `./mvnw package` ne yapar: derler, testleri çalıştırır, `target/library-0.0.1-SNAPSHOT.jar` dosyasını üretir
        - Jar bir zip dosyasıdır; Spring Boot'un "fat jar"ı tüm kütüphaneleri de içerir (burada yaklaşık 60 MB)
        - Dışarıdan ayar: `LIBRARY_PASSWORD` ve `PORT` gibi ortam değişkenleri `application.properties`'i geçersiz kılar
    do:
      en: |
        1. Hosting services tell your app which port to use through the `PORT` environment variable. Add the first line below to the top of `application.properties` (after the application name); without `PORT` it stays 8080.
        2. Run `./mvnw package`. When it prints `BUILD SUCCESS`, look at the `target` folder.
        3. Run the jar with a password from the environment (Linux and macOS first, PowerShell second). Stop any other run of the app first.
        4. Test it with `curl`: reading works without a password, creating needs `-u admin:s3cret`.
        5. Stop it with Ctrl+C. To skip the tests when you are in a hurry, use `./mvnw package -DskipTests`; do not make this a habit.
      tr: |
        1. Barındırma servisleri uygulamana hangi portu kullanacağını `PORT` ortam değişkeniyle söyler. Aşağıdaki ilk satırı `application.properties` dosyasının başına (uygulama adından sonra) ekle; `PORT` yoksa 8080 kalır.
        2. `./mvnw package` çalıştır. `BUILD SUCCESS` yazınca `target` klasörüne bak.
        3. Jar'ı ortamdan gelen bir şifreyle çalıştır (önce Linux ve macOS, sonra PowerShell). Önce uygulamanın diğer çalıştırmalarını durdur.
        4. `curl` ile dene: okumak şifre istemez, oluşturmak `-u admin:s3cret` ister.
        5. Ctrl+C ile durdur. Acelen varsa testleri atlamak için `./mvnw package -DskipTests` kullan; bunu alışkanlık yapma.
    code:
      - file: src/main/resources/application.properties
        lang: properties
        text: |
          server.port=${PORT:8080}
      - file: terminal
        lang: sh
        text: |
          ./mvnw package
          ls -lh target/*.jar

          LIBRARY_PASSWORD=s3cret java -jar target/library-0.0.1-SNAPSHOT.jar

          # PowerShell
          $env:LIBRARY_PASSWORD = "s3cret"; java -jar target/library-0.0.1-SNAPSHOT.jar

          # second terminal
          curl -u admin:s3cret -X POST localhost:8080/api/books -H 'Content-Type: application/json' \
            -d '{"title":"Dune","author":"Frank Herbert","year":1965}'
          curl localhost:8080/api/books
    mistakes:
      - problem:
          en: "\"Error: Unable to access jarfile target/library-0.0.1-SNAPSHOT.jar\"."
          tr: "\"Error: Unable to access jarfile target/library-0.0.1-SNAPSHOT.jar\" hatası."
        fix:
          en: "You are in the wrong folder, the build failed, or the version in `pom.xml` is different. Run `ls target` and use the exact name you see."
          tr: "Yanlış klasördesin, build başarısız oldu ya da `pom.xml`'deki sürüm farklı. `ls target` çalıştır ve gördüğün adı aynen kullan."
      - problem:
          en: "The build fails in the tests, but the code works when you run it."
          tr: "Build testlerde başarısız oluyor ama kodu çalıştırınca çalışıyor."
        fix:
          en: "Read the first failing test in the output; do not skip tests to get around it. Common cause: the `postgres` profile is active through `SPRING_PROFILES_ACTIVE`, or a test depends on data that another test changed."
          tr: "Çıktıdaki ilk başarısız testi oku; atlatmak için testleri geçme. Sık sebep: `SPRING_PROFILES_ACTIVE` ile `postgres` profile'ının aktif olması ya da bir testin başka bir testin değiştirdiği veriye bağlı olması."
      - problem:
          en: "The jar runs, but anyone can log in with `admin` and `dev-only-password`."
          tr: "Jar çalışıyor ama herkes `admin` ve `dev-only-password` ile giriş yapabilir."
        fix:
          en: "You did not set `LIBRARY_PASSWORD`, so the default applies. Always set it when you run outside your own computer."
          tr: "`LIBRARY_PASSWORD` ayarlamadın, bu yüzden varsayılan geçerli. Kendi bilgisayarın dışında çalıştırırken her zaman ayarla."
    quiz:
      - q:
          en: "Why can the jar run on a server that has only Java installed?"
          tr: "Jar neden sadece Java kurulu bir sunucuda çalışabilir?"
        options:
          en: ["It contains the app and all its libraries and the web server", "It downloads the code when it starts", "Java installs Maven by itself"]
          tr: ["Uygulamayı, tüm kütüphaneleri ve web sunucusunu içerir", "Başlarken kodu indirir", "Java Maven'ı kendisi kurar"]
        answer: 0
        why:
          en: "Spring Boot's executable jar is self-contained: your classes, the libraries and an embedded Tomcat."
          tr: "Spring Boot'un çalıştırılabilir jar'ı kendi kendine yeter: sınıfların, kütüphaneler ve gömülü bir Tomcat."
    sources:
      - title: Spring Boot, executable jars
        url: https://docs.spring.io/spring-boot/specification/executable-jar/index.html
      - title: Spring Boot, packaging
        url: https://docs.spring.io/spring-boot/reference/packaging/index.html

  - id: docker
    stage: packaging
    title:
      en: "Package the app as a Docker image"
      tr: "Uygulamayı Docker image'ı olarak paketleme"
    minutes: 45
    needs: [jar]
    why:
      en: "A container image carries the app together with the right Java, so it runs the same on your laptop and on any host. Most hosting services, including the free one in the next step, run Docker images."
      tr: "Container image'ı uygulamayı doğru Java ile birlikte taşır; böylece dizüstü bilgisayarında da, herhangi bir sunucuda da aynı çalışır. Bir sonraki adımdaki ücretsiz servis dahil çoğu barındırma servisi Docker image'ı çalıştırır."
    learn:
      en: |
        - A **multi-stage Dockerfile**: stage one builds the jar with the JDK, stage two copies only the jar into a small JRE image
        - Layer order: copy `pom.xml` and download libraries first, then copy `src`, so a code change does not download everything again
        - Running as a normal user instead of root, and a memory limit (`-XX:MaxRAMPercentage=75`)
        - The alternative: `./mvnw spring-boot:build-image` builds an image with Cloud Native Buildpacks and needs no Dockerfile
      tr: |
        - **Multi-stage Dockerfile**: birinci aşama jar'ı JDK ile üretir, ikinci aşama sadece jar'ı küçük bir JRE image'ına kopyalar
        - Katman sırası: önce `pom.xml`'i kopyala ve kütüphaneleri indir, sonra `src`'yi kopyala; böylece kod değişikliği her şeyi yeniden indirmez
        - Root yerine normal bir kullanıcıyla çalışmak ve bellek sınırı (`-XX:MaxRAMPercentage=75`)
        - Alternatif: `./mvnw spring-boot:build-image` Cloud Native Buildpacks ile Dockerfile'sız image üretir
    do:
      en: |
        1. Create `Dockerfile` and `.dockerignore` in the project root (next to `pom.xml`) with the content below.
        2. Build the image: the first build downloads the JDK image and all libraries, so it takes a few minutes. Later builds are faster.
        3. Run it with a password and the port published, then test with `curl` as before. If port 8080 is busy, use `-p 8081:8080` and call port 8081.
        4. Check the size with `docker images library`, and stop the container with Ctrl+C.
        5. Commit `Dockerfile` and `.dockerignore`.
      tr: |
        1. Proje kökünde (`pom.xml`'in yanında) aşağıdaki içerikle `Dockerfile` ve `.dockerignore` oluştur.
        2. Image'ı üret: ilk build JDK image'ını ve tüm kütüphaneleri indirir, bu yüzden birkaç dakika sürer. Sonrakiler daha hızlı.
        3. Bir şifre ve yayınlanmış portla çalıştır, sonra `curl` ile eskisi gibi dene. 8080 doluysa `-p 8081:8080` kullan ve 8081 portunu çağır.
        4. Boyutu `docker images library` ile kontrol et ve container'ı Ctrl+C ile durdur.
        5. `Dockerfile` ve `.dockerignore` dosyalarını commit'le.
    code:
      - file: Dockerfile
        lang: dockerfile
        text: |
          # Stage 1: build the jar with the JDK
          FROM eclipse-temurin:25-jdk-alpine AS build
          WORKDIR /app
          COPY .mvn .mvn
          COPY mvnw pom.xml ./
          RUN ./mvnw -q dependency:go-offline
          COPY src src
          RUN ./mvnw -q package -DskipTests

          # Stage 2: run it with the smaller JRE, as a normal user (not root)
          FROM eclipse-temurin:25-jre-alpine
          WORKDIR /app
          RUN addgroup -S app && adduser -S app -G app
          COPY --from=build /app/target/*.jar app.jar
          USER app
          EXPOSE 8080
          ENTRYPOINT ["java", "-XX:MaxRAMPercentage=75", "-jar", "app.jar"]
      - file: .dockerignore
        lang: text
        text: |
          target
          .git
          HELP.md
      - file: terminal
        lang: sh
        text: |
          docker build -t library .
          docker run --rm -p 8080:8080 -e LIBRARY_PASSWORD=s3cret library

          # second terminal
          curl localhost:8080/actuator/health
          curl -u admin:s3cret -X POST localhost:8080/api/books -H 'Content-Type: application/json' \
            -d '{"title":"Dune","author":"Frank Herbert","year":1965}'

          # the Dockerfile-free alternative
          ./mvnw spring-boot:build-image -Dspring-boot.build-image.imageName=library
    mistakes:
      - problem:
          en: "\"Bind for 0.0.0.0:8080 failed: port is already allocated\"."
          tr: "\"Bind for 0.0.0.0:8080 failed: port is already allocated\" hatası."
        fix:
          en: "Something already uses port 8080 on your computer (maybe an older container: `docker ps`). Stop it or publish another host port: `-p 8081:8080`."
          tr: "Bilgisayarında 8080 portunu zaten bir şey kullanıyor (belki eski bir container: `docker ps`). Onu durdur ya da başka bir host portu yayınla: `-p 8081:8080`."
      - problem:
          en: "Every build downloads all libraries again and takes minutes."
          tr: "Her build tüm kütüphaneleri yeniden indiriyor ve dakikalar sürüyor."
        fix:
          en: "Keep the order: copy `pom.xml` and run `dependency:go-offline` *before* `COPY src src`. Docker reuses unchanged layers, so only your code is rebuilt."
          tr: "Sırayı koru: `pom.xml`'i kopyala ve `dependency:go-offline`'ı `COPY src src`'den *önce* çalıştır. Docker değişmeyen katmanları yeniden kullanır, böylece sadece kodun yeniden derlenir."
      - problem:
          en: "The app inside the container cannot reach the PostgreSQL on `localhost`."
          tr: "Container içindeki uygulama `localhost` üzerindeki PostgreSQL'e ulaşamıyor."
        fix:
          en: "Inside a container `localhost` is the container itself. Put both containers in the same Docker network and use the database container's name as the host, or use a hosted database URL."
          tr: "Container içinde `localhost` container'ın kendisidir. İki container'ı aynı Docker ağına koy ve host olarak veritabanı container'ının adını kullan, ya da barındırılan bir veritabanı URL'si kullan."
    quiz:
      - q:
          en: "Why does the Dockerfile have two `FROM` lines?"
          tr: "Dockerfile'da neden iki `FROM` satırı var?"
        options:
          en: ["To run two apps", "To build with the big JDK but ship only the small JRE image with the jar", "To make the image slower"]
          tr: ["İki uygulama çalıştırmak için", "Büyük JDK ile build etmek ama sadece jar'lı küçük JRE image'ını göndermek için", "Image'ı yavaşlatmak için"]
        answer: 1
        why:
          en: "Only the last stage becomes the image. The compiler, Maven and the source code stay in the first stage, so the final image is smaller and safer."
          tr: "Sadece son aşama image olur. Derleyici, Maven ve kaynak kod ilk aşamada kalır; son image daha küçük ve daha güvenli olur."
    sources:
      - title: Spring Boot, efficient container images (Dockerfiles)
        url: https://docs.spring.io/spring-boot/reference/packaging/container-images/dockerfiles.html
      - title: Spring Boot Maven plugin, build-image
        url: https://docs.spring.io/spring-boot/maven-plugin/build-image.html
      - title: Docker, multi-stage builds
        url: https://docs.docker.com/build/building/multi-stage/

  - id: deploy
    stage: deploy
    title:
      en: "Deploy for free on Render"
      tr: "Render'da ücretsiz deploy etme"
    minutes: 40
    needs: [docker, security]
    why:
      en: "A service nobody can reach is only a hobby on your laptop. Render can run your Docker image on a public https address, and has a free plan that is enough to show the project."
      tr: "Kimsenin ulaşamadığı bir servis, dizüstü bilgisayarındaki bir hobiden ibaret. Render Docker image'ını herkese açık bir https adresinde çalıştırabilir ve projeyi göstermeye yetecek ücretsiz bir planı var."
    learn:
      en: |
        - How a host builds from a Git repository: it reads the `Dockerfile`, builds the image and starts it
        - Environment variables on the host: `LIBRARY_PASSWORD` is set there, never in Git
        - A health check path tells the host when the app is ready
        - **The limits of the free plan** (from Render's documentation, checked 2026-10): a free web service spins down after 15 minutes without traffic and needs about a minute to wake up; its files are lost on every restart or redeploy, so the in-memory H2 data is lost too; each workspace has 750 free instance hours per month; the instance has 512 MB RAM and less than one CPU; free Render Postgres databases expire 30 days after creation
      tr: |
        - Bir sunucunun Git deposundan nasıl build aldığı: `Dockerfile`'ı okur, image'ı üretir ve başlatır
        - Sunucudaki ortam değişkenleri: `LIBRARY_PASSWORD` orada ayarlanır, Git'te asla
        - Health check yolu, uygulamanın ne zaman hazır olduğunu sunucuya söyler
        - **Ücretsiz planın sınırları** (Render dokümantasyonundan, 2026-10'da kontrol edildi): ücretsiz bir web servisi 15 dakika trafik almazsa uykuya geçer ve uyanması yaklaşık bir dakika sürer; dosyaları her yeniden başlatmada ya da redeploy'da kaybolur, yani bellekteki H2 verisi de kaybolur; her workspace için ayda 750 ücretsiz instance saati var; instance'ın 512 MB RAM'i ve bir CPU'dan azı var; ücretsiz Render Postgres veritabanları oluşturulduktan 30 gün sonra sona erer
    do:
      en: |
        1. Create a GitHub account and a new repository (private is fine). Push your project: `git remote add origin <repo-url>`, then `git push -u origin main`. Check that `Dockerfile` and `pom.xml` are in the repository root.
        2. Sign up at render.com. Click **New**, then **Web Service**, connect GitHub and pick the repository.
        3. Choose the **Docker** language (Render finds the `Dockerfile` in the root) and the **Free** instance type.
        4. Under environment variables add `LIBRARY_PASSWORD` with a long random value. Render passes `PORT` itself and the app reads it.
        5. Under advanced settings set the **Health Check Path** to `/actuator/health`.
        6. Deploy and watch the build log. When it says the service is live, open `https://<your-service>.onrender.com/actuator/health`, then `/api/books`.
        7. Create a book with `curl -u admin:<your password>` against your Render address. Wait 15 minutes without any request and open the address again: the first answer is slow (the service woke up) and the book is gone (H2 is in memory). This is the free plan, not a bug.
        8. To keep data you need a database that survives restarts: a PostgreSQL from any provider, with its JDBC URL, user and password in `DATABASE_URL`, `DATABASE_USER` and `DATABASE_PASSWORD`, plus `SPRING_PROFILES_ACTIVE=postgres`. Render's own free Postgres works for 30 days.
      tr: |
        1. Bir GitHub hesabı ve yeni bir depo oluştur (private olabilir). Projeni gönder: `git remote add origin <repo-url>`, sonra `git push -u origin main`. `Dockerfile` ve `pom.xml`'in deponun kökünde olduğunu kontrol et.
        2. render.com'a kaydol. **New**'e, sonra **Web Service**'e tıkla, GitHub'ı bağla ve depoyu seç.
        3. **Docker** dilini seç (Render kökteki `Dockerfile`'ı bulur) ve **Free** instance tipini seç.
        4. Ortam değişkenlerine uzun, rastgele bir değerle `LIBRARY_PASSWORD` ekle. `PORT`'u Render kendisi verir ve uygulama onu okur.
        5. Gelişmiş ayarlardan **Health Check Path**'i `/actuator/health` yap.
        6. Deploy et ve build log'unu izle. Servisin yayında olduğunu yazınca `https://<servis-adın>.onrender.com/actuator/health` adresini, sonra `/api/books` adresini aç.
        7. Render adresine `curl -u admin:<şifren>` ile bir kitap oluştur. 15 dakika hiç istek göndermeden bekle ve adresi yeniden aç: ilk cevap yavaş gelir (servis uyandı) ve kitap gitmiştir (H2 bellekte). Bu ücretsiz planın davranışı, hata değil.
        8. Veriyi tutmak için yeniden başlatmalardan etkilenmeyen bir veritabanı gerekir: herhangi bir sağlayıcıdan bir PostgreSQL, JDBC URL'si, kullanıcı adı ve şifresi `DATABASE_URL`, `DATABASE_USER` ve `DATABASE_PASSWORD` içinde, ayrıca `SPRING_PROFILES_ACTIVE=postgres`. Render'ın kendi ücretsiz Postgres'i 30 gün çalışır.
    code:
      - file: terminal
        lang: sh
        text: |
          git remote add origin https://github.com/<you>/library.git
          git push -u origin main

          # after the deploy
          curl https://<your-service>.onrender.com/actuator/health
          curl https://<your-service>.onrender.com/api/books
          curl -u admin:<your-password> -X POST https://<your-service>.onrender.com/api/books \
            -H 'Content-Type: application/json' \
            -d '{"title":"Dune","author":"Frank Herbert","year":1965}'
    mistakes:
      - problem:
          en: "The deploy fails with \"no Dockerfile found\" or builds the wrong folder."
          tr: "Deploy \"no Dockerfile found\" ile başarısız oluyor ya da yanlış klasörü build ediyor."
        fix:
          en: "The `Dockerfile` must be in the repository root, or you must set the Dockerfile path and root directory in the service settings. Check with `git ls-files Dockerfile` that it was committed."
          tr: "`Dockerfile` deponun kökünde olmalı ya da servis ayarlarında Dockerfile yolunu ve kök dizini belirtmelisin. Commit'lendiğini `git ls-files Dockerfile` ile kontrol et."
      - problem:
          en: "The service is \"live\" but the page times out, or Render says no open port was detected."
          tr: "Servis \"live\" görünüyor ama sayfa zaman aşımına uğruyor ya da Render açık port bulunamadı diyor."
        fix:
          en: "The app must listen on the port in the `PORT` variable and on all addresses. The `server.port=${PORT:8080}` line does that; check that you added it and committed it."
          tr: "Uygulama `PORT` değişkenindeki portu ve tüm adresleri dinlemeli. `server.port=${PORT:8080}` satırı bunu yapar; eklediğinden ve commit'lediğinden emin ol."
      - problem:
          en: "The first request after a break takes a minute, or the books vanished."
          tr: "Moladan sonraki ilk istek bir dakika sürüyor ya da kitaplar kayboldu."
        fix:
          en: "That is the free plan: it sleeps after 15 minutes without traffic and loses local data. For a demo this is fine; for real use pay for an always-on instance and use a database."
          tr: "Bu ücretsiz plan: 15 dakika trafik olmazsa uyur ve yerel veriyi kaybeder. Demo için sorun değil; gerçek kullanım için hep açık bir instance için öde ve bir veritabanı kullan."
    quiz:
      - q:
          en: "Where should `LIBRARY_PASSWORD` be stored for the deployed app?"
          tr: "Yayındaki uygulama için `LIBRARY_PASSWORD` nerede saklanmalı?"
        options:
          en: ["In the Git repository so it is not lost", "In the host's environment variables", "In the Dockerfile"]
          tr: ["Kaybolmasın diye Git deposunda", "Sunucunun ortam değişkenlerinde", "Dockerfile içinde"]
        answer: 1
        why:
          en: "Anything in Git or in an image can be read by anyone who gets the repository or the image. The host keeps its environment variables private."
          tr: "Git'teki ya da image'daki her şeyi depoya ya da image'a erişen herkes okuyabilir. Sunucu ortam değişkenlerini gizli tutar."
    sources:
      - title: Render, deploy for free (limits)
        url: https://render.com/docs/free
      - title: Render, Docker on Render
        url: https://render.com/docs/docker
      - title: Render, health checks
        url: https://render.com/docs/health-checks

  - id: actuator-logs
    stage: monitoring
    title:
      en: "Health, metrics and logs with Actuator"
      tr: "Actuator ile sağlık, metrik ve log"
    minutes: 40
    needs: [deploy]
    why:
      en: "When something goes wrong in production you can only look at what the app tells you: is it healthy, how much memory does it use, what did it log. Actuator and good log messages give you that."
      tr: "Production'da bir şey ters gittiğinde sadece uygulamanın sana söylediklerine bakabilirsin: sağlıklı mı, ne kadar bellek kullanıyor, ne logladı. Actuator ve iyi log mesajları bunu sağlar."
    learn:
      en: |
        - `/actuator/health` says UP or DOWN (the host uses it); details such as database and disk are shown only to a logged-in user
        - `/actuator/metrics` lists numbers like memory use and request counts; `/actuator/health/liveness` and `/readiness` are the probes orchestrators use
        - Log levels (ERROR, WARN, INFO, DEBUG) and `logging.level.<package>` to change them without code
        - Never expose every endpoint publicly: list only the ones you need
        - JSON logs for log tools: `logging.structured.format.console=ecs`
      tr: |
        - `/actuator/health` UP ya da DOWN der (sunucu bunu kullanır); veritabanı ve disk gibi ayrıntılar sadece giriş yapmış kullanıcıya gösterilir
        - `/actuator/metrics` bellek kullanımı ve istek sayısı gibi sayıları listeler; `/actuator/health/liveness` ve `/readiness` orkestratörlerin kullandığı probe'lardır
        - Log seviyeleri (ERROR, WARN, INFO, DEBUG) ve kod yazmadan değiştirmek için `logging.level.<paket>`
        - Her endpoint'i herkese açma: sadece ihtiyacın olanları listele
        - Log araçları için JSON log: `logging.structured.format.console=ecs`
    do:
      en: |
        1. Replace `BookService.java` with the version below. It logs when a book is created or deleted, and warns when someone deletes a book that does not exist.
        2. Make `application.properties` look like the full file below (it is the final version, with logging and Actuator settings added and `show-sql` removed).
        3. Run the app, create and delete books, and read the log lines in the terminal.
        4. Check the endpoints with `curl`: `/actuator/health` is public and short; with `-u admin:...` it shows details; `/actuator/metrics` needs the login.
        5. Raise the detail of your own logs without changing code: `LOGGING_LEVEL_DEV_IGREK_LIBRARY=DEBUG ./mvnw spring-boot:run`. Spring reads environment variables in this form for any property.
        6. On Render open the service's **Logs** tab and find the same lines. Try `LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs` as an environment variable to get one JSON object per line.
      tr: |
        1. `BookService.java` dosyasını aşağıdaki sürümle değiştir. Bir kitap oluşturulunca ya da silinince log yazar, olmayan bir kitabı silmeye çalışan olursa uyarır.
        2. `application.properties` dosyasını aşağıdaki tam dosya gibi yap (son sürüm: log ve Actuator ayarları eklendi, `show-sql` kaldırıldı).
        3. Uygulamayı çalıştır, kitap oluştur ve sil, terminaldeki log satırlarını oku.
        4. Endpoint'leri `curl` ile kontrol et: `/actuator/health` herkese açık ve kısa; `-u admin:...` ile ayrıntı gösterir; `/actuator/metrics` giriş ister.
        5. Kod değiştirmeden kendi loglarının ayrıntısını artır: `LOGGING_LEVEL_DEV_IGREK_LIBRARY=DEBUG ./mvnw spring-boot:run`. Spring her ayarı bu biçimdeki ortam değişkenlerinden okur.
        6. Render'da servisin **Logs** sekmesini aç ve aynı satırları bul. Satır başına bir JSON nesnesi için ortam değişkeni olarak `LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs` dene.
    code:
      - file: src/main/java/dev/igrek/library/BookService.java
        lang: java
        text: |
          package dev.igrek.library;

          import java.util.List;

          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;
          import org.springframework.cache.annotation.CacheEvict;
          import org.springframework.cache.annotation.CachePut;
          import org.springframework.cache.annotation.Cacheable;
          import org.springframework.data.domain.Sort;
          import org.springframework.stereotype.Service;
          import org.springframework.transaction.annotation.Transactional;

          @Service
          @Transactional
          public class BookService {

              private static final Logger log = LoggerFactory.getLogger(BookService.class);

              private final BookRepository repository;

              public BookService(BookRepository repository) {
                  this.repository = repository;
              }

              @Transactional(readOnly = true)
              public List<Book> list(String author) {
                  if (author == null) {
                      return repository.findAll(Sort.by("id"));
                  }
                  return repository.findByAuthorIgnoreCaseOrderById(author);
              }

              @Cacheable(value = "books", key = "#id")
              @Transactional(readOnly = true)
              public Book get(long id) {
                  return repository.findById(id).orElseThrow(() -> new BookNotFoundException(id));
              }

              public Book create(BookRequest request) {
                  Book saved = repository.save(new Book(request.title(), request.author(), request.year()));
                  log.info("Created book {} (\"{}\")", saved.getId(), saved.getTitle());
                  return saved;
              }

              @CachePut(value = "books", key = "#id")
              public Book update(long id, BookRequest request) {
                  Book book = get(id);
                  book.change(request.title(), request.author(), request.year());
                  return book; // saved automatically when the transaction ends
              }

              @CacheEvict(value = "books", key = "#id")
              public void delete(long id) {
                  if (!repository.existsById(id)) {
                      log.warn("Tried to delete missing book {}", id);
                      throw new BookNotFoundException(id);
                  }
                  repository.deleteById(id);
                  log.info("Deleted book {}", id);
              }
          }
      - file: src/main/resources/application.properties
        lang: properties
        text: |
          spring.application.name=library
          server.port=${PORT:8080}

          # Log levels: our code at INFO, everything else at the default
          logging.level.dev.igrek.library=INFO

          # Actuator: which endpoints are reachable over HTTP
          management.endpoints.web.exposure.include=health,metrics
          management.endpoint.health.show-details=when-authorized

          # The one user who may change data. Override the password with LIBRARY_PASSWORD.
          spring.security.user.name=admin
          spring.security.user.password=${LIBRARY_PASSWORD:dev-only-password}

          # Keep at most 500 books in the cache, each for 10 minutes
          spring.cache.cache-names=books
          spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

          # Run each request on a cheap virtual thread (needs Java 21 or newer)
          spring.threads.virtual.enabled=true
      - file: terminal
        lang: sh
        text: |
          curl localhost:8080/actuator/health
          curl -u admin:dev-only-password localhost:8080/actuator/health
          curl -u admin:dev-only-password localhost:8080/actuator/metrics
          curl -u admin:dev-only-password localhost:8080/actuator/metrics/jvm.memory.used
          curl localhost:8080/actuator/health/liveness
    mistakes:
      - problem:
          en: "`/actuator/metrics` answers 401 in the browser or with `curl`."
          tr: "`/actuator/metrics` tarayıcıda ya da `curl` ile 401 dönüyor."
        fix:
          en: "That is intended: `SecurityConfig` makes only `/actuator/health/**` public. Send the login (`curl -u admin:...`). Do not open more endpoints to the public."
          tr: "Bu istenen davranış: `SecurityConfig` sadece `/actuator/health/**` yolunu herkese açar. Girişi gönder (`curl -u admin:...`). Daha fazla endpoint'i herkese açma."
      - problem:
          en: "Setting `management.endpoints.web.exposure.include=*` to \"see everything\"."
          tr: "\"Her şeyi görmek\" için `management.endpoints.web.exposure.include=*` ayarlamak."
        fix:
          en: "Some endpoints reveal configuration, environment and internals. List only what you need (`health,metrics`) and keep everything except health behind the login."
          tr: "Bazı endpoint'ler yapılandırmayı, ortamı ve iç bilgileri gösterir. Sadece ihtiyacın olanları listele (`health,metrics`) ve health dışındakilerin hepsini girişin arkasında tut."
      - problem:
          en: "You change a log level in `application.properties` and nothing changes."
          tr: "`application.properties`'te bir log seviyesini değiştiriyorsun ve hiçbir şey değişmiyor."
        fix:
          en: "Restart the app (properties are read at start-up). Also check the package name: `logging.level.dev.igrek.library` must match the real package of the class."
          tr: "Uygulamayı yeniden başlat (ayarlar başlangıçta okunur). Paket adını da kontrol et: `logging.level.dev.igrek.library` class'ın gerçek paketiyle aynı olmalı."
    quiz:
      - q:
          en: "Why does the host check `/actuator/health` and not `/api/books`?"
          tr: "Sunucu neden `/api/books` yerine `/actuator/health` yolunu kontrol ediyor?"
        options:
          en: ["Because it is faster to type", "Because it is public and answers cheaply whether the app and its database work", "Because /api/books does not exist"]
          tr: ["Yazması daha kısa olduğu için", "Herkese açık olduğu ve uygulamanın ve veritabanının çalışıp çalışmadığını ucuza cevapladığı için", "/api/books olmadığı için"]
        answer: 1
        why:
          en: "A health endpoint is made for this check. It needs no login and does not depend on your business data."
          tr: "Health endpoint'i bu kontrol için yapılır. Giriş istemez ve iş verilerine bağlı değildir."
    sources:
      - title: Spring Boot, Actuator
        url: https://docs.spring.io/spring-boot/reference/actuator/index.html
      - title: Spring Boot, Actuator endpoints
        url: https://docs.spring.io/spring-boot/reference/actuator/endpoints.html
      - title: Spring Boot, logging
        url: https://docs.spring.io/spring-boot/reference/features/logging.html

  - id: ci
    stage: advanced
    title:
      en: "Test every push with GitHub Actions"
      tr: "Her push'u GitHub Actions ile test etme"
    minutes: 30
    needs: [tests, actuator-logs]
    why:
      en: "You forget to run the tests sometimes; a robot does not. GitHub Actions builds the project and runs the tests on every push, for free on public repositories, so a broken change is noticed at once."
      tr: "Bazen testleri çalıştırmayı unutursun; bir robot unutmaz. GitHub Actions her push'ta projeyi build edip testleri çalıştırır, herkese açık depolarda ücretsiz; böylece bozuk bir değişiklik hemen fark edilir."
    learn:
      en: |
        - A workflow is a YAML file in `.github/workflows/` with a trigger and jobs
        - `actions/checkout` gets the code, `actions/setup-java` installs the JDK and caches Maven's libraries
        - `./mvnw -B verify` builds and tests; a failing test makes the run red
        - Where to go next: database migrations with Flyway (instead of `ddl-auto=update`), pagination with `Pageable`, and an OpenAPI page for your API
      tr: |
        - Workflow, `.github/workflows/` içindeki, bir tetikleyicisi ve job'ları olan bir YAML dosyasıdır
        - `actions/checkout` kodu alır, `actions/setup-java` JDK'yı kurar ve Maven kütüphanelerini cache'ler
        - `./mvnw -B verify` build eder ve test eder; başarısız bir test çalıştırmayı kırmızı yapar
        - Sonraki adımlar: Flyway ile veritabanı migration'ları (`ddl-auto=update` yerine), `Pageable` ile sayfalama ve API'n için bir OpenAPI sayfası
    do:
      en: |
        1. Create the file `.github/workflows/ci.yml` with the content below.
        2. Make sure the Maven wrapper keeps its executable flag in Git: `git update-index --chmod=+x mvnw` (on Windows) and commit.
        3. Commit and push. Open the **Actions** tab of your repository and watch the run turn green.
        4. Break a test on purpose in a branch, push it, and see the run turn red. Fix it.
        5. You now have the full path: code, tests, a Docker image, a free deploy and a robot that checks every change. Next, add the Flyway migrations and pagination from the list above.
      tr: |
        1. Aşağıdaki içerikle `.github/workflows/ci.yml` dosyasını oluştur.
        2. Maven wrapper'ın Git'te çalıştırılabilir bayrağını koruduğundan emin ol: `git update-index --chmod=+x mvnw` (Windows'ta) ve commit'le.
        3. Commit'le ve push et. Deponun **Actions** sekmesini aç ve çalıştırmanın yeşile dönmesini izle.
        4. Bir branch'te bilerek bir testi boz, push et ve çalıştırmanın kırmızıya döndüğünü gör. Düzelt.
        5. Artık tam yola sahipsin: kod, testler, bir Docker image'ı, ücretsiz bir deploy ve her değişikliği kontrol eden bir robot. Sıradaki iş, yukarıdaki listeden Flyway migration'ları ve sayfalama.
    code:
      - file: .github/workflows/ci.yml
        lang: yaml
        text: |
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-java@v6
                  with:
                    distribution: temurin
                    java-version: '25'
                    cache: maven
                - run: ./mvnw -B verify
    mistakes:
      - problem:
          en: "\"./mvnw: Permission denied\" in the workflow run."
          tr: "Workflow çalıştırmasında \"./mvnw: Permission denied\" hatası."
        fix:
          en: "Git did not store the executable flag. Run `git update-index --chmod=+x mvnw`, commit and push. (Or write `sh ./mvnw -B verify` in the workflow.)"
          tr: "Git çalıştırılabilir bayrağını saklamadı. `git update-index --chmod=+x mvnw` çalıştır, commit'le ve push et. (Ya da workflow'da `sh ./mvnw -B verify` yaz.)"
      - problem:
          en: "The workflow does not start at all."
          tr: "Workflow hiç başlamıyor."
        fix:
          en: "The file must be exactly in `.github/workflows/` and end with `.yml` or `.yaml`, and the YAML indentation must be right (spaces, not tabs). The Actions tab shows a syntax error if there is one."
          tr: "Dosya tam olarak `.github/workflows/` içinde olmalı ve `.yml` ya da `.yaml` ile bitmeli, YAML girintisi doğru olmalı (tab değil, boşluk). Varsa sözdizimi hatasını Actions sekmesi gösterir."
      - problem:
          en: "Tests pass on your computer but fail in the workflow."
          tr: "Testler bilgisayarında geçiyor ama workflow'da başarısız oluyor."
        fix:
          en: "Your computer has something the runner does not: a different Java version, a running database, an environment variable. Use the same Java version in `pom.xml` and the workflow, and make tests use only H2."
          tr: "Bilgisayarında runner'da olmayan bir şey var: farklı bir Java sürümü, çalışan bir veritabanı, bir ortam değişkeni. `pom.xml` ve workflow'da aynı Java sürümünü kullan ve testlerin sadece H2 kullanmasını sağla."
    quiz:
      - q:
          en: "What makes a GitHub Actions run fail when a test fails?"
          tr: "Bir test başarısız olunca GitHub Actions çalıştırmasını ne başarısız yapar?"
        options:
          en: ["GitHub reads the test code", "The command `./mvnw verify` exits with an error and the step turns red", "Nothing, it always passes"]
          tr: ["GitHub test kodunu okur", "`./mvnw verify` komutu hatayla biter ve adım kırmızı olur", "Hiçbir şey, her zaman geçer"]
        answer: 1
        why:
          en: "A step fails when its command returns a non-zero exit code, which Maven does when a test fails."
          tr: "Bir adım, komutu sıfırdan farklı bir çıkış kodu döndürünce başarısız olur; Maven bunu bir test başarısız olunca yapar."
    sources:
      - title: GitHub Docs, building and testing Java with Maven
        url: https://docs.github.com/en/actions/tutorials/build-and-test-code/java-with-maven
      - title: actions/setup-java
        url: https://github.com/actions/setup-java
