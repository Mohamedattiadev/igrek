  - id: sqlite
    stage: data-api
    title:
      en: "Move the data to SQLite"
      tr: "Veriyi SQLite'a taşıma"
    minutes: 70
    needs: [habits]
    why:
      en: "A JSON file is rewritten completely on every change, and two programs writing at the same time can damage it. SQLite is a real database that lives in one file, ships inside Python (the `sqlite3` module) and handles saving safely, searching and adding up for you. You will use SQL, the language almost every database speaks."
      tr: "JSON dosyası her değişiklikte baştan yazılır ve aynı anda yazan iki program onu bozabilir. SQLite tek bir dosyada yaşayan gerçek bir veritabanıdır, Python'un içinde gelir (`sqlite3` modülü) ve güvenli kaydetmeyi, aramayı, toplamayı senin yerine yapar. Hemen hemen her veritabanının konuştuğu dil olan SQL'i kullanacaksın."
    learn:
      en: |
        - Tables, columns and rows; `CREATE TABLE`, `INSERT`, `SELECT ... WHERE ... ORDER BY ... LIMIT`, `GROUP BY` with `SUM`
        - Constraints (`NOT NULL`, `CHECK`, `PRIMARY KEY`) make the database refuse bad data
        - **Placeholders** (`?`) pass values separately from the SQL text, which stops SQL injection
        - `with connection:` commits a transaction when the block ends and rolls back on an error
        - A class with `__enter__` and `__exit__` works in a `with` block, so the connection is always closed
      tr: |
        - Tablo, sütun ve satır; `CREATE TABLE`, `INSERT`, `SELECT ... WHERE ... ORDER BY ... LIMIT`, `SUM` ile `GROUP BY`
        - Kısıtlar (`NOT NULL`, `CHECK`, `PRIMARY KEY`) veritabanının hatalı veriyi reddetmesini sağlar
        - **Placeholder**'lar (`?`) değerleri SQL metninden ayrı gönderir ve SQL injection'ı engeller
        - `with connection:` blok bitince bir transaction'ı commit eder, hata olursa geri alır (rollback)
        - `__enter__` ve `__exit__` olan bir sınıf `with` bloğunda çalışır; böylece bağlantı hep kapanır
    do:
      en: |
        1. Create `src/tally/sqlstore.py` with the first block. It has the same methods as `JsonStore`, so the rest of the program does not care which one it talks to.
        2. Replace `src/tally/cli.py` with the second block. It now opens the SQLite store, and it has a new command, `import-json`, that copies an old JSON file into the database.
        3. Move the data you made earlier: run the commands in the terminal block. The database is created at `.tally/tally.db` in your home folder.
        4. Add an expense that looks like an attack, as the last command does. It is saved as plain text and nothing is deleted. This is what placeholders are for.
        5. Commit: `git add .` then `git commit -m "Move the data to SQLite"`.
      tr: |
        1. İlk blokla `src/tally/sqlstore.py` dosyasını oluştur. `JsonStore` ile aynı metotlara sahip; yani programın geri kalanı hangisiyle konuştuğunu umursamaz.
        2. `src/tally/cli.py` dosyasını ikinci blokla değiştir. Artık SQLite deposunu açıyor ve yeni bir komutu var: `import-json`, eski bir JSON dosyasını veritabanına kopyalar.
        3. Daha önce oluşturduğun veriyi taşı: terminal bloğundaki komutları çalıştır. Veritabanı ev klasöründeki `.tally/tally.db` yerinde oluşur.
        4. Son komuttaki gibi saldırıya benzeyen bir harcama ekle. Düz metin olarak kaydedilir ve hiçbir şey silinmez. Placeholder'lar bunun için var.
        5. Commit et: `git add .` sonra `git commit -m "Move the data to SQLite"`.
    code:
      - file: src/tally/sqlstore.py
        lang: python
        text: |
          import os
          import sqlite3
          from datetime import date
          from pathlib import Path

          from .models import Expense

          SCHEMA = """
          CREATE TABLE IF NOT EXISTS expenses (
              id INTEGER PRIMARY KEY,
              day TEXT NOT NULL,
              cents INTEGER NOT NULL CHECK (cents > 0),
              category TEXT NOT NULL,
              note TEXT NOT NULL DEFAULT ''
          );
          CREATE TABLE IF NOT EXISTS checkins (
              habit TEXT NOT NULL,
              day TEXT NOT NULL,
              PRIMARY KEY (habit, day)
          );
          """


          def default_db_path() -> Path:
              return Path(os.environ.get("TALLY_DB", Path.home() / ".tally" / "tally.db"))


          class SqliteStore:
              """The same methods as JsonStore, but the data lives in a SQLite database file."""

              def __init__(self, path: Path | str):
                  if str(path) != ":memory:":
                      Path(path).parent.mkdir(parents=True, exist_ok=True)
                  self.db = sqlite3.connect(path)
                  self.db.row_factory = sqlite3.Row
                  self.db.executescript(SCHEMA)

              def close(self) -> None:
                  self.db.close()

              def __enter__(self) -> "SqliteStore":
                  return self

              def __exit__(self, *exc_info) -> None:
                  self.close()

              def add_expense(self, day: date, cents: int, category: str, note: str = "") -> Expense:
                  with self.db:  # commits when the block ends, rolls back on an error
                      cur = self.db.execute(
                          "INSERT INTO expenses (day, cents, category, note) VALUES (?, ?, ?, ?)",
                          (day.isoformat(), cents, category, note),
                      )
                  return Expense(day, cents, category, note, cur.lastrowid)

              def list_expenses(self, category: str | None = None, limit: int | None = None) -> list[Expense]:
                  sql = "SELECT id, day, cents, category, note FROM expenses"
                  params: list = []
                  if category is not None:
                      sql += " WHERE category = ?"
                      params.append(category)
                  sql += " ORDER BY day DESC, id DESC"
                  if limit is not None:
                      sql += " LIMIT ?"
                      params.append(limit)
                  rows = self.db.execute(sql, params).fetchall()
                  return [Expense(date.fromisoformat(r["day"]), r["cents"], r["category"], r["note"], r["id"]) for r in rows]

              def totals_by_category(self) -> dict[str, int]:
                  rows = self.db.execute("SELECT category, SUM(cents) AS cents FROM expenses GROUP BY category")
                  return {r["category"]: r["cents"] for r in rows}

              def check_in(self, habit: str, day: date) -> bool:
                  with self.db:
                      cur = self.db.execute(
                          "INSERT OR IGNORE INTO checkins (habit, day) VALUES (?, ?)", (habit, day.isoformat())
                      )
                  return cur.rowcount == 1

              def habit_days(self) -> dict[str, set[date]]:
                  habits: dict[str, set[date]] = {}
                  for r in self.db.execute("SELECT habit, day FROM checkins"):
                      habits.setdefault(r["habit"], set()).add(date.fromisoformat(r["day"]))
                  return habits
