  - id: polish
    stage: advanced
    title:
      en: "CSV export, a linter, type checks and CI"
      tr: "CSV dışa aktarma, linter, tip kontrolü ve CI"
    minutes: 60
    needs: [watch]
    why:
      en: "The last step makes the project easy to keep alive. A linter and a formatter keep the code tidy without arguments, a type checker finds mistakes before you run the code, and CI (continuous integration) runs all your checks on every push, so a broken change cannot sneak in."
      tr: "Son adım projeyi ayakta tutmayı kolaylaştırır. Linter ve formatter kodu tartışmasız düzenli tutar, tip denetleyicisi hataları kodu çalıştırmadan bulur, CI (sürekli entegrasyon) her push'ta bütün kontrollerini çalıştırır; böylece bozuk bir değişiklik içeri sızamaz."
    learn:
      en: |
        - **ruff** is a very fast linter (finds mistakes and unused code) and formatter (one code style for everybody)
        - **mypy** reads your type hints and reports places where the types do not fit
        - The `csv` module writes correct CSV, including quotes around commas
        - **CI** with GitHub Actions: a YAML file in `.github/workflows/` that runs your commands on a fresh machine
        - `uv sync --locked` fails if `uv.lock` is out of date, which keeps CI honest
        - What is next: Python 3.15 adds `lazy import`, which delays loading a module until first use and can speed up the start of command-line tools. Tally supports Python 3.12 and newer, so it cannot use that syntax yet
      tr: |
        - **ruff** çok hızlı bir linter (hataları ve kullanılmayan kodu bulur) ve formatter'dır (herkes için tek kod stili)
        - **mypy** tip ipuçlarını okur ve tiplerin uymadığı yerleri bildirir
        - `csv` modülü virgülleri tırnağa alarak doğru CSV yazar
        - GitHub Actions ile **CI**: `.github/workflows/` içinde, komutlarını temiz bir makinede çalıştıran bir YAML dosyası
        - `uv sync --locked`, `uv.lock` eskiyse hata verir; bu da CI'ı dürüst tutar
        - Sırada ne var: Python 3.15 `lazy import` getirdi; bir modülün yüklenmesini ilk kullanıma kadar erteler ve komut satırı araçlarının başlangıcını hızlandırabilir. Tally Python 3.12 ve üstünü desteklediği için bu söz dizimini henüz kullanamaz
    do:
      en: |
        1. Add the tools: `uv add --dev ruff mypy`.
        2. Add the settings (first code block) to the end of `pyproject.toml`.
        3. Replace `src/tally/sqlstore.py` and `src/tally/cli.py` with the next two blocks. The store now checks that SQLite really returned an id (mypy asks for it), and the command line has a new `export` command that prints all expenses as CSV.
        4. Replace `tests/test_cli.py` with the next block, which tests the export.
        5. Run the checks one by one: `uv run ruff check --fix .` (also sorts imports), `uv run ruff format .` (this one rewrites files into the standard style), `uv run mypy src` and `uv run pytest`. Everything should be green; 47 tests pass and 1 is skipped.
        6. Try the export: `uv run tally export > expenses.csv` and open the file in a spreadsheet.
        7. Create `.github/workflows/test.yml` with the last block. The `uses:` lines are pinned to exact versions the way the uv docs show. Check the uv GitHub Actions page for newer ones from time to time.
        8. Commit and push: `git add .`, `git commit -m "Add export, linting, type checks and CI"`, `git push`. On GitHub open the *Actions* tab and watch the checks run.
      tr: |
        1. Araçları ekle: `uv add --dev ruff mypy`.
        2. Ayarları (ilk kod bloğu) `pyproject.toml` sonuna ekle.
        3. `src/tally/sqlstore.py` ve `src/tally/cli.py` dosyalarını sonraki iki blokla değiştir. Depo artık SQLite'ın gerçekten bir id döndürdüğünü kontrol ediyor (mypy bunu istiyor) ve komut satırında bütün harcamaları CSV olarak yazan yeni bir `export` komutu var.
        4. `tests/test_cli.py` dosyasını export'u test eden sonraki blokla değiştir.
        5. Kontrolleri tek tek çalıştır: `uv run ruff check --fix .` (import'ları da sıralar), `uv run ruff format .` (bu dosyaları standart stile yeniden yazar), `uv run mypy src` ve `uv run pytest`. Hepsi yeşil olmalı; 47 test geçer, 1 atlanır.
        6. Export'u dene: `uv run tally export > expenses.csv` ve dosyayı bir hesap tablosunda aç.
        7. Son blokla `.github/workflows/test.yml` dosyasını oluştur. `uses:` satırları uv dokümanlarının gösterdiği gibi tam sürümlere sabitlenmiş. Zaman zaman uv'nin GitHub Actions sayfasından daha yenilerine bak.
        8. Commit et ve gönder: `git add .`, `git commit -m "Add export, linting, type checks and CI"`, `git push`. GitHub'da *Actions* sekmesini aç ve kontrollerin çalışmasını izle.
    code:
      - file: terminal
        lang: sh
        text: |
          uv add --dev ruff mypy
      - file: pyproject.toml
        lang: toml
        text: |
          [tool.ruff]
          line-length = 100

          [tool.ruff.lint]
          select = ["F", "I", "B", "UP"]

          [tool.mypy]
          check_untyped_defs = true
      - file: src/tally/sqlstore.py
        lang: python
        text: |
          import os
          import sqlite3
          from datetime import date
          from pathlib import Path

          from .models import Expense

          SCHEMA = """
          CREATE TABLE IF NOT EXISTS expenses (
              id INTEGER PRIMARY KEY,
              day TEXT NOT NULL,
              cents INTEGER NOT NULL CHECK (cents > 0),
              category TEXT NOT NULL,
              note TEXT NOT NULL DEFAULT ''
          );
          CREATE INDEX IF NOT EXISTS expenses_category ON expenses (category);
          CREATE INDEX IF NOT EXISTS expenses_day ON expenses (day, id);
          CREATE TABLE IF NOT EXISTS checkins (
              habit TEXT NOT NULL,
              day TEXT NOT NULL,
              PRIMARY KEY (habit, day)
          );
          """


          def default_db_path() -> Path:
              return Path(os.environ.get("TALLY_DB", Path.home() / ".tally" / "tally.db"))


          class SqliteStore:
              """The same methods as JsonStore, but the data lives in a SQLite database file."""

              def __init__(self, path: Path | str):
                  if str(path) != ":memory:":
                      Path(path).parent.mkdir(parents=True, exist_ok=True)
                  self.db = sqlite3.connect(path)
                  self.db.row_factory = sqlite3.Row
                  self.db.executescript(SCHEMA)

              def close(self) -> None:
                  self.db.close()

              def __enter__(self) -> "SqliteStore":
                  return self

              def __exit__(self, *exc_info) -> None:
                  self.close()

              def add_expense(self, day: date, cents: int, category: str, note: str = "") -> Expense:
                  with self.db:  # commits when the block ends, rolls back on an error
                      cur = self.db.execute(
                          "INSERT INTO expenses (day, cents, category, note) VALUES (?, ?, ?, ?)",
                          (day.isoformat(), cents, category, note),
                      )
                  if cur.lastrowid is None:
                      raise RuntimeError("SQLite did not return the new id")
                  return Expense(day, cents, category, note, cur.lastrowid)

              def add_many(self, rows: list[tuple[date, int, str, str]]) -> None:
                  """Insert many expenses in one transaction. Much faster than calling add_expense in a loop."""
                  with self.db:
                      self.db.executemany(
                          "INSERT INTO expenses (day, cents, category, note) VALUES (?, ?, ?, ?)",
                          [(d.isoformat(), cents, category, note) for d, cents, category, note in rows],
                      )

              def list_expenses(self, category: str | None = None, limit: int | None = None) -> list[Expense]:
                  sql = "SELECT id, day, cents, category, note FROM expenses"
                  params: list = []
                  if category is not None:
                      sql += " WHERE category = ?"
                      params.append(category)
                  sql += " ORDER BY day DESC, id DESC"
                  if limit is not None:
                      sql += " LIMIT ?"
                      params.append(limit)
                  rows = self.db.execute(sql, params).fetchall()
                  return [
                      Expense(date.fromisoformat(r["day"]), r["cents"], r["category"], r["note"], r["id"])
                      for r in rows
                  ]

              def totals_by_category(self) -> dict[str, int]:
                  rows = self.db.execute(
                      "SELECT category, SUM(cents) AS cents FROM expenses GROUP BY category"
                  )
                  return {r["category"]: r["cents"] for r in rows}

              def check_in(self, habit: str, day: date) -> bool:
                  with self.db:
                      cur = self.db.execute(
                          "INSERT OR IGNORE INTO checkins (habit, day) VALUES (?, ?)",
                          (habit, day.isoformat()),
                      )
                  return cur.rowcount == 1

              def habit_days(self) -> dict[str, set[date]]:
                  habits: dict[str, set[date]] = {}
                  for r in self.db.execute("SELECT habit, day FROM checkins"):
                      habits.setdefault(r["habit"], set()).add(date.fromisoformat(r["day"]))
                  return habits
      - file: src/tally/cli.py
        lang: python
        text: |
          import argparse
          import csv
          import logging
          import sys
          from datetime import date
          from pathlib import Path

          from .habits import current_streak
          from .jsonstore import JsonStore
          from .log import setup_logging
          from .models import TallyError, clean_expense_text, format_cents, parse_amount
          from .sqlstore import SqliteStore, default_db_path

          log = logging.getLogger(__name__)


          def db_path(option: Path | None) -> Path:
              return option or default_db_path()


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(prog="tally", description="Track your expenses and habits.")
              parser.add_argument("--db", type=Path, help="database file (default: ~/.tally/tally.db)")
              parser.add_argument(
                  "-v", "--verbose", action="store_true", help="print debug messages to stderr"
              )
              sub = parser.add_subparsers(dest="command", required=True)

              add = sub.add_parser("add", help="record an expense")
              add.add_argument("amount", help="for example 4.50")
              add.add_argument("category", help="for example coffee")
              add.add_argument("note", nargs="?", default="")
              add.add_argument("--date", type=date.fromisoformat, help="YYYY-MM-DD (default: today)")

              ls = sub.add_parser("list", help="show expenses, newest first")
              ls.add_argument("--category")

              sub.add_parser("total", help="show the total for each category")

              done = sub.add_parser("done", help="check in a habit for today")
              done.add_argument("habit")

              sub.add_parser("streaks", help="show your habit streaks")

              sub.add_parser("export", help="print all expenses as CSV")

              imp = sub.add_parser("import-json", help="copy the data of an old JSON file into the database")
              imp.add_argument("file", type=Path)
              return parser


          def run(args: argparse.Namespace, store: SqliteStore, today: date) -> None:
              if args.command == "add":
                  category, note = clean_expense_text(args.category, args.note)
                  e = store.add_expense(args.date or today, parse_amount(args.amount), category, note)
                  print(f"added #{e.id}: {format_cents(e.cents)} {e.category}")
              elif args.command == "list":
                  for e in store.list_expenses(args.category):
                      print(f"{e.id:>3}  {e.day}  {format_cents(e.cents):>9}  {e.category:<12} {e.note}")
              elif args.command == "total":
                  totals = store.totals_by_category()
                  for category, cents in sorted(totals.items()):
                      print(f"{category:<12} {format_cents(cents):>9}")
                  print(f"{'all':<12} {format_cents(sum(totals.values())):>9}")
              elif args.command == "done":
                  if store.check_in(args.habit, today):
                      print(f"{args.habit}: done for {today}")
                  else:
                      print(f"{args.habit}: already done today")
              elif args.command == "streaks":
                  for habit, days in sorted(store.habit_days().items()):
                      print(f"{habit:<12} {current_streak(days, today)} day(s)")
              elif args.command == "export":
                  writer = csv.writer(sys.stdout)
                  writer.writerow(["id", "date", "amount", "category", "note"])
                  for e in reversed(store.list_expenses()):
                      writer.writerow([e.id, e.day.isoformat(), format_cents(e.cents), e.category, e.note])
              elif args.command == "import-json":
                  old = JsonStore(args.file)
                  for e in reversed(old.list_expenses()):  # oldest first
                      store.add_expense(e.day, e.cents, e.category, e.note)
                  for habit, days in old.habit_days().items():
                      for day in sorted(days):
                          store.check_in(habit, day)
                  print(f"imported from {args.file}")


          def main(argv: list[str] | None = None) -> int:
              args = build_parser().parse_args(argv)
              setup_logging("DEBUG" if args.verbose else None)
              try:
                  log.debug("using database %s", db_path(args.db))
                  with SqliteStore(db_path(args.db)) as store:
                      run(args, store, date.today())
              except TallyError as err:
                  print(f"error: {err}", file=sys.stderr)
                  return 1
              return 0
      - file: tests/test_cli.py
        lang: python
        text: |
          from tally.cli import main


          def run(tmp_path, *args):
              return main(["--db", str(tmp_path / "t.db"), *args])


          def test_add_list_total(tmp_path, capsys):
              assert run(tmp_path, "add", "4.50", "coffee", "flat white", "--date", "2026-10-17") == 0
              assert run(tmp_path, "add", "12", "food", "--date", "2026-10-16") == 0
              capsys.readouterr()

              assert run(tmp_path, "list") == 0
              out = capsys.readouterr().out
              assert out.index("coffee") < out.index("food")  # newest first
              assert "flat white" in out

              assert run(tmp_path, "total") == 0
              assert capsys.readouterr().out.splitlines()[-1].endswith("16.50")


          def test_bad_amount_is_an_error_not_a_crash(tmp_path, capsys):
              assert run(tmp_path, "add", "abc", "coffee") == 1
              assert "not a number" in capsys.readouterr().err


          def test_done_twice(tmp_path, capsys):
              run(tmp_path, "done", "run")
              capsys.readouterr()
              run(tmp_path, "done", "run")
              assert "already done" in capsys.readouterr().out


          def test_too_long_category_is_refused(tmp_path, capsys):
              assert run(tmp_path, "add", "1", "x" * 41) == 1
              assert "too long" in capsys.readouterr().err


          def test_export_csv(tmp_path, capsys):
              run(tmp_path, "add", "4.50", "coffee", "a, b", "--date", "2026-10-17")
              capsys.readouterr()
              assert run(tmp_path, "export") == 0
              lines = capsys.readouterr().out.splitlines()
              assert lines[0] == "id,date,amount,category,note"
              assert lines[1] == '1,2026-10-17,4.50,coffee,"a, b"'
