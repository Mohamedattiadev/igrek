          from .jsonstore import JsonStore
          from .models import TallyError, format_cents, parse_amount


          def default_path() -> Path:
              return Path(os.environ.get("TALLY_DATA", Path.home() / ".tally" / "data.json"))


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(prog="tally", description="Track your expenses and habits.")
              parser.add_argument("--data", type=Path, help="data file (default: ~/.tally/data.json)")
              sub = parser.add_subparsers(dest="command", required=True)

              add = sub.add_parser("add", help="record an expense")
              add.add_argument("amount", help="for example 4.50")
              add.add_argument("category", help="for example coffee")
              add.add_argument("note", nargs="?", default="")
              add.add_argument("--date", type=date.fromisoformat, help="YYYY-MM-DD (default: today)")

              ls = sub.add_parser("list", help="show expenses, newest first")
              ls.add_argument("--category")

              sub.add_parser("total", help="show the total for each category")

              done = sub.add_parser("done", help="check in a habit for today")
              done.add_argument("habit")

              sub.add_parser("streaks", help="show your habit streaks")
              return parser


          def run(args: argparse.Namespace, store: JsonStore, today: date) -> None:
              if args.command == "add":
                  e = store.add_expense(args.date or today, parse_amount(args.amount), args.category, args.note)
                  print(f"added #{e.id}: {format_cents(e.cents)} {e.category}")
              elif args.command == "list":
                  for e in store.list_expenses(args.category):
                      print(f"{e.id:>3}  {e.day}  {format_cents(e.cents):>9}  {e.category:<12} {e.note}")
