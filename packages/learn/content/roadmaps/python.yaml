    mistakes:
      - problem:
          en: "Fighting the formatter by hand-formatting code."
          tr: "Kodu elle biçimlendirip formatter ile uğraşmak."
        fix:
          en: "Do not. Run `uv run ruff format .` and accept the result. Style arguments end when a tool decides."
          tr: "Yapma. `uv run ruff format .` çalıştır ve sonucu kabul et. Stil tartışmaları bir araç karar verince biter."
      - problem:
          en: "Silencing mypy with `# type: ignore` everywhere."
          tr: "mypy'ı her yerde `# type: ignore` ile susturmak."
        fix:
          en: "Fix the cause. mypy told you that `lastrowid` can be `None`; the honest answer is to handle that case, as `add_expense` now does."
          tr: "Sebebi düzelt. mypy `lastrowid`'in `None` olabileceğini söyledi; dürüst cevap, `add_expense`'in şimdi yaptığı gibi bu durumu ele almaktır."
      - problem:
          en: "CI fails with \"The lockfile at `uv.lock` needs to be updated\"."
          tr: "CI \"The lockfile at `uv.lock` needs to be updated\" hatasıyla başarısız oluyor."
        fix:
          en: "You changed dependencies without committing the new lock file. Run `uv lock` locally and commit `uv.lock`."
          tr: "Bağımlılıkları değiştirdin ama yeni lock dosyasını commit etmedin. Yerelde `uv lock` çalıştır ve `uv.lock`'u commit et."
    quiz:
      - q:
          en: "What is the job of CI in this project?"
          tr: "Bu projede CI'ın işi nedir?"
        options:
          en: [To publish every commit to TestPyPI, To run lint, types and tests on a clean machine at every push, To replace writing tests]
          tr: [Her commit'i TestPyPI'da yayınlamak, Her push'ta temiz bir makinede lint, tip ve testleri çalıştırmak, Test yazmanın yerini almak]
        answer: 1
        why:
          en: "CI does not replace tests, it runs them every time, on a machine that is not yours, so 'works on my computer' stops being an excuse."
          tr: "CI testlerin yerini almaz, onları her seferinde senin olmayan bir makinede çalıştırır; böylece 'bende çalışıyor' bahanesi biter."
    sources:
      - title: "Ruff documentation"
        url: https://docs.astral.sh/ruff/
