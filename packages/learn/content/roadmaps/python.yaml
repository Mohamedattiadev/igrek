        fix:
          en: "Read it from the environment, as `create_app` does with `TALLY_TOKEN`. If a secret ever reached Git, treat it as public: make a new one, because deleting the commit does not delete the history copies others may hold."
          tr: "`create_app`'in `TALLY_TOKEN` ile yaptığı gibi ortamdan oku. Bir sır Git'e girdiyse onu herkese açık say: yenisini üret, çünkü commit'i silmek başkalarının elindeki geçmiş kopyalarını silmez."
      - problem:
          en: "Comparing tokens with `==`. The comparison stops at the first different character, and the time it takes can leak information."
          tr: "Token'ları `==` ile karşılaştırmak. Karşılaştırma ilk farklı karakterde durur ve süresi bilgi sızdırabilir."
        fix:
          en: "Use `hmac.compare_digest`, which always takes the same time."
          tr: "Her zaman aynı sürede çalışan `hmac.compare_digest` kullan."
      - problem:
          en: "Starting Flask with `debug=True` or `FLASK_DEBUG=1` on a server. The debugger lets visitors run code."
          tr: "Sunucuda Flask'ı `debug=True` ya da `FLASK_DEBUG=1` ile başlatmak. Debugger ziyaretçilerin kod çalıştırmasına izin verir."
        fix:
          en: "Debug mode is for your own computer only. On a server use a production server such as gunicorn (see the deploy step)."
          tr: "Debug modu sadece kendi bilgisayarın içindir. Sunucuda gunicorn gibi bir production sunucusu kullan (deploy adımına bak)."
    quiz:
      - q:
          en: "No TALLY_TOKEN is set and someone calls POST /api/expenses. What should happen?"
          tr: "TALLY_TOKEN ayarlı değil ve biri POST /api/expenses çağırıyor. Ne olmalı?"
        options:
          en: [The expense is saved because there is nothing to check, The request is refused (403) because writing is off without a token, The server crashes]
          tr: [Kontrol edecek bir şey olmadığı için harcama kaydedilir, Token yokken yazma kapalı olduğu için istek reddedilir (403), Sunucu çöker]
        answer: 1
        why:
          en: "Secure by default: a missing setting must close the door, not open it."
          tr: "Varsayılan olarak güvenli: eksik bir ayar kapıyı açmamalı, kapatmalı."
    sources:
      - title: "Flask: security considerations"
        url: https://flask.palletsprojects.com/en/stable/web-security/
      - title: "hmac.compare_digest"
        url: https://docs.python.org/3/library/hmac.html#hmac.compare_digest
      - title: "uv: auditing a project's dependencies"
        url: https://docs.astral.sh/uv/reference/cli/#uv-audit

  - id: faster
    stage: performance
    title:
      en: "Measure first, then speed up: indexes and bulk inserts"
      tr: "Önce ölç, sonra hızlandır: index ve toplu ekleme"
    minutes: 55
    needs: [secure]
    why:
      en: "Programs that feel fine with ten rows can crawl with a million. The rule is: measure, change one thing, measure again. Two changes fix most database slowness: an index for the columns you search, and one transaction for many inserts."
      tr: "On satırla iyi hissettiren programlar bir milyon satırla yavaşlayabilir. Kural şu: ölç, tek şeyi değiştir, tekrar ölç. İki değişiklik veritabanı yavaşlığının çoğunu çözer: arama yaptığın sütunlar için bir index ve çok sayıda ekleme için tek bir transaction."
    learn:
      en: |
        - `time.perf_counter()` measures how long code takes; a benchmark script makes the numbers repeatable
        - An **index** is a sorted lookup table. Without one SQLite reads every row (`SCAN`), with one it jumps to the rows it needs (`SEARCH`)
        - `EXPLAIN QUERY PLAN` shows how SQLite will run a query
        - Every commit waits for the disk, so `executemany` inside one transaction beats many separate inserts
        - Let the database add things up (`SUM ... GROUP BY`) instead of loading every row into Python
        - A profiler shows where time goes. Python 3.15 includes a sampling profiler: `python -m profiling.sampling run script.py`
      tr: |
        - `time.perf_counter()` kodun ne kadar sürdüğünü ölçer; bir benchmark script'i sayıları tekrarlanabilir yapar
        - **Index**, sıralı bir arama tablosudur. Index yokken SQLite her satırı okur (`SCAN`), varken ihtiyacı olan satırlara atlar (`SEARCH`)
        - `EXPLAIN QUERY PLAN` SQLite'ın bir sorguyu nasıl çalıştıracağını gösterir
        - Her commit diskin işini bitirmesini bekler; bu yüzden tek transaction içinde `executemany`, birçok ayrı eklemeden hızlıdır
        - Toplamayı veritabanına yaptır (`SUM ... GROUP BY`), her satırı Python'a yüklemek yerine
        - Profiler zamanın nereye gittiğini gösterir. Python 3.15'te örnekleme yapan bir profiler var: `python -m profiling.sampling run script.py`
    do:
      en: |
        1. Replace `src/tally/sqlstore.py` with the first block. It adds two indexes to the schema and a new `add_many` method.
        2. Create `bench.py` in the project folder (next to `pyproject.toml`) with the second block.
        3. Run `uv run python bench.py`. It builds a database with 200,000 expenses in a temporary folder, so it needs a few seconds and it does not touch your data.
        4. Read the numbers. Your computer will give other numbers, but the order should be the same: `add_many` is far faster per row than one-by-one inserts, SQL totals beat Python totals, and a query with an index takes a fraction of a millisecond while the plan changes from `SCAN` to `SEARCH`.
        5. Optional: run `uv run python -m profiling.sampling run bench.py` to see which function the time went into. This profiler needs Python 3.15.
        6. Replace `tests/test_store.py` with the third block, run `uv run pytest` (42 pass, 1 is skipped on purpose), and commit: `git add .` then `git commit -m "Add indexes and bulk insert"`.
      tr: |
        1. `src/tally/sqlstore.py` dosyasını ilk blokla değiştir. Şemaya iki index ve yeni bir `add_many` metodu ekler.
        2. Proje klasöründe (`pyproject.toml`'un yanında) ikinci blokla `bench.py` oluştur.
        3. `uv run python bench.py` çalıştır. Geçici bir klasörde 200.000 harcamalı bir veritabanı kurar; birkaç saniye sürer ve verine dokunmaz.
        4. Sayıları oku. Bilgisayarın başka sayılar verecek ama sıralama aynı olmalı: `add_many` satır başına tek tek eklemeden çok daha hızlı, SQL toplamı Python toplamını yener ve index'li sorgu milisaniyenin çok küçük bir kısmında biter; plan `SCAN`'den `SEARCH`'e döner.
        5. İsteğe bağlı: zamanın hangi fonksiyona gittiğini görmek için `uv run python -m profiling.sampling run bench.py` çalıştır. Bu profiler Python 3.15 ister.
        6. `tests/test_store.py` dosyasını üçüncü blokla değiştir, `uv run pytest` çalıştır (42 geçer, 1 bilerek atlanır) ve commit et: `git add .` sonra `git commit -m "Add indexes and bulk insert"`.
    code:
      - file: src/tally/sqlstore.py
        lang: python
        text: |
          import os
          import sqlite3
          from datetime import date
          from pathlib import Path

          from .models import Expense

          SCHEMA = """
          CREATE TABLE IF NOT EXISTS expenses (
              id INTEGER PRIMARY KEY,
              day TEXT NOT NULL,
              cents INTEGER NOT NULL CHECK (cents > 0),
              category TEXT NOT NULL,
              note TEXT NOT NULL DEFAULT ''
          );
          CREATE INDEX IF NOT EXISTS expenses_category ON expenses (category);
          CREATE INDEX IF NOT EXISTS expenses_day ON expenses (day, id);
          CREATE TABLE IF NOT EXISTS checkins (
              habit TEXT NOT NULL,
              day TEXT NOT NULL,
              PRIMARY KEY (habit, day)
          );
          """


          def default_db_path() -> Path:
              return Path(os.environ.get("TALLY_DB", Path.home() / ".tally" / "tally.db"))


          class SqliteStore:
              """The same methods as JsonStore, but the data lives in a SQLite database file."""

              def __init__(self, path: Path | str):
                  if str(path) != ":memory:":
                      Path(path).parent.mkdir(parents=True, exist_ok=True)
                  self.db = sqlite3.connect(path)
                  self.db.row_factory = sqlite3.Row
                  self.db.executescript(SCHEMA)

              def close(self) -> None:
                  self.db.close()

              def __enter__(self) -> "SqliteStore":
                  return self

              def __exit__(self, *exc_info) -> None:
                  self.close()

              def add_expense(self, day: date, cents: int, category: str, note: str = "") -> Expense:
                  with self.db:  # commits when the block ends, rolls back on an error
                      cur = self.db.execute(
                          "INSERT INTO expenses (day, cents, category, note) VALUES (?, ?, ?, ?)",
                          (day.isoformat(), cents, category, note),
                      )
                  return Expense(day, cents, category, note, cur.lastrowid)

              def add_many(self, rows: list[tuple[date, int, str, str]]) -> None:
                  """Insert many expenses in one transaction. Much faster than calling add_expense in a loop."""
                  with self.db:
                      self.db.executemany(
                          "INSERT INTO expenses (day, cents, category, note) VALUES (?, ?, ?, ?)",
                          [(d.isoformat(), cents, category, note) for d, cents, category, note in rows],
                      )

              def list_expenses(self, category: str | None = None, limit: int | None = None) -> list[Expense]:
                  sql = "SELECT id, day, cents, category, note FROM expenses"
                  params: list = []
                  if category is not None:
                      sql += " WHERE category = ?"
                      params.append(category)
                  sql += " ORDER BY day DESC, id DESC"
                  if limit is not None:
                      sql += " LIMIT ?"
                      params.append(limit)
                  rows = self.db.execute(sql, params).fetchall()
                  return [Expense(date.fromisoformat(r["day"]), r["cents"], r["category"], r["note"], r["id"]) for r in rows]

              def totals_by_category(self) -> dict[str, int]:
                  rows = self.db.execute("SELECT category, SUM(cents) AS cents FROM expenses GROUP BY category")
                  return {r["category"]: r["cents"] for r in rows}

              def check_in(self, habit: str, day: date) -> bool:
                  with self.db:
                      cur = self.db.execute(
                          "INSERT OR IGNORE INTO checkins (habit, day) VALUES (?, ?)", (habit, day.isoformat())
                      )
                  return cur.rowcount == 1

              def habit_days(self) -> dict[str, set[date]]:
                  habits: dict[str, set[date]] = {}
                  for r in self.db.execute("SELECT habit, day FROM checkins"):
                      habits.setdefault(r["habit"], set()).add(date.fromisoformat(r["day"]))
                  return habits
      - file: bench.py
        lang: python
        text: |
          """Measure how fast the store is. Run with: uv run python bench.py"""
          import tempfile
          import time
          from datetime import date, timedelta
          from pathlib import Path

          from tally.sqlstore import SqliteStore


          def timed(label, func):
              start = time.perf_counter()
              result = func()
              print(f"{label:<28} {(time.perf_counter() - start) * 1000:8.1f} ms")
              return result


          with tempfile.TemporaryDirectory() as tmp, SqliteStore(Path(tmp) / "bench.db") as store:
              first = date(2020, 1, 1)
              rows = [(first + timedelta(days=i % 2000), 100 + i % 900, f"cat{i % 500}", "") for i in range(200_000)]
              timed("insert 300 (one by one)", lambda: [store.add_expense(*r) for r in rows[:300]])
              timed("insert 199700 (add_many)", lambda: store.add_many(rows[300:]))
              timed("totals in SQL", store.totals_by_category)
              timed("totals in Python", lambda: sum(e.cents for e in store.list_expenses()))

              query = "SELECT COUNT(*) FROM expenses WHERE category = ?"

              def count_one_category():
                  return store.db.execute(query, ("cat42",)).fetchone()[0]

              def plan():
                  return store.db.execute("EXPLAIN QUERY PLAN " + query, ("cat42",)).fetchone()["detail"]

              store.db.execute("DROP INDEX expenses_category")
              timed("count a category, no index", count_one_category)
              print("  plan:", plan())
              store.db.execute("CREATE INDEX expenses_category ON expenses (category)")
              timed("count a category, index", count_one_category)
              print("  plan:", plan())
      - file: tests/test_store.py
        lang: python
        text: |
          from datetime import date

          import pytest

          from tally.jsonstore import JsonStore
          from tally.sqlstore import SqliteStore


          @pytest.fixture(params=["json", "sqlite"])
          def store(request, tmp_path):
              """Run every test against both stores: they must behave the same."""
              if request.param == "json":
                  yield JsonStore(tmp_path / "data.json")
              else:
                  with SqliteStore(tmp_path / "data.db") as s:
                      yield s


          def test_add_and_list_newest_first(store):
              store.add_expense(date(2026, 10, 15), 450, "coffee", "flat white")
              store.add_expense(date(2026, 10, 16), 1200, "food")
              assert [e.cents for e in store.list_expenses()] == [1200, 450]
              assert [e.id for e in store.list_expenses()] == [2, 1]


          def test_filter_and_limit(store):
              store.add_expense(date(2026, 10, 15), 100, "a")
              store.add_expense(date(2026, 10, 16), 200, "b")
              store.add_expense(date(2026, 10, 17), 300, "a")
              assert [e.cents for e in store.list_expenses("a")] == [300, 100]
              assert [e.cents for e in store.list_expenses(limit=1)] == [300]


          def test_totals(store):
              store.add_expense(date(2026, 10, 15), 450, "coffee")
              store.add_expense(date(2026, 10, 16), 320, "coffee")
              store.add_expense(date(2026, 10, 16), 1200, "food")
              assert store.totals_by_category() == {"coffee": 770, "food": 1200}


          def test_check_in_twice_is_ignored(store):
              assert store.check_in("run", date(2026, 10, 17)) is True
              assert store.check_in("run", date(2026, 10, 17)) is False
              assert store.habit_days() == {"run": {date(2026, 10, 17)}}


          def test_unicode_survives(store):
              store.add_expense(date(2026, 10, 17), 100, "çay", "İstanbul şeker")
              assert store.list_expenses()[0].note == "İstanbul şeker"


          def test_sql_injection_text_is_just_text(tmp_path):
              evil = "x'); DROP TABLE expenses;--"
              with SqliteStore(tmp_path / "data.db") as s:
                  s.add_expense(date(2026, 10, 17), 100, evil)
                  assert s.list_expenses()[0].category == evil


          def test_add_many(store):
              if not hasattr(store, "add_many"):
                  pytest.skip("only the SQLite store has add_many")
              store.add_many([(date(2026, 10, 1), 100, "a", ""), (date(2026, 10, 2), 200, "a", "x")])
              assert store.totals_by_category() == {"a": 300}
      - file: terminal
        lang: sh
        text: |
          uv run python bench.py
          uv run python -m profiling.sampling run bench.py
    mistakes:
      - problem:
          en: "Optimizing by guessing. Rewriting code that was never the slow part."
          tr: "Tahminle optimize etmek. Hiç yavaş olmayan kısmı yeniden yazmak."
        fix:
          en: "Measure first. A benchmark or profiler shows the real slow spot, and it is often one query or one loop."
          tr: "Önce ölç. Bir benchmark ya da profiler gerçek yavaş noktayı gösterir; çoğu zaman tek bir sorgu ya da döngüdür."
      - problem:
          en: "Adding an index on every column."
          tr: "Her sütuna index eklemek."
        fix:
          en: "Each index makes writes slower and the file bigger. Index only the columns you filter or sort by often. Check the plan with `EXPLAIN QUERY PLAN`."
          tr: "Her index yazmayı yavaşlatır ve dosyayı büyütür. Sadece sık süzdüğün ya da sıraladığın sütunlara index koy. Planı `EXPLAIN QUERY PLAN` ile kontrol et."
    quiz:
      - q:
          en: "Why is add_many so much faster than calling add_expense in a loop?"
          tr: "add_many neden döngüde add_expense çağırmaktan çok daha hızlı?"
        options:
          en: [It uses a faster programming language, It saves everything in one transaction so the disk is waited for once, It skips the CHECK rule]
          tr: [Daha hızlı bir programlama dili kullanır, Hepsini tek transaction'da kaydeder ve disk için bir kez beklenir, CHECK kuralını atlar]
        answer: 1
        why:
          en: "Each commit waits until the data is safely on the disk. One commit for 200,000 rows costs far less than 200,000 commits."
          tr: "Her commit verinin diskte güvenle durmasını bekler. 200.000 satır için tek commit, 200.000 commit'ten çok daha ucuzdur."
    sources:
      - title: "SQLite: query planning and EXPLAIN QUERY PLAN"
        url: https://www.sqlite.org/eqp.html
      - title: "SQLite: query optimizer overview"
        url: https://www.sqlite.org/optoverview.html
      - title: "profiling.sampling: statistical sampling profiler"
        url: https://docs.python.org/3/library/profiling.sampling.html

  - id: package
    stage: packaging
    title:
      en: "Package tally with pyproject.toml"
      tr: "Tally'yi pyproject.toml ile paketleme"
    minutes: 50
    needs: [faster]
    why:
      en: "Right now tally only runs inside your project folder. Packaging turns it into a file anyone can install with one command (`pip install`, `uv tool install`). `pyproject.toml` is the single file that describes the name, version, Python versions, dependencies and commands of your package."
      tr: "Şu an tally sadece proje klasörünün içinde çalışıyor. Paketleme onu herkesin tek komutla (`pip install`, `uv tool install`) kurabileceği bir dosyaya çevirir. `pyproject.toml`, paketinin adını, sürümünü, Python sürümlerini, bağımlılıklarını ve komutlarını anlatan tek dosyadır."
    learn:
      en: |
        - The difference between the **distribution name** (what you `pip install`) and the **import name** (what you `import`): here `tally-tracker-demo` and `tally`
        - `requires-python = ">=3.12"` says which Pythons can run the package. Pinning your own development Python to 3.15 in `.python-version` is separate
        - `[project.optional-dependencies]` are extras (`pip install "tally-tracker-demo[web]"`); `[dependency-groups]` are only for developers
        - A **wheel** (`.whl`) is the ready-to-install file, an **sdist** (`.tar.gz`) is the source
        - `uv.lock` pins every package version exactly, so everyone gets the same setup
      tr: |
        - **Dağıtım adı** (`pip install` yazdığın) ile **import adı** (`import` yazdığın) arasındaki fark: burada `tally-tracker-demo` ve `tally`
        - `requires-python = ">=3.12"` paketi hangi Python'ların çalıştırabileceğini söyler. Kendi geliştirme Python'unu `.python-version` ile 3.15'e sabitlemek ayrı bir şeydir
        - `[project.optional-dependencies]` ek paketlerdir (`pip install "tally-tracker-demo[web]"`); `[dependency-groups]` sadece geliştiriciler içindir
        - **Wheel** (`.whl`) kurmaya hazır dosyadır, **sdist** (`.tar.gz`) kaynak koddur
        - `uv.lock` her paketin sürümünü tam olarak sabitler; böylece herkes aynı kurulumu alır
    do:
      en: |
        1. Replace `pyproject.toml` with the first block. Put your own name and e-mail in `authors`. It sets a new distribution name, lowers `requires-python` to 3.12 and points the build at the `tally` folder with `module-name`.
        2. Create `README.md` with the second block. It becomes the description page of the package.
        3. Run `uv lock` and then `uv build`. A `dist` folder appears with a `.whl` and a `.tar.gz` file. (`dist/` is already in `.gitignore`.)
        4. Look inside the wheel with the zipfile command. You should see the files of the `tally` package and an entry-points file, but no tests and no `.venv`.
        5. Test the built file as a stranger would: run `tally` from the wheel in a throw-away environment with `uvx`. It prints the help text.
        6. Optional: check that the tests also pass on the oldest Python you claim to support. `uv run --python 3.12 --all-extras pytest` rebuilds `.venv` for 3.12; run a plain `uv run pytest` afterwards to go back to 3.15.
        7. Commit, including `uv.lock`: `git add .` then `git commit -m "Package tally"`.
      tr: |
        1. `pyproject.toml` dosyasını ilk blokla değiştir. `authors` kısmına kendi adını ve e-postanı yaz. Yeni bir dağıtım adı verir, `requires-python`'ı 3.12'ye indirir ve `module-name` ile build'i `tally` klasörüne yönlendirir.
        2. İkinci blokla `README.md` oluştur. Paketin açıklama sayfası olur.
        3. `uv lock` sonra `uv build` çalıştır. `dist` klasöründe bir `.whl` ve bir `.tar.gz` dosyası belirir. (`dist/` zaten `.gitignore` içinde.)
        4. Wheel'in içine zipfile komutuyla bak. `tally` paketinin dosyalarını ve bir entry-points dosyasını görmelisin; testler ve `.venv` olmamalı.
        5. Oluşan dosyayı bir yabancı gibi dene: `uvx` ile wheel içindeki `tally`'yi atılabilir bir ortamda çalıştır. Yardım metnini yazar.
        6. İsteğe bağlı: testlerin desteklediğini söylediğin en eski Python'da da geçtiğini kontrol et. `uv run --python 3.12 --all-extras pytest` `.venv`'i 3.12 için yeniden kurar; sonra 3.15'e dönmek için düz `uv run pytest` çalıştır.
        7. `uv.lock` dahil commit et: `git add .` sonra `git commit -m "Package tally"`.
    code:
      - file: pyproject.toml
        lang: toml
        text: |
          [project]
          name = "tally-tracker-demo"
          version = "0.1.0"
          description = "Track your expenses and habits from the command line."
          readme = "README.md"
          license = "MIT"
          authors = [{ name = "Your Name", email = "you@example.com" }]
          requires-python = ">=3.12"
          keywords = ["expenses", "habits", "cli"]
          classifiers = [
              "Environment :: Console",
              "Programming Language :: Python :: 3",
          ]
          dependencies = []

          [project.optional-dependencies]
          web = ["flask>=3.1"]

          [project.scripts]
          tally = "tally:main"

          [build-system]
          requires = ["uv_build>=0.12.3,<0.13.0"]
          build-backend = "uv_build"

          [tool.uv.build-backend]
          module-name = "tally"

          [dependency-groups]
          dev = ["pytest>=9.1.1"]
      - file: README.md
        lang: markdown
        text: |
          # Tally

          Track your expenses and habits from the command line.

          ```
          tally add 4.50 coffee "flat white"
          tally list
          tally total
          tally done run
          tally streaks
          ```

          Install the tiny web page and API too: `pip install "tally-tracker-demo[web]"`.
      - file: terminal
        lang: sh
        text: |
          uv lock
          uv build
          uv run python -m zipfile -l dist/tally_tracker_demo-0.1.0-py3-none-any.whl
          uvx --from dist/tally_tracker_demo-0.1.0-py3-none-any.whl tally --help
    mistakes:
      - problem:
          en: "The build fails or the wheel is empty because the folder name does not match the package name."
          tr: "Klasör adı paket adıyla uyuşmadığı için build başarısız oluyor ya da wheel boş çıkıyor."
        fix:
          en: "uv's build tool looks for a folder named like the distribution name. Because the name is `tally-tracker-demo` but the folder is `src/tally`, the line `module-name = \"tally\"` under `[tool.uv.build-backend]` is needed."
          tr: "uv'nin build aracı dağıtım adına benzer adlı bir klasör arar. Ad `tally-tracker-demo` ama klasör `src/tally` olduğu için `[tool.uv.build-backend]` altındaki `module-name = \"tally\"` satırı gerekli."
      - problem:
          en: "Setting `requires-python` to the newest Python only because that is what you use."
          tr: "`requires-python`'ı sadece sen onu kullanıyorsun diye en yeni Python'a ayarlamak."
        fix:
          en: "Set the oldest version your code really works on and test it. tally uses nothing newer than 3.12, so `>=3.12` lets many more people install it."
          tr: "Kodunun gerçekten çalıştığı en eski sürümü yaz ve onu test et. Tally 3.12'den yeni bir şey kullanmıyor; `>=3.12` yazmak çok daha fazla kişinin kurmasını sağlar."
      - problem:
          en: "Forgetting to commit `uv.lock`."
          tr: "`uv.lock` dosyasını commit etmeyi unutmak."
        fix:
          en: "Commit it. Without it every machine may resolve slightly different package versions, and a bug appears only on one of them."
          tr: "Commit et. Olmazsa her makine biraz farklı paket sürümleri seçebilir ve bir bug sadece birinde çıkar."
    quiz:
      - q:
          en: "For tally-tracker-demo, what do you type after pip install and what do you type after import?"
          tr: "tally-tracker-demo için pip install'dan sonra ne yazarsın, import'tan sonra ne?"
        options:
          en: ["tally-tracker-demo and then tally", "tally and then tally-tracker-demo", "tally-tracker-demo both times"]
          tr: ["tally-tracker-demo ve sonra tally", "tally ve sonra tally-tracker-demo", "İkisinde de tally-tracker-demo"]
        answer: 0
        why:
          en: "The distribution name (on the package index) and the import name (the folder of Python code) are two different names. Hyphens are not allowed in an import name."
          tr: "Dağıtım adı (paket indeksinde) ile import adı (Python kod klasörü) iki ayrı addır. Import adında tire kullanılamaz."
    sources:
      - title: "Writing your pyproject.toml"
        url: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
      - title: "uv: build backend"
        url: https://docs.astral.sh/uv/concepts/build-backend/
      - title: "uv: building and publishing a package"
        url: https://docs.astral.sh/uv/guides/package/

  - id: publish
    stage: deploy
    title:
      en: "Share tally for free: GitHub and TestPyPI"
      tr: "Tally'yi ücretsiz paylaşma: GitHub ve TestPyPI"
    minutes: 60
    needs: [package]
    why:
      en: "Code on your laptop helps nobody. Pushing it to GitHub gives you a backup and a history others can read. Publishing the package to TestPyPI, the practice copy of the Python Package Index, lets you do the full release flow for free and without risk, so the first real release is no surprise."
      tr: "Dizüstü bilgisayarındaki kod kimseye yardım etmez. GitHub'a göndermek sana bir yedek ve başkalarının okuyabileceği bir geçmiş verir. Paketi Python Package Index'in deneme kopyası olan TestPyPI'da yayınlamak, tam sürüm çıkarma akışını ücretsiz ve risksiz yapmanı sağlar; böylece ilk gerçek sürüm sürpriz olmaz."
    learn:
      en: |
        - A Git **remote** is a copy of your repository on a server; `git push` sends your commits there
        - **TestPyPI** (test.pypi.org) is a separate practice index with its own accounts. Its data may be wiped from time to time
        - An **API token** is a password that can only upload packages. Keep it in an environment variable, never in a file you commit
        - A version number can be uploaded only once. To fix something you publish a new version (`0.1.1`)
        - Optional free hosting: a web service such as Render can run the Flask part with `gunicorn`
      tr: |
        - Git **remote**, deponun sunucudaki bir kopyasıdır; `git push` commit'lerini oraya gönderir
        - **TestPyPI** (test.pypi.org) kendi hesapları olan ayrı bir deneme indeksidir. Verisi zaman zaman silinebilir
        - **API token**, sadece paket yükleyebilen bir paroladır. Onu ortam değişkeninde tut, commit ettiğin bir dosyada asla
        - Bir sürüm numarası sadece bir kez yüklenebilir. Bir şeyi düzeltmek için yeni sürüm (`0.1.1`) yayınlarsın
        - İsteğe bağlı ücretsiz hosting: Render gibi bir web servisi Flask kısmını `gunicorn` ile çalıştırabilir
    do:
      en: |
        1. On github.com create an account and a new **empty** repository called `tally` (no README, no license, because you already have files). Then connect and push, using the commands in the first block with your own user name.
        2. Create an account on https://test.pypi.org/account/register/. It is separate from the real PyPI. Turn on two-factor authentication in the account settings, because uploads require it.
        3. In *Account settings → API tokens* create a token. For the very first upload choose the scope "Entire account" (a project-only token is possible after the project exists). Copy it now, it is shown once.
        4. Choose a name nobody uses yet: in `pyproject.toml` change `name = "tally-tracker-demo"` to `tally-tracker-` plus your user name (lowercase letters, digits and hyphens). Keep `module-name = "tally"`. Fix the same name in the install line of `README.md`.
        5. Add the index block (second code block) to the end of `pyproject.toml`. It gives TestPyPI the short name `testpypi`.
        6. Build and publish. Put the token in an environment variable so it never lands in your shell history or files, then run the commands in the third block (macOS and Linux shown; in PowerShell use `$env:UV_PUBLISH_TOKEN="..."`).
        7. Open https://test.pypi.org/project/ plus your package name. Wait a minute if it is not there yet.
        8. Install it as a stranger would, in an empty environment (fourth block, with your own package name). Then add an expense with the installed `tally`.
        9. To publish a fix later: `uv version --bump patch`, delete the old files in `dist/` (publishing uploads everything in that folder), build again and publish again.
        10. Optional free host for the web part (not needed for this step): see the last block.
      tr: |
        1. github.com'da bir hesap aç ve `tally` adında yeni, **boş** bir depo oluştur (README yok, lisans yok; çünkü dosyaların zaten var). Sonra ilk bloktaki komutlarla kendi kullanıcı adınla bağla ve gönder (push).
        2. https://test.pypi.org/account/register/ adresinde bir hesap aç. Gerçek PyPI'dan ayrıdır. Yüklemeler için gerekli olduğundan hesap ayarlarında iki adımlı doğrulamayı aç.
        3. *Account settings → API tokens* bölümünde bir token oluştur. İlk yükleme için "Entire account" kapsamını seç (proje oluştuktan sonra sadece projeye özel token mümkün). Şimdi kopyala, bir kez gösterilir.
        4. Kimsenin kullanmadığı bir ad seç: `pyproject.toml` içinde `name = "tally-tracker-demo"` satırını `tally-tracker-` ve kullanıcı adın olacak şekilde değiştir (küçük harf, rakam ve tire). `module-name = "tally"` kalsın. `README.md` içindeki kurulum satırındaki adı da düzelt.
        5. İndeks bloğunu (ikinci kod bloğu) `pyproject.toml` sonuna ekle. TestPyPI'a `testpypi` kısa adını verir.
        6. Build et ve yayınla. Token shell geçmişine ya da dosyalara düşmesin diye bir ortam değişkenine koy, sonra üçüncü bloktaki komutları çalıştır (macOS ve Linux gösterildi; PowerShell'de `$env:UV_PUBLISH_TOKEN="..."` kullan).
        7. https://test.pypi.org/project/ adresine paket adını ekleyerek aç. Henüz yoksa bir dakika bekle.
        8. Bir yabancı gibi boş bir ortamda kur (dördüncü blok, kendi paket adınla). Sonra kurduğun `tally` ile bir harcama ekle.
        9. Sonra bir düzeltme yayınlamak için: `uv version --bump patch`, `dist/` içindeki eski dosyaları sil (yayınlama o klasördeki her şeyi yükler), tekrar build et ve tekrar yayınla.
        10. Web kısmı için isteğe bağlı ücretsiz host (bu adım için gerekmez): son bloğa bak.
    code:
      - file: terminal
        lang: sh
        text: |
          git branch -M main
          git remote add origin https://github.com/YOUR-USER/tally.git
          git push -u origin main
      - file: pyproject.toml
        lang: toml
        text: |
          [[tool.uv.index]]
          name = "testpypi"
          url = "https://test.pypi.org/simple/"
          publish-url = "https://test.pypi.org/legacy/"
          explicit = true
      - file: terminal
        lang: sh
        text: |
          export UV_PUBLISH_TOKEN=paste-your-testpypi-token-here
          uv build --no-sources
          uv publish --index testpypi
      - file: terminal
        lang: sh
        text: |
          python3 -m venv /tmp/try-tally
          /tmp/try-tally/bin/python -m pip install --index-url https://test.pypi.org/simple/ tally-tracker-YOUR-USER
          /tmp/try-tally/bin/tally add 3 tea
          /tmp/try-tally/bin/tally list
      - file: terminal
        lang: sh
        text: |
          # Optional: run the web part on a free host such as Render.
          # 1) Add the production server to the web extra:
          uv add --optional web gunicorn
          # 2) Try it locally first:
          TALLY_TOKEN=secret uv run --extra web gunicorn "tally.web:create_app()"
          # 3) On Render create a Web Service from your GitHub repo with:
          #    Build command:  pip install ".[web]"
          #    Start command:  gunicorn "tally.web:create_app()"
          #    Environment:    TALLY_TOKEN (a long random value) and TALLY_DB=/tmp/tally.db
          # The free plan wipes local files on every restart, so treat the data as a demo.
    mistakes:
      - problem:
          en: "\"403 Invalid or non-existent authentication information\" when publishing."
          tr: "Yayınlarken \"403 Invalid or non-existent authentication information\" hatası."
        fix:
          en: "The token is for the wrong site or was copied wrongly. A TestPyPI token only works on test.pypi.org. Make sure `UV_PUBLISH_TOKEN` holds the whole token, including the `pypi-` start, and that you used `--index testpypi`."
          tr: "Token yanlış site için ya da yanlış kopyalanmış. TestPyPI token'ı sadece test.pypi.org'da çalışır. `UV_PUBLISH_TOKEN` içinde token'ın tamamının, `pypi-` başlangıcı dahil, olduğundan ve `--index testpypi` kullandığından emin ol."
      - problem:
          en: "\"File already exists\" or \"name is already taken\"."
          tr: "\"File already exists\" ya da \"name is already taken\"."
        fix:
          en: "A version can be uploaded only once, and a name belongs to its first owner. Bump the version for a fix, or choose a more unique name."
          tr: "Bir sürüm sadece bir kez yüklenebilir ve bir ad ilk sahibine aittir. Düzeltme için sürümü artır ya da daha benzersiz bir ad seç."
      - problem:
          en: "Committing the token, or pasting it into the code to \"make it easier\"."
          tr: "Token'ı commit etmek ya da \"kolay olsun\" diye koda yapıştırmak."
        fix:
          en: "Keep it in an environment variable only. If it leaks, delete it in the account settings and create a new one right away."
          tr: "Sadece ortam değişkeninde tut. Sızarsa hesap ayarlarından sil ve hemen yenisini oluştur."
    quiz:
      - q:
          en: "You published version 0.1.0 and found a typo in the README. What do you do?"
          tr: "0.1.0 sürümünü yayınladın ve README'de bir yazım hatası buldun. Ne yaparsın?"
        options:
          en: [Upload 0.1.0 again with the fix, Bump the version to 0.1.1 and publish that, Delete the whole GitHub repository]
          tr: [Düzeltmeyle 0.1.0'ı tekrar yüklerim, Sürümü 0.1.1'e çıkarıp onu yayınlarım, GitHub deposunun tamamını silerim]
        answer: 1
        why:
          en: "Package indexes never allow the same version twice, so everybody who installed 0.1.0 still gets exactly the same files."
          tr: "Paket indeksleri aynı sürümü ikinci kez kabul etmez; böylece 0.1.0'ı kuran herkes hep aynı dosyaları alır."
    sources:
      - title: "Using TestPyPI"
        url: https://packaging.python.org/en/latest/guides/using-testpypi/
      - title: "uv: publishing your package"
        url: https://docs.astral.sh/uv/guides/package/#publishing-your-package
      - title: "Render: deploy a Flask app"
        url: https://render.com/docs/deploy-flask

  - id: watch
    stage: monitoring
    title:
      en: "Logging, a health check and error handling"
      tr: "Loglama, health check ve hata yönetimi"
    minutes: 55
    needs: [publish]
    why:
      en: "When a program runs where you cannot watch it, the logs are your eyes. A health endpoint lets a service (or you) ask 'are you alive?', and a clean error handler makes sure a crash writes the details into the log while the visitor only sees a short message."
      tr: "Bir program onu izleyemediğin yerde çalışırken loglar senin gözlerindir. Health endpoint'i bir servisin (ya da senin) 'yaşıyor musun?' diye sormasını sağlar; düzgün bir hata yakalayıcı da çökme olduğunda ayrıntıları loga yazar, ziyaretçiye sadece kısa bir mesaj gösterir."
    learn:
      en: |
        - The `logging` module: levels (`DEBUG`, `INFO`, `WARNING`, `ERROR`), one logger per module (`logging.getLogger(__name__)`), and a format with time and level
        - Why `log.info("expense added: id=%s", e.id)` uses `%s` instead of an f-string
        - `log.exception(...)` inside an `except` writes the full traceback
        - A health endpoint: it checks the one thing that must work (the database) and answers `200` or `503`
        - Never show internal error details to visitors, and never write secrets (tokens) to the log
        - Environment variable `TALLY_LOG_LEVEL` changes how talkative the program is without changing code
      tr: |
        - `logging` modülü: seviyeler (`DEBUG`, `INFO`, `WARNING`, `ERROR`), modül başına bir logger (`logging.getLogger(__name__)`), zaman ve seviye içeren bir format
        - `log.info("expense added: id=%s", e.id)` neden f-string yerine `%s` kullanır
        - Bir `except` içindeki `log.exception(...)` tam traceback'i yazar
        - Health endpoint: çalışması gereken tek şeyi (veritabanını) kontrol eder ve `200` ya da `503` döner
        - Ziyaretçilere asla iç hata ayrıntılarını gösterme ve loga asla sırları (token) yazma
        - `TALLY_LOG_LEVEL` ortam değişkeni, kodu değiştirmeden programın ne kadar konuşkan olacağını belirler
    do:
      en: |
        1. Create `src/tally/log.py` with the first block. One function sets the format and the level for the whole program.
        2. Replace `src/tally/cli.py` and `src/tally/web.py` with the next blocks. The command line gets `-v` for debug messages. The web app logs added expenses and slow requests, answers `/health`, and turns unexpected crashes into a short JSON error while the traceback goes to the log.
        3. Replace `tests/test_web.py` with the last block and run `uv run pytest`. All 46 tests pass (1 is skipped on purpose).
        4. Try `uv run tally -v list` and read the debug line on stderr.
        5. Start the web server (as in the web step), call `curl -i http://127.0.0.1:5001/health`, then add an expense with your token and watch the log line appear in the server terminal.
        6. Commit: `git add .` then `git commit -m "Add logging and a health check"`.
        7. Free uptime checks: a monitoring service can call `/health` every few minutes and e-mail you when it fails. This is optional and not needed to follow along.
      tr: |
        1. İlk blokla `src/tally/log.py` dosyasını oluştur. Tek bir fonksiyon bütün program için formatı ve seviyeyi ayarlar.
        2. `src/tally/cli.py` ve `src/tally/web.py` dosyalarını sonraki bloklarla değiştir. Komut satırı debug mesajları için `-v` kazanır. Web uygulaması eklenen harcamaları ve yavaş istekleri loglar, `/health` yanıtlar ve beklenmeyen çökmeleri kısa bir JSON hatasına çevirir; traceback loga gider.
        3. `tests/test_web.py` dosyasını son blokla değiştir ve `uv run pytest` çalıştır. 46 testin hepsi geçer (1 tanesi bilerek atlanır).
        4. `uv run tally -v list` dene ve stderr'deki debug satırını oku.
        5. Web sunucusunu başlat (web adımındaki gibi), `curl -i http://127.0.0.1:5001/health` çağır, sonra token'ınla bir harcama ekle ve sunucu terminalinde log satırının belirmesini izle.
        6. Commit et: `git add .` sonra `git commit -m "Add logging and a health check"`.
        7. Ücretsiz uptime kontrolleri: bir izleme servisi `/health`'i birkaç dakikada bir çağırıp hata verince sana e-posta atabilir. İsteğe bağlı; takip etmek için gerekmez.
    code:
      - file: src/tally/log.py
        lang: python
        text: |
          import logging
          import os
          import sys


          def setup_logging(level: int | str | None = None) -> None:
              """Send log lines to stderr. The level can be set with TALLY_LOG_LEVEL (DEBUG, INFO, WARNING, ERROR)."""
              level = level or os.environ.get("TALLY_LOG_LEVEL", "WARNING")
              logging.basicConfig(
                  level=level,
                  stream=sys.stderr,
                  format="%(asctime)s %(levelname)s %(name)s: %(message)s",
              )
      - file: src/tally/cli.py
        lang: python
        text: |
          import argparse
          import logging
          import sys
          from datetime import date
          from pathlib import Path

          from .habits import current_streak
          from .jsonstore import JsonStore
          from .log import setup_logging
          from .models import TallyError, clean_expense_text, format_cents, parse_amount
          from .sqlstore import SqliteStore, default_db_path

          log = logging.getLogger(__name__)


          def db_path(option: Path | None) -> Path:
              return option or default_db_path()


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(prog="tally", description="Track your expenses and habits.")
              parser.add_argument("--db", type=Path, help="database file (default: ~/.tally/tally.db)")
              parser.add_argument("-v", "--verbose", action="store_true", help="print debug messages to stderr")
              sub = parser.add_subparsers(dest="command", required=True)

              add = sub.add_parser("add", help="record an expense")
              add.add_argument("amount", help="for example 4.50")
              add.add_argument("category", help="for example coffee")
              add.add_argument("note", nargs="?", default="")
              add.add_argument("--date", type=date.fromisoformat, help="YYYY-MM-DD (default: today)")

              ls = sub.add_parser("list", help="show expenses, newest first")
              ls.add_argument("--category")

              sub.add_parser("total", help="show the total for each category")

              done = sub.add_parser("done", help="check in a habit for today")
              done.add_argument("habit")

              sub.add_parser("streaks", help="show your habit streaks")

              imp = sub.add_parser("import-json", help="copy the data of an old JSON file into the database")
              imp.add_argument("file", type=Path)
              return parser


          def run(args: argparse.Namespace, store: SqliteStore, today: date) -> None:
              if args.command == "add":
                  category, note = clean_expense_text(args.category, args.note)
                  e = store.add_expense(args.date or today, parse_amount(args.amount), category, note)
                  print(f"added #{e.id}: {format_cents(e.cents)} {e.category}")
              elif args.command == "list":
                  for e in store.list_expenses(args.category):
                      print(f"{e.id:>3}  {e.day}  {format_cents(e.cents):>9}  {e.category:<12} {e.note}")
              elif args.command == "total":
                  totals = store.totals_by_category()
                  for category, cents in sorted(totals.items()):
                      print(f"{category:<12} {format_cents(cents):>9}")
                  print(f"{'all':<12} {format_cents(sum(totals.values())):>9}")
              elif args.command == "done":
                  if store.check_in(args.habit, today):
                      print(f"{args.habit}: done for {today}")
                  else:
                      print(f"{args.habit}: already done today")
              elif args.command == "streaks":
                  for habit, days in sorted(store.habit_days().items()):
                      print(f"{habit:<12} {current_streak(days, today)} day(s)")
              elif args.command == "import-json":
                  old = JsonStore(args.file)
                  for e in reversed(old.list_expenses()):  # oldest first
                      store.add_expense(e.day, e.cents, e.category, e.note)
                  for habit, days in old.habit_days().items():
                      for day in sorted(days):
                          store.check_in(habit, day)
                  print(f"imported from {args.file}")


          def main(argv: list[str] | None = None) -> int:
              args = build_parser().parse_args(argv)
              setup_logging("DEBUG" if args.verbose else None)
              try:
                  log.debug("using database %s", db_path(args.db))
                  with SqliteStore(db_path(args.db)) as store:
                      run(args, store, date.today())
              except TallyError as err:
                  print(f"error: {err}", file=sys.stderr)
                  return 1
              return 0
      - file: src/tally/web.py
        lang: python
        text: |
          import hmac
          import logging
          import os
          import time
          from datetime import date
          from pathlib import Path

          from flask import Flask, abort, g, jsonify, make_response, render_template_string, request
          from werkzeug.exceptions import HTTPException

          from .log import setup_logging
          from .models import Expense, TallyError, clean_expense_text, format_cents, parse_amount
          from .sqlstore import SqliteStore, default_db_path
          log = logging.getLogger(__name__)

          PAGE = """<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Tally</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
              td, th { padding: 0.25rem 0.75rem; text-align: left; }
            </style>
          </head>
          <body>
            <h1>Tally</h1>
            <h2>Totals</h2>
            <table>
              {% for category, amount in totals %}
              <tr><td>{{ category }}</td><td>{{ amount }}</td></tr>
              {% else %}
              <tr><td>No expenses yet.</td></tr>
              {% endfor %}
            </table>
            <h2>Latest</h2>
            <table>
              {% for e in latest %}
              <tr><td>{{ e.date }}</td><td>{{ e.amount }}</td><td>{{ e.category }}</td><td>{{ e.note }}</td></tr>
              {% endfor %}
            </table>
          </body>
          </html>
          """


          def expense_json(e: Expense) -> dict:
              return {
                  "id": e.id,
                  "date": e.day.isoformat(),
                  "amount": format_cents(e.cents),
                  "category": e.category,
                  "note": e.note,
              }


          def create_app(db_path: Path | None = None, token: str | None = None) -> Flask:
              setup_logging(os.environ.get("TALLY_LOG_LEVEL", "INFO"))
              app = Flask(__name__)
              app.config["SLOW_MS"] = 500
              app.config["DB_PATH"] = db_path or default_db_path()
              app.config["TOKEN"] = os.environ.get("TALLY_TOKEN", "") if token is None else token
              app.config["MAX_CONTENT_LENGTH"] = 16_000  # refuse bigger request bodies

              def store() -> SqliteStore:
                  if "store" not in g:  # one connection per request
                      g.store = SqliteStore(app.config["DB_PATH"])
                  return g.store

              @app.teardown_appcontext
              def close_store(_error) -> None:
                  s = g.pop("store", None)
                  if s is not None:
                      s.close()

              def require_token() -> None:
                  expected = app.config["TOKEN"]
                  if not expected:  # no token set: nobody may write
                      abort(make_response(jsonify(error="writing is off: set the TALLY_TOKEN variable"), 403))
                  given = request.headers.get("Authorization", "")
                  if not hmac.compare_digest(given.encode(), f"Bearer {expected}".encode()):
                      abort(make_response(jsonify(error="missing or wrong token"), 401))

              @app.before_request
              def start_timer() -> None:
                  g.started = time.perf_counter()

              @app.after_request
              def log_slow_requests(response):
                  ms = (time.perf_counter() - g.get("started", time.perf_counter())) * 1000
                  if ms >= app.config["SLOW_MS"]:
                      log.warning("slow request: %s %s took %.0f ms", request.method, request.path, ms)
                  return response

              @app.errorhandler(Exception)
              def crash(err: Exception):
                  if isinstance(err, HTTPException):  # 404, 413 ... keep their normal answer
                      return err
                  log.exception("unhandled error on %s %s", request.method, request.path)
                  return jsonify(error="internal error"), 500

              @app.get("/health")
              def health():
                  try:
                      store().db.execute("SELECT 1").fetchone()
                  except Exception:
                      log.exception("health check failed")
                      return jsonify(status="down"), 503
                  return jsonify(status="ok")

              @app.errorhandler(413)
              def too_big(_err):
                  return jsonify(error="request is too large"), 413

              @app.errorhandler(TallyError)
              def bad_input(err: TallyError):
                  return jsonify(error=str(err)), 400

              @app.get("/")
              def index():
                  totals = [(c, format_cents(v)) for c, v in sorted(store().totals_by_category().items())]
                  latest = [expense_json(e) for e in store().list_expenses(limit=10)]
                  return render_template_string(PAGE, totals=totals, latest=latest)

              @app.get("/api/expenses")
              def list_expenses():
                  rows = store().list_expenses(request.args.get("category"), limit=100)
                  return jsonify([expense_json(e) for e in rows])

              @app.post("/api/expenses")
              def add_expense():
                  require_token()
                  body = request.get_json(silent=True)
                  if not isinstance(body, dict):
                      raise TallyError("send a JSON object")
                  category, note = clean_expense_text(str(body.get("category", "")), str(body.get("note", "")))
                  try:
                      day = date.fromisoformat(body["date"]) if "date" in body else date.today()
                  except (TypeError, ValueError):
                      raise TallyError("date must look like 2026-10-17") from None
                  e = store().add_expense(
                      day,
                      parse_amount(str(body.get("amount", ""))),
                      category,
                      note,
                  )
                  log.info("expense added: id=%s category=%s", e.id, e.category)
                  return jsonify(expense_json(e)), 201

              @app.get("/api/totals")
              def totals():
                  return jsonify({c: format_cents(v) for c, v in sorted(store().totals_by_category().items())})

              return app
      - file: tests/test_web.py
        lang: python
        text: |
          import pytest

          from tally.web import create_app


          AUTH = {"Authorization": "Bearer secret"}


          @pytest.fixture
          def client(tmp_path):
              return create_app(tmp_path / "web.db", token="secret").test_client()


          def test_add_and_read_back(client):
              r = client.post("/api/expenses", json={"amount": "4.50", "category": "coffee"}, headers=AUTH)
              assert r.status_code == 201
              assert r.get_json()["amount"] == "4.50"
              assert client.get("/api/expenses").get_json()[0]["category"] == "coffee"
              assert client.get("/api/totals").get_json() == {"coffee": "4.50"}


          @pytest.mark.parametrize(
              "body",
              [{"amount": "0", "category": "x"}, {"amount": "abc", "category": "x"}, {"amount": "1"}, {"amount": "1", "category": "x", "date": "tomorrow"},
               {"amount": "1", "category": "x" * 41}, {"amount": "1", "category": "x", "note": "a\nb"}],
          )
          def test_bad_input_is_400(client, body):
              r = client.post("/api/expenses", json=body, headers=AUTH)
              assert r.status_code == 400
              assert "error" in r.get_json()


          def test_page_escapes_html(client):
              client.post("/api/expenses", json={"amount": "1", "category": "<script>alert(1)</script>"}, headers=AUTH)
              html = client.get("/").text
              assert "<script>alert(1)</script>" not in html
              assert "&lt;script&gt;" in html


          def test_writing_needs_the_right_token(client, tmp_path):
              body = {"amount": "1", "category": "x"}
              assert client.post("/api/expenses", json=body).status_code == 401
              assert client.post("/api/expenses", json=body, headers={"Authorization": "Bearer nope"}).status_code == 401
              assert client.get("/api/expenses").status_code == 200  # reading stays open


          def test_writing_is_off_without_a_token(tmp_path):
              client = create_app(tmp_path / "web.db", token="").test_client()
              r = client.post("/api/expenses", json={"amount": "1", "category": "x"}, headers=AUTH)
              assert r.status_code == 403


          def test_huge_body_is_refused(client):
              r = client.post("/api/expenses", data="x" * 20_000, headers=AUTH, content_type="application/json")
              assert r.status_code == 413


          def test_health(client):
              assert client.get("/health").get_json() == {"status": "ok"}


          def test_health_is_503_when_the_database_is_broken(tmp_path):
              bad = tmp_path / "missing-dir" / "x" / "web.db"
              bad.parent.parent.write_text("a file, not a folder")  # the database cannot be created here
              client = create_app(bad, token="secret").test_client()
              assert client.get("/health").status_code == 503


          def test_logs_a_slow_request(client, caplog):
              client.application.config["SLOW_MS"] = 0
              with caplog.at_level("WARNING", logger="tally.web"):
                  client.get("/api/totals")
              assert "slow request: GET /api/totals" in caplog.text


          def test_unexpected_error_is_logged_and_hidden(client, caplog, monkeypatch):
              def boom(*args, **kwargs):
                  raise RuntimeError("secret details")

              monkeypatch.setattr("tally.web.SqliteStore.totals_by_category", boom)
              r = client.get("/api/totals")
              assert r.status_code == 500
              assert r.get_json() == {"error": "internal error"}
              assert "secret details" in caplog.text  # in the log, not in the answer
      - file: terminal
        lang: sh
        text: |
          uv run pytest
          uv run tally -v list
          uv run --extra web flask --app tally.web:create_app run --port 5001
