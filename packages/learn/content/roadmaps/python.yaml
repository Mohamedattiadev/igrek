  - id: secure
    stage: security
    title:
      en: "Validate input, protect writes with a token, keep secrets out of Git"
      tr: "Girdiyi doğrulama, yazmayı token ile koruma, sırları Git dışında tutma"
    minutes: 70
    needs: [tests]
    why:
      en: "As soon as the API is on the internet, anybody can send it anything. Three habits cover most problems: never trust input, make writing need a secret, and never put the secret in your code or in Git. Tests make sure each protection really works."
      tr: "API internete açıldığı anda herkes ona her şeyi gönderebilir. Üç alışkanlık sorunların çoğunu kapatır: girdiye asla güvenme, yazmayı bir sırra bağla ve sırrı asla kodda ya da Git'te tutma. Testler her korumanın gerçekten çalıştığından emin olmanı sağlar."
    learn:
      en: |
        - **Validate** input at the edge: length limits, no control characters, only positive amounts
        - A **bearer token** is a secret string the caller sends in the `Authorization` header; the server compares it in constant time with `hmac.compare_digest`
        - **Secure by default**: when no token is set, writing is switched off instead of open to everyone
        - Limit the request size (`MAX_CONTENT_LENGTH`) and never run Flask in debug mode on a public server
        - Secrets live in environment variables, not in code, and files like `.env` and `*.db` are listed in `.gitignore`
        - `uv audit` checks your packages against lists of known vulnerabilities
      tr: |
        - Girdiyi sınırda **doğrula**: uzunluk sınırı, kontrol karakteri yok, sadece pozitif tutar
        - **Bearer token**, çağıranın `Authorization` header'ında gönderdiği gizli bir metindir; sunucu onu `hmac.compare_digest` ile sabit sürede karşılaştırır
        - **Varsayılan olarak güvenli**: token ayarlanmamışsa yazma herkese açık olmaz, kapatılır
        - İstek boyutunu sınırla (`MAX_CONTENT_LENGTH`) ve herkese açık sunucuda Flask'ı asla debug modunda çalıştırma
        - Sırlar kodda değil ortam değişkenlerinde (environment variable) durur; `.env` ve `*.db` gibi dosyalar `.gitignore`'a yazılır
        - `uv audit`, paketlerini bilinen güvenlik açıkları listelerine karşı kontrol eder
    do:
      en: |
        1. Replace `src/tally/models.py` with the first block. It adds `check_text` and `clean_expense_text`.
        2. Replace `src/tally/cli.py` and `src/tally/web.py` with the next two blocks. The command line and the API now both clean the text, and the API needs a token for writing.
        3. Replace `tests/test_cli.py` and `tests/test_web.py` with the last two blocks, then run `uv run pytest`. All 41 tests should pass.
        4. Make a token and start the server with it. The first command prints a random token; copy it. Then set it in the terminal (macOS and Linux: `export TALLY_TOKEN=...`, Windows PowerShell: `$env:TALLY_TOKEN="..."`) and start the server as before.
        5. In a second terminal try a write without the token and with it (the curl lines). The first must answer `401`, the second `201`.
        6. Add the lines of the `.gitignore` block to the end of your `.gitignore`.
        7. Run `uv audit`. It is still marked experimental, so its output may change; it should find no known vulnerabilities.
        8. Commit: `git add .` then `git commit -m "Validate input and protect writes"`.
      tr: |
        1. `src/tally/models.py` dosyasını ilk blokla değiştir. `check_text` ve `clean_expense_text` ekler.
        2. `src/tally/cli.py` ve `src/tally/web.py` dosyalarını sonraki iki blokla değiştir. Komut satırı ve API artık metni temizliyor, API de yazmak için token istiyor.
        3. `tests/test_cli.py` ve `tests/test_web.py` dosyalarını son iki blokla değiştir, sonra `uv run pytest` çalıştır. 41 testin hepsi geçmeli.
        4. Bir token üret ve sunucuyu onunla başlat. İlk komut rastgele bir token yazdırır; kopyala. Sonra terminalde ayarla (macOS ve Linux: `export TALLY_TOKEN=...`, Windows PowerShell: `$env:TALLY_TOKEN="..."`) ve sunucuyu eskisi gibi başlat.
        5. İkinci bir terminalde token olmadan ve token ile yazmayı dene (curl satırları). İlki `401`, ikincisi `201` dönmeli.
        6. `.gitignore` bloğundaki satırları kendi `.gitignore` dosyanın sonuna ekle.
        7. `uv audit` çalıştır. Hâlâ deneysel işaretli, yani çıktısı değişebilir; bilinen bir güvenlik açığı bulmamalı.
        8. Commit et: `git add .` sonra `git commit -m "Validate input and protect writes"`.
    code:
      - file: src/tally/models.py
        lang: python
        text: |
          from dataclasses import dataclass
          from datetime import date
          from decimal import Decimal, InvalidOperation


          class TallyError(Exception):
              """An error with a message that is safe to show to the user."""


          @dataclass(frozen=True)
          class Expense:
              day: date
              cents: int
              category: str
              note: str = ""
              id: int = 0


          def parse_amount(text: str) -> int:
              """Turn "4.50" into 450 cents. Money is kept in whole cents, never in floats."""
              try:
                  value = Decimal(text.strip().replace(",", "."))
              except InvalidOperation:
                  raise TallyError(f"not a number: {text!r}") from None
              if not value.is_finite() or value <= 0:
                  raise TallyError("the amount must be more than zero")
              if value > 1_000_000:
                  raise TallyError("the amount is too large")
              cents = value * 100
              if cents != cents.to_integral_value():
                  raise TallyError("use at most two decimals")
              return int(cents)


          def format_cents(cents: int) -> str:
              return f"{cents // 100}.{cents % 100:02d}"


          def check_text(value: str, name: str, max_length: int, required: bool = False) -> str:
              """Trim a piece of text and refuse it if it is empty, too long or has line breaks."""
              value = value.strip()
              if required and not value:
                  raise TallyError(f"{name} is required")
              if len(value) > max_length:
                  raise TallyError(f"{name} is too long (at most {max_length} characters)")
              if not value.isprintable():
                  raise TallyError(f"{name} cannot contain line breaks or control characters")
              return value


          def clean_expense_text(category: str, note: str) -> tuple[str, str]:
              return check_text(category, "category", 40, required=True), check_text(note, "note", 200)
      - file: src/tally/cli.py
        lang: python
        text: |
          import argparse
          import sys
          from datetime import date
          from pathlib import Path

          from .habits import current_streak
          from .jsonstore import JsonStore
          from .models import TallyError, clean_expense_text, format_cents, parse_amount
          from .sqlstore import SqliteStore, default_db_path


          def db_path(option: Path | None) -> Path:
              return option or default_db_path()


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(prog="tally", description="Track your expenses and habits.")
              parser.add_argument("--db", type=Path, help="database file (default: ~/.tally/tally.db)")
              sub = parser.add_subparsers(dest="command", required=True)

              add = sub.add_parser("add", help="record an expense")
              add.add_argument("amount", help="for example 4.50")
              add.add_argument("category", help="for example coffee")
              add.add_argument("note", nargs="?", default="")
              add.add_argument("--date", type=date.fromisoformat, help="YYYY-MM-DD (default: today)")

              ls = sub.add_parser("list", help="show expenses, newest first")
              ls.add_argument("--category")

              sub.add_parser("total", help="show the total for each category")

              done = sub.add_parser("done", help="check in a habit for today")
              done.add_argument("habit")

              sub.add_parser("streaks", help="show your habit streaks")

              imp = sub.add_parser("import-json", help="copy the data of an old JSON file into the database")
              imp.add_argument("file", type=Path)
              return parser


          def run(args: argparse.Namespace, store: SqliteStore, today: date) -> None:
              if args.command == "add":
                  category, note = clean_expense_text(args.category, args.note)
                  e = store.add_expense(args.date or today, parse_amount(args.amount), category, note)
                  print(f"added #{e.id}: {format_cents(e.cents)} {e.category}")
              elif args.command == "list":
                  for e in store.list_expenses(args.category):
                      print(f"{e.id:>3}  {e.day}  {format_cents(e.cents):>9}  {e.category:<12} {e.note}")
              elif args.command == "total":
                  totals = store.totals_by_category()
                  for category, cents in sorted(totals.items()):
                      print(f"{category:<12} {format_cents(cents):>9}")
                  print(f"{'all':<12} {format_cents(sum(totals.values())):>9}")
              elif args.command == "done":
                  if store.check_in(args.habit, today):
                      print(f"{args.habit}: done for {today}")
                  else:
                      print(f"{args.habit}: already done today")
              elif args.command == "streaks":
                  for habit, days in sorted(store.habit_days().items()):
                      print(f"{habit:<12} {current_streak(days, today)} day(s)")
              elif args.command == "import-json":
                  old = JsonStore(args.file)
                  for e in reversed(old.list_expenses()):  # oldest first
                      store.add_expense(e.day, e.cents, e.category, e.note)
                  for habit, days in old.habit_days().items():
                      for day in sorted(days):
                          store.check_in(habit, day)
                  print(f"imported from {args.file}")


          def main(argv: list[str] | None = None) -> int:
              args = build_parser().parse_args(argv)
              try:
                  with SqliteStore(db_path(args.db)) as store:
                      run(args, store, date.today())
              except TallyError as err:
                  print(f"error: {err}", file=sys.stderr)
                  return 1
              return 0
      - file: src/tally/web.py
        lang: python
        text: |
          import hmac
          import os
          from datetime import date
          from pathlib import Path

          from flask import Flask, abort, g, jsonify, make_response, render_template_string, request

          from .models import Expense, TallyError, clean_expense_text, format_cents, parse_amount
          from .sqlstore import SqliteStore, default_db_path

          PAGE = """<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Tally</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
              td, th { padding: 0.25rem 0.75rem; text-align: left; }
            </style>
          </head>
          <body>
            <h1>Tally</h1>
            <h2>Totals</h2>
            <table>
              {% for category, amount in totals %}
              <tr><td>{{ category }}</td><td>{{ amount }}</td></tr>
              {% else %}
              <tr><td>No expenses yet.</td></tr>
              {% endfor %}
            </table>
            <h2>Latest</h2>
            <table>
              {% for e in latest %}
              <tr><td>{{ e.date }}</td><td>{{ e.amount }}</td><td>{{ e.category }}</td><td>{{ e.note }}</td></tr>
              {% endfor %}
            </table>
          </body>
          </html>
          """


          def expense_json(e: Expense) -> dict:
              return {
                  "id": e.id,
                  "date": e.day.isoformat(),
                  "amount": format_cents(e.cents),
                  "category": e.category,
                  "note": e.note,
              }


          def create_app(db_path: Path | None = None, token: str | None = None) -> Flask:
              app = Flask(__name__)
              app.config["DB_PATH"] = db_path or default_db_path()
              app.config["TOKEN"] = os.environ.get("TALLY_TOKEN", "") if token is None else token
              app.config["MAX_CONTENT_LENGTH"] = 16_000  # refuse bigger request bodies

              def store() -> SqliteStore:
                  if "store" not in g:  # one connection per request
                      g.store = SqliteStore(app.config["DB_PATH"])
                  return g.store

              @app.teardown_appcontext
              def close_store(_error) -> None:
                  s = g.pop("store", None)
                  if s is not None:
                      s.close()

              def require_token() -> None:
                  expected = app.config["TOKEN"]
                  if not expected:  # no token set: nobody may write
                      abort(make_response(jsonify(error="writing is off: set the TALLY_TOKEN variable"), 403))
                  given = request.headers.get("Authorization", "")
                  if not hmac.compare_digest(given.encode(), f"Bearer {expected}".encode()):
                      abort(make_response(jsonify(error="missing or wrong token"), 401))

              @app.errorhandler(413)
              def too_big(_err):
                  return jsonify(error="request is too large"), 413

              @app.errorhandler(TallyError)
              def bad_input(err: TallyError):
                  return jsonify(error=str(err)), 400

              @app.get("/")
              def index():
                  totals = [(c, format_cents(v)) for c, v in sorted(store().totals_by_category().items())]
                  latest = [expense_json(e) for e in store().list_expenses(limit=10)]
                  return render_template_string(PAGE, totals=totals, latest=latest)

              @app.get("/api/expenses")
              def list_expenses():
                  rows = store().list_expenses(request.args.get("category"), limit=100)
                  return jsonify([expense_json(e) for e in rows])

              @app.post("/api/expenses")
              def add_expense():
                  require_token()
                  body = request.get_json(silent=True)
                  if not isinstance(body, dict):
                      raise TallyError("send a JSON object")
                  category, note = clean_expense_text(str(body.get("category", "")), str(body.get("note", "")))
                  try:
                      day = date.fromisoformat(body["date"]) if "date" in body else date.today()
                  except (TypeError, ValueError):
                      raise TallyError("date must look like 2026-10-17") from None
                  e = store().add_expense(
                      day,
                      parse_amount(str(body.get("amount", ""))),
                      category,
                      note,
                  )
                  return jsonify(expense_json(e)), 201

              @app.get("/api/totals")
              def totals():
                  return jsonify({c: format_cents(v) for c, v in sorted(store().totals_by_category().items())})

              return app
