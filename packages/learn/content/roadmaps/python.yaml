          from .habits import current_streak
          from .jsonstore import JsonStore
          from .models import TallyError, format_cents, parse_amount
          from .sqlstore import SqliteStore, default_db_path


          def db_path(option: Path | None) -> Path:
              return option or default_db_path()


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(prog="tally", description="Track your expenses and habits.")
              parser.add_argument("--db", type=Path, help="database file (default: ~/.tally/tally.db)")
              sub = parser.add_subparsers(dest="command", required=True)

              add = sub.add_parser("add", help="record an expense")
              add.add_argument("amount", help="for example 4.50")
              add.add_argument("category", help="for example coffee")
              add.add_argument("note", nargs="?", default="")
              add.add_argument("--date", type=date.fromisoformat, help="YYYY-MM-DD (default: today)")

              ls = sub.add_parser("list", help="show expenses, newest first")
              ls.add_argument("--category")

              sub.add_parser("total", help="show the total for each category")

              done = sub.add_parser("done", help="check in a habit for today")
              done.add_argument("habit")

              sub.add_parser("streaks", help="show your habit streaks")

              imp = sub.add_parser("import-json", help="copy the data of an old JSON file into the database")
              imp.add_argument("file", type=Path)
              return parser


          def run(args: argparse.Namespace, store: SqliteStore, today: date) -> None:
              if args.command == "add":
                  e = store.add_expense(args.date or today, parse_amount(args.amount), args.category, args.note)
                  print(f"added #{e.id}: {format_cents(e.cents)} {e.category}")
              elif args.command == "list":
                  for e in store.list_expenses(args.category):
                      print(f"{e.id:>3}  {e.day}  {format_cents(e.cents):>9}  {e.category:<12} {e.note}")
              elif args.command == "total":
                  totals = store.totals_by_category()
                  for category, cents in sorted(totals.items()):
                      print(f"{category:<12} {format_cents(cents):>9}")
                  print(f"{'all':<12} {format_cents(sum(totals.values())):>9}")
              elif args.command == "done":
                  if store.check_in(args.habit, today):
                      print(f"{args.habit}: done for {today}")
                  else:
                      print(f"{args.habit}: already done today")
              elif args.command == "streaks":
                  for habit, days in sorted(store.habit_days().items()):
                      print(f"{habit:<12} {current_streak(days, today)} day(s)")
              elif args.command == "import-json":
                  old = JsonStore(args.file)
                  for e in reversed(old.list_expenses()):  # oldest first
                      store.add_expense(e.day, e.cents, e.category, e.note)
                  for habit, days in old.habit_days().items():
                      for day in sorted(days):
                          store.check_in(habit, day)
                  print(f"imported from {args.file}")


          def main(argv: list[str] | None = None) -> int:
              args = build_parser().parse_args(argv)
              try:
                  with SqliteStore(db_path(args.db)) as store:
                      run(args, store, date.today())
              except TallyError as err:
                  print(f"error: {err}", file=sys.stderr)
                  return 1
              return 0
      - file: terminal
        lang: sh
        text: |
          uv run tally import-json demo.json
          uv run tally list
          uv run tally total
          uv run tally streaks
          uv run tally add 5 "x'; DROP TABLE expenses;--"
          uv run tally list
    mistakes:
      - problem:
          en: "Building SQL with an f-string: f\"... WHERE category = '{category}'\". Anyone can type text that changes the query (SQL injection)."
          tr: "SQL'i f-string ile kurmak: f\"... WHERE category = '{category}'\". Herkes sorguyu değiştiren bir metin yazabilir (SQL injection)."
        fix:
          en: "Never put values into the SQL text. Write `?` in the SQL and pass the values as the second argument: `db.execute(\"... WHERE category = ?\", (category,))`."
          tr: "Değerleri asla SQL metnine koyma. SQL'de `?` yaz ve değerleri ikinci argüman olarak ver: `db.execute(\"... WHERE category = ?\", (category,))`."
      - problem:
          en: "Running `import-json` twice, so every expense is in the database twice."
          tr: "`import-json`'u iki kez çalıştırmak; her harcama veritabanına iki kez girer."
        fix:
          en: "Run it once. If you ran it twice, delete the database file (`~/.tally/tally.db`) and import again. A real tool would remember what it imported."
          tr: "Bir kez çalıştır. İki kez çalıştırdıysan veritabanı dosyasını (`~/.tally/tally.db`) sil ve tekrar içe aktar. Gerçek bir araç neyi içe aktardığını hatırlardı."
      - problem:
          en: "\"sqlite3.OperationalError: database is locked\" or changes that never show up."
          tr: "\"sqlite3.OperationalError: database is locked\" ya da hiç görünmeyen değişiklikler."
        fix:
          en: "Changes only become permanent after a commit. Wrap writes in `with self.db:` as the code does, and close connections when you are done."
          tr: "Değişiklikler ancak commit'ten sonra kalıcı olur. Kodda olduğu gibi yazmaları `with self.db:` içine al ve işin bitince bağlantıları kapat."
    quiz:
      - q:
          en: "What does the ? in \"WHERE category = ?\" protect you from?"
          tr: "\"WHERE category = ?\" içindeki ? seni neyden korur?"
        options:
          en: [Slow queries, SQL injection, Running out of disk space]
          tr: [Yavaş sorgulardan, SQL injection'dan, Disk dolmasından]
        answer: 1
        why:
          en: "The database receives the SQL and the values separately, so a value can never be read as part of the SQL."
          tr: "Veritabanı SQL'i ve değerleri ayrı alır; bu yüzden bir değer asla SQL'in parçası gibi okunamaz."
    sources:
      - title: "sqlite3: DB-API 2.0 interface for SQLite databases"
        url: https://docs.python.org/3/library/sqlite3.html
      - title: "sqlite3: using placeholders to bind values in SQL queries"
        url: https://docs.python.org/3/library/sqlite3.html#sqlite3-placeholders
      - title: "SQLite: SQL syntax"
        url: https://www.sqlite.org/lang.html

  - id: web
    stage: data-api
    title:
      en: "A tiny web page and JSON API with Flask"
      tr: "Flask ile minik bir web sayfası ve JSON API"
    minutes: 70
    needs: [sqlite]
    why:
      en: "A command line is only for you, on your computer. A web page and an API let other programs and people reach the same data over HTTP. Flask is a small framework that does exactly this and little else, so you can see every moving part."
      tr: "Komut satırı sadece senin içindir ve senin bilgisayarında çalışır. Web sayfası ve API, başka programların ve insanların aynı veriye HTTP üzerinden ulaşmasını sağlar. Flask tam olarak bunu yapan ve fazlasını yapmayan küçük bir framework'tür; her parçayı görebilirsin."
    learn:
      en: |
        - What HTTP is: a request (method, path, body) and a response (status code, body); `GET` reads, `POST` creates
        - Status codes: `200` ok, `201` created, `400` your input is wrong, `404` not found
        - A Flask route is a function with a decorator: `@app.get("/api/totals")`
        - The **app factory** pattern: `create_app()` builds the app, so tests can build their own
        - Optional dependencies: `tally` works without Flask, and `pip install "tally[web]"` adds it
        - `render_template_string` escapes values, so `<script>` typed by a user shows as text
      tr: |
        - HTTP nedir: bir istek (method, path, body) ve bir yanıt (durum kodu, body); `GET` okur, `POST` oluşturur
        - Durum kodları: `200` tamam, `201` oluşturuldu, `400` girdin yanlış, `404` bulunamadı
        - Flask route'u bir decorator'lı fonksiyondur: `@app.get("/api/totals")`
        - **App factory** kalıbı: `create_app()` uygulamayı kurar, böylece testler kendi uygulamasını kurabilir
        - Opsiyonel bağımlılıklar: `tally` Flask olmadan çalışır, `pip install "tally[web]"` onu ekler
        - `render_template_string` değerleri kaçışlar; kullanıcının yazdığı `<script>` metin olarak görünür
    do:
      en: |
        1. Add Flask as an optional dependency with the first command below. It writes a `web = [...]` list under `[project.optional-dependencies]` in `pyproject.toml`.
        2. Create `src/tally/web.py` with the code below. Read it from the top: the page template, `expense_json`, then `create_app` with its routes.
        3. Start the server with the second command. Open http://127.0.0.1:5001 in the browser. You see the totals and the latest expenses from the same database the command line uses.
        4. Open a second terminal (keep the server running in the first). Try the `curl` lines. On Windows use *Git Bash*, which comes with Git, for them. Look at the status codes: `-i` prints them.
        5. Press Ctrl+C in the first terminal to stop the server.
        6. Commit: `git add .` then `git commit -m "Add a tiny web page and API"`.
      tr: |
        1. Aşağıdaki ilk komutla Flask'ı opsiyonel bağımlılık olarak ekle. `pyproject.toml` içinde `[project.optional-dependencies]` altına bir `web = [...]` listesi yazar.
        2. Aşağıdaki kodla `src/tally/web.py` dosyasını oluştur. Baştan oku: sayfa şablonu, `expense_json`, sonra route'larıyla `create_app`.
        3. İkinci komutla sunucuyu başlat. Tarayıcıda http://127.0.0.1:5001 adresini aç. Komut satırının kullandığı veritabanındaki toplamları ve son harcamaları görürsün.
        4. İkinci bir terminal aç (sunucu birincide çalışmaya devam etsin). `curl` satırlarını dene. Windows'ta bunlar için Git ile gelen *Git Bash*'i kullan. Durum kodlarına bak: `-i` onları yazdırır.
        5. Sunucuyu durdurmak için birinci terminalde Ctrl+C'ye bas.
        6. Commit et: `git add .` sonra `git commit -m "Add a tiny web page and API"`.
    code:
      - file: terminal
        lang: sh
        text: |
          uv add --optional web "flask>=3.1"
      - file: src/tally/web.py
        lang: python
        text: |
          from datetime import date
          from pathlib import Path

          from flask import Flask, g, jsonify, render_template_string, request

          from .models import Expense, TallyError, format_cents, parse_amount
          from .sqlstore import SqliteStore, default_db_path

          PAGE = """<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Tally</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
              td, th { padding: 0.25rem 0.75rem; text-align: left; }
            </style>
          </head>
          <body>
            <h1>Tally</h1>
            <h2>Totals</h2>
            <table>
              {% for category, amount in totals %}
              <tr><td>{{ category }}</td><td>{{ amount }}</td></tr>
              {% else %}
              <tr><td>No expenses yet.</td></tr>
              {% endfor %}
            </table>
            <h2>Latest</h2>
            <table>
              {% for e in latest %}
              <tr><td>{{ e.date }}</td><td>{{ e.amount }}</td><td>{{ e.category }}</td><td>{{ e.note }}</td></tr>
              {% endfor %}
            </table>
          </body>
          </html>
          """


          def expense_json(e: Expense) -> dict:
              return {
                  "id": e.id,
                  "date": e.day.isoformat(),
                  "amount": format_cents(e.cents),
                  "category": e.category,
                  "note": e.note,
              }


          def create_app(db_path: Path | None = None) -> Flask:
              app = Flask(__name__)
              app.config["DB_PATH"] = db_path or default_db_path()

              def store() -> SqliteStore:
                  if "store" not in g:  # one connection per request
                      g.store = SqliteStore(app.config["DB_PATH"])
                  return g.store

              @app.teardown_appcontext
              def close_store(_error) -> None:
                  s = g.pop("store", None)
                  if s is not None:
                      s.close()

              @app.errorhandler(TallyError)
              def bad_input(err: TallyError):
                  return jsonify(error=str(err)), 400

              @app.get("/")
              def index():
                  totals = [(c, format_cents(v)) for c, v in sorted(store().totals_by_category().items())]
                  latest = [expense_json(e) for e in store().list_expenses(limit=10)]
                  return render_template_string(PAGE, totals=totals, latest=latest)

              @app.get("/api/expenses")
              def list_expenses():
                  rows = store().list_expenses(request.args.get("category"), limit=100)
                  return jsonify([expense_json(e) for e in rows])

              @app.post("/api/expenses")
              def add_expense():
                  body = request.get_json(silent=True)
                  if not isinstance(body, dict):
                      raise TallyError("send a JSON object")
                  if not body.get("category"):
                      raise TallyError("category is required")
                  try:
                      day = date.fromisoformat(body["date"]) if "date" in body else date.today()
                  except (TypeError, ValueError):
                      raise TallyError("date must look like 2026-10-17") from None
                  e = store().add_expense(
                      day,
                      parse_amount(str(body.get("amount", ""))),
                      str(body["category"]),
                      str(body.get("note", "")),
                  )
                  return jsonify(expense_json(e)), 201

              @app.get("/api/totals")
              def totals():
                  return jsonify({c: format_cents(v) for c, v in sorted(store().totals_by_category().items())})

              return app
      - file: terminal
        lang: sh
        text: |
          uv run --extra web flask --app tally.web:create_app run --port 5001
      - file: terminal
        lang: sh
        text: |
          curl -i http://127.0.0.1:5001/api/totals
          curl -i -X POST http://127.0.0.1:5001/api/expenses -H "Content-Type: application/json" -d '{"amount": "7.25", "category": "food", "note": "lunch"}'
          curl -i -X POST http://127.0.0.1:5001/api/expenses -H "Content-Type: application/json" -d '{"amount": "-1", "category": "food"}'
          curl http://127.0.0.1:5001/api/expenses
    mistakes:
      - problem:
          en: "\"ModuleNotFoundError: No module named 'flask'\"."
          tr: "\"ModuleNotFoundError: No module named 'flask'\"."
        fix:
          en: "Flask is an optional extra. Start with `uv run --extra web ...` or install every extra once with `uv sync --all-extras`."
          tr: "Flask opsiyonel bir ek. `uv run --extra web ...` ile başlat ya da bütün ekleri bir kez `uv sync --all-extras` ile kur."
      - problem:
          en: "\"Address already in use\" when the server starts."
          tr: "Sunucu başlarken \"Address already in use\" hatası."
        fix:
          en: "Another program uses that port, or an old server is still running. Stop the old one with Ctrl+C or pick another port with `--port 5002`."
          tr: "O portu başka bir program kullanıyor ya da eski sunucu hâlâ çalışıyor. Eskisini Ctrl+C ile durdur ya da `--port 5002` ile başka bir port seç."
      - problem:
          en: "Using one SQLite connection for the whole server. Flask handles requests in different threads, and a connection may only be used in the thread that made it."
          tr: "Bütün sunucu için tek bir SQLite bağlantısı kullanmak. Flask istekleri farklı thread'lerde işler ve bir bağlantı sadece onu açan thread'de kullanılabilir."
        fix:
          en: "Open one connection per request and close it afterwards, as `store()` and `close_store` do with Flask's `g` object."
          tr: "`store()` ve `close_store`'un Flask'ın `g` nesnesiyle yaptığı gibi, her istek için bir bağlantı aç ve sonunda kapat."
    quiz:
      - q:
          en: "Which status code should the API answer when someone posts an amount of -1?"
          tr: "Biri -1 tutarı gönderdiğinde API hangi durum kodunu döndürmeli?"
        options:
          en: ["200, because the server worked", "400, because the input is wrong", "500, because something broke"]
          tr: ["200, çünkü sunucu çalıştı", "400, çünkü girdi yanlış", "500, çünkü bir şey bozuldu"]
        answer: 1
        why:
          en: "4xx codes mean the caller made a mistake. 5xx means the server has a bug. Bad input is the caller's mistake."
          tr: "4xx kodları çağıranın hata yaptığı anlamına gelir. 5xx sunucuda bug olduğunu söyler. Hatalı girdi çağıranın hatasıdır."
    sources:
      - title: "Flask: quickstart"
        url: https://flask.palletsprojects.com/en/stable/quickstart/
      - title: "Flask: application factories"
        url: https://flask.palletsprojects.com/en/stable/patterns/appfactories/
      - title: "uv: optional dependencies"
        url: https://docs.astral.sh/uv/concepts/projects/dependencies/#optional-dependencies

  - id: tests
    stage: testing
    title:
      en: "Test everything with pytest"
      tr: "Her şeyi pytest ile test etme"
    minutes: 75
    needs: [web]
    why:
      en: "Tests are small programs that check your program, and they run in a second. Without them every change is a gamble: you fix the web page and quietly break the command line. With them you change code and know within a second if something broke."
      tr: "Testler programını kontrol eden küçük programlardır ve bir saniyede çalışırlar. Onlar olmadan her değişiklik bir kumardır: web sayfasını düzeltirsin, komut satırını sessizce bozarsın. Onlarla kodu değiştirir ve bir şey bozulduysa bir saniye içinde anlarsın."
    learn:
      en: |
        - A test is a function named `test_...` with plain `assert` statements; pytest finds and runs them
        - **Fixtures** prepare things for tests; the built-in `tmp_path` gives each test its own empty folder
        - `@pytest.mark.parametrize` runs one test with many inputs
        - `pytest.raises` checks that the right error happens
        - Run the same tests against two stores (JSON and SQLite) to prove they behave the same
        - Flask's `test_client()` calls your app without starting a server
      tr: |
        - Test, adı `test_...` olan ve düz `assert` ifadeleri içeren bir fonksiyondur; pytest onları bulur ve çalıştırır
        - **Fixture**'lar testler için hazırlık yapar; hazır `tmp_path` her teste kendi boş klasörünü verir
        - `@pytest.mark.parametrize` bir testi birçok girdiyle çalıştırır
        - `pytest.raises` doğru hatanın oluştuğunu kontrol eder
        - Aynı testleri iki depoya (JSON ve SQLite) karşı çalıştırmak, ikisinin aynı davrandığını kanıtlar
        - Flask'ın `test_client()` metodu sunucu başlatmadan uygulamanı çağırır
    do:
      en: |
        1. Add pytest as a development tool: `uv add --dev pytest`. It goes into a `[dependency-groups]` list that is only for developers, not for the people who install your program.
        2. Install the optional extras too, so the web tests can import Flask: `uv sync --all-extras`.
        3. Create the folder `tests` and the four files below.
        4. Run `uv run pytest`. All 35 tests should pass (shown as dots).
        5. Break something on purpose: change `format_cents` in `models.py` to return `"x"`. Run the tests again, read the failure message, then undo the change.
        6. Commit: `git add .` then `git commit -m "Add tests"`.
      tr: |
        1. pytest'i geliştirme aracı olarak ekle: `uv add --dev pytest`. Sadece geliştiriciler için olan bir `[dependency-groups]` listesine girer; programını kuran insanlar için değil.
        2. Web testleri Flask'ı import edebilsin diye opsiyonel ekleri de kur: `uv sync --all-extras`.
        3. `tests` klasörünü ve aşağıdaki dört dosyayı oluştur.
        4. `uv run pytest` çalıştır. 35 testin hepsi geçmeli (noktalar olarak görünür).
        5. Bilerek bir şey boz: `models.py` içindeki `format_cents` fonksiyonunu `"x"` döndürecek şekilde değiştir. Testleri tekrar çalıştır, hata mesajını oku, sonra değişikliği geri al.
        6. Commit et: `git add .` sonra `git commit -m "Add tests"`.
    code:
      - file: terminal
        lang: sh
        text: |
          uv add --dev pytest
          uv sync --all-extras
          uv run pytest
      - file: tests/test_models.py
        lang: python
        text: |
          from datetime import date

          import pytest

          from tally.habits import current_streak
          from tally.models import TallyError, format_cents, parse_amount


          @pytest.mark.parametrize(
              ("text", "cents"),
              [("4.50", 450), ("4,5", 450), ("12", 1200), (" 0.01 ", 1)],
          )
          def test_parse_amount(text, cents):
              assert parse_amount(text) == cents


          @pytest.mark.parametrize("text", ["", "abc", "0", "-3", "1.234", "NaN", "1e9", "99999999"])
          def test_parse_amount_rejects_bad_input(text):
              with pytest.raises(TallyError):
                  parse_amount(text)


          def test_format_cents():
              assert format_cents(450) == "4.50"
              assert format_cents(5) == "0.05"


          def test_streak_counts_days_in_a_row():
              today = date(2026, 10, 17)
              days = {date(2026, 10, 17), date(2026, 10, 16), date(2026, 10, 15), date(2026, 10, 12)}
              assert current_streak(days, today) == 3


          def test_streak_survives_until_the_day_is_over():
              today = date(2026, 10, 17)
              assert current_streak({date(2026, 10, 16)}, today) == 1
              assert current_streak({date(2026, 10, 15)}, today) == 0
      - file: tests/test_store.py
        lang: python
        text: |
          from datetime import date

          import pytest

          from tally.jsonstore import JsonStore
          from tally.sqlstore import SqliteStore


          @pytest.fixture(params=["json", "sqlite"])
          def store(request, tmp_path):
              """Run every test against both stores: they must behave the same."""
              if request.param == "json":
                  yield JsonStore(tmp_path / "data.json")
              else:
                  with SqliteStore(tmp_path / "data.db") as s:
                      yield s


          def test_add_and_list_newest_first(store):
              store.add_expense(date(2026, 10, 15), 450, "coffee", "flat white")
              store.add_expense(date(2026, 10, 16), 1200, "food")
              assert [e.cents for e in store.list_expenses()] == [1200, 450]
              assert [e.id for e in store.list_expenses()] == [2, 1]


          def test_filter_and_limit(store):
              store.add_expense(date(2026, 10, 15), 100, "a")
              store.add_expense(date(2026, 10, 16), 200, "b")
              store.add_expense(date(2026, 10, 17), 300, "a")
              assert [e.cents for e in store.list_expenses("a")] == [300, 100]
              assert [e.cents for e in store.list_expenses(limit=1)] == [300]


          def test_totals(store):
              store.add_expense(date(2026, 10, 15), 450, "coffee")
              store.add_expense(date(2026, 10, 16), 320, "coffee")
              store.add_expense(date(2026, 10, 16), 1200, "food")
              assert store.totals_by_category() == {"coffee": 770, "food": 1200}


          def test_check_in_twice_is_ignored(store):
              assert store.check_in("run", date(2026, 10, 17)) is True
              assert store.check_in("run", date(2026, 10, 17)) is False
              assert store.habit_days() == {"run": {date(2026, 10, 17)}}


          def test_unicode_survives(store):
              store.add_expense(date(2026, 10, 17), 100, "çay", "İstanbul şeker")
              assert store.list_expenses()[0].note == "İstanbul şeker"


          def test_sql_injection_text_is_just_text(tmp_path):
              evil = "x'); DROP TABLE expenses;--"
              with SqliteStore(tmp_path / "data.db") as s:
                  s.add_expense(date(2026, 10, 17), 100, evil)
                  assert s.list_expenses()[0].category == evil
      - file: tests/test_cli.py
