          en: "Opening the data file without `encoding=\"utf-8\"`, so Turkish letters turn into garbage on some systems."
          tr: "Veri dosyasını `encoding=\"utf-8\"` olmadan açmak; bazı sistemlerde Türkçe harfler bozulur."
        fix:
          en: "Always pass `encoding=\"utf-8\"` to `open()` and `Path.open()`. Python 3.15 made UTF-8 the default, but older versions still guess from the system, and being explicit costs nothing."
          tr: "`open()` ve `Path.open()` çağrılarına her zaman `encoding=\"utf-8\"` ver. Python 3.15 UTF-8'i varsayılan yaptı ama eski sürümler hâlâ sisteme göre tahmin eder; açıkça yazmanın maliyeti yok."
