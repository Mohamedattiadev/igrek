    mistakes:
      - problem:
          en: "Using `print()` in the web app instead of logging."
          tr: "Web uygulamasında loglama yerine `print()` kullanmak."
        fix:
          en: "print has no level, no time and cannot be turned off. Use `log = logging.getLogger(__name__)` and `log.info(...)`."
          tr: "print'in seviyesi ve zamanı yoktur, kapatılamaz. `log = logging.getLogger(__name__)` ve `log.info(...)` kullan."
      - problem:
          en: "Logging the Authorization header, passwords or whole request bodies."
          tr: "Authorization header'ını, parolaları ya da tüm istek body'lerini loglamak."
        fix:
          en: "Logs are copied, searched and shared. Log ids and counts (`id=7`), never secrets."
          tr: "Loglar kopyalanır, aranır ve paylaşılır. Sırları değil, id ve sayıları logla (`id=7`)."
      - problem:
          en: "A health check that always answers `ok` without checking anything."
          tr: "Hiçbir şeyi kontrol etmeden hep `ok` dönen bir health check."
        fix:
          en: "Make it touch what matters. `/health` runs `SELECT 1` on the database, so a broken database gives `503`."
          tr: "Önemli olan şeye dokunsun. `/health` veritabanında `SELECT 1` çalıştırır; veritabanı bozuksa `503` döner."
    quiz:
      - q:
          en: "A visitor triggers a bug. What should they see, and what should the log contain?"
          tr: "Bir ziyaretçi bir bug tetikliyor. O ne görmeli, log ne içermeli?"
        options:
          en: [The full traceback in both places, A short 'internal error' message while the log has the full traceback, Nothing in either place]
