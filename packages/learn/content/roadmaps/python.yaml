id: python
title: Python
summary:
  en: "From an empty computer to your own Python program on the internet. You build tally, a habit and expense tracker, step by step: it starts as a small command-line tool, grows a SQLite database and a tiny web API, gets tests, and is published for free. You understand why each step is there."
  tr: "Boş bir bilgisayardan internette yayında olan kendi Python programına. Tally adlı bir alışkanlık ve harcama takipçisini adım adım yazarsın: küçük bir komut satırı aracı olarak başlar, SQLite veritabanı ve minik bir web API'si kazanır, testleri yazılır ve ücretsiz yayınlanır. Her adımın neden orada olduğunu anlarsın."
teacher: backend
project:
  en: 'Tally: a command-line habit and expense tracker in plain Python. It saves data to a JSON file first and then to SQLite (sqlite3), has a tiny Flask web page and JSON API, is tested with pytest, packaged with pyproject.toml and published to TestPyPI for free.'
  tr: 'Tally: düz Python ile yazılmış, komut satırından çalışan bir alışkanlık ve harcama takipçisi. Veriyi önce bir JSON dosyasına, sonra SQLite''a (sqlite3) kaydeder; minik bir Flask web sayfası ve JSON API''si vardır, pytest ile test edilir, pyproject.toml ile paketlenir ve ücretsiz olarak TestPyPI''da yayınlanır.'
detect:
  files: [pyproject.toml, requirements.txt, uv.lock]
version: "3.15"
latest: eol:python
checked: 2026-10
sheets: [python, flask, sql, http, rest-graphql, auth, github-actions, git]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install uv, Python, an editor and Git"
      tr: "uv, Python, bir editör ve Git kurma"
    minutes: 40
    why:
      en: "Python programs need Python itself plus a private folder of packages for each project. uv installs Python for you, keeps every project's packages apart so projects cannot break each other, and runs your commands. An editor makes writing code comfortable, and Git keeps every version of your work so you can never really lose it."
      tr: "Python programlarının Python'un kendisine ve her proje için ayrı bir paket klasörüne ihtiyacı vardır. uv, Python'u senin için kurar, her projenin paketlerini ayrı tutar (projeler birbirini bozmaz) ve komutlarını çalıştırır. Editör kod yazmayı rahatlatır, Git de işinin her sürümünü saklar; böylece hiçbir şeyi gerçekten kaybetmezsin."
    learn:
      en: |
        - What a terminal is and how to check that a program is installed
        - What a **virtual environment** (venv) is: a private folder of packages for one project
        - What **uv** does: it installs Python, creates the virtual environment for you and runs commands inside it
        - Which Python version to use: the current stable release is 3.15 (October 2026)
      tr: |
        - Terminalin ne olduğu ve bir programın kurulu olup olmadığını nasıl kontrol edeceğin
        - **Sanal ortam** (virtual environment, venv) nedir: tek bir projeye ait özel paket klasörü
        - **uv**'nin ne yaptığı: Python'u kurar, sanal ortamı senin için oluşturur ve komutları onun içinde çalıştırır
        - Hangi Python sürümünü kullanacağın: güncel kararlı sürüm 3.15 (Ekim 2026)
    do:
      en: |
        1. Install **uv**. On macOS or Linux open a terminal and run the first command below. On Windows open PowerShell and run the second one. Then close the terminal and open a new one, so it sees the new program.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor, and its Python extension (search "Python" in the Extensions panel).
        3. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it.
        4. Open a terminal (in VS Code: *Terminal → New Terminal*) and run the check commands below. Each should print a version number.
        5. Ask uv to install Python 3.15 and check it. If uv says it does not know 3.15, run `uv self update` and try again.
        6. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
        7. Optional: if you prefer plain `venv` and `pip`, which Python's own docs also describe, the last block shows the same jobs. This roadmap uses uv because it needs fewer commands, and every uv command here has a pip equivalent.
      tr: |
        1. **uv**'yi kur. macOS veya Linux'ta bir terminal açıp aşağıdaki ilk komutu çalıştır. Windows'ta PowerShell açıp ikinci komutu çalıştır. Sonra terminali kapatıp yenisini aç ki yeni programı görsün.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u (code.visualstudio.com) ve Python eklentisini kur (Extensions panelinde "Python" ara).
        3. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir.
        4. Bir terminal aç (VS Code'da: *Terminal → New Terminal*) ve aşağıdaki kontrol komutlarını çalıştır. Her biri bir sürüm numarası yazmalı.
        5. uv'ye Python 3.15'i kurmasını söyle ve kontrol et. uv 3.15'i bilmediğini söylerse `uv self update` çalıştırıp tekrar dene.
        6. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
        7. İsteğe bağlı: Python'un kendi dokümanlarının da anlattığı düz `venv` ve `pip`'i tercih edersen son blokta aynı işler var. Bu yol haritası daha az komut gerektirdiği için uv kullanır; buradaki her uv komutunun pip karşılığı vardır.
    code:
      - file: terminal
        lang: sh
        text: |
          # macOS and Linux
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - file: terminal
        lang: powershell
        text: |
          # Windows (PowerShell)
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
      - file: terminal
        lang: sh
        text: |
          uv --version
          git --version
          uv python install 3.15
          uv run --python 3.15 python --version
      - file: terminal
        lang: sh
        text: |
          # The same jobs with venv and pip (optional)
          python3 -m venv .venv
          source .venv/bin/activate        # Windows: .venv\Scripts\activate
          python -m pip install pytest
    mistakes:
      - problem:
          en: "\"command not found: uv\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found: uv\" hatası."
        fix:
          en: "Close the terminal and open a new one so it reloads its list of programs. On Windows, restart the computer if it still fails."
          tr: "Terminali kapatıp yenisini aç ki program listesini yeniden yüklesin. Windows'ta hâlâ olmuyorsa bilgisayarı yeniden başlat."
      - problem:
          en: "pip says \"externally-managed-environment\", or typing python on Windows opens the Microsoft Store."
          tr: "pip \"externally-managed-environment\" diyor ya da Windows'ta python yazınca Microsoft Store açılıyor."
        fix:
          en: "Do not install packages into the Python that came with the system. Let uv or a virtual environment do it, and start programs with `uv run`. Then the system Python never matters."
          tr: "Paketleri sistemle gelen Python'a kurma. Bunu uv ya da bir sanal ortam yapsın ve programları `uv run` ile başlat. Böylece sistem Python'unun önemi kalmaz."
    quiz:
      - q:
          en: "Why does each project get its own virtual environment?"
          tr: "Her proje neden kendi sanal ortamını alır?"
        options:
          en: [It makes Python run faster, Projects with different package versions cannot break each other, It is required to write any Python code]
          tr: [Python'u hızlandırır, Farklı paket sürümleri kullanan projeler birbirini bozmaz, Python kodu yazmak için zorunludur]
        answer: 1
        why:
          en: "One project may need version 1 of a package and another version 2. Separate folders let both live on one computer."
          tr: "Bir proje bir paketin 1. sürümünü, başkası 2. sürümünü isteyebilir. Ayrı klasörler ikisinin de aynı bilgisayarda yaşamasını sağlar."
    sources:
      - title: uv installation
        url: https://docs.astral.sh/uv/getting-started/installation/
      - title: "Python tutorial: virtual environments and packages"
        url: https://docs.python.org/3/tutorial/venv.html
      - title: Installing packages using pip and virtual environments
        url: https://packaging.python.org/en/latest/guides/installing-using-pip-and-virtual-environments/

  - id: hello
    stage: first-code
    title:
      en: "Create the tally project and run it"
      tr: "Tally projesini oluşturma ve çalıştırma"
    minutes: 30
    needs: [setup]
    why:
      en: "A real program is more than one file: it has a name, a Python version, a list of packages and a place for its code. `uv init` creates all of that, so from the first minute your project looks like the ones you will meet at work, and anybody can run it with one command."
      tr: "Gerçek bir program tek dosyadan fazlasıdır: bir adı, bir Python sürümü, bir paket listesi ve kodu için bir yeri vardır. `uv init` bunların hepsini oluşturur; böylece ilk dakikadan itibaren projen işte karşılaşacağın projelere benzer ve herkes onu tek komutla çalıştırabilir."
    learn:
      en: |
        - What `uv init --package` creates: `pyproject.toml` (the project's settings), `.python-version`, `src/tally/` (your code) and a Git repository
        - What the `main` function is and how `uv run tally` finds it through `[project.scripts]`
        - `input()` reads a line from the keyboard, and an f-string (`f"Hello {name}"`) puts a value inside text
      tr: |
        - `uv init --package` neyi oluşturur: `pyproject.toml` (projenin ayarları), `.python-version`, `src/tally/` (senin kodun) ve bir Git deposu
        - `main` fonksiyonunun ne olduğu ve `uv run tally`'nin onu `[project.scripts]` üzerinden nasıl bulduğu
        - `input()` klavyeden bir satır okur, f-string (`f"Hello {name}"`) ise bir değeri metnin içine koyar
    do:
      en: |
        1. In the terminal, go to the folder where you keep projects and run the first command below. It creates a folder called `tally` and starts a Git repository in it.
        2. Go into the folder with `cd tally` and run `uv run tally`. The first time, uv creates the virtual environment (a `.venv` folder), then prints "Hello from tally!".
        3. Open the folder in VS Code (`code .`) and read `pyproject.toml`. Find the line `tally = "tally:main"` under `[project.scripts]`: it says the command `tally` runs the function `main` of the package `tally`.
        4. Replace everything in `src/tally/__init__.py` with the code below and run `uv run tally` again. Type your name and press Enter.
        5. Save this first version with Git: `git add .` then `git commit -m "Start tally"`.
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git ve aşağıdaki ilk komutu çalıştır. `tally` adında bir klasör oluşturur ve içinde bir Git deposu başlatır.
        2. `cd tally` ile klasöre gir ve `uv run tally` çalıştır. İlk seferde uv sanal ortamı (bir `.venv` klasörü) oluşturur, sonra "Hello from tally!" yazar.
        3. Klasörü VS Code'da aç (`code .`) ve `pyproject.toml` dosyasını oku. `[project.scripts]` altındaki `tally = "tally:main"` satırını bul: `tally` komutunun, `tally` paketindeki `main` fonksiyonunu çalıştırdığını söyler.
        4. `src/tally/__init__.py` içindeki her şeyi aşağıdaki kodla değiştir ve `uv run tally`'yi tekrar çalıştır. Adını yaz ve Enter'a bas.
        5. Bu ilk sürümü Git ile kaydet: `git add .` sonra `git commit -m "Start tally"`.
    code:
      - file: terminal
        lang: sh
        text: |
          uv init --package --python 3.15 tally
          cd tally
          uv run tally
      - file: src/tally/__init__.py
        lang: python
        text: |
          def main() -> None:
              name = input("What is your name? ")
              print(f"Hello, {name}! Welcome to tally.")
    mistakes:
      - problem:
          en: "\"uv run tally\" says no such command or file."
          tr: "\"uv run tally\" böyle bir komut ya da dosya olmadığını söylüyor."
        fix:
          en: "You are probably in the wrong folder. Run `cd tally` first. The folder you are in must contain `pyproject.toml`."
          tr: "Büyük ihtimalle yanlış klasördesin. Önce `cd tally` çalıştır. İçinde bulunduğun klasörde `pyproject.toml` olmalı."
      - problem:
          en: "Indentation errors: \"IndentationError: expected an indented block\"."
          tr: "Girinti hataları: \"IndentationError: expected an indented block\"."
        fix:
          en: "Python uses the spaces at the start of a line to know what belongs inside the function. Indent the body of `def main()` by four spaces, and do not mix tabs and spaces."
          tr: "Python, bir satırın başındaki boşluklarla neyin fonksiyonun içinde olduğunu anlar. `def main()` gövdesini dört boşlukla gir ve tab ile boşluğu karıştırma."
    quiz:
      - q:
          en: "What does the line tally = \"tally:main\" in pyproject.toml do?"
          tr: "pyproject.toml içindeki tally = \"tally:main\" satırı ne yapar?"
        options:
          en: [It installs a package called tally, It makes the command tally run the function main in the package tally, It renames the project]
          tr: [tally adlı bir paket kurar, tally komutunun tally paketindeki main fonksiyonunu çalıştırmasını sağlar, Projeyi yeniden adlandırır]
        answer: 1
        why:
          en: "Entries under [project.scripts] map a command name to a function, written as package:function."
          tr: "[project.scripts] altındaki girdiler bir komut adını bir fonksiyona bağlar; paket:fonksiyon biçiminde yazılır."
    sources:
      - title: "uv: creating projects"
        url: https://docs.astral.sh/uv/concepts/projects/init/
      - title: "uv: running commands in a project"
        url: https://docs.astral.sh/uv/concepts/projects/run/
      - title: "Python tutorial: formatted string literals"
        url: https://docs.python.org/3/tutorial/inputoutput.html#formatted-string-literals

  - id: money
    stage: basics
    title:
      en: "Model an expense: a dataclass and exact money"
      tr: "Bir harcamayı modelleme: dataclass ve tam para hesabı"
    minutes: 50
    needs: [hello]
    why:
      en: "Before you store anything you need to say what an expense is. A small class gives the data a shape, and keeping money as whole cents avoids the classic bug where 0.1 + 0.2 is not 0.3. Bad input must become a clear message, not a crash, so you also learn your own exception."
      tr: "Bir şeyi kaydetmeden önce harcamanın ne olduğunu tanımlaman gerekir. Küçük bir sınıf veriye şekil verir; parayı tam kuruş olarak tutmak da 0.1 + 0.2'nin 0.3 etmediği klasik hatayı önler. Hatalı girdi çökme değil, anlaşılır bir mesaj olmalı; bu yüzden kendi exception'ını da öğrenirsin."
    learn:
      en: |
        - `@dataclass` writes `__init__`, `__repr__` and `__eq__` for you; `frozen=True` makes objects read-only
        - Why money is stored as an integer number of cents, and what `Decimal` is for
        - `try` / `except` and your own error class (`TallyError`)
        - A list comprehension or generator with `sum(...)` adds up values
        - Type hints (`str`, `int`, `date`) document the code; Python does not enforce them
      tr: |
        - `@dataclass` senin için `__init__`, `__repr__` ve `__eq__` yazar; `frozen=True` nesneleri salt okunur yapar
        - Paranın neden tam sayı kuruş olarak tutulduğu ve `Decimal`'in ne işe yaradığı
        - `try` / `except` ve kendi hata sınıfın (`TallyError`)
        - `sum(...)` ile bir liste ya da generator içindeki değerleri toplamak
        - Tip ipuçları (`str`, `int`, `date`) kodu belgeler; Python bunları zorlamaz
    do:
      en: |
        1. Create the file `src/tally/models.py` with the code below.
        2. Create `try_it.py` in the project folder (next to `pyproject.toml`) with the second code block. It is only a scratch file to play with.
        3. Run it with `uv run python try_it.py`. You should see `0.30000000000000004` (the float problem), the cents `450 450 1200`, an `Expense(...)` line, `16.50` and `error: not a number: 'abc'`.
        4. Change the amounts in `try_it.py` and run it again. Try `parse_amount("1.234")` and `parse_amount("-5")` and read the messages.
        5. Delete `try_it.py` when you are done and commit: `git add .` then `git commit -m "Add the expense model"`.
      tr: |
        1. `src/tally/models.py` dosyasını aşağıdaki kodla oluştur.
        2. Proje klasöründe (`pyproject.toml`'un yanında) ikinci kod bloğuyla `try_it.py` oluştur. Sadece denemeler için bir karalama dosyası.
        3. `uv run python try_it.py` ile çalıştır. `0.30000000000000004` (float sorunu), `450 450 1200` kuruşları, bir `Expense(...)` satırı, `16.50` ve `error: not a number: 'abc'` görmelisin.
        4. `try_it.py` içindeki tutarları değiştirip tekrar çalıştır. `parse_amount("1.234")` ve `parse_amount("-5")` dene, mesajları oku.
        5. İşin bitince `try_it.py`'yi sil ve commit et: `git add .` sonra `git commit -m "Add the expense model"`.
    code:
      - file: src/tally/models.py
        lang: python
        text: |
          from dataclasses import dataclass
          from datetime import date
          from decimal import Decimal, InvalidOperation


          class TallyError(Exception):
              """An error with a message that is safe to show to the user."""


          @dataclass(frozen=True)
          class Expense:
              day: date
              cents: int
              category: str
              note: str = ""
              id: int = 0


          def parse_amount(text: str) -> int:
              """Turn "4.50" into 450 cents. Money is kept in whole cents, never in floats."""
              try:
                  value = Decimal(text.strip().replace(",", "."))
              except InvalidOperation:
                  raise TallyError(f"not a number: {text!r}") from None
              if not value.is_finite() or value <= 0:
                  raise TallyError("the amount must be more than zero")
              if value > 1_000_000:
                  raise TallyError("the amount is too large")
              cents = value * 100
              if cents != cents.to_integral_value():
                  raise TallyError("use at most two decimals")
              return int(cents)


          def format_cents(cents: int) -> str:
              return f"{cents // 100}.{cents % 100:02d}"
      - file: try_it.py
        lang: python
        text: |
          from datetime import date

          from tally.models import Expense, TallyError, format_cents, parse_amount

          print(0.1 + 0.2)
          print(parse_amount("4.50"), parse_amount("4,5"), parse_amount("12"))

          expenses = [
              Expense(date(2026, 10, 17), parse_amount("4.50"), "coffee"),
              Expense(date(2026, 10, 17), parse_amount("12"), "food", "lunch"),
          ]
          print(expenses[0])
          print(format_cents(sum(e.cents for e in expenses)))

          try:
              parse_amount("abc")
          except TallyError as err:
              print("error:", err)
      - file: terminal
        lang: sh
        text: |
          uv run python try_it.py
    mistakes:
      - problem:
          en: "Storing money as a float (4.5 * 3 looks fine, but 0.1 + 0.2 is 0.30000000000000004)."
          tr: "Parayı float olarak tutmak (4.5 * 3 iyi görünür ama 0.1 + 0.2 sonucu 0.30000000000000004 çıkar)."
        fix:
          en: "Keep whole cents in an `int` and only format them as 4.50 when you print. Parse user text with `Decimal`, not `float`."
          tr: "Tam kuruşu bir `int` içinde tut ve sadece yazdırırken 4.50 biçimine çevir. Kullanıcının yazdığı metni `float` ile değil `Decimal` ile çöz."
      - problem:
          en: "\"ModuleNotFoundError: No module named 'tally'\" when you run python try_it.py."
          tr: "python try_it.py çalıştırınca \"ModuleNotFoundError: No module named 'tally'\" hatası."
        fix:
          en: "Plain `python` does not know your project's environment. Start it with `uv run python try_it.py`."
          tr: "Düz `python` projenin ortamını bilmez. `uv run python try_it.py` ile başlat."
    quiz:
      - q:
          en: "Why does tally keep an amount of 4.50 as the integer 450?"
          tr: "Tally neden 4.50 tutarını 450 tam sayısı olarak tutar?"
        options:
          en: [Integers use less memory, Floats cannot store every decimal exactly so sums can drift, Python cannot print decimals]
          tr: [Tam sayılar daha az bellek kullanır, Float her ondalığı tam saklayamaz ve toplamlar kayabilir, Python ondalık yazdıramaz]
        answer: 1
        why:
          en: "Floats are binary approximations (0.1 + 0.2 is not exactly 0.3). Whole cents add up exactly."
          tr: "Float'lar ikilik yaklaşık değerlerdir (0.1 + 0.2 tam olarak 0.3 değildir). Tam kuruşlar kesin toplanır."
    sources:
      - title: "dataclasses: Data Classes"
        url: https://docs.python.org/3/library/dataclasses.html
      - title: "decimal: Decimal fixed-point and floating-point arithmetic"
        url: https://docs.python.org/3/library/decimal.html
      - title: "Python tutorial: user-defined exceptions"
        url: https://docs.python.org/3/tutorial/errors.html#user-defined-exceptions

  - id: json-cli
    stage: first-project
    title:
      en: "A command-line tool that saves to a JSON file"
      tr: "JSON dosyasına kaydeden bir komut satırı aracı"
    minutes: 75
    needs: [money]
    why:
      en: "A program that forgets everything when it stops is only a toy. A JSON file is the simplest place to keep data, and a command line (`tally add 4.50 coffee`) is the simplest user interface: no screens, just text in and text out. Together they make tally a real tool you can use today."
      tr: "Durduğunda her şeyi unutan bir program oyuncaktan öte değildir. JSON dosyası veriyi tutmanın en basit yeridir, komut satırı da (`tally add 4.50 coffee`) en basit arayüzdür: ekran yok, sadece metin girer, metin çıkar. İkisi birlikte tally'yi bugün kullanabileceğin gerçek bir araç yapar."
    learn:
      en: |
        - `json.load` and `json.dump`, and why `ensure_ascii=False` keeps letters like ş and İ readable
        - `pathlib.Path`: build paths with `/`, check `exists()`, create folders with `mkdir(parents=True, exist_ok=True)`
        - Writing a file safely: write to a temporary file, then `replace` the real one, so a crash cannot leave half a file
        - `argparse` with sub-commands (`add`, `list`, `total`), and why `main()` returns an exit code (0 means success)
      tr: |
        - `json.load` ve `json.dump`; `ensure_ascii=False` ş ve İ gibi harflerin okunur kalmasını neden sağlar
        - `pathlib.Path`: `/` ile yol birleştirme, `exists()` kontrolü, `mkdir(parents=True, exist_ok=True)` ile klasör oluşturma
        - Bir dosyayı güvenli yazmak: önce geçici dosyaya yaz, sonra gerçeğinin yerine `replace` et; böylece çökme yarım dosya bırakamaz
        - Alt komutlu `argparse` (`add`, `list`, `total`) ve `main()` neden bir çıkış kodu döndürür (0 başarı demek)
    do:
      en: |
        1. Create `src/tally/jsonstore.py` with the first code block. It reads and writes one JSON file.
        2. Create `src/tally/cli.py` with the second block. `build_parser` describes the commands, `run` does the work and `main` ties them together.
        3. Replace `src/tally/__init__.py` with the third block, and create `src/tally/__main__.py` with the fourth. The last one lets you also start the tool with `python -m tally`.
        4. Try it. Use `--data demo.json` so your experiments go into a throw-away file: run the commands in the terminal block and open `demo.json` to see the data.
        5. Run `uv run tally --help` and `uv run tally add --help` to see the help text argparse wrote for you.
        6. Commit: `git add .` then `git commit -m "Save expenses to a JSON file"`.
      tr: |
        1. İlk kod bloğuyla `src/tally/jsonstore.py` dosyasını oluştur. Tek bir JSON dosyasını okur ve yazar.
        2. İkinci blokla `src/tally/cli.py` dosyasını oluştur. `build_parser` komutları tanımlar, `run` işi yapar, `main` ikisini birbirine bağlar.
        3. `src/tally/__init__.py` dosyasını üçüncü blokla değiştir, dördüncü blokla da `src/tally/__main__.py` oluştur. Sonuncusu aracı `python -m tally` ile de başlatmanı sağlar.
        4. Dene. Denemelerin atılabilir bir dosyaya gitsin diye `--data demo.json` kullan: terminal bloğundaki komutları çalıştır ve verinin nasıl göründüğünü görmek için `demo.json` dosyasını aç.
        5. argparse'ın senin için yazdığı yardım metnini görmek için `uv run tally --help` ve `uv run tally add --help` çalıştır.
        6. Commit et: `git add .` sonra `git commit -m "Save expenses to a JSON file"`.
    code:
      - file: src/tally/jsonstore.py
        lang: python
        text: |
          import json
          from datetime import date
          from pathlib import Path

          from .models import Expense


          class JsonStore:
              """Keeps everything in one JSON file. Simple, but it rewrites the whole file on every change."""

              def __init__(self, path: Path):
                  self.path = path

              def _load(self) -> dict:
                  if not self.path.exists():
                      return {"expenses": [], "checkins": []}
                  with self.path.open(encoding="utf-8") as f:
                      return json.load(f)

              def _save(self, data: dict) -> None:
                  self.path.parent.mkdir(parents=True, exist_ok=True)
                  tmp = self.path.with_name(self.path.name + ".tmp")
                  with tmp.open("w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                  tmp.replace(self.path)  # swap in the finished file in one step

              def add_expense(self, day: date, cents: int, category: str, note: str = "") -> Expense:
                  data = self._load()
                  new_id = max((e["id"] for e in data["expenses"]), default=0) + 1
                  data["expenses"].append(
                      {"id": new_id, "day": day.isoformat(), "cents": cents, "category": category, "note": note}
                  )
                  self._save(data)
                  return Expense(day, cents, category, note, new_id)

              def list_expenses(self, category: str | None = None, limit: int | None = None) -> list[Expense]:
                  rows = [
                      Expense(date.fromisoformat(e["day"]), e["cents"], e["category"], e["note"], e["id"])
                      for e in self._load()["expenses"]
                      if category is None or e["category"] == category
                  ]
                  rows.sort(key=lambda e: (e.day, e.id), reverse=True)  # newest first
                  return rows[:limit]

              def totals_by_category(self) -> dict[str, int]:
                  totals: dict[str, int] = {}
                  for e in self.list_expenses():
                      totals[e.category] = totals.get(e.category, 0) + e.cents
                  return totals
      - file: src/tally/cli.py
        lang: python
        text: |
          import argparse
          import os
          import sys
          from datetime import date
          from pathlib import Path

          from .jsonstore import JsonStore
          from .models import TallyError, format_cents, parse_amount


          def default_path() -> Path:
              return Path(os.environ.get("TALLY_DATA", Path.home() / ".tally" / "data.json"))


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(prog="tally", description="Track your expenses and habits.")
              parser.add_argument("--data", type=Path, help="data file (default: ~/.tally/data.json)")
              sub = parser.add_subparsers(dest="command", required=True)

              add = sub.add_parser("add", help="record an expense")
              add.add_argument("amount", help="for example 4.50")
              add.add_argument("category", help="for example coffee")
              add.add_argument("note", nargs="?", default="")
              add.add_argument("--date", type=date.fromisoformat, help="YYYY-MM-DD (default: today)")

              ls = sub.add_parser("list", help="show expenses, newest first")
              ls.add_argument("--category")

              sub.add_parser("total", help="show the total for each category")
              return parser


          def run(args: argparse.Namespace, store: JsonStore, today: date) -> None:
              if args.command == "add":
                  e = store.add_expense(args.date or today, parse_amount(args.amount), args.category, args.note)
                  print(f"added #{e.id}: {format_cents(e.cents)} {e.category}")
              elif args.command == "list":
                  for e in store.list_expenses(args.category):
                      print(f"{e.id:>3}  {e.day}  {format_cents(e.cents):>9}  {e.category:<12} {e.note}")
              elif args.command == "total":
                  totals = store.totals_by_category()
                  for category, cents in sorted(totals.items()):
                      print(f"{category:<12} {format_cents(cents):>9}")
                  print(f"{'all':<12} {format_cents(sum(totals.values())):>9}")


          def main(argv: list[str] | None = None) -> int:
              args = build_parser().parse_args(argv)
              try:
                  run(args, JsonStore(args.data or default_path()), date.today())
              except TallyError as err:
                  print(f"error: {err}", file=sys.stderr)
                  return 1
              return 0
