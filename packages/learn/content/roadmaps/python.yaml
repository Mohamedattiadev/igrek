  - id: habits
    stage: first-project
    title:
      en: "Add habits and streaks"
      tr: "Alışkanlıklar ve seri (streak) ekleme"
    minutes: 45
    needs: [json-cli]
    why:
      en: "Tally tracks habits as well as money. Habits add a second kind of data and a bit of real logic: counting the days in a row. It also shows you how to keep logic in a small function with no file or database in it, which makes it easy to test later."
      tr: "Tally paranın yanında alışkanlıkları da takip eder. Alışkanlıklar ikinci bir veri türü ve biraz gerçek mantık getirir: üst üste gelen günleri saymak. Ayrıca mantığı dosya ya da veritabanı olmayan küçük bir fonksiyonda tutmayı gösterir; bu da sonra test etmeyi kolaylaştırır."
    learn:
      en: |
        - `datetime.date` and `timedelta`: today, yesterday, one day earlier
        - A `set` keeps unique values, and `in` on a set is fast
        - A `while` loop that counts until a condition fails
        - A pure function (same input, same output, no side effects) is easy to test
      tr: |
        - `datetime.date` ve `timedelta`: bugün, dün, bir gün önce
        - `set` benzersiz değerleri tutar ve set üzerinde `in` hızlıdır
        - Bir koşul bozulana kadar sayan `while` döngüsü
        - Saf fonksiyon (aynı girdi, aynı çıktı, yan etki yok) test etmesi kolaydır
    do:
      en: |
        1. Create `src/tally/habits.py` with the first block. A streak is the number of days in a row that end today. If you have not checked in yet today, the streak still counts up to yesterday, because the day is not over.
        2. Open `src/tally/jsonstore.py` and paste the second block at the bottom of the file, inside the `JsonStore` class (keep the four spaces of indentation). It adds `check_in` and `habit_days`.
        3. Replace `src/tally/cli.py` with the third block. It adds the commands `done` and `streaks`.
        4. Try the commands in the terminal block, then run `uv run tally --data demo.json done run` a second time. It should say "already done today".
        5. Commit: `git add .` then `git commit -m "Add habits and streaks"`.
      tr: |
        1. İlk blokla `src/tally/habits.py` dosyasını oluştur. Seri, bugün biten üst üste gün sayısıdır. Bugün henüz check-in yapmadıysan seri yine de dünü sayar, çünkü gün bitmedi.
        2. `src/tally/jsonstore.py` dosyasını aç ve ikinci bloğu dosyanın sonuna, `JsonStore` sınıfının içine yapıştır (dört boşluk girintiyi koru). `check_in` ve `habit_days` ekler.
        3. `src/tally/cli.py` dosyasını üçüncü blokla değiştir. `done` ve `streaks` komutlarını ekler.
        4. Terminal bloğundaki komutları dene, sonra `uv run tally --data demo.json done run` komutunu ikinci kez çalıştır. "already done today" demeli.
        5. Commit et: `git add .` sonra `git commit -m "Add habits and streaks"`.
    code:
      - file: src/tally/habits.py
        lang: python
        text: |
          from datetime import date, timedelta


          def current_streak(days: set[date], today: date) -> int:
              """Count the days in a row up to today. If today is not checked yet, count up to yesterday."""
              day = today if today in days else today - timedelta(days=1)
              streak = 0
              while day in days:
                  streak += 1
                  day -= timedelta(days=1)
              return streak
      - file: src/tally/jsonstore.py
        lang: python
        text: |
              def check_in(self, habit: str, day: date) -> bool:
                  """Mark a habit done on a day. Returns False if it was already marked."""
                  data = self._load()
                  entry = {"habit": habit, "day": day.isoformat()}
                  if entry in data["checkins"]:
                      return False
                  data["checkins"].append(entry)
                  self._save(data)
                  return True

              def habit_days(self) -> dict[str, set[date]]:
                  habits: dict[str, set[date]] = {}
                  for c in self._load()["checkins"]:
                      habits.setdefault(c["habit"], set()).add(date.fromisoformat(c["day"]))
                  return habits
