  - id: persist
    stage: data-api
    title:
      en: "Keep the habits after a reload"
      tr: "Sayfa yenilenince alışkanlıkları koruma"
    minutes: 45
    needs: [pages]
    why:
      en: "Right now a reload empties the list. Saving it in the browser's localStorage keeps it on this computer. You also use a deep `watch`, the Vue way to keep something outside Vue in sync with your state."
      tr: "Şu an sayfa yenilenince liste boşalıyor. Onu tarayıcının localStorage'ında saklamak bu bilgisayarda korur. Vue dışındaki bir şeyi state ile uyumlu tutmanın Vue yolu olan derin (deep) bir `watch` de kullanırsın."
    learn:
      en: |
        - `localStorage` keeps text per site in the browser; objects go in as JSON
        - Reading it once when the store is created, and treating missing or broken data as an empty list
        - `watch(source, callback, { deep: true })` also notices changes inside an array or object
      tr: |
        - `localStorage` tarayıcıda site başına metin saklar; nesneler JSON olarak girer
        - Store oluşturulurken onu bir kez okumak, eksik ya da bozuk veriyi boş liste saymak
        - `watch(kaynak, callback, { deep: true })` bir dizinin ya da nesnenin içindeki değişiklikleri de fark eder
    do:
      en: |
        1. Replace `src/stores/habits.ts` with the code below: `load()` reads the saved habits, and a deep `watch` saves them on every change.
        2. Add a few habits, tick one and reload the page: they stay.
        3. In the browser's developer tools (F12 → Application → Local Storage) you can see the saved JSON under the key `habits`.
        4. Delete the `habits` entry there and reload: you start with an empty list again.
      tr: |
        1. `src/stores/habits.ts` dosyasını aşağıdaki kodla değiştir: `load()` kayıtlı alışkanlıkları okur, derin bir `watch` her değişiklikte onları kaydeder.
        2. Birkaç alışkanlık ekle, birini işaretle ve sayfayı yenile: kaybolmazlar.
        3. Tarayıcının geliştirici araçlarında (F12 → Application → Local Storage) `habits` anahtarının altında kayıtlı JSON'u görebilirsin.
        4. Oradaki `habits` kaydını sil ve sayfayı yenile: yine boş bir listeyle başlarsın.
    code:
      - file: src/stores/habits.ts
        lang: ts
        text: |
          import { computed, ref, watch } from 'vue'
          import { defineStore } from 'pinia'
          import { dateKey } from '../dates'
          import type { Habit } from '../types'

          const STORAGE_KEY = 'habits'

          // Read the saved habits once, when the app starts. Missing or broken data means an empty list.
          function load(): Habit[] {
            try {
              const data: unknown = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? '[]')
              return Array.isArray(data) ? (data as Habit[]) : []
            } catch {
              return []
            }
          }

          // A store shared by every component. This is the "setup" style: it looks like <script setup>.
          export const useHabitsStore = defineStore('habits', () => {
            const habits = ref<Habit[]>(load())
            const today = ref(dateKey())

            const doneCount = computed(() => habits.value.filter((h) => h.days.includes(today.value)).length)

            function add(name: string) {
              habits.value.push({ id: crypto.randomUUID(), name, days: [] })
            }

            function toggle(id: string) {
              const habit = habits.value.find((h) => h.id === id)
              if (!habit) return
              habit.days = habit.days.includes(today.value)
                ? habit.days.filter((d) => d !== today.value)
                : [...habit.days, today.value]
            }

            function remove(id: string) {
              habits.value = habits.value.filter((h) => h.id !== id)
            }

            // Save on every change. deep: true also sees push() and changes inside a habit.
            watch(habits, (value) => localStorage.setItem(STORAGE_KEY, JSON.stringify(value)), { deep: true })

            return { habits, today, doneCount, add, toggle, remove }
          })
    mistakes:
      - problem:
          en: "The habits are saved when you add one, but not when you tick one."
          tr: "Alışkanlıklar eklerken kaydediliyor ama işaretlerken kaydedilmiyor."
        fix:
          en: "Without `{ deep: true }` a `watch` on a ref only sees the whole value being replaced, not changes inside it. Add `deep: true`."
          tr: "`{ deep: true }` olmazsa bir ref üzerindeki `watch` sadece bütün değerin değiştirilmesini görür, içindeki değişiklikleri görmez. `deep: true` ekle."
      - problem:
          en: "The app crashes at start-up because the saved text is broken (for example you edited it by hand)."
          tr: "Kayıtlı metin bozuk olduğu için (örneğin elle düzenledin) uygulama açılışta çöküyor."
        fix:
          en: "Wrap `JSON.parse` in `try/catch`, as `load()` does, and fall back to an empty list."
          tr: "`JSON.parse`'ı `load()` gibi `try/catch` içine al ve boş listeye dön."
      - problem:
          en: "Storing passwords or tokens in localStorage."
          tr: "Şifreleri ya da token'ları localStorage'da saklamak."
        fix:
          en: "Any script on the page can read localStorage. Keep only harmless data there."
          tr: "Sayfadaki her script localStorage'ı okuyabilir. Orada sadece zararsız veriler tut."
    quiz:
      - q:
          en: "Why does the watch on habits need { deep: true }?"
          tr: "habits üzerindeki watch'un neden { deep: true } ihtiyacı var?"
        options:
          en: [To run faster, So it also runs when something inside the array or a habit changes, It is required for every watch]
          tr: [Daha hızlı çalışmak için, Dizinin ya da bir alışkanlığın içindeki değişiklikte de çalışması için, Her watch için zorunlu]
        answer: 1
        why:
          en: "A normal watch on a ref triggers only when the value is replaced; deep also tracks changes inside it, like push or a changed field."
          tr: "Bir ref üzerindeki normal watch sadece değer değiştirilince tetiklenir; deep, push ya da değişen bir alan gibi içindeki değişiklikleri de izler."
    sources:
      - title: Window.localStorage (MDN)
        url: https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage
      - title: Vue, deep watchers
        url: https://vuejs.org/guide/essentials/watchers.html#deep-watchers
      - title: JSON.parse (MDN)
        url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse

  - id: fetch
    stage: data-api
    title:
      en: "Load a daily quote from an API"
      tr: "Bir API'den günlük söz yükleme"
    minutes: 60
    needs: [persist]
    why:
      en: "Real apps get data from servers. Fetching means waiting, and the request can fail, so every screen that loads data has three states to show: loading, error and ready."
      tr: "Gerçek uygulamalar verileri sunuculardan alır. Veri çekmek beklemek demek ve istek başarısız olabilir; bu yüzden veri yükleyen her ekranın göstereceği üç durum vardır: yükleniyor, hata ve hazır."
    learn:
      en: |
        - `fetch` and JSON, and checking `response.ok` yourself
        - Showing loading, error and ready with `v-if` / `v-else-if`
        - `onMounted` to start loading when the component appears and `onUnmounted` to cancel with `AbortController`
        - Typing the answer (`interface Quote`) so the editor knows its fields
      tr: |
        - `fetch` ve JSON, ayrıca `response.ok`'u kendin kontrol etmek
        - `v-if` / `v-else-if` ile yükleniyor, hata ve hazır durumlarını göstermek
        - Component göründüğünde yüklemeyi başlatmak için `onMounted`, `AbortController` ile iptal etmek için `onUnmounted`
        - Editör alanlarını bilsin diye cevabı tiplemek (`interface Quote`)
    do:
      en: |
        1. Create `src/components/QuoteCard.vue` below. It loads a random quote from DummyJSON, a free practice API that needs no key.
        2. Show it in `src/views/TodayView.vue` right under the title: add the import and `<QuoteCard />`.
        3. Reload and see "Loading a quote..." and then a quote.
        4. Turn off your internet (or change the URL), reload, and see the error state and the Try again button.
      tr: |
        1. Aşağıdaki `src/components/QuoteCard.vue` dosyasını oluştur. Anahtar gerektirmeyen ücretsiz bir deneme API'si olan DummyJSON'dan rastgele bir söz yükler.
        2. `src/views/TodayView.vue` içinde başlığın hemen altında göster: import'u ve `<QuoteCard />`'ı ekle.
        3. Sayfayı yenile ve "Loading a quote..." yazısını, sonra bir sözü gör.
        4. İnterneti kapat (ya da adresi değiştir), sayfayı yenile ve hata durumunu ve Try again düğmesini gör.
    code:
      - file: src/components/QuoteCard.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { onMounted, onUnmounted, ref } from 'vue'

          interface Quote {
            quote: string
            author: string
          }

          const URL = 'https://dummyjson.com/quotes/random'

          const quote = ref<Quote | null>(null)
          const status = ref<'loading' | 'error' | 'ready'>('loading')
          const controller = new AbortController()

          async function load() {
            status.value = 'loading'
            try {
              const response = await fetch(URL, { signal: controller.signal })
              if (!response.ok) throw new Error(`HTTP ${response.status}`)
              quote.value = (await response.json()) as Quote
              status.value = 'ready'
            } catch (error) {
              if (error instanceof DOMException && error.name === 'AbortError') return
              status.value = 'error'
            }
          }

          onMounted(load)
          // If the component goes away before the answer comes, cancel the request.
          onUnmounted(() => controller.abort())
          </script>

          <template>
            <p v-if="status === 'loading'">Loading a quote...</p>
            <p v-else-if="status === 'error'">
              Could not load a quote.
              <button type="button" @click="load">Try again</button>
            </p>
            <blockquote v-else-if="quote">
              {{ quote.quote }}
              <footer>{{ quote.author }}</footer>
            </blockquote>
          </template>
      - file: src/views/TodayView.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { computed, watch } from 'vue'
          import { storeToRefs } from 'pinia'
          import AddHabitForm from '../components/AddHabitForm.vue'
          import HabitList from '../components/HabitList.vue'
          import QuoteCard from '../components/QuoteCard.vue'
          import { useHabitsStore } from '../stores/habits'

          const store = useHabitsStore()
          const { habits, today, doneCount } = storeToRefs(store)

          const summary = computed(() => `${doneCount.value}/${habits.value.length} done`)

          watch(
            summary,
            (text) => {
              document.title = text
            },
            { immediate: true },
          )
          </script>

          <template>
            <h1>Today</h1>
            <QuoteCard />
            <AddHabitForm @add="store.add" />
            <p>{{ summary }} today</p>
            <HabitList :habits="habits" :today="today" @toggle="store.toggle" @remove="store.remove" />
          </template>
    mistakes:
      - problem:
          en: "fetch does not throw on a 404 or 500 and broken data is shown."
          tr: "fetch 404 ya da 500'de hata fırlatmaz ve bozuk veri gösterilir."
        fix:
          en: "Check `response.ok` yourself and throw, as the code above does."
          tr: "Yukarıdaki kodda olduğu gibi `response.ok`'u kendin kontrol et ve hata fırlat."
      - problem:
          en: "The browser console says the request was blocked by CORS."
          tr: "Tarayıcı konsolu isteğin CORS tarafından engellendiğini söylüyor."
        fix:
          en: "The server must allow requests from other sites. Pick an API made for browsers, or call it from your own small backend. You cannot fix it in the front end."
          tr: "Sunucu diğer sitelerden gelen isteklere izin vermeli. Tarayıcılar için yapılmış bir API seç ya da onu kendi küçük backend'inden çağır. Front-end'de düzeltilemez."
      - problem:
          en: "Free practice APIs have limits or can be slow or down."
          tr: "Ücretsiz deneme API'lerinin limitleri vardır, yavaş olabilir ya da kapalı olabilir."
        fix:
          en: "That is why the error state exists. The app must keep working without the quote."
          tr: "Hata durumunun var olma sebebi bu. Uygulama söz olmadan da çalışmaya devam etmeli."
    quiz:
      - q:
          en: "Why does the component call controller.abort() in onUnmounted?"
          tr: "Component neden onUnmounted içinde controller.abort() çağırıyor?"
        options:
          en: [To make fetch faster, To cancel the request if the component goes away before it finishes, Because fetch requires it]
          tr: [fetch'i hızlandırmak için, Component istek bitmeden kaybolursa isteği iptal etmek için, Çünkü fetch bunu zorunlu tutuyor]
        answer: 1
        why:
          en: "A request for a component that is gone is wasted work and could update something that no longer exists."
          tr: "Artık olmayan bir component için yapılan istek boşa iştir ve artık var olmayan bir şeyi güncellemeye çalışabilir."
    sources:
      - title: Using the Fetch API (MDN)
        url: https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch
      - title: Vue, lifecycle hooks
        url: https://vuejs.org/guide/essentials/lifecycle.html
      - title: DummyJSON, quotes
        url: https://dummyjson.com/docs/quotes

  - id: tests
    stage: testing
    title:
      en: "Test the app with Vitest and Vue Test Utils"
      tr: "Uygulamayı Vitest ve Vue Test Utils ile test etme"
    minutes: 75
    needs: [fetch]
    why:
      en: "Every change can break something you are not looking at. Tests click and type like a user and check the result in seconds, so you can change code without fear."
      tr: "Her değişiklik bakmadığın bir yeri bozabilir. Testler bir kullanıcı gibi tıklar, yazar ve sonucu saniyeler içinde kontrol eder; böylece kodu korkmadan değiştirebilirsin."
    learn:
      en: |
        - Vitest, the test runner that uses your Vite setup; create-vue already installed it with a `vitest.config.ts` and the `test:unit` script
        - Vue Test Utils: `mount` puts a component on a fake page (jsdom), `find` looks inside, `setValue` and `trigger` act like a user
        - Testing a plain function (`streak`), a store, and the whole app with its own Pinia and a router that lives in memory
        - Replacing `fetch` and `localStorage` with fakes so tests are fast and never use the network
      tr: |
        - Vite ayarlarını kullanan test çalıştırıcısı Vitest; create-vue onu `vitest.config.ts` ve `test:unit` script'iyle zaten kurdu
        - Vue Test Utils: `mount` bir component'i sahte bir sayfaya (jsdom) koyar, `find` içinde arar, `setValue` ve `trigger` kullanıcı gibi davranır
        - Düz bir fonksiyonu (`streak`), bir store'u ve kendi Pinia'sı ile bellekte yaşayan bir router'ı olan bütün uygulamayı test etmek
        - Testler hızlı olsun ve ağı hiç kullanmasın diye `fetch` ve `localStorage`'ı sahtesiyle değiştirmek
    do:
      en: |
        1. Delete the example test if there is one in `src/__tests__/`, then create `dates.spec.ts` and `App.spec.ts` below.
        2. Run the tests once with the command below. All should pass. (`npm run test:unit` alone keeps watching your files and re-runs on every save, which is nice while writing tests.)
        3. Break the app on purpose (for example remove the line `emit('add', clean)` in `AddHabitForm.vue`, or change `streak` in `dates.ts`) and see which test fails, then fix it.
        4. Run `npm run build`: it also type-checks everything, tests included, with `vue-tsc`.
      tr: |
        1. `src/__tests__/` içinde örnek bir test varsa sil, sonra aşağıdaki `dates.spec.ts` ve `App.spec.ts` dosyalarını oluştur.
        2. Aşağıdaki komutla testleri bir kez çalıştır. Hepsi geçmeli. (Sadece `npm run test:unit` dosyalarını izlemeye devam eder ve her kaydettiğinde yeniden çalışır; test yazarken güzeldir.)
        3. Uygulamayı bilerek boz (örneğin `AddHabitForm.vue` içindeki `emit('add', clean)` satırını sil ya da `dates.ts` içindeki `streak`'i değiştir) ve hangi testin kırıldığını gör, sonra düzelt.
        4. `npm run build` çalıştır: o aynı zamanda her şeyi, testler dahil, `vue-tsc` ile tip kontrolünden geçirir.
    code:
      - file: terminal
        lang: sh
        text: |
          npm run test:unit -- --run
      - file: src/__tests__/dates.spec.ts
        lang: ts
        text: |
          import { describe, expect, it } from 'vitest'
          import { dateKey, streak } from '../dates'

          describe('dateKey', () => {
            it('formats a date as YYYY-MM-DD', () => {
              expect(dateKey(new Date(2026, 9, 18))).toBe('2026-10-18')
            })
          })

          describe('streak', () => {
            const today = new Date(2026, 9, 18)

            it('counts days in a row up to today', () => {
              expect(streak(['2026-10-16', '2026-10-17', '2026-10-18'], today)).toBe(3)
            })

            it('keeps the streak alive when today is not done yet', () => {
              expect(streak(['2026-10-16', '2026-10-17'], today)).toBe(2)
            })

            it('is 0 after a missed day', () => {
              expect(streak(['2026-10-15'], today)).toBe(0)
            })
          })
      - file: src/__tests__/App.spec.ts
        lang: ts
        text: |
          import { beforeEach, describe, expect, it, vi } from 'vitest'
          import { flushPromises, mount } from '@vue/test-utils'
          import { createPinia, setActivePinia } from 'pinia'
          import { createMemoryHistory, createRouter } from 'vue-router'
          import App from '../App.vue'
          import { useHabitsStore } from '../stores/habits'

          // Mount the whole app with its own fresh Pinia and a router that lives in memory.
          async function mountApp() {
            const pinia = createPinia()
            const router = createRouter({
              history: createMemoryHistory(),
              routes: [
                { path: '/', component: () => import('../views/TodayView.vue') },
                { path: '/stats', component: () => import('../views/StatsView.vue') },
              ],
            })
            router.push('/')
            await router.isReady()
            return mount(App, { global: { plugins: [pinia, router] } })
          }

          // A tiny fake localStorage. Newer Node.js versions have their own localStorage that is not
          // usable without a file, and it hides jsdom's one. A fake keeps tests the same everywhere.
          function memoryStorage(): Storage {
            const data = new Map<string, string>()
            return {
              get length() {
                return data.size
              },
              getItem: (key) => data.get(key) ?? null,
              setItem: (key, value) => void data.set(key, String(value)),
              removeItem: (key) => void data.delete(key),
              clear: () => data.clear(),
              key: (index) => [...data.keys()][index] ?? null,
            }
          }

          beforeEach(() => {
            vi.stubGlobal('localStorage', memoryStorage())
            // The quote card calls fetch; give it a fake answer so tests never use the network.
            vi.stubGlobal(
              'fetch',
              vi.fn(async () => Response.json({ quote: 'Keep going.', author: 'Test' })),
            )
          })

          describe('store', () => {
            it('adds, toggles and removes a habit', () => {
              setActivePinia(createPinia())
              const store = useHabitsStore()
              store.add('Stretch')
              const id = store.habits[0]!.id
              store.toggle(id)
              expect(store.doneCount).toBe(1)
              store.toggle(id)
              expect(store.doneCount).toBe(0)
              store.remove(id)
              expect(store.habits).toHaveLength(0)
            })
          })

          describe('App', () => {
            it('adds a habit and marks it done', async () => {
              const wrapper = await mountApp()
              await wrapper.find('input:not([type=checkbox])').setValue('Drink water')
              await wrapper.find('form').trigger('submit')
              expect(wrapper.text()).toContain('Drink water')
              expect(wrapper.text()).toContain('0/1 done')

              await wrapper.find('input[type=checkbox]').setValue(true)
              expect(wrapper.text()).toContain('1/1 done')
            })

            it('keeps habits after a reload', async () => {
              const first = await mountApp()
              await first.find('input:not([type=checkbox])').setValue('Read')
              await first.find('form').trigger('submit')
              first.unmount()

              const second = await mountApp()
              expect(second.text()).toContain('Read')
            })

            it('shows a quote from the API', async () => {
              const wrapper = await mountApp()
              await flushPromises()
              expect(wrapper.text()).toContain('Keep going.')
            })
          })
    mistakes:
      - problem:
          en: "\"Cannot read properties of undefined (reading 'clear')\" (or `localStorage is not available because --localstorage-file was not provided`) in tests."
          tr: "Testlerde \"Cannot read properties of undefined (reading 'clear')\" (ya da `localStorage is not available because --localstorage-file was not provided`) hatası."
        fix:
          en: "Newer Node.js versions have their own `localStorage` that does not work without a file and hides the one from jsdom. Replace it with a small fake in `beforeEach`, as the test above does."
          tr: "Yeni Node.js sürümlerinin kendi `localStorage`'ı var; bir dosya olmadan çalışmaz ve jsdom'unkini gizler. Yukarıdaki testte olduğu gibi `beforeEach` içinde küçük bir sahtesiyle değiştir."
      - problem:
          en: "The test checks the page before Vue has updated it, and the text is not there yet."
          tr: "Test, Vue sayfayı güncellemeden önce kontrol ediyor ve metin henüz orada değil."
        fix:
          en: "Vue updates the page asynchronously. `await` the helpers (`setValue`, `trigger`) or call `await flushPromises()` after something async, such as a mocked fetch."
          tr: "Vue sayfayı asenkron günceller. Yardımcıları (`setValue`, `trigger`) `await` et ya da sahte bir fetch gibi asenkron bir şeyden sonra `await flushPromises()` çağır."
      - problem:
          en: "Tests share data and pass alone but fail together."
          tr: "Testler veriyi paylaşıyor; tek tek geçiyor ama birlikte kırılıyor."
        fix:
          en: "Give every test its own fresh `createPinia()` and storage, as `mountApp` and `beforeEach` do."
          tr: "Her teste, `mountApp` ve `beforeEach`'in yaptığı gibi kendi taze `createPinia()` ve depolamasını ver."
    quiz:
      - q:
          en: "Why does the test replace fetch with a fake?"
          tr: "Test neden fetch'i sahtesiyle değiştiriyor?"
        options:
          en: [Because fetch does not exist in Node.js, So tests are fast and never depend on the network or a free API, To test the server]
          tr: [Çünkü fetch Node.js'te yok, Testler hızlı olsun ve ağa ya da ücretsiz bir API'ye bağlı olmasın diye, Sunucuyu test etmek için]
        answer: 1
        why:
          en: "A real request would make tests slow and flaky; a fake answer makes them the same every time."
          tr: "Gerçek bir istek testleri yavaş ve kararsız yapar; sahte bir cevap onları her seferinde aynı yapar."
    sources:
      - title: Vue, testing
        url: https://vuejs.org/guide/scaling-up/testing.html
      - title: Vue Test Utils, getting started
        url: https://test-utils.vuejs.org/guide/
      - title: Vitest, getting started
        url: https://vitest.dev/guide/

  - id: security
    stage: security
    title:
      en: "Keep the app and its users safe"
      tr: "Uygulamayı ve kullanıcılarını güvende tutma"
    minutes: 45
    needs: [fetch]
    why:
      en: "Everything in a front-end app is sent to the browser, where anyone can read it. Knowing what Vue protects you from, and what it does not, avoids the most common leaks and attacks."
      tr: "Front-end uygulamasındaki her şey tarayıcıya gönderilir ve orada herkes okuyabilir. Vue'nun seni neye karşı koruduğunu ve neye karşı korumadığını bilmek en sık görülen sızıntıları ve saldırıları önler."
    learn:
      en: |
        - Vue escapes text in `{{ }}` and in normal bindings, which blocks most cross-site scripting (XSS)
        - `v-html` turns that protection off: it puts the text in the page as real HTML, so a script in it can run
        - Never use user-provided text as a component template, and be careful with user-provided URLs in `:href` (for example `javascript:`) and with user-provided `style`
        - Variables starting with `VITE_` end up in the built JavaScript: never put secrets there
        - Checking your packages for known problems with `npm audit`
      tr: |
        - Vue `{{ }}` içindeki ve normal binding'lerdeki metni kaçışlar (escape); bu, siteler arası script saldırılarının (XSS) çoğunu engeller
        - `v-html` bu korumayı kapatır: metni sayfaya gerçek HTML olarak koyar; içindeki bir script çalışabilir
        - Kullanıcının verdiği metni asla bir component template'i olarak kullanma; `:href` içindeki kullanıcı URL'lerine (örneğin `javascript:`) ve kullanıcının verdiği `style`'a dikkat et
        - `VITE_` ile başlayan değişkenler build edilen JavaScript'e girer: oraya asla sır koyma
        - Paketlerini bilinen sorunlara karşı `npm audit` ile kontrol etmek
    do:
      en: |
        1. Add a habit called `<img src=x onerror=alert(1)>`. It shows as plain text: Vue escaped it.
        2. Add the test below as `src/__tests__/security.spec.ts` and run the tests. It checks that no `<img>` element was created.
        3. To see the danger, change `{{ habit.name }}` in `HabitItem.vue` to `<span v-html="habit.name"></span>` for a moment: the test fails and the page runs the code. Then put it back.
        4. Run `npm audit` and read what it reports. Update with `npm update` and run the tests again.
        5. If you ever need an API key, keep it on a server (a small backend or serverless function) that calls the API for you. The browser must never receive it.
      tr: |
        1. `<img src=x onerror=alert(1)>` adında bir alışkanlık ekle. Düz metin olarak görünür: Vue onu kaçışladı.
        2. Aşağıdaki testi `src/__tests__/security.spec.ts` olarak ekle ve testleri çalıştır. Hiçbir `<img>` elemanının oluşmadığını kontrol eder.
        3. Tehlikeyi görmek için `HabitItem.vue` içindeki `{{ habit.name }}` kısmını bir an için `<span v-html="habit.name"></span>` yap: test kırılır ve sayfa kodu çalıştırır. Sonra geri koy.
        4. `npm audit` çalıştır ve ne bildirdiğini oku. `npm update` ile güncelle ve testleri tekrar çalıştır.
        5. Bir gün API anahtarı gerekirse onu, API'yi senin yerine çağıran bir sunucuda (küçük bir backend ya da serverless fonksiyon) tut. Tarayıcı onu asla almamalı.
    code:
      - file: src/__tests__/security.spec.ts
        lang: ts
        text: |
          import { expect, it } from 'vitest'
          import { mount } from '@vue/test-utils'
          import HabitItem from '../components/HabitItem.vue'

          it('shows markup in a habit name as plain text', () => {
            const name = '<img src=x onerror=alert(1)>'
            const wrapper = mount(HabitItem, {
              props: { habit: { id: '1', name, days: [] }, doneToday: false, streak: 0 },
            })
            expect(wrapper.find('img').exists()).toBe(false) // no element was created
            expect(wrapper.text()).toContain(name) // the characters are just text
          })
      - file: terminal
        lang: sh
        text: |
          npm audit
          npm update
          npm run test:unit -- --run
    mistakes:
      - problem:
          en: "Using `v-html` to show text from users or from an API."
          tr: "Kullanıcılardan ya da bir API'den gelen metni göstermek için `v-html` kullanmak."
        fix:
          en: "Avoid it. If you really must show HTML, clean it first with a sanitizer such as DOMPurify, and never trust it just because it came from your own database."
          tr: "Kaçın. Gerçekten HTML göstermen gerekiyorsa önce DOMPurify gibi bir temizleyiciden geçir ve sadece kendi veritabanından geldi diye ona güvenme."
      - problem:
          en: "Putting an API secret in .env as VITE_API_KEY because \"it is in .env so it is private\"."
          tr: "\"Nasılsa .env'de, gizlidir\" diye bir API sırrını .env içine VITE_API_KEY olarak koymak."
        fix:
          en: "Vite puts every VITE_ variable into the code sent to browsers. Anyone can read it with F12. Keep secrets on a server."
          tr: "Vite her VITE_ değişkenini tarayıcıya giden koda koyar. Herkes F12 ile okuyabilir. Sırları sunucuda tut."
      - problem:
          en: "Binding a user-provided link with `:href=\"link\"`."
          tr: "Kullanıcının verdiği bir bağlantıyı `:href=\"link\"` ile bağlamak."
        fix:
          en: "A link like `javascript:...` can run code when clicked. Accept only addresses that start with `https://` (or `http://`) before you bind them."
          tr: "`javascript:...` gibi bir bağlantı tıklanınca kod çalıştırabilir. Bağlamadan önce sadece `https://` (ya da `http://`) ile başlayan adresleri kabul et."
    quiz:
      - q:
          en: "What is the risk of v-html=\"habit.name\"?"
          tr: "v-html=\"habit.name\" kullanmanın riski nedir?"
        options:
          en: ["It is slower", "Text with HTML and scripts from a user would be put in the page as real HTML (XSS)", "Vue stops updating the page"]
          tr: ["Daha yavaş", "Kullanıcıdan gelen HTML'li ve script'li metin sayfaya gerçek HTML olarak konur (XSS)", "Vue sayfayı güncellemeyi bırakır"]
        answer: 1
        why:
          en: "{{ }} always shows text as text; v-html tells Vue to trust the string as HTML, so only use it for content you wrote yourself."
          tr: "{{ }} metni her zaman metin olarak gösterir; v-html Vue'ya dizeye HTML olarak güvenmesini söyler, bu yüzden sadece kendi yazdığın içerik için kullan."
    sources:
      - title: Vue, security
        url: https://vuejs.org/guide/best-practices/security.html
      - title: Vite, env variables
        url: https://vite.dev/guide/env-and-mode
      - title: OWASP, cross-site scripting prevention
        url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      - title: npm audit
        url: https://docs.npmjs.com/cli/commands/npm-audit

  - id: performance
    stage: performance
    title:
      en: "Measure before you optimize"
      tr: "Hızlandırmadan önce ölç"
    minutes: 60
    needs: [tests]
    why:
      en: "Most Vue apps are fast enough without tricks, because Vue only updates what changed. When something is slow, measuring shows the real cause; guessing usually adds complexity without making anything faster."
      tr: "Çoğu Vue uygulaması hile yapmadan yeterince hızlıdır, çünkü Vue sadece değişeni günceller. Bir şey yavaş olduğunda ölçmek gerçek sebebi gösterir; tahmin etmek genelde hiçbir şeyi hızlandırmadan karmaşıklık ekler."
    learn:
      en: |
        - Vue DevTools (browser extension): the component tree, state, and the Performance and Timeline views
        - Lighthouse in Chrome for load speed; always measure a build, not the dev server
        - Loading parts of the app only when needed: a lazy route (`() => import(...)`) and `defineAsyncComponent`
        - `computed` is cached; `shallowRef` and `v-memo` exist for very large data, and you will rarely need them
      tr: |
        - Vue DevTools (tarayıcı eklentisi): component ağacı, state ve Performance ile Timeline görünümleri
        - Yüklenme hızı için Chrome'daki Lighthouse; her zaman build'i ölç, geliştirme sunucusunu değil
        - Uygulamanın parçalarını sadece gerektiğinde yüklemek: lazy bir route (`() => import(...)`) ve `defineAsyncComponent`
        - `computed` önbelleğe alınır; çok büyük veri için `shallowRef` ve `v-memo` vardır, nadiren gerekirler
    do:
      en: |
        1. Install the Vue DevTools browser extension (see the Vue tooling docs), open it in your app and look at the component tree and the state of the store.
        2. In `src/router/index.ts` remove the `StatsView` import and make the stats route lazy, as below. Then run `npm run build`: the output now lists a separate small `StatsView-....js` file, which is downloaded only when someone opens Stats.
        3. Run `npm run preview`, then run Lighthouse (Chrome DevTools → Lighthouse) on the preview address. Development mode is slower on purpose, so always measure a build.
        4. Only if a view is really slow, read the performance guide and try the tools there.
      tr: |
        1. Vue DevTools tarayıcı eklentisini kur (Vue tooling dokümanına bak), uygulamanda aç ve component ağacına ve store'un state'ine bak.
        2. `src/router/index.ts` içinde `StatsView` import'unu kaldır ve stats route'unu aşağıdaki gibi lazy yap. Sonra `npm run build` çalıştır: çıktıda artık ayrı, küçük bir `StatsView-....js` dosyası görünür; o sadece biri Stats'i açınca indirilir.
        3. `npm run preview` çalıştır, sonra önizleme adresinde Lighthouse'u çalıştır (Chrome DevTools → Lighthouse). Geliştirme modu bilerek yavaştır; her zaman build'i ölç.
        4. Sadece bir görünüm gerçekten yavaşsa performans rehberini oku ve oradaki araçları dene.
    code:
      - file: src/router/index.ts
        lang: ts
        text: |
          import { createRouter, createWebHistory } from 'vue-router'
          import TodayView from '../views/TodayView.vue'

          const router = createRouter({
            history: createWebHistory(import.meta.env.BASE_URL),
            routes: [
              { path: '/', name: 'today', component: TodayView },
              { path: '/stats', name: 'stats', component: () => import('../views/StatsView.vue') },
            ],
          })

          export default router
      - file: src/App.vue (defineAsyncComponent, an alternative for a single component)
        lang: ts
        text: |
          import { defineAsyncComponent } from 'vue'

          // The component's code is downloaded only when it is first shown.
          const QuoteCard = defineAsyncComponent(() => import('./components/QuoteCard.vue'))
      - file: terminal
        lang: sh
        text: |
          npm run build
          npm run preview
    mistakes:
      - problem:
          en: "Measuring speed with npm run dev."
          tr: "Hızı npm run dev ile ölçmek."
        fix:
          en: "Development mode adds extra checks and the DevTools plugin. Measure the result of npm run build."
          tr: "Geliştirme modu ek kontroller ve DevTools eklentisini ekler. npm run build sonucunu ölç."
      - problem:
          en: "Adding `v-memo`, `shallowRef` or manual caching everywhere \"to be fast\"."
          tr: "\"Hızlı olsun\" diye her yere `v-memo`, `shallowRef` ya da elle önbellek eklemek."
        fix:
          en: "They make code harder to read and rarely matter for normal apps. Use them where the DevTools profile shows a real problem."
          tr: "Kodu okumayı zorlaştırırlar ve normal uygulamalarda nadiren önem taşırlar. DevTools profili gerçek bir sorun gösterdiği yerde kullan."
    quiz:
      - q:
          en: "What does a lazy route do?"
          tr: "Lazy route ne yapar?"
        options:
          en: [Makes the page slower on purpose, Downloads that page's code only when someone opens it, Skips the page in the build]
          tr: [Sayfayı bilerek yavaşlatır, O sayfanın kodunu sadece biri açınca indirir, Sayfayı build'e dahil etmez]
        answer: 1
        why:
          en: "The bundler puts the page in its own file, so first load is smaller; the file is fetched on the first visit to that page."
          tr: "Bundler sayfayı kendi dosyasına koyar, böylece ilk yükleme küçülür; dosya o sayfaya ilk girişte indirilir."
    sources:
      - title: Vue, performance
        url: https://vuejs.org/guide/best-practices/performance.html
      - title: Vue Router, lazy loading routes
        url: https://router.vuejs.org/guide/advanced/lazy-loading.html
      - title: Vue, async components
        url: https://vuejs.org/guide/components/async.html
      - title: Lighthouse
        url: https://developer.chrome.com/docs/lighthouse/overview

  - id: build
    stage: packaging
    title:
      en: "Build the app for the internet"
      tr: "Uygulamayı internet için build etme"
    minutes: 30
    needs: [tests]
    why:
      en: "The development server is only for you. A build turns your code into a few small, fast files that any web server can send, with no Node.js needed on the server."
      tr: "Geliştirme sunucusu sadece senin için. Build, kodunu herhangi bir web sunucusunun gönderebileceği birkaç küçük ve hızlı dosyaya çevirir; sunucuda Node.js gerekmez."
    learn:
      en: |
        - What `npm run build` makes: type-check with `vue-tsc`, then the `dist` folder with HTML, JavaScript and CSS
        - Trying the build on your computer with `npm run preview`
        - The `base` setting when the app lives in a sub-folder of a site
        - Why hash routing (`/#/stats`) is the simplest choice on a plain static host
      tr: |
        - `npm run build`'in ne ürettiği: `vue-tsc` ile tip kontrolü, sonra HTML, JavaScript ve CSS içeren `dist` klasörü
        - Build'i kendi bilgisayarında `npm run preview` ile denemek
        - Uygulama bir sitenin alt klasöründe duracaksa `base` ayarı
        - Düz bir statik hosting'de hash routing'in (`/#/stats`) neden en basit seçim olduğu
    do:
      en: |
        1. In `vite.config.ts` add `base: '/habits/'` (your repository's name between slashes). The app will live at `https://<user>.github.io/habits/`, not at the root of a site.
        2. In `src/router/index.ts` change `createWebHistory` to `createWebHashHistory`. With normal history, opening `.../habits/stats` directly asks the server for a file that does not exist (404); a hash address (`.../habits/#/stats`) always loads `index.html`.
        3. Run `npm run build` and look at the `dist` folder and the sizes it prints.
        4. Run `npm run preview` and open `http://localhost:4173/habits/`. This is exactly what visitors will get.
        5. `dist` is generated: check that `.gitignore` lists it so it is never committed.
      tr: |
        1. `vite.config.ts` içine `base: '/habits/'` ekle (repo adın, iki eğik çizgi arasında). Uygulama bir sitenin kökünde değil `https://<kullanıcı>.github.io/habits/` adresinde duracak.
        2. `src/router/index.ts` içinde `createWebHistory`'yi `createWebHashHistory` olarak değiştir. Normal history ile `.../habits/stats` adresini doğrudan açmak sunucudan var olmayan bir dosya ister (404); hash'li adres (`.../habits/#/stats`) her zaman `index.html`'i yükler.
        3. `npm run build` çalıştır, `dist` klasörüne ve yazdığı boyutlara bak.
        4. `npm run preview` çalıştır ve `http://localhost:4173/habits/` adresini aç. Ziyaretçilerin alacağı tam olarak budur.
        5. `dist` üretilmiş bir klasör: hiç commit edilmesin diye `.gitignore`'da yazılı olduğunu kontrol et.
    code:
      - file: vite.config.ts
        lang: ts
        text: |
          import { fileURLToPath, URL } from 'node:url'

          import { defineConfig } from 'vite'
          import vue from '@vitejs/plugin-vue'
          import vueDevTools from 'vite-plugin-vue-devtools'

          // https://vite.dev/config/
          export default defineConfig({
            // The app lives at https://<user>.github.io/habits/, so files are loaded from /habits/.
            base: '/habits/',
            plugins: [
              vue(),
              vueDevTools(),
            ],
            resolve: {
              alias: {
                '@': fileURLToPath(new URL('./src', import.meta.url)),
              },
            },
          })
      - file: src/router/index.ts
        lang: ts
        text: |
          import { createRouter, createWebHashHistory } from 'vue-router'
          import TodayView from '../views/TodayView.vue'

          const router = createRouter({
            history: createWebHashHistory(import.meta.env.BASE_URL),
            routes: [
              { path: '/', name: 'today', component: TodayView },
              { path: '/stats', name: 'stats', component: () => import('../views/StatsView.vue') },
            ],
          })

          export default router
      - file: terminal
        lang: sh
        text: |
          npm run build
          npm run preview
    mistakes:
      - problem:
          en: "Opening dist/index.html directly from the file manager shows a blank page."
          tr: "dist/index.html'i dosya yöneticisinden doğrudan açınca sayfa boş görünüyor."
        fix:
          en: "Built files must be served over HTTP. Use npm run preview or a real web server."
          tr: "Build edilmiş dosyalar HTTP üzerinden sunulmalı. npm run preview ya da gerçek bir web sunucusu kullan."
      - problem:
          en: "`npm run build` fails with a type error, though `npm run dev` works."
          tr: "`npm run dev` çalışıyor ama `npm run build` bir tip hatasıyla başarısız oluyor."
        fix:
          en: "The dev server only strips types and never checks them; the build runs `vue-tsc`. Fix the error it names (file and line), or run `npm run type-check` while you work."
          tr: "Geliştirme sunucusu tipleri sadece siler, kontrol etmez; build `vue-tsc` çalıştırır. Söylediği hatayı (dosya ve satır) düzelt ya da çalışırken `npm run type-check` çalıştır."
    quiz:
      - q:
          en: "Does the server need Node.js to host this build?"
          tr: "Bu build'i barındırmak için sunucuda Node.js gerekir mi?"
        options:
          en: ["Yes", "No, it is plain static files", "Only for the JavaScript"]
          tr: ["Evet", "Hayır, düz statik dosyalar", "Sadece JavaScript için"]
        answer: 1
        why:
          en: "A Vite Vue build is static HTML, CSS and JavaScript; any static host can serve it."
          tr: "Vite ile build edilen bir Vue uygulaması statik HTML, CSS ve JavaScript'tir; herhangi bir statik barındırma servisi sunabilir."
    sources:
      - title: Vite, building for production
        url: https://vite.dev/guide/build
      - title: Vite, base option
        url: https://vite.dev/config/shared-options#base
      - title: Vue Router, history modes
        url: https://router.vuejs.org/guide/essentials/history-mode.html

  - id: deploy
    stage: deploy
    title:
      en: "Publish on GitHub Pages"
      tr: "GitHub Pages'te yayınlama"
    minutes: 60
    needs: [build]
    why:
      en: "Publishing makes your app reachable by anyone with the link. With GitHub Actions every push to main tests, builds and publishes the app by itself, for free."
      tr: "Yayınlamak uygulamanı bağlantıya sahip herkesin erişebileceği hale getirir. GitHub Actions ile main'e her push'ta uygulama kendiliğinden test edilir, build edilir ve ücretsiz yayınlanır."
    learn:
      en: |
        - Putting your project on GitHub
        - A GitHub Actions workflow that tests, builds and deploys
        - The free limits (from GitHub's own docs): a published site up to 1 GB, a soft limit of 100 GB of bandwidth per month, and a deployment must finish within 10 minutes. With a free account the repository must be public
        - Other free static hosts: Cloudflare Pages (Free plan: 500 builds per month, 20,000 files per site, 25 MiB per file) and Netlify (Free plan: 300 credits per month with a hard limit). Both can build from your repository; there set `base` back to `'/'`
      tr: |
        - Projeni GitHub'a koymak
        - Test eden, build eden ve yayınlayan bir GitHub Actions workflow'u
        - Ücretsiz limitler (GitHub'ın kendi dokümanlarından): yayınlanan site en çok 1 GB, ayda 100 GB'lık yumuşak (soft) bant genişliği limiti ve bir deploy'un 10 dakika içinde bitmesi gerekir. Ücretsiz hesapta repo herkese açık (public) olmalı
        - Diğer ücretsiz statik hosting'ler: Cloudflare Pages (Free plan: ayda 500 build, site başına 20.000 dosya, dosya başına 25 MiB) ve Netlify (Free plan: ayda 300 kredi, sert limit). İkisi de repondan build edebilir; orada `base`'i tekrar `'/'` yap
    do:
      en: |
        1. Create an empty **public** repository named `habits` on github.com, then connect and push (first commands below).
        2. Create `.github/workflows/deploy.yml` with the content below, commit and push.
        3. On GitHub: *Settings → Pages → Build and deployment → Source: GitHub Actions*.
        4. Open the *Actions* tab and wait for the green check. Your app is at `https://<your-user>.github.io/habits/`.
        5. Open it, add a habit, reload: it is still there. Open `https://<your-user>.github.io/habits/#/stats` directly: it works.
      tr: |
        1. github.com'da `habits` adında boş bir **public** repo oluştur, sonra bağla ve push et (aşağıdaki ilk komutlar).
        2. Aşağıdaki içerikle `.github/workflows/deploy.yml` dosyasını oluştur, commit ve push et.
        3. GitHub'da: *Settings → Pages → Build and deployment → Source: GitHub Actions*.
        4. *Actions* sekmesini aç ve yeşil onayı bekle. Uygulaman `https://<kullanıcı-adın>.github.io/habits/` adresinde.
        5. Aç, bir alışkanlık ekle, sayfayı yenile: hâlâ orada. `https://<kullanıcı-adın>.github.io/habits/#/stats` adresini doğrudan aç: çalışır.
    code:
      - file: terminal
        lang: sh
        text: |
          git branch -M main
          git remote add origin https://github.com/<your-user>/habits.git
          git push -u origin main
      - file: .github/workflows/deploy.yml
        lang: yaml
        text: |
          name: Deploy to GitHub Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-node@v7
                  with:
                    node-version: lts/*
                    cache: npm
                - run: npm ci
                - run: npm run test:unit -- --run
                - run: npm run build
                - uses: actions/configure-pages@v6
                - uses: actions/upload-pages-artifact@v5
                  with:
                    path: ./dist
                - id: deployment
                  uses: actions/deploy-pages@v5
    mistakes:
      - problem:
          en: "The published page is blank and the console shows 404 for the JavaScript files."
          tr: "Yayınlanan sayfa boş ve konsolda JavaScript dosyaları için 404 görünüyor."
        fix:
          en: "base is missing or wrong. For https://user.github.io/habits/ it must be '/habits/', with both slashes, and match your repository name."
          tr: "base eksik ya da yanlış. https://user.github.io/habits/ için iki eğik çizgisiyle '/habits/' olmalı ve repo adınla aynı olmalı."
      - problem:
          en: "The workflow fails at npm ci."
          tr: "Workflow npm ci adımında başarısız oluyor."
        fix:
          en: "package-lock.json must be committed. npm ci installs exactly what it lists."
          tr: "package-lock.json commit edilmiş olmalı. npm ci tam olarak onda yazanları kurar."
      - problem:
          en: "Opening a page like /habits/stats on the live site gives 404."
          tr: "Canlı sitede /habits/stats gibi bir sayfayı açınca 404 geliyor."
        fix:
          en: "GitHub Pages only serves real files. Use hash history (`createWebHashHistory`) as in the build step, or copy `index.html` to `404.html` in the workflow."
          tr: "GitHub Pages sadece gerçek dosyaları sunar. Build adımındaki gibi hash history (`createWebHashHistory`) kullan ya da workflow'da `index.html`'i `404.html` olarak kopyala."
    quiz:
      - q:
          en: "Why does the workflow run the tests before building?"
          tr: "Workflow neden build'den önce testleri çalıştırıyor?"
        options:
          en: [GitHub requires it, So a broken version is never published, To make the build smaller]
          tr: [GitHub zorunlu tutuyor, Bozuk bir sürüm asla yayınlanmasın diye, Build'i küçültmek için]
        answer: 1
        why:
          en: "If a test fails the job stops and the last good version stays online."
          tr: "Bir test başarısız olursa iş durur ve son sağlam sürüm yayında kalır."
    sources:
      - title: Vite, deploying a static site (GitHub Pages, Netlify, Cloudflare Pages)
        url: https://vite.dev/guide/static-deploy
      - title: GitHub Pages limits
        url: https://docs.github.com/en/pages/getting-started-with-github-pages/github-pages-limits
      - title: GitHub Pages with a custom workflow
        url: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
      - title: Cloudflare Pages limits
        url: https://developers.cloudflare.com/pages/platform/limits/

  - id: monitoring
    stage: monitoring
    title:
      en: "Know when it breaks"
      tr: "Bozulduğunda haberin olsun"
    minutes: 45
    needs: [deploy]
    why:
      en: "Once real people use the app you will not see their screens. An error boundary shows a friendly message instead of a broken page, an error handler tells you what broke, and an uptime check tells you when the site is down."
      tr: "Uygulamayı gerçek insanlar kullanmaya başlayınca onların ekranını göremezsin. Error boundary bozuk sayfa yerine dostça bir mesaj gösterir, hata yakalayıcı neyin bozulduğunu söyler, uptime kontrolü de site çöktüğünde haber verir."
    learn:
      en: |
        - `onErrorCaptured`: a component that catches errors from everything below it (rendering, watchers, lifecycle hooks and event handlers)
        - `app.config.errorHandler`: the one place that receives every error Vue catches, to report it
        - `window` `error` and `unhandledrejection` events for errors outside Vue
        - Uptime checks and keeping packages up to date
      tr: |
        - `onErrorCaptured`: altındaki her şeyin (çizim, watcher'lar, lifecycle hook'ları ve olay fonksiyonları) hatalarını yakalayan bir component
        - `app.config.errorHandler`: Vue'nun yakaladığı her hatanın geldiği ve raporlanacağı tek yer
        - Vue dışındaki hatalar için `window`'un `error` ve `unhandledrejection` olayları
        - Uptime kontrolleri ve paketleri güncel tutmak
    do:
      en: |
        1. Create `src/components/ErrorBoundary.vue` below and wrap `<RouterView />` with it in `App.vue` (the full `App.vue` is below).
        2. Replace `src/main.ts` with the code below. `report` is the place to send errors to your error service; the console is the start. In God Eye: the project's *Monitoring* tab gives you a snippet that sends errors to God Eye.
        3. Add the test below as `src/__tests__/ErrorBoundary.spec.ts`: a child throws when clicked, and the boundary shows its message while the error is still reported.
        4. Add your site's address as an uptime check (God Eye *Tools → Uptime*).
        5. Once a month: `npm outdated`, update, run the tests, deploy.
      tr: |
        1. Aşağıdaki `src/components/ErrorBoundary.vue` dosyasını oluştur ve `App.vue` içinde `<RouterView />`'ı onunla sar (tam `App.vue` aşağıda).
        2. `src/main.ts` dosyasını aşağıdaki kodla değiştir. `report`, hataları hata servisine göndereceğin yerdir; konsol başlangıçtır. God Eye'da: projenin *İzleme* sekmesi hataları God Eye'a gönderen bir kod parçası verir.
        3. Aşağıdaki testi `src/__tests__/ErrorBoundary.spec.ts` olarak ekle: bir alt component tıklanınca hata fırlatır; boundary mesajını gösterir ve hata yine de raporlanır.
        4. Sitenin adresini uptime kontrolü olarak ekle (God Eye *Araçlar → Uptime*).
        5. Ayda bir: `npm outdated`, güncelle, testleri çalıştır, deploy et.
    code:
      - file: src/components/ErrorBoundary.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { onErrorCaptured, ref } from 'vue'

          const failed = ref(false)

          // Runs when anything below this component throws while rendering or in a watcher, hook or handler.
          // It does not return false, so the error also reaches app.config.errorHandler (see main.ts).
          onErrorCaptured(() => {
            failed.value = true
          })
          </script>

          <template>
            <p v-if="failed">Something went wrong. Reload the page to try again.</p>
            <slot v-else />
          </template>
      - file: src/App.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { RouterLink, RouterView } from 'vue-router'
          import ErrorBoundary from './components/ErrorBoundary.vue'
          </script>

          <template>
            <header>
              <nav>
                <RouterLink to="/">Today</RouterLink>
                <RouterLink to="/stats">Stats</RouterLink>
              </nav>
            </header>
            <main>
              <ErrorBoundary>
                <RouterView />
              </ErrorBoundary>
            </main>
          </template>

          <style scoped>
          nav a {
            margin-right: 1rem;
          }
          /* RouterLink adds this class to the link of the current page. */
          nav a.router-link-exact-active {
            font-weight: bold;
          }
          </style>
      - file: src/main.ts
        lang: ts
        text: |
          import { createApp } from 'vue'
          import { createPinia } from 'pinia'

          import App from './App.vue'
          import router from './router'

          function report(error: unknown, info?: string) {
            // Send it to your error service here; the console is the start.
            console.error('App error', info, error)
          }

          const app = createApp(App)

          // Errors Vue catches in components, watchers, lifecycle hooks and event handlers.
          app.config.errorHandler = (error, _instance, info) => report(error, info)

          // Errors outside Vue: plain scripts and promises nobody caught.
          window.addEventListener('error', (event) => report(event.error, 'window error'))
          window.addEventListener('unhandledrejection', (event) => report(event.reason, 'unhandled rejection'))

          app.use(createPinia())
          app.use(router)

          app.mount('#app')
      - file: src/__tests__/ErrorBoundary.spec.ts
        lang: ts
        text: |
          import { expect, it, vi } from 'vitest'
          import { defineComponent, h } from 'vue'
          import { mount } from '@vue/test-utils'
          import ErrorBoundary from '../components/ErrorBoundary.vue'

          // A child that works at first and throws when you click it.
          const Fragile = defineComponent({
            render: () =>
              h(
                'button',
                {
                  onClick: () => {
                    throw new Error('boom')
                  },
                },
                'Break',
              ),
          })

          it('shows a message when something below it throws', async () => {
            const errorHandler = vi.fn() // stands in for app.config.errorHandler
            const wrapper = mount(ErrorBoundary, {
              slots: { default: () => h(Fragile) },
              global: { config: { errorHandler } },
            })
            expect(wrapper.text()).toContain('Break')

            await wrapper.find('button').trigger('click')

            expect(wrapper.text()).toContain('Something went wrong')
            expect(errorHandler).toHaveBeenCalled() // the error was still reported
          })
    mistakes:
      - problem:
          en: "Expecting the boundary to catch errors from `fetch` code that has no try/catch, or from a plain `setTimeout`."
          tr: "Boundary'nin try/catch olmayan `fetch` kodundaki ya da düz bir `setTimeout`'taki hataları yakalamasını beklemek."
        fix:
          en: "Vue only sees errors that happen inside its own calls. Handle async errors with try/catch (as `QuoteCard` does); `main.ts` also listens for unhandled ones on `window`."
          tr: "Vue sadece kendi çağrılarının içinde olan hataları görür. Asenkron hataları try/catch ile yakala (`QuoteCard`'ın yaptığı gibi); `main.ts` ayrıca yakalanmamış olanları `window` üzerinden dinler."
      - problem:
          en: "Returning `false` from `onErrorCaptured` and no error ever reaches the reporting code."
          tr: "`onErrorCaptured`'dan `false` döndürmek ve hiçbir hatanın raporlama koduna ulaşmaması."
        fix:
          en: "Returning false stops the error from going up. Return nothing, as above, so it also reaches `app.config.errorHandler`."
          tr: "false döndürmek hatanın yukarı gitmesini durdurur. Yukarıdaki gibi hiçbir şey döndürme; böylece hata `app.config.errorHandler`'a da ulaşır."
    quiz:
      - q:
          en: "What does the error boundary do when a child throws while the app is running?"
          tr: "Bir alt component uygulama çalışırken hata fırlatırsa error boundary ne yapar?"
        options:
          en: [Reloads the page, Shows its own message instead of the broken part, Fixes the error]
          tr: [Sayfayı yeniler, Bozulan kısım yerine kendi mesajını gösterir, Hatayı düzeltir]
        answer: 1
        why:
          en: "onErrorCaptured lets the component notice the error and switch to a fallback message; the rest of the app (the navigation) keeps working."
          tr: "onErrorCaptured component'in hatayı fark edip yedek bir mesaja geçmesini sağlar; uygulamanın geri kalanı (gezinme) çalışmaya devam eder."
    sources:
      - title: Vue, error handling (app.config.errorHandler)
        url: https://vuejs.org/api/application.html#app-config-errorhandler
      - title: Vue, onErrorCaptured
        url: https://vuejs.org/api/composition-api-lifecycle.html#onerrorcaptured
      - title: npm outdated
        url: https://docs.npmjs.com/cli/commands/npm-outdated

  - id: next
    stage: advanced
    title:
      en: "Where to go next"
      tr: "Bundan sonra nereye"
    minutes: 120
    needs: [deploy]
    why:
      en: "You have a tested app on the internet. The next topics are what real projects add as they grow; pick the one your next project needs instead of learning all of them at once."
      tr: "İnternette yayında, testleri yazılmış bir uygulaman var. Sıradaki konular, gerçek projelerin büyüdükçe eklediği şeyler; hepsini birden öğrenmek yerine bir sonraki projenin ihtiyaç duyduğunu seç."
    learn:
      en: |
        - **Nuxt**: the framework built on Vue for server rendering, file-based routing, data loading and a backend in one place, when you need search-engine-friendly pages or a server (`npm create nuxt@latest`)
        - **TypeScript**: you already use it in this project; learn generics and typing props and emits further (see the TypeScript roadmap)
        - **VueUse**: ready-made composables such as `useLocalStorage`, which could replace the saving code in the store
        - **Composables**: moving reusable stateful logic out of components into `use...` functions
        - **End-to-end tests** with Playwright (`create-vue` can add it) and **accessibility**: keyboard use and screen readers
      tr: |
        - **Nuxt**: arama motorlarına uygun sayfalar ya da bir sunucu gerektiğinde, sunucuda çizim, dosya tabanlı routing, veri yükleme ve backend'i tek yerde toplayan, Vue üzerine kurulu framework (`npm create nuxt@latest`)
        - **TypeScript**: bu projede zaten kullanıyorsun; generic'leri ve props ile emit tiplemeyi daha derin öğren (TypeScript yol haritasına bak)
        - **VueUse**: `useLocalStorage` gibi hazır composable'lar; store'daki kaydetme kodunun yerini alabilir
        - **Composable'lar**: tekrar kullanılabilir state'li mantığı component'lerden `use...` fonksiyonlarına taşımak
        - Playwright ile **uçtan uca testler** (`create-vue` ekleyebilir) ve **erişilebilirlik**: klavyeyle kullanım ve ekran okuyucular
    do:
      en: |
        1. Add a feature to the habit tracker: a route with a parameter (`/habits/:id` showing one habit's history) using `useRoute`, or a "best streak" column on Stats.
        2. Or move the quote loading out of `QuoteCard.vue` into a composable `useQuote()` in `src/composables/useQuote.ts`.
        3. Then try `npm create nuxt@latest` in a new folder, and move one page of the tracker into it to see what a framework adds.
      tr: |
        1. Alışkanlık takipçisine bir özellik ekle: `useRoute` kullanan parametreli bir route (`/habits/:id`, tek bir alışkanlığın geçmişini gösterir) ya da Stats'e "en iyi seri" sütunu.
        2. Ya da söz yüklemeyi `QuoteCard.vue` içinden `src/composables/useQuote.ts` dosyasındaki bir `useQuote()` composable'ına taşı.
        3. Sonra yeni bir klasörde `npm create nuxt@latest` dene ve takipçinin bir sayfasını oraya taşıyarak bir framework'ün ne eklediğini gör.
    code:
      - file: src/composables/useQuote.ts
        lang: ts
        text: |
          import { onMounted, ref } from 'vue'

          export interface Quote {
            quote: string
            author: string
          }

          // A composable: state and logic you can reuse in any component.
          export function useQuote() {
            const quote = ref<Quote | null>(null)
            const failed = ref(false)

            onMounted(async () => {
              try {
                const response = await fetch('https://dummyjson.com/quotes/random')
                if (!response.ok) throw new Error(`HTTP ${response.status}`)
                quote.value = (await response.json()) as Quote
              } catch {
                failed.value = true
              }
            })

            return { quote, failed }
          }
    mistakes:
      - problem:
          en: "Learning every library at once and never finishing a project."
          tr: "Her kütüphaneyi aynı anda öğrenmeye çalışıp hiçbir projeyi bitirememek."
        fix:
          en: "Add one thing at a time, only when your app needs it."
          tr: "Her seferinde tek bir şey ekle, sadece uygulaman ona ihtiyaç duyduğunda."
      - problem:
          en: "Starting with Nuxt before understanding plain Vue."
          tr: "Düz Vue'yu anlamadan Nuxt ile başlamak."
        fix:
          en: "Nuxt is Vue plus conventions. What you learned here (components, reactivity, routing, stores) is exactly what you use inside Nuxt."
          tr: "Nuxt, Vue artı kurallardır. Burada öğrendiklerin (component'ler, reaktiflik, routing, store'lar) Nuxt'ın içinde de aynen kullandıkların."
    quiz:
      - q:
          en: "When is Nuxt a good next step?"
          tr: "Nuxt ne zaman iyi bir sonraki adımdır?"
        options:
          en: [When you need server-rendered pages or a server in the same project, Whenever you use Vue, Only for games]
          tr: [Aynı projede sunucuda çizilen sayfalara ya da bir sunucuya ihtiyaç duyduğunda, Vue kullandığın her zaman, Sadece oyunlar için]
        answer: 0
        why:
          en: "A client-only SPA like this one is fine for a tracker; a framework helps when you need server rendering, SEO or a backend."
          tr: "Bunun gibi sadece istemcide çalışan bir SPA bir takipçi için yeterlidir; framework sunucuda çizim, SEO ya da backend gerektiğinde işe yarar."
    sources:
      - title: Vue, ways of using Vue
        url: https://vuejs.org/guide/extras/ways-of-using-vue.html
      - title: Vue, server-side rendering (and Nuxt)
        url: https://vuejs.org/guide/scaling-up/ssr.html
      - title: Nuxt, installation
        url: https://nuxt.com/docs/4.x/getting-started/installation
      - title: Vue, composables
        url: https://vuejs.org/guide/reusability/composables.html
