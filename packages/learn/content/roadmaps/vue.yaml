id: vue
title: Vue
summary:
  en: "From an empty computer to your own Vue app on the internet. You build a real habit tracker step by step and understand why each step is there."
  tr: "Boş bir bilgisayardan internette yayında olan kendi Vue uygulamana. Adım adım gerçek bir alışkanlık takipçisi yazarsın ve her adımın neden orada olduğunu anlarsın."
teacher: frontend
project:
  en: 'A habit tracker single-page app made with create-vue (Vite): add habits, tick them off for today, see your streaks on a Stats page, load a daily quote from a public API, keep everything after a reload, tested with Vitest and published on GitHub Pages.'
  tr: 'create-vue (Vite) ile yapılmış tek sayfalık bir alışkanlık takipçisi: alışkanlık ekleme, bugün için işaretleme, Stats sayfasında serilerini görme, herkese açık bir API''den günlük söz yükleme, sayfa yenilenince hiçbir şeyin kaybolmaması; Vitest ile test edilmiş ve GitHub Pages''te yayında.'
detect:
  npm: [vue]
version: "3.5"
latest: npm:vue
checked: 2026-10
after: [web]
sheets: [javascript, typescript, vue, git]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Node.js, an editor and Git"
      tr: "Node.js, bir editör ve Git kurma"
    minutes: 45
    why:
      en: "Vue apps are built with tools that run on Node.js. An editor with Vue support makes writing code comfortable, and Git keeps every version of your work so you can never really lose it."
      tr: "Vue uygulamaları Node.js üzerinde çalışan araçlarla hazırlanır. Vue desteği olan bir editör kod yazmayı rahatlatır, Git de işinin her sürümünü saklar; böylece hiçbir şeyi gerçekten kaybetmezsin."
    learn:
      en: |
        - What Node.js and npm are, and why a web app needs them while you build it
        - How to open a terminal and check that a program is installed
        - Which Node.js version to pick: the LTS one, and at least 22.18 (the project generator asks for it)
        - Which editor extension understands `.vue` files
      tr: |
        - Node.js ve npm'in ne olduğu, uygulamayı hazırlarken neden gerektiği
        - Terminal açmak ve bir programın kurulu olup olmadığını kontrol etmek
        - Hangi Node.js sürümünü seçmen gerektiği: LTS olanı ve en az 22.18 (proje oluşturucu bunu ister)
        - `.vue` dosyalarını anlayan editör eklentisinin hangisi olduğu
    do:
      en: |
        1. Download **Node.js LTS** from nodejs.org and install it. LTS means "long-term support": it gets fixes for years, so tutorials and tools work with it.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor.
        3. In VS Code open the Extensions panel and install **Vue - Official**. It gives you colours, error messages and suggestions inside `.vue` files. If you ever installed Vetur (the old Vue 2 extension), disable it.
        4. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it.
        5. Open a terminal (in VS Code: *Terminal → New Terminal*) and run the commands below. Each should print a version number, and `node` must print 22.18 or newer (or 24.12 or newer).
        6. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
      tr: |
        1. nodejs.org'dan **Node.js LTS** sürümünü indirip kur. LTS "uzun süreli destek" demek: yıllarca düzeltme alır, eğitimler ve araçlar onunla çalışır.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u kur (code.visualstudio.com).
        3. VS Code'da Extensions panelini aç ve **Vue - Official** eklentisini kur. `.vue` dosyalarında renkler, hata mesajları ve öneriler verir. Daha önce Vetur'u (eski Vue 2 eklentisi) kurduysan onu devre dışı bırak.
        4. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir.
        5. Bir terminal aç (VS Code'da: *Terminal → New Terminal*) ve aşağıdaki komutları çalıştır. Her biri bir sürüm numarası yazmalı; `node` en az 22.18 (ya da en az 24.12) göstermeli.
        6. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
    code:
      - file: terminal
        lang: sh
        text: |
          node --version
          npm --version
          git --version
    mistakes:
      - problem:
          en: "\"command not found\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found\" hatası."
        fix:
          en: "Close the terminal (or VS Code) and open it again so it sees the new program. On Windows, restart if it still fails."
          tr: "Terminali (ya da VS Code'u) kapatıp yeniden aç ki yeni programı görsün. Windows'ta hâlâ olmuyorsa bilgisayarı yeniden başlat."
      - problem:
          en: "An old Node.js is installed and the project generator refuses to run."
          tr: "Eski bir Node.js kurulu ve proje oluşturucu çalışmayı reddediyor."
        fix:
          en: "Install the current LTS from nodejs.org over it and check `node --version` again. The generated project needs 22.18 or newer, or 24.12 or newer."
          tr: "nodejs.org'dan güncel LTS sürümünü üstüne kur ve `node --version` komutunu tekrar çalıştır. Oluşan proje 22.18 ya da daha yenisini, ya da 24.12 ve üstünü ister."
    quiz:
      - q:
          en: "Why pick the LTS version of Node.js?"
          tr: "Node.js'in neden LTS sürümünü seçiyoruz?"
        options:
          en: [It is the fastest, It gets fixes for a long time and tools expect it, It is the only free one]
          tr: [En hızlısı o, Uzun süre düzeltme alır ve araçlar onu bekler, Tek ücretsiz sürüm o]
        answer: 1
        why:
          en: "Every Node.js version is free; LTS lines are supported for years, so they are the safe default."
          tr: "Bütün Node.js sürümleri ücretsiz; LTS sürümleri yıllarca desteklenir, bu yüzden güvenli varsayılan odur."
    sources:
      - title: Node.js downloads
        url: https://nodejs.org/en/download
      - title: Vue, tooling and IDE support
        url: https://vuejs.org/guide/scaling-up/tooling.html#ide-support
      - title: Git installation
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: create
    stage: first-code
    title:
      en: "Create your first Vue app"
      tr: "İlk Vue uygulamanı oluşturma"
    minutes: 30
    needs: [setup]
    why:
      en: "A Vue app needs a few files and a build tool before the first line shows up in the browser. create-vue builds all of it in seconds on top of Vite, and the page updates every time you save, so you see each change at once."
      tr: "Bir Vue uygulamasının tarayıcıda ilk satırı göstermesi için birkaç dosya ve bir build aracı gerekir. create-vue bunların hepsini Vite'ın üstüne saniyeler içinde kurar ve her kaydettiğinde sayfa güncellenir; her değişikliği hemen görürsün."
    learn:
      en: |
        - What `create-vue` does and what each option means (TypeScript, Router, Pinia, Vitest)
        - What Vite does: a development server and a build tool
        - What is in a new project: `index.html`, `src/main.ts`, `src/App.vue`, `package.json`
        - What a single-file component (`.vue` file) looks like: `<script setup>`, `<template>`, `<style>`
      tr: |
        - `create-vue`'nun ne yaptığı ve her seçeneğin (TypeScript, Router, Pinia, Vitest) ne demek olduğu
        - Vite'ın ne yaptığı: bir geliştirme sunucusu ve bir build aracı
        - Yeni projede neler olduğu: `index.html`, `src/main.ts`, `src/App.vue`, `package.json`
        - Tek dosyalık bir component'in (`.vue` dosyası) nasıl göründüğü: `<script setup>`, `<template>`, `<style>`
    do:
      en: |
        1. In the terminal, go to the folder where you keep projects and run the first command below. It creates a folder called `habits` with TypeScript (types that catch mistakes), Vue Router, Pinia and Vitest already set up, and no example code. If you run `npm create vue@latest` alone, it asks the same questions one by one; give the same answers.
        2. Go into the folder, install the packages and start the development server.
        3. Open the address it prints (usually http://localhost:5173).
        4. Replace everything in `src/App.vue` with the code below and save. The page changes at once.
        5. Save this first version with Git: `git init`, `git add .`, `git commit -m "Start the habit tracker"`.
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git ve aşağıdaki ilk komutu çalıştır. `habits` adında bir klasör oluşturur; içinde TypeScript (hataları yakalayan tipler), Vue Router, Pinia ve Vitest hazır gelir, örnek kod yoktur. Sadece `npm create vue@latest` çalıştırırsan aynı soruları tek tek sorar; aynı cevapları ver.
        2. Klasörün içine gir, paketleri kur ve geliştirme sunucusunu başlat.
        3. Yazdığı adresi aç (genelde http://localhost:5173).
        4. `src/App.vue` içindeki her şeyi aşağıdaki kodla değiştir ve kaydet. Sayfa hemen değişir.
        5. Bu ilk sürümü Git ile kaydet: `git init`, `git add .`, `git commit -m "Start the habit tracker"`.
    code:
      - file: terminal
        lang: sh
        text: |
          npm create vue@latest habits -- --ts --router --pinia --vitest --bare
          cd habits
          npm install
          npm run dev
      - file: src/App.vue
        lang: vue
        text: |
          <script setup lang="ts">
          const title = 'Habits'
          </script>

          <template>
            <h1>{{ title }}</h1>
          </template>
    mistakes:
      - problem:
          en: "The page is blank after editing App.vue."
          tr: "App.vue'yu değiştirdikten sonra sayfa bomboş."
        fix:
          en: "Look at the terminal and the browser console (F12). Usually a typo; the error names the file and line."
          tr: "Terminale ve tarayıcı konsoluna (F12) bak. Genelde bir yazım hatasıdır; hata dosyayı ve satırı söyler."
      - problem:
          en: "\"npm run dev\" says it cannot find package.json."
          tr: "\"npm run dev\" package.json bulamadığını söylüyor."
        fix:
          en: "You are in the wrong folder. Run cd habits first."
          tr: "Yanlış klasördesin. Önce cd habits çalıştır."
      - problem:
          en: "Following an old tutorial that uses `vue create` (Vue CLI)."
          tr: "`vue create` (Vue CLI) kullanan eski bir eğitimi takip etmek."
        fix:
          en: "Vue CLI is in maintenance mode. New projects start with `npm create vue@latest`."
          tr: "Vue CLI bakım modunda. Yeni projeler `npm create vue@latest` ile başlar."
    quiz:
      - q:
          en: "Which file holds the component you see on the page right now?"
          tr: "Şu an sayfada gördüğün component hangi dosyada?"
        options:
          en: [index.html, src/App.vue, package.json]
          tr: [index.html, src/App.vue, package.json]
        answer: 1
        why:
          en: "index.html only has an empty element with id app; src/main.ts mounts the App component from src/App.vue into it."
          tr: "index.html'de sadece id'si app olan boş bir eleman var; src/main.ts, src/App.vue'daki App component'ini onun içine yerleştirir."
    sources:
      - title: Vue, quick start
        url: https://vuejs.org/guide/quick-start.html
      - title: Vue, creating an application
        url: https://vuejs.org/guide/essentials/application.html
      - title: Vite, getting started
        url: https://vite.dev/guide/

  - id: components
    stage: basics
    title:
      en: "Components, props, emits and defineModel"
      tr: "Component'ler, props, emit'ler ve defineModel"
    minutes: 60
    needs: [create]
    why:
      en: "Vue apps are made of components, small pieces you can reuse like building blocks. Props are how a parent gives a component its data, emits are how the component tells the parent that something happened, and defineModel lets a component work with v-model."
      tr: "Vue uygulamaları component'lerden oluşur; yapı taşları gibi tekrar kullanılabilen küçük parçalar. Props, bir üst component'in alt component'e veri vermesinin yoludur; emit'ler alt component'in üstüne bir şey olduğunu haber vermesinin yoludur; defineModel de bir component'in v-model ile çalışmasını sağlar."
    learn:
      en: |
        - A component is a `.vue` file; `<script setup>` runs for each copy, and everything declared in it can be used in the template
        - `defineProps`: data flows down. A component must not change its props
        - `defineEmits`: events flow up. In templates `@toggle="..."` listens to the emit `toggle`
        - `defineModel`: a prop plus its update event in one line, so the parent can write `v-model`
        - Props are written `doneToday` in the script and `:done-today` in templates (both work, the dashed form is the usual style)
      tr: |
        - Component bir `.vue` dosyasıdır; `<script setup>` her kopya için çalışır ve içinde tanımlanan her şey template'te kullanılabilir
        - `defineProps`: veri aşağı akar. Bir component kendi props'unu değiştirmemeli
        - `defineEmits`: olaylar yukarı akar. Template'te `@toggle="..."` `toggle` emit'ini dinler
        - `defineModel`: bir prop ve onun güncelleme olayı tek satırda; böylece üst component `v-model` yazabilir
        - Props script'te `doneToday`, template'te `:done-today` yazılır (ikisi de çalışır, tireli biçim yaygın stildir)
    do:
      en: |
        1. Create the folder `src/components` and the file `src/types.ts` below (the shape of a habit).
        2. Create `src/components/HabitItem.vue`: one row with a checkbox and a Delete button. It receives the habit by props and sends `toggle` and `remove` up with emits.
        3. Create `src/components/TextField.vue`: a labelled input that works with `v-model` through `defineModel`.
        4. Replace `src/App.vue` with the code below, which uses both. Type in the field and watch the text under it change.
        5. Click the checkbox and look in the browser console (F12): the parent received the `toggle` event.
      tr: |
        1. `src/components` klasörünü ve aşağıdaki `src/types.ts` dosyasını (bir alışkanlığın şekli) oluştur.
        2. `src/components/HabitItem.vue` dosyasını oluştur: bir onay kutusu ve Delete düğmesi olan tek bir satır. Alışkanlığı props ile alır, `toggle` ve `remove` olaylarını emit ile yukarı gönderir.
        3. `src/components/TextField.vue` dosyasını oluştur: `defineModel` sayesinde `v-model` ile çalışan etiketli bir input.
        4. `src/App.vue` dosyasını ikisini de kullanan aşağıdaki kodla değiştir. Alana yaz ve altındaki metnin değiştiğini izle.
        5. Onay kutusuna tıkla ve tarayıcı konsoluna (F12) bak: üst component `toggle` olayını aldı.
    code:
      - file: src/types.ts
        lang: ts
        text: |
          export interface Habit {
            id: string
            name: string
            /** Days it was done, as "2026-10-18" strings. */
            days: string[]
          }
      - file: src/components/HabitItem.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import type { Habit } from '../types'

          // Props: data that comes in from the parent.
          defineProps<{
            habit: Habit
            doneToday: boolean
          }>()

          // Emits: events this component sends up to the parent.
          const emit = defineEmits<{
            toggle: [id: string]
            remove: [id: string]
          }>()
          </script>

          <template>
            <li>
              <label>
                <input
                  type="checkbox"
                  :checked="doneToday"
                  @change="emit('toggle', habit.id)"
                />
                <span :class="{ done: doneToday }">{{ habit.name }}</span>
              </label>
              <button type="button" :aria-label="`Delete ${habit.name}`" @click="emit('remove', habit.id)">
                Delete
              </button>
            </li>
          </template>

          <style scoped>
          .done {
            text-decoration: line-through;
          }
          </style>
      - file: src/components/TextField.vue
        lang: vue
        text: |
          <script setup lang="ts">
          // defineModel makes this component work with v-model.
          const model = defineModel<string>({ required: true })

          defineProps<{ label: string }>()
          </script>

          <template>
            <label>
              {{ label }}
              <input v-model="model" />
            </label>
          </template>
      - file: src/App.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { ref } from 'vue'
          import HabitItem from './components/HabitItem.vue'
          import TextField from './components/TextField.vue'
          import type { Habit } from './types'

          const habit: Habit = { id: '1', name: 'Drink water', days: [] }
          const name = ref('')

          function onToggle(id: string) {
            console.log('toggle', id)
          }
          </script>

          <template>
            <main>
              <h1>Habits</h1>
              <ul>
                <HabitItem :habit="habit" :done-today="false" @toggle="onToggle" @remove="onToggle" />
              </ul>
              <TextField v-model="name" label="New habit" />
              <p>You typed: {{ name }}</p>
            </main>
          </template>
    mistakes:
      - problem:
          en: "Changing a prop inside the child (for example `habit.name = ...`), and Vue warns or the data gets out of sync."
          tr: "Alt component'in içinde bir prop'u değiştirmek (örneğin `habit.name = ...`) ve Vue'nun uyarması ya da verinin senkron dışı kalması."
        fix:
          en: "Props are read-only. Emit an event and let the parent that owns the data change it."
          tr: "Props salt okunurdur. Bir olay emit et ve veriyi tutan üst component'in değiştirmesini sağla."
      - problem:
          en: "Writing `<script>` instead of `<script setup>`, and the template cannot see your variables."
          tr: "`<script setup>` yerine `<script>` yazmak ve template'in değişkenlerini görememesi."
        fix:
          en: "Add the word setup. Only then are top-level variables, imports and components available in the template."
          tr: "setup kelimesini ekle. Üst seviyedeki değişkenler, import'lar ve component'ler template'te ancak o zaman kullanılabilir."
      - problem:
          en: "Writing `src=\"imageUrl\"` without the colon when you want a value."
          tr: "Bir değer istediğinde iki nokta üst üste olmadan `src=\"imageUrl\"` yazmak."
        fix:
          en: "Without the colon Vue passes the plain text. Use `:src=\"imageUrl\"` (short for `v-bind`) to pass the value."
          tr: "İki nokta olmazsa Vue düz metni geçirir. Değeri geçirmek için `:src=\"imageUrl\"` (`v-bind`'ın kısası) yaz."
    quiz:
      - q:
          en: "How does HabitItem tell App that the checkbox was clicked?"
          tr: "HabitItem, onay kutusuna tıklandığını App'e nasıl söyler?"
        options:
          en: [By changing the habit prop, By emitting a toggle event that App listens to with @toggle, By writing to a global variable]
          tr: [habit prop'unu değiştirerek, App'in @toggle ile dinlediği bir toggle olayı emit ederek, Global bir değişkene yazarak]
        answer: 1
        why:
          en: "Data goes down with props and events go up with emits; the parent decides what to do with the event."
          tr: "Veri props ile aşağı, olaylar emit ile yukarı gider; olayla ne yapılacağına üst component karar verir."
    sources:
      - title: Vue, component basics
        url: https://vuejs.org/guide/essentials/component-basics.html
      - title: Vue, props
        url: https://vuejs.org/guide/components/props.html
      - title: Vue, component events
        url: https://vuejs.org/guide/components/events.html
      - title: Vue, component v-model
        url: https://vuejs.org/guide/components/v-model.html

  - id: reactivity
    stage: basics
    title:
      en: "Reactivity: ref, computed and watch"
      tr: "Reaktiflik: ref, computed ve watch"
    minutes: 60
    needs: [components]
    why:
      en: "Reactivity is what makes Vue feel like magic: change a value and every place that shows it updates. Three tools cover almost everything: `ref` for a value that can change, `computed` for a value worked out from others, and `watch` for doing something when a value changes."
      tr: "Reaktiflik Vue'yu sihir gibi hissettiren şeydir: bir değeri değiştirirsin ve onu gösteren her yer güncellenir. Neredeyse her şeyi üç araç kapsar: değişebilen bir değer için `ref`, başka değerlerden hesaplanan bir değer için `computed` ve bir değer değişince bir şey yapmak için `watch`."
    learn:
      en: |
        - `ref(value)` makes a reactive value. In script you read and write `.value`; in the template Vue unwraps it for you
        - `computed(() => ...)` is calculated from other values, cached, and updates by itself. Never store the same thing twice
        - `watch(source, callback)` runs code (a side effect, like changing the page title) when the source changes
        - Why you use `computed` for values and `watch` for actions
      tr: |
        - `ref(değer)` reaktif bir değer oluşturur. Script'te `.value` okur ve yazarsın; template'te Vue onu senin için açar
        - `computed(() => ...)` diğer değerlerden hesaplanır, önbelleğe alınır ve kendiliğinden güncellenir. Aynı şeyi asla iki kez saklama
        - `watch(kaynak, callback)` kaynak değişince kod çalıştırır (sayfa başlığını değiştirmek gibi bir yan etki)
        - Değerler için neden `computed`, eylemler için `watch` kullanıldığı
    do:
      en: |
        1. Create `src/dates.ts` below. `dateKey()` gives today as text like `2026-10-18` and `streak()` counts days in a row (used in a later step).
        2. Replace `src/App.vue` with the code below. The habits are now a `ref` holding an array.
        3. Tick a habit. The counter and the browser tab title change by themselves.
        4. In `toggle`, notice the line that replaces `habit.days` with a new array. Try changing `doneCount` to a plain variable (`let`) and see that the page stops updating.
      tr: |
        1. Aşağıdaki `src/dates.ts` dosyasını oluştur. `dateKey()` bugünü `2026-10-18` gibi bir metin olarak verir, `streak()` üst üste gün sayar (sonraki bir adımda kullanılacak).
        2. `src/App.vue` dosyasını aşağıdaki kodla değiştir. Alışkanlıklar artık bir dizi tutan bir `ref`.
        3. Bir alışkanlığı işaretle. Sayaç ve tarayıcı sekmesinin başlığı kendiliğinden değişir.
        4. `toggle` içinde `habit.days` değerini yeni bir dizi ile değiştiren satıra dikkat et. `doneCount`'u düz bir değişkene (`let`) çevirmeyi dene ve sayfanın güncellenmeyi bıraktığını gör.
    code:
      - file: src/dates.ts
        lang: ts
        text: |
          // A date as "2026-10-18" in the user's own time zone (toISOString would use UTC).
          export function dateKey(date: Date = new Date()): string {
            const year = date.getFullYear()
            const month = String(date.getMonth() + 1).padStart(2, '0')
            const day = String(date.getDate()).padStart(2, '0')
            return `${year}-${month}-${day}`
          }

          // How many days in a row the habit was done, counting back from today.
          // If today is not done yet, the streak is still alive until the day ends.
          export function streak(days: string[], today: Date = new Date()): number {
            const done = new Set(days)
            const day = new Date(today)
            if (!done.has(dateKey(day))) day.setDate(day.getDate() - 1)
            let count = 0
            while (done.has(dateKey(day))) {
              count++
              day.setDate(day.getDate() - 1)
            }
            return count
          }
      - file: src/App.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { computed, ref, watch } from 'vue'
          import HabitItem from './components/HabitItem.vue'
          import { dateKey } from './dates'
          import type { Habit } from './types'

          const today = dateKey()

          // ref: a value Vue watches. In script you use .value, in the template you do not.
          const habits = ref<Habit[]>([
            { id: '1', name: 'Drink water', days: [] },
            { id: '2', name: 'Read 10 pages', days: [today] },
          ])

          function isDone(habit: Habit): boolean {
            return habit.days.includes(today)
          }

          function toggle(id: string) {
            const habit = habits.value.find((h) => h.id === id)
            if (!habit) return
            habit.days = isDone(habit) ? habit.days.filter((d) => d !== today) : [...habit.days, today]
          }

          function remove(id: string) {
            habits.value = habits.value.filter((h) => h.id !== id)
          }

          // computed: a value worked out from other values; it updates by itself.
          const doneCount = computed(() => habits.value.filter(isDone).length)

          const summary = computed(() => `${doneCount.value}/${habits.value.length} done`)

          watch(
            summary,
            (text) => {
              document.title = text
            },
            { immediate: true },
          )
          </script>

          <template>
            <main>
              <h1>Habits</h1>
              <p>{{ doneCount }} of {{ habits.length }} done today</p>
              <ul>
                <HabitItem
                  v-for="habit in habits"
                  :key="habit.id"
                  :habit="habit"
                  :done-today="isDone(habit)"
                  @toggle="toggle"
                  @remove="remove"
                />
              </ul>
            </main>
          </template>
    mistakes:
      - problem:
          en: "Writing `count + 1` on a ref in script and getting text like `[object Object]1` instead of a number."
          tr: "Script'te bir ref için `count + 1` yazıp `[object Object]1` gibi bir metin almak."
        fix:
          en: "In script a ref is a box; the value is `count.value`. Only templates unwrap it automatically."
          tr: "Script'te ref bir kutudur; değer `count.value`'dur. Sadece template'ler onu otomatik açar."
      - problem:
          en: "Using `watch` to set another variable from a value, so two copies exist and one gets out of date."
          tr: "Bir değerden başka bir değişken ayarlamak için `watch` kullanmak; iki kopya olur ve biri eskir."
        fix:
          en: "If a value can be worked out from others, make it a `computed`. Use `watch` for side effects such as saving, logging or changing the page title."
          tr: "Bir değer başkalarından hesaplanabiliyorsa `computed` yap. `watch`'u kaydetme, loglama ya da sayfa başlığını değiştirme gibi yan etkiler için kullan."
    quiz:
      - q:
          en: "doneCount is worked out from the habits. What fits best?"
          tr: "doneCount alışkanlıklardan hesaplanıyor. En uygunu hangisi?"
        options:
          en: [A computed, A watch that sets a second ref, A plain let variable]
          tr: [Bir computed, İkinci bir ref'i ayarlayan bir watch, Düz bir let değişkeni]
        answer: 0
        why:
          en: "A computed recalculates by itself when the habits change and is cached otherwise; a plain variable never updates the page."
          tr: "Computed, alışkanlıklar değişince kendiliğinden yeniden hesaplanır, aksi halde önbellekten gelir; düz bir değişken sayfayı hiç güncellemez."
    sources:
      - title: Vue, reactivity fundamentals
        url: https://vuejs.org/guide/essentials/reactivity-fundamentals.html
      - title: Vue, computed properties
        url: https://vuejs.org/guide/essentials/computed.html
      - title: Vue, watchers
        url: https://vuejs.org/guide/essentials/watchers.html

  - id: lists-forms
    stage: basics
    title:
      en: "Lists, forms and showing things conditionally"
      tr: "Listeler, formlar ve koşullu gösterme"
    minutes: 60
    needs: [reactivity]
    why:
      en: "Most apps show lists and take input from forms, and hide or show parts depending on the data. Vue does it with three directives: `v-for`, `v-model` and `v-if`, plus a `key` that lets it track each item."
      tr: "Çoğu uygulama listeler gösterir, formlardan girdi alır ve veriye göre bazı parçaları gizler ya da gösterir. Vue bunu üç direktifle yapar: `v-for`, `v-model` ve `v-if`; her öğeyi takip etmesini sağlayan bir de `key` kullanır."
    learn:
      en: |
        - `v-for="item in items" :key="item.id"` draws one element per item
        - Why each item needs a stable, unique `key`
        - `v-if` / `v-else` adds or removes an element; `v-show` only hides it with CSS
        - `@submit.prevent` handles a form without reloading the page
        - Keeping state in the parent (App) and passing data and events through components
      tr: |
        - `v-for="item in items" :key="item.id"` her öğe için bir eleman çizer
        - Her öğenin neden sabit ve benzersiz bir `key`'e ihtiyacı olduğu
        - `v-if` / `v-else` bir elemanı ekler ya da kaldırır; `v-show` sadece CSS ile gizler
        - `@submit.prevent` sayfayı yenilemeden bir formu yakalar
        - State'i üst component'te (App) tutmak ve veri ile olayları component'ler arasında taşımak
    do:
      en: |
        1. Create `src/components/AddHabitForm.vue`: a form that uses `TextField` with `v-model` and emits `add`.
        2. Create `src/components/HabitList.vue`: it shows "No habits yet" when the list is empty and a `v-for` of `HabitItem` otherwise.
        3. Replace `src/App.vue` with the code below (`HabitItem.vue` stays as it was).
        4. Add a few habits, tick them, delete one. Press Enter in the field: the page does not reload.
        5. Read `HabitList.vue` again: the `v-if` / `v-else` pair shows either the empty message or the list, never both.
      tr: |
        1. `src/components/AddHabitForm.vue` dosyasını oluştur: `TextField`'ı `v-model` ile kullanan ve `add` emit eden bir form.
        2. `src/components/HabitList.vue` dosyasını oluştur: liste boşken "No habits yet" gösterir, doluyken `HabitItem`'ların bir `v-for`'unu gösterir.
        3. `src/App.vue` dosyasını aşağıdaki kodla değiştir (`HabitItem.vue` olduğu gibi kalır).
        4. Birkaç alışkanlık ekle, işaretle, birini sil. Alanda Enter'a bas: sayfa yenilenmez.
        5. `HabitList.vue` dosyasını tekrar oku: `v-if` / `v-else` çifti ya boş mesajı ya da listeyi gösterir, asla ikisini birden.
    code:
      - file: src/components/AddHabitForm.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { ref } from 'vue'
          import TextField from './TextField.vue'

          const emit = defineEmits<{ add: [name: string] }>()
          const name = ref('')

          function submit() {
            const clean = name.value.trim()
            if (!clean) return
            emit('add', clean)
            name.value = ''
          }
          </script>

          <template>
            <!-- .prevent stops the browser from reloading the page on submit -->
            <form @submit.prevent="submit">
              <TextField v-model="name" label="New habit" />
              <button type="submit">Add</button>
            </form>
          </template>
      - file: src/components/HabitList.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import HabitItem from './HabitItem.vue'
          import type { Habit } from '../types'

          defineProps<{
            habits: Habit[]
            today: string
          }>()

          const emit = defineEmits<{
            toggle: [id: string]
            remove: [id: string]
          }>()
          </script>

          <template>
            <p v-if="habits.length === 0">No habits yet. Add your first one above.</p>
            <ul v-else>
              <HabitItem
                v-for="habit in habits"
                :key="habit.id"
                :habit="habit"
                :done-today="habit.days.includes(today)"
                @toggle="emit('toggle', $event)"
                @remove="emit('remove', $event)"
              />
            </ul>
          </template>
      - file: src/App.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { computed, ref, watch } from 'vue'
          import AddHabitForm from './components/AddHabitForm.vue'
          import HabitList from './components/HabitList.vue'
          import { dateKey } from './dates'
          import type { Habit } from './types'

          const today = dateKey()
          const habits = ref<Habit[]>([])

          function add(name: string) {
            habits.value.push({ id: crypto.randomUUID(), name, days: [] })
          }

          function toggle(id: string) {
            const habit = habits.value.find((h) => h.id === id)
            if (!habit) return
            habit.days = habit.days.includes(today)
              ? habit.days.filter((d) => d !== today)
              : [...habit.days, today]
          }

          function remove(id: string) {
            habits.value = habits.value.filter((h) => h.id !== id)
          }

          const doneCount = computed(() => habits.value.filter((h) => h.days.includes(today)).length)
          const summary = computed(() => `${doneCount.value}/${habits.value.length} done`)

          watch(
            summary,
            (text) => {
              document.title = text
            },
            { immediate: true },
          )
          </script>

          <template>
            <main>
              <h1>Habits</h1>
              <AddHabitForm @add="add" />
              <p>{{ summary }} today</p>
              <HabitList :habits="habits" :today="today" @toggle="toggle" @remove="remove" />
            </main>
          </template>
    mistakes:
      - problem:
          en: "Using the array index as the key, and checkboxes jump to the wrong row after a delete."
          tr: "Key olarak dizi indeksini kullanmak ve silmeden sonra onay kutularının yanlış satıra kayması."
        fix:
          en: "Use an id that belongs to the item and never changes, like the one from `crypto.randomUUID()`."
          tr: "Öğeye ait ve hiç değişmeyen bir id kullan; örneğin `crypto.randomUUID()` ile üretilen."
      - problem:
          en: "The page reloads and the habit disappears when you press Enter."
          tr: "Enter'a basınca sayfa yenileniyor ve alışkanlık kayboluyor."
        fix:
          en: "A form's default is to reload the page. Write `@submit.prevent=\"submit\"`; the `.prevent` modifier stops it."
          tr: "Formun varsayılan davranışı sayfayı yenilemektir. `@submit.prevent=\"submit\"` yaz; `.prevent` modifier'ı bunu durdurur."
      - problem:
          en: "Using `v-if` and `v-for` on the same element."
          tr: "Aynı elemanda hem `v-if` hem `v-for` kullanmak."
        fix:
          en: "Put `v-if` on a wrapper (or on a `<template>`), or filter the list in a `computed` first. Vue 3 evaluates `v-if` first, so it cannot see the loop variable."
          tr: "`v-if`'i bir sarmalayıcıya (ya da bir `<template>`'e) koy ya da listeyi önce bir `computed` içinde süz. Vue 3 önce `v-if`'i işler, bu yüzden döngü değişkenini göremez."
    quiz:
      - q:
          en: "What makes a good key in v-for?"
          tr: "v-for'da iyi bir key nasıl olur?"
        options:
          en: [Math.random(), The position in the array, An id that belongs to the item and never changes]
          tr: [Math.random(), Dizideki sıra numarası, Öğeye ait ve hiç değişmeyen bir id]
        answer: 2
        why:
          en: "Random keys change every render and positions change when items move; both confuse Vue's tracking of items."
          tr: "Rastgele key'ler her çizimde değişir, sıra numaraları da öğeler yer değiştirince değişir; ikisi de Vue'nun öğeleri takip etmesini bozar."
    sources:
      - title: Vue, list rendering
        url: https://vuejs.org/guide/essentials/list.html
      - title: Vue, conditional rendering
        url: https://vuejs.org/guide/essentials/conditional.html
      - title: Vue, form input bindings
        url: https://vuejs.org/guide/essentials/forms.html
      - title: Vue, event handling
        url: https://vuejs.org/guide/essentials/event-handling.html

  - id: store
    stage: first-project
    title:
      en: "Share state with Pinia"
      tr: "Pinia ile state paylaşma"
    minutes: 60
    needs: [lists-forms]
    why:
      en: "So far App holds the habits and passes them down. When several pages and components need the same data, passing it through every level gets painful. Pinia is Vue's official store: one place that holds the state and the functions that change it, which any component can use."
      tr: "Şimdiye kadar alışkanlıkları App tuttu ve aşağıya geçirdi. Birkaç sayfa ve component aynı veriye ihtiyaç duyunca onu her seviyeden geçirmek zorlaşır. Pinia Vue'nun resmi store'udur: state'i ve onu değiştiren fonksiyonları tutan, her component'in kullanabileceği tek bir yer."
    learn:
      en: |
        - A store written with `defineStore('name', () => { ... })` looks like `<script setup>`: `ref` is state, `computed` is a getter, functions are actions
        - `useHabitsStore()` gives any component the same store; `createPinia()` is already plugged in `main.ts` by create-vue
        - `storeToRefs(store)` keeps state and getters reactive when you pull them out; actions can be used straight from the store
        - Why a streak is calculated from the days, never stored separately
      tr: |
        - `defineStore('ad', () => { ... })` ile yazılan bir store `<script setup>`'a benzer: `ref` state'tir, `computed` getter'dır, fonksiyonlar action'dır
        - `useHabitsStore()` her component'e aynı store'u verir; `createPinia()` create-vue tarafından `main.ts`'e zaten takılmıştır
        - `storeToRefs(store)` state ve getter'ları çıkarırken reaktif tutar; action'lar doğrudan store'dan kullanılabilir
        - Serinin neden günlerden hesaplandığı, ayrıca saklanmadığı
    do:
      en: |
        1. Create `src/stores/habits.ts` below. It has the habits, today's date, `doneCount`, and the actions `add`, `toggle` and `remove`.
        2. Update `HabitItem.vue` and `HabitList.vue` to show a streak under each habit (the new `streak` prop, using `streak()` from `dates.ts`).
        3. Replace `src/App.vue` so it uses the store instead of its own state.
        4. Check that the app behaves exactly as before, then commit: `git add . && git commit -m "Habits live in a Pinia store"`.
      tr: |
        1. Aşağıdaki `src/stores/habits.ts` dosyasını oluştur. Alışkanlıkları, bugünün tarihini, `doneCount`'u ve `add`, `toggle`, `remove` action'larını içerir.
        2. Her alışkanlığın altında seri göstermek için `HabitItem.vue` ve `HabitList.vue` dosyalarını güncelle (yeni `streak` prop'u; `dates.ts`'teki `streak()` kullanılır).
        3. `src/App.vue` dosyasını kendi state'i yerine store'u kullanacak şekilde değiştir.
        4. Uygulamanın tam eskisi gibi çalıştığını kontrol et, sonra commit et: `git add . && git commit -m "Habits live in a Pinia store"`.
    code:
      - file: src/stores/habits.ts
        lang: ts
        text: |
          import { computed, ref } from 'vue'
          import { defineStore } from 'pinia'
          import { dateKey } from '../dates'
          import type { Habit } from '../types'

          // A store shared by every component. This is the "setup" style: it looks like <script setup>.
          export const useHabitsStore = defineStore('habits', () => {
            const habits = ref<Habit[]>([])
            const today = ref(dateKey())

            const doneCount = computed(() => habits.value.filter((h) => h.days.includes(today.value)).length)

            function add(name: string) {
              habits.value.push({ id: crypto.randomUUID(), name, days: [] })
            }

            function toggle(id: string) {
              const habit = habits.value.find((h) => h.id === id)
              if (!habit) return
              habit.days = habit.days.includes(today.value)
                ? habit.days.filter((d) => d !== today.value)
                : [...habit.days, today.value]
            }

            function remove(id: string) {
              habits.value = habits.value.filter((h) => h.id !== id)
            }

            return { habits, today, doneCount, add, toggle, remove }
          })
      - file: src/components/HabitItem.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import type { Habit } from '../types'

          // Props: data that comes in from the parent.
          defineProps<{
            habit: Habit
            doneToday: boolean
            streak: number
          }>()

          // Emits: events this component sends up to the parent.
          const emit = defineEmits<{
            toggle: [id: string]
            remove: [id: string]
          }>()
          </script>

          <template>
            <li>
              <label>
                <input
                  type="checkbox"
                  :checked="doneToday"
                  @change="emit('toggle', habit.id)"
                />
                <span :class="{ done: doneToday }">{{ habit.name }}</span>
              </label>
              <small v-if="streak > 0">{{ streak }} day streak</small>
              <button type="button" :aria-label="`Delete ${habit.name}`" @click="emit('remove', habit.id)">
                Delete
              </button>
            </li>
          </template>

          <style scoped>
          .done {
            text-decoration: line-through;
          }
          </style>
      - file: src/components/HabitList.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { streak } from '../dates'
          import HabitItem from './HabitItem.vue'
          import type { Habit } from '../types'

          defineProps<{
            habits: Habit[]
            today: string
          }>()

          const emit = defineEmits<{
            toggle: [id: string]
            remove: [id: string]
          }>()
          </script>

          <template>
            <p v-if="habits.length === 0">No habits yet. Add your first one above.</p>
            <ul v-else>
              <HabitItem
                v-for="habit in habits"
                :key="habit.id"
                :habit="habit"
                :done-today="habit.days.includes(today)"
                :streak="streak(habit.days)"
                @toggle="emit('toggle', $event)"
                @remove="emit('remove', $event)"
              />
            </ul>
          </template>
      - file: src/App.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { computed, watch } from 'vue'
          import { storeToRefs } from 'pinia'
          import AddHabitForm from './components/AddHabitForm.vue'
          import HabitList from './components/HabitList.vue'
          import { useHabitsStore } from './stores/habits'

          const store = useHabitsStore()
          // storeToRefs keeps state and getters reactive when you pull them out of the store.
          // Functions (actions) can be used straight from the store.
          const { habits, today, doneCount } = storeToRefs(store)

          const summary = computed(() => `${doneCount.value}/${habits.value.length} done`)

          watch(
            summary,
            (text) => {
              document.title = text
            },
            { immediate: true },
          )
          </script>

          <template>
            <main>
              <h1>Habits</h1>
              <AddHabitForm @add="store.add" />
              <p>{{ summary }} today</p>
              <HabitList :habits="habits" :today="today" @toggle="store.toggle" @remove="store.remove" />
            </main>
          </template>
    mistakes:
      - problem:
          en: "Writing `const { habits } = store` and the page stops updating."
          tr: "`const { habits } = store` yazmak ve sayfanın güncellenmeyi bırakması."
        fix:
          en: "Destructuring copies the plain value and loses reactivity. Use `const { habits } = storeToRefs(store)` for state and getters."
          tr: "Parçalama (destructuring) düz değeri kopyalar ve reaktifliği kaybettirir. State ve getter'lar için `const { habits } = storeToRefs(store)` kullan."
      - problem:
          en: "Forgetting to return a ref or function from the store."
          tr: "Store'dan bir ref ya da fonksiyonu döndürmeyi unutmak."
        fix:
          en: "In a setup store only what you return is part of the store. Add it to the `return { ... }` at the end."
          tr: "Setup store'da sadece döndürdüklerin store'un parçasıdır. Sonundaki `return { ... }` içine ekle."
      - problem:
          en: "Storing the streak or the count in the store as well as the days."
          tr: "Günlerin yanında seriyi ya da sayıyı da store'da saklamak."
        fix:
          en: "Two copies drift apart. Keep the days and calculate the rest with `computed` or a function."
          tr: "İki kopya birbirinden ayrılır. Günleri sakla, gerisini `computed` ya da bir fonksiyonla hesapla."
    quiz:
      - q:
          en: "Why use storeToRefs(store)?"
          tr: "storeToRefs(store) neden kullanılır?"
        options:
          en: [To make the store faster, To take state and getters out of the store without losing reactivity, To save the store to disk]
          tr: [Store'u hızlandırmak için, State ve getter'ları reaktifliği kaybetmeden store'dan çıkarmak için, Store'u diske kaydetmek için]
        answer: 1
        why:
          en: "Plain destructuring copies the current value; storeToRefs gives refs that stay connected to the store."
          tr: "Düz parçalama o anki değeri kopyalar; storeToRefs store'a bağlı kalan ref'ler verir."
    sources:
      - title: Pinia, defining a store
        url: https://pinia.vuejs.org/core-concepts/
      - title: Pinia, getting started
        url: https://pinia.vuejs.org/getting-started.html
      - title: Vue, state management
        url: https://vuejs.org/guide/scaling-up/state-management.html

  - id: pages
    stage: first-project
    title:
      en: "Add pages with Vue Router"
      tr: "Vue Router ile sayfa ekleme"
    minutes: 60
    needs: [store]
    why:
      en: "A single-page app is one HTML file that swaps components as the address changes, with no reload. Vue Router decides which component to show for each address and gives you links that do not reload the page."
      tr: "Tek sayfalık bir uygulama, adres değiştikçe component'leri değiştiren ve sayfayı yenilemeyen tek bir HTML dosyasıdır. Vue Router her adres için hangi component'in gösterileceğine karar verir ve sayfayı yenilemeyen bağlantılar sunar."
    learn:
      en: |
        - A route connects a path (like `/stats`) to a component
        - `RouterView` shows the component of the current route; `RouterLink` is a link that does not reload the page
        - `views/` holds whole pages and `components/` holds the pieces they use
        - `router-link-exact-active`: the class Vue Router puts on the link of the current page
      tr: |
        - Route, bir yolu (`/stats` gibi) bir component'e bağlar
        - `RouterView` geçerli route'un component'ini gösterir; `RouterLink` sayfayı yenilemeyen bir bağlantıdır
        - `views/` tam sayfaları, `components/` onların kullandığı parçaları tutar
        - `router-link-exact-active`: Vue Router'ın geçerli sayfanın bağlantısına koyduğu sınıf
    do:
      en: |
        1. Create `src/views/TodayView.vue` (the page that used to be `App.vue`) and `src/views/StatsView.vue` (a table of days done and streaks).
        2. Fill `src/router/index.ts` with the two routes. create-vue already created the file and `main.ts` already uses it.
        3. Replace `src/App.vue` with a small shell: navigation and `<RouterView />`.
        4. Click between Today and Stats. The address changes and the page does not reload. Add a habit on Today and see it on Stats.
      tr: |
        1. `src/views/TodayView.vue` (eskiden `App.vue` olan sayfa) ve `src/views/StatsView.vue` (tamamlanan günlerin ve serilerin tablosu) dosyalarını oluştur.
        2. `src/router/index.ts` dosyasını iki route ile doldur. create-vue dosyayı zaten oluşturdu ve `main.ts` onu zaten kullanıyor.
        3. `src/App.vue` dosyasını küçük bir kabukla değiştir: gezinme ve `<RouterView />`.
        4. Today ve Stats arasında tıkla. Adres değişir, sayfa yenilenmez. Today'de bir alışkanlık ekle ve Stats'te gör.
    code:
      - file: src/views/TodayView.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { computed, watch } from 'vue'
          import { storeToRefs } from 'pinia'
          import AddHabitForm from '../components/AddHabitForm.vue'
          import HabitList from '../components/HabitList.vue'
          import { useHabitsStore } from '../stores/habits'

          const store = useHabitsStore()
          const { habits, today, doneCount } = storeToRefs(store)

          const summary = computed(() => `${doneCount.value}/${habits.value.length} done`)

          watch(
            summary,
            (text) => {
              document.title = text
            },
            { immediate: true },
          )
          </script>

          <template>
            <h1>Today</h1>
            <AddHabitForm @add="store.add" />
            <p>{{ summary }} today</p>
            <HabitList :habits="habits" :today="today" @toggle="store.toggle" @remove="store.remove" />
          </template>
      - file: src/views/StatsView.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { storeToRefs } from 'pinia'
          import { streak } from '../dates'
          import { useHabitsStore } from '../stores/habits'

          const { habits } = storeToRefs(useHabitsStore())
          </script>

          <template>
            <h1>Stats</h1>
            <p v-if="habits.length === 0">Nothing to show yet.</p>
            <table v-else>
              <thead>
                <tr>
                  <th>Habit</th>
                  <th>Days done</th>
                  <th>Current streak</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="habit in habits" :key="habit.id">
                  <td>{{ habit.name }}</td>
                  <td>{{ habit.days.length }}</td>
                  <td>{{ streak(habit.days) }}</td>
                </tr>
              </tbody>
            </table>
          </template>
      - file: src/router/index.ts
        lang: ts
        text: |
          import { createRouter, createWebHistory } from 'vue-router'
          import StatsView from '../views/StatsView.vue'
          import TodayView from '../views/TodayView.vue'

          const router = createRouter({
            history: createWebHistory(import.meta.env.BASE_URL),
            routes: [
              { path: '/', name: 'today', component: TodayView },
              { path: '/stats', name: 'stats', component: StatsView },
            ],
          })

          export default router
      - file: src/App.vue
        lang: vue
        text: |
          <script setup lang="ts">
          import { RouterLink, RouterView } from 'vue-router'
          </script>

          <template>
            <header>
              <nav>
                <RouterLink to="/">Today</RouterLink>
                <RouterLink to="/stats">Stats</RouterLink>
              </nav>
            </header>
            <main>
              <RouterView />
            </main>
          </template>

          <style scoped>
          nav a {
            margin-right: 1rem;
          }
          /* RouterLink adds this class to the link of the current page. */
          nav a.router-link-exact-active {
            font-weight: bold;
          }
          </style>
    mistakes:
      - problem:
          en: "Using a normal `<a href=\"/stats\">` link, and the whole page reloads."
          tr: "Normal bir `<a href=\"/stats\">` bağlantısı kullanmak ve bütün sayfanın yenilenmesi."
        fix:
          en: "Use `<RouterLink to=\"/stats\">`; it changes the address and swaps the component without a reload."
          tr: "`<RouterLink to=\"/stats\">` kullan; adresi değiştirir ve component'i yenilemeden değiştirir."
      - problem:
          en: "Nothing shows up for a page, and the console warns \"No match found for location\"."
          tr: "Bir sayfada hiçbir şey görünmüyor ve konsol \"No match found for location\" uyarısı veriyor."
        fix:
          en: "The path in the link and the path in `routes` must match exactly, including the leading slash."
          tr: "Bağlantıdaki yol ile `routes` içindeki yol baştaki eğik çizgi dahil tam olarak aynı olmalı."
    quiz:
      - q:
          en: "What does RouterView do?"
          tr: "RouterView ne yapar?"
        options:
          en: [Draws the component of the current route in that place, Makes a link, Loads data from an API]
          tr: [Geçerli route'un component'ini o yerde çizer, Bağlantı oluşturur, Bir API'den veri yükler]
        answer: 0
        why:
          en: "RouterView is a placeholder; Vue Router puts the component that matches the address there."
          tr: "RouterView bir yer tutucudur; Vue Router adresle eşleşen component'i oraya koyar."
    sources:
      - title: Vue Router, getting started
        url: https://router.vuejs.org/guide/
      - title: Vue Router, dynamic route matching
        url: https://router.vuejs.org/guide/essentials/dynamic-matching.html
      - title: Vue, routing
