        2. Replace `src/routes/+page.server.ts` with the final version: `load` reads `?status=`, returns the books, the counts and the chosen status.
        3. Replace `StatusFilter.svelte` with links instead of buttons (it no longer needs `$bindable`), and replace `src/routes/+page.svelte`: the counts come from the database, so the numbers stay right while the list is filtered.
