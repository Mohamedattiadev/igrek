    code:
      - file: src/lib/server/store.ts
        lang: ts
        text: |
          // replace listBooks, and add countBooks below it
          export async function listBooks(
          	db: Client,
          	options: { status?: Status; limit?: number } = {}
          ): Promise<Book[]> {
          	const { status, limit = 100 } = options;
          	const { rows } = await db.execute({
          		sql: `SELECT id, title, author, status FROM books
          			WHERE (?1 IS NULL OR status = ?1)
          			ORDER BY id DESC LIMIT ?2`,
          		args: [status ?? null, limit]
          	});
          	return rows.map((r) => ({
          		id: Number(r.id),
          		title: String(r.title),
          		author: String(r.author),
          		status: r.status as Status
          	}));
          }

          /** How many books there are per status. */
          export async function countBooks(db: Client): Promise<Record<Status, number>> {
          	const counts: Record<Status, number> = { want: 0, reading: 0, done: 0 };
          	const { rows } = await db.execute('SELECT status, COUNT(*) AS n FROM books GROUP BY status');
          	for (const r of rows) counts[r.status as Status] = Number(r.n);
          	return counts;
          }
      - file: src/routes/+page.server.ts
        lang: ts
        text: |
          import { fail } from '@sveltejs/kit';
          import { db } from '#lib/server/db.js';
          import { addBook, countBooks, getBook, listBooks, removeBook, setStatus } from '#lib/server/store.js';
          import { isStatus, nextStatus, validateBook } from '#lib/books.js';
          import type { Actions, PageServerLoad } from './$types';

          export const load: PageServerLoad = async ({ locals, url }) => {
          	const param = url.searchParams.get('status');
          	const status = isStatus(param) ? param : undefined;
          	return {
          		books: await listBooks(db, { status }),
          		counts: await countBooks(db),
          		status: status ?? ('all' as const),
          		canEdit: locals.canEdit
          	};
          };

          export const actions = {
          	add: async ({ request, locals }) => {
          		if (!locals.canEdit) return fail(403, { message: 'Log in to edit' });
          		const form = await request.formData();
          		const title = form.get('title');
          		const author = form.get('author');
          		const result = validateBook(title, author);
          		if (!result.ok) {
          			return fail(400, {
          				errors: result.errors,
          				title: String(title ?? ''),
          				author: String(author ?? '')
          			});
          		}
          		await addBook(db, result.value);
          		return { added: true };
          	},

          	next: async ({ request, locals }) => {
          		if (!locals.canEdit) return fail(403, { message: 'Log in to edit' });
          		const id = Number((await request.formData()).get('id'));
          		const book = Number.isInteger(id) ? await getBook(db, id) : undefined;
          		if (!book) return fail(404, { message: 'Book not found' });
          		await setStatus(db, id, nextStatus(book.status));
          	},

          	remove: async ({ request, locals }) => {
          		if (!locals.canEdit) return fail(403, { message: 'Log in to edit' });
          		const id = Number((await request.formData()).get('id'));
          		if (!Number.isInteger(id)) return fail(400, { message: 'Bad id' });
          		await removeBook(db, id);
          	}
          } satisfies Actions;
      - file: src/lib/components/StatusFilter.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import { STATUSES, STATUS_LABEL, type Status } from '#lib/books.js';

          	let { value = 'all' }: { value?: Status | 'all' } = $props();
          </script>

          <div class="filter" role="group" aria-label="Filter by status">
          	<a href="/" aria-current={value === 'all' ? 'true' : undefined}>All</a>
          	{#each STATUSES as status (status)}
          		<a href="?status={status}" aria-current={value === status ? 'true' : undefined}>
          			{STATUS_LABEL[status]}
          		</a>
          	{/each}
          </div>

          <style>
          	.filter {
          		display: flex;
          		flex-wrap: wrap;
          		gap: 0.5rem;
          		margin: 1rem 0;
          	}
          	a {
          		padding: 0.25rem 0.75rem;
          		border-radius: 999px;
          		background: #eaeef2;
          		color: inherit;
          		text-decoration: none;
          	}
          	a[aria-current='true'] {
          		background: #0969da;
          		color: white;
          	}
          </style>
      - file: src/routes/+page.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import AddBookForm from '#lib/components/AddBookForm.svelte';
          	import BookCard from '#lib/components/BookCard.svelte';
          	import StatusFilter from '#lib/components/StatusFilter.svelte';
          	import type { PageProps } from './$types';

          	let { data, form }: PageProps = $props();

          	let total = $derived(data.counts.want + data.counts.reading + data.counts.done);
          	let finished = $derived(data.counts.done);

          	$effect(() => {
          		document.title = `Reading list (${finished}/${total} finished)`;
          	});
          </script>

          <h1>Reading list</h1>
          <p>{finished} of {total} finished</p>

          {#if data.canEdit}
          	<AddBookForm errors={form?.errors} title={form?.title} author={form?.author} />
          	<form method="POST" action="/login?/logout">
          		<button>Log out</button>
          	</form>
          {:else}
          	<p><a href="/login">Log in</a> to add or change books.</p>
          {/if}
          <StatusFilter value={data.status} />

          <ul>
          	{#each data.books as book (book.id)}
          		<BookCard {book} editable={data.canEdit} />
          	{:else}
          		<li>No books here yet.</li>
          	{/each}
          </ul>
      - file: src/lib/components/StatusFilter.svelte.test.ts
        lang: ts
        text: |
          import { render, screen } from '@testing-library/svelte';
          import { describe, expect, it } from 'vitest';
          import StatusFilter from './StatusFilter.svelte';

          describe('StatusFilter', () => {
          	it('marks All as current by default', () => {
          		render(StatusFilter);
          		expect(screen.getByRole('link', { name: 'All' }).getAttribute('aria-current')).toBe('true');
          	});

          	it('marks the chosen status and links to it', () => {
          		render(StatusFilter, { value: 'reading' });
          		const reading = screen.getByRole('link', { name: 'Reading' });
          		expect(reading.getAttribute('aria-current')).toBe('true');
          		expect(reading.getAttribute('href')).toBe('?status=reading');
          		expect(screen.getByRole('link', { name: 'All' }).getAttribute('aria-current')).toBeNull();
          	});
          });
