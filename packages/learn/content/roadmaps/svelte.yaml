        2. `src/routes/+page.server.ts` dosyasını son sürümle değiştir: `load` `?status=`'ü okur; kitapları, sayıları ve seçilen durumu döndürür.
        3. `StatusFilter.svelte`'i düğmeler yerine link'lerle değiştir (artık `$bindable`'a gerek yok) ve `src/routes/+page.svelte`'i değiştir: sayılar veritabanından gelir; bu yüzden liste süzülürken rakamlar doğru kalır.
        4. `StatusFilter.svelte.test.ts` dosyasını değiştir ve `store.test.ts`'i gösterilen iki testle genişlet. `npm test` ve `npm run check` çalıştır.
