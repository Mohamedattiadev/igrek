      - problem:
          en: "\"Cannot import $app/env/private into client-side code\", or a similar server-only error."
          tr: "\"Cannot import $app/env/private into client-side code\" ya da benzer bir sadece-sunucu hatası."
        fix:
          en: "Database code and private variables may only be imported from `+page.server.ts`, `+server.ts`, `hooks.server.ts` or files in `src/lib/server`. Never import them in a `.svelte` file or in `+page.ts`."
          tr: "Veritabanı kodu ve private değişkenler sadece `+page.server.ts`, `+server.ts`, `hooks.server.ts` ya da `src/lib/server` içindeki dosyalardan import edilebilir. Onları asla `.svelte` dosyasında ya da `+page.ts`'te import etme."
      - problem:
          en: "Building the SQL by gluing text together, like `` `... WHERE id = ${id}` ``."
          tr: "SQL'i metin yapıştırarak kurmak, örneğin `` `... WHERE id = ${id}` ``."
        fix:
          en: "Use `?` placeholders and pass the values in `args`, as `getBook` does. Otherwise a visitor can change what your query means (SQL injection)."
          tr: "`?` yer tutucularını kullan ve değerleri `args` içinde ver, `getBook`'un yaptığı gibi. Yoksa ziyaretçi sorgunun anlamını değiştirebilir (SQL injection)."
      - problem:
          en: "Committing `local.db`."
          tr: "`local.db`'yi commit'lemek."
        fix:
          en: "Keep `local.db*` in `.gitignore`. If it was committed already: `git rm --cached local.db` and commit again."
          tr: "`local.db*`'yi `.gitignore`'da tut. Zaten commit'lendiyse: `git rm --cached local.db` ve yeniden commit'le."
    quiz:
      - q:
          en: "Where may you import `db` from `src/lib/server/db.ts`?"
          tr: "`src/lib/server/db.ts` içindeki `db`'yi nerelerden import edebilirsin?"
        options:
          en:
            - In any .svelte file
            - Only in server code such as +page.server.ts and hooks.server.ts
            - Only in tests
          tr:
            - Herhangi bir .svelte dosyasında
            - Sadece +page.server.ts ve hooks.server.ts gibi sunucu kodunda
            - Sadece testlerde
        answer: 1
        why:
          en: "The folder name src/lib/server marks the code as server-only. SvelteKit stops the build if browser code imports it."
          tr: "src/lib/server klasör adı kodu sadece sunucu olarak işaretler. Tarayıcı kodu onu import ederse SvelteKit build'i durdurur."
    sources:
