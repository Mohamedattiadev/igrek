          import { createClient } from '@libsql/client';
          import { beforeEach, describe, expect, it } from 'vitest';
          import { addBook, getBook, listBooks, migrate, removeBook, setStatus } from './store.js';

          let db = createClient({ url: ':memory:' });

          beforeEach(async () => {
          	db = createClient({ url: ':memory:' });
          	await migrate(db);
          });

          describe('store', () => {
          	it('starts with three starter books', async () => {
          		expect(await listBooks(db)).toHaveLength(3);
          	});

          	it('does not add the starter books twice', async () => {
          		await migrate(db);
          		expect(await listBooks(db)).toHaveLength(3);
          	});

          	it('adds a book with the status want', async () => {
          		await addBook(db, { title: 'Dune', author: 'Frank Herbert' });
          		const [newest] = await listBooks(db);
          		expect(newest).toMatchObject({ title: 'Dune', author: 'Frank Herbert', status: 'want' });
          	});

          	it('changes a status and deletes a book', async () => {
          		await addBook(db, { title: 'Dune', author: 'Frank Herbert' });
          		const [{ id }] = await listBooks(db);
          		await setStatus(db, id, 'done');
          		expect((await getBook(db, id))?.status).toBe('done');
          		await removeBook(db, id);
