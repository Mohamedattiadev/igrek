    mistakes:
      - problem:
          en: "A component test fails with \"mount(...) is not available on the server\" or a similar error."
          tr: "Bir component testi \"mount(...) is not available on the server\" ya da benzer bir hatayla başarısız oluyor."
        fix:
          en: "The file must be named `*.svelte.test.ts` so it runs in the `client` project, and the config needs the `svelteTesting()` plugin there."
          tr: "Dosyanın adı `*.svelte.test.ts` olmalı ki `client` projesinde çalışsın ve config'te orada `svelteTesting()` eklentisi olmalı."
      - problem:
          en: "Tests that share one database and fail in a different order each time."
          tr: "Tek bir veritabanını paylaşan ve her seferinde farklı sırayla başarısız olan testler."
        fix:
          en: "Create a fresh `:memory:` database in `beforeEach`, as the store tests do. Each test then starts from the same state."
          tr: "`beforeEach` içinde, store testlerinin yaptığı gibi yepyeni bir `:memory:` veritabanı oluştur. Böylece her test aynı durumdan başlar."
      - problem:
          en: "Finding elements by CSS class in component tests, which break when the style changes."
          tr: "Component testlerinde elementleri CSS class'ıyla bulmak; stil değişince testler bozulur."
        fix:
          en: "Use `getByRole` and `getByText`, the way a visitor or a screen reader finds things. Those tests also push you to write accessible markup."
          tr: "Ziyaretçinin ya da ekran okuyucunun bir şeyi bulduğu gibi `getByRole` ve `getByText` kullan. Bu testler seni erişilebilir markup yazmaya da iter."
