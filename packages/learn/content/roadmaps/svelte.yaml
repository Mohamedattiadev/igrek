id: svelte
title: Svelte
summary:
  en: "From an empty computer to your own Svelte app on the internet. You build a real reading list with Svelte 5 and SvelteKit step by step: components, runes, forms, a database, tests and a free deploy."
  tr: "Boş bir bilgisayardan internette yayında olan kendi Svelte uygulamana. Svelte 5 ve SvelteKit ile adım adım gerçek bir okuma listesi yazarsın: component'ler, rune'lar, form'lar, veritabanı, testler ve ücretsiz deploy."
teacher: frontend
project:
  en: 'A reading list: add books, move them between "Want to read", "Reading" and "Finished", delete them and filter the list. The list lives in a database, only the owner (with a password) can change it, and the app is tested and published for free on Render with a Turso database.'
  tr: 'Bir okuma listesi: kitap ekleme, kitapları "Okumak istiyorum", "Okuyorum" ve "Bitirdim" arasında taşıma, silme ve listeyi süzme. Liste bir veritabanında durur, sadece sahibi (parolayla) değiştirebilir; uygulamanın testleri yazılmıştır ve Render''da, Turso veritabanıyla ücretsiz yayındadır.'
detect:
  npm: [svelte, "@sveltejs/kit"]
version: "5.57"
latest: npm:svelte
checked: 2026-10
after: [web]
sheets: [javascript, typescript, svelte, sql, git, http]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Node.js, an editor and Git"
      tr: "Node.js, bir editör ve Git kurma"
    minutes: 40
    why:
      en: "Svelte apps are built with tools that run on Node.js. An editor makes writing code comfortable, and Git keeps every version of your work so you can never really lose it."
      tr: "Svelte uygulamaları Node.js üzerinde çalışan araçlarla hazırlanır. Editör kod yazmayı rahatlatır, Git de işinin her sürümünü saklar; böylece hiçbir şeyi gerçekten kaybetmezsin."
    learn:
      en: |
        - What Node.js and npm are, and why a web app needs them while you build it
        - How to open a terminal and check that a program is installed
        - Which Node.js version to pick: SvelteKit 3 needs Node.js 22.17 or newer, so take the current LTS
        - What a `.svelte` file looks like and why the editor needs the Svelte extension
      tr: |
        - Node.js ve npm'in ne olduğu, uygulamayı hazırlarken neden gerektiği
        - Terminal açmak ve bir programın kurulu olup olmadığını kontrol etmek
        - Hangi Node.js sürümünü seçmen gerektiği: SvelteKit 3 için Node.js 22.17 ya da daha yenisi gerekir, o yüzden güncel LTS sürümünü al
        - `.svelte` dosyasının neye benzediği ve editörün neden Svelte eklentisine ihtiyaç duyduğu
    do:
      en: |
        1. Download **Node.js LTS** from nodejs.org and install it. LTS means "long-term support": it gets fixes for years, so tutorials and tools work with it.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor. Open its Extensions panel, search for **Svelte for VS Code** (published by Svelte) and install it. It colors `.svelte` files and shows type errors.
        3. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it.
        4. Open a terminal (in VS Code: *Terminal → New Terminal*) and run the commands below. Each should print a version number. `node --version` must print 22.17 or higher.
        5. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
      tr: |
        1. nodejs.org'dan **Node.js LTS** sürümünü indirip kur. LTS "uzun süreli destek" demek: yıllarca düzeltme alır, eğitimler ve araçlar onunla çalışır.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u kur (code.visualstudio.com). Extensions panelini aç, **Svelte for VS Code** eklentisini (yayıncısı Svelte) ara ve kur. `.svelte` dosyalarını renklendirir ve tip hatalarını gösterir.
        3. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir.
        4. Bir terminal aç (VS Code'da: *Terminal → New Terminal*) ve aşağıdaki komutları çalıştır. Her biri bir sürüm numarası yazmalı. `node --version` 22.17 ya da daha yüksek bir sürüm yazmalı.
        5. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
    code:
      - file: terminal
        lang: sh
        text: |
          node --version
          npm --version
          git --version
    mistakes:
      - problem:
          en: "\"command not found\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found\" hatası."
        fix:
          en: "Close the terminal (or VS Code) and open it again so it sees the new program. On Windows, restart if it still fails."
          tr: "Terminali (ya da VS Code'u) kapatıp yeniden aç ki yeni programı görsün. Windows'ta hâlâ olmuyorsa bilgisayarı yeniden başlat."
      - problem:
          en: "Node.js is older than 22.17, so the SvelteKit tools refuse to run."
          tr: "Node.js 22.17'den eski olduğu için SvelteKit araçları çalışmayı reddediyor."
        fix:
          en: "Install the current LTS from nodejs.org over the old one, reopen the terminal and check `node --version` again."
          tr: "nodejs.org'dan güncel LTS sürümünü eskisinin üstüne kur, terminali yeniden aç ve `node --version`'ı tekrar kontrol et."
    quiz:
      - q:
          en: "Why pick the LTS version of Node.js?"
          tr: "Node.js'in neden LTS sürümünü seçiyoruz?"
        options:
          en:
            - It is the fastest
            - It gets fixes for a long time and tools expect it
            - It is the only free one
          tr:
            - En hızlısı o
            - Uzun süre düzeltme alır ve araçlar onu bekler
            - Tek ücretsiz sürüm o
        answer: 1
        why:
          en: "Every Node.js version is free; LTS lines are supported for years, so they are the safe default."
          tr: "Bütün Node.js sürümleri ücretsiz; LTS sürümleri yıllarca desteklenir, bu yüzden güvenli varsayılan odur."
    sources:
      - title: Node.js downloads
        url: https://nodejs.org/en/download
      - title: Svelte for VS Code
        url: https://marketplace.visualstudio.com/items?itemName=svelte.svelte-vscode
      - title: Git installation
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: first-app
    stage: first-code
    title:
      en: "Create your first SvelteKit app"
      tr: "İlk SvelteKit uygulamanı oluşturma"
    minutes: 30
    needs: [setup]
    why:
      en: "A SvelteKit app needs a router, a build tool and a lot of small files before the first line shows up in the browser. The official `sv` tool creates all of it in seconds, and the development server reloads the page every time you save, so you see each change at once."
      tr: "Bir SvelteKit uygulamasının tarayıcıda ilk satırı göstermesi için bir router, bir build aracı ve bir sürü küçük dosya gerekir. Resmî `sv` aracı bunların hepsini saniyeler içinde kurar, geliştirme sunucusu da her kaydettiğinde sayfayı yeniler; her değişikliği hemen görürsün."
    learn:
      en: |
        - What SvelteKit is: Svelte (the component language) plus routing, server code and a build
        - What is in a new project: `src/routes`, `src/lib`, `package.json`, `vite.config.ts`. In SvelteKit 3 the settings live in `vite.config.ts`; there is no `svelte.config.js`
        - What an adapter is: the piece that turns your app into something a server can run. We choose `adapter-node` now
        - How saving a file updates the page by itself
      tr: |
        - SvelteKit'in ne olduğu: Svelte (component dili) artı routing, sunucu kodu ve bir build
        - Yeni projede neler olduğu: `src/routes`, `src/lib`, `package.json`, `vite.config.ts`. SvelteKit 3'te ayarlar `vite.config.ts` içinde durur; `svelte.config.js` yoktur
        - Adapter'ın ne olduğu: uygulamanı bir sunucunun çalıştırabileceği şeye çeviren parça. Şimdiden `adapter-node`'u seçiyoruz
        - Bir dosyayı kaydetmenin sayfayı kendiliğinden nasıl güncellediği
    do:
      en: |
        1. In the terminal, go to the folder where you keep projects and run the first command below. It creates a folder called `reading-list` with a minimal TypeScript project, adds the Vitest test tool and the Node adapter, and installs the packages. (If your shell complains about the quotes, run `npx sv create reading-list` instead and choose: minimal template, TypeScript, then add the `vitest` (unit tests only) and `sveltekit-adapter` (Node) add-ons.)
        2. Go into the folder and start the development server.
        3. Open the address it prints (usually http://localhost:5173).
        4. Open `vite.config.ts` and look at it: the `sveltekit()` plugin takes the adapter. Open `package.json` and find `"imports"`: it declares the `#lib` shortcut for the `src/lib` folder. You will import your own code with it.
        5. Replace everything in `src/routes/+page.svelte` with the code below and save. The page changes at once.
        6. Save this first version with Git: `git init`, `git add .`, `git commit -m "Start the reading list"`.
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git ve aşağıdaki ilk komutu çalıştır. `reading-list` adında bir klasör oluşturur: minimal bir TypeScript projesi, Vitest test aracı ve Node adapter'ı ekler, paketleri kurar. (Kabuğun tırnaklardan şikâyet ederse onun yerine `npx sv create reading-list` çalıştır ve şunları seç: minimal şablon, TypeScript, sonra `vitest` (sadece unit test) ve `sveltekit-adapter` (Node) eklentilerini ekle.)
        2. Klasöre gir ve geliştirme sunucusunu başlat.
        3. Yazdığı adresi aç (genelde http://localhost:5173).
        4. `vite.config.ts`'i aç ve bak: `sveltekit()` eklentisi adapter'ı alır. `package.json`'u aç ve `"imports"` kısmını bul: `src/lib` klasörü için `#lib` kısayolunu tanımlar. Kendi kodunu onunla import edeceksin.
        5. `src/routes/+page.svelte` içindeki her şeyi aşağıdaki kodla değiştir ve kaydet. Sayfa hemen değişir.
        6. Bu ilk sürümü Git ile kaydet: `git init`, `git add .`, `git commit -m "Start the reading list"`.
    code:
      - file: terminal
        lang: sh
        text: |
          npx sv create reading-list --template minimal --types ts --add vitest="usages:unit" sveltekit-adapter="adapter:node" --install npm
          cd reading-list
          npm run dev
      - file: src/routes/+page.svelte
        lang: svelte
        text: |
          <h1>My reading list</h1>
          <p>Hello from SvelteKit.</p>
    mistakes:
      - problem:
          en: "The page is blank or shows an error overlay after editing."
          tr: "Düzenledikten sonra sayfa bomboş ya da bir hata ekranı gösteriyor."
        fix:
          en: "Look at the terminal and the error overlay. Usually a typo; the message names the file and line."
          tr: "Terminale ve hata ekranına bak. Genelde bir yazım hatasıdır; mesaj dosyayı ve satırı söyler."
      - problem:
          en: "Creating the file as `page.svelte` or `Page.svelte` and seeing no change."
          tr: "Dosyayı `page.svelte` ya da `Page.svelte` adıyla oluşturup hiçbir değişiklik görmemek."
        fix:
          en: "The name must be exactly `+page.svelte`, with the plus sign. SvelteKit reads the special names with a plus."
          tr: "Ad tam olarak `+page.svelte` olmalı, artı işaretiyle. SvelteKit artılı özel adları okur."
    quiz:
      - q:
          en: "What is `vite.config.ts` used for in SvelteKit 3?"
          tr: "SvelteKit 3'te `vite.config.ts` ne için kullanılır?"
        options:
          en:
            - Only for the test settings
            - For the build tool and for the SvelteKit settings such as the adapter
            - It is not used; svelte.config.js holds everything
          tr:
            - Sadece test ayarları için
            - Build aracı ve adapter gibi SvelteKit ayarları için
            - Kullanılmaz; her şey svelte.config.js'te durur
        answer: 1
        why:
          en: "SvelteKit 3 no longer reads svelte.config.js. Its options go to the sveltekit() plugin inside vite.config.ts."
          tr: "SvelteKit 3 artık svelte.config.js okumaz. Seçenekleri vite.config.ts içindeki sveltekit() eklentisine verilir."
    sources:
      - title: SvelteKit, creating a project
        url: https://svelte.dev/docs/kit/creating-a-project
      - title: SvelteKit, project structure
        url: https://svelte.dev/docs/kit/project-structure
      - title: SvelteKit, migrating to SvelteKit 3
        url: https://svelte.dev/docs/kit/migrating-to-sveltekit-3

  - id: components-runes
    stage: basics
    title:
      en: "Components and runes: $props, $state, $derived, $effect"
      tr: "Component'ler ve rune'lar: $props, $state, $derived, $effect"
    minutes: 60
    needs: [first-app]
    why:
      en: "A Svelte app is made of small components. Runes are the special words that make them alive: they hold state, calculate values from it and react to changes. Everything else in this roadmap builds on these four."
      tr: "Bir Svelte uygulaması küçük component'lerden oluşur. Rune'lar onları canlandıran özel kelimelerdir: state tutar, ondan değer hesaplar ve değişikliklere tepki verirler. Bu roadmap'te geri kalan her şey bu dördü üzerine kurulur."
    learn:
      en: |
        - A `.svelte` file holds a script, markup and styles; styles are scoped to that component
        - `$props()` gives a component what its parent passed in, and a callback prop (`onnext`) lets the child tell the parent something happened
        - `$state` makes a value reactive: when it changes the page updates. Objects and arrays inside it are tracked deeply
        - `$derived` is a value computed from other values and recalculated by itself; use it instead of copying values around
        - `$effect` runs code after the page updates, for things outside Svelte such as `document.title`. It runs only in the browser
        - `{#each ... (key)}` repeats markup for a list, and the key keeps rows stable
      tr: |
        - `.svelte` dosyası bir script, markup ve stiller tutar; stiller o component ile sınırlıdır
        - `$props()` bir component'e parent'ının verdiklerini getirir; callback prop (`onnext`) child'ın parent'a bir şey olduğunu söylemesini sağlar
        - `$state` bir değeri reaktif yapar: değişince sayfa güncellenir. İçindeki obje ve diziler derinlemesine izlenir
        - `$derived` başka değerlerden hesaplanan ve kendiliğinden yeniden hesaplanan bir değerdir; değerleri bir yerden bir yere kopyalamak yerine onu kullan
        - `$effect` sayfa güncellendikten sonra Svelte dışındaki şeyler için kod çalıştırır, örneğin `document.title`. Sadece tarayıcıda çalışır
        - `{#each ... (key)}` bir liste için markup'ı tekrar eder; key satırları sabit tutar
    do:
      en: |
        1. Create `src/lib/books.ts` with the types below. Every other file will import them.
        2. Create the folder `src/lib/components` and the file `BookCard.svelte` in it. It receives a `book` and an `onnext` callback as props.
        3. Replace `src/routes/+page.svelte` with the page below. The `books` list is `$state`, `finished` is `$derived`, and the `$effect` writes the count into the browser tab title.
        4. Click a status badge: it changes from "Want to read" to "Reading" to "Finished", the count above the list updates and so does the tab title.
        5. Run `npm run check` in a second terminal. It type-checks your code and should end with `0 ERRORS`.
        6. Commit: `git add .` and `git commit -m "Book card and runes"`.
      tr: |
        1. Aşağıdaki tiplerle `src/lib/books.ts` dosyasını oluştur. Diğer her dosya bunları import edecek.
        2. `src/lib/components` klasörünü ve içinde `BookCard.svelte` dosyasını oluştur. Prop olarak bir `book` ve bir `onnext` callback'i alır.
        3. `src/routes/+page.svelte` dosyasını aşağıdaki sayfayla değiştir. `books` listesi `$state`, `finished` `$derived`, `$effect` ise sayıyı tarayıcı sekmesinin başlığına yazar.
        4. Bir durum rozetine tıkla: "Want to read"den "Reading"e, oradan "Finished"a geçer; listenin üstündeki sayı ve sekme başlığı güncellenir.
        5. İkinci bir terminalde `npm run check` çalıştır. Kodunun tiplerini kontrol eder ve `0 ERRORS` ile bitmeli.
        6. Commit'le: `git add .` ve `git commit -m "Book card and runes"`.
    code:
      - file: src/lib/books.ts
        lang: ts
        text: |
          export type Status = 'want' | 'reading' | 'done';

          export const STATUSES: Status[] = ['want', 'reading', 'done'];

          export const STATUS_LABEL: Record<Status, string> = {
          	want: 'Want to read',
          	reading: 'Reading',
          	done: 'Finished'
          };

          export interface Book {
          	id: number;
          	title: string;
          	author: string;
          	status: Status;
          }
      - file: src/lib/components/BookCard.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import { STATUS_LABEL, type Book } from '#lib/books.js';

          	interface Props {
          		book: Book;
          		onnext?: (book: Book) => void;
          	}

          	let { book, onnext }: Props = $props();
          </script>

          <li class="card">
          	<div>
          		<strong>{book.title}</strong>
          		<span class="author">by {book.author}</span>
          	</div>
          	<button type="button" class="badge {book.status}" onclick={() => onnext?.(book)}>
          		{STATUS_LABEL[book.status]}
          	</button>
          </li>

          <style>
          	.card {
          		display: flex;
          		justify-content: space-between;
          		align-items: center;
          		gap: 1rem;
          		padding: 0.75rem 1rem;
          		border: 1px solid #d0d7de;
          		border-radius: 8px;
          		list-style: none;
          	}
          	.author {
          		color: #57606a;
          		margin-left: 0.5rem;
          	}
          	.badge {
          		border: 0;
          		border-radius: 999px;
          		padding: 0.25rem 0.75rem;
          		cursor: pointer;
          		background: #eaeef2;
          	}
          	.reading {
          		background: #fff1c2;
          	}
          	.done {
          		background: #c9f2d3;
          	}
          </style>
      - file: src/routes/+page.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import BookCard from '#lib/components/BookCard.svelte';
          	import { STATUSES, type Book } from '#lib/books.js';

          	let books = $state<Book[]>([
          		{ id: 1, title: 'The Pragmatic Programmer', author: 'Hunt and Thomas', status: 'reading' },
          		{ id: 2, title: 'Eloquent JavaScript', author: 'Marijn Haverbeke', status: 'want' },
          		{ id: 3, title: 'Refactoring', author: 'Martin Fowler', status: 'done' }
          	]);

          	let finished = $derived(books.filter((b) => b.status === 'done').length);

          	function next(book: Book) {
          		book.status = STATUSES[(STATUSES.indexOf(book.status) + 1) % STATUSES.length];
          	}

          	$effect(() => {
          		document.title = `Reading list (${finished}/${books.length} finished)`;
          	});
          </script>

          <h1>Reading list</h1>
          <p>{finished} of {books.length} finished</p>

          <ul>
          	{#each books as book (book.id)}
          		<BookCard {book} onnext={next} />
          	{/each}
          </ul>
    mistakes:
      - problem:
          en: "Using `$effect` to copy a value into another variable, for example setting `finished` inside an effect."
          tr: "Bir değeri başka bir değişkene kopyalamak için `$effect` kullanmak, örneğin `finished`'i bir effect içinde atamak."
        fix:
          en: "Use `$derived`. It is shorter and never shows an old value. Effects are for talking to things outside Svelte."
          tr: "`$derived` kullan. Daha kısadır ve eski değeri asla göstermez. Effect'ler Svelte dışındaki şeylerle konuşmak içindir."
      - problem:
          en: "Writing `onclick={onnext(book)}` and watching the function run while the page draws."
          tr: "`onclick={onnext(book)}` yazıp fonksiyonun sayfa çizilirken çalıştığını görmek."
        fix:
          en: "Pass a function, not its result: `onclick={() => onnext?.(book)}`."
          tr: "Sonucu değil bir fonksiyon ver: `onclick={() => onnext?.(book)}`."
      - problem:
          en: "A plain `let books = [...]` that does not update the page when it changes."
          tr: "Değişince sayfayı güncellemeyen düz bir `let books = [...]`."
        fix:
          en: "In Svelte 5 only values created with `$state` are reactive. Wrap the initial value: `let books = $state([...])`."
          tr: "Svelte 5'te sadece `$state` ile oluşturulan değerler reaktiftir. Başlangıç değerini sar: `let books = $state([...])`."
    quiz:
      - q:
          en: "You need `finished`, the number of finished books, which changes whenever the list changes. What do you use?"
          tr: "`finished` değerine, yani bitmiş kitap sayısına ihtiyacın var ve liste değiştikçe o da değişiyor. Ne kullanırsın?"
        options:
          en:
            - $effect that sets a variable
            - $derived
            - A normal let that you update by hand everywhere
          tr:
            - Bir değişkeni atayan $effect
            - $derived
            - Her yerde elle güncellediğin normal bir let
        answer: 1
        why:
          en: "$derived recalculates from the state it reads. An effect would run later and leave a moment where the value is wrong."
          tr: "$derived okuduğu state'ten yeniden hesaplanır. Effect daha sonra çalışır ve değerin yanlış olduğu bir an bırakır."
    sources:
      - title: Svelte, $state
        url: https://svelte.dev/docs/svelte/$state
      - title: Svelte, $derived
        url: https://svelte.dev/docs/svelte/$derived
      - title: Svelte, $effect
        url: https://svelte.dev/docs/svelte/$effect

  - id: routes-layout
    stage: basics
    title:
      en: "Routes, a layout and the current page"
      tr: "Route'lar, bir layout ve geçerli sayfa"
    minutes: 30
    needs: [components-runes]
    why:
      en: "Real apps have more than one page and a menu on all of them. In SvelteKit the folders in `src/routes` are the URLs, and a layout wraps every page once, so the menu is written in one place."
      tr: "Gerçek uygulamaların birden fazla sayfası ve hepsinde bir menüsü olur. SvelteKit'te `src/routes` içindeki klasörler URL'dir; layout her sayfayı bir kez sarar, böylece menü tek yerde yazılır."
    learn:
      en: |
        - A folder in `src/routes` is a URL: `src/routes/about/+page.svelte` is `/about`
        - `+layout.svelte` wraps the pages below it and shows them with `{@render children()}`
        - `page` from `$app/state` is a reactive object with the current URL. In SvelteKit 3 this replaces the old `$app/stores`
        - Global styles go in a CSS file that the layout imports; component styles stay inside the component
        - Links are plain `<a href>`: SvelteKit takes over the click and switches pages without a full reload
      tr: |
        - `src/routes` içindeki klasör bir URL'dir: `src/routes/about/+page.svelte` `/about`'tur
        - `+layout.svelte` altındaki sayfaları sarar ve `{@render children()}` ile gösterir
        - `$app/state` içindeki `page`, geçerli URL'yi taşıyan reaktif bir objedir. SvelteKit 3'te eski `$app/stores`'un yerini alır
        - Global stiller layout'un import ettiği bir CSS dosyasına girer; component stilleri component'in içinde kalır
        - Link'ler düz `<a href>`'tir: SvelteKit tıklamayı devralır ve sayfayı tam yenileme olmadan değiştirir
    do:
      en: |
        1. Create `src/lib/app.css` with the code below.
        2. Replace `src/routes/+layout.svelte`. It imports the CSS, keeps the favicon the template made, shows a menu and renders the page inside `<main>`.
        3. Create `src/routes/about/+page.svelte`.
        4. Click between "Books" and "About". The page changes without reloading and the current link is bold.
        5. Run `npm run check`, then commit: `git add .` and `git commit -m "Layout and about page"`.
      tr: |
        1. Aşağıdaki kodla `src/lib/app.css` oluştur.
        2. `src/routes/+layout.svelte` dosyasını değiştir. CSS'i import eder, şablonun yaptığı favicon'u korur, bir menü gösterir ve sayfayı `<main>` içinde çizer.
        3. `src/routes/about/+page.svelte` dosyasını oluştur.
        4. "Books" ile "About" arasında tıkla. Sayfa yenilenmeden değişir ve geçerli link kalın görünür.
        5. `npm run check` çalıştır, sonra commit'le: `git add .` ve `git commit -m "Layout and about page"`.
    code:
      - file: src/lib/app.css
        lang: css
        text: |
          :root {
          	font-family: system-ui, sans-serif;
          	line-height: 1.5;
          }
          body {
          	margin: 0;
          }
          main {
          	max-width: 40rem;
          	margin: 0 auto;
          	padding: 1rem;
          }
          nav {
          	display: flex;
          	gap: 1rem;
          	padding: 1rem;
          	border-bottom: 1px solid #d0d7de;
          }
          nav a[aria-current='page'] {
          	font-weight: bold;
          }
          ul {
          	display: grid;
          	gap: 0.5rem;
          	padding: 0;
          }
      - file: src/routes/+layout.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import '#lib/app.css';
          	import favicon from '#lib/assets/favicon.svg';
          	import { page } from '$app/state';
          	import type { LayoutProps } from './$types';

          	let { children }: LayoutProps = $props();
          </script>

          <svelte:head>
          	<link rel="icon" href={favicon} />
          </svelte:head>

          <nav>
          	<a href="/" aria-current={page.url.pathname === '/' ? 'page' : undefined}>Books</a>
          	<a href="/about" aria-current={page.url.pathname === '/about' ? 'page' : undefined}>About</a>
          </nav>

          <main>
          	{@render children()}
          </main>
      - file: src/routes/about/+page.svelte
        lang: svelte
        text: |
          <svelte:head>
          	<title>About - Reading list</title>
          </svelte:head>

          <h1>About</h1>
          <p>A small reading list built with SvelteKit while learning with God Eye.</p>
    mistakes:
      - problem:
          en: "Forgetting `{@render children()}` in the layout, so the pages never appear."
          tr: "Layout'ta `{@render children()}` yazmayı unutmak; sayfalar hiç görünmez."
        fix:
          en: "Receive `children` from `$props()` and render it where the page should go."
          tr: "`children`'ı `$props()`'tan al ve sayfanın gireceği yerde çiz."
      - problem:
          en: "Importing `$page` from `$app/stores`, which gives an error in SvelteKit 3."
          tr: "SvelteKit 3'te hata veren `$app/stores`'tan `$page` import etmek."
        fix:
          en: "Use `import { page } from '$app/state'` and read `page.url.pathname` without a dollar sign."
          tr: "`import { page } from '$app/state'` kullan ve `page.url.pathname`'i dolar işareti olmadan oku."
      - problem:
          en: "Leaving out the extension in a `#lib` import, like `#lib/books`."
          tr: "`#lib` import'unda uzantıyı yazmamak, örneğin `#lib/books`."
        fix:
          en: "With the `#lib` alias you write the file extension: `#lib/books.js` (it finds `books.ts` too)."
          tr: "`#lib` alias'ıyla dosya uzantısını yazarsın: `#lib/books.js` (`books.ts`'i de bulur)."
    quiz:
      - q:
          en: "Which file makes the address `/about` work?"
          tr: "`/about` adresini hangi dosya çalıştırır?"
        options:
          en:
            - src/routes/about.svelte
            - src/routes/about/+page.svelte
            - src/lib/about/+page.svelte
          tr:
            - src/routes/about.svelte
            - src/routes/about/+page.svelte
            - src/lib/about/+page.svelte
        answer: 1
        why:
          en: "Routes are folders inside src/routes, and the page itself is the special file +page.svelte."
          tr: "Route'lar src/routes içindeki klasörlerdir; sayfanın kendisi +page.svelte özel dosyasıdır."
    sources:
      - title: SvelteKit, routing
        url: https://svelte.dev/docs/kit/routing
      - title: SvelteKit, $app/state
        url: https://svelte.dev/docs/kit/$app-state
      - title: SvelteKit, migrating to SvelteKit 3 ($lib is now #lib)
        url: https://svelte.dev/docs/kit/migrating-to-sveltekit-3

  - id: reading-pages
    stage: first-project
    title:
      en: "The reading list: filter and add books"
      tr: "Okuma listesi: süzme ve kitap ekleme"
    minutes: 60
    needs: [routes-layout]
    why:
      en: "Now you put the pieces together into the first real version of the app. It still keeps the books in the browser's memory, which lets you practice forms and bindings before a database enters the picture."
      tr: "Şimdi parçaları birleştirip uygulamanın ilk gerçek sürümünü yapıyorsun. Kitapları hâlâ tarayıcının belleğinde tutar; bu sayede veritabanı devreye girmeden önce form'ları ve bağlamayı çalışırsın."
    learn:
      en: |
        - `bind:value` keeps an input and a variable in sync in both directions
        - `$bindable` lets a parent bind to a child's prop (`bind:value={filter}`), so the child can change the parent's state
        - `onsubmit` with `event.preventDefault()` stops the browser from reloading the page
        - Splitting a page into small components (`AddBookForm`, `StatusFilter`, `BookCard`) keeps each file easy to read
        - `{:else}` inside `{#each}` shows something when the list is empty
      tr: |
        - `bind:value` bir input ile bir değişkeni iki yönde senkron tutar
        - `$bindable` parent'ın child'ın prop'una bağlanmasını sağlar (`bind:value={filter}`); böylece child parent'ın state'ini değiştirebilir
        - `event.preventDefault()` ile `onsubmit`, tarayıcının sayfayı yenilemesini durdurur
        - Sayfayı küçük component'lere bölmek (`AddBookForm`, `StatusFilter`, `BookCard`) her dosyayı okunur tutar
        - `{#each}` içindeki `{:else}` liste boşken bir şey gösterir
    do:
      en: |
        1. Move the three sample books out of the page: create `src/lib/sample.ts` with the code below.
        2. Create `src/lib/components/StatusFilter.svelte`. Its `value` prop is `$bindable`, so the page can write `bind:value={filter}`.
        3. Create `src/lib/components/AddBookForm.svelte`. It keeps the typed text in its own `$state` and calls `onadd` when the form is sent.
        4. Replace `src/routes/+page.svelte`: the filter chooses which books are `visible` (a `$derived`), and `add` pushes a new book into the `$state` array.
        5. Try it: add a book, click the filter buttons, add a book with an empty title (nothing happens). Reload the page and see the new books vanish: they only lived in memory. The next steps fix that.
        6. Run `npm run check` and commit: `git add .` and `git commit -m "Filter and add books"`.
      tr: |
        1. Üç örnek kitabı sayfadan çıkar: aşağıdaki kodla `src/lib/sample.ts` oluştur.
        2. `src/lib/components/StatusFilter.svelte` oluştur. `value` prop'u `$bindable`'dır; sayfa `bind:value={filter}` yazabilir.
        3. `src/lib/components/AddBookForm.svelte` oluştur. Yazılan metni kendi `$state`'inde tutar ve form gönderilince `onadd`'i çağırır.
        4. `src/routes/+page.svelte` dosyasını değiştir: filtre hangi kitapların `visible` (bir `$derived`) olacağını seçer, `add` ise `$state` dizisine yeni bir kitap ekler.
        5. Dene: bir kitap ekle, filtre düğmelerine tıkla, boş başlıkla kitap eklemeyi dene (hiçbir şey olmaz). Sayfayı yenile ve yeni kitapların kaybolduğunu gör: sadece bellekte duruyorlardı. Sonraki adımlar bunu düzeltir.
        6. `npm run check` çalıştır ve commit'le: `git add .` ve `git commit -m "Filter and add books"`.
    code:
      - file: src/lib/sample.ts
        lang: ts
        text: |
          import type { Book } from './books.js';

          export const sampleBooks: Book[] = [
          	{ id: 1, title: 'The Pragmatic Programmer', author: 'Hunt and Thomas', status: 'reading' },
          	{ id: 2, title: 'Eloquent JavaScript', author: 'Marijn Haverbeke', status: 'want' },
          	{ id: 3, title: 'Refactoring', author: 'Martin Fowler', status: 'done' }
          ];
      - file: src/lib/components/StatusFilter.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import { STATUSES, STATUS_LABEL, type Status } from '#lib/books.js';

          	let { value = $bindable('all') }: { value?: Status | 'all' } = $props();
          </script>

          <div class="filter" role="group" aria-label="Filter by status">
          	<button type="button" aria-pressed={value === 'all'} onclick={() => (value = 'all')}>All</button>
          	{#each STATUSES as status (status)}
          		<button type="button" aria-pressed={value === status} onclick={() => (value = status)}>
          			{STATUS_LABEL[status]}
          		</button>
          	{/each}
          </div>

          <style>
          	.filter {
          		display: flex;
          		flex-wrap: wrap;
          		gap: 0.5rem;
          		margin: 1rem 0;
          	}
          	button[aria-pressed='true'] {
          		background: #0969da;
          		color: white;
          	}
          </style>
      - file: src/lib/components/AddBookForm.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	let { onadd }: { onadd: (title: string, author: string) => void } = $props();

          	let title = $state('');
          	let author = $state('');

          	function submit(event: SubmitEvent) {
          		event.preventDefault();
          		if (!title.trim() || !author.trim()) return;
          		onadd(title.trim(), author.trim());
          		title = '';
          		author = '';
          	}
          </script>

          <form onsubmit={submit}>
          	<input bind:value={title} placeholder="Title" aria-label="Title" />
          	<input bind:value={author} placeholder="Author" aria-label="Author" />
          	<button>Add</button>
          </form>

          <style>
          	form {
          		display: flex;
          		flex-wrap: wrap;
          		gap: 0.5rem;
          	}
          </style>
      - file: src/routes/+page.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import AddBookForm from '#lib/components/AddBookForm.svelte';
          	import BookCard from '#lib/components/BookCard.svelte';
          	import StatusFilter from '#lib/components/StatusFilter.svelte';
          	import { STATUSES, type Book, type Status } from '#lib/books.js';
          	import { sampleBooks } from '#lib/sample.js';

          	let books = $state<Book[]>(sampleBooks);
          	let filter = $state<Status | 'all'>('all');

          	let visible = $derived(filter === 'all' ? books : books.filter((b) => b.status === filter));
          	let finished = $derived(books.filter((b) => b.status === 'done').length);

          	function next(book: Book) {
          		book.status = STATUSES[(STATUSES.indexOf(book.status) + 1) % STATUSES.length];
          	}

          	function add(title: string, author: string) {
          		const id = Math.max(0, ...books.map((b) => b.id)) + 1;
          		books.push({ id, title, author, status: 'want' });
          	}

          	$effect(() => {
          		document.title = `Reading list (${finished}/${books.length} finished)`;
          	});
          </script>

          <h1>Reading list</h1>
          <p>{finished} of {books.length} finished</p>

          <AddBookForm onadd={add} />
          <StatusFilter bind:value={filter} />

          <ul>
          	{#each visible as book (book.id)}
          		<BookCard {book} onnext={next} />
          	{:else}
          		<li>No books here yet.</li>
          	{/each}
          </ul>
    mistakes:
      - problem:
          en: "The page reloads and the typed book disappears when you press Add."
          tr: "Add'e basınca sayfa yenileniyor ve yazılan kitap kayboluyor."
        fix:
          en: "The submit handler must call `event.preventDefault()` first. Without it the browser sends the form and reloads."
          tr: "Submit handler'ı önce `event.preventDefault()` çağırmalı. Çağırmazsa tarayıcı formu gönderir ve sayfayı yeniler."
      - problem:
          en: "Using the list index as the key, `{#each visible as book, i (i)}`."
          tr: "Liste index'ini key olarak kullanmak: `{#each visible as book, i (i)}`."
        fix:
          en: "Use a stable id: `(book.id)`. With the index, rows get mixed up when the list is filtered."
          tr: "Sabit bir id kullan: `(book.id)`. Index'le liste süzüldüğünde satırlar birbirine karışır."
      - problem:
          en: "Writing `let { value } = $props()` and then changing `value` in the child, but the parent never sees it."
          tr: "`let { value } = $props()` yazıp child'da `value`'yu değiştirmek ama parent'ın bunu hiç görmemesi."
        fix:
          en: "Mark the prop `$bindable()` and let the parent write `bind:value={...}`, or pass a callback instead."
          tr: "Prop'u `$bindable()` ile işaretle ve parent `bind:value={...}` yazsın, ya da onun yerine bir callback ver."
    quiz:
      - q:
          en: "What does `$bindable` allow?"
          tr: "`$bindable` neye izin verir?"
        options:
          en:
            - The parent can use bind - on the child's prop and receive its changes
            - The prop becomes read-only
            - The prop is saved in the database
          tr:
            - Parent child'ın prop'una bind ile bağlanıp değişiklikleri alabilir
            - Prop salt okunur olur
            - Prop veritabanına kaydedilir
        answer: 0
        why:
          en: "A normal prop flows one way, from parent to child. $bindable opens the way back when the parent asks for it with bind:."
          tr: "Normal prop tek yönde, parent'tan child'a akar. $bindable, parent bind: ile isteyince geri yolu açar."
    sources:
      - title: Svelte, bind
        url: https://svelte.dev/docs/svelte/bind
      - title: Svelte, $bindable
        url: https://svelte.dev/docs/svelte/$bindable
      - title: Svelte, each blocks
        url: https://svelte.dev/docs/svelte/each

  - id: database
    stage: data-api
    title:
      en: "A database and load functions"
      tr: "Bir veritabanı ve load fonksiyonları"
    minutes: 75
    needs: [reading-pages]
    why:
      en: "Data in memory vanishes when you reload. A database keeps it. We use SQLite through `@libsql/client`: on your computer it is a plain file, and on the internet the very same code talks to Turso, a free hosted SQLite. A `load` function fetches the data on the server and hands it to the page."
      tr: "Bellekteki veri sayfayı yenileyince kaybolur. Veritabanı onu saklar. SQLite'ı `@libsql/client` üzerinden kullanıyoruz: bilgisayarında düz bir dosyadır, internette ise aynı kod Turso'yla, ücretsiz barındırılan bir SQLite'la konuşur. `load` fonksiyonu veriyi sunucuda alır ve sayfaya verir."
    learn:
      en: |
        - Files in `src/lib/server` can only run on the server; SvelteKit refuses to bundle them into the browser, so secrets and database code are safe there
        - A `+page.server.ts` `load` runs on the server before the page is shown, and its result arrives in the page as `data`
        - Environment variables are listed in `src/env.ts` with `defineEnvVars` and imported from `$app/env/private` (server only). The defaults go in a `schema` function
        - The `init` hook in `src/hooks.server.ts` runs once when the server starts: a good place to create the table
        - SQL with `?` placeholders keeps user text out of the query text (more on this in the security step)
      tr: |
        - `src/lib/server` içindeki dosyalar sadece sunucuda çalışabilir; SvelteKit onları tarayıcı bundle'ına koymayı reddeder, bu yüzden secret'lar ve veritabanı kodu orada güvendedir
        - `+page.server.ts` içindeki `load`, sayfa gösterilmeden önce sunucuda çalışır ve sonucu sayfaya `data` olarak gelir
        - Ortam değişkenleri `src/env.ts` içinde `defineEnvVars` ile listelenir ve `$app/env/private`'ten (sadece sunucu) import edilir. Varsayılanlar `schema` fonksiyonuna yazılır
        - `src/hooks.server.ts` içindeki `init` hook'u sunucu başlarken bir kez çalışır: tabloyu oluşturmak için iyi bir yer
        - `?` yer tutuculu SQL, kullanıcı metnini sorgu metninin dışında tutar (güvenlik adımında daha fazlası)
    do:
      en: |
        1. Install the database client. It is a normal dependency, because the server needs it at run time.
        2. Add `local.db*` to `.gitignore` so the database file is never committed.
        3. Create `src/env.ts`. `DATABASE_URL` falls back to the file `file:local.db`; `DATABASE_AUTH_TOKEN` is only needed for Turso.
        4. Create `src/lib/server/db.ts` (the connection) and `src/lib/server/store.ts` (every question the app asks the database). `migrate` creates the table and puts three starter books in an empty one.
        5. Create `src/hooks.server.ts` so the table exists before the first request.
        6. Create `src/routes/+page.server.ts` with a `load` function and delete `src/lib/sample.ts`.
        7. Replace `BookCard.svelte` (the status is plain text for now, the buttons come back in the next step) and `src/routes/+page.svelte`, which now reads `data.books`. The add form is gone for a moment: the next step brings it back as a real form.
        8. Restart `npm run dev`. The three books come from a file called `local.db`. Stop the server, start it again: they are still there.
        9. Run `npm run check` and commit (the database file is ignored by Git).
      tr: |
        1. Veritabanı istemcisini kur. Normal bir bağımlılıktır, çünkü sunucu çalışırken ona ihtiyaç duyar.
        2. Veritabanı dosyası asla commit'lenmesin diye `.gitignore`'a `local.db*` ekle.
        3. `src/env.ts` oluştur. `DATABASE_URL` yoksa `file:local.db` dosyasına döner; `DATABASE_AUTH_TOKEN` sadece Turso için gerekir.
        4. `src/lib/server/db.ts` (bağlantı) ve `src/lib/server/store.ts` (uygulamanın veritabanına sorduğu her soru) oluştur. `migrate` tabloyu oluşturur ve boş bir tabloya üç başlangıç kitabı koyar.
        5. İlk istekten önce tablo hazır olsun diye `src/hooks.server.ts` oluştur.
        6. `load` fonksiyonlu `src/routes/+page.server.ts` oluştur ve `src/lib/sample.ts`'i sil.
        7. `BookCard.svelte`'i (durum şimdilik düz metin, düğmeler sonraki adımda geri gelir) ve artık `data.books` okuyan `src/routes/+page.svelte`'i değiştir. Ekleme formu bir süreliğine yok: sonraki adım onu gerçek bir form olarak geri getirir.
        8. `npm run dev`'i yeniden başlat. Üç kitap `local.db` adlı bir dosyadan geliyor. Sunucuyu durdurup yeniden başlat: hâlâ oradalar.
        9. `npm run check` çalıştır ve commit'le (veritabanı dosyasını Git yok sayar).
    code:
      - file: terminal
        lang: sh
        text: |
          npm install @libsql/client
          printf '\n# Local database\nlocal.db*\n' >> .gitignore
          rm src/lib/sample.ts
      - file: src/env.ts
        lang: ts
        text: |
          import { defineEnvVars } from '@sveltejs/kit/env';

          export const variables = defineEnvVars({
          	DATABASE_URL: {
          		description: 'file:local.db on your computer, the libsql:// address of a Turso database live',
          		schema: (value) => value || 'file:local.db'
          	},
          	DATABASE_AUTH_TOKEN: {
          		description: 'Only needed for a hosted database (Turso)',
          		schema: (value) => value || undefined
          	}
          });
      - file: src/lib/server/db.ts
        lang: ts
        text: |
          import { createClient } from '@libsql/client';
          import { DATABASE_URL, DATABASE_AUTH_TOKEN } from '$app/env/private';

          export const db = createClient({ url: DATABASE_URL, authToken: DATABASE_AUTH_TOKEN });
      - file: src/lib/server/store.ts
        lang: ts
        text: |
          import type { Client } from '@libsql/client';
          import type { Book, Status } from '../books.js';

          const SEED: Omit<Book, 'id'>[] = [
          	{ title: 'The Pragmatic Programmer', author: 'Hunt and Thomas', status: 'reading' },
          	{ title: 'Eloquent JavaScript', author: 'Marijn Haverbeke', status: 'want' },
          	{ title: 'Refactoring', author: 'Martin Fowler', status: 'done' }
          ];

          /** Creates the table if it is missing and puts three starter books in an empty one. */
          export async function migrate(db: Client) {
          	await db.execute(`
          		CREATE TABLE IF NOT EXISTS books (
          			id INTEGER PRIMARY KEY AUTOINCREMENT,
          			title TEXT NOT NULL,
          			author TEXT NOT NULL,
          			status TEXT NOT NULL DEFAULT 'want' CHECK (status IN ('want', 'reading', 'done'))
          		)
          	`);
          	const { rows } = await db.execute('SELECT COUNT(*) AS n FROM books');
          	if (Number(rows[0].n) === 0) {
          		for (const b of SEED) await addBook(db, b);
          	}
          }

          export async function listBooks(db: Client): Promise<Book[]> {
          	const { rows } = await db.execute('SELECT id, title, author, status FROM books ORDER BY id DESC');
          	return rows.map((r) => ({
          		id: Number(r.id),
          		title: String(r.title),
          		author: String(r.author),
          		status: r.status as Status
          	}));
          }

          export async function addBook(db: Client, book: { title: string; author: string; status?: Status }) {
          	await db.execute({
          		sql: 'INSERT INTO books (title, author, status) VALUES (?, ?, ?)',
          		args: [book.title, book.author, book.status ?? 'want']
          	});
          }

          export async function setStatus(db: Client, id: number, status: Status) {
          	await db.execute({ sql: 'UPDATE books SET status = ? WHERE id = ?', args: [status, id] });
          }

          export async function removeBook(db: Client, id: number) {
          	await db.execute({ sql: 'DELETE FROM books WHERE id = ?', args: [id] });
          }

          export async function getBook(db: Client, id: number): Promise<Book | undefined> {
          	const { rows } = await db.execute({
          		sql: 'SELECT id, title, author, status FROM books WHERE id = ?',
          		args: [id]
          	});
          	const r = rows[0];
          	return r && { id: Number(r.id), title: String(r.title), author: String(r.author), status: r.status as Status };
          }
