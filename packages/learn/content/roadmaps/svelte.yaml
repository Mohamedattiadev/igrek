    mistakes:
      - problem:
          en: "Using the `status` from the URL in SQL or in a type without checking it."
          tr: "URL'deki `status`'u kontrol etmeden SQL'de ya da bir tipte kullanmak."
        fix:
          en: "The URL is visitor input. Check it with `isStatus` and ignore anything else, as `load` does."
          tr: "URL ziyaretçi girdisidir. `load`'un yaptığı gibi `isStatus` ile kontrol et ve gerisini yok say."
      - problem:
          en: "Counting `data.books.length` for the total while the list is filtered, so the total changes."
          tr: "Liste süzülüyken toplamı `data.books.length` ile saymak; toplam değişir."
        fix:
          en: "Ask the database for the counts (`countBooks`) and show those. The list and the totals are different questions."
          tr: "Sayıları veritabanından iste (`countBooks`) ve onları göster. Liste ve toplamlar farklı sorulardır."
    quiz:
      - q:
          en: "Why put the filter in the URL (`?status=done`) instead of in `$state`?"
          tr: "Filtreyi neden `$state` yerine URL'ye (`?status=done`) koyuyoruz?"
        options:
          en:
            - It can be bookmarked and shared, and works without JavaScript
            - $state cannot hold a string
            - URLs are faster than state
          tr:
            - Yer imine eklenebilir, paylaşılabilir ve JavaScript olmadan çalışır
            - $state bir string tutamaz
            - URL'ler state'ten hızlıdır
        answer: 0
        why:
          en: "A URL survives reloads and can be sent to someone. A plain link also works before any JavaScript has loaded."
          tr: "URL yenilemelerden sağ çıkar ve birine gönderilebilir. Düz bir link, hiç JavaScript yüklenmeden de çalışır."
