  - id: form-actions
    stage: data-api
    title:
      en: "Forms that work: form actions and use:enhance"
      tr: "Çalışan form'lar: form action'ları ve use:enhance"
    minutes: 75
    needs: [database]
    why:
      en: "A form is the oldest and most reliable way for a web page to send data. SvelteKit form actions receive the posted form on the server and can return errors to show. With `use:enhance` the same form also works without a page reload, and it still works if JavaScript fails to load. This is called progressive enhancement."
      tr: "Form, bir web sayfasının veri göndermesinin en eski ve en güvenilir yoludur. SvelteKit form action'ları gönderilen formu sunucuda alır ve gösterilecek hataları döndürebilir. `use:enhance` ile aynı form sayfa yenilenmeden de çalışır ve JavaScript yüklenemese bile çalışmaya devam eder. Buna progressive enhancement denir."
    learn:
      en: |
        - A `<form method="POST" action="?/add">` posts to the action named `add` in `+page.server.ts`
        - An action reads `await request.formData()`, validates, and either changes data or returns `fail(400, {...})` with the values to show again
        - The page gets the result as the `form` prop. After a successful action SvelteKit reruns `load`, so the list updates by itself
        - `use:enhance` sends the form with `fetch` and updates the page in place; remove it and the form still works with a full page load
        - Never trust the browser's input: always validate on the server (the `required` attribute is only a courtesy)
      tr: |
        - `<form method="POST" action="?/add">`, `+page.server.ts` içindeki `add` adlı action'a POST eder
        - Action `await request.formData()` okur, doğrular ve ya veriyi değiştirir ya da tekrar gösterilecek değerlerle `fail(400, {...})` döndürür
        - Sayfa sonucu `form` prop'u olarak alır. Başarılı bir action'dan sonra SvelteKit `load`'u yeniden çalıştırır; liste kendiliğinden güncellenir
        - `use:enhance` formu `fetch` ile gönderir ve sayfayı yerinde günceller; onu kaldırsan da form tam sayfa yüklemesiyle çalışır
        - Tarayıcıdan gelen girdiye asla güvenme: her zaman sunucuda doğrula (`required` özelliği sadece bir nezakettir)
    do:
      en: |
        1. Add the helpers at the end of `src/lib/books.ts`: `nextStatus`, `isStatus` and `validateBook`. They are plain functions, so they are easy to test in the next step.
        2. Replace `src/routes/+page.server.ts`. It keeps `load` and adds three actions: `add`, `next` (moves a book to its next status) and `remove`.
        3. Replace `AddBookForm.svelte` with a real form. It shows the error text and keeps what the visitor typed when validation fails.
        4. Replace `BookCard.svelte`: the status badge and a Delete button are now small forms.
        5. Replace `src/routes/+page.svelte`: it passes `form` to the add form.
        6. Run `npm run dev`. Add a book, change its status, delete it, add one with an empty title. Reload: everything stays.
        7. Prove the progressive enhancement: in your browser's developer tools turn JavaScript off (Chrome: DevTools, Ctrl+Shift+P, "Disable JavaScript") and use the forms again. They still work, with a page reload each time. Turn JavaScript back on.
        8. Commit: `git add .` and `git commit -m "Form actions"`.
      tr: |
        1. `src/lib/books.ts` dosyasının sonuna yardımcıları ekle: `nextStatus`, `isStatus` ve `validateBook`. Düz fonksiyonlardır; bu yüzden sonraki adımda test etmesi kolaydır.
        2. `src/routes/+page.server.ts` dosyasını değiştir. `load`'u korur ve üç action ekler: `add`, `next` (kitabı sonraki duruma taşır) ve `remove`.
        3. `AddBookForm.svelte`'i gerçek bir formla değiştir. Hata metnini gösterir ve doğrulama başarısız olunca ziyaretçinin yazdığını korur.
        4. `BookCard.svelte`'i değiştir: durum rozeti ve Delete düğmesi artık küçük form'lardır.
        5. `src/routes/+page.svelte`'i değiştir: `form`'u ekleme formuna verir.
        6. `npm run dev` çalıştır. Kitap ekle, durumunu değiştir, sil, boş başlıkla eklemeyi dene. Yenile: her şey durur.
        7. Progressive enhancement'ı kanıtla: tarayıcının geliştirici araçlarında JavaScript'i kapat (Chrome: DevTools, Ctrl+Shift+P, "Disable JavaScript") ve form'ları yeniden kullan. Her seferinde sayfa yenilenerek de olsa çalışmaya devam ederler. JavaScript'i yeniden aç.
        8. Commit'le: `git add .` ve `git commit -m "Form actions"`.
    code:
      - file: src/lib/books.ts
        lang: ts
        text: |
          // add at the end of the file

          export function nextStatus(status: Status): Status {
          	return STATUSES[(STATUSES.indexOf(status) + 1) % STATUSES.length];
          }

          export function isStatus(value: unknown): value is Status {
          	return typeof value === 'string' && (STATUSES as string[]).includes(value);
          }

          export type BookErrors = { title?: string; author?: string };

          /** Checks what a visitor typed. Returns the cleaned values or a message per field. */
          export function validateBook(
          	title: unknown,
          	author: unknown
          ): { ok: true; value: { title: string; author: string } } | { ok: false; errors: BookErrors } {
          	const t = typeof title === 'string' ? title.trim() : '';
          	const a = typeof author === 'string' ? author.trim() : '';
          	const errors: BookErrors = {};
          	if (!t) errors.title = 'Title is required';
          	if (!a) errors.author = 'Author is required';
          	if (errors.title || errors.author) return { ok: false, errors };
          	return { ok: true, value: { title: t, author: a } };
          }
      - file: src/routes/+page.server.ts
        lang: ts
        text: |
          import { fail } from '@sveltejs/kit';
          import { db } from '#lib/server/db.js';
          import { addBook, getBook, listBooks, removeBook, setStatus } from '#lib/server/store.js';
          import { nextStatus, validateBook } from '#lib/books.js';
          import type { Actions, PageServerLoad } from './$types';

          export const load: PageServerLoad = async () => {
          	return { books: await listBooks(db) };
          };

          export const actions = {
          	add: async ({ request }) => {
          		const form = await request.formData();
          		const title = form.get('title');
          		const author = form.get('author');
          		const result = validateBook(title, author);
          		if (!result.ok) {
          			return fail(400, {
          				errors: result.errors,
          				title: String(title ?? ''),
          				author: String(author ?? '')
          			});
          		}
          		await addBook(db, result.value);
          		return { added: true };
          	},

          	next: async ({ request }) => {
          		const id = Number((await request.formData()).get('id'));
          		const book = Number.isInteger(id) ? await getBook(db, id) : undefined;
          		if (!book) return fail(404, { message: 'Book not found' });
          		await setStatus(db, id, nextStatus(book.status));
          	},

          	remove: async ({ request }) => {
          		const id = Number((await request.formData()).get('id'));
          		if (!Number.isInteger(id)) return fail(400, { message: 'Bad id' });
          		await removeBook(db, id);
          	}
          } satisfies Actions;
      - file: src/lib/components/AddBookForm.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import { enhance } from '$app/forms';
          	import type { BookErrors } from '#lib/books.js';

          	interface Props {
          		errors?: BookErrors;
          		title?: string;
          		author?: string;
          	}

          	let { errors, title = '', author = '' }: Props = $props();
          </script>

          <form method="POST" action="?/add" use:enhance>
          	<label>
          		Title
          		<input name="title" value={title} aria-invalid={errors?.title ? 'true' : undefined} />
          		{#if errors?.title}<span class="error">{errors.title}</span>{/if}
          	</label>
          	<label>
          		Author
          		<input name="author" value={author} aria-invalid={errors?.author ? 'true' : undefined} />
          		{#if errors?.author}<span class="error">{errors.author}</span>{/if}
          	</label>
          	<button>Add</button>
          </form>

          <style>
          	form {
          		display: flex;
          		flex-wrap: wrap;
          		align-items: end;
          		gap: 0.5rem;
          	}
          	label {
          		display: grid;
          	}
          	.error {
          		color: #cf222e;
          		font-size: 0.875rem;
          	}
          </style>
      - file: src/lib/components/BookCard.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import { enhance } from '$app/forms';
          	import { STATUS_LABEL, type Book } from '#lib/books.js';

          	let { book }: { book: Book } = $props();
          </script>

          <li class="card">
          	<div>
          		<strong>{book.title}</strong>
          		<span class="author">by {book.author}</span>
          	</div>
          	<div class="actions">
          		<form method="POST" action="?/next" use:enhance>
          			<input type="hidden" name="id" value={book.id} />
          			<button class="badge {book.status}" title="Move to the next status">
          				{STATUS_LABEL[book.status]}
          			</button>
          		</form>
          		<form method="POST" action="?/remove" use:enhance>
          			<input type="hidden" name="id" value={book.id} />
          			<button aria-label="Delete {book.title}">Delete</button>
          		</form>
          	</div>
          </li>

          <style>
          	.card {
          		display: flex;
          		justify-content: space-between;
          		align-items: center;
          		gap: 1rem;
          		padding: 0.75rem 1rem;
          		border: 1px solid #d0d7de;
          		border-radius: 8px;
          		list-style: none;
          	}
          	.author {
          		color: #57606a;
          		margin-left: 0.5rem;
          	}
          	.actions {
          		display: flex;
          		gap: 0.5rem;
          	}
          	.badge {
          		border: 0;
          		border-radius: 999px;
          		padding: 0.25rem 0.75rem;
          		cursor: pointer;
          		background: #eaeef2;
          	}
          	.reading {
          		background: #fff1c2;
          	}
          	.done {
          		background: #c9f2d3;
          	}
          </style>
      - file: src/routes/+page.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import AddBookForm from '#lib/components/AddBookForm.svelte';
          	import BookCard from '#lib/components/BookCard.svelte';
          	import StatusFilter from '#lib/components/StatusFilter.svelte';
          	import type { Status } from '#lib/books.js';
          	import type { PageProps } from './$types';

          	let { data, form }: PageProps = $props();

          	let filter = $state<Status | 'all'>('all');

          	let visible = $derived(
          		filter === 'all' ? data.books : data.books.filter((b) => b.status === filter)
          	);
          	let finished = $derived(data.books.filter((b) => b.status === 'done').length);

          	$effect(() => {
          		document.title = `Reading list (${finished}/${data.books.length} finished)`;
          	});
          </script>

          <h1>Reading list</h1>
          <p>{finished} of {data.books.length} finished</p>

          <AddBookForm errors={form?.errors} title={form?.title} author={form?.author} />
          <StatusFilter bind:value={filter} />

          <ul>
          	{#each visible as book (book.id)}
          		<BookCard {book} />
          	{:else}
          		<li>No books here yet.</li>
          	{/each}
          </ul>
    mistakes:
      - problem:
          en: "Nothing happens on submit, or the URL just gets `?title=...` added."
          tr: "Gönderince hiçbir şey olmuyor ya da URL'ye sadece `?title=...` ekleniyor."
        fix:
          en: "The form needs `method=\"POST\"`. Without it the browser sends a GET and no action runs. `use:enhance` does not replace it."
          tr: "Form'un `method=\"POST\"` olması gerekir. Olmazsa tarayıcı GET gönderir ve hiçbir action çalışmaz. `use:enhance` onun yerini tutmaz."
      - problem:
          en: "Returning errors with `return { errors }` and the page still shows a success state."
          tr: "Hataları `return { errors }` ile döndürmek ve sayfanın hâlâ başarı durumunu göstermesi."
        fix:
          en: "Use `fail(400, { errors })`. It sets the HTTP status to 400, so the form keeps what was typed and tools know the request failed."
          tr: "`fail(400, { errors })` kullan. HTTP durumunu 400 yapar; böylece form yazılanı korur ve araçlar isteğin başarısız olduğunu bilir."
      - problem:
          en: "A form action that works with JavaScript on but not off, because it relies on client code."
          tr: "Sadece JavaScript açıkken çalışan, kapalıyken çalışmayan bir form action'ı; çünkü istemci koduna güveniyor."
        fix:
          en: "Do the real work in the action on the server and treat `use:enhance` as a bonus. Test once with JavaScript turned off."
          tr: "Asıl işi sunucudaki action'da yap ve `use:enhance`'ı bir bonus say. Bir kere JavaScript kapalıyken test et."
    quiz:
      - q:
          en: "A validation error happens in an action. What should it return?"
          tr: "Bir action'da doğrulama hatası oldu. Ne döndürmeli?"
        options:
          en:
            - throw new Error
            - fail(400, { errors, ...the typed values })
            - redirect(303, '/')
          tr:
            - throw new Error
            - fail(400, { errors, ...yazılan değerler })
            - redirect(303, '/')
        answer: 1
        why:
          en: "fail() answers with a 400 status and the data the page needs to show the errors and keep the input."
          tr: "fail() 400 durumuyla ve sayfanın hataları gösterip girdiyi korumak için ihtiyaç duyduğu veriyle cevap verir."
