          		cursor: pointer;
          		background: #eaeef2;
          	}
          	.reading {
          		background: #fff1c2;
          	}
          	.done {
          		background: #c9f2d3;
          	}
          </style>
      - file: src/lib/components/AddBookForm.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import { enhance } from '$app/forms';
          	import { MAX_AUTHOR, MAX_TITLE, type BookErrors } from '#lib/books.js';

          	interface Props {
          		errors?: BookErrors;
          		title?: string;
          		author?: string;
          	}

          	let { errors, title = '', author = '' }: Props = $props();
          </script>

          <form method="POST" action="?/add" use:enhance>
          	<label>
          		Title
          		<input name="title" value={title} maxlength={MAX_TITLE} aria-invalid={errors?.title ? 'true' : undefined} />
          		{#if errors?.title}<span class="error">{errors.title}</span>{/if}
          	</label>
          	<label>
          		Author
          		<input name="author" value={author} maxlength={MAX_AUTHOR} aria-invalid={errors?.author ? 'true' : undefined} />
          		{#if errors?.author}<span class="error">{errors.author}</span>{/if}
          	</label>
          	<button>Add</button>
          </form>

          <style>
          	form {
          		display: flex;
          		flex-wrap: wrap;
          		align-items: end;
          		gap: 0.5rem;
          	}
          	label {
          		display: grid;
          	}
          	.error {
          		color: #cf222e;
          		font-size: 0.875rem;
          	}
          </style>
      - file: src/routes/+page.svelte
        lang: svelte
        text: |
          <!-- replace <AddBookForm ... /> and <BookCard {book} /> in the markup with: -->
          {#if data.canEdit}
          	<AddBookForm errors={form?.errors} title={form?.title} author={form?.author} />
          	<form method="POST" action="/login?/logout">
          		<button>Log out</button>
          	</form>
          {:else}
          	<p><a href="/login">Log in</a> to add or change books.</p>
          {/if}

          <!-- and inside the each block: -->
          <BookCard {book} editable={data.canEdit} />
      - file: vite.config.ts
        lang: ts
        text: |
          // inside sveltekit({ ... }), after adapter: adapter(),
          csp: {
          	directives: {
          		'script-src': ['self'],
          		'object-src': ['none'],
          		'base-uri': ['self'],
          		'frame-ancestors': ['none']
          	}
          }
      - file: src/lib/books.test.ts
        lang: ts
        text: |
          // import { MAX_TITLE, nextStatus, validateBook } from './books.js';
          // and inside describe('validateBook', ...):
          it('refuses a very long title', () => {
          	const result = validateBook('x'.repeat(MAX_TITLE + 1), 'Someone');
          	expect(result).toEqual({
          		ok: false,
