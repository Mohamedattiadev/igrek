      - file: src/lib/server/auth.ts
        lang: ts
        text: |
          import { createHmac, timingSafeEqual } from 'node:crypto';
          import { EDIT_PASSWORD } from '$app/env/private';

          export const COOKIE = 'editor';

          function sign(text: string) {
          	return createHmac('sha256', EDIT_PASSWORD).update(text).digest();
          }

          /** The value of the cookie that proves someone typed the password. */
          export function sessionToken() {
          	return sign('reading-list-editor').toString('hex');
          }

          export function passwordIsRight(input: unknown) {
          	if (typeof input !== 'string') return false;
          	// Compare fixed-length digests in constant time, so the timing leaks nothing
          	return timingSafeEqual(sign(input), sign(EDIT_PASSWORD));
          }

          export function isEditor(cookie: string | undefined) {
          	if (!cookie) return false;
          	const a = Buffer.from(cookie);
          	const b = Buffer.from(sessionToken());
          	return a.length === b.length && timingSafeEqual(a, b);
          }
      - file: src/hooks.server.ts
        lang: ts
        text: |
          import type { Handle, ServerInit } from '@sveltejs/kit/hooks';
          import { db } from '#lib/server/db.js';
          import { COOKIE, isEditor } from '#lib/server/auth.js';
          import { migrate } from '#lib/server/store.js';

          export const init: ServerInit = async () => {
          	await migrate(db);
          };

          export const handle: Handle = async ({ event, resolve }) => {
          	event.locals.canEdit = isEditor(event.cookies.get(COOKIE));

          	const response = await resolve(event);
          	response.headers.set('X-Content-Type-Options', 'nosniff');
          	response.headers.set('Referrer-Policy', 'strict-origin-when-cross-origin');
          	return response;
          };
