    mistakes:
      - problem:
          en: "Hiding the Delete button from visitors and thinking the app is protected."
          tr: "Delete düğmesini ziyaretçilerden gizleyip uygulamanın korunduğunu sanmak."
        fix:
          en: "Anyone can send a POST by hand. The check that matters is `if (!locals.canEdit)` inside every action, on the server."
          tr: "Herkes elle POST gönderebilir. Önemli olan kontrol, sunucuda her action'ın içindeki `if (!locals.canEdit)`'tir."
      - problem:
          en: "Putting the password or a token in the code, in `.env.example` or in a commit."
          tr: "Parolayı ya da bir token'ı koda, `.env.example`'a ya da bir commit'e koymak."
        fix:
          en: "Real values only in `.env` and in the host's settings. If a secret was committed, change it now: deleting the file later does not remove it from the history."
          tr: "Gerçek değerler sadece `.env`'de ve host'un ayarlarında. Bir secret commit'lendiyse hemen değiştir: dosyayı sonradan silmek onu geçmişten kaldırmaz."
      - problem:
          en: "Using `{@html}` to show a book title, because a title with `<b>` looked wrong."
          tr: "İçinde `<b>` olan bir başlık yanlış göründüğü için kitap başlığını `{@html}` ile göstermek."
        fix:
          en: "Keep `{book.title}`. Svelte shows the text as text, so a title like `<script>` is harmless. `{@html}` with visitor input opens the page to XSS."
          tr: "`{book.title}`'ı koru. Svelte metni metin olarak gösterir; `<script>` gibi bir başlık zararsızdır. Ziyaretçi girdisiyle `{@html}` sayfayı XSS'e açar."
    quiz:
      - q:
          en: "Where must the check that decides who may delete a book be?"
          tr: "Kimin kitap silebileceğine karar veren kontrol nerede olmalı?"
        options:
          en:
            - Only in the Svelte component that shows the button
            - In the server action, on every request
            - In the CSS
          tr:
            - Sadece düğmeyi gösteren Svelte component'inde
            - Sunucudaki action'da, her istekte
            - CSS'te
        answer: 1
        why:
          en: "The browser is under the visitor's control. Only code that runs on your server can enforce a rule."
          tr: "Tarayıcı ziyaretçinin kontrolündedir. Bir kuralı sadece senin sunucunda çalışan kod uygulatabilir."
      - q:
          en: "What does an httpOnly cookie protect against?"
          tr: "httpOnly cookie neye karşı korur?"
        options:
          en:
            - JavaScript on the page reading the cookie
            - Forgetting the password
            - Slow pages
          tr:
            - Sayfadaki JavaScript'in cookie'yi okumasına
            - Parolanın unutulmasına
            - Yavaş sayfalara
        answer: 0
        why:
          en: "The browser hides httpOnly cookies from scripts, so an XSS bug cannot simply copy the session."
          tr: "Tarayıcı httpOnly cookie'leri script'lerden saklar; böylece bir XSS açığı oturumu öylece kopyalayamaz."
    sources:
      - title: SvelteKit, hooks (handle)
        url: https://svelte.dev/docs/kit/hooks
      - title: SvelteKit, configuration (csp and csrf)
        url: https://svelte.dev/docs/kit/@sveltejs-kit-vite
      - title: MDN, Content Security Policy
        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP

  - id: performance
    stage: performance
    title:
      en: "Performance: prerender, indexes and measuring"
      tr: "Performans: prerender, index'ler ve ölçme"
    minutes: 45
    needs: [security]
    why:
      en: "A fast page keeps visitors, and fast pages cost a free server less work. The biggest wins are cheap: do work once at build time instead of on every visit, make the database find rows without reading all of them, and measure before you guess."
      tr: "Hızlı sayfa ziyaretçiyi tutar, hızlı sayfalar da ücretsiz bir sunucuya daha az iş yükler. En büyük kazançlar ucuzdur: işi her ziyarette değil build sırasında bir kez yap, veritabanının tüm satırları okumadan satır bulmasını sağla ve tahmin etmeden önce ölç."
    learn:
      en: |
        - `export const prerender = true` makes a page static HTML built once, which is perfect for pages that are the same for everybody (like About)
        - SvelteKit already splits code per page, adds hashed file names for long caching and, with `adapter-node`, ships compressed (`.br`, `.gz`) copies of the assets
        - `data-sveltekit-preload-data="hover"` (already in `src/app.html`) starts loading a page when the pointer is over its link
        - An index lets SQLite jump to rows with a given value instead of scanning the whole table. On Turso's free plan reads are also counted, so fewer rows read is more headroom
        - `LIMIT` stops a list from growing without end
        - Measure: Lighthouse in Chrome DevTools, and the sizes `npm run build` prints
      tr: |
        - `export const prerender = true` sayfayı build sırasında bir kez üretilen statik HTML yapar; herkes için aynı olan sayfalara (About gibi) birebirdir
        - SvelteKit kodu zaten sayfa sayfa böler, uzun süre cache'lenebilsin diye hash'li dosya adları ekler ve `adapter-node` ile asset'lerin sıkıştırılmış (`.br`, `.gz`) kopyalarını da sunar
        - `data-sveltekit-preload-data="hover"` (zaten `src/app.html` içinde) fare link'in üstüne gelince sayfayı yüklemeye başlar
        - Index, SQLite'ın tüm tabloyu taramak yerine belirli değere sahip satırlara atlamasını sağlar. Turso'nun ücretsiz planında okumalar sayılır da; daha az satır okumak daha çok pay demektir
        - `LIMIT` bir listenin sonsuza kadar büyümesini engeller
        - Ölç: Chrome DevTools'ta Lighthouse ve `npm run build`'in yazdığı boyutlar
    do:
      en: |
        1. Create `src/routes/about/+page.ts` with the one line below. The About page is now built as a file at build time.
        2. In `src/lib/server/store.ts` add the index line to `migrate` (right after the `CREATE TABLE`), and add `LIMIT 100` to the query in `listBooks`.
        3. Build and look: `npm run build`. The output lists the client files with their sizes (a few kilobytes each). In the `build` folder find `prerendered/about.html`.
        4. Measure the page's weight: start `node --env-file=.env build` and run the `curl` command below. It prints the bytes sent when the browser asks for compressed content. Stop the server with Ctrl+C.
        5. Run Lighthouse: open the app (`npm run preview`) in Chrome, open DevTools, the *Lighthouse* tab, choose *Navigation* and run it. Read the scores for Performance, Accessibility and Best Practices and the list of suggestions. A page this small should score high; the value is learning to read the report.
        6. Run `npm test` and commit: `git add .` and `git commit -m "Prerender, index and limit"`.
      tr: |
        1. Aşağıdaki tek satırla `src/routes/about/+page.ts` oluştur. About sayfası artık build sırasında bir dosya olarak üretilir.
        2. `src/lib/server/store.ts` içinde `migrate`'e index satırını ekle (`CREATE TABLE`'ın hemen sonrasına) ve `listBooks`'taki sorguya `LIMIT 100` ekle.
        3. Build edip bak: `npm run build`. Çıktı istemci dosyalarını boyutlarıyla listeler (her biri birkaç kilobayt). `build` klasöründe `prerendered/about.html`'i bul.
        4. Sayfanın ağırlığını ölç: `node --env-file=.env build` başlat ve aşağıdaki `curl` komutunu çalıştır. Tarayıcı sıkıştırılmış içerik isteyince gönderilen bayt sayısını yazar. Sunucuyu Ctrl+C ile durdur.
        5. Lighthouse çalıştır: uygulamayı (`npm run preview`) Chrome'da aç, DevTools'u, *Lighthouse* sekmesini aç, *Navigation*'ı seç ve çalıştır. Performance, Accessibility ve Best Practices puanlarını ve öneri listesini oku. Bu kadar küçük bir sayfa yüksek puan almalı; asıl değer raporu okumayı öğrenmek.
        6. `npm test` çalıştır ve commit'le: `git add .` ve `git commit -m "Prerender, index and limit"`.
    code:
      - file: src/routes/about/+page.ts
        lang: ts
        text: |
          export const prerender = true;
      - file: src/lib/server/store.ts
        lang: ts
        text: |
          // in migrate(), right after the CREATE TABLE statement
          await db.execute('CREATE INDEX IF NOT EXISTS books_status ON books (status)');

          // in listBooks(), the query becomes
          const { rows } = await db.execute(
          	'SELECT id, title, author, status FROM books ORDER BY id DESC LIMIT 100'
          );
      - file: terminal
        lang: sh
        text: |
          curl -s -H 'accept-encoding: br' -o /dev/null -w '%{size_download} bytes\n' http://localhost:3000/
    mistakes:
      - problem:
          en: "Prerendering a page that shows different content per visitor, like the home page with the owner's buttons."
          tr: "Ziyaretçiye göre farklı içerik gösteren bir sayfayı prerender etmek, örneğin sahibinin düğmelerini gösteren ana sayfa."
        fix:
          en: "Prerender only pages that are the same for everyone. The home page reads the cookie and the database on each request, so it stays dynamic."
          tr: "Sadece herkes için aynı olan sayfaları prerender et. Ana sayfa her istekte cookie'yi ve veritabanını okur; bu yüzden dinamik kalır."
      - problem:
          en: "Optimizing without measuring, for example rewriting components to save a few bytes."
          tr: "Ölçmeden optimize etmek, örneğin birkaç bayt kazanmak için component'leri yeniden yazmak."
        fix:
          en: "Run Lighthouse first and fix what the report says matters most. Often it is an image or a slow query, not the framework."
          tr: "Önce Lighthouse çalıştır ve raporun en önemli dediğini düzelt. Çoğu zaman sorun framework değil, bir görsel ya da yavaş bir sorgudur."
    quiz:
      - q:
          en: "Which page is a good candidate for `prerender = true`?"
          tr: "Hangi sayfa `prerender = true` için iyi bir adaydır?"
        options:
          en:
            - A page that shows the logged-in user's private data
            - The About page, the same for everyone
            - The page that handles a form post
          tr:
            - Giriş yapmış kullanıcının özel verisini gösteren sayfa
            - Herkes için aynı olan About sayfası
            - Form gönderimini işleyen sayfa
        answer: 1
        why:
          en: "Prerendering saves one HTML file at build time, so it only fits pages whose content never depends on the visitor."
          tr: "Prerender, build sırasında tek bir HTML dosyası kaydeder; bu yüzden sadece içeriği ziyaretçiye hiç bağlı olmayan sayfalara uyar."
    sources:
      - title: SvelteKit, page options (prerender)
        url: https://svelte.dev/docs/kit/page-options
      - title: SvelteKit, performance
        url: https://svelte.dev/docs/kit/performance
      - title: SQLite, CREATE INDEX
        url: https://www.sqlite.org/lang_createindex.html

  - id: build
    stage: packaging
    title:
      en: "Choose an adapter and build for production"
      tr: "Adapter seçme ve production için build"
    minutes: 30
    needs: [performance]
    why:
      en: "`npm run dev` is for you. A host needs a built, optimized app it can start with one command. The adapter decides what that build looks like, so the choice depends on where the app will run."
      tr: "`npm run dev` senin için. Bir host'un tek komutla başlatabileceği, build edilmiş ve optimize edilmiş bir uygulamaya ihtiyacı var. Build'in neye benzeyeceğine adapter karar verir; yani seçim uygulamanın nerede çalışacağına bağlıdır."
    learn:
      en: |
        - **`adapter-node`**: a plain Node server (`node build`). Works on any host that runs Node: Render, Railway, Fly.io, a VPS, Docker. Our choice, because the app has server code (actions and a database)
        - **`adapter-static`**: only files, for hosts like GitHub Pages. It cannot run form actions or server `load`, so it does not fit this app. It is right for a fully static site
        - **`adapter-vercel`**, **`adapter-netlify`**, **`adapter-cloudflare`**: bundles for those platforms; `adapter-auto` picks one by itself when it detects one of them, which is why it is a poor fit for a server you run yourself
        - In production `.env` is not read automatically: run `node --env-file=.env build`, or set real environment variables on the host
        - The server listens on `PORT` (default 3000) and `HOST` (default 0.0.0.0)
        - `adapter-node` assumes https unless told otherwise. Over plain http, form posts are refused as "cross-site". In SvelteKit 3 the old `ORIGIN` variable of the server is gone: the public address is the `paths.origin` option, which you can fill from an environment variable in `vite.config.ts`. It is read at build time, so set it when you run `npm run build`
      tr: |
        - **`adapter-node`**: düz bir Node sunucusu (`node build`). Node çalıştıran her host'ta çalışır: Render, Railway, Fly.io, bir VPS, Docker. Bizim seçimimiz, çünkü uygulamanın sunucu kodu (action'lar ve veritabanı) var
        - **`adapter-static`**: sadece dosyalar, GitHub Pages gibi host'lar için. Form action'larını ya da sunucu `load`'unu çalıştıramaz; bu yüzden bu uygulamaya uymaz. Tamamen statik bir site için doğrusudur
        - **`adapter-vercel`**, **`adapter-netlify`**, **`adapter-cloudflare`**: o platformlar için paketler; `adapter-auto` bunlardan birini algılarsa kendisi seçer, bu yüzden kendi çalıştırdığın bir sunucu için zayıf bir seçimdir
        - Production'da `.env` otomatik okunmaz: `node --env-file=.env build` çalıştır ya da host'ta gerçek ortam değişkenleri ayarla
        - Sunucu `PORT` (varsayılan 3000) ve `HOST` (varsayılan 0.0.0.0) üzerinde dinler
        - `adapter-node` aksi söylenmedikçe https varsayar. Düz http üzerinde form gönderimleri "cross-site" diye reddedilir. SvelteKit 3'te sunucunun eski `ORIGIN` değişkeni yok: herkese açık adres `paths.origin` seçeneğidir ve onu `vite.config.ts` içinde bir ortam değişkeninden doldurabilirsin. Build sırasında okunur; bu yüzden `npm run build` çalıştırırken ayarla
    do:
      en: |
        1. Check that `vite.config.ts` uses `adapter-node` (the template put it there). Open `.gitignore` and see that `/build` and `.svelte-kit` are listed: build output is never committed.
        2. Run the three checks that every deploy should pass: `npm run check`, `npm test` and `npm run build`.
        3. Start the built app: `node --env-file=.env build`. Open http://localhost:3000. The pages load, the books are there. Stop it with Ctrl+C.
        4. Try another port: `PORT=4000 node --env-file=.env build`. (Windows PowerShell: set `$env:PORT=4000` on its own line first.)
        5. See the https assumption: while `node build` runs, try to log in on http://localhost:3000. The browser shows "Cross-site POST form submissions are forbidden". Stop the server. In `vite.config.ts` add `paths: { origin: process.env.ORIGIN }` to the `sveltekit()` options (snippet below), rebuild with `ORIGIN=http://localhost:3000 npm run build` (Windows PowerShell: `$env:ORIGIN="http://localhost:3000"` on its own line first) and start `node --env-file=.env build` again. Logging in works now. On a real host you do not need this: it serves https and passes the `Host` header, so the address is worked out by itself. Setting `ORIGIN` to the real URL is only the fix when a proxy hides it.
        6. Commit: `git add .` and `git commit -m "Production build"`.
      tr: |
        1. `vite.config.ts`'in `adapter-node` kullandığını kontrol et (şablon onu koydu). `.gitignore`'u aç ve `/build` ile `.svelte-kit`'in listede olduğunu gör: build çıktısı asla commit'lenmez.
        2. Her deploy'un geçmesi gereken üç kontrolü çalıştır: `npm run check`, `npm test` ve `npm run build`.
        3. Build edilen uygulamayı başlat: `node --env-file=.env build`. http://localhost:3000 adresini aç. Sayfalar yüklenir, kitaplar orada. Ctrl+C ile durdur.
        4. Başka bir port dene: `PORT=4000 node --env-file=.env build`. (Windows PowerShell: önce ayrı bir satırda `$env:PORT=4000` yaz.)
        5. https varsayımını gör: `node build` çalışırken http://localhost:3000 adresinde giriş yapmayı dene. Tarayıcı "Cross-site POST form submissions are forbidden" gösterir. Sunucuyu durdur. `vite.config.ts` içinde `sveltekit()` seçeneklerine `paths: { origin: process.env.ORIGIN }` ekle (aşağıdaki kod), `ORIGIN=http://localhost:3000 npm run build` ile yeniden build et (Windows PowerShell: önce ayrı satırda `$env:ORIGIN="http://localhost:3000"`) ve `node --env-file=.env build`'i yeniden başlat. Artık giriş çalışır. Gerçek bir host'ta buna gerek yok: https sunar ve `Host` header'ını iletir; adres kendiliğinden çıkarılır. `ORIGIN`'i gerçek URL'ye ayarlamak sadece bir proxy onu saklıyorsa çözümdür.
        6. Commit'le: `git add .` ve `git commit -m "Production build"`.
    code:
      - file: terminal
        lang: sh
        text: |
          npm run check
          npm test
          npm run build
          node --env-file=.env build
      - file: vite.config.ts
        lang: ts
        text: |
          // the adapter lives in the sveltekit() options
          import adapter from '@sveltejs/adapter-node';

          sveltekit({
          	adapter: adapter(),
          	// the public address, used for the form (CSRF) check; read at build time
          	paths: { origin: process.env.ORIGIN }
          	// ...
          });
    mistakes:
      - problem:
          en: "`node build` starts and then stops with \"env_invalid\" and EDIT_PASSWORD."
          tr: "`node build` başlıyor ve sonra \"env_invalid\" ve EDIT_PASSWORD ile duruyor."
        fix:
          en: "The built server does not read `.env` by itself. Start it with `node --env-file=.env build`, or set `EDIT_PASSWORD` in the environment."
          tr: "Build edilen sunucu `.env`'i kendiliğinden okumaz. `node --env-file=.env build` ile başlat ya da ortamda `EDIT_PASSWORD` ayarla."
      - problem:
          en: "\"Cross-site POST form submissions are forbidden\" on a live site."
          tr: "Canlı sitede \"Cross-site POST form submissions are forbidden\"."
        fix:
          en: "The server could not work out the public address. Render passes the `Host` header and serves https, so it normally works. If a proxy hides the real host, or you run over http, set `paths.origin` (the `ORIGIN` line in `vite.config.ts`) and set the `ORIGIN` environment variable to the exact public URL, for example `https://reading-list-abc.onrender.com`, on Render too. It is read at build time, so redeploy after adding it. The server's own `ORIGIN` variable of older SvelteKit versions no longer does anything."
          tr: "Sunucu herkese açık adresi çıkaramadı. Render `Host` header'ını iletir ve https sunar; bu yüzden normalde çalışır. Bir proxy gerçek host'u saklıyorsa ya da http üzerinde çalışıyorsan `paths.origin`'i (`vite.config.ts` içindeki `ORIGIN` satırı) ayarla ve `ORIGIN` ortam değişkenini tam herkese açık URL'ye ayarla, örneğin `https://reading-list-abc.onrender.com`; Render'da da. Build sırasında okunur; bu yüzden ekledikten sonra yeniden deploy et. Eski SvelteKit sürümlerindeki sunucunun kendi `ORIGIN` değişkeni artık bir şey yapmaz."
      - problem:
          en: "Choosing `adapter-static` for an app with forms and a database."
          tr: "Form'ları ve veritabanı olan bir uygulama için `adapter-static` seçmek."
        fix:
          en: "Static files cannot run server code. Use `adapter-node` (or a platform adapter) for apps with actions and databases."
          tr: "Statik dosyalar sunucu kodu çalıştıramaz. Action'ları ve veritabanı olan uygulamalar için `adapter-node` (ya da bir platform adapter'ı) kullan."
    quiz:
      - q:
          en: "Which adapter fits an app that has form actions and a database, and runs on a host that offers Node.js?"
          tr: "Form action'ları ve veritabanı olan, Node.js sunan bir host'ta çalışan uygulamaya hangi adapter uyar?"
        options:
          en:
            - adapter-static
            - adapter-node
            - No adapter is needed
          tr:
            - adapter-static
            - adapter-node
            - Adapter gerekmez
        answer: 1
        why:
          en: "adapter-node builds a server that runs your server code. adapter-static only makes files."
          tr: "adapter-node, sunucu kodunu çalıştıran bir sunucu üretir. adapter-static sadece dosya üretir."
    sources:
      - title: SvelteKit, adapters
        url: https://svelte.dev/docs/kit/adapters
      - title: SvelteKit, adapter-node
        url: https://svelte.dev/docs/kit/adapter-node
      - title: SvelteKit, adapter-static
        url: https://svelte.dev/docs/kit/adapter-static

  - id: deploy
    stage: deploy
    title:
      en: "Deploy for free on Render with a Turso database"
      tr: "Turso veritabanıyla Render'da ücretsiz deploy"
    minutes: 90
    needs: [build]
    why:
      en: "Deploying puts your app on the internet. Render runs a Node web service on its free instance type. Its disk is thrown away whenever the service restarts, redeploys or sleeps, so a `local.db` file would lose your books. The live site therefore uses Turso, a free hosted SQLite that your code already speaks."
      tr: "Deploy uygulamanı internete koyar. Render, ücretsiz instance türünde bir Node web servisi çalıştırır. Disk servis yeniden başladığında, yeniden deploy edildiğinde ya da uyuduğunda atılır; bu yüzden bir `local.db` dosyası kitaplarını kaybederdi. Canlı site bu yüzden, kodunun zaten konuştuğu ücretsiz barındırılan bir SQLite olan Turso'yu kullanır."
    learn:
      en: |
        - Why a host with a throwaway disk needs a hosted database, and how the same code uses `file:local.db` on your computer and a `libsql://` address live (only `DATABASE_URL` changes)
        - Environment variables on the host: the secrets you put in `.env` locally go into Render's settings
        - The deploy flow: push to GitHub, Render builds (`npm ci && npm run build`) and starts (`node build`); every push to `main` deploys again
        - **Render free web services** (Render docs, "Deploy for Free"): they spin down after 15 minutes without traffic and take about a minute to start again; the filesystem is ephemeral; a workspace gets 750 free instance hours per month, and outbound bandwidth and build minutes are limited; Render says free instances are not for production use. Read the current page before you rely on it
        - **Turso free plan** (turso.tech/pricing): at the time of writing 100 databases, 5 GB of storage, 500 million rows read and 10 million rows written per month, no credit card. Plans change, so check the page
        - Other free-tier hosts work with the same `adapter-node` app or with their own adapter (for example Vercel, Netlify or Cloudflare); read their limits the same way
      tr: |
        - Atılan diskli bir host'un neden barındırılan bir veritabanına ihtiyaç duyduğu ve aynı kodun bilgisayarında `file:local.db`'yi, canlıda `libsql://` adresini nasıl kullandığı (sadece `DATABASE_URL` değişir)
        - Host üzerindeki ortam değişkenleri: yerelde `.env`'ye koyduğun secret'lar Render'ın ayarlarına girer
        - Deploy akışı: GitHub'a push et, Render build eder (`npm ci && npm run build`) ve başlatır (`node build`); `main`'e her push yeniden deploy eder
        - **Render ücretsiz web servisleri** (Render dokümanı, "Deploy for Free"): 15 dakika trafik almazsa uyurlar ve yeniden başlamaları yaklaşık bir dakika sürer; dosya sistemi geçicidir; bir workspace aylık 750 ücretsiz instance saati alır, giden bant genişliği ve build dakikaları sınırlıdır; Render ücretsiz instance'ların production için olmadığını söyler. Güvenmeden önce güncel sayfayı oku
        - **Turso ücretsiz plan** (turso.tech/pricing): yazıldığı sırada 100 veritabanı, 5 GB depolama, ayda 500 milyon satır okuma ve 10 milyon satır yazma, kredi kartı yok. Planlar değişir; sayfaya bak
        - Diğer ücretsiz katmanlı host'lar aynı `adapter-node` uygulamasıyla ya da kendi adapter'larıyla çalışır (örneğin Vercel, Netlify veya Cloudflare); limitlerini aynı şekilde oku
    do:
      en: |
        1. Put the code on GitHub. On github.com create a new empty repository named `reading-list` (private is fine), then run the commands the page shows, like the first block below. Check that `.env` and `local.db` were not committed.
        2. Install the Turso CLI (macOS: `brew install tursodatabase/tap/turso`; Linux and WSL: the `curl` line below), sign up, and create a database. Run the commands in the second block. Copy the address (`libsql://...`) and the token somewhere safe.
        3. Sign up at render.com with your GitHub account. Choose *New → Web Service* and connect the `reading-list` repository.
        4. Fill in the form: *Language* Node, *Build Command* `npm ci && npm run build`, *Start Command* `node build`, *Instance Type* **Free**.
        5. Add four environment variables: `DATABASE_URL` (the libsql address), `DATABASE_AUTH_TOKEN` (the token), `EDIT_PASSWORD` (a new, long password; do not reuse the local one) and `NODE_VERSION` set to `24`. Press *Deploy Web Service* and wait for the log to say the service is live.
        6. Open the `onrender.com` address Render shows. The first request after a sleep takes about a minute. The three starter books appear, because the app created the table in Turso when it started. Log in, add a book, change its status, delete it.
        7. From now on, `git push` to `main` deploys a new version by itself. Test it: change the About text, commit, push and watch the deploy.
      tr: |
        1. Kodu GitHub'a koy. github.com'da `reading-list` adında yeni boş bir repository oluştur (private olabilir), sonra sayfanın gösterdiği komutları çalıştır; aşağıdaki ilk blok gibi. `.env` ve `local.db`'nin commit'lenmediğini kontrol et.
        2. Turso CLI'ı kur (macOS: `brew install tursodatabase/tap/turso`; Linux ve WSL: aşağıdaki `curl` satırı), kayıt ol ve bir veritabanı oluştur. İkinci bloktaki komutları çalıştır. Adresi (`libsql://...`) ve token'ı güvenli bir yere kopyala.
        3. render.com'a GitHub hesabınla kayıt ol. *New → Web Service* seç ve `reading-list` repository'sini bağla.
        4. Formu doldur: *Language* Node, *Build Command* `npm ci && npm run build`, *Start Command* `node build`, *Instance Type* **Free**.
        5. Dört ortam değişkeni ekle: `DATABASE_URL` (libsql adresi), `DATABASE_AUTH_TOKEN` (token), `EDIT_PASSWORD` (yeni, uzun bir parola; yereldekini kullanma) ve `24` değerli `NODE_VERSION`. *Deploy Web Service*'e bas ve log servisin canlı olduğunu söyleyene kadar bekle.
        6. Render'ın gösterdiği `onrender.com` adresini aç. Uykudan sonraki ilk istek yaklaşık bir dakika sürer. Üç başlangıç kitabı görünür; çünkü uygulama başlarken Turso'da tabloyu oluşturdu. Giriş yap, kitap ekle, durumunu değiştir, sil.
        7. Bundan sonra `main`'e her `git push` yeni bir sürümü kendiliğinden deploy eder. Dene: About metnini değiştir, commit'le, push et ve deploy'u izle.
    code:
      - file: terminal
        lang: sh
        text: |
          git remote add origin https://github.com/YOUR-NAME/reading-list.git
          git branch -M main
          git push -u origin main
      - file: terminal
        lang: sh
        text: |
          curl -sSfL https://get.tur.so/install.sh | bash
          turso auth signup
          turso db create reading-list
          turso db show reading-list --url
          turso db tokens create reading-list
      - file: terminal
        lang: sh
        text: |
          # Render settings, as typed in the form
          # Build Command:  npm ci && npm run build
          # Start Command:  node build
          # Environment:    DATABASE_URL, DATABASE_AUTH_TOKEN, EDIT_PASSWORD, NODE_VERSION=24
    mistakes:
      - problem:
          en: "The first visit after a quiet period shows a loading page for about a minute."
          tr: "Sessiz bir dönemden sonraki ilk ziyaret yaklaşık bir dakika boyunca bir yükleniyor sayfası gösteriyor."
        fix:
          en: "That is the free instance waking up. It is the price of the free tier. A health check from an uptime service keeps it awake but also uses your 750 monthly hours, so decide on purpose."
          tr: "Bu, ücretsiz instance'ın uyanmasıdır. Ücretsiz katmanın bedelidir. Bir uptime servisinin sağlık kontrolü onu uyanık tutar ama aylık 750 saatini de harcar; bilerek karar ver."
      - problem:
          en: "The deploy fails with \"env_invalid\" or the app crashes at start."
          tr: "Deploy \"env_invalid\" ile başarısız oluyor ya da uygulama başlarken çöküyor."
        fix:
          en: "Check the variable names and values in Render's *Environment* tab: `EDIT_PASSWORD` (at least 8 characters), `DATABASE_URL` starting with `libsql://` and the token without spaces or quotes."
          tr: "Render'ın *Environment* sekmesindeki değişken adlarını ve değerlerini kontrol et: `EDIT_PASSWORD` (en az 8 karakter), `libsql://` ile başlayan `DATABASE_URL` ve boşluk ya da tırnak içermeyen token."
      - problem:
          en: "Pasting the real token or password into a file that is committed."
          tr: "Gerçek token'ı ya da parolayı commit'lenen bir dosyaya yapıştırmak."
        fix:
          en: "Keep them only in `.env` (ignored by Git) and in Render's settings. If one leaks, create a new token (`turso db tokens create reading-list`) or a new password and update Render."
          tr: "Onları sadece `.env`'de (Git yok sayar) ve Render ayarlarında tut. Biri sızarsa yeni bir token (`turso db tokens create reading-list`) ya da yeni bir parola üret ve Render'ı güncelle."
    quiz:
      - q:
          en: "Why does the live site use Turso instead of the local.db file?"
          tr: "Canlı site neden local.db dosyası yerine Turso kullanıyor?"
        options:
          en:
            - SQLite is not allowed on the internet
            - A free Render instance loses its files when it restarts, redeploys or sleeps
            - Render blocks all databases
          tr:
            - SQLite internette yasak
            - Ücretsiz bir Render instance'ı yeniden başladığında, yeniden deploy edildiğinde ya da uyuduğunda dosyalarını kaybeder
            - Render bütün veritabanlarını engeller
        answer: 1
        why:
          en: "The filesystem of a free web service is ephemeral, so data must live in a database outside it, such as Turso."
          tr: "Ücretsiz bir web servisinin dosya sistemi geçicidir; bu yüzden veri Turso gibi onun dışındaki bir veritabanında durmalı."
    sources:
      - title: Render, deploy for free
        url: https://render.com/docs/free
      - title: Render, setting your Node.js version
        url: https://render.com/docs/node-version
      - title: Turso, pricing
        url: https://turso.tech/pricing

  - id: monitoring
    stage: monitoring
    title:
      en: "Error pages, logs and a health check"
      tr: "Hata sayfaları, log'lar ve bir sağlık kontrolü"
    minutes: 45
    needs: [deploy]
    why:
      en: "Once real people use the site you cannot see their screens. An error page shows a friendly message instead of a blank page, the error hook writes every unexpected server error to the logs, and a health check lets a free monitor tell you when the site or the database is down."
      tr: "Gerçek insanlar siteyi kullanmaya başlayınca onların ekranını göremezsin. Hata sayfası boş sayfa yerine dostça bir mesaj gösterir, error hook'u her beklenmeyen sunucu hatasını log'a yazar, sağlık kontrolü de site ya da veritabanı çöktüğünde ücretsiz bir izleyicinin sana haber vermesini sağlar."
    learn:
      en: |
        - `+error.svelte` is the page shown for errors in that route and below; `page.status` and `page.error` from `$app/state` hold the details
        - The server `handleError` hook in `hooks.server.ts` receives every error; its `kind` tells where it came from (`app`, `framework` such as a 404, `unknown` for bugs). In SvelteKit 3 it also receives the expected ones, so log only `unknown`. Whatever it returns is what visitors may see: never send the real message or stack trace
        - An `errorId` in the log line and on the error page lets you find the log of a problem a visitor reports
        - One JSON line per event with `console.error` makes logs searchable; on Render they appear in the service's *Logs* tab
        - A `/health` endpoint that really asks the database answers 200 only when the app works; Render can use it as its health check, and an uptime service (UptimeRobot and similar have free plans) can call it every few minutes and email you when it fails
        - Keep dependencies current: `npm outdated`, then update, test and deploy
      tr: |
        - `+error.svelte` o route'ta ve altında hata olunca gösterilen sayfadır; `$app/state` içindeki `page.status` ve `page.error` ayrıntıları taşır
        - `hooks.server.ts` içindeki sunucu `handleError` hook'u her hatayı alır; `kind` hatanın nereden geldiğini söyler (`app`, 404 gibi `framework`, hatalar için `unknown`). SvelteKit 3'te beklenen hataları da alır; bu yüzden sadece `unknown`'ı logla. Döndürdüğü şeyi ziyaretçiler görebilir: gerçek mesajı ya da stack trace'i asla gönderme
        - Log satırında ve hata sayfasında bir `errorId` olması, bir ziyaretçinin bildirdiği sorunun log'unu bulmanı sağlar
        - `console.error` ile olay başına bir JSON satırı yazmak log'ları aranabilir yapar; Render'da servisin *Logs* sekmesinde görünür
        - Veritabanına gerçekten soran bir `/health` endpoint'i sadece uygulama çalışıyorsa 200 döner; Render onu sağlık kontrolü olarak kullanabilir, bir uptime servisi (UptimeRobot ve benzerlerinin ücretsiz planı var) onu birkaç dakikada bir çağırıp bozulunca sana e-posta atabilir
        - Bağımlılıkları güncel tut: `npm outdated`, sonra güncelle, test et ve deploy et
    do:
      en: |
        1. Replace `src/app.d.ts` so the error object can carry an `errorId`.
        2. Replace `src/hooks.server.ts`: it keeps `init` and `handle` and gets `handleError`.
        3. Create `src/routes/+error.svelte`.
        4. Create `src/routes/health/+server.ts`.
        5. Locally, run `npm run dev` and open http://localhost:5173/nope: the friendly 404 page appears and the terminal shows no error log (a 404 is not an incident). Open http://localhost:5173/health: it answers `{"ok":true}`.
        6. Run `npm run check`, `npm test`, commit and push: `git add .`, `git commit -m "Error page, logs and health check"`, `git push`. Wait for Render to deploy.
        7. In Render open the service's *Logs* tab and watch the lines of the deploy and of the server. Open `/health` on the live address.
        8. In Render's *Settings* set *Health Check Path* to `/health`. Render then calls it regularly and restarts an instance that does not answer.
        9. Optional: create a free account at an uptime service such as UptimeRobot, add an HTTP monitor for `https://YOUR-SERVICE.onrender.com/health` every 5 minutes and set e-mail alerts. Remember that keeping a free Render instance awake uses its 750 monthly hours.
      tr: |
        1. Hata objesi bir `errorId` taşıyabilsin diye `src/app.d.ts` dosyasını değiştir.
        2. `src/hooks.server.ts` dosyasını değiştir: `init` ve `handle`'ı korur, `handleError`'ı alır.
        3. `src/routes/+error.svelte` oluştur.
        4. `src/routes/health/+server.ts` oluştur.
        5. Yerelde `npm run dev` çalıştır ve http://localhost:5173/nope adresini aç: dostça 404 sayfası görünür ve terminal hata log'u göstermez (404 bir olay değildir). http://localhost:5173/health adresini aç: `{"ok":true}` cevap verir.
        6. `npm run check`, `npm test` çalıştır, commit'le ve push et: `git add .`, `git commit -m "Error page, logs and health check"`, `git push`. Render'ın deploy etmesini bekle.
        7. Render'da servisin *Logs* sekmesini aç ve deploy'un ve sunucunun satırlarını izle. Canlı adreste `/health`'i aç.
        8. Render'ın *Settings* kısmında *Health Check Path*'i `/health` yap. Render onu düzenli çağırır ve cevap vermeyen instance'ı yeniden başlatır.
        9. İsteğe bağlı: UptimeRobot gibi bir uptime servisinde ücretsiz hesap aç, `https://SENIN-SERVISIN.onrender.com/health` için 5 dakikada bir çalışan bir HTTP monitor ekle ve e-posta uyarılarını aç. Ücretsiz bir Render instance'ını uyanık tutmanın aylık 750 saatini harcadığını unutma.
    code:
      - file: src/app.d.ts
        lang: ts
        text: |
          // See https://svelte.dev/docs/kit/types#app.d.ts
          // for information about these interfaces
          declare global {
          	namespace App {
          		interface Error {
          			errorId?: string;
          		}
          		interface Locals {
          			canEdit: boolean;
          		}
          	}
          }

          export {};
      - file: src/hooks.server.ts
        lang: ts
        text: |
          import type { Handle, HandleServerError, ServerInit } from '@sveltejs/kit/hooks';
          import { db } from '#lib/server/db.js';
          import { COOKIE, isEditor } from '#lib/server/auth.js';
          import { migrate } from '#lib/server/store.js';

          export const init: ServerInit = async () => {
          	await migrate(db);
          };

          export const handle: Handle = async ({ event, resolve }) => {
          	event.locals.canEdit = isEditor(event.cookies.get(COOKIE));

          	const response = await resolve(event);
          	response.headers.set('X-Content-Type-Options', 'nosniff');
          	response.headers.set('Referrer-Policy', 'strict-origin-when-cross-origin');
          	return response;
          };

          export const handleError: HandleServerError = ({ kind, error, event }) => {
          	const errorId = crypto.randomUUID();

          	// A missing page (404) is not an incident. Log only unexpected failures, as one JSON line each.
          	if (kind === 'unknown') {
          		console.error(
          			JSON.stringify({
          				level: 'error',
          				errorId,
          				kind,
          				method: event.request.method,
          				path: event.url.pathname,
          				message: error instanceof Error ? error.message : String(error)
          			})
          		);
          	}

          	return { errorId };
          };
      - file: src/routes/+error.svelte
        lang: svelte
        text: |
          <script lang="ts">
          	import { page } from '$app/state';
          </script>

          <svelte:head>
          	<title>{page.status} - Reading list</title>
          </svelte:head>

          <h1>{page.status}</h1>
          <p>{page.error?.message}</p>
          {#if page.error?.errorId}
          	<p>Quote this code if you report the problem: <code>{page.error.errorId}</code></p>
          {/if}
          <p><a href="/">Back to the list</a></p>
      - file: src/routes/health/+server.ts
        lang: ts
        text: |
          import { db } from '#lib/server/db.js';
          import type { RequestHandler } from './$types';

          export const GET: RequestHandler = async () => {
          	try {
          		await db.execute('SELECT 1');
          		return Response.json({ ok: true });
          	} catch (error) {
          		console.error(JSON.stringify({ level: 'error', message: 'health check failed', error: String(error) }));
          		return Response.json({ ok: false }, { status: 503 });
          	}
          };
    mistakes:
      - problem:
          en: "Showing `error.message` or the stack trace of an unknown error to visitors."
          tr: "Bilinmeyen bir hatanın `error.message`'ını ya da stack trace'ini ziyaretçilere göstermek."
        fix:
          en: "It can contain table names, paths or secrets. Log the details on the server and return only a safe message and the `errorId`, as `handleError` does."
          tr: "Tablo adları, yollar ya da secret'lar içerebilir. Ayrıntıyı sunucuda logla ve `handleError`'ın yaptığı gibi sadece güvenli bir mesaj ve `errorId` döndür."
      - problem:
          en: "A health endpoint that always answers 200 without touching the database."
          tr: "Veritabanına hiç dokunmadan hep 200 cevap veren bir sağlık endpoint'i."
        fix:
          en: "Run a cheap query such as `SELECT 1` and answer 503 if it fails, so the monitor sees the real state."
          tr: "`SELECT 1` gibi ucuz bir sorgu çalıştır ve başarısız olursa 503 cevap ver; böylece izleyici gerçek durumu görür."
      - problem:
          en: "Logging every 404, so real errors drown in noise."
          tr: "Her 404'ü loglamak; gerçek hatalar gürültüde kaybolur."
        fix:
          en: "Log only `kind === 'unknown'` (bugs and failures). Missing pages are normal on the internet."
          tr: "Sadece `kind === 'unknown'` (hatalar ve arızalar) logla. Olmayan sayfalar internette normaldir."
    quiz:
      - q:
          en: "What should `handleError` return for an unexpected error?"
          tr: "Beklenmeyen bir hata için `handleError` ne döndürmeli?"
        options:
          en:
            - The full error message and the stack trace
            - A safe object, such as an errorId, while the details go to the log
            - Nothing, and never log
          tr:
            - Tam hata mesajı ve stack trace
            - Ayrıntı log'a giderken errorId gibi güvenli bir obje
            - Hiçbir şey ve asla loglama
        answer: 1
        why:
          en: "Visitors see what the hook returns, so it must be safe. The details belong in your logs, tied together by the errorId."
          tr: "Ziyaretçiler hook'un döndürdüğünü görür; bu yüzden güvenli olmalı. Ayrıntı log'larına aittir ve errorId ile bağlanır."
    sources:
      - title: SvelteKit, errors
        url: https://svelte.dev/docs/kit/errors
      - title: SvelteKit, hooks (handleError)
        url: https://svelte.dev/docs/kit/hooks
      - title: Render, health checks
        url: https://render.com/docs/health-checks

  - id: search-url
    stage: advanced
    title:
      en: "Filters in the URL and what to learn next"
      tr: "URL'deki filtreler ve sonra ne öğrenmeli"
    minutes: 45
    needs: [monitoring]
    why:
      en: "A filter that lives in the URL can be bookmarked, shared and works without JavaScript. It also moves the work to the database, which is where it belongs once the list grows. This is the SvelteKit way of thinking: the URL is state."
      tr: "URL'de yaşayan bir filtre yer imine eklenebilir, paylaşılabilir ve JavaScript olmadan çalışır. Ayrıca işi, liste büyüdükçe ait olduğu yere, veritabanına taşır. Bu SvelteKit'in düşünme biçimi: URL bir state'tir."
    learn:
      en: |
        - `url.searchParams` in `load` reads `?status=reading`; always check the value (`isStatus`) before using it
        - A normal `<a href="?status=done">` link changes the URL, and `load` runs again with the new value
        - SQL can filter and count: `WHERE (?1 IS NULL OR status = ?1)` and `GROUP BY status` use the index from the performance step
        - What to learn next: remote functions (an experimental SvelteKit feature for calling server code from components), end-to-end tests with Playwright (`npx sv add playwright`), passwords and sessions with a library such as Better Auth (`npx sv add better-auth`), and the Svelte documentation tutorial
      tr: |
        - `load` içindeki `url.searchParams` `?status=reading`'i okur; kullanmadan önce değeri her zaman kontrol et (`isStatus`)
        - Normal bir `<a href="?status=done">` link'i URL'yi değiştirir ve `load` yeni değerle yeniden çalışır
        - SQL süzebilir ve sayabilir: `WHERE (?1 IS NULL OR status = ?1)` ve `GROUP BY status` performans adımındaki index'i kullanır
        - Sonra ne öğrenmeli: remote function'lar (component'lerden sunucu kodu çağırmak için deneysel bir SvelteKit özelliği), Playwright ile uçtan uca testler (`npx sv add playwright`), Better Auth gibi bir kütüphaneyle parolalar ve oturumlar (`npx sv add better-auth`) ve Svelte dokümanındaki tutorial
    do:
      en: |
