  - id: security
    stage: security
    title:
      en: "Security: a password, validation, CSRF and headers"
      tr: "Güvenlik: parola, doğrulama, CSRF ve header'lar"
    minutes: 90
    needs: [tests]
    why:
      en: "The moment the app is on the internet, strangers can use every form. Right now anyone could delete all your books. In this step only the owner can change the list, long input is refused, and the browser gets instructions that make attacks harder."
      tr: "Uygulama internete çıktığı anda yabancılar her form'u kullanabilir. Şu an herkes bütün kitaplarını silebilir. Bu adımda listeyi sadece sahibi değiştirebilir, çok uzun girdi reddedilir ve tarayıcı saldırıları zorlaştıran talimatlar alır."
    learn:
      en: |
        - **Never trust input**: the server checks every value again (type, length, allowed set). Browser attributes like `maxlength` only help honest visitors
        - **Authentication with a cookie**: the login action checks a password and sets an `httpOnly` cookie (JavaScript cannot read it) with `sameSite: 'lax'`. SvelteKit sets `secure` for you on https
        - **`handle` hook**: runs for every request, here to turn the cookie into `event.locals.canEdit`. Every action then asks `locals.canEdit` itself; hiding a button is not security
        - **Constant-time comparison**: `timingSafeEqual` compares secrets without leaking, through timing, how many characters were right
        - **CSRF**: another site could try to post a form to yours while you are logged in. SvelteKit refuses cross-origin form posts in production by default (`csrf.trustedOrigins` lists exceptions)
        - **Content Security Policy (CSP)** limits where scripts may come from; SvelteKit adds the nonces it needs. **XSS**: Svelte escapes `{text}` for you, so avoid `{@html}` with anything a visitor typed
        - **Secrets** live in `.env` (ignored by Git) and in the host's settings, never in the code
      tr: |
        - **Girdiye asla güvenme**: sunucu her değeri yeniden kontrol eder (tip, uzunluk, izin verilen küme). `maxlength` gibi tarayıcı özellikleri sadece dürüst ziyaretçilere yardım eder
        - **Cookie ile kimlik doğrulama**: login action'ı parolayı kontrol eder ve `sameSite: 'lax'` ile bir `httpOnly` cookie koyar (JavaScript onu okuyamaz). `secure`'u https'te SvelteKit senin için ayarlar
        - **`handle` hook'u**: her istekte çalışır; burada cookie'yi `event.locals.canEdit`'e çevirmek için. Her action sonra `locals.canEdit`'i kendisi sorar; bir düğmeyi gizlemek güvenlik değildir
        - **Sabit zamanlı karşılaştırma**: `timingSafeEqual` secret'ları, kaç karakterin doğru olduğunu süre üzerinden sızdırmadan karşılaştırır
        - **CSRF**: sen giriş yapmışken başka bir site senin sitene bir form POST etmeye çalışabilir. SvelteKit production'da başka origin'den gelen form gönderimlerini varsayılan olarak reddeder (`csrf.trustedOrigins` istisnaları listeler)
        - **Content Security Policy (CSP)** script'lerin nereden gelebileceğini sınırlar; gereken nonce'ları SvelteKit ekler. **XSS**: Svelte `{text}`'i senin için escape eder; bu yüzden ziyaretçinin yazdığı bir şeyle `{@html}` kullanmaktan kaçın
        - **Secret'lar** `.env` içinde (Git yok sayar) ve host'un ayarlarında durur, asla kodda değil
    do:
      en: |
        1. Tighten validation in `src/lib/books.ts`: add the two length limits and use them in `validateBook` (replace the function and add the constants above `BookErrors`).
        2. Replace `src/env.ts`: add `EDIT_PASSWORD`. The app refuses to start without a password of at least 8 characters (while building it may be missing, hence `building`).
        3. Create `.env` with a password for yourself and `.env.example` as a template for others. `.env` is already ignored by Git; `.env.example` is meant to be committed and holds no real secret.
        4. Create `src/lib/server/auth.ts`, replace `src/hooks.server.ts` and `src/app.d.ts`, and create the login page (`src/routes/login/+page.server.ts` and `+page.svelte`).
        5. Make the actions check `locals.canEdit` (the lines marked below) and send `canEdit` from `load`.
        6. Replace `BookCard.svelte` and `AddBookForm.svelte` (the card shows buttons only to the owner; the inputs get `maxlength`), and change `src/routes/+page.svelte` as shown: forms only when `data.canEdit`, otherwise a link to log in.
        7. Add the CSP settings to the `sveltekit()` options in `vite.config.ts`.
        8. Update the tests: a new `validateBook` test for long titles and a new `BookCard` test file (it now shows buttons only when `editable`). Run `npm test`.
        9. Check it for real. Run `npm run build` and `npm run preview`, open the address, log in and out. Look at the response headers of the page in the browser's *Network* tab: `content-security-policy`, `x-content-type-options` and `referrer-policy` are there. Then try the CSRF protection from a second terminal (the third command below): it must answer `403`.
        10. Commit: `git add .` and `git commit -m "Password, validation and security headers"`. Check with `git status` that `.env` is not in the list.
      tr: |
        1. `src/lib/books.ts` içindeki doğrulamayı sıkılaştır: iki uzunluk sınırını ekle ve `validateBook`'ta kullan (fonksiyonu değiştir ve sabitleri `BookErrors`'ın üstüne ekle).
        2. `src/env.ts` dosyasını değiştir: `EDIT_PASSWORD`'u ekle. Uygulama en az 8 karakterlik bir parola olmadan başlamayı reddeder (build sırasında eksik olabilir; `building` bunun için).
        3. Kendin için bir parolayla `.env` oluştur ve başkaları için şablon olarak `.env.example` oluştur. `.env`'yi Git zaten yok sayar; `.env.example` commit'lenmek içindir ve gerçek bir secret taşımaz.
        4. `src/lib/server/auth.ts` oluştur, `src/hooks.server.ts` ve `src/app.d.ts` dosyalarını değiştir ve login sayfasını oluştur (`src/routes/login/+page.server.ts` ve `+page.svelte`).
        5. Action'lar `locals.canEdit`'i kontrol etsin (aşağıda işaretli satırlar) ve `load` `canEdit`'i göndersin.
        6. `BookCard.svelte` ve `AddBookForm.svelte`'i değiştir (kart düğmeleri sadece sahibine gösterir; input'lar `maxlength` alır) ve `src/routes/+page.svelte`'i gösterildiği gibi değiştir: form'lar sadece `data.canEdit` ise, değilse giriş yapmak için bir link.
        7. CSP ayarlarını `vite.config.ts` içindeki `sveltekit()` seçeneklerine ekle.
        8. Testleri güncelle: uzun başlıklar için yeni bir `validateBook` testi ve yeni bir `BookCard` test dosyası (artık düğmeleri sadece `editable` iken gösterir). `npm test` çalıştır.
        9. Gerçekten kontrol et. `npm run build` ve `npm run preview` çalıştır, adresi aç, giriş yap ve çık. Tarayıcının *Network* sekmesinde sayfanın cevap header'larına bak: `content-security-policy`, `x-content-type-options` ve `referrer-policy` orada. Sonra CSRF korumasını ikinci bir terminalden dene (aşağıdaki üçüncü komut): `403` cevap vermeli.
        10. Commit'le: `git add .` ve `git commit -m "Password, validation and security headers"`. `git status` ile `.env`'nin listede olmadığını kontrol et.
    code:
      - file: src/lib/books.ts
        lang: ts
        text: |
          // above BookErrors
          export const MAX_TITLE = 200;
          export const MAX_AUTHOR = 100;

          // replace validateBook with
          export function validateBook(
          	title: unknown,
          	author: unknown
          ): { ok: true; value: { title: string; author: string } } | { ok: false; errors: BookErrors } {
          	const t = typeof title === 'string' ? title.trim() : '';
          	const a = typeof author === 'string' ? author.trim() : '';
          	const errors: BookErrors = {};
          	if (!t) errors.title = 'Title is required';
          	else if (t.length > MAX_TITLE) errors.title = `Title is at most ${MAX_TITLE} characters`;
          	if (!a) errors.author = 'Author is required';
          	else if (a.length > MAX_AUTHOR) errors.author = `Author is at most ${MAX_AUTHOR} characters`;
          	if (errors.title || errors.author) return { ok: false, errors };
          	return { ok: true, value: { title: t, author: a } };
          }
