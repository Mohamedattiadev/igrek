          	});
          });
      - file: src/lib/components/BookCard.svelte.test.ts
        lang: ts
        text: |
          import { render, screen } from '@testing-library/svelte';
          import { describe, expect, it } from 'vitest';
          import BookCard from './BookCard.svelte';

          const book = { id: 1, title: 'Dune', author: 'Frank Herbert', status: 'reading' } as const;

          describe('BookCard', () => {
          	it('shows the title, the author and the status', () => {
          		render(BookCard, { book });
          		expect(screen.getByText('Dune')).toBeTruthy();
          		expect(screen.getByText('by Frank Herbert')).toBeTruthy();
          		expect(screen.getByText('Reading')).toBeTruthy();
          	});

          	it('has no buttons for a visitor', () => {
          		render(BookCard, { book });
          		expect(screen.queryAllByRole('button')).toHaveLength(0);
          	});

          	it('has a status and a delete button for the owner', () => {
          		render(BookCard, { book, editable: true });
