  - id: tests
    stage: testing
    title:
      en: "Tests with Vitest and Testing Library"
      tr: "Vitest ve Testing Library ile testler"
    minutes: 60
    needs: [form-actions]
    why:
      en: "A test is a small program that checks your program. You run them in seconds before every commit, so a change in one corner cannot silently break another. We test three kinds of code: plain functions, the database layer and Svelte components."
      tr: "Test, programını kontrol eden küçük bir programdır. Her commit'ten önce saniyeler içinde çalıştırırsın; böylece bir köşedeki değişiklik başka bir köşeyi sessizce bozamaz. Üç tür kodu test ediyoruz: düz fonksiyonlar, veritabanı katmanı ve Svelte component'leri."
    learn:
      en: |
        - Vitest runs `*.test.ts` files; `describe`, `it` and `expect` describe what should be true
        - The database layer takes the client as an argument, so a test can pass a throwaway in-memory database (`:memory:`) and never touch `local.db`
        - Testing Library renders a component in a fake browser (`jsdom`) and finds elements the way a person does: by role and name, not by CSS class
        - Two Vitest projects: `server` (Node) for plain tests, `client` (jsdom) for files named `*.svelte.test.ts`
      tr: |
        - Vitest `*.test.ts` dosyalarını çalıştırır; `describe`, `it` ve `expect` neyin doğru olması gerektiğini anlatır
        - Veritabanı katmanı istemciyi argüman olarak alır; böylece test, geçici bir bellek içi veritabanı (`:memory:`) verebilir ve `local.db`'ye hiç dokunmaz
        - Testing Library bir component'i sahte bir tarayıcıda (`jsdom`) çizer ve elementleri bir insan gibi bulur: CSS class'ıyla değil, rol ve adla
        - İki Vitest projesi: düz testler için `server` (Node), `*.svelte.test.ts` adlı dosyalar için `client` (jsdom)
    do:
      en: |
        1. Install the test helpers as development dependencies.
        2. Delete the example the template made: `src/lib/vitest-examples`.
        3. Replace `vite.config.ts` with the version below. The `svelteTesting()` plugin makes Svelte load its browser build in tests, and the `test` section defines the two projects.
        4. Write the tests: `books.test.ts` (plain functions), `server/store.test.ts` (database) and the two component tests.
        5. Run `npm test`. All tests should pass. Then break something on purpose, for example change `nextStatus` to return `'done'` always, run the tests again and read the failure message. Undo the change.
        6. Commit: `git add .` and `git commit -m "Tests"`.
      tr: |
        1. Test yardımcılarını geliştirme bağımlılığı olarak kur.
        2. Şablonun yaptığı örneği sil: `src/lib/vitest-examples`.
        3. `vite.config.ts` dosyasını aşağıdaki sürümle değiştir. `svelteTesting()` eklentisi Svelte'in testlerde tarayıcı sürümünü yüklemesini sağlar; `test` bölümü iki projeyi tanımlar.
        4. Testleri yaz: `books.test.ts` (düz fonksiyonlar), `server/store.test.ts` (veritabanı) ve iki component testi.
        5. `npm test` çalıştır. Tüm testler geçmeli. Sonra bilerek bir şeyi boz, örneğin `nextStatus`'ı hep `'done'` döndürecek şekilde değiştir, testleri yeniden çalıştır ve hata mesajını oku. Değişikliği geri al.
        6. Commit'le: `git add .` ve `git commit -m "Tests"`.
    code:
      - file: terminal
        lang: sh
        text: |
          npm install -D @testing-library/svelte @testing-library/user-event jsdom
          rm -r src/lib/vitest-examples
          npm test
      - file: vite.config.ts
        lang: ts
