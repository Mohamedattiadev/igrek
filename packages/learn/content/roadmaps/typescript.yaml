id: typescript
title: TypeScript
summary:
  en: "From an empty computer to a typed expense tracker that runs in your terminal, answers over HTTP, is tested, packaged and live on a free host. You learn TypeScript by building something real."
  tr: "Boş bir bilgisayardan; terminalde çalışan, HTTP üzerinden cevap veren, testleri yazılmış, paketlenmiş ve ücretsiz bir sunucuda yayında olan tipli bir harcama takipçisine. TypeScript'i gerçek bir şey yaparak öğrenirsin."
teacher: frontend
project:
  en: 'A small command-line expense tracker: add expenses, list them and see totals per category, saved in a JSON file. Later it also answers over a tiny HTTP API (node:http, then Hono), tested with node:test, packaged for npm (dry run) and deployed on a free host.'
  tr: 'Küçük bir komut satırı harcama takipçisi: harcama ekle, listele ve kategoriye göre toplamları gör; hepsi bir JSON dosyasında saklanır. Sonra küçük bir HTTP API ile de cevap verir (önce node:http, sonra Hono); node:test ile test edilir, npm için paketlenir (deneme çalıştırması) ve ücretsiz bir sunucuya yüklenir.'
detect:
  npm: [typescript]
version: "7.0"
latest: npm:typescript
checked: 2026-10
after: [web]
sheets: [typescript, javascript, nodejs, git, http]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Node.js, an editor and Git"
      tr: "Node.js, bir editör ve Git kurma"
    minutes: 45
    why:
      en: "TypeScript is JavaScript with types, and JavaScript outside the browser runs on Node.js. A recent Node.js can even run `.ts` files directly. An editor makes typing code comfortable, and Git keeps every version of your work."
      tr: "TypeScript, tipleri olan JavaScript'tir; tarayıcının dışındaki JavaScript de Node.js üzerinde çalışır. Yeni bir Node.js `.ts` dosyalarını doğrudan bile çalıştırabilir. Editör kod yazmayı rahatlatır, Git de işinin her sürümünü saklar."
    learn:
      en: |
        - What Node.js and npm are (Node runs JavaScript on your computer, npm installs packages)
        - How to open a terminal and check that a program is installed
        - Why we need Node.js 24.12 or newer: from that version on, running TypeScript files is a stable feature
      tr: |
        - Node.js ve npm'in ne olduğu (Node, JavaScript'i bilgisayarında çalıştırır; npm paket kurar)
        - Terminal açmak ve bir programın kurulu olup olmadığını kontrol etmek
        - Neden Node.js 24.12 ya da daha yenisi gerektiği: o sürümden itibaren TypeScript dosyalarını çalıştırmak kararlı (stable) bir özellik
    do:
      en: |
        1. Open https://nodejs.org/en/download and install the version marked LTS ("long term support"). It must be 24.12 or newer.
        2. Open a terminal (Terminal on macOS and Linux; on Windows use PowerShell, and install Git first because it brings "Git Bash", which we use for a few commands later).
        3. Install Git from https://git-scm.com/downloads and the free editor Visual Studio Code from https://code.visualstudio.com.
        4. Run the commands below. Each one should print a version number. Node must print `v24.12.0` or higher.
        5. Tell Git who you are (use your own name and email).
      tr: |
        1. https://nodejs.org/en/download adresini aç ve LTS ("long term support", uzun süreli destek) yazan sürümü kur. 24.12 ya da daha yeni olmalı.
        2. Bir terminal aç (macOS ve Linux'ta Terminal; Windows'ta PowerShell. Önce Git'i kur, çünkü yanında "Git Bash" gelir ve birkaç komutta onu kullanacağız).
        3. Git'i https://git-scm.com/downloads adresinden, ücretsiz editör Visual Studio Code'u https://code.visualstudio.com adresinden kur.
        4. Aşağıdaki komutları çalıştır. Her biri bir sürüm numarası yazdırmalı. Node `v24.12.0` ya da daha yüksek yazdırmalı.
        5. Git'e kim olduğunu söyle (kendi adını ve e-postanı yaz).
    code:
      - file: terminal
        lang: sh
        text: |
          node -v
          npm -v
          git --version
          git config --global user.name "Your Name"
          git config --global user.email "you@example.com"
    mistakes:
      - problem:
          en: "`node -v` says the command is not found right after installing."
          tr: "Kurulumdan hemen sonra `node -v` komutun bulunamadığını söylüyor."
        fix:
          en: "Close the terminal (or VS Code) and open it again so it sees the new program. On Windows, restart the computer if it still fails."
          tr: "Terminali (ya da VS Code'u) kapatıp yeniden aç ki yeni programı görsün. Windows'ta hâlâ olmuyorsa bilgisayarı yeniden başlat."
      - problem:
          en: "`node -v` prints an older version such as v20 or v22."
          tr: "`node -v` v20 ya da v22 gibi eski bir sürüm yazdırıyor."
        fix:
          en: "An old Node.js was installed before. Install the LTS version again from nodejs.org, reopen the terminal and check again. Versions older than 22.18 cannot run `.ts` files without special flags."
          tr: "Daha önce eski bir Node.js kurulmuş. nodejs.org'dan LTS sürümünü yeniden kur, terminali yeniden aç ve tekrar kontrol et. 22.18'den eski sürümler `.ts` dosyalarını özel bayraklar olmadan çalıştıramaz."
    quiz:
      - q:
          en: "Why do we need Node.js 24.12 or newer in this roadmap?"
          tr: "Bu yol haritasında neden Node.js 24.12 ya da daha yenisi gerekiyor?"
        options:
          en: [Older versions cannot run JavaScript at all, From 24.12 on Node can run TypeScript files in a stable way, TypeScript only installs on that version]
          tr: [Eski sürümler JavaScript'i hiç çalıştıramaz, 24.12'den itibaren Node TypeScript dosyalarını kararlı biçimde çalıştırabilir, TypeScript sadece o sürümde kurulur]
        answer: 1
        why:
          en: "Node.js can strip the types from a `.ts` file and run the rest. This became stable in 24.12 (and 25.2), so we can run our files without extra tools."
          tr: "Node.js bir `.ts` dosyasındaki tipleri silip geri kalanı çalıştırabilir. Bu özellik 24.12'de (ve 25.2'de) kararlı oldu; böylece dosyalarımızı ek bir araç olmadan çalıştırabiliriz."
    sources:
      - title: Node.js downloads
        url: https://nodejs.org/en/download
      - title: Node.js, running TypeScript natively
        url: https://nodejs.org/api/typescript.html
      - title: Git installation
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: first-code
    stage: first-code
    title:
      en: "Create the project and run your first TypeScript"
      tr: "Projeyi oluşturma ve ilk TypeScript kodunu çalıştırma"
    minutes: 40
    needs: [setup]
    why:
      en: "Every project starts with a folder, a `package.json` and a `tsconfig.json`. Once the checker (`tsc`) and the runner (`node`) both work, you can try everything in the next steps and see at once whether it is right."
      tr: "Her proje bir klasör, bir `package.json` ve bir `tsconfig.json` ile başlar. Kontrol aracı (`tsc`) ve çalıştırıcı (`node`) çalışınca sonraki adımlardaki her şeyi deneyebilir ve doğru olup olmadığını hemen görebilirsin."
    learn:
      en: |
        - `node file.ts` only removes the types and runs the code. It does not check anything.
        - `tsc` is the TypeScript compiler. We use it as a checker: it reads your code, finds type mistakes and prints them.
        - TypeScript 7 is a new, much faster version of `tsc` (a native program, not JavaScript). You install it with npm like before.
        - `module: nodenext` and `target: esnext` follow Node.js rules (ES modules); `lib: esnext` means only JavaScript built-ins, no browser objects
        - `types: ["node"]` loads the Node.js definitions (TypeScript 6 and 7 do not load any `@types` package by themselves); `strict` turns on the strict checks and is on by default since TypeScript 6
        - `noUncheckedIndexedAccess` makes `array[0]` possibly `undefined`; `erasableSyntaxOnly` and `verbatimModuleSyntax` keep the code in the form Node can run by removing the types
        - `rewriteRelativeImportExtensions` lets us write `./store.ts` in imports and still build to `.js` later; `noEmit` means `tsc` only checks
      tr: |
        - `node dosya.ts` sadece tipleri siler ve kodu çalıştırır. Hiçbir şeyi kontrol etmez.
        - `tsc` TypeScript derleyicisidir (compiler). Biz onu kontrol aracı olarak kullanacağız: kodunu okur, tip hatalarını bulur ve yazdırır.
        - TypeScript 7, `tsc`'nin yeni ve çok daha hızlı sürümüdür (JavaScript değil, native bir program). Eskisi gibi npm ile kurarsın.
        - `module: nodenext` ve `target: esnext` Node.js kurallarını (ES modülleri) izler; `lib: esnext` sadece JavaScript'in kendi nesneleri demektir, tarayıcı nesneleri yok
        - `types: ["node"]` Node.js tanımlarını yükler (TypeScript 6 ve 7 hiçbir `@types` paketini kendiliğinden yüklemez); `strict` katı kontrolleri açar ve TypeScript 6'dan beri varsayılan olarak açıktır
        - `noUncheckedIndexedAccess`, `array[0]` değerini `undefined` olabilir yapar; `erasableSyntaxOnly` ve `verbatimModuleSyntax`, kodu tipler silinince Node'un çalıştırabileceği biçimde tutar
        - `rewriteRelativeImportExtensions` import'larda `./store.ts` yazmamızı, sonra yine `.js`'e derlememizi sağlar; `noEmit`, `tsc`'nin sadece kontrol ettiği anlamına gelir
    do:
      en: |
        1. In the terminal, go to the folder where you keep projects and run the first block of commands below. It creates the `spend` folder, a Git repository, a `package.json` and installs TypeScript and the Node.js type definitions (`@types/node` tells TypeScript what `console`, `process` and `node:fs` look like).
        2. Open the folder in VS Code (`code .`). Create `.gitignore` and `tsconfig.json` with the files below. Using the options in `tsconfig.json` as given matters: later steps rely on them.
        3. Create `src/hello.ts` with the code below and run it with `node src/hello.ts`. Then check it with `npm run check`. No output from `tsc` means no mistakes.
        4. Break it on purpose: change the first line to `const greeting: string = 42;`. Run both commands again. Node still prints 42 (it does not check), but `npm run check` prints an error such as `error TS2322: Type 'number' is not assignable to type 'string'`. Change it back.
        5. Save the first version: `git add .` then `git commit -m "Start the spend project"`.
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git ve aşağıdaki ilk komut bloğunu çalıştır. `spend` klasörünü, bir Git deposunu, bir `package.json` dosyasını oluşturur ve TypeScript ile Node.js tip tanımlarını (`@types/node`, TypeScript'e `console`, `process` ve `node:fs`'in nasıl göründüğünü söyler) kurar.
        2. Klasörü VS Code'da aç (`code .`). Aşağıdaki dosyalarla `.gitignore` ve `tsconfig.json` oluştur. `tsconfig.json` ayarlarını verildiği gibi kullanmak önemli: sonraki adımlar onlara dayanıyor.
        3. Aşağıdaki kodla `src/hello.ts` dosyasını oluştur ve `node src/hello.ts` ile çalıştır. Sonra `npm run check` ile kontrol et. `tsc`'den çıktı gelmemesi hata olmadığı anlamına gelir.
        4. Bilerek bozalım: ilk satırı `const greeting: string = 42;` yap. İki komutu da yeniden çalıştır. Node yine 42 yazdırır (kontrol etmez), ama `npm run check` `error TS2322: Type 'number' is not assignable to type 'string'` gibi bir hata yazdırır. Geri düzelt.
        5. İlk sürümü kaydet: `git add .` sonra `git commit -m "Start the spend project"`.
    code:
      - file: terminal
        lang: sh
        text: |
          mkdir spend
          cd spend
          git init -b main
          npm init -y
          npm pkg delete main
          npm pkg set type=module scripts.check=tsc
          npm install -D typescript @types/node
          mkdir src test
      - file: .gitignore
        lang: text
        text: |
          node_modules
          dist
          expenses.json
          *.tmp
      - file: tsconfig.json
        lang: json
        text: |
          {
            "compilerOptions": {
              "target": "esnext",
              "module": "nodenext",
              "lib": ["esnext"],
              "types": ["node"],
              "strict": true,
              "noUncheckedIndexedAccess": true,
              "erasableSyntaxOnly": true,
              "verbatimModuleSyntax": true,
              "rewriteRelativeImportExtensions": true,
              "noEmit": true,
              "skipLibCheck": true
            },
            "include": ["src", "test"]
          }
      - file: src/hello.ts
        lang: ts
        text: |
          const greeting: string = "Hello, TypeScript!";
          console.log(greeting);
      - file: terminal
        lang: sh
        text: |
          node src/hello.ts
          npm run check
    mistakes:
      - problem:
          en: "`npm run check` says `Cannot find name 'console'`."
          tr: "`npm run check` `Cannot find name 'console'` diyor."
        fix:
          en: "TypeScript 6 and 7 do not load any `@types` packages by themselves any more (the default of `types` is empty). Make sure `tsconfig.json` has `\"types\": [\"node\"]` and that you ran `npm install -D @types/node`."
          tr: "TypeScript 6 ve 7 artık hiçbir `@types` paketini kendiliğinden yüklemiyor (`types` varsayılanı boş). `tsconfig.json` içinde `\"types\": [\"node\"]` olduğundan ve `npm install -D @types/node` çalıştırdığından emin ol."
      - problem:
          en: "Believing that `node file.ts` found no mistakes because it ran."
          tr: "`node dosya.ts` çalıştı diye hata olmadığını sanmak."
        fix:
          en: "Node only removes the types. Only `tsc` checks them. Run `npm run check` often; in the next steps it is your safety net."
          tr: "Node sadece tipleri siler. Tipleri yalnızca `tsc` kontrol eder. `npm run check`'i sık çalıştır; sonraki adımlarda güvenlik ağın o olacak."
    quiz:
      - q:
          en: "Which command finds the type mistakes in your code?"
          tr: "Hangi komut kodundaki tip hatalarını bulur?"
        options:
          en: [node src/hello.ts, npm run check (tsc), git commit]
          tr: [node src/hello.ts, npm run check (tsc), git commit]
        answer: 1
        why:
          en: "`node` removes the types and runs the code without looking at them. `tsc` is the tool that checks them."
          tr: "`node` tipleri silip koda bakmadan çalıştırır. Tipleri kontrol eden araç `tsc`'dir."
    sources:
      - title: TypeScript 7.0 announcement
        url: https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/
      - title: TSConfig reference
        url: https://www.typescriptlang.org/tsconfig/
      - title: Node.js, type stripping
        url: https://nodejs.org/api/typescript.html#type-stripping

  - id: types
    stage: basics
    title:
      en: "Types: describe an expense"
      tr: "Tipler: bir harcamayı tarif etme"
    minutes: 60
    needs: [first-code]
    why:
      en: "A type is a promise about what a value looks like. When you describe an expense once, the checker makes sure every place that uses it agrees, and your editor suggests the right fields as you type."
      tr: "Tip, bir değerin neye benzediğine dair bir sözdür. Bir harcamayı bir kez tarif edince kontrol aracı, onu kullanan her yerin buna uyduğundan emin olur; editörün de yazarken doğru alanları önerir."
    learn:
      en: |
        - Basic types: `string`, `number`, `boolean`, arrays like `number[]`
        - An `interface` describes the shape of an object
        - A union of string literals (`"food" | "fun"`) allows only those exact values
        - `as const` and `typeof` turn a list of values into a type, so the list and the type never disagree
        - `Record<Category, number>` is an object with one number for each category
        - `readonly Expense[]` promises that a function will not change the array
        - Why money is stored as whole cents: `0.1 + 0.2` is `0.30000000000000004` in JavaScript
      tr: |
        - Temel tipler: `string`, `number`, `boolean`, `number[]` gibi diziler (array)
        - `interface` bir nesnenin şeklini tarif eder
        - String değerlerden oluşan birleşim (`"food" | "fun"`) sadece o değerlere izin verir
        - `as const` ve `typeof`, bir değer listesini tipe çevirir; böylece liste ile tip hiç çelişmez
        - `Record<Category, number>`, her kategori için bir sayısı olan nesnedir
        - `readonly Expense[]`, bir fonksiyonun diziyi değiştirmeyeceği sözünü verir
        - Para neden tam kuruş olarak saklanır: JavaScript'te `0.1 + 0.2` sonucu `0.30000000000000004` çıkar
    do:
      en: |
        1. Create `src/expense.ts` with the code below. Read it line by line: every line has a reason.
        2. Replace the content of `src/hello.ts` with the sample code below and run `node src/hello.ts`. It should print `food: 17.00` and `transport: 20.00`.
        3. Run `npm run check`. Then make mistakes on purpose and read the messages: change a category to `"cars"` (error TS2322, the value is not one of the allowed ones), or write `totals.travel` (error TS2339, there is no such property). Undo them.
        4. Commit: `git add .` and `git commit -m "Describe an expense"`.
      tr: |
        1. Aşağıdaki kodla `src/expense.ts` dosyasını oluştur. Satır satır oku: her satırın bir nedeni var.
        2. `src/hello.ts` içeriğini aşağıdaki örnek kodla değiştir ve `node src/hello.ts` çalıştır. `food: 17.00` ve `transport: 20.00` yazdırmalı.
        3. `npm run check` çalıştır. Sonra bilerek hata yap ve mesajları oku: bir kategoriyi `"cars"` yap (TS2322 hatası, değer izin verilenlerden biri değil) ya da `totals.travel` yaz (TS2339 hatası, böyle bir alan yok). Geri al.
        4. Commit at: `git add .` ve `git commit -m "Describe an expense"`.
    code:
      - file: src/expense.ts
        lang: ts
        text: |
          export const categories = ["food", "transport", "home", "fun", "other"] as const;

          export type Category = (typeof categories)[number];

          export interface Expense {
            id: string;
            date: string; // "2026-10-17"
            amountCents: number; // 1250 means 12.50
            category: Category;
            note: string;
          }

          export function formatMoney(cents: number): string {
            return (cents / 100).toFixed(2);
          }

          export function totalsByCategory(expenses: readonly Expense[]): Record<Category, number> {
            const totals: Record<Category, number> = { food: 0, transport: 0, home: 0, fun: 0, other: 0 };
            for (const expense of expenses) {
              totals[expense.category] += expense.amountCents;
            }
            return totals;
          }
      - file: src/hello.ts
        lang: ts
        text: |
          import { formatMoney, totalsByCategory, type Expense } from "./expense.ts";

          const sample: Expense[] = [
            { id: "1", date: "2026-10-01", amountCents: 1250, category: "food", note: "lunch" },
            { id: "2", date: "2026-10-02", amountCents: 2000, category: "transport", note: "bus pass" },
            { id: "3", date: "2026-10-03", amountCents: 450, category: "food", note: "coffee" },
          ];

          const totals = totalsByCategory(sample);
          console.log("food:", formatMoney(totals.food));
          console.log("transport:", formatMoney(totals.transport));
    mistakes:
      - problem:
          en: "Writing `import { Expense } from \"./expense.ts\"` without `type`. `npm run check` says the import must be a type-only import."
          tr: "`import { Expense } from \"./expense.ts\"` yazıp `type` koymamak. `npm run check` bunun sadece-tip (type-only) import olması gerektiğini söylüyor."
        fix:
          en: "Write `import type { Expense } from ...` or `import { type Expense, ... } from ...`. Types disappear when the code runs, so Node must know that the import can be dropped."
          tr: "`import type { Expense } from ...` ya da `import { type Expense, ... } from ...` yaz. Kod çalışırken tipler yok olur; Node'un bu import'u atabileceğini bilmesi gerekir."
      - problem:
          en: "Storing money as a decimal number such as `12.5`."
          tr: "Parayı `12.5` gibi ondalıklı sayı olarak saklamak."
        fix:
          en: "Store whole cents (`1250`) and format only when you show the value. Whole numbers add up exactly."
          tr: "Tam kuruşu sakla (`1250`) ve sadece göstereceğin zaman biçimlendir. Tam sayılar tam olarak toplanır."
    quiz:
      - q:
          en: "What does `(typeof categories)[number]` give you for `const categories = [\"food\", \"fun\"] as const`?"
          tr: "`const categories = [\"food\", \"fun\"] as const` için `(typeof categories)[number]` ne verir?"
        options:
          en: [The number 2, 'The type "food" | "fun"', 'The type string[]']
          tr: [2 sayısı, '"food" | "fun" tipi', 'string[] tipi']
        answer: 1
        why:
          en: "`as const` makes the list read-only with exact values. Indexing its type with `number` means \"any item\", which is the union of all the values."
          tr: "`as const` listeyi kesin değerlerle salt okunur yapar. Tipini `number` ile indekslemek \"herhangi bir eleman\" demektir; bu da bütün değerlerin birleşimidir."
    sources:
      - title: TypeScript Handbook, Everyday Types
        url: https://www.typescriptlang.org/docs/handbook/2/everyday-types.html
      - title: TypeScript Handbook, Object Types
        url: https://www.typescriptlang.org/docs/handbook/2/objects.html
      - title: MDN, Number.prototype.toFixed()
        url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/toFixed

  - id: narrowing
    stage: basics
    title:
      en: "Unknown input, narrowing and errors"
      tr: "Bilinmeyen girdi, daraltma (narrowing) ve hatalar"
    minutes: 60
    needs: [types]
    why:
      en: "Everything that comes from outside (what a user types, a file, a request) is not typed for you. The honest type for it is `unknown`. Narrowing is how you prove to the checker what a value really is before you use it."
      tr: "Dışarıdan gelen her şey (kullanıcının yazdığı, bir dosya, bir istek) senin için tipli değildir. Bunun dürüst tipi `unknown`'dır. Daraltma (narrowing), bir değeri kullanmadan önce gerçekte ne olduğunu kontrol aracına kanıtlama yoludur."
    learn:
      en: |
        - `unknown` means "could be anything, check first"; `any` switches the checker off, so avoid it
        - Narrowing with `typeof`, `instanceof` and checks like `Array.isArray`
        - A type predicate (`value is Category`) is a function whose `true` result narrows the type
        - Because of `noUncheckedIndexedAccess`, `array[0]` has the type `T | undefined`; destructuring with defaults handles that
        - Your own error class: `class ValidationError extends Error {}`
        - Why we check dates with real `Date` parsing: `2026-02-30` looks fine but does not exist
      tr: |
        - `unknown` "her şey olabilir, önce kontrol et" demektir; `any` kontrol aracını kapatır, o yüzden kaçın
        - `typeof`, `instanceof` ve `Array.isArray` gibi kontrollerle daraltma
        - Tip yüklemi (type predicate, `value is Category`), `true` döndüğünde tipi daraltan bir fonksiyondur
        - `noUncheckedIndexedAccess` yüzünden `array[0]` tipi `T | undefined` olur; varsayılanlı destructuring bunu çözer
        - Kendi hata sınıfın: `class ValidationError extends Error {}`
        - Tarihleri neden gerçek `Date` ayrıştırmasıyla kontrol ediyoruz: `2026-02-30` düzgün görünür ama böyle bir gün yok
    do:
      en: |
        1. Replace the whole content of `src/expense.ts` with the code below. The old parts are still there; the new parts are `ValidationError`, `isCategory`, `parseAmount`, `isIsoDate` and `today`.
        2. Create the scratch file `src/try.ts`, run `node src/try.ts` and read the output: `1250`, then `caught: ...`.
        3. Open `parseAmount` and find where the checker forced you to handle `undefined` (the destructuring with `= "0"` and `= ""`). Remove one default and run `npm run check` to see the error. Put it back.
        4. Delete `src/try.ts`, run `npm run check`, then commit: `git add .` and `git commit -m "Parse and check input"`.
      tr: |
        1. `src/expense.ts` dosyasının bütün içeriğini aşağıdaki kodla değiştir. Eski kısımlar duruyor; yeni kısımlar `ValidationError`, `isCategory`, `parseAmount`, `isIsoDate` ve `today`.
        2. Deneme dosyası `src/try.ts`'i oluştur, `node src/try.ts` çalıştır ve çıktıyı oku: `1250`, sonra `caught: ...`.
        3. `parseAmount`'u aç ve kontrol aracının `undefined`'ı ele almaya seni zorladığı yeri bul (`= "0"` ve `= ""` olan destructuring). Varsayılanlardan birini sil ve hatayı görmek için `npm run check` çalıştır. Geri koy.
        4. `src/try.ts` dosyasını sil, `npm run check` çalıştır, sonra commit at: `git add .` ve `git commit -m "Parse and check input"`.
    code:
      - file: src/expense.ts
        lang: ts
        text: |
          export const categories = ["food", "transport", "home", "fun", "other"] as const;

          export type Category = (typeof categories)[number];

          export interface Expense {
            id: string;
            date: string; // "2026-10-17"
            amountCents: number; // 1250 means 12.50
            category: Category;
            note: string;
          }

          export function formatMoney(cents: number): string {
            return (cents / 100).toFixed(2);
          }

          export function totalsByCategory(expenses: readonly Expense[]): Record<Category, number> {
            const totals: Record<Category, number> = { food: 0, transport: 0, home: 0, fun: 0, other: 0 };
            for (const expense of expenses) {
              totals[expense.category] += expense.amountCents;
            }
            return totals;
          }

          export class ValidationError extends Error {}

          export function isCategory(value: unknown): value is Category {
            return typeof value === "string" && (categories as readonly string[]).includes(value);
          }

          export function parseAmount(text: string): number {
            const match = /^(\d+)(?:\.(\d{1,2}))?$/.exec(text.trim());
            if (!match) {
              throw new ValidationError(`"${text}" is not an amount like 12 or 12.50`);
            }
            const [, whole = "0", fraction = ""] = match;
            const cents = Number(whole) * 100 + Number(fraction.padEnd(2, "0"));
            if (!Number.isSafeInteger(cents) || cents <= 0) {
              throw new ValidationError("the amount must be more than 0");
            }
            return cents;
          }

          export function isIsoDate(text: string): boolean {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) return false;
            const date = new Date(`${text}T00:00:00Z`);
            return !Number.isNaN(date.getTime()) && date.toISOString().startsWith(text);
          }

          export function today(): string {
            return new Date().toISOString().slice(0, 10);
          }
      - file: src/try.ts
        lang: ts
        text: |
          import { parseAmount, ValidationError } from "./expense.ts";

          console.log(parseAmount("12.50"));
          try {
            parseAmount("abc");
          } catch (error) {
            if (error instanceof ValidationError) console.log("caught:", error.message);
          }
    mistakes:
      - problem:
          en: "Silencing the checker with `as` or `any` (for example `JSON.parse(text) as Expense[]`) instead of checking the value."
          tr: "Değeri kontrol etmek yerine kontrol aracını `as` ya da `any` ile susturmak (örneğin `JSON.parse(text) as Expense[]`)."
        fix:
          en: "`as` is a promise from you, not a check. If the data is wrong, the program still breaks later and somewhere else. Use `unknown` and check the value, like `parseAmount` does."
          tr: "`as` bir kontrol değil, senin verdiğin bir sözdür. Veri yanlışsa program yine bozulur, hem de daha sonra ve başka bir yerde. `unknown` kullan ve değeri `parseAmount` gibi kontrol et."
      - problem:
          en: "Catching an error and using `error.message` directly: `'error' is of type 'unknown'`."
          tr: "Bir hatayı yakalayıp `error.message` kullanmak: `'error' is of type 'unknown'`."
        fix:
          en: "In `catch`, the error can be anything. Narrow it first with `if (error instanceof ValidationError)`."
          tr: "`catch` içinde hata her şey olabilir. Önce `if (error instanceof ValidationError)` ile daralt."
    quiz:
      - q:
          en: "Why is `unknown` safer than `any` for data from outside?"
          tr: "Dışarıdan gelen veri için `unknown` neden `any`'den daha güvenlidir?"
        options:
          en: [It is faster at runtime, It forces you to check the value before you use it, It converts the value to the right type]
          tr: [Çalışırken daha hızlıdır, Kullanmadan önce değeri kontrol etmeye seni zorlar, Değeri doğru tipe çevirir]
        answer: 1
        why:
          en: "With `unknown` the checker refuses to use the value until you have narrowed it. With `any` it allows everything, including mistakes."
          tr: "`unknown` ile kontrol aracı, değeri daraltmadan kullanmana izin vermez. `any` ile her şeye, hatalara bile izin verir."
    sources:
      - title: TypeScript Handbook, Narrowing
        url: https://www.typescriptlang.org/docs/handbook/2/narrowing.html
      - title: TSConfig, noUncheckedIndexedAccess
        url: https://www.typescriptlang.org/tsconfig/#noUncheckedIndexedAccess
      - title: MDN, Error
        url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Error

  - id: cli
    stage: first-project
    title:
      en: "The command-line tracker"
      tr: "Komut satırı takipçisi"
    minutes: 90
    needs: [narrowing]
    why:
      en: "This is the first time the pieces work together as a real program: you type a command, it checks your input, saves to a file and prints a result. You can use it for your own expenses already."
      tr: "Parçalar ilk kez gerçek bir program olarak birlikte çalışıyor: bir komut yazıyorsun, girdini kontrol ediyor, bir dosyaya kaydediyor ve sonucu yazdırıyor. Kendi harcamaların için şimdiden kullanabilirsin."
    learn:
      en: |
        - Command-line arguments with `process.argv` and `parseArgs` from `node:util`
        - Reading and writing files with `node:fs/promises`; `async` and `await`
        - An `interface` for a service (`Store`) so the rest of the code does not care how data is saved
        - Why the logic (`commands.ts`) is separate from the thin entry file (`cli.ts`): the logic can be tested
        - Exit codes: `process.exitCode = 1` tells the terminal that the command failed
      tr: |
        - `process.argv` ve `node:util` içindeki `parseArgs` ile komut satırı argümanları
        - `node:fs/promises` ile dosya okuma ve yazma; `async` ve `await`
        - Bir servis için `interface` (`Store`): kodun geri kalanı verinin nasıl saklandığını umursamaz
        - Mantığın (`commands.ts`) neden ince giriş dosyasından (`cli.ts`) ayrı olduğu: mantık test edilebilir
        - Çıkış kodları: `process.exitCode = 1` terminale komutun başarısız olduğunu söyler
    do:
      en: |
        1. Create `src/store.ts`, `src/commands.ts` and `src/cli.ts` with the code below, and delete `src/hello.ts`.
        2. Run `npm run check`. Then try the commands in the second block. Your first `add` creates `expenses.json` (it is in `.gitignore`, so your own data never goes to Git).
        3. Open `expenses.json` in the editor and look at what was saved.
        4. Try a mistake: `node src/cli.ts add abc food`. You should see `Error: "abc" is not an amount like 12 or 12.50` and no crash with a long stack trace.
        5. Commit: `git add .` and `git commit -m "Add the command-line tracker"`.
      tr: |
        1. Aşağıdaki kodla `src/store.ts`, `src/commands.ts` ve `src/cli.ts` dosyalarını oluştur, `src/hello.ts` dosyasını sil.
        2. `npm run check` çalıştır. Sonra ikinci bloktaki komutları dene. İlk `add` komutun `expenses.json` dosyasını oluşturur (`.gitignore` içinde, yani kendi verin Git'e hiç gitmez).
        3. `expenses.json` dosyasını editörde aç ve nelerin kaydedildiğine bak.
        4. Bir hata dene: `node src/cli.ts add abc food`. `Error: "abc" is not an amount like 12 or 12.50` görmelisin; uzun bir hata dökümüyle çökme olmamalı.
        5. Commit at: `git add .` ve `git commit -m "Add the command-line tracker"`.
    code:
      - file: src/store.ts
        lang: ts
        text: |
          import { readFile, writeFile } from "node:fs/promises";
          import type { Expense } from "./expense.ts";

          export interface Store {
            list(): Promise<readonly Expense[]>;
            add(expense: Expense): Promise<void>;
          }

          export const defaultFile = process.env.DATA_FILE ?? "expenses.json";

          async function read(file: string): Promise<Expense[]> {
            try {
              return JSON.parse(await readFile(file, "utf8")) as Expense[];
            } catch (error) {
              if ((error as NodeJS.ErrnoException).code === "ENOENT") return [];
              throw error;
            }
          }

          export function fileStore(file = defaultFile): Store {
            return {
              list: () => read(file),
              async add(expense) {
                const all = await read(file);
                all.push(expense);
                await writeFile(file, JSON.stringify(all, null, 2) + "\n");
              },
            };
          }
      - file: src/commands.ts
        lang: ts
        text: |
          import { randomUUID } from "node:crypto";
          import { parseArgs } from "node:util";
          import {
            categories,
            formatMoney,
            isCategory,
            isIsoDate,
            parseAmount,
            today,
            totalsByCategory,
            ValidationError,
          } from "./expense.ts";
          import { fileStore } from "./store.ts";

          export const usage = `spend: a tiny expense tracker

            spend add <amount> <category> [note...] [--date 2026-10-17]
            spend list
            spend total

          categories: ${categories.join(", ")}`;

          export async function run(args: string[], file?: string): Promise<string> {
            const { positionals, values } = parseArgs({
              args,
              allowPositionals: true,
              options: { date: { type: "string" } },
            });
            const [command, ...rest] = positionals;
            const store = fileStore(file);

            if (command === "add") {
              const [amountText, category, ...noteWords] = rest;
              if (amountText === undefined || category === undefined) {
                throw new ValidationError("add needs an amount and a category");
              }
              if (!isCategory(category)) {
                throw new ValidationError(`category must be one of: ${categories.join(", ")}`);
              }
              const date = values.date ?? today();
              if (!isIsoDate(date)) throw new ValidationError("--date must look like 2026-10-17");
              const amountCents = parseAmount(amountText);
              await store.add({ id: randomUUID(), date, amountCents, category, note: noteWords.join(" ") });
              return `Added ${formatMoney(amountCents)} to ${category}.`;
            }

            if (command === "list") {
              const all = await store.list();
              if (all.length === 0) return "No expenses yet.";
              return all
                .map((e) => `${e.date}  ${formatMoney(e.amountCents).padStart(9)}  ${e.category.padEnd(9)}${e.note}`)
                .join("\n");
            }

            if (command === "total") {
              const totals = totalsByCategory(await store.list());
              const lines = categories.map((c) => `${c.padEnd(10)}${formatMoney(totals[c]).padStart(9)}`);
              const sum = categories.reduce((acc, c) => acc + totals[c], 0);
              return [...lines, `${"all".padEnd(10)}${formatMoney(sum).padStart(9)}`].join("\n");
            }

            return usage;
          }
      - file: src/cli.ts
        lang: ts
        text: |
          #!/usr/bin/env node
          import { run } from "./commands.ts";
          import { ValidationError } from "./expense.ts";

          try {
            console.log(await run(process.argv.slice(2)));
          } catch (error) {
            if (error instanceof ValidationError) {
              console.error(`Error: ${error.message}`);
              process.exitCode = 1;
            } else {
              throw error;
            }
          }
      - file: terminal
        lang: sh
        text: |
          node src/cli.ts
          node src/cli.ts add 12.50 food lunch with Ali
          node src/cli.ts add 20 transport --date 2026-10-18
          node src/cli.ts list
          node src/cli.ts total
    mistakes:
      - problem:
          en: "`Cannot find module '.../commands'` when running `node src/cli.ts`."
          tr: "`node src/cli.ts` çalıştırırken `Cannot find module '.../commands'` hatası."
        fix:
          en: "Node needs the full file name in imports: `./commands.ts`, not `./commands`. TypeScript asks for the same in this setup."
          tr: "Node, import'larda dosyanın tam adını ister: `./commands` değil `./commands.ts`. Bu ayarla TypeScript de aynısını ister."
      - problem:
          en: "`ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX` for an `enum`, a `namespace` or a constructor like `constructor(private x: string)`."
          tr: "Bir `enum`, `namespace` ya da `constructor(private x: string)` gibi bir yapıcı için `ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX` hatası."
        fix:
          en: "Node only removes types; it cannot turn these into JavaScript. Use a union of strings instead of an enum, and assign fields yourself in the constructor. `erasableSyntaxOnly` in our `tsconfig.json` makes `tsc` warn you about them early."
          tr: "Node sadece tipleri siler; bunları JavaScript'e çeviremez. Enum yerine string birleşimi kullan, alanları yapıcıda kendin ata. `tsconfig.json`'daki `erasableSyntaxOnly`, `tsc`'nin seni bunlar için erkenden uyarmasını sağlar."
    quiz:
      - q:
          en: "Why is `fileStore` returned as a `Store` (an interface) and not used directly?"
          tr: "`fileStore` neden doğrudan kullanılmıyor da `Store` (bir interface) olarak döndürülüyor?"
        options:
          en: [Interfaces make code faster, The commands only depend on list and add so the storage can change later, TypeScript requires it]
          tr: [Interface'ler kodu hızlandırır, Komutlar sadece list ve add'e bağlı olduğu için depolama sonradan değişebilir, TypeScript bunu zorunlu kılar]
        answer: 1
        why:
          en: "Later we will swap the file for a cached version, and tests will use a temporary file. The commands do not need to change."
          tr: "Sonra dosyayı önbellekli bir sürümle değiştireceğiz, testler de geçici bir dosya kullanacak. Komutların değişmesi gerekmez."
    sources:
