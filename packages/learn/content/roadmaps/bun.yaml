id: bun
title:
  en: "Bun full-stack"
  tr: "Bun ile full-stack"
summary:
  en: "From an empty computer to your own full-stack app on the internet, built with Bun alone. You write a small notes app step by step: TypeScript with no build step, a web server, a page, a SQLite database, logins, tests, one executable file, a tiny Docker image and a free deploy."
  tr: "Boş bir bilgisayardan internette yayında olan kendi full-stack uygulamana, sadece Bun ile. Adım adım küçük bir not uygulaması yazarsın: derleme adımı olmayan TypeScript, bir web sunucusu, bir sayfa, SQLite veritabanı, giriş sistemi, testler, tek çalıştırılabilir dosya, küçücük bir Docker image'ı ve ücretsiz deploy."
teacher: backend
project:
  en: "Notely, a small notes app. People register and log in, then add, list and delete their own notes. Bun serves both the page (plain TypeScript, no framework) and the JSON API. It uses bun:sqlite, Bun.password hashing, bun test, rate limiting, JSON logs and a health check, ships as one executable inside a small Docker image, and runs on Render's free plan."
  tr: "Notely, küçük bir not uygulaması. Kişiler kayıt olup giriş yapar, sonra kendi notlarını ekler, listeler ve siler. Bun hem sayfayı (düz TypeScript, framework yok) hem de JSON API'yi sunar. bun:sqlite, Bun.password ile hash'leme, bun test, rate limiting, JSON log'lar ve bir health check kullanır; küçük bir Docker image'ının içinde tek çalıştırılabilir dosya olarak gelir ve Render'ın ücretsiz planında çalışır."
detect:
  npm: ["@types/bun", bun-types]
  files: [bun.lock, bunfig.toml]
version: "1.4.3"
latest: eol:bun
checked: 2026-10
after: [web]
sheets: [bun, typescript, javascript, http, auth, sql, docker, git]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Bun, an editor, Git and curl"
      tr: "Bun, bir editör, Git ve curl kurma"
    minutes: 40
    why:
      en: "Bun is one program that runs your TypeScript, installs packages, runs tests and builds your app, so there is very little else to set up. An editor makes writing code comfortable, Git keeps every version of your work, and curl lets you talk to your own server from the terminal before any web page exists."
      tr: "Bun; TypeScript kodunu çalıştıran, paket kuran, test çalıştıran ve uygulamanı derleyen tek bir programdır; bu yüzden ayrıca kurulacak şey çok azdır. Editör kod yazmayı rahatlatır, Git işinin her sürümünü saklar, curl da henüz ortada bir web sayfası yokken kendi sunucunla terminalden konuşmanı sağlar."
    learn:
      en: |
        - What Bun is: a JavaScript and TypeScript runtime (a program that runs code), a package manager, a test runner and a bundler in one
        - What a backend is (a program that waits for requests and answers them) and what a full-stack app is (the backend plus the page people see)
        - How to open a terminal and check that a program is installed
      tr: |
        - Bun'ın ne olduğu: JavaScript ve TypeScript çalışma ortamı (kodu çalıştıran program), paket yöneticisi, test çalıştırıcı ve bundler, hepsi bir arada
        - Backend'in ne olduğu (istek bekleyen ve cevap veren program) ve full-stack uygulamanın ne olduğu (backend artı insanların gördüğü sayfa)
        - Terminal açmak ve bir programın kurulu olup olmadığını kontrol etmek
    do:
      en: |
        1. Install **Bun**. On macOS and Linux run `curl -fsSL https://bun.com/install | bash`. On Windows (10 version 1809 or later) run `powershell -c "irm bun.sh/install.ps1|iex"` in PowerShell. Other ways (Homebrew, npm) are on bun.com/docs/installation.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor.
        3. Install **Git** (git-scm.com). On macOS, running `git --version` offers to install it. On Windows, Git also installs *Git Bash*, a terminal where the `curl` commands in this roadmap work exactly as written. Use it if PowerShell gives you trouble with quotes.
        4. **Close the terminal and open a new one**, so it can find `bun`. In VS Code: *Terminal → New Terminal*.
        5. Run the commands below. Each should print a version number. This roadmap was tested with Bun 1.4.3; any 1.4 version works.
        6. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
      tr: |
        1. **Bun**'ı kur. macOS ve Linux'ta `curl -fsSL https://bun.com/install | bash` çalıştır. Windows'ta (10 sürüm 1809 veya üstü) PowerShell'de `powershell -c "irm bun.sh/install.ps1|iex"` çalıştır. Diğer yollar (Homebrew, npm) bun.com/docs/installation sayfasında.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u kur (code.visualstudio.com).
        3. **Git**'i kur (git-scm.com). macOS'ta `git --version` çalıştırınca kurmayı kendisi önerir. Windows'ta Git, *Git Bash* de kurar; bu roadmap'teki `curl` komutları orada aynen yazıldığı gibi çalışır. PowerShell tırnak işaretlerinde sorun çıkarırsa onu kullan.
        4. **Terminali kapatıp yenisini aç**, ki `bun`'ı bulabilsin. VS Code'da: *Terminal → New Terminal*.
        5. Aşağıdaki komutları çalıştır. Her biri bir sürüm numarası yazmalı. Bu roadmap Bun 1.4.3 ile denendi; her 1.4 sürümü çalışır.
        6. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
    code:
      - file: terminal
        lang: sh
        text: |
          bun --version
          git --version
          curl --version
    mistakes:
      - problem:
          en: "\"command not found: bun\" right after installing."
          tr: "Kurduktan hemen sonra \"command not found: bun\" hatası."
        fix:
          en: "Close the terminal and open a new one. The installer adds Bun to your PATH, and only new terminals read it. If it still fails, run the installer's last lines again and follow what it says."
          tr: "Terminali kapatıp yenisini aç. Kurucu Bun'ı PATH'ine ekler ve bunu sadece yeni terminaller okur. Hâlâ olmuyorsa kurucunun son satırlarını tekrar çalıştırıp yazdığını yap."
      - problem:
          en: "On Windows, `curl` in PowerShell behaves strangely and the JSON examples fail."
          tr: "Windows'ta PowerShell'deki `curl` tuhaf davranıyor ve JSON örnekleri çalışmıyor."
        fix:
          en: "In PowerShell, `curl` is an alias of a different command. Run the examples in Git Bash, or type `curl.exe` instead of `curl`."
          tr: "PowerShell'de `curl`, başka bir komutun takma adıdır. Örnekleri Git Bash'te çalıştır ya da `curl` yerine `curl.exe` yaz."
    quiz:
      - q:
          en: "Which of these does Bun do on its own, with no extra program?"
          tr: "Aşağıdakilerden hangisini Bun, ek bir program olmadan kendisi yapar?"
        options:
          en:
            - "Only runs JavaScript"
            - "Runs TypeScript, installs packages, runs tests and bundles code"
            - "Only installs packages"
          tr:
            - "Sadece JavaScript çalıştırır"
            - "TypeScript çalıştırır, paket kurar, test çalıştırır ve kodu paketler"
            - "Sadece paket kurar"
        answer: 1
        why:
          en: "Bun is a runtime, a package manager, a test runner and a bundler in one program."
          tr: "Bun; çalışma ortamı, paket yöneticisi, test çalıştırıcı ve bundler olarak tek programdır."
    sources:
      - title: "Bun: Installation"
        url: https://bun.com/docs/installation
      - title: "Git: Installing Git"
        url: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git

  - id: hello
    stage: first-code
    title:
      en: "Create the project and run TypeScript"
      tr: "Projeyi oluşturma ve TypeScript çalıştırma"
    minutes: 30
    needs: [setup]
    why:
      en: "Every project starts as a folder with a few files. `bun init` makes them for you. With Bun you run a `.ts` file directly: there is no compile step to set up, which is why this whole roadmap needs no build tool until the very end."
      tr: "Her proje birkaç dosyalı bir klasör olarak başlar. `bun init` bunları senin için oluşturur. Bun ile bir `.ts` dosyasını doğrudan çalıştırırsın: kurulacak bir derleme adımı yoktur; bu yüzden bu roadmap en sona kadar hiçbir build aracı gerektirmez."
    learn:
      en: |
        - What `bun init` creates: `package.json` (the project's name, scripts and packages), `tsconfig.json` (TypeScript settings), `index.ts`, `.gitignore`
        - TypeScript is JavaScript plus types (`name: string`). Bun removes the types when it runs the file; it does not check them
        - `bun check` is the command that does check types
      tr: |
        - `bun init`'in ne oluşturduğu: `package.json` (projenin adı, script'leri ve paketleri), `tsconfig.json` (TypeScript ayarları), `index.ts`, `.gitignore`
        - TypeScript, JavaScript artı tiplerdir (`name: string`). Bun dosyayı çalıştırırken tipleri siler; kontrol etmez
        - Tipleri kontrol eden komut `bun check`'tir
    do:
      en: |
        1. In the terminal, go to the folder where you keep projects. Run the first block below: it makes a folder `notely`, goes into it and runs `bun init -y` (`-y` means "yes to every question").
        2. Run `ls` (on Windows PowerShell: `dir`) and look at the files. `README.md` and `CLAUDE.md` are notes that `bun init` writes; `CLAUDE.md` is meant for AI coding assistants. You can delete both.
        3. Open the folder in VS Code (`code .`). Replace everything in `index.ts` with the code below.
        4. Run it with `bun run index.ts`. It prints one line with your Bun version.
        5. Run `bun check`. It should say there are no type errors. Now change `"Notely"` to `42` and run `bun check` again: it reports an error, yet `bun run index.ts` still runs. That is the difference between running and checking. Change it back.
        6. Save this first version: `git init`, `git add .`, `git commit -m "Start Notely"`. (`bun init` already wrote a `.gitignore` that keeps `node_modules` out.)
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git. Aşağıdaki ilk bloğu çalıştır: `notely` adında bir klasör oluşturur, içine girer ve `bun init -y` çalıştırır (`-y` "her soruya evet" demek).
        2. `ls` çalıştır (Windows PowerShell'de: `dir`) ve dosyalara bak. `README.md` ve `CLAUDE.md`, `bun init`'in yazdığı notlardır; `CLAUDE.md` yapay zekâ kod asistanları içindir. İkisini de silebilirsin.
        3. Klasörü VS Code'da aç (`code .`). `index.ts` içindeki her şeyi aşağıdaki kodla değiştir.
        4. `bun run index.ts` ile çalıştır. Bun sürümünü yazan tek bir satır basar.
        5. `bun check` çalıştır. Tip hatası olmadığını söylemeli. Şimdi `"Notely"` yerine `42` yaz ve `bun check`'i tekrar çalıştır: hata bildirir, ama `bun run index.ts` yine de çalışır. Çalıştırma ile kontrol etme arasındaki fark budur. Geri düzelt.
        6. Bu ilk sürümü kaydet: `git init`, `git add .`, `git commit -m "Start Notely"`. (`bun init` zaten `node_modules`'ı dışarıda tutan bir `.gitignore` yazdı.)
    code:
      - file: terminal
        lang: sh
        text: |
          mkdir notely
          cd notely
          bun init -y
      - file: index.ts
        lang: ts
        text: |
          const name: string = "Notely";
          console.log(`Hello from ${name}, running on Bun ${Bun.version}`);
      - file: terminal
        lang: sh
        text: |
          bun run index.ts
          bun check
    mistakes:
      - problem:
          en: "Thinking Bun checks your types because the file runs."
          tr: "Dosya çalışıyor diye Bun'ın tipleri kontrol ettiğini sanmak."
        fix:
          en: "Bun only strips the types when it runs a file. Run `bun check` (and later put it in CI) to find type errors."
          tr: "Bun dosyayı çalıştırırken sadece tipleri siler. Tip hatalarını bulmak için `bun check` çalıştır (ve ileride CI'a koy)."
      - problem:
          en: "Running `bun init` inside a folder that already holds another project."
          tr: "`bun init`'i başka bir projenin olduğu klasörde çalıştırmak."
        fix:
          en: "It is made for new, empty folders and does not merge with an existing project. Make a new folder first."
          tr: "Yeni ve boş klasörler için yapılmıştır, mevcut projeyle birleşmez. Önce yeni bir klasör oluştur."
    quiz:
      - q:
          en: "You wrote `const n: number = \"hi\"` and `bun run index.ts` still prints output. Why?"
          tr: "`const n: number = \"hi\"` yazdın ve `bun run index.ts` yine de çıktı veriyor. Neden?"
        options:
          en:
            - "Bun fixed the type for you"
            - "Bun only strips types when running; `bun check` is what reports the error"
            - "TypeScript errors only appear in the browser"
          tr:
            - "Bun tipi senin için düzeltti"
            - "Bun çalıştırırken sadece tipleri siler; hatayı `bun check` bildirir"
            - "TypeScript hataları sadece tarayıcıda görünür"
        answer: 1
        why:
          en: "Running and type-checking are separate. Bun runs the code without looking at types."
          tr: "Çalıştırma ve tip kontrolü ayrı şeylerdir. Bun kodu tiplere bakmadan çalıştırır."
    sources:
      - title: "Bun: bun init"
        url: https://bun.com/docs/runtime/templating/init
      - title: "Bun: TypeScript"
        url: https://bun.com/docs/runtime/typescript

  - id: server
    stage: basics
    title:
      en: "Your first web server with Bun.serve"
      tr: "Bun.serve ile ilk web sunucun"
    minutes: 45
    needs: [hello]
    why:
      en: "A backend is a program that waits for requests and answers them. `Bun.serve` is the built-in way to do that: you list the paths you want (routes) and what to answer for each. You also meet environment variables, the standard way to give a program its settings without changing its code."
      tr: "Backend, istek bekleyen ve cevap veren bir programdır. `Bun.serve` bunu yapmanın hazır yoludur: istediğin yolları (route) ve her biri için ne cevap vereceğini yazarsın. Ayrıca ortam değişkenleriyle tanışırsın; bunlar bir programa ayarlarını kodunu değiştirmeden vermenin standart yoludur."
    learn:
      en: |
        - What a request, a response, a status code (200 ok, 404 not found) and JSON are
        - Routes: `"/health"` for one path and `"/api/hello/:name"` for a path with a changing part (`req.params.name`)
        - `fetch()` in `Bun.serve` is the fallback for paths no route matched
        - Environment variables: Bun reads them from `Bun.env` and loads a `.env` file by itself
        - `bun --hot` reloads your code when you save, without restarting the server
      tr: |
        - İstek (request), cevap (response), durum kodu (200 tamam, 404 bulunamadı) ve JSON'un ne olduğu
        - Route'lar: tek yol için `"/health"`, değişen kısmı olan yol için `"/api/hello/:name"` (`req.params.name`)
        - `Bun.serve` içindeki `fetch()`, hiçbir route'a uymayan yollar için yedektir
        - Ortam değişkenleri: Bun onları `Bun.env`'den okur ve `.env` dosyasını kendisi yükler
        - `bun --hot` kaydedince kodunu sunucuyu yeniden başlatmadan yeniler
    do:
      en: |
        1. Make a folder `src` and delete the old `index.ts` (the server moves into `src/`): `mkdir src` and `rm index.ts` (Windows PowerShell: `del index.ts`).
        2. Create `src/config.ts` and `src/index.ts` with the code below.
        3. Replace `package.json` with the version below. Only `module` and `scripts` changed from what `bun init` wrote. If your `devDependencies` or `peerDependencies` lines differ a little, keep yours.
        4. Create `.env.example` (below). It documents which settings exist and is safe to commit. Your real `.env` is ignored by Git.
        5. Add two lines to the end of `.gitignore`: `*.db` and `*.db-*` (the database files we create soon should never be committed).
        6. Start the server with `bun run dev`. It prints the address.
        7. In a second terminal, run the curl commands below. You should see `{"status":"ok"}`, a hello message and a 404 for an unknown path.
        8. Test settings: create a file `.env` with the line `PORT=4000`, stop the server (Ctrl+C), start it again and see that it listens on 4000. Delete `.env` afterwards.
        9. Change the hello message in `src/index.ts`, save, and call the URL again. `--hot` picked up the change without a restart.
        10. Commit: `git add .` and `git commit -m "Add a web server"`.
      tr: |
        1. `src` adında bir klasör oluştur ve eski `index.ts`'i sil (sunucu `src/` içine taşınıyor): `mkdir src` ve `rm index.ts` (Windows PowerShell'de: `del index.ts`).
        2. Aşağıdaki kodla `src/config.ts` ve `src/index.ts` dosyalarını oluştur.
        3. `package.json`'u aşağıdaki sürümle değiştir. `bun init`'in yazdığına göre sadece `module` ve `scripts` değişti. `devDependencies` ya da `peerDependencies` satırların biraz farklıysa seninkileri koru.
        4. `.env.example` dosyasını oluştur (aşağıda). Hangi ayarların olduğunu anlatır ve commit etmesi güvenlidir. Gerçek `.env` dosyan Git tarafından yok sayılır.
        5. `.gitignore`'un sonuna iki satır ekle: `*.db` ve `*.db-*` (yakında oluşturacağımız veritabanı dosyaları asla commit edilmemeli).
        6. Sunucuyu `bun run dev` ile başlat. Adresi yazar.
        7. İkinci bir terminalde aşağıdaki curl komutlarını çalıştır. `{"status":"ok"}`, bir hello mesajı ve bilinmeyen yol için 404 görmelisin.
        8. Ayarları dene: içinde `PORT=4000` satırı olan bir `.env` dosyası oluştur, sunucuyu durdur (Ctrl+C), tekrar başlat ve 4000'i dinlediğini gör. Sonra `.env`'i sil.
        9. `src/index.ts` içindeki hello mesajını değiştir, kaydet ve URL'yi tekrar çağır. `--hot` değişikliği yeniden başlatmadan aldı.
        10. Commit et: `git add .` ve `git commit -m "Add a web server"`.
    code:
      - file: src/config.ts
        lang: ts
        text: |
          // Settings come from environment variables, with a default for local work.
          // Bun.env is the same as process.env. We use Bun.env because it is read when the
          // program runs, even after it is compiled into one file (step "One file").
          export const config = {
            port: Number(Bun.env.PORT ?? 3000),
            dbPath: Bun.env.DB_PATH ?? "notely.db",
            production: Bun.env.NODE_ENV === "production",
            trustProxy: Bun.env.TRUST_PROXY === "1",
          };
      - file: src/index.ts
        lang: ts
        text: |
          import { config } from "./config";

          const server = Bun.serve({
            port: config.port,
            routes: {
              "/health": () => Response.json({ status: "ok" }),
              "/api/hello/:name": (req) => Response.json({ message: `Hello, ${req.params.name}` }),
            },
            fetch() {
              return Response.json({ error: "not found" }, { status: 404 });
            },
          });

          console.log(`Notely listening on ${server.url}`);
      - file: package.json
        lang: json
        text: |
          {
            "name": "notely",
            "module": "src/index.ts",
            "type": "module",
            "private": true,
            "scripts": {
              "dev": "bun --hot src/index.ts",
              "start": "bun src/index.ts",
              "typecheck": "bun check"
            },
            "devDependencies": {
              "@types/bun": "latest"
            },
            "peerDependencies": {
              "typescript": "^7"
            }
          }
      - file: .env.example
        lang: sh
        text: |
          # Copy to .env and change. Bun loads .env by itself.
          PORT=3000
          DB_PATH=notely.db
      - file: terminal
        lang: sh
        text: |
          curl -i localhost:3000/health
          curl localhost:3000/api/hello/Ada
          curl -i localhost:3000/nothing-here
    mistakes:
      - problem:
          en: "`error: Failed to start server. Is port 3000 in use?`"
          tr: "`error: Failed to start server. Is port 3000 in use?`"
        fix:
          en: "Another program (often an older copy of your own server) uses the port. Stop it, or start this one on another port: `PORT=4000 bun run dev`."
          tr: "Başka bir program (çoğu zaman kendi sunucunun eski kopyası) portu kullanıyor. Onu durdur ya da bunu başka portta başlat: `PORT=4000 bun run dev`."
      - problem:
          en: "Writing `process.env.PORT` and getting a string, then wondering why `PORT + 1` is `30001`."
          tr: "`process.env.PORT` yazıp bir string almak, sonra `PORT + 1`'in neden `30001` olduğuna şaşırmak."
        fix:
          en: "Environment variables are always text. Convert them: `Number(Bun.env.PORT)`."
          tr: "Ortam değişkenleri her zaman metindir. Çevir: `Number(Bun.env.PORT)`."
      - problem:
          en: "Committing a real `.env` with secrets."
          tr: "Sırlar içeren gerçek bir `.env` dosyasını commit etmek."
        fix:
          en: "`bun init` already ignores `.env` in `.gitignore`. Commit only `.env.example` with fake values."
          tr: "`bun init` `.env`'i zaten `.gitignore`'a yazar. Sadece sahte değerli `.env.example`'ı commit et."
    quiz:
      - q:
          en: "What answers a request to a path that no route matches?"
          tr: "Hiçbir route'a uymayan bir yola gelen isteğe kim cevap verir?"
        options:
          en:
            - "Bun crashes"
            - "The `fetch` function of `Bun.serve`"
            - "The `/health` route"
          tr:
            - "Bun çöker"
            - "`Bun.serve`'ün `fetch` fonksiyonu"
            - "`/health` route'u"
        answer: 1
        why:
          en: "`routes` handle the paths you list; `fetch` is the fallback, and here it returns a 404 JSON answer."
          tr: "`routes` yazdığın yolları karşılar; `fetch` yedektir ve burada 404 JSON cevabı döndürür."
    sources:
      - title: "Bun: HTTP server"
        url: https://bun.com/docs/runtime/http/server
      - title: "Bun: Routing"
        url: https://bun.com/docs/runtime/http/routing
      - title: "Bun: Environment variables"
        url: https://bun.com/docs/runtime/environment-variables

  - id: frontend
    stage: first-project
    title:
      en: "A page for your app, served by Bun"
      tr: "Uygulaman için Bun'ın sunduğu bir sayfa"
    minutes: 60
    needs: [server]
    why:
      en: "A full-stack app has a page people can use. In Bun you import an `.html` file into your server and put it in `routes`: Bun finds the scripts and styles the page links to, bundles them (TypeScript included) and serves them, with live reload while you develop. No Vite, no webpack, no extra config."
      tr: "Full-stack uygulamanın insanların kullanabileceği bir sayfası vardır. Bun'da bir `.html` dosyasını sunucuna import edip `routes` içine koyarsın: Bun sayfanın bağladığı script ve stilleri bulur, paketler (TypeScript dahil) ve geliştirirken canlı yenileme ile sunar. Vite yok, webpack yok, ek ayar yok."
    learn:
      en: |
        - HTML imports: `import home from "../public/index.html"` and `"/": home` in `routes`
        - A page is HTML (structure), CSS (looks) and TypeScript (behaviour); the browser fetches your API with `fetch()`
        - Why we write text into the page with `textContent` and not `innerHTML` (we come back to this in the security step)
        - Notes live in a plain array for now, so they are lost when the server restarts. The next step fixes that
      tr: |
        - HTML import'ları: `import home from "../public/index.html"` ve `routes` içinde `"/": home`
        - Sayfa HTML (yapı), CSS (görünüm) ve TypeScript'ten (davranış) oluşur; tarayıcı API'ne `fetch()` ile ulaşır
        - Metni sayfaya neden `innerHTML` ile değil `textContent` ile yazdığımız (güvenlik adımında geri döneceğiz)
        - Notlar şimdilik düz bir dizide durur, yani sunucu yeniden başlayınca kaybolur. Sonraki adım bunu düzeltir
    do:
      en: |
        1. Replace `tsconfig.json` with the file below. The only real change is `"lib": ["ESNext", "DOM"]`: `DOM` teaches TypeScript the browser's objects (`document`, `fetch`...), which the page code uses.
        2. Create the folder `public` with three files: `index.html`, `style.css` and `app.ts` (below).
        3. Replace `src/index.ts` with the version below. It imports the page and adds an API for notes that keeps them in memory.
        4. Run `bun run dev` and open http://localhost:3000. Add a few notes, delete one, reload the page.
        5. Restart the server (Ctrl+C, `bun run dev`) and reload: the notes are gone. They only lived in memory.
        6. Run `bun check`: it should report no errors in all files, including the browser code.
        7. Commit: `git add .` and `git commit -m "Add the notes page"`.
      tr: |
        1. `tsconfig.json`'u aşağıdaki dosyayla değiştir. Asıl değişiklik `"lib": ["ESNext", "DOM"]`: `DOM`, TypeScript'e sayfa kodunun kullandığı tarayıcı nesnelerini (`document`, `fetch`...) öğretir.
        2. `public` klasörünü üç dosyayla oluştur: `index.html`, `style.css` ve `app.ts` (aşağıda).
        3. `src/index.ts`'i aşağıdaki sürümle değiştir. Sayfayı import eder ve notları bellekte tutan bir API ekler.
        4. `bun run dev` çalıştır ve http://localhost:3000 adresini aç. Birkaç not ekle, birini sil, sayfayı yenile.
        5. Sunucuyu yeniden başlat (Ctrl+C, `bun run dev`) ve sayfayı yenile: notlar gitti. Sadece bellekte yaşıyorlardı.
        6. `bun check` çalıştır: tarayıcı kodu dahil bütün dosyalarda hata çıkmamalı.
        7. Commit et: `git add .` ve `git commit -m "Add the notes page"`.
    code:
      - file: tsconfig.json
        lang: json
        text: |
          {
            "compilerOptions": {
              "lib": ["ESNext", "DOM"],
              "target": "ESNext",
              "module": "Preserve",
              "moduleDetection": "force",
              "allowJs": true,
              "types": ["bun"],
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "verbatimModuleSyntax": true,
              "noEmit": true,
              "strict": true,
              "skipLibCheck": true,
              "noFallthroughCasesInSwitch": true,
              "noUncheckedIndexedAccess": true,
              "noImplicitOverride": true
            },
            "include": ["src", "public", "scripts"]
          }
      - file: public/index.html
        lang: html
        text: |
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Notely</title>
              <link rel="stylesheet" href="./style.css" />
            </head>
            <body>
              <main>
                <h1>Notely</h1>
                <form id="note-form">
                  <input id="note-text" maxlength="500" placeholder="Write a note" required />
                  <button type="submit">Add</button>
                </form>
                <ul id="notes"></ul>
                <p id="status" role="status"></p>
              </main>
              <script type="module" src="./app.ts"></script>
            </body>
          </html>
      - file: public/style.css
        lang: css
        text: |
          :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
          }
          body {
            margin: 0;
          }
          main {
            max-width: 32rem;
            margin: 2rem auto;
            padding: 0 1rem;
          }
          form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
          }
          input {
            flex: 1;
            min-width: 10rem;
            padding: 0.5rem;
          }
          button {
            padding: 0.5rem 0.9rem;
            cursor: pointer;
          }
          ul {
            list-style: none;
            padding: 0;
          }
          li {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #8884;
          }
          #status {
            color: #c0392b;
            min-height: 1.5rem;
          }
      - file: public/app.ts
        lang: ts
        text: |
          type Note = { id: number; text: string };

          const form = document.querySelector<HTMLFormElement>("#note-form")!;
          const input = document.querySelector<HTMLInputElement>("#note-text")!;
          const list = document.querySelector<HTMLUListElement>("#notes")!;
          const status = document.querySelector<HTMLParagraphElement>("#status")!;

          async function api<T>(path: string, init: RequestInit = {}): Promise<T> {
            const res = await fetch(path, {
              ...init,
              headers: { "content-type": "application/json" },
            });
            if (!res.ok) {
              const body = await res.json().catch(() => ({}));
              throw new Error(body.error ?? res.statusText);
            }
            return res.status === 204 ? (undefined as T) : res.json();
          }

          function render(notes: Note[]) {
            list.replaceChildren(
              ...notes.map((note) => {
                const item = document.createElement("li");
                const text = document.createElement("span");
                text.textContent = note.text; // textContent never runs HTML, unlike innerHTML
                const del = document.createElement("button");
                del.textContent = "Delete";
                del.addEventListener("click", () => run(async () => {
                  await api(`/api/notes/${note.id}`, { method: "DELETE" });
                  await load();
                }));
                item.append(text, del);
                return item;
              }),
            );
          }

          async function load() {
            render(await api<Note[]>("/api/notes"));
          }

          async function run(action: () => Promise<void>) {
            status.textContent = "";
            try {
              await action();
            } catch (err) {
              status.textContent = err instanceof Error ? err.message : "Something went wrong";
            }
          }

          form.addEventListener("submit", (event) => {
            event.preventDefault();
            run(async () => {
              await api("/api/notes", { method: "POST", body: JSON.stringify({ text: input.value }) });
              input.value = "";
              await load();
            });
          });

          run(load);
      - file: src/index.ts
        lang: ts
        text: |
          import home from "../public/index.html";
          import { config } from "./config";

          type Note = { id: number; text: string };
          const notes: Note[] = [];
          let nextId = 1;

          const server = Bun.serve({
            port: config.port,
            routes: {
              "/": home,
              "/health": () => Response.json({ status: "ok" }),
              "/api/notes": {
                GET: () => Response.json(notes),
                POST: async (req) => {
                  const body = (await req.json().catch(() => null)) as { text?: unknown } | null;
                  const text = typeof body?.text === "string" ? body.text.trim() : "";
                  if (text.length === 0 || text.length > 500) {
                    return Response.json({ error: "text must be 1 to 500 characters" }, { status: 400 });
                  }
                  const note = { id: nextId++, text };
                  notes.unshift(note);
                  return Response.json(note, { status: 201 });
                },
              },
              "/api/notes/:id": {
                DELETE: (req) => {
                  const index = notes.findIndex((n) => n.id === Number(req.params.id));
                  if (index === -1) return Response.json({ error: "note not found" }, { status: 404 });
                  notes.splice(index, 1);
                  return new Response(null, { status: 204 });
                },
              },
            },
            fetch() {
              return Response.json({ error: "not found" }, { status: 404 });
            },
          });

          console.log(`Notely listening on ${server.url}`);
    mistakes:
      - problem:
          en: "The page is blank and the browser console (F12) shows a 404 for the script."
          tr: "Sayfa bomboş ve tarayıcı konsolu (F12) script için 404 gösteriyor."
        fix:
          en: "The `src=\"./app.ts\"` path in `index.html` is relative to the HTML file. Check that `app.ts` is in `public/` next to `index.html`."
          tr: "`index.html` içindeki `src=\"./app.ts\"` yolu HTML dosyasına göredir. `app.ts`'in `public/` içinde, `index.html`'in yanında olduğunu kontrol et."
      - problem:
          en: "`bun check` complains that `document` or `HTMLElement` does not exist."
          tr: "`bun check` `document` ya da `HTMLElement`'in olmadığından şikâyet ediyor."
        fix:
          en: "The `DOM` entry is missing from `lib` in `tsconfig.json`."
          tr: "`tsconfig.json`'daki `lib` içinde `DOM` eksik."
      - problem:
          en: "Treating `bun run dev` as the production server."
          tr: "`bun run dev`'i production sunucusu sanmak."
        fix:
          en: "In development Bun bundles on demand and adds reload helpers. Production starts later with `NODE_ENV=production` and a build (the packaging steps)."
          tr: "Geliştirmede Bun isteğe göre paketler ve yenileme yardımcıları ekler. Production ileride `NODE_ENV=production` ve bir build ile başlar (paketleme adımları)."
    quiz:
      - q:
          en: "How does the browser get `app.ts` (TypeScript) if browsers only run JavaScript?"
          tr: "Tarayıcılar sadece JavaScript çalıştırdığına göre `app.ts`'i (TypeScript) nasıl alır?"
        options:
          en:
            - "Browsers run TypeScript now"
            - "Bun bundles the page and turns the TypeScript into JavaScript when it serves it"
            - "You must compile by hand first"
          tr:
            - "Tarayıcılar artık TypeScript çalıştırıyor"
            - "Bun sayfayı paketler ve sunarken TypeScript'i JavaScript'e çevirir"
            - "Önce elle derlemen gerekir"
        answer: 1
        why:
          en: "An HTML import makes Bun bundle the page's scripts and styles for you."
          tr: "HTML import'u, Bun'ın sayfanın script ve stillerini senin için paketlemesini sağlar."
    sources:
      - title: "Bun: Full-stack dev server"
        url: https://bun.com/docs/bundler/fullstack
      - title: "MDN: Using the Fetch API"
        url: https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch

  - id: database
    stage: data-api
    title:
      en: "Keep notes in SQLite"
      tr: "Notları SQLite'ta saklama"
    minutes: 50
    needs: [frontend]
    why:
      en: "Data that must survive a restart belongs in a database. SQLite is a whole database in one file, and `bun:sqlite` is built into Bun, so there is nothing to install or run. In this step you also split the code into small files, which keeps the app readable as it grows."
      tr: "Yeniden başlatmadan sağ çıkması gereken veri bir veritabanında durur. SQLite tek dosyada tam bir veritabanıdır ve `bun:sqlite` Bun'ın içinde hazır gelir; kurulacak ya da çalıştırılacak bir şey yok. Bu adımda ayrıca kodu küçük dosyalara bölersin; bu, uygulama büyürken okunabilir kalmasını sağlar."
    learn:
      en: |
        - Tables, rows and columns, and the SQL you need: `CREATE TABLE`, `INSERT`, `SELECT`, `DELETE`
        - Prepared queries with `db.query(sql)`: Bun compiles them once and reuses them
        - `?` placeholders: values are passed separately from the SQL text, so input can never change the query (this stops SQL injection)
        - `.all()` returns every row, `.get()` one row, `.run()` runs it and reports how many rows changed
        - `createServer(db, options)`: building the server in a function lets tests start their own copy later
      tr: |
        - Tablolar, satırlar ve sütunlar ve ihtiyacın olan SQL: `CREATE TABLE`, `INSERT`, `SELECT`, `DELETE`
        - `db.query(sql)` ile hazır sorgular: Bun onları bir kez derler ve yeniden kullanır
        - `?` yer tutucuları: değerler SQL metninden ayrı gönderilir, bu yüzden girdi sorguyu asla değiştiremez (SQL injection'ı bu engeller)
        - `.all()` bütün satırları, `.get()` tek satırı döndürür, `.run()` çalıştırır ve kaç satırın değiştiğini bildirir
        - `createServer(db, options)`: sunucuyu bir fonksiyonda kurmak, testlerin ileride kendi kopyasını başlatmasını sağlar
    do:
      en: |
        1. Create `src/http.ts`, `src/db.ts` and `src/notes.ts` (below).
        2. Create `src/server.ts`: it builds the server from the pieces. Then replace `src/index.ts`, which now only opens the database and starts the server.
        3. Run `bun run dev`. A file `notely.db` appears in the project folder (your database).
        4. Open http://localhost:3000, add notes, then restart the server and reload: the notes are still there.
        5. Try the API directly: `curl localhost:3000/api/notes`.
        6. Run `bun check`, then commit: `git add .` and `git commit -m "Store notes in SQLite"`. `notely.db` must not appear in `git status` (the `.gitignore` lines from the server step hide it).
      tr: |
        1. `src/http.ts`, `src/db.ts` ve `src/notes.ts` dosyalarını oluştur (aşağıda).
        2. `src/server.ts` dosyasını oluştur: sunucuyu parçalardan kurar. Sonra `src/index.ts`'i değiştir; artık sadece veritabanını açıp sunucuyu başlatıyor.
        3. `bun run dev` çalıştır. Proje klasöründe `notely.db` adında bir dosya belirir (veritabanın).
        4. http://localhost:3000 adresini aç, not ekle, sonra sunucuyu yeniden başlat ve sayfayı yenile: notlar hâlâ orada.
        5. API'yi doğrudan dene: `curl localhost:3000/api/notes`.
        6. `bun check` çalıştır, sonra commit et: `git add .` ve `git commit -m "Store notes in SQLite"`. `notely.db` `git status` içinde görünmemeli (sunucu adımındaki `.gitignore` satırları onu gizler).
    code:
      - file: src/http.ts
        lang: ts
        text: |
          export const fail = (status: number, error: string) => Response.json({ error }, { status });
      - file: src/db.ts
        lang: ts
        text: |
          import { Database } from "bun:sqlite";

          export type Note = { id: number; text: string; created_at: string };

          export function openDb(path: string): Database {
            const db = new Database(path, { create: true });
            db.run(`
              CREATE TABLE IF NOT EXISTS notes (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                text TEXT NOT NULL,
                created_at TEXT NOT NULL DEFAULT (datetime('now'))
              )
            `);
            return db;
          }
      - file: src/notes.ts
        lang: ts
        text: |
          import type { BunRequest } from "bun";
          import type { Database } from "bun:sqlite";
          import type { Note } from "./db";
          import { fail } from "./http";

          export function notesRoutes(db: Database) {
            const list = db.query<Note, []>("SELECT id, text, created_at FROM notes ORDER BY id DESC");
            const insert = db.query<Note, [string]>(
              "INSERT INTO notes (text) VALUES (?) RETURNING id, text, created_at",
            );
            const remove = db.query("DELETE FROM notes WHERE id = ?");

            return {
              "/api/notes": {
                GET: () => Response.json(list.all()),
                POST: async (req: Request) => {
                  const body = (await req.json().catch(() => null)) as { text?: unknown } | null;
                  const text = typeof body?.text === "string" ? body.text.trim() : "";
                  if (text.length === 0 || text.length > 500) {
                    return fail(400, "text must be 1 to 500 characters");
                  }
                  return Response.json(insert.get(text), { status: 201 });
                },
              },
              "/api/notes/:id": {
                DELETE: (req: BunRequest<"/api/notes/:id">) => {
                  const { changes } = remove.run(Number(req.params.id));
                  return changes === 0 ? fail(404, "note not found") : new Response(null, { status: 204 });
                },
              },
            };
          }
      - file: src/server.ts
        lang: ts
        text: |
          import type { Database } from "bun:sqlite";
          import home from "../public/index.html";
          import { fail } from "./http";
          import { notesRoutes } from "./notes";

          export type ServerOptions = { port?: number };

          export function createServer(db: Database, options: ServerOptions = {}) {
            return Bun.serve({
              port: options.port ?? 3000,
              routes: {
                "/": home,
                "/health": () => Response.json({ status: "ok" }),
                ...notesRoutes(db),
              },
              fetch() {
                return fail(404, "not found");
              },
            });
          }
      - file: src/index.ts
        lang: ts
        text: |
          import { config } from "./config";
          import { openDb } from "./db";
          import { createServer } from "./server";

          const db = openDb(config.dbPath);
          const server = createServer(db, { port: config.port });

          console.log(`Notely listening on ${server.url}`);
      - file: terminal
        lang: sh
        text: |
          curl localhost:3000/api/notes
          curl -X POST localhost:3000/api/notes \
            -H "content-type: application/json" \
            -d '{"text":"buy milk"}'
    mistakes:
      - problem:
          en: "Building SQL by joining strings, like `` `... WHERE id = ${id}` ``."
          tr: "SQL'i string birleştirerek kurmak, örneğin `` `... WHERE id = ${id}` ``."
        fix:
          en: "Always use `?` placeholders and pass the values to `.get()`, `.all()` or `.run()`. Joined strings let a user smuggle SQL into your query."
          tr: "Her zaman `?` yer tutucuları kullan ve değerleri `.get()`, `.all()` ya da `.run()`'a ver. Birleştirilmiş string, kullanıcının sorguna SQL sokmasına izin verir."
      - problem:
          en: "A query seems to do nothing."
          tr: "Bir sorgu hiçbir şey yapmıyor gibi."
        fix:
          en: "`db.query(...)` only prepares the query. Call `.all()`, `.get()` or `.run()` to execute it."
          tr: "`db.query(...)` sadece sorguyu hazırlar. Çalıştırmak için `.all()`, `.get()` ya da `.run()` çağır."
      - problem:
          en: "Committing `notely.db` to Git."
          tr: "`notely.db`'yi Git'e commit etmek."
        fix:
          en: "Check that `.gitignore` has `*.db` and `*.db-*`. If it is already committed, run `git rm --cached notely.db`."
          tr: "`.gitignore`'da `*.db` ve `*.db-*` olduğunu kontrol et. Zaten commit edildiyse `git rm --cached notely.db` çalıştır."
    quiz:
      - q:
          en: "Why do we write `WHERE id = ?` and pass the id separately?"
          tr: "`WHERE id = ?` yazıp id'yi neden ayrı veriyoruz?"
        options:
          en:
            - "It is faster to type"
            - "The value can never be read as SQL, which stops SQL injection"
            - "SQLite does not allow numbers in text"
          tr:
            - "Yazması daha hızlı"
            - "Değer asla SQL olarak okunamaz; bu SQL injection'ı engeller"
            - "SQLite metin içinde sayıya izin vermez"
        answer: 1
        why:
          en: "With placeholders the database treats the value as data only, never as part of the query."
          tr: "Yer tutucularla veritabanı değeri sadece veri olarak görür, sorgunun parçası olarak asla."
    sources:
      - title: "Bun: SQLite"
        url: https://bun.com/docs/runtime/sqlite
      - title: "SQLite: SQL language reference"
        url: https://www.sqlite.org/lang.html

  - id: accounts
    stage: data-api
    title:
      en: "Accounts, password hashing and sessions"
      tr: "Hesaplar, parola hash'leme ve oturumlar"
    minutes: 75
    needs: [database]
    why:
      en: "Right now everyone shares one list of notes. Real apps have accounts, and that means passwords. You must never store a password as typed: if the database leaks, every user is exposed. You store a hash instead, and Bun has a safe one built in."
      tr: "Şu an herkes tek bir not listesini paylaşıyor. Gerçek uygulamalarda hesap vardır ve bu parola demektir. Parolayı asla yazıldığı gibi saklamamalısın: veritabanı sızarsa her kullanıcı ortaya çıkar. Onun yerine hash saklarsın ve Bun'da güvenli olanı hazır gelir."
    learn:
      en: |
        - A hash is a one-way scramble of a password: you can check a password against it but not turn it back. `Bun.password.hash()` uses argon2id and adds a random salt, so two equal passwords get different hashes
        - `Bun.password.verify(password, hash)` checks a login attempt
        - Sessions: after login you give the browser a long random token in a cookie, and keep a record on the server of who it belongs to
        - Cookie flags: `httpOnly` (scripts on the page cannot read it), `sameSite: "lax"` (not sent with cross-site POSTs), `secure` (https only)
        - Why we store only a hash of the session token, and why a wrong email and a wrong password get the same answer and take the same time
      tr: |
        - Hash, parolanın tek yönlü karıştırılmış halidir: parolayı onunla kontrol edebilirsin ama geri çeviremezsin. `Bun.password.hash()` argon2id kullanır ve rastgele bir tuz (salt) ekler; bu yüzden aynı iki parola farklı hash alır
        - `Bun.password.verify(password, hash)` giriş denemesini kontrol eder
        - Oturumlar: girişten sonra tarayıcıya cookie içinde uzun rastgele bir token verirsin ve sunucuda bunun kime ait olduğunu kaydedersin
        - Cookie bayrakları: `httpOnly` (sayfadaki script'ler okuyamaz), `sameSite: "lax"` (siteler arası POST'larla gönderilmez), `secure` (sadece https)
        - Oturum token'ının neden sadece hash'ini sakladığımız ve yanlış e-posta ile yanlış parolaya neden aynı cevabı verip aynı sürede cevapladığımız
    do:
      en: |
        1. Stop the server and delete the old database (`rm notely.db*`; PowerShell: `del notely.db*`). The `notes` table gets a new column, and `CREATE TABLE IF NOT EXISTS` does not change a table that already exists. Your test notes are not worth keeping.
        2. Replace `src/db.ts`, `src/notes.ts`, `src/server.ts` and `src/index.ts` with the versions below, and create `src/auth.ts`.
        3. Run `bun run dev`. Then try the account commands below in order: register, ask who you are, add a note, log out, ask again. `-c cookies.txt` saves the cookie curl receives and `-b cookies.txt` sends it back, like a browser does.
        4. Look at the `Set-Cookie` line in the output of the register command (we used `curl -i`): it shows `HttpOnly` and `SameSite=Lax`.
        5. Open the database with `bun -e 'import {Database} from "bun:sqlite"; console.log(new Database("notely.db").query("select email, password_hash from users").all())'`. The password column holds a long `$argon2id$...` text, not your password.
        6. Run `bun check` and commit: `git add .` and `git commit -m "Add accounts and sessions"`. Do not commit `cookies.txt` (delete it).
      tr: |
        1. Sunucuyu durdur ve eski veritabanını sil (`rm notely.db*`; PowerShell: `del notely.db*`). `notes` tablosu yeni bir sütun alıyor ve `CREATE TABLE IF NOT EXISTS` zaten var olan tabloyu değiştirmez. Deneme notlarını saklamaya değmez.
        2. `src/db.ts`, `src/notes.ts`, `src/server.ts` ve `src/index.ts`'i aşağıdaki sürümlerle değiştir, ve `src/auth.ts`'i oluştur.
        3. `bun run dev` çalıştır. Sonra aşağıdaki hesap komutlarını sırayla dene: kayıt ol, kim olduğunu sor, not ekle, çıkış yap, tekrar sor. `-c cookies.txt` curl'ün aldığı cookie'yi kaydeder, `-b cookies.txt` onu bir tarayıcı gibi geri gönderir.
        4. Kayıt komutunun çıktısındaki (`curl -i` kullandık) `Set-Cookie` satırına bak: `HttpOnly` ve `SameSite=Lax` yazar.
        5. Veritabanını `bun -e 'import {Database} from "bun:sqlite"; console.log(new Database("notely.db").query("select email, password_hash from users").all())'` ile aç. Parola sütununda senin parolan değil, uzun bir `$argon2id$...` metni vardır.
        6. `bun check` çalıştır ve commit et: `git add .` ve `git commit -m "Add accounts and sessions"`. `cookies.txt`'yi commit etme (sil).
    code:
      - file: src/db.ts
        lang: ts
        text: |
          import { Database } from "bun:sqlite";

          export type Note = { id: number; text: string; created_at: string };

          export function openDb(path: string): Database {
            const db = new Database(path, { create: true });
            db.run("PRAGMA foreign_keys = ON");
            db.run(`
              CREATE TABLE IF NOT EXISTS users (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                email TEXT NOT NULL UNIQUE,
                password_hash TEXT NOT NULL,
                created_at TEXT NOT NULL DEFAULT (datetime('now'))
              )
            `);
            db.run(`
              CREATE TABLE IF NOT EXISTS sessions (
                token_hash TEXT PRIMARY KEY,
                user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                expires_at INTEGER NOT NULL
              )
            `);
            db.run(`
              CREATE TABLE IF NOT EXISTS notes (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                text TEXT NOT NULL,
                created_at TEXT NOT NULL DEFAULT (datetime('now'))
              )
            `);
            return db;
          }
      - file: src/auth.ts
        lang: ts
        text: |
          import type { BunRequest } from "bun";
          import type { Database } from "bun:sqlite";
          import { fail } from "./http";

          export type User = { id: number; email: string };

          const SESSION_SECONDS = 7 * 24 * 60 * 60;
          const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
          // Used when the email is unknown, so a wrong email takes as long as a wrong password.
          // It is a promise that starts now; we await it only when we need it.
          const dummyHash = Bun.password.hash("not-a-real-password");

          const sha256 = (value: string) => new Bun.CryptoHasher("sha256").update(value).digest("hex");
          const now = () => Math.floor(Date.now() / 1000);

          async function readCredentials(req: Request) {
            const body = (await req.json().catch(() => null)) as Record<string, unknown> | null;
            const email = typeof body?.email === "string" ? body.email.trim().toLowerCase() : "";
            const password = typeof body?.password === "string" ? body.password : "";
            if (email.length > 254 || !EMAIL.test(email)) return "enter a valid email address";
            if (password.length < 8 || password.length > 128) return "password must be 8 to 128 characters";
            return { email, password };
          }

          export function createAuth(db: Database, secure: boolean) {
            const findUser = db.query<{ id: number; password_hash: string }, [string]>(
              "SELECT id, password_hash FROM users WHERE email = ?",
            );
            const addUser = db.query<User, [string, string]>(
              "INSERT INTO users (email, password_hash) VALUES (?, ?) RETURNING id, email",
            );
            const addSession = db.query("INSERT INTO sessions (token_hash, user_id, expires_at) VALUES (?, ?, ?)");
            const findSession = db.query<User, [string, number]>(`
              SELECT users.id, users.email FROM sessions
              JOIN users ON users.id = sessions.user_id
              WHERE sessions.token_hash = ? AND sessions.expires_at > ?
            `);
            const dropSession = db.query("DELETE FROM sessions WHERE token_hash = ?");

            function startSession(req: BunRequest, userId: number) {
              const token = Buffer.from(crypto.getRandomValues(new Uint8Array(32))).toString("hex");
              addSession.run(sha256(token), userId, now() + SESSION_SECONDS);
              req.cookies.set("session", token, {
                httpOnly: true, // JavaScript in the page cannot read it
                sameSite: "lax", // not sent with cross-site POST requests
                secure, // https only, turned on in production
                maxAge: SESSION_SECONDS,
                path: "/",
              });
            }

            function currentUser(req: BunRequest): User | null {
              const token = req.cookies.get("session");
              return token ? (findSession.get(sha256(token), now()) ?? null) : null;
            }

            return {
              currentUser,

              register: async (req: BunRequest) => {
                const credentials = await readCredentials(req);
                if (typeof credentials === "string") return fail(400, credentials);
                try {
                  const user = addUser.get(credentials.email, await Bun.password.hash(credentials.password))!;
                  startSession(req, user.id);
                  return Response.json(user, { status: 201 });
                } catch (err) {
                  if (err instanceof Error && err.message.includes("UNIQUE")) {
                    return fail(409, "that email is already registered");
                  }
                  throw err;
                }
              },

              login: async (req: BunRequest) => {
                const credentials = await readCredentials(req);
                if (typeof credentials === "string") return fail(400, credentials);
                const row = findUser.get(credentials.email);
                const ok = await Bun.password.verify(credentials.password, row?.password_hash ?? (await dummyHash));
                if (!row || !ok) return fail(401, "wrong email or password");
                startSession(req, row.id);
                return Response.json({ id: row.id, email: credentials.email });
              },

              logout: (req: BunRequest) => {
                const token = req.cookies.get("session");
                if (token) dropSession.run(sha256(token));
                req.cookies.delete({ name: "session", path: "/" });
                return new Response(null, { status: 204 });
              },

              me: (req: BunRequest) => {
                const user = currentUser(req);
                return user ? Response.json(user) : fail(401, "log in first");
              },
            };
          }
      - file: src/notes.ts
        lang: ts
        text: |
          import type { BunRequest } from "bun";
          import type { Database } from "bun:sqlite";
          import type { User } from "./auth";
          import type { Note } from "./db";
          import { fail } from "./http";

          export function notesRoutes(db: Database, currentUser: (req: BunRequest) => User | null) {
            const list = db.query<Note, [number]>(
              "SELECT id, text, created_at FROM notes WHERE user_id = ? ORDER BY id DESC",
            );
            const insert = db.query<Note, [number, string]>(
              "INSERT INTO notes (user_id, text) VALUES (?, ?) RETURNING id, text, created_at",
            );
            const remove = db.query("DELETE FROM notes WHERE id = ? AND user_id = ?");

            return {
              "/api/notes": {
                GET: (req: BunRequest) => {
                  const user = currentUser(req);
                  return user ? Response.json(list.all(user.id)) : fail(401, "log in first");
                },
                POST: async (req: BunRequest) => {
                  const user = currentUser(req);
                  if (!user) return fail(401, "log in first");
                  const body = (await req.json().catch(() => null)) as { text?: unknown } | null;
                  const text = typeof body?.text === "string" ? body.text.trim() : "";
                  if (text.length === 0 || text.length > 500) {
                    return fail(400, "text must be 1 to 500 characters");
                  }
                  return Response.json(insert.get(user.id, text), { status: 201 });
                },
              },
              "/api/notes/:id": {
                DELETE: (req: BunRequest<"/api/notes/:id">) => {
                  const user = currentUser(req);
                  if (!user) return fail(401, "log in first");
                  const { changes } = remove.run(Number(req.params.id), user.id);
                  return changes === 0 ? fail(404, "note not found") : new Response(null, { status: 204 });
                },
              },
            };
          }
      - file: src/server.ts
        lang: ts
        text: |
          import type { Database } from "bun:sqlite";
          import home from "../public/index.html";
          import { createAuth } from "./auth";
          import { fail } from "./http";
          import { notesRoutes } from "./notes";

          export type ServerOptions = { port?: number; secure?: boolean };

          export function createServer(db: Database, options: ServerOptions = {}) {
            const auth = createAuth(db, options.secure ?? false);
            return Bun.serve({
              port: options.port ?? 3000,
              routes: {
                "/": home,
                "/health": () => Response.json({ status: "ok" }),
                "/api/auth/register": { POST: auth.register },
                "/api/auth/login": { POST: auth.login },
                "/api/auth/logout": { POST: auth.logout },
                "/api/me": { GET: auth.me },
                ...notesRoutes(db, auth.currentUser),
              },
              fetch() {
                return fail(404, "not found");
              },
            });
          }
      - file: src/index.ts
        lang: ts
        text: |
          import { config } from "./config";
          import { openDb } from "./db";
          import { createServer } from "./server";

          const db = openDb(config.dbPath);
          const server = createServer(db, { port: config.port, secure: config.production });

          console.log(`Notely listening on ${server.url}`);
