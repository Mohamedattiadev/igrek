            -d '{"email":"ada@example.com","password":"correct horse battery"}'
          curl -b cookies.txt localhost:3000/api/me
          curl -b cookies.txt -X POST localhost:3000/api/notes \
            -H "content-type: application/json" \
            -d '{"text":"my first note"}'
          curl -b cookies.txt -X POST localhost:3000/api/auth/logout
          curl localhost:3000/api/me
    mistakes:
      - problem:
          en: "`SQLiteError: table notes has no column named user_id` (or `NOT NULL constraint failed`)."
          tr: "`SQLiteError: table notes has no column named user_id` (ya da `NOT NULL constraint failed`)."
        fix:
          en: "You still have the database from the previous step. Stop the server, delete `notely.db*` and start again. Later, real changes to a table need a migration (an `ALTER TABLE` you run once)."
          tr: "Önceki adımdan kalma veritabanın duruyor. Sunucuyu durdur, `notely.db*` dosyalarını sil ve tekrar başlat. İleride bir tabloda gerçek değişiklik için migration gerekir (bir kez çalıştırdığın `ALTER TABLE`)."
      - problem:
          en: "Comparing hashes yourself with `===`, or hashing the password twice and comparing."
          tr: "Hash'leri kendin `===` ile karşılaştırmak ya da parolayı iki kez hash'leyip karşılaştırmak."
        fix:
          en: "Every hash contains its own random salt, so hashing the same password again gives a different text. Always call `Bun.password.verify(password, storedHash)`."
          tr: "Her hash kendi rastgele tuzunu taşır; aynı parolayı tekrar hash'lemek farklı bir metin verir. Her zaman `Bun.password.verify(password, storedHash)` çağır."
      - problem:
          en: "`curl` says `{\"error\":\"log in first\"}` even though you registered."
          tr: "Kayıt olmana rağmen `curl` `{\"error\":\"log in first\"}` diyor."
        fix:
          en: "You forgot `-b cookies.txt` (send the cookie) on that command, or `-c cookies.txt` (save it) on the register command."
          tr: "O komutta `-b cookies.txt` (cookie'yi gönder) ya da kayıt komutunda `-c cookies.txt` (kaydet) yazmayı unuttun."
    quiz:
      - q:
          en: "Why does the database store `password_hash` and not the password?"
          tr: "Veritabanı neden parolayı değil `password_hash`'i saklıyor?"
        options:
          en:
            - "Hashes are shorter"
            - "If the database leaks, the real passwords still cannot be read"
            - "Bun cannot store plain text"
          tr:
            - "Hash'ler daha kısa"
            - "Veritabanı sızsa bile gerçek parolalar okunamaz"
            - "Bun düz metin saklayamaz"
        answer: 1
        why:
          en: "A hash cannot be turned back into the password, so a leaked database does not hand out the passwords."
          tr: "Hash parolaya geri çevrilemez; bu yüzden sızan bir veritabanı parolaları vermez."
      - q:
          en: "What does the `httpOnly` cookie flag do?"
          tr: "`httpOnly` cookie bayrağı ne yapar?"
        options:
          en:
            - "Makes the cookie https only"
            - "Keeps JavaScript on the page from reading the cookie"
            - "Deletes the cookie after one request"
          tr:
            - "Cookie'yi sadece https yapar"
            - "Sayfadaki JavaScript'in cookie'yi okumasını engeller"
            - "Cookie'yi bir istekten sonra siler"
        answer: 1
        why:
          en: "`httpOnly` hides the cookie from scripts, so an injected script cannot steal the session. `secure` is the https-only flag."
          tr: "`httpOnly` cookie'yi script'lerden gizler; böylece enjekte edilen bir script oturumu çalamaz. Sadece https bayrağı `secure`'dür."
    sources:
      - title: "Bun: Password and hashing"
        url: https://bun.com/docs/runtime/hashing
      - title: "Bun: Cookies"
        url: https://bun.com/docs/runtime/http/cookies
