  - id: secure-storage
    stage: security
    title:
      en: "Keep secrets safe with secure storage"
      tr: "Güvenli depolama ile sırları koruma"
    minutes: 50
    needs: [tests]
    why:
      en: "A login token or a key is a secret. `shared_preferences` writes plain text that other tools can read. `flutter_secure_storage` keeps values in the Android Keystore and the iOS Keychain, which are made for this. We add a small settings screen that stores an optional backup token the safe way."
      tr: "Bir giriş token'ı ya da anahtar bir sırdır. `shared_preferences` başka araçların okuyabileceği düz metin yazar. `flutter_secure_storage` değerleri bunun için yapılmış Android Keystore ve iOS Keychain içinde tutar. Güvenli yoldan isteğe bağlı bir yedekleme token'ı saklayan küçük bir ayarlar ekranı ekliyoruz."
    learn:
      en: |
        - What belongs in secure storage (tokens, keys) and what does not (the habit list)
        - `FlutterSecureStorage`: `write`, `read`, `delete`
        - The honest limit: a secret that is compiled into the app (an API key in the code) is not a secret, because anyone can unpack the app
        - Web: secure storage there is experimental and weaker, so do not rely on it
      tr: |
        - Güvenli depolamaya ne girer (token'lar, anahtarlar) ve ne girmez (alışkanlık listesi)
        - `FlutterSecureStorage`: `write`, `read`, `delete`
        - Dürüst sınır: uygulamanın içine derlenmiş bir sır (kodda bir API anahtarı) sır değildir, çünkü herkes uygulamayı açıp bakabilir
        - Web: orada güvenli depolama deneysel ve daha zayıftır; ona güvenme
    do:
      en: |
        1. Add the package: `flutter pub add flutter_secure_storage`.
        2. Create `lib/data/token_store.dart` and `lib/screens/settings_screen.dart` below.
        3. Add the route `GoRoute(path: 'settings', builder: (context, state) => const SettingsScreen())` next to the others in `lib/router.dart`, and import the screen.
        4. In `lib/screens/home_screen.dart` give the `AppBar` an action: `actions: [IconButton(onPressed: () => context.go('/settings'), icon: const Icon(Icons.settings), tooltip: 'Settings')]`.
        5. Run it on Chrome or, after the Android step, on a phone. Save a token, restart the app and see that it says a token is saved. The screen never shows the token again.
        6. If the Android build later complains about `minSdkVersion`, the package needs Android 6.0 (API 23) or newer: set `minSdk = 23` (or higher) in `android/app/build.gradle.kts`.
      tr: |
        1. Paketi ekle: `flutter pub add flutter_secure_storage`.
        2. Aşağıdaki `lib/data/token_store.dart` ve `lib/screens/settings_screen.dart` dosyalarını oluştur.
        3. `lib/router.dart` içinde diğerlerinin yanına `GoRoute(path: 'settings', builder: (context, state) => const SettingsScreen())` rotasını ekle ve ekranı import et.
        4. `lib/screens/home_screen.dart` içinde `AppBar`'a bir eylem ver: `actions: [IconButton(onPressed: () => context.go('/settings'), icon: const Icon(Icons.settings), tooltip: 'Settings')]`.
        5. Chrome'da ya da Android adımından sonra telefonda çalıştır. Bir token kaydet, uygulamayı yeniden başlat ve bir token kayıtlı olduğunu yazdığını gör. Ekran token'ı bir daha göstermez.
        6. Android build'i sonradan `minSdkVersion` hakkında şikâyet ederse: paket Android 6.0 (API 23) veya üstünü ister; `android/app/build.gradle.kts` içinde `minSdk = 23` (ya da daha yüksek) yaz.
    code:
      - file: terminal
        lang: sh
        text: |
          flutter pub add flutter_secure_storage
      - file: lib/data/token_store.dart
        lang: dart
        text: |
          import 'package:flutter_secure_storage/flutter_secure_storage.dart';

          class TokenStore {
            TokenStore([FlutterSecureStorage? storage])
                : _storage = storage ?? const FlutterSecureStorage();

            static const _key = 'backup_token';
            final FlutterSecureStorage _storage;

            Future<String?> read() => _storage.read(key: _key);
            Future<void> save(String token) => _storage.write(key: _key, value: token);
            Future<void> clear() => _storage.delete(key: _key);
          }
      - file: lib/screens/settings_screen.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';

          import '../data/token_store.dart';

          class SettingsScreen extends StatefulWidget {
            const SettingsScreen({super.key});

            @override
            State<SettingsScreen> createState() => _SettingsScreenState();
          }

          class _SettingsScreenState extends State<SettingsScreen> {
            final _tokens = TokenStore();
            final _controller = TextEditingController();
            String _status = 'Checking...';

            @override
            void initState() {
              super.initState();
              _refresh();
            }

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            Future<void> _refresh() async {
              final token = await _tokens.read();
              if (!mounted) return;
              setState(() => _status = token == null ? 'No token saved.' : 'A token is saved.');
            }

            Future<void> _save() async {
              final text = _controller.text.trim();
              if (text.isEmpty) return;
              await _tokens.save(text);
              _controller.clear();
              await _refresh();
            }

            Future<void> _clear() async {
              await _tokens.clear();
              await _refresh();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Settings')),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(_status),
                      const SizedBox(height: 16),
                      TextField(
                        controller: _controller,
                        obscureText: true,
                        decoration: const InputDecoration(labelText: 'Backup token'),
                      ),
                      const SizedBox(height: 16),
                      Row(
                        children: [
                          FilledButton(onPressed: _save, child: const Text('Save')),
                          const SizedBox(width: 8),
                          TextButton(onPressed: _clear, child: const Text('Remove')),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }
    mistakes:
      - problem:
          en: "Putting an API key into the Dart code or `--dart-define` and calling it secure."
          tr: "Bir API anahtarını Dart koduna ya da `--dart-define`'a koyup güvenli saymak."
        fix:
          en: "Both end up inside the app file, and anyone can extract them. A real secret belongs on a server that your app asks; the app should only hold a short-lived token the user got by signing in."
          tr: "İkisi de uygulama dosyasının içine girer ve herkes çıkarabilir. Gerçek bir sır, uygulamanın sorduğu bir sunucuda durmalı; uygulama sadece kullanıcının giriş yapınca aldığı kısa ömürlü bir token tutmalı."
      - problem:
          en: "Printing a token with `print` while debugging and leaving it in."
          tr: "Hata ayıklarken bir token'ı `print` ile yazdırıp bırakmak."
        fix:
          en: "Logs end up in crash reports and device logs. Never log tokens, passwords or personal data."
          tr: "Loglar çökme raporlarına ve cihaz loglarına girer. Token, parola ya da kişisel veriyi asla loglama."
    quiz:
      - q:
          en: "Where should a login token be stored?"
          tr: "Bir giriş token'ı nerede saklanmalı?"
        options:
          en:
            - "In shared_preferences"
            - "In flutter_secure_storage"
            - "In a constant in the Dart code"
          tr:
            - "shared_preferences içinde"
            - "flutter_secure_storage içinde"
            - "Dart kodunda bir sabitte"
        answer: 1
        why:
          en: "Secure storage uses the Keystore (Android) and Keychain (iOS). The other two are readable by anyone who looks."
          tr: "Güvenli depolama Keystore'u (Android) ve Keychain'i (iOS) kullanır. Diğer ikisini bakan herkes okuyabilir."
    sources:
      - title: flutter_secure_storage package
        url: https://pub.dev/packages/flutter_secure_storage
      - title: Flutter security
        url: https://docs.flutter.dev/security
      - title: Android Keystore system
        url: https://developer.android.com/privacy-and-security/keystore

  - id: performance
    stage: performance
    title:
      en: "Fast screens: const, lazy lists and DevTools"
      tr: "Hızlı ekranlar: const, tembel listeler ve DevTools"
    minutes: 60
    needs: [secure-storage]
    why:
      en: "Flutter draws up to 60 or 120 frames per second, so one frame has about 16 ms (or 8 ms). If your `build` code is slow or builds things nobody sees, the app stutters (jank). Three habits fix most problems: `const` widgets, lazy lists and measuring before guessing."
      tr: "Flutter saniyede 60 ya da 120 kare çizer; yani bir kare için yaklaşık 16 ms (ya da 8 ms) vardır. `build` kodun yavaşsa ya da kimsenin görmediği şeyleri kuruyorsa uygulama takılır (jank). Üç alışkanlık sorunların çoğunu çözer: `const` widget'lar, tembel listeler ve tahmin etmeden önce ölçmek."
    learn:
      en: |
        - `const` widgets are reused, so their subtree is not rebuilt
        - `ListView.builder` builds only the items on screen; a `ListView(children: [...])` builds all of them
        - Keep `build` cheap and keep `setState` or `Consumer` low in the tree
        - Profile mode and the DevTools Performance view: UI thread, raster thread, red janky frames
      tr: |
        - `const` widget'lar yeniden kullanılır, bu yüzden alt ağaçları yeniden kurulmaz
        - `ListView.builder` sadece ekrandaki öğeleri kurar; `ListView(children: [...])` hepsini kurar
        - `build`'i ucuz tut; `setState` ya da `Consumer`'ı ağaçta aşağıda kullan
        - Profile modu ve DevTools Performance görünümü: UI thread, raster thread, kırmızı takılan kareler
    do:
      en: |
        1. Change the habit list in `lib/screens/home_screen.dart` to `ListView.builder` (code below). The quote card is item 0, the empty message and the habits follow.
        2. Run `flutter analyze`. The linter suggests `const` in many places; add `const` where it says so.
        3. Make a big list to feel the difference: temporarily put `MemoryHabitStore([for (var i = 0; i < 500; i++) Habit(id: '$i', name: 'Habit $i')])` in `main.dart` instead of the prefs store. Scroll the list.
        4. Run in profile mode on a real device: `flutter run --profile`. (Debug mode is much slower and says nothing about the real speed. The browser works too, but a phone is the honest test.) Open DevTools from the link the terminal prints, or from VS Code (*Command Palette → Open DevTools*), and open the **Performance** tab.
        5. Scroll and watch the frame bars. Frames over about 16 ms are red. Click a red frame and read the hint.
        6. Put the real store back in `main.dart`.
      tr: |
        1. `lib/screens/home_screen.dart` içindeki alışkanlık listesini `ListView.builder`'a çevir (kod aşağıda). Söz kartı 0. öğe; boş mesajı ve alışkanlıklar arkasından gelir.
        2. `flutter analyze` çalıştır. Linter birçok yerde `const` önerir; söylediği yerlere `const` ekle.
        3. Farkı hissetmek için büyük bir liste yap: `main.dart` içinde geçici olarak prefs store yerine `MemoryHabitStore([for (var i = 0; i < 500; i++) Habit(id: '$i', name: 'Habit $i')])` yaz. Listeyi kaydır.
        4. Gerçek bir cihazda profile modunda çalıştır: `flutter run --profile`. (Debug modu çok daha yavaştır ve gerçek hız hakkında bir şey söylemez. Tarayıcı da olur ama dürüst test telefondur.) DevTools'u terminalin yazdığı bağlantıdan ya da VS Code'dan (*Command Palette → Open DevTools*) aç ve **Performance** sekmesine gir.
        5. Kaydır ve kare çubuklarına bak. Yaklaşık 16 ms'yi geçen kareler kırmızıdır. Kırmızı bir kareye tıkla ve ipucunu oku.
        6. Gerçek store'u `main.dart`'a geri koy.
    code:
      - file: lib/screens/home_screen.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:go_router/go_router.dart';
          import 'package:provider/provider.dart';

          import '../state/habits_model.dart';
          import '../widgets/habit_tile.dart';
          import '../widgets/quote_card.dart';

          class HomeScreen extends StatelessWidget {
            const HomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Habits'),
                  actions: [
                    IconButton(
                      onPressed: () => context.go('/settings'),
                      icon: const Icon(Icons.settings),
                      tooltip: 'Settings',
                    ),
                  ],
                ),
                body: Consumer<HabitsModel>(
                  builder: (context, model, _) {
                    if (!model.loaded) {
                      return const Center(child: CircularProgressIndicator());
                    }
                    final habits = model.habits;
                    // Item 0 is the quote card; one more item is the empty message.
                    final extra = habits.isEmpty ? 2 : 1;
                    return ListView.builder(
                      padding: const EdgeInsets.all(16),
                      itemCount: habits.length + extra,
                      itemBuilder: (context, index) {
                        if (index == 0) return const QuoteCard();
                        if (habits.isEmpty) {
                          return const Padding(
                            padding: EdgeInsets.all(24),
                            child: Text('No habits yet. Tap + to add your first one.'),
                          );
                        }
                        final habit = habits[index - 1];
                        return HabitTile(
                          key: ValueKey(habit.id),
                          habit: habit,
                          today: model.today,
                          onToggle: () => model.toggle(habit.id),
                          onTap: () => context.go('/habit/${habit.id}'),
                        );
                      },
                    );
                  },
                ),
                floatingActionButton: FloatingActionButton(
                  onPressed: () => context.go('/add'),
                  tooltip: 'Add habit',
                  child: const Icon(Icons.add),
                ),
              );
            }
          }
      - file: terminal
        lang: sh
        text: |
          flutter analyze
          flutter run --profile
    mistakes:
      - problem:
          en: "Judging speed in debug mode (or in the emulator) and starting to \"optimize\" things that are fine."
          tr: "Hızı debug modunda (ya da emülatörde) değerlendirip sorunsuz şeyleri \"optimize\" etmeye başlamak."
        fix:
          en: "Debug builds are slow on purpose. Measure in profile mode on a real device, find the red frame, and only then change code."
          tr: "Debug build'ler bilerek yavaştır. Gerçek bir cihazda profile modunda ölç, kırmızı kareyi bul ve ancak sonra kodu değiştir."
      - problem:
          en: "Calling `setState` or watching the whole model high up in the tree, so the whole screen rebuilds for one small change."
          tr: "`setState`'i ya da bütün modeli ağacın üst yerlerinde dinlemek; küçük bir değişiklik için bütün ekran yeniden kurulur."
        fix:
          en: "Move the part that changes into its own small widget and listen there. `context.select` lets a widget rebuild only when one value it cares about changes."
          tr: "Değişen kısmı kendi küçük widget'ına taşı ve orada dinle. `context.select`, bir widget'ın sadece ilgilendiği tek bir değer değişince yeniden kurulmasını sağlar."
    quiz:
      - q:
          en: "Why use `ListView.builder` for a long list?"
          tr: "Uzun bir liste için neden `ListView.builder` kullanılır?"
        options:
          en:
            - "It builds only the items that are on screen"
            - "It sorts the list"
            - "It makes the list save itself"
          tr:
            - "Sadece ekrandaki öğeleri kurar"
            - "Listeyi sıralar"
            - "Listenin kendini kaydetmesini sağlar"
        answer: 0
        why:
          en: "Items are built lazily while you scroll, so the cost does not grow with the length of the list."
          tr: "Öğeler kaydırdıkça tembel biçimde kurulur; maliyet listenin uzunluğuyla artmaz."
    sources:
      - title: Performance best practices
        url: https://docs.flutter.dev/perf/best-practices
      - title: Use the Performance view (DevTools)
        url: https://docs.flutter.dev/tools/devtools/performance
      - title: Flutter build modes
        url: https://docs.flutter.dev/testing/build-modes

  - id: app-icon
    stage: packaging
    title:
      en: "Set up Android, then add an app icon and a splash screen"
      tr: "Android'i hazırlama, sonra uygulama ikonu ve açılış ekranı ekleme"
    minutes: 90
    needs: [performance]
    why:
      en: "So far the app ran in a browser. To build an Android app you need the Android toolchain (Android Studio brings it), and a phone or an emulator to try it on. A release also needs its own icon and a splash screen (the picture shown while the app starts), or it shows the default Flutter logo."
      tr: "Şimdiye kadar uygulama tarayıcıda çalıştı. Bir Android uygulaması derlemek için Android toolchain'e (Android Studio getirir) ve denemek için bir telefona ya da emülatöre ihtiyacın var. Bir sürüm için ayrıca kendi ikonu ve açılış ekranı (uygulama başlarken gösterilen resim) gerekir; yoksa varsayılan Flutter logosu görünür."
    learn:
      en: |
        - What Android Studio gives Flutter: the Android SDK, a device manager and licences
        - Running the app on a real phone (USB debugging) or on an emulator
        - Adaptive icons on Android: a background and a foreground that the phone crops to a shape
        - Generating all icon sizes from one big picture with `flutter_launcher_icons`, and the splash with `flutter_native_splash`
      tr: |
        - Android Studio'nun Flutter'a ne verdiği: Android SDK, bir cihaz yöneticisi ve lisanslar
        - Uygulamayı gerçek bir telefonda (USB hata ayıklama) ya da emülatörde çalıştırmak
        - Android'de uyarlanabilir (adaptive) ikonlar: telefonun bir şekle kırptığı arka plan ve ön plan
        - `flutter_launcher_icons` ile tek bir büyük resimden bütün ikon boyutlarını, `flutter_native_splash` ile açılış ekranını üretmek
    do:
      en: |
        1. Install **Android Studio** (developer.android.com/studio) and open it once. Let the setup wizard install the Android SDK.
        2. In Android Studio open *Settings → Languages & Frameworks → Android SDK → SDK Tools* and tick **Android SDK Command-line Tools (latest)**, then apply.
        3. Run `flutter doctor --android-licenses` and answer `y` to the licences. Then `flutter doctor`: the Android toolchain line should be green.
        4. Get a device. **Phone:** open *Settings → About phone*, tap *Build number* seven times, then turn on *Developer options → USB debugging* and plug the phone in. **Emulator:** in Android Studio open *Device Manager* and create a virtual phone. Run `flutter devices` to see it.
        5. Run `flutter run -d <device id>`. The default icon is still the Flutter logo.
        6. Make two 1024x1024 PNG pictures in `assets/icon/`: `icon.png` (full square) and `icon_foreground.png` (the symbol on a transparent background, kept in the middle). Draw them in any image editor, or use the ImageMagick commands below for a simple white circle.
        7. Add the two packages as dev dependencies and put the two configuration blocks at the end of `pubspec.yaml`, as top-level keys (not indented).
        8. Run both generator commands, then `flutter run` again. You see the new icon on the phone and in the browser tab, and your own colour while the app starts.
      tr: |
        1. **Android Studio**'yu kur (developer.android.com/studio) ve bir kez aç. Kurulum sihirbazının Android SDK'yı kurmasına izin ver.
        2. Android Studio'da *Settings → Languages & Frameworks → Android SDK → SDK Tools*'u aç, **Android SDK Command-line Tools (latest)** kutusunu işaretle ve uygula.
        3. `flutter doctor --android-licenses` çalıştır ve lisanslara `y` cevabı ver. Sonra `flutter doctor`: Android toolchain satırı yeşil olmalı.
        4. Bir cihaz edin. **Telefon:** *Settings → About phone*'u aç, *Build number*'a yedi kez dokun, sonra *Developer options → USB debugging*'i aç ve telefonu tak. **Emülatör:** Android Studio'da *Device Manager*'ı aç ve sanal bir telefon oluştur. Görmek için `flutter devices` çalıştır.
        5. `flutter run -d <cihaz id>` çalıştır. Varsayılan ikon hâlâ Flutter logosu.
        6. `assets/icon/` içinde 1024x1024 iki PNG resim hazırla: `icon.png` (tam kare) ve `icon_foreground.png` (şeffaf arka plan üstünde, ortada duran sembol). Onları herhangi bir resim editöründe çiz ya da basit beyaz bir daire için aşağıdaki ImageMagick komutlarını kullan.
        7. İki paketi dev dependency olarak ekle ve iki ayar bloğunu `pubspec.yaml`'ın sonuna, girinti olmadan üst düzey anahtarlar olarak koy.
        8. İki üretici komutu çalıştır, sonra yeniden `flutter run`. Yeni ikonu telefonda ve tarayıcı sekmesinde, uygulama açılırken de kendi rengini görürsün.
    code:
      - file: terminal
        lang: sh
        text: |
          flutter doctor --android-licenses
          flutter doctor
          flutter devices
          mkdir -p assets/icon
          magick -size 1024x1024 xc:"#0F766E" -fill white -draw "circle 512,512 512,300" PNG32:assets/icon/icon.png
          magick -size 1024x1024 xc:none -fill white -draw "circle 512,512 512,300" PNG32:assets/icon/icon_foreground.png
          flutter pub add --dev flutter_launcher_icons flutter_native_splash
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - file: pubspec.yaml
        lang: yaml
        text: |
          flutter_launcher_icons:
            android: true
            ios: true
            remove_alpha_ios: true
            image_path: "assets/icon/icon.png"
            adaptive_icon_background: "#0F766E"
            adaptive_icon_foreground: "assets/icon/icon_foreground.png"
            web:
              generate: true
              image_path: "assets/icon/icon.png"

          flutter_native_splash:
            color: "#0F766E"
            image: assets/icon/icon_foreground.png
            android_12:
              color: "#0F766E"
              image: assets/icon/icon_foreground.png
    mistakes:
      - problem:
          en: "`flutter devices` does not list the phone."
          tr: "`flutter devices` telefonu listelemiyor."
        fix:
          en: "Use a data USB cable (not charge-only), unlock the phone and accept the \"Allow USB debugging?\" question on its screen. On Linux you may need udev rules; the Android docs explain them."
          tr: "Sadece şarj kablosu değil, veri kablosu kullan; telefonun kilidini aç ve ekrandaki \"Allow USB debugging?\" sorusunu onayla. Linux'ta udev kuralları gerekebilir; Android dokümanları anlatır."
      - problem:
          en: "The icon does not change after generating it."
          tr: "İkon üretildikten sonra değişmiyor."
        fix:
          en: "Stop the app and run it again with `flutter run` (a hot reload cannot change native files). Some phones cache icons: uninstall the app first."
          tr: "Uygulamayı durdur ve `flutter run` ile yeniden çalıştır (hot reload native dosyaları değiştiremez). Bazı telefonlar ikonları önbelleğe alır: önce uygulamayı kaldır."
      - problem:
          en: "The generator says it cannot find the image."
          tr: "Üretici resmi bulamadığını söylüyor."
        fix:
          en: "The path in `pubspec.yaml` is relative to the project folder, and the config keys must start at the left edge of the line."
          tr: "`pubspec.yaml` içindeki yol proje klasörüne görelidir ve ayar anahtarları satırın en solundan başlamalıdır."
    quiz:
      - q:
          en: "Why does an Android adaptive icon have a background and a foreground?"
          tr: "Android'in uyarlanabilir ikonunda neden arka plan ve ön plan var?"
        options:
          en:
            - "So the phone can crop it to a circle or a rounded square and move the layers a little"
            - "So the icon can be bigger than 1024 pixels"
            - "Because iOS requires two files"
          tr:
            - "Telefon onu daire ya da yuvarlak kareye kırpabilsin ve katmanları biraz oynatabilsin diye"
            - "İkon 1024 pikselden büyük olabilsin diye"
            - "iOS iki dosya istediği için"
        answer: 0
        why:
          en: "Each phone maker picks its own shape. Keep the important part of the foreground in the middle."
          tr: "Her telefon üreticisi kendi şeklini seçer. Ön planın önemli kısmını ortada tut."
    sources:
      - title: Set up Android development
        url: https://docs.flutter.dev/platform-integration/android/setup
      - title: flutter_launcher_icons package
        url: https://pub.dev/packages/flutter_launcher_icons
      - title: flutter_native_splash package
        url: https://pub.dev/packages/flutter_native_splash

  - id: release-builds
    stage: packaging
    title:
      en: "Build a signed Android release (and what iOS needs)"
      tr: "İmzalı bir Android release'i derleme (ve iOS'un ne istediği)"
    minutes: 75
    needs: [app-icon]
    why:
      en: "A debug build is big and slow. A release build is small, fast and must be signed with a key that proves the updates come from you. Google Play wants an App Bundle (.aab); for sharing directly you use an .apk. The key is the one thing you must never lose or publish."
      tr: "Debug build büyük ve yavaştır. Release build küçük, hızlıdır ve güncellemelerin senden geldiğini kanıtlayan bir anahtarla imzalanmalıdır. Google Play App Bundle (.aab) ister; doğrudan paylaşmak için .apk kullanırsın. Anahtar, asla kaybetmemen ve yayımlamaman gereken tek şeydir."
    learn:
      en: |
        - Debug, profile and release modes
        - The app id (`dev.example.habit_tracker`), the version (`1.0.0+1`: name plus build number) and the app label
        - A keystore file and `key.properties`, and why both stay out of Git
        - `.aab` versus `.apk`, and `--split-per-abi` (one smaller file per processor type)
        - iOS: you need a Mac with Xcode to build, and the Apple Developer Program to publish
      tr: |
        - Debug, profile ve release modları
        - Uygulama kimliği (`dev.example.habit_tracker`), sürüm (`1.0.0+1`: ad artı build numarası) ve uygulama etiketi
        - Bir keystore dosyası ve `key.properties`, ikisinin neden Git dışında kaldığı
        - `.aab` ile `.apk` farkı ve `--split-per-abi` (işlemci türü başına bir küçük dosya)
        - iOS: derlemek için Xcode'lu bir Mac, yayımlamak için Apple Developer Program gerekir
    do:
      en: |
        1. In `android/app/src/main/AndroidManifest.xml` set `android:label="Habit Tracker"` on the `<application` tag. Check that the INTERNET permission line from the HTTP step is there.
        2. In `pubspec.yaml` check `version: 1.0.0+1`. Raise the number after `+` for every upload to a store.
        3. Create an upload key outside the project folder (first command below, macOS and Linux; the Android docs have the Windows version). Remember the password. It asks a few questions; any answers work.
        4. Create `android/key.properties` with the second block, using your passwords and the full path of the key file. Make sure `android/.gitignore` lists `key.properties` and `*.jks` (Flutter's template does); if not, add them.
        5. Open `android/app/build.gradle.kts`. At the top add the two imports and the code that reads `key.properties`. Inside `android { ... }` add `signingConfigs` before `buildTypes`, and in `buildTypes → release` use the `release` signing config (delete the `debug` line that is there).
        6. Run `flutter clean`, then build. `flutter build apk --release` gives one file you can send to a friend: `build/app/outputs/flutter-apk/app-release.apk`. `flutter build appbundle` gives the file Google Play wants: `build/app/outputs/bundle/release/app.aab`.
        7. Install the APK on your phone (`flutter install`, or send the file) and use it for a day. Release builds behave differently from debug ones (the network permission is the classic).
        8. Back the key file up in a safe place (a password manager or an encrypted drive).
        9. iOS, in short: on a Mac with Xcode run `open ios/Runner.xcworkspace`, choose your Team under *Signing & Capabilities*, then `flutter build ipa`. Uploading to TestFlight or the App Store needs the paid Apple Developer Program (99 USD per year). Without a Mac, skip iOS for now: the web version in the next step works on iPhones too.
      tr: |
        1. `android/app/src/main/AndroidManifest.xml` içinde `<application` etiketine `android:label="Habit Tracker"` yaz. HTTP adımındaki INTERNET izni satırının orada olduğunu kontrol et.
        2. `pubspec.yaml` içinde `version: 1.0.0+1` satırını kontrol et. Mağazaya her yükleme için `+`'dan sonraki sayıyı artır.
        3. Proje klasörünün dışında bir yükleme anahtarı oluştur (aşağıdaki ilk komut, macOS ve Linux; Windows sürümü Android dokümanlarında). Parolayı hatırla. Birkaç soru sorar; herhangi bir cevap olur.
        4. İkinci bloğu kullanarak parolalarınla ve anahtar dosyasının tam yoluyla `android/key.properties` dosyasını oluştur. `android/.gitignore` içinde `key.properties` ve `*.jks` olduğundan emin ol (Flutter şablonunda var); yoksa ekle.
        5. `android/app/build.gradle.kts` dosyasını aç. En üste iki import'u ve `key.properties`'i okuyan kodu ekle. `android { ... }` içinde `buildTypes`'ın öncesine `signingConfigs` ekle ve `buildTypes → release` içinde `release` imza ayarını kullan (orada duran `debug` satırını sil).
        6. `flutter clean` çalıştır, sonra derle. `flutter build apk --release` bir arkadaşına gönderebileceğin tek bir dosya verir: `build/app/outputs/flutter-apk/app-release.apk`. `flutter build appbundle` Google Play'in istediği dosyayı verir: `build/app/outputs/bundle/release/app.aab`.
        7. APK'yı telefonuna kur (`flutter install` ya da dosyayı gönder) ve bir gün kullan. Release build'ler debug olanlardan farklı davranır (klasik örnek ağ izni).
        8. Anahtar dosyasını güvenli bir yere yedekle (parola yöneticisi ya da şifreli disk).
        9. iOS kısaca: Xcode'lu bir Mac'te `open ios/Runner.xcworkspace` çalıştır, *Signing & Capabilities* altında Team'ini seç, sonra `flutter build ipa`. TestFlight'a ya da App Store'a yüklemek için ücretli Apple Developer Program gerekir (yılda 99 USD). Mac yoksa iOS'u şimdilik atla: sonraki adımdaki web sürümü iPhone'larda da çalışır.
    code:
      - file: terminal
        lang: sh
        text: |
          keytool -genkey -v -keystore ~/upload-keystore.jks -keyalg RSA \
                  -storetype JKS -keysize 2048 -validity 10000 -alias upload
          flutter clean
          flutter build apk --release
          flutter build appbundle
          flutter install
      - file: android/key.properties
        lang: properties
        text: |
          storePassword=your-password
          keyPassword=your-password
          keyAlias=upload
          storeFile=/home/you/upload-keystore.jks
      - file: android/app/build.gradle.kts
        lang: kotlin
        text: |
          import java.io.FileInputStream
          import java.util.Properties

          // ...the existing plugins { ... } block stays here...

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              // ...existing settings...

              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
    mistakes:
      - problem:
          en: "Committing `key.properties` or the `.jks` file to GitHub, or losing the key."
          tr: "`key.properties` ya da `.jks` dosyasını GitHub'a commit'lemek ya da anahtarı kaybetmek."
        fix:
          en: "Check with `git status` before every commit. Anyone with the key and passwords can publish updates as you. If you lose it, users must uninstall to get a build signed with a new key (Google Play can reset an upload key, if you enrolled in Play App Signing)."
          tr: "Her commit'ten önce `git status` ile kontrol et. Anahtara ve parolalara sahip herkes senin adına güncelleme yayımlayabilir. Kaybedersen kullanıcılar yeni anahtarla imzalı sürümü almak için uygulamayı kaldırmak zorunda kalır (Play App Signing'e katıldıysan Google Play yükleme anahtarını sıfırlayabilir)."
      - problem:
          en: "The release app is signed with the debug key because `flutter clean` was skipped or the old `signingConfig` line stayed."
          tr: "`flutter clean` atlandığı ya da eski `signingConfig` satırı kaldığı için release uygulaması debug anahtarıyla imzalanıyor."
        fix:
          en: "There must be exactly one `signingConfig` line in `release`, the `release` one. Run `flutter clean` after any Gradle change."
          tr: "`release` içinde tam olarak bir `signingConfig` satırı olmalı, `release` olanı. Her Gradle değişikliğinden sonra `flutter clean` çalıştır."
      - problem:
          en: "Android shows \"Install blocked\" when someone opens your APK."
          tr: "Biri APK'nı açınca Android \"Install blocked\" gösteriyor."
        fix:
          en: "That is normal for apps outside Google Play. The person allows installing from that app (a browser or the file manager) in the phone settings. Tell them in advance."
          tr: "Google Play dışındaki uygulamalar için bu normaldir. Kişi telefon ayarlarından o uygulamadan (tarayıcı ya da dosya yöneticisi) kuruluma izin verir. Onlara önceden söyle."
    quiz:
      - q:
          en: "Which file must never go to a public Git repository?"
          tr: "Hangi dosya asla herkese açık bir Git deposuna gitmemeli?"
        options:
          en:
            - "pubspec.yaml"
            - "The .jks key file and key.properties"
            - "lib/main.dart"
          tr:
            - "pubspec.yaml"
            - ".jks anahtar dosyası ve key.properties"
            - "lib/main.dart"
        answer: 1
        why:
          en: "They hold the key that proves who may publish updates of your app."
          tr: "Uygulamanın güncellemelerini kimin yayımlayabileceğini kanıtlayan anahtarı içerirler."
    sources:
      - title: Build and release an Android app
        url: https://docs.flutter.dev/deployment/android
      - title: Build and release an iOS app
        url: https://docs.flutter.dev/deployment/ios
      - title: Apple Developer Program, enrolment
        url: https://developer.apple.com/programs/enroll/

  - id: web-pages
    stage: deploy
    title:
      en: "Publish for free: Flutter web on GitHub Pages and an APK on GitHub"
      tr: "Ücretsiz yayınla: GitHub Pages'te Flutter web ve GitHub'da APK"
    minutes: 75
    needs: [release-builds]
    why:
      en: "Flutter can build your app as a website. A website costs nothing to share: anyone with a link can use it on Android, iPhone or a laptop, with no store and no review. GitHub Pages hosts it for free from your repository. We let GitHub Actions build and publish it every time you push."
      tr: "Flutter uygulamanı bir web sitesi olarak da derleyebilir. Web sitesini paylaşmak bedavadır: linki olan herkes Android'de, iPhone'da ya da laptopta mağaza ve onay süreci olmadan kullanabilir. GitHub Pages bunu depondan ücretsiz barındırır. Her push'ta GitHub Actions'ın derleyip yayımlamasını sağlıyoruz."
    learn:
      en: |
        - `flutter build web` and the folder it makes (`build/web`)
        - `--base-href`: a GitHub Pages project site lives under `/<repository>/`, not at the root
        - A GitHub Actions workflow: checkout, set up Flutter, test, build, upload, deploy
        - Honest publishing paths and costs (table in step 6)
      tr: |
        - `flutter build web` ve oluşturduğu klasör (`build/web`)
        - `--base-href`: GitHub Pages proje sitesi kökte değil, `/<depo adı>/` altında yaşar
        - Bir GitHub Actions workflow'u: checkout, Flutter kurulumu, test, build, yükleme, deploy
        - Dürüst yayın yolları ve maliyetleri (6. adımdaki tablo)
    do:
      en: |
        1. Try the web build locally without a base path: `flutter build web --release`, then `python3 -m http.server 8000 -d build/web` and open http://localhost:8000. (The `--base-href` flag is only for GitHub, where the site lives under `/habit_tracker/`; the workflow below adds it.)
        2. On github.com create a **public** repository named `habit_tracker` (GitHub Pages is free for public repositories). Then in the project folder: `git branch -M main`, `git remote add origin https://github.com/<you>/habit_tracker.git`. Do not push yet.
        3. In the repository open *Settings → Pages* and set **Source** to **GitHub Actions**.
        4. Create `.github/workflows/pages.yml` with the workflow below. It tests, builds with the repository name as base path, and deploys.
        5. Commit and push: `git add .`, `git commit -m "Add web deploy"`, `git push -u origin main`. Open the **Actions** tab and watch it. When it is green, open `https://<you>.github.io/habit_tracker/`. Open a habit and reload: the address looks like `.../habit_tracker/#/habit/...` and still works, because Flutter web uses the part after `#` by default, which a static host serves without special rules.
        6. Know your options before you tell people: the table below is the honest list. For an Android file, create a GitHub **release** and attach `app-release.apk` (the Releases section on the repository page, or `gh release create v1.0.0 build/app/outputs/flutter-apk/app-release.apk --title "v1.0.0"`).
        7. Costs: the web version and an APK on GitHub are free. A Google Play developer account costs a one-time 25 USD, and new personal accounts must also meet Google's testing requirements before the first public release. The Apple Developer Program costs 99 USD per year and needs a Mac. Decide with a real goal: friends and a portfolio need only a link.
      tr: |
        1. Web build'ini yerelde base path olmadan dene: `flutter build web --release`, sonra `python3 -m http.server 8000 -d build/web` ve http://localhost:8000'i aç. (`--base-href` bayrağı sadece GitHub içindir; orada site `/habit_tracker/` altında yaşar ve aşağıdaki workflow onu ekler.)
        2. github.com'da `habit_tracker` adında **herkese açık (public)** bir depo oluştur (GitHub Pages herkese açık depolar için ücretsizdir). Sonra proje klasöründe: `git branch -M main`, `git remote add origin https://github.com/<sen>/habit_tracker.git`. Henüz push'lama.
        3. Depoda *Settings → Pages*'i aç ve **Source**'u **GitHub Actions** yap.
        4. Aşağıdaki workflow ile `.github/workflows/pages.yml` dosyasını oluştur. Test eder, depo adını base path yaparak derler ve deploy eder.
        5. Commit'le ve push'la: `git add .`, `git commit -m "Add web deploy"`, `git push -u origin main`. **Actions** sekmesini aç ve izle. Yeşil olunca `https://<sen>.github.io/habit_tracker/` adresini aç. Bir alışkanlığı açıp sayfayı yenile: adres `.../habit_tracker/#/habit/...` gibi görünür ve yine çalışır; çünkü Flutter web varsayılan olarak `#`'den sonrasını kullanır ve statik bir sunucu bunu özel kural olmadan sunar.
        6. İnsanlara söylemeden önce seçeneklerini bil: aşağıdaki liste dürüst listedir. Android dosyası için bir GitHub **release** oluştur ve `app-release.apk`'yı ekle (depo sayfasındaki Releases bölümü ya da `gh release create v1.0.0 build/app/outputs/flutter-apk/app-release.apk --title "v1.0.0"`).
        7. Maliyetler: web sürümü ve GitHub'daki APK ücretsizdir. Google Play geliştirici hesabı tek seferlik 25 USD'dir ve yeni kişisel hesaplar ilk herkese açık sürümden önce Google'ın test koşullarını da karşılamalıdır. Apple Developer Program yılda 99 USD'dir ve Mac ister. Gerçek bir hedefle karar ver: arkadaşlar ve portföy için bir link yeter.
    code:
      - file: terminal
        lang: sh
        text: |
          flutter build web --release
          python3 -m http.server 8000 -d build/web
          git branch -M main
          git remote add origin https://github.com/YOUR-NAME/habit_tracker.git
      - file: .github/workflows/pages.yml
        lang: yaml
        text: |
          name: Deploy web

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: subosito/flutter-action@v2
                  with:
                    channel: stable
                    flutter-version: 3.47.7
                    cache: true
                - run: flutter pub get
                - run: flutter test
                - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
                - uses: actions/upload-pages-artifact@v5
                  with:
                    path: build/web

            deploy:
              needs: build
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - id: deployment
                  uses: actions/deploy-pages@v5
    mistakes:
      - problem:
          en: "The deployed site is blank and the browser console shows 404 errors for `main.dart.js` and assets."
          tr: "Yayındaki site boş ve tarayıcı konsolu `main.dart.js` ve varlıklar için 404 hataları gösteriyor."
        fix:
          en: "The base path is wrong. A project site needs `--base-href /<repository>/` with a slash at both ends. The workflow takes it from the repository name."
          tr: "Base path yanlış. Proje sitesi, iki ucunda da eğik çizgi olan `--base-href /<depo adı>/` ister. Workflow bunu depo adından alır."
      - problem:
          en: "The Pages deploy step fails with a permission error."
          tr: "Pages deploy adımı bir izin hatasıyla başarısız oluyor."
        fix:
          en: "In *Settings → Pages* the source must be **GitHub Actions**, the repository must be public (on a free plan), and the workflow needs the `pages: write` and `id-token: write` permissions shown above."
          tr: "*Settings → Pages* içinde kaynak **GitHub Actions** olmalı, depo (ücretsiz planda) herkese açık olmalı ve workflow'un yukarıdaki `pages: write` ve `id-token: write` izinleri olmalı."
      - problem:
          en: "Building with `--wasm` for GitHub Pages."
          tr: "GitHub Pages için `--wasm` ile derlemek."
        fix:
          en: "The Flutter docs say WebAssembly builds need special response headers (Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy), and GitHub Pages cannot set headers. Keep the default JavaScript build."
          tr: "Flutter dokümanları WebAssembly build'lerinin özel yanıt başlıkları (Cross-Origin-Opener-Policy ve Cross-Origin-Embedder-Policy) istediğini söyler; GitHub Pages başlık ayarlayamaz. Varsayılan JavaScript build'ini kullan."
    quiz:
      - q:
          en: "Why does the workflow pass `--base-href \"/habit_tracker/\"`?"
          tr: "Workflow neden `--base-href \"/habit_tracker/\"` veriyor?"
        options:
          en:
            - "A project site is served under /habit_tracker/, so the files must be requested from there"
            - "It makes the build smaller"
            - "GitHub requires it for private repositories"
          tr:
            - "Proje sitesi /habit_tracker/ altında sunulur, dosyalar oradan istenmeli"
            - "Build'i küçültür"
            - "GitHub bunu özel depolar için ister"
        answer: 0
        why:
          en: "Without it the page asks for /main.dart.js at the domain root, where nothing exists."
          tr: "Olmazsa sayfa /main.dart.js dosyasını alan adının kökünde ister, orada hiçbir şey yoktur."
    sources:
      - title: Build and release a web app
        url: https://docs.flutter.dev/deployment/web
      - title: GitHub Pages, using custom workflows
        url: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
      - title: Google Play Console, create a developer account
        url: https://support.google.com/googleplay/android-developer/answer/6112435

  - id: crash-reports
    stage: monitoring
    title:
      en: "Find crashes you cannot see with Sentry"
      tr: "Sentry ile göremediğin çökmeleri bulma"
    minutes: 45
    needs: [web-pages]
    why:
      en: "When the app crashes on someone else's phone, you see nothing. A crash reporting service sends you the error with its stack trace (the list of calls that led to it), so you can fix it. Sentry has a free plan and a Flutter package that works on Android, iOS and the web."
      tr: "Uygulama başkasının telefonunda çöktüğünde sen hiçbir şey görmezsin. Çökme raporlama servisi sana hatayı yığın izleriyle (hataya götüren çağrıların listesi) gönderir; böylece düzeltebilirsin. Sentry'nin ücretsiz bir planı ve Android, iOS ve webde çalışan bir Flutter paketi var."
    learn:
      en: |
        - What an error report contains, and why you must not send personal data
        - `SentryFlutter.init` with `appRunner`: errors that Flutter would only print are reported
        - `--dart-define` to give the app a value at build time (the DSN, the address where reports are sent)
        - Alternatives: Firebase Crashlytics (free, mobile only) and the crash reports in Google Play Console and App Store Connect
      tr: |
        - Bir hata raporunun neler içerdiği ve kişisel veri göndermemen gerektiği
        - `appRunner` ile `SentryFlutter.init`: Flutter'ın sadece yazdıracağı hatalar raporlanır
        - Derleme zamanında uygulamaya değer vermek için `--dart-define` (DSN, raporların gönderildiği adres)
        - Alternatifler: Firebase Crashlytics (ücretsiz, sadece mobil) ve Google Play Console ile App Store Connect içindeki çökme raporları
    do:
      en: |
        1. Create a free account at sentry.io (the Developer plan is free, with limits: check sentry.io/pricing) and a new project of the platform **Flutter**. Copy its **DSN** (a web address that looks like `https://<key>@o<number>.ingest.sentry.io/<number>`).
        2. Add the package: `flutter pub add sentry_flutter`.
        3. Replace `lib/main.dart` with the version below. The DSN comes from `--dart-define`, so no key sits in your code, and without it the app runs exactly as before.
        4. Run `flutter run -d chrome --web-port=5000 --dart-define=SENTRY_DSN=<your DSN>`.
        5. Test it: temporarily add `TextButton(onPressed: () => throw StateError('Test crash'), child: const Text('Crash'))` to the `Row` in `lib/screens/settings_screen.dart`, press it, and open the Issues page in Sentry. The error appears after a short while. Remove the button.
        6. For the live site, add the DSN as a repository secret (*Settings → Secrets and variables → Actions → New repository secret*, name `SENTRY_DSN`) and add `--dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}` to the `flutter build web` line in the workflow. Use the same `--dart-define` when you build the APK.
        7. Tell your users what you collect. Report errors, not names, habit titles or tokens.
      tr: |
        1. sentry.io'da ücretsiz bir hesap aç (Developer planı ücretsizdir ve limitleri vardır: sentry.io/pricing'e bak) ve platformu **Flutter** olan yeni bir proje oluştur. **DSN**'ini kopyala (`https://<anahtar>@o<sayı>.ingest.sentry.io/<sayı>` gibi görünen bir web adresi).
        2. Paketi ekle: `flutter pub add sentry_flutter`.
        3. `lib/main.dart` dosyasını aşağıdaki sürümle değiştir. DSN `--dart-define` ile gelir; kodunda anahtar durmaz, o olmadan uygulama eskisi gibi çalışır.
        4. `flutter run -d chrome --web-port=5000 --dart-define=SENTRY_DSN=<DSN'in>` çalıştır.
        5. Dene: `lib/screens/settings_screen.dart` içindeki `Row`'a geçici olarak `TextButton(onPressed: () => throw StateError('Test crash'), child: const Text('Crash'))` ekle, ona bas ve Sentry'de Issues sayfasını aç. Hata kısa bir süre sonra görünür. Düğmeyi kaldır.
        6. Canlı site için DSN'i depoya secret olarak ekle (*Settings → Secrets and variables → Actions → New repository secret*, adı `SENTRY_DSN`) ve workflow'daki `flutter build web` satırına `--dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}` ekle. APK derlerken de aynı `--dart-define`'ı kullan.
        7. Kullanıcılarına ne topladığını söyle. Hataları raporla; isimleri, alışkanlık başlıklarını ya da token'ları değil.
    code:
      - file: terminal
        lang: sh
        text: |
          flutter pub add sentry_flutter
          flutter run -d chrome --web-port=5000 --dart-define=SENTRY_DSN=https://KEY@oNUMBER.ingest.sentry.io/NUMBER
      - file: lib/main.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:provider/provider.dart';
          import 'package:sentry_flutter/sentry_flutter.dart';

          import 'data/prefs_habit_store.dart';
          import 'data/quote_client.dart';
          import 'router.dart';
          import 'state/habits_model.dart';

          const sentryDsn = String.fromEnvironment('SENTRY_DSN');

          Widget buildApp() {
            return MultiProvider(
              providers: [
                ChangeNotifierProvider(
                  create: (_) => HabitsModel(PrefsHabitStore())..load(),
                ),
                Provider(
                  create: (_) => QuoteClient(http.Client()),
                  dispose: (_, client) => client.close(),
                ),
              ],
              child: const HabitApp(),
            );
          }

          Future<void> main() async {
            if (sentryDsn.isEmpty) {
              runApp(buildApp());
              return;
            }
            await SentryFlutter.init(
              (options) {
                options.dsn = sentryDsn;
                options.sendDefaultPii = false;
              },
              appRunner: () => runApp(SentryWidget(child: buildApp())),
            );
          }

          class HabitApp extends StatelessWidget {
            const HabitApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp.router(
                title: 'Habit Tracker',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal),
                ),
                routerConfig: router,
              );
            }
          }
    mistakes:
      - problem:
          en: "No error shows up in Sentry."
          tr: "Sentry'de hiç hata görünmüyor."
        fix:
          en: "Check that you started the app with the `--dart-define=SENTRY_DSN=...` flag (an empty value turns reporting off) and that the DSN belongs to a Flutter project. Wait a minute and reload the Issues page."
          tr: "Uygulamayı `--dart-define=SENTRY_DSN=...` bayrağıyla başlattığını (boş değer raporlamayı kapatır) ve DSN'in bir Flutter projesine ait olduğunu kontrol et. Bir dakika bekle ve Issues sayfasını yenile."
      - problem:
          en: "Sending user data (names, emails, habit titles) in reports, or publishing source maps of the web build."
          tr: "Raporlarda kullanıcı verisi (isimler, e-postalar, alışkanlık başlıkları) göndermek ya da web build'inin source map'lerini yayımlamak."
        fix:
          en: "Keep `sendDefaultPii = false`. The Flutter docs say not to publish `.map` files on the web; upload them to the monitoring service instead."
          tr: "`sendDefaultPii = false` olarak bırak. Flutter dokümanları web'de `.map` dosyalarının yayımlanmamasını söyler; onları izleme servisine yükle."
    quiz:
      - q:
          en: "Why is the DSN passed with `--dart-define` and not typed into the code?"
          tr: "DSN neden koda yazılmak yerine `--dart-define` ile veriliyor?"
        options:
          en:
            - "So the repository holds no project-specific address and each build can choose its own"
            - "Because Sentry refuses DSNs inside code files"
            - "To make the app start faster"
          tr:
            - "Depoda projeye özel adres durmasın ve her build kendi adresini seçebilsin diye"
            - "Sentry kod dosyalarındaki DSN'leri reddettiği için"
            - "Uygulama daha hızlı açılsın diye"
        answer: 0
        why:
          en: "A DSN only lets someone send events, but keeping it out of the code makes forks and test builds clean. It is not a place to hide real secrets: anything in the app can be read."
          tr: "DSN sadece olay göndermeye izin verir; ama kodun dışında tutmak fork'ları ve test build'lerini temiz tutar. Gerçek sırları saklamak için bir yer değildir: uygulamadaki her şey okunabilir."
    sources:
      - title: Sentry for Flutter
        url: https://docs.sentry.io/platforms/dart/guides/flutter/
      - title: Sentry Flutter manual setup
        url: https://docs.sentry.io/platforms/dart/guides/flutter/manual-setup/
      - title: Firebase Crashlytics for Flutter
        url: https://firebase.google.com/docs/crashlytics/flutter/get-started

  - id: drift-database
    stage: advanced
    title:
      en: "When data grows: a real database with drift"
      tr: "Veri büyüyünce: drift ile gerçek bir veritabanı"
    minutes: 90
    needs: [crash-reports]
    why:
      en: "Saving one text blob is fine for 20 habits. When you need to search, sort, filter or keep years of history, you want a database. Flutter apps use SQLite. `sqflite` gives you raw SQL; `drift` is a typed layer on top: you describe tables in Dart and it writes the query code for you. Because the model only knows `HabitStore`, we swap the storage without touching one screen."
      tr: "Tek bir metin yığınını kaydetmek 20 alışkanlık için yeter. Arama, sıralama, süzme yapman ya da yıllarca geçmiş tutman gerekince veritabanı istersin. Flutter uygulamaları SQLite kullanır. `sqflite` sana ham SQL verir; `drift` üstünde tipli bir katmandır: tabloları Dart ile tarif edersin, sorgu kodunu o yazar. Model sadece `HabitStore`'u bildiği için tek bir ekrana dokunmadan depolamayı değiştiriyoruz."
    learn:
      en: |
        - Tables as Dart classes, and code generation with `build_runner`
        - Two tables: habits and their completed days (one row per day)
        - Writing a second `HabitStore` that fills the same `Habit` objects from the database
        - Honest limits: this version rewrites everything on each save, which is fine at this size; real apps write only what changed. On the web, drift needs extra files and setup (see its web guide), so we keep shared_preferences there.
      tr: |
        - Dart sınıfları olarak tablolar ve `build_runner` ile kod üretimi
        - İki tablo: alışkanlıklar ve tamamlanan günleri (gün başına bir satır)
        - Aynı `Habit` nesnelerini veritabanından dolduran ikinci bir `HabitStore` yazmak
        - Dürüst sınırlar: bu sürüm her kayıtta her şeyi yeniden yazar, bu boyutta sorun değil; gerçek uygulamalar sadece değişeni yazar. Webde drift ekstra dosya ve kurulum ister (web rehberine bak), o yüzden orada shared_preferences kalıyor.
    do:
      en: |
        1. Add the packages with the one command below (three normal ones and two for code generation).
        2. Create `lib/data/database.dart` and `lib/data/drift_habit_store.dart`.
        3. Generate the missing file: `dart run build_runner build`. It writes `lib/data/database.g.dart`. Commit this file too, so GitHub Actions can build without running the generator.
        4. In `lib/main.dart` (the Sentry version) add `import 'package:flutter/foundation.dart' show kIsWeb;` and the imports of `data/database.dart`, `data/drift_habit_store.dart` and `data/habit_store.dart`, then replace the `ChangeNotifierProvider` inside `buildApp()` with the code below. `HabitStore` is the common type of both stores.
        5. Run the app on your phone. Your older habits (from shared_preferences) are not in the new database: this exercise starts fresh. Tick a habit, restart, and it stays.
        6. Run `flutter test`: the unit tests still pass, because they use `MemoryHabitStore`.
        7. Next ideas: a dark theme, reminders with a notifications package, state management with Riverpod, translations (Flutter's `intl` support), or a small server so habits sync between devices.
      tr: |
        1. Paketleri aşağıdaki tek komutla ekle (üç normal paket ve kod üretimi için iki paket).
        2. `lib/data/database.dart` ve `lib/data/drift_habit_store.dart` dosyalarını oluştur.
        3. Eksik dosyayı üret: `dart run build_runner build`. `lib/data/database.g.dart` dosyasını yazar. Bu dosyayı da commit'le; böylece GitHub Actions üreticiyi çalıştırmadan derleyebilir.
        4. `lib/main.dart` içinde (Sentry sürümü) `import 'package:flutter/foundation.dart' show kIsWeb;` satırını, `data/database.dart`, `data/drift_habit_store.dart` ve `data/habit_store.dart` import'larını ekle ve `buildApp()` içindeki `ChangeNotifierProvider`'ı aşağıdaki kodla değiştir. `HabitStore` ikisinin ortak tipidir.
        5. Uygulamayı telefonunda çalıştır. Eski alışkanlıkların (shared_preferences'taki) yeni veritabanında yok: bu alıştırma sıfırdan başlar. Bir alışkanlığı işaretle, yeniden başlat; kalır.
        6. `flutter test` çalıştır: unit testler hâlâ geçer, çünkü `MemoryHabitStore` kullanırlar.
        7. Sonraki fikirler: koyu tema, bir bildirim paketiyle hatırlatıcılar, Riverpod ile state yönetimi, çeviriler (Flutter'ın `intl` desteği) ya da alışkanlıkların cihazlar arasında eşitlenmesi için küçük bir sunucu.
    code:
      - file: terminal
        lang: sh
        text: |
          flutter pub add drift drift_flutter path_provider dev:drift_dev dev:build_runner
          dart run build_runner build
      - file: lib/data/database.dart
        lang: dart
        text: |
          import 'package:drift/drift.dart';
          import 'package:drift_flutter/drift_flutter.dart';
          import 'package:path_provider/path_provider.dart';

          part 'database.g.dart';

          @DataClassName('HabitRow')
          class HabitRows extends Table {
            TextColumn get id => text()();
            TextColumn get name => text().withLength(min: 1, max: 40)();

            @override
            Set<Column> get primaryKey => {id};
          }

          class Completions extends Table {
            TextColumn get habitId => text().references(HabitRows, #id)();
            TextColumn get day => text()();

            @override
            Set<Column> get primaryKey => {habitId, day};
          }

          @DriftDatabase(tables: [HabitRows, Completions])
          class AppDatabase extends _$AppDatabase {
            AppDatabase([QueryExecutor? executor]) : super(executor ?? _openConnection());

            @override
            int get schemaVersion => 1;

            static QueryExecutor _openConnection() {
              return driftDatabase(
                name: 'habits',
                native: const DriftNativeOptions(
                  databaseDirectory: getApplicationSupportDirectory,
                ),
              );
            }
          }
      - file: lib/main.dart
        lang: dart
        text: |
          // Inside buildApp(): choose the store (add the imports at the top).
          ChangeNotifierProvider(
            create: (_) {
              final HabitStore store =
                  kIsWeb ? PrefsHabitStore() : DriftHabitStore(AppDatabase());
              return HabitsModel(store)..load();
            },
          ),
      - file: lib/data/drift_habit_store.dart
        lang: dart
        text: |
          import '../models/habit.dart';
          import 'database.dart';
          import 'habit_store.dart';

          class DriftHabitStore implements HabitStore {
            DriftHabitStore(this._db);

            final AppDatabase _db;

            @override
            Future<List<Habit>> load() async {
              final rows = await _db.select(_db.habitRows).get();
              final done = await _db.select(_db.completions).get();
              return [
                for (final row in rows)
                  Habit(
                    id: row.id,
                    name: row.name,
                    doneOn: {
                      for (final c in done)
                        if (c.habitId == row.id) c.day,
                    },
                  ),
              ];
            }

            @override
            Future<void> save(List<Habit> habits) {
              return _db.transaction(() async {
                await _db.delete(_db.completions).go();
                await _db.delete(_db.habitRows).go();
                await _db.batch((batch) {
                  batch.insertAll(_db.habitRows, [
                    for (final h in habits) HabitRowsCompanion.insert(id: h.id, name: h.name),
                  ]);
                  batch.insertAll(_db.completions, [
                    for (final h in habits)
                      for (final day in h.doneOn)
                        CompletionsCompanion.insert(habitId: h.id, day: day),
                  ]);
                });
              });
            }
          }
    mistakes:
      - problem:
          en: "\"Target of URI hasn't been generated: database.g.dart\"."
          tr: "\"Target of URI hasn't been generated: database.g.dart\" hatası."
        fix:
          en: "Run `dart run build_runner build`. Run it again after every change to a table class. `dart run build_runner watch` does it on every save."
          tr: "`dart run build_runner build` çalıştır. Bir tablo sınıfını her değiştirdiğinde yeniden çalıştır. `dart run build_runner watch` her kayıtta bunu yapar."
      - problem:
          en: "Changing a table later (a new column) and the app crashes for people who already have the old database."
          tr: "Sonradan bir tabloyu değiştirmek (yeni sütun) ve eski veritabanı olan kişilerde uygulamanın çökmesi."
        fix:
          en: "Raise `schemaVersion` and write a migration. The drift docs explain migrations; plan for them from the first release."
          tr: "`schemaVersion`'ı artır ve bir migration yaz. drift dokümanları migration'ları anlatır; ilk sürümden itibaren planla."
    quiz:
      - q:
          en: "Why could we add a database without changing any screen?"
          tr: "Neden hiçbir ekranı değiştirmeden veritabanı ekleyebildik?"
        options:
          en:
            - "The model only talks to the HabitStore interface, so any class that implements it can be plugged in"
            - "drift redraws the screens by itself"
            - "SQLite is built into the widgets"
          tr:
            - "Model sadece HabitStore arayüzüyle konuşur; onu uygulayan her sınıf takılabilir"
            - "drift ekranları kendisi yeniden çizer"
            - "SQLite widget'ların içinde hazır gelir"
        answer: 0
        why:
          en: "Depending on an interface instead of a concrete class is what makes parts replaceable and testable."
          tr: "Somut bir sınıf yerine bir arayüze bağlı olmak parçaları değiştirilebilir ve test edilebilir yapar."
    sources:
      - title: drift, setup
        url: https://drift.simonbinder.eu/setup/
      - title: sqflite package
        url: https://pub.dev/packages/sqflite
      - title: Persist data with SQLite
        url: https://docs.flutter.dev/cookbook/persistence/sqlite
