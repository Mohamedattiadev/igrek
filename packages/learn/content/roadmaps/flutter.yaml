id: flutter
title: Flutter
summary:
  en: "From an empty computer to a real app on phones and the web. You build a habit tracker with Flutter and Dart: screens, state, navigation, saving data, a web API, tests, an app icon, release builds, a free web version on GitHub Pages and crash reports."
  tr: "Boş bir bilgisayardan telefonlarda ve webde çalışan gerçek bir uygulamaya. Flutter ve Dart ile bir alışkanlık takip uygulaması yazarsın: ekranlar, state, sayfalar arası geçiş, veri saklama, web API, testler, uygulama ikonu, release build'leri, GitHub Pages'te ücretsiz web sürümü ve çökme raporları."
teacher: mobile
project:
  en: 'A habit tracker: add habits, tick them off each day, see your streak, keep everything on the device, load a daily quote from a public API, store a token safely, with tests, an app icon, a signed Android build and a free web version on GitHub Pages.'
  tr: 'Bir alışkanlık takip uygulaması: alışkanlık ekleme, her gün işaretleme, seri (streak) görme, her şeyi cihazda tutma, herkese açık bir API''den günlük söz yükleme, bir token''ı güvenle saklama; testleri, uygulama ikonu, imzalı bir Android build''i ve GitHub Pages''te ücretsiz bir web sürümü var.'
detect:
  files: [.metadata]
version: "3.47"
checked: 2026-10
sheets: [git]
steps:
  - id: setup
    stage: setup
    title:
      en: "Install Git, VS Code and the Flutter SDK"
      tr: "Git, VS Code ve Flutter SDK kurma"
    minutes: 60
    why:
      en: "Flutter is a toolkit from Google that draws your app itself, so one code base can run on Android, iOS and the web. Its apps are written in a language called Dart. You need the Flutter SDK (it includes Dart), an editor and Git. You can start with only a browser as the target: no phone and no emulator yet."
      tr: "Flutter, Google'ın uygulamanı kendisi çizen bir araç takımıdır; tek bir kod tabanı Android'de, iOS'ta ve webde çalışabilir. Uygulamalar Dart denen bir dille yazılır. Flutter SDK'ya (içinde Dart da var), bir editöre ve Git'e ihtiyacın var. Başlangıçta hedef olarak sadece tarayıcı yeter: telefon da emülatör de şimdilik gerekmiyor."
    learn:
      en: |
        - What an SDK is (a folder of tools) and what Flutter and Dart each are
        - How to open a terminal and check that a program is installed
        - What `flutter doctor` checks, and why red marks for Android or Xcode do not matter yet
      tr: |
        - SDK'nın ne olduğu (bir araç klasörü) ve Flutter ile Dart'ın ayrı ayrı ne olduğu
        - Terminal açmak ve bir programın kurulu olup olmadığını kontrol etmek
        - `flutter doctor`'ın neyi kontrol ettiği ve Android ya da Xcode için çıkan kırmızı işaretlerin şimdilik neden önemli olmadığı
    do:
      en: |
        1. Install **Git**: on Windows from git-scm.com (Git for Windows), on macOS run `xcode-select --install`, on Debian or Ubuntu Linux run `sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa`.
        2. Install **Visual Studio Code** (code.visualstudio.com), a free editor. Install **Google Chrome** too if you do not have it: your app will run in it first.
        3. In VS Code open the Extensions panel and install the **Flutter** extension (it brings the **Dart** extension with it).
        4. Press Ctrl+Shift+P (Cmd+Shift+P on macOS), type `flutter` and choose **Flutter: New Project**. When it says it cannot find the SDK, choose **Download SDK**, pick a folder, wait for the download, then click **Add SDK to PATH**.
        5. Close every terminal window and restart VS Code. Open a new terminal (*Terminal → New Terminal*) and run the commands below.
        6. Tell Git who you are (see the Git cheatsheet: "Set your name and email").
        7. Read the `flutter doctor` output. You need a tick for **Flutter** and **Chrome**. Ignore Android toolchain, Xcode and Visual Studio for now; we fix Android in a later step.
      tr: |
        1. **Git**'i kur: Windows'ta git-scm.com'dan (Git for Windows), macOS'ta `xcode-select --install` çalıştır, Debian ya da Ubuntu Linux'ta `sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa` çalıştır.
        2. Ücretsiz bir editör olan **Visual Studio Code**'u kur (code.visualstudio.com). Yoksa **Google Chrome**'u da kur: uygulaman önce onda çalışacak.
        3. VS Code'da Extensions panelini aç ve **Flutter** eklentisini kur (yanında **Dart** eklentisi de gelir).
        4. Ctrl+Shift+P'ye bas (macOS'ta Cmd+Shift+P), `flutter` yaz ve **Flutter: New Project**'i seç. SDK'yı bulamadığını söylediğinde **Download SDK**'yı seç, bir klasör seç, indirmenin bitmesini bekle, sonra **Add SDK to PATH**'e tıkla.
        5. Bütün terminal pencerelerini kapat ve VS Code'u yeniden başlat. Yeni bir terminal aç (*Terminal → New Terminal*) ve aşağıdaki komutları çalıştır.
        6. Git'e kim olduğunu söyle (Git kopya kâğıdı: "Adını ve e-postanı ayarlama").
        7. `flutter doctor` çıktısını oku. **Flutter** ve **Chrome** için tik görmelisin. Android toolchain, Xcode ve Visual Studio satırlarını şimdilik yok say; Android'i sonraki bir adımda hazırlayacağız.
    code:
      - file: terminal
        lang: sh
        text: |
          git --version
          flutter --version
          dart --version
          flutter doctor
    mistakes:
      - problem:
          en: "\"flutter: command not found\" right after installing."
          tr: "Kurduktan hemen sonra \"flutter: command not found\" hatası."
        fix:
          en: "The terminal was opened before the SDK was added to PATH. Close all terminals and VS Code, open them again. Still failing: add the `bin` folder inside the Flutter folder to PATH by hand (docs.flutter.dev/install/add-to-path)."
          tr: "Terminal, SDK PATH'e eklenmeden önce açılmış. Bütün terminalleri ve VS Code'u kapatıp yeniden aç. Hâlâ olmuyorsa Flutter klasöründeki `bin` klasörünü PATH'e elle ekle (docs.flutter.dev/install/add-to-path)."
      - problem:
          en: "Panicking because `flutter doctor` shows red crosses for Android, Xcode or Visual Studio."
          tr: "`flutter doctor` Android, Xcode ya da Visual Studio için kırmızı çarpı gösterince paniğe kapılmak."
        fix:
          en: "Each line is a different target platform. You only need what you build for. Chrome and Flutter are enough for the first steps."
          tr: "Her satır ayrı bir hedef platform. Sadece hedeflediğin platformlar gerekli. İlk adımlar için Chrome ve Flutter yeter."
    quiz:
      - q:
          en: "What is the difference between Flutter and Dart?"
          tr: "Flutter ile Dart arasındaki fark nedir?"
        options:
          en:
            - "They are the same thing"
            - "Dart is the language you write, Flutter is the toolkit that draws the app"
            - "Flutter is the language, Dart is only for the web"
          tr:
            - "İkisi aynı şey"
            - "Dart yazdığın dil, Flutter uygulamayı çizen araç takımı"
            - "Flutter dil, Dart sadece web için"
        answer: 1
        why:
          en: "Your code is Dart. Flutter is the framework (widgets, drawing, tools) written in Dart that your code uses."
          tr: "Senin kodun Dart. Flutter, kodunun kullandığı ve Dart ile yazılmış framework (widget'lar, çizim, araçlar)."
    sources:
      - title: Install Flutter with VS Code (quick start)
        url: https://docs.flutter.dev/install/quick
      - title: Install Flutter manually
        url: https://docs.flutter.dev/install/manual
      - title: Flutter troubleshooting for installs
        url: https://docs.flutter.dev/install/troubleshoot

  - id: first-app
    stage: first-code
    title:
      en: "Create your first Flutter app and run it in Chrome"
      tr: "İlk Flutter uygulamanı oluşturma ve Chrome'da çalıştırma"
    minutes: 40
    needs: [setup]
    why:
      en: "`flutter create` writes a complete working app in seconds, with folders for Android, iOS and the web. Hot reload then shows every change in your running app in under a second, without losing where you were. This fast loop is the best thing about Flutter."
      tr: "`flutter create` saniyeler içinde Android, iOS ve web klasörleriyle birlikte çalışan eksiksiz bir uygulama yazar. Hot reload ise her değişikliği çalışan uygulamanda bir saniyeden kısa sürede, kaldığın yeri kaybetmeden gösterir. Flutter'ın en güzel yanı bu hızlı döngüdür."
    learn:
      en: |
        - What is inside a new project: `lib/main.dart`, `pubspec.yaml`, `test/`, `android/`, `ios/`, `web/`
        - What `pubspec.yaml` is: the app name, version and the packages it uses
        - Hot reload (`r`) versus hot restart (`R`)
      tr: |
        - Yeni bir projenin içinde ne olduğu: `lib/main.dart`, `pubspec.yaml`, `test/`, `android/`, `ios/`, `web/`
        - `pubspec.yaml`'ın ne olduğu: uygulamanın adı, sürümü ve kullandığı paketler
        - Hot reload (`r`) ile hot restart (`R`) arasındaki fark
    do:
      en: |
        1. In the terminal go to the folder where you keep projects. Run the first command below. `--org` is your reverse domain name; it becomes part of the Android app id (`dev.example.habit_tracker`). Use your own if you have one. Project names use `lowercase_with_underscores`.
        2. Go into the folder and start the app in Chrome. The first start takes a minute. Chrome opens with a counter app.
        3. Click the plus button, then look at `lib/main.dart` to find the code behind it.
        4. Replace everything in `lib/main.dart` with the code below. In the terminal that runs the app press `r`: the page changes at once (hot reload).
        5. Change the text `Hello, habits!`, save the file in VS Code (it hot reloads by itself) and watch Chrome. Press `q` in the terminal to stop the app.
        6. Save the first version with Git: `git init`, `git add .`, `git commit -m "Start the habit tracker"`. `flutter create` already wrote a `.gitignore`.
      tr: |
        1. Terminalde projelerini tuttuğun klasöre git. Aşağıdaki ilk komutu çalıştır. `--org` ters yazılmış alan adındır; Android uygulama kimliğinin (`dev.example.habit_tracker`) parçası olur. Sende varsa kendi alan adını yaz. Proje adları `kucuk_harf_ve_alt_cizgi` ile yazılır.
        2. Klasöre gir ve uygulamayı Chrome'da başlat. İlk açılış bir dakika sürer. Chrome'da bir sayaç uygulaması açılır.
        3. Artı düğmesine tıkla, sonra arkasındaki kodu bulmak için `lib/main.dart`'a bak.
        4. `lib/main.dart` içindeki her şeyi aşağıdaki kodla değiştir. Uygulamayı çalıştıran terminalde `r`'ye bas: sayfa hemen değişir (hot reload).
        5. `Hello, habits!` yazısını değiştir, VS Code'da dosyayı kaydet (kendiliğinden hot reload yapar) ve Chrome'a bak. Uygulamayı durdurmak için terminalde `q`'ya bas.
        6. İlk sürümü Git ile kaydet: `git init`, `git add .`, `git commit -m "Start the habit tracker"`. `flutter create` bir `.gitignore` dosyasını zaten yazdı.
    code:
      - file: terminal
        lang: sh
        text: |
          flutter create --org dev.example --platforms=android,ios,web habit_tracker
          cd habit_tracker
          flutter run -d chrome
      - file: lib/main.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';

          void main() {
            runApp(const HabitApp());
          }

          class HabitApp extends StatelessWidget {
            const HabitApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Habit Tracker',
                home: Scaffold(
                  appBar: AppBar(title: const Text('Habits')),
                  body: const Center(child: Text('Hello, habits!')),
                ),
              );
            }
          }
    mistakes:
      - problem:
          en: "After replacing main.dart, `flutter test` fails because `test/widget_test.dart` still talks about the old counter app."
          tr: "main.dart'ı değiştirdikten sonra `flutter test` hata veriyor, çünkü `test/widget_test.dart` hâlâ eski sayaç uygulamasından söz ediyor."
        fix:
          en: "Delete `test/widget_test.dart`. We write real tests for our own app in a later step."
          tr: "`test/widget_test.dart` dosyasını sil. Kendi uygulamamızın gerçek testlerini sonraki bir adımda yazacağız."
      - problem:
          en: "A change does not show up after pressing `r`."
          tr: "`r`'ye basınca değişiklik görünmüyor."
        fix:
          en: "Hot reload keeps the running state and skips `main()`. Press `R` (capital) for a hot restart, which starts the app over."
          tr: "Hot reload çalışan state'i korur ve `main()`'i atlar. Uygulamayı baştan başlatan hot restart için büyük `R`'ye bas."
    quiz:
      - q:
          en: "Where do you list the packages your app uses?"
          tr: "Uygulamanın kullandığı paketleri nerede listelersin?"
        options:
          en:
            - "lib/main.dart"
            - "pubspec.yaml"
            - "web/index.html"
          tr:
            - "lib/main.dart"
            - "pubspec.yaml"
            - "web/index.html"
        answer: 1
        why:
          en: "pubspec.yaml holds the app name, version and dependencies. `flutter pub add <name>` edits it for you."
          tr: "pubspec.yaml uygulamanın adını, sürümünü ve bağımlılıklarını tutar. `flutter pub add <ad>` onu senin yerine düzenler."
    sources:
      - title: Create a new Flutter app
        url: https://docs.flutter.dev/reference/create-new-app
      - title: Stateful hot reload
        url: https://docs.flutter.dev/tools/hot-reload
      - title: Learn about the pubspec file
        url: https://docs.flutter.dev/tools/pubspec

  - id: dart-basics
    stage: basics
    title:
      en: "Dart basics and the Habit model"
      tr: "Dart temelleri ve Habit modeli"
    minutes: 75
    needs: [first-app]
    why:
      en: "Everything in Flutter is Dart code, so a little Dart goes a long way. Dart checks types before your app runs and does not let a value be empty (null) unless you say so. That catches many mistakes at once. We also write the first real part of the app: the Habit class, with plain Dart that has nothing to do with screens."
      tr: "Flutter'daki her şey Dart kodudur; biraz Dart çok işe yarar. Dart, uygulama çalışmadan önce tipleri kontrol eder ve sen söylemedikçe bir değerin boş (null) olmasına izin vermez. Bu birçok hatayı baştan yakalar. Uygulamanın ilk gerçek parçasını da yazıyoruz: ekranlarla ilgisi olmayan düz Dart ile Habit sınıfı."
    learn:
      en: |
        - Variables: `var`, `final` (set once) and `const` (known before the app runs)
        - Types and null safety: `String` can never be null, `String?` can
        - Lists, sets, maps and the spread operator `...`
        - Classes, constructors with named parameters, and why we make objects immutable (a change makes a copy)
        - `Future`, `async` and `await` for things that take time
      tr: |
        - Değişkenler: `var`, `final` (bir kez atanır) ve `const` (uygulama çalışmadan önce bilinir)
        - Tipler ve null safety: `String` asla null olamaz, `String?` olabilir
        - Liste, set, map ve yayma operatörü `...`
        - Sınıflar, isimli parametreli constructor'lar ve nesneleri neden değişmez yaptığımız (değişiklik bir kopya üretir)
        - Zaman alan işler için `Future`, `async` ve `await`
    do:
      en: |
        1. Open dartpad.dev in the browser and paste the first snippet below. Press **Run**. Change values and run again until every line makes sense. DartPad needs no install.
        2. Back in your project create `lib/models/habit.dart` with the second snippet. A habit remembers on which days it was done as text like `2026-10-18`. `toggled` returns a changed copy instead of changing the habit itself.
        3. Read `streak` slowly: it starts today (or yesterday if today is not ticked yet) and walks back day by day while the habit was done.
        4. We test this code properly in the testing step. For now run `flutter analyze`: it must print `No issues found!`.
      tr: |
        1. Tarayıcıda dartpad.dev'i aç ve aşağıdaki ilk kod parçasını yapıştır. **Run**'a bas. Her satır anlaşılana kadar değerleri değiştirip yeniden çalıştır. DartPad kurulum gerektirmez.
        2. Projene dön ve ikinci parçayla `lib/models/habit.dart` dosyasını oluştur. Bir alışkanlık, hangi günlerde yapıldığını `2026-10-18` gibi metinlerle hatırlar. `toggled`, alışkanlığın kendisini değiştirmek yerine değişmiş bir kopya döndürür.
        3. `streak`'i yavaş yavaş oku: bugünden başlar (bugün henüz işaretli değilse dünden), alışkanlık yapıldığı sürece gün gün geriye yürür.
        4. Bu kodu test adımında düzgünce test edeceğiz. Şimdilik `flutter analyze` çalıştır: `No issues found!` yazmalı.
    code:
      - file: DartPad
        lang: dart
        text: |
          Future<void> main() async {
            // Variables and types
            final name = 'Read a book'; // final: set once
            var minutes = 20; // var: the type (int) is guessed, the value may change
            minutes = minutes + 5;
            String? note; // the ? means: this may be null (empty)
            print('$name for $minutes minutes, note: ${note ?? "none"}');

            // Collections
            final days = <String>['Mon', 'Tue'];
            final more = [...days, 'Wed']; // spread: copy the items and add one
            for (final day in more) {
              print(day);
            }
            print({for (final day in more) day: day.length});

            // A function and a class
            print(twice(4));
            print(Counter(3).next());

            // Something that takes time
            await Future.delayed(const Duration(seconds: 1));
            print('One second later');
          }

          int twice(int x) => x * 2;

          class Counter {
            const Counter(this.value);
            final int value;
            Counter next() => Counter(value + 1); // a new object, the old one stays
            @override
            String toString() => 'Counter($value)';
          }
      - file: lib/models/habit.dart
        lang: dart
        text: |
          /// "2026-10-18": one calendar day as text, so it is easy to store and compare.
          String dayKey(DateTime day) {
            final y = day.year.toString().padLeft(4, '0');
            final m = day.month.toString().padLeft(2, '0');
            final d = day.day.toString().padLeft(2, '0');
            return '$y-$m-$d';
          }

          class Habit {
            const Habit({required this.id, required this.name, this.doneOn = const {}});

            final String id;
            final String name;

            /// The days this habit was done, as dayKey text.
            final Set<String> doneOn;

            bool isDoneOn(DateTime day) => doneOn.contains(dayKey(day));

            /// A copy where [day] is ticked, or un-ticked if it was ticked already.
            Habit toggled(DateTime day) {
              final key = dayKey(day);
              final next = {...doneOn};
              if (!next.remove(key)) next.add(key);
              return Habit(id: id, name: name, doneOn: next);
            }

            /// How many days in a row the habit was done, counting back from [today].
            /// If today is not ticked yet, the streak still counts up to yesterday.
            int streak(DateTime today) {
              var day = DateTime(today.year, today.month, today.day);
              if (!isDoneOn(day)) day = DateTime(day.year, day.month, day.day - 1);
              var count = 0;
              while (isDoneOn(day)) {
                count++;
                day = DateTime(day.year, day.month, day.day - 1);
              }
              return count;
            }

            Map<String, Object?> toJson() => {
                  'id': id,
                  'name': name,
                  'doneOn': doneOn.toList()..sort(),
                };

            factory Habit.fromJson(Map<String, Object?> json) => Habit(
                  id: json['id'] as String,
                  name: json['name'] as String,
                  doneOn: {...(json['doneOn'] as List<Object?>).cast<String>()},
                );
          }
    mistakes:
      - problem:
          en: "\"A value of type 'String?' can't be assigned to a variable of type 'String'\"."
          tr: "\"A value of type 'String?' can't be assigned to a variable of type 'String'\" hatası."
        fix:
          en: "Dart is protecting you from null. Decide what should happen when the value is missing: give a fallback (`note ?? 'none'`) or check it first (`if (note != null) ...`). Avoid the `!` operator unless you are sure."
          tr: "Dart seni null'dan koruyor. Değer yoksa ne olacağına karar ver: bir yedek değer ver (`note ?? 'none'`) ya da önce kontrol et (`if (note != null) ...`). Emin olmadıkça `!` operatörünü kullanma."
      - problem:
          en: "Calling `habit.toggled(day)` and expecting `habit` itself to change."
          tr: "`habit.toggled(day)` çağırıp `habit`'in kendisinin değişmesini beklemek."
        fix:
          en: "`toggled` returns a new Habit. Keep the result: `habit = habit.toggled(day)`. Flutter notices changes by comparing old and new objects, so this style fits it well."
          tr: "`toggled` yeni bir Habit döndürür. Sonucu sakla: `habit = habit.toggled(day)`. Flutter değişiklikleri eski ve yeni nesneyi karşılaştırarak fark eder; bu stil ona çok uyar."
    quiz:
      - q:
          en: "What does `String? note;` mean?"
          tr: "`String? note;` ne demek?"
        options:
          en:
            - "note is a String and can also be null"
            - "note is always an empty string"
            - "note is optional to declare"
          tr:
            - "note bir String'tir ve null da olabilir"
            - "note her zaman boş bir metindir"
            - "note'u tanımlamak isteğe bağlıdır"
        answer: 0
        why:
          en: "The ? after a type allows null. Without it Dart refuses null for that variable."
          tr: "Tipten sonraki ? null'a izin verir. Olmadan Dart o değişken için null'ı kabul etmez."
    sources:
      - title: Dart language tour
        url: https://dart.dev/language
      - title: Dart, sound null safety
        url: https://dart.dev/null-safety
      - title: Dart, asynchronous programming
        url: https://dart.dev/libraries/async/async-await

  - id: widgets
    stage: basics
    title:
      en: "Widgets and layout"
      tr: "Widget'lar ve yerleşim"
    minutes: 75
    needs: [dart-basics]
    why:
      en: "In Flutter everything you see is a widget: text, a button, a padding, even the whole app. You build screens by putting small widgets inside bigger ones. Learn this idea and you can read any Flutter screen."
      tr: "Flutter'da gördüğün her şey bir widget'tır: yazı, düğme, boşluk, hatta uygulamanın tamamı. Ekranları küçük widget'ları büyüklerin içine koyarak kurarsın. Bu fikri öğrenince her Flutter ekranını okuyabilirsin."
    learn:
      en: |
        - `StatelessWidget` and its `build` method: a widget that only shows what it is given
        - Layout widgets: `Column`, `Row`, `Padding`, `Expanded`, `ListView`, `Card`, `ListTile`
        - `Scaffold` and `AppBar`: the frame of a Material screen
        - `const` widgets and why we write `const` wherever we can
        - Splitting a big `build` into small widgets of your own
      tr: |
        - `StatelessWidget` ve `build` metodu: sadece kendisine verileni gösteren widget
        - Yerleşim widget'ları: `Column`, `Row`, `Padding`, `Expanded`, `ListView`, `Card`, `ListTile`
        - `Scaffold` ve `AppBar`: bir Material ekranının çerçevesi
        - `const` widget'lar ve mümkün olan her yere neden `const` yazdığımız
        - Büyük bir `build`'i kendi küçük widget'larına bölmek
    do:
      en: |
        1. Delete `test/widget_test.dart` if you have not yet (it tests the old counter app).
        2. Create `lib/widgets/habit_tile.dart` with the first file below. It draws one habit as a card with a checkbox and a streak line.
        3. Create `lib/screens/home_screen.dart`: a screen with a few sample habits. The checkboxes do nothing yet.
        4. Replace `lib/main.dart` so the app uses the new screen and a colour theme made from one seed colour.
        5. Run the app (`flutter run -d chrome`). Resize the Chrome window: the list adapts. Try replacing `ListView` with a `Column` and add many habits: the `Column` overflows (yellow-black stripes) and the `ListView` scrolls.
      tr: |
        1. Henüz silmediysen `test/widget_test.dart` dosyasını sil (eski sayaç uygulamasını test ediyor).
        2. Aşağıdaki ilk dosyayla `lib/widgets/habit_tile.dart` dosyasını oluştur. Bir alışkanlığı onay kutusu ve seri satırı olan bir kart olarak çizer.
        3. `lib/screens/home_screen.dart` dosyasını oluştur: birkaç örnek alışkanlık gösteren bir ekran. Onay kutuları henüz bir şey yapmıyor.
        4. `lib/main.dart`'ı, uygulama yeni ekranı ve tek bir tohum renkten üretilmiş bir renk temasını kullanacak şekilde değiştir.
        5. Uygulamayı çalıştır (`flutter run -d chrome`). Chrome penceresini yeniden boyutlandır: liste uyum sağlar. `ListView`'ı `Column` ile değiştirip çok alışkanlık ekle: `Column` taşar (sarı-siyah çizgiler), `ListView` ise kayar.
    code:
      - file: lib/widgets/habit_tile.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';

          import '../models/habit.dart';

          class HabitTile extends StatelessWidget {
            const HabitTile({
              super.key,
              required this.habit,
              required this.today,
              required this.onToggle,
              this.onTap,
            });

            final Habit habit;
            final DateTime today;
            final VoidCallback onToggle;
            final VoidCallback? onTap;

            @override
            Widget build(BuildContext context) {
              final done = habit.isDoneOn(today);
              final streak = habit.streak(today);
              return Card(
                child: ListTile(
                  onTap: onTap,
                  leading: Checkbox(value: done, onChanged: (_) => onToggle()),
                  title: Text(
                    habit.name,
                    style: done
                        ? const TextStyle(decoration: TextDecoration.lineThrough)
                        : null,
                  ),
                  subtitle: Text(streak == 1 ? '1 day in a row' : '$streak days in a row'),
                ),
              );
            }
          }
      - file: lib/screens/home_screen.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';

          import '../models/habit.dart';
          import '../widgets/habit_tile.dart';

          class HomeScreen extends StatelessWidget {
            const HomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              final today = DateTime.now();
              final habits = [
                const Habit(id: '1', name: 'Read 20 minutes'),
                const Habit(id: '2', name: 'Drink water'),
              ];
              return Scaffold(
                appBar: AppBar(title: const Text('Habits')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    for (final habit in habits)
                      HabitTile(habit: habit, today: today, onToggle: () {}),
                  ],
                ),
              );
            }
          }
      - file: lib/main.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';

          import 'screens/home_screen.dart';

          void main() {
            runApp(const HabitApp());
          }

          class HabitApp extends StatelessWidget {
            const HabitApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Habit Tracker',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal),
                ),
                home: const HomeScreen(),
              );
            }
          }
    mistakes:
      - problem:
          en: "The yellow-black \"RenderFlex overflowed\" stripes appear."
          tr: "Sarı-siyah \"RenderFlex overflowed\" çizgileri çıkıyor."
        fix:
          en: "A `Column` or `Row` has more content than room. Wrap the overflowing child in `Expanded`, or use a scrolling widget such as `ListView`."
          tr: "Bir `Column` ya da `Row`'un içeriği yerinden fazla. Taşan çocuğu `Expanded` ile sar ya da `ListView` gibi kayan bir widget kullan."
      - problem:
          en: "\"Vertical viewport was given unbounded height\" when a `ListView` sits inside a `Column`."
          tr: "Bir `Column` içindeki `ListView` için \"Vertical viewport was given unbounded height\" hatası."
        fix:
          en: "A `Column` gives its children unlimited height and a `ListView` wants to fill all it gets. Wrap the `ListView` in `Expanded`."
          tr: "`Column` çocuklarına sınırsız yükseklik verir, `ListView` de verilen her yeri doldurmak ister. `ListView`'ı `Expanded` ile sar."
    quiz:
      - q:
          en: "What does `const` in front of a widget (`const Text('Hi')`) do?"
          tr: "Bir widget'ın önündeki `const` (`const Text('Hi')`) ne yapar?"
        options:
          en:
            - "It makes the widget faster to type"
            - "It creates the widget once while compiling so Flutter can reuse it"
            - "It stops the widget from showing"
          tr:
            - "Widget'ı yazmayı hızlandırır"
            - "Widget'ı derleme sırasında bir kez oluşturur, Flutter da tekrar kullanabilir"
            - "Widget'ın görünmesini engeller"
        answer: 1
        why:
          en: "A const widget is the same object on every rebuild, so Flutter can skip rebuilding it."
          tr: "const bir widget her yeniden çizimde aynı nesnedir; Flutter onu yeniden kurmayı atlayabilir."
    sources:
      - title: Introduction to widgets
