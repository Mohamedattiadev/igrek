  - id: tests
    stage: testing
    title:
      en: "Unit, widget and integration tests"
      tr: "Unit, widget ve integration testleri"
    minutes: 90
    needs: [http]
    why:
      en: "Tests are small programs that check your app for you, every time, in seconds. Flutter has three kinds. Unit tests check plain Dart code. Widget tests build a screen without a phone and tap it. Integration tests run the whole app on a device. Our streak code and our model are exactly the code that breaks silently."
      tr: "Testler, uygulamanı senin yerine her seferinde saniyeler içinde kontrol eden küçük programlardır. Flutter'da üç çeşit var. Unit testler düz Dart kodunu kontrol eder. Widget testler telefon olmadan bir ekran kurar ve ona dokunur. Integration testler bütün uygulamayı bir cihazda çalıştırır. Seri kodumuz ve modelimiz sessizce bozulan türden kodlar."
    learn:
      en: |
        - `test`, `expect` and matchers (`isTrue`, `isEmpty`, `throwsA`)
        - Passing a fake clock (`clock: () => today`), so tests do not depend on today's date
        - `MockClient` from `package:http/testing.dart`: fake answers, no real network
        - Widget tests: `testWidgets`, `pumpWidget`, `find`, `tap`, `pump`, `pumpAndSettle`
        - Integration tests with the `integration_test` package
      tr: |
        - `test`, `expect` ve matcher'lar (`isTrue`, `isEmpty`, `throwsA`)
        - Sahte saat vermek (`clock: () => today`); testler bugünün tarihine bağlı kalmaz
        - `package:http/testing.dart` içinden `MockClient`: sahte cevaplar, gerçek ağ yok
        - Widget testler: `testWidgets`, `pumpWidget`, `find`, `tap`, `pump`, `pumpAndSettle`
        - `integration_test` paketiyle integration testleri
    do:
      en: |
        1. Create the three unit test files below in `test/`. Run `flutter test`: all tests pass.
        2. Break something on purpose (for example change `day - 1` to `day - 2` in `streak`) and watch the test fail with a clear message. Undo it.
        3. Create `test/home_screen_test.dart`. It builds the home screen with a fake quote answer and a one-habit store, ticks the habit and checks the streak text.
        4. For the integration test add `integration_test` to `dev_dependencies` in `pubspec.yaml` (next to `flutter_test`) as shown, run `flutter pub get`, and create `integration_test/app_test.dart`.
        5. Integration tests need a device or an emulator (the Android step shows how to get one). Then run `flutter devices` to see its id and `flutter test integration_test -d <id>`. Until then the unit and widget tests are your safety net.
      tr: |
        1. `test/` içinde aşağıdaki üç unit test dosyasını oluştur. `flutter test` çalıştır: bütün testler geçer.
        2. Bilerek bir şeyi boz (örneğin `streak` içinde `day - 1`'i `day - 2` yap) ve testin açık bir mesajla kırıldığını izle. Geri al.
        3. `test/home_screen_test.dart` dosyasını oluştur. Ana ekranı sahte bir söz cevabı ve tek alışkanlıklı bir store ile kurar, alışkanlığı işaretler ve seri yazısını kontrol eder.
        4. Integration test için `pubspec.yaml`'daki `dev_dependencies` altına (`flutter_test`'in yanına) gösterildiği gibi `integration_test` ekle, `flutter pub get` çalıştır ve `integration_test/app_test.dart` dosyasını oluştur.
        5. Integration testler bir cihaz ya da emülatör ister (Android adımı nasıl edineceğini gösterir). Sonra id'sini görmek için `flutter devices`, sonra `flutter test integration_test -d <id>` çalıştır. O zamana kadar unit ve widget testleri güvenlik ağındır.
    code:
      - file: test/habit_test.dart
        lang: dart
        text: |
          import 'package:flutter_test/flutter_test.dart';
          import 'package:habit_tracker/data/habit_codec.dart';
          import 'package:habit_tracker/models/habit.dart';
          import 'package:habit_tracker/validation.dart';

          void main() {
            final today = DateTime(2026, 10, 18);

            test('dayKey pads month and day', () {
              expect(dayKey(DateTime(2026, 3, 5)), '2026-03-05');
            });

            test('toggled ticks a day and un-ticks it again', () {
              const habit = Habit(id: '1', name: 'Read');
              final ticked = habit.toggled(today);
              expect(ticked.isDoneOn(today), isTrue);
              expect(habit.isDoneOn(today), isFalse, reason: 'the original must not change');
              expect(ticked.toggled(today).isDoneOn(today), isFalse);
            });

            test('streak counts days in a row, also across a month end', () {
              final habit = const Habit(id: '1', name: 'Read')
                  .toggled(DateTime(2026, 10, 18))
                  .toggled(DateTime(2026, 10, 17))
                  .toggled(DateTime(2026, 10, 16))
                  .toggled(DateTime(2026, 10, 13));
              expect(habit.streak(today), 3);
              expect(habit.streak(DateTime(2026, 10, 19)), 3, reason: 'yesterday still counts');
              expect(habit.streak(DateTime(2026, 10, 20)), 0);
              final overMonth = const Habit(id: '2', name: 'Run')
                  .toggled(DateTime(2026, 9, 30))
                  .toggled(DateTime(2026, 10, 1));
              expect(overMonth.streak(DateTime(2026, 10, 1)), 2);
            });

            test('habits survive encode and decode', () {
              final habits = [const Habit(id: '1', name: 'Read').toggled(today)];
              final back = decodeHabits(encodeHabits(habits));
              expect(back.single.name, 'Read');
              expect(back.single.isDoneOn(today), isTrue);
            });

            test('damaged saved text gives an empty list', () {
              expect(decodeHabits('not json'), isEmpty);
              expect(decodeHabits('{"a": 1}'), isEmpty);
              expect(decodeHabits(null), isEmpty);
            });

            test('validateHabitName', () {
              expect(validateHabitName('  '), isNotNull);
              expect(validateHabitName('a' * 41), isNotNull);
              expect(validateHabitName('Read', existing: ['read']), isNotNull);
              expect(validateHabitName(' Read '), isNull);
            });
          }
      - file: test/habits_model_test.dart
        lang: dart
        text: |
          import 'package:flutter_test/flutter_test.dart';
          import 'package:habit_tracker/data/habit_store.dart';
          import 'package:habit_tracker/state/habits_model.dart';

          void main() {
            final today = DateTime(2026, 10, 18);

            test('add, toggle and remove change the list and tell listeners', () async {
              final store = MemoryHabitStore();
              final model = HabitsModel(store, clock: () => today);
              var calls = 0;
              model.addListener(() => calls++);

              await model.load();
              await model.add('  Read  ');
              expect(model.habits.single.name, 'Read');

              final id = model.habits.single.id;
              await model.toggle(id);
              expect(model.byId(id)!.isDoneOn(today), isTrue);

              expect((await store.load()).single.isDoneOn(today), isTrue,
                  reason: 'changes are saved');

              await model.remove(id);
              expect(model.habits, isEmpty);
              expect(calls, 4);
            });
          }
      - file: test/quote_client_test.dart
        lang: dart
        text: |
          import 'package:flutter_test/flutter_test.dart';
          import 'package:habit_tracker/data/quote_client.dart';
          import 'package:http/http.dart' as http;
          import 'package:http/testing.dart';

          void main() {
            test('reads a quote from the answer', () async {
              final client = QuoteClient(MockClient((request) async {
                expect(request.url.host, 'dummyjson.com');
                return http.Response('{"id":1,"quote":"Keep going.","author":"Ada"}', 200);
              }));
              final quote = await client.fetch();
              expect(quote.text, 'Keep going.');
              expect(quote.author, 'Ada');
            });

            test('a server error becomes a QuoteException', () async {
              final client = QuoteClient(MockClient((_) async => http.Response('oops', 500)));
              expect(client.fetch(), throwsA(isA<QuoteException>()));
            });

            test('a strange answer becomes a QuoteException', () async {
              final client = QuoteClient(MockClient((_) async => http.Response('{"x":1}', 200)));
              expect(client.fetch(), throwsA(isA<QuoteException>()));
            });

            test('no network becomes a QuoteException', () async {
              final client = QuoteClient(MockClient((_) async => throw http.ClientException('down')));
              expect(client.fetch(), throwsA(isA<QuoteException>()));
            });
          }
      - file: test/home_screen_test.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:habit_tracker/data/habit_store.dart';
          import 'package:habit_tracker/data/quote_client.dart';
          import 'package:habit_tracker/models/habit.dart';
          import 'package:habit_tracker/screens/home_screen.dart';
          import 'package:habit_tracker/state/habits_model.dart';
          import 'package:http/http.dart' as http;
          import 'package:http/testing.dart';
          import 'package:provider/provider.dart';

          void main() {
            testWidgets('ticking a habit raises its streak', (tester) async {
              final model = HabitsModel(
                MemoryHabitStore([const Habit(id: '1', name: 'Read')]),
                clock: () => DateTime(2026, 10, 18),
              );
              await model.load();

              await tester.pumpWidget(
                MultiProvider(
                  providers: [
                    ChangeNotifierProvider.value(value: model),
                    Provider(
                      create: (_) => QuoteClient(
                        MockClient((_) async =>
                            http.Response('{"quote":"Keep going.","author":"Ada"}', 200)),
                      ),
                    ),
                  ],
                  child: const MaterialApp(home: HomeScreen()),
                ),
              );
              await tester.pumpAndSettle();

              expect(find.text('Read'), findsOneWidget);
              expect(find.text('0 days in a row'), findsOneWidget);
              expect(find.textContaining('Keep going.'), findsOneWidget);

              await tester.tap(find.byType(Checkbox));
              await tester.pump();

              expect(find.text('1 day in a row'), findsOneWidget);
            });
          }
      - file: pubspec.yaml
        lang: yaml
        text: |
          dev_dependencies:
            flutter_test:
              sdk: flutter
            integration_test:
              sdk: flutter
      - file: integration_test/app_test.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:habit_tracker/main.dart' as app;
          import 'package:integration_test/integration_test.dart';

          void main() {
            IntegrationTestWidgetsFlutterBinding.ensureInitialized();

            testWidgets('add a habit and tick it', (tester) async {
              app.main();
              await tester.pumpAndSettle();

              await tester.tap(find.byType(FloatingActionButton));
              await tester.pumpAndSettle();
              await tester.enterText(find.byType(TextFormField), 'Stretch');
              await tester.tap(find.text('Save'));
              await tester.pumpAndSettle();

              expect(find.text('Stretch'), findsOneWidget);
              await tester.tap(find.byType(Checkbox).last);
              await tester.pumpAndSettle();
              expect(find.text('1 day in a row'), findsOneWidget);
            });
          }
    mistakes:
      - problem:
          en: "The widget test hangs or fails with \"A Timer is still pending\" or \"pumpAndSettle timed out\"."
          tr: "Widget testi takılıyor ya da \"A Timer is still pending\" ya da \"pumpAndSettle timed out\" ile kırılıyor."
        fix:
          en: "Something keeps animating or waiting (a spinner, a real network call). Replace network code with a fake like `MockClient`, and use `pump()` with a duration instead of `pumpAndSettle()` for endless animations."
          tr: "Bir şey durmadan animasyon yapıyor ya da bekliyor (bir spinner, gerçek bir ağ çağrısı). Ağ kodunu `MockClient` gibi sahteyle değiştir ve bitmeyen animasyonlarda `pumpAndSettle()` yerine süreli `pump()` kullan."
      - problem:
          en: "Tests that depend on today's date or on the real internet pass today and fail next week."
          tr: "Bugünün tarihine ya da gerçek internete bağlı testler bugün geçer, haftaya kırılır."
        fix:
          en: "Inject the clock and the HTTP client, as the model and `QuoteClient` do, and give the test fixed values."
          tr: "Modelin ve `QuoteClient`'ın yaptığı gibi saati ve HTTP istemcisini dışarıdan ver; teste sabit değerler ver."
    quiz:
      - q:
          en: "Which kind of test builds a screen and taps a button without a phone?"
          tr: "Hangi tür test telefon olmadan bir ekran kurar ve bir düğmeye dokunur?"
        options:
          en:
            - "Unit test"
            - "Widget test"
            - "Integration test"
          tr:
            - "Unit test"
            - "Widget test"
            - "Integration test"
        answer: 1
        why:
          en: "Widget tests run in a test environment on your computer. Integration tests run the real app on a device or emulator."
          tr: "Widget testleri bilgisayarındaki bir test ortamında çalışır. Integration testleri gerçek uygulamayı bir cihazda ya da emülatörde çalıştırır."
    sources:
