      - title: Layouts in Flutter
        url: https://docs.flutter.dev/ui/layout
      - title: Understanding constraints
        url: https://docs.flutter.dev/ui/layout/constraints

  - id: set-state
    stage: basics
    title:
      en: "State with setState"
      tr: "setState ile state"
    minutes: 45
    needs: [widgets]
    why:
      en: "A screen that never changes is only a picture. State is data that changes while the app runs, like which habits are ticked. In Flutter, you change state and ask Flutter to draw the widget again. `setState` is the simplest way, and the first one to learn."
      tr: "Hiç değişmeyen bir ekran sadece bir resimdir. State, uygulama çalışırken değişen veridir; hangi alışkanlıkların işaretli olduğu gibi. Flutter'da state'i değiştirir ve Flutter'dan widget'ı yeniden çizmesini istersin. `setState` en basit yoldur ve ilk öğrenilecek olandır."
    learn:
      en: |
        - `StatefulWidget` and its `State` class
        - Calling `setState(() { ... })` after you change data, so Flutter calls `build` again
        - Callbacks: the tile does not know how to toggle, it tells its parent through `onToggle`
        - When `setState` is enough (state used by one widget) and when it is not
      tr: |
        - `StatefulWidget` ve ona ait `State` sınıfı
        - Veriyi değiştirdikten sonra `setState(() { ... })` çağırmak; böylece Flutter `build`'i yeniden çağırır
        - Callback'ler: tile nasıl işaretleneceğini bilmez, `onToggle` ile üstündeki widget'a haber verir
        - `setState`'in ne zaman yettiği (state'i tek widget kullanıyorsa) ve ne zaman yetmediği
    do:
      en: |
        1. Replace `lib/screens/home_screen.dart` with the version below. The list of habits now lives in the `State` object.
        2. Run the app and tick a habit. The line-through and the streak change at once.
        3. Press `R` (hot restart): the ticks are gone. State lives only in memory for now.
        4. Think about this: if a second screen needed the same list, `setState` in this one widget could not share it. The next step fixes that.
      tr: |
        1. `lib/screens/home_screen.dart` dosyasını aşağıdaki sürümle değiştir. Alışkanlık listesi artık `State` nesnesinin içinde yaşıyor.
        2. Uygulamayı çalıştır ve bir alışkanlığı işaretle. Üstü çizilme ve seri hemen değişir.
        3. `R`'ye bas (hot restart): işaretler kayboldu. State şimdilik sadece bellekte duruyor.
        4. Şunu düşün: ikinci bir ekranın da aynı listeye ihtiyacı olsaydı, tek bir widget içindeki `setState` onu paylaşamazdı. Sonraki adım bunu çözer.
    code:
      - file: lib/screens/home_screen.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';

          import '../models/habit.dart';
          import '../widgets/habit_tile.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            List<Habit> _habits = [
              const Habit(id: '1', name: 'Read 20 minutes'),
              const Habit(id: '2', name: 'Drink water'),
            ];

            void _toggle(String id) {
              final today = DateTime.now();
              setState(() {
                _habits = [
                  for (final habit in _habits)
                    habit.id == id ? habit.toggled(today) : habit,
                ];
              });
            }

            @override
            Widget build(BuildContext context) {
              final today = DateTime.now();
              return Scaffold(
                appBar: AppBar(title: const Text('Habits')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    for (final habit in _habits)
                      HabitTile(
                        habit: habit,
                        today: today,
                        onToggle: () => _toggle(habit.id),
                      ),
                  ],
                ),
              );
            }
          }
    mistakes:
      - problem:
          en: "Changing the data without `setState`, and the screen does not update."
          tr: "Veriyi `setState` olmadan değiştirmek ve ekranın güncellenmemesi."
        fix:
          en: "Flutter only draws again when told. Put the change inside `setState(() { ... })`."
          tr: "Flutter sadece söylenince yeniden çizer. Değişikliği `setState(() { ... })` içine koy."
      - problem:
          en: "Calling `setState` after an `await` and getting \"setState() called after dispose()\"."
          tr: "Bir `await`'ten sonra `setState` çağırıp \"setState() called after dispose()\" hatası almak."
        fix:
          en: "The user may have left the screen while you waited. Check `if (!mounted) return;` before calling `setState`."
          tr: "Sen beklerken kullanıcı ekrandan ayrılmış olabilir. `setState`'ten önce `if (!mounted) return;` ile kontrol et."
    quiz:
      - q:
          en: "What does `setState` do?"
          tr: "`setState` ne yapar?"
        options:
          en:
            - "It saves the data to the disk"
            - "It runs your change and tells Flutter to call build again"
            - "It changes the state of the whole app"
          tr:
            - "Veriyi diske kaydeder"
            - "Değişikliğini çalıştırır ve Flutter'a build'i yeniden çağırmasını söyler"
            - "Bütün uygulamanın state'ini değiştirir"
        answer: 1
        why:
          en: "It does not save anything. It only marks this widget as needing a redraw after your change."
          tr: "Hiçbir şey kaydetmez. Sadece değişikliğinden sonra bu widget'ı yeniden çizilmesi gereken olarak işaretler."
    sources:
      - title: Differentiate between ephemeral state and app state
        url: https://docs.flutter.dev/data-and-backend/state-mgmt/ephemeral-vs-app
      - title: setState (API reference)
        url: https://api.flutter.dev/flutter/widgets/State/setState.html

  - id: provider-state
    stage: first-project
    title:
      en: "Shared state with ChangeNotifier and Provider"
      tr: "ChangeNotifier ve Provider ile ortak state"
    minutes: 75
    needs: [set-state]
    why:
      en: "When several screens need the same data, it must live above them, in one place, and the screens must be told when it changes. The Flutter docs recommend starting with the `provider` package and a `ChangeNotifier` class for this. Your logic then sits in a plain class that is easy to test, and the widgets only show it."
      tr: "Birkaç ekran aynı veriye ihtiyaç duyunca veri onların üstünde, tek bir yerde yaşamalı ve değişince ekranlara haber verilmeli. Flutter dokümanları bunun için `provider` paketi ve bir `ChangeNotifier` sınıfıyla başlamayı önerir. Böylece mantığın test etmesi kolay düz bir sınıfta durur, widget'lar sadece onu gösterir."
    learn:
      en: |
        - `ChangeNotifier` and `notifyListeners()`: a model that tells its listeners it changed
        - A store interface (`HabitStore`): the model does not care where habits are kept, which makes a database easy to add later
        - `ChangeNotifierProvider`, `Consumer` and `context.read` / `context.watch`
        - Other options exist (Riverpod, Bloc, signals); the idea is the same. The docs list them on their state management options page.
      tr: |
        - `ChangeNotifier` ve `notifyListeners()`: değiştiğini dinleyenlere haber veren bir model
        - Bir saklama arayüzü (`HabitStore`): model alışkanlıkların nerede tutulduğunu umursamaz; bu da sonradan veritabanı eklemeyi kolaylaştırır
        - `ChangeNotifierProvider`, `Consumer` ve `context.read` / `context.watch`
        - Başka seçenekler de var (Riverpod, Bloc, signals); fikir aynı. Dokümanlar onları state management options sayfasında listeler.
    do:
      en: |
        1. Add the package: `flutter pub add provider`.
        2. Create `lib/data/habit_store.dart` and `lib/state/habits_model.dart` below. The model holds the list, and every change makes a new list, tells the listeners and saves it.
        3. Replace `lib/screens/home_screen.dart`. It reads the model with `Consumer`. The plus button opens a small dialog for a name (we replace it by a proper form soon).
        4. Replace `lib/main.dart`: `ChangeNotifierProvider` creates the model once, above the whole app, and calls `load()`.
        5. Run it, add two habits and tick them. Everything still disappears on restart: the store only keeps data in memory. The persistence step fixes that.
      tr: |
        1. Paketi ekle: `flutter pub add provider`.
        2. Aşağıdaki `lib/data/habit_store.dart` ve `lib/state/habits_model.dart` dosyalarını oluştur. Model listeyi tutar; her değişiklik yeni bir liste yapar, dinleyenlere haber verir ve kaydeder.
        3. `lib/screens/home_screen.dart` dosyasını değiştir. Modeli `Consumer` ile okur. Artı düğmesi isim için küçük bir diyalog açar (onu yakında düzgün bir formla değiştireceğiz).
        4. `lib/main.dart`'ı değiştir: `ChangeNotifierProvider` modeli bütün uygulamanın üstünde bir kez oluşturur ve `load()` çağırır.
        5. Çalıştır, iki alışkanlık ekle ve işaretle. Yeniden başlatınca her şey yine kaybolur: store veriyi sadece bellekte tutuyor. Kalıcılık adımı bunu çözer.
    code:
      - file: terminal
        lang: sh
        text: |
          flutter pub add provider
      - file: lib/data/habit_store.dart
        lang: dart
        text: |
          import '../models/habit.dart';

          /// Where habits are kept. The app talks to this, not to a database directly.
          abstract class HabitStore {
            Future<List<Habit>> load();
            Future<void> save(List<Habit> habits);
          }

          /// Keeps habits in memory only. Good for tests and for the first version.
          class MemoryHabitStore implements HabitStore {
            MemoryHabitStore([List<Habit> initial = const []]) : _habits = [...initial];

            List<Habit> _habits;

            @override
            Future<List<Habit>> load() async => [..._habits];

            @override
            Future<void> save(List<Habit> habits) async => _habits = [...habits];
          }
      - file: lib/state/habits_model.dart
        lang: dart
        text: |
          import 'dart:collection';

          import 'package:flutter/foundation.dart';

          import '../data/habit_store.dart';
          import '../models/habit.dart';

          class HabitsModel extends ChangeNotifier {
            HabitsModel(this._store, {DateTime Function()? clock})
                : _clock = clock ?? DateTime.now;

            final HabitStore _store;
            final DateTime Function() _clock;
            List<Habit> _habits = [];
            bool _loaded = false;

            UnmodifiableListView<Habit> get habits => UnmodifiableListView(_habits);
            bool get loaded => _loaded;
            DateTime get today => _clock();

            Habit? byId(String id) {
              for (final h in _habits) {
                if (h.id == id) return h;
              }
              return null;
            }

            Future<void> load() async {
              _habits = await _store.load();
              _loaded = true;
              notifyListeners();
            }

            Future<void> add(String name) async {
              final id = '${_clock().microsecondsSinceEpoch}-${_habits.length}';
              _habits = [..._habits, Habit(id: id, name: name.trim())];
              notifyListeners();
              await _store.save(_habits);
            }

            Future<void> toggle(String id) async {
              final day = today;
              _habits = [for (final h in _habits) h.id == id ? h.toggled(day) : h];
              notifyListeners();
              await _store.save(_habits);
            }

            Future<void> remove(String id) async {
              _habits = [for (final h in _habits) if (h.id != id) h];
              notifyListeners();
              await _store.save(_habits);
            }
          }
      - file: lib/screens/home_screen.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';

          import '../state/habits_model.dart';
          import '../widgets/habit_tile.dart';

          class HomeScreen extends StatelessWidget {
            const HomeScreen({super.key});

            Future<void> _addHabit(BuildContext context) async {
              final model = context.read<HabitsModel>();
              final name = await showDialog<String>(
                context: context,
                builder: (_) => const _NameDialog(),
              );
              if (name != null && name.trim().isNotEmpty) await model.add(name);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Habits')),
                body: Consumer<HabitsModel>(
                  builder: (context, model, _) {
                    if (!model.loaded) {
                      return const Center(child: CircularProgressIndicator());
                    }
                    if (model.habits.isEmpty) {
                      return const Center(child: Text('No habits yet. Tap + to add one.'));
                    }
                    return ListView(
                      padding: const EdgeInsets.all(16),
                      children: [
                        for (final habit in model.habits)
                          HabitTile(
                            habit: habit,
                            today: model.today,
                            onToggle: () => model.toggle(habit.id),
                          ),
                      ],
                    );
                  },
                ),
                floatingActionButton: FloatingActionButton(
                  onPressed: () => _addHabit(context),
                  tooltip: 'Add habit',
                  child: const Icon(Icons.add),
                ),
              );
            }
          }

          class _NameDialog extends StatefulWidget {
            const _NameDialog();

            @override
            State<_NameDialog> createState() => _NameDialogState();
          }

          class _NameDialogState extends State<_NameDialog> {
            final _controller = TextEditingController();

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return AlertDialog(
                title: const Text('New habit'),
                content: TextField(
                  controller: _controller,
                  autofocus: true,
                  decoration: const InputDecoration(labelText: 'Name'),
                  onSubmitted: (value) => Navigator.of(context).pop(value),
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.of(context).pop(),
                    child: const Text('Cancel'),
                  ),
                  FilledButton(
                    onPressed: () => Navigator.of(context).pop(_controller.text),
                    child: const Text('Add'),
                  ),
                ],
              );
            }
          }
      - file: lib/main.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';

          import 'data/habit_store.dart';
          import 'screens/home_screen.dart';
          import 'state/habits_model.dart';

          void main() {
            runApp(
              ChangeNotifierProvider(
                create: (_) => HabitsModel(MemoryHabitStore())..load(),
                child: const HabitApp(),
              ),
            );
          }

          class HabitApp extends StatelessWidget {
            const HabitApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Habit Tracker',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal),
                ),
                home: const HomeScreen(),
              );
            }
          }
    mistakes:
      - problem:
          en: "\"Could not find the correct Provider<HabitsModel> above this widget\"."
          tr: "\"Could not find the correct Provider<HabitsModel> above this widget\" hatası."
        fix:
          en: "The widget that reads the model must be below the `ChangeNotifierProvider` in the widget tree. Put the provider above `MaterialApp` as shown, and do a hot restart (`R`) after changing `main()`."
          tr: "Modeli okuyan widget, widget ağacında `ChangeNotifierProvider`'ın altında olmalı. Provider'ı gösterildiği gibi `MaterialApp`'in üstüne koy ve `main()`'i değiştirdikten sonra hot restart (`R`) yap."
      - problem:
          en: "Changing the list inside the model (`_habits.add(...)`) and forgetting `notifyListeners()`; the screen stays the same."
          tr: "Model içindeki listeyi değiştirip (`_habits.add(...)`) `notifyListeners()`'ı unutmak; ekran aynı kalır."
        fix:
          en: "Every method that changes data must end in `notifyListeners()`. Replacing the list with a new one, as the code does, also keeps old copies safe."
          tr: "Veriyi değiştiren her metot `notifyListeners()` ile bitmeli. Kodun yaptığı gibi listeyi yenisiyle değiştirmek eski kopyaları da güvende tutar."
      - problem:
          en: "Using `context.watch` inside a button callback like `onPressed`."
          tr: "`onPressed` gibi bir düğme callback'inin içinde `context.watch` kullanmak."
        fix:
          en: "Use `context.read` for actions (it does not listen) and `context.watch` or `Consumer` only to build what you show."
          tr: "Eylemler için `context.read` kullan (dinlemez); `context.watch` ya da `Consumer`'ı sadece gösterdiğin şeyi kurmak için kullan."
    quiz:
      - q:
          en: "Why does the model end each change with `notifyListeners()`?"
          tr: "Model neden her değişikliği `notifyListeners()` ile bitiriyor?"
        options:
          en:
            - "To save the data"
            - "To tell the widgets that listen to rebuild"
            - "To make the list read-only"
          tr:
            - "Veriyi kaydetmek için"
            - "Dinleyen widget'lara yeniden çizilmelerini söylemek için"
            - "Listeyi salt okunur yapmak için"
        answer: 1
        why:
          en: "Consumer and context.watch rebuild only when the model calls notifyListeners()."
          tr: "Consumer ve context.watch sadece model notifyListeners() çağırınca yeniden çizilir."
    sources:
      - title: Simple app state management (Provider and ChangeNotifier)
        url: https://docs.flutter.dev/data-and-backend/state-mgmt/simple
      - title: State management options
        url: https://docs.flutter.dev/data-and-backend/state-mgmt/options
      - title: provider package
        url: https://pub.dev/packages/provider

  - id: navigation
    stage: first-project
    title:
      en: "Screens and navigation with go_router"
      tr: "go_router ile ekranlar ve geçişler"
    minutes: 60
    needs: [provider-state]
    why:
      en: "Real apps have more than one screen. The Flutter docs say small apps without deep links can use the built-in `Navigator`, and apps that need links to screens (like a web app, where every screen has an address) should use a routing package such as go_router. We use go_router because our app also runs on the web."
      tr: "Gerçek uygulamalarda birden fazla ekran olur. Flutter dokümanları, derin bağlantı (deep link) gerektirmeyen küçük uygulamaların yerleşik `Navigator`'ı kullanabileceğini, ekranlara bağlantı gereken uygulamaların (her ekranın bir adresi olduğu web uygulaması gibi) go_router gibi bir yönlendirme paketi kullanması gerektiğini söyler. Uygulamamız webde de çalıştığı için go_router kullanıyoruz."
    learn:
      en: |
        - A route is an address like `/` or `/habit/42` that maps to a screen
        - `GoRouter`, `GoRoute`, `MaterialApp.router` and `routerConfig`
        - Path parameters: `habit/:id` and `state.pathParameters['id']`
        - `context.go` to move to a screen, `context.pop` to go back; nested routes give you the back button for free
      tr: |
        - Rota (route), `/` ya da `/habit/42` gibi bir ekrana karşılık gelen adrestir
        - `GoRouter`, `GoRoute`, `MaterialApp.router` ve `routerConfig`
        - Yol parametreleri: `habit/:id` ve `state.pathParameters['id']`
        - Bir ekrana gitmek için `context.go`, geri dönmek için `context.pop`; iç içe rotalar geri düğmesini bedavaya verir
    do:
      en: |
        1. Add the package: `flutter pub add go_router`.
        2. Create `lib/router.dart` below. The `habit/:id` route is inside the `/` route, so the full address is `/habit/<id>` and the app bar shows a back button.
        3. Create `lib/screens/habit_screen.dart`: it shows the streak, the last 14 days and a delete button.
        4. In `lib/main.dart` switch to `MaterialApp.router`.
        5. In `lib/screens/home_screen.dart` add `onTap: () => context.go('/habit/${habit.id}')` to the `HabitTile` and import `package:go_router/go_router.dart`.
        6. Run in Chrome, open a habit and look at the address bar: it ends in `#/habit/...`. Reload the page: you stay on the same screen. Press the browser's back button.
      tr: |
        1. Paketi ekle: `flutter pub add go_router`.
        2. Aşağıdaki `lib/router.dart` dosyasını oluştur. `habit/:id` rotası `/` rotasının içinde; yani tam adres `/habit/<id>` olur ve uygulama çubuğu geri düğmesi gösterir.
        3. `lib/screens/habit_screen.dart` dosyasını oluştur: seriyi, son 14 günü ve bir silme düğmesini gösterir.
        4. `lib/main.dart`'ta `MaterialApp.router`'a geç.
        5. `lib/screens/home_screen.dart`'ta `HabitTile`'a `onTap: () => context.go('/habit/${habit.id}')` ekle ve `package:go_router/go_router.dart`'ı import et.
        6. Chrome'da çalıştır, bir alışkanlığı aç ve adres çubuğuna bak: `#/habit/...` ile bitiyor. Sayfayı yenile: aynı ekranda kalırsın. Tarayıcının geri düğmesine bas.
    code:
      - file: terminal
        lang: sh
        text: |
          flutter pub add go_router
      - file: lib/router.dart
        lang: dart
        text: |
          import 'package:go_router/go_router.dart';

          import 'screens/habit_screen.dart';
          import 'screens/home_screen.dart';

          final router = GoRouter(
            routes: [
              GoRoute(
                path: '/',
                builder: (context, state) => const HomeScreen(),
                routes: [
                  GoRoute(
                    path: 'habit/:id',
                    builder: (context, state) =>
                        HabitScreen(id: state.pathParameters['id']!),
                  ),
                ],
              ),
            ],
          );
      - file: lib/screens/habit_screen.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:go_router/go_router.dart';
          import 'package:provider/provider.dart';

          import '../state/habits_model.dart';

          class HabitScreen extends StatelessWidget {
            const HabitScreen({super.key, required this.id});

            final String id;

            @override
            Widget build(BuildContext context) {
              final model = context.watch<HabitsModel>();
              final habit = model.byId(id);
              if (habit == null) {
                return Scaffold(
                  appBar: AppBar(),
                  body: const Center(child: Text('This habit does not exist (any more).')),
                );
              }
              final today = model.today;
              return Scaffold(
                appBar: AppBar(title: Text(habit.name)),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        'Streak: ${habit.streak(today)} days',
                        style: Theme.of(context).textTheme.headlineSmall,
                      ),
                      const SizedBox(height: 16),
                      const Text('Last 14 days'),
                      const SizedBox(height: 8),
                      Wrap(
                        spacing: 6,
                        runSpacing: 6,
                        children: [
                          for (var i = 13; i >= 0; i--)
                            Icon(
                              habit.isDoneOn(
                                DateTime(today.year, today.month, today.day - i),
                              )
                                  ? Icons.check_circle
                                  : Icons.radio_button_unchecked,
                            ),
                        ],
                      ),
                      const Spacer(),
                      OutlinedButton.icon(
                        onPressed: () {
                          context.pop();
                          model.remove(habit.id);
                        },
                        icon: const Icon(Icons.delete_outline),
                        label: const Text('Delete habit'),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
      - file: lib/main.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';

          import 'data/habit_store.dart';
          import 'router.dart';
          import 'state/habits_model.dart';

          void main() {
            runApp(
              ChangeNotifierProvider(
                create: (_) => HabitsModel(MemoryHabitStore())..load(),
                child: const HabitApp(),
              ),
            );
          }

          class HabitApp extends StatelessWidget {
            const HabitApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp.router(
                title: 'Habit Tracker',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal),
                ),
                routerConfig: router,
              );
            }
          }
    mistakes:
      - problem:
          en: "Using `MaterialApp(home: ...)` together with go_router, and the routes are ignored."
          tr: "go_router ile birlikte `MaterialApp(home: ...)` kullanmak ve rotaların yok sayılması."
        fix:
          en: "Use `MaterialApp.router(routerConfig: router)` and remove `home:`."
          tr: "`MaterialApp.router(routerConfig: router)` kullan ve `home:`'u kaldır."
      - problem:
          en: "The detail screen has no back button."
          tr: "Detay ekranında geri düğmesi yok."
        fix:
          en: "`context.go` replaces the whole stack with the stack that matches the address. Nest the detail route inside `/` as shown, or use `context.push` to put a screen on top."
          tr: "`context.go` bütün yığını adrese uyan yığınla değiştirir. Detay rotasını gösterildiği gibi `/` içine yerleştir ya da bir ekranı üste koymak için `context.push` kullan."
      - problem:
          en: "Using named routes with `Navigator.pushNamed` for everything."
          tr: "Her şey için `Navigator.pushNamed` ile isimli rotalar kullanmak."
        fix:
          en: "The Flutter docs advise against named routes in most apps: they cannot customize deep links and do not support the browser forward button. Use go_router."
          tr: "Flutter dokümanları çoğu uygulamada isimli rotaları önermez: derin bağlantıları özelleştiremezler ve tarayıcının ileri düğmesini desteklemezler. go_router kullan."
    quiz:
      - q:
          en: "In `GoRoute(path: 'habit/:id', ...)` what is `:id`?"
          tr: "`GoRoute(path: 'habit/:id', ...)` içinde `:id` nedir?"
        options:
          en:
            - "A path parameter you read with state.pathParameters"
            - "A comment"
            - "The name of a widget"
          tr:
            - "state.pathParameters ile okuduğun bir yol parametresi"
            - "Bir yorum"
            - "Bir widget'ın adı"
        answer: 0
        why:
          en: "A colon marks a part of the address that changes. For /habit/42 the id is the text 42."
          tr: "İki nokta adresin değişen bir parçasını işaretler. /habit/42 için id, 42 metnidir."
    sources:
      - title: Navigation and routing
        url: https://docs.flutter.dev/ui/navigation
      - title: go_router package
        url: https://pub.dev/packages/go_router
      - title: go_router, get started
        url: https://pub.dev/documentation/go_router/latest/topics/Get%20started-topic.html

  - id: forms
    stage: first-project
    title:
      en: "A form with validation"
      tr: "Doğrulamalı bir form"
    minutes: 60
    needs: [navigation]
    why:
      en: "People type empty names, very long names and the same name twice. A form checks input before it is used and tells the person what to fix. The check lives in a plain Dart function, so you can test it without any screen."
      tr: "İnsanlar boş isim, çok uzun isim ve aynı ismi iki kez yazar. Form, girdiyi kullanılmadan önce kontrol eder ve kişiye neyi düzelteceğini söyler. Kontrol düz bir Dart fonksiyonunda durur; böylece ekran olmadan test edebilirsin."
    learn:
      en: |
        - `Form`, `GlobalKey<FormState>` and `TextFormField` with a `validator`
        - A validator returns an error text, or `null` when the input is fine
        - `TextEditingController` and why you must `dispose` it
        - After an `await`, check `mounted` before using the screen again
      tr: |
        - `Form`, `GlobalKey<FormState>` ve `validator` ile `TextFormField`
        - Validator, hata metni döndürür; girdi iyiyse `null` döndürür
        - `TextEditingController` ve neden `dispose` etmen gerektiği
        - Bir `await`'ten sonra ekranı yeniden kullanmadan önce `mounted` kontrolü
    do:
      en: |
        1. Create `lib/validation.dart` with the check function.
        2. Create `lib/screens/add_habit_screen.dart`. It validates when you press Save or the keyboard's done key, adds the habit and goes back.
        3. Add the `add` route next to `habit/:id` in `lib/router.dart`.
        4. In `lib/screens/home_screen.dart` make the plus button `onPressed: () => context.go('/add')`, then delete `_addHabit` and the whole `_NameDialog` class and import `package:go_router/go_router.dart`.
        5. Try an empty name, 41 letters, and the same name twice (also in different case). Each shows its own message under the field.
      tr: |
        1. Kontrol fonksiyonuyla `lib/validation.dart` dosyasını oluştur.
        2. `lib/screens/add_habit_screen.dart` dosyasını oluştur. Kaydet'e ya da klavyenin bitti tuşuna basınca doğrular, alışkanlığı ekler ve geri döner.
        3. `lib/router.dart` içinde `habit/:id`'nin yanına `add` rotasını ekle.
        4. `lib/screens/home_screen.dart`'ta artı düğmesini `onPressed: () => context.go('/add')` yap, sonra `_addHabit`'i ve bütün `_NameDialog` sınıfını sil ve `package:go_router/go_router.dart`'ı import et.
        5. Boş bir isim, 41 harf ve aynı ismi iki kez (farklı büyük/küçük harfle de) dene. Her biri alanın altında kendi mesajını gösterir.
    code:
      - file: lib/validation.dart
        lang: dart
        text: |
          /// Returns an error message, or null when the name is fine.
          String? validateHabitName(String? value, {Iterable<String> existing = const []}) {
            final name = value?.trim() ?? '';
            if (name.isEmpty) return 'Write a name for the habit.';
            if (name.length > 40) return 'Keep it under 40 characters.';
            final taken = existing.any((e) => e.toLowerCase() == name.toLowerCase());
            if (taken) return 'You already have this habit.';
            return null;
          }
      - file: lib/screens/add_habit_screen.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:go_router/go_router.dart';
          import 'package:provider/provider.dart';

          import '../state/habits_model.dart';
          import '../validation.dart';

          class AddHabitScreen extends StatefulWidget {
            const AddHabitScreen({super.key});

            @override
            State<AddHabitScreen> createState() => _AddHabitScreenState();
          }

          class _AddHabitScreenState extends State<AddHabitScreen> {
            final _formKey = GlobalKey<FormState>();
            final _controller = TextEditingController();

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            Future<void> _save() async {
              if (!_formKey.currentState!.validate()) return;
              await context.read<HabitsModel>().add(_controller.text);
              if (mounted) context.pop();
            }

            @override
            Widget build(BuildContext context) {
              final names = context.read<HabitsModel>().habits.map((h) => h.name);
              return Scaffold(
                appBar: AppBar(title: const Text('New habit')),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Form(
                    key: _formKey,
                    child: Column(
                      children: [
                        TextFormField(
                          controller: _controller,
                          autofocus: true,
                          decoration: const InputDecoration(labelText: 'Name'),
                          textInputAction: TextInputAction.done,
                          validator: (value) => validateHabitName(value, existing: names),
                          onFieldSubmitted: (_) => _save(),
                        ),
                        const SizedBox(height: 16),
                        FilledButton(onPressed: _save, child: const Text('Save')),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
      - file: lib/router.dart
        lang: dart
        text: |
          import 'package:go_router/go_router.dart';

          import 'screens/add_habit_screen.dart';
          import 'screens/habit_screen.dart';
          import 'screens/home_screen.dart';

          final router = GoRouter(
            routes: [
              GoRoute(
                path: '/',
                builder: (context, state) => const HomeScreen(),
                routes: [
                  GoRoute(
                    path: 'add',
                    builder: (context, state) => const AddHabitScreen(),
                  ),
                  GoRoute(
                    path: 'habit/:id',
                    builder: (context, state) =>
                        HabitScreen(id: state.pathParameters['id']!),
                  ),
                ],
              ),
            ],
          );
    mistakes:
      - problem:
          en: "`_formKey.currentState!.validate()` crashes with a null error."
          tr: "`_formKey.currentState!.validate()` null hatasıyla çöküyor."
        fix:
          en: "The key must be given to the `Form` widget (`key: _formKey`). Create it once as a field of the State class, not inside `build`."
          tr: "Anahtar `Form` widget'ına verilmeli (`key: _formKey`). Onu `build` içinde değil, State sınıfının bir alanı olarak bir kez oluştur."
      - problem:
          en: "The linter warns \"Don't use 'BuildContext's across async gaps\"."
          tr: "Linter \"Don't use 'BuildContext's across async gaps\" uyarısı veriyor."
        fix:
          en: "After an `await` the screen may be gone. Check `if (mounted)` (or `context.mounted`) before using `context` again, as `_save` does."
          tr: "Bir `await`'ten sonra ekran gitmiş olabilir. `context`'i yeniden kullanmadan önce `_save`'in yaptığı gibi `if (mounted)` (ya da `context.mounted`) ile kontrol et."
    quiz:
      - q:
          en: "What must a `validator` return when the input is valid?"
          tr: "Girdi geçerliyse bir `validator` ne döndürmeli?"
        options:
          en:
            - "true"
            - "null"
            - "An empty string is the only valid answer"
          tr:
            - "true"
            - "null"
            - "Tek geçerli cevap boş metindir"
        answer: 1
        why:
          en: "A validator returns the error text to show, or null for no error."
          tr: "Validator, gösterilecek hata metnini ya da hata yoksa null döndürür."
    sources:
      - title: Build a form with validation
        url: https://docs.flutter.dev/cookbook/forms/validation
      - title: Form (API reference)
        url: https://api.flutter.dev/flutter/widgets/Form-class.html

  - id: persistence
    stage: data-api
    title:
      en: "Keep habits on the device with shared_preferences"
      tr: "shared_preferences ile alışkanlıkları cihazda saklama"
    minutes: 50
    needs: [forms]
    why:
      en: "Right now closing the app deletes everything. Small data like a list of habits can be saved as text on the device. `shared_preferences` does exactly this on Android, iOS and the web. Because the model only knows the `HabitStore` interface, we add a new store without touching the screens."
      tr: "Şu an uygulamayı kapatmak her şeyi siler. Alışkanlık listesi gibi küçük veriler cihazda metin olarak saklanabilir. `shared_preferences` bunu Android'de, iOS'ta ve webde yapar. Model sadece `HabitStore` arayüzünü bildiği için ekranlara dokunmadan yeni bir store ekliyoruz."
    learn:
      en: |
        - JSON: turning objects into text (`jsonEncode`) and back (`jsonDecode`)
        - `SharedPreferencesAsync`, the current API of the package: `setString` and `getString`
        - Why bad saved data must not crash the app (we return an empty list)
        - When to use something bigger: a database such as sqflite or drift (see the last step)
      tr: |
        - JSON: nesneleri metne çevirmek (`jsonEncode`) ve geri çevirmek (`jsonDecode`)
        - Paketin güncel API'si `SharedPreferencesAsync`: `setString` ve `getString`
        - Bozuk kayıtlı verinin neden uygulamayı çökertmemesi gerektiği (boş liste döndürürüz)
        - Daha büyüğünün ne zaman gerektiği: sqflite ya da drift gibi bir veritabanı (son adıma bak)
    do:
      en: |
        1. Add the package: `flutter pub add shared_preferences`.
        2. Create `lib/data/habit_codec.dart` (habits to text and back) and `lib/data/prefs_habit_store.dart` below.
        3. In `lib/main.dart` replace `MemoryHabitStore()` with `PrefsHabitStore()`.
        4. Run in Chrome with a fixed port: `flutter run -d chrome --web-port=5000`. Add a habit, tick it, press `R`, and it stays. On the web the data sits in the browser's local storage, which belongs to one address; a random port on each run would look like lost data.
        5. In the Chrome developer tools (F12) open *Application → Local Storage* and find the saved habits.
      tr: |
        1. Paketi ekle: `flutter pub add shared_preferences`.
        2. Aşağıdaki `lib/data/habit_codec.dart` (alışkanlıktan metne ve geri) ve `lib/data/prefs_habit_store.dart` dosyalarını oluştur.
        3. `lib/main.dart` içinde `MemoryHabitStore()` yerine `PrefsHabitStore()` yaz.
        4. Chrome'da sabit bir portla çalıştır: `flutter run -d chrome --web-port=5000`. Bir alışkanlık ekle, işaretle, `R`'ye bas; kalır. Webde veri tarayıcının local storage'ında durur ve o bir adrese aittir; her çalıştırmada rastgele port olsaydı veri kaybolmuş gibi görünürdü.
        5. Chrome geliştirici araçlarında (F12) *Application → Local Storage*'ı aç ve kayıtlı alışkanlıkları bul.
    code:
      - file: terminal
        lang: sh
        text: |
          flutter pub add shared_preferences
          flutter run -d chrome --web-port=5000
      - file: lib/data/habit_codec.dart
        lang: dart
        text: |
          import 'dart:convert';

          import '../models/habit.dart';

          String encodeHabits(List<Habit> habits) =>
              jsonEncode([for (final h in habits) h.toJson()]);

          /// Reads habits from saved text. Missing or damaged text gives an empty list
          /// instead of crashing the app.
          List<Habit> decodeHabits(String? text) {
            if (text == null || text.isEmpty) return [];
            try {
              final data = jsonDecode(text) as List<Object?>;
              return [for (final item in data) Habit.fromJson(item as Map<String, Object?>)];
            } on FormatException {
              return [];
            } on TypeError {
              return [];
            }
          }
      - file: lib/data/prefs_habit_store.dart
        lang: dart
        text: |
          import 'package:shared_preferences/shared_preferences.dart';

          import '../models/habit.dart';
          import 'habit_codec.dart';
          import 'habit_store.dart';

          class PrefsHabitStore implements HabitStore {
            PrefsHabitStore([SharedPreferencesAsync? prefs])
                : _prefs = prefs ?? SharedPreferencesAsync();

            static const _key = 'habits';
            final SharedPreferencesAsync _prefs;

            @override
            Future<List<Habit>> load() async => decodeHabits(await _prefs.getString(_key));

            @override
            Future<void> save(List<Habit> habits) =>
                _prefs.setString(_key, encodeHabits(habits));
          }
    mistakes:
      - problem:
          en: "Habits vanish on the web after every `flutter run`."
          tr: "Webde her `flutter run`'dan sonra alışkanlıklar kayboluyor."
        fix:
          en: "Local storage is tied to the address, and the port changes on each run. Use `--web-port=5000`."
          tr: "Local storage adrese bağlıdır ve port her çalıştırmada değişir. `--web-port=5000` kullan."
      - problem:
          en: "Keeping passwords or tokens in shared_preferences."
          tr: "Parolaları ya da token'ları shared_preferences içinde tutmak."
        fix:
          en: "It is plain text, and the package warns not to use it for critical data. Use secure storage for secrets (a later step)."
          tr: "Düz metindir ve paket kritik veriler için kullanılmamasını söyler. Sırlar için güvenli depolama kullan (sonraki bir adım)."
    quiz:
      - q:
          en: "What should `decodeHabits` do when the saved text is damaged?"
          tr: "Kayıtlı metin bozuksa `decodeHabits` ne yapmalı?"
        options:
          en:
            - "Crash, so the problem is noticed"
            - "Return an empty list so the app still starts"
            - "Delete the phone's storage"
          tr:
            - "Sorun fark edilsin diye çökmek"
            - "Uygulama yine de açılsın diye boş liste döndürmek"
            - "Telefonun depolamasını silmek"
        answer: 1
        why:
          en: "An app that cannot start because of one broken value is worse than an empty list."
          tr: "Tek bir bozuk değer yüzünden açılmayan uygulama, boş bir listeden kötüdür."
    sources:
      - title: shared_preferences package
        url: https://pub.dev/packages/shared_preferences
      - title: Store key-value data on disk
        url: https://docs.flutter.dev/cookbook/persistence/key-value
      - title: JSON and serialization
        url: https://docs.flutter.dev/data-and-backend/serialization/json

  - id: http
    stage: data-api
    title:
      en: "Load a daily quote from a web API"
      tr: "Bir web API'den günlük söz yükleme"
    minutes: 70
    needs: [persistence]
    why:
      en: "Most apps talk to a server. You send an HTTP request, wait for the answer and show it. Waiting can fail (no network, server error), so the screen needs three states: loading, success and failure."
      tr: "Çoğu uygulama bir sunucuyla konuşur. Bir HTTP isteği gönderir, cevabı bekler ve gösterirsin. Beklemek başarısız olabilir (ağ yok, sunucu hatası); bu yüzden ekranın üç durumu olmalı: yükleniyor, başarılı ve başarısız."
    learn:
      en: |
        - The `http` package: `Uri.https`, `client.get`, status codes
        - `Future`, `FutureBuilder` and its three states
        - Putting the network code in its own class (`QuoteClient`) with our own exception type
        - A timeout, so the app never waits forever
        - The Android release build needs the INTERNET permission, or every request fails
      tr: |
        - `http` paketi: `Uri.https`, `client.get`, durum kodları
        - `Future`, `FutureBuilder` ve üç durumu
        - Ağ kodunu kendi sınıfına (`QuoteClient`) ve kendi hata tipimize koymak
        - Uygulama sonsuza kadar beklemesin diye zaman aşımı (timeout)
        - Android release build'inin INTERNET iznine ihtiyacı var, yoksa her istek başarısız olur
    do:
      en: |
        1. Add the package: `flutter pub add http`.
        2. Create `lib/data/quote_client.dart` and `lib/widgets/quote_card.dart` below. We use the free public API `dummyjson.com/quotes/random`; it answers like `{"id":702,"quote":"...","author":"..."}` and allows requests from browsers.
        3. Provide the client in `lib/main.dart` with `MultiProvider`.
        4. Show the card at the top of the list in `lib/screens/home_screen.dart` (full file below). The screen now always shows a list: the quote card first, then an empty message or the habits.
        5. Run it. Turn off your Wi-Fi and press the retry button: you see the failure message instead of a crash.
        6. Open `android/app/src/main/AndroidManifest.xml` and add `<uses-permission android:name="android.permission.INTERNET"/>` as the first line inside `<manifest ...>`, above `<application`. Debug builds get this permission automatically, release builds do not.
      tr: |
        1. Paketi ekle: `flutter pub add http`.
        2. Aşağıdaki `lib/data/quote_client.dart` ve `lib/widgets/quote_card.dart` dosyalarını oluştur. Ücretsiz herkese açık `dummyjson.com/quotes/random` API'sini kullanıyoruz; `{"id":702,"quote":"...","author":"..."}` gibi cevap verir ve tarayıcılardan gelen isteklere izin verir.
        3. İstemciyi `lib/main.dart` içinde `MultiProvider` ile sağla.
        4. Kartı `lib/screens/home_screen.dart` içinde listenin başında göster (tam dosya aşağıda). Ekran artık hep bir liste gösterir: önce söz kartı, sonra boş mesajı ya da alışkanlıklar.
        5. Çalıştır. Wi-Fi'ı kapat ve tekrar dene düğmesine bas: çökme yerine hata mesajını görürsün.
        6. `android/app/src/main/AndroidManifest.xml` dosyasını aç ve `<manifest ...>` içinde, `<application`'ın üstüne ilk satır olarak `<uses-permission android:name="android.permission.INTERNET"/>` ekle. Debug build'ler bu izni otomatik alır, release build'ler almaz.
    code:
      - file: terminal
        lang: sh
        text: |
          flutter pub add http
      - file: lib/data/quote_client.dart
        lang: dart
        text: |
          import 'dart:convert';

          import 'package:http/http.dart' as http;

          class Quote {
            const Quote({required this.text, required this.author});

            final String text;
            final String author;
          }

          class QuoteException implements Exception {
            const QuoteException(this.message);
            final String message;

            @override
            String toString() => message;
          }

          class QuoteClient {
            QuoteClient(this._client);

            final http.Client _client;

            Future<Quote> fetch() async {
              final http.Response response;
              try {
                response = await _client
                    .get(Uri.https('dummyjson.com', '/quotes/random'))
                    .timeout(const Duration(seconds: 10));
              } on Exception {
                throw const QuoteException('Could not reach the quote service.');
              }
              if (response.statusCode != 200) {
                throw QuoteException('The quote service answered ${response.statusCode}.');
              }
              try {
                final json = jsonDecode(response.body) as Map<String, Object?>;
                return Quote(text: json['quote'] as String, author: json['author'] as String);
              } on FormatException {
                throw const QuoteException('The quote service sent something unexpected.');
              } on TypeError {
                throw const QuoteException('The quote service sent something unexpected.');
              }
            }

            void close() => _client.close();
          }
      - file: lib/widgets/quote_card.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';

          import '../data/quote_client.dart';

          class QuoteCard extends StatefulWidget {
            const QuoteCard({super.key});

            @override
            State<QuoteCard> createState() => _QuoteCardState();
          }

          class _QuoteCardState extends State<QuoteCard> {
            late Future<Quote> _quote;

            @override
            void initState() {
              super.initState();
              _quote = context.read<QuoteClient>().fetch();
            }

            void _retry() {
              setState(() {
                _quote = context.read<QuoteClient>().fetch();
              });
            }

            @override
            Widget build(BuildContext context) {
              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: FutureBuilder<Quote>(
                    future: _quote,
                    builder: (context, snapshot) {
                      if (snapshot.connectionState != ConnectionState.done) {
                        return const LinearProgressIndicator();
                      }
                      if (snapshot.hasError) {
                        final error = snapshot.error;
                        return Row(
                          children: [
                            Expanded(
                              child: Text(
                                error is QuoteException ? error.message : 'Something went wrong.',
                              ),
                            ),
                            IconButton(
                              onPressed: _retry,
                              icon: const Icon(Icons.refresh),
                              tooltip: 'Try again',
                            ),
                          ],
                        );
                      }
                      final quote = snapshot.requireData;
                      return Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text('"${quote.text}"'),
                          const SizedBox(height: 4),
                          Text(quote.author, style: Theme.of(context).textTheme.labelMedium),
                        ],
                      );
                    },
                  ),
                ),
              );
            }
          }
      - file: lib/main.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:provider/provider.dart';

          import 'data/prefs_habit_store.dart';
          import 'data/quote_client.dart';
          import 'router.dart';
          import 'state/habits_model.dart';

          void main() {
            runApp(
              MultiProvider(
                providers: [
                  ChangeNotifierProvider(
                    create: (_) => HabitsModel(PrefsHabitStore())..load(),
                  ),
                  Provider(
                    create: (_) => QuoteClient(http.Client()),
                    dispose: (_, client) => client.close(),
                  ),
                ],
                child: const HabitApp(),
              ),
            );
          }

          class HabitApp extends StatelessWidget {
            const HabitApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp.router(
                title: 'Habit Tracker',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal),
                ),
                routerConfig: router,
              );
            }
          }
      - file: lib/screens/home_screen.dart
        lang: dart
        text: |
          import 'package:flutter/material.dart';
          import 'package:go_router/go_router.dart';
          import 'package:provider/provider.dart';

          import '../state/habits_model.dart';
          import '../widgets/habit_tile.dart';
          import '../widgets/quote_card.dart';

          class HomeScreen extends StatelessWidget {
            const HomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Habits')),
                body: Consumer<HabitsModel>(
                  builder: (context, model, _) {
                    if (!model.loaded) {
                      return const Center(child: CircularProgressIndicator());
                    }
                    return ListView(
                      padding: const EdgeInsets.all(16),
                      children: [
                        const QuoteCard(),
                        const SizedBox(height: 8),
                        if (model.habits.isEmpty)
                          const Padding(
                            padding: EdgeInsets.all(24),
                            child: Text('No habits yet. Tap + to add your first one.'),
                          ),
                        for (final habit in model.habits)
                          HabitTile(
                            habit: habit,
                            today: model.today,
                            onToggle: () => model.toggle(habit.id),
                            onTap: () => context.go('/habit/${habit.id}'),
                          ),
                      ],
                    );
                  },
                ),
                floatingActionButton: FloatingActionButton(
                  onPressed: () => context.go('/add'),
                  tooltip: 'Add habit',
                  child: const Icon(Icons.add),
                ),
              );
            }
          }
    mistakes:
      - problem:
          en: "The quote works with `flutter run` but the installed release app shows \"Could not reach the quote service\"."
          tr: "Söz `flutter run` ile çalışıyor ama kurulu release uygulaması \"Could not reach the quote service\" gösteriyor."
        fix:
          en: "The release Android manifest has no INTERNET permission. Add the `<uses-permission android:name=\"android.permission.INTERNET\"/>` line (step 6) and build again."
          tr: "Release Android manifest'inde INTERNET izni yok. `<uses-permission android:name=\"android.permission.INTERNET\"/>` satırını ekle (6. adım) ve yeniden build et."
      - problem:
          en: "Calling `fetch()` inside `build`, so a new request starts on every redraw."
          tr: "`fetch()`'i `build` içinde çağırmak; böylece her yeniden çizimde yeni bir istek başlar."
        fix:
          en: "Start the request once (in `initState`) and keep the `Future` in a field, as `QuoteCard` does."
          tr: "İsteği bir kez başlat (`initState` içinde) ve `Future`'ı `QuoteCard`'ın yaptığı gibi bir alanda tut."
      - problem:
          en: "Trusting the answer and casting it blindly, so a changed API crashes the app."
          tr: "Cevaba güvenip körü körüne dönüştürmek; API değişince uygulama çöker."
        fix:
          en: "Wrap parsing in try/catch and turn problems into your own exception, so the screen can show a friendly message."
          tr: "Ayrıştırmayı try/catch içine al ve sorunları kendi exception'ına çevir; ekran dostça bir mesaj gösterebilsin."
    quiz:
      - q:
          en: "Why do we keep the Future in a field instead of calling `fetch()` in `build`?"
          tr: "`fetch()`'i `build` içinde çağırmak yerine Future'ı neden bir alanda tutuyoruz?"
        options:
          en:
            - "build can run many times and each run would send a new request"
            - "Futures cannot be created in build for security reasons"
            - "It makes the quote shorter"
          tr:
            - "build çok kez çalışabilir ve her çalışma yeni bir istek gönderirdi"
            - "Güvenlik nedeniyle build içinde Future oluşturulamaz"
            - "Sözü kısaltır"
        answer: 0
        why:
          en: "Flutter may call build at any time, for example on every animation frame or resize."
          tr: "Flutter build'i her an çağırabilir; örneğin her animasyon karesinde ya da yeniden boyutlandırmada."
